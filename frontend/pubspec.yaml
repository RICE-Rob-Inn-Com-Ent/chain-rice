name: rice_bot_ui
description: "High-performance frontend for the Immortal System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0' # Wersja Darta na 2026
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  # Stan i reaktywność (następca Providera)
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  # Komunikacja (Protobuf/JSON)
  dio: ^5.7.0
  # Szybki storage lokalny (lepszy niż Hive/SQLite)
  isar: ^4.0.0
  isar_flutter_libs: ^4.0.0
  # Optymalizacja UI
  flutter_hooks: ^0.21.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Generatory kodu (konieczne w 2026 dla wydajności)
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0
  isar_generator: ^4.0.0
  # Lintery
  flutter_lints: ^5.0.0

