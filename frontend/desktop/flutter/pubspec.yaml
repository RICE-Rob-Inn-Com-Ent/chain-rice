name: rice_flutter
description: Rice Framework - Flutter Layer: Mobile & Desktop Applications
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  riverpod: ^2.4.0
  
  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local storage
  shared_preferences: ^2.2.0
  
  # UI
  flutter_riverpod: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
