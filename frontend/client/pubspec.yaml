name: client
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  posthog_flutter: ^4.3.0
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  battery_plus: ^6.0.3
  flutter_local_notifications: ^18.0.1
  app_links: ^6.4.0
  flutter_foreground_task: ^8.15.1

  model:
    path: ../model
  rule:
    path: ../rule
  browser:
    path: ../browser
  content:
    path: ../content
  lang:
    path: ../lang

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
