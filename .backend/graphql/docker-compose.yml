services:
  graphql:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphql:latest
    container_name: rice-graphql
    ports:
      - "4000:4000"
    environment:
      - GRAPHQL_PORT=4000
      - LOG_LEVEL=info
    restart: unless-stopped

networks:
  default:
    name: rice-backend
    driver: bridge
