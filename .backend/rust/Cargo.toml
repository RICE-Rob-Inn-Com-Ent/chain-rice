[package]
name = "mwt_token"
version = "0.1.0"
edition = "2021"
authors = ["ChainRice Team <info@chainrice.com>"]
description = "MWT Token Smart Contract for ChainRice blockchain"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CosmWasm core dependencies
cosmwasm-std = "1.5.0"
cosmwasm-storage = "1.5.0"
cosmwasm-schema = "1.5.0"

# CosmWasm utilities
cw2 = "0.11.0"
cw-storage-plus = "0.11.1"
cw-utils = "0.11.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8.12"

# Error handling
thiserror = "1.0"

# Math and utilities
uint = "0.9"

[dev-dependencies]
cosmwasm-schema-test-derive = "1.5.0"
