# Rice Backend - Root Orchestration
# All backend services: data, bot, graphql

services:
  # ========================================
  # DATA LAYER (MongoDB + PostgreSQL + Go Service)
  # ========================================

  mongodb:
    image: mongo:7
    container_name: rice-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=rice
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - rice-data
      - rice-backend

  postgres:
    image: postgres:16-alpine
    container_name: rice-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rice
      POSTGRES_USER: rice
      POSTGRES_PASSWORD: rice123  # pragma: allowlist secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rice"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - rice-data
      - rice-backend

  data:
    build:
      context: ./data
      dockerfile: Dockerfile
    image: data:latest
    container_name: rice-data
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://rice-mongodb:27017/rice
      - POSTGRES_URL=postgres://rice:rice123@rice-postgres:5432/rice?sslmode=disable
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - rice-data
      - rice-backend

  # ========================================
  # BOT LAYER (Core + Integrations + Ollama)
  # ========================================

  bot-core:
    build:
      context: ./bot/core
      dockerfile: Dockerfile
    image: core:latest
    container_name: bot-core
    ports:
      - "8100:8100"
    environment:
      - BOT_MODE=core
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - bot-network
      - rice-backend

  bot-integrations:
    build:
      context: ./bot/in
      dockerfile: Dockerfile
    image: in:latest
    container_name: bot-integrations
    ports:
      - "8200:8200"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - PYTHONUNBUFFERED=1
    env_file:
      - ./bot/in/.env
    restart: unless-stopped
    networks:
      - bot-network
      - rice-backend

  bot-ollama:
    build:
      context: ./bot/ollama
      dockerfile: Dockerfile
    image: ollama:latest
    container_name: bot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - bot-network
      - rice-backend

  # ========================================
  # API LAYER (GraphQL Gateway)
  # ========================================

  graphql:
    build:
      context: ./graphql
      dockerfile: Dockerfile
    image: graphql:latest
    container_name: rice-graphql
    ports:
      - "4000:4000"
    depends_on:
      - data
    environment:
      - GRAPHQL_PORT=4000
      - LOG_LEVEL=info
      - DATA_SERVICE_URL=http://rice-data:8080
    restart: unless-stopped
    networks:
      - rice-backend

# ========================================
# VOLUMES
# ========================================

volumes:
  mongo-data:
    driver: local
  postgres-data:
    driver: local
  ollama-models:
    driver: local

# ========================================
# NETWORKS
# ========================================

networks:
  rice-backend:
    driver: bridge
    name: rice-backend
  bot-network:
    driver: bridge
    name: bot-network
  rice-data:
    driver: bridge
    name: rice-data
