services:
  mongodb:
    image: mongo:7
    container_name: rice-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=rice
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rice-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rice
      POSTGRES_USER: rice
      POSTGRES_PASSWORD: rice123  # pragma: allowlist secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rice"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  data:
    build:
      context: .
      dockerfile: Dockerfile
    image: data:latest
    container_name: rice-data
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://rice-mongodb:27017/rice
      - POSTGRES_URL=postgres://rice:rice123@rice-postgres:5432/rice?sslmode=disable
      - LOG_LEVEL=info
    restart: unless-stopped

volumes:
  mongo-data:
    driver: local
  postgres-data:
    driver: local

networks:
  default:
    name: rice-data
    driver: bridge
