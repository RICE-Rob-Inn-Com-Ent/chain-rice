services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    image: ollama:latest
    container_name: bot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama-models:
    driver: local

networks:
  default:
    name: bot-network
    driver: bridge
