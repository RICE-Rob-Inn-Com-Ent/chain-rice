# ==============================================================================
# YARN CONFIGURATION - Rice Monorepo (Yarn 3+)
# ==============================================================================
# Modern Yarn configuration for high-performance package management
# ==============================================================================
## Using Corepack-provided Yarn; project-local yarnPath disabled
# yarnPath: .yarn/releases/yarn-3.6.4.cjs

# ============================================================================
# NODE SETTINGS
# ============================================================================
nodeLinker: node-modules

# ============================================================================
# PACKAGE EXTENSIONS
# ============================================================================
packageExtensions: {}

# ============================================================================
# PERFORMANCE
# ============================================================================
enableGlobalCache: true
compressionLevel: mixed
enableTelemetry: false
enableInlineBuilds: true
enableProgressBars: true
enableTimers: true

# ============================================================================
# NETWORK
# ============================================================================
httpTimeout: 60000
httpRetry: 3
networkConcurrency: 50

# ============================================================================
# CACHE
# ============================================================================
cacheFolder: .yarn/cache
installStatePath: .yarn/install-state.gz

# ============================================================================
# PLUGINS
# ============================================================================
# plugins: []

# ============================================================================
# WORKSPACES
# ============================================================================
nmHoistingLimits: workspaces
nmMode: hardlinks-local
enableImmutableCache: false

# ============================================================================
# SECURITY
# ============================================================================
enableStrictSsl: true
preferInteractive: false

# ============================================================================
# LOGGING
# ============================================================================
logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0006
    level: discard
  - code: YN0005
    level: discard

# ============================================================================
# MISC
# ============================================================================
enableImmutableInstalls: false
preferDeferredVersions: false
enableScripts: true
enableInlineHunks: false
