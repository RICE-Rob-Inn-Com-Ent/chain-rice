# Haskell workspace root (jak base/Cargo.toml). hpack czyta ten plik w base/;
# wygenerowany clerk-calc.cabal ląduje w base/calc/ (obok lib/) — just _hpack-clerk.
#
# dependencies jako mapa (jak npm package.json) — wtedy schema „package.yaml” w IDE nie krzyczy;
# hpack traktuje listę i mapę równoważnie (README hpack).

name: calc
version: 0.1.0
synopsis: RICE financial kernel — Decimal money, hledger-backed ledger, interest, tax, QuickCheck laws
license: AGPL-3.0-only
author: Code-Rice
maintainer: infocoderice@gmail.com
copyright: (c) 2026 Code-Rice
github: RICE-Rob-Inn-Com-Ent/rice

language: GHC2024

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -O2

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - LambdaCase
  - TupleSections

dependencies:
  base: ">= 4.18 && < 5"
  scientific: ">= 0.3"
  Decimal: ">= 0.5"
  hledger-lib: ">= 1.34"
  QuickCheck: ">= 2.15"
  text: ">= 2.1"
  bytestring: ">= 0.12"
  containers: ">= 0.7"
  aeson: ">= 2.2"
  time: ">= 1.12"

# foreign-library rice_calc_ffi is maintained in base/calc/calc.cabal (not generated here).

library:
  source-dirs: calc/lib
  exposed-modules:
    - Lib
    - Decimal
    - Finance
    - Ledger
    - Risk
    - FFI
    - Wire
    - Verify

tests:
  calc-test:
    main: LogicSpec.hs
    source-dirs: calc/test
    other-modules:
      - AuditSpec
      - FuzzSpec
    dependencies:
      calc: {}
      bytestring: ">= 0.12"
      hspec: ">= 2.11"
      QuickCheck: ">= 2.15"
