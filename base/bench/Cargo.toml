[package]
name = "bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "RICE criterion benchmarks — integration across contract, ZK, compiler, policies"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
util = { path = "../util", default-features = false }
contract = { path = "../contract" }
private = { path = "../private" }
mint = { path = "../mint" }
policies = { path = "../policies" }
criterion.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[features]
default = []
bench-pq = ["contract/post-quantum"]
calc-parity = ["policies/calc-bridge", "util/calc-bridge"]
calc-bench = ["util/calc-bridge"]
zig-security-bench = ["util/zig-warden"]
full-native-benches = ["util/calc-bridge", "util/zig-warden", "policies/calc-bridge"]
