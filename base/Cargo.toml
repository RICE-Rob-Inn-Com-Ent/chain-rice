[workspace]
members = ["contract", "policies", "private", "mint", "bench", "util"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Code-Rice"]
license = "AGPL-3.0-only"
repository = "https://github.com/RICE-Rob-Inn-Com-Ent/rice"

[workspace.dependencies]
# ── CORE & UTIL ─────────────────────────────────────────────────────────────
thiserror = "2.0"
libloading = "0.8"
libc = "0.2"
proptest = "1.6"
prost = { version = "0.13", default-features = false, features = ["std", "derive"] }
bytes = "1.10"
hex = { version = "0.4", features = ["serde"] }
constant_time_eq = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
rayon = "1.10"

# ── CONTRACTS (CosmWasm & logic) ───────────────────────────────────────────
cosmwasm-std = "2.2"
cosmwasm-schema = "2.2"
cw-storage-plus = "2.0"
cw2 = "2.0"
cw-multi-test = "2.2"
sylvia = "1.3"
rust_decimal = { version = "1.36", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
getrandom = { version = "0.2", features = ["custom"] }

# ── CRYPTO & SECURITY ───────────────────────────────────────────────────────
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
k256 = "0.13"
pqcrypto = { version = "0.17", default-features = false, features = [
    "pqcrypto-dilithium",
    "pqcrypto-falcon",
] }

# ── POLICIES (CEL & messaging) ──────────────────────────────────────────────
cel-interpreter = { version = "0.9", features = ["json"] }
cel-parser = "0.8.1"
fefix = "0.7"
quick-xml = { version = "0.37", features = ["serialize"] }
iso_currency = { version = "0.4", features = ["with-serde"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1.1", features = ["serde"] }
nats = "0.24"

# ── PRIVATE (ZK layer) ─────────────────────────────────────────────────────
memmap2 = "0.9"
ark-groth16 = { version = "0.4", features = ["r1cs", "parallel"] }
ark-bn254 = { version = "0.4", features = ["curve"] }
ark-bls12-381 = { version = "0.4", features = ["curve"] }
ark-ff = { version = "0.4", features = ["std", "parallel"] }
ark-ec = { version = "0.4", features = ["std", "parallel"] }
ark-serialize = { version = "0.4", features = ["derive", "std"] }
ark-std = { version = "0.4", features = ["std"] }
ark-relations = { version = "0.4", features = ["std"] }
ark-r1cs-std = { version = "0.4", default-features = false, features = [
    "std",
    "parallel",
] }
ark-snark = "0.4"
ark-crypto-primitives = { version = "0.4", default-features = false, features = [
    "snark",
    "r1cs",
    "std",
    "parallel",
    "merkle_tree",
    "crh",
    "commitment",
    "sponge",
    "encryption",
    "signature",
    "prf",
] }

# ── MINT (language & LSP) ────────────────────────────────────────────────────
logos = "0.15"
chumsky = "0.10"
rowan = "0.16"
salsa = "0.19"
miette = { version = "7.4", features = ["fancy"] }
minijinja = "2.5"
tower-lsp = "0.20"
petgraph = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }
async-trait = "0.1"

# ── BENCHMARKING ─────────────────────────────────────────────────────────────
criterion = { version = "0.5", features = ["html_reports"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rand = { version = "0.8", features = ["std_rng"] }
