[package]
name = "util"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Near-metal utilities, FFI bridges, and byte manipulation"
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["test-utils"]
# Proptest strategies (`prop`); use `default-features = false` on `util` for a slimmer dependency graph.
test-utils = ["dep:proptest"]
# Native-only: dlopen @libHS…@ / @libcalc_ffi.so@ from @cabal build foreign-library:calc_ffi@.
calc-bridge = ["dep:libloading", "dep:libc", "dep:serde", "dep:serde_json"]
# Links `base/zig-out/lib/libclerk-security.a` (run `zig build` in `base/`). Combine with `calc-bridge` for CALC hooks. See `base/ZIG_WARDEN.md`.
zig-warden = []

[dependencies]
thiserror.workspace = true
prost.workspace = true
bytes.workspace = true
hex.workspace = true
constant_time_eq.workspace = true
proptest = { workspace = true, optional = true }
tracing.workspace = true
libloading = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
