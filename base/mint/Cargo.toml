[package]
name = "mint"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiler — lexer, parser, rowan CST, salsa queries, LSP"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rice-lsp"
path = "src/bin/rice_lsp.rs"

[[bin]]
name = "mint_overlay_check"
path = "src/bin/mint_overlay_check.rs"

[[bin]]
name = "mint_prepare"
path = "src/bin/mint_prepare.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
logos.workspace = true
chumsky.workspace = true
rowan.workspace = true
salsa.workspace = true
miette.workspace = true
minijinja.workspace = true
tower-lsp.workspace = true
petgraph.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true

[features]
default = []
# `rice-lsp`: refresh `base/` smoke timings (subprocess `bench --json-smoke`). Build: `cargo build -p mint --bin rice-lsp --features lsp-perf`.
lsp-perf = []
