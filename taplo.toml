# taplo.toml
# Generated by: cue export infra/configs/taplo.cue
# Do not edit manually — edit infra/configs/taplo.cue instead

include = ["**/*.toml"]

exclude = [
    "buck-out/**",
    ".buck-cache/**",
    ".pixi/**",
    "node_modules/**",
    "__pycache__/**",
    "target/**",
    "_build/**",
    "deps/**",
    ".venv/**",
    "dist/**",
    "build/**",
]

[formatting]
indent_string         = "  "    # 2 spaces — matches .editorconfig
indent_tables         = true
trailing_newline      = true
reorder_keys          = false   # per-rule below — not globally
reorder_arrays        = false
compact_arrays        = false
compact_inline_tables = false
align_entries         = true    # align = signs in sections
align_comments        = true    # align inline comments
array_trailing_comma  = true    # trailing comma in arrays
allowed_blank_lines   = 1
column_width          = 120     # your preference
crlf                  = false

[schema]
enabled = true

[[schema.associations]]
path = "**/Cargo.toml"
url  = "https://json.schemastore.org/cargo.json"

[[schema.associations]]
path = "**/pixi.toml"
url  = "https://pixi.sh/schema/manifest/schema.json"

[[schema.associations]]
path = "**/cliff.toml"
url  = "https://json.schemastore.org/cliff.json"

[[schema.associations]]
path = "**/.taplo.toml"
url  = "https://taplo.tamasfe.dev/configuration_file.json"

[[schema.associations]]
path = "**/lefthook.yml"
url  = "https://json.schemastore.org/lefthook.json"

# ── per-file rules ────────────────────────────────────────

[[rule]]
# Cargo.toml — reorder deps alphabetically
include = ["**/Cargo.toml"]
keys    = ["dependencies", "dev-dependencies", "build-dependencies"]
[rule.formatting]
reorder_keys = true

[[rule]]
# pyproject.toml — preserve dep order (uv manages it)
include = ["**/pyproject.toml"]
keys    = ["tool.uv.dependencies", "tool.uv.dev-dependencies"]
[rule.formatting]
reorder_keys = false

[[rule]]
# pixi.toml — preserve dep order (pixi manages it)
include = ["**/pixi.toml"]
keys    = ["dependencies", "host-dependencies", "build-dependencies"]
[rule.formatting]
reorder_keys = false

[[rule]]
# lock files — never format, preserve exactly
include    = ["**/Cargo.lock", "**/pixi.lock", "**/mix.lock"]
formatting = false






