[project]
name = "sage-job"
version = "0.1.0"
description = "SAGE job — Polars, NumPy, SciPy, Mojo kernels"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Code-Rice", email = "infocoderice@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "polars>=1.5.0",
  "scipy>=1.15.0",
  "numpy>=2.2.0",
  "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
