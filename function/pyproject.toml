[project]
name = "sage"
version = "0.1.0"
description = "Quantum, DataScience & AI System"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Code-Rice", email = "infocoderice@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "sage-agent",
  "sage-helper",
  "sage-job",
  "sage-simulation",
  "sage-vector",
  "sage-bench",
]

[tool.uv.sources]
sage-agent = { workspace = true }
sage-helper = { workspace = true }
sage-job = { workspace = true }
sage-simulation = { workspace = true }
sage-vector = { workspace = true }
sage-bench = { workspace = true }

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = ["agent", "helper", "job", "simulation", "vector", "bench"]

[tool.ruff]
line-length = 100
target-version = "py313"
show-fixes = true
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "C4", "PT", "RUF", "ASYNC"]
ignore = ["D"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingTypeStubs = false
files = [
  "agent/src/**/*.py",
  "helper/src/**/*.py",
  "job/src/**/*.py",
  "simulation/src/**/*.py",
  "vector/src/**/*.py",
  "bench/src/**/*.py",
]
exclude = ["**/test/", "**/__pycache__/"]
