[project]
name = "sage-helper"
version = "0.1.0"
description = "SAGE helper — settings, schemas, validation, retry, logs"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Code-Rice", email = "infocoderice@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10.0",
  "pydantic-settings>=2.0.0",
  "loguru>=0.7.0",
  "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
