[project]
name = "vector"
version = "0.1.0"
description = "Vector — Qdrant, BM25S, Torch embeddings, RAG"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Code-Rice", email = "infocoderice@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "torch>=2.6.0",
  "qdrant-client>=1.13.0",
  "bm25s>=0.2.0",
  "numpy>=2.2.0",
  "pydantic>=2.10.0",
  "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
