[project]
name = "sage-simulation"
version = "0.1.0"
description = "SAGE simulation — Qiskit, PennyLane, JAX"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Code-Rice", email = "infocoderice@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "qiskit>=1.4.0",
  "qiskit-aer>=0.16.0",
  "pennylane>=0.40.0",
  "jax[cuda12]>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
