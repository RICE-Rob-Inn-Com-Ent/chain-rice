[tool.poetry]
name = "connection-fastapi"
version = "0.1.0"
description = "FastAPI bridge for integration with Go, Flask, Django servers"
authors = ["Code-Rice <infocoderice@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
httpx = "^0.27.0"
grpcio = "^1.66.0"
protobuf = "^5.28.0"
pydantic = "^2.9.0"
msgpack = "^1.1.0"
websockets = "^13.0.0"
python-socketio = "^5.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
black = "^24.10.0"
isort = "^5.13.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
