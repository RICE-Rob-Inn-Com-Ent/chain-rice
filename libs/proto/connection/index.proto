import "integrations/edi/services/edi_partner_service.proto";
import "integrations/edi/services/edi_reporting_service.proto";

// External API Services  
import "integrations/external_apis/services/api_gateway_service.proto";

// Webhook Services
import "integrations/webhooks/services/webhook_subscription_service.proto";
import "integrations/webhooks/services/webhook_delivery_service.proto";
import "integrations/webhooks/services/webhook_monitoring_service.proto";

// Re-export commonly used types for easier access
import "integrations/edi/enums/edi_document_type.proto";
import "integrations/edi/enums/edi_status.proto";
import "integrations/edi/enums/edi_partner_type.proto";
import "integrations/external_apis/enums/api_provider_type.proto";
