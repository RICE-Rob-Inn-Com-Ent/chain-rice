syntax = "proto3";

package integrations.webhooks.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "integrations/webhooks/enums/webhook_event_type.proto";
import "integrations/webhooks/enums/webhook_status.proto";
import "integrations/webhooks/enums/webhook_retry_policy.proto";

option go_package = "github.com/rice-dev/integrations/webhooks/messages";

// Webhook Subscription represents a webhook endpoint configuration
message WebhookSubscription {
  // Unique subscription identifier
  string subscription_id = 1;
  
  // Subscription basic information
  WebhookSubscriptionBasicInfo basic_info = 2;
  
  // Subscription configuration
  WebhookSubscriptionConfiguration configuration = 3;
  
  // Endpoint configuration
  WebhookEndpoint endpoint = 4;
  
  // Security configuration
  WebhookSecurity security = 5;
  
  // Event filtering
  WebhookEventFilter event_filter = 6;
  
  // Retry configuration
  WebhookRetryConfiguration retry_config = 7;
  
  // Subscription status
  integrations.webhooks.enums.WebhookStatus status = 8;
  
  // Subscription metadata
  WebhookSubscriptionMetadata metadata = 9;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp last_activity_at = 12;
}

// Subscription basic information
message WebhookSubscriptionBasicInfo {
  string subscription_name = 1;
  string description = 2;
  string owner = 3;
  string application_id = 4;
  string environment = 5; // PRODUCTION, STAGING, DEVELOPMENT, TEST
  
  // Contact information
  WebhookContactInfo contact = 6;
  
  // Subscription categorization
  repeated string tags = 7;
  string category = 8; // BUSINESS, TECHNICAL, MONITORING, ALERTING
  string priority = 9; // LOW, NORMAL, HIGH, CRITICAL
  
  // Additional metadata
  map<string, string> custom_fields = 10;
}

// Contact information
message WebhookContactInfo {
  string primary_contact = 1;
  string primary_email = 2;
  string primary_phone = 3;
  string technical_contact = 4;
  string technical_email = 5;
  string technical_phone = 6;
  string escalation_contact = 7;
  string escalation_email = 8;
  string escalation_phone = 9;
  repeated string notification_emails = 10;
}

// Subscription configuration
message WebhookSubscriptionConfiguration {
  // Event configuration
  repeated integrations.webhooks.enums.WebhookEventType event_types = 1;
  repeated string custom_event_types = 2;
  bool include_all_events = 3;
  
  // Delivery configuration
  string delivery_method = 4; // HTTP_POST, HTTP_PUT, GRPC, MESSAGE_QUEUE
  string content_type = 5; // JSON, XML, FORM, BINARY
  string encoding = 6; // UTF-8, ASCII, BASE64
  
  // Request configuration
  map<string, string> default_headers = 7;
  map<string, string> default_parameters = 8;
  int32 timeout_seconds = 9;
  int32 connection_timeout_seconds = 10;
  int32 read_timeout_seconds = 11;
  
  // Response configuration
  bool require_acknowledgment = 12;
  int32 acknowledgment_timeout_seconds = 13;
  repeated int32 expected_status_codes = 14;
  string expected_response_format = 15;
  
  // Processing configuration
  bool enable_compression = 16;
  bool enable_encryption = 17;
  bool validate_payload = 18;
  string payload_schema = 19; // JSON Schema or similar
  
  // Custom configuration
  map<string, string> custom_config = 20;
}

// Webhook endpoint
message WebhookEndpoint {
  string endpoint_id = 1;
  string endpoint_name = 2;
  string url = 3;
  string method = 4; // POST, PUT, PATCH, GET
  int32 port = 5;
  string path = 6;
  string protocol = 7; // HTTP, HTTPS, GRPC, WS, WSS
  
  // Endpoint configuration
  bool is_active = 8;
  int32 priority = 9;
  string description = 10;
  
  // Authentication
  WebhookEndpointAuth auth = 11;
  
  // Headers
  repeated WebhookHeader headers = 12;
  
  // Parameters
  repeated WebhookParameter parameters = 13;
  
  // Health check
  WebhookHealthCheck health_check = 14;
  
  // Load balancing
  WebhookLoadBalancing load_balancing = 15;
  
  // Failover
  WebhookFailover failover = 16;
}

// Webhook endpoint authentication
message WebhookEndpointAuth {
  string auth_type = 1; // NONE, BASIC, BEARER, API_KEY, OAUTH2, HMAC, CUSTOM
  string username = 2;
  string password = 3; // Usually encrypted
  string bearer_token = 4; // Usually encrypted
  string api_key = 5; // Usually encrypted
  string api_key_header = 6;
  string api_key_query_param = 7;
  string hmac_secret = 8; // Usually encrypted
  string hmac_algorithm = 9; // SHA256, SHA1, MD5
  string custom_auth_header = 10;
  string custom_auth_value = 11;
  map<string, string> oauth2_config = 12;
}

// Webhook header
message WebhookHeader {
  string name = 1;
  string value = 2;
  bool required = 3;
  string description = 4;
  bool is_sensitive = 5; // For logging purposes
}

// Webhook parameter
message WebhookParameter {
  string name = 1;
  string value = 2;
  string type = 3; // STRING, INTEGER, BOOLEAN, ARRAY, OBJECT
  bool required = 4;
  string description = 5;
  bool is_sensitive = 6; // For logging purposes
}

// Webhook health check
message WebhookHealthCheck {
  bool enabled = 1;
  string health_check_url = 2;
  int32 interval_seconds = 3;
  int32 timeout_seconds = 4;
  int32 failure_threshold = 5;
  int32 success_threshold = 6;
  repeated int32 expected_status_codes = 7;
  string expected_response = 8;
  map<string, string> health_check_headers = 9;
}

// Webhook load balancing
message WebhookLoadBalancing {
  bool enabled = 1;
  string strategy = 2; // ROUND_ROBIN, LEAST_CONNECTIONS, RANDOM, WEIGHTED
  map<string, int32> endpoint_weights = 3;
  int32 max_connections = 4;
  int32 connection_timeout_seconds = 5;
}

// Webhook failover
message WebhookFailover {
  bool enabled = 1;
  repeated string failover_endpoints = 2;
  int32 max_failover_attempts = 3;
  int32 failover_timeout_seconds = 4;
  string failover_strategy = 5; // IMMEDIATE, DELAYED, SCHEDULED
}

// Webhook security
message WebhookSecurity {
  // SSL/TLS configuration
  bool require_ssl = 1;
  string ssl_version = 2;
  bool verify_ssl_certificate = 3;
  bool verify_hostname = 4;
  repeated string allowed_ciphers = 5;
  
  // IP restrictions
  repeated string allowed_ips = 6;
  repeated string blocked_ips = 7;
  
  // Request signing
  bool require_request_signing = 8;
  string signing_algorithm = 9;
  string signing_key = 10; // Usually encrypted
  string signature_header = 11;
  
  // Encryption
  bool require_encryption = 12;
  string encryption_algorithm = 13;
  string encryption_key = 14; // Usually encrypted
  
  // Security headers
  map<string, string> security_headers = 15;
  
  // CORS configuration
  WebhookCorsConfig cors = 16;
  
  // Rate limiting
  WebhookRateLimit rate_limit = 17;
}

// Webhook CORS configuration
message WebhookCorsConfig {
  repeated string allowed_origins = 1;
  repeated string allowed_methods = 2;
  repeated string allowed_headers = 3;
  repeated string exposed_headers = 4;
  bool allow_credentials = 5;
  int32 max_age_seconds = 6;
}

// Webhook rate limit
message WebhookRateLimit {
  bool enabled = 1;
  int32 requests_per_minute = 2;
  int32 requests_per_hour = 3;
  int32 requests_per_day = 4;
  int32 burst_limit = 5;
  string rate_limit_strategy = 6; // FIXED_WINDOW, SLIDING_WINDOW, TOKEN_BUCKET
  bool respect_retry_after = 7;
  int32 max_retry_delay_seconds = 8;
}

// Webhook event filter
message WebhookEventFilter {
  // Event type filtering
  repeated integrations.webhooks.enums.WebhookEventType event_types = 1;
  repeated string custom_event_types = 2;
  repeated string excluded_event_types = 3;
  
  // Event source filtering
  repeated string event_sources = 4;
  repeated string excluded_event_sources = 5;
  
  // Event content filtering
  repeated WebhookContentFilter content_filters = 6;
  repeated WebhookConditionalFilter conditional_filters = 7;
  
  // Event priority filtering
  repeated string event_priorities = 8;
  repeated string excluded_event_priorities = 9;
  
  // Event category filtering
  repeated string event_categories = 10;
  repeated string excluded_event_categories = 11;
  
  // Custom filtering
  map<string, string> custom_filters = 12;
  repeated string filter_expressions = 13;
}

// Webhook content filter
message WebhookContentFilter {
  string field_path = 1;
  string operator = 2; // EQUALS, NOT_EQUALS, CONTAINS, NOT_CONTAINS, GREATER_THAN, LESS_THAN, REGEX
  string value = 3;
  string data_type = 4; // STRING, INTEGER, BOOLEAN, ARRAY, OBJECT
  bool case_sensitive = 5;
}

// Webhook conditional filter
message WebhookConditionalFilter {
  string condition_name = 1;
  string condition_expression = 2;
  repeated WebhookContentFilter conditions = 3;
  string logical_operator = 4; // AND, OR, NOT
  bool is_active = 5;
}

// Webhook retry configuration
message WebhookRetryConfiguration {
  // Retry policy
  integrations.webhooks.enums.WebhookRetryPolicy retry_policy = 1;
  
  // Retry limits
  int32 max_retries = 2;
  int32 max_retry_delay_seconds = 3;
  int32 min_retry_delay_seconds = 4;
  
  // Retry timing
  int32 retry_delay_seconds = 5;
  double backoff_multiplier = 6;
  string retry_strategy = 7; // FIXED, EXPONENTIAL, LINEAR, CUSTOM
  
  // Retry conditions
  repeated int32 retry_status_codes = 8;
  repeated string retry_error_types = 9;
  repeated string retry_conditions = 10;
  
  // Retry behavior
  bool respect_retry_after_header = 11;
  bool enable_jitter = 12;
  double jitter_factor = 13;
  
  // Retry monitoring
  bool enable_retry_monitoring = 14;
  repeated string retry_alert_emails = 15;
  repeated string retry_alert_webhooks = 16;
  
  // Custom retry configuration
  map<string, string> custom_retry_config = 17;
}

// Webhook subscription metadata
message WebhookSubscriptionMetadata {
  // Subscription tracking
  string trace_id = 1;
  string correlation_id = 2;
  string session_id = 3;
  
  // Subscription context
  string business_context = 4;
  string technical_context = 5;
  string compliance_requirements = 6;
  
  // Subscription lifecycle
  string subscription_stage = 7; // CREATED, CONFIGURED, ACTIVE, SUSPENDED, DELETED
  string subscription_status = 8; // HEALTHY, DEGRADED, UNHEALTHY, CRITICAL
  
  // Subscription metrics
  int32 total_events_received = 9;
  int32 total_events_delivered = 10;
  int32 total_events_failed = 11;
  double delivery_success_rate = 12;
  int64 average_delivery_time_ms = 13;
  
  // Subscription monitoring
  bool enable_monitoring = 14;
  bool enable_alerting = 15;
  bool enable_logging = 16;
  string log_level = 17; // DEBUG, INFO, WARN, ERROR
  
  // Subscription compliance
  bool requires_audit = 18;
  string audit_category = 19;
  repeated string compliance_tags = 20;
  string retention_policy = 21;
  
  // Custom metadata
  map<string, string> custom_metadata = 22;
  map<string, google.protobuf.Any> custom_objects = 23;
}

// Webhook subscription search/filter criteria
message WebhookSubscriptionFilter {
  repeated string subscription_ids = 1;
  repeated string subscription_names = 2;
  repeated string owners = 3;
  repeated string application_ids = 4;
  repeated string environments = 5;
  repeated integrations.webhooks.enums.WebhookStatus statuses = 6;
  repeated integrations.webhooks.enums.WebhookEventType event_types = 7;
  repeated string categories = 8;
  repeated string priorities = 9;
  repeated string tags = 10;
  google.protobuf.Timestamp created_from = 11;
  google.protobuf.Timestamp created_to = 12;
  google.protobuf.Timestamp last_activity_from = 13;
  google.protobuf.Timestamp last_activity_to = 14;
  bool has_active_endpoints = 15;
  bool has_health_checks = 16;
  bool has_retry_config = 17;
  string search_text = 18;
  int32 limit = 19;
  int32 offset = 20;
  string sort_by = 21;
  string sort_order = 22; // ASC, DESC
}

// Webhook subscription list response
message WebhookSubscriptionList {
  repeated WebhookSubscription subscriptions = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
  bool has_next_page = 5;
  bool has_previous_page = 6;
}

// Webhook subscription template
message WebhookSubscriptionTemplate {
  string template_id = 1;
  string template_name = 2;
  string template_description = 3;
  string template_category = 4;
  
  // Template configuration
  WebhookSubscriptionConfiguration configuration = 5;
  WebhookEndpoint endpoint_template = 6;
  WebhookSecurity security_template = 7;
  WebhookEventFilter event_filter_template = 8;
  WebhookRetryConfiguration retry_config_template = 9;
  
  // Template metadata
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string version = 13;
  bool is_active = 14;
  bool is_public = 15;
  repeated string tags = 16;
  map<string, string> custom_fields = 17;
}

// Webhook subscription validation
message WebhookSubscriptionValidation {
  string validation_id = 1;
  string subscription_id = 2;
  string validation_type = 3; // CONFIGURATION, ENDPOINT, SECURITY, FILTER, RETRY
  
  // Validation configuration
  string validation_schema = 4;
  repeated string validation_rules = 5;
  map<string, string> custom_validations = 6;
  
  // Validation results
  bool is_valid = 7;
  repeated WebhookValidationError validation_errors = 8;
  repeated WebhookValidationWarning validation_warnings = 9;
  double validation_score = 10;
  
  // Validation metadata
  google.protobuf.Timestamp validated_at = 11;
  string validated_by = 12;
  int64 validation_duration_ms = 13;
  map<string, string> validation_context = 14;
}

// Webhook validation error
message WebhookValidationError {
  string error_code = 1;
  string error_message = 2;
  string field_path = 3;
  string expected_value = 4;
  string actual_value = 5;
  string error_type = 6; // CONFIGURATION, VALIDATION, SECURITY, COMPLIANCE
  string severity = 7; // LOW, MEDIUM, HIGH, CRITICAL
  map<string, string> error_context = 8;
}

// Webhook validation warning
message WebhookValidationWarning {
  string warning_code = 1;
  string warning_message = 2;
  string field_path = 3;
  string warning_type = 4;
  string severity = 5; // LOW, MEDIUM, HIGH
  map<string, string> warning_context = 6;
}
