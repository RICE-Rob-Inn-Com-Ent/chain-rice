syntax = "proto3";

package gaming.achievements.messages;

import "gaming/achievements/enums/reward_types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/gaming/achievements/messages";

// Модель нагороди
message Reward {
  // Унікальний ідентифікатор нагороди
  string id = 1;
  
  // Назва нагороди
  string name = 2;
  
  // Опис нагороди
  string description = 3;
  
  // Тип нагороди
  gaming.achievements.enums.RewardType type = 4;
  
  // Рідкість нагороди
  gaming.achievements.enums.RewardRarity rarity = 5;
  
  // Кількість
  int64 amount = 6;
  
  // Ідентифікатор предмета/ресурсу
  string item_id = 7;
  
  // Статус нагороди
  gaming.achievements.enums.RewardStatus status = 8;
  
  // Тип розподілу
  gaming.achievements.enums.RewardDistributionType distribution_type = 9;
  
  // Метадані нагороди
  RewardMetadata metadata = 10;
  
  // Умови отримання
  RewardConditions conditions = 11;
  
  // Час створення
  google.protobuf.Timestamp created_at = 12;
  
  // Час оновлення
  google.protobuf.Timestamp updated_at = 13;
  
  // Час закінчення терміну дії
  google.protobuf.Timestamp expires_at = 14;
}

// Метадані нагороди
message RewardMetadata {
  // Іконка нагороди
  string icon_url = 1;
  
  // Зображення нагороди
  string image_url = 2;
  
  // 3D модель нагороди
  string model_url = 3;
  
  // Анімація нагороди
  string animation_url = 4;
  
  // Звукові ефекти
  string sound_url = 5;
  
  // Теги
  repeated string tags = 6;
  
  // Мова
  string language = 7;
  
  // Версія
  string version = 8;
  
  // Додаткові метадані
  map<string, string> additional_data = 9;
}

// Умови отримання нагороди
message RewardConditions {
  // Мінімальний рівень гравця
  int32 min_level = 1;
  
  // Максимальний рівень гравця
  int32 max_level = 2;
  
  // Необхідні досягнення
  repeated string required_achievements = 3;
  
  // Необхідні предмети
  repeated string required_items = 4;
  
  // Необхідні навички
  repeated string required_skills = 5;
  
  // Обмеження за часом
  TimeConstraints time_constraints = 6;
  
  // Обмеження за кількістю
  QuantityConstraints quantity_constraints = 7;
  
  // Додаткові умови
  map<string, string> custom_conditions = 8;
}

// Обмеження за часом
message TimeConstraints {
  // Час початку доступності
  google.protobuf.Timestamp start_time = 1;
  
  // Час закінчення доступності
  google.protobuf.Timestamp end_time = 2;
  
  // Максимальний час для отримання (в секундах)
  int64 max_claim_time_seconds = 3;
  
  // Часові зони
  repeated string timezones = 4;
}

// Обмеження за кількістю
message QuantityConstraints {
  // Максимальна кількість видачі за день
  int64 max_daily_amount = 1;
  
  // Максимальна кількість видачі за тиждень
  int64 max_weekly_amount = 2;
  
  // Максимальна кількість видачі за місяць
  int64 max_monthly_amount = 3;
  
  // Максимальна загальна кількість видачі
  int64 max_total_amount = 4;
  
  // Поточна кількість видачі за день
  int64 current_daily_amount = 5;
  
  // Поточна кількість видачі за тиждень
  int64 current_weekly_amount = 6;
  
  // Поточна кількість видачі за місяць
  int64 current_monthly_amount = 7;
  
  // Поточна загальна кількість видачі
  int64 current_total_amount = 8;
}

// Видача нагороди гравцю
message PlayerReward {
  // Ідентифікатор гравця
  string player_id = 1;
  
  // Нагорода
  Reward reward = 2;
  
  // Час отримання
  google.protobuf.Timestamp claimed_at = 3;
  
  // Час видачі
  google.protobuf.Timestamp distributed_at = 4;
  
  // Статус видачі
  gaming.achievements.enums.RewardStatus status = 5;
  
  // Додаткові дані гравця
  map<string, string> player_data = 6;
  
  // Транзакція видачі
  string transaction_id = 7;
}

// Історія нагород гравця
message PlayerRewardHistory {
  // Ідентифікатор гравця
  string player_id = 1;
  
  // Список отриманих нагород
  repeated PlayerReward rewards = 2;
  
  // Загальна статистика
  RewardStats stats = 3;
  
  // Час останнього оновлення
  google.protobuf.Timestamp last_updated = 4;
}

// Статистика нагород
message RewardStats {
  // Загальна кількість отриманих нагород
  int64 total_rewards = 1;
  
  // Кількість нагород по типах
  map<string, int64> rewards_by_type = 2;
  
  // Кількість нагород по рідкості
  map<string, int64> rewards_by_rarity = 3;
  
  // Загальна вартість нагород
  double total_value = 4;
  
  // Середня вартість нагороди
  double average_value = 5;
  
  // Найцінніша нагорода
  string most_valuable_reward_id = 6;
  
  // Найрідкісніша нагорода
  string rarest_reward_id = 7;
  
  // Статистика по днях
  map<string, int64> daily_stats = 8;
  
  // Статистика по тижнях
  map<string, int64> weekly_stats = 9;
  
  // Статистика по місяцях
  map<string, int64> monthly_stats = 10;
}

// Пакет нагород
message RewardBundle {
  // Унікальний ідентифікатор пакету
  string id = 1;
  
  // Назва пакету
  string name = 2;
  
  // Опис пакету
  string description = 3;
  
  // Нагороди в пакеті
  repeated Reward rewards = 4;
  
  // Ціна пакету
  double price = 5;
  
  // Валюта
  string currency = 6;
  
  // Статус пакету
  string status = 7;
  
  // Час створення
  google.protobuf.Timestamp created_at = 8;
  
  // Час оновлення
  google.protobuf.Timestamp updated_at = 9;
  
  // Час закінчення терміну дії
  google.protobuf.Timestamp expires_at = 10;
}

// Сезонні нагороди
message SeasonalRewards {
  // Ідентифікатор сезону
  string season_id = 1;
  
  // Назва сезону
  string season_name = 2;
  
  // Нагороди сезону
  repeated Reward rewards = 3;
  
  // Час початку сезону
  google.protobuf.Timestamp start_time = 4;
  
  // Час закінчення сезону
  google.protobuf.Timestamp end_time = 5;
  
  // Статус сезону
  string status = 6;
  
  // Додаткові метадані сезону
  map<string, string> season_metadata = 7;
}
