syntax = "proto3";

package gaming.matchmaking.services;

import "gaming/matchmaking/messages/match_models.proto";

option go_package = "github.com/rice-dev/gaming/matchmaking/services";

// Сервіс управління матчами
service MatchService {
  // Створити матч
  rpc CreateMatch(CreateMatchRequest) returns (CreateMatchResponse);
  
  // Отримати матч
  rpc GetMatch(GetMatchRequest) returns (GetMatchResponse);
  
  // Оновити матч
  rpc UpdateMatch(UpdateMatchRequest) returns (UpdateMatchResponse);
  
  // Видалити матч
  rpc DeleteMatch(DeleteMatchRequest) returns (DeleteMatchResponse);
  
  // Отримати список матчів
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesResponse);
  
  // Додати гравця до матчу
  rpc AddPlayerToMatch(AddPlayerToMatchRequest) returns (AddPlayerToMatchResponse);
  
  // Видалити гравця з матчу
  rpc RemovePlayerFromMatch(RemovePlayerFromMatchRequest) returns (RemovePlayerFromMatchResponse);
  
  // Отримати гравців у матчі
  rpc GetMatchPlayers(GetMatchPlayersRequest) returns (GetMatchPlayersResponse);
  
  // Отримати статистику матчу
  rpc GetMatchStats(GetMatchStatsRequest) returns (GetMatchStatsResponse);
  
  // Завершити матч
  rpc EndMatch(EndMatchRequest) returns (EndMatchResponse);
}

