// Статистика по ролі
message RoleStats {
  // Кількість зіграних ігор
  int64 games_played = 1;
  
  // Кількість перемог
  int64 wins = 2;
  
  // Кількість поразок
  int64 losses = 3;
  
  // Відсоток перемог
  double win_rate = 4;
  
  // Загальний час гри
  int64 total_play_time = 5;
  
  // Середній час гри
  double average_game_time = 6;
  
  // Кількість вбивств
  int64 kills = 7;
  
  // Кількість смертей
  int64 deaths = 8;
  
  // Кількість асистів
  int64 assists = 9;
  
  // Співвідношення K/D
  double kill_death_ratio = 10;
  
  // Додаткові статистики
