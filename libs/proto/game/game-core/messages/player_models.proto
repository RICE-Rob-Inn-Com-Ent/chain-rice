syntax = "proto3";

package gaming.game_core.messages;

import "gaming/game_core/enums/player_roles.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/gaming/game_core/messages";

// Модель гравця
message Player {
  // Унікальний ідентифікатор гравця
  string player_id = 1;
  
  // Ім'я гравця
  string name = 2;
  
  // Псевдонім гравця
  string nickname = 3;
  
  // Email гравця
  string email = 4;
  
  // Роль гравця
  gaming.game_core.enums.PlayerRole role = 5;
  
  // Рівень доступу
  gaming.game_core.enums.AccessLevel access_level = 6;
  
  // Профіль гравця
  PlayerProfile profile = 7;
  
  // Статистика гравця
  PlayerStatistics statistics = 8;
  
  // Налаштування гравця
  PlayerSettings settings = 9;
  
  // Інвентар гравця
  PlayerInventory inventory = 10;
  
  // Навички гравця
  repeated PlayerSkill skills = 11;
  
  // Досягнення гравця
  repeated PlayerAchievement achievements = 12;
  
  // Метадані гравця
  PlayerMetadata metadata = 13;
  
  // Час створення
  google.protobuf.Timestamp created_at = 14;
  
  // Час останнього входу
  google.protobuf.Timestamp last_login = 15;
  
  // Час останнього оновлення
  google.protobuf.Timestamp updated_at = 16;
}

// Профіль гравця
message PlayerProfile {
  // Аватар гравця
  string avatar_url = 1;
  
  // Біографія гравця
  string bio = 2;
  
  // Країна гравця
  string country = 3;
  
  // Місто гравця
  string city = 4;
  
  // Дата народження
  google.protobuf.Timestamp birth_date = 5;
  
  // Стать гравця
  string gender = 6;
  
  // Мова гравця
  string language = 7;
  
  // Часовий пояс
  string timezone = 8;
  
  // Соціальні мережі
  map<string, string> social_networks = 9;
  
  // Додаткові дані профілю
  map<string, string> additional_data = 10;
}

// Статистика гравця
message PlayerStatistics {
  // Загальна статистика
  OverallStats overall_stats = 1;
  
  // Статистика по режимах гри
  map<string, GameModeStats> game_mode_stats = 2;
  
  // Статистика по картах
  map<string, MapStats> map_stats = 3;
  
  // Статистика по командах
  map<string, TeamStats> team_stats = 4;
  
  // Статистика по ролях
  map<string, RoleStats> role_stats = 5;
  
  // Статистика по періодах
  map<string, PeriodStats> period_stats = 6;
  
  // Додаткові статистики
  map<string, int64> additional_stats = 7;
}

// Загальна статистика
message OverallStats {
  // Кількість зіграних ігор
  int64 games_played = 1;
  
  // Кількість перемог
  int64 wins = 2;
  
  // Кількість поразок
  int64 losses = 3;
  
  // Відсоток перемог
  double win_rate = 4;
  
  // Загальний час гри (в секундах)
  int64 total_play_time = 5;
  
  // Середній час гри
  double average_game_time = 6;
  
  // Кількість вбивств
  int64 total_kills = 7;
  
  // Кількість смертей
  int64 total_deaths = 8;
  
  // Кількість асистів
  int64 total_assists = 9;
  
  // Співвідношення K/D
  double kill_death_ratio = 10;
  
  // Загальний досвід
  int64 total_experience = 11;
  
  // Поточний рівень
  int32 current_level = 12;
  
  // Додаткові статистики
  map<string, int64> additional_stats = 13;
}

// Статистика по режиму гри
message GameModeStats {
  // Кількість зіграних ігор
  int64 games_played = 1;
  
  // Кількість перемог
  int64 wins = 2;
  
  // Кількість поразок
  int64 losses = 3;
  
  // Відсоток перемог
  double win_rate = 4;
  
  // Загальний час гри
  int64 total_play_time = 5;
  
  // Середній час гри
  double average_game_time = 6;
  
  // Кількість вбивств
  int64 kills = 7;
  
  // Кількість смертей
  int64 deaths = 8;
  
  // Кількість асистів
  int64 assists = 9;
  
  // Співвідношення K/D
  double kill_death_ratio = 10;
  
  // Додаткові статистики
  map<string, int64> additional_stats = 11;
}

// Статистика по карті
message MapStats {
  // Кількість зіграних ігор
  int64 games_played = 1;
  
  // Кількість перемог
  int64 wins = 2;
  
  // Кількість поразок
  int64 losses = 3;
  
  // Відсоток перемог
  double win_rate = 4;
  
  // Загальний час гри
