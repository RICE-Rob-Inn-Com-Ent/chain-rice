syntax = "proto3";

package gaming.leaderboards.messages;

import "gaming/leaderboards/enums/ranking_types.proto";
import "gaming/leaderboards/enums/score_types.proto";

option go_package = "github.com/rice-dev/gaming/leaderboards/messages";

// Модель рейтингу
message Ranking {
  string id = 1;
  string player_id = 2;
  string leaderboard_id = 3;
  gaming.leaderboards.enums.RankingType type = 4;
  gaming.leaderboards.enums.ScoreType score_type = 5;
  int64 score = 6;
  int32 rank = 7;
  int32 previous_rank = 8;
  int32 rank_change = 9;
  int64 timestamp = 10;
  int64 previous_timestamp = 11;
  int64 time_at_rank = 12;
  map<string, string> metadata = 13;
}

// Модель історії рейтингу
message RankingHistory {
  string ranking_id = 1;
  string player_id = 2;
  string leaderboard_id = 3;
  int32 rank = 4;
  int64 score = 5;
  int64 timestamp = 6;
  int32 rank_change = 7;
  int64 score_change = 8;
  map<string, string> metadata = 9;
}

// Модель статистики рейтингу
message RankingStats {
  string player_id = 1;
  string leaderboard_id = 2;
  int32 current_rank = 3;
  int32 best_rank = 4;
  int32 worst_rank = 5;
  int64 current_score = 6;
  int64 best_score = 7;
  int64 worst_score = 8;
  int64 total_score = 9;
  int64 average_score = 10;
  int64 median_score = 11;
  int64 standard_deviation = 12;
  int64 variance = 13;
  int64 percentile_25 = 14;
  int64 percentile_75 = 15;
  int64 percentile_90 = 16;
  int64 percentile_95 = 17;
  int64 percentile_99 = 18;
  int64 total_entries = 19;
  int64 total_time = 20;
  int64 average_time = 21;
  int64 median_time = 22;
  int64 min_time = 23;
  int64 max_time = 24;
  int64 updated_at = 25;
}

// Модель прогнозу рейтингу
message RankingPrediction {
  string player_id = 1;
  string leaderboard_id = 2;
  int32 predicted_rank = 3;
  int64 predicted_score = 4;
  float confidence = 5;
  int64 prediction_date = 6;
  int64 target_date = 7;
  map<string, string> factors = 8;
  map<string, string> metadata = 9;
}

// Модель порівняння рейтингів
message RankingComparison {
  string player_id = 1;
  string leaderboard_id = 2;
  int32 current_rank = 3;
  int32 target_rank = 4;
  int32 rank_difference = 5;
  int64 current_score = 6;
  int64 target_score = 7;
  int64 score_difference = 8;
  int64 time_to_target = 9;
  float probability = 10;
  map<string, string> recommendations = 11;
  map<string, string> metadata = 12;
}

