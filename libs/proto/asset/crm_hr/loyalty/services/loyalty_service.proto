syntax = "proto3";

package crm_hr.loyalty.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";
import "crm_hr/loyalty/messages/loyalty_program.proto";
import "crm_hr/loyalty/messages/reward.proto";
import "crm_hr/loyalty/messages/loyalty_activity.proto";
import "crm_hr/loyalty/enums/loyalty_tier.proto";
import "crm_hr/loyalty/enums/loyalty_status.proto";
import "crm_hr/loyalty/enums/reward_type.proto";

option go_package = "github.com/rice-dev/crm-hr/loyalty/services";

// LoyaltyService provides comprehensive loyalty program management functionality
service LoyaltyService {
  // Loyalty Program Management
  rpc CreateLoyaltyProgram(CreateLoyaltyProgramRequest) returns (LoyaltyProgram);
  rpc GetLoyaltyProgram(GetLoyaltyProgramRequest) returns (LoyaltyProgram);
  rpc UpdateLoyaltyProgram(UpdateLoyaltyProgramRequest) returns (LoyaltyProgram);
  rpc DeleteLoyaltyProgram(DeleteLoyaltyProgramRequest) returns (google.protobuf.Empty);
  rpc ListLoyaltyPrograms(ListLoyaltyProgramsRequest) returns (ListLoyaltyProgramsResponse);
  
  // Loyalty Program Business Operations
  rpc ActivateLoyaltyProgram(ActivateLoyaltyProgramRequest) returns (LoyaltyProgram);
  rpc DeactivateLoyaltyProgram(DeactivateLoyaltyProgramRequest) returns (LoyaltyProgram);
  rpc GetLoyaltyProgramMetrics(GetLoyaltyProgramMetricsRequest) returns (LoyaltyProgramMetrics);
  rpc GetLoyaltyProgramPerformance(GetLoyaltyProgramPerformanceRequest) returns (LoyaltyProgramPerformanceResponse);
  
  // Loyalty Tier Management
  rpc CreateLoyaltyTier(CreateLoyaltyTierRequest) returns (LoyaltyTier);
  rpc GetLoyaltyTier(GetLoyaltyTierRequest) returns (LoyaltyTier);
  rpc UpdateLoyaltyTier(UpdateLoyaltyTierRequest) returns (LoyaltyTier);
  rpc DeleteLoyaltyTier(DeleteLoyaltyTierRequest) returns (google.protobuf.Empty);
  rpc ListLoyaltyTiers(ListLoyaltyTiersRequest) returns (ListLoyaltyTiersResponse);
  
  // Loyalty Member Management
  rpc EnrollMember(EnrollMemberRequest) returns (LoyaltyMember);
  rpc GetLoyaltyMember(GetLoyaltyMemberRequest) returns (LoyaltyMember);
  rpc UpdateLoyaltyMember(UpdateLoyaltyMemberRequest) returns (LoyaltyMember);
  rpc DeactivateMember(DeactivateMemberRequest) returns (LoyaltyMember);
  rpc ListLoyaltyMembers(ListLoyaltyMembersRequest) returns (ListLoyaltyMembersResponse);
  
  // Loyalty Member Business Operations
  rpc EarnPoints(EarnPointsRequest) returns (LoyaltyActivity);
  rpc RedeemPoints(RedeemPointsRequest) returns (LoyaltyActivity);
  rpc TransferPoints(TransferPointsRequest) returns (LoyaltyActivity);
  rpc GiftPoints(GiftPointsRequest) returns (LoyaltyActivity);
  rpc UpdateMemberTier(UpdateMemberTierRequest) returns (LoyaltyMember);
  rpc GetMemberBalance(GetMemberBalanceRequest) returns (MemberBalance);
  rpc GetMemberHistory(GetMemberHistoryRequest) returns (GetMemberHistoryResponse);
  
  // Reward Management
  rpc CreateReward(CreateRewardRequest) returns (Reward);
  rpc GetReward(GetRewardRequest) returns (Reward);
  rpc UpdateReward(UpdateRewardRequest) returns (Reward);
  rpc DeleteReward(DeleteRewardRequest) returns (google.protobuf.Empty);
  rpc ListRewards(ListRewardsRequest) returns (ListRewardsResponse);
  
  // Reward Business Operations
  rpc RedeemReward(RedeemRewardRequest) returns (RewardRedemption);
  rpc GetRewardRedemption(GetRewardRedemptionRequest) returns (RewardRedemption);
  rpc UpdateRewardRedemption(UpdateRewardRedemptionRequest) returns (RewardRedemption);
  rpc ListRewardRedemptions(ListRewardRedemptionsRequest) returns (ListRewardRedemptionsResponse);
  rpc GetRewardCatalog(GetRewardCatalogRequest) returns (RewardCatalog);
  rpc GetRewardAnalytics(GetRewardAnalyticsRequest) returns (RewardAnalytics);
  
  // Loyalty Activity Management
  rpc CreateLoyaltyActivity(CreateLoyaltyActivityRequest) returns (LoyaltyActivity);
  rpc GetLoyaltyActivity(GetLoyaltyActivityRequest) returns (LoyaltyActivity);
  rpc ListLoyaltyActivities(ListLoyaltyActivitiesRequest) returns (ListLoyaltyActivitiesResponse);
  rpc GetMemberActivities(GetMemberActivitiesRequest) returns (GetMemberActivitiesResponse);
  
  // Loyalty Campaign Management
  rpc CreateLoyaltyCampaign(CreateLoyaltyCampaignRequest) returns (LoyaltyCampaign);
  rpc GetLoyaltyCampaign(GetLoyaltyCampaignRequest) returns (LoyaltyCampaign);
  rpc UpdateLoyaltyCampaign(UpdateLoyaltyCampaignRequest) returns (LoyaltyCampaign);
  rpc DeleteLoyaltyCampaign(DeleteLoyaltyCampaignRequest) returns (google.protobuf.Empty);
  rpc ListLoyaltyCampaigns(ListLoyaltyCampaignsRequest) returns (ListLoyaltyCampaignsResponse);
  
  // Loyalty Campaign Business Operations
  rpc ActivateCampaign(ActivateCampaignRequest) returns (LoyaltyCampaign);
  rpc PauseCampaign(PauseCampaignRequest) returns (LoyaltyCampaign);
  rpc CompleteCampaign(CompleteCampaignRequest) returns (LoyaltyCampaign);
  rpc GetCampaignMetrics(GetCampaignMetricsRequest) returns (CampaignMetrics);
  
  // Loyalty Segment Management
  rpc CreateLoyaltySegment(CreateLoyaltySegmentRequest) returns (LoyaltySegment);
  rpc GetLoyaltySegment(GetLoyaltySegmentRequest) returns (LoyaltySegment);
  rpc UpdateLoyaltySegment(UpdateLoyaltySegmentRequest) returns (LoyaltySegment);
  rpc DeleteLoyaltySegment(DeleteLoyaltySegmentRequest) returns (google.protobuf.Empty);
  rpc ListLoyaltySegments(ListLoyaltySegmentsRequest) returns (ListLoyaltySegmentsResponse);
  
  // Analytics and Reporting
  rpc GetLoyaltyAnalytics(GetLoyaltyAnalyticsRequest) returns (LoyaltyAnalyticsResponse);
  rpc GetMemberSegmentation(GetMemberSegmentationRequest) returns (MemberSegmentationResponse);
  rpc GetLoyaltyReport(GetLoyaltyReportRequest) returns (LoyaltyReportResponse);
  rpc GetLoyaltyROI(GetLoyaltyROIRequest) returns (LoyaltyROIResponse);
}

// Loyalty Program Management Requests/Responses
message CreateLoyaltyProgramRequest {
  string name = 1;
  string description = 2;
  string program_type = 3;
  string currency = 4;
  string point_name = 5;
  double point_value = 6;
  int32 points_per_dollar = 7;
  double minimum_redemption = 8;
  google.protobuf.Timestamp start_date = 9;
  google.protobuf.Timestamp end_date = 10;
  bool is_public = 11;
  string created_by = 12;
  string team_id = 13;
  repeated string tags = 14;
  map<string, string> custom_fields = 15;
}

message GetLoyaltyProgramRequest {
  string id = 1;
}

message UpdateLoyaltyProgramRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  crm_hr.loyalty.enums.LoyaltyStatus status = 4;
  string currency = 5;
  string point_name = 6;
  double point_value = 7;
  int32 points_per_dollar = 8;
  double minimum_redemption = 9;
  google.protobuf.Timestamp end_date = 10;
  bool is_active = 11;
  bool is_public = 12;
  repeated string tags = 13;
  map<string, string> custom_fields = 14;
}

message DeleteLoyaltyProgramRequest {
  string id = 1;
}

message ListLoyaltyProgramsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  crm_hr.loyalty.enums.LoyaltyStatus status = 4;
  string team_id = 5;
  bool is_active = 6;
}

message ListLoyaltyProgramsResponse {
  repeated LoyaltyProgram programs = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Loyalty Program Business Operations
message ActivateLoyaltyProgramRequest {
  string program_id = 1;
  string activated_by = 2;
  google.protobuf.Timestamp activation_date = 3;
}

message DeactivateLoyaltyProgramRequest {
  string program_id = 1;
  string deactivated_by = 2;
  string reason = 3;
  google.protobuf.Timestamp deactivation_date = 4;
}

message GetLoyaltyProgramMetricsRequest {
  string program_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message GetLoyaltyProgramPerformanceRequest {
  string program_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message LoyaltyProgramPerformanceResponse {
  string program_id = 1;
  int32 total_members = 2;
  int32 active_members = 3;
  int32 new_members = 4;
  int32 churned_members = 5;
  double retention_rate = 6;
  double total_points_earned = 7;
  double total_points_redeemed = 8;
  double redemption_rate = 9;
  google.protobuf.Money total_revenue = 10;
  google.protobuf.Money program_cost = 11;
  double roi = 12;
  map<string, int32> members_by_tier = 13;
  google.protobuf.Timestamp calculated_at = 14;
}

