syntax = "proto3";

package crm_hr.crm.enums;

option go_package = "github.com/rice-dev/crm-hr/crm/enums";

// CrmPriority represents the priority level for CRM activities and tasks
enum CrmPriority {
  // Unspecified priority - should not be used in production
  CRM_PRIORITY_UNSPECIFIED = 0;
  
  // Priority levels
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  URGENT = 4;
  CRITICAL = 5;
}
