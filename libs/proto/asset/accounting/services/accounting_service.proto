syntax = "proto3";

package finance.accounting.services;

import "finance/accounting/messages/account.proto";
import "finance/accounting/messages/ledger_entry.proto";
import "finance/accounting/messages/balance_sheet.proto";

// Accounting service for financial record management
service AccountingService {
  // Account management
  rpc CreateAccount(finance.accounting.messages.CreateAccountRequest) returns (finance.accounting.messages.CreateAccountResponse);
  rpc GetAccount(finance.accounting.messages.GetAccountRequest) returns (finance.accounting.messages.GetAccountResponse);
  rpc UpdateAccount(finance.accounting.messages.UpdateAccountRequest) returns (finance.accounting.messages.UpdateAccountResponse);
  rpc ListAccounts(finance.accounting.messages.ListAccountsRequest) returns (finance.accounting.messages.ListAccountsResponse);
  rpc DeleteAccount(finance.accounting.messages.DeleteAccountRequest) returns (finance.accounting.messages.DeleteAccountResponse);
  
  // Ledger entry management
  rpc CreateLedgerEntry(finance.accounting.messages.CreateLedgerEntryRequest) returns (finance.accounting.messages.CreateLedgerEntryResponse);
  rpc GetLedgerEntry(finance.accounting.messages.GetLedgerEntryRequest) returns (finance.accounting.messages.GetLedgerEntryResponse);
  rpc ListLedgerEntries(finance.accounting.messages.ListLedgerEntriesRequest) returns (finance.accounting.messages.ListLedgerEntriesResponse);
  rpc UpdateLedgerEntry(finance.accounting.messages.UpdateLedgerEntryRequest) returns (finance.accounting.messages.UpdateLedgerEntryResponse);
  rpc DeleteLedgerEntry(finance.accounting.messages.DeleteLedgerEntryRequest) returns (finance.accounting.messages.DeleteLedgerEntryResponse);
  
  // Journal entry management
  rpc CreateJournalEntry(finance.accounting.messages.CreateJournalEntryRequest) returns (finance.accounting.messages.CreateJournalEntryResponse);
  rpc GetJournalEntry(finance.accounting.messages.GetJournalEntryRequest) returns (finance.accounting.messages.GetJournalEntryResponse);
  rpc ListJournalEntries(finance.accounting.messages.ListJournalEntriesRequest) returns (finance.accounting.messages.ListJournalEntriesResponse);
  rpc ApproveJournalEntry(finance.accounting.messages.ApproveJournalEntryRequest) returns (finance.accounting.messages.ApproveJournalEntryResponse);
  
  // Balance sheet operations
  rpc GenerateBalanceSheet(finance.accounting.messages.GenerateBalanceSheetRequest) returns (finance.accounting.messages.GenerateBalanceSheetResponse);
  rpc GetBalanceSheet(finance.accounting.messages.GetBalanceSheetRequest) returns (finance.accounting.messages.GetBalanceSheetResponse);
  rpc CompareBalanceSheets(finance.accounting.messages.CompareBalanceSheetsRequest) returns (finance.accounting.messages.CompareBalanceSheetsResponse);
  
  // Account reconciliation
  rpc ReconcileAccount(finance.accounting.messages.ReconcileAccountRequest) returns (finance.accounting.messages.ReconcileAccountResponse);
  rpc GetReconciliationReport(finance.accounting.messages.GetReconciliationReportRequest) returns (finance.accounting.messages.GetReconciliationReportResponse);
  
  // Trial balance
  rpc GenerateTrialBalance(finance.accounting.messages.GenerateTrialBalanceRequest) returns (finance.accounting.messages.GenerateTrialBalanceResponse);
  
  // Account balances
  rpc GetAccountBalance(finance.accounting.messages.GetAccountBalanceRequest) returns (finance.accounting.messages.GetAccountBalanceResponse);
  rpc GetAccountBalances(finance.accounting.messages.GetAccountBalancesRequest) returns (finance.accounting.messages.GetAccountBalancesResponse);
}

// Additional request/response messages for accounting service

// Get account request
message GetAccountRequest {
  string account_id = 1;
}

// Get account response
message GetAccountResponse {
  finance.accounting.messages.Account account = 1;
  bool success = 2;
  string error_message = 3;
}

// Delete account request
message DeleteAccountRequest {
  string account_id = 1;
}

// Delete account response
message DeleteAccountResponse {
  bool success = 1;
  string error_message = 2;
}

// Get ledger entry request
message GetLedgerEntryRequest {
  string entry_id = 1;
}

// Get ledger entry response
message GetLedgerEntryResponse {
  finance.accounting.messages.LedgerEntry entry = 1;
  bool success = 2;
  string error_message = 3;
}

// Update ledger entry request
message UpdateLedgerEntryRequest {
  string entry_id = 1;
  string description = 2;
  double debit_amount = 3;
  double credit_amount = 4;
  repeated string tags = 5;
  map<string, string> custom_fields = 6;
}

// Update ledger entry response
message UpdateLedgerEntryResponse {
  finance.accounting.messages.LedgerEntry entry = 1;
  bool success = 2;
  string error_message = 3;
}

// Delete ledger entry request
message DeleteLedgerEntryRequest {
  string entry_id = 1;
}

// Delete ledger entry response
message DeleteLedgerEntryResponse {
  bool success = 1;
  string error_message = 2;
}

// Create journal entry request
message CreateJournalEntryRequest {
  int64 entry_date = 1;
  string reference_number = 2;
  string description = 3;
  repeated finance.accounting.messages.LedgerEntry entries = 4;
  string currency = 5;
  string transaction_id = 6;
  string document_id = 7;
  repeated string tags = 8;
  map<string, string> custom_fields = 9;
}

// Create journal entry response
message CreateJournalEntryResponse {
  finance.accounting.messages.JournalEntry journal_entry = 1;
  bool success = 2;
  string error_message = 3;
}

// Get journal entry request
message GetJournalEntryRequest {
  string journal_entry_id = 1;
}

// Get journal entry response
message GetJournalEntryResponse {
  finance.accounting.messages.JournalEntry journal_entry = 1;
  bool success = 2;
  string error_message = 3;
}

// List journal entries request
message ListJournalEntriesRequest {
  int64 start_date = 1;
  int64 end_date = 2;
  string reference_number = 3;
  string transaction_id = 4;
  string search_term = 5;
  int32 page = 6;
  int32 page_size = 7;
}

// List journal entries response
message ListJournalEntriesResponse {
  repeated finance.accounting.messages.JournalEntry journal_entries = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  bool success = 5;
  string error_message = 6;
}

// Approve journal entry request
message ApproveJournalEntryRequest {
  string journal_entry_id = 1;
  string approval_notes = 2;
}

// Approve journal entry response
message ApproveJournalEntryResponse {
  finance.accounting.messages.JournalEntry journal_entry = 1;
  bool success = 2;
  string error_message = 3;
}

// Get balance sheet request
message GetBalanceSheetRequest {
  string balance_sheet_id = 1;
}

// Get balance sheet response
message GetBalanceSheetResponse {
  finance.accounting.messages.BalanceSheet balance_sheet = 1;
  bool success = 2;
  string error_message = 3;
}

// Compare balance sheets request
message CompareBalanceSheetsRequest {
  string current_balance_sheet_id = 1;
  string previous_balance_sheet_id = 2;
}

// Compare balance sheets response
message CompareBalanceSheetsResponse {
  finance.accounting.messages.BalanceSheetComparison comparison = 1;
  bool success = 2;
  string error_message = 3;
}

// Reconcile account request
message ReconcileAccountRequest {
  string account_id = 1;
  int64 reconciliation_date = 2;
  double statement_balance = 3;
  repeated string unreconciled_entry_ids = 4;
  string reconciliation_notes = 5;
}

// Reconcile account response
message ReconcileAccountResponse {
  string reconciliation_id = 1;
  bool success = 2;
  string error_message = 3;
}

// Get reconciliation report request
message GetReconciliationReportRequest {
  string account_id = 1;
  int64 start_date = 2;
  int64 end_date = 3;
}

// Reconciliation report
message ReconciliationReport {
  string report_id = 1;
  string account_id = 2;
  string account_name = 3;
  int64 report_date = 4;
  double book_balance = 5;
  double statement_balance = 6;
  double reconciled_balance = 7;
  repeated finance.accounting.messages.LedgerEntry unreconciled_entries = 8;
  repeated ReconciliationItem reconciliation_items = 9;
  string status = 10;
  string notes = 11;
}

// Reconciliation item
message ReconciliationItem {
  string item_id = 1;
  string entry_id = 2;
  string description = 3;
  double amount = 4;
  string status = 5;
  int64 reconciliation_date = 6;
}

// Get reconciliation report response
message GetReconciliationReportResponse {
  ReconciliationReport report = 1;
  bool success = 2;
  string error_message = 3;
}

// Generate trial balance request
message GenerateTrialBalanceRequest {
  int64 trial_balance_date = 1;
  string currency = 2;
  bool include_zero_balances = 3;
}

// Trial balance
message TrialBalance {
  string trial_balance_id = 1;
  int64 trial_balance_date = 2;
  string currency = 3;
  repeated TrialBalanceItem items = 4;
  double total_debits = 5;
  double total_credits = 6;
  double difference = 7;
  bool is_balanced = 8;
  int64 created_at = 9;
}

// Trial balance item
message TrialBalanceItem {
  string account_id = 1;
  string account_name = 2;
  string account_code = 3;
  double debit_balance = 4;
  double credit_balance = 5;
  double net_balance = 6;
}

// Generate trial balance response
message GenerateTrialBalanceResponse {
  TrialBalance trial_balance = 1;
  bool success = 2;
  string error_message = 3;
}

// Get account balance request
message GetAccountBalanceRequest {
  string account_id = 1;
  int64 as_of_date = 2;
}

// Account balance
message AccountBalance {
  string account_id = 1;
  string account_name = 2;
  string account_code = 3;
  double balance = 4;
  string currency = 5;
  int64 as_of_date = 6;
  double debit_total = 7;
  double credit_total = 8;
}

// Get account balance response
message GetAccountBalanceResponse {
  AccountBalance balance = 1;
  bool success = 2;
  string error_message = 3;
}

// Get account balances request
message GetAccountBalancesRequest {
  repeated string account_ids = 1;
  int64 as_of_date = 2;
  string currency = 3;
}

// Get account balances response
message GetAccountBalancesResponse {
  repeated AccountBalance balances = 1;
  bool success = 2;
  string error_message = 3;
}
