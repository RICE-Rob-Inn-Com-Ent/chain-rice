syntax = "proto3";

package finance.invoicing.enums;

// Tax handling methods for invoices
enum TaxHandling {
  // Default value
  TAX_HANDLING_UNSPECIFIED = 0;
  
  // Tax inclusive - tax is included in the price
  TAX_HANDLING_INCLUSIVE = 1;
  
  // Tax exclusive - tax is added to the price
  TAX_HANDLING_EXCLUSIVE = 2;
  
  // No tax - no tax applies
  TAX_HANDLING_NONE = 3;
  
  // Tax exempt - customer is exempt from tax
  TAX_HANDLING_EXEMPT = 4;
  
  // Reverse charge - tax is handled by customer
  TAX_HANDLING_REVERSE_CHARGE = 5;
  
  // Tax on shipping - tax applies to shipping
  TAX_HANDLING_ON_SHIPPING = 6;
  
  // Tax on discount - tax applies to discount
  TAX_HANDLING_ON_DISCOUNT = 7;
  
  // Compound tax - multiple taxes applied
  TAX_HANDLING_COMPOUND = 8;
  
  // Tax on tax - tax applied on top of other taxes
  TAX_HANDLING_ON_TAX = 9;
  
  // Zero-rated - tax rate is zero
  TAX_HANDLING_ZERO_RATED = 10;
  
  // Out of scope - tax is out of scope
  TAX_HANDLING_OUT_OF_SCOPE = 11;
  
  // Mixed - different tax handling for different items
  TAX_HANDLING_MIXED = 12;
}
