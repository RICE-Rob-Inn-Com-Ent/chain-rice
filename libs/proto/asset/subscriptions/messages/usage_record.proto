syntax = "proto3";

package finance.subscriptions.messages;

// Usage record representation
message UsageRecord {
  // Unique usage record identifier
  string usage_record_id = 1;
  
  // Subscription ID
  string subscription_id = 2;
  
  // Usage type
  string usage_type = 3;
  
  // Usage amount
  double usage_amount = 4;
  
  // Usage unit
  string usage_unit = 5;
  
  // Usage date
  int64 usage_date = 5;
  
  // Billing period start
  int64 billing_period_start = 6;
  
  // Billing period end
  int64 billing_period_end = 7;
  
  // Usage details
  string usage_details = 8;
  
  // Usage metadata
  map<string, string> metadata = 9;
  
  // Usage tags
  repeated string tags = 10;
  
  // Custom fields
  map<string, string> custom_fields = 11;
  
  // Creation timestamp
  int64 created_at = 12;
  
  // Last update timestamp
  int64 updated_at = 13;
  
  // Created by user ID
  string created_by = 14;
  
  // Updated by user ID
  string updated_by = 15;
}

// Usage record creation request
message CreateUsageRecordRequest {
  // Subscription ID
  string subscription_id = 1;
  
  // Usage type
  string usage_type = 2;
  
  // Usage amount
  double usage_amount = 3;
  
  // Usage unit
  string usage_unit = 4;
  
  // Usage date
  int64 usage_date = 5;
  
  // Billing period start
  int64 billing_period_start = 6;
  
  // Billing period end
  int64 billing_period_end = 7;
  
  // Usage details
  string usage_details = 8;
  
  // Usage metadata
  map<string, string> metadata = 9;
  
  // Usage tags
  repeated string tags = 10;
  
  // Custom fields
  map<string, string> custom_fields = 11;
}

// Usage record creation response
message CreateUsageRecordResponse {
  // Created usage record
  UsageRecord usage_record = 1;
  
  // Success status
  bool success = 2;
  
  // Error message if any
  string error_message = 3;
}

// Usage record update request
message UpdateUsageRecordRequest {
  // Usage record ID
  string usage_record_id = 1;
  
  // Updated usage amount
  double usage_amount = 2;
  
  // Updated usage details
  string usage_details = 3;
  
  // Updated usage metadata
  map<string, string> metadata = 4;
  
  // Updated usage tags
  repeated string tags = 5;
  
  // Updated custom fields
  map<string, string> custom_fields = 6;
}

// Usage record update response
message UpdateUsageRecordResponse {
  // Updated usage record
  UsageRecord usage_record = 1;
  
  // Success status
  bool success = 2;
  
  // Error message if any
  string error_message = 3;
}

// Usage record list request
message ListUsageRecordsRequest {
  // Subscription ID
  string subscription_id = 1;
  
  // Filter by usage type
  string usage_type = 2;
  
  // Filter by date range
  int64 start_date = 3;
  int64 end_date = 4;
  
  // Filter by billing period
  int64 billing_period_start = 5;
  int64 billing_period_end = 6;
  
  // Search term
  string search_term = 7;
  
  // Page number
  int32 page = 8;
  
  // Page size
  int32 page_size = 9;
}

// Usage record list response
message ListUsageRecordsResponse {
  // List of usage records
  repeated UsageRecord usage_records = 1;
  
  // Total count
  int64 total_count = 2;
  
  // Page number
  int32 page = 3;
  
  // Page size
  int32 page_size = 4;
  
  // Success status
  bool success = 5;
  
  // Error message if any
  string error_message = 6;
}

// Usage summary
message UsageSummary {
  // Subscription ID
  string subscription_id = 1;
  
  // Usage period start
  int64 period_start = 2;
  
  // Usage period end
  int64 period_end = 3;
  
  // Total usage amount
  double total_usage = 4;
  
  // Usage by type
  map<string, double> usage_by_type = 5;
  
  // Usage limits
  map<string, int64> usage_limits = 6;
  
  // Usage percentage
  map<string, double> usage_percentage = 7;
  
  // Overage amount
  double overage_amount = 8;
  
  // Overage charges
  double overage_charges = 9;
  
  // Currency code
  string currency = 10;
  
  // Summary date
  int64 summary_date = 11;
}

// Usage summary request
message GetUsageSummaryRequest {
  // Subscription ID
  string subscription_id = 1;
  
  // Usage period start
  int64 period_start = 2;
  
  // Usage period end
  int64 period_end = 3;
  
  // Include overage
  bool include_overage = 4;
}

// Usage summary response
message GetUsageSummaryResponse {
  // Usage summary
  UsageSummary summary = 1;
  
  // Success status
  bool success = 2;
  
  // Error message if any
  string error_message = 3;
}
