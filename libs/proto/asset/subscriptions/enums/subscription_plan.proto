syntax = "proto3";

package finance.subscriptions.enums;

// Subscription plan types
enum SubscriptionPlan {
  // Default value
  SUBSCRIPTION_PLAN_UNSPECIFIED = 0;
  
  // Free plan
  SUBSCRIPTION_PLAN_FREE = 1;
  
  // Basic plan
  SUBSCRIPTION_PLAN_BASIC = 2;
  
  // Standard plan
  SUBSCRIPTION_PLAN_STANDARD = 3;
  
  // Premium plan
  SUBSCRIPTION_PLAN_PREMIUM = 4;
  
  // Enterprise plan
  SUBSCRIPTION_PLAN_ENTERPRISE = 5;
  
  // Professional plan
  SUBSCRIPTION_PLAN_PROFESSIONAL = 6;
  
  // Starter plan
  SUBSCRIPTION_PLAN_STARTER = 7;
  
  // Growth plan
  SUBSCRIPTION_PLAN_GROWTH = 8;
  
  // Scale plan
  SUBSCRIPTION_PLAN_SCALE = 9;
  
  // Custom plan
  SUBSCRIPTION_PLAN_CUSTOM = 10;
  
  // Trial plan
  SUBSCRIPTION_PLAN_TRIAL = 11;
  
  // Pay-as-you-go plan
  SUBSCRIPTION_PLAN_PAY_AS_YOU_GO = 12;
  
  // Usage-based plan
  SUBSCRIPTION_PLAN_USAGE_BASED = 13;
  
  // Tiered plan
  SUBSCRIPTION_PLAN_TIERED = 14;
  
  // Volume plan
  SUBSCRIPTION_PLAN_VOLUME = 15;
  
  // Per-seat plan
  SUBSCRIPTION_PLAN_PER_SEAT = 16;
  
  // Per-user plan
  SUBSCRIPTION_PLAN_PER_USER = 17;
  
  // Per-project plan
  SUBSCRIPTION_PLAN_PER_PROJECT = 18;
  
  // Per-transaction plan
  SUBSCRIPTION_PLAN_PER_TRANSACTION = 19;
  
  // Per-storage plan
  SUBSCRIPTION_PLAN_PER_STORAGE = 20;
  
  // Per-bandwidth plan
  SUBSCRIPTION_PLAN_PER_BANDWIDTH = 21;
}
