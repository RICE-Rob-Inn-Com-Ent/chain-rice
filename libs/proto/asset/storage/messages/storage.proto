syntax = "proto3";

package agriculture.storage.messages;

import "agriculture/storage/enums/storage_type.proto";
import "agriculture/storage/enums/storage_status.proto";
import "google/protobuf/timestamp.proto";

// Storage message represents a single storage facility
message Storage {
  // Unique identifier for the storage facility
  string id = 1;
  
  // Basic information
  string name = 2;
  string description = 3;
  string location = 4;           // Physical location description
  string address = 5;            // Full address
  double latitude = 6;           // GPS latitude coordinate
  double longitude = 7;          // GPS longitude coordinate
  
  // Storage classification
  agriculture.storage.enums.StorageType type = 8;
  string category = 9;           // Additional category classification
  string subcategory = 10;       // More specific classification
  
  // Physical specifications
  double length = 11;            // Length in meters
  double width = 12;             // Width in meters
  double height = 13;            // Height in meters
  double total_volume = 14;      // Total volume in cubic meters
  double usable_volume = 15;     // Usable volume in cubic meters
  double floor_area = 16;        // Floor area in square meters
  double wall_area = 17;         // Wall area in square meters
  
  // Capacity information
  double max_capacity = 18;      // Maximum storage capacity
  string capacity_unit = 19;     // Unit for capacity (kg, tons, bushels, etc.)
  double current_capacity = 20;  // Current storage level
  double available_capacity = 21; // Available storage space
  double utilization_rate = 22;  // Utilization rate percentage
  
  // Environmental controls
  bool has_temperature_control = 23; // Whether storage has temperature control
  double min_temperature = 24;   // Minimum temperature in Celsius
  double max_temperature = 25;   // Maximum temperature in Celsius
  double current_temperature = 26; // Current temperature
  bool has_humidity_control = 27; // Whether storage has humidity control
  double min_humidity = 28;      // Minimum humidity percentage
  double max_humidity = 29;      // Maximum humidity percentage
  double current_humidity = 30;  // Current humidity
  bool has_ventilation = 31;     // Whether storage has ventilation
  bool has_air_circulation = 32; // Whether storage has air circulation
  
  // Current status
  agriculture.storage.enums.StorageStatus status = 33;
  string current_contents = 34;  // What is currently stored
  string contents_type = 35;     // Type of contents (grain, hay, equipment, etc.)
  string contents_grade = 36;    // Grade of contents (A, B, C, etc.)
  double contents_quantity = 37; // Quantity of contents
  string contents_unit = 38;     // Unit for contents quantity
  
  // Storage dates
  google.protobuf.Timestamp storage_start_date = 39;
  google.protobuf.Timestamp storage_end_date = 40;
  google.protobuf.Timestamp last_emptied_date = 41;
  google.protobuf.Timestamp last_cleaned_date = 42;
  google.protobuf.Timestamp last_inspected_date = 43;
  
  // Construction and materials
  string construction_material = 44; // Steel, concrete, wood, etc.
  string roof_material = 45;     // Roof material type
  string floor_material = 46;    // Floor material type
  string wall_material = 47;     // Wall material type
  string insulation_type = 48;   // Type of insulation
  double insulation_thickness = 49; // Insulation thickness in cm
  
  // Access and security
  string access_type = 50;       // Public, private, restricted, etc.
  bool has_security_system = 51; // Whether storage has security system
  bool has_alarm_system = 52;    // Whether storage has alarm system
  bool has_camera_system = 53;   // Whether storage has camera system
  string lock_type = 54;         // Type of locking mechanism
  repeated string authorized_users = 55; // List of authorized users
  
  // Equipment and systems
  bool has_loading_equipment = 56; // Whether storage has loading equipment
  bool has_unloading_equipment = 57; // Whether storage has unloading equipment
  bool has_conveyor_system = 58;  // Whether storage has conveyor system
  bool has_elevator_system = 59;  // Whether storage has elevator system
  bool has_weighing_system = 60;  // Whether storage has weighing system
  bool has_monitoring_system = 61; // Whether storage has monitoring system
  
  // Maintenance information
  google.protobuf.Timestamp last_maintenance_date = 62;
  google.protobuf.Timestamp next_maintenance_due = 63;
  string maintenance_schedule = 64; // Maintenance schedule
  repeated string maintenance_history = 65; // List of maintenance records
  double maintenance_cost = 66;  // Total maintenance cost
  string maintenance_contractor = 67; // Maintenance contractor
  
  // Financial information
  double construction_cost = 68; // Original construction cost
  double current_value = 69;     // Current estimated value
  double depreciation_rate = 70; // Annual depreciation rate
  double insurance_value = 71;   // Insurance value
  double insurance_premium = 72; // Annual insurance premium
  string insurance_company = 73; // Insurance company
  google.protobuf.Timestamp insurance_expiry = 74;
  
  // Ownership and management
  string owner = 75;             // Owner name or organization
  string manager = 76;           // Manager name
  string operator = 77;          // Operator name
  string contact_person = 78;    // Contact person
  string contact_phone = 79;     // Contact phone number
  string contact_email = 80;     // Contact email address
  
  // Compliance and regulations
  bool meets_safety_standards = 81; // Whether storage meets safety standards
  bool meets_environmental_standards = 82; // Whether storage meets environmental standards
  bool meets_food_safety_standards = 83; // Whether storage meets food safety standards
  repeated string certifications = 84; // List of certifications
  repeated string permits = 85;  // List of permits
  google.protobuf.Timestamp last_inspection = 86;
  google.protobuf.Timestamp next_inspection_due = 87;
  
  // Quality control
  bool has_quality_control = 88; // Whether storage has quality control
  string quality_standards = 89; // Quality standards followed
  double quality_rating = 90;    // Quality rating (0-100)
  repeated string quality_issues = 91; // List of quality issues
  string quality_notes = 92;     // Quality control notes
  
  // Environmental impact
  double carbon_footprint = 93;  // Carbon footprint
  double energy_consumption = 94; // Energy consumption per year
  string energy_source = 95;     // Primary energy source
  bool uses_renewable_energy = 96; // Whether storage uses renewable energy
  double water_usage = 97;       // Water usage per year
  bool has_waste_management = 98; // Whether storage has waste management
  
  // Technology and automation
  bool is_automated = 99;        // Whether storage is automated
  bool has_sensors = 100;        // Whether storage has sensors
  bool has_remote_monitoring = 101; // Whether storage has remote monitoring
  bool has_data_logging = 102;   // Whether storage has data logging
  string control_system = 103;   // Type of control system
  string software_system = 104;  // Software system used
  
  // Performance metrics
  double efficiency_rating = 105; // Overall efficiency rating (0-100)
  double utilization_efficiency = 106; // Utilization efficiency
  double energy_efficiency = 107; // Energy efficiency
  double cost_efficiency = 108;  // Cost efficiency
  double throughput_rate = 109;  // Throughput rate per hour
  
  // Issues and problems
  repeated string current_issues = 110; // Current issues or problems
  repeated string resolved_issues = 111; // Recently resolved issues
  bool requires_attention = 112; // Whether storage needs immediate attention
  string priority_level = 113;   // Priority level for attention (high, medium, low)
  
  // Notes and observations
  string notes = 114;            // General notes about the storage
  repeated string observations = 115; // Regular observations
  string recommendations = 116;  // Recommendations for improvement
  
  // Metadata
  google.protobuf.Timestamp created_at = 117;
  google.protobuf.Timestamp updated_at = 118;
  string created_by = 119;       // User who created this record
  string updated_by = 120;       // User who last updated this record
  
  // Status flags
  bool is_active = 121;          // Whether storage is currently active
  bool is_available = 122;       // Whether storage is available for use
  bool is_reserved = 123;        // Whether storage is reserved for specific use
}
