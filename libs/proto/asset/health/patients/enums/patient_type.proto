syntax = "proto3";

package healthcare.patients.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/patients/enums";

// Patient type enumeration
enum PatientType {
  PATIENT_TYPE_UNSPECIFIED = 0;
  PATIENT_TYPE_ADULT = 1;
  PATIENT_TYPE_CHILD = 2;
  PATIENT_TYPE_SENIOR = 3;
  PATIENT_TYPE_EMERGENCY = 4;
  PATIENT_TYPE_OUTPATIENT = 5;
  PATIENT_TYPE_INPATIENT = 6;
  PATIENT_TYPE_DAY_PATIENT = 7;
  PATIENT_TYPE_MATERNITY = 8;
  PATIENT_TYPE_PEDIATRIC = 9;
  PATIENT_TYPE_GERIATRIC = 10;
}
