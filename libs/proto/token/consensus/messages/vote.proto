syntax = "proto3";

package blockchain.consensus.messages;

import "blockchain/consensus/enums/consensus_algorithm.proto";

option go_package = "github.com/chainrice/proto/blockchain/consensus/messages";

// VoteType defines the type of consensus vote
enum VoteType {
  // VOTE_TYPE_UNSPECIFIED indicates an unspecified vote type
  VOTE_TYPE_UNSPECIFIED = 0;
  
  // VOTE_TYPE_PREVOTE indicates a prevote in Tendermint consensus
  VOTE_TYPE_PREVOTE = 1;
  
  // VOTE_TYPE_PRECOMMIT indicates a precommit in Tendermint consensus
  VOTE_TYPE_PRECOMMIT = 2;
  
  // VOTE_TYPE_PROPOSAL indicates a vote on a block proposal
  VOTE_TYPE_PROPOSAL = 3;
  
  // VOTE_TYPE_VALIDATION indicates a validation vote
  VOTE_TYPE_VALIDATION = 4;
  
  // VOTE_TYPE_FINALIZATION indicates a finalization vote
  VOTE_TYPE_FINALIZATION = 5;
  
  // VOTE_TYPE_SLASHING indicates a slashing vote
  VOTE_TYPE_SLASHING = 6;
  
  // VOTE_TYPE_UNJAILING indicates an unjailing vote
  VOTE_TYPE_UNJAILING = 7;
}

// VoteValue defines the value of a consensus vote
enum VoteValue {
  // VOTE_VALUE_UNSPECIFIED indicates an unspecified vote value
  VOTE_VALUE_UNSPECIFIED = 0;
  
  // VOTE_VALUE_YES indicates a positive vote
  VOTE_VALUE_YES = 1;
  
  // VOTE_VALUE_NO indicates a negative vote
  VOTE_VALUE_NO = 2;
  
  // VOTE_VALUE_ABSTAIN indicates an abstention
  VOTE_VALUE_ABSTAIN = 3;
  
  // VOTE_VALUE_NIL indicates a nil vote
  VOTE_VALUE_NIL = 4;
}

// Vote represents a consensus vote
message Vote {
  string id = 1;                    // Unique vote identifier
  string voter = 2;                 // Voter address (sdk.Address)
  string target_id = 3;             // Target being voted on (block/proposal ID)
  VoteType vote_type = 4;           // Type of vote
  VoteValue vote_value = 5;         // Vote value
  
  // Vote context
  int64 height = 6;                 // Block height
  int64 round = 7;                  // Consensus round
  int64 step = 8;                   // Consensus step
  int64 timestamp = 9;              // Vote timestamp
  
  // Vote validation
  string signature = 10;            // Vote signature
  string public_key = 11;           // Voter's public key
  blockchain.consensus.enums.ConsensusAlgorithm consensus_algorithm = 12; // Consensus algorithm
  
  // Vote metadata
  string reason = 13;               // Vote reason (if applicable)
  map<string, string> metadata = 14; // Additional metadata
  int64 weight = 15;                // Vote weight
  string network_id = 16;           // Network identifier
}

// VoteSet represents a collection of votes
message VoteSet {
  string id = 1;                    // Unique vote set identifier
  string target_id = 2;             // Target being voted on
  VoteType vote_type = 3;           // Type of votes in set
  int64 height = 4;                 // Block height
  int64 round = 5;                  // Consensus round
  int64 step = 6;                   // Consensus step
  
  // Vote counts
  int64 total_votes = 7;            // Total number of votes
  int64 yes_votes = 8;              // Number of yes votes
  int64 no_votes = 9;               // Number of no votes
  int64 abstain_votes = 10;         // Number of abstain votes
  int64 nil_votes = 11;             // Number of nil votes
  
  // Vote results
  bool is_majority = 12;            // Whether majority is reached
  bool is_supermajority = 13;       // Whether supermajority is reached
  bool is_unanimous = 14;           // Whether unanimous
  VoteValue result = 15;            // Vote result
  
  // Vote set metadata
  int64 creation_time = 16;         // Vote set creation time
  int64 completion_time = 17;       // Vote set completion time
  repeated Vote votes = 18;         // Individual votes
  map<string, string> metadata = 19; // Additional metadata
}

// MsgCastVote casts a consensus vote
message MsgCastVote {
  string creator = 1;               // Voter address (sdk.Address)
  string target_id = 2;             // Target being voted on
  VoteType vote_type = 3;           // Type of vote
  VoteValue vote_value = 4;         // Vote value
  int64 height = 5;                 // Block height
  int64 round = 6;                  // Consensus round
  string signature = 7;             // Vote signature
  string reason = 8;                // Vote reason
  map<string, string> metadata = 9; // Additional metadata
}

// MsgCastVoteResponse returns the vote result
message MsgCastVoteResponse {
  bool success = 1;                 // Vote success status
  string vote_id = 2;               // Created vote ID
}

// MsgUpdateVote updates an existing vote
message MsgUpdateVote {
  string creator = 1;               // Voter address (sdk.Address)
  string vote_id = 2;               // Vote ID to update
  VoteValue new_vote_value = 3;     // New vote value
  string reason = 4;                // Update reason
  string new_signature = 5;         // New signature
}

// MsgUpdateVoteResponse returns the update result
message MsgUpdateVoteResponse {
  bool success = 1;                 // Update success status
}

// MsgRetractVote retracts a vote
message MsgRetractVote {
  string creator = 1;               // Voter address (sdk.Address)
  string vote_id = 2;               // Vote ID to retract
  string reason = 3;                // Retraction reason
}

// MsgRetractVoteResponse returns the retraction result
message MsgRetractVoteResponse {
  bool success = 1;                 // Retraction success status
}

// MsgCreateVoteSet creates a new vote set
message MsgCreateVoteSet {
  string creator = 1;               // Creator address (sdk.Address)
  string target_id = 2;             // Target being voted on
  VoteType vote_type = 3;           // Type of votes
  int64 height = 4;                 // Block height
  int64 round = 5;                  // Consensus round
  int64 step = 6;                   // Consensus step
  map<string, string> metadata = 7; // Additional metadata
}

// MsgCreateVoteSetResponse returns the vote set result
message MsgCreateVoteSetResponse {
  bool success = 1;                 // Creation success status
  string vote_set_id = 2;           // Created vote set ID
}
