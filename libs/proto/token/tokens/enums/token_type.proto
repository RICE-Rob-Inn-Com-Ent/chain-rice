syntax = "proto3";

package blockchain.tokens.enums;

option go_package = "github.com/chainrice/proto/blockchain/tokens/enums";

// TokenType defines the different types of blockchain tokens
enum TokenType {
  // TOKEN_TYPE_UNSPECIFIED indicates an unspecified token type
  TOKEN_TYPE_UNSPECIFIED = 0;
  
  // TOKEN_TYPE_NATIVE represents a native blockchain token
  TOKEN_TYPE_NATIVE = 1;
  
  // TOKEN_TYPE_ERC20 represents an ERC-20 token
  TOKEN_TYPE_ERC20 = 2;
  
  // TOKEN_TYPE_ERC721 represents an ERC-721 NFT token
  TOKEN_TYPE_ERC721 = 3;
  
  // TOKEN_TYPE_ERC1155 represents an ERC-1155 multi-token
  TOKEN_TYPE_ERC1155 = 4;
  
  // TOKEN_TYPE_BEP20 represents a BEP-20 token (BSC)
  TOKEN_TYPE_BEP20 = 5;
  
  // TOKEN_TYPE_BEP721 represents a BEP-721 NFT token (BSC)
  TOKEN_TYPE_BEP721 = 6;
  
  // TOKEN_TYPE_TRC20 represents a TRC-20 token (TRON)
  TOKEN_TYPE_TRC20 = 7;
  
  // TOKEN_TYPE_TRC721 represents a TRC-721 NFT token (TRON)
  TOKEN_TYPE_TRC721 = 8;
  
  // TOKEN_TYPE_SPL represents an SPL token (Solana)
  TOKEN_TYPE_SPL = 9;
  
  // TOKEN_TYPE_CW20 represents a CW20 token (Cosmos)
  TOKEN_TYPE_CW20 = 10;
  
  // TOKEN_TYPE_CW721 represents a CW721 NFT token (Cosmos)
  TOKEN_TYPE_CW721 = 11;
  
  // TOKEN_TYPE_WRAPPED represents a wrapped token
  TOKEN_TYPE_WRAPPED = 12;
  
  // TOKEN_TYPE_STAKING represents a staking token
  TOKEN_TYPE_STAKING = 13;
  
  // TOKEN_TYPE_GOVERNANCE represents a governance token
  TOKEN_TYPE_GOVERNANCE = 14;
  
  // TOKEN_TYPE_UTILITY represents a utility token
  TOKEN_TYPE_UTILITY = 15;
  
  // TOKEN_TYPE_PAYMENT represents a payment token
  TOKEN_TYPE_PAYMENT = 16;
  
  // TOKEN_TYPE_REWARD represents a reward token
  TOKEN_TYPE_REWARD = 17;
  
  // TOKEN_TYPE_LIQUIDITY represents a liquidity token
  TOKEN_TYPE_LIQUIDITY = 18;
  
  // TOKEN_TYPE_DERIVATIVE represents a derivative token
  TOKEN_TYPE_DERIVATIVE = 19;
  
  // TOKEN_TYPE_SYNTHETIC represents a synthetic token
  TOKEN_TYPE_SYNTHETIC = 20;
  
  // TOKEN_TYPE_STABLE_COIN represents a stablecoin
  TOKEN_TYPE_STABLE_COIN = 21;
  
  // TOKEN_TYPE_MEME represents a meme token
  TOKEN_TYPE_MEME = 22;
  
  // TOKEN_TYPE_CUSTOM represents a custom token
  TOKEN_TYPE_CUSTOM = 23;
}
