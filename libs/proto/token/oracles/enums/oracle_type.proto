syntax = "proto3";

package blockchain.oracles.enums;

option go_package = "github.com/chainrice/proto/blockchain/oracles/enums";

// OracleType defines the different types of blockchain oracles
enum OracleType {
  // ORACLE_TYPE_UNSPECIFIED indicates an unspecified oracle type
  ORACLE_TYPE_UNSPECIFIED = 0;
  
  // ORACLE_TYPE_PRICE represents a price oracle for asset prices
  ORACLE_TYPE_PRICE = 1;
  
  // ORACLE_TYPE_WEATHER represents a weather oracle for weather data
  ORACLE_TYPE_WEATHER = 2;
  
  // ORACLE_TYPE_SPORTS represents a sports oracle for sports results
  ORACLE_TYPE_SPORTS = 3;
  
  // ORACLE_TYPE_NEWS represents a news oracle for news feeds
  ORACLE_TYPE_NEWS = 4;
  
  // ORACLE_TYPE_IDENTITY represents an identity oracle for identity verification
  ORACLE_TYPE_IDENTITY = 5;
  
  // ORACLE_TYPE_RANDOMNESS represents a randomness oracle for random numbers
  ORACLE_TYPE_RANDOMNESS = 6;
  
  // ORACLE_TYPE_COMPUTATION represents a computation oracle for off-chain computation
  ORACLE_TYPE_COMPUTATION = 7;
  
  // ORACLE_TYPE_BRIDGE represents a bridge oracle for cross-chain data
  ORACLE_TYPE_BRIDGE = 8;
  
  // ORACLE_TYPE_SOCIAL represents a social oracle for social media data
  ORACLE_TYPE_SOCIAL = 9;
  
  // ORACLE_TYPE_IOT represents an IoT oracle for IoT device data
  ORACLE_TYPE_IOT = 10;
  
  // ORACLE_TYPE_FINANCIAL represents a financial oracle for financial data
  ORACLE_TYPE_FINANCIAL = 11;
  
  // ORACLE_TYPE_HEALTH represents a health oracle for health data
  ORACLE_TYPE_HEALTH = 12;
  
  // ORACLE_TYPE_ENERGY represents an energy oracle for energy data
  ORACLE_TYPE_ENERGY = 13;
  
  // ORACLE_TYPE_TRANSPORT represents a transport oracle for transport data
  ORACLE_TYPE_TRANSPORT = 14;
  
  // ORACLE_TYPE_EDUCATION represents an education oracle for education data
  ORACLE_TYPE_EDUCATION = 15;
  
  // ORACLE_TYPE_GOVERNMENT represents a government oracle for government data
  ORACLE_TYPE_GOVERNMENT = 16;
  
  // ORACLE_TYPE_CUSTOM represents a custom oracle for specific use cases
  ORACLE_TYPE_CUSTOM = 17;
}
