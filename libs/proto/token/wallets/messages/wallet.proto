syntax = "proto3";

package blockchain.wallets.messages;

import "blockchain/wallets/enums/wallet_type.proto";
import "blockchain/wallets/enums/wallet_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/wallets/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// Wallet represents a blockchain wallet
message Wallet {
  string id = 1;                    // Unique wallet identifier
  string address = 2;               // Wallet address
  string name = 3;                  // Wallet name
  string description = 4;           // Wallet description
  string owner = 5;                 // Wallet owner address (sdk.Address)
  int64 timestamp = 6;              // Wallet creation timestamp
  
  // Wallet classification
  blockchain.wallets.enums.WalletType wallet_type = 7; // Type of wallet
  blockchain.wallets.enums.WalletStatus status = 8; // Current wallet status
  
  // Wallet configuration
  string wallet_version = 9;        // Wallet version
  string network_id = 10;           // Network identifier
  repeated string supported_chains = 11; // Supported blockchain networks
  string default_chain = 12;        // Default blockchain network
  
  // Wallet security
  string encryption_method = 13;    // Encryption method used
  bool is_encrypted = 14;           // Whether wallet is encrypted
  bool is_backed_up = 15;           // Whether wallet is backed up
  string backup_location = 16;      // Backup location
  int64 last_backup = 17;           // Last backup timestamp
  
  // Wallet access control
  bool is_public = 18;              // Whether wallet is public
  repeated string authorized_users = 19; // Authorized user addresses
  string access_level = 20;         // Access level
  int64 session_timeout = 21;       // Session timeout in seconds
  
  // Wallet balances
  repeated Coin balances = 22;      // Token balances
  string total_balance = 23;        // Total balance value
  string locked_balance = 24;       // Locked balance
  string available_balance = 25;    // Available balance
  
  // Wallet functionality
  bool can_send = 26;               // Whether wallet can send tokens
  bool can_receive = 27;            // Whether wallet can receive tokens
  bool can_stake = 28;              // Whether wallet can stake tokens
  bool can_delegate = 29;           // Whether wallet can delegate tokens
  bool can_swap = 30;               // Whether wallet can swap tokens
  
  // Wallet permissions
  string owner_permissions = 31;    // Owner permissions
  string admin_permissions = 32;    // Admin permissions
  string user_permissions = 33;     // User permissions
  repeated string restricted_functions = 34; // Restricted functions
  
  // Wallet limits
  string daily_send_limit = 35;     // Daily send limit
  string daily_receive_limit = 36;  // Daily receive limit
  string transaction_limit = 37;    // Transaction limit
  string gas_limit = 38;            // Gas limit
  
  // Wallet fees
  repeated Coin fees = 39;          // Wallet fees
  string fee_percentage = 40;       // Fee percentage
  string gas_price = 41;            // Gas price
  string priority_fee = 42;         // Priority fee
  
  // Wallet metadata
  string logo_url = 43;             // Wallet logo URL
  string website = 44;              // Wallet website
  string documentation = 45;        // Documentation URL
  string support_url = 46;          // Support URL
  string github_repo = 47;          // GitHub repository
  
  // Wallet usage statistics
  int64 total_transactions = 48;    // Total transactions
  int64 successful_transactions = 49; // Successful transactions
  int64 failed_transactions = 50;   // Failed transactions
  string total_volume = 51;         // Total transaction volume
  string average_transaction_amount = 52; // Average transaction amount
  
  // Wallet performance metrics
  string response_time = 53;        // Average response time
  string uptime_percentage = 54;    // Uptime percentage
  string error_rate = 55;           // Error rate
  int64 last_activity = 56;         // Last activity timestamp
  
  // Wallet compliance
  bool kyc_verified = 57;           // Whether KYC is verified
  bool aml_verified = 58;           // Whether AML is verified
  string compliance_level = 59;     // Compliance level
  repeated string compliance_documents = 60; // Compliance documents
  
  // Wallet metadata and attributes
  map<string, string> metadata = 61; // Additional metadata
  repeated string tags = 62;        // Wallet tags
  string category = 63;             // Wallet category
  int64 last_updated = 64;          // Last update timestamp
  int64 expiry_time = 65;           // Wallet expiry timestamp
}

// WalletParams defines the parameters for the wallets module
message WalletParams {
  string authority = 1;             // Module authority address
  repeated Coin default_fees = 2;   // Default wallet fees
  string max_wallets_per_address = 3; // Maximum wallets per address
  string default_gas_limit = 4;     // Default gas limit
  string max_transaction_amount = 5; // Maximum transaction amount
  bool require_kyc = 6;             // Whether KYC is required
  bool require_aml = 7;             // Whether AML is required
  string security_threshold = 8;    // Security score threshold
  int64 session_timeout = 9;        // Default session timeout
}

// MsgCreateWallet creates a new wallet
message MsgCreateWallet {
  string creator = 1;               // Creator address (sdk.Address)
  string name = 2;                  // Wallet name
  string description = 3;           // Wallet description
  blockchain.wallets.enums.WalletType wallet_type = 4; // Wallet type
  string network_id = 5;            // Network identifier
  repeated string supported_chains = 6; // Supported chains
  bool is_public = 7;               // Whether wallet is public
  map<string, string> metadata = 8; // Additional metadata
}

// MsgCreateWalletResponse returns the created wallet
message MsgCreateWalletResponse {
  string wallet_id = 1;             // Created wallet ID
  string wallet_address = 2;        // Wallet address
  string mnemonic = 3;              // Wallet mnemonic (encrypted)
}

// MsgUpdateWallet updates an existing wallet
message MsgUpdateWallet {
  string creator = 1;               // Updater address (sdk.Address)
  string wallet_id = 2;             // Wallet ID to update
  string name = 3;                  // Updated name
  string description = 4;           // Updated description
  repeated string supported_chains = 5; // Updated supported chains
  map<string, string> metadata = 6; // Updated metadata
}

// MsgUpdateWalletResponse returns the update result
message MsgUpdateWalletResponse {
  bool success = 1;                 // Update success status
}

// MsgLockWallet locks a wallet
message MsgLockWallet {
  string creator = 1;               // Locker address (sdk.Address)
  string wallet_id = 2;             // Wallet ID to lock
  string reason = 3;                // Lock reason
}

// MsgLockWalletResponse returns the lock result
message MsgLockWalletResponse {
  bool success = 1;                 // Lock success status
}

// MsgUnlockWallet unlocks a wallet
message MsgUnlockWallet {
  string creator = 1;               // Unlocker address (sdk.Address)
  string wallet_id = 2;             // Wallet ID to unlock
  string password = 3;              // Wallet password
  string reason = 4;                // Unlock reason
}

// MsgUnlockWalletResponse returns the unlock result
message MsgUnlockWalletResponse {
  bool success = 1;                 // Unlock success status
}

// MsgBackupWallet backs up a wallet
message MsgBackupWallet {
  string creator = 1;               // Backer address (sdk.Address)
  string wallet_id = 2;             // Wallet ID to backup
  string backup_location = 3;       // Backup location
  string backup_type = 4;           // Backup type
}

// MsgBackupWalletResponse returns the backup result
message MsgBackupWalletResponse {
  bool success = 1;                 // Backup success status
  string backup_id = 2;             // Created backup ID
}

// MsgRestoreWallet restores a wallet
message MsgRestoreWallet {
  string creator = 1;               // Restorer address (sdk.Address)
  string backup_id = 2;             // Backup ID to restore
  string new_wallet_name = 3;       // New wallet name
  string password = 4;              // Wallet password
}

// MsgRestoreWalletResponse returns the restore result
message MsgRestoreWalletResponse {
  bool success = 1;                 // Restore success status
  string wallet_id = 2;             // Restored wallet ID
}
