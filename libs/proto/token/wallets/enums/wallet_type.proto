syntax = "proto3";

package blockchain.wallets.enums;

option go_package = "github.com/chainrice/proto/blockchain/wallets/enums";

// WalletType defines the different types of blockchain wallets
enum WalletType {
  // WALLET_TYPE_UNSPECIFIED indicates an unspecified wallet type
  WALLET_TYPE_UNSPECIFIED = 0;
  
  // WALLET_TYPE_SOFTWARE represents a software wallet
  WALLET_TYPE_SOFTWARE = 1;
  
  // WALLET_TYPE_HARDWARE represents a hardware wallet
  WALLET_TYPE_HARDWARE = 2;
  
  // WALLET_TYPE_PAPER represents a paper wallet
  WALLET_TYPE_PAPER = 3;
  
  // WALLET_TYPE_MOBILE represents a mobile wallet
  WALLET_TYPE_MOBILE = 4;
  
  // WALLET_TYPE_WEB represents a web wallet
  WALLET_TYPE_WEB = 5;
  
  // WALLET_TYPE_DESKTOP represents a desktop wallet
  WALLET_TYPE_DESKTOP = 6;
  
  // WALLET_TYPE_CUSTODIAL represents a custodial wallet
  WALLET_TYPE_CUSTODIAL = 7;
  
  // WALLET_TYPE_NON_CUSTODIAL represents a non-custodial wallet
  WALLET_TYPE_NON_CUSTODIAL = 8;
  
  // WALLET_TYPE_MULTI_SIG represents a multi-signature wallet
  WALLET_TYPE_MULTI_SIG = 9;
  
  // WALLET_TYPE_SMART_CONTRACT represents a smart contract wallet
  WALLET_TYPE_SMART_CONTRACT = 10;
  
  // WALLET_TYPE_ENTERPRISE represents an enterprise wallet
  WALLET_TYPE_ENTERPRISE = 11;
  
  // WALLET_TYPE_INSTITUTIONAL represents an institutional wallet
  WALLET_TYPE_INSTITUTIONAL = 12;
  
  // WALLET_TYPE_EXCHANGE represents an exchange wallet
  WALLET_TYPE_EXCHANGE = 13;
  
  // WALLET_TYPE_DEFI represents a DeFi wallet
  WALLET_TYPE_DEFI = 14;
  
  // WALLET_TYPE_NFT represents an NFT wallet
  WALLET_TYPE_NFT = 15;
  
  // WALLET_TYPE_GAMING represents a gaming wallet
  WALLET_TYPE_GAMING = 16;
  
  // WALLET_TYPE_SOCIAL represents a social wallet
  WALLET_TYPE_SOCIAL = 17;
  
  // WALLET_TYPE_PAYMENT represents a payment wallet
  WALLET_TYPE_PAYMENT = 18;
  
  // WALLET_TYPE_SAVINGS represents a savings wallet
  WALLET_TYPE_SAVINGS = 19;
  
  // WALLET_TYPE_TRADING represents a trading wallet
  WALLET_TYPE_TRADING = 20;
  
  // WALLET_TYPE_STAKING represents a staking wallet
  WALLET_TYPE_STAKING = 21;
  
  // WALLET_TYPE_CUSTOM represents a custom wallet
  WALLET_TYPE_CUSTOM = 22;
}
