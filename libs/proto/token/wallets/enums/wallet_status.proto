syntax = "proto3";

package blockchain.wallets.enums;

option go_package = "github.com/chainrice/proto/blockchain/wallets/enums";

// WalletStatus defines the status of blockchain wallets
enum WalletStatus {
  // WALLET_STATUS_UNSPECIFIED indicates an unspecified wallet status
  WALLET_STATUS_UNSPECIFIED = 0;
  
  // WALLET_STATUS_ACTIVE indicates the wallet is active and operational
  WALLET_STATUS_ACTIVE = 1;
  
  // WALLET_STATUS_INACTIVE indicates the wallet is inactive
  WALLET_STATUS_INACTIVE = 2;
  
  // WALLET_STATUS_PENDING indicates the wallet is pending activation
  WALLET_STATUS_PENDING = 3;
  
  // WALLET_STATUS_SUSPENDED indicates the wallet is suspended
  WALLET_STATUS_SUSPENDED = 4;
  
  // WALLET_STATUS_DEPRECATED indicates the wallet is deprecated
  WALLET_STATUS_DEPRECATED = 5;
  
  // WALLET_STATUS_MAINTENANCE indicates the wallet is under maintenance
  WALLET_STATUS_MAINTENANCE = 6;
  
  // WALLET_STATUS_ERROR indicates the wallet is in error state
  WALLET_STATUS_ERROR = 7;
  
  // WALLET_STATUS_UPDATING indicates the wallet is being updated
  WALLET_STATUS_UPDATING = 8;
  
  // WALLET_STATUS_SYNCING indicates the wallet is syncing data
  WALLET_STATUS_SYNCING = 9;
  
  // WALLET_STATUS_OFFLINE indicates the wallet is offline
  WALLET_STATUS_OFFLINE = 10;
  
  // WALLET_STATUS_LOCKED indicates the wallet is locked
  WALLET_STATUS_LOCKED = 11;
  
  // WALLET_STATUS_UNLOCKED indicates the wallet is unlocked
  WALLET_STATUS_UNLOCKED = 12;
  
  // WALLET_STATUS_FROZEN indicates the wallet is frozen
  WALLET_STATUS_FROZEN = 13;
  
  // WALLET_STATUS_VERIFIED indicates the wallet is verified
  WALLET_STATUS_VERIFIED = 14;
  
  // WALLET_STATUS_UNVERIFIED indicates the wallet is unverified
  WALLET_STATUS_UNVERIFIED = 15;
  
  // WALLET_STATUS_TRUSTED indicates the wallet is trusted
  WALLET_STATUS_TRUSTED = 16;
  
  // WALLET_STATUS_UNTRUSTED indicates the wallet is untrusted
  WALLET_STATUS_UNTRUSTED = 17;
  
  // WALLET_STATUS_WHITELISTED indicates the wallet is whitelisted
  WALLET_STATUS_WHITELISTED = 18;
  
  // WALLET_STATUS_BLACKLISTED indicates the wallet is blacklisted
  WALLET_STATUS_BLACKLISTED = 19;
  
  // WALLET_STATUS_COMPROMISED indicates the wallet is compromised
  WALLET_STATUS_COMPROMISED = 20;
  
  // WALLET_STATUS_RECOVERED indicates the wallet is recovered
  WALLET_STATUS_RECOVERED = 21;
}
