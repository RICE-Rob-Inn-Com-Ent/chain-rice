syntax = "proto3";

package blockchain.storage.messages;

import "blockchain/storage/enums/storage_type.proto";
import "blockchain/storage/enums/storage_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/storage/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// StorageRecord represents a blockchain storage record
message StorageRecord {
  string id = 1;                    // Unique storage record identifier
  string key = 2;                   // Storage key
  string value = 3;                 // Storage value
  string hash = 4;                  // Record hash
  string owner = 5;                 // Record owner address (sdk.Address)
  int64 timestamp = 6;              // Record creation timestamp
  
  // Storage classification
  blockchain.storage.enums.StorageType storage_type = 7; // Type of storage
  blockchain.storage.enums.StorageStatus status = 8; // Current storage status
  
  // Storage location
  string storage_location = 9;      // Storage location/endpoint
  string storage_provider = 10;     // Storage provider
  string storage_path = 11;         // Storage path
  string storage_url = 12;          // Storage URL
  
  // Data information
  string data_type = 13;            // Data type (JSON, binary, text, etc.)
  string data_size = 14;            // Data size in bytes
  string data_format = 15;          // Data format
  string compression = 16;          // Compression method used
  string encryption = 17;           // Encryption method used
  
  // Access control
  bool is_public = 18;              // Whether record is public
  repeated string authorized_addresses = 19; // Authorized access addresses
  string access_permissions = 20;   // Access permissions
  int64 expiry_time = 21;           // Record expiry timestamp
  
  // Versioning and history
  string version = 22;              // Record version
  string previous_version = 23;     // Previous version hash
  int64 version_timestamp = 24;     // Version creation timestamp
  repeated string version_history = 25; // Version history hashes
  
  // Replication and redundancy
  int64 replication_factor = 26;    // Replication factor
  repeated string replica_locations = 27; // Replica storage locations
  bool is_replicated = 28;          // Whether record is replicated
  string redundancy_level = 29;     // Redundancy level
  
  // Performance metrics
  int64 access_count = 30;          // Number of accesses
  int64 last_accessed = 31;         // Last access timestamp
  string average_access_time = 32;  // Average access time
  string throughput = 33;           // Storage throughput
  
  // Cost and billing
  repeated Coin storage_cost = 34;  // Storage cost
  repeated Coin access_cost = 35;   // Access cost
  string billing_model = 36;        // Billing model
  string cost_per_gb = 37;          // Cost per GB
  
  // Metadata and tags
  map<string, string> metadata = 38; // Additional metadata
  repeated string tags = 39;        // Record tags
  string category = 40;             // Record category
  string description = 41;          // Record description
  
  // Audit and compliance
  bool is_auditable = 42;           // Whether record is auditable
  string compliance_level = 43;     // Compliance level
  repeated string audit_log = 44;   // Audit log entries
  string retention_policy = 45;     // Retention policy
  
  // Backup and recovery
  bool is_backed_up = 46;           // Whether record is backed up
  string backup_location = 47;      // Backup location
  int64 last_backup = 48;           // Last backup timestamp
  string recovery_time = 49;        // Recovery time objective
}

// StorageParams defines the parameters for the storage module
message StorageParams {
  string authority = 1;             // Module authority address
  repeated Coin default_storage_fees = 2; // Default storage fees
  string max_record_size = 3;       // Maximum record size
  string max_total_storage = 4;     // Maximum total storage per user
  int64 default_replication_factor = 5; // Default replication factor
  int64 default_retention_period = 6; // Default retention period
  bool require_encryption = 7;      // Whether encryption is required
  string default_storage_provider = 8; // Default storage provider
  string storage_policy = 9;        // Storage policy (JSON)
}

// MsgCreateStorageRecord creates a new storage record
message MsgCreateStorageRecord {
  string creator = 1;               // Creator address (sdk.Address)
  string key = 2;                   // Storage key
  string value = 3;                 // Storage value
  blockchain.storage.enums.StorageType storage_type = 4; // Storage type
  string storage_location = 5;      // Storage location
  bool is_public = 6;               // Whether record is public
  int64 expiry_time = 7;            // Expiry timestamp
  map<string, string> metadata = 8; // Additional metadata
}

// MsgCreateStorageRecordResponse returns the created storage record
message MsgCreateStorageRecordResponse {
  string record_id = 1;             // Created record ID
  string storage_hash = 2;          // Storage hash
}

// MsgUpdateStorageRecord updates an existing storage record
message MsgUpdateStorageRecord {
  string creator = 1;               // Updater address (sdk.Address)
  string record_id = 2;             // Record ID to update
  string new_value = 3;             // New value
  map<string, string> metadata = 4; // Updated metadata
  string update_reason = 5;         // Update reason
}

// MsgUpdateStorageRecordResponse returns the update result
message MsgUpdateStorageRecordResponse {
  bool success = 1;                 // Update success status
  string new_version_hash = 2;      // New version hash
}

// MsgDeleteStorageRecord deletes a storage record
message MsgDeleteStorageRecord {
  string creator = 1;               // Deleter address (sdk.Address)
  string record_id = 2;             // Record ID to delete
  string deletion_reason = 3;       // Deletion reason
  bool permanent = 4;               // Whether deletion is permanent
}

// MsgDeleteStorageRecordResponse returns the deletion result
message MsgDeleteStorageRecordResponse {
  bool success = 1;                 // Deletion success status
}

// MsgReplicateStorageRecord replicates a storage record
message MsgReplicateStorageRecord {
  string creator = 1;               // Replicator address (sdk.Address)
  string record_id = 2;             // Record ID to replicate
  repeated string target_locations = 3; // Target replication locations
  int64 replication_factor = 4;    // Replication factor
}

// MsgReplicateStorageRecordResponse returns the replication result
message MsgReplicateStorageRecordResponse {
  bool success = 1;                 // Replication success status
  repeated string replica_ids = 2;  // Created replica IDs
}

// MsgMigrateStorageRecord migrates a storage record
message MsgMigrateStorageRecord {
  string creator = 1;               // Migrator address (sdk.Address)
  string record_id = 2;             // Record ID to migrate
  string new_storage_location = 3;  // New storage location
  string migration_reason = 4;      // Migration reason
}

// MsgMigrateStorageRecordResponse returns the migration result
message MsgMigrateStorageRecordResponse {
  bool success = 1;                 // Migration success status
  string new_record_id = 2;         // New record ID
}

// MsgBackupStorageRecord backs up a storage record
message MsgBackupStorageRecord {
  string creator = 1;               // Backer address (sdk.Address)
  string record_id = 2;             // Record ID to backup
  string backup_location = 3;       // Backup location
  string backup_type = 4;           // Backup type
}

// MsgBackupStorageRecordResponse returns the backup result
message MsgBackupStorageRecordResponse {
  bool success = 1;                 // Backup success status
  string backup_id = 2;             // Created backup ID
}
