syntax = "proto3";

package blockchain.bridge.services;

import "blockchain/bridge/messages/bridge_connection.proto";
import "blockchain/bridge/messages/bridge_transfer.proto";

option go_package = "github.com/chainrice/proto/blockchain/bridge/services";

// BridgeMsgService handles state-changing bridge operations
service BridgeMsgService {
  // CreateBridgeConnection creates a new bridge connection
  rpc CreateBridgeConnection(blockchain.bridge.messages.MsgCreateBridgeConnection) returns (blockchain.bridge.messages.MsgCreateBridgeConnectionResponse);
  
  // UpdateBridgeConnection updates an existing bridge connection
  rpc UpdateBridgeConnection(blockchain.bridge.messages.MsgUpdateBridgeConnection) returns (blockchain.bridge.messages.MsgUpdateBridgeConnectionResponse);
  
  // DeleteBridgeConnection deletes a bridge connection
  rpc DeleteBridgeConnection(blockchain.bridge.messages.MsgDeleteBridgeConnection) returns (blockchain.bridge.messages.MsgDeleteBridgeConnectionResponse);
  
  // InitiateBridgeTransfer initiates a new bridge transfer
  rpc InitiateBridgeTransfer(blockchain.bridge.messages.MsgInitiateBridgeTransfer) returns (blockchain.bridge.messages.MsgInitiateBridgeTransferResponse);
  
  // ConfirmBridgeTransfer confirms a bridge transfer
  rpc ConfirmBridgeTransfer(blockchain.bridge.messages.MsgConfirmBridgeTransfer) returns (blockchain.bridge.messages.MsgConfirmBridgeTransferResponse);
  
  // CompleteBridgeTransfer completes a bridge transfer
  rpc CompleteBridgeTransfer(blockchain.bridge.messages.MsgCompleteBridgeTransfer) returns (blockchain.bridge.messages.MsgCompleteBridgeTransferResponse);
  
  // CancelBridgeTransfer cancels a bridge transfer
  rpc CancelBridgeTransfer(blockchain.bridge.messages.MsgCancelBridgeTransfer) returns (blockchain.bridge.messages.MsgCancelBridgeTransferResponse);
  
  // RefundBridgeTransfer refunds a failed bridge transfer
  rpc RefundBridgeTransfer(blockchain.bridge.messages.MsgRefundBridgeTransfer) returns (blockchain.bridge.messages.MsgRefundBridgeTransferResponse);
}

// BridgeQueryService handles bridge state queries
service BridgeQueryService {
  // GetBridgeConnection retrieves a specific bridge connection
  rpc GetBridgeConnection(GetBridgeConnectionRequest) returns (GetBridgeConnectionResponse);
  
  // ListBridgeConnections lists all bridge connections with pagination
  rpc ListBridgeConnections(ListBridgeConnectionsRequest) returns (ListBridgeConnectionsResponse);
  
  // GetBridgeTransfer retrieves a specific bridge transfer
  rpc GetBridgeTransfer(GetBridgeTransferRequest) returns (GetBridgeTransferResponse);
  
  // ListBridgeTransfers lists bridge transfers with pagination and filters
  rpc ListBridgeTransfers(ListBridgeTransfersRequest) returns (ListBridgeTransfersResponse);
  
  // GetBridgeParams retrieves bridge module parameters
  rpc GetBridgeParams(GetBridgeParamsRequest) returns (GetBridgeParamsResponse);
  
  // GetBridgeStats retrieves bridge statistics
  rpc GetBridgeStats(GetBridgeStatsRequest) returns (GetBridgeStatsResponse);
  
  // GetSupportedTokens retrieves supported tokens for a bridge
  rpc GetSupportedTokens(GetSupportedTokensRequest) returns (GetSupportedTokensResponse);
  
  // GetBridgeFees calculates bridge fees for a transfer
  rpc GetBridgeFees(GetBridgeFeesRequest) returns (GetBridgeFeesResponse);
  
  // GetBridgeStatus retrieves the status of a bridge
  rpc GetBridgeStatus(GetBridgeStatusRequest) returns (GetBridgeStatusResponse);
  
  // ListPendingTransfers lists pending transfers for a bridge
  rpc ListPendingTransfers(ListPendingTransfersRequest) returns (ListPendingTransfersResponse);
}

// Query request and response messages

message GetBridgeConnectionRequest {
  string bridge_id = 1; // Bridge connection ID
}

message GetBridgeConnectionResponse {
  blockchain.bridge.messages.BridgeConnection bridge = 1;
}

message ListBridgeConnectionsRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string source_chain_id = 3; // Filter by source chain ID
  string destination_chain_id = 4; // Filter by destination chain ID
}

message ListBridgeConnectionsResponse {
  repeated blockchain.bridge.messages.BridgeConnection bridges = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetBridgeTransferRequest {
  string transfer_id = 1; // Transfer ID
}

message GetBridgeTransferResponse {
  blockchain.bridge.messages.BridgeTransfer transfer = 1;
}

message ListBridgeTransfersRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string bridge_id = 3;      // Filter by bridge ID
  string sender = 4;         // Filter by sender address
  string recipient = 5;      // Filter by recipient address
  string status = 6;         // Filter by transfer status
  int64 start_time = 7;      // Filter by start time
  int64 end_time = 8;        // Filter by end time
}

message ListBridgeTransfersResponse {
  repeated blockchain.bridge.messages.BridgeTransfer transfers = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetBridgeParamsRequest {
  // No parameters needed
}

message GetBridgeParamsResponse {
  blockchain.bridge.messages.BridgeParams params = 1;
}

message GetBridgeStatsRequest {
  string bridge_id = 1; // Optional bridge ID for specific stats
}

message GetBridgeStatsResponse {
  int64 total_transfers = 1;        // Total number of transfers
  int64 successful_transfers = 2;   // Number of successful transfers
  int64 failed_transfers = 3;       // Number of failed transfers
  int64 pending_transfers = 4;      // Number of pending transfers
  string total_volume = 5;          // Total transfer volume
  string total_fees = 6;            // Total fees collected
  int64 last_transfer_time = 7;     // Timestamp of last transfer
}

message GetSupportedTokensRequest {
  string bridge_id = 1; // Bridge ID
}

message GetSupportedTokensResponse {
  repeated blockchain.bridge.messages.Coin tokens = 1;
}

message GetBridgeFeesRequest {
  string bridge_id = 1;             // Bridge ID
  repeated blockchain.bridge.messages.Coin amount = 2; // Transfer amount
  string destination_chain_id = 3;  // Destination chain ID
}

message GetBridgeFeesResponse {
  repeated blockchain.bridge.messages.Coin fees = 1;
  repeated blockchain.bridge.messages.Coin gas_costs = 2;
  string total_cost = 3; // Total cost including fees and gas
}

message GetBridgeStatusRequest {
  string bridge_id = 1; // Bridge ID
}

message GetBridgeStatusResponse {
  string status = 1;                // Bridge status
  bool operational = 2;             // Whether bridge is operational
  string last_health_check = 3;     // Last health check timestamp
  string error_message = 4;         // Error message if any
  int64 uptime = 5;                 // Bridge uptime in seconds
}

message ListPendingTransfersRequest {
  string bridge_id = 1;             // Bridge ID
  string pagination_key = 2;        // Pagination key
  int32 limit = 3;                  // Number of results per page
}

message ListPendingTransfersResponse {
  repeated blockchain.bridge.messages.BridgeTransfer transfers = 1;
  string next_pagination_key = 2;   // Key for next page
}
