syntax = "proto3";

package blockchain.bridge.enums;

option go_package = "github.com/chainrice/proto/blockchain/bridge/enums";

// BridgeDirection defines the direction of bridge operations
enum BridgeDirection {
  // BRIDGE_DIRECTION_UNSPECIFIED indicates an unspecified bridge direction
  BRIDGE_DIRECTION_UNSPECIFIED = 0;
  
  // BRIDGE_DIRECTION_INBOUND represents incoming transfers to the chain
  BRIDGE_DIRECTION_INBOUND = 1;
  
  // BRIDGE_DIRECTION_OUTBOUND represents outgoing transfers from the chain
  BRIDGE_DIRECTION_OUTBOUND = 2;
  
  // BRIDGE_DIRECTION_BIDIRECTIONAL represents bidirectional transfers
  BRIDGE_DIRECTION_BIDIRECTIONAL = 3;
  
  // BRIDGE_DIRECTION_LOCK_ONLY represents lock-only operations (no unlock)
  BRIDGE_DIRECTION_LOCK_ONLY = 4;
  
  // BRIDGE_DIRECTION_BURN_ONLY represents burn-only operations (no mint)
  BRIDGE_DIRECTION_BURN_ONLY = 5;
}
