// Blockchain module index - This file serves as the main entry point for all blockchain-related
// protobuf definitions. It imports all enums, messages, and services from the blockchain module
// submodules, making them available for use in Cosmos SDK applications.
//
// The blockchain module is organized into the following submodules:
//
// 1. Bridge Module (blockchain.bridge.*)
//    - Handles cross-chain bridge operations and transfers
//    - Enums: BridgeType, BridgeStatus, BridgeDirection
//    - Messages: BridgeConnection, BridgeTransfer
//    - Services: BridgeMsgService, BridgeQueryService
//
// 2. Consensus Module (blockchain.consensus.*)
//    - Manages blockchain consensus mechanisms and validation
//    - Enums: ConsensusAlgorithm, ConsensusStatus
//    - Messages: Node, Block, Vote
//    - Services: ConsensusMsgService, ConsensusQueryService
//
// 3. Governance Module (blockchain.governance.*)
//    - Handles governance proposals and voting
//    - Enums: ProposalType, ProposalStatus
//    - Messages: Proposal, Vote
//    - Services: GovernanceMsgService, GovernanceQueryService
//
// 4. Identity Module (blockchain.identity.*)
//    - Manages blockchain identities and credentials
//    - Enums: IdentityType, IdentityStatus
//    - Messages: Identity, Credential
//    - Services: IdentityMsgService, IdentityQueryService
//
// 5. Ledger Module (blockchain.ledger.*)
//    - Handles transaction processing and blockchain state
//    - Enums: TransactionType, TransactionStatus
//    - Messages: Transaction, BlockchainState
//    - Services: LedgerMsgService, LedgerQueryService
//
// 6. Oracles Module (blockchain.oracles.*)
//    - Manages oracle services and data feeds
//    - Enums: OracleType, OracleStatus
//    - Messages: Oracle, OracleData
//    - Services: OracleMsgService, OracleQueryService
//
// 7. Smart Contracts Module (blockchain.smart-contracts.*)
//    - Handles smart contract deployment and execution
//    - Enums: ContractType, ContractStatus
//    - Messages: SmartContract, ContractEvent
//    - Services: SmartContractMsgService, SmartContractQueryService
//
// 8. Storage Module (blockchain.storage.*)
//    - Manages blockchain storage and data persistence
//    - Enums: StorageType, StorageStatus
//    - Messages: StorageRecord
//    - Services: StorageMsgService, StorageQueryService
//
// 9. Tokens Module (blockchain.tokens.*)
//    - Handles token creation, management, and transfers
//    - Enums: TokenType, TokenStatus
//    - Messages: Token, TokenTransfer
//    - Services: TokenMsgService, TokenQueryService
//
// 10. Wallets Module (blockchain.wallets.*)
//     - Manages wallet creation, operations, and transactions
//     - Enums: WalletType, WalletStatus
//     - Messages: Wallet, WalletTransaction
//     - Services: WalletMsgService, WalletQueryService
//
// All modules follow Cosmos SDK conventions and include:
// - State-changing operations (MsgService)
// - State queries (QueryService)
// - Proper message definitions with sdk.Address types
// - Coin types for token/asset transfers
// - Comprehensive parameter definitions
// - Full CRUD operations with request/response messages
// - Business logic RPCs with appropriate filtering and pagination
//
// Usage:
// To use any of these definitions in your Cosmos SDK application, simply import
// this index.proto file and reference the specific types you need.
// Example: import "blockchain/index.proto" and use blockchain.bridge.messages.BridgeConnection
//
// This module is designed to be fully compatible with Cosmos SDK v0.50+ and
// follows all current best practices for protobuf v3 definitions.
