syntax = "proto3";

package marketing.campaings.messages;

import "google/protobuf/timestamp.proto";
import "marketing/campaings/enums/campaign_status.proto";

// Campaign data transfer object
message Campaign {
  // Campaign ID
  string id = 1;
  
  // Campaign name
  string name = 2;
  
  // Campaign description
  string description = 3;
  
  // Campaign objective
  string objective = 4;
  
  // Target audience
  string target_audience = 5;
  
  // Budget allocated for the campaign
  double budget = 6;
  
  // Campaign status
  marketing.campaings.enums.CampaignStatus status = 7;
  
  // Start date for the campaign
  google.protobuf.Timestamp start_date = 8;
  
  // End date for the campaign
  google.protobuf.Timestamp end_date = 9;
  
  // Campaign tags
  repeated string tags = 10;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 11;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 12;
  
  // Campaign performance metrics
  CampaignMetrics metrics = 13;
}

// Campaign performance metrics
message CampaignMetrics {
  // Total impressions
  int64 total_impressions = 1;
  
  // Total clicks
  int64 total_clicks = 2;
  
  // Total conversions
  int64 total_conversions = 3;
  
  // Click-through rate
  double ctr = 4;
  
  // Conversion rate
  double conversion_rate = 5;
  
  // Cost per click
  double cpc = 6;
  
  // Cost per acquisition
  double cpa = 7;
  
  // Total spend
  double total_spend = 8;
  
  // Return on ad spend
  double roas = 9;
  
  // Number of ads in campaign
  int32 ads_count = 10;
}

// Response message for creating a campaign
message CreateCampaignResponse {
  // Created campaign
  Campaign campaign = 1;
  
  // Success message
  string message = 2;
}

// Response message for getting a campaign
message GetCampaignResponse {
  // Campaign data
  Campaign campaign = 1;
}

// Response message for listing campaigns
message ListCampaignResponse {
  // List of campaigns
  repeated Campaign campaigns = 1;
  
  // Total count of campaigns
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Number of items per page
  int32 page_size = 4;
}

// Response message for updating a campaign
message UpdateCampaignResponse {
  // Updated campaign
  Campaign campaign = 1;
  
  // Success message
  string message = 2;
}

// Response message for deleting a campaign
message DeleteCampaignResponse {
  // Success message
  string message = 1;
}
