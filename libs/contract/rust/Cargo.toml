[package]
name = "chain_rice_smart_contract"
version = "1.0.0"
edition = "2021"
authors = ["Code-Rice <infocoderice@gmail.com>"]
description = "Chain Rice Smart Contract with full integration"
license = "MIT"

[dependencies]
# === CosmWasm core ===
cosmwasm-std = "1.5.0"
cosmwasm-storage = "1.5.0"
cosmwasm-schema = "1.5.0"
cw2 = "0.11.0"
cw0 = "0.10.3"
cw-storage-plus = "0.11.1"

# === Async / HTTP / RPC / gRPC ===
tokio = { version = "1.30", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
protobuf = "4.32.1-release"
tonic = { version = "0.9", features = ["transport"] }

# === Multi-chain bridges (essential) ===
ethers = "2.0.14"       # Ethereum client
web3 = "0.19.0"         # Ethereum alternative
solana-client = "3.0.4" # Solana RPC
cosmrs = "0.4"          # Cosmos SDK client
tendermint-rpc = "0.25" # Tendermint RPC
bitcoin = "0.29"        # Bitcoin core types

# === Utilities ===
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
hex = "0.4.3"

ark-ff = "0"
ark-serialize = "0"
ark-relations = "0"
ark-groth16 = "0"
bellman = "0"
curve25519-dalek = "0"
merkle-light = "0"
bulletproofs = "0"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.0"
serde_json = "1.0"
