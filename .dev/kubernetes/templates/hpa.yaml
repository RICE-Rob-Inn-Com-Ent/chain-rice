{{- range $service := list "backend" "frontend" }}
{{- $config := index $.Values $service }}
{{- if and $config.enabled $config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $config.name | default (printf "rice-%s" $service) }}
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace }}
  labels:
    app: {{ $config.name | default (printf "rice-%s" $service) }}
    component: {{ $service }}
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $config.name | default (printf "rice-%s" $service) }}
  minReplicas: {{ $config.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ $config.autoscaling.maxReplicas | default 10 }}
  metrics:
  {{- if $config.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if $config.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ $config.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  {{- with $config.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
