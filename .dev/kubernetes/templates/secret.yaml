{{- range $service := list "backend" "frontend" "bot" "token" }}
{{- $config := index $.Values $service }}
{{- if $config.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $config.name | default (printf "rice-%s" $service) }}-secrets
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace }}
  labels:
    app: {{ $config.name | default (printf "rice-%s" $service) }}
    component: {{ $service }}
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- if eq $service "backend" }}
  DATABASE_PASSWORD: "changeme"  # Override in production  # pragma: allowlist secret
  JWT_SECRET: "changeme"  # Override in production  # pragma: allowlist secret
  API_KEY: "changeme"  # Override in production  # pragma: allowlist secret
  {{- end }}
  {{- if eq $service "bot" }}
  BOT_TOKEN: "changeme"  # Override in production  # pragma: allowlist secret
  OPENAI_API_KEY: "changeme"  # Override in production  # pragma: allowlist secret
  {{- end }}
  {{- if eq $service "token" }}
  CHAIN_ID: "rice-1"
  VALIDATOR_KEY: "changeme"  # Override in production  # pragma: allowlist secret
  {{- end }}
{{- end }}
{{- end }}
