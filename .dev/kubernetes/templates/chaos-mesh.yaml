---
# Chaos Mesh Installation
# https://chaos-mesh.org/

# Install via Helm:
# helm repo add chaos-mesh https://charts.chaos-mesh.org
# helm install chaos-mesh chaos-mesh/chaos-mesh -n chaos-mesh --create-namespace --set chaosDaemon.runtime=containerd --set chaosDaemon.socketPath=/run/containerd/containerd.sock

---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-testing

---
# Pod Failure Chaos
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-example
  namespace: chaos-testing
spec:
  action: pod-failure
  mode: one # Options: one, all, fixed, fixed-percent, random-max-percent
  duration: "30s"
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp # Target pods with this label
  scheduler:
    cron: "@every 2m" # Run every 2 minutes

---
# Network Chaos - Delay
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay
  namespace: chaos-testing
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  delay:
    latency: "100ms"
    correlation: "25"
    jitter: "10ms"
  duration: "1m"

---
# Network Chaos - Packet Loss
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss
  namespace: chaos-testing
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  loss:
    loss: "25" # 25% packet loss
    correlation: "25"
  duration: "30s"
  direction: to # Options: to, from, both

---
# Network Chaos - Bandwidth Limit
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-bandwidth
  namespace: chaos-testing
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  bandwidth:
    rate: "1mbps"
    limit: 20000
    buffer: 10000
  duration: "1m"

---
# Network Chaos - Partition (Split Brain)
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: frontend
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - default
      labelSelectors:
        app: backend
  duration: "30s"

---
# Stress Chaos - CPU
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  stressors:
    cpu:
      workers: 2
      load: 80 # 80% CPU usage
  duration: "1m"

---
# Stress Chaos - Memory
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  stressors:
    memory:
      workers: 1
      size: "256MB"
  duration: "1m"

---
# IO Chaos - Delay
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-delay
  namespace: chaos-testing
spec:
  action: latency
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  volumePath: /var/lib/myapp
  path: "/var/lib/myapp/**/*"
  delay: "100ms"
  percent: 50 # Apply to 50% of IO operations
  duration: "1m"

---
# IO Chaos - Fault
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: io-fault
  namespace: chaos-testing
spec:
  action: fault
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  volumePath: /var/lib/myapp
  path: "/var/lib/myapp/**/*"
  errno: 5 # EIO - Input/output error
  percent: 10 # Apply to 10% of IO operations
  duration: "30s"

---
# Time Chaos - Clock Skew
apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: time-skew
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  timeOffset: "-1h" # Shift time back 1 hour
  clockIds:
    - CLOCK_REALTIME
  duration: "5m"

---
# Kernel Chaos - Advanced
apiVersion: chaos-mesh.org/v1alpha1
kind: KernelChaos
metadata:
  name: kernel-error
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  failKernRequest:
    callchain:
      - funcname: "should_fail_alloc_page"
    failtype: 0
    probability: 10 # 10% failure rate
  duration: "1m"

---
# DNS Chaos
apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: dns-error
  namespace: chaos-testing
spec:
  action: error
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  patterns:
    - "google.com"
    - "*.example.com"
  duration: "1m"

---
# HTTP Chaos - Abort
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-abort
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  port: 8080
  target: Request
  path: "/api/*"
  abort: true
  duration: "30s"

---
# HTTP Chaos - Delay
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-delay
  namespace: chaos-testing
spec:
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: myapp
  port: 8080
  target: Request
  path: "/api/*"
  delay: "2s"
  duration: "1m"

---
# Workflow - Complex Chaos Scenario
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: complex-chaos-workflow
  namespace: chaos-testing
spec:
  entry: chaos-sequence
  templates:
    - name: chaos-sequence
      templateType: Serial
      deadline: "10m"
      children:
        - pod-failure-step
        - network-delay-step
        - cpu-stress-step

    - name: pod-failure-step
      templateType: PodChaos
      deadline: "1m"
      podChaos:
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: myapp

    - name: network-delay-step
      templateType: NetworkChaos
      deadline: "2m"
      networkChaos:
        action: delay
        mode: all
        selector:
          namespaces:
            - default
          labelSelectors:
            app: myapp
        delay:
          latency: "200ms"

    - name: cpu-stress-step
      templateType: StressChaos
      deadline: "2m"
      stressChaos:
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: myapp
        stressors:
          cpu:
            workers: 4
            load: 90

---
# Schedule - Automated Chaos Testing
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: scheduled-chaos
  namespace: chaos-testing
spec:
  schedule: "0 2 * * *" # Run at 2 AM daily
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: fixed
    value: "1"
    selector:
      namespaces:
        - default
      labelSelectors:
        app: myapp
