---
# Staging Environment Inventory

all:
  children:
    web:
      hosts:
        web01.staging.rice-mono.com:
          ansible_host: 10.1.1.10
        web02.staging.rice-mono.com:
          ansible_host: 10.1.1.11
        web03.staging.rice-mono.com:
          ansible_host: 10.1.1.12

    database:
      hosts:
        db01.staging.rice-mono.com:
          ansible_host: 10.1.2.10
          db_type: postgresql
        db02.staging.rice-mono.com:
          ansible_host: 10.1.2.11
          db_type: postgresql
          db_role: replica

    kubernetes:
      children:
        k8s_master:
          hosts:
            k8s-master[01:03].staging.rice-mono.com:
        k8s_worker:
          hosts:
            k8s-worker[01:05].staging.rice-mono.com:

    monitoring:
      hosts:
        prometheus.staging.rice-mono.com:
        grafana.staging.rice-mono.com:
        elk.staging.rice-mono.com:

  vars:
    environment: staging
    domain: rice-mono.com
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/rice-mono-staging.pem"
    backup_retention_days: 14
