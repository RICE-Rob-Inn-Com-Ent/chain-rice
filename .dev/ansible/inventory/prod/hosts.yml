---
# Production Environment Inventory

all:
  children:
    web:
      hosts:
        web[01:06].prod.rice-mono.com:
      vars:
        ansible_host: "{{ inventory_hostname }}"

    database:
      hosts:
        db-primary.prod.rice-mono.com:
          db_role: primary
        db-replica[01:02].prod.rice-mono.com:
          db_role: replica

    kubernetes:
      children:
        k8s_master:
          hosts:
            k8s-master[01:05].prod.rice-mono.com:
        k8s_worker:
          hosts:
            k8s-worker[01:10].prod.rice-mono.com:

    monitoring:
      hosts:
        prometheus[01:02].prod.rice-mono.com:
        grafana.prod.rice-mono.com:
        elk[01:03].prod.rice-mono.com:

  vars:
    environment: prod
    domain: rice-mono.com
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/rice-mono-prod.pem"
    backup_retention_days: 30
    ssl_enabled: true
    monitoring_enabled: true
