---
# Development Environment Inventory
# This file defines all hosts and groups for the dev environment

all:
  children:
    # Web/API Servers
    web:
      hosts:
        web01.dev.rice-mono.local:
          ansible_host: 10.0.1.10
          ansible_user: ubuntu
          ansible_port: 22
        web02.dev.rice-mono.local:
          ansible_host: 10.0.1.11
          ansible_user: ubuntu
          ansible_port: 22
      vars:
        app_port: 8080
        health_check_path: /health

    # Database Servers
    database:
      hosts:
        db01.dev.rice-mono.local:
          ansible_host: 10.0.2.10
          ansible_user: ubuntu
          db_type: postgresql
          db_version: "15"
        db02.dev.rice-mono.local:
          ansible_host: 10.0.2.11
          ansible_user: ubuntu
          db_type: mysql
          db_version: "8.0"
      vars:
        db_port: 5432
        backup_enabled: true

    # Cache/Queue Servers
    cache:
      hosts:
        cache01.dev.rice-mono.local:
          ansible_host: 10.0.3.10
          ansible_user: ubuntu
          cache_type: redis
        cache02.dev.rice-mono.local:
          ansible_host: 10.0.3.11
          ansible_user: ubuntu
          cache_type: memcached
      vars:
        cache_memory: 2048

    # Kubernetes Nodes
    kubernetes:
      children:
        k8s_master:
          hosts:
            k8s-master01.dev.rice-mono.local:
              ansible_host: 10.0.4.10
              ansible_user: ubuntu
            k8s-master02.dev.rice-mono.local:
              ansible_host: 10.0.4.11
              ansible_user: ubuntu
            k8s-master03.dev.rice-mono.local:
              ansible_host: 10.0.4.12
              ansible_user: ubuntu

        k8s_worker:
          hosts:
            k8s-worker01.dev.rice-mono.local:
              ansible_host: 10.0.4.20
              ansible_user: ubuntu
            k8s-worker02.dev.rice-mono.local:
              ansible_host: 10.0.4.21
              ansible_user: ubuntu
            k8s-worker03.dev.rice-mono.local:
              ansible_host: 10.0.4.22
              ansible_user: ubuntu
      vars:
        k8s_version: "1.30"
        container_runtime: containerd

    # Monitoring Stack
    monitoring:
      hosts:
        prometheus.dev.rice-mono.local:
          ansible_host: 10.0.5.10
          ansible_user: ubuntu
          component: prometheus
        grafana.dev.rice-mono.local:
          ansible_host: 10.0.5.11
          ansible_user: ubuntu
          component: grafana
        elk.dev.rice-mono.local:
          ansible_host: 10.0.5.12
          ansible_user: ubuntu
          component: elasticsearch
      vars:
        monitoring_retention_days: 30

    # Load Balancers
    loadbalancer:
      hosts:
        lb01.dev.rice-mono.local:
          ansible_host: 10.0.6.10
          ansible_user: ubuntu
          lb_type: nginx
        lb02.dev.rice-mono.local:
          ansible_host: 10.0.6.11
          ansible_user: ubuntu
          lb_type: haproxy
      vars:
        ssl_enabled: true

  vars:
    # Global Variables
    environment: dev
    domain: rice-mono.local
    region: us-west-2

    # SSH Configuration
    ansible_ssh_private_key_file: "~/.ssh/rice-mono-dev.pem"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    # Python Interpreter
    ansible_python_interpreter: /usr/bin/python3

    # Timezone
    timezone: UTC

    # Security
    firewall_enabled: true
    selinux_state: permissive

    # Monitoring
    datadog_enabled: false
    newrelic_enabled: false

    # Backup
    backup_s3_bucket: rice-mono-dev-backups
    backup_retention_days: 7
