# sqlc for SMITH database package (service/database).
# Run from this directory: sqlc generate
# Paths are relative to this file.

version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        # Subpackage avoids clashing with hand-written [DBTX] / [Queries] in query.go.
        package: "sqlcgen"
        out: "src/sqlcgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_exported_queries: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/RICE-Rob-Inn-Com-Ent/rice/service/kit/src"
              package: "kit"
              type: "UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "timestamptz"
            go_type: "time.Time"
