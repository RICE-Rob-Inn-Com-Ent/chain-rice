networks:
  chain-rice-network:
    driver: bridge

services:
  chain-rice-blockchain:
    build:
      context: .
      dockerfile: Dockerfile.blockchain
      args:
        BUILD_ENV: ${BUILD_ENV}
        BUILD_NUMBER: ${BUILD_NUMBER}
        BUILD_DATE: ${BUILD_DATE}
        BUILD_VERSION: ${BUILD_VERSION}
        BUILD_COMMIT: ${BUILD_COMMIT}
    container_name: chain-rice-blockchain
    profiles:
      - blockchain
    ports:
      - "26657:26657"
      - "26656:26656"
      - "1317:1317"
    restart: unless-stopped
    # env_file:
    #   - .env
    volumes:
      - ${BLOCKCHAIN_DATA_DIR:-./blockchain-data}:/root/.chainrice
    networks:
      - chain-rice-network

  meowtopia-db:
    image: postgres:17
    container_name: meowtopia-db
    profiles:
      - app
    restart: unless-stopped
    # env_file:
    #   - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meowtopia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - meowtopia-db-data:/var/lib/postgresql/data
    networks:
      - chain-rice-network

  meowtopia-backend:
    build:
      context: ./meowtopia/backend
      dockerfile: Dockerfile.backend
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        BUILD_ENV: ${BUILD_ENV}
        BUILD_NUMBER: ${BUILD_NUMBER}
        BUILD_DATE: ${BUILD_DATE}
        BUILD_VERSION: ${BUILD_VERSION}
        BUILD_COMMIT: ${BUILD_COMMIT}
    container_name: meowtopia-backend
    profiles:
      - app
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./meowtopia/backend:/app
    working_dir: /app
    networks:
      - chain-rice-network
    # env_file:
    #   - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-meowtopia-db}
      POSTGRES_DB: ${POSTGRES_DB:-meowtopia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - meowtopia-db

  meowtopia-frontend:
    build:
      context: ./meowtopia/frontend/web
      dockerfile: Dockerfile.web.npm
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        BUILD_ENV: ${BUILD_ENV}
        BUILD_NUMBER: ${BUILD_NUMBER}
        BUILD_DATE: ${BUILD_DATE}
        BUILD_VERSION: ${BUILD_VERSION}
        BUILD_COMMIT: ${BUILD_COMMIT}
    container_name: meowtopia-frontend
    profiles:
      - app
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - meowtopia-backend
    volumes:
      - ./meowtopia/frontend/web:/app
    working_dir: /app
    networks:
      - chain-rice-network

volumes:
  meowtopia-db-data:
