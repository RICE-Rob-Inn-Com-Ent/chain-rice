# Rice Mono - Complete Docker Compose
# All services: Frontend, Backend, Gods, Monitoring & Observability

services:
  # ========================================
  # FRONTEND SERVICES
  # ========================================

  # Vite UI Kit - Component Library
  ui-kit:
    build:
      context: .
      dockerfile: .frontend/web/Dockerfile
      target: development
    image: ui-kit:1
    container_name: rice-ui-kit
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.frontend/web/node_modules
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    networks:
      - rice-frontend
    restart: unless-stopped
    profiles:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui-kit.rule=Host(`ui.rice.local`)"
      - "traefik.http.services.ui-kit.loadbalancer.server.port=5173"

  # Next.js Web Application
  nextjs-web:
    build:
      context: .
      dockerfile: .project/web/Dockerfile
    image: nextjs-web:1
    container_name: rice-nextjs-web
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.frontend/web/node_modules
      - /app/.project/web/node_modules
      - /app/.project/web/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    networks:
      - rice-frontend
      - rice-backend
    depends_on:
      - graphql
      - ui-kit
    restart: unless-stopped
    profiles:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextjs.rule=Host(`app.rice.local`)"
      - "traefik.http.services.nextjs.loadbalancer.server.port=3001"

  # ========================================
  # DATABASE LAYER
  # ========================================

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: rice-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=rice
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rice-backend
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: rice-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rice
      POSTGRES_USER: rice
      POSTGRES_PASSWORD: rice123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rice"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rice-backend
    restart: unless-stopped

  # ========================================
  # BACKEND DATA SERVICE
  # ========================================

  data:
    build:
      context: .backend/data
      dockerfile: Dockerfile
    image: data:1
    container_name: rice-data
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://rice-mongodb:27017/rice
      - POSTGRES_URL=postgres://rice:rice123@rice-postgres:5432/rice?sslmode=disable
      - LOG_LEVEL=info
    networks:
      - rice-backend
    restart: unless-stopped

  # ========================================
  # GRAPHQL GATEWAY
  # ========================================

  graphql:
    build:
      context: .backend/graphql
      dockerfile: Dockerfile
    image: graphql:1
    container_name: rice-graphql
    ports:
      - "4000:4000"
    depends_on:
      - data
    environment:
      - GRAPHQL_PORT=4000
      - LOG_LEVEL=info
      - DATA_SERVICE_URL=http://rice-data:8080
    networks:
      - rice-backend
      - rice-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graphql.rule=Host(`api.rice.local`)"
      - "traefik.http.services.graphql.loadbalancer.server.port=4000"

  # ========================================
  # BOT SERVICES
  # ========================================

  # Bot Core - Orchestration
  bot-core:
    build:
      context: .backend/bot/core
      dockerfile: Dockerfile
    image: bot-core:1
    container_name: rice-bot-core
    ports:
      - "8100:8100"
    environment:
      - BOT_MODE=core
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
    restart: unless-stopped

  # Bot Integrations - External AI Providers
  bot-integrations:
    build:
      context: .backend/bot/in
      dockerfile: Dockerfile
    image: bot-integrations:1
    container_name: rice-bot-integrations
    ports:
      - "8200:8200"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
    restart: unless-stopped

  # ========================================
  # GODS - AI SPECIALIZED SERVICES
  # ========================================

  # ⚱️ Thoth - God of Knowledge (Text Processing)
  thoth:
    build:
      context: .backend/bot/core/ollama/thoth
      dockerfile: Dockerfile
    image: thoth:1
    container_name: thot-jeden
    labels:
      - "god.name=Thoth"
      - "god.icon=📜"
      - "god.domain=Knowledge & Text"
      - "god.description=Mistral 7B Q4 + OCR + Translation"
      - "traefik.enable=true"
      - "traefik.http.routers.thoth.rule=Host(`thoth.rice.local`)"
      - "traefik.http.services.thoth.loadbalancer.server.port=8000"
    ports:
      - "8001:8000"
      - "11434:11434"
    volumes:
      - thoth-models:/root/.ollama
      - thoth-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Thoth
      - GOD_ID=thoth
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=3m
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ☀️ Ra - God of Light (Graphics & Image Generation)
  ra:
    build:
      context: .backend/bot/core/ollama/ra
      dockerfile: Dockerfile
    image: ra:1
    container_name: rice-ra
    labels:
      - "god.name=Ra"
      - "god.icon=☀️"
      - "god.domain=Graphics & Images"
      - "god.description=Stable Diffusion 2.1 + RealESRGAN"
      - "traefik.enable=true"
      - "traefik.http.routers.ra.rule=Host(`ra.rice.local`)"
      - "traefik.http.services.ra.loadbalancer.server.port=8000"
    ports:
      - "8002:8000"
    volumes:
      - ra-models:/models
      - ra-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Ra
      - GOD_ID=ra
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s

  # ✨ Isis - Goddess of Healing (Medical AI)
  isis:
    build:
      context: .backend/bot/core/ollama/isis
      dockerfile: Dockerfile
    image: isis:1
    container_name: rice-isis
    labels:
      - "god.name=Isis"
      - "god.icon=✨"
      - "god.domain=Medical & Healing"
      - "god.description=Monai + Medical Imaging"
      - "traefik.enable=true"
      - "traefik.http.routers.isis.rule=Host(`isis.rice.local`)"
      - "traefik.http.services.isis.loadbalancer.server.port=8000"
    ports:
      - "8003:8000"
    volumes:
      - isis-models:/models
      - isis-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Isis
      - GOD_ID=isis
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # 🐱 Bastet - Goddess of Vision (Computer Vision)
  bastet:
    build:
      context: .backend/bot/core/ollama/bastet
      dockerfile: Dockerfile
    image: bastet:1
    container_name: rice-bastet
    labels:
      - "god.name=Bastet"
      - "god.icon=🐱"
      - "god.domain=Computer Vision"
      - "god.description=InsightFace + Pose + Detection"
      - "traefik.enable=true"
      - "traefik.http.routers.bastet.rule=Host(`bastet.rice.local`)"
      - "traefik.http.services.bastet.loadbalancer.server.port=8000"
    ports:
      - "8004:8000"
    volumes:
      - bastet-models:/models
      - bastet-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Bastet
      - GOD_ID=bastet
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ⚖️ Maat - Goddess of Justice (Legal Analysis)
  maat:
    build:
      context: .backend/bot/core/ollama/maat
      dockerfile: Dockerfile
    image: maat:1
    container_name: rice-maat
    labels:
      - "god.name=Maat"
      - "god.icon=⚖️"
      - "god.domain=Legal & Justice"
      - "god.description=Mistral 7B Q4 + Legal Analysis"
      - "traefik.enable=true"
      - "traefik.http.routers.maat.rule=Host(`maat.rice.local`)"
      - "traefik.http.services.maat.loadbalancer.server.port=8000"
    ports:
      - "8005:8000"
      - "11438:11434"
    volumes:
      - maat-models:/root/.ollama
      - maat-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Maat
      - GOD_ID=maat
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # 💰 Khnum - God of Wealth (Financial Analysis)
  khnum:
    build:
      context: .backend/bot/core/ollama/khnum
      dockerfile: Dockerfile
    image: khnum:1
    container_name: rice-khnum
    labels:
      - "god.name=Khnum"
      - "god.icon=💰"
      - "god.domain=Finance & Wealth"
      - "god.description=Mistral 7B Q4 + Financial Analysis"
      - "traefik.enable=true"
      - "traefik.http.routers.khnum.rule=Host(`khnum.rice.local`)"
      - "traefik.http.services.khnum.loadbalancer.server.port=8000"
    ports:
      - "8006:8000"
      - "11439:11434"
    volumes:
      - khnum-models:/root/.ollama
      - khnum-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Khnum
      - GOD_ID=khnum
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ========================================
  # MONITORING & OBSERVABILITY STACK
  # ========================================

  # Traefik - Reverse Proxy & Load Balancer
  traefik:
    image: traefik:v2.11
    container_name: rice-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.devcontainer/config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - rice-frontend
      - rice-backend
      - pantheon
    restart: unless-stopped

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: rice-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./.devcontainer/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.4
    container_name: rice-loki
    ports:
      - "3100:3100"
    volumes:
      - ./.devcontainer/config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped

  # Grafana - Visualization & Dashboards
  grafana:
    image: grafana/grafana:10.3.1
    container_name: rice-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./.devcontainer/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - rice-backend
      - pantheon
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.rice.local`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Elasticsearch - Search & Analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: rice-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - rice-backend
    restart: unless-stopped

  # Logstash - Log Processing Pipeline
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: rice-logstash
    ports:
      - "5000:5000"
      - "9600:9600"
    volumes:
      - ./.devcontainer/config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./.devcontainer/config/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    networks:
      - rice-backend
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: rice-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - rice-backend
      - pantheon
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.rice.local`)"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"

# ========================================
# VOLUMES
# ========================================

volumes:
  # Database volumes
  mongo-data:
    driver: local
  postgres-data:
    driver: local

  # Ollama model volumes for gods with Ollama
  thoth-models:
    driver: local
  maat-models:
    driver: local
  khnum-models:
    driver: local

  # Model storage for each god
  ra-models:
    driver: local
  isis-models:
    driver: local
  bastet-models:
    driver: local

  # LoRA adapter storage for each god
  thoth-lora:
    driver: local
  ra-lora:
    driver: local
  isis-lora:
    driver: local
  bastet-lora:
    driver: local
  maat-lora:
    driver: local
  khnum-lora:
    driver: local

  # Shared caches
  bazel-cache:
    driver: local
  model-cache:
    driver: local

  # Monitoring volumes
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local

# ========================================
# NETWORKS
# ========================================

networks:
  rice-frontend:
    driver: bridge
    name: rice-frontend
  rice-backend:
    driver: bridge
    name: rice-backend
  pantheon:
    driver: bridge
    name: pantheon
