# docker-compose.yml
# Generated by: cue export infra/configs/docker.cue
# Do not edit manually — edit infra/configs/docker.cue instead

name: rice

# ── networks ──────────────────────────────────────────────
networks:
  kingdom: # all services — full mesh
    driver: bridge
  data: # MASON infra layer — databases, queues
    driver: bridge
    internal: true
  inference: # SAGE compute layer — models
    driver: bridge
    internal: true
  mail: # email layer — postal + mailpit
    driver: bridge
    internal: true

# ── volumes ───────────────────────────────────────────────
volumes:
  yugabyte-data:
  redis-data:
  nats-data:
  temporal-data:
  qdrant-data:
  postal-data:
  ollama-data:
  vllm-data:

# ── services ──────────────────────────────────────────────
services:
  # ════════════════════════════════════════════════════════
  # 👷 MASON — infra layer
  # ════════════════════════════════════════════════════════

  yugabyte:
    build:
      context: .
      dockerfile: .docker/Dockerfile.yugabyte
    container_name: rice-yugabyte
    restart: unless-stopped
    ports:
      - "5433:5433" # YSQL (PostgreSQL-compatible)
      - "9042:9042" # YCQL (Cassandra-compatible)
      - "7000:7000" # master UI
      - "9000:9000" # tserver UI
    volumes:
      - yugabyte-data:/home/yugabyte/yb_data
      - .docker/conf/yugabyte.conf:/etc/yugabyte/yugabyte.conf:ro
      - .docker/etc/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: rice
      POSTGRES_USER: rice
      POSTGRES_PASSWORD: ${YUGABYTE_PASSWORD}
    networks: [data, kingdom]
    healthcheck:
      test: ["CMD", "yugabyted", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    build:
      context: .
      dockerfile: .docker/Dockerfile.redis
    container_name: rice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - .docker/conf/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    networks: [data, kingdom]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    build:
      context: .
      dockerfile: .docker/Dockerfile.nats
    container_name: rice-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
      - "6222:6222" # cluster
    volumes:
      - nats-data:/data
      - .docker/conf/nats.conf:/etc/nats/nats.conf:ro
    command: --config /etc/nats/nats.conf
    networks: [data, kingdom]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    build:
      context: .
      dockerfile: .docker/Dockerfile.temporal
    container_name: rice-temporal
    restart: unless-stopped
    ports:
      - "7233:7233" # frontend gRPC
      - "8088:8088" # web UI
    volumes:
      - temporal-data:/etc/temporal
      - .docker/conf/temporal.conf:/etc/temporal/config/development.yaml:ro
    environment:
      DB: postgresql
      DB_PORT: 5433
      POSTGRES_USER: rice
      POSTGRES_PWD: ${YUGABYTE_PASSWORD}
      POSTGRES_SEEDS: yugabyte
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/development.yaml
    networks: [data, kingdom]
    depends_on:
      yugabyte:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    build:
      context: .
      dockerfile: .docker/Dockerfile.qdrant
    container_name: rice-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
      - .docker/conf/qdrant.conf:/qdrant/config/production.yaml:ro
    networks: [data, inference, kingdom]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  postal:
    build:
      context: .
      dockerfile: .docker/Dockerfile.postal
    container_name: rice-postal
    restart: unless-stopped
    ports:
      - "25:25" # SMTP inbound
      - "5000:5000" # web UI
    volumes:
      - postal-data:/opt/postal/data
      - .docker/conf/postal.conf:/opt/postal/config/postal.yml:ro
    environment:
      POSTAL_SMTP_HOST: postal
      POSTAL_DB_HOST: yugabyte
      POSTAL_DB_PORT: 5433
      POSTAL_DB_USER: rice
      POSTAL_DB_PASSWORD: ${YUGABYTE_PASSWORD}
    networks: [mail, kingdom]
    depends_on:
      yugabyte:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postal", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    build:
      context: .
      dockerfile: .docker/Dockerfile.mailpit
    container_name: rice-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (dev only)
      - "8025:8025" # web UI
    volumes:
      - .docker/conf/mailpit.conf:/etc/mailpit/mailpit.conf:ro
    networks: [mail, kingdom]
    profiles: [dev] # dev only — never in production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8025/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ════════════════════════════════════════════════════════
  # 🧑‍🔬 SAGE — inference layer
  # ════════════════════════════════════════════════════════

  ollama:
    build:
      context: .
      dockerfile: .docker/Dockerfile.ollama
    container_name: rice-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - .docker/etc/model.json:/etc/ollama/model.json:ro
      - .docker/etc/pull.sh:/docker-entrypoint-initdb.d/pull.sh:ro
    environment:
      OLLAMA_KEEP_ALIVE: -1 # never unload model from GPU
      OLLAMA_NUM_PARALLEL: 1 # RTX 3060 6GB — one request at a time
      OLLAMA_MAX_LOADED_MODELS: 1 # never load more than 1 model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [inference, kingdom]
    profiles: [ollama]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/version"]
      interval: 5s
      timeout: 3s
      retries: 5

  vllm:
    build:
      context: .
      dockerfile: .docker/Dockerfile.vllm
    container_name: rice-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - vllm-data:/root/.cache/huggingface
      - ./function/model/lora:/lora:ro
      - ./function/model/weights:/weights:ro
    environment:
      VLLM_MODEL: ${VLLM_MODEL:-qwen2.5-coder:7b}
      VLLM_ENABLE_LORA: "true"
      VLLM_MAX_LORA_RANK: 128
      VLLM_GPU_MEMORY_UTIL: 0.90 # RTX 3060 6GB — leave 10% headroom
      VLLM_MAX_NUM_SEQS: 1 # one request at a time
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [inference, kingdom]
    profiles: [vllm] # rice think → activates correct profile
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  function:
    build:
      context: .
      dockerfile: .docker/Dockerfile.function
    container_name: rice-function
    restart: unless-stopped
    ports:
      - "8001:8001" # FastAPI
    volumes:
      - ./function:/app/function
    environment:
      RICE_BACKEND: ${RICE_BACKEND:-ollama}
      RICE_VLLM_URL: ${RICE_VLLM_URL:-http://vllm:8000}
      RICE_OLLAMA_URL: ${RICE_OLLAMA_URL:-http://ollama:11434}
      QDRANT_URL: http://qdrant:6333
    networks: [inference, kingdom]
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ════════════════════════════════════════════════════════
  # 🧑‍🏭 SMITH — service layer
  # ════════════════════════════════════════════════════════

  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile.web
    container_name: rice-web
    restart: unless-stopped
    ports:
      - "3000:3000" # ConnectRPC + REST
    environment:
      DB_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    networks: [kingdom]
    depends_on:
      yugabyte:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: .docker/Dockerfile.auth
    container_name: rice-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DB_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
      REDIS_URL: redis://redis:6379
    networks: [kingdom]
    depends_on:
      yugabyte:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  token:
    build:
      context: .
      dockerfile: .docker/Dockerfile.token
    container_name: rice-token
    restart: unless-stopped
    ports:
      - "26657:26657" # CometBFT RPC
      - "1317:1317" # Cosmos REST
      - "9090:9090" # gRPC
    environment:
      DB_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
    networks: [kingdom]
    depends_on:
      yugabyte:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:1317/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    build:
      context: .
      dockerfile: .docker/Dockerfile.database
    container_name: rice-database
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DB_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
      REDIS_URL: redis://redis:6379
      DUCKDB_PATH: /data/rice.duckdb
    networks: [kingdom, data]
    depends_on:
      yugabyte:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: .docker/Dockerfile.queue
    container_name: rice-queue
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NATS_URL: nats://nats:4222
      TEMPORAL_URL: temporal:7233
    networks: [kingdom]
    depends_on:
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  bench:
    build:
      context: .
      dockerfile: .docker/Dockerfile.bench
    container_name: rice-bench
    restart: unless-stopped
    ports:
      - "4317:4317" # OTel gRPC
      - "4318:4318" # OTel HTTP
      - "4040:4040" # Pyroscope
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://bench:4317
    networks: [kingdom]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4318/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build:
      context: .
      dockerfile: .docker/Dockerfile.core
    container_name: rice-core
    restart: unless-stopped
    ports:
      - "4000:4000" # Phoenix
    environment:
      DATABASE_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    networks: [kingdom]
    depends_on:
      yugabyte:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  pipeline:
    build:
      context: .
      dockerfile: .docker/Dockerfile.pipeline
    container_name: rice-pipeline
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
    networks: [kingdom]
    depends_on:
      nats:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  cluster:
    build:
      context: .
      dockerfile: .docker/Dockerfile.cluster
    container_name: rice-cluster
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      ERLANG_COOKIE: ${ERLANG_COOKIE}
      DATABASE_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
    networks: [kingdom]
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4002/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  guard:
    build:
      context: .
      dockerfile: .docker/Dockerfile.guard
    container_name: rice-guard
    restart: always # guard NEVER stops — always not unless-stopped
    ports:
      - "4003:4003"
    environment:
      ERLANG_COOKIE: ${ERLANG_COOKIE}
      OTEL_ENDPOINT: http://bench:4317
    networks: [kingdom]
    depends_on:
      - bench
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4003/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  connection:
    build:
      context: .
      dockerfile: .docker/Dockerfile.connection
    container_name: rice-connection
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      DATABASE_URL: postgres://rice:${YUGABYTE_PASSWORD}@yugabyte:5433/rice
      ERLANG_COOKIE: ${ERLANG_COOKIE}
    networks: [kingdom]
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4004/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ════════════════════════════════════════════════════════
  # 🧑‍🎤 BARD — frontend layer
  # ════════════════════════════════════════════════════════

  browser:
    build:
      context: .
      dockerfile: .docker/Dockerfile.browser
    container_name: rice-browser
    restart: unless-stopped
    ports:
      - "3100:3100" # Next.js
    environment:
      NEXT_PUBLIC_API_URL: http://web:3000
      NEXT_PUBLIC_WS_URL: ws://core:4000
    networks: [kingdom]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3100/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  screen:
    build:
      context: .
      dockerfile: .docker/Dockerfile.screen
    container_name: rice-screen
    restart: unless-stopped
    ports:
      - "3101:3101" # Flutter dev server
    environment:
      API_URL: http://web:3000
      WS_URL: ws://core:4000
    networks: [kingdom]
    depends_on:
      web:
        condition: service_healthy
    profiles: [dev] # Flutter builds to native — dev only
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3101/health"]
      interval: 5s
      timeout: 3s
      retries: 5

