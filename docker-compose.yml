version: "3.8"

services:
  # ChainRice Blockchain Node
  chainrice-node:
    build:
      context: .
      dockerfile: Dockerfile.blockchain
    container_name: chainrice-blockchain
    ports:
      - "26657:26657" # RPC
      - "26656:26656" # P2P
      - "1317:1317" # REST API
      - "9090:9090" # gRPC
    volumes:
      - chainrice_data:/root/.chainrice
      - ./libs/backend/modules/blockchain/config:/root/.chainrice/config
    environment:
      - CHAINRICE_HOME=/root/.chainrice
      - CHAINRICE_CHAIN_ID=chainrice-1
      - CHAINRICE_NODE=tcp://localhost:26657
    command: ["chainriced", "start", "--home", "/root/.chainrice"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Hardhat Node for Smart Contracts
  hardhat-node:
    build:
      context: .
      dockerfile: Dockerfile.hardhat
    container_name: chainrice-hardhat
    ports:
      - "8545:8545"
    volumes:
      - ./libs/contract/solidity:/app
      - hardhat_data:/app/artifacts
    working_dir: /app
    command:
      ["npx", "hardhat", "node", "--hostname", "0.0.0.0", "--port", "8545"]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-X",
          "POST",
          "-H",
          "Content-Type: application/json",
          "--data",
          '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}',
          "http://localhost:8545",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ChainRice Frontend
  chainrice-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chainrice-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./projects/chain-rice:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - VITE_BLOCKCHAIN_RPC=http://localhost:26657
      - VITE_BLOCKCHAIN_REST=http://localhost:1317
      - VITE_HARDHAT_NODE=http://localhost:8545
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - chainrice-node
      - hardhat-node
    restart: unless-stopped

  # Development Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: chainrice-dashboard
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/dashboard:/app
    working_dir: /app
    command: ["python3", "-m", "http.server", "8080"]
    restart: unless-stopped

volumes:
  chainrice_data:
  hardhat_data:
