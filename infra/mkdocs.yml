# MkDocs – dokumentacja (root). Uruchom: just docs-serve | pixi run docs-serve
# docs_dir: markdown (źródła: markdown/docs/, openapi.json w root)
site_name: Rice Monorepo
site_description: Polyglot stack – CUE, Dart, Elixir, Go, Haskell, Mojo, Node, Python, Rust, Terraform, Zig
repo_url: https://github.com/mrDinkelman/rice-mono
edit_uri: edit/main/

docs_dir: markdown

theme:
  name: material
  language: pl
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: docs/ARCHITECTURE
  - Changelog: docs/CHANGELOG
  - Contributing: docs/CONTRIBUTING
  - Install: docs/INSTALL
  - Security: docs/SECURITY
  - API: docs/README

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight
  - admonition
  - tables
