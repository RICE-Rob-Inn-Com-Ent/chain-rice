apiVersion: v1
kind: Config
preferences: {}

# Clusters configuration for different environments
clusters:
  # Development cluster
  - name: rice-mono-dev
    cluster:
      server: https://dev.rice-mono.local:6443
      certificate-authority-data: <BASE64_ENCODED_CA_CERT>
      # OR use certificate-authority: /path/to/ca.crt
      insecure-skip-tls-verify: false

  # Staging cluster
  - name: rice-mono-staging
    cluster:
      server: https://staging.rice-mono.local:6443
      certificate-authority-data: <BASE64_ENCODED_CA_CERT>
      insecure-skip-tls-verify: false

  # Production cluster
  - name: rice-mono-prod
    cluster:
      server: https://prod.rice-mono.local:6443
      certificate-authority-data: <BASE64_ENCODED_CA_CERT>
      insecure-skip-tls-verify: false

  # Local development cluster (minikube/kind/k3s)
  - name: rice-mono-local
    cluster:
      server: https://127.0.0.1:6443
      insecure-skip-tls-verify: true

# Users/credentials for authentication
users:
  # Certificate-based authentication (admin)
  - name: rice-mono-admin
    user:
      client-certificate-data: <BASE64_ENCODED_CLIENT_CERT>
      client-key-data: <BASE64_ENCODED_CLIENT_KEY>
      # OR use file paths:
      # client-certificate: /path/to/client.crt
      # client-key: /path/to/client.key

  # Token-based authentication (service account)
  - name: rice-mono-sa
    user:
      token: <SERVICE_ACCOUNT_TOKEN>

  # OIDC authentication (for production)
  - name: rice-mono-oidc
    user:
      auth-provider:
        name: oidc
        config:
          client-id: rice-mono
          client-secret: <OIDC_CLIENT_SECRET>
          idp-issuer-url: https://auth.rice-mono.com
          idp-certificate-authority: /path/to/ca.crt
          refresh-token: <REFRESH_TOKEN>
          id-token: <ID_TOKEN>

  # AWS EKS authentication
  - name: rice-mono-eks
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws
        args:
          - eks
          - get-token
          - --cluster-name
          - rice-mono-cluster
          - --region
          - us-east-1
        env:
          - name: AWS_PROFILE
            value: rice-mono

  # GKE authentication
  - name: rice-mono-gke
    user:
      auth-provider:
        name: gcp
        config:
          cmd-args: config config-helper --format=json
          cmd-path: /usr/bin/gcloud
          expiry-key: "{.credential.token_expiry}"
          token-key: "{.credential.access_token}"

  # Azure AKS authentication
  - name: rice-mono-aks
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: kubelogin
        args:
          - get-token
          - --environment
          - AzurePublicCloud
          - --server-id
          - <AZURE_SERVER_ID>
          - --client-id
          - <AZURE_CLIENT_ID>
          - --tenant-id
          - <AZURE_TENANT_ID>

# Contexts - combine cluster, user, and namespace
contexts:
  # Development contexts
  - name: dev
    context:
      cluster: rice-mono-dev
      user: rice-mono-admin
      namespace: rice-mono-dev

  - name: dev-backend
    context:
      cluster: rice-mono-dev
      user: rice-mono-sa
      namespace: rice-mono-backend

  - name: dev-frontend
    context:
      cluster: rice-mono-dev
      user: rice-mono-sa
      namespace: rice-mono-frontend

  # Staging contexts
  - name: staging
    context:
      cluster: rice-mono-staging
      user: rice-mono-admin
      namespace: rice-mono-staging

  - name: staging-backend
    context:
      cluster: rice-mono-staging
      user: rice-mono-sa
      namespace: rice-mono-backend

  # Production contexts
  - name: prod
    context:
      cluster: rice-mono-prod
      user: rice-mono-oidc
      namespace: rice-mono-prod

  - name: prod-backend
    context:
      cluster: rice-mono-prod
      user: rice-mono-oidc
      namespace: rice-mono-backend

  - name: prod-frontend
    context:
      cluster: rice-mono-prod
      user: rice-mono-oidc
      namespace: rice-mono-frontend

  # Local development
  - name: local
    context:
      cluster: rice-mono-local
      user: rice-mono-admin
      namespace: default

  # Cloud-specific contexts
  - name: eks-dev
    context:
      cluster: rice-mono-dev
      user: rice-mono-eks
      namespace: rice-mono-dev

  - name: gke-prod
    context:
      cluster: rice-mono-prod
      user: rice-mono-gke
      namespace: rice-mono-prod

  - name: aks-staging
    context:
      cluster: rice-mono-staging
      user: rice-mono-aks
      namespace: rice-mono-staging

# Set the default context
current-context: dev
