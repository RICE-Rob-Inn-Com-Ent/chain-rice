{{- range $service := list "backend" "frontend" "bot" "token" "ceraiLora" }}
{{- $config := index $.Values $service }}
{{- if $config.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $config.name | default (printf "rice-%s" $service) }}
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace }}
  labels:
    app: {{ $config.name | default (printf "rice-%s" $service) }}
    component: {{ $service }}
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $config.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $config.service.type | default "ClusterIP" }}
  {{- if and (eq ($config.service.type | default "ClusterIP") "LoadBalancer") $config.service.loadBalancerIP }}
  loadBalancerIP: {{ $config.service.loadBalancerIP }}
  {{- end }}
  ports:
  - port: {{ $config.service.port }}
    targetPort: {{ $config.service.targetPort }}
    protocol: TCP
    name: http
    {{- if and (or (eq ($config.service.type | default "ClusterIP") "NodePort") (eq ($config.service.type | default "ClusterIP") "LoadBalancer")) $config.service.nodePort }}
    nodePort: {{ $config.service.nodePort }}
    {{- end }}
  selector:
    app: {{ $config.name | default (printf "rice-%s" $service) }}
    component: {{ $service }}
  {{- if $config.service.sessionAffinity }}
  sessionAffinity: {{ $config.service.sessionAffinity }}
  {{- end }}
{{- end }}
{{- end }}
