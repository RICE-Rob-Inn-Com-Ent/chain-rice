{{- range $service := list "backend" "frontend" "bot" "token" }}
{{- $config := index $.Values $service }}
{{- if $config.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $config.name | default (printf "rice-%s" $service) }}-config
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace }}
  labels:
    app: {{ $config.name | default (printf "rice-%s" $service) }}
    component: {{ $service }}
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  ENVIRONMENT: {{ $.Values.global.environment | quote }}
  SERVICE_NAME: {{ $service | quote }}
  {{- if eq $service "backend" }}
  API_PORT: {{ $config.service.port | quote }}
  DATABASE_HOST: {{ $.Values.database.host | default "rice-database" | quote }}
  DATABASE_PORT: {{ $.Values.database.port | quote }}
  DATABASE_NAME: {{ $.Values.database.database | quote }}
  REDIS_HOST: {{ $.Values.redis.enabled | ternary "rice-redis-master" "localhost" | quote }}
  REDIS_PORT: "6379"
  LOG_FORMAT: "json"
  {{- end }}
  {{- if eq $service "frontend" }}
  API_URL: "https://api.{{ $.Values.global.domain }}"
  WS_URL: "wss://api.{{ $.Values.global.domain }}"
  {{- end }}
  {{- if eq $service "bot" }}
  BOT_TOKEN: ""  # Set via secret
  WEBHOOK_URL: "https://bot.{{ $.Values.global.domain }}/webhook"
  {{- end }}
{{- end }}
{{- end }}
