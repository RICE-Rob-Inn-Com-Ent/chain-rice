{{- range $service := list "bot" "token" "ceraiLora" }}
{{- $config := index $.Values $service }}
{{- if and $config.enabled $config.persistence $config.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $config.name | default (printf "rice-%s" $service) }}-data
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace }}
  labels:
    app: {{ $config.name | default (printf "rice-%s" $service) }}
    component: {{ $service }}
    {{- with $.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ $config.persistence.accessMode | default "ReadWriteOnce" }}
  {{- if $config.persistence.storageClass }}
  {{- if ne $config.persistence.storageClass "-" }}
  storageClassName: {{ $config.persistence.storageClass }}
  {{- end }}
  {{- else if $.Values.global.storageClass }}
  storageClassName: {{ $.Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $config.persistence.size | default "10Gi" }}
{{- end }}
{{- end }}
