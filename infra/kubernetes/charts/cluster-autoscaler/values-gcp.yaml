# GCP GKE Cluster Autoscaler Configuration
# Note: GKE has built-in autoscaler, this chart is for additional configuration

clusterAutoscaler:
  enabled: true
  cloudProvider: "gcp"
  
  # GKE autoscaler is configured via node pool settings in Terraform
  # This chart provides monitoring and additional configuration
  
  extraArgs:
    scale-down-delay-after-add: "10m"
    scale-down-unneeded-time: "10m"
    scale-down-utilization-threshold: "0.5"
    max-node-provision-time: "15m"
    max-nodes-total: 100
  
  gcp:
    projectId: ""
    minNodes: 1
    maxNodes: 10
  
  rbac:
    create: true
    serviceAccount:
      create: true
      name: "cluster-autoscaler"
      annotations: {}

