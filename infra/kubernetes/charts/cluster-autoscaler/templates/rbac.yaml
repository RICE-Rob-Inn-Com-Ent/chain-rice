{{- if .Values.clusterAutoscaler.enabled }}
{{- if .Values.clusterAutoscaler.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clusterAutoscaler.rbac.serviceAccount.name }}
  namespace: kube-system
  annotations:
    {{- range $key, $value := .Values.clusterAutoscaler.rbac.serviceAccount.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
- apiGroups: [""]
  resources:
  - events
  - endpoints
  verbs:
  - create
  - patch
- apiGroups: [""]
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups: [""]
  resources:
  - pods/status
  verbs:
  - update
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups: [""]
  resources:
  - nodes
  verbs:
  - watch
  - list
  - get
  - update
- apiGroups: [""]
  resources:
  - namespaces
  verbs:
  - list
  - get
  - watch
- apiGroups: [""]
  resources:
  - persistentvolumeclaims
  - persistentvolumes
  verbs:
  - list
  - watch
- apiGroups: [""]
  resources:
  - replicationcontrollers
  verbs:
  - list
  - get
  - watch
- apiGroups: ["apps"]
  resources:
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - list
  - get
  - watch
- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs:
  - list
  - watch
- apiGroups: [""]
  resources:
  - configmaps
  verbs:
  - list
  - watch
- apiGroups: ["extensions"]
  resources:
  - replicasets
  - daemonsets
  verbs:
  - list
  - get
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
- kind: ServiceAccount
  name: {{ .Values.clusterAutoscaler.rbac.serviceAccount.name }}
  namespace: kube-system
{{- end }}
{{- end }}

