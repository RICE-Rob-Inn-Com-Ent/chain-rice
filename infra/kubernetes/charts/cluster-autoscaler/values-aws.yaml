# AWS EKS Cluster Autoscaler Configuration

clusterAutoscaler:
  enabled: true
  cloudProvider: "aws"
  
  autoDiscovery:
    clusterName: "" # Will be set from values
    tags:
      - "k8s.io/cluster-autoscaler/enabled"
      - "k8s.io/cluster-autoscaler/{{ .Values.clusterAutoscaler.autoDiscovery.clusterName }}"
  
  extraArgs:
    scale-down-delay-after-add: "10m"
    scale-down-unneeded-time: "10m"
    scale-down-utilization-threshold: "0.5"
    skip-nodes-with-local-storage: "false"
    skip-nodes-with-system-pods: "false"
    max-node-provision-time: "15m"
    max-nodes-total: 100
  
  aws:
    region: "us-west-2"
    instanceTypes:
      - "t3.medium"
      - "t3.large"
      - "t3.xlarge"
      - "t3.2xlarge"
  
  rbac:
    create: true
    serviceAccount:
      create: true
      name: "cluster-autoscaler"
      annotations:
        eks.amazonaws.com/role-arn: "" # IAM role ARN for Cluster Autoscaler

