# PostgreSQL 16 with CloudNativePG Operator
# Open-source PostgreSQL deployment on Kubernetes

cloudnative-pg:
  enabled: true

# PostgreSQL Cluster Configuration
postgresql:
  enabled: true
  clusterName: "postgresql-cluster"
  
  # PostgreSQL version
  imageName: "postgres:16"
  
  # Cluster size
  instances: 3
  
  # Resources
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  
  # Storage
  storage:
    size: "50Gi"
    storageClass: ""
    accessMode: ReadWriteOnce
  
  # High Availability
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "4MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      max_worker_processes: "8"
      max_parallel_workers_per_gather: "4"
      max_parallel_workers: "8"
      max_parallel_maintenance_workers: "4"
  
  # Backup configuration
  backup:
    enabled: true
    retention: "7d"
    schedule: "0 2 * * *"  # Daily at 2 AM
  
  # Connection pooling with PgBouncer
  pgbouncer:
    enabled: true
    poolMode: "transaction"
    maxClientConn: "1000"
    defaultPoolSize: "25"
  
  # Monitoring
  monitoring:
    enabled: true
    serviceMonitor:
      enabled: true

