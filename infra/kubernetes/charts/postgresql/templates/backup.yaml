{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: {{ .Values.postgresql.clusterName }}-backup
  namespace: {{ .Release.Namespace }}
spec:
  cluster:
    name: {{ .Values.postgresql.clusterName }}
  target: primary
  method: barmanObjectStore
  data:
    compression: gzip
    encryption: AES256
  retentionPolicy: "{{ .Values.postgresql.backup.retention }}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.postgresql.clusterName }}-backup-cron
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.postgresql.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:16
            command:
            - /bin/bash
            - -c
            - |
              kubectl create backup {{ .Values.postgresql.clusterName }}-backup-$(date +%Y%m%d-%H%M%S) \
                --cluster={{ .Values.postgresql.clusterName }} \
                --namespace={{ .Release.Namespace }}
          restartPolicy: OnFailure
{{- end }}

