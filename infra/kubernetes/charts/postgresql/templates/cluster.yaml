{{- if .Values.postgresql.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgresql.clusterName }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.postgresql.instances }}
  
  imageName: {{ .Values.postgresql.imageName }}
  
  resources:
    requests:
      cpu: {{ .Values.postgresql.resources.requests.cpu }}
      memory: {{ .Values.postgresql.resources.requests.memory }}
    limits:
      cpu: {{ .Values.postgresql.resources.limits.cpu }}
      memory: {{ .Values.postgresql.resources.limits.memory }}
  
  storage:
    size: {{ .Values.postgresql.storage.size }}
    storageClass: {{ .Values.postgresql.storage.storageClass | default "" }}
    accessMode: {{ .Values.postgresql.storage.accessMode }}
  
  postgresql:
    parameters:
      {{- range $key, $value := .Values.postgresql.postgresql.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  
  {{- if .Values.postgresql.pgbouncer.enabled }}
  pgbouncer:
    poolMode: {{ .Values.postgresql.pgbouncer.poolMode }}
    parameters:
      max_client_conn: {{ .Values.postgresql.pgbouncer.maxClientConn }}
      default_pool_size: {{ .Values.postgresql.pgbouncer.defaultPoolSize }}
  {{- end }}
  
  {{- if .Values.postgresql.monitoring.enabled }}
  monitoring:
    enabled: true
  {{- end }}
{{- end }}

