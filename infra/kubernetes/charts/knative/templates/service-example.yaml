{{- if and .Values.knative.enabled .Values.knative.examples.enabled }}
{{- range .Values.knative.examples.services }}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default "default" }}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: {{ .minScale | default "0" | quote }}
        autoscaling.knative.dev/maxScale: {{ .maxScale | default "10" | quote }}
        autoscaling.knative.dev/target: {{ .target | default "100" | quote }}
        autoscaling.knative.dev/scaleDownDelay: {{ .scaleDownDelay | default "0s" | quote }}
    spec:
      containerConcurrency: {{ .concurrency | default "100" }}
      timeoutSeconds: {{ .timeout | default "300" }}
      containers:
      - image: {{ .image }}
        ports:
        - containerPort: {{ .port | default "8080" }}
        env:
        {{- range .env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources:
          requests:
            cpu: {{ .resources.requests.cpu | default "100m" }}
            memory: {{ .resources.requests.memory | default "128Mi" }}
          limits:
            cpu: {{ .resources.limits.cpu | default "1000m" }}
            memory: {{ .resources.limits.memory | default "512Mi" }}
---
apiVersion: networking.knative.dev/v1
kind: Ingress
metadata:
  name: {{ .name }}-ingress
  namespace: {{ .namespace | default "default" }}
spec:
  rules:
  - host: {{ .host | default (printf "%s.%s" .name .Values.knative.serving.domain.defaultDomain) }}
    http:
      paths:
      - splits:
        - percent: 100
          serviceName: {{ .name }}
        path: /
{{- end }}
{{- end }}

