{{- if and .Values.keda.enabled .Values.keda.examples.enabled }}
{{- range .Values.keda.examples.scaledObjects }}
{{- if eq .type "kafka" }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default "default" }}
spec:
  scaleTargetRef:
    name: {{ .deployment }}
    kind: Deployment
  minReplicaCount: {{ .minReplicas | default 0 }}
  maxReplicaCount: {{ .maxReplicas | default 10 }}
  cooldownPeriod: {{ .cooldownPeriod | default 300 }}
  pollingInterval: {{ .pollingInterval | default 30 }}
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: {{ .kafka.brokers | quote }}
      consumerGroup: {{ .kafka.consumerGroup | quote }}
      topic: {{ .kafka.topic | quote }}
      lagThreshold: {{ .kafka.lagThreshold | default "5" | quote }}
      offsetResetPolicy: {{ .kafka.offsetResetPolicy | default "earliest" | quote }}
{{- end }}
{{- end }}
{{- end }}

