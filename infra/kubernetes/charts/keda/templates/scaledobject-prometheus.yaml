{{- if and .Values.keda.enabled .Values.keda.examples.enabled }}
{{- range .Values.keda.examples.scaledObjects }}
{{- if eq .type "prometheus" }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default "default" }}
spec:
  scaleTargetRef:
    name: {{ .deployment }}
    kind: Deployment
  minReplicaCount: {{ .minReplicas | default 0 }}
  maxReplicaCount: {{ .maxReplicas | default 10 }}
  cooldownPeriod: {{ .cooldownPeriod | default 300 }}
  pollingInterval: {{ .pollingInterval | default 30 }}
  triggers:
  - type: prometheus
    metadata:
      serverAddress: {{ .prometheus.serverAddress | quote }}
      metricName: {{ .prometheus.metricName | quote }}
      threshold: {{ .prometheus.threshold | default "10" | quote }}
      query: {{ .prometheus.query | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-prometheus-auth
  namespace: {{ .namespace | default "default" }}
type: Opaque
stringData:
  bearerToken: {{ .prometheus.bearerToken | default "" | quote }}
{{- end }}
{{- end }}
{{- end }}

