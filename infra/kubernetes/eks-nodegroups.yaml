# AWS EKS Node Groups Configuration
# This file defines node groups for the EKS cluster

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ceramix-cluster
  region: us-east-1
  version: "1.28"

# IAM configuration
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: cerai-lora-sa
        namespace: ceramix
      wellKnownPolicies:
        eksctl: true
      roleName: cerai-lora-role

# VPC configuration
vpc:
  cidr: "10.0.0.0/16"
  nat:
    gateway: HighlyAvailable

# Node Groups
nodeGroups:
  # CPU Node Group for general workloads
  - name: cpu-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 10
    volumeSize: 50
    volumeType: gp3
    ssh:
      allow: false
    labels:
      workload-type: cpu
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/ceramix-cluster: "owned"

  # GPU Node Group for CerAI LoRA
  - name: gpu-nodes
    instanceType: g4dn.xlarge  # NVIDIA T4 GPU
    desiredCapacity: 1
    minSize: 1
    maxSize: 3
    volumeSize: 100
    volumeType: gp3
    ssh:
      allow: false
    labels:
      workload-type: gpu
      accelerator: nvidia-tesla-t4
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/ceramix-cluster: "owned"
    # Install NVIDIA device plugin
    preBootstrapCommands:
      - |
        # Install NVIDIA Container Runtime
        distribution=$(. /etc/os-release;echo $ID$VERSION_ID)
        curl -s -L https://nvidia.github.io/nvidia-docker/gpgkey | sudo apt-key add -
        curl -s -L https://nvidia.github.io/nvidia-docker/$distribution/nvidia-docker.list | sudo tee /etc/apt/sources.list.d/nvidia-docker.list
        sudo apt-get update && sudo apt-get install -y nvidia-container-runtime
        sudo systemctl restart containerd

# Managed Node Groups (alternative to unmanaged)
managedNodeGroups:
  - name: managed-cpu
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 10
    volumeSize: 50
    labels:
      workload-type: cpu
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"

# Addons
addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest



