version: "3.8"

services:
  # ⚱️ Thoth - God of Knowledge (Mistral + OCR + Translation + Document Analysis)
  thoth:
    build:
      context: ./gods/thoth
      dockerfile: Dockerfile
    image: ai-god-thoth:latest
    container_name: ai-god-thoth
    labels:
      - "god.name=Thoth"
      - "god.icon=📜"
      - "god.domain=Knowledge & Text"
      - "god.description=Mistral 7B Q4 + OCR + Translation"
    ports:
      - "11434:11434" # Ollama API
      - "8001:8000" # Thoth Multi-Model API
    volumes:
      - thoth-models:/root/.ollama
      - thoth-lora:/lora-adapters
      - bazel-cache:/cache/bazel:rw
      - model-cache:/cache/models:rw
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - GOD_NAME=Thoth
      - GOD_ID=thoth
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=3m
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - pantheon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ☀️ Ra - God of Light (Graphics Generation: SD 2.1, FLUX, RealESRGAN, RVM)
  ra:
    build:
      context: ./gods/ra
      dockerfile: Dockerfile
    image: ai-god-ra:latest
    container_name: ai-god-ra
    labels:
      - "god.name=Ra"
      - "god.icon=☀️"
      - "god.domain=Graphics & Images"
      - "god.description=Stable Diffusion + Upscaling"
    ports:
      - "8002:8000"
    volumes:
      - ra-models:/models
      - ra-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Ra
      - GOD_ID=ra
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - pantheon
    restart: unless-stopped
    profiles:
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s

  # ✨ Isis - Goddess of Healing (Medical: Monai, LLaVa)
  isis:
    build:
      context: ./gods/isis
      dockerfile: Dockerfile
    image: ai-god-isis:latest
    container_name: ai-god-isis
    labels:
      - "god.name=Isis"
      - "god.icon=✨"
      - "god.domain=Medical & Healing"
      - "god.description=Monai + Medical Imaging"
    ports:
      - "8003:8000"
    volumes:
      - isis-models:/models
      - isis-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Isis
      - GOD_ID=isis
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - pantheon
    restart: unless-stopped
    profiles:
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # 🐱 Bastet - Goddess of Vision (Computer Vision: InsightFace, MMPose, MMDetection)
  bastet:
    build:
      context: ./gods/bastet
      dockerfile: Dockerfile
    image: ai-god-bastet:latest
    container_name: ai-god-bastet
    labels:
      - "god.name=Bastet"
      - "god.icon=🐱"
      - "god.domain=Computer Vision"
      - "god.description=InsightFace + Pose + Detection"
    ports:
      - "8004:8000"
    volumes:
      - bastet-models:/models
      - bastet-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - GOD_NAME=Bastet
      - GOD_ID=bastet
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - pantheon
    restart: unless-stopped
    profiles:
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ⚖️ Maat - Goddess of Justice (Legal: Mistral + XLM-RoBERTa + Donut)
  maat:
    build:
      context: ./gods/maat
      dockerfile: Dockerfile
    image: ai-god-maat:latest
    container_name: ai-god-maat
    labels:
      - "god.name=Maat"
      - "god.icon=⚖️"
      - "god.domain=Legal & Justice"
      - "god.description=Mistral 7B Q4 + Legal Analysis"
    ports:
      - "11438:11434" # Ollama
      - "8005:8000" # Maat API
    volumes:
      - maat-models:/root/.ollama
      - maat-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - OLLAMA_HOST=0.0.0.0
      - GOD_NAME=Maat
      - GOD_ID=maat
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - pantheon
    restart: unless-stopped
    profiles:
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # 💰 Khnum - God of Wealth (Finance: Mistral + PlotGPT + RecBole)
  khnum:
    build:
      context: ./gods/khnum
      dockerfile: Dockerfile
    image: ai-god-khnum:latest
    container_name: ai-god-khnum
    labels:
      - "god.name=Khnum"
      - "god.icon=💰"
      - "god.domain=Finance & Wealth"
      - "god.description=Mistral 7B Q4 + Financial Analysis"
    ports:
      - "11439:11434" # Ollama
      - "8006:8000" # Khnum API
    volumes:
      - khnum-models:/root/.ollama
      - khnum-lora:/lora-adapters
      - model-cache:/cache/models:rw
    environment:
      - OLLAMA_HOST=0.0.0.0
      - GOD_NAME=Khnum
      - GOD_ID=khnum
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - pantheon
    restart: unless-stopped
    profiles:
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

volumes:
  thoth-models:
  thoth-lora:
  ra-models:
  ra-lora:
  isis-models:
  isis-lora:
  bastet-models:
  bastet-lora:
  maat-models:
  maat-lora:
  khnum-models:
  khnum-lora:
  bazel-cache:
  model-cache:

networks:
  pantheon:
    driver: bridge
