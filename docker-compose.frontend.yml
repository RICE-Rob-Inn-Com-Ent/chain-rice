services:
  # Vite UI Kit Development Server
  ui-kit:
    container_name: rice-ui-kit
    image: node:20-alpine
    ports:
      - "5173:5173"
    volumes:
      # Mount entire monorepo for yarn workspaces
      - .:/app
      # Exclude node_modules for performance
      - /app/node_modules
      - /app/.frontend/web/node_modules
    working_dir: /app/.frontend/web
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "cd /app && yarn install && cd /app/.frontend/web && yarn dev --host 0.0.0.0 --port 5173"
    networks:
      - frontend-network
    restart: unless-stopped

  # Next.js Web Application Development Server
  nextjs-app:
    container_name: rice-nextjs
    image: node:20-alpine
    ports:
      - "3002:3002"
    volumes:
      # Mount entire monorepo for yarn workspaces
      - .:/app
      # Exclude node_modules for performance
      - /app/node_modules
      - /app/.frontend/web/node_modules
      - /app/.project/web/node_modules
    working_dir: /app/.project/web
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "cd /app && yarn install && cd /app/.project/web && yarn dev"
    networks:
      - frontend-network
    restart: unless-stopped
    depends_on:
      - ui-kit

networks:
  frontend-network:
    driver: bridge
    name: rice-frontend-network
