<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainRice Blockchain</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn:hover, .nav-btn.active {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .card h2 {
            margin-top: 0;
            color: #ffd700;
        }
        .status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .status-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .status-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        .status-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #00ff88;
        }
        .users {
            display: grid;
            gap: 10px;
        }
        .user {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
        }
        .user-name {
            font-weight: bold;
            color: #ffd700;
        }
        .balance {
            text-align: center;
        }
        .balance-label {
            font-size: 0.8em;
            opacity: 0.8;
        }
        .balance-value {
            font-size: 1.1em;
            font-weight: bold;
        }
        .transfer-form {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .logs-container {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }
        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }
        .log-entry.INFO {
            border-left-color: #00ff88;
            background: rgba(0,255,136,0.1);
        }
        .log-entry.ERROR {
            border-left-color: #ff6b6b;
            background: rgba(255,107,107,0.1);
        }
        .log-entry.SUCCESS {
            border-left-color: #ffd700;
            background: rgba(255,215,0,0.1);
        }
        .log-entry.BLOCK {
            border-left-color: #764ba2;
            background: rgba(118,75,162,0.1);
        }
        .log-entry.START {
            border-left-color: #667eea;
            background: rgba(102,126,234,0.1);
        }
        .log-timestamp {
            color: #888;
            font-size: 0.9em;
        }
        .log-level {
            font-weight: bold;
            margin: 0 10px;
        }
        .log-level.INFO { color: #00ff88; }
        .log-level.ERROR { color: #ff6b6b; }
        .log-level.SUCCESS { color: #ffd700; }
        .log-level.BLOCK { color: #764ba2; }
        .log-level.START { color: #667eea; }
        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
        }
        .success {
            color: #00ff88;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍚 ChainRice Blockchain</h1>
            <p>Real Cosmos SDK Blockchain with CRICE and NORI Tokens</p>
        </div>

        <div class="nav">
            <button class="nav-btn active" onclick="showPage('dashboard')">📊 Dashboard</button>
            <button class="nav-btn" onclick="showPage('transfer')">💸 Transfer</button>
            <button class="nav-btn" onclick="showPage('logs')">📋 Live Logs</button>
        </div>

        <!-- Dashboard Page -->
        <div id="dashboard" class="page active">
            <div class="grid">
                <div class="card">
                    <h2>📊 Blockchain Status</h2>
                    <div class="status">
                        <div class="status-item">
                            <div class="status-label">Block Height</div>
                            <div class="status-value" id="blockHeight">Loading...</div>
                        </div>
                        <div class="status-item">
                            <div class="status-label">Chain ID</div>
                            <div class="status-value">crice-1</div>
                        </div>
                        <div class="status-item">
                            <div class="status-label">RPC Endpoint</div>
                            <div class="status-value">localhost:26657</div>
                        </div>
                        <div class="status-item">
                            <div class="status-label">Status</div>
                            <div class="status-value" id="status">Loading...</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>👥 Users & Balances</h2>
                    <div class="users" id="users">
                        <div>Loading users...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Transfer Page -->
        <div id="transfer" class="page">
            <div class="transfer-form">
                <h2>💸 Transfer Tokens</h2>
                <form id="transferForm">
                    <div class="form-group">
                        <label for="fromAddress">From Address:</label>
                        <input type="text" id="fromAddress" placeholder="crice1alice1234567890abcdefghijklmnopqrstuvwxyz" required>
                    </div>
                    <div class="form-group">
                        <label for="toAddress">To Address:</label>
                        <input type="text" id="toAddress" placeholder="crice1bob1234567890abcdefghijklmnopqrstuvwxyz" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount:</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="1000" required>
                    </div>
                    <div class="form-group">
                        <label for="token">Token:</label>
                        <select id="token" required>
                            <option value="CRICE">CRICE (urice)</option>
                            <option value="NORI">NORI (unori)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" id="transferBtn">Transfer Tokens</button>
                    <div id="transferResult"></div>
                </form>
            </div>
        </div>

        <!-- Logs Page -->
        <div id="logs" class="page">
            <div class="card">
                <h2>📋 Live Blockchain Logs</h2>
                <div class="logs-container" id="logsContainer">
                    <div>Loading logs...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:26657';
        let users = [];
        let logsInterval;

        function showPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            // Show selected page
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
            
            // Start/stop logs auto-refresh
            if (pageId === 'logs') {
                loadLogs();
                logsInterval = setInterval(loadLogs, 2000);
            } else {
                if (logsInterval) {
                    clearInterval(logsInterval);
                }
            }
        }

        // Load blockchain status
        async function loadStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                
                document.getElementById('blockHeight').textContent = data.result.sync_info.latest_block_height;
                document.getElementById('status').textContent = data.result.sync_info.catching_up ? 'Syncing' : 'Running';
            } catch (error) {
                console.error('Error loading status:', error);
                document.getElementById('status').textContent = 'Error';
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/users`);
                const data = await response.json();
                users = data.users;
                
                const usersDiv = document.getElementById('users');
                usersDiv.innerHTML = '';
                
                users.forEach(user => {
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user';
                    userDiv.innerHTML = `
                        <div class="user-name">${user.username}</div>
                        <div class="balance">
                            <div class="balance-label">CRICE</div>
                            <div class="balance-value">${user.crice_balance.toLocaleString()}</div>
                        </div>
                        <div class="balance">
                            <div class="balance-label">NORI</div>
                            <div class="balance-value">${user.nori_balance.toLocaleString()}</div>
                        </div>
                    `;
                    usersDiv.appendChild(userDiv);
                });
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users').innerHTML = '<div class="error">Error loading users</div>';
            }
        }

        // Load logs
        async function loadLogs() {
            try {
                const response = await fetch(`${API_BASE}/logs`);
                const data = await response.json();
                
                const logsContainer = document.getElementById('logsContainer');
                logsContainer.innerHTML = '';
                
                data.logs.forEach(log => {
                    const logDiv = document.createElement('div');
                    logDiv.className = `log-entry ${log.level}`;
                    logDiv.innerHTML = `
                        <span class="log-timestamp">[${log.timestamp}]</span>
                        <span class="log-level ${log.level}">${log.level}</span>
                        <span class="log-message">${log.message}</span>
                    `;
                    logsContainer.appendChild(logDiv);
                });
                
                // Auto-scroll to bottom
                logsContainer.scrollTop = logsContainer.scrollHeight;
            } catch (error) {
                console.error('Error loading logs:', error);
                document.getElementById('logsContainer').innerHTML = '<div class="error">Error loading logs</div>';
            }
        }

        // Transfer tokens
        async function transferTokens(from, to, amount, token) {
            try {
                const response = await fetch(`${API_BASE}/broadcast_tx_commit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        from: from,
                        to: to,
                        amount: parseFloat(amount),
                        token: token
                    })
                });
                
                const data = await response.json();
                
                if (data.result && data.result.hash) {
                    return { success: true, hash: data.result.hash };
                } else {
                    return { success: false, error: data.error || 'Unknown error' };
                }
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // Handle transfer form
        document.getElementById('transferForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fromAddress = document.getElementById('fromAddress').value;
            const toAddress = document.getElementById('toAddress').value;
            const amount = document.getElementById('amount').value;
            const token = document.getElementById('token').value;
            const transferBtn = document.getElementById('transferBtn');
            const resultDiv = document.getElementById('transferResult');
            
            transferBtn.disabled = true;
            transferBtn.textContent = 'Transferring...';
            resultDiv.innerHTML = '';
            
            const result = await transferTokens(fromAddress, toAddress, amount, token);
            
            if (result.success) {
                resultDiv.innerHTML = `<div class="success">✅ Transaction successful! Hash: ${result.hash}</div>`;
                // Reload data
                await Promise.all([loadUsers(), loadStatus()]);
            } else {
                resultDiv.innerHTML = `<div class="error">❌ Transaction failed: ${result.error}</div>`;
            }
            
            transferBtn.disabled = false;
            transferBtn.textContent = 'Transfer Tokens';
        });

        // Auto-refresh data
        async function refreshData() {
            await Promise.all([loadStatus(), loadUsers()]);
        }

        // Initial load and setup auto-refresh
        refreshData();
        setInterval(refreshData, 10000); // Refresh every 10 seconds

        // Set default addresses for easy testing
        document.getElementById('fromAddress').value = 'crice1alice1234567890abcdefghijklmnopqrstuvwxyz';
        document.getElementById('toAddress').value = 'crice1bob1234567890abcdefghijklmnopqrstuvwxyz';
    </script>
</body>
</html>
