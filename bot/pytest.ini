# Pytest – Python & Mojo tests | Rice monorepo
# Used by: python/, mojo/ (via pytest for Python compat), .devcontainer/bot

[pytest]
testpaths = test python/test .devcontainer/bot
python_files = test_*.py *_test.py
python_functions = test_*
asyncio_mode = auto
addopts = -v --strict-markers --tb=short
markers =
    slow: marks tests as slow
    integration: tests requiring external services
    gpu: tests requiring CUDA/GPU
    quantum: tests requiring Qiskit/PennyLane
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
