[project]
# --- Project Metadata ---
name = "rice-bot"
version = "1.0.0"
description = "Quantum, DataScience & AI System"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Code-Rice", email = "infocoderice@gmail.com" }]
# Enforces Python 3.13+ for latest features (like improved JIT and typing)
requires-python = ">=3.13"

# --- Core Dependencies (Business Logic & API) ---
dependencies = [
    "fastapi>=0.120.0",          # High-performance Web Framework
    "uvicorn[standard]>=0.35.0", # ASGI server for FastAPI execution
    "pydantic>=2.10.0",          # Strict Data Validation via Rust-backed models
    "pydantic-settings>=2.0.0",  # Environment variable management
    "litellm>=1.60.0",           # Universal interface for 100+ LLM providers
    "langgraph>=0.5.0",          # Orchestration for stateful multi-agent workflows
    "polars>=1.5.0",             # Blazing fast Rust-based DataFrame library
    "duckdb>=1.2.0",             # In-process analytical SQL database
    "loguru>=0.8.0",             # Modern, painless logging
    "python-dotenv>=1.1.0",      # Local .env file support
    "tenacity>=9.0.0",           # Advanced retry logic for flaky API calls
    "httpx>=0.27.0",             # Modern Async HTTP client
]

[project.optional-dependencies]
# --- Specialized Extra Sets (Install via: pip install ".[model]") ---

# AI / AGENTS: Structural extraction and vector search
model = [
    "instructor>=1.6.0",      # Type-safe LLM outputs using Pydantic
    "crewai>=0.80.0",         # Role-playing collaborative AI agents
    "outlines>=0.1.0,<2.0.0", # Guided text generation (guarantees JSON/Regex)
    "qdrant-client>=1.13.0",  # Vector DB client for RAG (Retrieval-Augmented Generation)
    "bm25s>=0.2.0",           # Fast Lexical search to complement semantic search
    "torch>=2.6.0",           # Deep Learning foundation for local embeddings
]

# SIMULATION: Quantum Computing & Physics
sim = [
    "qiskit>=1.4.0",      # IBM's SDK for programming quantum computers
    "qiskit-aer>=0.16.0", # High-performance simulators for Qiskit (C++ backends)
    "pennylane>=0.40.0",  # Cross-platform Python library for Quantum ML
    "jax[cuda12]>=0.5.0", # XLA-powered Autograd/GPU compute for physics sims
]

# DATA SCIENCE: Numerical and Scientific Computing
data = [
    "pyarrow>=19.0.0",               # Memory-efficient columnar data interchange
    "scipy>=1.15.0",                 # Advanced algorithms for math and engineering
    "numpy>=2.2.0",                  # Core array processing (Numpy 2.0+ compatible)
    "ibis-framework[duckdb]>=9.0.0", # Portable Python dataframe API
]

# SECURITY: Shielding the AI & Data Layers
secure = [
    "bandit>=1.8.0",        # Static analysis for security-focused linting
    "pip-audit>=2.0.0",     # Scans installed packages for known CVEs
    "guardrails-ai>=0.5.0", # Validation layer for LLM outputs (Anti-hallucination)
]

# DEV: Environment for testing and quality control
dev = [
    "ruff>=0.9.0",            # Ultra-fast Linter and Formatter (Rust)
    "basedpyright>=1.20.0",   # Stricter Type Checker (Fork of Pyright)
    "marimo>=0.10.0",         # Reactive notebooks for Data Science (Next-gen Jupyter)
    "pytest>=8.0.0",          # Testing framework
    "pytest-asyncio>=0.25.0", # Native async support for Pytest
    "pytest-mock>=3.14.0",    # Mocking utility for unit tests
]

# ALL: Catch-all for full installation
all = [
    "instructor>=1.6.0",
    "crewai>=0.80.0",
    "outlines>=0.1.0,<2.0.0",
    "qdrant-client>=1.13.0",
    "bm25s>=0.2.0",
    "torch>=2.6.0",
    "qiskit>=1.4.0",
    "qiskit-aer>=0.16.0",
    "pennylane>=0.40.0",
    "jax[cuda12]>=0.5.0",
    "pyarrow>=19.0.0",
    "scipy>=1.15.0",
    "numpy>=2.2.0",
    "ibis-framework[duckdb]>=9.0.0",
    "bandit>=1.8.0",
    "pip-audit>=2.0.0",
    "guardrails-ai>=0.5.0",
    "ruff>=0.9.0",
    "basedpyright>=1.20.0",
    "marimo>=0.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
]

# --- Pixi / Mojo (ex-mojoproject.toml); run from bot dir: pixi run <task> ---
[tool.pixi.workspace]
channels = ["conda-forge", "modular-channels"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
max = ">=24.4.0"

[tool.pixi.tasks]
start = "python app/main.py"
test = "pytest"
test-mojo = "mojo test mojo"
build-kernels = "mojo build mojo/simulate.mojo -o bin/sim_engine"

# --- Tool Configurations ---

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true # UV will handle lockfiles and venv creation automatically
package = true # Treat this project as an installable package

[tool.hatch.build.targets.wheel]
packages = ["src/rice_bot"] # Explicitly define package source directory

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Custom markers for granular test execution (e.g., pytest -m gpu)
markers = [
    "slow: marks tests as slow",
    "integration: tests requiring external services",
    "gpu: tests requiring CUDA/GPU",
    "quantum: tests requiring Qiskit/PennyLane",
]
addopts = "-v --strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"
show-fixes = true
fix = true               # Auto-fix lint errors on save

[tool.ruff.lint]
# E/W (Error/Warning), F (Pyflakes), I (Isort), UP (Upgrade), S (Security), ASYNC (Async bugs)
select = ["E", "W", "F", "I", "UP", "S", "B", "C4", "PT", "RUF", "ASYNC"]
ignore = [
    "D",
    "ANN101",
    "ANN102",
] # Ignoring missing docstrings (D) and legacy self/cls typing

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportMissingTypeStubs = false # Avoid noise from libraries without type hints

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# Ścieżki względem roota (python/ to główny kod)
files = ["python/**/*.py"]
exclude = ["python/test/", "**/__pycache__/"]
