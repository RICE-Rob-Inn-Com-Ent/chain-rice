# Global values for all charts
global:
  # Default namespace for all resources
  namespace: "rice-dev"

# ArgoCD Configuration
argo-cd:
  # Enable ArgoCD installation
  enabled: true
  
  # ArgoCD Server Configuration
  server:
    # Enable server component
    enabled: true
    
    # Service configuration
    service:
      type: LoadBalancer
      ports:
        server: 80
        metrics: 8083
    
    # Ingress configuration
    ingress:
      enabled: true
      ingressClassName: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
      hosts:
        - argocd.rice-dev.local
      tls:
        - secretName: argocd-server-tls
          hosts:
            - argocd.rice-dev.local
    
    # Additional server configuration
    config:
      # Enable insecure mode for development
      insecure: true
      
      # Repository credentials
      repositories: |
        - type: git
          url: https://github.com/argoproj/argocd-example-apps
          name: argocd-example-apps
      
      # OIDC configuration (optional)
      oidc.config: |
        name: OIDC
        issuer: https://your-oidc-provider.com
        clientId: argocd
        clientSecret: $oidc.clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]
        requestedIDTokenClaims: {"groups": {"essential": true}}
  
  # ArgoCD Controller Configuration
  controller:
    enabled: true
    
    # Metrics configuration
    metrics:
      enabled: true
      service:
        type: ClusterIP
        port: 8082
  
  # ArgoCD ApplicationSet Controller
  applicationSet:
    enabled: true
  
  # ArgoCD Notifications
  notifications:
    enabled: true
  
  # ArgoCD Dex (for SSO)
  dex:
    enabled: false  # Disable by default, enable if needed
  
  # Redis configuration
  redis:
    enabled: true
    auth:
      enabled: false  # Disable auth for simplicity
  
  # ArgoCD Repo Server
  repoServer:
    enabled: true
    
    # Metrics configuration
    metrics:
      enabled: true
      service:
        type: ClusterIP
        port: 8084
  
  # ArgoCD Config Management
  configs:
    # CM configuration
    cm:
      # Application instance label key
      application.instanceLabelKey: argocd.argoproj.io/instance
      
      # Server configuration
      server.rbac.log.enforce.enable: "true"
      
      # Repository configuration
      repositories: |
        - type: git
          url: https://github.com/argoproj/argocd-example-apps
          name: argocd-example-apps
    
    # Secret configuration
    secret:
      # Create initial admin secret
      argocdServerAdminPassword: "$2a$10$rRyBsGSHK6.uc8fntPwVFOBqQyHibPVYEBbwAOZD9v8X2Kpxu9Ute"  # admin123
      argocdServerAdminPasswordMtime: "2023-01-01T00:00:00Z"
  
  # ArgoCD CRDs
  crds:
    install: true
    keep: true

# Nginx Configuration (existing)
nginx:
  enabled: true
  
  # Service configuration
  service:
    type: LoadBalancer
    ports:
      http: 80
      https: 443
  
  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hosts:
      - host: nginx.rice-dev.local
        paths:
          - path: /
            pathType: Prefix
