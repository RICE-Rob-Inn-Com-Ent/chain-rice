# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/mock/**"
  - "**/mocks/**"
  - "**/*.generated.*"
  - "**/*_pb.*"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/target/**"
  - "**/.next/**"
  - "**/bazel-*/**"
  - "**/vendor/**"
  - "**/.venv/**"
  - "**/venv/**"

flags:
  python:
    paths:
      - .bot/
    carryforward: true

  go:
    paths:
      - .backend/
    carryforward: true

  typescript:
    paths:
      - .frontend/web/
    carryforward: true

  rust:
    paths:
      - .backend/contract/rust/
    carryforward: true

  solidity:
    paths:
      - .backend/contract/solidity/
    carryforward: true

  flutter:
    paths:
      - .frontend/flutter/
    carryforward: true
