name: Test

on:
    push:
        branches: [main, dev]
    pull_request:

jobs:
    python-tests:
        if: contains(github.event.head_commit.message, 'python') || !cancelled()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install dependencies
              run: |
                  pip install poetry
                  poetry install
            - name: Run tests
              run: poetry run pytest

    go-tests:
        if: contains(github.event.head_commit.message, 'go') || !cancelled()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23"
            - name: Run Go tests
              run: go test ./...

    frontend-tests:
        if: contains(github.event.head_commit.message, 'frontend') || !cancelled()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
