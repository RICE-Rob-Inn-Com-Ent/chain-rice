name: Security Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secrets & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scanners
        run: |
          python3 -m pip install --upgrade pip detect-secrets
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tgz

      - name: Run detect-secrets
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '.*\.lock$' \
            --exclude-files 'node_modules/.*' \
            --exclude-files '\.git/.*' \
            > detect-secrets-report.json
        continue-on-error: true

      - name: Run Gitleaks
        run: gitleaks detect --source . --report-format json --report-path gitleaks-report.json || true

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: |
            detect-secrets-report.json
            gitleaks-report.json
          retention-days: 30

  trivy-scan:
    name: Trivy Repository Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          security-checks: vuln,config,secret
          ignore-unfixed: true
          format: json
          output: trivy-report.json
        env:
          TRIVY_NO_PROGRESS: "true"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python,go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:multi"

  sonarcloud:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=rice-mono
            -Dsonar.organization=rice-dev

  build:
    name: Build Pipeline
    needs:
      - secret-scan
      - trivy-scan
      - codeql
      - sonarcloud
    uses: ./.github/workflows/ci-build.yml

