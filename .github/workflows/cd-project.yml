name: Auto-Sync Project Repository

on:
  push:
    branches: [v.0.1.0, main]
    paths:
      - ".project/**"
  workflow_dispatch:

jobs:
  sync-project:
    name: Sync .project to Target Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Load project context
        id: context
        uses: ./.github/actions/project-context

      - name: Show project metadata
        run: |
          echo "📦 Project:   ${{ steps.context.outputs.active_project_name }} (${{ steps.context.outputs.active_project }})"
          echo "📁 Directory: ${{ steps.context.outputs.project_path }}"
          echo "🔗 Repo URL:  ${{ steps.context.outputs.repo_url }}"
          echo "🌿 Branch:    ${{ steps.context.outputs.repo_branch }}"

      - name: Clone Target Repository
        run: |
          REPO_URL="${{ steps.context.outputs.repo_url }}"
          BRANCH="${{ steps.context.outputs.repo_branch }}"

          # Clone target repo
          git clone $REPO_URL /tmp/target-repo
          cd /tmp/target-repo

          # Checkout or create branch
          git checkout $BRANCH 2>/dev/null || git checkout -b $BRANCH

      - name: Sync project directory to target repository
        run: |
          echo "🔄 Syncing active project to target repository..."

          SOURCE_DIR="${{ steps.context.outputs.project_path }}"
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "❌ Source project directory $SOURCE_DIR does not exist."
            exit 1
          fi

          # Remove old files (except .git)
          cd /tmp/target-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy new files from active project directory
          rsync -a "$SOURCE_DIR"/ ./
          rsync -a "$SOURCE_DIR"/.[!.]* ./ 2>/dev/null || true

          # Remove .git if accidentally copied
          rm -rf .git/.git

          echo "✅ Files synced"

      - name: Commit and Push Changes
        run: |
          cd /tmp/target-repo

          # Check if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git add -A

            COMMIT_MSG="chore: auto-sync from rice-mono"
            if [ -n "${{ github.event.head_commit.message }}" ]; then
              COMMIT_MSG="sync: ${{ github.event.head_commit.message }}"
            fi

            git commit -m "$COMMIT_MSG"
            git push origin "${{ steps.context.outputs.repo_branch }}"

            echo "✅ Changes pushed to ${{ steps.context.outputs.repo_name }}"
          else
            echo "ℹ️  No changes to sync"
          fi
