name: Sync Subrepos

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
            - "bots/**"
            - "contract/**"
            - "frontend/**"
            - "proto/**"
    workflow_dispatch:

jobs:
    sync-backend:
        name: Sync Backend Subrepo
        runs-on: ubuntu-latest
        if: contains(github.event.head_commit.modified, 'backend/') || github.event_name == 'workflow_dispatch'
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Sync backend changes
              run: |
                  echo "Syncing backend subrepo..."
                  # Add your git subtree or subrepo sync logic here
                  # Example: git subtree push --prefix=backend backend-repo main

