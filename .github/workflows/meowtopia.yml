name: Meowtopia Build and Deploy

on:
  push:
    branches: [ master, development ]
    paths:
      - 'apps/meowtopia/**'
  pull_request:
    branches: [ master, development ]
    paths:
      - 'apps/meowtopia/**'

jobs:
  build-meowtopia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull meowtopia subrepo
        run: |
          chmod +x .github/git-subrepo-manager.sh
          ./.github/git-subrepo-manager.sh pull meowtopia

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd apps/meowtopia
          yarn install --frozen-lockfile

      - name: Build meowtopia
        run: |
          cd apps/meowtopia
          yarn build

      - name: Test meowtopia
        run: |
          cd apps/meowtopia
          yarn test || echo "Tests not configured yet"

      - name: Push meowtopia changes
        if: github.event_name == 'push'
        run: |
          ./.github/git-subrepo-manager.sh push meowtopia
