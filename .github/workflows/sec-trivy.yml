name: Trivy Security Scan

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    schedule:
        - cron: "0 6 * * *" # Daily at 6 AM UTC
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

jobs:
    trivy-repo-scan:
        name: Trivy Repository Scan
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy vulnerability scanner in repo mode
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-repo-results.sarif"
                  severity: "CRITICAL,HIGH,MEDIUM"
                  exit-code: "0"

            - name: Upload Trivy results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-repo-results.sarif"

            - name: Run Trivy with JSON output
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "json"
                  output: "trivy-repo-results.json"

            - name: Upload Trivy JSON report
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-repo-scan
                  path: trivy-repo-results.json
                  retention-days: 30

    trivy-docker-scan:
        name: Trivy Docker Image Scan - ${{ matrix.component }}
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                component: [backend, bots]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: |
                  docker build -t ${{ matrix.component }}:latest ./${{ matrix.component }}

            - name: Run Trivy scanner on Docker image
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "${{ matrix.component }}:latest"
                  format: "sarif"
                  output: "trivy-${{ matrix.component }}-results.sarif"
                  severity: "CRITICAL,HIGH"
                  exit-code: "0"

            - name: Upload Trivy results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-${{ matrix.component }}-results.sarif"

            - name: Run Trivy with table output
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: "${{ matrix.component }}:latest"
                  format: "table"
                  output: "trivy-${{ matrix.component }}-table.txt"

            - name: Upload Trivy reports
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-${{ matrix.component }}-scan
                  path: |
                      trivy-${{ matrix.component }}-results.sarif
                      trivy-${{ matrix.component }}-table.txt
                  retention-days: 30

    trivy-config-scan:
        name: Trivy Configuration Scan
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy config scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "config"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-config-results.sarif"
                  exit-code: "0"

            - name: Upload Trivy config results
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-config-results.sarif"

            - name: Run Trivy IaC scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "config"
                  scan-ref: ".dev"
                  format: "json"
                  output: "trivy-iac-results.json"

            - name: Upload Trivy IaC report
              uses: actions/upload-artifact@v4
              with:
                  name: trivy-iac-scan
                  path: trivy-iac-results.json
                  retention-days: 30

    trivy-summary:
        name: Trivy Scan Summary
        runs-on: ubuntu-latest
        needs: [trivy-repo-scan, trivy-docker-scan, trivy-config-scan]
        if: always()

        steps:
            - name: Generate summary
              run: |
                  echo "## Trivy Security Scan Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Repository Scan | ${{ needs.trivy-repo-scan.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Docker Images | ${{ needs.trivy-docker-scan.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Configuration Scan | ${{ needs.trivy-config-scan.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "🔍 Check the Security tab for detailed vulnerability reports." >> $GITHUB_STEP_SUMMARY
