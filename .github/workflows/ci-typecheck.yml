name: Type Check

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    merge_group:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    project-metadata:
        name: Discover Frontend Projects
        runs-on: ubuntu-latest
        outputs:
            active_project: ${{ steps.context.outputs.active_project }}
            active_project_name: ${{ steps.context.outputs.active_project_name }}
            frontends: ${{ steps.context.outputs.frontends }}
            bun_projects: ${{ steps.context.outputs.bun_projects }}
        steps:
            - name: Checkout configuration
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Load project context
              id: context
              uses: ./.github/actions/project-context

    typescript-typecheck:
        name: TypeScript Type Check
        needs: project-metadata
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.2"

            - name: Run TypeScript compiler for frontend projects
              env:
                  FRONTENDS: ${{ needs.project-metadata.outputs.frontends }}
              run: |
                  set -eo pipefail
                  FRONTENDS="${FRONTENDS:-[]}"
                  if [ "$FRONTENDS" = "[]" ]; then
                    echo "No frontend projects detected; skipping."
                    exit 0
                  fi
                  echo "$FRONTENDS" | jq -c '.[]' | while read -r project; do
                    path=$(echo "$project" | jq -r '.path')
                    name=$(echo "$project" | jq -r '.name')
                    echo "::group::Type checking $name ($path)"
                    if [ ! -d "$path" ]; then
                      echo "Skipping $name (missing $path)"
                      echo "::endgroup::"
                      continue
                    fi
                    (cd "$path" && bun install --frozen-lockfile && bun run tsc --noEmit 2>/dev/null || bunx tsc --noEmit --pretty 2>/dev/null || true)
                    (cd "$path" && bunx type-coverage --at-least 90 2>/dev/null) || true
                    echo "::endgroup::"
                  done

    python-typecheck:
        name: Python Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies
              working-directory: .bot
              run: poetry install --no-interaction

            - name: Run mypy
              working-directory: .bot
              run: |
                  poetry run mypy core integration \
                    --strict \
                    --pretty \
                    --show-error-codes \
                    --show-column-numbers \
                    --no-error-summary

            - name: Run pyright
              working-directory: .bot
              run: |
                  pip install pyright || true
                  poetry run pyright core integration
              continue-on-error: true

    go-typecheck:
        name: Go Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            matrix:
                component: [db, token]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"
                  cache-dependency-path: .backend/${{ matrix.component }}/go.sum

            - name: Run go vet
              working-directory: .backend/${{ matrix.component }}
              run: go vet ./...

            - name: Check go types
              working-directory: .backend/${{ matrix.component }}
              run: go build -o /dev/null ./...

    rust-typecheck:
        name: Rust Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.76.0

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: .devcontainer/contract

            - name: Run cargo check
              working-directory: .devcontainer/contract
              run: cargo check --all-targets --all-features

    typecheck-summary:
        name: Type Check Summary
        runs-on: ubuntu-latest
        needs:
            [
                project-metadata,
                typescript-typecheck,
                python-typecheck,
                go-typecheck,
                rust-typecheck,
            ]
        if: always()

        steps:
            - name: Generate summary
              run: |
                  echo "## Type Check Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Language | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| TypeScript | ${{ needs.typescript-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Python | ${{ needs.python-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Go | ${{ needs.go-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Rust | ${{ needs.rust-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ needs.typescript-typecheck.result }}" != "success" ] || \
                     [ "${{ needs.python-typecheck.result }}" != "success" ] || \
                     [ "${{ needs.go-typecheck.result }}" != "success" ] || \
                     [ "${{ needs.rust-typecheck.result }}" != "success" ]; then
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "❌ Type checking failed!" >> $GITHUB_STEP_SUMMARY
                    exit 1
                  else
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "✅ All type checks passed!" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "### Active Project" >> $GITHUB_STEP_SUMMARY
                    echo "- Name: **${{ needs.project-metadata.outputs.active_project_name || needs.project-metadata.outputs.active_project || 'n/a' }}**" >> $GITHUB_STEP_SUMMARY
                  fi
