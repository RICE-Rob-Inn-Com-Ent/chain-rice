name: infra-ansible

on:
  push:
    paths:
      - ".devcontainer/auto/**"
      - "docs/infra/**"
      - ".github/workflows/infra-ansible.yml"
  pull_request:
    paths:
      - ".devcontainer/auto/**"
      - "docs/infra/**"
      - ".github/workflows/infra-ansible.yml"

jobs:
  ansible-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install -r .devcontainer/auto/requirements.yml
          ansible-galaxy install -r .devcontainer/auto/requirements.yml

      - name: Syntax check playbook (local inventory)
        run: |
          cd .devcontainer/auto && ansible-playbook app/playbooks/install.yml -i app/inventory/hosts.yml --syntax-check

      - name: Run ansible-lint
        run: |
          cd .devcontainer/auto && ansible-lint .

