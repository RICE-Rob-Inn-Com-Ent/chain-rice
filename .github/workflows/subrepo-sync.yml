name: Subrepo Synchronization

on:
  schedule:
    # Run every 6 hours to sync subrepos
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync-all'
        type: choice
        options:
          - sync-all
          - pull-all
          - push-all
          - status

jobs:
  subrepo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up subrepo manager
        run: |
          chmod +x .github/git-subrepo-manager.sh

      - name: Check subrepo status
        run: |
          ./.github/git-subrepo-manager.sh status

      - name: Pull all subrepos
        if: github.event.inputs.action == 'pull-all' || github.event.inputs.action == 'sync-all' || github.event_name == 'schedule'
        run: |
          ./.github/git-subrepo-manager.sh pull-all

      - name: Build and test subrepos
        if: github.event.inputs.action == 'sync-all' || github.event_name == 'schedule'
        run: |
          # Build chain-rice if present
          if [ -d "apps/chain-rice" ]; then
            echo "Building chain-rice..."
            cd apps/chain-rice
            make build || echo "Build failed for chain-rice"
            cd ../..
          fi
          
          # Build meowtopia if present
          if [ -d "apps/meowtopia" ]; then
            echo "Building meowtopia..."
            cd apps/meowtopia
            yarn install --frozen-lockfile || echo "Install failed for meowtopia"
            yarn build || echo "Build failed for meowtopia"
            cd ../..
          fi

      - name: Push all subrepos
        if: github.event.inputs.action == 'push-all' || github.event.inputs.action == 'sync-all'
        run: |
          ./.github/git-subrepo-manager.sh push-all

      - name: Create sync report
        run: |
          echo "# Subrepo Sync Report" > sync-report.md
          echo "Date: $(date)" >> sync-report.md
          echo "Action: ${{ github.event.inputs.action || 'scheduled' }}" >> sync-report.md
          echo "" >> sync-report.md
          ./.github/git-subrepo-manager.sh status >> sync-report.md
          
          # Upload as artifact
          echo "sync-report.md" >> $GITHUB_STEP_SUMMARY
