# .github/workflows/pre-commit.yml
name: Pre-commit Checks

on:
    push:
        branches: [main, development, v.*]
    pull_request:
        branches: [main, development]

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        name: Pre-commit Checks

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history for better analysis

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install Nix
              uses: cachix/install-nix-action@v23
              with:
                  nix_path: nixpkgs=channel:nixos-unstable

            - name: Enter Nix shell
              run: |
                  nix --extra-experimental-features 'nix-command flakes' develop --impure -c echo "Nix shell ready"

            - name: Install pre-commit
              run: |
                  nix --extra-experimental-features 'nix-command flakes' develop --impure -c pip install pre-commit

            - name: Run pre-commit
              run: |
                  nix --extra-experimental-features 'nix-command flakes' develop --impure -c pre-commit run --all-files
              env:
                  SKIP: nix-check,bazel-build-check # Skip heavy checks in CI

    # =============================================================================
    # LANGUAGE-SPECIFIC CHECKS
    # =============================================================================

    python-checks:
        runs-on: ubuntu-latest
        name: Python Checks
        if: contains(github.event.head_commit.modified, 'bots/') || contains(github.event.head_commit.modified, 'libs/connection/FastAPI/')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  cd bots && pip install -e .
                  cd ../libs/connection/FastAPI && pip install -e .

            - name: Run Python tests
              run: |
                  cd bots && python -m pytest
                  cd ../libs/connection/FastAPI && python -m pytest

    go-checks:
        runs-on: ubuntu-latest
        name: Go Checks
        if: contains(github.event.head_commit.modified, 'libs/backend/')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"

            - name: Run Go tests
              run: |
                  cd libs/backend && go test ./...

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v3
              with:
                  working-directory: libs/backend

    rust-checks:
        runs-on: ubuntu-latest
        name: Rust Checks
        if: contains(github.event.head_commit.modified, 'libs/contract/rust/')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  components: rustfmt, clippy

            - name: Run Rust tests
              run: |
                  cd libs/contract/rust && cargo test

            - name: Run clippy
              run: |
                  cd libs/contract/rust && cargo clippy -- -D warnings

    frontend-checks:
        runs-on: ubuntu-latest
        name: Frontend Checks
        if: contains(github.event.head_commit.modified, 'libs/frontend/') || contains(github.event.head_commit.modified, 'projects/chain-rice/')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: |
                      libs/frontend/ts/package-lock.json
                      projects/chain-rice/package-lock.json

            - name: Install dependencies
              run: |
                  cd libs/frontend/ts && npm ci
                  cd ../../../projects/chain-rice && npm ci

            - name: Run ESLint
              run: |
                  cd libs/frontend/ts && npm run lint
                  cd ../../../projects/chain-rice && npm run lint

            - name: Run tests
              run: |
                  cd libs/frontend/ts && npm test
                  cd ../../../projects/chain-rice && npm test

    # =============================================================================
    # BAZEL BUILD CHECK
    # =============================================================================

    bazel-build:
        runs-on: ubuntu-latest
        name: Bazel Build Check

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Nix
              uses: cachix/install-nix-action@v23

            - name: Enter Nix shell and run Bazel
              run: |
                  nix --extra-experimental-features 'nix-command flakes' develop .#bazel-dev --impure -c bazel build //...
