# This workflow creates releases for subrepos (chain-rice and meowtopia)
# when you push a new tag with a "v" prefix (version).
#
# The workflow will:
# 1. Pull the specific subrepo based on the tag
# 2. Build and package the subrepo
# 3. Create a release with the built assets
#
# Tag format: v<subrepo>-<version> (e.g., vchain-rice-1.0.0, vmeowtopia-2.1.0)
on:
  push:
    tags:
      - 'v*-*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag and subrepo
        id: parse
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Extract subrepo and version from tag (e.g., vchain-rice-1.0.0 -> chain-rice)
          SUBREPO=$(echo $TAG_NAME | sed 's/^v//' | cut -d'-' -f1)
          VERSION=$(echo $TAG_NAME | sed 's/^v//' | cut -d'-' -f2-)
          
          echo "subrepo=$SUBREPO" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          echo "Tag: $TAG_NAME"
          echo "Subrepo: $SUBREPO"
          echo "Version: $VERSION"

      - name: Pull specific subrepo
        run: |
          chmod +x .github/git-subrepo-manager.sh
          ./.github/git-subrepo-manager.sh pull ${{ steps.parse.outputs.subrepo }}

      - name: Build chain-rice (if applicable)
        if: steps.parse.outputs.subrepo == 'chain-rice'
        run: |
          cd apps/chain-rice
          make build
          # Create release directory
          mkdir -p ../../release
          # Copy built binaries
          cp build/chainrice* ../../release/ || true
          cp -r build/ ../../release/chain-rice-build/ || true

      - name: Build meowtopia (if applicable)
        if: steps.parse.outputs.subrepo == 'meowtopia'
        run: |
          cd apps/meowtopia
          yarn install
          yarn build
          # Create release directory
          mkdir -p ../../release
          # Copy built files
          cp -r dist/ ../../release/meowtopia-dist/ || true
          cp -r build/ ../../release/meowtopia-build/ || true
          # Copy package files
          cp package.json ../../release/meowtopia-package.json || true
          cp yarn.lock ../../release/meowtopia-yarn.lock || true

      - name: Create release archive
        run: |
          cd release
          tar -czf ../${{ steps.parse.outputs.subrepo }}-${{ steps.parse.outputs.version }}.tar.gz *
          cd ..
          ls -la *.tar.gz

      - name: Publish the Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.parse.outputs.tag_name }}
          files: |
            ${{ steps.parse.outputs.subrepo }}-${{ steps.parse.outputs.version }}.tar.gz
            release/*
          name: ${{ steps.parse.outputs.subrepo }} ${{ steps.parse.outputs.version }}
          body: |
            Release of ${{ steps.parse.outputs.subrepo }} version ${{ steps.parse.outputs.version }}
            
            ## Changes
            - Built and packaged ${{ steps.parse.outputs.subrepo }}
            - Includes all necessary files and dependencies
            
            ## Installation
            Extract the archive and follow the README instructions for ${{ steps.parse.outputs.subrepo }}.
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push subrepo back to remote
        run: |
          ./.github/git-subrepo-manager.sh push ${{ steps.parse.outputs.subrepo }}
