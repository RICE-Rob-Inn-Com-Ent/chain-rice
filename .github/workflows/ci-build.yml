name: Build

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    merge_group:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    BAZEL_VERSION: "7.2.1"

jobs:
    bazel-build:
        name: Bazel Build
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                # Add macos-latest and windows-latest for multi-platform builds if needed

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Full history for build stamping

            - name: Set up Bazel
              uses: bazel-contrib/setup-bazel@0.8.1
              with:
                  bazelisk-cache: true
                  disk-cache: ${{ github.workflow }}
                  repository-cache: true
                  bazelisk-version: "1.x"

            - name: Configure Bazel
              run: |
                  cat >> .bazelrc.local <<EOF
                  # CI-specific configuration
                  build --show_timestamps
                  build --verbose_failures
                  build --jobs=auto
                  build --keep_going
                  build --progress_report_interval=10
                  EOF

            - name: Build all targets
              run: |
                  bazelisk build \
                    --config=ci \
                    --remote_cache=https://storage.googleapis.com/bazel-remote-cache \
                    --google_default_credentials=false \
                    //...

            - name: Run buildifier (Bazel lint)
              run: |
                  bazelisk run //:buildifier -- --mode=check --lint=warn -r .
              continue-on-error: true

            - name: Generate build report
              if: always()
              run: |
                  bazelisk analyze-profile --dump=text bazel-out/profile.gz > build-profile.txt 2>/dev/null || echo "No profile available"

            - name: Upload build profile
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bazel-build-profile-${{ matrix.os }}
                  path: build-profile.txt
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Cache Bazel artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/bazel
                      ~/.cache/bazelisk
                  key: ${{ runner.os }}-bazel-${{ hashFiles('**/*.bazel', '**/*.bzl', 'WORKSPACE', 'MODULE.bazel') }}
                  restore-keys: |
                      ${{ runner.os }}-bazel-

    component-builds:
        name: Component Build - ${{ matrix.component }}
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                component:
                    - name: Backend DB
                      path: .backend/db
                      language: go
                    - name: Backend Token
                      path: .backend/token
                      language: go
                    - name: Frontend Web
                      path: .frontend/web
                      language: typescript
                    - name: Bot Core
                      path: .bot/core
                      language: python

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              if: matrix.component.language == 'go'
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"
                  cache-dependency-path: ${{ matrix.component.path }}/go.sum

            - name: Build Go component
              if: matrix.component.language == 'go'
              working-directory: ${{ matrix.component.path }}
              run: |
                  go build -v ./...
                  go vet ./...

            - name: Set up Node.js
              if: matrix.component.language == 'typescript'
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: ${{ matrix.component.path }}/package-lock.json

            - name: Build TypeScript component
              if: matrix.component.language == 'typescript'
              working-directory: ${{ matrix.component.path }}
              run: |
                  npm ci
                  npm run build --if-present

            - name: Set up Python
              if: matrix.component.language == 'python'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Build Python component
              if: matrix.component.language == 'python'
              working-directory: ${{ matrix.component.path }}
              run: |
                  pip install poetry
                  poetry install --no-interaction
                  poetry build

    rust-build:
        name: Rust Smart Contracts
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.76.0
                  components: rustfmt, clippy

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: .backend/contract/rust

            - name: Build Rust contracts
              working-directory: .backend/contract/rust
              run: |
                  cargo build --release --all-features
                  cargo clippy -- -D warnings

            - name: Upload Rust artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: rust-contracts
                  path: .backend/contract/rust/target/release/
                  retention-days: 7

    solidity-build:
        name: Solidity Smart Contracts
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: .backend/contract/solidity/package-lock.json

            - name: Install dependencies
              working-directory: .backend/contract/solidity
              run: npm ci

            - name: Compile Solidity contracts
              working-directory: .backend/contract/solidity
              run: npx hardhat compile

            - name: Upload Solidity artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: solidity-contracts
                  path: .backend/contract/solidity/artifacts/
                  retention-days: 7

    proto-build:
        name: Protocol Buffers
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Buf
              uses: bufbuild/buf-setup-action@v1
              with:
                  github_token: ${{ github.token }}

            - name: Lint Protocol Buffers
              working-directory: .schema
              run: buf lint

            - name: Check breaking changes
              if: github.event_name == 'pull_request'
              working-directory: .schema
              run: buf breaking --against '.git#branch=main'

            - name: Generate code from protos
              working-directory: .schema
              run: buf generate

    build-summary:
        name: Build Summary
        runs-on: ubuntu-latest
        needs:
            [
                bazel-build,
                component-builds,
                rust-build,
                solidity-build,
                proto-build,
            ]
        if: always()

        steps:
            - name: Check build results
              run: |
                  echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Bazel Build | ${{ needs.bazel-build.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Component Builds | ${{ needs.component-builds.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Rust Build | ${{ needs.rust-build.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Solidity Build | ${{ needs.solidity-build.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Proto Build | ${{ needs.proto-build.result }} |" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ needs.bazel-build.result }}" != "success" ] || \
                     [ "${{ needs.component-builds.result }}" != "success" ] || \
                     [ "${{ needs.rust-build.result }}" != "success" ] || \
                     [ "${{ needs.solidity-build.result }}" != "success" ] || \
                     [ "${{ needs.proto-build.result }}" != "success" ]; then
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "❌ Build failed!" >> $GITHUB_STEP_SUMMARY
                    exit 1
                  else
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "✅ All builds passed!" >> $GITHUB_STEP_SUMMARY
                  fi
