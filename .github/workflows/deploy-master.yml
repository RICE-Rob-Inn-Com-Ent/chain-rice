name: Deploy master with subrepos

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull all subrepos
        run: |
          chmod +x .github/git-subrepo-manager.sh
          ./.github/git-subrepo-manager.sh pull-all

      - name: Build chain-rice blockchain
        run: |
          cd apps/chain-rice
          make build

      - name: Build meowtopia web app
        run: |
          cd apps/meowtopia
          yarn install
          yarn build

      - name: Build images with bake (blockchain + backend + web)
        run: |
          docker buildx bake -f docker-bake.hcl

      - name: Compose up with blockchain profile
        env:
          API_PORT: 8000
        run: |
          docker compose --profile blockchain --profile app up -d

      - name: Push all subrepos after deployment
        run: |
          ./.github/git-subrepo-manager.sh push-all


