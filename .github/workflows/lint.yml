name: Lint

on:
    push:
        branches: [main, dev]
    pull_request:

jobs:
    pre-commit:
        name: Run pre-commit checks
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Nix
              uses: cachix/install-nix-action@v27

            - name: Run pre-commit
              run: |
                  nix develop -c pre-commit run --all-files
