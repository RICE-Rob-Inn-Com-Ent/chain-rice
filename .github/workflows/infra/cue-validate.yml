# Thin wrapper: CUE contracts for CI live in infra/ci/cue.
# Full monorepo audit: .github/workflows/rice-ci.yml (dagger call rice audit).
name: Infra — CUE validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/**"
      - "cue.mod/**"
      - ".github/workflows/infra/cue-validate.yml"

permissions:
  contents: read

jobs:
  cue-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install CUE CLI
        run: go install cuelang.org/go/cmd/cue@v0.9.2

      - name: Vet CI / manifest CUE
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          cue version
          for d in ./infra/ci/cue; do
            if compgen -G "${d}/*.cue" > /dev/null; then
              cue vet "${d}"
            fi
          done


