name: 🔍 Lint

on:
  push:
    branches: [main, dev, v.*]
  pull_request:
    branches: [main, dev]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  project-metadata:
    name: Discover Frontend Projects
    runs-on: ubuntu-latest
    outputs:
      active_project: ${{ steps.context.outputs.active_project }}
      active_project_name: ${{ steps.context.outputs.active_project_name }}
      frontends: ${{ steps.context.outputs.frontends }}
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load project context
        id: context
        uses: ./.github/actions/project-context

  # ===========================================================================
  # PYTHON (.bot/)
  # ===========================================================================
  python-lint:
    name: 🐍 Python (Ruff + mypy + Black)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install ruff black mypy isort bandit safety
          pip install types-requests types-python-dateutil

      - name: Run Ruff (lint + format check)
        working-directory: .bot
        run: |
          echo "::group::Ruff Lint"
          ruff check . --config ruff.toml --output-format=github || true
          echo "::endgroup::"

          echo "::group::Ruff Format Check"
          ruff format --check --config ruff.toml . || true
          echo "::endgroup::"

      - name: Run Black
        working-directory: .bot
        run: black --check --diff .
        continue-on-error: true

      - name: Run isort
        working-directory: .bot
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Run mypy
        working-directory: .bot
        run: mypy --config-file pyproject.toml --ignore-missing-imports core integration || true

      - name: Run Bandit (security)
        working-directory: .bot
        run: |
          bandit -r core integration -f json -o bandit-report.json || true
          bandit -r core integration

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-bandit-report
          path: .bot/bandit-report.json
          retention-days: 7

  # ===========================================================================
  # GO (.backend/db/, .backend/token/)
  # ===========================================================================
  go-lint:
    name: 🔵 Go - ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        component: [db, token]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: .backend/${{ matrix.component }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: .backend/${{ matrix.component }}
          args: --timeout=10m --verbose --config ../.golangci.yml

      - name: Run go vet
        working-directory: .backend/${{ matrix.component }}
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
          working-directory: .backend/${{ matrix.component }}

  # ===========================================================================
  # TYPESCRIPT (.frontend/web/)
  # ===========================================================================
  typescript-lint:
    name: ✨ TypeScript (ESLint + Prettier + TSC)
    needs: project-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Lint project frontends
        env:
          FRONTENDS: ${{ needs.project-metadata.outputs.frontends }}
        run: |
          set -eo pipefail
          FRONTENDS="${FRONTENDS:-[]}"
          if [ "$FRONTENDS" = "[]" ]; then
            echo "No frontend projects detected; skipping."
            exit 0
          fi
          echo "$FRONTENDS" | jq -c '.[]' | while read -r project; do
            path=$(echo "$project" | jq -r '.path')
            name=$(echo "$project" | jq -r '.name')
            echo "::group::Linting $name ($path)"
            if [ ! -d "$path" ]; then
              echo "Skipping $name (missing $path)"
              echo "::endgroup::"
              continue
            fi
            (cd "$path" && bun install --frozen-lockfile && bun run lint --if-present 2>/dev/null || true && bunx prettier --check "**/*.{js,jsx,ts,tsx,json,css,scss}" 2>/dev/null || true && bunx tsc --noEmit 2>/dev/null || true)
            echo "::endgroup::"
          done

  # ===========================================================================
  # RUST (.devcontainer/contract/)
  # ===========================================================================
  rust-lint:
    name: 🦀 Rust (Clippy + rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .devcontainer/contract

      - name: Run rustfmt
        working-directory: .devcontainer/contract
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: .devcontainer/contract
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: .devcontainer/contract/Cargo.toml

  # ===========================================================================
  # SOLIDITY (.backend/contract/solidity/)
  # ===========================================================================
  solidity-lint:
    name: ⛓️  Solidity (solhint + slither)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install dependencies
        working-directory: .backend/contract/solidity
        run: bun install --frozen-lockfile

      - name: Run Solhint
        working-directory: .backend/contract/solidity
        run: bunx solhint 'contracts/**/*.sol' || true

      - name: Run Prettier (Solidity)
        working-directory: .backend/contract/solidity
        run: bunx prettier --check 'contracts/**/*.sol'

      - name: Run Slither (security)
        uses: crytic/slither-action@v0.4.0
        with:
          target: .backend/contract/solidity/contracts
          slither-args: --filter-paths "node_modules" --exclude naming-convention,external-function
        continue-on-error: true

  # ===========================================================================
  # DART/FLUTTER (.frontend/flutter/)
  # ===========================================================================
  dart-lint:
    name: 🎯 Dart/Flutter (analyze)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Get dependencies
        working-directory: .frontend/flutter
        run: flutter pub get

      - name: Run flutter analyze
        working-directory: .frontend/flutter
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        working-directory: .frontend/flutter
        run: dart format --set-exit-if-changed .

  # ===========================================================================
  # PROTOCOL BUFFERS (.schema/)
  # ===========================================================================
  proto-lint:
    name: 📦 Protobuf (buf lint + breaking)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Run Buf lint
        working-directory: .schema
        run: buf lint

      - name: Run Buf format check
        working-directory: .schema
        run: buf format --diff --exit-code

      - name: Check breaking changes
        working-directory: .schema
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'
        continue-on-error: true

  # ===========================================================================
  # TERRAFORM (.devcontainer/auto/terraform/)
  # ===========================================================================
  terraform-lint:
    name: 🏗️  Terraform (tflint + tfsec)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform fmt check
        working-directory: .devcontainer/auto/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: .devcontainer/auto/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: .devcontainer/auto/terraform
        run: |
          tflint --init
          tflint --recursive

      - name: Run tfsec (security)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: .devcontainer/auto/terraform
          soft_fail: true

  # ===========================================================================
  # MARKDOWN (.doc/, README files)
  # ===========================================================================
  markdown-lint:
    name: 📝 Markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/.venv/**
            !**/vendor/**
          config: .markdownlint.json

  # ===========================================================================
  # YAML
  # ===========================================================================
  yaml-lint:
    name: 📋 YAML (yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
          file_or_dir: .
          strict: false
          format: github

  # ===========================================================================
  # DOCKER
  # ===========================================================================
  dockerfile-lint:
    name: 🐳 Dockerfile (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: warning
          dockerfile: "**/Dockerfile*"

  # ===========================================================================
  # SHELL SCRIPTS
  # ===========================================================================
  shell-lint:
    name: 🐚 Shell (ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          check_together: "yes"

  # ===========================================================================
  # BAZEL
  # ===========================================================================
  bazel-lint:
    name: 🏗️  Bazel (buildifier)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up buildifier
        run: |
          curl -L -o buildifier https://github.com/bazelbuild/buildtools/releases/latest/download/buildifier-linux-amd64
          chmod +x buildifier

      - name: Run buildifier
        run: |
          ./buildifier -mode=check -lint=warn $(find . -type f \( -name 'BUILD' -o -name 'BUILD.bazel' -o -name '*.bzl' -o -name 'WORKSPACE' \))

  # ===========================================================================
  # COMMIT MESSAGES (PRs only)
  # ===========================================================================
  commitlint:
    name: 💬 Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Validate commit messages
        run: |
          bunx commitlint \
            -c .devcontainer/node/.commitlintrc.js \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ===========================================================================
  # SPELL CHECK
  # ===========================================================================
  spell-check:
    name: 📖 Spell Check (codespell)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_list: ba,te,nd,unexpect,aci,ser,ist,infos,ue,fo,dur
          skip: "*.lock,*.sum,*.min.js,*.min.css,node_modules,dist,build"

  # ===========================================================================
  # LICENSE COMPLIANCE
  # ===========================================================================
  license-check:
    name: ⚖️  License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check license headers
        uses: apache/skywalking-eyes/header@v0.6.0
        with:
          mode: check
        continue-on-error: true

  # ===========================================================================
  # DEPENDENCY REVIEW (PRs only)
  # ===========================================================================
  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # ===========================================================================
  # LINT SUMMARY
  # ===========================================================================
  lint-summary:
    name: 📊 Lint Summary
    runs-on: ubuntu-latest
    needs:
      - project-metadata
      - python-lint
      - go-lint
      - typescript-lint
      - rust-lint
      - solidity-lint
      - dart-lint
      - proto-lint
      - terraform-lint
      - markdown-lint
      - yaml-lint
      - dockerfile-lint
      - shell-lint
      - bazel-lint
      - spell-check
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🔍 Lint Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language/Tool | Status | Icon |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Python | \`${{ needs.python-lint.result }}\` | ${{ needs.python-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Go | \`${{ needs.go-lint.result }}\` | ${{ needs.go-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✨ TypeScript | \`${{ needs.typescript-lint.result }}\` | ${{ needs.typescript-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🦀 Rust | \`${{ needs.rust-lint.result }}\` | ${{ needs.rust-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⛓️  Solidity | \`${{ needs.solidity-lint.result }}\` | ${{ needs.solidity-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Dart/Flutter | \`${{ needs.dart-lint.result }}\` | ${{ needs.dart-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Protobuf | \`${{ needs.proto-lint.result }}\` | ${{ needs.proto-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️  Terraform | \`${{ needs.terraform-lint.result }}\` | ${{ needs.terraform-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Markdown | \`${{ needs.markdown-lint.result }}\` | ${{ needs.markdown-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 YAML | \`${{ needs.yaml-lint.result }}\` | ${{ needs.yaml-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker | \`${{ needs.dockerfile-lint.result }}\` | ${{ needs.dockerfile-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐚 Shell | \`${{ needs.shell-lint.result }}\` | ${{ needs.shell-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️  Bazel | \`${{ needs.bazel-lint.result }}\` | ${{ needs.bazel-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 Spelling | \`${{ needs.spell-check.result }}\` | ${{ needs.spell-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count failures
          FAILED=0
          [ "${{ needs.python-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.go-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.typescript-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.rust-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.solidity-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.dart-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.proto-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.terraform-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.markdown-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.yaml-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.dockerfile-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.shell-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.bazel-lint.result }}" != "success" ] && FAILED=$((FAILED+1))
          [ "${{ needs.spell-check.result }}" != "success" ] && FAILED=$((FAILED+1))

          echo "## Results" >> $GITHUB_STEP_SUMMARY
          if [ $FAILED -eq 0 ]; then
            echo "✅ **All linters passed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Active Project" >> $GITHUB_STEP_SUMMARY
            echo "- Name: **${{ needs.project-metadata.outputs.active_project_name || needs.project-metadata.outputs.active_project || 'n/a' }}**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **$FAILED linter(s) failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the individual job logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
