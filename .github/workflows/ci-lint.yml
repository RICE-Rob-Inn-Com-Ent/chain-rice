name: Lint

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    merge_group:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    super-linter:
        name: Super Linter
        runs-on: ubuntu-latest
        timeout-minutes: 15

        permissions:
            contents: read
            statuses: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Super-Linter
              uses: super-linter/super-linter@v6
              env:
                  DEFAULT_BRANCH: main
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                  VALIDATE_PYTHON_BLACK: true
                  VALIDATE_PYTHON_FLAKE8: true
                  VALIDATE_PYTHON_PYLINT: true
                  VALIDATE_GO: true
                  VALIDATE_JAVASCRIPT_ES: true
                  VALIDATE_TYPESCRIPT_ES: true
                  VALIDATE_MARKDOWN: true
                  VALIDATE_YAML: true
                  VALIDATE_DOCKERFILE_HADOLINT: true
                  VALIDATE_BASH: true
                  VALIDATE_TERRAFORM_TFLINT: true
                  VALIDATE_JSON: true
                  VALIDATE_XML: true
                  FILTER_REGEX_EXCLUDE: .*node_modules/.*|.*\.git/.*

    python-lint:
        name: Python Linting
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Install linting tools
              run: |
                  pip install ruff black mypy isort bandit safety

            - name: Run Ruff
              working-directory: .bot
              run: ruff check . --output-format=github
              continue-on-error: true

            - name: Run Black
              working-directory: .bot
              run: black --check --diff .
              continue-on-error: true

            - name: Run isort
              working-directory: .bot
              run: isort --check-only --diff .
              continue-on-error: true

            - name: Run mypy
              working-directory: .bot
              run: mypy core integration --strict
              continue-on-error: true

            - name: Run Bandit security checks
              working-directory: .bot
              run: bandit -r core integration -f json -o bandit-report.json
              continue-on-error: true

            - name: Upload Bandit report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bandit-report
                  path: .bot/bandit-report.json
                  retention-days: 7

    go-lint:
        name: Go Linting - ${{ matrix.component }}
        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            matrix:
                component: [db, token]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"
                  cache: false

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v4
              with:
                  version: v1.55.2
                  working-directory: .backend/${{ matrix.component }}
                  args: --timeout=10m --verbose

            - name: Run go vet
              working-directory: .backend/${{ matrix.component }}
              run: go vet ./...

            - name: Run staticcheck
              uses: dominikh/staticcheck-action@v1
              with:
                  version: "2023.1.7"
                  install-go: false
                  working-directory: .backend/${{ matrix.component }}

    typescript-lint:
        name: TypeScript Linting
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: .frontend/web/package-lock.json

            - name: Install dependencies
              working-directory: .frontend/web
              run: npm ci

            - name: Run ESLint
              working-directory: .frontend/web
              run: npm run lint --if-present

            - name: Run Prettier check
              working-directory: .frontend/web
              run: npx prettier --check .

            - name: Run TSC type check
              working-directory: .frontend/web
              run: npx tsc --noEmit

    rust-lint:
        name: Rust Linting
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.76.0
                  components: rustfmt, clippy

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: .backend/contract/rust

            - name: Run rustfmt
              working-directory: .backend/contract/rust
              run: cargo fmt -- --check

            - name: Run Clippy
              working-directory: .backend/contract/rust
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Run cargo deny
              uses: EmbarkStudios/cargo-deny-action@v1
              with:
                  manifest-path: .backend/contract/rust/Cargo.toml

    solidity-lint:
        name: Solidity Linting
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: .backend/contract/solidity/package-lock.json

            - name: Install dependencies
              working-directory: .backend/contract/solidity
              run: npm ci

            - name: Run Solhint
              working-directory: .backend/contract/solidity
              run: npx solhint 'contracts/**/*.sol'
              continue-on-error: true

            - name: Run Prettier (Solidity)
              working-directory: .backend/contract/solidity
              run: npx prettier --check 'contracts/**/*.sol'

    markdown-lint:
        name: Markdown Linting
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run markdownlint
              uses: DavidAnson/markdownlint-cli2-action@v15
              with:
                  globs: |
                      **/*.md
                      !**/node_modules/**
                      !**/.venv/**

    yaml-lint:
        name: YAML Linting
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run yamllint
              uses: ibiqlik/action-yamllint@v3
              with:
                  config_file: .yamllint.yml
                  file_or_dir: .
                  strict: true

    dockerfile-lint:
        name: Dockerfile Linting
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Hadolint
              uses: hadolint/hadolint-action@v3.1.0
              with:
                  recursive: true
                  failure-threshold: warning

    shell-lint:
        name: Shell Script Linting
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run ShellCheck
              uses: ludeeus/action-shellcheck@master
              with:
                  severity: warning

    proto-lint:
        name: Protocol Buffers Linting
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Buf
              uses: bufbuild/buf-setup-action@v1
              with:
                  github_token: ${{ github.token }}

            - name: Run Buf lint
              working-directory: .schema
              run: buf lint

            - name: Run Buf format check
              working-directory: .schema
              run: buf format --diff --exit-code

    terraform-lint:
        name: Terraform Linting
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.7.0

            - name: Terraform fmt check
              working-directory: .dev/terraform
              run: terraform fmt -check -recursive

            - name: Run tflint
              uses: terraform-linters/setup-tflint@v4

            - name: TFLint
              working-directory: .dev/terraform
              run: |
                  tflint --init
                  tflint --recursive

    commitlint:
        name: Commit Message Linting
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install commitlint
              run: |
                  npm install -g @commitlint/cli @commitlint/config-conventional

            - name: Validate commit messages
              run: |
                  npx commitlint \
                    --from ${{ github.event.pull_request.base.sha }} \
                    --to ${{ github.event.pull_request.head.sha }} \
                    --verbose

    license-check:
        name: License Compliance
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Check license headers
              uses: apache/skywalking-eyes/header@v0.6.0
              with:
                  mode: check
                  config: .licenserc.yaml

    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        timeout-minutes: 10

        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Dependency Review
              uses: actions/dependency-review-action@v4
              with:
                  fail-on-severity: moderate
                  deny-licenses: GPL-2.0, GPL-3.0

    lint-summary:
        name: Lint Summary
        runs-on: ubuntu-latest
        needs:
            - python-lint
            - go-lint
            - typescript-lint
            - rust-lint
            - solidity-lint
            - markdown-lint
            - yaml-lint
            - dockerfile-lint
            - shell-lint
            - proto-lint
            - terraform-lint
        if: always()

        steps:
            - name: Check lint results
              run: |
                  echo "## Lint Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Linter | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Python | ${{ needs.python-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Go | ${{ needs.go-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| TypeScript | ${{ needs.typescript-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Rust | ${{ needs.rust-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Solidity | ${{ needs.solidity-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Markdown | ${{ needs.markdown-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| YAML | ${{ needs.yaml-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Dockerfile | ${{ needs.dockerfile-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Shell | ${{ needs.shell-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Protocol Buffers | ${{ needs.proto-lint.result }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Terraform | ${{ needs.terraform-lint.result }} |" >> $GITHUB_STEP_SUMMARY

                  FAILED=0
                  [ "${{ needs.python-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.go-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.typescript-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.rust-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.solidity-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.markdown-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.yaml-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.dockerfile-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.shell-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.proto-lint.result }}" != "success" ] && FAILED=1
                  [ "${{ needs.terraform-lint.result }}" != "success" ] && FAILED=1

                  if [ $FAILED -eq 1 ]; then
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "❌ Some linters failed!" >> $GITHUB_STEP_SUMMARY
                    exit 1
                  else
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "✅ All linters passed!" >> $GITHUB_STEP_SUMMARY
                  fi
