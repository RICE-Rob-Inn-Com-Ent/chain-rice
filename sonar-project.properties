# ============================================================================
# SONARQUBE CONFIGURATION - Rice Monorepo
# ============================================================================
# Code quality and security analysis configuration
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/
# ============================================================================

# ============================================================================
# PROJECT INFORMATION
# ============================================================================
sonar.projectKey=rice-mono
sonar.projectName=Rice Monorepo
sonar.projectVersion=1.0.0
sonar.organization=rice-dev

# ============================================================================
# SOURCE CODE
# ============================================================================
# Comma-separated paths to directories containing source files
sonar.sources=backend,bots,frontend,proto,dev,rules

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# ============================================================================
# EXCLUSIONS
# ============================================================================
# Files to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/.next/**,\
  **/.nuxt/**,\
  **/bazel-*/**,\
  **/vendor/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.bundle.js,\
  **/*.generated.*,\
  **/*_pb.js,\
  **/*_pb.ts,\
  **/*_pb2.py,\
  **/*.proto,\
  **/coverage/**,\
  **/test-results/**,\
  **/*.test.*,\
  **/*.spec.*

# Coverage exclusions
sonar.coverage.exclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  **/test/**,\
  **/tests/**,\
  **/__tests__/**,\
  **/mock/**,\
  **/mocks/**

# Duplication exclusions
sonar.cpd.exclusions=\
  **/*.generated.*,\
  **/*_pb.*

# ============================================================================
# TEST FILES
# ============================================================================
sonar.tests=backend,bots,frontend
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  **/*_test.py,\
  **/*_test.go,\
  **/*_test.rs,\
  **/test_*.py,\
  **/*_test.dart

# ============================================================================
# LANGUAGE-SPECIFIC SETTINGS
# ============================================================================

# ── JavaScript / TypeScript ──────────────────────────────────────────────
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.typescript.file.suffixes=.ts,.tsx

# TypeScript configuration
sonar.typescript.tsconfigPath=frontend/node/tsconfig.json

# ── Python ───────────────────────────────────────────────────────────────
sonar.python.version=3.11
sonar.python.file.suffixes=.py

# ── Go ───────────────────────────────────────────────────────────────────
sonar.go.coverage.reportPaths=**/coverage.out

# ── Java / Kotlin ────────────────────────────────────────────────────────
sonar.java.source=11
sonar.java.binaries=frontend/android/app/build/intermediates/javac
sonar.kotlin.source.version=1.9

# ── C# ───────────────────────────────────────────────────────────────────
sonar.cs.dotnet.version=8.0

# ============================================================================
# COVERAGE
# ============================================================================
# JavaScript/TypeScript coverage
sonar.javascript.lcov.reportPaths=\
  frontend/node/angular/coverage/lcov.info,\
  frontend/node/next/coverage/lcov.info,\
  frontend/node/nuxt/coverage/lcov.info,\
  frontend/node/svelte/coverage/lcov.info,\
  frontend/node/shared/coverage/lcov.info

# Python coverage
sonar.python.coverage.reportPaths=\
  bots/core/coverage.xml,\
  bots/integration/coverage.xml

# Go coverage
sonar.go.coverage.reportPaths=\
  backend/coverage.out

# ============================================================================
# QUALITY GATES
# ============================================================================
# Configure quality gate thresholds
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# ============================================================================
# CODE ANALYSIS
# ============================================================================
# Duplications
sonar.cpd.skip=false

# Analysis cache
sonar.analysis.cache.enabled=true

# SCM provider
sonar.scm.provider=git

# Branch analysis
sonar.branch.name=${env.BRANCH_NAME}

# Pull request analysis
sonar.pullrequest.key=${env.PULL_REQUEST_NUMBER}
sonar.pullrequest.branch=${env.PULL_REQUEST_BRANCH}
sonar.pullrequest.base=${env.PULL_REQUEST_BASE}

# ============================================================================
# EXTERNAL ANALYZERS
# ============================================================================
# ESLint report
sonar.eslint.reportPaths=\
  frontend/node/angular/eslint-report.json,\
  frontend/node/next/eslint-report.json,\
  frontend/node/nuxt/eslint-report.json,\
  frontend/node/svelte/eslint-report.json

# ============================================================================
# SECURITY
# ============================================================================
# Security hotspot rules
sonar.security.hotspots.enabled=true

# ============================================================================
# PERFORMANCE
# ============================================================================
# Number of parallel sensor executions
sonar.cpd.parallel=true

# ============================================================================
# LINKS
# ============================================================================
sonar.links.homepage=https://github.com/mrDinkelman/rice-mono
sonar.links.ci=https://github.com/mrDinkelman/rice-mono/actions
sonar.links.scm=https://github.com/mrDinkelman/rice-mono
sonar.links.issue=https://github.com/mrDinkelman/rice-mono/issues

# ============================================================================
# ISSUE FILTERS
# ============================================================================
# Skip issues on specific files
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1234
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.generated.ts

# ============================================================================
# CUSTOM RULES
# ============================================================================
# Enable/disable specific rules
# sonar.issue.ignore.allfile=1
# sonar.issue.ignore.allfile.1.fileRegexp=.*generated.*
# sonar.issue.ignore.allfile.1.ruleKey=*
