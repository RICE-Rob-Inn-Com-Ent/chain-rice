[tool.poetry]
name = "chain-rice-python-sdk"
version = "0.2.0"
description = "🔥 Chain Rice Python SDK - The ultimate learning playground for blockchain devs"
authors = ["Chain Rice Team <dev@chain-rice.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# 🤖 AI & ML Libraries (The Big Boys)
openai = "^1.40"           # OpenAI API - the OG of AI APIs
langchain = "^0.3"         # LangChain - AI app framework (the Swiss Army knife)
langchain-openai = "^0.2"  # OpenAI integration for LangChain
anthropic = "^0.40"        # Claude API - OpenAI's main competitor

# 📊 Data Science Stack (The Classics)
numpy = "^1.26"            # NumPy - the foundation of everything
pandas = "^2.2"            # Pandas - data manipulation beast
matplotlib = "^3.8"        # Matplotlib - plotting powerhouse
seaborn = "^0.13"          # Seaborn - beautiful plots made easy
plotly = "^5.20"           # Plotly - interactive visualizations
scikit-learn = "^1.4"      # Scikit-learn - ML algorithms galore

# 🌐 Web & API Libraries (The Workhorses)
fastapi = "^0.115"         # FastAPI - modern Python web framework
flask = "^3.0"             # Flask - the lightweight king
requests = "^2.32"         # Requests - HTTP for humans
httpx = "^0.27"            # HTTPX - async HTTP client
aiohttp = "^3.10"          # AioHTTP - async web framework
uvicorn = "^0.30"          # Uvicorn - ASGI server

# 🔐 Security & Auth (The Guardians)
pyjwt = "^2.8"             # PyJWT - JSON Web Token handling
passlib = "^1.7"           # Passlib - password hashing
cryptography = "^43.0"     # Cryptography - crypto primitives
python-multipart = "^0.0.12" # Multipart form data

# 🗄️ Database & Storage (The Memory Keepers)
sqlalchemy = "^2.0"        # SQLAlchemy - SQL toolkit
alembic = "^1.14"          # Alembic - database migrations
redis = "^5.2"             # Redis - in-memory data store
pymongo = "^4.10"          # PyMongo - MongoDB driver

# 🧪 Testing & Quality (The Quality Assurance Squad)
pytest = "^8.2"            # Pytest - testing framework
pytest-asyncio = "^0.24"   # Pytest-asyncio - async testing
pytest-cov = "^5.0"        # Pytest-cov - coverage reporting
httpx = "^0.27"            # HTTPX - testing HTTP clients

# 🎨 Code Quality (The Style Police)
black = "^24.3"            # Black - code formatter
isort = "^5.13"            # isort - import sorter
flake8 = "^7.1"            # Flake8 - linter
mypy = "^1.10"             # MyPy - static type checker
pre-commit = "^4.0"        # Pre-commit - git hooks

# 📚 Development Tools (The Developer's Best Friends)
jupyter = "^1.0"           # Jupyter - notebook environment
ipython = "^8.25"          # IPython - enhanced Python shell
rich = "^13.9"             # Rich - beautiful terminal output
click = "^8.1"             # Click - command line interface
typer = "^0.12"            # Typer - modern CLI framework

# 🔧 Utilities (The Swiss Army Knives)
python-dotenv = "^1.0"     # Python-dotenv - environment variables
pydantic = "^2.10"         # Pydantic - data validation
loguru = "^0.7"            # Loguru - better logging
tqdm = "^4.67"             # TQDM - progress bars
schedule = "^1.2"          # Schedule - job scheduling

[tool.poetry.group.dev.dependencies]
# Development-only dependencies
pytest-mock = "^3.14"      # Pytest-mock - mocking utilities
factory-boy = "^3.3"       # Factory-boy - test data factories
faker = "^28.0"            # Faker - fake data generation

[tool.poetry.scripts]
# 🚀 Main CLI Commands
hello = "flask:main"                    # The classic hello world
chain-rice = "cli:main"                 # Main CLI entry point
rice-ai = "ai_chat:main"                # AI chat interface
rice-data = "data_analysis:main"        # Data analysis tool
rice-api = "fast_api:run"               # Start API server
rice-test = "tests:run_all"             # Run all tests

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "chain-rice-python-sdk"
version = "0.2.0"
description = "🔥 Chain Rice Python SDK - The ultimate learning playground"
requires-python = ">=3.10"

[project.scripts]
hello = "flask:main"
chain-rice = "cli:main"
rice-ai = "ai_chat:main"
rice-data = "data_analysis:main"
rice-api = "fast_api:run"

# 🎯 Tool Configuration
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]


