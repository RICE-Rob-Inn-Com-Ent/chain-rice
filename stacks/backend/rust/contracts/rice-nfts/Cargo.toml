[package]
name = "rice-nfts"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmwasm-std = "1.4"
cosmwasm-storage = "1.4"
cw-storage-plus = "1.0"
cw-utils = "1.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cosmwasm-schema = "1.4"
cw-multi-test = "1.0"
