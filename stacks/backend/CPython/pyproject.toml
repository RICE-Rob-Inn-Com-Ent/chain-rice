[tool.poetry]
name = "chain-rice-backend"
version = "0.2.0"
description = "Backend for Chain Rice platform"
authors = ["Chain Rice Team <dev@chain-rice.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# 🌐 Web & API
fastapi = "^0.115"
flask = "^3.0"
requests = "^2.32"
httpx = "^0.27"
aiohttp = "^3.10"
uvicorn = "^0.30"

# 🔐 Security & Auth
pyjwt = "^2.8"
passlib = "^1.7"
cryptography = "^43.0"
python-multipart = "^0.0.12"

# 🗄️ Database & Storage
sqlalchemy = "^2.0"
alembic = "^1.14"
redis = "^5.2"
pymongo = "^4.10"

# 🧪 Testing & Quality
pytest = "^8.2"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"

# 🎨 Code Quality
black = "^24.3"
isort = "^5.13"
flake8 = "^7.1"
mypy = "^1.10"
pre-commit = "^4.0"

# 🔧 Utilities
python-dotenv = "^1.0"
pydantic = "^2.10"
loguru = "^0.7"
tqdm = "^4.67"
schedule = "^1.2"

[tool.poetry.group.dev.dependencies]
pytest-mock = "^3.14"
factory-boy = "^3.3"
faker = "^28.0"

[tool.poetry.scripts]
chain-rice = "cli:main"
rice-api = "fast_api:run"
rice-test = "tests:run_all"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "chain-rice-backend"
version = "0.2.0"
description = "Backend for Chain Rice platform"
requires-python = ">=3.10"

[project.scripts]
chain-rice = "cli:main"
rice-api = "fast_api:run"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''/(\.git|\.venv|build|dist)/'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
