syntax = "proto3";

package examples.hello;

option go_package = "examples/proto/go/examples/hello";
option java_package = "examples.hello";
option java_multiple_files = true;
option csharp_namespace = "Examples.Hello";

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}


