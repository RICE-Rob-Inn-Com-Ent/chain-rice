syntax = "proto3";

package telecom.usage.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/string_value.proto";
import "google/protobuf/double_value.proto";
import "telecom/usage/enums/usage_type.proto";
import "telecom/usage/enums/usage_status.proto";

// CreateUsageRequest represents a request to create a new usage record
message CreateUsageRequest {
  // Customer ID for whom the usage is being recorded
  string customer_id = 1;
  
  // Subscription ID associated with the usage
  string subscription_id = 2;
  
  // Type of usage being recorded
  telecom.usage.enums.UsageType type = 3;
  
  // Quantity of usage (minutes for voice, bytes for data, count for SMS)
  double quantity = 4;
  
  // Unit of measurement (minutes, bytes, count, GB, MB, KB)
  string unit = 5;
  
  // Start time of the usage
  google.protobuf.Timestamp start_time = 6;
  
  // End time of the usage (optional for point-in-time usage)
  google.protobuf.Timestamp end_time = 7;
  
  // Usage status
  telecom.usage.enums.UsageStatus status = 8;
  
  // Cost associated with this usage (in smallest currency unit)
  google.protobuf.DoubleValue cost = 9;
  
  // Currency code (ISO 4217 format)
  google.protobuf.StringValue currency = 10;
  
  // Device or phone number associated with usage
  google.protobuf.StringValue device_id = 11;
  
  // Location where usage occurred
  google.protobuf.StringValue location = 12;
  
  // Network type (4G, 5G, WiFi, etc.)
  google.protobuf.StringValue network_type = 13;
  
  // Additional metadata about the usage
  google.protobuf.StringValue metadata = 14;
  
  // Whether this is roaming usage
  bool is_roaming = 15;
  
  // Whether this is peak hours usage
  bool is_peak_hours = 16;
}

// UpdateUsageRequest represents a request to update an existing usage record
message UpdateUsageRequest {
  // Usage ID to update
  string usage_id = 1;
  
  // Optional new quantity
  google.protobuf.DoubleValue quantity = 2;
  
  // Optional new status
  telecom.usage.enums.UsageStatus status = 3;
  
  // Optional new cost
  google.protobuf.DoubleValue cost = 4;
  
  // Optional new end time
  google.protobuf.Timestamp end_time = 5;
  
  // Optional new metadata
  google.protobuf.StringValue metadata = 6;
}

// GetUsageRequest represents a request to retrieve a specific usage record
message GetUsageRequest {
  // Usage ID to retrieve
  string usage_id = 1;
}

// ListUsageRequest represents a request to list usage records with filtering
message ListUsageRequest {
  // Customer ID to filter by (optional)
  google.protobuf.StringValue customer_id = 1;
  
  // Subscription ID to filter by (optional)
  google.protobuf.StringValue subscription_id = 2;
  
  // Usage type to filter by (optional)
  telecom.usage.enums.UsageType type = 3;
  
  // Usage status to filter by (optional)
  telecom.usage.enums.UsageStatus status = 4;
  
  // Start date for filtering (optional)
  google.protobuf.Timestamp start_date = 5;
  
  // End date for filtering (optional)
  google.protobuf.Timestamp end_date = 6;
  
  // Device ID to filter by (optional)
  google.protobuf.StringValue device_id = 7;
  
  // Whether to include roaming usage only
  google.protobuf.StringValue roaming_only = 8;
  
  // Page number for pagination (starts from 1)
  int32 page = 9;
  
  // Page size for pagination (max 1000)
  int32 page_size = 10;
}

// DeleteUsageRequest represents a request to delete a usage record
message DeleteUsageRequest {
  // Usage ID to delete
  string usage_id = 1;
  
  // Reason for deletion
  google.protobuf.StringValue reason = 2;
}

// AdjustUsageRequest represents a request to adjust usage (correction)
message AdjustUsageRequest {
  // Usage ID to adjust
  string usage_id = 1;
  
  // Adjustment quantity (can be negative for reductions)
  double adjustment_quantity = 2;
  
  // Adjustment reason
  string reason = 3;
  
  // Adjustment description
  google.protobuf.StringValue description = 4;
  
  // Effective date for the adjustment
  google.protobuf.Timestamp effective_date = 5;
}

// BulkUsageRequest represents a request to create multiple usage records
message BulkUsageRequest {
  // List of usage records to create
  repeated CreateUsageRequest usage_records = 1;
  
  // Whether to validate all records before processing
  bool validate_only = 2;
  
  // Batch processing options
  BatchProcessingOptions batch_options = 3;
}

// BatchProcessingOptions represents options for batch processing
message BatchProcessingOptions {
  // Whether to continue processing if individual records fail
  bool continue_on_error = 1;
  
  // Maximum number of records to process in parallel
  google.protobuf.DoubleValue max_parallel = 2;
  
  // Whether to send notifications after completion
  bool send_notifications = 3;
  
  // Batch identifier for tracking
  google.protobuf.StringValue batch_id = 4;
}

// GetUsageSummaryRequest represents a request to get usage summary
message GetUsageSummaryRequest {
  // Customer ID to get summary for
  string customer_id = 1;
  
  // Subscription ID to filter by (optional)
  google.protobuf.StringValue subscription_id = 2;
  
  // Date range for summary
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  
  // Usage types to include in summary
  repeated telecom.usage.enums.UsageType usage_types = 5;
  
  // Grouping options (daily, weekly, monthly)
  google.protobuf.StringValue group_by = 6;
}

// GetUsageAlertsRequest represents a request to get usage alerts
message GetUsageAlertsRequest {
  // Customer ID to get alerts for
  string customer_id = 1;
  
  // Subscription ID to filter by (optional)
  google.protobuf.StringValue subscription_id = 2;
  
  // Alert types to include
  repeated string alert_types = 3;
  
  // Date range for alerts
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  
  // Page number for pagination
  int32 page = 6;
  
  // Page size for pagination
  int32 page_size = 7;
}
