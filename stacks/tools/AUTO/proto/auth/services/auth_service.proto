syntax = "proto3";

package com.auth.services;

import "auth/messages/auth_user.proto";

// AuthService provides full user management and authentication flows
service AuthService {
  // Authentication
  rpc AuthenticateUser(AuthUserRequest) returns (AuthUserResponse); // Authenticate a user with email/password and return session tokens

  // User registration
  rpc CreateUser(RegisterUserRequest) returns (RegisterUserResponse); // Register a new user with email, password, display name, and roles

  // User management
  rpc GetUser(GetUserRequest) returns (GetUserResponse); // Retrieve a single user by ID
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse); // Update user fields (full or partial)
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse); // Delete a user by ID

  // Password management
  rpc ChangeUserPassword(ChangeUserPasswordRequest) returns (ChangeUserPasswordResponse); // Change a user's password, verifying old password and strength
  rpc ForgotUserPassword(ForgotUserPasswordRequest) returns (ForgotUserPasswordResponse); // Initiate password reset process for user via email
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse); // Complete password reset using a token from email link

  // Session management
  rpc LogoutUser(LogoutUserRequest) returns (LogoutUserResponse); // Logout a user by invalidating a session token

  // Multi-factor authentication (MFA / 2FA)
  rpc InitiateUserMFAUnit(InitiateUserMFAUnitRequest) returns (InitiateUserMFAUnitResponse); // Start MFA process for a user using a selected method
  rpc VerifyUserMFAUnit(VerifyUserMFAUnitRequest) returns (VerifyUserMFAUnitResponse); // Verify MFA challenge code and issue session token

  // Admin / listing
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse); // List users with pagination and optional search

  // Token verification
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse); // Verify if an access token is valid and return user info if so
}
