syntax = "proto3";

package com.auth.enums;

// UserRole enumerates roles used for authorization and access control.
enum UserRole {
  UNSPECIFIED = 0;  // Unspecified role
  USER = 1; // Regular end-user
  SUPPORT = 2;  // Support personnel
  ADMIN = 3;  // Organization administrator
  SUPER_ADMIN = 4; // System-wide superuser
  AUDITOR = 5;  // Read-only auditor/compliance
  SERVICE = 6;  // Machine/service account
  DEVELOPER = 7;  // Developer/test sandbox
  MASTER_DEVOPS = 8; // Full-stack operations & dev role
}