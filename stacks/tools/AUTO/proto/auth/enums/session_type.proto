syntax = "proto3";

package com.auth.enums;

// SessionType enumerates supported authentication session types.
enum SessionType {
  UNSPECIFIED = 0;  // Unspecified session type
  WEB = 1;  // Web session using cookies
  MOBILE = 2; // Mobile session using device-bound tokens
  API_KEY = 3;  // API session using static API keys
  SERVICE = 4;  // Service-to-service session (JWT/OAuth)
  ONE_TIME = 5; // One-time session for verification/reset
}