syntax = "proto3";

package projects.tasks.messages;

import "tasks/messages/task_request.proto";
import "google/rpc/status.proto";

// CreateTaskResponse contains the result of creating a new task
message CreateTaskResponse {
  // The created task
  Task task = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// GetTaskResponse contains the result of retrieving a task
message GetTaskResponse {
  // The requested task
  Task task = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// ListTasksResponse contains the result of listing tasks
message ListTasksResponse {
  // List of tasks matching the request criteria
  repeated Task tasks = 1;
  
  // Token to retrieve the next page of results
  string next_page_token = 2;
  
  // Total number of tasks matching the criteria
  int32 total_count = 3;
  
  // Operation status
  google.rpc.Status status = 4;
}

// UpdateTaskResponse contains the result of updating a task
message UpdateTaskResponse {
  // The updated task
  Task task = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// DeleteTaskResponse contains the result of deleting a task
message DeleteTaskResponse {
  // Indicates whether the deletion was successful
  bool success = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}
