syntax = "proto3";

package projects.resources.enums;

// AllocationStatus represents the current allocation state of a resource
enum AllocationStatus {
  // Default value - should not be used
  ALLOCATION_STATUS_UNSPECIFIED = 0;
  
  // Resource is available for allocation
  ALLOCATION_STATUS_AVAILABLE = 1;
  
  // Resource is allocated to a project
  ALLOCATION_STATUS_ALLOCATED = 2;
  
  // Resource allocation is pending approval
  ALLOCATION_STATUS_PENDING = 3;
  
  // Resource allocation has been rejected
  ALLOCATION_STATUS_REJECTED = 4;
  
  // Resource allocation has been released
  ALLOCATION_STATUS_RELEASED = 5;
  
  // Resource is temporarily unavailable
  ALLOCATION_STATUS_UNAVAILABLE = 6;
  
  // Resource allocation is on hold
  ALLOCATION_STATUS_ON_HOLD = 7;
}
