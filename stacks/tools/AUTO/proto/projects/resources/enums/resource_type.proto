syntax = "proto3";

package projects.resources.enums;

// ResourceType represents the type of resource being allocated
enum ResourceType {
  // Default value - should not be used
  RESOURCE_TYPE_UNSPECIFIED = 0;
  
  // Human resource - employee, contractor, consultant
  RESOURCE_TYPE_HUMAN = 1;
  
  // Equipment resource - hardware, machinery, tools
  RESOURCE_TYPE_EQUIPMENT = 2;
  
  // Software resource - licenses, applications, platforms
  RESOURCE_TYPE_SOFTWARE = 3;
  
  // Financial resource - budget allocation, funding
  RESOURCE_TYPE_FINANCIAL = 4;
  
  // Facility resource - office space, meeting rooms, labs
  RESOURCE_TYPE_FACILITY = 5;
  
  // Material resource - raw materials, supplies, inventory
  RESOURCE_TYPE_MATERIAL = 6;
}
