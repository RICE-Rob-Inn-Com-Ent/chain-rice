syntax = "proto3";

package projects.messages;

import "projects/enums/project_status.proto";
import "projects/enums/project_priority.proto";
import "google/protobuf/timestamp.proto";

// Project represents a complete project entity
message Project {
  // Unique identifier for the project
  string id = 1;
  
  // Human-readable name of the project
  string name = 2;
  
  // Detailed description of the project
  string description = 3;
  
  // Current status of the project
  projects.enums.ProjectStatus status = 4;
  
  // Priority level of the project
  projects.enums.ProjectPriority priority = 5;
  
  // Project start date
  google.protobuf.Timestamp start_date = 6;
  
  // Project end date (optional for ongoing projects)
  google.protobuf.Timestamp end_date = 7;
  
  // ID of the user who owns/manages this project
  string owner_id = 8;
  
  // Timestamp when the project was created
  google.protobuf.Timestamp created_at = 9;
  
  // Timestamp when the project was last updated
  google.protobuf.Timestamp updated_at = 10;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 11;
}

// CreateProjectRequest contains the data needed to create a new project
message CreateProjectRequest {
  // Project name (required)
  string name = 1;
  
  // Project description (optional)
  string description = 2;
  
  // Project priority (defaults to NORMAL if not specified)
  projects.enums.ProjectPriority priority = 3;
  
  // Project start date (optional, defaults to current time)
  google.protobuf.Timestamp start_date = 4;
  
  // Project end date (optional)
  google.protobuf.Timestamp end_date = 5;
  
  // ID of the user who will own this project (required)
  string owner_id = 6;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 7;
}

// GetProjectRequest contains the identifier to retrieve a specific project
message GetProjectRequest {
  // Unique identifier of the project to retrieve
  string project_id = 1;
}

// ListProjectsRequest contains parameters for listing projects
message ListProjectsRequest {
  // Maximum number of projects to return (default: 50, max: 1000)
  int32 page_size = 1;
  
  // Token to retrieve the next page of results
  string page_token = 2;
  
  // Filter by project status
  projects.enums.ProjectStatus status = 3;
  
  // Filter by project priority
  projects.enums.ProjectPriority priority = 4;
  
  // Filter by project owner
  string owner_id = 5;
  
  // Search term to filter projects by name or description
  string search_term = 6;
}

// UpdateProjectRequest contains the data needed to update an existing project
message UpdateProjectRequest {
  // Unique identifier of the project to update
  string project_id = 1;
  
  // Updated project name (optional)
  string name = 2;
  
  // Updated project description (optional)
  string description = 3;
  
  // Updated project status (optional)
  projects.enums.ProjectStatus status = 4;
  
  // Updated project priority (optional)
  projects.enums.ProjectPriority priority = 5;
  
  // Updated project start date (optional)
  google.protobuf.Timestamp start_date = 6;
  
  // Updated project end date (optional)
  google.protobuf.Timestamp end_date = 7;
  
  // Updated project owner (optional)
  string owner_id = 8;
  
  // Updated metadata (optional)
  map<string, string> metadata = 9;
}

// DeleteProjectRequest contains the identifier to delete a specific project
message DeleteProjectRequest {
  // Unique identifier of the project to delete
  string project_id = 1;
}
