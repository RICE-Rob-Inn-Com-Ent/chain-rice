syntax = "proto3";

package projects.enums;

// ProjectPriority represents the priority level of a project
enum ProjectPriority {
  // Default value - should not be used
  PROJECT_PRIORITY_UNSPECIFIED = 0;
  
  // Low priority - can be delayed if needed
  PROJECT_PRIORITY_LOW = 1;
  
  // Normal priority - standard project priority
  PROJECT_PRIORITY_NORMAL = 2;
  
  // High priority - important project that should be prioritized
  PROJECT_PRIORITY_HIGH = 3;
  
  // Critical priority - urgent project requiring immediate attention
  PROJECT_PRIORITY_CRITICAL = 4;
  
  // Emergency priority - highest possible priority
  PROJECT_PRIORITY_EMERGENCY = 5;
}
