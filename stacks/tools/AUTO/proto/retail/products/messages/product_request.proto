syntax = "proto3";

package retail.products.messages;

import "products/enums/product_category.proto";
import "products/enums/product_status.proto";
import "google/protobuf/timestamp.proto";

// Product represents a retail product
message Product {
  // Unique identifier for the product
  string id = 1;
  
  // Product name
  string name = 2;
  
  // Product description
  string description = 3;
  
  // Product category
  retail.products.enums.ProductCategory category = 4;
  
  // Product status
  retail.products.enums.ProductStatus status = 5;
  
  // Product SKU (Stock Keeping Unit)
  string sku = 6;
  
  // Product barcode
  string barcode = 7;
  
  // Product price
  double price = 8;
  
  // Product cost
  double cost = 9;
  
  // Product weight in grams
  double weight_grams = 10;
  
  // Product dimensions (length x width x height in cm)
  ProductDimensions dimensions = 11;
  
  // Product brand
  string brand = 12;
  
  // Product manufacturer
  string manufacturer = 13;
  
  // Product model number
  string model_number = 14;
  
  // Product color
  string color = 15;
  
  // Product size
  string size = 16;
  
  // Product images URLs
  repeated string image_urls = 17;
  
  // Product tags for search and filtering
  repeated string tags = 18;
  
  // Timestamp when product was created
  google.protobuf.Timestamp created_at = 19;
  
  // Timestamp when product was last updated
  google.protobuf.Timestamp updated_at = 20;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 21;
}

// ProductDimensions represents the physical dimensions of a product
message ProductDimensions {
  // Length in centimeters
  double length_cm = 1;
  
  // Width in centimeters
  double width_cm = 2;
  
  // Height in centimeters
  double height_cm = 3;
}

// CreateProductRequest contains the data needed to create a new product
message CreateProductRequest {
  // Product name (required)
  string name = 1;
  
  // Product description (optional)
  string description = 2;
  
  // Product category (required)
  retail.products.enums.ProductCategory category = 3;
  
  // Product SKU (required)
  string sku = 4;
  
  // Product barcode (optional)
  string barcode = 5;
  
  // Product price (required)
  double price = 6;
  
  // Product cost (optional)
  double cost = 7;
  
  // Product weight in grams (optional)
  double weight_grams = 8;
  
  // Product dimensions (optional)
  ProductDimensions dimensions = 9;
  
  // Product brand (optional)
  string brand = 10;
  
  // Product manufacturer (optional)
  string manufacturer = 11;
  
  // Product model number (optional)
  string model_number = 12;
  
  // Product color (optional)
  string color = 13;
  
  // Product size (optional)
  string size = 14;
  
  // Product images URLs (optional)
  repeated string image_urls = 15;
  
  // Product tags (optional)
  repeated string tags = 16;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 17;
}

// GetProductRequest contains the identifier to retrieve a specific product
message GetProductRequest {
  // Unique identifier of the product to retrieve
  string product_id = 1;
}

// ListProductsRequest contains parameters for listing products
message ListProductsRequest {
  // Maximum number of products to return (default: 50, max: 1000)
  int32 page_size = 1;
  
  // Token to retrieve the next page of results
  string page_token = 2;
  
  // Filter by product category
  retail.products.enums.ProductCategory category = 3;
  
  // Filter by product status
  retail.products.enums.ProductStatus status = 4;
  
  // Filter by brand
  string brand = 5;
  
  // Filter by price range - minimum price
  double min_price = 6;
  
  // Filter by price range - maximum price
  double max_price = 7;
  
  // Search term to filter products by name, description, or tags
  string search_term = 8;
  
  // Filter by tags
  repeated string tags = 9;
}

// UpdateProductRequest contains the data needed to update an existing product
message UpdateProductRequest {
  // Unique identifier of the product to update
  string product_id = 1;
  
  // Updated product name (optional)
  string name = 2;
  
  // Updated product description (optional)
  string description = 3;
  
  // Updated product category (optional)
  retail.products.enums.ProductCategory category = 4;
  
  // Updated product status (optional)
  retail.products.enums.ProductStatus status = 5;
  
  // Updated product price (optional)
  double price = 6;
  
  // Updated product cost (optional)
  double cost = 7;
  
  // Updated product weight (optional)
  double weight_grams = 8;
  
  // Updated product dimensions (optional)
  ProductDimensions dimensions = 9;
  
  // Updated product brand (optional)
  string brand = 10;
  
  // Updated product manufacturer (optional)
  string manufacturer = 11;
  
  // Updated product model number (optional)
  string model_number = 12;
  
  // Updated product color (optional)
  string color = 13;
  
  // Updated product size (optional)
  string size = 14;
  
  // Updated product images URLs (optional)
  repeated string image_urls = 15;
  
  // Updated product tags (optional)
  repeated string tags = 16;
  
  // Updated metadata (optional)
  map<string, string> metadata = 17;
}

// DeleteProductRequest contains the identifier to delete a specific product
message DeleteProductRequest {
  // Unique identifier of the product to delete
  string product_id = 1;
}
