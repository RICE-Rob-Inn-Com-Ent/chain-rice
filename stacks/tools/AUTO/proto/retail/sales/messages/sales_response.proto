syntax = "proto3";

package retail.sales.messages;

import "sales/messages/sales_request.proto";
import "google/rpc/status.proto";

// CreateSaleResponse contains the result of creating a new sale
message CreateSaleResponse {
  // The created sale
  Sale sale = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// GetSaleResponse contains the result of retrieving a sale
message GetSaleResponse {
  // The requested sale
  Sale sale = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// ListSalesResponse contains the result of listing sales
message ListSalesResponse {
  // List of sales matching the request criteria
  repeated Sale sales = 1;
  
  // Token to retrieve the next page of results
  string next_page_token = 2;
  
  // Total number of sales matching the criteria
  int32 total_count = 3;
  
  // Total revenue from matching sales
  double total_revenue = 4;
  
  // Operation status
  google.rpc.Status status = 5;
}

// UpdateSaleResponse contains the result of updating a sale
message UpdateSaleResponse {
  // The updated sale
  Sale sale = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// DeleteSaleResponse contains the result of deleting a sale
message DeleteSaleResponse {
  // Indicates whether the deletion was successful
  bool success = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}
