syntax = "proto3";

package retail.sales.services;

import "sales/messages/sales_request.proto";
import "sales/messages/sales_response.proto";
import "google/api/annotations.proto";

// SalesService provides CRUD operations for sales management
service SalesService {
  // CreateSale creates a new sale
  rpc CreateSale(retail.sales.messages.CreateSaleRequest) returns (retail.sales.messages.CreateSaleResponse) {
    option (google.api.http) = {
      post: "/api/v1/sales"
      body: "*"
    };
  }
  
  // GetSale retrieves a specific sale by ID
  rpc GetSale(retail.sales.messages.GetSaleRequest) returns (retail.sales.messages.GetSaleResponse) {
    option (google.api.http) = {
      get: "/api/v1/sales/{sale_id}"
    };
  }
  
  // ListSales retrieves a paginated list of sales with optional filtering
  rpc ListSales(retail.sales.messages.ListSalesRequest) returns (retail.sales.messages.ListSalesResponse) {
    option (google.api.http) = {
      get: "/api/v1/sales"
    };
  }
  
  // UpdateSale updates an existing sale
  rpc UpdateSale(retail.sales.messages.UpdateSaleRequest) returns (retail.sales.messages.UpdateSaleResponse) {
    option (google.api.http) = {
      put: "/api/v1/sales/{sale_id}"
      body: "*"
    };
  }
  
  // DeleteSale deletes a specific sale
  rpc DeleteSale(retail.sales.messages.DeleteSaleRequest) returns (retail.sales.messages.DeleteSaleResponse) {
    option (google.api.http) = {
      delete: "/api/v1/sales/{sale_id}"
    };
  }
}
