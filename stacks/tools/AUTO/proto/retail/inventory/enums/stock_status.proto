syntax = "proto3";

package retail.inventory.enums;

// StockStatus represents the current availability status of inventory items
enum StockStatus {
  // Default value - should not be used
  STOCK_STATUS_UNSPECIFIED = 0;
  
  // Item is in stock and available for sale
  STOCK_STATUS_IN_STOCK = 1;
  
  // Item is out of stock
  STOCK_STATUS_OUT_OF_STOCK = 2;
  
  // Item is low in stock (below reorder threshold)
  STOCK_STATUS_LOW_STOCK = 3;
  
  // Item is discontinued
  STOCK_STATUS_DISCONTINUED = 4;
  
  // Item is on backorder
  STOCK_STATUS_BACKORDER = 5;
  
  // Item is reserved for pending orders
  STOCK_STATUS_RESERVED = 6;
  
  // Item is damaged and not sellable
  STOCK_STATUS_DAMAGED = 7;
  
  // Item is in transit to store
  STOCK_STATUS_IN_TRANSIT = 8;
}
