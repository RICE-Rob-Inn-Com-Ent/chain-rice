syntax = "proto3";

package retail.promotions.messages;

import "promotions/messages/promotion_request.proto";
import "google/rpc/status.proto";

// CreatePromotionResponse contains the result of creating a new promotion
message CreatePromotionResponse {
  // The created promotion
  Promotion promotion = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// GetPromotionResponse contains the result of retrieving a promotion
message GetPromotionResponse {
  // The requested promotion
  Promotion promotion = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// ListPromotionsResponse contains the result of listing promotions
message ListPromotionsResponse {
  // List of promotions matching the request criteria
  repeated Promotion promotions = 1;
  
  // Token to retrieve the next page of results
  string next_page_token = 2;
  
  // Total number of promotions matching the criteria
  int32 total_count = 3;
  
  // Operation status
  google.rpc.Status status = 4;
}

// UpdatePromotionResponse contains the result of updating a promotion
message UpdatePromotionResponse {
  // The updated promotion
  Promotion promotion = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// DeletePromotionResponse contains the result of deleting a promotion
message DeletePromotionResponse {
  // Indicates whether the deletion was successful
  bool success = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}
