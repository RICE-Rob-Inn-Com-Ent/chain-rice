syntax = "proto3";

package retail.promotions.enums;

// PromotionType represents the type of promotion or discount
enum PromotionType {
  // Default value - should not be used
  PROMOTION_TYPE_UNSPECIFIED = 0;
  
  // Percentage discount (e.g., 20% off)
  PROMOTION_TYPE_PERCENTAGE_DISCOUNT = 1;
  
  // Fixed amount discount (e.g., $10 off)
  PROMOTION_TYPE_FIXED_DISCOUNT = 2;
  
  // Buy X get Y free (e.g., Buy 2 get 1 free)
  PROMOTION_TYPE_BUY_X_GET_Y = 3;
  
  // Free shipping promotion
  PROMOTION_TYPE_FREE_SHIPPING = 4;
  
  // Bundle discount (e.g., Buy together and save)
  PROMOTION_TYPE_BUNDLE_DISCOUNT = 5;
  
  // Seasonal sale promotion
  PROMOTION_TYPE_SEASONAL_SALE = 6;
  
  // Flash sale promotion
  PROMOTION_TYPE_FLASH_SALE = 7;
  
  // Loyalty points multiplier
  PROMOTION_TYPE_LOYALTY_MULTIPLIER = 8;
  
  // Cashback promotion
  PROMOTION_TYPE_CASHBACK = 9;
  
  // Gift with purchase
  PROMOTION_TYPE_GIFT_WITH_PURCHASE = 10;
  
  // Volume discount (e.g., Buy 10+ and save)
  PROMOTION_TYPE_VOLUME_DISCOUNT = 11;
  
  // First-time buyer discount
  PROMOTION_TYPE_FIRST_TIME_BUYER = 12;
  
  // Referral discount
  PROMOTION_TYPE_REFERRAL_DISCOUNT = 13;
}
