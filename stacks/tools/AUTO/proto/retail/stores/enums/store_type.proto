syntax = "proto3";

package retail.stores.enums;

// StoreType represents the type of retail store
enum StoreType {
  // Default value - should not be used
  STORE_TYPE_UNSPECIFIED = 0;
  
  // Traditional brick-and-mortar store
  STORE_TYPE_BRICK_AND_MORTAR = 1;
  
  // Shopping mall store
  STORE_TYPE_MALL_STORE = 2;
  
  // Outlet store
  STORE_TYPE_OUTLET = 3;
  
  // Flagship store
  STORE_TYPE_FLAGSHIP = 4;
  
  // Pop-up store or temporary location
  STORE_TYPE_POPUP = 5;
  
  // Kiosk or small retail space
  STORE_TYPE_KIOSK = 6;
  
  // Warehouse store
  STORE_TYPE_WAREHOUSE = 7;
  
  // Department store
  STORE_TYPE_DEPARTMENT = 8;
  
  // Specialty store
  STORE_TYPE_SPECIALTY = 9;
  
  // Convenience store
  STORE_TYPE_CONVENIENCE = 10;
  
  // Supermarket or grocery store
  STORE_TYPE_SUPERMARKET = 11;
  
  // Hypermarket or big box store
  STORE_TYPE_HYPERMARKET = 12;
  
  // Pharmacy store
  STORE_TYPE_PHARMACY = 13;
  
  // Electronics store
  STORE_TYPE_ELECTRONICS = 14;
  
  // Fashion or clothing store
  STORE_TYPE_FASHION = 15;
}
