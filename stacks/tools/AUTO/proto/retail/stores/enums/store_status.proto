syntax = "proto3";

package retail.stores.enums;

// StoreStatus represents the current operational status of a store
enum StoreStatus {
  // Default value - should not be used
  STORE_STATUS_UNSPECIFIED = 0;
  
  // Store is open and operational
  STORE_STATUS_OPEN = 1;
  
  // Store is closed
  STORE_STATUS_CLOSED = 2;
  
  // Store is temporarily closed
  STORE_STATUS_TEMPORARILY_CLOSED = 3;
  
  // Store is under construction or renovation
  STORE_STATUS_UNDER_CONSTRUCTION = 4;
  
  // Store is permanently closed
  STORE_STATUS_PERMANENTLY_CLOSED = 5;
  
  // Store is opening soon
  STORE_STATUS_OPENING_SOON = 6;
  
  // Store is closing soon
  STORE_STATUS_CLOSING_SOON = 7;
  
  // Store is in maintenance mode
  STORE_STATUS_MAINTENANCE = 8;
  
  // Store is experiencing technical issues
  STORE_STATUS_TECHNICAL_ISSUES = 9;
  
  // Store is operating with limited hours
  STORE_STATUS_LIMITED_HOURS = 10;
}
