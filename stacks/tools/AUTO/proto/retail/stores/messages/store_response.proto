syntax = "proto3";

package retail.stores.messages;

import "stores/messages/store_request.proto";
import "google/rpc/status.proto";

// CreateStoreResponse contains the result of creating a new store
message CreateStoreResponse {
  // The created store
  Store store = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// GetStoreResponse contains the result of retrieving a store
message GetStoreResponse {
  // The requested store
  Store store = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// ListStoresResponse contains the result of listing stores
message ListStoresResponse {
  // List of stores matching the request criteria
  repeated Store stores = 1;
  
  // Token to retrieve the next page of results
  string next_page_token = 2;
  
  // Total number of stores matching the criteria
  int32 total_count = 3;
  
  // Operation status
  google.rpc.Status status = 4;
}

// UpdateStoreResponse contains the result of updating a store
message UpdateStoreResponse {
  // The updated store
  Store store = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// DeleteStoreResponse contains the result of deleting a store
message DeleteStoreResponse {
  // Indicates whether the deletion was successful
  bool success = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}
