syntax = "proto3";

package retail.stores.messages;

import "stores/enums/store_type.proto";
import "stores/enums/store_status.proto";
import "google/protobuf/timestamp.proto";

// Store represents a retail store location
message Store {
  // Unique identifier for the store
  string id = 1;
  
  // Store name
  string name = 2;
  
  // Store type
  retail.stores.enums.StoreType type = 3;
  
  // Current store status
  retail.stores.enums.StoreStatus status = 4;
  
  // Store location information
  StoreLocation location = 5;
  
  // Store contact information
  StoreContact contact = 6;
  
  // Store operating hours
  repeated StoreHours operating_hours = 7;
  
  // ID of the store manager
  string manager_id = 8;
  
  // Store size in square feet
  double size_square_feet = 9;
  
  // Store description
  string description = 10;
  
  // Store website URL
  string website_url = 11;
  
  // Store social media links
  repeated string social_media_urls = 12;
  
  // Store images URLs
  repeated string image_urls = 13;
  
  // Store features and amenities
  repeated string features = 14;
  
  // Store tags for search and filtering
  repeated string tags = 15;
  
  // Timestamp when store was created
  google.protobuf.Timestamp created_at = 16;
  
  // Timestamp when store was last updated
  google.protobuf.Timestamp updated_at = 17;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 18;
}

// StoreLocation represents the physical location of a store
message StoreLocation {
  // Street address
  string address = 1;
  
  // City
  string city = 2;
  
  // State or province
  string state_province = 3;
  
  // Postal or ZIP code
  string postal_code = 4;
  
  // Country
  string country = 5;
  
  // Latitude coordinate
  double latitude = 6;
  
  // Longitude coordinate
  double longitude = 7;
  
  // Store floor or level (for multi-level buildings)
  string floor_level = 8;
  
  // Store unit or suite number
  string unit_number = 9;
}

// StoreContact represents contact information for a store
message StoreContact {
  // Primary phone number
  string phone_number = 1;
  
  // Secondary phone number
  string secondary_phone = 2;
  
  // Email address
  string email = 3;
  
  // Fax number
  string fax_number = 4;
}

// StoreHours represents operating hours for a specific day
message StoreHours {
  // Day of the week (0 = Sunday, 1 = Monday, ..., 6 = Saturday)
  int32 day_of_week = 1;
  
  // Opening time (HH:MM format)
  string opening_time = 2;
  
  // Closing time (HH:MM format)
  string closing_time = 3;
  
  // Whether the store is closed on this day
  bool is_closed = 4;
  
  // Special notes for this day
  string notes = 5;
}

// CreateStoreRequest contains the data needed to create a new store
message CreateStoreRequest {
  // Store name (required)
  string name = 1;
  
  // Store type (required)
  retail.stores.enums.StoreType type = 2;
  
  // Store location (required)
  StoreLocation location = 3;
  
  // Store contact information (required)
  StoreContact contact = 4;
  
  // Store operating hours (required)
  repeated StoreHours operating_hours = 5;
  
  // ID of the store manager (optional)
  string manager_id = 6;
  
  // Store size in square feet (optional)
  double size_square_feet = 7;
  
  // Store description (optional)
  string description = 8;
  
  // Store website URL (optional)
  string website_url = 9;
  
  // Store social media links (optional)
  repeated string social_media_urls = 10;
  
  // Store images URLs (optional)
  repeated string image_urls = 11;
  
  // Store features and amenities (optional)
  repeated string features = 12;
  
  // Store tags (optional)
  repeated string tags = 13;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 14;
}

// GetStoreRequest contains the identifier to retrieve a specific store
message GetStoreRequest {
  // Unique identifier of the store to retrieve
  string store_id = 1;
}

// ListStoresRequest contains parameters for listing stores
message ListStoresRequest {
  // Maximum number of stores to return (default: 50, max: 1000)
  int32 page_size = 1;
  
  // Token to retrieve the next page of results
  string page_token = 2;
  
  // Filter by store type
  retail.stores.enums.StoreType type = 3;
  
  // Filter by store status
  retail.stores.enums.StoreStatus status = 4;
  
  // Filter by city
  string city = 5;
  
  // Filter by state or province
  string state_province = 6;
  
  // Filter by country
  string country = 7;
  
  // Filter by manager ID
  string manager_id = 8;
  
  // Search term to filter stores by name or description
  string search_term = 9;
  
  // Filter by tags
  repeated string tags = 10;
  
  // Filter by features
  repeated string features = 11;
}

// UpdateStoreRequest contains the data needed to update an existing store
message UpdateStoreRequest {
  // Unique identifier of the store to update
  string store_id = 1;
  
  // Updated store name (optional)
  string name = 2;
  
  // Updated store type (optional)
  retail.stores.enums.StoreType type = 3;
  
  // Updated store status (optional)
  retail.stores.enums.StoreStatus status = 4;
  
  // Updated store location (optional)
  StoreLocation location = 5;
  
  // Updated store contact information (optional)
  StoreContact contact = 6;
  
  // Updated store operating hours (optional)
  repeated StoreHours operating_hours = 7;
  
  // Updated store manager ID (optional)
  string manager_id = 8;
  
  // Updated store size (optional)
  double size_square_feet = 9;
  
  // Updated store description (optional)
  string description = 10;
  
  // Updated store website URL (optional)
  string website_url = 11;
  
  // Updated store social media links (optional)
  repeated string social_media_urls = 12;
  
  // Updated store images URLs (optional)
  repeated string image_urls = 13;
  
  // Updated store features (optional)
  repeated string features = 14;
  
  // Updated store tags (optional)
  repeated string tags = 15;
  
  // Updated metadata (optional)
  map<string, string> metadata = 16;
}

// DeleteStoreRequest contains the identifier to delete a specific store
message DeleteStoreRequest {
  // Unique identifier of the store to delete
  string store_id = 1;
}
