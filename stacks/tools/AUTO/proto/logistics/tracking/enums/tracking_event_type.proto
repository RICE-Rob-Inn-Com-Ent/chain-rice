syntax = "proto3";

package logistics.tracking.enums;

// Types of tracking events
enum TrackingEventType {
  TRACKING_EVENT_TYPE_UNSPECIFIED = 0;
  TRACKING_EVENT_TYPE_PICKUP = 1;             // Package picked up
  TRACKING_EVENT_TYPE_DEPARTURE = 2;           // Departed from origin
  TRACKING_EVENT_TYPE_ARRIVAL = 3;             // Arrived at facility
  TRACKING_EVENT_TYPE_DEPARTURE_FACILITY = 4;  // Departed from facility
  TRACKING_EVENT_TYPE_IN_TRANSIT = 5;          // In transit
  TRACKING_EVENT_TYPE_OUT_FOR_DELIVERY = 6;    // Out for delivery
  TRACKING_EVENT_TYPE_DELIVERY_ATTEMPT = 7;    // Delivery attempt made
  TRACKING_EVENT_TYPE_DELIVERED = 8;           // Successfully delivered
  TRACKING_EVENT_TYPE_DELIVERY_FAILED = 9;     // Delivery failed
  TRACKING_EVENT_TYPE_EXCEPTION = 10;          // Exception occurred
  TRACKING_EVENT_TYPE_DELAY = 11;              // Delivery delayed
  TRACKING_EVENT_TYPE_CUSTOMS_CLEARANCE = 12; // In customs clearance
  TRACKING_EVENT_TYPE_RETURN_TO_SENDER = 13;   // Returned to sender
  TRACKING_EVENT_TYPE_DAMAGED = 14;            // Package damaged
  TRACKING_EVENT_TYPE_LOST = 15;               // Package lost
  TRACKING_EVENT_TYPE_FOUND = 16;              // Lost package found
  TRACKING_EVENT_TYPE_HOLD = 17;               // Package on hold
  TRACKING_EVENT_TYPE_RELEASE = 18;            // Package released from hold
}
