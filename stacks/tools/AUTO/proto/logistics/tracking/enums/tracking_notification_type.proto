syntax = "proto3";

package logistics.tracking.enums;

// Types of tracking notifications
enum TrackingNotificationType {
  TRACKING_NOTIFICATION_TYPE_UNSPECIFIED = 0;
  TRACKING_NOTIFICATION_TYPE_EMAIL = 1;       // Email notification
  TRACKING_NOTIFICATION_TYPE_SMS = 2;          // SMS notification
  TRACKING_NOTIFICATION_TYPE_PUSH = 3;         // Push notification
  TRACKING_NOTIFICATION_TYPE_WEBHOOK = 4;      // Webhook notification
  TRACKING_NOTIFICATION_TYPE_CALL = 5;         // Phone call notification
  TRACKING_NOTIFICATION_TYPE_IN_APP = 6;       // In-app notification
  TRACKING_NOTIFICATION_TYPE_DASHBOARD = 7;    // Dashboard notification
}
