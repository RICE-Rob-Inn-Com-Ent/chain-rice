syntax = "proto3";

package logistics.tracking.messages;

import "google/protobuf/timestamp.proto";

// Tracking checkpoint information
message TrackingCheckpoint {
  string checkpoint_id = 1;                   // Unique checkpoint identifier
  string tracking_number = 2;                 // Tracking number
  string shipment_id = 3;                     // Associated shipment ID
  
  // Checkpoint details
  string checkpoint_name = 4;                 // Checkpoint name
  string checkpoint_type = 5;                 // Type of checkpoint
  string facility_code = 6;                   // Facility code
  string facility_name = 7;                   // Facility name
  
  // Location information
  string location = 8;                        // Location description
  string address = 9;                         // Full address
  string city = 10;                           // City
  string state_province = 11;                 // State/Province
  string country_code = 12;                   // Country code
  double latitude = 13;                       // GPS latitude
  double longitude = 14;                      // GPS longitude
  
  // Timing information
  google.protobuf.Timestamp scheduled_arrival = 15; // Scheduled arrival time
  google.protobuf.Timestamp actual_arrival = 16;    // Actual arrival time
  google.protobuf.Timestamp scheduled_departure = 17; // Scheduled departure time
  google.protobuf.Timestamp actual_departure = 18;   // Actual departure time
  
  // Status information
  CheckpointStatus status = 19;               // Checkpoint status
  bool is_completed = 20;                     // Checkpoint completed
  string completion_notes = 21;               // Completion notes
  
  // Processing information
  int32 processing_time_minutes = 22;         // Processing time in minutes
  string processing_type = 23;                // Type of processing
  repeated string activities = 24;            // Activities performed
  
  // Additional information
  string operator_id = 25;                    // Operator identifier
  string equipment_id = 26;                  // Equipment used
  string notes = 27;                          // Additional notes
  map<string, string> metadata = 28;          // Additional metadata
}

// Checkpoint status enumeration
enum CheckpointStatus {
  CHECKPOINT_STATUS_UNSPECIFIED = 0;
  CHECKPOINT_STATUS_PENDING = 1;              // Pending arrival
  CHECKPOINT_STATUS_ARRIVED = 2;              // Arrived at checkpoint
  CHECKPOINT_STATUS_PROCESSING = 3;           // Currently processing
  CHECKPOINT_STATUS_COMPLETED = 4;            // Processing completed
  CHECKPOINT_STATUS_DEPARTED = 5;              // Departed from checkpoint
  CHECKPOINT_STATUS_DELAYED = 6;              // Processing delayed
  CHECKPOINT_STATUS_EXCEPTION = 7;             // Exception occurred
  CHECKPOINT_STATUS_SKIPPED = 8;              // Checkpoint skipped
}
