syntax = "proto3";

package logistics.tracking.messages;

import "google/protobuf/timestamp.proto";
import "logistics/tracking/enums/tracking_event_type.proto";
import "logistics/tracking/enums/tracking_alert_level.proto";

// Tracking event information
message TrackingEvent {
  string event_id = 1;                        // Unique event identifier
  string tracking_number = 2;                 // Tracking number
  string shipment_id = 3;                     // Associated shipment ID
  
  // Event details
  logistics.tracking.enums.TrackingEventType event_type = 4;
  logistics.tracking.enums.TrackingAlertLevel alert_level = 5;
  string status = 6;                          // Current status
  string description = 7;                     // Event description
  
  // Location information
  string location = 8;                        // Location name/description
  string facility_name = 9;                    // Facility name
  string facility_code = 10;                  // Facility code
  double latitude = 11;                       // GPS latitude
  double longitude = 12;                       // GPS longitude
  string address = 13;                        // Full address
  
  // Timing information
  google.protobuf.Timestamp timestamp = 14;   // Event timestamp
  google.protobuf.Timestamp local_timestamp = 15; // Local timezone timestamp
  string timezone = 16;                       // Timezone information
  
  // Additional details
  string carrier_id = 17;                     // Carrier identifier
  string carrier_name = 18;                   // Carrier name
  string service_type = 19;                   // Service type
  string vehicle_id = 20;                     // Vehicle identifier
  string driver_id = 21;                      // Driver identifier
  
  // Event-specific information
  string signature = 22;                      // Delivery signature
  string recipient_name = 23;                 // Recipient name
  string delivery_notes = 24;                  // Delivery notes
  string exception_reason = 25;               // Exception reason
  string next_attempt_date = 26;              // Next delivery attempt date
  
  // Additional information
  string created_by = 27;                     // Event creator
  string source = 28;                         // Event source (API, scanner, etc.)
  bool is_estimated = 29;                     // Is this an estimated event
  string notes = 30;                          // Additional notes
  map<string, string> metadata = 31;          // Additional metadata
}
