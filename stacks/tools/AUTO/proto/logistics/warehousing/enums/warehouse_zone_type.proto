syntax = "proto3";

package logistics.warehousing.enums;

// Types of warehouse zones
enum WarehouseZoneType {
  WAREHOUSE_ZONE_TYPE_UNSPECIFIED = 0;
  WAREHOUSE_ZONE_TYPE_RECEIVING = 1;          // Receiving zone
  WAREHOUSE_ZONE_TYPE_STORAGE = 2;            // Storage zone
  WAREHOUSE_ZONE_TYPE_PICKING = 3;            // Picking zone
  WAREHOUSE_ZONE_TYPE_PACKING = 4;            // Packing zone
  WAREHOUSE_ZONE_TYPE_SHIPPING = 5;           // Shipping zone
  WAREHOUSE_ZONE_TYPE_QUARANTINE = 6;         // Quarantine zone
  WAREHOUSE_ZONE_TYPE_DAMAGED = 7;            // Damaged goods zone
  WAREHOUSE_ZONE_TYPE_RETURNS = 8;            // Returns processing zone
  WAREHOUSE_ZONE_TYPE_HAZARDOUS = 9;          // Hazardous materials zone
  WAREHOUSE_ZONE_TYPE_TEMPERATURE_CONTROLLED = 10; // Temperature controlled zone
  WAREHOUSE_ZONE_TYPE_BULK = 11;              // Bulk storage zone
  WAREHOUSE_ZONE_TYPE_SMALL_ITEMS = 12;       // Small items zone
  WAREHOUSE_ZONE_TYPE_OVERFLOW = 13;          // Overflow storage zone
  WAREHOUSE_ZONE_TYPE_MAINTENANCE = 14;       // Maintenance zone
}
