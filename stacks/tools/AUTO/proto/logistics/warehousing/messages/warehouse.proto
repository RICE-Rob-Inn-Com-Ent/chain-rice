syntax = "proto3";

package logistics.warehousing.messages;

import "google/protobuf/timestamp.proto";
import "logistics/warehousing/enums/warehouse_type.proto";

// Warehouse information
message Warehouse {
  string warehouse_id = 1;                     // Unique warehouse identifier
  string warehouse_code = 2;                   // Warehouse code
  string name = 3;                             // Warehouse name
  string description = 4;                      // Warehouse description
  
  // Warehouse type and classification
  logistics.warehousing.enums.WarehouseType warehouse_type = 5;
  string classification = 6;                   // Warehouse classification
  
  // Location information
  string address = 7;                         // Full address
  string city = 8;                            // City
  string state_province = 9;                   // State/Province
  string country_code = 10;                    // Country code (ISO 3166-1)
  string postal_code = 11;                     // Postal code
  double latitude = 12;                       // GPS latitude
  double longitude = 13;                      // GPS longitude
  
  // Contact information
  string contact_name = 14;                   // Contact person name
  string phone = 15;                          // Phone number
  string email = 16;                          // Email address
  
  // Physical specifications
  double total_area_sq_m = 17;                // Total area in square meters
  double storage_area_sq_m = 18;              // Storage area in square meters
  double office_area_sq_m = 19;               // Office area in square meters
  double loading_dock_count = 20;             // Number of loading docks
  double ceiling_height_m = 21;                // Ceiling height in meters
  
  // Capacity information
  double max_weight_capacity_kg = 22;         // Maximum weight capacity in kg
  double max_volume_capacity_cubic_m = 23;    // Maximum volume capacity in cubic meters
  int32 max_pallet_positions = 24;            // Maximum pallet positions
  int32 max_shelf_positions = 25;             // Maximum shelf positions
  
  // Equipment and facilities
  bool has_forklifts = 26;                    // Forklift availability
  bool has_conveyor_systems = 27;             // Conveyor system availability
  bool has_automated_storage = 28;            // Automated storage systems
  bool has_climate_control = 29;              // Climate control systems
  bool has_security_systems = 30;             // Security systems
  bool has_fire_suppression = 31;            // Fire suppression systems
  
  // Special capabilities
  bool handles_hazardous_materials = 32;      // Hazardous materials handling
  bool handles_temperature_controlled = 33;  // Temperature controlled storage
  bool handles_bonded_goods = 34;             // Bonded goods handling
  string temperature_range = 35;               // Temperature range (e.g., "2-8°C")
  
  // Operating information
  string operating_hours = 36;                // Operating hours
  repeated string operating_days = 37;        // Operating days of week
  string timezone = 38;                       // Timezone
  
  // Status and management
  bool is_active = 39;                        // Warehouse active status
  string manager_id = 40;                      // Warehouse manager ID
  string owner_id = 41;                       // Warehouse owner ID
  
  // Timestamps
  google.protobuf.Timestamp created_at = 42;  // Creation timestamp
  google.protobuf.Timestamp last_updated = 43; // Last update timestamp
  
  // Additional information
  string notes = 44;                          // Additional notes
  map<string, string> metadata = 45;          // Additional metadata
}
