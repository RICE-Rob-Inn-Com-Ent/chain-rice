syntax = "proto3";

package logistics.warehousing.messages;

import "google/protobuf/timestamp.proto";
import "logistics/warehousing/enums/warehouse_inventory_status.proto";

// Warehouse inventory information
message WarehouseInventory {
  string inventory_id = 1;                    // Unique inventory identifier
  string warehouse_id = 2;                     // Warehouse identifier
  string sku = 3;                             // Stock Keeping Unit
  string product_name = 4;                    // Product name
  string product_description = 5;              // Product description
  
  // Location information
  string zone_id = 6;                         // Warehouse zone ID
  string aisle = 7;                           // Aisle identifier
  string rack = 8;                            // Rack identifier
  string shelf = 9;                           // Shelf identifier
  string bin = 10;                            // Bin identifier
  string location_code = 11;                  // Complete location code
  
  // Inventory details
  logistics.warehousing.enums.WarehouseInventoryStatus status = 12;
  int32 quantity_on_hand = 13;               // Current quantity on hand
  int32 quantity_available = 14;              // Available quantity
  int32 quantity_reserved = 15;               // Reserved quantity
  int32 quantity_allocated = 16;              // Allocated quantity
  int32 quantity_picked = 17;                 // Picked quantity
  int32 quantity_shipped = 18;                // Shipped quantity
  
  // Product specifications
  double unit_weight_kg = 19;                 // Unit weight in kg
  double unit_volume_cubic_m = 20;            // Unit volume in cubic meters
  string unit_of_measure = 21;                // Unit of measure
  string packaging_type = 22;                 // Packaging type
  
  // Batch and lot information
  string batch_number = 23;                   // Batch number
  string lot_number = 24;                     // Lot number
  string serial_number = 25;                  // Serial number
  google.protobuf.Timestamp manufacture_date = 26; // Manufacture date
  google.protobuf.Timestamp expiry_date = 27; // Expiry date
  
  // Cost information
  double unit_cost = 28;                      // Unit cost
  string currency_code = 29;                  // Currency code
  double total_value = 30;                    // Total inventory value
  
  // Supplier information
  string supplier_id = 31;                    // Supplier identifier
  string supplier_name = 32;                  // Supplier name
  string purchase_order_id = 33;              // Purchase order ID
  
  // Quality and condition
  string condition = 34;                      // Item condition
  string quality_grade = 35;                  // Quality grade
  bool is_damaged = 36;                       // Damage indicator
  string damage_description = 37;             // Damage description
  
  // Special handling
  bool requires_temperature_control = 38;      // Temperature control required
  string temperature_range = 39;              // Temperature range
  bool is_hazardous = 40;                     // Hazardous materials indicator
  string hazard_class = 41;                   // Hazard class
  bool requires_special_handling = 42;         // Special handling required
  
  // Timestamps
  google.protobuf.Timestamp received_date = 43; // Received date
  google.protobuf.Timestamp last_movement = 44;  // Last movement date
  google.protobuf.Timestamp last_counted = 45;   // Last count date
  google.protobuf.Timestamp created_at = 46;    // Creation timestamp
  google.protobuf.Timestamp last_updated = 47;  // Last update timestamp
  
  // Additional information
  string notes = 48;                          // Additional notes
  map<string, string> metadata = 49;         // Additional metadata
}
