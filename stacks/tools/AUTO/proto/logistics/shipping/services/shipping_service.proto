syntax = "proto3";

package logistics.shipping.services;

import "google/protobuf/empty.proto";
import "logistics/shipping/messages/shipment.proto";
import "logistics/shipping/messages/shipping_label.proto";
import "logistics/shipping/messages/shipping_manifest.proto";

// Shipping service for managing shipments, labels, and manifests
service ShippingService {
  // Shipment management
  rpc CreateShipment(CreateShipmentRequest) returns (Shipment);
  rpc GetShipment(GetShipmentRequest) returns (Shipment);
  rpc UpdateShipment(UpdateShipmentRequest) returns (Shipment);
  rpc ListShipments(ListShipmentsRequest) returns (ListShipmentsResponse);
  rpc CancelShipment(CancelShipmentRequest) returns (google.protobuf.Empty);
  rpc TrackShipment(TrackShipmentRequest) returns (TrackShipmentResponse);
  
  // Label management
  rpc GenerateLabel(GenerateLabelRequest) returns (ShippingLabel);
  rpc GetLabel(GetLabelRequest) returns (ShippingLabel);
  rpc ReprintLabel(ReprintLabelRequest) returns (ShippingLabel);
  rpc ValidateLabel(ValidateLabelRequest) returns (ValidateLabelResponse);
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  
  // Manifest management
  rpc CreateManifest(CreateManifestRequest) returns (ShippingManifest);
  rpc GetManifest(GetManifestRequest) returns (ShippingManifest);
  rpc UpdateManifest(UpdateManifestRequest) returns (ShippingManifest);
  rpc ListManifests(ListManifestsRequest) returns (ListManifestsResponse);
  rpc CompleteManifest(CompleteManifestRequest) returns (ShippingManifest);
  rpc CancelManifest(CancelManifestRequest) returns (google.protobuf.Empty);
  
  // Rate calculation and comparison
  rpc CalculateRates(CalculateRatesRequest) returns (CalculateRatesResponse);
  rpc CompareRates(CompareRatesRequest) returns (CompareRatesResponse);
  
  // Service availability
  rpc CheckServiceAvailability(CheckServiceAvailabilityRequest) returns (CheckServiceAvailabilityResponse);
  rpc GetDeliveryEstimates(GetDeliveryEstimatesRequest) returns (GetDeliveryEstimatesResponse);
}

// Request/Response messages for Shipment operations
message CreateShipmentRequest {
  string order_id = 1;
  Address origin = 2;
  Address destination = 3;
  repeated Package packages = 4;
  string shipping_method = 5;
  string priority = 6;
  string service_type = 7;
  bool signature_required = 8;
  bool insurance_required = 9;
  double declared_value = 10;
}

message GetShipmentRequest {
  string shipment_id = 1;
}

message UpdateShipmentRequest {
  string shipment_id = 1;
  Shipment shipment = 2;
}

message ListShipmentsRequest {
  string order_id = 1;
  string status = 2;
  string carrier_id = 3;
  string date_from = 4;
  string date_to = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListShipmentsResponse {
  repeated Shipment shipments = 1;
  string next_page_token = 2;
}

message CancelShipmentRequest {
  string shipment_id = 1;
  string reason = 2;
}

message TrackShipmentRequest {
  string tracking_number = 1;
}

message TrackShipmentResponse {
  Shipment shipment = 1;
  repeated TrackingEvent events = 2;
}

message TrackingEvent {
  string event_type = 1;
  string description = 2;
  string location = 3;
  string timestamp = 4;
  string status = 5;
}

// Request/Response messages for Label operations
message GenerateLabelRequest {
  string shipment_id = 1;
  string label_type = 2;
  string format = 3;
  string printer_type = 4;
}

message GetLabelRequest {
  string label_id = 1;
}

message ReprintLabelRequest {
  string label_id = 1;
  string reason = 2;
}

message ValidateLabelRequest {
  string label_id = 1;
}

message ValidateLabelResponse {
  bool is_valid = 1;
  string validation_notes = 2;
  repeated string issues = 3;
}

message ListLabelsRequest {
  string shipment_id = 1;
  string carrier_id = 2;
}

message ListLabelsResponse {
  repeated ShippingLabel labels = 1;
}

// Request/Response messages for Manifest operations
message CreateManifestRequest {
  string carrier_id = 1;
  string route_id = 2;
  string vehicle_id = 3;
  string driver_id = 4;
  repeated string shipment_ids = 5;
  string manifest_type = 6;
}

message GetManifestRequest {
  string manifest_id = 1;
}

message UpdateManifestRequest {
  string manifest_id = 1;
  ShippingManifest manifest = 2;
}

message ListManifestsRequest {
  string carrier_id = 1;
  string status = 2;
  string date_from = 3;
  string date_to = 4;
}

message ListManifestsResponse {
  repeated ShippingManifest manifests = 1;
}

message CompleteManifestRequest {
  string manifest_id = 1;
  string actual_arrival_time = 2;
  string completion_notes = 3;
}

message CancelManifestRequest {
  string manifest_id = 1;
  string reason = 2;
}

// Request/Response messages for Rate operations
message CalculateRatesRequest {
  Address origin = 1;
  Address destination = 2;
  repeated Package packages = 3;
  string shipping_method = 4;
  string service_type = 5;
}

message CalculateRatesResponse {
  repeated RateQuote quotes = 1;
}

message RateQuote {
  string carrier_id = 1;
  string service_name = 2;
  double cost = 3;
  string currency_code = 4;
  int32 estimated_days = 5;
  string delivery_date = 6;
  string service_code = 7;
}

message CompareRatesRequest {
  repeated string carrier_ids = 1;
  Address origin = 2;
  Address destination = 3;
  repeated Package packages = 4;
}

message CompareRatesResponse {
  repeated RateComparison comparisons = 1;
}

message RateComparison {
  string carrier_id = 1;
  string carrier_name = 2;
  repeated RateQuote quotes = 3;
}

// Request/Response messages for Service operations
message CheckServiceAvailabilityRequest {
  Address origin = 1;
  Address destination = 2;
  string service_type = 3;
}

message CheckServiceAvailabilityResponse {
  bool is_available = 1;
  string availability_message = 2;
  repeated string available_services = 3;
}

message GetDeliveryEstimatesRequest {
  Address origin = 1;
  Address destination = 2;
  string shipping_method = 3;
  string service_type = 4;
}

message GetDeliveryEstimatesResponse {
  repeated DeliveryEstimate estimates = 1;
}

message DeliveryEstimate {
  string carrier_id = 1;
  string service_name = 2;
  int32 estimated_days = 3;
  string delivery_date = 4;
  string cutoff_time = 5;
  bool weekend_delivery = 6;
}
