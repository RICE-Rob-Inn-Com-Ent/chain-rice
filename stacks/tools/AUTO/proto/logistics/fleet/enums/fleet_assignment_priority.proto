syntax = "proto3";

package logistics.fleet.enums;

// Priority levels for fleet assignments
enum FleetAssignmentPriority {
  FLEET_ASSIGNMENT_PRIORITY_UNSPECIFIED = 0;
  FLEET_ASSIGNMENT_PRIORITY_LOW = 1;           // Low priority - standard delivery
  FLEET_ASSIGNMENT_PRIORITY_NORMAL = 2;        // Normal priority - regular delivery
  FLEET_ASSIGNMENT_PRIORITY_HIGH = 3;          // High priority - expedited delivery
  FLEET_ASSIGNMENT_PRIORITY_URGENT = 4;        // Urgent priority - same day delivery
  FLEET_ASSIGNMENT_PRIORITY_CRITICAL = 5;      // Critical priority - emergency delivery
  FLEET_ASSIGNMENT_PRIORITY_SCHEDULED = 6;     // Scheduled priority - time-specific delivery
}
