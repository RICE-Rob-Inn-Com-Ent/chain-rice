syntax = "proto3";

package logistics.fleet.enums;

// Status of fleet drivers
enum FleetDriverStatus {
  FLEET_DRIVER_STATUS_UNSPECIFIED = 0;
  FLEET_DRIVER_STATUS_AVAILABLE = 1;          // Available for assignment
  FLEET_DRIVER_STATUS_ON_DUTY = 2;             // Currently on duty
  FLEET_DRIVER_STATUS_OFF_DUTY = 3;            // Off duty
  FLEET_DRIVER_STATUS_ON_BREAK = 4;            // On break
  FLEET_DRIVER_STATUS_DRIVING = 5;             // Currently driving
  FLEET_DRIVER_STATUS_LOADING = 6;             // Loading/unloading cargo
  FLEET_DRIVER_STATUS_WAITING = 7;             // Waiting for instructions
  FLEET_DRIVER_STATUS_SICK_LEAVE = 8;          // On sick leave
  FLEET_DRIVER_STATUS_VACATION = 9;            // On vacation
  FLEET_DRIVER_STATUS_SUSPENDED = 10;          // Suspended from duty
  FLEET_DRIVER_STATUS_TRAINING = 11;           // In training
  FLEET_DRIVER_STATUS_MAINTENANCE = 12;        // Performing vehicle maintenance
  FLEET_DRIVER_STATUS_EMERGENCY = 13;          // Emergency situation
}
