syntax = "proto3";

package logistics.fleet.enums;

// Status of fleet vehicles
enum FleetVehicleStatus {
  FLEET_VEHICLE_STATUS_UNSPECIFIED = 0;
  FLEET_VEHICLE_STATUS_AVAILABLE = 1;          // Available for assignment
  FLEET_VEHICLE_STATUS_IN_USE = 2;             // Currently in use
  FLEET_VEHICLE_STATUS_MAINTENANCE = 3;         // Under maintenance
  FLEET_VEHICLE_STATUS_REPAIR = 4;              // Under repair
  FLEET_VEHICLE_STATUS_OUT_OF_SERVICE = 5;     // Out of service
  FLEET_VEHICLE_STATUS_RESERVED = 6;           // Reserved for specific use
  FLEET_VEHICLE_STATUS_FUELING = 7;            // Currently fueling
  FLEET_VEHICLE_STATUS_LOADING = 8;            // Loading cargo
  FLEET_VEHICLE_STATUS_UNLOADING = 9;          // Unloading cargo
  FLEET_VEHICLE_STATUS_IN_TRANSIT = 10;        // In transit to destination
  FLEET_VEHICLE_STATUS_RETURNING = 11;         // Returning to base
  FLEET_VEHICLE_STATUS_IDLE = 12;              // Idle/stationary
  FLEET_VEHICLE_STATUS_OFFLINE = 13;           // Offline/unreachable
}
