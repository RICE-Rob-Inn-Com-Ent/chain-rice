syntax = "proto3";

package logistics.fleet.messages;

import "google/protobuf/timestamp.proto";
import "logistics/fleet/enums/fleet_vehicle_type.proto";
import "logistics/fleet/enums/fleet_vehicle_status.proto";

// Fleet vehicle information
message FleetVehicle {
  string vehicle_id = 1;                       // Unique vehicle identifier
  string license_plate = 2;                     // License plate number
  string vin = 3;                              // Vehicle Identification Number
  string make = 4;                             // Vehicle manufacturer
  string model = 5;                            // Vehicle model
  int32 year = 6;                              // Manufacturing year
  
  // Vehicle specifications
  logistics.fleet.enums.FleetVehicleType vehicle_type = 7;
  double max_capacity_kg = 8;                  // Maximum cargo capacity in kg
  double max_volume_cubic_m = 9;               // Maximum volume capacity in cubic meters
  int32 max_pallets = 10;                      // Maximum number of pallets
  bool has_refrigeration = 11;                 // Refrigeration capability
  bool has_hazardous_cargo = 12;               // Hazardous cargo certification
  
  // Current status
  logistics.fleet.enums.FleetVehicleStatus status = 13;
  string current_driver_id = 14;               // Currently assigned driver
  string current_location = 15;                // Current GPS location
  double fuel_level_percent = 16;              // Current fuel level percentage
  int32 odometer_km = 17;                      // Current odometer reading
  
  // Maintenance information
  google.protobuf.Timestamp last_maintenance = 18; // Last maintenance date
  google.protobuf.Timestamp next_maintenance = 19; // Next scheduled maintenance
  int32 maintenance_mileage = 20;              // Mileage at last maintenance
  repeated string maintenance_history = 21;    // Maintenance record IDs
  
  // Insurance and registration
  string insurance_policy = 22;                // Insurance policy number
  google.protobuf.Timestamp insurance_expiry = 23; // Insurance expiry date
  google.protobuf.Timestamp registration_expiry = 24; // Registration expiry date
  
  // Timestamps
  google.protobuf.Timestamp created_at = 25;   // Vehicle registration date
  google.protobuf.Timestamp last_updated = 26; // Last status update
  
  // Additional information
  string depot_id = 27;                        // Home depot/base location
  string notes = 28;                           // Additional notes
  map<string, string> metadata = 29;           // Additional metadata
}
