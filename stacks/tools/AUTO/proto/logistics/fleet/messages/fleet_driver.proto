syntax = "proto3";

package logistics.fleet.messages;

import "google/protobuf/timestamp.proto";
import "logistics/fleet/enums/fleet_driver_status.proto";

// Fleet driver information
message FleetDriver {
  string driver_id = 1;                        // Unique driver identifier
  string employee_id = 2;                      // Employee ID
  string first_name = 3;                       // Driver first name
  string last_name = 4;                        // Driver last name
  string email = 5;                           // Email address
  string phone = 6;                           // Phone number
  
  // License information
  string license_number = 7;                   // Driver's license number
  string license_class = 8;                    // License class (A, B, C, etc.)
  string license_state = 9;                    // License issuing state/country
  google.protobuf.Timestamp license_expiry = 10; // License expiry date
  
  // Certifications
  repeated string certifications = 11;         // Special certifications (CDL, Hazmat, etc.)
  bool hazmat_certified = 12;                   // Hazardous materials certification
  bool passenger_certified = 13;               // Passenger transport certification
  google.protobuf.Timestamp hazmat_expiry = 14; // Hazmat certification expiry
  
  // Current status
  logistics.fleet.enums.FleetDriverStatus status = 15;
  string current_vehicle_id = 16;              // Currently assigned vehicle
  string current_location = 17;                // Current GPS location
  
  // Work information
  string depot_id = 18;                        // Home depot/base location
  string shift_pattern = 19;                   // Work shift pattern
  double max_hours_per_day = 20;               // Maximum hours per day
  double max_hours_per_week = 21;              // Maximum hours per week
  
  // Performance metrics
  double safety_score = 22;                    // Safety performance score
  double efficiency_score = 23;                // Delivery efficiency score
  int32 total_deliveries = 24;                 // Total deliveries completed
  double total_distance_km = 25;              // Total distance driven
  
  // Timestamps
  google.protobuf.Timestamp hire_date = 26;    // Date hired
  google.protobuf.Timestamp last_updated = 27; // Last status update
  google.protobuf.Timestamp last_drug_test = 28; // Last drug test date
  google.protobuf.Timestamp next_drug_test = 29; // Next scheduled drug test
  
  // Additional information
  string emergency_contact = 30;               // Emergency contact information
  string notes = 31;                          // Additional notes
  map<string, string> metadata = 32;           // Additional metadata
}
