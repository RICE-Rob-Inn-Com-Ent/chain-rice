syntax = "proto3";

package logistics.fleet.services;

import "google/protobuf/empty.proto";
import "logistics/fleet/messages/fleet_vehicle.proto";
import "logistics/fleet/messages/fleet_driver.proto";
import "logistics/fleet/messages/fleet_assignment.proto";

// Fleet management service for vehicles, drivers, and assignments
service FleetService {
  // Vehicle management
  rpc RegisterVehicle(FleetVehicle) returns (FleetVehicle);
  rpc GetVehicle(GetVehicleRequest) returns (FleetVehicle);
  rpc UpdateVehicle(UpdateVehicleRequest) returns (FleetVehicle);
  rpc ListVehicles(ListVehiclesRequest) returns (ListVehiclesResponse);
  rpc DecommissionVehicle(DecommissionVehicleRequest) returns (google.protobuf.Empty);
  rpc UpdateVehicleStatus(UpdateVehicleStatusRequest) returns (FleetVehicle);
  rpc GetVehicleLocation(GetVehicleLocationRequest) returns (GetVehicleLocationResponse);
  
  // Driver management
  rpc RegisterDriver(FleetDriver) returns (FleetDriver);
  rpc GetDriver(GetDriverRequest) returns (FleetDriver);
  rpc UpdateDriver(UpdateDriverRequest) returns (FleetDriver);
  rpc ListDrivers(ListDriversRequest) returns (ListDriversResponse);
  rpc UpdateDriverStatus(UpdateDriverStatusRequest) returns (FleetDriver);
  rpc GetDriverLocation(GetDriverLocationRequest) returns (GetDriverLocationResponse);
  rpc ValidateDriverLicense(ValidateDriverLicenseRequest) returns (ValidateDriverLicenseResponse);
  
  // Assignment management
  rpc CreateAssignment(CreateAssignmentRequest) returns (FleetAssignment);
  rpc GetAssignment(GetAssignmentRequest) returns (FleetAssignment);
  rpc UpdateAssignment(UpdateAssignmentRequest) returns (FleetAssignment);
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);
  rpc AssignDriverToVehicle(AssignDriverToVehicleRequest) returns (google.protobuf.Empty);
  rpc CompleteAssignment(CompleteAssignmentRequest) returns (FleetAssignment);
  rpc CancelAssignment(CancelAssignmentRequest) returns (google.protobuf.Empty);
  
  // Fleet optimization
  rpc OptimizeRoute(OptimizeRouteRequest) returns (OptimizeRouteResponse);
  rpc GetFleetMetrics(GetFleetMetricsRequest) returns (GetFleetMetricsResponse);
  rpc GetDriverMetrics(GetDriverMetricsRequest) returns (GetDriverMetricsResponse);
}

// Request/Response messages for Vehicle operations
message GetVehicleRequest {
  string vehicle_id = 1;
}

message UpdateVehicleRequest {
  string vehicle_id = 1;
  FleetVehicle vehicle = 2;
}

message ListVehiclesRequest {
  string depot_id = 1;
  string vehicle_type = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListVehiclesResponse {
  repeated FleetVehicle vehicles = 1;
  string next_page_token = 2;
}

message DecommissionVehicleRequest {
  string vehicle_id = 1;
  string reason = 2;
}

message UpdateVehicleStatusRequest {
  string vehicle_id = 1;
  string status = 2;
  string location = 3;
  double fuel_level_percent = 4;
}

message GetVehicleLocationRequest {
  string vehicle_id = 1;
}

message GetVehicleLocationResponse {
  string location = 1;
  double latitude = 2;
  double longitude = 3;
  string timestamp = 4;
}

// Request/Response messages for Driver operations
message GetDriverRequest {
  string driver_id = 1;
}

message UpdateDriverRequest {
  string driver_id = 1;
  FleetDriver driver = 2;
}

message ListDriversRequest {
  string depot_id = 1;
  string status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListDriversResponse {
  repeated FleetDriver drivers = 1;
  string next_page_token = 2;
}

message UpdateDriverStatusRequest {
  string driver_id = 1;
  string status = 2;
  string location = 3;
}

message GetDriverLocationRequest {
  string driver_id = 1;
}

message GetDriverLocationResponse {
  string location = 1;
  double latitude = 2;
  double longitude = 3;
  string timestamp = 4;
}

message ValidateDriverLicenseRequest {
  string driver_id = 1;
}

message ValidateDriverLicenseResponse {
  bool is_valid = 1;
  string expiry_date = 2;
  repeated string violations = 3;
}

// Request/Response messages for Assignment operations
message CreateAssignmentRequest {
  string shipment_id = 1;
  string vehicle_id = 2;
  string driver_id = 3;
  string priority = 4;
  string pickup_location = 5;
  string delivery_location = 6;
  string scheduled_start = 7;
  string scheduled_end = 8;
}

message GetAssignmentRequest {
  string assignment_id = 1;
}

message UpdateAssignmentRequest {
  string assignment_id = 1;
  FleetAssignment assignment = 2;
}

message ListAssignmentsRequest {
  string driver_id = 1;
  string vehicle_id = 2;
  string status = 3;
  string date_from = 4;
  string date_to = 5;
}

message ListAssignmentsResponse {
  repeated FleetAssignment assignments = 1;
}

message AssignDriverToVehicleRequest {
  string driver_id = 1;
  string vehicle_id = 2;
}

message CompleteAssignmentRequest {
  string assignment_id = 1;
  string actual_end_time = 2;
  string delivery_notes = 3;
  string signature_proof = 4;
  string photo_proof = 5;
}

message CancelAssignmentRequest {
  string assignment_id = 1;
  string reason = 2;
}

// Request/Response messages for Fleet optimization
message OptimizeRouteRequest {
  repeated string assignment_ids = 1;
  string optimization_type = 2; // distance, time, fuel
}

message OptimizeRouteResponse {
  repeated string optimized_assignment_ids = 1;
  double total_distance_km = 2;
  int32 total_time_minutes = 3;
  double estimated_fuel_cost = 4;
}

message GetFleetMetricsRequest {
  string depot_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetFleetMetricsResponse {
  int32 total_vehicles = 1;
  int32 active_vehicles = 2;
  int32 total_drivers = 3;
  int32 active_drivers = 4;
  int32 completed_assignments = 5;
  double total_distance_km = 6;
  double average_delivery_time_minutes = 7;
  double fuel_efficiency_km_per_liter = 8;
}

message GetDriverMetricsRequest {
  string driver_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetDriverMetricsResponse {
  int32 total_assignments = 1;
  int32 completed_assignments = 2;
  double total_distance_km = 3;
  double average_delivery_time_minutes = 4;
  double safety_score = 5;
  double efficiency_score = 6;
  int32 hours_worked = 7;
}
