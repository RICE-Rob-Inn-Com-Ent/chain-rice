syntax = "proto3";

package government.permits.services;

import "google/protobuf/empty.proto";
import "../messages/permit_models.proto";

// Сервіс повідомлень про дозволи
service PermitNotificationsService {
  // Відправити повідомлення
  rpc SendNotification(SendNotificationRequest) returns (NotificationResponse);
  
  // Відправити нагадування
  rpc SendReminder(SendReminderRequest) returns (NotificationResponse);
  
  // Відправити повідомлення про затвердження
  rpc SendApprovalNotification(SendApprovalNotificationRequest) returns (NotificationResponse);
  
  // Відправити повідомлення про відхилення
  rpc SendRejectionNotification(SendRejectionNotificationRequest) returns (NotificationResponse);
  
  // Відправити повідомлення про закінчення дії
  rpc SendExpiryNotification(SendExpiryNotificationRequest) returns (NotificationResponse);
  
  // Відправити масове повідомлення
  rpc SendBulkNotification(SendBulkNotificationRequest) returns (BulkNotificationResponse);
  
  // Отримати історію повідомлень
  rpc GetNotificationHistory(GetNotificationHistoryRequest) returns (NotificationHistoryResponse);
  
  // Отримати статистику повідомлень
  rpc GetNotificationStatistics(google.protobuf.Empty) returns (NotificationStatistics);
  
  // Налаштувати шаблони повідомлень
  rpc UpdateNotificationTemplate(UpdateNotificationTemplateRequest) returns (NotificationTemplateResponse);
  
  // Отримати шаблони повідомлень
  rpc GetNotificationTemplates(google.protobuf.Empty) returns (NotificationTemplatesResponse);
}

// Запити та відповіді
message SendNotificationRequest {
  string permit_id = 1;
  string recipient = 2;
  string notification_type = 3;
  string subject = 4;
  string message = 5;
  repeated string channels = 6; // email, sms, push, etc.
  string sent_by = 7;
}

message SendReminderRequest {
  string permit_id = 1;
  string reminder_type = 2;
  string recipient = 3;
  string message = 4;
  string sent_by = 5;
}

message SendApprovalNotificationRequest {
  string permit_id = 1;
  string recipient = 2;
  string permit_number = 3;
  string validity_period = 4;
  repeated string conditions = 5;
  string sent_by = 6;
}

message SendRejectionNotificationRequest {
  string permit_id = 1;
  string recipient = 2;
  string rejection_reason = 3;
  repeated string required_actions = 4;
  string sent_by = 5;
}

message SendExpiryNotificationRequest {
  string permit_id = 1;
  string recipient = 2;
  string expiry_date = 3;
  bool renewal_available = 4;
  string sent_by = 5;
}

message SendBulkNotificationRequest {
  repeated string permit_ids = 1;
  string notification_type = 2;
  string subject = 3;
  string message = 4;
  repeated string channels = 5;
  string sent_by = 6;
}

message GetNotificationHistoryRequest {
  string permit_id = 1;
  string notification_type = 2;
  int32 page_number = 3;
  int32 page_size = 4;
}

message UpdateNotificationTemplateRequest {
  string template_id = 1;
  string template_name = 2;
  string subject_template = 3;
  string message_template = 4;
  string notification_type = 5;
  string updated_by = 6;
}

message NotificationResponse {
  bool success = 1;
  string message = 2;
  string notification_id = 3;
  string delivery_status = 4;
  string sent_at = 5;
}

message BulkNotificationResponse {
  bool success = 1;
  string message = 2;
  int32 total_sent = 3;
  int32 failed_count = 4;
  repeated NotificationResponse results = 5;
}

message NotificationHistoryResponse {
  bool success = 1;
  string message = 2;
  repeated NotificationRecord notifications = 3;
  int32 total_count = 4;
  int32 page_number = 5;
  int32 page_size = 6;
}

message NotificationTemplateResponse {
  bool success = 1;
  string message = 2;
  NotificationTemplate template = 3;
}

message NotificationTemplatesResponse {
  bool success = 1;
  string message = 2;
  repeated NotificationTemplate templates = 3;
}

// Моделі
message NotificationRecord {
  string notification_id = 1;
  string permit_id = 2;
  string recipient = 3;
  string notification_type = 4;
  string subject = 5;
  string message = 6;
  string delivery_status = 7;
  string sent_at = 8;
  string delivered_at = 9;
  string error_message = 10;
}

message NotificationTemplate {
  string template_id = 1;
  string template_name = 2;
  string notification_type = 3;
  string subject_template = 4;
  string message_template = 5;
  string created_at = 6;
  string updated_at = 7;
  string created_by = 8;
}

message NotificationStatistics {
  int32 total_notifications = 1;
  int32 sent_notifications = 2;
  int32 delivered_notifications = 3;
  int32 failed_notifications = 4;
  repeated NotificationTypeStatistics by_type = 5;
  repeated NotificationChannelStatistics by_channel = 6;
  repeated NotificationStatusStatistics by_status = 7;
}

message NotificationTypeStatistics {
  string notification_type = 1;
  int32 count = 2;
  double percentage = 3;
}

message NotificationChannelStatistics {
  string channel = 1;
  int32 count = 2;
  double percentage = 3;
}

message NotificationStatusStatistics {
  string status = 1;
  int32 count = 2;
  double percentage = 3;
}
