syntax = "proto3";

package government.permits.services;

import "google/protobuf/empty.proto";
import "../messages/permit_models.proto";
import "../enums/permit_status.proto";

// Сервіс затвердження дозволів
service PermitApprovalService {
  // Подати заявку на дозвіл
  rpc SubmitApplication(SubmitApplicationRequest) returns (ApplicationResponse);
  
  // Розглянути заявку
  rpc ReviewApplication(ReviewApplicationRequest) returns (ApplicationResponse);
  
  // Затвердити дозвіл
  rpc ApprovePermit(ApprovePermitRequest) returns (PermitResponse);
  
  // Відхилити дозвіл
  rpc RejectPermit(RejectPermitRequest) returns (PermitResponse);
  
  // Призупинити дозвіл
  rpc SuspendPermit(SuspendPermitRequest) returns (PermitResponse);
  
  // Анулювати дозвіл
  rpc RevokePermit(RevokePermitRequest) returns (PermitResponse);
  
  // Продовжити дозвіл
  rpc RenewPermit(RenewPermitRequest) returns (PermitResponse);
  
  // Змінити статус дозволу
  rpc ChangePermitStatus(ChangePermitStatusRequest) returns (PermitResponse);
  
  // Отримати заявки на розгляд
  rpc GetPendingApplications(GetPendingApplicationsRequest) returns (PermitSearchResult);
  
  // Отримати заявки за статусом
  rpc GetApplicationsByStatus(GetApplicationsByStatusRequest) returns (PermitSearchResult);
  
  // Отримати статистику затверджень
  rpc GetApprovalStatistics(google.protobuf.Empty) returns (ApprovalStatistics);
}

// Запити та відповіді
message SubmitApplicationRequest {
  string permit_type = 1;
  string priority = 2;
  string applicant_id = 3;
  string description = 4;
  string purpose = 5;
  string location = 6;
  repeated string documents = 7;
  string submitted_by = 8;
}

message ReviewApplicationRequest {
  string permit_id = 1;
  string reviewer_id = 2;
  string review_comments = 3;
  bool requires_additional_info = 4;
  repeated string missing_documents = 5;
  string reviewed_by = 6;
}

message ApprovePermitRequest {
  string permit_id = 1;
  string approver_id = 2;
  string approval_comments = 3;
  string validity_period = 4;
  repeated string conditions = 5;
  string approved_by = 6;
}

message RejectPermitRequest {
  string permit_id = 1;
  string reviewer_id = 2;
  string rejection_reason = 3;
  string rejection_comments = 4;
  repeated string required_actions = 5;
  string rejected_by = 6;
}

message SuspendPermitRequest {
  string permit_id = 1;
  string suspended_by = 2;
  string suspension_reason = 3;
  string suspension_period = 4;
  repeated string conditions = 5;
}

message RevokePermitRequest {
  string permit_id = 1;
  string revoked_by = 2;
  string revocation_reason = 3;
  repeated string violations = 4;
}

message RenewPermitRequest {
  string permit_id = 1;
  string new_expiry_date = 2;
  string renewal_reason = 3;
  string renewed_by = 4;
}

message ChangePermitStatusRequest {
  string permit_id = 1;
  PermitStatus new_status = 2;
  string reason = 3;
  string changed_by = 4;
}

message GetPendingApplicationsRequest {
  string reviewer_id = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message GetApplicationsByStatusRequest {
  PermitStatus status = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message ApplicationResponse {
  bool success = 1;
  string message = 2;
  Permit permit = 3;
  string application_number = 4;
}

message ApprovalStatistics {
  int32 total_applications = 1;
  int32 pending_applications = 2;
  int32 approved_applications = 3;
  int32 rejected_applications = 4;
  int32 suspended_permits = 5;
  int32 revoked_permits = 6;
  double approval_rate = 7;
  repeated ApprovalTypeStatistics by_type = 8;
  repeated ApprovalUserStatistics by_user = 9;
}

message ApprovalTypeStatistics {
  string permit_type = 1;
  int32 total = 2;
  int32 approved = 3;
  int32 rejected = 4;
  double approval_rate = 5;
}

message ApprovalUserStatistics {
  string user_id = 1;
  int32 total_reviews = 2;
  int32 approved = 3;
  int32 rejected = 4;
  double approval_rate = 5;
}
