syntax = "proto3";

package government.permits.services;

import "google/protobuf/empty.proto";
import "../messages/permit_models.proto";

// Сервіс управління дозволами
service PermitService {
  // Створити новий дозвіл
  rpc CreatePermit(CreatePermitRequest) returns (PermitResponse);
  
  // Отримати дозвіл за ID
  rpc GetPermit(GetPermitRequest) returns (PermitResponse);
  
  // Оновити дозвіл
  rpc UpdatePermit(UpdatePermitRequest) returns (PermitResponse);
  
  // Видалити дозвіл
  rpc DeletePermit(DeletePermitRequest) returns (PermitResponse);
  
  // Пошук дозволів
  rpc SearchPermits(SearchPermitsRequest) returns (PermitSearchResult);
  
  // Отримати список всіх дозволів
  rpc ListPermits(ListPermitsRequest) returns (PermitSearchResult);
  
  // Отримати дозволи заявника
  rpc GetApplicantPermits(GetApplicantPermitsRequest) returns (PermitSearchResult);
  
  // Отримати статистику дозволів
  rpc GetPermitStatistics(google.protobuf.Empty) returns (PermitStatistics);
  
  // Перевірити існування дозволу
  rpc PermitExists(PermitExistsRequest) returns (PermitExistsResponse);
  
  // Отримати дозволи, що закінчуються
  rpc GetExpiringPermits(GetExpiringPermitsRequest) returns (PermitSearchResult);
}

// Запити та відповіді
message CreatePermitRequest {
  string permit_type = 1;
  string priority = 2;
  string applicant_id = 3;
  string description = 4;
  string purpose = 5;
  string location = 6;
  repeated string required_documents = 7;
  string created_by = 8;
}

message GetPermitRequest {
  string permit_id = 1;
}

message UpdatePermitRequest {
  string permit_id = 1;
  string description = 2;
  string purpose = 3;
  string location = 4;
  string notes = 5;
  string updated_by = 6;
}

message DeletePermitRequest {
  string permit_id = 1;
  string reason = 2;
  string deleted_by = 3;
}

message SearchPermitsRequest {
  PermitFilter filter = 1;
  int32 page_number = 2;
  int32 page_size = 3;
  string sort_by = 4;
  bool sort_descending = 5;
}

message ListPermitsRequest {
  int32 page_number = 1;
  int32 page_size = 2;
  string sort_by = 3;
  bool sort_descending = 4;
}

message GetApplicantPermitsRequest {
  string applicant_id = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message PermitExistsRequest {
  string permit_number = 1;
  string permit_type = 2;
}

message PermitExistsResponse {
  bool exists = 1;
  string permit_id = 2;
  string message = 3;
}

message GetExpiringPermitsRequest {
  int32 days_ahead = 1;
  string permit_type = 2;
}

message PermitResponse {
  bool success = 1;
  string message = 2;
  Permit permit = 3;
}
