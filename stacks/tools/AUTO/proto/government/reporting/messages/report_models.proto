syntax = "proto3";

package government.reporting.messages;

import "google/protobuf/timestamp.proto";
import "../enums/report_type.proto";
import "../enums/report_status.proto";
import "../enums/report_category.proto";

// Модель звіту
message Report {
  string report_id = 1;                     // Унікальний ідентифікатор звіту
  string report_name = 2;                   // Назва звіту
  ReportType type = 3;                      // Тип звіту
  ReportStatus status = 4;                  // Статус звіту
  ReportCategory category = 5;              // Категорія звіту
  string description = 6;                   // Опис звіту
  string created_by = 7;                    // Хто створив
  string approved_by = 8;                   // Хто затвердив
  google.protobuf.Timestamp created_at = 9; // Дата створення
  google.protobuf.Timestamp updated_at = 10; // Дата оновлення
  google.protobuf.Timestamp submitted_at = 11; // Дата подання
  google.protobuf.Timestamp approved_at = 12; // Дата затвердження
  google.protobuf.Timestamp from_date = 13; // Період з
  google.protobuf.Timestamp to_date = 14;   // Період до
  repeated string data_sources = 15;        // Джерела даних
  repeated string attachments = 16;         // Додатки
  string notes = 17;                        // Примітки
  repeated string tags = 18;                // Теги
  string format = 19;                       // Формат (PDF, CSV, JSON)
  string version = 20;                      // Версія звіту
}

// Метадані звіту
message ReportMetadata {
  string report_id = 1;
  string title = 2;
  string summary = 3;
  string author = 4;
  string department = 5;
  google.protobuf.Timestamp generated_at = 6;
  string generator_version = 7;
  repeated string keywords = 8;
  string language = 9;
  string confidentiality_level = 10;
}

// Фільтр для пошуку звітів
message ReportFilter {
  ReportType type = 1;
  ReportStatus status = 2;
  ReportCategory category = 3;
  string created_by = 4;
  google.protobuf.Timestamp from_date = 5;
  google.protobuf.Timestamp to_date = 6;
  repeated string tags = 7;
  string department = 8;
}

// Результат пошуку звітів
message ReportSearchResult {
  repeated Report reports = 1;
  int32 total_count = 2;
  int32 page_number = 3;
  int32 page_size = 4;
}

// Статистика звітів
message ReportStatistics {
  int32 total_reports = 1;
  int32 draft_reports = 2;
  int32 submitted_reports = 3;
  int32 approved_reports = 4;
  int32 published_reports = 5;
  repeated ReportTypeStatistics by_type = 6;
  repeated ReportCategoryStatistics by_category = 7;
  repeated ReportStatusStatistics by_status = 8;
}

message ReportTypeStatistics {
  ReportType type = 1;
  int32 count = 2;
  double percentage = 3;
}

message ReportCategoryStatistics {
  ReportCategory category = 1;
  int32 count = 2;
  double percentage = 3;
}

message ReportStatusStatistics {
  ReportStatus status = 1;
  int32 count = 2;
  double percentage = 3;
}
