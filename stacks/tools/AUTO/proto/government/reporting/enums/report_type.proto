syntax = "proto3";

package government.reporting.enums;

// Типи звітів
enum ReportType {
  REPORT_TYPE_UNSPECIFIED = 0;
  REPORT_TYPE_MONTHLY = 1;          // Місячний звіт
  REPORT_TYPE_YEARLY = 2;           // Річний звіт
  REPORT_TYPE_QUARTERLY = 3;        // Квартальний звіт
  REPORT_TYPE_CUSTOM = 4;           // Користувацький звіт
  REPORT_TYPE_AD_HOC = 5;           // Разовий звіт
  REPORT_TYPE_REAL_TIME = 6;        // Звіт у реальному часі
  REPORT_TYPE_SCHEDULED = 7;        // Запланований звіт
  REPORT_TYPE_EMERGENCY = 8;        // Екстрений звіт
  REPORT_TYPE_AUDIT = 9;            // Аудит звіт
  REPORT_TYPE_COMPLIANCE = 10;      // Звіт про відповідність
}
