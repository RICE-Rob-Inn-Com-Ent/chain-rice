syntax = "proto3";

package government;

// Government module index - comprehensive Protobuf definitions for government operations
// This module provides complete gRPC services for government management including
// citizens, permits, reporting, and taxation operations.

option go_package = "github.com/rice-dev/government";

// Import all enums from submodules
import "citizens/enums/citizen_status.proto";
import "citizens/enums/citizen_type.proto";
import "citizens/enums/document_type.proto";
import "permits/enums/permit_type.proto";
import "permits/enums/permit_status.proto";
import "permits/enums/permit_priority.proto";
import "reporting/enums/report_type.proto";
import "reporting/enums/report_status.proto";
import "reporting/enums/report_category.proto";
import "taxation/enums/tax_type.proto";
import "taxation/enums/tax_status.proto";
import "taxation/enums/tax_priority.proto";

// Import all messages from submodules
import "citizens/messages/citizen_models.proto";
import "citizens/messages/citizen_documents.proto";
import "citizens/messages/citizen_events.proto";
import "permits/messages/permit_models.proto";
import "permits/messages/permit_history.proto";
import "permits/messages/permit_events.proto";
import "reporting/messages/report_models.proto";
import "reporting/messages/report_data.proto";
import "taxation/messages/tax_record_models.proto";
import "taxation/messages/tax_payment_models.proto";
import "taxation/messages/tax_events.proto";

// Import all services from submodules
import "citizens/services/citizen_service.proto";
import "citizens/services/document_service.proto";
import "citizens/services/citizen_reporting_service.proto";
import "permits/services/permit_service.proto";
import "permits/services/permit_approval_service.proto";
import "permits/services/permit_notifications_service.proto";
import "reporting/services/report_service.proto";
import "taxation/services/tax_service.proto";
import "taxation/services/payment_service.proto";

// Government module summary
message GovernmentModuleSummary {
  // Module version
  string version = 1;
  
  // Module description
  string description = 2;
  
  // Available services
  repeated string available_services = 3;
  
  // Available enums
  repeated string available_enums = 4;
  
  // Available messages
  repeated string available_messages = 5;
  
  // Module capabilities
  repeated string capabilities = 6;
  
  // Last updated timestamp
  int64 last_updated = 7;
}

// Main service aggregator - provides access to all government services
service GovernmentService {
  // Citizens operations
  rpc CreateCitizen(citizens.services.CreateCitizenRequest) returns (citizens.services.CreateCitizenResponse);
  rpc GetCitizen(citizens.services.GetCitizenRequest) returns (citizens.services.GetCitizenResponse);
  rpc UpdateCitizen(citizens.services.UpdateCitizenRequest) returns (citizens.services.UpdateCitizenResponse);
  rpc DeleteCitizen(citizens.services.DeleteCitizenRequest) returns (citizens.services.DeleteCitizenResponse);
  
  // Permits operations
  rpc CreatePermit(permits.services.CreatePermitRequest) returns (permits.services.CreatePermitResponse);
  rpc GetPermit(permits.services.GetPermitRequest) returns (permits.services.GetPermitResponse);
  rpc UpdatePermitStatus(permits.services.UpdatePermitStatusRequest) returns (permits.services.UpdatePermitStatusResponse);
  rpc ApprovePermit(permits.services.ApprovePermitRequest) returns (permits.services.ApprovePermitResponse);
  
  // Reporting operations
  rpc GenerateReport(reporting.services.GenerateReportRequest) returns (reporting.services.GenerateReportResponse);
  rpc GetReport(reporting.services.GetReportRequest) returns (reporting.services.GetReportResponse);
  rpc ListReports(reporting.services.ListReportsRequest) returns (reporting.services.ListReportsResponse);
  
  // Taxation operations
  rpc CalculateTax(taxation.services.CalculateTaxRequest) returns (taxation.services.CalculateTaxResponse);
  rpc CreateTaxRecord(taxation.services.CreateTaxRecordRequest) returns (taxation.services.CreateTaxRecordResponse);
  rpc ProcessPayment(taxation.services.ProcessPaymentRequest) returns (taxation.services.ProcessPaymentResponse);
}
