syntax = "proto3";

package government.citizens.messages;

import "google/protobuf/timestamp.proto";
import "../enums/citizen_status.proto";
import "../enums/citizen_type.proto";

// Модель громадянина
message Citizen {
  string citizen_id = 1;                    // Унікальний ідентифікатор громадянина
  string first_name = 2;                    // Ім'я
  string last_name = 3;                     // Прізвище
  string middle_name = 4;                   // По батькові
  google.protobuf.Timestamp date_of_birth = 5; // Дата народження
  string gender = 6;                        // Стать
  string nationality = 7;                   // Національність
  CitizenStatus status = 8;                 // Статус громадянина
  CitizenType type = 9;                     // Тип громадянина
  Address address = 10;                     // Адреса проживання
  ContactInfo contact_info = 11;            // Контактна інформація
  google.protobuf.Timestamp registration_date = 12; // Дата реєстрації
  google.protobuf.Timestamp last_updated = 13; // Останнє оновлення
  repeated string document_ids = 14;        // Список ID документів
}

// Адреса
message Address {
  string street = 1;                        // Вулиця
  string house_number = 2;                  // Номер будинку
  string apartment_number = 3;              // Номер квартири
  string city = 4;                          // Місто
  string region = 5;                        // Область/регіон
  string postal_code = 6;                   // Поштовий індекс
  string country = 7;                       // Країна
  string coordinates = 8;                   // Координати (широта, довгота)
}

// Контактна інформація
message ContactInfo {
  string email = 1;                         // Email
  string phone_number = 2;                  // Номер телефону
  string mobile_number = 3;                 // Мобільний номер
  string emergency_contact = 4;             // Екстрений контакт
  string emergency_phone = 5;               // Телефон екстренного контакту
}

// Фільтр для пошуку громадян
message CitizenFilter {
  string first_name = 1;
  string last_name = 2;
  CitizenStatus status = 3;
  CitizenType type = 4;
  string city = 5;
  string nationality = 6;
  google.protobuf.Timestamp date_of_birth_from = 7;
  google.protobuf.Timestamp date_of_birth_to = 8;
}

// Результат пошуку громадян
message CitizenSearchResult {
  repeated Citizen citizens = 1;
  int32 total_count = 2;
  int32 page_number = 3;
  int32 page_size = 4;
}
