syntax = "proto3";

package government.citizens.enums;

// Типи документів
enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_PASSPORT = 1;     // Паспорт
  DOCUMENT_TYPE_ID_CARD = 2;      // ID картка
  DOCUMENT_TYPE_VISA = 3;         // Віза
  DOCUMENT_TYPE_BIRTH_CERTIFICATE = 4; // Свідоцтво про народження
  DOCUMENT_TYPE_MARRIAGE_CERTIFICATE = 5; // Свідоцтво про шлюб
  DOCUMENT_TYPE_DEATH_CERTIFICATE = 6; // Свідоцтво про смерть
  DOCUMENT_TYPE_DRIVER_LICENSE = 7; // Посвідчення водія
  DOCUMENT_TYPE_WORK_PERMIT = 8;  // Дозвіл на роботу
  DOCUMENT_TYPE_RESIDENCE_PERMIT = 9; // Дозвіл на проживання
}
