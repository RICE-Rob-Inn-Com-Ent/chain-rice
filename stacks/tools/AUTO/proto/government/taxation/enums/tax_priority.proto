syntax = "proto3";

package government.taxation.enums;

// Пріоритети податків
enum TaxPriority {
  TAX_PRIORITY_UNSPECIFIED = 0;
  TAX_PRIORITY_LOW = 1;           // Низький пріоритет
  TAX_PRIORITY_MEDIUM = 2;        // Середній пріоритет
  TAX_PRIORITY_HIGH = 3;          // Високий пріоритет
  TAX_PRIORITY_URGENT = 4;        // Терміновий пріоритет
  TAX_PRIORITY_CRITICAL = 5;      // Критичний пріоритет
  TAX_PRIORITY_COLLECTION = 6;    // Пріоритет стягнення
}
