syntax = "proto3";

package government.taxation.enums;

// Типи податків
enum TaxType {
  TAX_TYPE_UNSPECIFIED = 0;
  TAX_TYPE_INCOME = 1;            // Податок на доходи
  TAX_TYPE_PROPERTY = 2;          // Податок на нерухомість
  TAX_TYPE_SALES = 3;             // Податок з продажу
  TAX_TYPE_CORPORATE = 4;         // Корпоративний податок
  TAX_TYPE_VAT = 5;               // ПДВ
  TAX_TYPE_EXCISE = 6;            // Акцизний податок
  TAX_TYPE_CUSTOMS = 7;           // Митний податок
  TAX_TYPE_INHERITANCE = 8;       // Податок на спадщину
  TAX_TYPE_GIFT = 9;              // Податок на дарунки
  TAX_TYPE_CAPITAL_GAINS = 10;    // Податок на прибуток від капіталу
  TAX_TYPE_SOCIAL_SECURITY = 11;  // Соціальне страхування
  TAX_TYPE_UNEMPLOYMENT = 12;     // Податок на безробіття
  TAX_TYPE_UTILITY = 13;          // Комунальний податок
  TAX_TYPE_LUXURY = 14;           // Податок на розкош
}
