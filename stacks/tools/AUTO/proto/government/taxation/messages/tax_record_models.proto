syntax = "proto3";

package government.taxation.messages;

import "google/protobuf/timestamp.proto";
import "../enums/tax_type.proto";
import "../enums/tax_status.proto";
import "../enums/tax_priority.proto";

// Податковий запис
message TaxRecord {
  string tax_record_id = 1;                 // Унікальний ідентифікатор запису
  string taxpayer_id = 2;                   // ID платника податків
  string taxpayer_name = 3;                 // Ім'я платника
  TaxType tax_type = 4;                     // Тип податку
  TaxStatus status = 5;                     // Статус
  TaxPriority priority = 6;                 // Пріоритет
  double amount = 7;                        // Сума
  double paid_amount = 8;                   // Сплачена сума
  double outstanding_amount = 9;            // Заборгованість
  string currency = 10;                     // Валюта
  google.protobuf.Timestamp due_date = 11;  // Термін сплати
  google.protobuf.Timestamp assessment_date = 12; // Дата нарахування
  google.protobuf.Timestamp created_at = 13; // Дата створення
  google.protobuf.Timestamp updated_at = 14; // Дата оновлення
  string assessment_period = 15;            // Період нарахування
  string description = 16;                  // Опис
  repeated string payment_ids = 17;         // ID платежів
  string notes = 18;                        // Примітки
  string assessed_by = 19;                  // Ким нараховано
  string tax_code = 20;                     // Податковий код
}

// Платник податків
message Taxpayer {
  string taxpayer_id = 1;
  string name = 2;
  string type = 3;                          // individual, company, organization
  string tax_id = 4;                        // Податковий номер
  string address = 5;
  string contact_person = 6;
  string email = 7;
  string phone = 8;
  string registration_number = 9;
  google.protobuf.Timestamp registration_date = 10;
  string status = 11;                       // active, inactive, suspended
  repeated string tax_types = 12;           // Типи податків
}

// Фільтр для пошуку податкових записів
message TaxRecordFilter {
  TaxType tax_type = 1;
  TaxStatus status = 2;
  TaxPriority priority = 3;
  string taxpayer_id = 4;
  google.protobuf.Timestamp due_date_from = 5;
  google.protobuf.Timestamp due_date_to = 6;
  google.protobuf.Timestamp assessment_date_from = 7;
  google.protobuf.Timestamp assessment_date_to = 8;
  double amount_min = 9;
  double amount_max = 10;
}

// Результат пошуку податкових записів
message TaxRecordSearchResult {
  repeated TaxRecord tax_records = 1;
  int32 total_count = 2;
  int32 page_number = 3;
  int32 page_size = 4;
  double total_amount = 5;
  double total_paid = 6;
  double total_outstanding = 7;
}

// Статистика податків
message TaxStatistics {
  int32 total_records = 1;
  double total_amount = 2;
  double total_paid = 3;
  double total_outstanding = 4;
  int32 overdue_count = 5;
  double overdue_amount = 6;
  repeated TaxTypeStatistics by_type = 7;
  repeated TaxStatusStatistics by_status = 8;
}

message TaxTypeStatistics {
  TaxType tax_type = 1;
  int32 count = 2;
  double amount = 3;
  double paid = 4;
  double outstanding = 5;
}

message TaxStatusStatistics {
  TaxStatus status = 1;
  int32 count = 2;
  double amount = 3;
  double percentage = 4;
}
