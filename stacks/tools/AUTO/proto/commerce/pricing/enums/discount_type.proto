syntax = "proto3";

package commerce.pricing.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/pricing/enums";

// Discount type enumeration
enum DiscountType {
  // Unknown or unspecified discount type
  DISCOUNT_TYPE_UNSPECIFIED = 0;
  
  // Percentage discount
  DISCOUNT_TYPE_PERCENTAGE = 1;
  
  // Fixed amount discount
  DISCOUNT_TYPE_FIXED_AMOUNT = 2;
  
  // Buy X get Y free
  DISCOUNT_TYPE_BUY_X_GET_Y = 3;
  
  // Quantity discount
  DISCOUNT_TYPE_QUANTITY = 4;
  
  // Volume discount
  DISCOUNT_TYPE_VOLUME = 5;
  
  // Seasonal discount
  DISCOUNT_TYPE_SEASONAL = 6;
  
  // Loyalty discount
  DISCOUNT_TYPE_LOYALTY = 7;
  
  // First-time buyer discount
  DISCOUNT_TYPE_FIRST_TIME_BUYER = 8;
  
  // Student discount
  DISCOUNT_TYPE_STUDENT = 9;
  
  // Senior discount
  DISCOUNT_TYPE_SENIOR = 10;
  
  // Military discount
  DISCOUNT_TYPE_MILITARY = 11;
  
  // Employee discount
  DISCOUNT_TYPE_EMPLOYEE = 12;
  
  // Partner discount
  DISCOUNT_TYPE_PARTNER = 13;
  
  // Referral discount
  DISCOUNT_TYPE_REFERRAL = 14;
  
  // Birthday discount
  DISCOUNT_TYPE_BIRTHDAY = 15;
  
  // Anniversary discount
  DISCOUNT_TYPE_ANNIVERSARY = 16;
  
  // Clearance discount
  DISCOUNT_TYPE_CLEARANCE = 17;
  
  // Flash sale discount
  DISCOUNT_TYPE_FLASH_SALE = 18;
  
  // Bundle discount
  DISCOUNT_TYPE_BUNDLE = 19;
  
  // Cross-sell discount
  DISCOUNT_TYPE_CROSS_SELL = 20;
  
  // Upsell discount
  DISCOUNT_TYPE_UPSELL = 21;
}
