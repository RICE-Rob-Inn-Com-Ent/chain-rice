syntax = "proto3";

package commerce.inventory.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/inventory/enums";

// Inventory status enumeration
enum InventoryStatus {
  // Unknown or unspecified status
  INVENTORY_STATUS_UNSPECIFIED = 0;
  
  // Item is available for sale
  INVENTORY_STATUS_AVAILABLE = 1;
  
  // Item is out of stock
  INVENTORY_STATUS_OUT_OF_STOCK = 2;
  
  // Item is reserved for pending orders
  INVENTORY_STATUS_RESERVED = 3;
  
  // Item is damaged and not sellable
  INVENTORY_STATUS_DAMAGED = 4;
  
  // Item is being returned
  INVENTORY_STATUS_RETURNING = 5;
  
  // Item is in transit between warehouses
  INVENTORY_STATUS_IN_TRANSIT = 6;
  
  // Item is being processed (receiving, quality check, etc.)
  INVENTORY_STATUS_PROCESSING = 7;
  
  // Item is discontinued
  INVENTORY_STATUS_DISCONTINUED = 8;
  
  // Item is on hold for investigation
  INVENTORY_STATUS_ON_HOLD = 9;
}
