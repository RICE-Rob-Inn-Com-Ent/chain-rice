syntax = "proto3";

package commerce.inventory.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/inventory/enums";

// Inventory type enumeration
enum InventoryType {
  // Unknown or unspecified type
  INVENTORY_TYPE_UNSPECIFIED = 0;
  
  // Physical product that can be shipped
  INVENTORY_TYPE_PHYSICAL = 1;
  
  // Digital product or service
  INVENTORY_TYPE_DIGITAL = 2;
  
  // Subscription-based service
  INVENTORY_TYPE_SUBSCRIPTION = 3;
  
  // Consumable item with expiration
  INVENTORY_TYPE_CONSUMABLE = 4;
  
  // Raw materials for manufacturing
  INVENTORY_TYPE_RAW_MATERIAL = 5;
  
  // Finished goods ready for sale
  INVENTORY_TYPE_FINISHED_GOOD = 6;
  
  // Work in progress items
  INVENTORY_TYPE_WORK_IN_PROGRESS = 7;
  
  // Returned items awaiting processing
  INVENTORY_TYPE_RETURNED = 8;
  
  // Sample or demo items
  INVENTORY_TYPE_SAMPLE = 9;
  
  // Rental equipment
  INVENTORY_TYPE_RENTAL = 10;
}
