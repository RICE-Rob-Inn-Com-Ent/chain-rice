syntax = "proto3";

package commerce.inventory.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/inventory/enums";

// Inventory priority enumeration
enum InventoryPriority {
  // Unknown or unspecified priority
  INVENTORY_PRIORITY_UNSPECIFIED = 0;
  
  // Low priority items
  INVENTORY_PRIORITY_LOW = 1;
  
  // Normal priority items
  INVENTORY_PRIORITY_NORMAL = 2;
  
  // High priority items
  INVENTORY_PRIORITY_HIGH = 3;
  
  // Critical priority items
  INVENTORY_PRIORITY_CRITICAL = 4;
  
  // Emergency priority items
  INVENTORY_PRIORITY_EMERGENCY = 5;
}
