syntax = "proto3";

package commerce.inventory.services;

import "google/protobuf/empty.proto";
import "../messages/stock_item.proto";
import "../messages/warehouse.proto";
import "../messages/stock_adjustment.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/inventory/services";

// Inventory service for managing stock items, warehouses, and adjustments
service InventoryService {
  // Stock Item Management
  rpc CreateStockItem(CreateStockItemRequest) returns (CreateStockItemResponse);
  rpc GetStockItem(GetStockItemRequest) returns (GetStockItemResponse);
  rpc UpdateStockItem(UpdateStockItemRequest) returns (UpdateStockItemResponse);
  rpc DeleteStockItem(DeleteStockItemRequest) returns (google.protobuf.Empty);
  rpc ListStockItems(ListStockItemsRequest) returns (ListStockItemsResponse);
  
  // Warehouse Management
  rpc CreateWarehouse(CreateWarehouseRequest) returns (CreateWarehouseResponse);
  rpc GetWarehouse(GetWarehouseRequest) returns (GetWarehouseResponse);
  rpc UpdateWarehouse(UpdateWarehouseRequest) returns (UpdateWarehouseResponse);
  rpc DeleteWarehouse(DeleteWarehouseRequest) returns (google.protobuf.Empty);
  rpc ListWarehouses(ListWarehousesRequest) returns (ListWarehousesResponse);
  
  // Stock Adjustment Management
  rpc CreateStockAdjustment(CreateStockAdjustmentRequest) returns (CreateStockAdjustmentResponse);
  rpc GetStockAdjustment(GetStockAdjustmentRequest) returns (GetStockAdjustmentResponse);
  rpc ListStockAdjustments(ListStockAdjustmentsRequest) returns (ListStockAdjustmentsResponse);
  
  // Inventory Operations
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
  rpc TransferStock(TransferStockRequest) returns (TransferStockResponse);
  rpc GetStockLevels(GetStockLevelsRequest) returns (GetStockLevelsResponse);
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
}

// Stock Item Request/Response Messages
message CreateStockItemRequest {
  commerce.inventory.messages.StockItem stock_item = 1;
}

message CreateStockItemResponse {
  commerce.inventory.messages.StockItem stock_item = 1;
  bool success = 2;
  string error_message = 3;
}

message GetStockItemRequest {
  string id = 1;
}

message GetStockItemResponse {
  commerce.inventory.messages.StockItem stock_item = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdateStockItemRequest {
  string id = 1;
  commerce.inventory.messages.StockItem stock_item = 2;
}

message UpdateStockItemResponse {
  commerce.inventory.messages.StockItem stock_item = 1;
  bool success = 2;
  string error_message = 3;
}

message DeleteStockItemRequest {
  string id = 1;
}

message ListStockItemsRequest {
  string warehouse_id = 1;
  string product_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListStockItemsResponse {
  repeated commerce.inventory.messages.StockItem stock_items = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Warehouse Request/Response Messages
message CreateWarehouseRequest {
  commerce.inventory.messages.Warehouse warehouse = 1;
}

message CreateWarehouseResponse {
  commerce.inventory.messages.Warehouse warehouse = 1;
  bool success = 2;
  string error_message = 3;
}

message GetWarehouseRequest {
  string id = 1;
}

message GetWarehouseResponse {
  commerce.inventory.messages.Warehouse warehouse = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdateWarehouseRequest {
  string id = 1;
  commerce.inventory.messages.Warehouse warehouse = 2;
}

message UpdateWarehouseResponse {
  commerce.inventory.messages.Warehouse warehouse = 1;
  bool success = 2;
  string error_message = 3;
}

message DeleteWarehouseRequest {
  string id = 1;
}

message ListWarehousesRequest {
  string status = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListWarehousesResponse {
  repeated commerce.inventory.messages.Warehouse warehouses = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Stock Adjustment Request/Response Messages
message CreateStockAdjustmentRequest {
  commerce.inventory.messages.CreateStockAdjustmentRequest adjustment = 1;
}

message CreateStockAdjustmentResponse {
  commerce.inventory.messages.StockAdjustment adjustment = 1;
  bool success = 2;
  string error_message = 3;
}

message GetStockAdjustmentRequest {
  string id = 1;
}

message GetStockAdjustmentResponse {
  commerce.inventory.messages.StockAdjustment adjustment = 1;
  bool success = 2;
  string error_message = 3;
}

message ListStockAdjustmentsRequest {
  string stock_item_id = 1;
  string warehouse_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListStockAdjustmentsResponse {
  repeated commerce.inventory.messages.StockAdjustment adjustments = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Inventory Operations Request/Response Messages
message ReserveStockRequest {
  string stock_item_id = 1;
  int32 quantity = 2;
  string order_id = 3;
  string customer_id = 4;
}

message ReserveStockResponse {
  bool success = 1;
  string error_message = 2;
  int32 reserved_quantity = 3;
}

message ReleaseStockRequest {
  string stock_item_id = 1;
  int32 quantity = 2;
  string order_id = 3;
}

message ReleaseStockResponse {
  bool success = 1;
  string error_message = 2;
  int32 released_quantity = 3;
}

message TransferStockRequest {
  string stock_item_id = 1;
  string from_warehouse_id = 2;
  string to_warehouse_id = 3;
  int32 quantity = 4;
  string reason = 5;
}

message TransferStockResponse {
  bool success = 1;
  string error_message = 2;
  string transfer_id = 3;
}

message GetStockLevelsRequest {
  string warehouse_id = 1;
  repeated string product_ids = 2;
}

message GetStockLevelsResponse {
  repeated StockLevel stock_levels = 1;
  bool success = 2;
  string error_message = 3;
}

message StockLevel {
  string product_id = 1;
  string warehouse_id = 2;
  int32 available_quantity = 3;
  int32 reserved_quantity = 4;
  int32 total_quantity = 5;
}

message CheckAvailabilityRequest {
  string product_id = 1;
  string warehouse_id = 2;
  int32 required_quantity = 3;
}

message CheckAvailabilityResponse {
  bool available = 1;
  int32 available_quantity = 2;
  string error_message = 3;
}
