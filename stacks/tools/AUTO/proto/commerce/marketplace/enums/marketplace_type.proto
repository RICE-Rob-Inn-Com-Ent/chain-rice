syntax = "proto3";

package commerce.marketplace.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/marketplace/enums";

// Marketplace type enumeration
enum MarketplaceType {
  // Unknown or unspecified marketplace type
  MARKETPLACE_TYPE_UNSPECIFIED = 0;
  
  // B2C (Business to Consumer) marketplace
  MARKETPLACE_TYPE_B2C = 1;
  
  // B2B (Business to Business) marketplace
  MARKETPLACE_TYPE_B2B = 2;
  
  // C2C (Consumer to Consumer) marketplace
  MARKETPLACE_TYPE_C2C = 3;
  
  // B2G (Business to Government) marketplace
  MARKETPLACE_TYPE_B2G = 4;
  
  // Auction-based marketplace
  MARKETPLACE_TYPE_AUCTION = 5;
  
  // Fixed-price marketplace
  MARKETPLACE_TYPE_FIXED_PRICE = 6;
  
  // Hybrid marketplace supporting multiple types
  MARKETPLACE_TYPE_HYBRID = 7;
  
  // Private marketplace for specific users
  MARKETPLACE_TYPE_PRIVATE = 8;
  
  // Public marketplace open to all
  MARKETPLACE_TYPE_PUBLIC = 9;
  
  // Specialized marketplace for specific industries
  MARKETPLACE_TYPE_SPECIALIZED = 10;
}
