syntax = "proto3";

package commerce.orders.messages;

import "google/protobuf/timestamp.proto";
import "../enums/payment_status.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/orders/messages";

// Payment message representing a payment for an order
message Payment {
  // Unique identifier for the payment
  string id = 1;
  
  // Order identifier
  string order_id = 2;
  
  // Payment method
  string payment_method = 3;
  
  // Payment status
  commerce.orders.enums.PaymentStatus status = 4;
  
  // Payment amount
  double amount = 5;
  
  // Currency code (ISO 4217)
  string currency = 6;
  
  // Payment gateway
  string payment_gateway = 7;
  
  // Gateway transaction ID
  string gateway_transaction_id = 8;
  
  // Gateway reference
  string gateway_reference = 9;
  
  // Payment processor
  string payment_processor = 10;
  
  // Processor transaction ID
  string processor_transaction_id = 11;
  
  // Payment details
  PaymentDetails payment_details = 12;
  
  // Billing information
  BillingInfo billing_info = 13;
  
  // Payment date
  google.protobuf.Timestamp payment_date = 14;
  
  // Authorization date
  google.protobuf.Timestamp authorized_at = 15;
  
  // Capture date
  google.protobuf.Timestamp captured_at = 16;
  
  // Refund date
  google.protobuf.Timestamp refunded_at = 17;
  
  // Date when payment was created
  google.protobuf.Timestamp created_at = 18;
  
  // Date when payment was last updated
  google.protobuf.Timestamp updated_at = 19;
  
  // Payment notes
  string notes = 20;
  
  // Failure reason
  string failure_reason = 21;
  
  // Additional metadata
  map<string, string> metadata = 22;
}

// Payment details based on payment method
message PaymentDetails {
  // Credit card details (if applicable)
  CreditCardDetails credit_card = 1;
  
  // Bank transfer details (if applicable)
  BankTransferDetails bank_transfer = 2;
  
  // Digital wallet details (if applicable)
  DigitalWalletDetails digital_wallet = 3;
  
  // Cryptocurrency details (if applicable)
  CryptocurrencyDetails cryptocurrency = 4;
  
  // Check details (if applicable)
  CheckDetails check = 5;
}

// Credit card payment details
message CreditCardDetails {
  // Card type (Visa, MasterCard, etc.)
  string card_type = 1;
  
  // Last 4 digits of card number
  string last_four_digits = 2;
  
  // Cardholder name
  string cardholder_name = 3;
  
  // Expiration month
  int32 expiration_month = 4;
  
  // Expiration year
  int32 expiration_year = 5;
  
  // Authorization code
  string authorization_code = 6;
  
  // CVV response code
  string cvv_response = 7;
  
  // AVS response code
  string avs_response = 8;
}

// Bank transfer payment details
message BankTransferDetails {
  // Bank name
  string bank_name = 1;
  
  // Account number (masked)
  string account_number = 2;
  
  // Routing number
  string routing_number = 3;
  
  // Account holder name
  string account_holder_name = 4;
  
  // Transfer reference
  string transfer_reference = 5;
  
  // Transfer date
  google.protobuf.Timestamp transfer_date = 6;
}

// Digital wallet payment details
message DigitalWalletDetails {
  // Wallet type (PayPal, Apple Pay, Google Pay, etc.)
  string wallet_type = 1;
  
  // Wallet account identifier
  string wallet_account = 2;
  
  // Wallet transaction ID
  string wallet_transaction_id = 3;
  
  // Payer email
  string payer_email = 4;
}

// Cryptocurrency payment details
message CryptocurrencyDetails {
  // Cryptocurrency type (Bitcoin, Ethereum, etc.)
  string currency_type = 1;
  
  // Wallet address
  string wallet_address = 2;
  
  // Transaction hash
  string transaction_hash = 3;
  
  // Block number
  int64 block_number = 4;
  
  // Confirmation count
  int32 confirmations = 5;
}

// Check payment details
message CheckDetails {
  // Check number
  string check_number = 1;
  
  // Bank name
  string bank_name = 2;
  
  // Account holder name
  string account_holder_name = 3;
  
  // Check date
  google.protobuf.Timestamp check_date = 4;
}

// Billing information for payment
message BillingInfo {
  // Billing address
  Address billing_address = 1;
  
  // Billing contact information
  ContactInfo billing_contact = 2;
}

// Address information
message Address {
  // First name
  string first_name = 1;
  
  // Last name
  string last_name = 2;
  
  // Company name
  string company = 3;
  
  // Street address line 1
  string street_address_1 = 4;
  
  // Street address line 2
  string street_address_2 = 5;
  
  // City
  string city = 6;
  
  // State or province
  string state_province = 7;
  
  // Postal or ZIP code
  string postal_code = 8;
  
  // Country
  string country = 9;
  
  // Phone number
  string phone = 10;
  
  // Email address
  string email = 11;
}

// Contact information
message ContactInfo {
  // Contact person name
  string contact_person = 1;
  
  // Phone number
  string phone = 2;
  
  // Email address
  string email = 3;
  
  // Fax number
  string fax = 4;
}
