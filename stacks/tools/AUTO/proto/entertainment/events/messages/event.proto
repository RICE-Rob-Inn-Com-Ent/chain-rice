syntax = "proto3";

package entertainment.events.messages;

import "entertainment/events/enums/event_type.proto";

// Подія
message Event {
  string id = 1;
  string title = 2;
  string description = 3;
  string short_description = 4;
  
  // Тип події
  entertainment.events.enums.EventType type = 5;
  
  // Місце проведення
  string venue_id = 6;
  string venue_name = 7;
  string address = 8;
  string city = 9;
  string state = 10;
  string country = 11;
  string postal_code = 12;
  
  // Дати та час
  int64 start_date = 13;
  int64 end_date = 14;
  int64 doors_open = 15;
  int64 doors_close = 16;
  string timezone = 17;
  
  // Організація
  string organizer_id = 18;
  string organizer_name = 19;
  string contact_email = 20;
  string contact_phone = 21;
  string website = 22;
  
  // Статус події
  EventStatus status = 23;
  EventVisibility visibility = 24;
  
  // Ціни та квитки
  repeated TicketTier ticket_tiers = 25;
  int32 total_capacity = 26;
  int32 available_tickets = 27;
  int32 sold_tickets = 28;
  
  // Метадані
  repeated string categories = 29;
  repeated string tags = 30;
  repeated string performers = 31;
  string age_restriction = 32;
  repeated string accessibility_features = 33;
  
  // Медіа
  repeated string image_urls = 34;
  repeated string video_urls = 35;
  string thumbnail_url = 36;
  string banner_url = 37;
  
  // Статистика
  int32 view_count = 38;
  int32 like_count = 39;
  int32 share_count = 40;
  int32 interest_count = 41;
  
  // Дати
  int64 created_at = 42;
  int64 updated_at = 43;
  int64 published_at = 44;
  
  // Додаткові поля
  map<string, string> custom_fields = 45;
  string external_id = 46;
}

// Статус події
enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  PUBLISHED = 2;
  CANCELLED = 3;
  POSTPONED = 4;
  RESCHEDULED = 5;
  COMPLETED = 6;
  ARCHIVED = 7;
  SOLD_OUT = 8;
  CANCELLED_BY_VENUE = 9;
  CANCELLED_BY_ORGANIZER = 10;
}

// Видимість події
enum EventVisibility {
  EVENT_VISIBILITY_UNSPECIFIED = 0;
  PUBLIC = 1;
  PRIVATE = 2;
  INVITATION_ONLY = 3;
  MEMBERS_ONLY = 4;
  UNLISTED = 5;
}

// Рівень квитка
message TicketTier {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string currency = 5;
  int32 quantity = 6;
  int32 sold = 7;
  int64 sale_start = 8;
  int64 sale_end = 9;
  bool is_vip = 10;
  repeated string benefits = 11;
  string seating_section = 12;
}
