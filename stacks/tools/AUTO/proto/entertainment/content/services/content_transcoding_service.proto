syntax = "proto3";

package entertainment.content.services;

import "entertainment/content/messages/content_asset.proto";

// Сервіс транскодування контенту
service ContentTranscodingService {
  // Основні операції транскодування
  rpc TranscodeContent(TranscodeContentRequest) returns (TranscodeContentResponse);
  rpc GetTranscodingJob(GetTranscodingJobRequest) returns (GetTranscodingJobResponse);
  rpc CancelTranscodingJob(CancelTranscodingJobRequest) returns (CancelTranscodingJobResponse);
  rpc ListTranscodingJobs(ListTranscodingJobsRequest) returns (ListTranscodingJobsResponse);
  
  // Управління профілями транскодування
  rpc CreateTranscodingProfile(CreateTranscodingProfileRequest) returns (CreateTranscodingProfileResponse);
  rpc GetTranscodingProfile(GetTranscodingProfileRequest) returns (GetTranscodingProfileResponse);
  rpc UpdateTranscodingProfile(UpdateTranscodingProfileRequest) returns (UpdateTranscodingProfileResponse);
  rpc DeleteTranscodingProfile(DeleteTranscodingProfileRequest) returns (DeleteTranscodingProfileResponse);
  rpc ListTranscodingProfiles(ListTranscodingProfilesRequest) returns (ListTranscodingProfilesResponse);
  
  // Управління чергою транскодування
  rpc GetTranscodingQueue(GetTranscodingQueueRequest) returns (GetTranscodingQueueResponse);
  rpc PrioritizeJob(PrioritizeJobRequest) returns (PrioritizeJobResponse);
  rpc RequeueJob(RequeueJobRequest) returns (RequeueJobResponse);
  
  // Моніторинг та аналітика
  rpc GetTranscodingStats(GetTranscodingStatsRequest) returns (GetTranscodingStatsResponse);
  rpc GetTranscodingMetrics(GetTranscodingMetricsRequest) returns (GetTranscodingMetricsResponse);
  
  // Оптимізація та адаптивне транскодування
  rpc OptimizeTranscoding(OptimizeTranscodingRequest) returns (OptimizeTranscodingResponse);
  rpc ConfigureAdaptiveTranscoding(ConfigureAdaptiveTranscodingRequest) returns (ConfigureAdaptiveTranscodingResponse);
  
  // Управління ресурсами
  rpc GetTranscodingResources(GetTranscodingResourcesRequest) returns (GetTranscodingResourcesResponse);
  rpc AllocateResources(AllocateResourcesRequest) returns (AllocateResourcesResponse);
  rpc ReleaseResources(ReleaseResourcesRequest) returns (ReleaseResourcesResponse);
}

// Запити та відповіді для транскодування
message TranscodeContentRequest {
  string source_asset_id = 1;
  string target_profile_id = 2;
  repeated TranscodingOption options = 3;
  string priority = 4;
  map<string, string> metadata = 5;
}

message TranscodeContentResponse {
  string job_id = 1;
  TranscodingJob job = 2;
  string message = 3;
}

message GetTranscodingJobRequest {
  string job_id = 1;
}

message GetTranscodingJobResponse {
  TranscodingJob job = 1;
}

message CancelTranscodingJobRequest {
  string job_id = 1;
  string reason = 2;
}

message CancelTranscodingJobResponse {
  bool cancelled = 1;
  string message = 2;
}

message ListTranscodingJobsRequest {
  int32 page = 1;
  int32 page_size = 2;
  repeated string filters = 3;
  string sort_by = 4;
  string sort_order = 5;
}

message ListTranscodingJobsResponse {
  repeated TranscodingJob jobs = 1;
  int32 total_count = 2;
}

// Запити для профілів транскодування
message CreateTranscodingProfileRequest {
  TranscodingProfile profile = 1;
  string creator_id = 2;
}

message CreateTranscodingProfileResponse {
  TranscodingProfile profile = 1;
  string message = 2;
}

message GetTranscodingProfileRequest {
  string profile_id = 1;
}

message GetTranscodingProfileResponse {
  TranscodingProfile profile = 1;
}

message UpdateTranscodingProfileRequest {
  string profile_id = 1;
  TranscodingProfile profile = 2;
  string updater_id = 3;
}

message UpdateTranscodingProfileResponse {
  TranscodingProfile profile = 1;
  string message = 2;
}

message DeleteTranscodingProfileRequest {
  string profile_id = 1;
  string deleter_id = 2;
}

message DeleteTranscodingProfileResponse {
  string message = 1;
}

message ListTranscodingProfilesRequest {
  int32 page = 1;
  int32 page_size = 2;
  repeated string filters = 3;
}

message ListTranscodingProfilesResponse {
  repeated TranscodingProfile profiles = 1;
  int32 total_count = 2;
}

// Запити для черги транскодування
message GetTranscodingQueueRequest {
  int32 page = 1;
  int32 page_size = 2;
  repeated string filters = 3;
}

message GetTranscodingQueueResponse {
  repeated TranscodingJob jobs = 1;
  int32 total_count = 2;
}

message PrioritizeJobRequest {
  string job_id = 1;
  int32 priority = 2;
  string reason = 3;
}

message PrioritizeJobResponse {
  bool prioritized = 1;
  string message = 2;
}

message RequeueJobRequest {
  string job_id = 1;
  string reason = 2;
}

message RequeueJobResponse {
  bool requeued = 1;
  string message = 2;
}

// Запити для статистики та метрик
message GetTranscodingStatsRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetTranscodingStatsResponse {
  TranscodingStats stats = 1;
}

message GetTranscodingMetricsRequest {
  string job_id = 1;
  string metric_type = 2;
}

message GetTranscodingMetricsResponse {
  TranscodingMetrics metrics = 1;
}

// Запити для оптимізації
message OptimizeTranscodingRequest {
  string content_id = 1;
  repeated OptimizationGoal goals = 2;
  string optimizer_id = 3;
}

message OptimizeTranscodingResponse {
  OptimizationResult result = 1;
  string message = 2;
}

message ConfigureAdaptiveTranscodingRequest {
  string content_id = 1;
  AdaptiveTranscodingConfig config = 2;
  string configurator_id = 3;
}

message ConfigureAdaptiveTranscodingResponse {
  bool configured = 1;
  string message = 2;
}

// Запити для ресурсів
message GetTranscodingResourcesRequest {
  string resource_type = 1;
}

message GetTranscodingResourcesResponse {
  TranscodingResources resources = 1;
}

message AllocateResourcesRequest {
  string job_id = 1;
  ResourceRequirements requirements = 2;
}

message AllocateResourcesResponse {
  bool allocated = 1;
  string message = 2;
}

message ReleaseResourcesRequest {
  string job_id = 1;
  string reason = 2;
}

message ReleaseResourcesResponse {
  bool released = 1;
  string message = 2;
}

// Допоміжні повідомлення
message TranscodingJob {
  string id = 1;
  string source_asset_id = 2;
  string target_profile_id = 3;
  TranscodingStatus status = 4;
  int32 progress = 5;
  string error_message = 6;
  int32 priority = 7;
  int64 created_at = 8;
  int64 started_at = 9;
  int64 completed_at = 10;
  int64 estimated_completion = 11;
  map<string, string> metadata = 12;
}

message TranscodingProfile {
  string id = 1;
  string name = 2;
  string description = 3;
  string content_type = 4;
  VideoSettings video_settings = 5;
  AudioSettings audio_settings = 6;
  SubtitleSettings subtitle_settings = 7;
  repeated string output_formats = 8;
  bool is_active = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message VideoSettings {
  string codec = 1;
  int32 width = 2;
  int32 height = 3;
  int32 bitrate = 4;
  string frame_rate = 5;
  string aspect_ratio = 6;
  string color_space = 7;
  bool hdr_enabled = 8;
}

message AudioSettings {
  string codec = 1;
  int32 bitrate = 2;
  int32 sample_rate = 3;
  int32 channels = 4;
  string format = 5;
}

message SubtitleSettings {
  bool burn_in = 1;
  repeated string formats = 2;
  repeated string languages = 3;
}

message TranscodingOption {
  string key = 1;
  string value = 2;
}

message TranscodingStats {
  int32 total_jobs = 1;
  int32 completed_jobs = 2;
  int32 failed_jobs = 3;
  int32 pending_jobs = 4;
  double average_processing_time = 5;
  double success_rate = 6;
  map<string, int32> jobs_by_status = 7;
}

message TranscodingMetrics {
  string job_id = 1;
  double processing_speed = 2;
  double cpu_usage = 3;
  double memory_usage = 4;
  double disk_usage = 5;
  int64 bytes_processed = 6;
  int64 bytes_output = 7;
}

message OptimizationGoal {
  string goal_type = 1;
  string target_value = 2;
  int32 priority = 3;
}

message OptimizationResult {
  string content_id = 1;
  repeated OptimizationSuggestion suggestions = 2;
  double estimated_improvement = 3;
}

message OptimizationSuggestion {
  string suggestion_type = 1;
  string description = 2;
  double potential_savings = 3;
  int32 priority = 4;
}

message AdaptiveTranscodingConfig {
  bool enabled = 1;
  repeated AdaptiveRule rules = 2;
  string fallback_profile = 3;
}

message AdaptiveRule {
  string condition = 1;
  string action = 2;
  string profile_id = 3;
}

message TranscodingResources {
  int32 available_cpus = 1;
  int64 available_memory = 2;
  int64 available_disk_space = 3;
  int32 active_jobs = 4;
  int32 queued_jobs = 5;
}

message ResourceRequirements {
  int32 cpu_cores = 1;
  int64 memory_mb = 2;
  int64 disk_space_mb = 3;
  int32 gpu_cores = 4;
}

// Енуми
enum TranscodingStatus {
  TRANSCODING_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  QUEUED = 2;
  PROCESSING = 3;
  COMPLETED = 4;
  FAILED = 5;
  CANCELLED = 6;
  PAUSED = 7;
}
