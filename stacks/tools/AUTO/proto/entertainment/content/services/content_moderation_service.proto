syntax = "proto3";

package entertainment.content.services;

import "entertainment/content/messages/content_item.proto";

// Сервіс модерації контенту
service ContentModerationService {
  // Основні операції модерації
  rpc ModerateContent(ModerateContentRequest) returns (ModerateContentResponse);
  rpc ReviewContent(ReviewContentRequest) returns (ReviewContentResponse);
  rpc ApproveContent(ApproveContentRequest) returns (ApproveContentResponse);
  rpc RejectContent(RejectContentRequest) returns (RejectContentResponse);
  rpc FlagContent(FlagContentRequest) returns (FlagContentResponse);
  
  // Управління чергою модерації
  rpc GetModerationQueue(GetModerationQueueRequest) returns (GetModerationQueueRequest);
  rpc AssignModerator(AssignModeratorRequest) returns (AssignModeratorResponse);
  rpc UpdateModerationStatus(UpdateModerationStatusRequest) returns (UpdateModerationStatusResponse);
  
  // Автоматична модерація
  rpc AutoModerateContent(AutoModerateContentRequest) returns (AutoModerateContentResponse);
  rpc ConfigureAutoModeration(ConfigureAutoModerationRequest) returns (ConfigureAutoModerationResponse);
  
  // Звіти та аналітика
  rpc GetModerationReport(GetModerationReportRequest) returns (GetModerationReportResponse);
  rpc GetModerationStats(GetModerationStatsRequest) returns (GetModerationStatsResponse);
  
  // Управління правилами
  rpc CreateModerationRule(CreateModerationRuleRequest) returns (CreateModerationRuleResponse);
  rpc UpdateModerationRule(UpdateModerationRuleRequest) returns (UpdateModerationRuleResponse);
  rpc DeleteModerationRule(DeleteModerationRuleRequest) returns (DeleteModerationRuleResponse);
  rpc ListModerationRules(ListModerationRulesRequest) returns (ListModerationRulesResponse);
  
  // Апеляції
  rpc SubmitAppeal(SubmitAppealRequest) returns (SubmitAppealResponse);
  rpc ReviewAppeal(ReviewAppealRequest) returns (ReviewAppealResponse);
  rpc ResolveAppeal(ResolveAppealRequest) returns (ResolveAppealResponse);
}

// Запити та відповіді для модерації
message ModerateContentRequest {
  string content_id = 1;
  string moderator_id = 2;
  ModerationAction action = 3;
  string reason = 4;
  repeated string violations = 5;
  map<string, string> metadata = 6;
}

message ModerateContentResponse {
  ModerationResult result = 1;
  string message = 2;
}

message ReviewContentRequest {
  string content_id = 1;
  string reviewer_id = 2;
  ReviewAction action = 3;
  string comments = 4;
  repeated string recommendations = 5;
}

message ReviewContentResponse {
  ReviewResult result = 1;
  string message = 2;
}

message ApproveContentRequest {
  string content_id = 1;
  string approver_id = 2;
  string comments = 3;
}

message ApproveContentResponse {
  bool approved = 1;
  string message = 2;
}

message RejectContentRequest {
  string content_id = 1;
  string rejector_id = 2;
  string reason = 3;
  repeated string violations = 4;
}

message RejectContentResponse {
  bool rejected = 1;
  string message = 2;
}

message FlagContentRequest {
  string content_id = 1;
  string user_id = 2;
  string reason = 3;
  string description = 4;
  repeated string categories = 5;
}

message FlagContentResponse {
  string flag_id = 1;
  string message = 2;
}

// Запити для черги модерації
message GetModerationQueueRequest {
  string moderator_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  repeated string filters = 4;
}

message GetModerationQueueResponse {
  repeated ModerationQueueItem items = 1;
  int32 total_count = 2;
}

message AssignModeratorRequest {
  string content_id = 1;
  string moderator_id = 2;
  string assigned_by = 3;
}

message AssignModeratorResponse {
  bool assigned = 1;
  string message = 2;
}

message UpdateModerationStatusRequest {
  string content_id = 1;
  ModerationStatus status = 2;
  string updated_by = 3;
}

message UpdateModerationStatusResponse {
  bool updated = 1;
  string message = 2;
}

// Запити для автоматичної модерації
message AutoModerateContentRequest {
  string content_id = 1;
  repeated string rules = 2;
}

message AutoModerateContentResponse {
  AutoModerationResult result = 1;
  repeated string violations = 2;
  double confidence_score = 3;
}

message ConfigureAutoModerationRequest {
  string content_type = 1;
  repeated ModerationRule rules = 2;
  string configurator_id = 3;
}

message ConfigureAutoModerationResponse {
  bool configured = 1;
  string message = 2;
}

// Запити для звітів
message GetModerationReportRequest {
  string content_id = 1;
  string report_type = 2;
}

message GetModerationReportResponse {
  ModerationReport report = 1;
}

message GetModerationStatsRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetModerationStatsResponse {
  ModerationStats stats = 1;
}

// Запити для правил
message CreateModerationRuleRequest {
  ModerationRule rule = 1;
  string creator_id = 2;
}

message CreateModerationRuleResponse {
  ModerationRule rule = 1;
  string message = 2;
}

message UpdateModerationRuleRequest {
  string rule_id = 1;
  ModerationRule rule = 2;
  string updater_id = 3;
}

message UpdateModerationRuleResponse {
  ModerationRule rule = 1;
  string message = 2;
}

message DeleteModerationRuleRequest {
  string rule_id = 1;
  string deleter_id = 2;
}

message DeleteModerationRuleResponse {
  string message = 1;
}

message ListModerationRulesRequest {
  int32 page = 1;
  int32 page_size = 2;
  repeated string filters = 3;
}

message ListModerationRulesResponse {
  repeated ModerationRule rules = 1;
  int32 total_count = 2;
}

// Запити для апеляцій
message SubmitAppealRequest {
  string content_id = 1;
  string user_id = 2;
  string reason = 3;
  string description = 4;
  repeated string supporting_evidence = 5;
}

message SubmitAppealResponse {
  string appeal_id = 1;
  string message = 2;
}

message ReviewAppealRequest {
  string appeal_id = 1;
  string reviewer_id = 2;
  AppealAction action = 3;
  string comments = 4;
}

message ReviewAppealResponse {
  AppealResult result = 1;
  string message = 2;
}

message ResolveAppealRequest {
  string appeal_id = 1;
  string resolver_id = 2;
  AppealResolution resolution = 3;
  string final_comments = 4;
}

message ResolveAppealResponse {
  bool resolved = 1;
  string message = 2;
}

// Допоміжні повідомлення
message ModerationQueueItem {
  string content_id = 1;
  entertainment.content.messages.ContentItem content = 2;
  ModerationStatus status = 3;
  string assigned_moderator = 4;
  int64 created_at = 5;
  int64 assigned_at = 6;
  int64 deadline = 7;
  int32 priority = 8;
}

message ModerationResult {
  string content_id = 1;
  ModerationStatus status = 2;
  repeated string violations = 3;
  string moderator_id = 4;
  int64 moderated_at = 5;
  string comments = 6;
}

message ReviewResult {
  string content_id = 1;
  ReviewStatus status = 2;
  string reviewer_id = 3;
  int64 reviewed_at = 4;
  string comments = 5;
}

message AutoModerationResult {
  string content_id = 1;
  bool passed = 2;
  repeated string violations = 3;
  double confidence_score = 4;
  string algorithm_version = 5;
}

message ModerationReport {
  string content_id = 1;
  repeated ModerationAction actions = 2;
  repeated string violations = 3;
  string status = 4;
  int64 created_at = 5;
  int64 last_updated = 6;
}

message ModerationStats {
  int32 total_content = 1;
  int32 pending_moderation = 2;
  int32 approved_content = 3;
  int32 rejected_content = 4;
  int32 flagged_content = 5;
  double average_moderation_time = 6;
  map<string, int32> violations_by_type = 7;
}

message ModerationRule {
  string id = 1;
  string name = 2;
  string description = 3;
  string content_type = 4;
  repeated string conditions = 5;
  ModerationAction action = 6;
  bool is_active = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// Енуми
enum ModerationAction {
  MODERATION_ACTION_UNSPECIFIED = 0;
  APPROVE = 1;
  REJECT = 2;
  FLAG = 3;
  REMOVE = 4;
  RESTRICT = 5;
  WARN = 6;
  SUSPEND = 7;
}

enum ReviewAction {
  REVIEW_ACTION_UNSPECIFIED = 0;
  APPROVE = 1;
  REJECT = 2;
  REQUEST_CHANGES = 3;
  ESCALATE = 4;
}

enum ModerationStatus {
  MODERATION_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  IN_REVIEW = 2;
  APPROVED = 3;
  REJECTED = 4;
  FLAGGED = 5;
  ESCALATED = 6;
}

enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  IN_PROGRESS = 2;
  COMPLETED = 3;
  ESCALATED = 4;
}

enum AppealAction {
  APPEAL_ACTION_UNSPECIFIED = 0;
  APPROVE = 1;
  REJECT = 2;
  ESCALATE = 3;
  REQUEST_MORE_INFO = 4;
}

enum AppealResolution {
  APPEAL_RESOLUTION_UNSPECIFIED = 0;
  UPHELD = 1;
  OVERTURNED = 2;
  PARTIAL_OVERTURN = 3;
  ESCALATED = 4;
}

message AppealResult {
  string appeal_id = 1;
  AppealResolution resolution = 2;
  string reviewer_id = 3;
  int64 reviewed_at = 4;
  string comments = 5;
}
