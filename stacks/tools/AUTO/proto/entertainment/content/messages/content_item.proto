syntax = "proto3";

package entertainment.content.messages;

import "entertainment/content/enums/content_type.proto";
import "entertainment/content/enums/content_status.proto";
import "entertainment/content/enums/genre.proto";
import "entertainment/content/enums/license_type.proto";
import "entertainment/content/enums/visibility.proto";
import "entertainment/content/enums/accessibility_feature.proto";

// Основний елемент контенту
message ContentItem {
  string id = 1;
  string title = 2;
  string description = 3;
  string short_description = 4;
  
  // Тип та статус
  entertainment.content.enums.ContentType type = 5;
  entertainment.content.enums.ContentStatus status = 6;
  entertainment.content.enums.Visibility visibility = 7;
  
  // Жанри та категорії
  repeated entertainment.content.enums.Genre genres = 8;
  repeated string categories = 9;
  repeated string tags = 10;
  
  // Метадані
  string language = 11;
  repeated string available_languages = 12;
  string country_of_origin = 13;
  int32 release_year = 14;
  int32 duration_seconds = 15;
  
  // Рейтинги та обмеження
  string age_rating = 16;
  repeated string content_warnings = 17;
  double user_rating = 18;
  int32 rating_count = 19;
  
  // Ліцензування
  entertainment.content.enums.LicenseType license_type = 20;
  string license_holder = 21;
  int64 license_start_date = 22;
  int64 license_end_date = 23;
  
  // Доступність
  repeated entertainment.content.enums.AccessibilityFeature accessibility_features = 24;
  bool is_free = 25;
  bool requires_subscription = 26;
  
  // Медіа файли
  repeated string thumbnail_urls = 27;
  repeated string poster_urls = 28;
  repeated string trailer_urls = 29;
  
  // Статистика
  int64 view_count = 30;
  int64 like_count = 31;
  int64 share_count = 32;
  int64 comment_count = 33;
  
  // Дати
  int64 created_at = 34;
  int64 updated_at = 35;
  int64 published_at = 36;
  
  // Додаткові поля
  map<string, string> custom_fields = 37;
  string external_id = 38;
  string source_platform = 39;
}
