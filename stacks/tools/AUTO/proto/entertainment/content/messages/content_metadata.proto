syntax = "proto3";

package entertainment.content.messages;

// Розширені метадані контенту
message ContentMetadata {
  string content_id = 1;
  
  // Технічні метадані
  TechnicalMetadata technical = 2;
  
  // Творчі метадані
  CreativeMetadata creative = 3;
  
  // Комерційні метадані
  CommercialMetadata commercial = 4;
  
  // Правові метадані
  LegalMetadata legal = 5;
  
  // Аналітичні метадані
  AnalyticsMetadata analytics = 6;
  
  // Додаткові метадані
  map<string, string> custom_metadata = 7;
}

// Технічні метадані
message TechnicalMetadata {
  string encoding_format = 1;
  string codec = 2;
  int32 bitrate = 3;
  int32 sample_rate = 4;
  int32 channels = 5;
  string resolution = 6;
  string aspect_ratio = 7;
  string color_space = 8;
  string frame_rate = 9;
  bool hdr_enabled = 10;
  bool dolby_vision = 11;
  bool dolby_atmos = 12;
  string audio_format = 13;
  string subtitle_format = 14;
}

// Творчі метадані
message CreativeMetadata {
  repeated string directors = 1;
  repeated string producers = 2;
  repeated string writers = 3;
  repeated string actors = 4;
  repeated string composers = 5;
  repeated string cinematographers = 6;
  repeated string editors = 7;
  string studio = 8;
  string production_company = 9;
  string distributor = 10;
  string original_title = 11;
  string original_language = 12;
  repeated string awards = 13;
  repeated string nominations = 14;
}

// Комерційні метадані
message CommercialMetadata {
  string pricing_model = 1;
  double price = 2;
  string currency = 3;
  bool is_premium = 4;
  bool is_free = 5;
  repeated string subscription_tiers = 6;
  string revenue_share = 7;
  repeated string monetization_methods = 8;
  string target_audience = 9;
  repeated string marketing_tags = 10;
}

// Правові метадані
message LegalMetadata {
  string copyright_holder = 1;
  int32 copyright_year = 2;
  string license_type = 3;
  string license_holder = 4;
  int64 license_start_date = 5;
  int64 license_end_date = 6;
  repeated string territories = 7;
  repeated string restrictions = 8;
  string dmca_contact = 9;
  string privacy_policy_url = 10;
  string terms_of_service_url = 11;
}

// Аналітичні метадані
message AnalyticsMetadata {
  string content_category = 1;
  string content_subcategory = 2;
  repeated string keywords = 3;
  string seo_title = 4;
  string seo_description = 5;
  repeated string topics = 6;
  string sentiment = 7;
  repeated string entities = 8;
  string content_language = 9;
  string content_region = 10;
}
