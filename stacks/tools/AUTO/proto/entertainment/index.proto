syntax = "proto3";

package entertainment;

// Entertainment module index - comprehensive Protobuf definitions for entertainment operations
// This module provides complete gRPC services for entertainment management including
// content, catalog, discovery, events, streaming, ratings, subscriptions, monetization,
// personalization, analytics, rights, moderation, localization, notifications, and security.

option go_package = "github.com/rice-dev/entertainment";

// ===== SHARED TYPES =====

// Money representation with currency and amount
message Money {
  string currency_code = 1;
  int64 amount_cents = 2;
  string display_value = 3;
  string formatted_value = 4;
}

// Pagination support for large datasets
message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
  string next_cursor = 7;
  string previous_cursor = 8;
}

// Metadata for tracking and versioning
message Metadata {
  map<string, string> fields = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  string created_by = 4;
  string updated_by = 5;
  string version = 6;
  map<string, string> custom_fields = 7;
}

// Error representation with context
message Error {
  string code = 1;
  string message = 2;
  string details = 3;
  string field = 4;
  repeated string suggestions = 5;
  map<string, string> context = 6;
}

// Timestamp with timezone support
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
  string timezone = 3;
  string formatted = 4;
}

// UUID helper for unique identifiers
message UUID {
  string value = 1;
  string version = 2;
  bool is_valid = 3;
  string format = 4;
}

