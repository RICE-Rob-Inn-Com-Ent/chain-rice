// ===== MAIN ENTERTAINMENT MODULE SERVICES =====

service EntertainmentService {
  // Content Services
  rpc GetContent(content.services.ContentManagementService) returns (content.services.ContentManagementService);
  rpc GetMedia(content.services.ContentManagementService) returns (content.services.ContentManagementService);
  rpc GetImages(content.services.ContentManagementService) returns (content.services.ContentManagementService);
  rpc GetContentAnalytics(content.services.ContentManagementService) returns (content.services.ContentManagementService);
  
  // Catalog Services
  rpc GetCatalog(catalog.services.CatalogService) returns (catalog.services.CatalogService);
  rpc SearchCatalog(catalog.services.CatalogService) returns (catalog.services.CatalogService);
  rpc BrowseCatalog(catalog.services.CatalogService) returns (catalog.services.CatalogService);
  
  // Discovery Services
  rpc SearchContent(discovery.services.DiscoveryService) returns (discovery.services.DiscoveryService);
  rpc GetRecommendations(discovery.services.DiscoveryService) returns (discovery.services.DiscoveryService);
  rpc GetTrending(discovery.services.DiscoveryService) returns (discovery.services.DiscoveryService);
  
  // Events Services
  rpc GetEvents(events.services.EventService) returns (events.services.EventService);
  rpc GetSessions(events.services.EventService) returns (events.services.EventService);
  rpc ProcessEvents(events.services.EventService) returns (events.services.EventService);
  rpc GetEventAnalytics(events.services.EventService) returns (events.services.EventService);
  rpc MonitorEvents(events.services.EventService) returns (events.services.EventService);
  
  // Streaming Services
  rpc GetStreams(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  rpc GetViewingSessions(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  rpc GetStreamingEvents(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  rpc GetStreamingMetrics(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  rpc GetAdaptiveStreaming(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  rpc GetDRM(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  rpc GetStreamingAnalytics(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  rpc MonitorStreaming(streaming.services.StreamingService) returns (streaming.services.StreamingService);
  
  // Ratings Services
  rpc GetRatings(ratings.services.RatingsService) returns (ratings.services.RatingsService);
  rpc GetRatingStats(ratings.services.RatingsService) returns (ratings.services.RatingsService);
  rpc ModerateRatings(ratings.services.RatingsService) returns (ratings.services.RatingsService);
  rpc ReportRatings(ratings.services.RatingsService) returns (ratings.services.RatingsService);
  rpc VoteHelpfulness(ratings.services.RatingsService) returns (ratings.services.RatingsService);
  rpc GetRecommendations(ratings.services.RatingsService) returns (ratings.services.RatingsService);
  
  // Subscriptions Services
  rpc GetSubscriptions(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  rpc RenewSubscriptions(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  rpc UpgradeSubscriptions(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  rpc ProcessPayments(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  rpc ManageDiscounts(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  rpc SendNotifications(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  rpc GetSubscriptionAnalytics(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  rpc MonitorSubscriptions(subscriptions.services.SubscriptionService) returns (subscriptions.services.SubscriptionService);
  
  // Monetization Services
  rpc GetProducts(monetization.services.CommerceService) returns (monetization.services.CommerceService);
  rpc GetPricing(monetization.services.CommerceService) returns (monetization.services.CommerceService);
  rpc ProcessTransactions(monetization.services.CommerceService) returns (monetization.services.CommerceService);
  rpc GetAds(monetization.services.AdsService) returns (monetization.services.AdsService);
  rpc GetAdSlots(monetization.services.AdsService) returns (monetization.services.AdsService);
  
  // Personalization Services
  rpc GetUserProfile(personalization.services.PersonalizationService) returns (personalization.services.PersonalizationService);
  rpc GetWatchlist(personalization.services.PersonalizationService) returns (personalization.services.PersonalizationService);
  rpc GetPersonalizedContent(personalization.services.PersonalizationService) returns (personalization.services.PersonalizationService);
  
  // Analytics Services
  rpc GetAnalytics(analytics.services.AnalyticsService) returns (analytics.services.AnalyticsService);
  rpc GetMetrics(analytics.services.AnalyticsService) returns (analytics.services.AnalyticsService);
  rpc GetReports(analytics.services.AnalyticsService) returns (analytics.services.AnalyticsService);
  
  // Rights Services
  rpc GetRights(rights.services.RightsManagementService) returns (rights.services.RightsManagementService);
  rpc ManageRights(rights.services.RightsManagementService) returns (rights.services.RightsManagementService);
  
  // Moderation Services
  rpc ModerateContent(moderation.services.ModerationService) returns (moderation.services.ModerationService);
  rpc GetModerationQueue(moderation.services.ModerationService) returns (moderation.services.ModerationService);
  
  // Localization Services
  rpc GetLocalizations(localization.services.LocalizationService) returns (localization.services.LocalizationService);
  rpc TranslateContent(localization.services.LocalizationService) returns (localization.services.LocalizationService);
  
  // Notifications Services
  rpc SendNotification(notifications.services.NotificationService) returns (notifications.services.NotificationService);
  rpc GetNotifications(notifications.services.NotificationService) returns (notifications.services.NotificationService);
  
  // Security Services
  rpc AuthenticateUser(security.services.SecurityService) returns (security.services.SecurityService);
  rpc AuthorizeAccess(security.services.SecurityService) returns (security.services.SecurityService);
}

// Additional utility services
service EntertainmentUtilityService {
  // Global search across the entire module
  rpc GlobalSearch(string) returns (string);
  
  // Get module statistics
  rpc GetModuleStats(string) returns (string);
  
  // Get module configuration
  rpc GetModuleConfig(string) returns (string);
  
  // Update module configuration
  rpc UpdateModuleConfig(string) returns (string);
  
  // Get module health status
  rpc GetModuleHealth(string) returns (string);
  
  // Get module metrics
  rpc GetModuleMetrics(string) returns (string);
  
  // Get module logs
  rpc GetModuleLogs(string) returns (string);
  
  // Clear module cache
  rpc ClearModuleCache(string) returns (string);
  
  // Restart module
  rpc RestartModule(string) returns (string);
}