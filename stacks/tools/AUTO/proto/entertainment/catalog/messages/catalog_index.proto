syntax = "proto3";

package entertainment.catalog.messages;

import "entertainment/catalog/enums/sort_order.proto";
import "entertainment/catalog/enums/filter_type.proto";

// Індекс каталогу для швидкого пошуку та навігації
message CatalogIndex {
  string id = 1;
  string name = 2;
  string description = 3;
  
  // Структура індексу
  IndexStructure structure = 4;
  
  // Налаштування сортування
  repeated entertainment.catalog.enums.SortOrder default_sort_orders = 5;
  repeated entertainment.catalog.enums.SortOrder available_sort_orders = 6;
  
  // Налаштування фільтрації
  repeated entertainment.catalog.enums.FilterType available_filters = 7;
  repeated FilterGroup filter_groups = 8;
  
  // Налаштування пагінації
  PaginationSettings pagination = 9;
  
  // Налаштування кешування
  CacheSettings cache = 10;
  
  // Статистика індексу
  IndexStats stats = 11;
  
  // Метадані
  map<string, string> metadata = 12;
  
  // Дати
  int64 created_at = 13;
  int64 updated_at = 14;
  int64 last_rebuilt = 15;
}

// Структура індексу
message IndexStructure {
  string type = 1;
  repeated IndexField fields = 2;
  repeated IndexRelation relations = 3;
  repeated IndexHierarchy hierarchies = 4;
  repeated IndexFacet facets = 5;
}

// Поле індексу
message IndexField {
  string name = 1;
  string type = 2;
  bool searchable = 3;
  bool filterable = 4;
  bool sortable = 5;
  bool facetable = 6;
  repeated string analyzers = 7;
  map<string, string> properties = 8;
}

// Відношення індексу
message IndexRelation {
  string name = 1;
  string source_field = 2;
  string target_field = 3;
  string relation_type = 4;
  bool bidirectional = 5;
  map<string, string> properties = 6;
}

// Ієрархія індексу
message IndexHierarchy {
  string name = 1;
  repeated string levels = 2;
  string separator = 3;
  bool allow_multiple_paths = 4;
  map<string, string> properties = 5;
}

// Фасет індексу
message IndexFacet {
  string name = 1;
  string field = 2;
  string facet_type = 3;
  int32 max_values = 4;
  bool sort_by_count = 5;
  map<string, string> properties = 6;
}

// Група фільтрів
message FilterGroup {
  string name = 1;
  string display_name = 2;
  repeated FilterOption options = 3;
  bool multiple_selection = 4;
  bool required = 5;
  string default_value = 6;
}

// Опція фільтра
message FilterOption {
  string value = 1;
  string display_name = 2;
  string description = 3;
  int32 count = 4;
  bool selected = 5;
  map<string, string> metadata = 6;
}

// Налаштування пагінації
message PaginationSettings {
  int32 default_page_size = 1;
  repeated int32 available_page_sizes = 2;
  int32 max_page_size = 3;
  bool allow_cursor_pagination = 4;
  bool allow_offset_pagination = 5;
  string default_pagination_type = 6;
}

// Налаштування кешування
message CacheSettings {
  bool enabled = 1;
  int32 ttl_seconds = 2;
  repeated string cache_keys = 3;
  repeated string cache_tags = 4;
  bool auto_refresh = 5;
  string refresh_strategy = 6;
}

// Статистика індексу
message IndexStats {
  int32 total_items = 1;
  int32 indexed_items = 2;
  int32 pending_items = 3;
  int32 failed_items = 4;
  int64 last_index_time = 5;
  int64 average_index_time = 6;
  map<string, int32> items_by_type = 7;
  map<string, int32> items_by_status = 8;
  map<string, int32> items_by_category = 9;
}
