syntax = "proto3";

package entertainment.catalog.messages;

// Тег для каталогу
message Tag {
  string id = 1;
  string name = 2;
  string description = 3;
  string display_name = 4;
  
  // Тип тегу
  TagType type = 5;
  
  // Категорія тегу
  string category = 6;
  
  // Метадані тегу
  TagMetadata metadata = 7;
  
  // Статистика використання
  TagStats stats = 8;
  
  // Налаштування тегу
  TagSettings settings = 9;
  
  // Дати
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 last_used = 12;
  
  // Додаткові поля
  map<string, string> custom_fields = 13;
  string external_id = 14;
}

// Тип тегу
enum TagType {
  TAG_TYPE_UNSPECIFIED = 0;
  
  // Основні типи
  CONTENT_TAG = 1;
  GENRE_TAG = 2;
  CATEGORY_TAG = 3;
  TOPIC_TAG = 4;
  KEYWORD_TAG = 5;
  
  // Функціональні типи
  SEARCH_TAG = 6;
  FILTER_TAG = 7;
  FACET_TAG = 8;
  NAVIGATION_TAG = 9;
  
  // Користувацькі типи
  USER_TAG = 10;
  COMMUNITY_TAG = 11;
  CURATED_TAG = 12;
  AUTO_GENERATED_TAG = 13;
  
  // Спеціальні типи
  TRENDING_TAG = 14;
  POPULAR_TAG = 15;
  FEATURED_TAG = 16;
  SEASONAL_TAG = 17;
  
  // Технічні типи
  SYSTEM_TAG = 18;
  INTERNAL_TAG = 19;
  DEBUG_TAG = 20;
  TEST_TAG = 21;
}

// Метадані тегу
message TagMetadata {
  string language = 1;
  string country = 2;
  repeated string synonyms = 3;
  repeated string related_tags = 4;
  repeated string parent_tags = 5;
  repeated string child_tags = 6;
  string color = 7;
  string icon = 8;
  string image_url = 9;
  string description_long = 10;
  repeated string examples = 11;
  string usage_notes = 12;
}

// Статистика тегу
message TagStats {
  int32 usage_count = 1;
  int32 content_count = 2;
  int32 user_count = 3;
  int32 search_count = 4;
  int32 click_count = 5;
  double popularity_score = 6;
  double trending_score = 7;
  int64 last_used_at = 8;
  int64 first_used_at = 9;
  map<string, int32> usage_by_type = 10;
  map<string, int32> usage_by_category = 11;
}

// Налаштування тегу
message TagSettings {
  bool is_active = 1;
  bool is_public = 2;
  bool is_searchable = 3;
  bool is_filterable = 4;
  bool is_facetable = 5;
  bool is_editable = 6;
  bool is_deletable = 7;
  bool auto_suggest = 8;
  bool case_sensitive = 9;
  bool exact_match = 10;
  int32 max_length = 11;
  int32 min_length = 12;
  repeated string allowed_characters = 13;
  repeated string forbidden_characters = 14;
}
