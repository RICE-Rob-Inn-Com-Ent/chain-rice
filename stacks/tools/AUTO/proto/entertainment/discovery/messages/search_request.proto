syntax = "proto3";

package entertainment.discovery.messages;

import "entertainment/discovery/enums/search_type.proto";

// Запит пошуку
message SearchRequest {
  string id = 1;
  string query = 2;
  
  // Тип пошуку
  entertainment.discovery.enums.SearchType search_type = 3;
  
  // Параметри пошуку
  SearchParameters parameters = 4;
  
  // Контекст пошуку
  SearchContext context = 5;
  
  // Фільтри
  repeated SearchFilter filters = 6;
  
  // Налаштування сортування
  SearchSorting sorting = 7;
  
  // Налаштування пагінації
  SearchPagination pagination = 8;
  
  // Персоналізація
  SearchPersonalization personalization = 9;
  
  // Метадані
  map<string, string> metadata = 10;
  
  // Дати
  int64 created_at = 11;
  int64 expires_at = 12;
}

// Параметри пошуку
message SearchParameters {
  string language = 1;
  string country = 2;
  string timezone = 3;
  repeated string content_types = 4;
  repeated string genres = 5;
  repeated string categories = 6;
  repeated string tags = 7;
  string age_rating = 8;
  bool include_adult_content = 9;
  bool include_premium_content = 10;
  bool include_free_content = 11;
  repeated string platforms = 12;
  repeated string devices = 13;
  string quality_preference = 14;
  string audio_preference = 15;
  string subtitle_preference = 16;
}

// Контекст пошуку
message SearchContext {
  string user_id = 1;
  string session_id = 2;
  string device_id = 3;
  string location = 4;
  string referrer = 5;
  string user_agent = 6;
  string ip_address = 7;
  map<string, string> user_preferences = 8;
  repeated string recent_searches = 9;
  repeated string recent_views = 10;
  repeated string recent_likes = 11;
  repeated string watch_history = 12;
  repeated string favorite_genres = 13;
  repeated string favorite_categories = 14;
  repeated string favorite_tags = 15;
}

// Фільтр пошуку
message SearchFilter {
  string field = 1;
  string operator = 2;
  string value = 3;
  repeated string values = 4;
  string range_min = 5;
  string range_max = 6;
  bool exclude = 7;
  int32 weight = 8;
}

// Сортування пошуку
message SearchSorting {
  string field = 1;
  string order = 2;
  int32 priority = 3;
  bool custom_sort = 4;
  repeated string sort_fields = 5;
}

// Пагінація пошуку
message SearchPagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 max_results = 3;
  bool enable_cursor = 4;
  string cursor = 5;
  bool enable_offset = 6;
  int32 offset = 7;
}

// Персоналізація пошуку
message SearchPersonalization {
  bool enabled = 1;
  string algorithm = 2;
  double personalization_weight = 3;
  repeated string personalization_factors = 4;
  bool include_trending = 5;
  bool include_popular = 6;
  bool include_recommended = 7;
  bool include_similar = 8;
  double diversity_factor = 9;
  double novelty_factor = 10;
  double recency_factor = 11;
  double popularity_factor = 12;
}
