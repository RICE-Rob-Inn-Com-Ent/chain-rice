syntax = "proto3";

package entertainment.discovery.services;

import "entertainment/discovery/messages/search_request.proto";
import "entertainment/discovery/messages/search_response.proto";
import "entertainment/discovery/messages/recommendation.proto";
import "entertainment/discovery/enums/search_type.proto";
import "entertainment/discovery/enums/rec_algo.proto";

// Сервіс пошуку та рекомендацій
service DiscoveryService {
  // Пошук контенту
  rpc SearchContent(SearchContentRequest) returns (SearchContentResponse);
  rpc AdvancedSearch(AdvancedSearchRequest) returns (AdvancedSearchResponse);
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse);
  rpc VoiceSearch(VoiceSearchRequest) returns (VoiceSearchResponse);
  rpc ImageSearch(ImageSearchRequest) returns (ImageSearchResponse);
  
  // Рекомендації
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
  rpc GetSimilarContent(GetSimilarContentRequest) returns (GetSimilarContentResponse);
  rpc GetTrendingContent(GetTrendingContentRequest) returns (GetTrendingContentResponse);
  rpc GetPersonalizedContent(GetPersonalizedContentRequest) returns (GetPersonalizedContentResponse);
  
  // Автодоповнення та пропозиції
  rpc GetSearchSuggestions(GetSearchSuggestionsRequest) returns (GetSearchSuggestionsResponse);
  rpc GetAutoComplete(GetAutoCompleteRequest) returns (GetAutoCompleteResponse);
  rpc GetRelatedQueries(GetRelatedQueriesRequest) returns (GetRelatedQueriesResponse);
  
  // Аналітика пошуку
  rpc GetSearchAnalytics(GetSearchAnalyticsRequest) returns (GetSearchAnalyticsResponse);
  rpc GetSearchMetrics(GetSearchMetricsRequest) returns (GetSearchMetricsResponse);
  rpc GetPopularSearches(GetPopularSearchesRequest) returns (GetPopularSearchesResponse);
  
  // Налаштування алгоритмів
  rpc ConfigureRecommendationAlgorithm(ConfigureRecommendationAlgorithmRequest) returns (ConfigureRecommendationAlgorithmResponse);
  rpc UpdateSearchIndex(UpdateSearchIndexRequest) returns (UpdateSearchIndexResponse);
  rpc OptimizeSearch(OptimizeSearchRequest) returns (OptimizeSearchResponse);
}

// Запити та відповіді для пошуку
message SearchContentRequest {
  entertainment.discovery.messages.SearchRequest search_request = 1;
}

message SearchContentResponse {
  entertainment.discovery.messages.SearchResponse search_response = 1;
}

message AdvancedSearchRequest {
  entertainment.discovery.messages.SearchRequest search_request = 1;
  repeated AdvancedFilter filters = 2;
  repeated AdvancedSort sorts = 3;
  AdvancedPagination pagination = 4;
}

message AdvancedSearchResponse {
  entertainment.discovery.messages.SearchResponse search_response = 1;
  repeated AdvancedFilter applied_filters = 2;
  repeated AdvancedSort applied_sorts = 3;
  AdvancedPagination pagination_info = 4;
}

message SemanticSearchRequest {
  string query = 1;
  string context = 2;
  entertainment.discovery.enums.SearchType search_type = 3;
  SemanticSearchOptions options = 4;
}

message SemanticSearchResponse {
  entertainment.discovery.messages.SearchResponse search_response = 1;
  repeated SemanticMatch semantic_matches = 2;
  double semantic_score = 3;
}

message VoiceSearchRequest {
  bytes audio_data = 1;
  string language = 2;
  VoiceSearchOptions options = 3;
}

message VoiceSearchResponse {
  entertainment.discovery.messages.SearchResponse search_response = 1;
  string transcribed_text = 2;
  double confidence_score = 3;
}

message ImageSearchRequest {
  bytes image_data = 1;
  ImageSearchOptions options = 2;
}

message ImageSearchResponse {
  entertainment.discovery.messages.SearchResponse search_response = 1;
  repeated ImageMatch image_matches = 2;
  repeated string detected_objects = 3;
}

// Запити та відповіді для рекомендацій
message GetRecommendationsRequest {
  string user_id = 1;
  string content_id = 2;
  entertainment.discovery.enums.RecommendationAlgorithm algorithm = 3;
  RecommendationOptions options = 4;
}

message GetRecommendationsResponse {
  repeated entertainment.discovery.messages.Recommendation recommendations = 1;
  string algorithm_used = 2;
  double confidence_score = 3;
}

message GetSimilarContentRequest {
  string content_id = 1;
  int32 count = 2;
  SimilarityOptions options = 3;
}

message GetSimilarContentResponse {
  repeated entertainment.discovery.messages.Recommendation similar_content = 1;
  repeated string similarity_factors = 2;
}

message GetTrendingContentRequest {
  string time_period = 1;
  int32 count = 2;
  repeated string filters = 3;
}

message GetTrendingContentResponse {
  repeated entertainment.discovery.messages.Recommendation trending_content = 1;
  repeated TrendMetric trend_metrics = 2;
}

message GetPersonalizedContentRequest {
  string user_id = 1;
  int32 count = 2;
  PersonalizationOptions options = 3;
}

message GetPersonalizedContentResponse {
  repeated entertainment.discovery.messages.Recommendation personalized_content = 1;
  repeated string personalization_factors = 2;
}

// Запити та відповіді для автодоповнення
message GetSearchSuggestionsRequest {
  string query = 1;
  int32 count = 2;
  repeated string filters = 3;
}

message GetSearchSuggestionsResponse {
  repeated entertainment.discovery.messages.SearchSuggestion suggestions = 1;
}

message GetAutoCompleteRequest {
  string partial_query = 1;
  int32 count = 2;
  AutoCompleteOptions options = 3;
}

message GetAutoCompleteResponse {
  repeated string completions = 1;
  repeated string suggestions = 2;
}

message GetRelatedQueriesRequest {
  string query = 1;
  int32 count = 2;
  RelatedQueryOptions options = 3;
}

message GetRelatedQueriesResponse {
  repeated string related_queries = 1;
  repeated string trending_queries = 2;
}

// Запити та відповіді для аналітики
message GetSearchAnalyticsRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetSearchAnalyticsResponse {
  SearchAnalytics analytics = 1;
}

message GetSearchMetricsRequest {
  string metric_type = 1;
  string time_period = 2;
}

message GetSearchMetricsResponse {
  SearchMetrics metrics = 1;
}

message GetPopularSearchesRequest {
  string time_period = 1;
  int32 count = 2;
  repeated string filters = 3;
}

message GetPopularSearchesResponse {
  repeated PopularSearch popular_searches = 1;
}

// Запити для налаштувань
message ConfigureRecommendationAlgorithmRequest {
  entertainment.discovery.enums.RecommendationAlgorithm algorithm = 1;
  AlgorithmConfiguration config = 2;
}

message ConfigureRecommendationAlgorithmResponse {
  bool configured = 1;
  string message = 2;
}

message UpdateSearchIndexRequest {
  string index_id = 1;
  IndexUpdateOptions options = 2;
}

message UpdateSearchIndexResponse {
  bool updated = 1;
  string message = 2;
}

message OptimizeSearchRequest {
  OptimizationOptions options = 1;
}

message OptimizeSearchResponse {
  OptimizationResult result = 1;
}

// Допоміжні повідомлення
message AdvancedFilter {
  string field = 1;
  string operator = 2;
  string value = 3;
  repeated string values = 4;
  string range_min = 5;
  string range_max = 6;
  bool exclude = 7;
}

message AdvancedSort {
  string field = 1;
  string order = 2;
  int32 priority = 3;
}

message AdvancedPagination {
  int32 page = 1;
  int32 page_size = 2;
  string cursor = 3;
  bool enable_cursor = 4;
}

message SemanticSearchOptions {
  double similarity_threshold = 1;
  repeated string semantic_fields = 2;
  bool include_synonyms = 3;
  bool include_related_concepts = 4;
}

message SemanticMatch {
  string content_id = 1;
  double similarity_score = 2;
  repeated string matching_concepts = 3;
}

message VoiceSearchOptions {
  string language = 1;
  string accent = 2;
  bool include_punctuation = 3;
  bool include_numbers = 4;
}

message ImageSearchOptions {
  repeated string search_types = 1;
  double similarity_threshold = 2;
  bool include_faces = 3;
  bool include_objects = 4;
  bool include_text = 5;
}

message ImageMatch {
  string content_id = 1;
  double similarity_score = 2;
  repeated string matching_features = 3;
}

message RecommendationOptions {
  int32 count = 1;
  repeated string content_types = 2;
  repeated string genres = 3;
  repeated string categories = 4;
  double diversity_factor = 5;
  double novelty_factor = 6;
}

message SimilarityOptions {
  repeated string similarity_metrics = 1;
  double threshold = 2;
  bool include_metadata = 3;
}

message TrendMetric {
  string metric_name = 1;
  double value = 2;
  double change_percentage = 3;
  string time_period = 4;
}

message PersonalizationOptions {
  repeated string personalization_factors = 1;
  double personalization_weight = 2;
  bool include_trending = 3;
  bool include_popular = 4;
}

message AutoCompleteOptions {
  bool case_sensitive = 1;
  bool fuzzy_matching = 2;
  repeated string content_types = 3;
}

message RelatedQueryOptions {
  repeated string query_types = 1;
  double relevance_threshold = 2;
  bool include_trending = 3;
}

message SearchAnalytics {
  int32 total_searches = 1;
  int32 unique_users = 2;
  double average_results_per_search = 3;
  double click_through_rate = 4;
  repeated string popular_queries = 5;
  repeated string zero_result_queries = 6;
}

message SearchMetrics {
  double average_response_time = 1;
  double success_rate = 2;
  double relevance_score = 3;
  double user_satisfaction = 4;
  map<string, double> performance_metrics = 5;
}

message PopularSearch {
  string query = 1;
  int32 search_count = 2;
  int32 unique_users = 3;
  double click_through_rate = 4;
  string time_period = 5;
}

message AlgorithmConfiguration {
  map<string, string> parameters = 1;
  repeated string content_types = 2;
  repeated string user_segments = 3;
  bool enable_learning = 4;
}

message IndexUpdateOptions {
  bool incremental_update = 1;
  bool force_rebuild = 2;
  repeated string content_types = 3;
}

message OptimizationOptions {
  repeated string optimization_goals = 1;
  string time_period = 2;
  bool include_ab_testing = 3;
}

message OptimizationResult {
  repeated OptimizationSuggestion suggestions = 1;
  double estimated_improvement = 2;
  string optimization_type = 3;
}

message OptimizationSuggestion {
  string suggestion_type = 1;
  string description = 2;
  double potential_improvement = 3;
  int32 priority = 4;
}
