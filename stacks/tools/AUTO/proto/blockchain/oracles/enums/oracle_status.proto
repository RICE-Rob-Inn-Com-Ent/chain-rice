syntax = "proto3";

package blockchain.oracles.enums;

option go_package = "github.com/chainrice/proto/blockchain/oracles/enums";

// OracleStatus defines the status of blockchain oracles
enum OracleStatus {
  // ORACLE_STATUS_UNSPECIFIED indicates an unspecified oracle status
  ORACLE_STATUS_UNSPECIFIED = 0;
  
  // ORACLE_STATUS_ACTIVE indicates the oracle is active and operational
  ORACLE_STATUS_ACTIVE = 1;
  
  // ORACLE_STATUS_INACTIVE indicates the oracle is inactive
  ORACLE_STATUS_INACTIVE = 2;
  
  // ORACLE_STATUS_PENDING indicates the oracle is pending activation
  ORACLE_STATUS_PENDING = 3;
  
  // ORACLE_STATUS_SUSPENDED indicates the oracle is suspended
  ORACLE_STATUS_SUSPENDED = 4;
  
  // ORACLE_STATUS_DEPRECATED indicates the oracle is deprecated
  ORACLE_STATUS_DEPRECATED = 5;
  
  // ORACLE_STATUS_MAINTENANCE indicates the oracle is under maintenance
  ORACLE_STATUS_MAINTENANCE = 6;
  
  // ORACLE_STATUS_ERROR indicates the oracle is in error state
  ORACLE_STATUS_ERROR = 7;
  
  // ORACLE_STATUS_UPDATING indicates the oracle is being updated
  ORACLE_STATUS_UPDATING = 8;
  
  // ORACLE_STATUS_SYNCING indicates the oracle is syncing data
  ORACLE_STATUS_SYNCING = 9;
  
  // ORACLE_STATUS_OFFLINE indicates the oracle is offline
  ORACLE_STATUS_OFFLINE = 10;
  
  // ORACLE_STATUS_RATE_LIMITED indicates the oracle is rate limited
  ORACLE_STATUS_RATE_LIMITED = 11;
  
  // ORACLE_STATUS_QUOTA_EXCEEDED indicates the oracle has exceeded quota
  ORACLE_STATUS_QUOTA_EXCEEDED = 12;
  
  // ORACLE_STATUS_VERIFIED indicates the oracle is verified
  ORACLE_STATUS_VERIFIED = 13;
  
  // ORACLE_STATUS_UNVERIFIED indicates the oracle is unverified
  ORACLE_STATUS_UNVERIFIED = 14;
  
  // ORACLE_STATUS_TRUSTED indicates the oracle is trusted
  ORACLE_STATUS_TRUSTED = 15;
  
  // ORACLE_STATUS_UNT RUSTED indicates the oracle is untrusted
  ORACLE_STATUS_UNTRUSTED = 16;
}
