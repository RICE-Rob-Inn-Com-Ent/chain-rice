syntax = "proto3";

package blockchain.smart_contracts.enums;

option go_package = "github.com/chainrice/proto/blockchain/smart_contracts/enums";

// ContractType defines the different types of smart contracts
enum ContractType {
  // CONTRACT_TYPE_UNSPECIFIED indicates an unspecified contract type
  CONTRACT_TYPE_UNSPECIFIED = 0;
  
  // CONTRACT_TYPE_TOKEN represents a token contract (ERC-20, etc.)
  CONTRACT_TYPE_TOKEN = 1;
  
  // CONTRACT_TYPE_NFT represents a non-fungible token contract (ERC-721, etc.)
  CONTRACT_TYPE_NFT = 2;
  
  // CONTRACT_TYPE_DEX represents a decentralized exchange contract
  CONTRACT_TYPE_DEX = 3;
  
  // CONTRACT_TYPE_LENDING represents a lending/borrowing contract
  CONTRACT_TYPE_LENDING = 4;
  
  // CONTRACT_TYPE_STAKING represents a staking contract
  CONTRACT_TYPE_STAKING = 5;
  
  // CONTRACT_TYPE_GOVERNANCE represents a governance contract
  CONTRACT_TYPE_GOVERNANCE = 6;
  
  // CONTRACT_TYPE_ORACLE represents an oracle contract
  CONTRACT_TYPE_ORACLE = 7;
  
  // CONTRACT_TYPE_BRIDGE represents a bridge contract
  CONTRACT_TYPE_BRIDGE = 8;
  
  // CONTRACT_TYPE_ESCROW represents an escrow contract
  CONTRACT_TYPE_ESCROW = 9;
  
  // CONTRACT_TYPE_DAO represents a DAO contract
  CONTRACT_TYPE_DAO = 10;
  
  // CONTRACT_TYPE_MARKETPLACE represents a marketplace contract
  CONTRACT_TYPE_MARKETPLACE = 11;
  
  // CONTRACT_TYPE_INSURANCE represents an insurance contract
  CONTRACT_TYPE_INSURANCE = 12;
  
  // CONTRACT_TYPE_DERIVATIVES represents a derivatives contract
  CONTRACT_TYPE_DERIVATIVES = 13;
  
  // CONTRACT_TYPE_PREDICTION represents a prediction market contract
  CONTRACT_TYPE_PREDICTION = 14;
  
  // CONTRACT_TYPE_IDENTITY represents an identity contract
  CONTRACT_TYPE_IDENTITY = 15;
  
  // CONTRACT_TYPE_STORAGE represents a storage contract
  CONTRACT_TYPE_STORAGE = 16;
  
  // CONTRACT_TYPE_COMPUTATION represents a computation contract
  CONTRACT_TYPE_COMPUTATION = 17;
  
  // CONTRACT_TYPE_GAMING represents a gaming contract
  CONTRACT_TYPE_GAMING = 18;
  
  // CONTRACT_TYPE_SOCIAL represents a social media contract
  CONTRACT_TYPE_SOCIAL = 19;
  
  // CONTRACT_TYPE_UTILITY represents a utility contract
  CONTRACT_TYPE_UTILITY = 20;
  
  // CONTRACT_TYPE_CUSTOM represents a custom contract
  CONTRACT_TYPE_CUSTOM = 21;
}
