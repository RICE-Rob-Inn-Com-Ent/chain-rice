syntax = "proto3";

package blockchain.identity.enums;

option go_package = "github.com/chainrice/proto/blockchain/identity/enums";

// IdentityStatus defines the status of blockchain identities
enum IdentityStatus {
  // IDENTITY_STATUS_UNSPECIFIED indicates an unspecified identity status
  IDENTITY_STATUS_UNSPECIFIED = 0;
  
  // IDENTITY_STATUS_ACTIVE indicates the identity is active and verified
  IDENTITY_STATUS_ACTIVE = 1;
  
  // IDENTITY_STATUS_INACTIVE indicates the identity is inactive
  IDENTITY_STATUS_INACTIVE = 2;
  
  // IDENTITY_STATUS_PENDING indicates the identity is pending verification
  IDENTITY_STATUS_PENDING = 3;
  
  // IDENTITY_STATUS_SUSPENDED indicates the identity is suspended
  IDENTITY_STATUS_SUSPENDED = 4;
  
  // IDENTITY_STATUS_REVOKED indicates the identity is revoked
  IDENTITY_STATUS_REVOKED = 5;
  
  // IDENTITY_STATUS_EXPIRED indicates the identity has expired
  IDENTITY_STATUS_EXPIRED = 6;
  
  // IDENTITY_STATUS_BLACKLISTED indicates the identity is blacklisted
  IDENTITY_STATUS_BLACKLISTED = 7;
  
  // IDENTITY_STATUS_WHITELISTED indicates the identity is whitelisted
  IDENTITY_STATUS_WHITELISTED = 8;
  
  // IDENTITY_STATUS_VERIFICATION_REQUIRED indicates verification is required
  IDENTITY_STATUS_VERIFICATION_REQUIRED = 9;
  
  // IDENTITY_STATUS_UNDER_REVIEW indicates the identity is under review
  IDENTITY_STATUS_UNDER_REVIEW = 10;
  
  // IDENTITY_STATUS_APPROVED indicates the identity is approved
  IDENTITY_STATUS_APPROVED = 11;
  
  // IDENTITY_STATUS_REJECTED indicates the identity is rejected
  IDENTITY_STATUS_REJECTED = 12;
  
  // IDENTITY_STATUS_TEMPORARILY_DISABLED indicates temporarily disabled
  IDENTITY_STATUS_TEMPORARILY_DISABLED = 13;
}
