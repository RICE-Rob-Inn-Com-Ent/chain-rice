syntax = "proto3";

package blockchain.consensus.enums;

option go_package = "github.com/chainrice/proto/blockchain/consensus/enums";

// ConsensusStatus defines the status of consensus operations
enum ConsensusStatus {
  // CONSENSUS_STATUS_UNSPECIFIED indicates an unspecified consensus status
  CONSENSUS_STATUS_UNSPECIFIED = 0;
  
  // CONSENSUS_STATUS_ACTIVE indicates consensus is active and running
  CONSENSUS_STATUS_ACTIVE = 1;
  
  // CONSENSUS_STATUS_SYNCING indicates the node is syncing with the network
  CONSENSUS_STATUS_SYNCING = 2;
  
  // CONSENSUS_STATUS_STOPPED indicates consensus is stopped
  CONSENSUS_STATUS_STOPPED = 3;
  
  // CONSENSUS_STATUS_PAUSED indicates consensus is paused
  CONSENSUS_STATUS_PAUSED = 4;
  
  // CONSENSUS_STATUS_ERROR indicates consensus is in error state
  CONSENSUS_STATUS_ERROR = 5;
  
  // CONSENSUS_STATUS_MAINTENANCE indicates consensus is in maintenance mode
  CONSENSUS_STATUS_MAINTENANCE = 6;
  
  // CONSENSUS_STATUS_UPGRADING indicates consensus is being upgraded
  CONSENSUS_STATUS_UPGRADING = 7;
  
  // CONSENSUS_STATUS_CATCHING_UP indicates the node is catching up to the network
  CONSENSUS_STATUS_CATCHING_UP = 8;
  
  // CONSENSUS_STATUS_WAITING_FOR_PEERS indicates waiting for peer connections
  CONSENSUS_STATUS_WAITING_FOR_PEERS = 9;
  
  // CONSENSUS_STATUS_PROPOSING indicates the node is proposing blocks
  CONSENSUS_STATUS_PROPOSING = 10;
  
  // CONSENSUS_STATUS_VOTING indicates the node is voting on proposals
  CONSENSUS_STATUS_VOTING = 11;
  
  // CONSENSUS_STATUS_VALIDATING indicates the node is validating blocks
  CONSENSUS_STATUS_VALIDATING = 12;
}
