syntax = "proto3";

package blockchain.bridge.enums;

option go_package = "github.com/chainrice/proto/blockchain/bridge/enums";

// BridgeType defines the different types of blockchain bridges
enum BridgeType {
  // BRIDGE_TYPE_UNSPECIFIED indicates an unspecified bridge type
  BRIDGE_TYPE_UNSPECIFIED = 0;
  
  // BRIDGE_TYPE_CROSS_CHAIN represents a cross-chain bridge connecting different blockchains
  BRIDGE_TYPE_CROSS_CHAIN = 1;
  
  // BRIDGE_TYPE_SIDE_CHAIN represents a sidechain bridge connecting to a sidechain
  BRIDGE_TYPE_SIDE_CHAIN = 2;
  
  // BRIDGE_TYPE_LAYER2 represents a layer 2 scaling solution bridge
  BRIDGE_TYPE_LAYER2 = 3;
  
  // BRIDGE_TYPE_CUSTODIAL represents a custodial bridge with centralized control
  BRIDGE_TYPE_CUSTODIAL = 4;
  
  // BRIDGE_TYPE_NON_CUSTODIAL represents a non-custodial bridge with decentralized control
  BRIDGE_TYPE_NON_CUSTODIAL = 5;
  
  // BRIDGE_TYPE_ATOMIC_SWAP represents an atomic swap bridge for peer-to-peer trading
  BRIDGE_TYPE_ATOMIC_SWAP = 6;
  
  // BRIDGE_TYPE_HASH_LOCK represents a hash lock time contract bridge
  BRIDGE_TYPE_HASH_LOCK = 7;
  
  // BRIDGE_TYPE_RELAY represents a relay bridge using external validators
  BRIDGE_TYPE_RELAY = 8;
  
  // BRIDGE_TYPE_LIGHT_CLIENT represents a light client bridge for efficient verification
  BRIDGE_TYPE_LIGHT_CLIENT = 9;
}
