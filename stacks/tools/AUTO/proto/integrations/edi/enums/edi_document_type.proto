  EDI_DOCUMENT_TYPE_FUNCTIONAL_ACKNOWLEDGMENT = 51;
  EDI_DOCUMENT_TYPE_APPLICATION_CONTROL = 52;
  EDI_DOCUMENT_TYPE_TAX_DOCUMENT = 53;
  
  // Custom/Extended
  EDI_DOCUMENT_TYPE_CUSTOM = 100;
  EDI_DOCUMENT_TYPE_EXTENDED = 101;
