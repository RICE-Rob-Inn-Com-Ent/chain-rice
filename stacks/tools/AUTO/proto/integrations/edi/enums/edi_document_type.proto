  // Financial Documents
  EDI_DOCUMENT_TYPE_INVOICE = 1;
  EDI_DOCUMENT_TYPE_CREDIT_MEMO = 2;
  EDI_DOCUMENT_TYPE_DEBIT_MEMO = 3;
  EDI_DOCUMENT_TYPE_PAYMENT = 4;
  EDI_DOCUMENT_TYPE_REMITTANCE = 5;
  
  // Order Management
  EDI_DOCUMENT_TYPE_PURCHASE_ORDER = 10;
  EDI_DOCUMENT_TYPE_PURCHASE_ORDER_ACKNOWLEDGMENT = 11;
  EDI_DOCUMENT_TYPE_SALES_ORDER = 12;
  EDI_DOCUMENT_TYPE_ORDER_RESPONSE = 13;
  EDI_DOCUMENT_TYPE_ORDER_CHANGE = 14;
  EDI_DOCUMENT_TYPE_ORDER_CANCELLATION = 15;
  
  // Logistics & Shipping
  EDI_DOCUMENT_TYPE_SHIPPING_NOTICE = 20;
  EDI_DOCUMENT_TYPE_SHIPPING_MANIFEST = 21;
  EDI_DOCUMENT_TYPE_DELIVERY_CONFIRMATION = 22;
  EDI_DOCUMENT_TYPE_PICKUP_NOTICE = 23;
  EDI_DOCUMENT_TYPE_RETURN_AUTHORIZATION = 24;
  
