syntax = "proto3";

package integrations.webhooks.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "integrations/webhooks/messages/webhook_subscription_models.proto";
import "integrations/webhooks/messages/webhook_event_models.proto";
import "integrations/webhooks/messages/webhook_delivery_log.proto";

option go_package = "github.com/rice-dev/integrations/webhooks/services";

// Webhook Monitoring Service for delivery status and failure alerts
service WebhookMonitoringService {
  // Real-time Monitoring
  rpc StartMonitoring(StartMonitoringRequest) returns (StartMonitoringResponse);
  rpc StopMonitoring(StopMonitoringRequest) returns (StopMonitoringResponse);
  rpc GetMonitoringStatus(GetMonitoringStatusRequest) returns (GetMonitoringStatusResponse);
  
  // Delivery Status Monitoring
  rpc MonitorDeliveryStatus(MonitorDeliveryStatusRequest) returns (MonitorDeliveryStatusResponse);
  rpc GetDeliveryStatusReport(GetDeliveryStatusReportRequest) returns (GetDeliveryStatusReportResponse);
  rpc GetDeliveryHealthReport(GetDeliveryHealthReportRequest) returns (GetDeliveryHealthReportResponse);
  
  // Failure Detection and Alerting
  rpc DetectFailures(DetectFailuresRequest) returns (DetectFailuresResponse);
  rpc CreateAlert(CreateAlertRequest) returns (CreateAlertResponse);
  rpc UpdateAlert(UpdateAlertRequest) returns (UpdateAlertResponse);
  rpc ResolveAlert(ResolveAlertRequest) returns (ResolveAlertResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  
  // Performance Monitoring
  rpc MonitorPerformance(MonitorPerformanceRequest) returns (MonitorPerformanceResponse);
  rpc GetPerformanceReport(GetPerformanceReportRequest) returns (GetPerformanceReportResponse);
  rpc GetPerformanceMetrics(GetPerformanceMetricsRequest) returns (GetPerformanceMetricsResponse);
  
  // SLA Monitoring
  rpc MonitorSLA(MonitorSLARequest) returns (MonitorSLAResponse);
  rpc GetSLAReport(GetSLAReportRequest) returns (GetSLAReportResponse);
  rpc GetSLACompliance(GetSLAComplianceRequest) returns (GetSLAComplianceResponse);
  
  // Endpoint Monitoring
  rpc MonitorEndpoints(MonitorEndpointsRequest) returns (MonitorEndpointsResponse);
  rpc GetEndpointStatus(GetEndpointStatusRequest) returns (GetEndpointStatusResponse);
  rpc GetEndpointHealthReport(GetEndpointHealthReportRequest) returns (GetEndpointHealthReportResponse);
  
  // Subscription Monitoring
  rpc MonitorSubscriptions(MonitorSubscriptionsRequest) returns (MonitorSubscriptionsResponse);
  rpc GetSubscriptionStatus(GetSubscriptionStatusRequest) returns (GetSubscriptionStatusResponse);
  rpc GetSubscriptionHealthReport(GetSubscriptionHealthReportRequest) returns (GetSubscriptionHealthReportResponse);
  
  // System Monitoring
  rpc MonitorSystem(MonitorSystemRequest) returns (MonitorSystemResponse);
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse);
  rpc GetSystemHealthReport(GetSystemHealthReportRequest) returns (GetSystemHealthReportResponse);
  
  // Metrics and Analytics
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse);
  rpc GetTrends(GetTrendsRequest) returns (GetTrendsResponse);
  
  // Reporting
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);
  rpc ScheduleReport(ScheduleReportRequest) returns (ScheduleReportResponse);
  rpc GetReportStatus(GetReportStatusRequest) returns (GetReportStatusResponse);
  
  // Dashboard
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc UpdateDashboard(UpdateDashboardRequest) returns (UpdateDashboardResponse);
  rpc GetDashboardWidgets(GetDashboardWidgetsRequest) returns (GetDashboardWidgetsResponse);
  
  // Health Check
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);
}

// Start Monitoring Request
message StartMonitoringRequest {
  string subscription_id = 1;
  repeated string monitoring_types = 2; // DELIVERY, PERFORMANCE, SLA, ENDPOINT, SYSTEM
  WebhookMonitoringConfiguration configuration = 3;
  bool enable_real_time = 4;
}

// Start Monitoring Response
message StartMonitoringResponse {
  string subscription_id = 1;
  string monitoring_id = 2;
  bool monitoring_started = 3;
  repeated string active_monitors = 4;
  google.protobuf.Timestamp started_at = 5;
}

// Stop Monitoring Request
message StopMonitoringRequest {
  string subscription_id = 1;
  string monitoring_id = 2;
  string reason = 3;
}

// Stop Monitoring Response
message StopMonitoringResponse {
  string subscription_id = 1;
  string monitoring_id = 2;
  bool monitoring_stopped = 3;
  google.protobuf.Timestamp stopped_at = 4;
}

// Get Monitoring Status Request
message GetMonitoringStatusRequest {
  string subscription_id = 1;
  string monitoring_id = 2;
}

// Get Monitoring Status Response
message GetMonitoringStatusResponse {
  string subscription_id = 1;
  string monitoring_id = 2;
  string monitoring_status = 3; // ACTIVE, INACTIVE, PAUSED, ERROR
  repeated string active_monitors = 4;
  repeated string monitoring_alerts = 5;
  google.protobuf.Timestamp last_updated = 6;
}

// Monitor Delivery Status Request
message MonitorDeliveryStatusRequest {
  string subscription_id = 1;
  repeated string delivery_ids = 2;
  bool monitor_all_deliveries = 3;
  WebhookDeliveryMonitoringConfig config = 4;
}

// Monitor Delivery Status Response
message MonitorDeliveryStatusResponse {
  string subscription_id = 1;
  bool monitoring_enabled = 2;
  repeated string monitored_deliveries = 3;
  google.protobuf.Timestamp monitoring_started_at = 4;
}

// Get Delivery Status Report Request
message GetDeliveryStatusReportRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string granularity = 4; // HOUR, DAY, WEEK, MONTH
  bool include_details = 5;
}

// Get Delivery Status Report Response
message GetDeliveryStatusReportResponse {
  string subscription_id = 1;
  WebhookDeliveryStatusReport report = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Get Delivery Health Report Request
message GetDeliveryHealthReportRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  bool include_recommendations = 4;
}

// Get Delivery Health Report Response
message GetDeliveryHealthReportResponse {
  string subscription_id = 1;
  WebhookDeliveryHealthReport report = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Detect Failures Request
message DetectFailuresRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  repeated string failure_types = 4; // DELIVERY_FAILURE, TIMEOUT, ERROR_RATE, SLA_VIOLATION
  bool auto_create_alerts = 5;
}

// Detect Failures Response
message DetectFailuresResponse {
  string subscription_id = 1;
  repeated WebhookFailureDetection failure_detections = 2;
  int32 total_failures_detected = 3;
  int32 alerts_created = 4;
  google.protobuf.Timestamp detected_at = 5;
}

// Create Alert Request
message CreateAlertRequest {
  string subscription_id = 1;
  WebhookAlert alert = 2;
  bool send_notifications = 3;
}

// Create Alert Response
message CreateAlertResponse {
  string alert_id = 1;
  bool alert_created = 2;
  bool notifications_sent = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Update Alert Request
message UpdateAlertRequest {
  string alert_id = 1;
  WebhookAlert alert = 2;
  string update_reason = 3;
}

// Update Alert Response
message UpdateAlertResponse {
  string alert_id = 1;
  bool alert_updated = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// Resolve Alert Request
message ResolveAlertRequest {
  string alert_id = 1;
  string resolution_notes = 2;
  string resolved_by = 3;
}

// Resolve Alert Response
message ResolveAlertResponse {
  string alert_id = 1;
  bool alert_resolved = 2;
  google.protobuf.Timestamp resolved_at = 3;
}

// List Alerts Request
message ListAlertsRequest {
  string subscription_id = 1;
  repeated string alert_types = 2;
  repeated string alert_severities = 3;
  repeated string alert_statuses = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  int32 limit = 7;
  int32 offset = 8;
}

// List Alerts Response
message ListAlertsResponse {
  repeated WebhookAlert alerts = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
}

// Monitor Performance Request
message MonitorPerformanceRequest {
  string subscription_id = 1;
  repeated string performance_metrics = 2; // RESPONSE_TIME, THROUGHPUT, ERROR_RATE, SUCCESS_RATE
  WebhookPerformanceMonitoringConfig config = 3;
}

// Monitor Performance Response
message MonitorPerformanceResponse {
  string subscription_id = 1;
  bool performance_monitoring_enabled = 2;
  repeated string monitored_metrics = 3;
  google.protobuf.Timestamp monitoring_started_at = 4;
}

// Get Performance Report Request
message GetPerformanceReportRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string granularity = 4; // HOUR, DAY, WEEK, MONTH
  bool include_benchmarks = 5;
}

// Get Performance Report Response
message GetPerformanceReportResponse {
  string subscription_id = 1;
  WebhookPerformanceReport report = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Get Performance Metrics Request
message GetPerformanceMetricsRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string granularity = 4; // MINUTE, HOUR, DAY
}

// Get Performance Metrics Response
message GetPerformanceMetricsResponse {
  string subscription_id = 1;
  WebhookPerformanceMetrics metrics = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Monitor SLA Request
message MonitorSLARequest {
  string subscription_id = 1;
  repeated WebhookSLA sla_definitions = 2;
  bool enable_violation_detection = 3;
}

// Monitor SLA Response
message MonitorSLAResponse {
  string subscription_id = 1;
  bool sla_monitoring_enabled = 2;
  repeated string monitored_slas = 3;
  google.protobuf.Timestamp monitoring_started_at = 4;
}

// Get SLA Report Request
message GetSLAReportRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string granularity = 4; // HOUR, DAY, WEEK, MONTH
  bool include_violations = 5;
}

// Get SLA Report Response
message GetSLAReportResponse {
  string subscription_id = 1;
  WebhookSLAReport report = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Get SLA Compliance Request
message GetSLAComplianceRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  repeated string sla_types = 4;
}

// Get SLA Compliance Response
message GetSLAComplianceResponse {
  string subscription_id = 1;
  repeated WebhookSLACompliance sla_compliance = 2;
  double overall_compliance = 3;
  google.protobuf.Timestamp generated_at = 4;
}

// Monitor Endpoints Request
message MonitorEndpointsRequest {
  string subscription_id = 1;
  repeated string endpoint_ids = 2;
  bool monitor_all_endpoints = 3;
  WebhookEndpointMonitoringConfig config = 4;
}

// Monitor Endpoints Response
message MonitorEndpointsResponse {
  string subscription_id = 1;
  bool endpoint_monitoring_enabled = 2;
  repeated string monitored_endpoints = 3;
  google.protobuf.Timestamp monitoring_started_at = 4;
}

// Get Endpoint Status Request
message GetEndpointStatusRequest {
  string subscription_id = 1;
  string endpoint_id = 2;
}

// Get Endpoint Status Response
message GetEndpointStatusResponse {
  string subscription_id = 1;
  string endpoint_id = 2;
  WebhookEndpointStatus status = 3;
  google.protobuf.Timestamp last_checked = 4;
}

// Get Endpoint Health Report Request
message GetEndpointHealthReportRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  bool include_recommendations = 4;
}

// Get Endpoint Health Report Response
message GetEndpointHealthReportResponse {
  string subscription_id = 1;
  WebhookEndpointHealthReport report = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Monitor Subscriptions Request
message MonitorSubscriptionsRequest {
  repeated string subscription_ids = 1;
  bool monitor_all_subscriptions = 2;
  WebhookSubscriptionMonitoringConfig config = 3;
}

// Monitor Subscriptions Response
message MonitorSubscriptionsResponse {
  bool subscription_monitoring_enabled = 1;
  repeated string monitored_subscriptions = 2;
  google.protobuf.Timestamp monitoring_started_at = 3;
}

// Get Subscription Status Request
message GetSubscriptionStatusRequest {
  string subscription_id = 1;
}

// Get Subscription Status Response
message GetSubscriptionStatusResponse {
  string subscription_id = 1;
  WebhookSubscriptionStatus status = 2;
  google.protobuf.Timestamp last_updated = 3;
}

// Get Subscription Health Report Request
message GetSubscriptionHealthReportRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  bool include_recommendations = 4;
}

// Get Subscription Health Report Response
message GetSubscriptionHealthReportResponse {
  string subscription_id = 1;
  WebhookSubscriptionHealthReport report = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Monitor System Request
message MonitorSystemRequest {
  repeated string system_components = 1; // WEBHOOK_SERVICE, DELIVERY_SERVICE, MONITORING_SERVICE
  WebhookSystemMonitoringConfig config = 2;
}

// Monitor System Response
message MonitorSystemResponse {
  bool system_monitoring_enabled = 1;
  repeated string monitored_components = 2;
  google.protobuf.Timestamp monitoring_started_at = 3;
}

// Get System Status Request
message GetSystemStatusRequest {
  bool include_components = 1;
}

// Get System Status Response
message GetSystemStatusResponse {
  WebhookSystemStatus status = 1;
  repeated WebhookSystemComponent components = 2;
  google.protobuf.Timestamp last_updated = 3;
}

// Get System Health Report Request
message GetSystemHealthReportRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  bool include_recommendations = 3;
}

// Get System Health Report Response
message GetSystemHealthReportResponse {
  WebhookSystemHealthReport report = 1;
  google.protobuf.Timestamp generated_at = 2;
}

// Get Metrics Request
message GetMetricsRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string granularity = 4; // MINUTE, HOUR, DAY
  repeated string metric_types = 5;
}

// Get Metrics Response
message GetMetricsResponse {
  string subscription_id = 1;
  WebhookMetrics metrics = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Get Analytics Request
message GetAnalyticsRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string analysis_type = 4; // TREND, PATTERN, ANOMALY, CORRELATION
  map<string, string> analysis_parameters = 5;
}

// Get Analytics Response
message GetAnalyticsResponse {
  string subscription_id = 1;
  WebhookAnalytics analytics = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Get Trends Request
message GetTrendsRequest {
  string subscription_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string trend_type = 4; // DELIVERY_SUCCESS, ERROR_RATE, RESPONSE_TIME, VOLUME
  string granularity = 5; // HOUR, DAY, WEEK, MONTH
}

// Get Trends Response
message GetTrendsResponse {
  string subscription_id = 1;
  WebhookTrends trends = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Generate Report Request
message GenerateReportRequest {
  string subscription_id = 1;
  string report_type = 2; // DELIVERY_STATUS, PERFORMANCE, SLA_COMPLIANCE, HEALTH
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  string format = 5; // JSON, CSV, PDF, EXCEL
  map<string, string> report_parameters = 6;
}

// Generate Report Response
message GenerateReportResponse {
  string report_id = 1;
  string report_url = 2;
  google.protobuf.Timestamp generated_at = 3;
  string status = 4;
}

// Schedule Report Request
message ScheduleReportRequest {
  string subscription_id = 1;
  string report_type = 2;
  string schedule_cron = 3;
  repeated string recipients = 4;
  string format = 5;
  map<string, string> report_parameters = 6;
}

// Schedule Report Response
message ScheduleReportResponse {
  string schedule_id = 1;
  bool scheduled = 2;
  google.protobuf.Timestamp next_run_at = 3;
}

// Get Report Status Request
message GetReportStatusRequest {
  string report_id = 1;
}

// Get Report Status Response
message GetReportStatusResponse {
  string report_id = 1;
  string status = 2; // PENDING, GENERATING, COMPLETED, FAILED
  string report_url = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp completed_at = 5;
}

// Get Dashboard Request
message GetDashboardRequest {
  string subscription_id = 1;
  string dashboard_type = 2; // OVERVIEW, DELIVERY, PERFORMANCE, SLA, HEALTH
  repeated string widget_types = 3;
}

// Get Dashboard Response
message GetDashboardResponse {
  string subscription_id = 1;
  WebhookDashboard dashboard = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// Update Dashboard Request
message UpdateDashboardRequest {
  string subscription_id = 1;
  WebhookDashboard dashboard = 2;
}

// Update Dashboard Response
message UpdateDashboardResponse {
  string subscription_id = 1;
  bool dashboard_updated = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// Get Dashboard Widgets Request
message GetDashboardWidgetsRequest {
  string subscription_id = 1;
  string dashboard_type = 2;
}

// Get Dashboard Widgets Response
message GetDashboardWidgetsResponse {
  string subscription_id = 1;
  repeated WebhookDashboardWidget widgets = 2;
  int32 total_widgets = 3;
}

// Health Check Response
message HealthCheckResponse {
  string status = 1; // HEALTHY, DEGRADED, UNHEALTHY
  string version = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> details = 4;
}

// Supporting message types
message WebhookMonitoringConfiguration {
  // Monitoring settings
  bool enable_real_time_monitoring = 1;
  bool enable_historical_monitoring = 2;
  int32 monitoring_interval_seconds = 3;
  int32 data_retention_days = 4;
  
  // Alerting settings
  bool enable_alerting = 5;
  repeated string alert_channels = 6; // EMAIL, SMS, SLACK, WEBHOOK
  repeated string alert_recipients = 7;
  
  // Monitoring types
  repeated string monitoring_types = 8; // DELIVERY, PERFORMANCE, SLA, ENDPOINT, SYSTEM
  
  // Custom configuration
  map<string, string> custom_config = 9;
}

message WebhookDeliveryMonitoringConfig {
  bool monitor_delivery_status = 1;
  bool monitor_delivery_performance = 2;
  bool monitor_delivery_errors = 3;
  int32 monitoring_interval_seconds = 4;
  int32 alert_threshold_failures = 5;
  double alert_threshold_error_rate = 6;
}

message WebhookPerformanceMonitoringConfig {
  repeated string performance_metrics = 1; // RESPONSE_TIME, THROUGHPUT, ERROR_RATE, SUCCESS_RATE
  int32 monitoring_interval_seconds = 2;
  map<string, double> alert_thresholds = 3;
  bool enable_anomaly_detection = 4;
}

message WebhookEndpointMonitoringConfig {
  bool monitor_endpoint_health = 1;
  bool monitor_endpoint_performance = 2;
  bool monitor_endpoint_availability = 3;
  int32 health_check_interval_seconds = 4;
  int32 health_check_timeout_seconds = 5;
  int32 failure_threshold = 6;
}

message WebhookSubscriptionMonitoringConfig {
  bool monitor_subscription_status = 1;
  bool monitor_subscription_health = 2;
  bool monitor_subscription_performance = 3;
  int32 monitoring_interval_seconds = 4;
  map<string, double> alert_thresholds = 5;
}

message WebhookSystemMonitoringConfig {
  repeated string system_components = 1; // WEBHOOK_SERVICE, DELIVERY_SERVICE, MONITORING_SERVICE
  int32 monitoring_interval_seconds = 2;
  map<string, double> alert_thresholds = 3;
  bool enable_system_health_checks = 4;
}

message WebhookDeliveryStatusReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Delivery statistics
  int32 total_deliveries = 3;
  int32 successful_deliveries = 4;
  int32 failed_deliveries = 5;
  int32 timeout_deliveries = 6;
  int32 retry_deliveries = 7;
  double delivery_success_rate = 8;
  
  // Status distribution
  map<string, int32> status_distribution = 9;
  map<string, int32> error_type_distribution = 10;
  map<string, int32> endpoint_distribution = 11;
  
  // Performance metrics
  int64 average_delivery_time_ms = 12;
  int64 min_delivery_time_ms = 13;
  int64 max_delivery_time_ms = 14;
  int64 p50_delivery_time_ms = 15;
  int64 p90_delivery_time_ms = 16;
  int64 p95_delivery_time_ms = 17;
  int64 p99_delivery_time_ms = 18;
  
  // Time series data
  repeated WebhookDeliveryTimeSeries time_series = 19;
}

message WebhookDeliveryHealthReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Health status
  string overall_health = 3; // HEALTHY, DEGRADED, UNHEALTHY, CRITICAL
  double health_score = 4;
  
  // Health indicators
  repeated WebhookHealthIndicator health_indicators = 5;
  repeated WebhookHealthRecommendation recommendations = 6;
  
  // Health trends
  repeated WebhookHealthTrend health_trends = 7;
  
  // Health alerts
  repeated WebhookHealthAlert health_alerts = 8;
}

message WebhookFailureDetection {
  string detection_id = 1;
  string failure_type = 2; // DELIVERY_FAILURE, TIMEOUT, ERROR_RATE, SLA_VIOLATION
  string failure_description = 3;
  string failure_severity = 4; // LOW, MEDIUM, HIGH, CRITICAL
  
  // Failure details
  repeated string affected_deliveries = 5;
  repeated string affected_endpoints = 6;
  map<string, string> failure_metrics = 7;
  
  // Detection metadata
  google.protobuf.Timestamp detected_at = 8;
  string detection_method = 9;
  double confidence_score = 10;
  
  // Recommendations
  repeated string recommendations = 11;
  repeated string suggested_actions = 12;
}

message WebhookAlert {
  string alert_id = 1;
  string subscription_id = 2;
  string alert_type = 3; // DELIVERY_FAILURE, HIGH_ERROR_RATE, SLA_VIOLATION, SYSTEM_ERROR
  string alert_severity = 4; // LOW, MEDIUM, HIGH, CRITICAL
  string alert_title = 5;
  string alert_message = 6;
  string alert_description = 7;
  
  // Alert conditions
  map<string, string> alert_conditions = 8;
  map<string, string> alert_metrics = 9;
  
  // Alert status
  string alert_status = 10; // TRIGGERED, ACKNOWLEDGED, RESOLVED, SUPPRESSED
  bool is_active = 11;
  google.protobuf.Timestamp triggered_at = 12;
  google.protobuf.Timestamp acknowledged_at = 13;
  google.protobuf.Timestamp resolved_at = 14;
  
  // Alert recipients
  repeated string alert_recipients = 15;
  repeated string alert_channels = 16; // EMAIL, SMS, SLACK, WEBHOOK
  
  // Alert context
  map<string, string> alert_context = 17;
  map<string, string> alert_metadata = 18;
}

message WebhookPerformanceReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Performance metrics
  int64 average_response_time_ms = 3;
  int64 min_response_time_ms = 4;
  int64 max_response_time_ms = 5;
  int64 p50_response_time_ms = 6;
  int64 p90_response_time_ms = 7;
  int64 p95_response_time_ms = 8;
  int64 p99_response_time_ms = 9;
  
  // Throughput metrics
  double deliveries_per_second = 10;
  double deliveries_per_minute = 11;
  double deliveries_per_hour = 12;
  
  // Performance benchmarks
  WebhookPerformanceBenchmarks benchmarks = 13;
  
  // Performance trends
  repeated WebhookPerformanceTrend performance_trends = 14;
  
  // Performance recommendations
  repeated WebhookPerformanceRecommendation recommendations = 15;
}

message WebhookPerformanceMetrics {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Real-time metrics
  int32 current_deliveries_per_second = 3;
  int64 current_average_response_time_ms = 4;
  double current_error_rate = 5;
  double current_success_rate = 6;
  
  // Performance indicators
  bool is_performance_degraded = 7;
  bool is_throughput_limited = 8;
  bool is_response_time_high = 9;
  
  // Performance trends
  repeated WebhookPerformanceTimeSeries time_series = 10;
}

message WebhookSLA {
  string sla_id = 1;
  string sla_name = 2;
  string sla_type = 3; // DELIVERY_SUCCESS_RATE, RESPONSE_TIME, AVAILABILITY, ERROR_RATE
  double sla_target = 4;
  string sla_unit = 5; // PERCENTAGE, MILLISECONDS, SECONDS, COUNT
  int32 sla_period_seconds = 6;
  string sla_description = 7;
}

message WebhookSLAReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // SLA compliance
  repeated WebhookSLACompliance sla_compliance = 3;
  double overall_sla_compliance = 4;
  
  // SLA violations
  repeated WebhookSLAViolation sla_violations = 5;
  int32 total_violations = 6;
  
  // SLA trends
  repeated WebhookSLATrend sla_trends = 7;
}

message WebhookSLACompliance {
  string sla_id = 1;
  string sla_name = 2;
  string sla_type = 3;
  double sla_target = 4;
  double sla_actual = 5;
  bool sla_met = 6;
  double compliance_percentage = 7;
  int32 violations = 8;
}

message WebhookSLAViolation {
  string violation_id = 1;
  string sla_id = 2;
  string sla_name = 3;
  google.protobuf.Timestamp violation_time = 4;
  string violation_reason = 5;
  double sla_target = 6;
  double sla_actual = 7;
  string violation_severity = 8; // LOW, MEDIUM, HIGH, CRITICAL
}

message WebhookEndpointStatus {
  string endpoint_id = 1;
  string endpoint_name = 2;
  string status = 3; // HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN
  string health_status = 4;
  int32 response_time_ms = 5;
  double success_rate = 6;
  int32 error_count = 7;
  google.protobuf.Timestamp last_check = 8;
  google.protobuf.Timestamp last_success = 9;
  google.protobuf.Timestamp last_failure = 10;
}

message WebhookEndpointHealthReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Endpoint health
  repeated WebhookEndpointStatus endpoint_statuses = 3;
  int32 healthy_endpoints = 4;
  int32 unhealthy_endpoints = 5;
  int32 total_endpoints = 6;
  
  // Endpoint performance
  repeated WebhookEndpointPerformance endpoint_performances = 7;
  
  // Endpoint recommendations
  repeated WebhookEndpointRecommendation recommendations = 8;
}

message WebhookSubscriptionStatus {
  string subscription_id = 1;
  string status = 2; // ACTIVE, INACTIVE, SUSPENDED, ERROR
  string health_status = 3; // HEALTHY, DEGRADED, UNHEALTHY, CRITICAL
  int32 active_endpoints = 4;
  int32 failed_endpoints = 5;
  int32 total_deliveries = 6;
  int32 successful_deliveries = 7;
  int32 failed_deliveries = 8;
  double success_rate = 9;
  google.protobuf.Timestamp last_activity = 10;
  repeated string active_alerts = 11;
}

message WebhookSubscriptionHealthReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Subscription health
  string overall_health = 3;
  double health_score = 4;
  
  // Health indicators
  repeated WebhookHealthIndicator health_indicators = 5;
  
  // Health trends
  repeated WebhookHealthTrend health_trends = 6;
  
  // Health recommendations
  repeated WebhookHealthRecommendation recommendations = 7;
}

message WebhookSystemStatus {
  string overall_status = 1; // HEALTHY, DEGRADED, UNHEALTHY, CRITICAL
  double system_load = 2;
  int32 active_subscriptions = 3;
  int32 total_deliveries = 4;
  int32 failed_deliveries = 5;
  double system_success_rate = 6;
  google.protobuf.Timestamp last_updated = 7;
}

message WebhookSystemComponent {
  string component_name = 1;
  string component_type = 2; // WEBHOOK_SERVICE, DELIVERY_SERVICE, MONITORING_SERVICE
  string status = 3; // HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN
  string version = 4;
  google.protobuf.Timestamp last_check = 5;
  map<string, string> metrics = 6;
  repeated string errors = 7;
}

message WebhookSystemHealthReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // System health
  string overall_health = 3;
  double system_health_score = 4;
  
  // Component health
  repeated WebhookSystemComponent components = 5;
  
  // System performance
  WebhookSystemPerformance system_performance = 6;
  
  // System recommendations
  repeated WebhookSystemRecommendation recommendations = 7;
}

message WebhookMetrics {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Delivery metrics
  int32 total_deliveries = 3;
  int32 successful_deliveries = 4;
  int32 failed_deliveries = 5;
  double delivery_success_rate = 6;
  
  // Performance metrics
  int64 average_delivery_time_ms = 7;
  int64 average_response_time_ms = 8;
  double deliveries_per_second = 9;
  
  // Error metrics
  map<string, int32> error_type_counts = 10;
  map<string, int32> status_code_counts = 11;
  
  // Time series data
  repeated WebhookMetricsTimeSeries time_series = 12;
}

message WebhookAnalytics {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Analysis results
  string analysis_type = 3;
  map<string, string> analysis_results = 4;
  
  // Patterns and trends
  repeated WebhookPattern patterns = 5;
  repeated WebhookTrend trends = 6;
  
  // Anomalies
  repeated WebhookAnomaly anomalies = 7;
  
  // Correlations
  repeated WebhookCorrelation correlations = 8;
  
  // Insights
  repeated WebhookInsight insights = 9;
}

message WebhookTrends {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Trend data
  string trend_type = 3;
  repeated WebhookTrendDataPoint trend_data = 4;
  
  // Trend analysis
  string trend_direction = 5; // INCREASING, DECREASING, STABLE, VOLATILE
  double trend_slope = 6;
  double trend_confidence = 7;
  
  // Trend predictions
  repeated WebhookTrendPrediction predictions = 8;
}

message WebhookDashboard {
  string subscription_id = 1;
  string dashboard_type = 2;
  string dashboard_name = 3;
  repeated WebhookDashboardWidget widgets = 4;
