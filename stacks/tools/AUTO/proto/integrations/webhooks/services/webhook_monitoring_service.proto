  string widget_id = 1;
  string widget_type = 2; // METRIC, CHART, TABLE, ALERT, STATUS
  string widget_title = 3;
  string widget_data = 4;
  map<string, string> widget_config = 5;
  google.protobuf.Timestamp last_updated = 6;
}

