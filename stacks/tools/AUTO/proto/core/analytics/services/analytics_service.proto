syntax = "proto3";

package core.analytics.services;

import "core/analytics/messages/report.proto";
import "core/analytics/messages/analytics_event.proto";
import "core/analytics/enums/analytics_status.proto";
import "core/common/messages/timestamp.proto";

// AnalyticsService provides CRUD for reports, event ingestion, and report execution.
service AnalyticsService {
  // Create a new analytics report definition.
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse);

  // Retrieve a report by id.
  rpc GetReport(GetReportRequest) returns (GetReportResponse);

  // Update an existing report definition.
  rpc UpdateReport(UpdateReportRequest) returns (UpdateReportResponse);

  // Delete a report definition by id.
  rpc DeleteReport(DeleteReportRequest) returns (DeleteReportResponse);

  // List reports with optional filtering and pagination.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);

  // Execute a report immediately and return execution metadata.
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);

  // Stream analytics events to the backend in real-time.
  rpc StreamEvents(stream core.analytics.messages.AnalyticsEvent) returns (StreamEventsResponse);

  // Ingest a batch of analytics events in one request.
  rpc IngestEvents(IngestEventsRequest) returns (IngestEventsResponse);

  // Get execution history for a report.
  rpc GetReportHistory(GetReportHistoryRequest) returns (GetReportHistoryResponse);
}

// Requests and responses

message CreateReportRequest {
  core.analytics.messages.Report report = 1; // Report definition to create.
}

message CreateReportResponse {
  core.analytics.messages.Report report = 1; // Created report with id.
}

message GetReportRequest {
  string id = 1; // Report id.
}

message GetReportResponse {
  core.analytics.messages.Report report = 1; // Report definition.
}

message UpdateReportRequest {
  core.analytics.messages.Report report = 1; // Full or partial report; server may merge.
  bool allow_schedule_overwrite = 2; // Whether to overwrite schedule when present.
}

message UpdateReportResponse {
  core.analytics.messages.Report report = 1; // Updated report.
}

message DeleteReportRequest {
  string id = 1; // Report id to delete.
}

message DeleteReportResponse {
  bool success = 1; // Whether deletion was successful.
}

message ListReportsRequest {
  int32 page_size = 1; // Page size.
  string page_token = 2; // Page token.
  string owner_id = 3; // Filter by owner.
  string query = 4; // Free-text search over name/description.
}

message ListReportsResponse {
  repeated core.analytics.messages.Report reports = 1; // Page of reports.
  string next_page_token = 2; // Token for next page, if any.
}

message GenerateReportRequest {
  string id = 1; // Report id to execute.
  // Optional override time range for this execution.
  core.analytics.messages.Report.TimeRange time_range_override = 2;
}

message GenerateReportResponse {
  string execution_id = 1; // Unique execution id.
  core.analytics.enums.AnalyticsStatus status = 2; // Initial status.
}

message StreamEventsResponse {
  int64 accepted = 1; // Count of events successfully accepted in the stream.
}

message IngestEventsRequest {
  repeated core.analytics.messages.AnalyticsEvent events = 1; // Events batch.
}

message IngestEventsResponse {
  int64 accepted = 1; // Count of accepted events.
  int64 rejected = 2; // Count of rejected events.
}

message GetReportHistoryRequest {
  string id = 1; // Report id.
  int32 limit = 2; // Max number of executions to return.
}

message GetReportHistoryResponse {
  repeated core.analytics.messages.Report.ReportResult executions = 1; // Historical executions.
}


