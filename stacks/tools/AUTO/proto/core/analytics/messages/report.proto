syntax = "proto3";

package core.analytics.messages;

import "core/analytics/enums/report_type.proto";
import "core/analytics/enums/analytics_status.proto";
import "core/analytics/enums/metric_type.proto";
import "core/common/messages/timestamp.proto"; // core.common.messages.Timestamp
import "core/common/messages/money.proto";      // core.common.messages.Money
import "core/common/messages/location.proto";   // core.common.messages.Location

// Report defines an analytics report configuration and its lifecycle state.
message Report {
  // Unique report identifier.
  string id = 1;

  // Human-readable report name.
  string name = 2;

  // Optional longer description.
  string description = 3;

  // Report category/type.
  core.analytics.enums.ReportType type = 4;

  // Current lifecycle status for the most recent execution.
  core.analytics.enums.AnalyticsStatus status = 5;

  // User ID of the owner/creator of the report.
  string owner_id = 6;

  // Time the report definition was created.
  core.common.messages.Timestamp created_at = 7;

  // Time the report definition was last updated.
  core.common.messages.Timestamp updated_at = 8;

  // Arbitrary metadata for external references or tags.
  map<string, string> metadata = 9;

  // The time range over which this report executes.
  TimeRange time_range = 10;

  // Dimensions to group by (e.g., country, platform, plan).
  repeated string dimensions = 11;

  // Metrics selected to compute in this report.
  repeated SelectedMetric metrics = 12;

  // Filter expressions applied before aggregation.
  repeated Filter filters = 13;

  // Optional scheduling configuration for recurring reports.
  Schedule schedule = 14;

  // Optional pre-defined visualization presets.
  Visualization visualization = 15;

  // Export preferences like format and delivery.
  ExportOptions export = 16;

  // A link to the latest successful result, if any.
  ReportResult latest_result = 17;

  // Nested types
  message TimeRange {
    // Inclusive start timestamp.
    core.common.messages.Timestamp start = 1;
    // Exclusive end timestamp.
    core.common.messages.Timestamp end = 2;
    // Optional shorthand like "LAST_7_DAYS", "MTD".
    string preset = 3;
  }

  // SelectedMetric binds a MetricType to an optional alias and params.
  message SelectedMetric {
    core.analytics.enums.MetricType type = 1;
    string alias = 2; // Display name for the metric in outputs.
    // Optional percentile value when type is PERCENTILE (e.g., 90 for p90).
    int32 percentile = 3;
  }

  // Basic key/value filter, optionally scoped to a dimension.
  message Filter {
    string field = 1;   // Field or dimension name, e.g., "country".
    string op = 2;      // Operator, e.g., EQ, NEQ, GT, CONTAINS.
    string value = 3;   // Value in string form; server casts as needed.
  }

  // Schedule configuration for recurring reports.
  message Schedule {
    bool enabled = 1;         // Whether the schedule is active.
    string cron = 2;          // Cron expression in UTC.
    string timezone = 3;      // IANA timezone, e.g., "UTC", "America/NYC".
    // Max historical backfill window when first enabling schedule.
    string backfill_preset = 4;
  }

  // Visualization preferences for charts/tables.
  message Visualization {
    string chart_type = 1;    // e.g., "TABLE", "LINE", "BAR", "PIE".
    string theme = 2;         // e.g., "LIGHT", "DARK".
    bool stacked = 3;         // Whether bars/areas are stacked.
    bool cumulative = 4;      // Whether series are cumulative.
  }

  // Export options for report outputs.
  message ExportOptions {
    string format = 1;        // e.g., "CSV", "JSON", "PDF", "XLSX".
    bool include_header = 2;  // Include header row for tabular formats.
    repeated string emails = 3; // Email recipients for delivery.
    string delivery_channel = 4; // e.g., "EMAIL", "WEBHOOK", "S3".
  }

  // ReportResult summarizes an execution output of a report.
  message ReportResult {
    string execution_id = 1;  // Unique ID for the execution run.
    core.analytics.enums.AnalyticsStatus status = 2; // Final status.
    core.common.messages.Timestamp started_at = 3;
    core.common.messages.Timestamp ended_at = 4;
    // URI to the exported artifact (e.g., s3://bucket/key.csv).
    string artifact_uri = 5;
    // Optional snapshot of headline metrics.
    repeated MetricPoint highlights = 6;
    // Row count in the exported artifact, if known.
    int64 row_count = 7;
  }

  // MetricPoint is a simple numeric value identified by an alias.
  message MetricPoint {
    string alias = 1;   // Alias from SelectedMetric.alias or generated name.
    double value = 2;   // Numeric value.
  }
}


