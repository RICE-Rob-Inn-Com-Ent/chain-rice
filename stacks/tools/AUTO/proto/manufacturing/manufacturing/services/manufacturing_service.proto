syntax = "proto3";

package manufacturing.manufacturing.services;

import "manufacturing/manufacturing/messages/manufacturing_request.proto";
import "manufacturing/manufacturing/messages/manufacturing_response.proto";

// Manufacturing Service
// Provides comprehensive manufacturing order management capabilities
// including CRUD operations, process control, and monitoring
service ManufacturingService {
  
  // Create a new manufacturing order
  // Creates a new manufacturing order with specified product, quantity, and requirements
  rpc CreateManufacturingOrder(manufacturing.manufacturing.messages.CreateManufacturingOrderRequest)
      returns (manufacturing.manufacturing.messages.CreateManufacturingOrderResponse);
  
  // Get a specific manufacturing order by ID
  // Retrieves detailed information about a manufacturing order
  rpc GetManufacturingOrder(manufacturing.manufacturing.messages.GetManufacturingOrderRequest)
      returns (manufacturing.manufacturing.messages.GetManufacturingOrderResponse);
  
  // List manufacturing orders with filtering and pagination
  // Retrieves a paginated list of manufacturing orders with optional filtering
  rpc ListManufacturingOrders(manufacturing.manufacturing.messages.ListManufacturingOrdersRequest)
      returns (manufacturing.manufacturing.messages.ListManufacturingOrdersResponse);
  
  // Update an existing manufacturing order
  // Updates manufacturing order details including status, quantity, and requirements
  rpc UpdateManufacturingOrder(manufacturing.manufacturing.messages.UpdateManufacturingOrderRequest)
      returns (manufacturing.manufacturing.messages.UpdateManufacturingOrderResponse);
  
  // Delete a manufacturing order
  // Removes a manufacturing order from the system
  rpc DeleteManufacturingOrder(manufacturing.manufacturing.messages.DeleteManufacturingOrderRequest)
      returns (manufacturing.manufacturing.messages.DeleteManufacturingOrderResponse);
  
  // Start a manufacturing process
  // Initiates the manufacturing process for a specific order
  rpc StartManufacturingProcess(manufacturing.manufacturing.messages.StartManufacturingProcessRequest)
      returns (manufacturing.manufacturing.messages.StartManufacturingProcessResponse);
  
  // Pause a manufacturing process
  // Temporarily pauses an active manufacturing process
  rpc PauseManufacturingProcess(manufacturing.manufacturing.messages.PauseManufacturingProcessRequest)
      returns (manufacturing.manufacturing.messages.PauseManufacturingProcessResponse);
  
  // Resume a manufacturing process
  // Resumes a previously paused manufacturing process
  rpc ResumeManufacturingProcess(manufacturing.manufacturing.messages.ResumeManufacturingProcessRequest)
      returns (manufacturing.manufacturing.messages.ResumeManufacturingProcessResponse);
}
