syntax = "proto3";

package manufacturing.manufacturing.messages;

import "google/protobuf/timestamp.proto";
import "manufacturing/manufacturing/enums/status.proto";

// Response message for creating a manufacturing order
message CreateManufacturingOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if creation failed
  string error_message = 2;
  
  // Created manufacturing order details
  ManufacturingOrder order = 3;
}

// Response message for retrieving a manufacturing order
message GetManufacturingOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if retrieval failed
  string error_message = 2;
  
  // Manufacturing order details
  ManufacturingOrder order = 3;
}

// Response message for listing manufacturing orders
message ListManufacturingOrdersResponse {
  // Success status
  bool success = 1;
  
  // Error message if listing failed
  string error_message = 2;
  
  // List of manufacturing orders
  repeated ManufacturingOrder orders = 3;
  
  // Total count of orders matching the filter
  int32 total_count = 4;
  
  // Current page number
  int32 current_page = 5;
  
  // Total number of pages
  int32 total_pages = 6;
}

// Response message for updating a manufacturing order
message UpdateManufacturingOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if update failed
  string error_message = 2;
  
  // Updated manufacturing order details
  ManufacturingOrder order = 3;
}

// Response message for deleting a manufacturing order
message DeleteManufacturingOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if deletion failed
  string error_message = 2;
}

// Response message for starting a manufacturing process
message StartManufacturingProcessResponse {
  // Success status
  bool success = 1;
  
  // Error message if start failed
  string error_message = 2;
  
  // Process identifier
  string process_id = 3;
  
  // Started manufacturing order details
  ManufacturingOrder order = 4;
}

// Response message for pausing a manufacturing process
message PauseManufacturingProcessResponse {
  // Success status
  bool success = 1;
  
  // Error message if pause failed
  string error_message = 2;
  
  // Paused manufacturing order details
  ManufacturingOrder order = 3;
}

// Response message for resuming a manufacturing process
message ResumeManufacturingProcessResponse {
  // Success status
  bool success = 1;
  
  // Error message if resume failed
  string error_message = 2;
  
  // Resumed manufacturing order details
  ManufacturingOrder order = 3;
}

// Manufacturing order data structure
message ManufacturingOrder {
  // Unique identifier
  string order_id = 1;
  
  // Product identifier
  string product_id = 2;
  
  // Product name
  string product_name = 3;
  
  // Quantity to manufacture
  int32 quantity = 4;
  
  // Current status
  manufacturing.manufacturing.enums.ManufacturingStatus status = 5;
  
  // Priority level
  manufacturing.manufacturing.enums.WorkOrderPriority priority = 6;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 7;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 8;
  
  // Target completion date
  google.protobuf.Timestamp target_completion_date = 9;
  
  // Actual completion date
  google.protobuf.Timestamp actual_completion_date = 10;
  
  // Production line identifier
  string production_line_id = 11;
  
  // Production line name
  string production_line_name = 12;
  
  // Current operator identifier
  string current_operator_id = 13;
  
  // Current operator name
  string current_operator_name = 14;
  
  // Progress percentage (0-100)
  int32 progress_percentage = 15;
  
  // Notes and specifications
  string notes = 16;
  
  // Material requirements
  repeated MaterialRequirement materials = 17;
  
  // Quality requirements
  QualityRequirement quality_requirements = 18;
  
  // Quality inspection results
  repeated QualityInspectionResult quality_inspections = 19;
  
  // Manufacturing steps
  repeated ManufacturingStep steps = 20;
  
  // Cost breakdown
  CostBreakdown cost_breakdown = 21;
}

// Material requirement details
message MaterialRequirement {
  // Material identifier
  string material_id = 1;
  
  // Material name
  string material_name = 2;
  
  // Required quantity
  int32 quantity = 3;
  
  // Unit of measurement
  string unit = 4;
  
  // Whether this material is critical
  bool is_critical = 5;
  
  // Supplier identifier
  string supplier_id = 6;
  
  // Supplier name
  string supplier_name = 7;
  
  // Material cost per unit
  double unit_cost = 8;
  
  // Total material cost
  double total_cost = 9;
  
  // Availability status
  string availability_status = 10;
}

// Quality requirement details
message QualityRequirement {
  // Quality level required
  string quality_level = 1;
  
  // Inspection points
  repeated string inspection_points = 2;
  
  // Tolerance specifications
  map<string, double> tolerances = 3;
  
  // Testing requirements
  repeated string test_requirements = 4;
  
  // Documentation requirements
  repeated string documentation_requirements = 5;
  
  // Quality standards
  repeated string quality_standards = 6;
}

// Quality inspection result
message QualityInspectionResult {
  // Inspection identifier
  string inspection_id = 1;
  
  // Inspection point
  string inspection_point = 2;
  
  // Inspector identifier
  string inspector_id = 3;
  
  // Inspector name
  string inspector_name = 4;
  
  // Inspection timestamp
  google.protobuf.Timestamp inspection_time = 5;
  
  // Pass/fail status
  bool passed = 6;
  
  // Inspection notes
  string notes = 7;
  
  // Measured values
  map<string, double> measured_values = 8;
  
  // Tolerance compliance
  map<string, bool> tolerance_compliance = 9;
}

// Manufacturing step details
message ManufacturingStep {
  // Step identifier
  string step_id = 1;
  
  // Step name
  string step_name = 2;
  
  // Step description
  string description = 3;
  
  // Step order
  int32 step_order = 4;
  
  // Estimated duration in minutes
  int32 estimated_duration_minutes = 5;
  
  // Actual duration in minutes
  int32 actual_duration_minutes = 6;
  
  // Step status
  string status = 7;
  
  // Start timestamp
  google.protobuf.Timestamp started_at = 8;
  
  // Completion timestamp
  google.protobuf.Timestamp completed_at = 9;
  
  // Operator identifier
  string operator_id = 10;
  
  // Operator name
  string operator_name = 11;
  
  // Equipment used
  string equipment_id = 12;
  
  // Equipment name
  string equipment_name = 13;
  
  // Step notes
  string notes = 14;
}

// Cost breakdown details
message CostBreakdown {
  // Material costs
  double material_costs = 1;
  
  // Labor costs
  double labor_costs = 2;
  
  // Equipment costs
  double equipment_costs = 3;
  
  // Overhead costs
  double overhead_costs = 4;
  
  // Quality inspection costs
  double quality_costs = 5;
  
  // Total cost
  double total_cost = 6;
  
  // Cost per unit
  double cost_per_unit = 7;
  
  // Currency code
  string currency = 8;
}
