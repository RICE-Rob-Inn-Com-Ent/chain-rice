syntax = "proto3";

package manufacturing.suppliers.messages;

import "google/protobuf/timestamp.proto";
import "manufacturing/suppliers/enums/supplier_type.proto";

// Request message for creating a new supplier
message CreateSupplierRequest {
  // Supplier name
  string name = 1;
  
  // Supplier code
  string supplier_code = 2;
  
  // Supplier type
  manufacturing.suppliers.enums.SupplierType supplier_type = 3;
  
  // Company information
  CompanyInfo company_info = 4;
  
  // Contact information
  ContactInfo contact_info = 5;
  
  // Address information
  AddressInfo address_info = 6;
  
  // Business information
  BusinessInfo business_info = 7;
  
  // Quality certifications
  repeated QualityCertification certifications = 8;
  
  // Payment terms
  manufacturing.suppliers.enums.PaymentTerms payment_terms = 9;
  
  // Credit limit
  double credit_limit = 10;
  
  // Currency code
  string currency = 11;
  
  // Supplier relationship type
  manufacturing.suppliers.enums.SupplierRelationshipType relationship_type = 12;
  
  // Risk level
  manufacturing.suppliers.enums.SupplierRiskLevel risk_level = 13;
  
  // Additional notes
  string notes = 14;
  
  // Created by
  string created_by = 15;
}

// Request message for retrieving a supplier
message GetSupplierRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
}

// Request message for listing suppliers
message ListSuppliersRequest {
  // Page number for pagination
  int32 page = 1;
  
  // Number of items per page
  int32 page_size = 2;
  
  // Filter by status
  manufacturing.suppliers.enums.SupplierStatus status = 3;
  
  // Filter by supplier type
  manufacturing.suppliers.enums.SupplierType supplier_type = 4;
  
  // Filter by relationship type
  manufacturing.suppliers.enums.SupplierRelationshipType relationship_type = 5;
  
  // Filter by risk level
  manufacturing.suppliers.enums.SupplierRiskLevel risk_level = 6;
  
  // Filter by performance rating
  manufacturing.suppliers.enums.SupplierPerformanceRating performance_rating = 7;
  
  // Filter by country
  string country = 8;
  
  // Filter by certification status
  manufacturing.suppliers.enums.SupplierCertificationStatus certification_status = 9;
  
  // Search by name or code
  string search_term = 10;
}

// Request message for updating a supplier
message UpdateSupplierRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Updated supplier name
  string name = 2;
  
  // Updated supplier code
  string supplier_code = 3;
  
  // Updated supplier type
  manufacturing.suppliers.enums.SupplierType supplier_type = 4;
  
  // Updated company information
  CompanyInfo company_info = 5;
  
  // Updated contact information
  ContactInfo contact_info = 6;
  
  // Updated address information
  AddressInfo address_info = 7;
  
  // Updated business information
  BusinessInfo business_info = 8;
  
  // Updated quality certifications
  repeated QualityCertification certifications = 9;
  
  // Updated payment terms
  manufacturing.suppliers.enums.PaymentTerms payment_terms = 10;
  
  // Updated credit limit
  double credit_limit = 11;
  
  // Updated currency code
  string currency = 12;
  
  // Updated supplier relationship type
  manufacturing.suppliers.enums.SupplierRelationshipType relationship_type = 13;
  
  // Updated risk level
  manufacturing.suppliers.enums.SupplierRiskLevel risk_level = 14;
  
  // Updated notes
  string notes = 15;
  
  // Updated by
  string updated_by = 16;
}

// Request message for deleting a supplier
message DeleteSupplierRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Deletion reason
  string reason = 2;
  
  // Deleted by
  string deleted_by = 3;
}

// Request message for approving a supplier
message ApproveSupplierRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Approver identifier
  string approver_id = 2;
  
  // Approval comments
  string comments = 3;
  
  // Approved supplier relationship type
  manufacturing.suppliers.enums.SupplierRelationshipType relationship_type = 4;
  
  // Approved credit limit
  double credit_limit = 5;
}

// Request message for rejecting a supplier
message RejectSupplierRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Rejector identifier
  string rejector_id = 2;
  
  // Rejection reason
  string reason = 3;
  
  // Additional comments
  string comments = 4;
}

// Request message for suspending a supplier
message SuspendSupplierRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Suspension reason
  string reason = 2;
  
  // Suspension duration in days
  int32 suspension_duration_days = 3;
  
  // Suspended by
  string suspended_by = 4;
  
  // Additional comments
  string comments = 5;
}

// Request message for reactivating a supplier
message ReactivateSupplierRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Reactivation reason
  string reason = 2;
  
  // Reactivated by
  string reactivated_by = 3;
  
  // Additional comments
  string comments = 4;
}

// Request message for updating supplier performance
message UpdateSupplierPerformanceRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Performance rating
  manufacturing.suppliers.enums.SupplierPerformanceRating performance_rating = 2;
  
  // Performance score (0-100)
  double performance_score = 3;
  
  // Performance metrics
  map<string, double> performance_metrics = 4;
  
  // Performance comments
  string comments = 5;
  
  // Evaluation period start
  google.protobuf.Timestamp evaluation_period_start = 6;
  
  // Evaluation period end
  google.protobuf.Timestamp evaluation_period_end = 7;
  
  // Evaluated by
  string evaluated_by = 8;
}

// Request message for adding supplier certification
message AddSupplierCertificationRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Certification details
  QualityCertification certification = 2;
  
  // Added by
  string added_by = 3;
}

// Request message for updating supplier certification
message UpdateSupplierCertificationRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Certification identifier
  string certification_id = 2;
  
  // Updated certification details
  QualityCertification certification = 3;
  
  // Updated by
  string updated_by = 4;
}

// Request message for removing supplier certification
message RemoveSupplierCertificationRequest {
  // Unique identifier of the supplier
  string supplier_id = 1;
  
  // Certification identifier
  string certification_id = 2;
  
  // Removal reason
  string reason = 3;
  
  // Removed by
  string removed_by = 4;
}

// Company information
message CompanyInfo {
  // Legal company name
  string legal_name = 1;
  
  // Trading name
  string trading_name = 2;
  
  // Company registration number
  string registration_number = 3;
  
  // Tax identification number
  string tax_id = 4;
  
  // Industry sector
  string industry_sector = 5;
  
  // Company size
  string company_size = 6;
  
  // Year established
  int32 year_established = 7;
  
  // Website URL
  string website = 8;
  
  // Parent company
  string parent_company = 9;
  
  // Subsidiaries
  repeated string subsidiaries = 10;
}

// Contact information
message ContactInfo {
  // Primary contact person
  string primary_contact = 1;
  
  // Primary contact title
  string primary_contact_title = 2;
  
  // Primary contact email
  string primary_contact_email = 3;
  
  // Primary contact phone
  string primary_contact_phone = 4;
  
  // Secondary contact person
  string secondary_contact = 5;
  
  // Secondary contact title
  string secondary_contact_title = 6;
  
  // Secondary contact email
  string secondary_contact_email = 7;
  
  // Secondary contact phone
  string secondary_contact_phone = 8;
  
  // General email
  string general_email = 9;
  
  // General phone
  string general_phone = 10;
  
  // Fax number
  string fax = 11;
}

// Address information
message AddressInfo {
  // Billing address
  Address billing_address = 1;
  
  // Shipping address
  Address shipping_address = 2;
  
  // Manufacturing address
  Address manufacturing_address = 3;
  
  // Office address
  Address office_address = 4;
  
  // Warehouse address
  Address warehouse_address = 5;
}

// Address details
message Address {
  // Street address
  string street = 1;
  
  // City
  string city = 2;
  
  // State or province
  string state = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Country
  string country = 5;
  
  // Address type
  string address_type = 6;
}

// Business information
message BusinessInfo {
  // Annual revenue
  double annual_revenue = 1;
  
  // Currency code
  string currency = 2;
  
  // Number of employees
  int32 employee_count = 3;
  
  // Business model
  string business_model = 4;
  
  // Key products or services
  repeated string key_products_services = 5;
  
  // Target markets
  repeated string target_markets = 6;
  
  // Competitive advantages
  repeated string competitive_advantages = 7;
  
  // Financial stability rating
  string financial_stability_rating = 8;
  
  // Credit rating
  string credit_rating = 9;
}

// Quality certification
message QualityCertification {
  // Certification identifier
  string certification_id = 1;
  
  // Certification name
  string certification_name = 2;
  
  // Certification body
  string certification_body = 3;
  
  // Certification number
  string certification_number = 4;
  
  // Issue date
  google.protobuf.Timestamp issue_date = 5;
  
  // Expiry date
  google.protobuf.Timestamp expiry_date = 6;
  
  // Certification status
  manufacturing.suppliers.enums.SupplierCertificationStatus status = 7;
  
  // Scope of certification
  string scope = 8;
  
  // Certification standard
  string standard = 9;
  
  // Additional notes
  string notes = 10;
}
