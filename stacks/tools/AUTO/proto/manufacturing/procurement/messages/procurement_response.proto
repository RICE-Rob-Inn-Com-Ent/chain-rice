syntax = "proto3";

package manufacturing.procurement.messages;

import "google/protobuf/timestamp.proto";
import "manufacturing/procurement/enums/procurement_type.proto";

// Response message for creating a procurement request
message CreateProcurementRequestResponse {
  // Success status
  bool success = 1;
  
  // Error message if creation failed
  string error_message = 2;
  
  // Created procurement request details
  ProcurementRequest request = 3;
}

// Response message for retrieving a procurement request
message GetProcurementRequestResponse {
  // Success status
  bool success = 1;
  
  // Error message if retrieval failed
  string error_message = 2;
  
  // Procurement request details
  ProcurementRequest request = 3;
}

// Response message for listing procurement requests
message ListProcurementRequestsResponse {
  // Success status
  bool success = 1;
  
  // Error message if listing failed
  string error_message = 2;
  
  // List of procurement requests
  repeated ProcurementRequest requests = 3;
  
  // Total count of requests matching the filter
  int32 total_count = 4;
  
  // Current page number
  int32 current_page = 5;
  
  // Total number of pages
  int32 total_pages = 6;
}

// Response message for updating a procurement request
message UpdateProcurementRequestResponse {
  // Success status
  bool success = 1;
  
  // Error message if update failed
  string error_message = 2;
  
  // Updated procurement request details
  ProcurementRequest request = 3;
}

// Response message for deleting a procurement request
message DeleteProcurementRequestResponse {
  // Success status
  bool success = 1;
  
  // Error message if deletion failed
  string error_message = 2;
}

// Response message for approving a procurement request
message ApproveProcurementRequestResponse {
  // Success status
  bool success = 1;
  
  // Error message if approval failed
  string error_message = 2;
  
  // Approved procurement request details
  ProcurementRequest request = 3;
}

// Response message for rejecting a procurement request
message RejectProcurementRequestResponse {
  // Success status
  bool success = 1;
  
  // Error message if rejection failed
  string error_message = 2;
  
  // Rejected procurement request details
  ProcurementRequest request = 3;
}

// Response message for creating a purchase order
message CreatePurchaseOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if creation failed
  string error_message = 2;
  
  // Created purchase order details
  PurchaseOrder purchase_order = 3;
}

// Response message for retrieving a purchase order
message GetPurchaseOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if retrieval failed
  string error_message = 2;
  
  // Purchase order details
  PurchaseOrder purchase_order = 3;
}

// Response message for listing purchase orders
message ListPurchaseOrdersResponse {
  // Success status
  bool success = 1;
  
  // Error message if listing failed
  string error_message = 2;
  
  // List of purchase orders
  repeated PurchaseOrder purchase_orders = 3;
  
  // Total count of purchase orders matching the filter
  int32 total_count = 4;
  
  // Current page number
  int32 current_page = 5;
  
  // Total number of pages
  int32 total_pages = 6;
}

// Response message for updating a purchase order
message UpdatePurchaseOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if update failed
  string error_message = 2;
  
  // Updated purchase order details
  PurchaseOrder purchase_order = 3;
}

// Response message for cancelling a purchase order
message CancelPurchaseOrderResponse {
  // Success status
  bool success = 1;
  
  // Error message if cancellation failed
  string error_message = 2;
  
  // Cancelled purchase order details
  PurchaseOrder purchase_order = 3;
}

// Procurement request data structure
message ProcurementRequest {
  // Unique identifier
  string request_id = 1;
  
  // Material or service identifier
  string item_id = 2;
  
  // Item name
  string item_name = 3;
  
  // Item description
  string description = 4;
  
  // Quantity required
  int32 quantity = 5;
  
  // Unit of measurement
  string unit = 6;
  
  // Procurement type
  manufacturing.procurement.enums.ProcurementType procurement_type = 7;
  
  // Current status
  manufacturing.procurement.enums.ProcurementStatus status = 8;
  
  // Priority level
  string priority = 9;
  
  // Required delivery date
  google.protobuf.Timestamp required_delivery_date = 10;
  
  // Budget limit
  double budget_limit = 11;
  
  // Currency code
  string currency = 12;
  
  // Preferred suppliers
  repeated string preferred_supplier_ids = 13;
  
  // Technical specifications
  map<string, string> technical_specifications = 14;
  
  // Quality requirements
  string quality_requirements = 15;
  
  // Additional notes
  string notes = 16;
  
  // Requestor identifier
  string requestor_id = 17;
  
  // Requestor name
  string requestor_name = 18;
  
  // Department identifier
  string department_id = 19;
  
  // Department name
  string department_name = 20;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 21;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 22;
  
  // Approval timestamp
  google.protobuf.Timestamp approved_at = 23;
  
  // Approver identifier
  string approver_id = 24;
  
  // Approver name
  string approver_name = 25;
  
  // Approval comments
  string approval_comments = 26;
  
  // Approved budget
  double approved_budget = 27;
  
  // Associated purchase orders
  repeated string purchase_order_ids = 28;
  
  // Total cost
  double total_cost = 29;
  
  // Cost per unit
  double cost_per_unit = 30;
}

// Purchase order data structure
message PurchaseOrder {
  // Unique identifier
  string purchase_order_id = 1;
  
  // Purchase order number
  string purchase_order_number = 2;
  
  // Procurement request identifier
  string procurement_request_id = 3;
  
  // Supplier identifier
  string supplier_id = 4;
  
  // Supplier name
  string supplier_name = 5;
  
  // Current status
  manufacturing.procurement.enums.PurchaseOrderStatus status = 6;
  
  // Items to be purchased
  repeated PurchaseOrderItem items = 7;
  
  // Payment terms
  manufacturing.procurement.enums.PaymentTerms payment_terms = 8;
  
  // Delivery terms
  string delivery_terms = 9;
  
  // Shipping address
  Address shipping_address = 10;
  
  // Billing address
  Address billing_address = 11;
  
  // Additional terms and conditions
  string terms_and_conditions = 12;
  
  // Expected delivery date
  google.protobuf.Timestamp expected_delivery_date = 13;
  
  // Actual delivery date
  google.protobuf.Timestamp actual_delivery_date = 14;
  
  // Created by
  string created_by = 15;
  
  // Created by name
  string created_by_name = 16;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 17;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 18;
  
  // Total amount
  double total_amount = 19;
  
  // Currency code
  string currency = 20;
  
  // Tax amount
  double tax_amount = 21;
  
  // Shipping cost
  double shipping_cost = 22;
  
  // Discount amount
  double discount_amount = 23;
  
  // Final amount
  double final_amount = 24;
  
  // Invoice number
  string invoice_number = 25;
  
  // Invoice date
  google.protobuf.Timestamp invoice_date = 26;
  
  // Payment status
  string payment_status = 27;
  
  // Payment date
  google.protobuf.Timestamp payment_date = 28;
  
  // Delivery tracking number
  string tracking_number = 29;
  
  // Delivery status
  string delivery_status = 30;
  
  // Quality inspection status
  string quality_inspection_status = 31;
  
  // Quality inspection date
  google.protobuf.Timestamp quality_inspection_date = 32;
  
  // Quality inspection results
  string quality_inspection_results = 33;
  
  // Cancellation reason
  string cancellation_reason = 34;
  
  // Cancelled by
  string cancelled_by = 35;
  
  // Cancellation date
  google.protobuf.Timestamp cancelled_at = 36;
}

// Purchase order item details
message PurchaseOrderItem {
  // Item identifier
  string item_id = 1;
  
  // Item name
  string item_name = 2;
  
  // Item description
  string description = 3;
  
  // Quantity
  int32 quantity = 4;
  
  // Unit of measurement
  string unit = 5;
  
  // Unit price
  double unit_price = 6;
  
  // Total price
  double total_price = 7;
  
  // Currency code
  string currency = 8;
  
  // Technical specifications
  map<string, string> technical_specifications = 9;
  
  // Quality requirements
  string quality_requirements = 10;
  
  // Expected delivery date
  google.protobuf.Timestamp expected_delivery_date = 11;
  
  // Actual delivery date
  google.protobuf.Timestamp actual_delivery_date = 12;
  
  // Received quantity
  int32 received_quantity = 13;
  
  // Pending quantity
  int32 pending_quantity = 14;
  
  // Quality inspection status
  string quality_inspection_status = 15;
  
  // Quality inspection results
  string quality_inspection_results = 16;
}

// Address information
message Address {
  // Street address
  string street = 1;
  
  // City
  string city = 2;
  
  // State or province
  string state = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Country
  string country = 5;
  
  // Contact person
  string contact_person = 6;
  
  // Phone number
  string phone = 7;
  
  // Email address
  string email = 8;
}
