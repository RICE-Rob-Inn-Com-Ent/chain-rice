syntax = "proto3";

package manufacturing.quality.services;

import "manufacturing/quality/messages/quality_request.proto";
import "manufacturing/quality/messages/quality_response.proto";

// Quality Service
// Provides comprehensive quality management capabilities
// including inspection management, quality control, and corrective action tracking
service QualityService {
  
  // Create a new quality inspection
  // Creates a new quality inspection for products, materials, or processes
  rpc CreateQualityInspection(manufacturing.quality.messages.CreateQualityInspectionRequest)
      returns (manufacturing.quality.messages.CreateQualityInspectionResponse);
  
  // Get a specific quality inspection by ID
  // Retrieves detailed information about a quality inspection
  rpc GetQualityInspection(manufacturing.quality.messages.GetQualityInspectionRequest)
      returns (manufacturing.quality.messages.GetQualityInspectionResponse);
  
  // List quality inspections with filtering and pagination
  // Retrieves a paginated list of quality inspections with optional filtering
  rpc ListQualityInspections(manufacturing.quality.messages.ListQualityInspectionsRequest)
      returns (manufacturing.quality.messages.ListQualityInspectionsResponse);
  
  // Update an existing quality inspection
  // Updates quality inspection details including inspection points and requirements
  rpc UpdateQualityInspection(manufacturing.quality.messages.UpdateQualityInspectionRequest)
      returns (manufacturing.quality.messages.UpdateQualityInspectionResponse);
  
  // Delete a quality inspection
  // Removes a quality inspection from the system
  rpc DeleteQualityInspection(manufacturing.quality.messages.DeleteQualityInspectionRequest)
      returns (manufacturing.quality.messages.DeleteQualityInspectionResponse);
  
  // Start a quality inspection
  // Initiates the quality inspection process
  rpc StartQualityInspection(manufacturing.quality.messages.StartQualityInspectionRequest)
      returns (manufacturing.quality.messages.StartQualityInspectionResponse);
  
  // Complete a quality inspection
  // Completes the quality inspection with results and findings
  rpc CompleteQualityInspection(manufacturing.quality.messages.CompleteQualityInspectionRequest)
      returns (manufacturing.quality.messages.CompleteQualityInspectionResponse);
  
  // Create a quality action
  // Creates a corrective or preventive action based on quality findings
  rpc CreateQualityAction(manufacturing.quality.messages.CreateQualityActionRequest)
      returns (manufacturing.quality.messages.CreateQualityActionResponse);
  
  // Get a specific quality action by ID
  // Retrieves detailed information about a quality action
  rpc GetQualityAction(manufacturing.quality.messages.GetQualityActionRequest)
      returns (manufacturing.quality.messages.GetQualityActionResponse);
  
  // List quality actions with filtering and pagination
  // Retrieves a paginated list of quality actions with optional filtering
  rpc ListQualityActions(manufacturing.quality.messages.ListQualityActionsRequest)
      returns (manufacturing.quality.messages.ListQualityActionsResponse);
  
  // Update an existing quality action
  // Updates quality action details including status and progress
  rpc UpdateQualityAction(manufacturing.quality.messages.UpdateQualityActionRequest)
      returns (manufacturing.quality.messages.UpdateQualityActionResponse);
  
  // Complete a quality action
  // Marks a quality action as completed with effectiveness assessment
  rpc CompleteQualityAction(manufacturing.quality.messages.CompleteQualityActionRequest)
      returns (manufacturing.quality.messages.CompleteQualityActionResponse);
}
