syntax = "proto3";

package manufacturing.quality.enums;

// Quality level enumeration
// Defines the different quality levels for products and processes
enum QualityLevel {
  // Default value - should not be used
  QUALITY_LEVEL_UNSPECIFIED = 0;
  
  // Basic quality level
  BASIC = 1;
  
  // Standard quality level
  STANDARD = 2;
  
  // High quality level
  HIGH = 3;
  
  // Premium quality level
  PREMIUM = 4;
  
  // Luxury quality level
  LUXURY = 5;
  
  // Military grade quality level
  MILITARY_GRADE = 6;
  
  // Medical grade quality level
  MEDICAL_GRADE = 7;
  
  // Food grade quality level
  FOOD_GRADE = 8;
  
  // Aerospace grade quality level
  AEROSPACE_GRADE = 9;
  
  // Automotive grade quality level
  AUTOMOTIVE_GRADE = 10;
}

// Quality inspection status enumeration
enum QualityInspectionStatus {
  // Default value - should not be used
  QUALITY_INSPECTION_STATUS_UNSPECIFIED = 0;
  
  // Inspection is scheduled
  SCHEDULED = 1;
  
  // Inspection is in progress
  IN_PROGRESS = 2;
  
  // Inspection is completed
  COMPLETED = 3;
  
  // Inspection is passed
  PASSED = 4;
  
  // Inspection is failed
  FAILED = 5;
  
  // Inspection is pending review
  PENDING_REVIEW = 6;
  
  // Inspection is under review
  UNDER_REVIEW = 7;
  
  // Inspection is approved
  APPROVED = 8;
  
  // Inspection is rejected
  REJECTED = 9;
  
  // Inspection is cancelled
  CANCELLED = 10;
}

// Quality control type enumeration
enum QualityControlType {
  // Default value - should not be used
  QUALITY_CONTROL_TYPE_UNSPECIFIED = 0;
  
  // Incoming material inspection
  INCOMING_INSPECTION = 1;
  
  // In-process inspection
  IN_PROCESS_INSPECTION = 2;
  
  // Final inspection
  FINAL_INSPECTION = 3;
  
  // First article inspection
  FIRST_ARTICLE_INSPECTION = 4;
  
  // Random sampling inspection
  RANDOM_SAMPLING = 5;
  
  // 100% inspection
  FULL_INSPECTION = 6;
  
  // Statistical process control
  STATISTICAL_PROCESS_CONTROL = 7;
  
  // Destructive testing
  DESTRUCTIVE_TESTING = 8;
  
  // Non-destructive testing
  NON_DESTRUCTIVE_TESTING = 9;
  
  // Visual inspection
  VISUAL_INSPECTION = 10;
}

// Quality standard enumeration
enum QualityStandard {
  // Default value - should not be used
  QUALITY_STANDARD_UNSPECIFIED = 0;
  
  // ISO 9001 quality management system
  ISO_9001 = 1;
  
  // ISO 14001 environmental management
  ISO_14001 = 2;
  
  // ISO 45001 occupational health and safety
  ISO_45001 = 3;
  
  // ISO 13485 medical devices
  ISO_13485 = 4;
  
  // ISO 22000 food safety management
  ISO_22000 = 5;
  
  // IATF 16949 automotive quality management
  IATF_16949 = 6;
  
  // AS9100 aerospace quality management
  AS9100 = 7;
  
  // FDA regulations
  FDA = 8;
  
  // CE marking
  CE_MARKING = 9;
  
  // UL certification
  UL_CERTIFICATION = 10;
  
  // Custom internal standard
  CUSTOM = 11;
}

// Defect severity enumeration
enum DefectSeverity {
  // Default value - should not be used
  DEFECT_SEVERITY_UNSPECIFIED = 0;
  
  // Critical defect - product unusable
  CRITICAL = 1;
  
  // Major defect - significant impact on functionality
  MAJOR = 2;
  
  // Minor defect - slight impact on functionality
  MINOR = 3;
  
  // Cosmetic defect - no impact on functionality
  COSMETIC = 4;
  
  // Informational - observation only
  INFORMATIONAL = 5;
}

// Quality action type enumeration
enum QualityActionType {
  // Default value - should not be used
  QUALITY_ACTION_TYPE_UNSPECIFIED = 0;
  
  // Corrective action
  CORRECTIVE_ACTION = 1;
  
  // Preventive action
  PREVENTIVE_ACTION = 2;
  
  // Immediate action
  IMMEDIATE_ACTION = 3;
  
  // Containment action
  CONTAINMENT_ACTION = 4;
  
  // Root cause analysis
  ROOT_CAUSE_ANALYSIS = 5;
  
  // Process improvement
  PROCESS_IMPROVEMENT = 6;
  
  // Training
  TRAINING = 7;
  
  // Equipment maintenance
  EQUIPMENT_MAINTENANCE = 8;
  
  // Supplier notification
  SUPPLIER_NOTIFICATION = 9;
  
  // Customer notification
  CUSTOMER_NOTIFICATION = 10;
}
