syntax = "proto3";

package construction.machinery.messages;

import "google/protobuf/timestamp.proto";

message MaintenanceLog {
  string id = 1;
  string machine_id = 2;
  string maintenance_type = 3;
  string description = 4;
  google.protobuf.Timestamp scheduled_date = 5;
  google.protobuf.Timestamp completed_date = 6;
  string technician = 7;
  double cost = 8;
  repeated string parts_used = 9;
  string notes = 10;
  string status = 11;
  repeated string attachments = 12;
  string next_maintenance_due = 13;
  double hours_operated = 14;
  string maintenance_category = 15;
  string priority = 16;
  string location = 17;
  repeated string tools_used = 18;
  string work_order_number = 19;
  string approval_status = 20;
  string approved_by = 21;
  google.protobuf.Timestamp approved_date = 22;
}
