syntax = "proto3";

package construction.contractors.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "../enums/contractor_type.proto";
import "../enums/contractor_status.proto";
import "../enums/contractor_priority.proto";

// Represents a contractor in the construction industry
message Contractor {
  // Unique identifier for the contractor
  string id = 1;
  
  // Company name or individual contractor name
  string name = 2;
  
  // Type of contractor (general, electrical, plumbing, etc.)
  construction.contractors.enums.ContractorType type = 3;
  
  // Current status of the contractor
  construction.contractors.enums.ContractorStatus status = 4;
  
  // Priority level for this contractor
  construction.contractors.enums.ContractorPriority priority = 5;
  
  // Contact information
  ContactInfo contact_info = 6;
  
  // Business registration details
  BusinessInfo business_info = 7;
  
  // Certifications and licenses
  repeated Certification certifications = 8;
  
  // Insurance information
  repeated Insurance insurance_policies = 9;
  
  // Performance metrics and ratings
  PerformanceMetrics performance = 10;
  
  // Financial information
  FinancialInfo financial_info = 11;
  
  // Specializations and capabilities
  repeated string specializations = 12;
  
  // Geographic service areas
  repeated ServiceArea service_areas = 13;
  
  // Equipment and resources available
  repeated Equipment equipment = 14;
  
  // Team size and structure
  TeamInfo team_info = 15;
  
  // Project history and references
  repeated ProjectReference project_references = 16;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  google.protobuf.Timestamp last_active = 19;
  
  // Additional metadata
  map<string, google.protobuf.Any> metadata = 20;
}

// Contact information for the contractor
message ContactInfo {
  // Primary contact person
  string primary_contact = 1;
  
  // Email address
  string email = 2;
  
  // Phone number
  string phone = 3;
  
  // Mobile phone number
  string mobile = 4;
  
  // Fax number
  string fax = 5;
  
  // Website URL
  string website = 6;
  
  // Physical address
  Address address = 7;
  
  // Emergency contact information
  EmergencyContact emergency_contact = 8;
}

// Business registration information
message BusinessInfo {
  // Business registration number
  string registration_number = 1;
  
  // Tax identification number
  string tax_id = 2;
  
  // Business license number
  string license_number = 3;
  
  // Date of incorporation
  google.protobuf.Timestamp incorporation_date = 4;
  
  // Business type (LLC, Corporation, Partnership, etc.)
  string business_type = 5;
  
  // Years in business
  int32 years_in_business = 6;
  
  // Number of employees
  int32 employee_count = 7;
  
  // Annual revenue
  double annual_revenue = 8;
}

// Certification information
message Certification {
  // Certification name
  string name = 1;
  
  // Issuing organization
  string issuing_organization = 2;
  
  // Certification number
  string certification_number = 3;
  
  // Issue date
  google.protobuf.Timestamp issue_date = 4;
  
  // Expiration date
  google.protobuf.Timestamp expiration_date = 5;
  
  // Certification status
  string status = 6;
  
  // Renewal requirements
  string renewal_requirements = 7;
}

// Insurance policy information
message Insurance {
  // Insurance type (general liability, workers comp, etc.)
  string type = 1;
  
  // Insurance provider
  string provider = 2;
  
  // Policy number
  string policy_number = 3;
  
  // Coverage amount
  double coverage_amount = 4;
  
  // Effective date
  google.protobuf.Timestamp effective_date = 5;
  
  // Expiration date
  google.protobuf.Timestamp expiration_date = 6;
  
  // Deductible amount
  double deductible = 7;
}

// Performance metrics for the contractor
message PerformanceMetrics {
  // Overall rating (1-5 stars)
  double overall_rating = 1;
  
  // Number of completed projects
  int32 completed_projects = 2;
  
  // Number of projects on time
  int32 on_time_projects = 3;
  
  // Number of projects on budget
  int32 on_budget_projects = 4;
  
  // Average project duration
  double average_duration_days = 5;
  
  // Customer satisfaction score
  double customer_satisfaction = 6;
  
  // Safety record score
  double safety_score = 7;
  
  // Quality score
  double quality_score = 8;
  
  // Number of safety incidents
  int32 safety_incidents = 9;
  
  // Number of warranty claims
  int32 warranty_claims = 10;
}

// Financial information for the contractor
message FinancialInfo {
  // Credit rating
  string credit_rating = 1;
  
  // Bonding capacity
  double bonding_capacity = 2;
  
  // Available credit
  double available_credit = 3;
  
  // Payment terms
  string payment_terms = 4;
  
  // Preferred payment method
  string preferred_payment_method = 5;
  
  // Banking information
  BankingInfo banking_info = 6;
}

// Banking information
message BankingInfo {
  // Bank name
  string bank_name = 1;
  
  // Account number (encrypted)
  string account_number = 2;
  
  // Routing number
  string routing_number = 3;
  
  // Account type
  string account_type = 4;
}

// Service area information
message ServiceArea {
  // Geographic region name
  string region_name = 1;
  
  // State or province
  string state_province = 2;
  
  // City
  string city = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Service radius in miles
  double radius_miles = 5;
  
  // Whether this is the primary service area
  bool is_primary = 6;
}

// Equipment information
message Equipment {
  // Equipment name
  string name = 1;
  
  // Equipment type
  string type = 2;
  
  // Model number
  string model = 3;
  
  // Serial number
  string serial_number = 4;
  
  // Year of manufacture
  int32 year = 5;
  
  // Condition rating (1-5)
  int32 condition = 6;
  
  // Daily rental rate
  double daily_rate = 7;
  
  // Availability status
  string availability = 8;
}

// Team information
message TeamInfo {
  // Total team size
  int32 total_size = 1;
  
  // Number of supervisors
  int32 supervisors = 2;
  
  // Number of skilled workers
  int32 skilled_workers = 3;
  
  // Number of laborers
  int32 laborers = 4;
  
  // Number of apprentices
  int32 apprentices = 5;
  
  // Key personnel
  repeated KeyPersonnel key_personnel = 6;
}

// Key personnel information
message KeyPersonnel {
  // Person's name
  string name = 1;
  
  // Job title
  string title = 2;
  
  // Years of experience
  int32 years_experience = 3;
  
  // Specializations
  repeated string specializations = 4;
  
  // Contact information
  string contact_info = 5;
}

// Project reference information
message ProjectReference {
  // Project name
  string project_name = 1;
  
  // Client name
  string client_name = 2;
  
  // Project value
  double project_value = 3;
  
  // Project duration in days
  int32 duration_days = 4;
  
  // Completion date
  google.protobuf.Timestamp completion_date = 5;
  
  // Project rating
  double rating = 6;
  
  // Client contact information
  string client_contact = 7;
  
  // Project description
  string description = 8;
}

// Address information
message Address {
  // Street address
  string street = 1;
  
  // City
  string city = 2;
  
  // State or province
  string state_province = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Country
  string country = 5;
  
  // Additional address details
  string additional_info = 6;
}

// Emergency contact information
message EmergencyContact {
  // Contact person name
  string name = 1;
  
  // Relationship to contractor
  string relationship = 2;
  
  // Phone number
  string phone = 3;
  
  // Email address
  string email = 4;
  
  // Available hours
  string available_hours = 5;
}
