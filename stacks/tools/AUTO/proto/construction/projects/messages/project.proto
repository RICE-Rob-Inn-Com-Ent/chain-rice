syntax = "proto3";

package construction.projects.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "../enums/project_type.proto";
import "../enums/project_status.proto";
import "../enums/project_priority.proto";

message Project {
  string id = 1;
  string name = 2;
  string description = 3;
  construction.projects.enums.ProjectType type = 4;
  construction.projects.enums.ProjectStatus status = 5;
  construction.projects.enums.ProjectPriority priority = 6;
  string client = 7;
  string project_manager = 8;
  string general_contractor = 9;
  string location = 10;
  double budget = 11;
  double actual_cost = 12;
  google.protobuf.Timestamp start_date = 13;
  google.protobuf.Timestamp end_date = 14;
  google.protobuf.Timestamp actual_start_date = 15;
  google.protobuf.Timestamp actual_end_date = 16;
  int32 duration_days = 17;
  int32 actual_duration_days = 18;
  double progress_percentage = 19;
  repeated ProjectTask tasks = 20;
  repeated string team_members = 21;
  repeated string stakeholders = 22;
  repeated string documents = 23;
  map<string, string> properties = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
}

message ProjectTask {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  string priority = 5;
  string assigned_to = 6;
  google.protobuf.Timestamp start_date = 7;
  google.protobuf.Timestamp end_date = 8;
  google.protobuf.Timestamp actual_start_date = 9;
  google.protobuf.Timestamp actual_end_date = 10;
  double progress_percentage = 11;
  repeated string dependencies = 12;
  repeated string subtasks = 13;
  string notes = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}
