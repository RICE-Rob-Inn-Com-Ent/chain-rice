syntax = "proto3";

package construction.projects.messages;

import "google/protobuf/timestamp.proto";

message ProjectTask {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string status = 5;
  string priority = 6;
  string assigned_to = 7;
  google.protobuf.Timestamp start_date = 8;
  google.protobuf.Timestamp end_date = 9;
  google.protobuf.Timestamp actual_start_date = 10;
  google.protobuf.Timestamp actual_end_date = 11;
  double progress_percentage = 12;
  repeated string dependencies = 13;
  repeated string subtasks = 14;
  string notes = 15;
  double estimated_hours = 16;
  double actual_hours = 17;
  double estimated_cost = 18;
  double actual_cost = 19;
  repeated string resources = 20;
  repeated string deliverables = 21;
  string category = 22;
  string phase = 23;
  string work_package = 24;
  string quality_requirements = 25;
  string safety_requirements = 26;
  repeated string attachments = 27;
  google.protobuf.Timestamp created_at = 28;
  google.protobuf.Timestamp updated_at = 29;
}
