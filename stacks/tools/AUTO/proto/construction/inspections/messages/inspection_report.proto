syntax = "proto3";

package construction.inspections.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "../enums/inspection_type.proto";
import "../enums/inspection_status.proto";
import "../enums/severity_level.proto";

// Represents an inspection report in the construction industry
message InspectionReport {
  // Unique identifier for the report
  string id = 1;
  
  // Report number (human-readable)
  string report_number = 2;
  
  // Report title
  string title = 3;
  
  // Report description
  string description = 4;
  
  // Report type
  string type = 5;
  
  // Report status
  construction.inspections.enums.InspectionStatus status = 6;
  
  // Inspection information
  InspectionInfo inspection = 7;
  
  // Report summary
  ReportSummary summary = 8;
  
  // Executive summary
  string executive_summary = 9;
  
  // Detailed findings
  repeated DetailedFinding detailed_findings = 10;
  
  // Recommendations
  repeated ReportRecommendation recommendations = 11;
  
  // Conclusions
  repeated string conclusions = 12;
  
  // Next steps
  repeated string next_steps = 13;
  
  // Action items
  repeated ActionItem action_items = 14;
  
  // Compliance assessment
  ComplianceAssessment compliance = 15;
  
  // Risk assessment
  RiskAssessment risk_assessment = 16;
  
  // Quality assessment
  QualityAssessment quality_assessment = 17;
  
  // Safety assessment
  SafetyAssessment safety_assessment = 18;
  
  // Cost impact analysis
  CostImpactAnalysis cost_impact = 19;
  
  // Timeline analysis
  TimelineAnalysis timeline_analysis = 20;
  
  // Photographic evidence
  repeated PhotographicEvidence photographs = 21;
  
  // Technical drawings
  repeated TechnicalDrawing drawings = 22;
  
  // Test results
  repeated TestResultSummary test_results = 23;
  
  // Measurements and data
  repeated MeasurementData measurements = 24;
  
  // Regulatory references
  repeated RegulatoryReference regulatory_references = 25;
  
  // Standards references
  repeated StandardsReference standards_references = 26;
  
  // Code references
  repeated CodeReference code_references = 27;
  
  // Appendices
  repeated Appendix appendices = 28;
  
  // Report metadata
  ReportMetadata metadata = 29;
  
  // Distribution list
  repeated DistributionRecipient distribution_list = 30;
  
  // Approval information
  ApprovalInfo approval = 31;
  
  // Review information
  ReviewInfo review = 32;
  
  // Version information
  VersionInfo version = 33;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 34;
  google.protobuf.Timestamp updated_at = 35;
  google.protobuf.Timestamp generated_at = 36;
  google.protobuf.Timestamp approved_at = 37;
  google.protobuf.Timestamp distributed_at = 38;
  
  // Additional metadata
  map<string, google.protobuf.Any> additional_metadata = 39;
}

// Inspection information
message InspectionInfo {
  // Inspection ID
  string inspection_id = 1;
  
  // Inspection type
  construction.inspections.enums.InspectionType type = 2;
  
  // Inspection date
  google.protobuf.Timestamp inspection_date = 3;
  
  // Inspector information
  InspectorInfo inspector = 4;
  
  // Project information
  ProjectInfo project = 5;
  
  // Location information
  LocationInfo location = 6;
  
  // Weather conditions
  WeatherConditions weather = 7;
  
  // Safety conditions
  SafetyConditions safety = 8;
}

// Report summary
message ReportSummary {
  // Overall result
  string overall_result = 1;
  
  // Pass/fail status
  bool passed = 2;
  
  // Overall score
  double overall_score = 3;
  
  // Maximum possible score
  double max_score = 4;
  
  // Score percentage
  double score_percentage = 5;
  
  // Number of findings
  int32 total_findings = 6;
  
  // Number of critical findings
  int32 critical_findings = 7;
  
  // Number of major findings
  int32 major_findings = 8;
  
  // Number of minor findings
  int32 minor_findings = 9;
  
  // Number of observations
  int32 observations = 10;
  
  // Compliance percentage
  double compliance_percentage = 11;
  
  // Quality rating
  string quality_rating = 12;
  
  // Safety rating
  string safety_rating = 13;
  
  // Key issues
  repeated string key_issues = 14;
  
  // Key strengths
  repeated string key_strengths = 15;
}

// Detailed finding
message DetailedFinding {
  // Finding ID
  string id = 1;
  
  // Finding title
  string title = 2;
  
  // Finding description
  string description = 3;
  
  // Severity level
  construction.inspections.enums.SeverityLevel severity = 4;
  
  // Finding category
  string category = 5;
  
  // Finding type
  string type = 6;
  
  // Location of finding
  string location = 7;
  
  // Component affected
  string component = 8;
  
  // System affected
  string system = 9;
  
  // Evidence or observations
  string evidence = 10;
  
  // Photographs
  repeated string photographs = 11;
  
  // Measurements
  repeated Measurement measurements = 12;
  
  // Test results
  repeated TestResult test_results = 13;
  
  // Root cause analysis
  string root_cause = 14;
  
  // Impact assessment
  string impact = 15;
  
  // Risk level
  string risk_level = 16;
  
  // Compliance status
  string compliance_status = 17;
  
  // Recommendations
  repeated string recommendations = 18;
  
  // Corrective actions required
  repeated string corrective_actions = 19;
  
  // Timeline for correction
  string correction_timeline = 20;
  
  // Responsible party
  string responsible_party = 21;
  
  // Cost estimate
  double cost_estimate = 22;
  
  // Finding status
  string status = 23;
  
  // Verification required
  bool verification_required = 24;
  
  // Follow-up required
  bool follow_up_required = 25;
  
  // Priority level
  string priority = 26;
  
  // Urgency level
  string urgency = 27;
}

// Report recommendation
message ReportRecommendation {
  // Recommendation ID
  string id = 1;
  
  // Recommendation description
