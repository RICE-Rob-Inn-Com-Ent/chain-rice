syntax = "proto3";

package construction.inspections.enums;

// Enumeration of different types of inspections in construction
enum InspectionType {
  // Default value for unset inspection type
  INSPECTION_TYPE_UNSPECIFIED = 0;
  
  // Pre-construction inspections
  PRE_CONSTRUCTION = 1;
  SITE_PREPARATION = 2;
  FOUNDATION_INSPECTION = 3;
  
  // Structural inspections
  STRUCTURAL_INSPECTION = 4;
  STEEL_INSPECTION = 5;
  CONCRETE_INSPECTION = 6;
  MASONRY_INSPECTION = 7;
  TIMBER_INSPECTION = 8;
  
  // Building systems inspections
  ELECTRICAL_INSPECTION = 9;
  PLUMBING_INSPECTION = 10;
  HVAC_INSPECTION = 11;
  FIRE_SAFETY_INSPECTION = 12;
  ELEVATOR_INSPECTION = 13;
  ESCALATOR_INSPECTION = 14;
  
  // Safety inspections
  SAFETY_INSPECTION = 15;
  SCAFFOLDING_INSPECTION = 16;
  CRANE_INSPECTION = 17;
  LIFTING_EQUIPMENT_INSPECTION = 18;
  PERSONAL_PROTECTIVE_EQUIPMENT_INSPECTION = 19;
  
  // Environmental inspections
  ENVIRONMENTAL_INSPECTION = 20;
  ASBESTOS_INSPECTION = 21;
  LEAD_PAINT_INSPECTION = 22;
  MOLD_INSPECTION = 23;
  RADON_INSPECTION = 24;
  
  // Quality control inspections
  QUALITY_CONTROL_INSPECTION = 25;
  MATERIAL_INSPECTION = 26;
  WORKMANSHIP_INSPECTION = 27;
  FINISH_INSPECTION = 28;
  
  // Compliance inspections
  CODE_COMPLIANCE_INSPECTION = 29;
  PERMIT_INSPECTION = 30;
  ZONING_INSPECTION = 31;
  ACCESSIBILITY_INSPECTION = 32;
  
  // Progress inspections
  PROGRESS_INSPECTION = 33;
  PHASE_INSPECTION = 34;
  MILESTONE_INSPECTION = 35;
  
  // Final inspections
  FINAL_INSPECTION = 36;
  PUNCH_LIST_INSPECTION = 37;
  OCCUPANCY_INSPECTION = 38;
  CERTIFICATE_OF_OCCUPANCY_INSPECTION = 39;
  
  // Post-construction inspections
  POST_CONSTRUCTION_INSPECTION = 40;
  WARRANTY_INSPECTION = 41;
  MAINTENANCE_INSPECTION = 42;
  
  // Specialized inspections
  GEOTECHNICAL_INSPECTION = 43;
  SURVEY_INSPECTION = 44;
  TESTING_INSPECTION = 45;
  CALIBRATION_INSPECTION = 46;
  
  // Emergency inspections
  EMERGENCY_INSPECTION = 47;
  DAMAGE_ASSESSMENT_INSPECTION = 48;
  POST_INCIDENT_INSPECTION = 49;
  
  // Third-party inspections
  THIRD_PARTY_INSPECTION = 50;
  INDEPENDENT_INSPECTION = 51;
  PEER_REVIEW_INSPECTION = 52;
  
  // Regulatory inspections
  REGULATORY_INSPECTION = 53;
  GOVERNMENT_INSPECTION = 54;
  AUDIT_INSPECTION = 55;
  
  // Custom inspections
  CUSTOM_INSPECTION = 56;
  SPECIAL_INSPECTION = 57;
  CONDITIONAL_INSPECTION = 58;
}
