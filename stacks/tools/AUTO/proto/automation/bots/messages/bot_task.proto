syntax = "proto3";

package automation.bots.messages;

import "automation/bots/enums/bot_priority.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Bot Task message
// Represents a task executed by a bot
message BotTask {
  // Unique identifier for the task
  string id = 1;
  
  // Bot ID that executes this task
  string bot_id = 2;
  
  // Task name
  string name = 3;
  
  // Task description
  string description = 4;
  
  // Task type
  string task_type = 5;
  
  // Task priority
  automation.bots.enums.BotPriority priority = 6;
  
  // Task status
  string status = 7;
  
  // Task configuration
  TaskConfiguration config = 8;
  
  // Task input
  TaskInput input = 9;
  
  // Task output
  TaskOutput output = 10;
  
  // Task execution
  TaskExecution execution = 11;
  
  // Task monitoring
  TaskMonitoring monitoring = 12;
  
  // Task metadata
  map<string, string> metadata = 13;
  
  // Task tags
  repeated string tags = 14;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 15;
  
  // Start timestamp
  google.protobuf.Timestamp started_at = 16;
  
  // Completion timestamp
  google.protobuf.Timestamp completed_at = 17;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 18;
  
  // Task owner
  string owner = 19;
  
  // Task dependencies
  repeated string dependencies = 20;
  
  // Task retry configuration
  TaskRetry retry = 21;
  
  // Task timeout configuration
  TaskTimeout timeout = 22;
}

// Task configuration
message TaskConfiguration {
  // Configuration type
  string config_type = 1;
  
  // Configuration parameters
  google.protobuf.Struct parameters = 2;
  
  // Environment variables
  map<string, string> environment_variables = 3;
  
  // Configuration files
  repeated ConfigFile config_files = 4;
  
  // Configuration validation
  bool validation_enabled = 5;
  
  // Configuration version
  string version = 6;
}

// Configuration file
message ConfigFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File content
  string content = 3;
  
  // File type
  string type = 4;
  
  // File encoding
  string encoding = 5;
}

// Task input
message TaskInput {
  // Input type
  string input_type = 1;
  
  // Input data
  google.protobuf.Struct data = 2;
  
  // Input files
  repeated InputFile files = 3;
  
  // Input parameters
  map<string, string> parameters = 4;
  
  // Input validation
  InputValidation validation = 5;
  
  // Input preprocessing
  InputPreprocessing preprocessing = 6;
}

// Input file
message InputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
}

// Input validation
message InputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Validation rule
message ValidationRule {
  // Rule name
  string name = 1;
  
  // Rule type
  string type = 2;
  
  // Rule expression
  string expression = 3;
  
  // Rule parameters
  google.protobuf.Struct parameters = 4;
  
  // Rule severity
  string severity = 5;
}

// Input preprocessing
message InputPreprocessing {
  // Preprocessing enabled
  bool enabled = 1;
  
  // Preprocessing steps
  repeated PreprocessingStep steps = 2;
  
  // Preprocessing parameters
  google.protobuf.Struct parameters = 3;
}

// Preprocessing step
message PreprocessingStep {
  // Step name
  string name = 1;
  
  // Step type
  string type = 2;
  
  // Step parameters
  google.protobuf.Struct parameters = 3;
  
  // Step order
  int32 order = 4;
}

// Task output
message TaskOutput {
  // Output type
  string output_type = 1;
  
  // Output data
  google.protobuf.Struct data = 2;
  
  // Output files
  repeated OutputFile files = 3;
  
  // Output parameters
  map<string, string> parameters = 4;
  
  // Output validation
  OutputValidation validation = 5;
  
  // Output postprocessing
  OutputPostprocessing postprocessing = 6;
  
  // Output format
  string format = 7;
  
  // Output encoding
  string encoding = 8;
}

// Output file
message OutputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
  
  // File metadata
  map<string, string> metadata = 8;
}

// Output validation
message OutputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Output postprocessing
message OutputPostprocessing {
  // Postprocessing enabled
  bool enabled = 1;
  
  // Postprocessing steps
  repeated PostprocessingStep steps = 2;
  
  // Postprocessing parameters
  google.protobuf.Struct parameters = 3;
}

// Postprocessing step
message PostprocessingStep {
  // Step name
  string name = 1;
  
  // Step type
  string type = 2;
  
  // Step parameters
  google.protobuf.Struct parameters = 3;
  
  // Step order
  int32 order = 4;
}

// Task execution
message TaskExecution {
  // Execution status
  string status = 1;
  
  // Execution progress
  TaskProgress progress = 2;
  
  // Execution metrics
  TaskMetrics metrics = 3;
  
  // Execution logs
  repeated TaskLog logs = 4;
  
  // Execution errors
  repeated TaskError errors = 5;
  
  // Execution warnings
  repeated TaskWarning warnings = 6;
  
  // Execution resources
  TaskResources resources = 7;
  
  // Execution environment
  TaskEnvironment environment = 8;
}

// Task progress
message TaskProgress {
  // Current step
  string current_step = 1;
  
  // Total steps
  int32 total_steps = 2;
  
  // Progress percentage
  double progress_percentage = 3;
  
  // Progress message
  string message = 4;
  
  // Progress timestamp
  google.protobuf.Timestamp timestamp = 5;
  
  // Progress details
  google.protobuf.Struct details = 6;
}

// Task metrics
message TaskMetrics {
  // Execution time in milliseconds
  int64 execution_time_ms = 1;
  
  // CPU usage percentage
  double cpu_usage_percentage = 2;
  
  // Memory usage in bytes
  int64 memory_usage_bytes = 3;
  
  // Network usage in bytes
  int64 network_usage_bytes = 4;
  
  // Disk usage in bytes
  int64 disk_usage_bytes = 5;
  
  // Throughput (operations per second)
  double throughput_ops_per_second = 6;
  
  // Latency in milliseconds
  double latency_ms = 7;
  
  // Success rate
  double success_rate = 8;
  
  // Error rate
  double error_rate = 9;
  
  // Additional metrics
  map<string, double> additional_metrics = 10;
}

// Task log
message TaskLog {
  // Log timestamp
  google.protobuf.Timestamp timestamp = 1;
  
  // Log level
  string level = 2;
  
  // Log message
  string message = 3;
  
  // Log source
  string source = 4;
  
  // Log context
  google.protobuf.Struct context = 5;
  
  // Log metadata
  map<string, string> metadata = 6;
}

// Task error
message TaskError {
  // Error code
  string error_code = 1;
  
  // Error message
  string error_message = 2;
  
  // Error type
  string error_type = 3;
  
  // Error severity
  string error_severity = 4;
  
  // Error context
  google.protobuf.Struct error_context = 5;
  
  // Error timestamp
  google.protobuf.Timestamp error_timestamp = 6;
  
  // Error stack trace
  string stack_trace = 7;
}

// Task warning
message TaskWarning {
  // Warning code
  string warning_code = 1;
  
  // Warning message
  string warning_message = 2;
  
  // Warning type
  string warning_type = 3;
  
  // Warning severity
  string warning_severity = 4;
  
  // Warning context
  google.protobuf.Struct warning_context = 5;
  
  // Warning timestamp
  google.protobuf.Timestamp warning_timestamp = 6;
}

// Task resources
message TaskResources {
  // Resource requirements
  ResourceRequirements requirements = 1;
  
  // Resource allocation
  ResourceAllocation allocation = 2;
  
  // Resource usage
  ResourceUsage usage = 3;
  
  // Resource limits
  ResourceLimits limits = 4;
}

// Resource requirements
message ResourceRequirements {
  // CPU requirements
  string cpu = 1;
  
  // Memory requirements
  string memory = 2;
  
  // Storage requirements
  string storage = 3;
  
  // Network requirements
  string network = 4;
  
  // GPU requirements
  string gpu = 5;
}

// Resource allocation
message ResourceAllocation {
  // Allocated CPU
  string allocated_cpu = 1;
  
  // Allocated memory
  string allocated_memory = 2;
  
  // Allocated storage
  string allocated_storage = 3;
  
  // Allocated network
  string allocated_network = 4;
  
  // Allocated GPU
  string allocated_gpu = 5;
}

// Resource usage
message ResourceUsage {
  // Used CPU
  string used_cpu = 1;
  
  // Used memory
  string used_memory = 2;
  
  // Used storage
  string used_storage = 3;
  
  // Used network
  string used_network = 4;
  
  // Used GPU
  string used_gpu = 5;
}

// Resource limits
message ResourceLimits {
  // CPU limit
  string cpu_limit = 1;
  
  // Memory limit
  string memory_limit = 2;
  
  // Storage limit
  string storage_limit = 3;
  
  // Network limit
  string network_limit = 4;
  
  // GPU limit
  string gpu_limit = 5;
}

// Task environment
message TaskEnvironment {
  // Environment name
  string name = 1;
  
  // Environment type
  string type = 2;
  
  // Environment variables
  map<string, string> variables = 3;
  
  // Environment configuration
  google.protobuf.Struct config = 4;
  
  // Environment metadata
  map<string, string> metadata = 5;
}

// Task monitoring
message TaskMonitoring {
  // Monitoring enabled
  bool enabled = 1;
  
  // Monitoring level
  string level = 2;
  
  // Monitoring metrics
  repeated string metrics = 3;
  
  // Monitoring alerts
  repeated MonitoringAlert alerts = 4;
  
  // Monitoring dashboard
  string dashboard_url = 5;
}

// Monitoring alert
message MonitoringAlert {
  // Alert name
  string name = 1;
  
  // Alert type
  string type = 2;
  
  // Alert condition
  string condition = 3;
  
  // Alert threshold
  double threshold = 4;
  
  // Alert severity
  string severity = 5;
  
  // Alert enabled
  bool enabled = 6;
}

// Task retry
message TaskRetry {
  // Retry enabled
  bool enabled = 1;
  
  // Maximum retry attempts
  int32 max_attempts = 2;
  
  // Retry delay in seconds
  int64 delay_seconds = 3;
  
  // Retry backoff strategy
  string backoff_strategy = 4;
  
  // Retry conditions
  repeated string conditions = 5;
  
  // Retry parameters
  google.protobuf.Struct parameters = 6;
}

// Task timeout
message TaskTimeout {
  // Timeout enabled
  bool enabled = 1;
  
  // Timeout duration in seconds
  int64 duration_seconds = 2;
  
  // Timeout action
  string action = 3;
  
  // Timeout warning
  int64 warning_seconds = 4;
  
  // Timeout parameters
  google.protobuf.Struct parameters = 5;
}
