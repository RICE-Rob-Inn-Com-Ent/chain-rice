syntax = "proto3";

package automation.workflow.messages;

import "automation/workflow/enums/workflow_status.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Workflow Execution message
// Represents an execution instance of a workflow
message WorkflowExecution {
  // Unique identifier for the execution
  string id = 1;
  
  // Workflow ID being executed
  string workflow_id = 2;
  
  // Execution name
  string name = 3;
  
  // Execution description
  string description = 4;
  
  // Execution status
  automation.workflow.enums.WorkflowStatus status = 5;
  
  // Execution configuration
  ExecutionConfiguration config = 6;
  
  // Execution input
  ExecutionInput input = 7;
  
  // Execution output
  ExecutionOutput output = 8;
  
  // Execution progress
  ExecutionProgress progress = 9;
  
  // Execution metrics
  ExecutionMetrics metrics = 10;
  
  // Execution logs
  repeated ExecutionLog logs = 11;
  
  // Execution errors
  repeated ExecutionError errors = 12;
  
  // Execution warnings
  repeated ExecutionWarning warnings = 13;
  
  // Execution resources
  ExecutionResources resources = 14;
  
  // Execution environment
  ExecutionEnvironment environment = 15;
  
  // Execution monitoring
  ExecutionMonitoring monitoring = 16;
  
  // Execution metadata
  map<string, string> metadata = 17;
  
  // Execution tags
  repeated string tags = 18;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 19;
  
  // Start timestamp
  google.protobuf.Timestamp started_at = 20;
  
  // Completion timestamp
  google.protobuf.Timestamp completed_at = 21;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 22;
  
  // Execution owner
  string owner = 23;
  
  // Execution dependencies
  repeated string dependencies = 24;
  
  // Execution retry configuration
  ExecutionRetry retry = 25;
  
  // Execution timeout configuration
  ExecutionTimeout timeout = 26;
}

// Execution configuration
message ExecutionConfiguration {
  // Configuration type
  string config_type = 1;
  
  // Configuration parameters
  google.protobuf.Struct parameters = 2;
  
  // Environment variables
  map<string, string> environment_variables = 3;
  
  // Configuration files
  repeated ConfigFile config_files = 4;
  
  // Configuration validation
  bool validation_enabled = 5;
  
  // Configuration version
  string version = 6;
  
  // Execution settings
  ExecutionSettings execution_settings = 7;
  
  // Resource settings
  ResourceSettings resource_settings = 8;
  
  // Security settings
  SecuritySettings security_settings = 9;
}

// Configuration file
message ConfigFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File content
  string content = 3;
  
  // File type
  string type = 4;
  
  // File encoding
  string encoding = 5;
  
  // File permissions
  string permissions = 6;
}

// Execution settings
message ExecutionSettings {
  // Execution timeout
  int64 timeout_seconds = 1;
  
  // Maximum retries
  int32 max_retries = 2;
  
  // Retry delay
  int64 retry_delay_seconds = 3;
  
  // Execution mode
  string execution_mode = 4;
  
  // Parallel execution
  bool parallel_execution = 5;
  
  // Max parallel steps
  int32 max_parallel_steps = 6;
  
  // Execution priority
  string execution_priority = 7;
  
  // Execution constraints
  ExecutionConstraints constraints = 8;
}

// Execution constraints
message ExecutionConstraints {
  // Maximum execution time
  int64 max_execution_time_seconds = 1;
  
  // Maximum memory usage
  int64 max_memory_usage_bytes = 2;
  
  // Maximum CPU usage
  int32 max_cpu_usage_percentage = 3;
  
  // Maximum network usage
  int64 max_network_usage_bytes = 4;
  
  // Maximum disk usage
  int64 max_disk_usage_bytes = 5;
}

// Resource settings
message ResourceSettings {
  // Resource requirements
  ResourceRequirements requirements = 1;
  
  // Resource allocation
  ResourceAllocation allocation = 2;
  
  // Resource limits
  ResourceLimits limits = 3;
  
  // Resource monitoring
  ResourceMonitoring monitoring = 4;
}

// Resource requirements
message ResourceRequirements {
  // CPU requirements
  string cpu = 1;
  
  // Memory requirements
  string memory = 2;
  
  // Storage requirements
  string storage = 3;
  
  // Network requirements
  string network = 4;
  
  // GPU requirements
  string gpu = 5;
  
  // Additional requirements
  map<string, string> additional = 6;
}

// Resource allocation
message ResourceAllocation {
  // Allocated CPU
  string allocated_cpu = 1;
  
  // Allocated memory
  string allocated_memory = 2;
  
  // Allocated storage
  string allocated_storage = 3;
  
  // Allocated network
  string allocated_network = 4;
  
  // Allocated GPU
  string allocated_gpu = 5;
  
  // Allocation timestamp
  google.protobuf.Timestamp allocated_at = 6;
  
  // Allocation duration
  int64 allocation_duration_seconds = 7;
}

// Resource limits
message ResourceLimits {
  // CPU limit
  string cpu_limit = 1;
  
  // Memory limit
  string memory_limit = 2;
  
  // Storage limit
  string storage_limit = 3;
  
  // Network limit
  string network_limit = 4;
  
  // GPU limit
  string gpu_limit = 5;
  
  // Rate limits
  map<string, int64> rate_limits = 6;
}

// Resource monitoring
message ResourceMonitoring {
  // Monitoring enabled
  bool enabled = 1;
  
  // Monitoring interval
  int32 interval_seconds = 2;
  
  // Monitoring metrics
  repeated string metrics = 3;
  
  // Monitoring alerts
  repeated ResourceAlert alerts = 4;
  
  // Monitoring dashboard
  string dashboard_url = 5;
}

// Resource alert
message ResourceAlert {
  // Alert name
  string name = 1;
  
  // Alert condition
  string condition = 2;
  
  // Alert threshold
  double threshold = 3;
  
  // Alert severity
  string severity = 4;
  
  // Alert enabled
  bool enabled = 5;
}

// Security settings
message SecuritySettings {
  // Security enabled
  bool enabled = 1;
  
  // Security level
  string level = 2;
  
  // Authentication
  Authentication authentication = 3;
  
  // Authorization
  Authorization authorization = 4;
  
  // Encryption
  Encryption encryption = 5;
  
  // Audit logging
  AuditLogging audit_logging = 6;
  
  // Access control
  AccessControl access_control = 7;
  
  // Compliance
  Compliance compliance = 8;
}

// Authentication
message Authentication {
  // Authentication enabled
  bool enabled = 1;
  
  // Authentication method
  string method = 2;
  
  // Authentication parameters
  google.protobuf.Struct parameters = 3;
  
  // Authentication credentials
  map<string, string> credentials = 4;
  
  // Authentication timeout
  int32 timeout_seconds = 5;
}

// Authorization
message Authorization {
  // Authorization enabled
  bool enabled = 1;
  
  // Authorization method
  string method = 2;
  
  // Authorization roles
  repeated string roles = 3;
  
  // Authorization permissions
  repeated string permissions = 4;
  
  // Authorization policies
  repeated string policies = 5;
}

// Encryption
message Encryption {
  // Encryption enabled
  bool enabled = 1;
  
  // Encryption algorithm
  string algorithm = 2;
  
  // Encryption key
  string key = 3;
  
  // Encryption parameters
  google.protobuf.Struct parameters = 4;
  
  // Encryption at rest
  bool at_rest = 5;
  
  // Encryption in transit
  bool in_transit = 6;
}

// Audit logging
message AuditLogging {
  // Audit logging enabled
  bool enabled = 1;
  
  // Audit log level
  string level = 2;
  
  // Audit log destination
  string destination = 3;
  
  // Audit log format
  string format = 4;
  
  // Audit log retention
  int32 retention_days = 5;
}

// Access control
message AccessControl {
  // Access control enabled
  bool enabled = 1;
  
  // Access control method
  string method = 2;
  
  // Access control rules
  repeated AccessRule rules = 3;
  
  // Access control policies
  repeated string policies = 4;
}

// Access rule
message AccessRule {
  // Rule name
  string name = 1;
  
  // Rule type
  string type = 2;
  
  // Rule condition
  string condition = 3;
  
  // Rule action
  string action = 4;
  
  // Rule priority
  int32 priority = 5;
}

// Compliance
message Compliance {
  // Compliance enabled
  bool enabled = 1;
  
  // Compliance standards
  repeated string standards = 2;
  
  // Compliance requirements
  repeated string requirements = 3;
  
  // Compliance policies
  repeated string policies = 4;
  
  // Compliance monitoring
  bool monitoring = 5;
}

// Execution input
message ExecutionInput {
  // Input type
  string input_type = 1;
  
  // Input data
  google.protobuf.Struct data = 2;
  
  // Input files
  repeated InputFile files = 3;
  
  // Input parameters
  map<string, string> parameters = 4;
  
  // Input validation
  InputValidation validation = 5;
  
  // Input preprocessing
  InputPreprocessing preprocessing = 6;
}

// Input file
message InputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
  
  // File metadata
  map<string, string> metadata = 8;
}

// Input validation
message InputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Validation rule
message ValidationRule {
  // Rule name
  string name = 1;
  
  // Rule type
  string type = 2;
  
  // Rule expression
  string expression = 3;
  
  // Rule parameters
  google.protobuf.Struct parameters = 4;
  
  // Rule severity
  string severity = 5;
}

// Input preprocessing
message InputPreprocessing {
  // Preprocessing enabled
  bool enabled = 1;
  
  // Preprocessing steps
  repeated PreprocessingStep steps = 2;
  
  // Preprocessing parameters
  google.protobuf.Struct parameters = 3;
}

// Preprocessing step
message PreprocessingStep {
  // Step name
  string name = 1;
  
  // Step type
  string type = 2;
  
  // Step parameters
  google.protobuf.Struct parameters = 3;
  
  // Step order
  int32 order = 4;
}

// Execution output
message ExecutionOutput {
  // Output type
  string output_type = 1;
  
  // Output data
  google.protobuf.Struct data = 2;
  
  // Output files
  repeated OutputFile files = 3;
  
  // Output parameters
  map<string, string> parameters = 4;
  
  // Output validation
  OutputValidation validation = 5;
  
  // Output postprocessing
  OutputPostprocessing postprocessing = 6;
  
  // Output format
  string format = 7;
  
  // Output encoding
  string encoding = 8;
}

// Output file
message OutputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
  
  // File metadata
  map<string, string> metadata = 8;
}

// Output validation
message OutputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Output postprocessing
message OutputPostprocessing {
  // Postprocessing enabled
  bool enabled = 1;
  
  // Postprocessing steps
  repeated PostprocessingStep steps = 2;
  
  // Postprocessing parameters
  google.protobuf.Struct parameters = 3;
}

// Postprocessing step
message PostprocessingStep {
  // Step name
  string name = 1;
  
  // Step type
  string type = 2;
  
  // Step parameters
  google.protobuf.Struct parameters = 3;
  
  // Step order
  int32 order = 4;
}

// Execution progress
message ExecutionProgress {
  // Current step
  string current_step = 1;
  
  // Total steps
  int32 total_steps = 2;
  
  // Progress percentage
  double progress_percentage = 3;
  
  // Progress message
  string message = 4;
  
  // Progress timestamp
  google.protobuf.Timestamp timestamp = 5;
  
  // Progress details
  google.protobuf.Struct details = 6;
  
  // Completed steps
  repeated string completed_steps = 7;
  
  // Failed steps
  repeated string failed_steps = 8;
  
  // Skipped steps
  repeated string skipped_steps = 9;
}

// Execution metrics
message ExecutionMetrics {
  // Execution time in milliseconds
  int64 execution_time_ms = 1;
  
  // CPU usage percentage
  double cpu_usage_percentage = 2;
  
  // Memory usage in bytes
  int64 memory_usage_bytes = 3;
  
  // Network usage in bytes
  int64 network_usage_bytes = 4;
  
  // Disk usage in bytes
  int64 disk_usage_bytes = 5;
  
  // Throughput (operations per second)
  double throughput_ops_per_second = 6;
  
  // Latency in milliseconds
  double latency_ms = 7;
  
  // Success rate
  double success_rate = 8;
  
  // Error rate
  double error_rate = 9;
  
  // Additional metrics
  map<string, double> additional_metrics = 10;
}

// Execution log
message ExecutionLog {
  // Log timestamp
  google.protobuf.Timestamp timestamp = 1;
  
  // Log level
  string level = 2;
  
  // Log message
  string message = 3;
  
  // Log source
  string source = 4;
  
  // Log context
  google.protobuf.Struct context = 5;
  
  // Log metadata
  map<string, string> metadata = 6;
}

// Execution error
message ExecutionError {
  // Error code
  string error_code = 1;
  
  // Error message
  string error_message = 2;
  
  // Error type
  string error_type = 3;
  
  // Error severity
  string error_severity = 4;
  
  // Error context
  google.protobuf.Struct error_context = 5;
  
  // Error timestamp
  google.protobuf.Timestamp error_timestamp = 6;
  
  // Error stack trace
  string stack_trace = 7;
}

// Execution warning
message ExecutionWarning {
  // Warning code
  string warning_code = 1;
  
  // Warning message
  string warning_message = 2;
  
  // Warning type
  string warning_type = 3;
  
  // Warning severity
  string warning_severity = 4;
  
  // Warning context
  google.protobuf.Struct warning_context = 5;
  
  // Warning timestamp
  google.protobuf.Timestamp warning_timestamp = 6;
}

// Execution resources
message ExecutionResources {
  // Resource requirements
  ResourceRequirements requirements = 1;
  
  // Resource allocation
  ResourceAllocation allocation = 2;
  
  // Resource usage
  ResourceUsage usage = 3;
  
  // Resource limits
  ResourceLimits limits = 4;
}

// Resource usage
message ResourceUsage {
  // Used CPU
  string used_cpu = 1;
  
  // Used memory
  string used_memory = 2;
  
  // Used storage
  string used_storage = 3;
  
  // Used network
  string used_network = 4;
  
  // Used GPU
  string used_gpu = 5;
  
  // Usage timestamp
  google.protobuf.Timestamp usage_timestamp = 6;
  
  // Usage percentage
  map<string, double> usage_percentage = 7;
}

// Execution environment
message ExecutionEnvironment {
  // Environment name
  string name = 1;
  
  // Environment type
  string type = 2;
  
  // Environment variables
  map<string, string> variables = 3;
  
  // Environment configuration
  google.protobuf.Struct config = 4;
  
  // Environment metadata
  map<string, string> metadata = 5;
}

// Execution monitoring
message ExecutionMonitoring {
  // Monitoring enabled
  bool enabled = 1;
  
  // Monitoring level
  string level = 2;
  
  // Monitoring metrics
  repeated string metrics = 3;
  
  // Monitoring alerts
  repeated MonitoringAlert alerts = 4;
  
  // Monitoring dashboard
  string dashboard_url = 5;
  
  // Monitoring logs
  MonitoringLogs logs = 6;
  
  // Monitoring health checks
  repeated HealthCheck health_checks = 7;
}

// Monitoring alert
message MonitoringAlert {
  // Alert name
  string name = 1;
  
  // Alert type
  string type = 2;
  
  // Alert condition
  string condition = 3;
  
  // Alert threshold
  double threshold = 4;
  
  // Alert severity
  string severity = 5;
  
  // Alert enabled
  bool enabled = 6;
  
  // Alert notification channels
  repeated string notification_channels = 7;
  
  // Alert cooldown
  int64 cooldown_seconds = 8;
}

// Monitoring logs
message MonitoringLogs {
  // Log level
  string level = 1;
  
  // Log retention days
  int32 retention_days = 2;
  
  // Log format
  string format = 3;
  
  // Log destination
  string destination = 4;
  
  // Log rotation
  LogRotation rotation = 5;
}

// Log rotation
message LogRotation {
  // Rotation enabled
  bool enabled = 1;
  
  // Rotation size
  int64 size_mb = 2;
  
  // Rotation frequency
  string frequency = 3;
  
  // Rotation count
  int32 count = 4;
}

// Health check
message HealthCheck {
  // Health check name
  string name = 1;
  
  // Health check type
  string type = 2;
  
  // Health check endpoint
  string endpoint = 3;
  
  // Health check interval
  int32 interval_seconds = 4;
  
  // Health check timeout
  int32 timeout_seconds = 5;
  
  // Health check enabled
  bool enabled = 6;
  
  // Health check parameters
  google.protobuf.Struct parameters = 7;
}

// Execution retry
message ExecutionRetry {
  // Retry enabled
  bool enabled = 1;
  
  // Maximum retry attempts
  int32 max_attempts = 2;
  
  // Retry delay in seconds
  int64 delay_seconds = 3;
  
  // Retry backoff strategy
  string backoff_strategy = 4;
  
  // Retry conditions
  repeated string conditions = 5;
  
  // Retry parameters
  google.protobuf.Struct parameters = 6;
}

// Execution timeout
message ExecutionTimeout {
  // Timeout enabled
  bool enabled = 1;
  
  // Timeout duration in seconds
  int64 duration_seconds = 2;
  
  // Timeout action
  string action = 3;
  
  // Timeout warning
  int64 warning_seconds = 4;
  
  // Timeout parameters
  google.protobuf.Struct parameters = 5;
}
