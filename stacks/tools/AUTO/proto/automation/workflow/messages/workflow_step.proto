syntax = "proto3";

package automation.workflow.messages;

import "automation/workflow/enums/workflow_step_type.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Workflow Step message
// Represents a step in a workflow execution
message WorkflowStep {
  // Unique identifier for the step
  string id = 1;
  
  // Workflow ID this step belongs to
  string workflow_id = 2;
  
  // Step name
  string name = 3;
  
  // Step description
  string description = 4;
  
  // Step type
  automation.workflow.enums.WorkflowStepType step_type = 5;
  
  // Step order in the workflow
  int32 order = 6;
  
  // Step status
  string status = 7;
  
  // Step configuration
  StepConfiguration config = 8;
  
  // Step input
  StepInput input = 9;
  
  // Step output
  StepOutput output = 10;
  
  // Step execution
  StepExecution execution = 11;
  
  // Step monitoring
  StepMonitoring monitoring = 12;
  
  // Step metadata
  map<string, string> metadata = 13;
  
  // Step tags
  repeated string tags = 14;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 15;
  
  // Start timestamp
  google.protobuf.Timestamp started_at = 16;
  
  // Completion timestamp
  google.protobuf.Timestamp completed_at = 17;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 18;
  
  // Step owner
  string owner = 19;
  
  // Step dependencies
  repeated string dependencies = 20;
  
  // Step retry configuration
  StepRetry retry = 21;
  
  // Step timeout configuration
  StepTimeout timeout = 22;
  
  // Step error handling
  StepErrorHandling error_handling = 23;
}

// Step configuration
message StepConfiguration {
  // Configuration type
  string config_type = 1;
  
  // Configuration parameters
  google.protobuf.Struct parameters = 2;
  
  // Environment variables
  map<string, string> environment_variables = 3;
  
  // Configuration files
  repeated ConfigFile config_files = 4;
  
  // Configuration validation
  bool validation_enabled = 5;
  
  // Configuration version
  string version = 6;
  
  // Configuration checksum
  string checksum = 7;
}

// Configuration file
message ConfigFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File content
  string content = 3;
  
  // File type
  string type = 4;
  
  // File encoding
  string encoding = 5;
  
  // File permissions
  string permissions = 6;
}

// Step input
message StepInput {
  // Input type
  string input_type = 1;
  
  // Input data
  google.protobuf.Struct data = 2;
  
  // Input files
  repeated InputFile files = 3;
  
  // Input parameters
  map<string, string> parameters = 4;
  
  // Input validation
  InputValidation validation = 5;
  
  // Input preprocessing
  InputPreprocessing preprocessing = 6;
}

// Input file
message InputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
  
  // File metadata
  map<string, string> metadata = 8;
}

// Input validation
message InputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Validation rule
message ValidationRule {
  // Rule name
  string name = 1;
  
  // Rule type
  string type = 2;
  
  // Rule expression
  string expression = 3;
  
  // Rule parameters
  google.protobuf.Struct parameters = 4;
  
  // Rule severity
  string severity = 5;
}

// Input preprocessing
message InputPreprocessing {
  // Preprocessing enabled
  bool enabled = 1;
  
  // Preprocessing steps
  repeated PreprocessingStep steps = 2;
  
  // Preprocessing parameters
  google.protobuf.Struct parameters = 3;
}

// Preprocessing step
message PreprocessingStep {
  // Step name
  string name = 1;
  
  // Step type
  string type = 2;
  
  // Step parameters
  google.protobuf.Struct parameters = 3;
  
  // Step order
  int32 order = 4;
}

// Step output
message StepOutput {
  // Output type
  string output_type = 1;
  
  // Output data
  google.protobuf.Struct data = 2;
  
  // Output files
  repeated OutputFile files = 3;
  
  // Output parameters
  map<string, string> parameters = 4;
  
  // Output validation
  OutputValidation validation = 5;
  
  // Output postprocessing
  OutputPostprocessing postprocessing = 6;
  
  // Output format
  string format = 7;
  
  // Output encoding
  string encoding = 8;
}

// Output file
message OutputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
  
  // File metadata
  map<string, string> metadata = 8;
}

// Output validation
message OutputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Output postprocessing
message OutputPostprocessing {
  // Postprocessing enabled
  bool enabled = 1;
  
  // Postprocessing steps
  repeated PostprocessingStep steps = 2;
  
  // Postprocessing parameters
  google.protobuf.Struct parameters = 3;
}

// Postprocessing step
message PostprocessingStep {
  // Step name
  string name = 1;
  
  // Step type
  string type = 2;
  
  // Step parameters
  google.protobuf.Struct parameters = 3;
  
  // Step order
  int32 order = 4;
}

// Step execution
message StepExecution {
  // Execution status
  string status = 1;
  
  // Execution progress
  StepProgress progress = 2;
  
  // Execution metrics
  StepMetrics metrics = 3;
  
  // Execution logs
  repeated StepLog logs = 4;
  
  // Execution errors
  repeated StepError errors = 5;
  
  // Execution warnings
  repeated StepWarning warnings = 6;
  
  // Execution resources
  StepResources resources = 7;
  
  // Execution environment
  StepEnvironment environment = 8;
}

// Step progress
message StepProgress {
  // Current phase
  string current_phase = 1;
  
  // Total phases
  int32 total_phases = 2;
  
  // Progress percentage
  double progress_percentage = 3;
  
  // Progress message
  string message = 4;
  
  // Progress timestamp
  google.protobuf.Timestamp timestamp = 5;
  
  // Progress details
  google.protobuf.Struct details = 6;
}

// Step metrics
message StepMetrics {
  // Execution time in milliseconds
  int64 execution_time_ms = 1;
  
  // CPU usage percentage
  double cpu_usage_percentage = 2;
  
  // Memory usage in bytes
  int64 memory_usage_bytes = 3;
  
  // Network usage in bytes
  int64 network_usage_bytes = 4;
  
  // Disk usage in bytes
  int64 disk_usage_bytes = 5;
  
  // Throughput (operations per second)
  double throughput_ops_per_second = 6;
  
  // Latency in milliseconds
  double latency_ms = 7;
  
  // Success rate
  double success_rate = 8;
  
  // Error rate
  double error_rate = 9;
  
  // Additional metrics
  map<string, double> additional_metrics = 10;
}

// Step log
message StepLog {
  // Log timestamp
  google.protobuf.Timestamp timestamp = 1;
  
  // Log level
  string level = 2;
  
  // Log message
  string message = 3;
  
  // Log source
  string source = 4;
  
  // Log context
  google.protobuf.Struct context = 5;
  
  // Log metadata
  map<string, string> metadata = 6;
}

// Step error
message StepError {
  // Error code
  string error_code = 1;
  
  // Error message
  string error_message = 2;
  
  // Error type
  string error_type = 3;
  
  // Error severity
  string error_severity = 4;
  
  // Error context
  google.protobuf.Struct error_context = 5;
  
  // Error timestamp
  google.protobuf.Timestamp error_timestamp = 6;
  
  // Error stack trace
  string stack_trace = 7;
}

// Step warning
message StepWarning {
  // Warning code
  string warning_code = 1;
  
  // Warning message
  string warning_message = 2;
  
  // Warning type
  string warning_type = 3;
  
  // Warning severity
  string warning_severity = 4;
  
  // Warning context
  google.protobuf.Struct warning_context = 5;
  
  // Warning timestamp
  google.protobuf.Timestamp warning_timestamp = 6;
}

// Step resources
message StepResources {
  // Resource requirements
  ResourceRequirements requirements = 1;
  
  // Resource allocation
  ResourceAllocation allocation = 2;
  
  // Resource usage
  ResourceUsage usage = 3;
  
  // Resource limits
  ResourceLimits limits = 4;
}

// Resource requirements
message ResourceRequirements {
  // CPU requirements
  string cpu = 1;
  
  // Memory requirements
  string memory = 2;
  
  // Storage requirements
  string storage = 3;
  
  // Network requirements
  string network = 4;
  
  // GPU requirements
  string gpu = 5;
}

// Resource allocation
message ResourceAllocation {
  // Allocated CPU
  string allocated_cpu = 1;
  
  // Allocated memory
  string allocated_memory = 2;
  
  // Allocated storage
  string allocated_storage = 3;
  
  // Allocated network
  string allocated_network = 4;
  
  // Allocated GPU
  string allocated_gpu = 5;
}

// Resource usage
message ResourceUsage {
  // Used CPU
  string used_cpu = 1;
  
  // Used memory
  string used_memory = 2;
  
  // Used storage
  string used_storage = 3;
  
  // Used network
  string used_network = 4;
  
  // Used GPU
  string used_gpu = 5;
}

// Resource limits
message ResourceLimits {
  // CPU limit
  string cpu_limit = 1;
  
  // Memory limit
  string memory_limit = 2;
  
  // Storage limit
  string storage_limit = 3;
  
  // Network limit
  string network_limit = 4;
  
  // GPU limit
  string gpu_limit = 5;
}

// Step environment
message StepEnvironment {
  // Environment name
  string name = 1;
  
  // Environment type
  string type = 2;
  
  // Environment variables
  map<string, string> variables = 3;
  
  // Environment configuration
  google.protobuf.Struct config = 4;
  
  // Environment metadata
  map<string, string> metadata = 5;
}

// Step monitoring
message StepMonitoring {
  // Monitoring enabled
  bool enabled = 1;
  
  // Monitoring level
  string level = 2;
  
  // Monitoring metrics
  repeated string metrics = 3;
  
  // Monitoring alerts
  repeated MonitoringAlert alerts = 4;
  
  // Monitoring dashboard
  string dashboard_url = 5;
}

// Monitoring alert
message MonitoringAlert {
  // Alert name
  string name = 1;
  
  // Alert type
  string type = 2;
  
  // Alert condition
  string condition = 3;
  
  // Alert threshold
  double threshold = 4;
  
  // Alert severity
  string severity = 5;
  
  // Alert enabled
  bool enabled = 6;
}

// Step retry
message StepRetry {
  // Retry enabled
  bool enabled = 1;
  
  // Maximum retry attempts
  int32 max_attempts = 2;
  
  // Retry delay in seconds
  int64 delay_seconds = 3;
  
  // Retry backoff strategy
  string backoff_strategy = 4;
  
  // Retry conditions
  repeated string conditions = 5;
  
  // Retry parameters
  google.protobuf.Struct parameters = 6;
}

// Step timeout
message StepTimeout {
  // Timeout enabled
  bool enabled = 1;
  
  // Timeout duration in seconds
  int64 duration_seconds = 2;
  
  // Timeout action
  string action = 3;
  
  // Timeout warning
  int64 warning_seconds = 4;
  
  // Timeout parameters
  google.protobuf.Struct parameters = 5;
}

// Step error handling
message StepErrorHandling {
  // Error handling enabled
  bool enabled = 1;
  
  // Error handling strategy
  string strategy = 2;
  
  // Error handling actions
  repeated ErrorAction actions = 3;
  
  // Error handling parameters
  google.protobuf.Struct parameters = 4;
}

// Error action
message ErrorAction {
  // Action name
  string name = 1;
  
  // Action type
  string type = 2;
  
  // Action parameters
  google.protobuf.Struct parameters = 3;
  
  // Action order
  int32 order = 4;
}
