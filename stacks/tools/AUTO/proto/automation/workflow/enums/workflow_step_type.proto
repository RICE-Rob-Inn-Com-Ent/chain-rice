  WORKFLOW_STEP_TYPE_SCRIPT = 102;           // Script execution step
  WORKFLOW_STEP_TYPE_PLUGIN = 103;           // Plugin execution step
  WORKFLOW_STEP_TYPE_MICROSERVICE = 104;     // Microservice call step
  WORKFLOW_STEP_TYPE_LAMBDA = 105;           // Lambda function step
  WORKFLOW_STEP_TYPE_FUNCTION = 106;         // Function call step
  WORKFLOW_STEP_TYPE_PROCEDURE = 107;        // Procedure call step
  WORKFLOW_STEP_TYPE_SUBWORKFLOW = 108;      // Sub-workflow step
