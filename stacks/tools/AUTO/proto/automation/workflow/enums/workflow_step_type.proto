  WORKFLOW_STEP_TYPE_HTTP_REQUEST = 22;      // HTTP request step
  WORKFLOW_STEP_TYPE_REST_CALL = 23;         // REST API call step
  WORKFLOW_STEP_TYPE_GRAPHQL_CALL = 24;      // GraphQL API call step
  WORKFLOW_STEP_TYPE_SOAP_CALL = 25;         // SOAP API call step
  WORKFLOW_STEP_TYPE_WEBHOOK = 26;           // Webhook step
