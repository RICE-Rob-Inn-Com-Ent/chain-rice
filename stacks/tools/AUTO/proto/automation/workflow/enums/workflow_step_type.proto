syntax = "proto3";

package automation.workflow.enums;

// Workflow Step Type enumeration
// Defines the different types of steps that can be executed in a workflow
enum WorkflowStepType {
  // Unspecified step type
  WORKFLOW_STEP_TYPE_UNSPECIFIED = 0;
  
  // Basic Step Types
  WORKFLOW_STEP_TYPE_START = 1;              // Start step - beginning of workflow
  WORKFLOW_STEP_TYPE_END = 2;                // End step - end of workflow
  WORKFLOW_STEP_TYPE_TASK = 3;               // Task step - execute a task
  WORKFLOW_STEP_TYPE_WAIT = 4;               // Wait step - wait for a condition or time
  WORKFLOW_STEP_TYPE_DELAY = 5;              // Delay step - wait for a specified duration
  WORKFLOW_STEP_TYPE_PARALLEL = 6;           // Parallel step - execute multiple steps in parallel
  WORKFLOW_STEP_TYPE_SEQUENTIAL = 7;         // Sequential step - execute steps one after another
  WORKFLOW_STEP_TYPE_LOOP = 8;               // Loop step - repeat steps multiple times
  WORKFLOW_STEP_TYPE_CONDITION = 9;          // Condition step - conditional execution
  WORKFLOW_STEP_TYPE_SWITCH = 10;            // Switch step - switch between different paths
  
  // Data Processing Steps
  WORKFLOW_STEP_TYPE_DATA_TRANSFORM = 11;    // Data transformation step
  WORKFLOW_STEP_TYPE_DATA_VALIDATE = 12;     // Data validation step
  WORKFLOW_STEP_TYPE_DATA_FILTER = 13;       // Data filtering step
  WORKFLOW_STEP_TYPE_DATA_AGGREGATE = 14;    // Data aggregation step
  WORKFLOW_STEP_TYPE_DATA_SORT = 15;         // Data sorting step
  WORKFLOW_STEP_TYPE_DATA_GROUP = 16;        // Data grouping step
  WORKFLOW_STEP_TYPE_DATA_JOIN = 17;         // Data joining step
  WORKFLOW_STEP_TYPE_DATA_SPLIT = 18;        // Data splitting step
  WORKFLOW_STEP_TYPE_DATA_MERGE = 19;        // Data merging step
  WORKFLOW_STEP_TYPE_DATA_ENRICH = 20;       // Data enrichment step
  
