  WORKFLOW_STEP_TYPE_DATABASE_TRANSACTION = 36; // Database transaction step
  WORKFLOW_STEP_TYPE_DATABASE_MIGRATION = 37; // Database migration step
  WORKFLOW_STEP_TYPE_DATABASE_BACKUP = 38;   // Database backup step
  WORKFLOW_STEP_TYPE_DATABASE_RESTORE = 39;  // Database restore step
  
