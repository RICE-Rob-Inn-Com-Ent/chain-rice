syntax = "proto3";

package automation.workflow.services;

import "automation/workflow/messages/workflow.proto";
import "automation/workflow/messages/workflow_step.proto";
import "automation/workflow/messages/workflow_execution.proto";
import "automation/workflow/messages/workflow_event.proto";
import "automation/workflow/enums/workflow_type.proto";
import "automation/workflow/enums/workflow_status.proto";
import "automation/workflow/enums/workflow_step_type.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// Workflow Service
// Provides comprehensive workflow management, execution, and monitoring services
service WorkflowService {
  // Workflow Management RPCs
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (UpdateWorkflowResponse);
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc SearchWorkflows(SearchWorkflowsRequest) returns (SearchWorkflowsResponse);
  
  // Workflow Control RPCs
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc StopWorkflow(StopWorkflowRequest) returns (StopWorkflowResponse);
  rpc PauseWorkflow(PauseWorkflowRequest) returns (PauseWorkflowResponse);
  rpc ResumeWorkflow(ResumeWorkflowRequest) returns (ResumeWorkflowResponse);
  rpc RestartWorkflow(RestartWorkflowRequest) returns (RestartWorkflowResponse);
  
  // Workflow Status RPCs
  rpc GetWorkflowStatus(GetWorkflowStatusRequest) returns (GetWorkflowStatusResponse);
  rpc GetWorkflowHealth(GetWorkflowHealthRequest) returns (GetWorkflowHealthResponse);
  rpc GetWorkflowMetrics(GetWorkflowMetricsRequest) returns (GetWorkflowMetricsResponse);
  rpc GetWorkflowLogs(GetWorkflowLogsRequest) returns (GetWorkflowLogsResponse);
  
  // Workflow Execution RPCs
  rpc ExecuteWorkflow(ExecuteWorkflowRequest) returns (ExecuteWorkflowResponse);
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
  rpc SearchExecutions(SearchExecutionsRequest) returns (SearchExecutionsResponse);
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
  rpc GetExecutionStatus(GetExecutionStatusRequest) returns (GetExecutionStatusResponse);
  rpc GetExecutionProgress(GetExecutionProgressRequest) returns (GetExecutionProgressResponse);
  rpc GetExecutionLogs(GetExecutionLogsRequest) returns (GetExecutionLogsResponse);
  
  // Workflow Step RPCs
  rpc CreateStep(CreateStepRequest) returns (CreateStepResponse);
  rpc GetStep(GetStepRequest) returns (GetStepResponse);
  rpc UpdateStep(UpdateStepRequest) returns (UpdateStepResponse);
  rpc DeleteStep(DeleteStepRequest) returns (google.protobuf.Empty);
  rpc ListSteps(ListStepsRequest) returns (ListStepsResponse);
  rpc SearchSteps(SearchStepsRequest) returns (SearchStepsResponse);
  rpc ExecuteStep(ExecuteStepRequest) returns (ExecuteStepResponse);
  rpc GetStepStatus(GetStepStatusRequest) returns (GetStepStatusResponse);
  rpc GetStepProgress(GetStepProgressRequest) returns (GetStepProgressResponse);
  rpc GetStepLogs(GetStepLogsRequest) returns (GetStepLogsResponse);
  
  // Workflow Event RPCs
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc SearchEvents(SearchEventsRequest) returns (SearchEventsResponse);
  rpc ExportEvents(ExportEventsRequest) returns (ExportEventsResponse);
  rpc GetEventStatistics(GetEventStatisticsRequest) returns (GetEventStatisticsResponse);
  
  // Workflow Scheduling RPCs
  rpc ScheduleWorkflow(ScheduleWorkflowRequest) returns (ScheduleWorkflowResponse);
  rpc UnscheduleWorkflow(UnscheduleWorkflowRequest) returns (UnscheduleWorkflowResponse);
  rpc GetWorkflowSchedule(GetWorkflowScheduleRequest) returns (GetWorkflowScheduleResponse);
  rpc ListWorkflowSchedules(ListWorkflowSchedulesRequest) returns (ListWorkflowSchedulesResponse);
  
  // Workflow Versioning RPCs
  rpc CreateWorkflowVersion(CreateWorkflowVersionRequest) returns (CreateWorkflowVersionResponse);
  rpc GetWorkflowVersion(GetWorkflowVersionRequest) returns (GetWorkflowVersionResponse);
  rpc ListWorkflowVersions(ListWorkflowVersionsRequest) returns (ListWorkflowVersionsResponse);
  rpc DeleteWorkflowVersion(DeleteWorkflowVersionRequest) returns (google.protobuf.Empty);
  
  // Health and Status RPCs
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);
  rpc GetServiceStatus(google.protobuf.Empty) returns (ServiceStatusResponse);
  rpc GetServiceMetrics(google.protobuf.Empty) returns (ServiceMetricsResponse);
}

// Workflow Management Request/Response Messages

message CreateWorkflowRequest {
  // Workflow name
  string name = 1;
  
  // Workflow description
  string description = 2;
  
  // Workflow type
  automation.workflow.enums.WorkflowType workflow_type = 3;
  
  // Workflow configuration
  automation.workflow.messages.WorkflowConfiguration config = 4;
  
  // Workflow definition
  automation.workflow.messages.WorkflowDefinition definition = 5;
  
  // Workflow steps
  repeated automation.workflow.messages.WorkflowStep steps = 6;
  
  // Workflow variables
  map<string, automation.workflow.messages.WorkflowVariable> variables = 7;
  
  // Workflow triggers
  repeated automation.workflow.messages.WorkflowTrigger triggers = 8;
  
  // Workflow permissions
  automation.workflow.messages.WorkflowPermissions permissions = 9;
  
  // Workflow monitoring
  automation.workflow.messages.WorkflowMonitoring monitoring = 10;
  
  // Workflow metadata
  map<string, string> metadata = 11;
  
  // Workflow tags
  repeated string tags = 12;
  
  // Workflow owner
  string owner = 13;
  
  // Workflow environment
  string environment = 14;
}

message CreateWorkflowResponse {
  // Created workflow
  automation.workflow.messages.Workflow workflow = 1;
  
  // Response status
  string status = 2;
  
  // Response message
  string message = 3;
}

message GetWorkflowRequest {
  // Workflow ID
  string workflow_id = 1;
  
