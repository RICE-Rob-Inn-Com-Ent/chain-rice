syntax = "proto3";

package gaming.nft_assets.services;

import "gaming/nft-assets/messages/nft_models.proto";

option go_package = "github.com/rice-dev/gaming/nft-assets/services";

// Сервіс управління NFT
service NftService {
  // Створити NFT
  rpc CreateNft(CreateNftRequest) returns (CreateNftResponse);
  
  // Отримати NFT
  rpc GetNft(GetNftRequest) returns (GetNftResponse);
  
  // Оновити NFT
  rpc UpdateNft(UpdateNftRequest) returns (UpdateNftResponse);
  
  // Видалити NFT
  rpc DeleteNft(DeleteNftRequest) returns (DeleteNftResponse);
  
  // Отримати список NFT
  rpc ListNfts(ListNftsRequest) returns (ListNftsResponse);
  
  // Карбувати NFT
  rpc MintNft(MintNftRequest) returns (MintNftResponse);
  
  // Передати NFT
  rpc TransferNft(TransferNftRequest) returns (TransferNftResponse);
  
  // Отримати статистику NFT
  rpc GetNftStats(GetNftStatsRequest) returns (GetNftStatsResponse);
}

