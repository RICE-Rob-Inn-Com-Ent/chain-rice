option go_package = "github.com/rice-dev/gaming/game_economy/messages";

// Модель транзакції
message Transaction {
  // Унікальний ідентифікатор транзакції
  string transaction_id = 1;
  
  // Хеш транзакції
  string transaction_hash = 2;
  
  // Тип транзакції
  gaming.game_economy.enums.TransactionType type = 3;
  
  // Статус транзакції
  gaming.game_economy.enums.TransactionStatus status = 4;
  
  // Відправник
  string from_address = 5;
  
  // Отримувач
  string to_address = 6;
  
  // Сума транзакції
  string amount = 7;
  
  // Тип валюти
  gaming.game_economy.enums.CurrencyType currency_type = 8;
  
  // Комісія за транзакцію
  string fee = 9;
  
  // Тип комісії
  gaming.game_economy.enums.CurrencyType fee_currency_type = 10;
  
  // Газ (для блокчейн транзакцій)
  string gas = 11;
  
  // Ліміт газу
  string gas_limit = 12;
  
  // Ціна газу
  string gas_price = 13;
  
  // Номер блоку
  int64 block_number = 14;
  
  // Хеш блоку
  string block_hash = 15;
  
  // Індекс транзакції в блоці
  int32 transaction_index = 16;
  
  // Кількість підтверджень
  int32 confirmations = 17;
  
  // Мінімальна кількість підтверджень
  int32 min_confirmations = 18;
  
  // Час створення
  google.protobuf.Timestamp created_at = 19;
  
  // Час підтвердження
  google.protobuf.Timestamp confirmed_at = 20;
  
  // Час завершення
  google.protobuf.Timestamp completed_at = 21;
  
  // Час оновлення
  google.protobuf.Timestamp updated_at = 22;
  
  // Додаткові дані транзакції
  map<string, string> transaction_data = 23;
  
  // Метадані транзакції
  TransactionMetadata metadata = 24;
}

// Метадані транзакції
message TransactionMetadata {
  // Версія транзакції
  string version = 1;
  
  // Автор транзакції
  string author = 2;
  
  // Теги транзакції
  repeated string tags = 3;
  
  // Мова транзакції
  string language = 4;
  
  // Рейтинг транзакції
  double rating = 5;
  
  // Кількість переглядів
  int64 views = 6;
  
  // Кількість завантажень
  int64 downloads = 7;
  
  // Розмір файлу транзакції
  int64 file_size = 8;
  
  // Формат файлу транзакції
  string file_format = 9;
  
  // Додаткові метадані
  map<string, string> additional_data = 10;
}

