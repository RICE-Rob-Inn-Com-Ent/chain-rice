syntax = "proto3";

// Message definitions for a specific class session occurrence.
package education.classes.messages;

import "google/protobuf/timestamp.proto";
import "AUTO/modules/education/classes/enums/class_status.proto";

option go_package = "github.com/rice-dev/education/classes/messages;classesmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.classes.messages";

// A class session represents a single scheduled occurrence of a class.
message ClassSession {
  // Unique identifier for the session.
  string id = 1;

  // Reference to the parent class ID.
  string class_id = 2;

  // Start timestamp of the session.
  google.protobuf.Timestamp start_at = 3;

  // End timestamp of the session.
  google.protobuf.Timestamp end_at = 4;

  // Actual status of the session occurrence.
  education.classes.enums.ClassStatus status = 5;

  // Optional topic or focus of this session.
  string topic = 6;

  // Optional location override for this session.
  string location = 7;

  // Attendance summary for the session.
  AttendanceSummary attendance_summary = 8;

  // Arbitrary metadata for extensions.
  map<string, string> metadata = 9;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 10;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 11;

  // Nested attendance summary.
  message AttendanceSummary {
    // Number of students expected.
    int32 expected_count = 1;

    // Number of students present.
    int32 present_count = 2;

    // Number of students absent.
    int32 absent_count = 3;

    // Number of students late.
    int32 late_count = 4;
  }
}


