syntax = "proto3";

// Message definitions for Exam entity.
package education.exams.messages;

import "google/protobuf/timestamp.proto";
import "AUTO/modules/education/exams/enums/exam_type.proto";
import "AUTO/modules/education/exams/enums/exam_status.proto";

option go_package = "github.com/rice-dev/education/exams/messages;examsmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.exams.messages";

// An exam is an assessment associated with a course and class.
message Exam {
  // Unique identifier for the exam.
  string id = 1;

  // Parent course ID.
  string course_id = 2;

  // Optional class ID this exam relates to.
  string class_id = 3;

  // Title of the exam.
  string title = 4;

  // Detailed instructions for the exam.
  string instructions = 5;

  // Type of the assessment.
  education.exams.enums.ExamType type = 6;

  // Lifecycle status.
  education.exams.enums.ExamStatus status = 7;

  // Scheduled start timestamp.
  google.protobuf.Timestamp scheduled_start_at = 8;

  // Scheduled end timestamp.
  google.protobuf.Timestamp scheduled_end_at = 9;

  // Total points possible.
  double total_points = 10;

  // Arbitrary metadata for extensions.
  map<string, string> metadata = 11;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 12;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 13;
}


