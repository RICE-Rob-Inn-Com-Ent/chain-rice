syntax = "proto3";

// Exam lifecycle statuses.
package education.exams.enums;

option go_package = "github.com/rice-dev/education/exams/enums;examsenums";
option java_multiple_files = true;
option java_package = "com.rice.education.exams.enums";

// Lifecycle status for exams.
enum ExamStatus {
  EXAM_STATUS_UNSPECIFIED = 0; // Unknown
  EXAM_STATUS_DRAFT = 1;       // Being authored
  EXAM_STATUS_SCHEDULED = 2;   // Scheduled for a future time
  EXAM_STATUS_ONGOING = 3;     // In progress
  EXAM_STATUS_COMPLETED = 4;   // Finished
  EXAM_STATUS_GRADED = 5;      // Grading completed
  EXAM_STATUS_CANCELLED = 6;   // Cancelled
}


