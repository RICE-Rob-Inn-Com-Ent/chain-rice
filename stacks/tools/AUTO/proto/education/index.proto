syntax = "proto3";

// Education module index - comprehensive Protobuf definitions for education operations
// This module provides complete gRPC services for education management including
// classes, courses, exams, grading, students, and teachers.

package education;

// Classes
import "education/classes/enums/class_type.proto";
import "education/classes/enums/class_status.proto";
import "education/classes/enums/class_schedule.proto";
import "education/classes/messages/class.proto";
import "education/classes/messages/class_session.proto";
import "education/classes/messages/class_attendance.proto";
import "education/classes/services/class_service.proto";

// Courses
import "education/courses/enums/course_level.proto";
import "education/courses/enums/course_category.proto";
import "education/courses/enums/course_status.proto";
import "education/courses/messages/course.proto";
import "education/courses/messages/syllabus.proto";
import "education/courses/messages/module.proto";
import "education/courses/services/course_service.proto";

// Exams
import "education/exams/enums/exam_type.proto";
import "education/exams/enums/exam_status.proto";
import "education/exams/enums/exam_result.proto";
import "education/exams/messages/exam.proto";
import "education/exams/messages/question.proto";
import "education/exams/messages/answer.proto";
import "education/exams/services/exam_service.proto";

// Grading
import "education/grading/enums/grade_scale.proto";
import "education/grading/enums/grading_policy.proto";
import "education/grading/enums/grading_status.proto";
import "education/grading/messages/grade.proto";
import "education/grading/messages/transcript.proto";
import "education/grading/messages/grade_report.proto";
import "education/grading/services/grading_service.proto";

// Students
import "education/students/enums/student_status.proto";
import "education/students/enums/enrollment_type.proto";
import "education/students/enums/scholarship_type.proto";
import "education/students/messages/student.proto";
import "education/students/messages/enrollment.proto";
import "education/students/messages/student_activity.proto";
import "education/students/services/student_service.proto";

// Teachers
import "education/teachers/enums/teacher_status.proto";
import "education/teachers/enums/teacher_rank.proto";
import "education/teachers/enums/teaching_specialization.proto";
import "education/teachers/messages/teacher.proto";
import "education/teachers/messages/teaching_assignment.proto";
import "education/teachers/messages/teacher_evaluation.proto";
import "education/teachers/services/teacher_service.proto";

option go_package = "github.com/rice-dev/education;education";
option java_multiple_files = true;
option java_package = "com.rice.education";


