syntax = "proto3";

// Grade scale representations.
package education.grading.enums;

option go_package = "github.com/rice-dev/education/grading/enums;grdgenums";
option java_multiple_files = true;
option java_package = "com.rice.education.grading.enums";

// Common grade scales.
enum GradeScale {
  GRADE_SCALE_UNSPECIFIED = 0; // Unknown
  GRADE_SCALE_PERCENTAGE = 1;  // 0-100%
  GRADE_SCALE_LETTER = 2;      // A-F
  GRADE_SCALE_GPA_4 = 3;       // 0.0-4.0
  GRADE_SCALE_GPA_5 = 4;       // 0.0-5.0
  GRADE_SCALE_PASS_FAIL = 5;   // P/F
}


