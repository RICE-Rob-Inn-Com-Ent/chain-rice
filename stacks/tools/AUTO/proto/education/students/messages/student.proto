syntax = "proto3";

// Message definitions for Student entity.
package education.students.messages;

import "google/protobuf/timestamp.proto";
import "AUTO/modules/education/students/enums/student_status.proto";

option go_package = "github.com/rice-dev/education/students/messages;studentsmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.students.messages";

// Represents a student in the education system.
message Student {
  // Unique identifier for the student.
  string id = 1;

  // Full name of the student.
  string full_name = 2;

  // Email address.
  string email = 3;

  // Current status of the student.
  education.students.enums.StudentStatus status = 4;

  // Enrollment records for the student.
  repeated EnrollmentSummary enrollments = 5;

  // Arbitrary metadata for extensions.
  map<string, string> metadata = 6;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 7;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 8;

  // Nested brief enrollment summary.
  message EnrollmentSummary {
    // Enrollment ID.
    string enrollment_id = 1;
    // Course ID enrolled in.
    string course_id = 2;
    // Term identifier.
    string term = 3;
  }
}


