syntax = "proto3";

// Scholarship types.
package education.students.enums;

option go_package = "github.com/rice-dev/education/students/enums;studentsenums";
option java_multiple_files = true;
option java_package = "com.rice.education.students.enums";

// Types of scholarships a student may receive.
enum ScholarshipType {
  SCHOLARSHIP_TYPE_UNSPECIFIED = 0; // Unknown
  SCHOLARSHIP_TYPE_MERIT = 1;       // Merit-based
  SCHOLARSHIP_TYPE_NEED = 2;        // Need-based
  SCHOLARSHIP_TYPE_ATHLETIC = 3;    // Athletic
  SCHOLARSHIP_TYPE_RESEARCH = 4;    // Research/assistantship
  SCHOLARSHIP_TYPE_TUITION_WAIVER = 5; // Tuition waiver
}


