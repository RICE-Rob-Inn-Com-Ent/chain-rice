syntax = "proto3";

// Teacher academic ranks.
package education.teachers.enums;

option go_package = "github.com/rice-dev/education/teachers/enums;teachersenums";
option java_multiple_files = true;
option java_package = "com.rice.education.teachers.enums";

// Academic ranks.
enum TeacherRank {
  TEACHER_RANK_UNSPECIFIED = 0; // Unknown
  TEACHER_RANK_INSTRUCTOR = 1;  // Instructor
  TEACHER_RANK_LECTURER = 2;    // Lecturer
  TEACHER_RANK_SENIOR_LECTURER = 3; // Senior Lecturer
  TEACHER_RANK_ASSISTANT_PROFESSOR = 4; // Assistant Professor
  TEACHER_RANK_ASSOCIATE_PROFESSOR = 5; // Associate Professor
  TEACHER_RANK_PROFESSOR = 6;   // Professor
  TEACHER_RANK_EMERITUS = 7;    // Emeritus
}


