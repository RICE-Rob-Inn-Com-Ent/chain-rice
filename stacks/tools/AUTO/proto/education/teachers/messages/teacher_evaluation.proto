syntax = "proto3";

// Message definitions for teacher evaluations.
package education.teachers.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/education/teachers/messages;teachersmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.teachers.messages";

// Evaluation record for a teacher's performance.
message TeacherEvaluation {
  // Unique identifier for the evaluation.
  string id = 1;

  // Teacher being evaluated.
  string teacher_id = 2;

  // Course context (optional).
  string course_id = 3;

  // Textual feedback summary.
  string feedback = 4;

  // Numeric rating [0.0 - 5.0].
  double rating = 5;

  // Timestamp when the evaluation was submitted.
  google.protobuf.Timestamp submitted_at = 6;
}


