syntax = "proto3";

// Message definitions for Teacher entity.
package education.teachers.messages;

import "google/protobuf/timestamp.proto";
import "AUTO/modules/education/teachers/enums/teacher_status.proto";
import "AUTO/modules/education/teachers/enums/teacher_rank.proto";
import "AUTO/modules/education/teachers/enums/teaching_specialization.proto";

option go_package = "github.com/rice-dev/education/teachers/messages;teachersmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.teachers.messages";

// Represents a teacher/faculty member.
message Teacher {
  // Unique identifier for the teacher.
  string id = 1;

  // Full name of the teacher.
  string full_name = 2;

  // Email address.
  string email = 3;

  // Current employment/engagement status.
  education.teachers.enums.TeacherStatus status = 4;

  // Academic rank.
  education.teachers.enums.TeacherRank rank = 5;

  // Areas of specialization.
  repeated education.teachers.enums.TeachingSpecialization specializations = 6;

  // Arbitrary metadata for extensions.
  map<string, string> metadata = 7;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 8;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 9;
}


