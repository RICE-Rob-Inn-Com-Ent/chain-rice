syntax = "proto3";

package tourism.flights.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";
import "tourism/flights/enums/flight_class.proto";
import "tourism/flights/enums/flight_status.proto";

// Flight represents a flight entity
message Flight {
  // Unique identifier for the flight
  string flight_id = 1;
  
  // Flight number
  string flight_number = 2;
  
  // Airline code
  string airline_code = 3;
  
  // Departure airport code
  string departure_airport = 4;
  
  // Arrival airport code
  string arrival_airport = 5;
  
  // Scheduled departure time
  google.protobuf.Timestamp departure_time = 6;
  
  // Scheduled arrival time
  google.protobuf.Timestamp arrival_time = 7;
  
  // Actual departure time (if available)
  google.protobuf.Timestamp actual_departure_time = 8;
  
  // Actual arrival time (if available)
  google.protobuf.Timestamp actual_arrival_time = 9;
  
  // Aircraft type
  string aircraft_type = 10;
  
  // Current flight status
  tourism.flights.enums.FlightStatus status = 11;
  
  // Flight duration in minutes
  int32 duration_minutes = 12;
  
  // Available seats by class
  repeated SeatAvailability seats_by_class = 13;
  
  // Flight prices by class
  repeated FlightPrice prices_by_class = 14;
  
  // Gate information
  google.protobuf.StringValue gate = 15;
  
  // Terminal information
  google.protobuf.StringValue terminal = 16;
  
  // Baggage information
  BaggageInfo baggage_info = 17;
  
  // Flight amenities
  repeated string amenities = 18;
  
  // Route information
  RouteInfo route_info = 19;
  
  // Flight delays and changes
  repeated FlightUpdate flight_updates = 20;
  
  // Date when the flight was created
  google.protobuf.Timestamp created_at = 21;
  
  // Date when the flight was last updated
  google.protobuf.Timestamp updated_at = 22;
}

// CreateFlightResponse represents the response after creating a flight
message CreateFlightResponse {
  // The created flight
  Flight flight = 1;
  
  // Success message
  string message = 2;
}

// UpdateFlightResponse represents the response after updating a flight
message UpdateFlightResponse {
  // The updated flight
  Flight flight = 1;
  
  // Success message
  string message = 2;
}

// GetFlightResponse represents the response after retrieving a flight
message GetFlightResponse {
  // The retrieved flight
  Flight flight = 1;
}

// ListFlightsResponse represents the response after listing flights
message ListFlightsResponse {
  // List of flights matching the criteria
  repeated Flight flights = 1;
  
  // Total count of flights matching the criteria
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Page size used
  int32 page_size = 4;
  
  // Total number of pages available
  int32 total_pages = 5;
}

// DeleteFlightResponse represents the response after deleting a flight
message DeleteFlightResponse {
  // Success message
  string message = 1;
  
  // Deletion timestamp
  google.protobuf.Timestamp deleted_at = 2;
}

// SearchFlightsResponse represents the response after searching flights
message SearchFlightsResponse {
  // List of matching flights
  repeated FlightSearchResult flights = 1;
  
  // Total count of matching flights
  int32 total_count = 2;
  
  // Search parameters used
  SearchFlightsRequest search_parameters = 3;
  
  // Search execution time in milliseconds
  int32 execution_time_ms = 4;
  
  // Alternative flight suggestions
  repeated FlightSearchResult alternative_flights = 5;
  
  // Price alerts (if applicable)
  repeated PriceAlert price_alerts = 6;
}

// FlightSearchResult represents a flight search result
message FlightSearchResult {
  // Flight information
  Flight flight = 1;
  
  // Best price for the search criteria
  FlightPrice best_price = 2;
  
  // All available prices by class
  repeated FlightPrice all_prices = 3;
  
  // Flight rating/score
  google.protobuf.DoubleValue flight_score = 4;
  
  // Popular flight indicator
  bool is_popular = 5;
  
  // Recommended flight indicator
  bool is_recommended = 6;
  
  // Booking urgency (low, medium, high)
  google.protobuf.StringValue booking_urgency = 7;
  
  // Fare rules
  google.protobuf.StringValue fare_rules = 8;
}

// PriceAlert represents a price alert for flights
message PriceAlert {
  // Alert ID
  string alert_id = 1;
  
  // Route (departure to arrival)
  string route = 2;
  
  // Target price (in smallest currency unit)
  int64 target_price = 3;
  
  // Current lowest price
  int64 current_lowest_price = 4;
  
  // Alert type (price_drop, price_increase)
  string alert_type = 5;
  
  // Alert status (active, triggered, expired)
  string alert_status = 6;
}

// SeatAvailability represents seat availability for a flight class
message SeatAvailability {
  // Flight class
  tourism.flights.enums.FlightClass flight_class = 1;
  
  // Number of available seats
  int32 available_seats = 2;
  
  // Total seats in this class
  int32 total_seats = 3;
  
  // Seat configuration
  google.protobuf.StringValue seat_configuration = 4;
  
  // Seat map (optional)
  google.protobuf.StringValue seat_map = 5;
}

// FlightPrice represents pricing for a flight class
message FlightPrice {
  // Flight class
  tourism.flights.enums.FlightClass flight_class = 1;
  
  // Base price (in smallest currency unit)
  int64 base_price = 2;
  
  // Taxes and fees (in smallest currency unit)
  int64 taxes_and_fees = 3;
  
  // Total price (in smallest currency unit)
  int64 total_price = 4;
  
  // Currency code (ISO 4217 format)
  string currency = 5;
  
  // Price breakdown
  repeated PriceBreakdown price_breakdown = 6;
  
  // Fare type (refundable, non-refundable, flexible)
  google.protobuf.StringValue fare_type = 7;
  
  // Booking class code
  google.protobuf.StringValue booking_class = 8;
  
  // Price validity period
  google.protobuf.Timestamp price_valid_until = 9;
}

// PriceBreakdown represents detailed price breakdown
message PriceBreakdown {
  // Price component name
  string component_name = 1;
  
  // Price amount (in smallest currency unit)
  int64 amount = 2;
  
  // Currency code
  string currency = 3;
  
  // Component type (base_fare, tax, fee, surcharge)
  google.protobuf.StringValue component_type = 4;
}

// BaggageInfo represents baggage information for a flight
message BaggageInfo {
  // Carry-on baggage allowance
  BaggageAllowance carry_on = 1;
  
  // Checked baggage allowance
  BaggageAllowance checked = 2;
  
  // Additional baggage fees
  repeated BaggageFee additional_fees = 3;
  
  // Baggage restrictions
  repeated string restrictions = 4;
  
  // Special items policy
  google.protobuf.StringValue special_items_policy = 5;
}

// BaggageAllowance represents baggage allowance details
message BaggageAllowance {
  // Number of bags allowed
  int32 bags_allowed = 1;
  
  // Weight limit per bag (in kg)
  google.protobuf.DoubleValue weight_limit_kg = 2;
  
  // Size limit (length + width + height in cm)
  google.protobuf.DoubleValue size_limit_cm = 3;
  
  // Whether included in fare
  bool included_in_fare = 4;
  
  // Baggage dimensions (length x width x height)
  google.protobuf.StringValue dimensions = 5;
}

// BaggageFee represents additional baggage fees
message BaggageFee {
  // Number of bags
  int32 bag_count = 1;
  
  // Fee amount (in smallest currency unit)
  int64 fee_amount = 2;
  
  // Currency code
  string currency = 3;
  
  // Fee description
  google.protobuf.StringValue description = 4;
  
  // Fee type (additional_bag, overweight, oversize)
  google.protobuf.StringValue fee_type = 5;
}

// RouteInfo represents flight route information
message RouteInfo {
  // Distance in kilometers
  google.protobuf.DoubleValue distance_km = 1;
  
  // Flight path coordinates
  repeated Coordinate flight_path = 2;
  
  // Estimated fuel consumption
  google.protobuf.DoubleValue estimated_fuel_kg = 3;
  
  // Time zones crossed
  repeated string time_zones = 4;
  
  // Countries overflown
  repeated string countries_overflown = 5;
  
  // Flight path description
  google.protobuf.StringValue path_description = 6;
}

// Coordinate represents a geographic coordinate
message Coordinate {
  // Latitude
  double latitude = 1;
  
  // Longitude
  double longitude = 2;
  
  // Altitude (optional)
  google.protobuf.DoubleValue altitude = 3;
}

// FlightUpdate represents flight status updates and changes
message FlightUpdate {
  // Update timestamp
  google.protobuf.Timestamp update_time = 1;
  
  // Update type (delay, gate_change, cancellation, etc.)
  string update_type = 2;
  
  // Update message
  string message = 3;
  
  // Previous value (if applicable)
  google.protobuf.StringValue previous_value = 4;
  
  // New value (if applicable)
  google.protobuf.StringValue new_value = 5;
  
  // Update source (airline, airport, system)
  google.protobuf.StringValue update_source = 6;
}

// FlightSummary represents a summary view of flight information
message FlightSummary {
  // Flight ID
  string flight_id = 1;
  
  // Flight number
  string flight_number = 2;
  
  // Airline code
  string airline_code = 3;
  
  // Route (departure to arrival)
  string route = 4;
  
  // Departure time
  google.protobuf.Timestamp departure_time = 5;
  
  // Arrival time
  google.protobuf.Timestamp arrival_time = 6;
  
  // Flight status
  tourism.flights.enums.FlightStatus status = 7;
  
  // Duration in minutes
  int32 duration_minutes = 8;
  
  // Lowest price available
  int64 lowest_price = 9;
  
  // Currency
  string currency = 10;
  
  // Available seats
  int32 available_seats = 11;
  
  // Flight class with lowest price
  tourism.flights.enums.FlightClass cheapest_class = 12;
}
