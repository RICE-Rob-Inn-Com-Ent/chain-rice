syntax = "proto3";

package tourism.flights.enums;

// FlightClass represents the different classes of service available on a flight
enum FlightClass {
  // Unspecified class - should not be used in production
  FLIGHT_CLASS_UNSPECIFIED = 0;
  
  // Economy class - basic service
  ECONOMY = 1;
  
  // Premium economy class - enhanced economy service
  PREMIUM_ECONOMY = 2;
  
  // Business class - premium service
  BUSINESS = 3;
  
  // First class - highest level of service
  FIRST = 4;
  
  // Basic economy - most restrictive economy option
  BASIC_ECONOMY = 5;
  
  // Main cabin - standard economy
  MAIN_CABIN = 6;
  
  // Comfort plus - enhanced economy with extra legroom
  COMFORT_PLUS = 7;
  
  // Premium business - enhanced business class
  PREMIUM_BUSINESS = 8;
  
  // Suite - private suite in first class
  SUITE = 9;
}
