syntax = "proto3";

package tourism.hotels.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";
import "tourism/hotels/enums/room_type.proto";
import "tourism/hotels/enums/hotel_rating.proto";

// CreateHotelRequest represents a request to create a new hotel
message CreateHotelRequest {
  // Hotel name
  string name = 1;
  
  // Hotel description
  string description = 2;
  
  // Hotel location information
  LocationInfo location = 3;
  
  // Hotel rating/classification
  tourism.hotels.enums.HotelRating rating = 4;
  
  // Contact information
  ContactInfo contact_info = 5;
  
  // Hotel amenities
  repeated string amenities = 6;
  
  // Room types available
  repeated RoomTypeInfo room_types = 7;
  
  // Check-in and check-out policies
  CheckInOutPolicy check_in_out_policy = 8;
  
  // Cancellation policy
  CancellationPolicy cancellation_policy = 9;
  
  // Pet policy
  google.protobuf.StringValue pet_policy = 10;
  
  // Age restrictions
  google.protobuf.StringValue age_restrictions = 11;
  
  // Hotel chain/brand
  google.protobuf.StringValue hotel_chain = 12;
  
  // Languages spoken by staff
  repeated string languages_spoken = 13;
  
  // Currency accepted
  repeated string currencies_accepted = 14;
  
  // Payment methods accepted
  repeated string payment_methods = 15;
}

// UpdateHotelRequest represents a request to update an existing hotel
message UpdateHotelRequest {
  // Hotel ID to update
  string hotel_id = 1;
  
  // Optional new name
  google.protobuf.StringValue name = 2;
  
  // Optional new description
  google.protobuf.StringValue description = 3;
  
  // Optional new location information
  LocationInfo location = 4;
  
  // Optional new rating
  tourism.hotels.enums.HotelRating rating = 5;
  
  // Optional new contact information
  ContactInfo contact_info = 6;
  
  // Optional new amenities
  repeated string amenities = 7;
  
  // Optional new room types
  repeated RoomTypeInfo room_types = 8;
  
  // Optional new policies
  CheckInOutPolicy check_in_out_policy = 9;
  CancellationPolicy cancellation_policy = 10;
}

// GetHotelRequest represents a request to retrieve a specific hotel
message GetHotelRequest {
  // Hotel ID to retrieve
  string hotel_id = 1;
}

// ListHotelsRequest represents a request to list hotels with filtering
message ListHotelsRequest {
  // Location filter (city, country, region)
  google.protobuf.StringValue location = 1;
  
  // Hotel rating filter (optional)
  tourism.hotels.enums.HotelRating rating = 2;
  
  // Amenities filter (optional)
  repeated string required_amenities = 3;
  
  // Price range filter (optional)
  google.protobuf.DoubleValue min_price = 4;
  google.protobuf.DoubleValue max_price = 5;
  
  // Hotel chain filter (optional)
  google.protobuf.StringValue hotel_chain = 6;
  
  // Pet-friendly filter (optional)
  google.protobuf.StringValue pet_friendly = 7;
  
  // Page number for pagination (starts from 1)
  int32 page = 8;
  
  // Page size for pagination (max 100)
  int32 page_size = 9;
}

// DeleteHotelRequest represents a request to delete a hotel
message DeleteHotelRequest {
  // Hotel ID to delete
  string hotel_id = 1;
}

// SearchHotelsRequest represents a request to search for hotels
message SearchHotelsRequest {
  // Search location
  string location = 1;
  
  // Check-in date
  google.protobuf.Timestamp check_in_date = 2;
  
  // Check-out date
  google.protobuf.Timestamp check_out_date = 3;
  
  // Number of rooms
  int32 number_of_rooms = 4;
  
  // Number of guests
  int32 number_of_guests = 5;
  
  // Preferred room types
  repeated tourism.hotels.enums.RoomType preferred_room_types = 6;
  
  // Hotel rating preference
  tourism.hotels.enums.HotelRating min_rating = 7;
  
  // Maximum price per night
  google.protobuf.DoubleValue max_price_per_night = 8;
  
  // Required amenities
  repeated string required_amenities = 9;
  
  // Hotel chain preference
  google.protobuf.StringValue preferred_hotel_chain = 10;
  
  // Sort preference (price, rating, distance)
  google.protobuf.StringValue sort_by = 11;
  
  // Distance from center (in km)
  google.protobuf.DoubleValue max_distance_from_center = 12;
}

// LocationInfo represents hotel location information
message LocationInfo {
  // Street address
  string street_address = 1;
  
  // City
  string city = 2;
  
  // State or province
  google.protobuf.StringValue state_province = 3;
  
  // Country
  string country = 4;
  
  // Postal code
  google.protobuf.StringValue postal_code = 5;
  
  // Latitude coordinate
  google.protobuf.DoubleValue latitude = 6;
  
  // Longitude coordinate
  google.protobuf.DoubleValue longitude = 7;
  
  // Nearby landmarks
  repeated string nearby_landmarks = 8;
  
  // Distance to airport (in km)
  google.protobuf.DoubleValue distance_to_airport_km = 9;
  
  // Distance to city center (in km)
  google.protobuf.DoubleValue distance_to_city_center_km = 10;
  
  // Transportation options
  repeated string transportation_options = 11;
}

// ContactInfo represents hotel contact information
message ContactInfo {
  // Phone number
  string phone = 1;
  
  // Email address
  string email = 2;
  
  // Website URL
  google.protobuf.StringValue website = 3;
  
  // Fax number
  google.protobuf.StringValue fax = 4;
  
  // Social media links
  repeated string social_media_links = 5;
  
  // Emergency contact
  google.protobuf.StringValue emergency_contact = 6;
}

// RoomTypeInfo represents information about a room type
message RoomTypeInfo {
  // Room type
  tourism.hotels.enums.RoomType room_type = 1;
  
  // Number of rooms of this type
  int32 room_count = 2;
  
  // Maximum occupancy
  int32 max_occupancy = 3;
  
  // Room size in square meters
  google.protobuf.DoubleValue room_size_sqm = 4;
  
  // Base price per night (in smallest currency unit)
  int64 base_price_per_night = 5;
  
  // Currency code
  string currency = 6;
  
  // Room amenities
  repeated string room_amenities = 7;
  
  // Bed configuration
  google.protobuf.StringValue bed_configuration = 8;
  
  // Room features
  repeated string room_features = 9;
  
  // Smoking policy
  google.protobuf.StringValue smoking_policy = 10;
  
  // View type
  google.protobuf.StringValue view_type = 11;
}

// CheckInOutPolicy represents check-in and check-out policies
message CheckInOutPolicy {
  // Check-in time
  string check_in_time = 1;
  
  // Check-out time
  string check_out_time = 2;
  
  // Early check-in availability
  google.protobuf.StringValue early_check_in = 3;
  
  // Late check-out availability
  google.protobuf.StringValue late_check_out = 4;
  
  // Minimum age for check-in
  google.protobuf.DoubleValue minimum_check_in_age = 5;
  
  // Required identification
  google.protobuf.StringValue required_identification = 6;
  
  // Security deposit policy
  google.protobuf.StringValue security_deposit_policy = 7;
}

// CancellationPolicy represents hotel cancellation policy
message CancellationPolicy {
  // Cancellation deadline
  google.protobuf.StringValue cancellation_deadline = 1;
  
  // Cancellation fees
  google.protobuf.StringValue cancellation_fees = 2;
  
  // Refund policy
  google.protobuf.StringValue refund_policy = 3;
  
  // No-show policy
  google.protobuf.StringValue no_show_policy = 4;
  
  // Modification policy
  google.protobuf.StringValue modification_policy = 5;
  
  // Force majeure policy
  google.protobuf.StringValue force_majeure_policy = 6;
}
