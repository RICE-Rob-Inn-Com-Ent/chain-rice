syntax = "proto3";

package tourism;

import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";

// Tourism module index - Unified access to all tourism microservices
// This file provides a single entry point for all tourism-related gRPC services

// ============================================================================
// BOOKINGS MODULE IMPORTS
// ============================================================================

// Booking Enums
import "tourism/bookings/enums/booking_status.proto";
import "tourism/bookings/enums/payment_status.proto";

// Booking Messages
import "tourism/bookings/messages/booking_request.proto";
import "tourism/bookings/messages/booking_response.proto";

// Booking Services
import "tourism/bookings/services/booking_service.proto";

// ============================================================================
// FLIGHTS MODULE IMPORTS
// ============================================================================

// Flight Enums
import "tourism/flights/enums/flight_class.proto";
import "tourism/flights/enums/flight_status.proto";

// Flight Messages
import "tourism/flights/messages/flight_request.proto";
import "tourism/flights/messages/flight_response.proto";

// Flight Services
import "tourism/flights/services/flight_service.proto";

// ============================================================================
// HOTELS MODULE IMPORTS
// ============================================================================

// Hotel Enums
import "tourism/hotels/enums/room_type.proto";
import "tourism/hotels/enums/hotel_rating.proto";

// Hotel Messages
import "tourism/hotels/messages/hotel_request.proto";
import "tourism/hotels/messages/hotel_response.proto";

// Hotel Services
import "tourism/hotels/services/hotel_service.proto";

// ============================================================================
// TOURS MODULE IMPORTS
// ============================================================================

// Tour Enums
import "tourism/tours/enums/tour_type.proto";
import "tourism/tours/enums/tour_status.proto";

// Tour Messages
import "tourism/tours/messages/tour_request.proto";
import "tourism/tours/messages/tour_response.proto";

// Tour Services
import "tourism/tours/services/tour_service.proto";

// ============================================================================
// UNIFIED TOURISM SERVICE
// ============================================================================

// TourismService provides a unified interface to all tourism microservices
// This allows clients to access all tourism functionality through a single service
service TourismService {
  // Booking Management
  rpc CreateBooking(tourism.bookings.messages.CreateBookingRequest) returns (tourism.bookings.messages.CreateBookingResponse);
  rpc GetBooking(tourism.bookings.messages.GetBookingRequest) returns (tourism.bookings.messages.GetBookingResponse);
  rpc ListBookings(tourism.bookings.messages.ListBookingsRequest) returns (tourism.bookings.messages.ListBookingsResponse);
  rpc CancelBooking(tourism.bookings.messages.CancelBookingRequest) returns (tourism.bookings.messages.CancelBookingResponse);
  
  // Flight Management
  rpc SearchFlights(tourism.flights.messages.SearchFlightsRequest) returns (tourism.flights.messages.SearchFlightsResponse);
  rpc GetFlight(tourism.flights.messages.GetFlightRequest) returns (tourism.flights.messages.GetFlightResponse);
  rpc ListFlights(tourism.flights.messages.ListFlightsRequest) returns (tourism.flights.messages.ListFlightsResponse);
  rpc CompareFlightPrices(tourism.flights.services.CompareFlightPricesRequest) returns (tourism.flights.services.CompareFlightPricesResponse);
  
  // Hotel Management
  rpc SearchHotels(tourism.hotels.messages.SearchHotelsRequest) returns (tourism.hotels.messages.SearchHotelsResponse);
  rpc GetHotel(tourism.hotels.messages.GetHotelRequest) returns (tourism.hotels.messages.GetHotelResponse);
  rpc ListHotels(tourism.hotels.messages.ListHotelsRequest) returns (tourism.hotels.messages.ListHotelsResponse);
  rpc CompareHotelPrices(tourism.hotels.services.CompareHotelPricesRequest) returns (tourism.hotels.services.CompareHotelPricesResponse);
  
  // Tour Management
  rpc SearchTours(tourism.tours.messages.SearchToursRequest) returns (tourism.tours.messages.SearchToursResponse);
  rpc GetTour(tourism.tours.messages.GetTourRequest) returns (tourism.tours.messages.GetTourResponse);
  rpc ListTours(tourism.tours.messages.ListToursRequest) returns (tourism.tours.messages.ListToursResponse);
  rpc BookTourParticipants(tourism.tours.services.BookTourParticipantsRequest) returns (tourism.tours.services.BookTourParticipantsResponse);
  
  // Unified Operations
  rpc GetTravelDashboard(GetTravelDashboardRequest) returns (GetTravelDashboardResponse);
  rpc CreateTravelPackage(CreateTravelPackageRequest) returns (CreateTravelPackageResponse);
  rpc GetTravelRecommendations(GetTravelRecommendationsRequest) returns (GetTravelRecommendationsResponse);
  rpc GetTourismAnalytics(GetTourismAnalyticsRequest) returns (GetTourismAnalyticsResponse);
}

// ============================================================================
// UNIFIED REQUEST/RESPONSE MESSAGES
// ============================================================================

// GetTravelDashboardRequest represents a request to get comprehensive travel dashboard
message GetTravelDashboardRequest {
  // Customer ID to get dashboard for
  string customer_id = 1;
  
  // Date range for dashboard data
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  
  // Dashboard sections to include
  repeated string sections = 4; // ["bookings", "flights", "hotels", "tours", "recommendations"]
}

// GetTravelDashboardResponse represents comprehensive travel dashboard data
message GetTravelDashboardResponse {
  // Customer ID
  string customer_id = 1;
  
  // Recent bookings
  repeated tourism.bookings.messages.BookingSummary recent_bookings = 2;
  
  // Upcoming flights
  repeated tourism.flights.messages.FlightSummary upcoming_flights = 3;
  
  // Hotel reservations
  repeated tourism.hotels.messages.HotelSummary hotel_reservations = 4;
  
  // Tour bookings
  repeated tourism.tours.messages.TourSummary tour_bookings = 5;
  
  // Travel recommendations
  TravelRecommendations travel_recommendations = 6;
  
  // Travel statistics
  TravelStatistics travel_statistics = 7;
  
  // Generated at timestamp
  google.protobuf.Timestamp generated_at = 8;
}

// TravelRecommendations represents travel recommendations for the customer
message TravelRecommendations {
  // Flight recommendations
  repeated tourism.flights.messages.FlightSearchResult recommended_flights = 1;
  
  // Hotel recommendations
  repeated tourism.hotels.messages.HotelSearchResult recommended_hotels = 2;
  
  // Tour recommendations
  repeated tourism.tours.messages.TourSearchResult recommended_tours = 3;
  
  // Travel packages
  repeated TravelPackage travel_packages = 4;
  
  // Deals and offers
  repeated TravelDeal deals_and_offers = 5;
  
  // Destination recommendations
  repeated DestinationRecommendation destination_recommendations = 6;
}

// TravelPackage represents a travel package combining multiple services
message TravelPackage {
  // Package ID
  string package_id = 1;
  
  // Package name
  string name = 2;
  
  // Package description
  string description = 3;
  
  // Package type (flight_hotel, all_inclusive, adventure, etc.)
  string package_type = 4;
  
  // Total package price
  int64 total_price = 5;
  
  // Currency
  string currency = 6;
  
  // Package duration in days
  int32 duration_days = 7;
  
  // Included services
  repeated string included_services = 8;
  
  // Package destinations
  repeated string destinations = 9;
  
  // Package rating
  google.protobuf.DoubleValue package_rating = 10;
  
  // Number of reviews
  int32 review_count = 11;
  
  // Package images
  repeated string images = 12;
  
  // Booking deadline
  google.protobuf.Timestamp booking_deadline = 13;
  
  // Travel dates
  google.protobuf.Timestamp travel_start_date = 14;
  google.protobuf.Timestamp travel_end_date = 15;
}

// TravelDeal represents a special travel deal or offer
message TravelDeal {
  // Deal ID
  string deal_id = 1;
  
  // Deal title
  string title = 2;
  
  // Deal description
  string description = 3;
  
  // Deal type (discount, package, early_bird, etc.)
  string deal_type = 4;
  
  // Discount percentage
  google.protobuf.DoubleValue discount_percentage = 5;
  
  // Discount amount
  int64 discount_amount = 6;
  
  // Original price
  int64 original_price = 7;
  
  // Deal price
  int64 deal_price = 8;
  
  // Currency
  string currency = 9;
  
  // Deal validity period
  google.protobuf.Timestamp valid_from = 10;
  google.protobuf.Timestamp valid_until = 11;
  
  // Deal conditions
  repeated string conditions = 12;
  
  // Applicable services
  repeated string applicable_services = 13;
}

// DestinationRecommendation represents a destination recommendation
message DestinationRecommendation {
  // Destination name
  string destination = 1;
  
  // Destination country
  string country = 2;
  
  // Recommendation score
  google.protobuf.DoubleValue recommendation_score = 3;
  
  // Reasons for recommendation
  repeated string reasons = 4;
  
  // Best time to visit
  google.protobuf.StringValue best_time_to_visit = 5;
  
  // Average cost per day
  int64 average_cost_per_day = 6;
  
  // Currency
  string currency = 7;
  
  // Popular attractions
  repeated string popular_attractions = 8;
  
  // Travel tips
  repeated string travel_tips = 9;
  
  // Weather information
  google.protobuf.StringValue weather_info = 10;
  
  // Destination images
  repeated string images = 11;
}

// TravelStatistics represents travel statistics for the customer
message TravelStatistics {
  // Total trips taken
  int32 total_trips = 1;
  
  // Total countries visited
  int32 countries_visited = 2;
  
  // Total cities visited
  int32 cities_visited = 3;
  
  // Total amount spent
  int64 total_amount_spent = 4;
  
  // Currency
  string currency = 5;
  
  // Average trip duration
  google.protobuf.DoubleValue average_trip_duration_days = 6;
  
  // Most visited destination
  google.protobuf.StringValue most_visited_destination = 7;
  
  // Favorite travel type
  google.protobuf.StringValue favorite_travel_type = 8;
  
  // Travel frequency
  google.protobuf.StringValue travel_frequency = 9;
  
  // Last trip date
  google.protobuf.Timestamp last_trip_date = 10;
  
  // Next trip date
  google.protobuf.Timestamp next_trip_date = 11;
}

// CreateTravelPackageRequest represents a request to create a travel package
message CreateTravelPackageRequest {
  // Package name
  string package_name = 1;
  
  // Package description
  string package_description = 2;
  
  // Package type
  string package_type = 3;
  
  // Customer ID
  string customer_id = 4;
  
  // Package components
  repeated PackageComponent components = 5;
  
  // Travel dates
  google.protobuf.Timestamp travel_start_date = 6;
  google.protobuf.Timestamp travel_end_date = 7;
  
  // Number of travelers
  int32 number_of_travelers = 8;
  
  // Special requirements
  google.protobuf.StringValue special_requirements = 9;
  
  // Budget constraints
  google.protobuf.DoubleValue max_budget = 10;
  
  // Preferred destinations
  repeated string preferred_destinations = 11;
}

// PackageComponent represents a component of a travel package
message PackageComponent {
  // Component type (flight, hotel, tour, car_rental, etc.)
  string component_type = 1;
  
  // Component ID
  string component_id = 2;
  
  // Component details
  google.protobuf.StringValue component_details = 3;
  
  // Component price
  int64 component_price = 4;
  
  // Currency
  string currency = 5;
  
  // Component dates
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  
  // Component requirements
  repeated string requirements = 8;
}

// CreateTravelPackageResponse represents the response after creating a travel package
message CreateTravelPackageResponse {
  // Created travel package
  TravelPackage travel_package = 1;
  
  // Success message
  string message = 2;
  
  // Package creation timestamp
  google.protobuf.Timestamp created_at = 3;
  
  // Total package cost
  int64 total_cost = 4;
  
  // Currency
  string currency = 5;
  
  // Package booking instructions
  google.protobuf.StringValue booking_instructions = 6;
}

// GetTravelRecommendationsRequest represents a request to get travel recommendations
message GetTravelRecommendationsRequest {
  // Customer ID
  string customer_id = 1;
  
  // Travel preferences
  TravelPreferences preferences = 2;
  
  // Budget constraints
  BudgetConstraints budget = 3;
  
  // Travel dates
  google.protobuf.Timestamp travel_start_date = 4;
  google.protobuf.Timestamp travel_end_date = 5;
  
  // Number of travelers
  int32 number_of_travelers = 6;
  
  // Recommendation type (destinations, activities, packages, deals)
  string recommendation_type = 7;
  
  // Maximum number of recommendations
  int32 max_recommendations = 8;
}

// TravelPreferences represents customer travel preferences
message TravelPreferences {
  // Preferred destinations
  repeated string preferred_destinations = 1;
  
  // Avoided destinations
  repeated string avoided_destinations = 2;
  
  // Travel style (budget, luxury, adventure, cultural, etc.)
  repeated string travel_styles = 3;
  
  // Preferred activities
  repeated string preferred_activities = 4;
  
  // Accommodation preferences
  repeated string accommodation_preferences = 5;
  
  // Transportation preferences
  repeated string transportation_preferences = 6;
  
  // Food preferences
  repeated string food_preferences = 7;
  
  // Climate preferences
  repeated string climate_preferences = 8;
  
  // Accessibility requirements
  repeated string accessibility_requirements = 9;
}

// BudgetConstraints represents budget constraints for travel
message BudgetConstraints {
  // Total budget
  google.protobuf.DoubleValue total_budget = 1;
  
  // Currency
  string currency = 2;
  
  // Budget breakdown
  BudgetBreakdown breakdown = 3;
  
  // Flexibility level (strict, moderate, flexible)
  google.protobuf.StringValue flexibility_level = 4;
}

// BudgetBreakdown represents budget breakdown by category
message BudgetBreakdown {
  // Flight budget
  google.protobuf.DoubleValue flight_budget = 1;
  
  // Accommodation budget
  google.protobuf.DoubleValue accommodation_budget = 2;
  
  // Food budget
  google.protobuf.DoubleValue food_budget = 3;
  
  // Activities budget
  google.protobuf.DoubleValue activities_budget = 4;
  
  // Transportation budget
  google.protobuf.DoubleValue transportation_budget = 5;
  
  // Miscellaneous budget
  google.protobuf.DoubleValue miscellaneous_budget = 6;
}

// GetTravelRecommendationsResponse represents travel recommendations response
message GetTravelRecommendationsResponse {
  // Customer ID
  string customer_id = 1;
  
  // Recommendation type
  string recommendation_type = 2;
  
  // Travel recommendations
  TravelRecommendations recommendations = 3;
  
  // Recommendation reasoning
  repeated string reasoning = 4;
  
  // Recommendation confidence score
  google.protobuf.DoubleValue confidence_score = 5;
  
  // Alternative options
  repeated TravelRecommendation alternative_options = 6;
  
  // Generated at timestamp
  google.protobuf.Timestamp generated_at = 7;
}

// TravelRecommendation represents a single travel recommendation
message TravelRecommendation {
  // Recommendation ID
  string recommendation_id = 1;
  
  // Recommendation type (destination, activity, package, deal)
  string recommendation_type = 2;
  
  // Recommendation title
  string title = 3;
  
  // Recommendation description
  string description = 4;
  
  // Recommendation score (0-100)
  google.protobuf.DoubleValue recommendation_score = 5;
  
  // Reasons for recommendation
  repeated string reasons = 6;
  
  // Estimated cost
  int64 estimated_cost = 7;
  
  // Currency
  string currency = 8;
  
  // Recommendation details
  google.protobuf.StringValue details = 9;
  
  // Booking urgency
  google.protobuf.StringValue booking_urgency = 10;
  
  // Special offers
  repeated string special_offers = 11;
}

// GetTourismAnalyticsRequest represents a request to get tourism analytics
message GetTourismAnalyticsRequest {
  // Date range for analytics
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  
  // Analytics type (bookings, revenue, customer_behavior, market_trends)
  string analytics_type = 3;
  
  // Granularity (daily, weekly, monthly, quarterly, yearly)
  string granularity = 4;
  
  // Geographic filter (optional)
  google.protobuf.StringValue geographic_filter = 5;
  
  // Service type filter (optional)
  google.protobuf.StringValue service_type_filter = 6;
}

// GetTourismAnalyticsResponse represents comprehensive tourism analytics
message GetTourismAnalyticsResponse {
  // Analytics period
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Analytics type
  string analytics_type = 3;
  
  // Granularity used
  string granularity = 4;
  
  // Overall metrics
  TourismMetrics overall_metrics = 5;
  
  // Time series data
  repeated TourismDataPoint data_points = 6;
  
  // Service performance
  ServicePerformance service_performance = 7;
  
  // Customer analytics
  CustomerAnalytics customer_analytics = 8;
  
  // Market insights
  MarketInsights market_insights = 9;
  
  // Generated at timestamp
  google.protobuf.Timestamp generated_at = 10;
}

// TourismMetrics represents key tourism metrics
message TourismMetrics {
  // Total bookings
  int32 total_bookings = 1;
  
  // Total revenue
  int64 total_revenue = 2;
  
  // Average booking value
  google.protobuf.DoubleValue average_booking_value = 3;
  
  // Customer satisfaction score
  google.protobuf.DoubleValue customer_satisfaction_score = 4;
  
  // Booking conversion rate
  google.protobuf.DoubleValue booking_conversion_rate = 5;
  
  // Cancellation rate
  google.protobuf.DoubleValue cancellation_rate = 6;
  
  // Repeat customer rate
  google.protobuf.DoubleValue repeat_customer_rate = 7;
  
  // Currency
  string currency = 8;
}

// TourismDataPoint represents a single analytics data point
message TourismDataPoint {
  // Timestamp for this data point
  google.protobuf.Timestamp timestamp = 1;
  
  // Number of bookings
  int32 bookings = 2;
  
  // Revenue amount
  int64 revenue = 3;
  
  // Customer satisfaction
  google.protobuf.DoubleValue customer_satisfaction = 4;
  
  // Conversion rate
  google.protobuf.DoubleValue conversion_rate = 5;
  
  // Additional metrics
  google.protobuf.StringValue additional_metrics = 6;
}

// ServicePerformance represents performance by service type
message ServicePerformance {
  // Flight performance
  FlightPerformance flight_performance = 1;
  
  // Hotel performance
  HotelPerformance hotel_performance = 2;
  
  // Tour performance
  TourPerformance tour_performance = 3;
  
  // Booking performance
  BookingPerformance booking_performance = 4;
}

// FlightPerformance represents flight service performance
message FlightPerformance {
  // Number of flight bookings
  int32 flight_bookings = 1;
  
  // Flight revenue
  int64 flight_revenue = 2;
  
  // Average flight price
  google.protobuf.DoubleValue average_flight_price = 3;
  
  // Flight satisfaction score
  google.protobuf.DoubleValue satisfaction_score = 4;
}

// HotelPerformance represents hotel service performance
message HotelPerformance {
  // Number of hotel bookings
  int32 hotel_bookings = 1;
  
  // Hotel revenue
  int64 hotel_revenue = 2;
  
  // Average hotel price
  google.protobuf.DoubleValue average_hotel_price = 3;
  
  // Hotel satisfaction score
  google.protobuf.DoubleValue satisfaction_score = 4;
}

// TourPerformance represents tour service performance
message TourPerformance {
  // Number of tour bookings
  int32 tour_bookings = 1;
  
  // Tour revenue
  int64 tour_revenue = 2;
  
  // Average tour price
  google.protobuf.DoubleValue average_tour_price = 3;
  
  // Tour satisfaction score
  google.protobuf.DoubleValue satisfaction_score = 4;
}

// BookingPerformance represents booking service performance
message BookingPerformance {
  // Total bookings processed
  int32 total_bookings = 1;
  
  // Booking success rate
  google.protobuf.DoubleValue success_rate = 2;
  
  // Average processing time
  google.protobuf.DoubleValue average_processing_time_minutes = 3;
  
  // Customer satisfaction with booking process
  google.protobuf.DoubleValue booking_satisfaction_score = 4;
}

// CustomerAnalytics represents customer analytics
message CustomerAnalytics {
  // Total unique customers
  int32 total_customers = 1;
  
  // New customers in period
  int32 new_customers = 2;
  
  // Customer retention rate
  google.protobuf.DoubleValue retention_rate = 3;
  
  // Average customer lifetime value
  google.protobuf.DoubleValue average_lifetime_value = 4;
  
  // Customer demographics
  google.protobuf.StringValue customer_demographics = 5;
  
  // Most popular customer segments
  repeated string popular_customer_segments = 6;
}

// MarketInsights represents market insights
message MarketInsights {
  // Market trends
  repeated string market_trends = 1;
  
  // Popular destinations
  repeated string popular_destinations = 2;
  
  // Seasonal patterns
  google.protobuf.StringValue seasonal_patterns = 3;
  
  // Competitive analysis
  google.protobuf.StringValue competitive_analysis = 4;
  
  // Growth opportunities
  repeated string growth_opportunities = 5;
  
  // Market challenges
  repeated string market_challenges = 6;
}
