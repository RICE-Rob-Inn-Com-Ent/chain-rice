syntax = "proto3";

package marketing.leads.services;

import "marketing/leads/messages/lead_request.proto";
import "marketing/leads/messages/lead_response.proto";

// Lead service for managing marketing leads
service LeadService {
  // Create a new lead
  rpc CreateLead(marketing.leads.messages.CreateLeadRequest) returns (marketing.leads.messages.CreateLeadResponse);
  
  // Get a lead by ID
  rpc GetLead(marketing.leads.messages.GetLeadRequest) returns (marketing.leads.messages.GetLeadResponse);
  
  // List leads with pagination and filtering
  rpc ListLead(marketing.leads.messages.ListLeadRequest) returns (marketing.leads.messages.ListLeadResponse);
  
  // Update an existing lead
  rpc UpdateLead(marketing.leads.messages.UpdateLeadRequest) returns (marketing.leads.messages.UpdateLeadResponse);
  
  // Delete a lead
  rpc DeleteLead(marketing.leads.messages.DeleteLeadRequest) returns (marketing.leads.messages.DeleteLeadResponse);
}
