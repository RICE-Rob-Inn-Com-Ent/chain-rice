syntax = "proto3";

package marketing.email.messages;

import "google/protobuf/timestamp.proto";
import "marketing/email/enums/email_status.proto";

// Email data transfer object
message Email {
  // Email ID
  string id = 1;
  
  // Email subject
  string subject = 2;
  
  // Email content/body
  string content = 3;
  
  // Email template ID (if using template)
  string template_id = 4;
  
  // Recipient email addresses
  repeated string recipients = 5;
  
  // Sender email address
  string sender_email = 6;
  
  // Sender name
  string sender_name = 7;
  
  // Campaign ID (if applicable)
  string campaign_id = 8;
  
  // Email status
  marketing.email.enums.EmailStatus status = 9;
  
  // Scheduled send time
  google.protobuf.Timestamp scheduled_time = 10;
  
  // Actual send time
  google.protobuf.Timestamp sent_time = 11;
  
  // Email priority
  int32 priority = 12;
  
  // Email tags
  repeated string tags = 13;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 14;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 15;
  
  // Email metrics
  EmailMetrics metrics = 16;
}

// Email performance metrics
message EmailMetrics {
  // Number of recipients
  int32 recipient_count = 1;
  
  // Number of emails delivered
  int32 delivered_count = 2;
  
  // Number of emails opened
  int32 opened_count = 3;
  
  // Number of clicks
  int32 clicked_count = 4;
  
  // Number of bounces
  int32 bounced_count = 5;
  
  // Number of unsubscribes
  int32 unsubscribed_count = 6;
  
  // Number of spam reports
  int32 spam_count = 7;
  
  // Open rate
  double open_rate = 8;
  
  // Click rate
  double click_rate = 9;
  
  // Bounce rate
  double bounce_rate = 10;
  
  // Unsubscribe rate
  double unsubscribe_rate = 11;
}

// Response message for creating an email
message CreateEmailResponse {
  // Created email
  Email email = 1;
  
  // Success message
  string message = 2;
}

// Response message for getting an email
message GetEmailResponse {
  // Email data
  Email email = 1;
}

// Response message for listing emails
message ListEmailResponse {
  // List of emails
  repeated Email emails = 1;
  
  // Total count of emails
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Number of items per page
  int32 page_size = 4;
}

// Response message for updating an email
message UpdateEmailResponse {
  // Updated email
  Email email = 1;
  
  // Success message
  string message = 2;
}

// Response message for deleting an email
message DeleteEmailResponse {
  // Success message
  string message = 1;
}
