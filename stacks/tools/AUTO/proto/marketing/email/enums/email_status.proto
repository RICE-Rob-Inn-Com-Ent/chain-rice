syntax = "proto3";

package marketing.email.enums;

// Enumeration for email status
enum EmailStatus {
  // Default status - not specified
  EMAIL_STATUS_UNSPECIFIED = 0;
  
  // Email is being drafted
  EMAIL_STATUS_DRAFT = 1;
  
  // Email is scheduled for sending
  EMAIL_STATUS_SCHEDULED = 2;
  
  // Email is being sent
  EMAIL_STATUS_SENDING = 3;
  
  // Email has been sent successfully
  EMAIL_STATUS_SENT = 4;
  
  // Email delivery failed
  EMAIL_STATUS_FAILED = 5;
  
  // Email was bounced
  EMAIL_STATUS_BOUNCED = 6;
  
  // Email was opened by recipient
  EMAIL_STATUS_OPENED = 7;
  
  // Email link was clicked
  EMAIL_STATUS_CLICKED = 8;
  
  // Email was unsubscribed
  EMAIL_STATUS_UNSUBSCRIBED = 9;
  
  // Email was marked as spam
  EMAIL_STATUS_SPAM = 10;
}
