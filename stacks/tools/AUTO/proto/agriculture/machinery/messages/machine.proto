syntax = "proto3";

package agriculture.machinery.messages;

import "agriculture/machinery/enums/machine_type.proto";
import "agriculture/machinery/enums/machine_status.proto";
import "google/protobuf/timestamp.proto";

// Machine message represents a single piece of agricultural machinery
message Machine {
  // Unique identifier for the machine
  string id = 1;
  
  // Basic information
  string name = 2;
  string model = 3;
  string manufacturer = 4;
  string serial_number = 5;
  string vin = 6;                // Vehicle Identification Number
  string year = 7;               // Manufacturing year
  
  // Machine classification
  agriculture.machinery.enums.MachineType type = 8;
  string category = 9;           // Additional category classification
  string subcategory = 10;       // More specific classification
  
  // Physical specifications
  double weight = 11;            // Weight in kilograms
  double length = 12;            // Length in meters
  double width = 13;             // Width in meters
  double height = 14;            // Height in meters
  double horsepower = 15;        // Engine horsepower
  double engine_displacement = 16; // Engine displacement in liters
  string fuel_type = 17;         // Diesel, gasoline, electric, hybrid, etc.
  double fuel_capacity = 18;     // Fuel tank capacity in liters
  double fuel_consumption = 19;  // Average fuel consumption per hour
  
  // Operational specifications
  double max_speed = 20;         // Maximum speed in km/h
  double working_width = 21;     // Working width in meters
  double working_depth = 22;     // Working depth in meters
  double lifting_capacity = 23;  // Lifting capacity in kilograms
  double towing_capacity = 24;   // Towing capacity in kilograms
  string transmission_type = 25; // Manual, automatic, CVT, etc.
  int32 number_of_gears = 26;    // Number of gears
  string drive_type = 27;        // 2WD, 4WD, FWD, etc.
  
  // Current status
  agriculture.machinery.enums.MachineStatus status = 28;
  string current_location = 29;  // Current location on farm
  string current_operator = 30;  // Current operator name
  string current_task = 31;      // Current task being performed
  
  // Ownership and acquisition
  string owner = 32;             // Owner name or organization
  string acquisition_method = 33; // Purchase, lease, rent, etc.
  double purchase_price = 34;    // Original purchase price
  string currency = 35;          // Currency for price
  google.protobuf.Timestamp acquisition_date = 36;
  string dealer = 37;            // Dealer or supplier
  string warranty_expiry = 38;   // Warranty expiration date
  
  // Maintenance information
  double total_hours = 39;       // Total operating hours
  double hours_since_last_service = 40; // Hours since last service
  google.protobuf.Timestamp last_service_date = 41;
  google.protobuf.Timestamp next_service_due = 42;
  int32 service_interval_hours = 43; // Service interval in hours
  string last_service_type = 44; // Type of last service
  string next_service_type = 45; // Type of next service
  repeated string maintenance_history = 46; // List of maintenance records
  
  // Performance metrics
  double efficiency_rating = 47; // Overall efficiency rating (0-100)
  double reliability_score = 48; // Reliability score (0-100)
  double utilization_rate = 49;  // Utilization rate percentage
  double cost_per_hour = 50;     // Operating cost per hour
  double revenue_per_hour = 51;  // Revenue generated per hour
  
  // Financial information
  double current_value = 52;     // Current estimated value
  double depreciation_rate = 53; // Annual depreciation rate
  double total_operating_costs = 54; // Total operating costs
  double total_revenue = 55;     // Total revenue generated
  double net_profit = 56;        // Net profit from machine
  
  // Insurance and registration
  string insurance_policy = 57;  // Insurance policy number
  google.protobuf.Timestamp insurance_expiry = 58;
  string registration_number = 59; // Vehicle registration number
  google.protobuf.Timestamp registration_expiry = 60;
  
  // Safety and compliance
  bool safety_inspection_due = 61; // Whether safety inspection is due
  google.protobuf.Timestamp last_safety_inspection = 62;
  google.protobuf.Timestamp next_safety_inspection = 63;
  repeated string safety_certifications = 64; // Safety certifications
  bool operator_certification_required = 65; // Whether operator needs certification
  
  // Environmental information
  string emissions_rating = 66;  // Emissions rating (Tier 1, 2, 3, 4, etc.)
  double co2_emissions = 67;     // CO2 emissions per hour
  double noise_level = 68;       // Noise level in decibels
  bool is_electric = 69;         // Whether machine is electric
  double battery_capacity = 70;  // Battery capacity in kWh (for electric machines)
  
  // Technology and features
  bool has_gps = 71;             // Whether machine has GPS
  bool has_autosteer = 72;       // Whether machine has autosteer
  bool has_variable_rate = 73;   // Whether machine has variable rate capability
  bool has_yield_monitoring = 74; // Whether machine has yield monitoring
  bool has_telematics = 75;      // Whether machine has telematics
  repeated string features = 76; // List of additional features
  
  // Attachments and implements
  repeated string compatible_attachments = 77; // List of compatible attachments
  repeated string current_attachments = 78;    // Currently attached implements
  string primary_attachment = 79; // Primary attachment currently in use
  
  // Work history
  repeated string recent_work = 80; // List of recent work performed
  double total_work_hours = 81;  // Total hours of work performed
  double work_hours_this_season = 82; // Work hours this season
  double work_hours_last_season = 83; // Work hours last season
  
  // Issues and problems
  repeated string current_issues = 84; // Current issues or problems
  repeated string resolved_issues = 85; // Recently resolved issues
  bool requires_attention = 86;  // Whether machine needs immediate attention
  string priority_level = 87;    // Priority level for attention (high, medium, low)
  
  // Notes and observations
  string notes = 88;             // General notes about the machine
  repeated string observations = 89; // Regular observations
  string recommendations = 90;   // Recommendations for improvement
  
  // Metadata
  google.protobuf.Timestamp created_at = 91;
  google.protobuf.Timestamp updated_at = 92;
  string created_by = 93;        // User who created this record
  string updated_by = 94;        // User who last updated this record
  
  // Status flags
  bool is_active = 95;           // Whether machine is currently active
  bool is_available = 96;        // Whether machine is available for use
  bool is_reserved = 97;         // Whether machine is reserved for specific use
}
