syntax = "proto3";

package agriculture.machinery.services;

import "agriculture/machinery/messages/machine.proto";
import "google/protobuf/empty.proto";

// MachineryService provides CRUD operations and business logic for machinery management
service MachineryService {
  // Machine management
  rpc CreateMachine(CreateMachineRequest) returns (CreateMachineResponse);
  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse);
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc UpdateMachine(UpdateMachineRequest) returns (UpdateMachineResponse);
  rpc DeleteMachine(DeleteMachineRequest) returns (google.protobuf.Empty);
  
  // Machine operations
  rpc StartMachine(StartMachineRequest) returns (StartMachineResponse);
  rpc StopMachine(StopMachineRequest) returns (StopMachineResponse);
  rpc ReserveMachine(ReserveMachineRequest) returns (ReserveMachineResponse);
  rpc ReleaseMachine(ReleaseMachineRequest) returns (ReleaseMachineResponse);
  
  // Maintenance management
  rpc ScheduleMaintenance(ScheduleMaintenanceRequest) returns (ScheduleMaintenanceResponse);
  rpc CompleteMaintenance(CompleteMaintenanceRequest) returns (CompleteMaintenanceResponse);
  rpc GetMaintenanceHistory(GetMaintenanceHistoryRequest) returns (GetMaintenanceHistoryResponse);
  rpc GetUpcomingMaintenance(GetUpcomingMaintenanceRequest) returns (GetUpcomingMaintenanceResponse);
  
  // Performance tracking
  rpc RecordUsage(RecordUsageRequest) returns (RecordUsageResponse);
  rpc GetUsageHistory(GetUsageHistoryRequest) returns (GetUsageHistoryResponse);
  rpc GetPerformanceMetrics(GetPerformanceMetricsRequest) returns (GetPerformanceMetricsResponse);
  rpc GetEfficiencyReport(GetEfficiencyReportRequest) returns (GetEfficiencyReportResponse);
  
  // Financial tracking
  rpc RecordExpense(RecordExpenseRequest) returns (RecordExpenseResponse);
  rpc RecordRevenue(RecordRevenueRequest) returns (RecordRevenueResponse);
  rpc GetFinancialSummary(GetFinancialSummaryRequest) returns (GetFinancialSummaryResponse);
  rpc CalculateDepreciation(CalculateDepreciationRequest) returns (CalculateDepreciationResponse);
  
  // Inventory management
  rpc GetMachinesByType(GetMachinesByTypeRequest) returns (GetMachinesByTypeResponse);
  rpc GetMachinesByStatus(GetMachinesByStatusRequest) returns (GetMachinesByStatusResponse);
  rpc GetAvailableMachines(GetAvailableMachinesRequest) returns (GetAvailableMachinesResponse);
  rpc GetMachinesRequiringAttention(GetMachinesRequiringAttentionRequest) returns (GetMachinesRequiringAttentionResponse);
  
  // Analytics and reporting
  rpc GetUtilizationReport(GetUtilizationReportRequest) returns (GetUtilizationReportResponse);
  rpc GetCostAnalysis(GetCostAnalysisRequest) returns (GetCostAnalysisResponse);
  rpc GetMaintenanceReport(GetMaintenanceReportRequest) returns (GetMaintenanceReportResponse);
  rpc GetPerformanceTrends(GetPerformanceTrendsRequest) returns (GetPerformanceTrendsResponse);
}

// Machine management messages
message CreateMachineRequest {
  agriculture.machinery.messages.Machine machine = 1;
}

message CreateMachineResponse {
  agriculture.machinery.messages.Machine machine = 1;
  bool success = 2;
  string message = 3;
}

message GetMachineRequest {
  string machine_id = 1;
}

message GetMachineResponse {
  agriculture.machinery.messages.Machine machine = 1;
  bool found = 2;
  string message = 3;
}

message ListMachinesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string machine_type = 3;       // Filter by machine type
  string status = 4;             // Filter by status
  string manufacturer = 5;       // Filter by manufacturer
  string location = 6;           // Filter by location
  bool is_available = 7;         // Filter by availability
  bool requires_attention = 8;   // Filter by attention requirement
  string search_query = 9;       // Search in names, models, serial numbers
}

message ListMachinesResponse {
  repeated agriculture.machinery.messages.Machine machines = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateMachineRequest {
  agriculture.machinery.messages.Machine machine = 1;
  repeated string update_mask = 2; // Fields to update
}

message UpdateMachineResponse {
  agriculture.machinery.messages.Machine machine = 1;
  bool success = 2;
  string message = 3;
}

message DeleteMachineRequest {
  string machine_id = 1;
}

// Machine operation messages
message StartMachineRequest {
  string machine_id = 1;
  string operator = 2;
  string task = 3;
  string location = 4;
  string notes = 5;
}

message StartMachineResponse {
  bool success = 1;
  string message = 2;
  string operation_id = 3;
}

message StopMachineRequest {
  string machine_id = 1;
  string operator = 2;
  double hours_worked = 3;
  string notes = 4;
}

message StopMachineResponse {
  bool success = 1;
  string message = 2;
  string operation_id = 3;
}

message ReserveMachineRequest {
  string machine_id = 1;
  string operator = 2;
  string start_time = 3;
  string end_time = 4;
  string purpose = 5;
  string notes = 6;
}

message ReserveMachineResponse {
  bool success = 1;
  string message = 2;
  string reservation_id = 3;
}

message ReleaseMachineRequest {
  string machine_id = 1;
  string reservation_id = 2;
  string operator = 3;
}

message ReleaseMachineResponse {
  bool success = 1;
  string message = 2;
}

// Maintenance management messages
message ScheduleMaintenanceRequest {
  string machine_id = 1;
  string maintenance_type = 2;   // routine, repair, inspection, etc.
  string scheduled_date = 3;
  string technician = 4;
  string description = 5;
  double estimated_hours = 6;
  double estimated_cost = 7;
  string priority = 8;           // high, medium, low
}

message ScheduleMaintenanceResponse {
  bool success = 1;
  string message = 2;
  string maintenance_id = 3;
}

message CompleteMaintenanceRequest {
  string maintenance_id = 1;
  string technician = 2;
  string completion_date = 3;
  double actual_hours = 4;
  double actual_cost = 5;
  string work_performed = 6;
  repeated string parts_replaced = 7;
  string notes = 8;
}

message CompleteMaintenanceResponse {
  bool success = 1;
  string message = 2;
}

message GetMaintenanceHistoryRequest {
  string machine_id = 1;
  int32 months_back = 2;         // Number of months to look back
}

message GetMaintenanceHistoryResponse {
  string machine_id = 1;
  repeated MaintenanceRecord maintenance_records = 2;
}

message MaintenanceRecord {
  string maintenance_id = 1;
  string maintenance_type = 2;
  string scheduled_date = 3;
  string completion_date = 4;
  string technician = 5;
  double estimated_hours = 6;
  double actual_hours = 7;
  double estimated_cost = 8;
  double actual_cost = 9;
  string work_performed = 10;
  repeated string parts_replaced = 11;
  string status = 12;             // scheduled, in_progress, completed, cancelled
  string notes = 13;
}

message GetUpcomingMaintenanceRequest {
  string machine_id = 1;
  int32 days_ahead = 2;          // Number of days to look ahead
}

message GetUpcomingMaintenanceResponse {
  string machine_id = 1;
  repeated MaintenanceRecord upcoming_maintenance = 2;
}

// Performance tracking messages
message RecordUsageRequest {
  string machine_id = 1;
  string operator = 2;
  string start_time = 3;
  string end_time = 4;
  double hours_worked = 5;
  string task_performed = 6;
  string location = 7;
  double fuel_consumed = 8;
  double distance_traveled = 9;
  string notes = 10;
}

message RecordUsageResponse {
  bool success = 1;
  string message = 2;
  string usage_id = 3;
}

message GetUsageHistoryRequest {
  string machine_id = 1;
  string start_date = 2;
  string end_date = 3;
  string period = 4;              // daily, weekly, monthly
}

message GetUsageHistoryResponse {
  string machine_id = 1;
  string period = 2;
  repeated UsageRecord usage_records = 3;
  double total_hours = 4;
  double total_fuel_consumed = 5;
  double total_distance = 6;
}

message UsageRecord {
  string usage_id = 1;
  string date = 2;
  string operator = 3;
  double hours_worked = 4;
  string task_performed = 5;
  string location = 6;
  double fuel_consumed = 7;
  double distance_traveled = 8;
  string notes = 9;
}

message GetPerformanceMetricsRequest {
  string machine_id = 1;
  string period = 2;              // daily, weekly, monthly, yearly
  string start_date = 3;
  string end_date = 4;
}

message GetPerformanceMetricsResponse {
  string machine_id = 1;
  string period = 2;
  double utilization_rate = 3;
  double efficiency_rating = 4;
  double reliability_score = 5;
  double cost_per_hour = 6;
  double revenue_per_hour = 7;
  double fuel_efficiency = 8;
  double maintenance_cost_per_hour = 9;
  double total_operating_hours = 10;
  double total_fuel_consumed = 11;
  double total_distance = 12;
}

message GetEfficiencyReportRequest {
  string machine_id = 1;
  string period = 2;              // weekly, monthly, yearly
  string start_date = 3;
  string end_date = 4;
}

message GetEfficiencyReportResponse {
  string machine_id = 1;
  string period = 2;
  double overall_efficiency = 3;
  double fuel_efficiency = 4;
  double time_efficiency = 5;
  double cost_efficiency = 6;
  repeated EfficiencyMetric metrics = 7;
  string recommendations = 8;
}

message EfficiencyMetric {
  string metric_name = 1;
  double current_value = 2;
  double target_value = 3;
  double benchmark_value = 4;
  string unit = 5;
  string trend = 6;               // improving, stable, declining
}

// Financial tracking messages
message RecordExpenseRequest {
  string machine_id = 1;
  string expense_type = 2;        // fuel, maintenance, repair, insurance, etc.
  double amount = 3;
  string currency = 4;
  string date = 5;
  string description = 6;
  string receipt_number = 7;
  string vendor = 8;
}

message RecordExpenseResponse {
  bool success = 1;
  string message = 2;
  string expense_id = 3;
}

message RecordRevenueRequest {
  string machine_id = 1;
  string revenue_type = 2;        // rental, contract, service, etc.
  double amount = 3;
  string currency = 4;
  string date = 5;
  string description = 6;
  string customer = 7;
}

message RecordRevenueResponse {
  bool success = 1;
  string message = 2;
  string revenue_id = 3;
}

message GetFinancialSummaryRequest {
  string machine_id = 1;
  string period = 2;              // monthly, yearly, lifetime
  string start_date = 3;
  string end_date = 4;
}

message GetFinancialSummaryResponse {
  string machine_id = 1;
  string period = 2;
  double total_expenses = 3;
  double total_revenue = 4;
  double net_profit = 5;
  double depreciation = 6;
  double current_value = 7;
  map<string, double> expenses_by_type = 8;
  map<string, double> revenue_by_type = 9;
  double cost_per_hour = 10;
  double revenue_per_hour = 11;
}

message CalculateDepreciationRequest {
  string machine_id = 1;
  string method = 2;              // straight_line, declining_balance, etc.
  double useful_life_years = 3;
  double salvage_value = 4;
}

message CalculateDepreciationResponse {
  string machine_id = 1;
  double annual_depreciation = 2;
  double monthly_depreciation = 3;
  double current_book_value = 4;
  double total_depreciation = 5;
  string calculation_method = 6;
}

// Inventory management messages
message GetMachinesByTypeRequest {
  string machine_type = 1;
  string status = 2;              // Optional status filter
}

message GetMachinesByTypeResponse {
  string machine_type = 1;
  repeated agriculture.machinery.messages.Machine machines = 2;
  int32 total_count = 3;
}

message GetMachinesByStatusRequest {
  string status = 1;
  string machine_type = 2;        // Optional type filter
}

message GetMachinesByStatusResponse {
  string status = 1;
  repeated agriculture.machinery.messages.Machine machines = 2;
  int32 total_count = 3;
}

message GetAvailableMachinesRequest {
  string machine_type = 1;        // Optional type filter
  string start_time = 2;          // Optional time filter
  string end_time = 3;            // Optional time filter
}

message GetAvailableMachinesResponse {
  repeated agriculture.machinery.messages.Machine available_machines = 1;
  int32 total_count = 2;
}

message GetMachinesRequiringAttentionRequest {
  string priority = 1;            // high, medium, low
  string attention_type = 2;      // maintenance, repair, inspection, etc.
}

message GetMachinesRequiringAttentionResponse {
  repeated agriculture.machinery.messages.Machine machines = 1;
  int32 total_count = 2;
  repeated string attention_reasons = 3;
}

// Analytics and reporting messages
message GetUtilizationReportRequest {
  string machine_id = 1;
  string period = 2;              // daily, weekly, monthly, yearly
  string start_date = 3;
  string end_date = 4;
}

message GetUtilizationReportResponse {
  string machine_id = 1;
  string period = 2;
  double utilization_rate = 3;
  double available_hours = 4;
  double used_hours = 5;
  double idle_hours = 6;
  double maintenance_hours = 7;
  repeated UtilizationDataPoint data_points = 8;
}

message UtilizationDataPoint {
  string date = 1;
  double utilization_rate = 2;
  double hours_used = 3;
  double hours_available = 4;
}

message GetCostAnalysisRequest {
  string machine_id = 1;
  string period = 2;              // monthly, yearly, lifetime
  string start_date = 3;
  string end_date = 4;
}

message GetCostAnalysisResponse {
  string machine_id = 1;
  string period = 2;
  double total_ownership_cost = 3;
  double total_operating_cost = 4;
  double total_maintenance_cost = 5;
  double total_fuel_cost = 6;
  double cost_per_hour = 7;
  double cost_per_acre = 8;
  map<string, double> cost_breakdown = 9;
}

message GetMaintenanceReportRequest {
  string machine_id = 1;
  string period = 2;              // monthly, yearly
  string start_date = 3;
  string end_date = 4;
}

message GetMaintenanceReportResponse {
  string machine_id = 1;
  string period = 2;
  double total_maintenance_cost = 3;
  int32 maintenance_events = 4;
  double average_cost_per_event = 5;
  double maintenance_cost_per_hour = 6;
  repeated MaintenanceRecord maintenance_records = 7;
  string maintenance_recommendations = 8;
}

message GetPerformanceTrendsRequest {
  string machine_id = 1;
  string metric = 2;              // efficiency, utilization, cost, etc.
  string period = 3;              // daily, weekly, monthly
  int32 data_points = 4;          // Number of data points to return
}

message GetPerformanceTrendsResponse {
  string machine_id = 1;
  string metric = 2;
  string period = 3;
  repeated TrendDataPoint trend_data = 4;
  string overall_trend = 5;       // improving, stable, declining
  double trend_slope = 6;         // Numerical trend slope
}

message TrendDataPoint {
  string date = 1;
  double value = 2;
  string unit = 3;
}
