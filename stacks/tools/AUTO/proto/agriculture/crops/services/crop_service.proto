syntax = "proto3";

package com.agriculture.crops.services;

import "agriculture/crops/messages/crop_unit.proto";
import "agriculture/crops/messages/crop_harvest.proto";
import "google/protobuf/empty.proto";

service CropService {
  rpc CreateCropUnit(CreateCropUnitRequest) returns (CreateCropUnitResponse);
  rpc GetCropUnit(GetCropUnitRequest) returns (GetCropUnitResponse);
  rpc ListCropUnits(ListCropUnitsRequest) returns (ListCropUnitsResponse);
  rpc UpdateCropUnit(UpdateCropUnitRequest) returns (UpdateCropUnitResponse);
  rpc DeleteCropUnit(DeleteCropUnitRequest) returns (google.protobuf.Empty);
  rpc CreateCropHarvest(CreateCropHarvestRequest) returns (CreateCropHarvestResponse);
  rpc GetCropHarvest(GetCropHarvestRequest) returns (GetCropHarvestResponse);
  rpc ListCropHarvests(ListCropHarvestsRequest) returns (ListCropHarvestsResponse);
  rpc UpdateCropHarvest(UpdateCropHarvestRequest) returns (UpdateCropHarvestResponse);
  rpc DeleteCropHarvest(DeleteCropHarvestRequest) returns (google.protobuf.Empty);
}
