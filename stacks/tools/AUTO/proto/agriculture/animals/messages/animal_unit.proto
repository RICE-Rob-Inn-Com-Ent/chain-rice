syntax = "proto3";

package com.agriculture.animals.messages;

import "agriculture/livestock/enums/animal_age.proto";
import "agriculture/livestock/enums/animal_health.proto";
import "agriculture/livestock/enums/animal_product.proto";
import "agriculture/livestock/enums/animal_reproductivity.proto";
import "agriculture/livestock/enums/animal_sex.proto";
import "agriculture/livestock/enums/animal_type.proto";
import "google/protobuf/timestamp.proto";

message AnimalUnit {
  string id = 1;
  com.agriculture.animals.messages.AnimalUnit dam_id = 14;
  com.agriculture.animals.messages.AnimalUnit sire_id = 15;
  string tag_number = 3;
  string breed = 8;
  com.agriculture.animals.enums.AnimalType type = 7;
  string name = 2;
  com.agriculture.animals.enums.AnimalSex sex = 9;
  string color = 10;
  string markings = 11;
  google.protobuf.Timestamp birth_date = 12;
  double weight = 16;
  com.agriculture.animals.enums.HealthStatus health_status = 20;
  repeated string vaccinations = 22;
  repeated string medications = 23;
  google.protobuf.Timestamp last_health_check = 27;
  com.agriculture.animals.enums.HealthStatus reproductivity = 28;
  google.protobuf.Timestamp breeding_date = 30;
  google.protobuf.Timestamp expected_delivery = 31;
  int32 pregnancies = 32;
  int32 offspring_count = 33;
  com.agriculture.animals.enums.AnimalProduct product = 34;
  double latitude = 41;
  double longitude = 42;
  com.agriculture.animals.enums.AnimalFood food = 43;
  double daily_food_amount = 44;
  string feeding_schedule = 45;
  double water_consumption = 46;
  double growth_rate = 51;
  bool is_active = 57;
  bool is_for_sale = 58;
  string notes = 61;
  google.protobuf.Timestamp created_at = 63;
  google.protobuf.Timestamp updated_at = 64;
  string created_by = 65;
  string updated_by = 66;
}



message CreateAnimalUnitRequest {
  com.agriculture.animals.messages.AnimalUnit id = 1;
}

message CreateAnimalUnitResponse {
  com.agriculture.animals.messages.AnimalUnit id = 1;
  bool success = 2;
  string message = 3;
}

message GetAnimalUnitRequest {
  string id = 1;
}

message GetAnimalUnitResponse {
  com.agriculture.animals.messages.AnimalUnit id = 1;
  bool found = 2;
  string message = 3;
}

message ListAnimalUnitsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string herd_id = 3;
  string animal_type = 4;
  string health_status = 5;
  string sex = 6;
  bool is_breeding_stock = 7;
  bool is_pregnant = 8;
  string search_query = 9;
}

message ListAnimalUnitResponse {
  repeated com.agriculture.animals.messages.AnimalUnit id = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateAnimalUnitRequest {
  com.agriculture.animals.messages.AnimalUnit id = 1;
  repeated string update_mask = 2;
}

message UpdateAnimalUnitResponse {
  com.agriculture.animals.messages.AnimalUnit id = 1;
  bool success = 2;
  string message = 3;
}

message DeleteAnimalUnitRequest {
  string id = 1;
}
