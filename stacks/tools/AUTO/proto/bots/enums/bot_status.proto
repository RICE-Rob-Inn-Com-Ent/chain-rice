syntax = "proto3";

package automation.bots.enums;

// Bot Status enumeration
// Defines the different states of bots in the automation system
enum BotStatus {
  // Unspecified bot status
  BOT_STATUS_UNSPECIFIED = 0;
  
  // Initial States
  BOT_STATUS_CREATED = 1;                // Bot has been created but not started
  BOT_STATUS_PENDING = 2;                // Bot is pending activation
  BOT_STATUS_SCHEDULED = 3;              // Bot is scheduled for future execution
  BOT_STATUS_QUEUED = 4;                 // Bot is in the execution queue
  
  // Active States
  BOT_STATUS_RUNNING = 5;                // Bot is currently running
  BOT_STATUS_EXECUTING = 6;              // Bot is executing tasks
  BOT_STATUS_PROCESSING = 7;             // Bot is processing data
  BOT_STATUS_MONITORING = 8;             // Bot is monitoring systems
  BOT_STATUS_WAITING = 9;                // Bot is waiting for conditions or resources
  BOT_STATUS_PAUSED = 10;                // Bot is paused and can be resumed
  BOT_STATUS_SUSPENDED = 11;             // Bot is suspended by system or user
  
  // Completion States
  BOT_STATUS_COMPLETED = 12;             // Bot completed successfully
  BOT_STATUS_SUCCEEDED = 13;             // Bot succeeded with expected results
  BOT_STATUS_FINISHED = 14;              // Bot finished execution
  BOT_STATUS_IDLE = 15;                  // Bot is idle and ready for new tasks
  
  // Error States
  BOT_STATUS_FAILED = 16;                // Bot failed due to an error
  BOT_STATUS_ERROR = 17;                 // Bot encountered an error
  BOT_STATUS_CRASHED = 18;               // Bot crashed unexpectedly
  BOT_STATUS_TIMEOUT = 19;               // Bot timed out during execution
  BOT_STATUS_ABORTED = 20;               // Bot was aborted by system or user
  
  // Resource States
  BOT_STATUS_RESOURCE_LIMITED = 21;      // Bot is limited by available resources
  BOT_STATUS_WAITING_FOR_RESOURCES = 22; // Bot is waiting for required resources
  BOT_STATUS_OVERLOADED = 23;            // Bot is overloaded with tasks
  BOT_STATUS_THROTTLED = 24;             // Bot is throttled due to rate limits
  
  // Maintenance States
  BOT_STATUS_MAINTENANCE = 25;           // Bot is in maintenance mode
  BOT_STATUS_UPDATING = 26;              // Bot is being updated
  BOT_STATUS_RESTARTING = 27;            // Bot is restarting
  BOT_STATUS_RECONFIGURING = 28;         // Bot is being reconfigured
  
  // Validation States
  BOT_STATUS_VALIDATING = 29;            // Bot is validating configuration
  BOT_STATUS_VALIDATION_FAILED = 30;     // Bot failed validation checks
  BOT_STATUS_TESTING = 31;               // Bot is in testing mode
  BOT_STATUS_QUALITY_CHECK = 32;         // Bot is undergoing quality checks
  
  // Deployment States
  BOT_STATUS_DEPLOYING = 33;             // Bot is being deployed
  BOT_STATUS_DEPLOYED = 34;              // Bot has been deployed
  BOT_STATUS_DEPLOYMENT_FAILED = 35;     // Bot deployment failed
  BOT_STATUS_UNDEPLOYING = 36;           // Bot is being undeployed
  BOT_STATUS_UNDEPLOYED = 37;            // Bot has been undeployed
  
  // Health States
  BOT_STATUS_HEALTHY = 38;               // Bot is healthy and functioning normally
  BOT_STATUS_UNHEALTHY = 39;             // Bot is unhealthy and needs attention
  BOT_STATUS_DEGRADED = 40;              // Bot is degraded but still functional
  BOT_STATUS_RECOVERING = 41;            // Bot is recovering from an issue
  
  // Retry States
  BOT_STATUS_RETRYING = 42;              // Bot is retrying after failure
  BOT_STATUS_RETRY_FAILED = 43;          // Bot failed after retry attempts
  BOT_STATUS_RETRY_EXHAUSTED = 44;       // Bot exhausted all retry attempts
  
  // Communication States
  BOT_STATUS_CONNECTING = 45;            // Bot is connecting to external services
  BOT_STATUS_CONNECTED = 46;             // Bot is connected to external services
  BOT_STATUS_DISCONNECTED = 47;          // Bot is disconnected from external services
  BOT_STATUS_RECONNECTING = 48;          // Bot is attempting to reconnect
  
  // Data States
  BOT_STATUS_DATA_PROCESSING = 49;       // Bot is processing data
  BOT_STATUS_DATA_SYNCING = 50;          // Bot is synchronizing data
  BOT_STATUS_DATA_BACKUP = 51;           // Bot is performing data backup
  BOT_STATUS_DATA_RESTORE = 52;          // Bot is restoring data
  
  // Security States
  BOT_STATUS_SECURITY_SCAN = 53;         // Bot is performing security scan
  BOT_STATUS_SECURITY_ALERT = 54;        // Bot triggered security alert
  BOT_STATUS_SECURITY_BLOCKED = 55;      // Bot is blocked due to security issues
  BOT_STATUS_AUTHENTICATING = 56;        // Bot is authenticating
  
  // Custom States
  BOT_STATUS_CUSTOM = 57;                // Custom user-defined status
  BOT_STATUS_UNKNOWN = 58;               // Bot status is unknown
}
