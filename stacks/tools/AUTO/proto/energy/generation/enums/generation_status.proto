  GENERATION_STATUS_OVERSPEED = 33;
  
  // Unit is in underspeed mode
  GENERATION_STATUS_UNDERSPEED = 34;
  
  // Unit is in overvoltage mode
  GENERATION_STATUS_OVERVOLTAGE = 35;
  
  // Unit is in undervoltage mode
  GENERATION_STATUS_UNDERVOLTAGE = 36;
  
  // Unit is in overfrequency mode
  GENERATION_STATUS_OVERFREQUENCY = 37;
  
  // Unit is in underfrequency mode
  GENERATION_STATUS_UNDERFREQUENCY = 38;
  
  // Unit is in overload mode
  GENERATION_STATUS_OVERLOAD = 39;
  
  // Unit is in underload mode
  GENERATION_STATUS_UNDERLOAD = 40;
  
  // Unit is in overtemperature mode
  GENERATION_STATUS_OVERTEMPERATURE = 41;
  
  // Unit is in undertemperature mode
  GENERATION_STATUS_UNDERTEMPERATURE = 42;
  
  // Unit is in overpressure mode
  GENERATION_STATUS_OVERPRESSURE = 43;
  
  // Unit is in underpressure mode
  GENERATION_STATUS_UNDERPRESSURE = 44;
  
  // Unit is in vibration mode
