syntax = "proto3";

package energy.generation.enums;

// Status of power generation units and plants
enum GenerationStatus {
  // Unit is online and generating power
  GENERATION_STATUS_ONLINE = 0;
  
  // Unit is offline (not generating)
  GENERATION_STATUS_OFFLINE = 1;
  
  // Unit is starting up
  GENERATION_STATUS_STARTING = 2;
  
  // Unit is shutting down
  GENERATION_STATUS_SHUTTING_DOWN = 3;
  
  // Unit is in hot standby (ready to start quickly)
  GENERATION_STATUS_HOT_STANDBY = 4;
  
  // Unit is in cold standby (requires longer start time)
  GENERATION_STATUS_COLD_STANDBY = 5;
  
  // Unit is in maintenance
  GENERATION_STATUS_MAINTENANCE = 6;
  
  // Unit has failed
  GENERATION_STATUS_FAILED = 7;
  
  // Unit is being repaired
  GENERATION_STATUS_REPAIR = 8;
  
  // Unit is being replaced
  GENERATION_STATUS_REPLACEMENT = 9;
  
  // Unit is being installed
  GENERATION_STATUS_INSTALLATION = 10;
  
  // Unit is being decommissioned
  GENERATION_STATUS_DECOMMISSIONING = 11;
  
  // Unit is in test mode
  GENERATION_STATUS_TEST_MODE = 12;
  
  // Unit is in emergency mode
  GENERATION_STATUS_EMERGENCY = 13;
  
  // Unit is in manual mode
  GENERATION_STATUS_MANUAL_MODE = 14;
  
  // Unit is in automatic mode
  GENERATION_STATUS_AUTOMATIC_MODE = 15;
  
  // Unit is in remote control mode
  GENERATION_STATUS_REMOTE_CONTROL = 16;
  
  // Unit is in local control mode
  GENERATION_STATUS_LOCAL_CONTROL = 17;
  
  // Unit is in synchronized mode
  GENERATION_STATUS_SYNCHRONIZED = 18;
  
  // Unit is in unsynchronized mode
  GENERATION_STATUS_UNSYNCHRONIZED = 19;
  
  // Unit is in islanding mode
  GENERATION_STATUS_ISLANDING = 20;
  
  // Unit is in grid-connected mode
  GENERATION_STATUS_GRID_CONNECTED = 21;
  
  // Unit is in off-grid mode
  GENERATION_STATUS_OFF_GRID = 22;
  
  // Unit is in load following mode
  GENERATION_STATUS_LOAD_FOLLOWING = 23;
  
  // Unit is in base load mode
  GENERATION_STATUS_BASE_LOAD = 24;
  
  // Unit is in peak load mode
  GENERATION_STATUS_PEAK_LOAD = 25;
  
  // Unit is in spinning reserve mode
  GENERATION_STATUS_SPINNING_RESERVE = 26;
  
  // Unit is in non-spinning reserve mode
