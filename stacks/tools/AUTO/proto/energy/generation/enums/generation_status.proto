  // Unit is in technical outage mode
  GENERATION_STATUS_TECHNICAL_OUTAGE = 88;
  
  // Unit is in commercial outage mode
  GENERATION_STATUS_COMMERCIAL_OUTAGE = 89;
  
  // Unit is in administrative outage mode
  GENERATION_STATUS_ADMINISTRATIVE_OUTAGE = 90;
  
