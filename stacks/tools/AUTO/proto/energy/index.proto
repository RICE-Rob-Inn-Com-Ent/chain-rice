syntax = "proto3";

package energy;

// Energy module index - comprehensive Protobuf definitions for energy sector
// This module provides complete gRPC services for energy management including
// billing, consumption monitoring, distribution operations, and power generation.

// Billing module imports
import "energy/billing/enums/billing_cycle.proto";
import "energy/billing/enums/invoice_status.proto";
import "energy/billing/enums/payment_method.proto";
import "energy/billing/messages/invoice.proto";
import "energy/billing/messages/bill_item.proto";
import "energy/billing/messages/payment.proto";
import "energy/billing/services/billing_service.proto";

// Consumption module imports
import "energy/consumption/enums/meter_type.proto";
import "energy/consumption/enums/consumption_unit.proto";
import "energy/consumption/enums/reading_status.proto";
import "energy/consumption/messages/meter.proto";
import "energy/consumption/messages/reading.proto";
import "energy/consumption/messages/consumption_report.proto";
import "energy/consumption/services/consumption_service.proto";

// Distribution module imports
import "energy/distribution/enums/grid_status.proto";
import "energy/distribution/enums/outage_severity.proto";
import "energy/distribution/enums/asset_type.proto";
import "energy/distribution/messages/grid_node.proto";
import "energy/distribution/messages/outage.proto";
import "energy/distribution/messages/distribution_asset.proto";
import "energy/distribution/services/distribution_service.proto";

// Generation module imports
import "energy/generation/enums/plant_type.proto";
import "energy/generation/enums/generation_status.proto";
import "energy/generation/enums/fuel_type.proto";
import "energy/generation/messages/plant.proto";
import "energy/generation/messages/unit.proto";
import "energy/generation/messages/generation_record.proto";
import "energy/generation/services/generation_service.proto";

// Re-export billing enums for easy access
option go_package = "energy";

// Billing enums re-exports
message BillingCycle {
  energy.billing.enums.BillingCycle value = 1;
}

message InvoiceStatus {
  energy.billing.enums.InvoiceStatus value = 1;
}

message PaymentMethod {
  energy.billing.enums.PaymentMethod value = 1;
}

// Consumption enums re-exports
message MeterType {
  energy.consumption.enums.MeterType value = 1;
}

message ConsumptionUnit {
  energy.consumption.enums.ConsumptionUnit value = 1;
}

message ReadingStatus {
  energy.consumption.enums.ReadingStatus value = 1;
}

// Distribution enums re-exports
message GridStatus {
  energy.distribution.enums.GridStatus value = 1;
}

message OutageSeverity {
  energy.distribution.enums.OutageSeverity value = 1;
}

message AssetType {
  energy.distribution.enums.AssetType value = 1;
}

// Generation enums re-exports
message PlantType {
  energy.generation.enums.PlantType value = 1;
}

message GenerationStatus {
  energy.generation.enums.GenerationStatus value = 1;
}

message FuelType {
  energy.generation.enums.FuelType value = 1;
}

// Main service aggregator - provides access to all energy services
service EnergyService {
  // Billing operations
  rpc CreateInvoice(energy.billing.services.CreateInvoiceRequest) returns (energy.billing.services.CreateInvoiceResponse);
  rpc GetInvoice(energy.billing.services.GetInvoiceRequest) returns (energy.billing.services.GetInvoiceResponse);
  rpc ProcessPayment(energy.billing.services.ProcessPaymentRequest) returns (energy.billing.services.ProcessPaymentResponse);
  
  // Consumption operations
  rpc RecordReading(energy.consumption.services.RecordReadingRequest) returns (energy.consumption.services.RecordReadingResponse);
  rpc GetLatestReading(energy.consumption.services.GetLatestReadingRequest) returns (energy.consumption.services.GetLatestReadingResponse);
  rpc GenerateConsumptionReport(energy.consumption.services.GenerateConsumptionReportRequest) returns (energy.consumption.services.GenerateConsumptionReportResponse);
  
  // Distribution operations
  rpc ReportOutage(energy.distribution.services.ReportOutageRequest) returns (energy.distribution.services.ReportOutageResponse);
  rpc GetActiveOutages(energy.distribution.services.GetActiveOutagesRequest) returns (energy.distribution.services.GetActiveOutagesResponse);
  rpc UpdateGridNodeStatus(energy.distribution.services.UpdateGridNodeStatusRequest) returns (energy.distribution.services.UpdateGridNodeStatusResponse);
  
  // Generation operations
  rpc StartUnit(energy.generation.services.StartUnitRequest) returns (energy.generation.services.StartUnitResponse);
  rpc StopUnit(energy.generation.services.StopUnitRequest) returns (energy.generation.services.StopUnitResponse);
  rpc RecordGeneration(energy.generation.services.RecordGenerationRequest) returns (energy.generation.services.RecordGenerationResponse);
}

// Energy module summary
message EnergyModuleSummary {
  // Module version
  string version = 1;
  
  // Module description
  string description = 2;
  
  // Available services
  repeated string available_services = 3;
  
  // Available enums
  repeated string available_enums = 4;
  
  // Available messages
  repeated string available_messages = 5;
  
  // Module capabilities
  repeated string capabilities = 6;
  
  // Last updated timestamp
  int64 last_updated = 7;
}

// Energy system overview
message EnergySystemOverview {
  // Total plants
  int32 total_plants = 1;
  
  // Total units
  int32 total_units = 2;
  
  // Total capacity in MW
  double total_capacity = 3;
  
  // Active generation in MW
  double active_generation = 4;
  
  // Total customers
  int32 total_customers = 5;
  
  // Active outages
  int32 active_outages = 6;
  
  // Grid status
  string grid_status = 7;
  
  // System health score
  double system_health_score = 8;
  
  // Last updated timestamp
  int64 last_updated = 9;
}
