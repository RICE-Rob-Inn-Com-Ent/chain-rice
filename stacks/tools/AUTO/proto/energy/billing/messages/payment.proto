syntax = "proto3";

package energy.billing.messages;

import "energy/billing/enums/payment_method.proto";

// Payment record for energy billing
message Payment {
  // Unique identifier for the payment
  string id = 1;
  
  // Customer ID who made the payment
  string customer_id = 2;
  
  // Invoice ID this payment is for
  string invoice_id = 3;
  
  // Payment amount
  double amount = 4;
  
  // Currency code (ISO 4217)
  string currency = 5;
  
  // Payment method used
  energy.billing.enums.PaymentMethod payment_method = 6;
  
  // Payment reference or transaction ID
  string payment_reference = 7;
  
  // Payment gateway transaction ID
  string gateway_transaction_id = 8;
  
  // Payment status
  PaymentStatus status = 9;
  
  // Date and time when payment was initiated (unix milliseconds)
  int64 initiated_at = 10;
  
  // Date and time when payment was processed (unix milliseconds)
  int64 processed_at = 11;
  
  // Date and time when payment was completed (unix milliseconds)
  int64 completed_at = 12;
  
  // Processing fees charged
  double processing_fees = 13;
  
  // Net amount received after fees
  double net_amount = 14;
  
  // Payment gateway used
  string gateway = 15;
  
  // Payment processor details
  string processor = 16;
  
  // Bank or financial institution details
  string bank_details = 17;
  
  // Payment authorization code
  string authorization_code = 18;
  
  // Payment failure reason (if applicable)
  string failure_reason = 19;
  
  // Additional payment metadata
  map<string, string> metadata = 20;
  
  // Timestamp when this payment record was created (unix milliseconds)
  int64 created_at = 21;
  
  // Timestamp when this payment record was last updated (unix milliseconds)
  int64 updated_at = 22;
}

// Payment status enumeration
enum PaymentStatus {
  // Payment has been initiated but not yet processed
  PAYMENT_STATUS_PENDING = 0;
  
  // Payment is being processed
  PAYMENT_STATUS_PROCESSING = 1;
  
  // Payment has been successfully completed
  PAYMENT_STATUS_COMPLETED = 2;
  
  // Payment has failed
  PAYMENT_STATUS_FAILED = 3;
  
  // Payment has been cancelled
  PAYMENT_STATUS_CANCELLED = 4;
  
  // Payment has been refunded
  PAYMENT_STATUS_REFUNDED = 5;
  
  // Payment is under review
  PAYMENT_STATUS_UNDER_REVIEW = 6;
  
  // Payment has been disputed
  PAYMENT_STATUS_DISPUTED = 7;
  
  // Payment has been reversed
  PAYMENT_STATUS_REVERSED = 8;
  
  // Payment is in dispute resolution
  PAYMENT_STATUS_DISPUTE_RESOLUTION = 9;
}
