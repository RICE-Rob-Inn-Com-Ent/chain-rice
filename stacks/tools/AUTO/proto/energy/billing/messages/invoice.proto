syntax = "proto3";

package energy.billing.messages;

import "energy/billing/enums/invoice_status.proto";
import "energy/billing/enums/billing_cycle.proto";
import "energy/billing/messages/bill_item.proto";
import "energy/billing/messages/payment.proto";

// Energy invoice for billing customers
message Invoice {
  // Unique identifier for the invoice
  string id = 1;
  
  // Customer ID this invoice belongs to
  string customer_id = 2;
  
  // Invoice number (human-readable)
  string invoice_number = 3;
  
  // Invoice status
  energy.billing.enums.InvoiceStatus status = 4;
  
  // Invoice type (e.g., "monthly_bill", "adjustment", "penalty")
  string type = 5;
  
  // Billing period start date (unix milliseconds)
  int64 billing_period_start = 6;
  
  // Billing period end date (unix milliseconds)
  int64 billing_period_end = 7;
  
  // Billing cycle for this invoice
  energy.billing.enums.BillingCycle billing_cycle = 8;
  
  // Invoice issue date (unix milliseconds)
  int64 issue_date = 9;
  
  // Invoice due date (unix milliseconds)
  int64 due_date = 10;
  
  // Subtotal amount before taxes and fees
  double subtotal = 11;
  
  // Total tax amount
  double tax_amount = 12;
  
  // Total fees and charges
  double fees_amount = 13;
  
  // Total discount amount
  double discount_amount = 14;
  
  // Total amount due
  double total_amount = 15;
  
  // Currency code (ISO 4217)
  string currency = 16;
  
  // Amount paid so far
  double amount_paid = 17;
  
  // Outstanding balance
  double outstanding_balance = 18;
  
  // List of bill items included in this invoice
  repeated BillItem bill_items = 19;
  
  // List of payments made against this invoice
  repeated Payment payments = 20;
  
  // Customer billing address
  Address billing_address = 21;
  
  // Service address (where energy is delivered)
  Address service_address = 22;
  
  // Meter ID associated with this invoice
  string meter_id = 23;
  
  // Account manager or representative
  string account_manager = 24;
  
  // Special instructions or notes
  string notes = 25;
  
  // Terms and conditions
  string terms_conditions = 26;
  
  // Payment instructions
  string payment_instructions = 27;
  
  // Late payment penalty rate
  double late_payment_penalty_rate = 28;
  
  // Grace period for late payments (in days)
  int32 grace_period_days = 29;
  
  // Additional metadata
  map<string, string> metadata = 30;
  
  // Timestamp when this invoice was created (unix milliseconds)
  int64 created_at = 31;
  
  // Timestamp when this invoice was last updated (unix milliseconds)
  int64 updated_at = 32;
}

// Address information for billing and service locations
message Address {
  // Street address line 1
  string street_address_1 = 1;
  
  // Street address line 2
  string street_address_2 = 2;
  
  // City
  string city = 3;
  
  // State or province
  string state_province = 4;
  
  // Postal or ZIP code
  string postal_code = 5;
  
  // Country code (ISO 3166-1 alpha-2)
  string country_code = 6;
  
  // Additional address details
  string additional_details = 7;
}
