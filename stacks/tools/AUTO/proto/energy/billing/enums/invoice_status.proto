syntax = "proto3";

package energy.billing.enums;

// Invoice status tracking for energy billing
enum InvoiceStatus {
  // Invoice has been created but not yet sent
  INVOICE_STATUS_DRAFT = 0;
  
  // Invoice has been generated and is ready to be sent
  INVOICE_STATUS_GENERATED = 1;
  
  // Invoice has been sent to the customer
  INVOICE_STATUS_SENT = 2;
  
  // Invoice has been delivered to the customer
  INVOICE_STATUS_DELIVERED = 3;
  
  // Invoice has been viewed by the customer
  INVOICE_STATUS_VIEWED = 4;
  
  // Invoice is partially paid
  INVOICE_STATUS_PARTIALLY_PAID = 5;
  
  // Invoice has been fully paid
  INVOICE_STATUS_PAID = 6;
  
  // Invoice payment is overdue
  INVOICE_STATUS_OVERDUE = 7;
  
  // Invoice payment is late
  INVOICE_STATUS_LATE = 8;
  
  // Invoice has been disputed by the customer
  INVOICE_STATUS_DISPUTED = 9;
  
  // Invoice has been cancelled
  INVOICE_STATUS_CANCELLED = 10;
  
  // Invoice has been voided
  INVOICE_STATUS_VOIDED = 11;
  
  // Invoice has been written off as bad debt
  INVOICE_STATUS_WRITTEN_OFF = 12;
  
  // Invoice is in collection process
  INVOICE_STATUS_IN_COLLECTION = 13;
  
  // Invoice payment has failed
  INVOICE_STATUS_PAYMENT_FAILED = 14;
  
  // Invoice is under review
  INVOICE_STATUS_UNDER_REVIEW = 15;
  
  // Invoice requires manual processing
  INVOICE_STATUS_MANUAL_PROCESSING = 16;
}
