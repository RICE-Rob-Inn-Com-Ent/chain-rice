syntax = "proto3";

package energy.distribution.messages;

import "energy/distribution/enums/asset_type.proto";

// Distribution asset in the power distribution network
message DistributionAsset {
  // Unique identifier for the asset
  string id = 1;
  
  // Asset name
  string name = 2;
  
  // Asset type
  energy.distribution.enums.AssetType type = 3;
  
  // Asset subtype
  string subtype = 4;
  
  // Asset status
  AssetStatus status = 5;
  
  // Asset manufacturer
  string manufacturer = 6;
  
  // Asset model
  string model = 7;
  
  // Asset serial number
  string serial_number = 8;
  
  // Asset part number
  string part_number = 9;
  
  // Asset installation date (unix milliseconds)
  int64 installation_date = 10;
  
  // Asset commissioning date (unix milliseconds)
  int64 commissioning_date = 11;
  
  // Asset warranty expiration date (unix milliseconds)
  int64 warranty_expiration_date = 12;
  
  // Asset expected lifetime in years
  int32 expected_lifetime_years = 13;
  
  // Asset age in years
  double age_years = 14;
  
  // Asset condition
  AssetCondition condition = 15;
  
  // Asset criticality
  AssetCriticality criticality = 16;
  
  // Asset priority
  AssetPriority priority = 17;
  
  // Physical location
  AssetLocation location = 18;
  
  // Technical specifications
  AssetSpecifications specifications = 19;
  
  // Performance metrics
  AssetPerformance performance = 20;
  
  // Maintenance information
  AssetMaintenance maintenance = 21;
  
  // Financial information
  AssetFinancial financial = 22;
  
  // Risk assessment
  AssetRisk risk = 23;
  
  // Compliance information
  AssetCompliance compliance = 24;
  
  // Documentation
  AssetDocumentation documentation = 25;
  
  // Dependencies
  AssetDependencies dependencies = 26;
  
  // Monitoring and control
  AssetMonitoring monitoring = 27;
  
  // Additional metadata
  map<string, string> metadata = 28;
  
  // Timestamp when this asset was created (unix milliseconds)
  int64 created_at = 29;
  
  // Timestamp when this asset was last updated (unix milliseconds)
  int64 updated_at = 30;
}

// Asset status enumeration
enum AssetStatus {
  // Asset is active and operational
  ASSET_STATUS_ACTIVE = 0;
  
  // Asset is inactive
  ASSET_STATUS_INACTIVE = 1;
  
  // Asset is in maintenance
  ASSET_STATUS_MAINTENANCE = 2;
  
  // Asset has failed
  ASSET_STATUS_FAILED = 3;
  
  // Asset is being repaired
  ASSET_STATUS_REPAIR = 4;
  
  // Asset is being replaced
  ASSET_STATUS_REPLACEMENT = 5;
  
  // Asset is being installed
  ASSET_STATUS_INSTALLATION = 6;
  
  // Asset is being removed
  ASSET_STATUS_REMOVAL = 7;
  
  // Asset is in test mode
  ASSET_STATUS_TEST_MODE = 8;
  
  // Asset is in standby mode
  ASSET_STATUS_STANDBY = 9;
  
  // Asset is in emergency mode
  ASSET_STATUS_EMERGENCY = 10;
  
  // Asset is offline
  ASSET_STATUS_OFFLINE = 11;
  
  // Asset is pending approval
  ASSET_STATUS_PENDING_APPROVAL = 12;
  
  // Asset is approved
  ASSET_STATUS_APPROVED = 13;
  
  // Asset is rejected
  ASSET_STATUS_REJECTED = 14;
  
  // Asset is archived
  ASSET_STATUS_ARCHIVED = 15;
  
  // Asset is decommissioned
  ASSET_STATUS_DECOMMISSIONED = 16;
}

// Asset condition enumeration
enum AssetCondition {
  // Asset is in excellent condition
  ASSET_CONDITION_EXCELLENT = 0;
  
  // Asset is in good condition
  ASSET_CONDITION_GOOD = 1;
  
  // Asset is in fair condition
  ASSET_CONDITION_FAIR = 2;
  
  // Asset is in poor condition
  ASSET_CONDITION_POOR = 3;
  
  // Asset is in critical condition
  ASSET_CONDITION_CRITICAL = 4;
  
  // Asset condition is unknown
  ASSET_CONDITION_UNKNOWN = 5;
}

// Asset criticality enumeration
enum AssetCriticality {
  // Low criticality asset
  ASSET_CRITICALITY_LOW = 0;
  
  // Medium criticality asset
  ASSET_CRITICALITY_MEDIUM = 1;
  
  // High criticality asset
  ASSET_CRITICALITY_HIGH = 2;
  
  // Critical asset
  ASSET_CRITICALITY_CRITICAL = 3;
  
  // Essential asset
  ASSET_CRITICALITY_ESSENTIAL = 4;
}

// Asset priority enumeration
enum AssetPriority {
  // Low priority asset
  ASSET_PRIORITY_LOW = 0;
  
  // Medium priority asset
  ASSET_PRIORITY_MEDIUM = 1;
  
  // High priority asset
  ASSET_PRIORITY_HIGH = 2;
  
  // Critical priority asset
  ASSET_PRIORITY_CRITICAL = 3;
  
  // Emergency priority asset
  ASSET_PRIORITY_EMERGENCY = 4;
}

// Asset location information
message AssetLocation {
  // Street address
  string street_address = 1;
  
  // City
  string city = 2;
  
  // State or province
  string state_province = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Country
  string country = 5;
  
  // GPS coordinates (latitude)
  double latitude = 6;
  
  // GPS coordinates (longitude)
  double longitude = 7;
  
  // Elevation in meters
  double elevation = 8;
  
  // Facility or site name
  string facility_name = 9;
  
  // Building or structure
  string building_structure = 10;
  
  // Floor or level
  string floor_level = 11;
  
  // Room or area
  string room_area = 12;
  
  // Rack or cabinet
  string rack_cabinet = 13;
  
  // Position or slot
  string position_slot = 14;
  
  // Additional location details
  string additional_details = 15;
}

// Asset technical specifications
message AssetSpecifications {
  // Rated power in kW
  double rated_power = 1;
  
  // Rated voltage in kV
  double rated_voltage = 2;
  
  // Rated current in A
  double rated_current = 3;
  
  // Rated frequency in Hz
  double rated_frequency = 4;
  
  // Power factor
  double power_factor = 5;
  
  // Efficiency percentage
  double efficiency = 6;
  
  // Operating temperature range
  TemperatureRange operating_temperature = 7;
  
  // Operating humidity range
  HumidityRange operating_humidity = 8;
  
  // Operating pressure range
  PressureRange operating_pressure = 9;
  
  // Dimensions
  Dimensions dimensions = 10;
  
  // Weight in kg
  double weight = 11;
  
  // Material composition
  repeated string materials = 12;
  
  // Certifications and approvals
  repeated string certifications = 13;
  
  // Standards compliance
  repeated string standards = 14;
  
  // Environmental ratings
  repeated string environmental_ratings = 15;
}

// Temperature range
message TemperatureRange {
  // Minimum temperature in Celsius
  double min_temperature = 1;
  
  // Maximum temperature in Celsius
  double max_temperature = 2;
  
  // Operating temperature in Celsius
  double operating_temperature = 3;
}

// Humidity range
message HumidityRange {
  // Minimum humidity percentage
  double min_humidity = 1;
  
  // Maximum humidity percentage
  double max_humidity = 2;
  
  // Operating humidity percentage
  double operating_humidity = 3;
}

// Pressure range
message PressureRange {
  // Minimum pressure in Pa
  double min_pressure = 1;
  
  // Maximum pressure in Pa
  double max_pressure = 2;
  
  // Operating pressure in Pa
  double operating_pressure = 3;
}

// Dimensions
message Dimensions {
  // Length in meters
  double length = 1;
  
  // Width in meters
  double width = 2;
  
  // Height in meters
  double height = 3;
  
  // Diameter in meters
  double diameter = 4;
}

// Asset performance metrics
message AssetPerformance {
  // Availability percentage
  double availability = 1;
  
  // Reliability percentage
  double reliability = 2;
  
  // Mean time between failures in hours
  double mtbf = 3;
  
  // Mean time to repair in hours
  double mttr = 4;
  
  // Performance efficiency percentage
  double performance_efficiency = 5;
  
  // Energy consumption in kWh
  double energy_consumption = 6;
  
  // Operating hours
  double operating_hours = 7;
  
  // Maintenance hours
  double maintenance_hours = 8;
  
  // Performance rating
  string performance_rating = 9;
  
  // Performance trends
  repeated PerformanceTrend performance_trends = 10;
}

// Performance trend
message PerformanceTrend {
  // Trend date (unix milliseconds)
  int64 date = 1;
  
  // Trend value
  double value = 2;
  
  // Trend metric
  string metric = 3;
  
  // Trend direction
  string direction = 4;
}

// Asset maintenance information
message AssetMaintenance {
  // Last maintenance date (unix milliseconds)
  int64 last_maintenance_date = 1;
  
  // Next maintenance date (unix milliseconds)
  int64 next_maintenance_date = 2;
  
  // Maintenance interval in days
  int32 maintenance_interval_days = 3;
  
  // Maintenance type
  string maintenance_type = 4;
  
  // Maintenance status
  string maintenance_status = 5;
  
  // Maintenance team
  string maintenance_team = 6;
  
  // Maintenance supervisor
  string maintenance_supervisor = 7;
  
  // Maintenance cost
  double maintenance_cost = 8;
  
  // Maintenance history
  repeated MaintenanceRecord maintenance_history = 9;
  
  // Maintenance schedule
  repeated MaintenanceSchedule maintenance_schedule = 10;
  
  // Spare parts inventory
  repeated SparePart spare_parts = 11;
}

// Maintenance record
message MaintenanceRecord {
  // Maintenance date (unix milliseconds)
  int64 maintenance_date = 1;
  
  // Maintenance type
  string maintenance_type = 2;
  
  // Maintenance description
  string description = 3;
  
  // Maintenance performed by
  string performed_by = 4;
  
  // Maintenance duration in hours
  double duration_hours = 5;
  
  // Maintenance cost
  double cost = 6;
  
  // Maintenance results
  string results = 7;
  
  // Maintenance recommendations
  repeated string recommendations = 8;
  
  // Maintenance notes
  string notes = 9;
}

// Maintenance schedule
message MaintenanceSchedule {
  // Schedule date (unix milliseconds)
  int64 schedule_date = 1;
  
  // Schedule type
  string schedule_type = 2;
  
  // Schedule description
  string description = 3;
  
  // Schedule priority
  string priority = 4;
  
  // Schedule status
  string status = 5;
  
  // Schedule team
  string team = 6;
  
  // Schedule estimated duration in hours
  double estimated_duration_hours = 7;
  
  // Schedule estimated cost
  double estimated_cost = 8;
}

// Spare part information
message SparePart {
  // Part number
  string part_number = 1;
  
  // Part description
  string description = 2;
  
  // Part quantity
  int32 quantity = 3;
  
  // Part location
  string location = 4;
  
  // Part cost
  double cost = 5;
  
  // Part supplier
  string supplier = 6;
  
  // Part lead time in days
  int32 lead_time_days = 7;
  
  // Part criticality
  string criticality = 8;
}

// Asset financial information
message AssetFinancial {
  // Purchase cost
  double purchase_cost = 1;
  
  // Installation cost
  double installation_cost = 2;
  
  // Total initial cost
  double total_initial_cost = 3;
  
  // Current value
  double current_value = 4;
  
  // Depreciation method
  string depreciation_method = 5;
  
  // Depreciation rate
  double depreciation_rate = 6;
  
  // Accumulated depreciation
  double accumulated_depreciation = 7;
  
  // Book value
  double book_value = 8;
  
  // Insurance value
  double insurance_value = 9;
  
  // Replacement cost
  double replacement_cost = 10;
  
  // Operating costs per year
  double operating_costs_per_year = 11;
  
  // Maintenance costs per year
  double maintenance_costs_per_year = 12;
  
  // Energy costs per year
  double energy_costs_per_year = 13;
}

// Asset risk assessment
message AssetRisk {
  // Risk level
  string risk_level = 1;
  
  // Risk score
  double risk_score = 2;
  
  // Risk factors
  repeated RiskFactor risk_factors = 3;
  
  // Risk mitigation measures
  repeated RiskMitigation risk_mitigations = 4;
  
  // Risk assessment date (unix milliseconds)
  int64 risk_assessment_date = 5;
  
  // Next risk assessment date (unix milliseconds)
  int64 next_risk_assessment_date = 6;
  
  // Risk assessor
  string risk_assessor = 7;
}

// Risk factor
message RiskFactor {
  // Risk factor type
  string type = 1;
  
  // Risk factor description
  string description = 2;
  
  // Risk factor probability
  double probability = 3;
  
  // Risk factor impact
  double impact = 4;
  
  // Risk factor score
  double score = 5;
  
  // Risk factor mitigation
  string mitigation = 6;
}

// Risk mitigation
message RiskMitigation {
  // Mitigation type
  string type = 1;
  
  // Mitigation description
  string description = 2;
  
  // Mitigation effectiveness
  double effectiveness = 3;
  
  // Mitigation cost
  double cost = 4;
  
  // Mitigation implementation date
  int64 implementation_date = 5;
  
  // Mitigation status
  string status = 6;
}

// Asset compliance information
message AssetCompliance {
  // Compliance status
  string compliance_status = 1;
  
  // Compliance requirements
  repeated ComplianceRequirement compliance_requirements = 2;
  
  // Compliance certifications
  repeated ComplianceCertification compliance_certifications = 3;
  
  // Compliance audits
  repeated ComplianceAudit compliance_audits = 4;
  
  // Compliance violations
  repeated ComplianceViolation compliance_violations = 5;
  
  // Compliance officer
  string compliance_officer = 6;
  
  // Compliance review date (unix milliseconds)
  int64 compliance_review_date = 7;
}

// Compliance requirement
message ComplianceRequirement {
  // Requirement type
  string type = 1;
  
  // Requirement description
  string description = 2;
  
  // Requirement standard
  string standard = 3;
  
  // Requirement status
  string status = 4;
  
  // Requirement due date
  int64 due_date = 5;
  
  // Requirement compliance date
  int64 compliance_date = 6;
}

// Compliance certification
message ComplianceCertification {
  // Certification type
  string type = 1;
  
  // Certification body
  string certification_body = 2;
  
  // Certification number
  string certification_number = 3;
  
  // Certification date (unix milliseconds)
  int64 certification_date = 4;
  
  // Certification expiration date (unix milliseconds)
  int64 expiration_date = 5;
  
  // Certification status
  string status = 6;
}

// Compliance audit
message ComplianceAudit {
  // Audit date (unix milliseconds)
  int64 audit_date = 1;
  
  // Audit type
  string audit_type = 2;
  
  // Audit body
  string audit_body = 3;
  
  // Audit findings
  string findings = 4;
  
  // Audit recommendations
  repeated string recommendations = 5;
  
  // Audit status
  string status = 6;
}

// Compliance violation
message ComplianceViolation {
  // Violation date (unix milliseconds)
  int64 violation_date = 1;
  
  // Violation type
  string violation_type = 2;
  
  // Violation description
  string description = 3;
  
  // Violation severity
  string severity = 4;
  
  // Violation status
  string status = 5;
  
  // Violation resolution date
  int64 resolution_date = 6;
  
  // Violation penalty
  double penalty = 7;
}

// Asset documentation
message AssetDocumentation {
  // Manuals and documentation
  repeated Document manuals = 1;
  
  // Drawings and schematics
  repeated Document drawings = 2;
  
  // Certificates and approvals
  repeated Document certificates = 3;
  
  // Test reports
  repeated Document test_reports = 4;
  
  // Inspection reports
  repeated Document inspection_reports = 5;
  
  // Maintenance records
  repeated Document maintenance_records = 6;
  
  // Warranty documents
  repeated Document warranty_documents = 7;
  
  // Insurance documents
  repeated Document insurance_documents = 8;
}

// Document information
message Document {
  // Document name
  string name = 1;
  
  // Document type
  string type = 2;
  
  // Document version
  string version = 3;
  
  // Document date (unix milliseconds)
  int64 date = 4;
  
  // Document location
  string location = 5;
  
  // Document URL
  string url = 6;
  
  // Document size in bytes
  int64 size_bytes = 7;
  
  // Document format
  string format = 8;
  
  // Document description
  string description = 9;
}

// Asset dependencies
message AssetDependencies {
  // Upstream dependencies
  repeated string upstream_dependencies = 1;
  
  // Downstream dependencies
  repeated string downstream_dependencies = 2;
  
  // Parallel dependencies
  repeated string parallel_dependencies = 3;
  
  // Critical dependencies
  repeated string critical_dependencies = 4;
  
  // Dependency relationships
  repeated DependencyRelationship dependency_relationships = 5;
}

// Dependency relationship
message DependencyRelationship {
  // Dependent asset ID
  string dependent_asset_id = 1;
  
  // Relationship type
  string relationship_type = 2;
  
  // Relationship strength
  string relationship_strength = 3;
  
  // Relationship description
  string description = 4;
}

// Asset monitoring and control
message AssetMonitoring {
  // Monitoring enabled
  bool monitoring_enabled = 1;
  
  // Monitoring parameters
  repeated string monitoring_parameters = 2;
  
  // Monitoring frequency in seconds
  int32 monitoring_frequency = 3;
  
  // Alarm thresholds
  map<string, double> alarm_thresholds = 4;
  
  // Control enabled
  bool control_enabled = 5;
  
  // Control parameters
  repeated string control_parameters = 6;
  
  // Remote access enabled
  bool remote_access_enabled = 7;
  
  // Communication protocol
  string communication_protocol = 8;
  
  // Network address
  string network_address = 9;
  
  // Monitoring system
  string monitoring_system = 10;
}
