  int64 period_end = 3;
}

message GetMeterStatisticsResponse {
  int32 total_meters = 1;
  int32 active_meters = 2;
  int32 inactive_meters = 3;
  int32 failed_meters = 4;
  double total_consumption = 5;
  double average_consumption = 6;
}

// Request/Response messages for GetReading
message GetReadingRequest {
  string reading_id = 1;
}

message GetReadingResponse {
  Reading reading = 1;
}

// Request/Response messages for GetLatestReading
message GetLatestReadingRequest {
  string meter_id = 1;
}

message GetLatestReadingResponse {
  Reading reading = 1;
}

// Request/Response messages for ListMeterReadings
message ListMeterReadingsRequest {
  string meter_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  int64 date_from = 4;
  int64 date_to = 5;
  string status_filter = 6;
}

message ListMeterReadingsResponse {
  repeated Reading readings = 1;
  string next_page_token = 2;
