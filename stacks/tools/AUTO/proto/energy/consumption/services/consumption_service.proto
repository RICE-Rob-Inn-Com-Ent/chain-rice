syntax = "proto3";

package energy.consumption.services;

import "energy/consumption/messages/meter.proto";
import "energy/consumption/messages/reading.proto";
import "energy/consumption/messages/consumption_report.proto";
import "energy/consumption/enums/reading_status.proto";

// Consumption service for managing meters, readings, and reports
service ConsumptionMsgService {
  // Install a new meter
  rpc InstallMeter(InstallMeterRequest) returns (InstallMeterResponse);
  
  // Update meter information
  rpc UpdateMeter(UpdateMeterRequest) returns (UpdateMeterResponse);
  
  // Remove or decommission a meter
  rpc RemoveMeter(RemoveMeterRequest) returns (RemoveMeterResponse);
  
  // Calibrate a meter
  rpc CalibrateMeter(CalibrateMeterRequest) returns (CalibrateMeterResponse);
  
  // Record a meter reading
  rpc RecordReading(RecordReadingRequest) returns (RecordReadingResponse);
  
  // Update a reading
  rpc UpdateReading(UpdateReadingRequest) returns (UpdateReadingResponse);
  
  // Validate a reading
  rpc ValidateReading(ValidateReadingRequest) returns (ValidateReadingResponse);
  
  // Estimate a reading
  rpc EstimateReading(EstimateReadingRequest) returns (EstimateReadingResponse);
  
  // Correct a reading
  rpc CorrectReading(CorrectReadingRequest) returns (CorrectReadingResponse);
  
  // Generate consumption report
  rpc GenerateConsumptionReport(GenerateConsumptionReportRequest) returns (GenerateConsumptionReportResponse);
  
  // Schedule meter reading
  rpc ScheduleReading(ScheduleReadingRequest) returns (ScheduleReadingResponse);
  
  // Cancel scheduled reading
  rpc CancelScheduledReading(CancelScheduledReadingRequest) returns (CancelScheduledReadingResponse);
  
  // Set meter configuration
  rpc SetMeterConfiguration(SetMeterConfigurationRequest) returns (SetMeterConfigurationResponse);
  
  // Update meter status
  rpc UpdateMeterStatus(UpdateMeterStatusRequest) returns (UpdateMeterStatusResponse);
  
  // Process batch readings
  rpc ProcessBatchReadings(ProcessBatchReadingsRequest) returns (ProcessBatchReadingsResponse);
  
  // Create consumption alert
  rpc CreateConsumptionAlert(CreateConsumptionAlertRequest) returns (CreateConsumptionAlertResponse);
  
  // Update consumption alert
  rpc UpdateConsumptionAlert(UpdateConsumptionAlertRequest) returns (UpdateConsumptionAlertResponse);
}

// Query service for reading consumption data
service ConsumptionQueryService {
  // Get a specific meter by ID
  rpc GetMeter(GetMeterRequest) returns (GetMeterResponse);
  
  // Get meter by serial number
  rpc GetMeterBySerialNumber(GetMeterBySerialNumberRequest) returns (GetMeterBySerialNumberResponse);
  
  // List meters for a customer
  rpc ListCustomerMeters(ListCustomerMetersRequest) returns (ListCustomerMetersResponse);
  
  // List all meters with filters
  rpc ListMeters(ListMetersRequest) returns (ListMetersResponse);
  
  // Get meter statistics
  rpc GetMeterStatistics(GetMeterStatisticsRequest) returns (GetMeterStatisticsResponse);
  
  // Get a specific reading by ID
  rpc GetReading(GetReadingRequest) returns (GetReadingResponse);
  
  // Get latest reading for a meter
  rpc GetLatestReading(GetLatestReadingRequest) returns (GetLatestReadingResponse);
  
  // List readings for a meter
  rpc ListMeterReadings(ListMeterReadingsRequest) returns (ListMeterReadingsResponse);
  
  // List readings for a customer
  rpc ListCustomerReadings(ListCustomerReadingsRequest) returns (ListCustomerReadingsResponse);
  
  // List all readings with filters
  rpc ListReadings(ListReadingsRequest) returns (ListReadingsResponse);
  
  // Get reading statistics
  rpc GetReadingStatistics(GetReadingStatisticsRequest) returns (GetReadingStatisticsResponse);
  
  // Get a specific consumption report by ID
  rpc GetConsumptionReport(GetConsumptionReportRequest) returns (GetConsumptionReportResponse);
  
  // List consumption reports for a customer
  rpc ListCustomerReports(ListCustomerReportsRequest) returns (ListCustomerReportsResponse);
  
  // List all consumption reports with filters
  rpc ListConsumptionReports(ListConsumptionReportsRequest) returns (ListConsumptionReportsResponse);
  
  // Get consumption trends
  rpc GetConsumptionTrends(GetConsumptionTrendsRequest) returns (GetConsumptionTrendsResponse);
  
  // Get consumption patterns
  rpc GetConsumptionPatterns(GetConsumptionPatternsRequest) returns (GetConsumptionPatternsResponse);
  
  // Get consumption alerts
  rpc GetConsumptionAlerts(GetConsumptionAlertsRequest) returns (GetConsumptionAlertsResponse);
  
  // Get consumption forecasts
  rpc GetConsumptionForecasts(GetConsumptionForecastsRequest) returns (GetConsumptionForecastsResponse);
  
  // Get consumption benchmarks
  rpc GetConsumptionBenchmarks(GetConsumptionBenchmarksRequest) returns (GetConsumptionBenchmarksResponse);
}

// Request/Response messages for InstallMeter
message InstallMeterRequest {
  Meter meter = 1;
}

message InstallMeterResponse {
  Meter meter = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for UpdateMeter
message UpdateMeterRequest {
  string meter_id = 1;
  Meter meter = 2;
}

message UpdateMeterResponse {
  Meter meter = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for RemoveMeter
message RemoveMeterRequest {
  string meter_id = 1;
  string reason = 2;
  int64 removal_date = 3;
}

message RemoveMeterResponse {
  bool success = 1;
  string message = 2;
}

// Request/Response messages for CalibrateMeter
message CalibrateMeterRequest {
  string meter_id = 1;
  double calibration_factor = 2;
  string calibration_method = 3;
  string calibration_standard = 4;
}

message CalibrateMeterResponse {
  Meter meter = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for RecordReading
message RecordReadingRequest {
  Reading reading = 1;
}

message RecordReadingResponse {
  Reading reading = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for UpdateReading
message UpdateReadingRequest {
  string reading_id = 1;
  Reading reading = 2;
}

message UpdateReadingResponse {
  Reading reading = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for ValidateReading
message ValidateReadingRequest {
  string reading_id = 1;
  repeated string validation_rules = 2;
}

message ValidateReadingResponse {
  Reading reading = 1;
  bool success = 2;
  string message = 3;
  repeated ValidationResult validation_results = 4;
}

// Request/Response messages for EstimateReading
message EstimateReadingRequest {
  string meter_id = 1;
  int64 reading_date = 2;
  string estimation_method = 3;
  map<string, string> estimation_parameters = 4;
}

message EstimateReadingResponse {
  Reading reading = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for CorrectReading
message CorrectReadingRequest {
  string reading_id = 1;
  double corrected_value = 2;
  string correction_reason = 3;
  string corrected_by = 4;
}

message CorrectReadingResponse {
  Reading reading = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for GenerateConsumptionReport
message GenerateConsumptionReportRequest {
  string customer_id = 1;
  string meter_id = 2;
  int64 period_start = 3;
  int64 period_end = 4;
  string report_type = 5;
  map<string, string> report_options = 6;
}

message GenerateConsumptionReportResponse {
  ConsumptionReport report = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for ScheduleReading
message ScheduleReadingRequest {
  string meter_id = 1;
  int64 scheduled_date = 2;
  string reading_type = 3;
  string scheduled_by = 4;
  map<string, string> schedule_options = 5;
}

message ScheduleReadingResponse {
  bool success = 1;
  string message = 2;
  string schedule_id = 3;
}

// Request/Response messages for CancelScheduledReading
message CancelScheduledReadingRequest {
  string schedule_id = 1;
  string reason = 2;
}

message CancelScheduledReadingResponse {
  bool success = 1;
  string message = 2;
}

// Request/Response messages for SetMeterConfiguration
message SetMeterConfigurationRequest {
  string meter_id = 1;
  map<string, string> configuration = 2;
}

message SetMeterConfigurationResponse {
  Meter meter = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for UpdateMeterStatus
message UpdateMeterStatusRequest {
  string meter_id = 1;
  string status = 2;
  string reason = 3;
}

message UpdateMeterStatusResponse {
  Meter meter = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for ProcessBatchReadings
message ProcessBatchReadingsRequest {
  repeated Reading readings = 1;
  string processing_options = 2;
}

message ProcessBatchReadingsResponse {
  repeated Reading readings = 1;
  int32 successful_count = 2;
  int32 failed_count = 3;
  repeated string error_messages = 4;
}

// Request/Response messages for CreateConsumptionAlert
message CreateConsumptionAlertRequest {
  string customer_id = 1;
  string meter_id = 2;
  string alert_type = 3;
  string severity = 4;
  string message = 5;
  double threshold = 6;
  map<string, string> alert_conditions = 7;
}

message CreateConsumptionAlertResponse {
  ConsumptionAlert alert = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for UpdateConsumptionAlert
message UpdateConsumptionAlertRequest {
  string alert_id = 1;
  ConsumptionAlert alert = 2;
}

message UpdateConsumptionAlertResponse {
  ConsumptionAlert alert = 1;
  bool success = 2;
  string message = 3;
}

// Request/Response messages for GetMeter
message GetMeterRequest {
  string meter_id = 1;
}

message GetMeterResponse {
  Meter meter = 1;
}

// Request/Response messages for GetMeterBySerialNumber
message GetMeterBySerialNumberRequest {
  string serial_number = 1;
}

message GetMeterBySerialNumberResponse {
  Meter meter = 1;
}

// Request/Response messages for ListCustomerMeters
message ListCustomerMetersRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string status_filter = 4;
}

message ListCustomerMetersResponse {
  repeated Meter meters = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request/Response messages for ListMeters
message ListMetersRequest {
  int32 page_size = 1;
  string page_token = 2;
  string status_filter = 3;
  string type_filter = 4;
  string customer_id_filter = 5;
  string sort_by = 6;
  bool sort_descending = 7;
}

message ListMetersResponse {
  repeated Meter meters = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request/Response messages for GetMeterStatistics
message GetMeterStatisticsRequest {
  string customer_id = 1;
