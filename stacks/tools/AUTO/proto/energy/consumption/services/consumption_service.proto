}

// Request/Response messages for ListCustomerReadings
message ListCustomerReadingsRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  int64 date_from = 4;
  int64 date_to = 5;
  string meter_id_filter = 6;
}

message ListCustomerReadingsResponse {
  repeated Reading readings = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request/Response messages for ListReadings
message ListReadingsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string status_filter = 3;
  string meter_id_filter = 4;
  string customer_id_filter = 5;
  int64 date_from = 6;
  int64 date_to = 7;
  string sort_by = 8;
  bool sort_descending = 9;
}

message ListReadingsResponse {
  repeated Reading readings = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

