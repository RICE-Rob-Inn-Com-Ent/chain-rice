}

message GetReadingStatisticsResponse {
  int32 total_readings = 1;
  int32 valid_readings = 2;
  int32 estimated_readings = 3;
  int32 flagged_readings = 4;
  double total_consumption = 5;
  double average_consumption = 6;
  double peak_consumption = 7;
  double minimum_consumption = 8;
}

// Request/Response messages for GetConsumptionReport
message GetConsumptionReportRequest {
  string report_id = 1;
}

message GetConsumptionReportResponse {
  ConsumptionReport report = 1;
}

// Request/Response messages for ListCustomerReports
message ListCustomerReportsRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string report_type_filter = 4;
  int64 date_from = 5;
  int64 date_to = 6;
}

message ListCustomerReportsResponse {
  repeated ConsumptionReport reports = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request/Response messages for ListConsumptionReports
message ListConsumptionReportsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string report_type_filter = 3;
  string customer_id_filter = 4;
  int64 date_from = 5;
  int64 date_to = 6;
  string sort_by = 7;
  bool sort_descending = 8;
}

message ListConsumptionReportsResponse {
  repeated ConsumptionReport reports = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request/Response messages for GetConsumptionTrends
message GetConsumptionTrendsRequest {
  string customer_id = 1;
  string meter_id = 2;
  int64 period_start = 3;
  int64 period_end = 4;
  string trend_type = 5;
}

message GetConsumptionTrendsResponse {
  repeated TrendDataPoint trend_data = 1;
  TrendAnalysis trend_analysis = 2;
}

// Request/Response messages for GetConsumptionPatterns
message GetConsumptionPatternsRequest {
  string customer_id = 1;
  string meter_id = 2;
  int64 period_start = 3;
  int64 period_end = 4;
}

message GetConsumptionPatternsResponse {
  ConsumptionPatterns patterns = 1;
  repeated UsagePattern usage_patterns = 2;
}

// Request/Response messages for GetConsumptionAlerts
message GetConsumptionAlertsRequest {
  string customer_id = 1;
  string meter_id = 2;
  string alert_type_filter = 3;
  string severity_filter = 4;
  int64 date_from = 5;
  int64 date_to = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message GetConsumptionAlertsResponse {
  repeated ConsumptionAlert alerts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request/Response messages for GetConsumptionForecasts
message GetConsumptionForecastsRequest {
  string customer_id = 1;
  string meter_id = 2;
  int64 forecast_start = 3;
  int64 forecast_end = 4;
  string forecast_method = 5;
}

message GetConsumptionForecastsResponse {
  repeated ForecastDataPoint forecast_data = 1;
  ForecastAccuracy forecast_accuracy = 2;
}

// Request/Response messages for GetConsumptionBenchmarks
message GetConsumptionBenchmarksRequest {
  string customer_id = 1;
  string meter_id = 2;
  string benchmark_type = 3;
  int64 period_start = 4;
  int64 period_end = 5;
}

message GetConsumptionBenchmarksResponse {
  repeated BenchmarkData benchmark_data = 1;
  BenchmarkAnalysis benchmark_analysis = 2;
}

// Supporting message types
message TrendDataPoint {
  int64 timestamp = 1;
  double value = 2;
  double trend = 3;
}

message TrendAnalysis {
  string direction = 1;
  string strength = 2;
  double slope = 3;
  double r_squared = 4;
}

message ForecastDataPoint {
  int64 timestamp = 1;
  double forecast_value = 2;
  double confidence_interval_lower = 3;
  double confidence_interval_upper = 4;
}

message ForecastAccuracy {
  double mean_absolute_error = 1;
  double mean_squared_error = 2;
  double root_mean_squared_error = 3;
  double mean_absolute_percentage_error = 4;
}

message BenchmarkData {
  string benchmark_name = 1;
  double benchmark_value = 2;
  double customer_value = 3;
  double percentage_difference = 4;
  string performance_rating = 5;
}

message BenchmarkAnalysis {
  string overall_rating = 1;
  double efficiency_score = 2;
  repeated string strengths = 3;
  repeated string improvement_areas = 4;
}

message ValidationResult {
  string rule_name = 1;
  string result = 2;
  string message = 3;
  double value = 4;
  string expected = 5;
  string severity = 6;
}

message UsagePattern {
  string pattern_type = 1;
  string description = 2;
  double typical_consumption = 3;
  double frequency = 4;
  int64 duration_minutes = 5;
}

message ConsumptionPatterns {
  double base_load = 1;
  double peak_load = 2;
  double load_factor = 3;
  double demand_factor = 4;
  double diversity_factor = 5;
  repeated UsagePattern usage_patterns = 6;
}

message ConsumptionAlert {
  string id = 1;
  string customer_id = 2;
  string meter_id = 3;
  string alert_type = 4;
  string severity = 5;
  string message = 6;
  double threshold = 7;
  double actual_value = 8;
  int64 timestamp = 9;
  string status = 10;
  map<string, string> alert_conditions = 11;
}
