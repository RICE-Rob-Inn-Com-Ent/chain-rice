syntax = "proto3";

package energy.consumption.enums;

// Status of meter readings for consumption monitoring
enum ReadingStatus {
  // Reading has been successfully recorded
  READING_STATUS_RECORDED = 0;
  
  // Reading is pending collection
  READING_STATUS_PENDING = 1;
  
  // Reading has been collected but not yet processed
  READING_STATUS_COLLECTED = 2;
  
  // Reading is being validated
  READING_STATUS_VALIDATING = 3;
  
  // Reading has been validated and approved
  READING_STATUS_VALIDATED = 4;
  
  // Reading has been rejected due to errors
  READING_STATUS_REJECTED = 5;
  
  // Reading is flagged for manual review
  READING_STATUS_FLAGGED = 6;
  
  // Reading is under investigation
  READING_STATUS_UNDER_INVESTIGATION = 7;
  
  // Reading has been estimated due to missing data
  READING_STATUS_ESTIMATED = 8;
  
  // Reading has been corrected after validation
  READING_STATUS_CORRECTED = 9;
  
  // Reading is incomplete or partial
  READING_STATUS_INCOMPLETE = 10;
  
  // Reading has been deleted
  READING_STATUS_DELETED = 11;
  
  // Reading is archived for historical purposes
  READING_STATUS_ARCHIVED = 12;
  
  // Reading failed to be collected
  READING_STATUS_COLLECTION_FAILED = 13;
  
  // Reading is in dispute
  READING_STATUS_DISPUTED = 14;
  
  // Reading has been resolved from dispute
  READING_STATUS_DISPUTE_RESOLVED = 15;
  
  // Reading is scheduled for collection
  READING_STATUS_SCHEDULED = 16;
  
  // Reading collection is in progress
  READING_STATUS_COLLECTING = 17;
  
  // Reading has been transmitted from meter
  READING_STATUS_TRANSMITTED = 18;
  
  // Reading has been received by system
  READING_STATUS_RECEIVED = 19;
  
  // Reading requires manual entry
  READING_STATUS_MANUAL_ENTRY = 20;
  
  // Reading has been automatically estimated
  READING_STATUS_AUTO_ESTIMATED = 21;
  
  // Reading is being processed
  READING_STATUS_PROCESSING = 22;
  
  // Reading has been processed successfully
  READING_STATUS_PROCESSED = 23;
  
  // Reading processing has failed
  READING_STATUS_PROCESSING_FAILED = 24;
  
  // Reading is awaiting customer confirmation
  READING_STATUS_AWAITING_CONFIRMATION = 25;
  
  // Reading has been confirmed by customer
  READING_STATUS_CUSTOMER_CONFIRMED = 26;
  
  // Reading has been disputed by customer
  READING_STATUS_CUSTOMER_DISPUTED = 27;
}
