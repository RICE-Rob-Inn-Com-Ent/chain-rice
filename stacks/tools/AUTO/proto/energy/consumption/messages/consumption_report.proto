syntax = "proto3";

package energy.consumption.messages;

import "energy/consumption/enums/consumption_unit.proto";
import "energy/consumption/messages/reading.proto";

// Consumption report for analyzing energy usage patterns
message ConsumptionReport {
  // Unique identifier for the report
  string id = 1;
  
  // Customer ID this report belongs to
  string customer_id = 2;
  
  // Meter ID
  string meter_id = 3;
  
  // Report type
  ReportType type = 4;
  
  // Report period start date (unix milliseconds)
  int64 period_start = 5;
  
  // Report period end date (unix milliseconds)
  int64 period_end = 6;
  
  // Report generation date (unix milliseconds)
  int64 generated_at = 7;
  
  // Report status
  ReportStatus status = 8;
  
  // Total consumption for the period
  double total_consumption = 9;
  
  // Unit of measurement
  energy.consumption.enums.ConsumptionUnit unit = 10;
  
  // Average daily consumption
  double average_daily_consumption = 11;
  
  // Peak consumption value
  double peak_consumption = 12;
  
  // Peak consumption timestamp
  int64 peak_consumption_timestamp = 13;
  
  // Minimum consumption value
  double minimum_consumption = 14;
  
  // Minimum consumption timestamp
  int64 minimum_consumption_timestamp = 15;
  
  // Consumption statistics
  ConsumptionStatistics statistics = 16;
  
  // Hourly consumption breakdown
  repeated HourlyConsumption hourly_consumption = 17;
  
  // Daily consumption breakdown
  repeated DailyConsumption daily_consumption = 18;
  
  // Weekly consumption breakdown
  repeated WeeklyConsumption weekly_consumption = 19;
  
  // Monthly consumption breakdown
  repeated MonthlyConsumption monthly_consumption = 20;
  
  // Time-of-use analysis
  TimeOfUseAnalysis time_of_use_analysis = 21;
  
  // Consumption patterns
  ConsumptionPatterns patterns = 22;
  
  // Comparative analysis
  ComparativeAnalysis comparative_analysis = 23;
  
  // Recommendations
  repeated ConsumptionRecommendation recommendations = 24;
  
  // Alerts and notifications
  repeated ConsumptionAlert alerts = 25;
  
  // Report metadata
  map<string, string> metadata = 26;
  
  // Timestamp when this report was created (unix milliseconds)
  int64 created_at = 27;
  
  // Timestamp when this report was last updated (unix milliseconds)
  int64 updated_at = 28;
}

// Report type enumeration
enum ReportType {
  // Standard consumption report
  REPORT_TYPE_STANDARD = 0;
  
  // Detailed consumption analysis
  REPORT_TYPE_DETAILED = 1;
  
  // Billing period report
  REPORT_TYPE_BILLING_PERIOD = 2;
  
  // Monthly summary report
  REPORT_TYPE_MONTHLY_SUMMARY = 3;
  
  // Annual summary report
  REPORT_TYPE_ANNUAL_SUMMARY = 4;
  
  // Comparative analysis report
  REPORT_TYPE_COMPARATIVE = 5;
  
  // Energy efficiency report
  REPORT_TYPE_EFFICIENCY = 6;
  
  // Peak demand analysis report
  REPORT_TYPE_PEAK_DEMAND = 7;
  
  // Time-of-use analysis report
  REPORT_TYPE_TIME_OF_USE = 8;
  
  // Custom report
  REPORT_TYPE_CUSTOM = 9;
  
  // Regulatory compliance report
  REPORT_TYPE_COMPLIANCE = 10;
  
  // Environmental impact report
  REPORT_TYPE_ENVIRONMENTAL = 11;
}

// Report status enumeration
enum ReportStatus {
  // Report is being generated
  REPORT_STATUS_GENERATING = 0;
  
  // Report has been generated successfully
  REPORT_STATUS_GENERATED = 1;
  
  // Report generation failed
  REPORT_STATUS_FAILED = 2;
  
  // Report is being processed
  REPORT_STATUS_PROCESSING = 3;
  
  // Report has been processed
  REPORT_STATUS_PROCESSED = 4;
  
  // Report is archived
  REPORT_STATUS_ARCHIVED = 5;
  
  // Report is expired
  REPORT_STATUS_EXPIRED = 6;
}

// Consumption statistics
message ConsumptionStatistics {
  // Mean consumption
  double mean = 1;
  
  // Median consumption
  double median = 2;
  
  // Standard deviation
  double standard_deviation = 3;
  
  // Variance
  double variance = 4;
  
  // Coefficient of variation
  double coefficient_of_variation = 5;
  
  // Percentiles
  map<int32, double> percentiles = 6;
  
  // Trend analysis
  TrendAnalysis trend = 7;
  
  // Seasonality analysis
  SeasonalityAnalysis seasonality = 8;
}

// Hourly consumption data
message HourlyConsumption {
  // Hour timestamp (unix milliseconds)
  int64 hour_timestamp = 1;
  
  // Consumption value for this hour
  double consumption = 2;
  
  // Average consumption for this hour across the period
  double average_consumption = 3;
  
  // Percentage of total consumption
  double percentage_of_total = 4;
  
  // Time-of-use category
  string time_of_use_category = 5;
}

// Daily consumption data
message DailyConsumption {
  // Date (unix milliseconds, start of day)
  int64 date = 1;
  
  // Total consumption for this day
  double consumption = 2;
  
  // Average consumption for this day of week
  double average_consumption = 3;
  
  // Percentage of total consumption
  double percentage_of_total = 4;
  
  // Day of week (0=Sunday, 1=Monday, etc.)
  int32 day_of_week = 5;
  
  // Is weekend day
  bool is_weekend = 6;
  
  // Is holiday
  bool is_holiday = 7;
}

// Weekly consumption data
message WeeklyConsumption {
  // Week start date (unix milliseconds)
  int64 week_start = 1;
  
  // Week end date (unix milliseconds)
  int64 week_end = 2;
  
  // Total consumption for this week
  double consumption = 3;
  
  // Average consumption for this week
  double average_consumption = 4;
  
  // Percentage of total consumption
  double percentage_of_total = 5;
  
  // Week number in year
  int32 week_number = 6;
}

// Monthly consumption data
message MonthlyConsumption {
  // Month start date (unix milliseconds)
  int64 month_start = 1;
  
  // Month end date (unix milliseconds)
  int64 month_end = 2;
  
  // Total consumption for this month
  double consumption = 3;
  
  // Average consumption for this month
  double average_consumption = 4;
  
  // Percentage of total consumption
  double percentage_of_total = 5;
  
  // Month number (1-12)
  int32 month_number = 6;
  
  // Year
  int32 year = 7;
}

// Time-of-use analysis
message TimeOfUseAnalysis {
  // Peak period consumption
  double peak_consumption = 1;
  
  // Off-peak period consumption
  double off_peak_consumption = 2;
  
  // Mid-peak period consumption
  double mid_peak_consumption = 3;
  
  // Peak period percentage
  double peak_percentage = 4;
  
  // Off-peak period percentage
  double off_peak_percentage = 5;
  
  // Mid-peak period percentage
  double mid_peak_percentage = 6;
  
  // Time-of-use categories
  repeated TimeOfUseCategory time_of_use_categories = 7;
}

// Time-of-use category
message TimeOfUseCategory {
  // Category name
  string category_name = 1;
  
  // Consumption amount
  double consumption = 2;
  
  // Percentage of total
  double percentage = 3;
  
  // Average consumption
  double average_consumption = 4;
  
  // Peak consumption
  double peak_consumption = 5;
}

// Consumption patterns analysis
message ConsumptionPatterns {
  // Base load consumption
  double base_load = 1;
  
  // Peak load consumption
  double peak_load = 2;
  
  // Load factor
  double load_factor = 3;
  
  // Demand factor
  double demand_factor = 4;
  
  // Diversity factor
  double diversity_factor = 5;
  
  // Usage patterns
  repeated UsagePattern usage_patterns = 6;
}

// Usage pattern
message UsagePattern {
  // Pattern type (e.g., "morning_peak", "evening_peak", "overnight_low")
  string pattern_type = 1;
  
  // Pattern description
  string description = 2;
  
  // Typical consumption during this pattern
  double typical_consumption = 3;
  
  // Pattern frequency
  double frequency = 4;
  
  // Pattern duration
  int64 duration_minutes = 5;
}

// Comparative analysis
message ComparativeAnalysis {
  // Previous period comparison
  PeriodComparison previous_period = 1;
  
  // Same period last year comparison
  PeriodComparison same_period_last_year = 2;
  
  // Average customer comparison
  CustomerComparison average_customer = 3;
  
  // Similar customer comparison
  CustomerComparison similar_customer = 4;
  
  // Benchmark comparison
  BenchmarkComparison benchmark = 5;
}

// Period comparison
message PeriodComparison {
  // Comparison period start
  int64 period_start = 1;
  
  // Comparison period end
  int64 period_end = 2;
  
  // Consumption in comparison period
  double consumption = 3;
  
  // Percentage change
  double percentage_change = 4;
  
  // Absolute change
  double absolute_change = 5;
}

// Customer comparison
message CustomerComparison {
  // Average consumption
  double average_consumption = 1;
  
  // Customer's consumption
  double customer_consumption = 2;
  
  // Percentage difference
  double percentage_difference = 3;
  
  // Rank percentile
  double rank_percentile = 4;
}

// Benchmark comparison
message BenchmarkComparison {
  // Benchmark name
  string benchmark_name = 1;
  
  // Benchmark consumption
  double benchmark_consumption = 2;
  
  // Customer's consumption
  double customer_consumption = 3;
  
  // Performance rating
  string performance_rating = 4;
  
  // Efficiency score
  double efficiency_score = 5;
}

// Trend analysis
message TrendAnalysis {
  // Trend direction (increasing, decreasing, stable)
  string direction = 1;
  
  // Trend strength (weak, moderate, strong)
  string strength = 2;
  
  // Trend slope
  double slope = 3;
  
  // R-squared value
  double r_squared = 4;
  
  // Forecast for next period
  double forecast = 5;
}

// Seasonality analysis
message SeasonalityAnalysis {
  // Seasonal pattern detected
  bool seasonal_pattern_detected = 1;
  
  // Peak season
  string peak_season = 2;
  
  // Low season
  string low_season = 3;
  
  // Seasonal variation
  double seasonal_variation = 4;
  
  // Seasonal factors
  map<string, double> seasonal_factors = 5;
}

// Consumption recommendation
message ConsumptionRecommendation {
  // Recommendation type
  string type = 1;
  
  // Recommendation title
  string title = 2;
  
  // Recommendation description
  string description = 3;
  
  // Potential savings
  double potential_savings = 4;
  
  // Implementation difficulty
  string difficulty = 5;
  
  // Estimated payback period
  int32 payback_period_months = 6;
  
  // Priority level
  string priority = 7;
}

// Consumption alert
message ConsumptionAlert {
  // Alert type
  string type = 1;
  
  // Alert severity
  string severity = 2;
  
  // Alert message
  string message = 3;
  
  // Alert timestamp
  int64 timestamp = 4;
  
  // Alert threshold
  double threshold = 5;
  
  // Actual value that triggered alert
  double actual_value = 6;
  
  // Alert status
  string status = 7;
}
