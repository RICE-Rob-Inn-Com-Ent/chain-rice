syntax = "proto3";

package sports.teams.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "sports/teams/enums/teams_enums.proto";

option go_package = "github.com/rice-dev/sports/teams/v1";

// TeamCoach represents coaching staff information
message TeamCoach {
  string id = 1;                          // Coach ID
  string name = 2;                        // Coach name
  CoachRole role = 3;                     // Role in the team
  google.protobuf.StringValue nationality = 4; // Coach nationality
  google.protobuf.Timestamp start_date = 5; // When coach joined
  google.protobuf.Timestamp end_date = 6;   // When coach left (if applicable)
  google.protobuf.Int32Value contract_length_years = 7; // Contract length
  google.protobuf.StringValue previous_team = 8; // Previous team
  bool is_current = 9;                    // Whether this is current coach
  map<string, string> additional_info = 10; // Additional coach information
}

// TeamPlayer represents a player's association with a team
message TeamPlayer {
  string player_id = 1;                   // Player ID
  string jersey_number = 2;               // Jersey number
  google.protobuf.Timestamp joined_date = 3; // When player joined team
  google.protobuf.Timestamp left_date = 4;   // When player left team (if applicable)
  bool is_current = 5;                    // Whether player is currently on team
  google.protobuf.StringValue loan_status = 6; // Loan status if applicable
  google.protobuf.StringValue contract_type = 7; // Type of contract
}

// TeamStats represents comprehensive statistics for a team
message TeamStats {
  // Season stats
  int32 games_played = 1;                 // Total games played
  int32 wins = 2;                         // Total wins
  int32 draws = 3;                        // Total draws
  int32 losses = 4;                       // Total losses
  
  // Scoring stats
  int32 goals_for = 5;                    // Goals scored
  int32 goals_against = 6;                // Goals conceded
  int32 points = 7;                       // Total points (league table)
  google.protobuf.Int32Value goal_difference = 8; // Goal difference
  
  // Performance stats
  google.protobuf.DoubleValue win_percentage = 9; // Win percentage
  google.protobuf.DoubleValue average_goals_per_game = 10; // Average goals per game
  google.protobuf.Int32Value clean_sheets = 11; // Clean sheets
  google.protobuf.Int32Value yellow_cards = 12; // Yellow cards
  google.protobuf.Int32Value red_cards = 13; // Red cards
  
  // Additional sport-specific stats
  map<string, int32> additional_stats = 14; // Sport-specific statistics
}

// Team represents a sports team with all its properties
message Team {
  string id = 1;                          // Unique identifier for the team
  string name = 2;                        // Team name
  google.protobuf.StringValue nickname = 3; // Team nickname
  string city = 4;                        // City where team is based
  string country = 5;                     // Country where team is based
  google.protobuf.StringValue region = 6; // Region/state
  TeamStatus status = 7;                  // Current team status
  TeamType type = 8;                      // Type of team
  TeamCategory category = 9;              // Category/level of team
  OwnershipType ownership_type = 10;      // Type of ownership
  string founded_year = 11;               // Year team was founded
  string league_id = 12;                  // ID of the league team plays in
  google.protobuf.StringValue home_venue_id = 13; // ID of home venue
  StadiumOwnership stadium_ownership = 14; // Stadium ownership type
  google.protobuf.StringValue stadium_name = 15; // Stadium name
  google.protobuf.Int32Value stadium_capacity = 16; // Stadium capacity
  TeamFormation preferred_formation = 17; // Preferred formation
  repeated TeamCoach coaches = 18;        // Coaching staff
  repeated TeamPlayer players = 19;       // Current and former players
  TeamStats stats = 20;                   // Team statistics
  google.protobuf.StringValue website_url = 21; // Official website
  google.protobuf.StringValue logo_url = 22; // Logo image URL
  google.protobuf.StringValue colors = 23; // Team colors
  google.protobuf.StringValue motto = 24; // Team motto
  google.protobuf.StringValue description = 25; // Team description
  google.protobuf.Timestamp created_at = 26; // When the team was created
  google.protobuf.Timestamp updated_at = 27; // When the team was last updated
  map<string, string> metadata = 28;      // Additional metadata
}

// CreateTeamRequest represents the request to create a new team
message CreateTeamRequest {
  string name = 1;                        // Team name (required)
  google.protobuf.StringValue nickname = 2; // Optional nickname
  string city = 3;                        // City (required)
  string country = 4;                     // Country (required)
  google.protobuf.StringValue region = 5; // Optional region
  TeamType type = 6;                      // Team type (required)
  TeamCategory category = 7;              // Team category (required)
  OwnershipType ownership_type = 8;       // Ownership type (required)
  string founded_year = 9;                // Founded year (required)
  string league_id = 10;                  // League ID (required)
  google.protobuf.StringValue home_venue_id = 11; // Optional home venue ID
  StadiumOwnership stadium_ownership = 12; // Stadium ownership (required)
  google.protobuf.StringValue stadium_name = 13; // Optional stadium name
  google.protobuf.Int32Value stadium_capacity = 14; // Optional stadium capacity
  TeamFormation preferred_formation = 15; // Optional preferred formation
  google.protobuf.StringValue website_url = 16; // Optional website
  google.protobuf.StringValue logo_url = 17; // Optional logo URL
  google.protobuf.StringValue colors = 18; // Optional team colors
  google.protobuf.StringValue motto = 19; // Optional motto
  google.protobuf.StringValue description = 20; // Optional description
  map<string, string> metadata = 21;      // Optional metadata
}

// CreateTeamResponse represents the response after creating a team
message CreateTeamResponse {
  Team team = 1;                          // The created team
  bool success = 2;                       // Whether the operation was successful
  string message = 3;                     // Response message
  google.protobuf.Timestamp timestamp = 4; // Response timestamp
}

// GetTeamRequest represents the request to get a team by ID
message GetTeamRequest {
  string team_id = 1;                     // ID of the team to retrieve
}

// GetTeamResponse represents the response containing team data
message GetTeamResponse {
  Team team = 1;                          // The requested team
  bool success = 2;                       // Whether the operation was successful
  string message = 3;                     // Response message
  google.protobuf.Timestamp timestamp = 4; // Response timestamp
}

// ListTeamsRequest represents the request to list teams with filters
message ListTeamsRequest {
  google.protobuf.Int32Value page_size = 1;    // Number of teams per page
  google.protobuf.StringValue page_token = 2;  // Token for pagination
  google.protobuf.StringValue league_id = 3;   // Filter by league ID
  google.protobuf.StringValue city = 4;        // Filter by city
  google.protobuf.StringValue country = 5;     // Filter by country
  TeamType type = 6;                         // Filter by team type
  TeamCategory category = 7;                 // Filter by team category
  TeamStatus status = 8;                     // Filter by team status
  google.protobuf.Int32Value founded_year = 9; // Filter by founded year
  google.protobuf.StringValue search_query = 10; // Search query for name
}

// ListTeamsResponse represents the response containing a list of teams
message ListTeamsResponse {
  repeated Team teams = 1;                // List of teams
  string next_page_token = 2;             // Token for next page
  int32 total_count = 3;                  // Total number of teams matching filters
  bool success = 4;                       // Whether the operation was successful
  string message = 5;                     // Response message
  google.protobuf.Timestamp timestamp = 6; // Response timestamp
}

// UpdateTeamRequest represents the request to update a team
message UpdateTeamRequest {
  string team_id = 1;                     // ID of the team to update
  google.protobuf.StringValue name = 2;   // Optional new name
  google.protobuf.StringValue nickname = 3; // Optional new nickname
  google.protobuf.StringValue city = 4;   // Optional new city
  google.protobuf.StringValue country = 5; // Optional new country
  google.protobuf.StringValue region = 6; // Optional new region
  TeamStatus status = 7;                  // Optional new status
  TeamType type = 8;                      // Optional new type
  TeamCategory category = 9;              // Optional new category
  OwnershipType ownership_type = 10;      // Optional new ownership type
  google.protobuf.StringValue founded_year = 11; // Optional new founded year
  google.protobuf.StringValue league_id = 12; // Optional new league ID
  google.protobuf.StringValue home_venue_id = 13; // Optional new home venue
  StadiumOwnership stadium_ownership = 14; // Optional new stadium ownership
  google.protobuf.StringValue stadium_name = 15; // Optional new stadium name
  google.protobuf.Int32Value stadium_capacity = 16; // Optional new capacity
  TeamFormation preferred_formation = 17; // Optional new formation
  repeated TeamCoach coaches = 18;        // Optional new coaches
  repeated TeamPlayer players = 19;       // Optional new players
  TeamStats stats = 20;                   // Optional new stats
  google.protobuf.StringValue website_url = 21; // Optional new website
  google.protobuf.StringValue logo_url = 22; // Optional new logo
  google.protobuf.StringValue colors = 23; // Optional new colors
  google.protobuf.StringValue motto = 24; // Optional new motto
  google.protobuf.StringValue description = 25; // Optional new description
  map<string, string> metadata = 26;      // Optional new metadata
}

// UpdateTeamResponse represents the response after updating a team
message UpdateTeamResponse {
  Team team = 1;                          // The updated team
  bool success = 2;                       // Whether the operation was successful
  string message = 3;                     // Response message
  google.protobuf.Timestamp timestamp = 4; // Response timestamp
}

// DeleteTeamRequest represents the request to delete a team
message DeleteTeamRequest {
  string team_id = 1;                     // ID of the team to delete
}

// DeleteTeamResponse represents the response after deleting a team
message DeleteTeamResponse {
  bool success = 1;                       // Whether the operation was successful
  string message = 2;                     // Response message
  google.protobuf.Timestamp timestamp = 3; // Response timestamp
}
