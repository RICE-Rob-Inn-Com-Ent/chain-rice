syntax = "proto3";

package healthcare.medical_records.messages;

import "google/protobuf/timestamp.proto";
import "../enums/record_type.proto";
import "../enums/record_status.proto";
import "../enums/diagnosis_code.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/medical-records/messages";

// Diagnosis information
message Diagnosis {
  string diagnosis_id = 1;
  string code = 2;
  string description = 3;
  healthcare.medical_records.enums.DiagnosisCodeSystem code_system = 4;
  healthcare.medical_records.enums.DiagnosisSeverity severity = 5;
  healthcare.medical_records.enums.DiagnosisStatus status = 6;
  google.protobuf.Timestamp diagnosed_date = 7;
  string diagnosed_by = 8;
  string notes = 9;
}

// Vital signs
message VitalSigns {
  string vital_signs_id = 1;
  double temperature = 2; // Celsius
  int32 systolic_bp = 3; // mmHg
  int32 diastolic_bp = 4; // mmHg
  int32 heart_rate = 5; // bpm
  int32 respiratory_rate = 6; // breaths per minute
  double oxygen_saturation = 7; // percentage
  double weight = 8; // kg
  double height = 9; // cm
  double bmi = 10;
  google.protobuf.Timestamp recorded_at = 11;
  string recorded_by = 12;
}

// Treatment information
message Treatment {
  string treatment_id = 1;
  string name = 2;
  string description = 3;
  string dosage = 4;
  string frequency = 5;
  string duration = 6;
  string instructions = 7;
  google.protobuf.Timestamp start_date = 8;
  google.protobuf.Timestamp end_date = 9;
  string prescribed_by = 10;
  string notes = 11;
}

// Medical record model
message MedicalRecord {
  string record_id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string clinic_id = 4;
  string appointment_id = 5;
  healthcare.medical_records.enums.RecordType record_type = 6;
  healthcare.medical_records.enums.RecordStatus status = 7;
  string title = 8;
  string description = 9;
  string content = 10; // Main record content
  repeated Diagnosis diagnoses = 11;
  repeated Treatment treatments = 12;
  VitalSigns vital_signs = 13;
  string chief_complaint = 14;
  string history_of_present_illness = 15;
  string physical_examination = 16;
  string assessment_and_plan = 17;
  repeated string attachments = 18; // File IDs or URLs
  google.protobuf.Timestamp record_date = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  string created_by = 22;
  string updated_by = 23;
  string notes = 24;
}

// Medical record request for creating/updating
message MedicalRecordRequest {
  string patient_id = 1;
  string doctor_id = 2;
  string clinic_id = 3;
  string appointment_id = 4;
  healthcare.medical_records.enums.RecordType record_type = 5;
  string title = 6;
  string description = 7;
  string content = 8;
  repeated Diagnosis diagnoses = 9;
  repeated Treatment treatments = 10;
  VitalSigns vital_signs = 11;
  string chief_complaint = 12;
  string history_of_present_illness = 13;
  string physical_examination = 14;
  string assessment_and_plan = 15;
  repeated string attachments = 16;
  google.protobuf.Timestamp record_date = 17;
  string notes = 18;
}

// Medical record response
message MedicalRecordResponse {
  bool success = 1;
  string message = 2;
  MedicalRecord medical_record = 3;
}

// List medical records request
message ListMedicalRecordsRequest {
  string patient_id = 1;
  string doctor_id = 2;
  string clinic_id = 3;
  healthcare.medical_records.enums.RecordType record_type = 4;
  healthcare.medical_records.enums.RecordStatus status = 5;
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  int32 page_size = 8;
  string page_token = 9;
}

// List medical records response
message ListMedicalRecordsResponse {
  repeated MedicalRecord medical_records = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Medical record summary
message MedicalRecordSummary {
  string patient_id = 1;
  int32 total_records = 2;
  int32 active_records = 3;
  int32 archived_records = 4;
  google.protobuf.Timestamp last_record_date = 5;
  repeated RecordTypeCount record_type_counts = 6;
}

// Record type count
message RecordTypeCount {
  healthcare.medical_records.enums.RecordType record_type = 1;
  int32 count = 2;
}
