syntax = "proto3";

package transport.schedules.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "schedules/enums/schedule_status.proto";
import "schedules/enums/schedule_type.proto";

option go_package = "github.com/rice-dev/transport/schedules/v1";

// CreateScheduleRequest represents a request to create a new schedule
message CreateScheduleRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Vehicle ID (required)
  string vehicle_id = 2;
  
  // Schedule type (required)
  ScheduleType type = 3;
  
  // Scheduled departure time (required)
  google.protobuf.Timestamp departure_time = 4;
  
  // Scheduled arrival time (required)
  google.protobuf.Timestamp arrival_time = 5;
  
  // Schedule date (required)
  google.protobuf.Timestamp schedule_date = 6;
  
  // Driver ID
  string driver_id = 7;
  
  // Conductor ID (if applicable)
  string conductor_id = 8;
  
  // Maximum passenger capacity
  int32 max_capacity = 9;
  
  // Schedule notes or special instructions
  string notes = 10;
  
  // Recurring schedule pattern (daily, weekly, etc.)
  string recurrence_pattern = 11;
  
  // Schedule validity start date
  google.protobuf.Timestamp valid_from = 12;
  
  // Schedule validity end date
  google.protobuf.Timestamp valid_until = 13;
  
  // Schedule status (defaults to SCHEDULED)
  ScheduleStatus status = 14;
  
  // Additional schedule metadata
  map<string, string> metadata = 15;
}

// GetScheduleRequest represents a request to retrieve schedule information
message GetScheduleRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Fields to include in response (optional)
  google.protobuf.FieldMask field_mask = 2;
  
  // Include passenger list
  bool include_passengers = 3;
  
  // Include real-time updates
  bool include_realtime_updates = 4;
}

// ListSchedulesRequest represents a request to list schedules with filtering
message ListSchedulesRequest {
  // Page size for pagination
  int32 page_size = 1;
  
  // Page token for pagination
  string page_token = 2;
  
  // Filter by route ID
  string route_id = 3;
  
  // Filter by vehicle ID
  string vehicle_id = 4;
  
  // Filter by schedule type
  ScheduleType type = 5;
  
  // Filter by status
  ScheduleStatus status = 6;
  
  // Filter by schedule date range - start
  google.protobuf.Timestamp start_date = 7;
  
  // Filter by schedule date range - end
  google.protobuf.Timestamp end_date = 8;
  
  // Filter by departure time range - start
  google.protobuf.Timestamp departure_after = 9;
  
  // Filter by departure time range - end
  google.protobuf.Timestamp departure_before = 10;
  
  // Filter by driver ID
  string driver_id = 11;
  
  // Sort field (departure_time, arrival_time, schedule_date, status)
  string sort_by = 12;
  
  // Sort order (asc, desc)
  string sort_order = 13;
}

// UpdateScheduleRequest represents a request to update schedule information
message UpdateScheduleRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Updated schedule information
  ScheduleUpdateData schedule = 2;
  
  // Fields to update (required)
  google.protobuf.FieldMask update_mask = 3;
}

// ScheduleUpdateData contains updatable schedule fields
message ScheduleUpdateData {
  // Route ID
  string route_id = 1;
  
  // Vehicle ID
  string vehicle_id = 2;
  
  // Schedule type
  ScheduleType type = 3;
  
  // Scheduled departure time
  google.protobuf.Timestamp departure_time = 4;
  
  // Scheduled arrival time
  google.protobuf.Timestamp arrival_time = 5;
  
  // Schedule date
  google.protobuf.Timestamp schedule_date = 6;
  
  // Driver ID
  string driver_id = 7;
  
  // Conductor ID
  string conductor_id = 8;
  
  // Maximum passenger capacity
  int32 max_capacity = 9;
  
  // Schedule notes
  string notes = 10;
  
  // Recurrence pattern
  string recurrence_pattern = 11;
  
  // Validity start date
  google.protobuf.Timestamp valid_from = 12;
  
  // Validity end date
  google.protobuf.Timestamp valid_until = 13;
  
  // Schedule status
  ScheduleStatus status = 14;
  
  // Additional metadata
  map<string, string> metadata = 15;
}

// DeleteScheduleRequest represents a request to delete a schedule
message DeleteScheduleRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Reason for deletion
  string reason = 2;
  
  // Force deletion even if schedule has bookings
  bool force = 3;
  
  // Notify passengers of cancellation
  bool notify_passengers = 4;
  
  // Effective deletion date
  google.protobuf.Timestamp effective_date = 5;
}
