syntax = "proto3";

package transport.schedules.v1;

import "schedules/messages/schedule_request.proto";
import "schedules/messages/schedule_response.proto";

option go_package = "github.com/rice-dev/transport/schedules/v1";

// ScheduleService provides CRUD operations for schedule management
// This service handles schedule creation, modification, real-time updates,
// and operational status management
service ScheduleService {
  // Create adds a new schedule to the system
  // Validates schedule information and creates schedule configuration
  rpc Create(CreateScheduleRequest) returns (CreateScheduleResponse);
  
  // Get retrieves detailed information about a specific schedule
  // Returns complete schedule details including real-time status
  rpc Get(GetScheduleRequest) returns (GetScheduleResponse);
  
  // List retrieves a paginated list of schedules with optional filtering
  // Supports filtering by route, vehicle, date, status, and other criteria
  rpc List(ListSchedulesRequest) returns (ListSchedulesResponse);
  
  // Update modifies existing schedule information
  // Allows partial updates using field masks for efficient updates
  rpc Update(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  
  // Delete removes a schedule from the system
  // Validates that schedule has no active bookings before deletion
  rpc Delete(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  
  // UpdateStatus changes schedule operational status
  // Supports real-time status updates (on-time, delayed, cancelled, etc.)
  rpc UpdateStatus(UpdateScheduleStatusRequest) returns (UpdateScheduleStatusResponse);
  
  // StartSchedule begins a scheduled trip
  // Updates status to in-progress and records actual departure time
  rpc StartSchedule(StartScheduleRequest) returns (StartScheduleResponse);
  
  // CompleteSchedule ends a scheduled trip
  // Updates status to completed and records actual arrival time
  rpc CompleteSchedule(CompleteScheduleRequest) returns (CompleteScheduleResponse);
  
  // GetSchedulePassengers retrieves passenger list for a schedule
  // Returns all passengers booked for a specific schedule
  rpc GetSchedulePassengers(GetSchedulePassengersRequest) returns (GetSchedulePassengersResponse);
  
  // UpdatePassengerCount updates current passenger count
  // Tracks boarding and alighting for real-time capacity management
  rpc UpdatePassengerCount(UpdatePassengerCountRequest) returns (UpdatePassengerCountResponse);
  
  // GetScheduleStats retrieves schedule performance statistics
  // Returns on-time performance, capacity utilization, and other metrics
  rpc GetScheduleStats(GetScheduleStatsRequest) returns (GetScheduleStatsResponse);
}

// UpdateScheduleStatusRequest represents a request to update schedule status
message UpdateScheduleStatusRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // New status (required)
  ScheduleStatus status = 2;
  
  // Status update reason
  string reason = 3;
  
  // Additional status details
  string details = 4;
  
  // Estimated delay in minutes (if applicable)
  int32 estimated_delay_minutes = 5;
  
  // Status update timestamp
  google.protobuf.Timestamp status_timestamp = 6;
}

// UpdateScheduleStatusResponse represents the response after status update
message UpdateScheduleStatusResponse {
  // Schedule ID
  string schedule_id = 1;
  
  // Previous status
  ScheduleStatus previous_status = 2;
  
  // New status
  ScheduleStatus new_status = 3;
  
  // Update success status
  bool success = 4;
  
  // Response message
  string message = 5;
  
  // Status update timestamp
  google.protobuf.Timestamp updated_at = 6;
}

// StartScheduleRequest represents a request to start a schedule
message StartScheduleRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Actual departure time
  google.protobuf.Timestamp actual_departure_time = 2;
  
  // Driver confirmation
  bool driver_confirmed = 3;
  
  // Vehicle readiness check
  bool vehicle_ready = 4;
  
  // Start notes
  string notes = 5;
}

// StartScheduleResponse represents the response after starting a schedule
message StartScheduleResponse {
  // Schedule ID
  string schedule_id = 1;
  
  // Actual departure time
  google.protobuf.Timestamp actual_departure_time = 2;
  
  // Start success status
  bool success = 3;
  
  // Response message
  string message = 4;
  
  // Schedule start timestamp
  google.protobuf.Timestamp started_at = 5;
}

// CompleteScheduleRequest represents a request to complete a schedule
message CompleteScheduleRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Actual arrival time
  google.protobuf.Timestamp actual_arrival_time = 2;
  
  // Final passenger count
  int32 final_passenger_count = 3;
  
  // Completion notes
  string notes = 4;
  
  // Any issues encountered
  string issues = 5;
}

// CompleteScheduleResponse represents the response after completing a schedule
message CompleteScheduleResponse {
  // Schedule ID
  string schedule_id = 1;
  
  // Actual arrival time
  google.protobuf.Timestamp actual_arrival_time = 2;
  
  // Completion success status
  bool success = 3;
  
  // Response message
  string message = 4;
  
  // Schedule completion timestamp
  google.protobuf.Timestamp completed_at = 5;
  
  // Total trip duration in minutes
  int32 trip_duration_minutes = 6;
}

// GetSchedulePassengersRequest represents a request for schedule passenger list
message GetSchedulePassengersRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Include passenger details
  bool include_passenger_details = 2;
  
  // Include ticket information
  bool include_ticket_info = 3;
  
  // Filter by passenger status
  string passenger_status = 4;
}

// GetSchedulePassengersResponse represents the response with passenger list
message GetSchedulePassengersResponse {
  // Schedule ID
  string schedule_id = 1;
  
  // List of passengers
  repeated SchedulePassenger passengers = 2;
  
  // Total passenger count
  int32 total_passengers = 3;
  
  // Operation success status
  bool success = 4;
  
  // Response message
  string message = 5;
}

// SchedulePassenger represents a passenger on a specific schedule
message SchedulePassenger {
  // Passenger ID
  string passenger_id = 1;
  
  // Passenger name
  string passenger_name = 2;
  
  // Ticket ID
  string ticket_id = 3;
  
  // Boarding stop
  string boarding_stop = 4;
  
  // Alighting stop
  string alighting_stop = 5;
  
  // Passenger type
  string passenger_type = 6;
  
  // Seat number (if assigned)
  string seat_number = 7;
  
  // Boarding status
  string boarding_status = 8;
  
  // Boarding time
  google.protobuf.Timestamp boarding_time = 9;
}

// UpdatePassengerCountRequest represents a request to update passenger count
message UpdatePassengerCountRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Current passenger count
  int32 current_passenger_count = 2;
  
  // Passengers boarded
  int32 passengers_boarded = 3;
  
  // Passengers alighted
  int32 passengers_alighted = 4;
  
  // Update timestamp
  google.protobuf.Timestamp update_timestamp = 5;
  
  // Update notes
  string notes = 6;
}

// UpdatePassengerCountResponse represents the response after count update
message UpdatePassengerCountResponse {
  // Schedule ID
  string schedule_id = 1;
  
  // Updated passenger count
  int32 current_passenger_count = 2;
  
  // Available seats
  int32 available_seats = 3;
  
  // Update success status
  bool success = 4;
  
  // Response message
  string message = 5;
  
  // Update timestamp
  google.protobuf.Timestamp updated_at = 6;
}

// GetScheduleStatsRequest represents a request for schedule statistics
message GetScheduleStatsRequest {
  // Schedule ID (required)
  string schedule_id = 1;
  
  // Statistics period start date
  google.protobuf.Timestamp start_date = 2;
  
  // Statistics period end date
  google.protobuf.Timestamp end_date = 3;
  
  // Include detailed metrics
  bool include_detailed_metrics = 4;
  
  // Include passenger analytics
  bool include_passenger_analytics = 5;
}

// GetScheduleStatsResponse represents the response with schedule statistics
message GetScheduleStatsResponse {
  // Schedule ID
  string schedule_id = 1;
  
  // Total trips completed
  int32 total_trips = 2;
  
  // On-time performance percentage
  double on_time_performance = 3;
  
  // Average delay in minutes
  double average_delay_minutes = 4;
  
  // Average passenger count
  double average_passenger_count = 5;
  
  // Average capacity utilization
  double average_capacity_utilization = 6;
  
  // Total passengers served
  int32 total_passengers_served = 7;
  
  // Cancellation rate
  double cancellation_rate = 8;
  
  // Peak usage hours
  repeated string peak_usage_hours = 9;
  
  // Operation success status
  bool success = 10;
  
  // Response message
  string message = 11;
}
