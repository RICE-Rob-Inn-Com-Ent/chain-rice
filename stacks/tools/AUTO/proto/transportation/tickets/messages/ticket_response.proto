syntax = "proto3";

package transport.tickets.v1;

import "google/protobuf/timestamp.proto";
import "tickets/enums/ticket_type.proto";
import "tickets/enums/ticket_status.proto";

option go_package = "github.com/rice-dev/transport/tickets/v1";

// Ticket represents a transport ticket in the system
message Ticket {
  // Unique ticket identifier
  string ticket_id = 1;
  
  // Passenger ID
  string passenger_id = 2;
  
  // Route ID
  string route_id = 3;
  
  // Schedule ID
  string schedule_id = 4;
  
  // Ticket type
  TicketType type = 5;
  
  // Ticket price
  double price = 6;
  
  // Number of passengers
  int32 passenger_count = 7;
  
  // Seat preferences
  repeated string seat_preferences = 8;
  
  // Special requirements
  repeated string special_requirements = 9;
  
  // Payment method
  string payment_method = 10;
  
  // Promotional code used
  string promotional_code = 11;
  
  // Discount amount applied
  double discount_amount = 12;
  
  // Final price after discounts
  double final_price = 13;
  
  // Ticket validity start date
  google.protobuf.Timestamp valid_from = 14;
  
  // Ticket validity end date
  google.protobuf.Timestamp valid_until = 15;
  
  // Booking reference
  string booking_reference = 16;
  
  // Current ticket status
  TicketStatus status = 17;
  
  // Additional ticket metadata
  map<string, string> metadata = 18;
  
  // Ticket creation timestamp
  google.protobuf.Timestamp created_at = 19;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 20;
  
  // Ticket usage timestamp
  google.protobuf.Timestamp used_at = 21;
  
  // Ticket cancellation timestamp
  google.protobuf.Timestamp cancelled_at = 22;
  
  // Ticket expiry timestamp
  google.protobuf.Timestamp expired_at = 23;
  
  // Payment confirmation timestamp
  google.protobuf.Timestamp payment_confirmed_at = 24;
  
  // QR code for ticket validation
  string qr_code = 25;
  
  // Barcode for ticket validation
  string barcode = 26;
  
  // Digital ticket URL
  string digital_ticket_url = 27;
}

// CreateTicketResponse represents the response after creating a new ticket
message CreateTicketResponse {
  // Created ticket information
  Ticket ticket = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
  
  // Payment confirmation required
  bool payment_confirmation_required = 4;
  
  // Payment URL (if applicable)
  string payment_url = 5;
}

// GetTicketResponse represents the response for retrieving a ticket
message GetTicketResponse {
  // Requested ticket information
  Ticket ticket = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// ListTicketsResponse represents the response for listing tickets
message ListTicketsResponse {
  // List of tickets
  repeated Ticket tickets = 1;
  
  // Next page token for pagination
  string next_page_token = 2;
  
  // Total count of tickets matching the filter
  int32 total_count = 3;
  
  // Operation success status
  bool success = 4;
  
  // Response message
  string message = 5;
}

// UpdateTicketResponse represents the response after updating a ticket
message UpdateTicketResponse {
  // Updated ticket information
  Ticket ticket = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// DeleteTicketResponse represents the response after deleting a ticket
message DeleteTicketResponse {
  // Deleted ticket ID
  string ticket_id = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
  
  // Deletion timestamp
  google.protobuf.Timestamp deleted_at = 4;
  
  // Refund processed
  bool refund_processed = 5;
  
  // Refund amount
  double refund_amount = 6;
}
