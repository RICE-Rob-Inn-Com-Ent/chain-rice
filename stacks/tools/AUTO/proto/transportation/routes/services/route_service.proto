syntax = "proto3";

package transport.routes.v1;

import "routes/messages/route_request.proto";
import "routes/messages/route_response.proto";

option go_package = "github.com/rice-dev/transport/routes/v1";

// RouteService provides CRUD operations for route management
// This service handles route creation, modification, scheduling,
// and operational status management
service RouteService {
  // Create adds a new route to the system
  // Validates route information and creates route configuration
  rpc Create(CreateRouteRequest) returns (CreateRouteResponse);
  
  // Get retrieves detailed information about a specific route
  // Returns complete route details including stops and fare information
  rpc Get(GetRouteRequest) returns (GetRouteResponse);
  
  // List retrieves a paginated list of routes with optional filtering
  // Supports filtering by type, status, location, and other criteria
  rpc List(ListRoutesRequest) returns (ListRoutesResponse);
  
  // Update modifies existing route information
  // Allows partial updates using field masks for efficient updates
  rpc Update(UpdateRouteRequest) returns (UpdateRouteResponse);
  
  // Delete removes a route from the system
  // Validates that route has no active schedules before deletion
  rpc Delete(DeleteRouteRequest) returns (DeleteRouteResponse);
  
  // ActivateRoute changes route status to active
  // Enables route for scheduling and passenger booking
  rpc ActivateRoute(ActivateRouteRequest) returns (ActivateRouteResponse);
  
  // DeactivateRoute changes route status to inactive
  // Disables route for new bookings while preserving existing schedules
  rpc DeactivateRoute(DeactivateRouteRequest) returns (DeactivateRouteResponse);
  
  // GetRouteStats retrieves route performance statistics
  // Returns ridership data, performance metrics, and analytics
  rpc GetRouteStats(GetRouteStatsRequest) returns (GetRouteStatsResponse);
  
  // UpdateFares updates route fare information
  // Manages fare matrix and pricing for different passenger types
  rpc UpdateFares(UpdateFaresRequest) returns (UpdateFaresResponse);
  
  // GetRouteSchedule retrieves schedule information for a route
  // Returns upcoming and historical schedule data
  rpc GetRouteSchedule(GetRouteScheduleRequest) returns (GetRouteScheduleResponse);
}

// ActivateRouteRequest represents a request to activate a route
message ActivateRouteRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Activation date
  google.protobuf.Timestamp activation_date = 2;
  
  // Activation reason
  string reason = 3;
  
  // Notify passengers of activation
  bool notify_passengers = 4;
}

// ActivateRouteResponse represents the response after route activation
message ActivateRouteResponse {
  // Route ID
  string route_id = 1;
  
  // Activation success status
  bool success = 2;
  
  // Response message
  string message = 3;
  
  // Activation timestamp
  google.protobuf.Timestamp activated_at = 4;
}

// DeactivateRouteRequest represents a request to deactivate a route
message DeactivateRouteRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Deactivation date
  google.protobuf.Timestamp deactivation_date = 2;
  
  // Deactivation reason
  string reason = 3;
  
  // Notify passengers of deactivation
  bool notify_passengers = 4;
  
  // Cancel existing bookings
  bool cancel_existing_bookings = 5;
}

// DeactivateRouteResponse represents the response after route deactivation
message DeactivateRouteResponse {
  // Route ID
  string route_id = 1;
  
  // Deactivation success status
  bool success = 2;
  
  // Response message
  string message = 3;
  
  // Deactivation timestamp
  google.protobuf.Timestamp deactivated_at = 4;
  
  // Number of cancelled bookings
  int32 cancelled_bookings = 5;
}

// GetRouteStatsRequest represents a request for route statistics
message GetRouteStatsRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Statistics period start date
  google.protobuf.Timestamp start_date = 2;
  
  // Statistics period end date
  google.protobuf.Timestamp end_date = 3;
  
  // Include detailed metrics
  bool include_detailed_metrics = 4;
  
  // Include passenger demographics
  bool include_demographics = 5;
}

// GetRouteStatsResponse represents the response with route statistics
message GetRouteStatsResponse {
  // Route ID
  string route_id = 1;
  
  // Total passengers served
  int32 total_passengers = 2;
  
  // Total revenue generated
  double total_revenue = 3;
  
  // Average daily ridership
  double average_daily_ridership = 4;
  
  // Peak hour ridership
  int32 peak_hour_ridership = 5;
  
  // Average occupancy rate
  double average_occupancy_rate = 6;
  
  // On-time performance percentage
  double on_time_performance = 7;
  
  // Route efficiency score
  double efficiency_score = 8;
  
  // Popular stops
  repeated StopPopularity popular_stops = 9;
  
  // Passenger demographics (if requested)
  PassengerDemographics demographics = 10;
  
  // Operation success status
  bool success = 11;
  
  // Response message
  string message = 12;
}

// StopPopularity represents stop usage statistics
message StopPopularity {
  // Stop location
  Location location = 1;
  
  // Number of passengers boarding
  int32 boarding_count = 2;
  
  // Number of passengers alighting
  int32 alighting_count = 3;
  
  // Peak usage hours
  repeated string peak_hours = 4;
}

// PassengerDemographics represents passenger demographic data
message PassengerDemographics {
  // Age group distribution
  map<string, int32> age_groups = 1;
  
  // Gender distribution
  map<string, int32> gender_distribution = 2;
  
  // Passenger type distribution
  map<string, int32> passenger_types = 3;
  
  // Peak travel times
  repeated string peak_travel_times = 4;
}

// UpdateFaresRequest represents a request to update route fares
message UpdateFaresRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Updated fare matrix
  map<string, double> fare_matrix = 2;
  
  // Effective date for new fares
  google.protobuf.Timestamp effective_date = 3;
  
  // Fare update reason
  string reason = 4;
  
  // Notify passengers of fare changes
  bool notify_passengers = 5;
}

// UpdateFaresResponse represents the response after fare update
message UpdateFaresResponse {
  // Route ID
  string route_id = 1;
  
  // Updated fare matrix
  map<string, double> fare_matrix = 2;
  
  // Update success status
  bool success = 3;
  
  // Response message
  string message = 4;
  
  // Effective date
  google.protobuf.Timestamp effective_date = 5;
}

// GetRouteScheduleRequest represents a request for route schedule information
message GetRouteScheduleRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Schedule date range start
  google.protobuf.Timestamp start_date = 2;
  
  // Schedule date range end
  google.protobuf.Timestamp end_date = 3;
  
  // Include past schedules
  bool include_past_schedules = 4;
  
  // Include cancelled schedules
  bool include_cancelled_schedules = 5;
}

// GetRouteScheduleResponse represents the response with schedule information
message GetRouteScheduleResponse {
  // Route ID
  string route_id = 1;
  
  // List of schedules
  repeated ScheduleInfo schedules = 2;
  
  // Total schedule count
  int32 total_count = 3;
  
  // Operation success status
  bool success = 4;
  
  // Response message
  string message = 5;
}

// ScheduleInfo represents basic schedule information
message ScheduleInfo {
  // Schedule ID
  string schedule_id = 1;
  
  // Schedule date
  google.protobuf.Timestamp schedule_date = 2;
  
  // Departure time
  google.protobuf.Timestamp departure_time = 3;
  
  // Arrival time
  google.protobuf.Timestamp arrival_time = 4;
  
  // Schedule status
  string status = 5;
  
  // Vehicle ID
  string vehicle_id = 6;
  
  // Available seats
  int32 available_seats = 7;
}
