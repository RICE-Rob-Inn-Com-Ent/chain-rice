syntax = "proto3";

package transport.routes.v1;

option go_package = "github.com/rice-dev/transport/routes/v1";

// RouteType enum defines the different categories of transport routes
enum RouteType {
  // Default value - should not be used
  ROUTE_TYPE_UNSPECIFIED = 0;
  
  // Urban routes within city limits
  URBAN = 1;
  
  // Intercity routes between cities
  INTERCITY = 2;
  
  // Freight routes for cargo transport
  FREIGHT = 3;
  
  // Express routes with limited stops
  EXPRESS = 4;
  
  // Local routes with frequent stops
  LOCAL = 5;
  
  // Airport shuttle routes
  AIRPORT_SHUTTLE = 6;
  
  // Tourist routes for sightseeing
  TOURIST = 7;
  
  // School routes for student transport
  SCHOOL = 8;
  
  // Hospital routes for medical transport
  HOSPITAL = 9;
  
  // Night routes operating during late hours
  NIGHT = 10;
}
