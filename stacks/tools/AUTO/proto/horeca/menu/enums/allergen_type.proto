syntax = "proto3";

package horeca.menu.enums;

// Types of allergens
enum AllergenType {
  ALLERGEN_TYPE_UNSPECIFIED = 0;
  ALLERGEN_TYPE_GLUTEN = 1;               // Gluten-containing ingredients
  ALLERGEN_TYPE_DAIRY = 2;                 // Dairy products
  ALLERGEN_TYPE_NUTS = 3;                  // Tree nuts
  ALLERGEN_TYPE_PEANUTS = 4;               // Peanuts
  ALLERGEN_TYPE_SOY = 5;                   // Soy products
  ALLERGEN_TYPE_EGGS = 6;                  // Eggs
  ALLERGEN_TYPE_FISH = 7;                  // Fish
  ALLERGEN_TYPE_SHELLFISH = 8;             // Shellfish
  ALLERGEN_TYPE_SESAME = 9;                // Sesame seeds
  ALLERGEN_TYPE_MUSTARD = 10;              // Mustard
  ALLERGEN_TYPE_CELERY = 11;               // Celery
  ALLERGEN_TYPE_LUPIN = 12;                // Lupin
  ALLERGEN_TYPE_MOLLUSCS = 13;             // Molluscs
}
