syntax = "proto3";

package horeca.menu.services;

import "google/protobuf/empty.proto";
import "../messages/menu_item_models.proto";

// Menu Item Service - CRUD operations for menu items
service MenuItemService {
  // Create a new menu item
  rpc CreateMenuItem(CreateMenuItemRequest) returns (CreateMenuItemResponse);
  
  // Get menu item by ID
  rpc GetMenuItem(GetMenuItemRequest) returns (GetMenuItemResponse);
  
  // Update existing menu item
  rpc UpdateMenuItem(UpdateMenuItemRequest) returns (UpdateMenuItemResponse);
  
  // Delete menu item
  rpc DeleteMenuItem(DeleteMenuItemRequest) returns (google.protobuf.Empty);
  
  // List menu items with filtering
  rpc ListMenuItems(ListMenuItemsRequest) returns (ListMenuItemsResponse);
  
  // Search menu items
  rpc SearchMenuItems(SearchMenuItemsRequest) returns (SearchMenuItemsResponse);
  
  // Get menu items by category
  rpc GetMenuItemsByCategory(GetMenuItemsByCategoryRequest) returns (GetMenuItemsByCategoryResponse);
  
  // Get menu items by status
  rpc GetMenuItemsByStatus(GetMenuItemsByStatusRequest) returns (GetMenuItemsByStatusResponse);
  
  // Update menu item status
  rpc UpdateMenuItemStatus(UpdateMenuItemStatusRequest) returns (UpdateMenuItemStatusResponse);
  
  // Get menu item variants
  rpc GetMenuItemVariants(GetMenuItemVariantsRequest) returns (GetMenuItemVariantsResponse);
  
  // Create menu item variant
  rpc CreateMenuItemVariant(CreateMenuItemVariantRequest) returns (CreateMenuItemVariantResponse);
  
  // Get menu item reviews
  rpc GetMenuItemReviews(GetMenuItemReviewsRequest) returns (GetMenuItemReviewsResponse);
  
  // Add menu item review
  rpc AddMenuItemReview(AddMenuItemReviewRequest) returns (AddMenuItemReviewResponse);
}

// Request/Response messages
message CreateMenuItemRequest {
  MenuItem item = 1;
}

message CreateMenuItemResponse {
  MenuItem item = 1;
  string message = 2;
}

message GetMenuItemRequest {
  string item_id = 1;
}

message GetMenuItemResponse {
  MenuItem item = 1;
}

message UpdateMenuItemRequest {
  MenuItem item = 1;
}

message UpdateMenuItemResponse {
  MenuItem item = 1;
  string message = 2;
}

message DeleteMenuItemRequest {
  string item_id = 1;
}

message ListMenuItemsRequest {
  string category = 1;
  string status = 2;
  bool featured_only = 3;
  bool popular_only = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListMenuItemsResponse {
  repeated MenuItem items = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchMenuItemsRequest {
  string query = 1;
  string category = 2;
  repeated string allergens = 3;
  repeated string dietary_tags = 4;
  double max_price = 5;
  int32 max_prep_time = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message SearchMenuItemsResponse {
  repeated MenuItem items = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetMenuItemsByCategoryRequest {
  string category = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetMenuItemsByCategoryResponse {
  repeated MenuItem items = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetMenuItemsByStatusRequest {
  string status = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetMenuItemsByStatusResponse {
  repeated MenuItem items = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateMenuItemStatusRequest {
  string item_id = 1;
  string new_status = 2;
  string reason = 3;
}

message UpdateMenuItemStatusResponse {
  MenuItem item = 1;
  string message = 2;
}

message GetMenuItemVariantsRequest {
  string item_id = 1;
}

message GetMenuItemVariantsResponse {
  repeated MenuItemVariant variants = 1;
}

message CreateMenuItemVariantRequest {
  string item_id = 1;
  MenuItemVariant variant = 2;
}

message CreateMenuItemVariantResponse {
  MenuItemVariant variant = 1;
  string message = 2;
}

message GetMenuItemReviewsRequest {
  string item_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetMenuItemReviewsResponse {
  repeated MenuItemReview reviews = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message AddMenuItemReviewRequest {
  string item_id = 1;
  MenuItemReview review = 2;
}

message AddMenuItemReviewResponse {
  MenuItemReview review = 1;
  string message = 2;
}
