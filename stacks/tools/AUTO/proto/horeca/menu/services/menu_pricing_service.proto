syntax = "proto3";

package horeca.menu.services;

import "google/protobuf/empty.proto";
import "../messages/menu_pricing_models.proto";

// Menu Pricing Service - Pricing rules and dynamic pricing
service MenuPricingService {
  // Create pricing rule
  rpc CreatePricingRule(CreatePricingRuleRequest) returns (CreatePricingRuleResponse);
  
  // Get pricing rule by ID
  rpc GetPricingRule(GetPricingRuleRequest) returns (GetPricingRuleResponse);
  
  // Update pricing rule
  rpc UpdatePricingRule(UpdatePricingRuleRequest) returns (UpdatePricingRuleResponse);
  
  // Delete pricing rule
  rpc DeletePricingRule(DeletePricingRuleRequest) returns (google.protobuf.Empty);
  
  // List pricing rules
  rpc ListPricingRules(ListPricingRulesRequest) returns (ListPricingRulesResponse);
  
  // Calculate item price
  rpc CalculateItemPrice(CalculateItemPriceRequest) returns (CalculateItemPriceResponse);
  
  // Apply pricing rules
  rpc ApplyPricingRules(ApplyPricingRulesRequest) returns (ApplyPricingRulesResponse);
  
  // Get pricing history
  rpc GetPricingHistory(GetPricingHistoryRequest) returns (GetPricingHistoryResponse);
  
  // Update item price
  rpc UpdateItemPrice(UpdateItemPriceRequest) returns (UpdateItemPriceResponse);
  
  // Get dynamic pricing factors
  rpc GetDynamicPricingFactors(GetDynamicPricingFactorsRequest) returns (GetDynamicPricingFactorsResponse);
  
  // Update dynamic pricing factor
  rpc UpdateDynamicPricingFactor(UpdateDynamicPricingFactorRequest) returns (UpdateDynamicPricingFactorResponse);
  
  // Calculate dynamic price
  rpc CalculateDynamicPrice(CalculateDynamicPriceRequest) returns (CalculateDynamicPriceResponse);
}

// Request/Response messages
message CreatePricingRuleRequest {
  MenuPricingRule rule = 1;
}

message CreatePricingRuleResponse {
  MenuPricingRule rule = 1;
  string message = 2;
}

message GetPricingRuleRequest {
  string rule_id = 1;
}

message GetPricingRuleResponse {
  MenuPricingRule rule = 1;
}

message UpdatePricingRuleRequest {
  MenuPricingRule rule = 1;
}

message UpdatePricingRuleResponse {
  MenuPricingRule rule = 1;
  string message = 2;
}

message DeletePricingRuleRequest {
  string rule_id = 1;
}

message ListPricingRulesRequest {
  string scope = 1;
  string type = 2;
  bool active_only = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListPricingRulesResponse {
  repeated MenuPricingRule rules = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CalculateItemPriceRequest {
  string item_id = 1;
  string customer_id = 2;
  string date = 3;
  string time = 4;
}

message CalculateItemPriceResponse {
  double base_price = 1;
  double final_price = 2;
  double discount_amount = 3;
  double markup_amount = 4;
  repeated string applied_rules = 5;
}

message ApplyPricingRulesRequest {
  string item_id = 1;
  string customer_id = 2;
  string date = 3;
  string time = 4;
}

message ApplyPricingRulesResponse {
  double original_price = 1;
  double final_price = 2;
  repeated string applied_rules = 3;
  string message = 4;
}

message GetPricingHistoryRequest {
  string item_id = 1;
  string date_from = 2;
  string date_to = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message GetPricingHistoryResponse {
  repeated MenuPricingHistory history = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateItemPriceRequest {
  string item_id = 1;
  double new_price = 2;
  string reason = 3;
}

message UpdateItemPriceResponse {
  string message = 1;
}

message GetDynamicPricingFactorsRequest {
  string item_id = 1;
}

message GetDynamicPricingFactorsResponse {
  repeated DynamicPricingFactor factors = 1;
}

message UpdateDynamicPricingFactorRequest {
  DynamicPricingFactor factor = 1;
}

message UpdateDynamicPricingFactorResponse {
  DynamicPricingFactor factor = 1;
  string message = 2;
}

message CalculateDynamicPriceRequest {
  string item_id = 1;
  string date = 2;
  string time = 3;
  map<string, double> factor_values = 4;
}

message CalculateDynamicPriceResponse {
  double base_price = 1;
  double dynamic_price = 2;
  double adjustment_amount = 3;
  double adjustment_percentage = 4;
  repeated string applied_factors = 5;
}
