syntax = "proto3";

package horeca.menu.messages;

import "google/protobuf/timestamp.proto";
import "../enums/menu_category.proto";

// Menu category information
message MenuCategory {
  string category_id = 1;
  string category_name = 2;
  string description = 3;
  string short_description = 4;
  
  MenuCategoryType type = 5;
  string parent_category_id = 6;
  
  int32 display_order = 7;
  bool is_active = 8;
  bool is_featured = 9;
  
  string image_url = 10;
  string icon_url = 11;
  
  repeated MenuCategory subcategories = 12;
  int32 item_count = 13;
  
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// Menu category hierarchy
message MenuCategoryHierarchy {
  string hierarchy_id = 1;
  string root_category_id = 2;
  repeated MenuCategoryNode nodes = 3;
  int32 max_depth = 4;
  google.protobuf.Timestamp last_updated = 5;
}

// Menu category node
message MenuCategoryNode {
  string category_id = 1;
  string category_name = 2;
  int32 level = 3;
  string parent_id = 4;
  repeated string children_ids = 5;
  int32 item_count = 6;
  bool is_leaf = 7;
}

// Menu category statistics
message MenuCategoryStatistics {
  string category_id = 1;
  string category_name = 2;
  
  int32 total_items = 3;
  int32 active_items = 4;
  int32 featured_items = 5;
  
  double average_price = 6;
  double average_rating = 7;
  int32 total_reviews = 8;
  
  int32 popularity_score = 9;
  double revenue_share = 10;
  
  google.protobuf.Timestamp last_updated = 11;
}
