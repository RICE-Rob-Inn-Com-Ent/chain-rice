syntax = "proto3";

package horeca.pos.enums;

// Payment methods accepted
enum PosPaymentMethod {
  POS_PAYMENT_METHOD_UNSPECIFIED = 0;
  POS_PAYMENT_METHOD_CASH = 1;            // Cash payment
  POS_PAYMENT_METHOD_CARD = 2;            // Credit/debit card
  POS_PAYMENT_METHOD_ONLINE = 3;          // Online payment
  POS_PAYMENT_METHOD_VOUCHER = 4;         // Gift voucher
  POS_PAYMENT_METHOD_COUPON = 5;          // Discount coupon
  POS_PAYMENT_METHOD_LOYALTY_POINTS = 6;  // Loyalty points redemption
  POS_PAYMENT_METHOD_MOBILE = 7;          // Mobile payment (Apple Pay, Google Pay)
  POS_PAYMENT_METHOD_CONTACTLESS = 8;     // Contactless payment
  POS_PAYMENT_METHOD_SPLIT = 9;           // Split payment
}
