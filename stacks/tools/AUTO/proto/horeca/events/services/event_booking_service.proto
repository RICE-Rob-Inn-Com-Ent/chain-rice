syntax = "proto3";

package horeca.events.services;

import "google/protobuf/empty.proto";
import "../messages/event_booking_models.proto";

// Event Booking Service - Booking and payment management
service EventBookingService {
  // Create a new booking
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);
  
  // Get booking by ID
  rpc GetBooking(GetBookingRequest) returns (GetBookingResponse);
  
  // Update existing booking
  rpc UpdateBooking(UpdateBookingRequest) returns (UpdateBookingResponse);
  
  // Cancel booking
  rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse);
  
  // List bookings with filtering
  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse);
  
  // Process payment
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  
  // Get payment history
  rpc GetPaymentHistory(GetPaymentHistoryRequest) returns (GetPaymentHistoryResponse);
  
  // Refund payment
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);
  
  // Get booking modifications
  rpc GetBookingModifications(GetBookingModificationsRequest) returns (GetBookingModificationsResponse);
  
  // Modify booking
  rpc ModifyBooking(ModifyBookingRequest) returns (ModifyBookingResponse);
  
  // Confirm booking
  rpc ConfirmBooking(ConfirmBookingRequest) returns (ConfirmBookingResponse);
}

// Request/Response messages
message CreateBookingRequest {
  EventBooking booking = 1;
}

message CreateBookingResponse {
  EventBooking booking = 1;
  string message = 2;
}

message GetBookingRequest {
  string booking_id = 1;
}

message GetBookingResponse {
  EventBooking booking = 1;
}

message UpdateBookingRequest {
  EventBooking booking = 1;
}

message UpdateBookingResponse {
  EventBooking booking = 1;
  string message = 2;
}

message CancelBookingRequest {
  string booking_id = 1;
  string reason = 2;
}

message CancelBookingResponse {
  EventBooking booking = 1;
  string message = 2;
}

message ListBookingsRequest {
  string customer_id = 1;
  string event_id = 2;
  string status = 3;
  string date_from = 4;
  string date_to = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListBookingsResponse {
  repeated EventBooking bookings = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ProcessPaymentRequest {
  string booking_id = 1;
  Payment payment = 2;
}

message ProcessPaymentResponse {
  Payment payment = 1;
  string message = 2;
}

message GetPaymentHistoryRequest {
  string booking_id = 1;
}

message GetPaymentHistoryResponse {
  repeated Payment payments = 1;
}

message RefundPaymentRequest {
  string booking_id = 1;
  string payment_id = 2;
  string reason = 3;
  double amount = 4;
}

message RefundPaymentResponse {
  Payment refund = 1;
  string message = 2;
}

message GetBookingModificationsRequest {
  string booking_id = 1;
}

message GetBookingModificationsResponse {
  repeated BookingModification modifications = 1;
}

message ModifyBookingRequest {
  string booking_id = 1;
  BookingModification modification = 2;
}

message ModifyBookingResponse {
  EventBooking booking = 1;
  string message = 2;
}

message ConfirmBookingRequest {
  string booking_id = 1;
  string confirmation_notes = 2;
}

message ConfirmBookingResponse {
  EventBooking booking = 1;
  string message = 2;
}
