syntax = "proto3";

package horeca.events.enums;

// Status of events
enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_PLANNED = 1;               // Event planned and booked
  EVENT_STATUS_CONFIRMED = 2;             // Event confirmed with deposit
  EVENT_STATUS_PREPARING = 3;             // Event preparation in progress
  EVENT_STATUS_SETUP = 4;                 // Event setup in progress
  EVENT_STATUS_ONGOING = 5;               // Event currently taking place
  EVENT_STATUS_COMPLETED = 6;             // Event completed successfully
  EVENT_STATUS_CANCELED = 7;              // Event canceled
  EVENT_STATUS_POSTPONED = 8;             // Event postponed to later date
  EVENT_STATUS_REFUNDED = 9;              // Event refunded
}
