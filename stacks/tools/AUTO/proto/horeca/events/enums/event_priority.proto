syntax = "proto3";

package horeca.events.enums;

// Priority levels for events
enum EventPriority {
  EVENT_PRIORITY_UNSPECIFIED = 0;
  EVENT_PRIORITY_NORMAL = 1;              // Standard priority
  EVENT_PRIORITY_VIP = 2;                 // VIP priority - premium service
  EVENT_PRIORITY_CORPORATE = 3;           // Corporate client priority
  EVENT_PRIORITY_HIGH_PROFILE = 4;        // High profile event - special attention
  EVENT_PRIORITY_URGENT = 5;              // Urgent - short notice event
}
