syntax = "proto3";

package horeca.events.messages;

import "google/protobuf/timestamp.proto";

// Event feedback from guests
message EventFeedback {
  string feedback_id = 1;
  string event_id = 2;
  string guest_id = 3;
  string guest_name = 4;
  string guest_email = 5;
  
  FeedbackRating overall_rating = 6;
  FeedbackRating food_rating = 7;
  FeedbackRating service_rating = 8;
  FeedbackRating venue_rating = 9;
  FeedbackRating value_rating = 10;
  
  string comments = 11;
  repeated string positive_aspects = 12;
  repeated string areas_for_improvement = 13;
  
  bool would_recommend = 14;
  bool would_book_again = 15;
  
  google.protobuf.Timestamp feedback_date = 16;
  google.protobuf.Timestamp created_at = 17;
}

// Feedback rating scale
enum FeedbackRating {
  FEEDBACK_RATING_UNSPECIFIED = 0;
  FEEDBACK_RATING_VERY_POOR = 1;
  FEEDBACK_RATING_POOR = 2;
  FEEDBACK_RATING_FAIR = 3;
  FEEDBACK_RATING_GOOD = 4;
  FEEDBACK_RATING_EXCELLENT = 5;
}

// Event review summary
message EventReviewSummary {
  string event_id = 1;
  double average_rating = 2;
  int32 total_reviews = 3;
  int32 five_star_reviews = 4;
  int32 four_star_reviews = 5;
  int32 three_star_reviews = 6;
  int32 two_star_reviews = 7;
  int32 one_star_reviews = 8;
  
  double food_average_rating = 9;
  double service_average_rating = 10;
  double venue_average_rating = 11;
  double value_average_rating = 12;
  
  int32 recommendation_count = 13;
  int32 would_book_again_count = 14;
  
  google.protobuf.Timestamp last_review_date = 15;
  google.protobuf.Timestamp updated_at = 16;
}
