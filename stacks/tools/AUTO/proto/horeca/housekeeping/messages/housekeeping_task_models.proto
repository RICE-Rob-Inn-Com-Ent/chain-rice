syntax = "proto3";

package horeca.housekeeping.messages;

import "google/protobuf/timestamp.proto";
import "../enums/room_status.proto";
import "../enums/housekeeping_task_status.proto";
import "../enums/housekeeping_priority.proto";

// Housekeeping task information
message HousekeepingTask {
  string task_id = 1;
  string room_number = 2;
  string room_type = 3;
  RoomStatus current_status = 4;
  RoomStatus target_status = 5;
  
  HousekeepingTaskStatus status = 6;
  HousekeepingPriority priority = 7;
  
  string assigned_staff_id = 8;
  string assigned_staff_name = 9;
  
  google.protobuf.Timestamp scheduled_time = 10;
  google.protobuf.Timestamp started_time = 11;
  google.protobuf.Timestamp completed_time = 12;
  google.protobuf.Timestamp due_time = 13;
  
  repeated TaskItem task_items = 14;
  string special_instructions = 15;
  string notes = 16;
  
  string guest_name = 17;
  string guest_preferences = 18;
  
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

// Individual task item
message TaskItem {
  string item_id = 1;
  string item_name = 2;
  string description = 3;
  bool is_completed = 4;
  google.protobuf.Timestamp completed_at = 5;
  string completed_by = 6;
  string notes = 7;
}

// Room inspection information
message RoomInspection {
  string inspection_id = 1;
  string room_number = 2;
  string inspector_id = 3;
  string inspector_name = 4;
  
  InspectionStatus status = 5;
  google.protobuf.Timestamp inspection_time = 6;
  
  repeated InspectionItem items = 7;
  string overall_notes = 8;
  string quality_score = 9;
  
  google.protobuf.Timestamp created_at = 10;
}

// Inspection status
enum InspectionStatus {
  INSPECTION_STATUS_UNSPECIFIED = 0;
  INSPECTION_STATUS_PASSED = 1;
  INSPECTION_STATUS_FAILED = 2;
  INSPECTION_STATUS_NEEDS_ATTENTION = 3;
}

// Inspection item
message InspectionItem {
  string item_id = 1;
  string item_name = 2;
  string description = 3;
  InspectionItemStatus status = 4;
  string notes = 5;
  string photo_url = 6;
}

// Inspection item status
enum InspectionItemStatus {
  INSPECTION_ITEM_STATUS_UNSPECIFIED = 0;
  INSPECTION_ITEM_STATUS_PASS = 1;
  INSPECTION_ITEM_STATUS_FAIL = 2;
  INSPECTION_ITEM_STATUS_NEEDS_ATTENTION = 3;
}
