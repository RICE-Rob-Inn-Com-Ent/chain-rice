syntax = "proto3";

package horeca.housekeeping.messages;

import "google/protobuf/timestamp.proto";

// Housekeeping staff information
message HousekeepingStaff {
  string staff_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string employee_id = 5;
  
  StaffStatus status = 6;
  StaffRole role = 7;
  
  repeated StaffShift shifts = 8;
  StaffPerformance performance = 9;
  
  repeated string certifications = 10;
  repeated string languages = 11;
  
  google.protobuf.Timestamp hire_date = 12;
  google.protobuf.Timestamp last_shift = 13;
  
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// Staff status
enum StaffStatus {
  STAFF_STATUS_UNSPECIFIED = 0;
  STAFF_STATUS_ACTIVE = 1;
  STAFF_STATUS_INACTIVE = 2;
  STAFF_STATUS_ON_LEAVE = 3;
  STAFF_STATUS_TERMINATED = 4;
}

// Staff role
enum StaffRole {
  STAFF_ROLE_UNSPECIFIED = 0;
  STAFF_ROLE_HOUSEKEEPER = 1;
  STAFF_ROLE_SUPERVISOR = 2;
  STAFF_ROLE_INSPECTOR = 3;
  STAFF_ROLE_MANAGER = 4;
  STAFF_ROLE_TRAINEE = 5;
}

// Staff shift information
message StaffShift {
  string shift_id = 1;
  string staff_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  ShiftStatus status = 5;
  
  repeated string assigned_rooms = 6;
  int32 tasks_completed = 7;
  int32 tasks_assigned = 8;
  
  string shift_notes = 9;
  google.protobuf.Timestamp created_at = 10;
}

// Shift status
enum ShiftStatus {
  SHIFT_STATUS_UNSPECIFIED = 0;
  SHIFT_STATUS_SCHEDULED = 1;
  SHIFT_STATUS_IN_PROGRESS = 2;
  SHIFT_STATUS_COMPLETED = 3;
  SHIFT_STATUS_CANCELED = 4;
}

// Staff performance metrics
message StaffPerformance {
  double average_rating = 1;
  int32 total_tasks_completed = 2;
  int32 on_time_completion_rate = 3;
  int32 quality_score = 4;
  int32 customer_complaints = 5;
  int32 customer_compliments = 6;
  
  google.protobuf.Timestamp last_review_date = 7;
  string last_review_notes = 8;
}
