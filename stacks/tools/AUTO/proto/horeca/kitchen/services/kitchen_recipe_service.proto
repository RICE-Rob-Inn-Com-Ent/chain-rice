syntax = "proto3";

package horeca.kitchen.services;

import "google/protobuf/empty.proto";
import "../messages/kitchen_recipe_models.proto";

// Kitchen Recipe Service - Recipe management
service KitchenRecipeService {
  // Create a new recipe
  rpc CreateRecipe(CreateRecipeRequest) returns (CreateRecipeResponse);
  
  // Get recipe by ID
  rpc GetRecipe(GetRecipeRequest) returns (GetRecipeResponse);
  
  // Update existing recipe
  rpc UpdateRecipe(UpdateRecipeRequest) returns (UpdateRecipeResponse);
  
  // Delete recipe
  rpc DeleteRecipe(DeleteRecipeRequest) returns (google.protobuf.Empty);
  
  // List recipes with filtering
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse);
  
  // Search recipes
  rpc SearchRecipes(SearchRecipesRequest) returns (SearchRecipesResponse);
  
  // Get recipes by category
  rpc GetRecipesByCategory(GetRecipesByCategoryRequest) returns (GetRecipesByCategoryResponse);
  
  // Get recipes by difficulty
  rpc GetRecipesByDifficulty(GetRecipesByDifficultyRequest) returns (GetRecipesByDifficultyResponse);
  
  // Get recipes by prep time
  rpc GetRecipesByPrepTime(GetRecipesByPrepTimeRequest) returns (GetRecipesByPrepTimeResponse);
  
  // Calculate recipe cost
  rpc CalculateRecipeCost(CalculateRecipeCostRequest) returns (CalculateRecipeCostResponse);
  
  // Update recipe cost
  rpc UpdateRecipeCost(UpdateRecipeCostRequest) returns (UpdateRecipeCostResponse);
  
  // Record recipe usage
  rpc RecordRecipeUsage(RecordRecipeUsageRequest) returns (RecordRecipeUsageResponse);
  
  // Get recipe usage history
  rpc GetRecipeUsageHistory(GetRecipeUsageHistoryRequest) returns (GetRecipeUsageHistoryResponse);
  
  // Get popular recipes
  rpc GetPopularRecipes(GetPopularRecipesRequest) returns (GetPopularRecipesResponse);
}

// Request/Response messages
message CreateRecipeRequest {
  KitchenRecipe recipe = 1;
}

message CreateRecipeResponse {
  KitchenRecipe recipe = 1;
  string message = 2;
}

message GetRecipeRequest {
  string recipe_id = 1;
}

message GetRecipeResponse {
  KitchenRecipe recipe = 1;
}

message UpdateRecipeRequest {
  KitchenRecipe recipe = 1;
}

message UpdateRecipeResponse {
  KitchenRecipe recipe = 1;
  string message = 2;
}

message DeleteRecipeRequest {
  string recipe_id = 1;
}

message ListRecipesRequest {
  string category = 1;
  string status = 2;
  string difficulty = 3;
  int32 max_prep_time = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListRecipesResponse {
  repeated KitchenRecipe recipes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchRecipesRequest {
  string query = 1;
  string category = 2;
  repeated string ingredients = 3;
  repeated string allergens = 4;
  repeated string dietary_tags = 5;
  int32 max_prep_time = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message SearchRecipesResponse {
  repeated KitchenRecipe recipes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetRecipesByCategoryRequest {
  string category = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetRecipesByCategoryResponse {
  repeated KitchenRecipe recipes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetRecipesByDifficultyRequest {
  string difficulty = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetRecipesByDifficultyResponse {
  repeated KitchenRecipe recipes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetRecipesByPrepTimeRequest {
  int32 max_prep_time = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetRecipesByPrepTimeResponse {
  repeated KitchenRecipe recipes = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CalculateRecipeCostRequest {
  string recipe_id = 1;
}

message CalculateRecipeCostResponse {
  double total_cost = 1;
  double cost_per_serving = 2;
  repeated RecipeIngredient ingredients = 3;
}

message UpdateRecipeCostRequest {
  string recipe_id = 1;
  double new_cost = 2;
}

message UpdateRecipeCostResponse {
  KitchenRecipe recipe = 1;
  string message = 2;
}

message RecordRecipeUsageRequest {
  RecipeUsage usage = 1;
}

message RecordRecipeUsageResponse {
  RecipeUsage usage = 1;
  string message = 2;
}

message GetRecipeUsageHistoryRequest {
  string recipe_id = 1;
  string date_from = 2;
  string date_to = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message GetRecipeUsageHistoryResponse {
  repeated RecipeUsage usage_history = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetPopularRecipesRequest {
  string period = 1; // daily, weekly, monthly
  int32 limit = 2;
}

message GetPopularRecipesResponse {
  repeated PopularRecipeData popular_recipes = 1;
}

// Data structures
message PopularRecipeData {
  string recipe_id = 1;
  string recipe_name = 2;
  int32 usage_count = 3;
  double revenue_generated = 4;
  double popularity_score = 5;
}
