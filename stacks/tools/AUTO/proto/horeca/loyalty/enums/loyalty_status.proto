syntax = "proto3";

package horeca.loyalty.enums;

// Status of loyalty membership
enum LoyaltyStatus {
  LOYALTY_STATUS_UNSPECIFIED = 0;
  LOYALTY_STATUS_ACTIVE = 1;              // Active membership
  LOYALTY_STATUS_INACTIVE = 2;            // Inactive membership
  LOYALTY_STATUS_EXPIRED = 3;             // Membership expired
  LOYALTY_STATUS_BLOCKED = 4;             // Membership blocked
  LOYALTY_STATUS_SUSPENDED = 5;           // Membership suspended
  LOYALTY_STATUS_PENDING = 6;             // Membership pending approval
}
