syntax = "proto3";

package horeca.loyalty.services;

import "google/protobuf/empty.proto";
import "../messages/loyalty_member_models.proto";

// Loyalty Member Service - Manage loyalty program members
service LoyaltyMemberService {
  // Register new member
  rpc RegisterMember(RegisterMemberRequest) returns (RegisterMemberResponse);
  
  // Get member by ID
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  
  // Update member information
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse);
  
  // Deactivate member
  rpc DeactivateMember(DeactivateMemberRequest) returns (DeactivateMemberResponse);
  
  // List members with filtering
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  
  // Search members
  rpc SearchMembers(SearchMembersRequest) returns (SearchMembersResponse);
  
  // Get member by customer ID
  rpc GetMemberByCustomerId(GetMemberByCustomerIdRequest) returns (GetMemberByCustomerIdResponse);
  
  // Update member tier
  rpc UpdateMemberTier(UpdateMemberTierRequest) returns (UpdateMemberTierResponse);
  
  // Get member statistics
  rpc GetMemberStatistics(GetMemberStatisticsRequest) returns (GetMemberStatisticsResponse);
  
  // Get member preferences
  rpc GetMemberPreferences(GetMemberPreferencesRequest) returns (GetMemberPreferencesResponse);
  
  // Update member preferences
  rpc UpdateMemberPreferences(UpdateMemberPreferencesRequest) returns (UpdateMemberPreferencesResponse);
  
  // Get member history
  rpc GetMemberHistory(GetMemberHistoryRequest) returns (GetMemberHistoryResponse);
}

// Request/Response messages
message RegisterMemberRequest {
  LoyaltyMember member = 1;
}

message RegisterMemberResponse {
  LoyaltyMember member = 1;
  string message = 2;
}

message GetMemberRequest {
  string member_id = 1;
}

message GetMemberResponse {
  LoyaltyMember member = 1;
}

message UpdateMemberRequest {
  LoyaltyMember member = 1;
}

message UpdateMemberResponse {
  LoyaltyMember member = 1;
  string message = 2;
}

message DeactivateMemberRequest {
  string member_id = 1;
  string reason = 2;
}

message DeactivateMemberResponse {
  LoyaltyMember member = 1;
  string message = 2;
}

message ListMembersRequest {
  string tier = 1;
  string status = 2;
  string date_from = 3;
  string date_to = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListMembersResponse {
  repeated LoyaltyMember members = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchMembersRequest {
  string query = 1;
  string tier = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message SearchMembersResponse {
  repeated LoyaltyMember members = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetMemberByCustomerIdRequest {
  string customer_id = 1;
}

message GetMemberByCustomerIdResponse {
  LoyaltyMember member = 1;
}

message UpdateMemberTierRequest {
  string member_id = 1;
  string new_tier = 2;
  string reason = 3;
}

message UpdateMemberTierResponse {
  LoyaltyMember member = 1;
  string message = 2;
}

message GetMemberStatisticsRequest {
  string member_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetMemberStatisticsResponse {
  MemberStatistics statistics = 1;
}

message GetMemberPreferencesRequest {
  string member_id = 1;
}

message GetMemberPreferencesResponse {
  MemberPreferences preferences = 1;
}

message UpdateMemberPreferencesRequest {
  string member_id = 1;
  MemberPreferences preferences = 2;
}

message UpdateMemberPreferencesResponse {
  MemberPreferences preferences = 1;
  string message = 2;
}

message GetMemberHistoryRequest {
  string member_id = 1;
  string date_from = 2;
  string date_to = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message GetMemberHistoryResponse {
  repeated LoyaltyTransaction transactions = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}
