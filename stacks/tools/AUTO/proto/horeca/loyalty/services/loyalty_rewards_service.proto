syntax = "proto3";

package horeca.loyalty.services;

import "google/protobuf/empty.proto";
import "../messages/loyalty_member_models.proto";

// Loyalty Rewards Service - Rewards catalog and redemption
service LoyaltyRewardsService {
  // Create reward
  rpc CreateReward(CreateRewardRequest) returns (CreateRewardResponse);
  
  // Get reward by ID
  rpc GetReward(GetRewardRequest) returns (GetRewardResponse);
  
  // Update reward
  rpc UpdateReward(UpdateRewardRequest) returns (UpdateRewardResponse);
  
  // Delete reward
  rpc DeleteReward(DeleteRewardRequest) returns (google.protobuf.Empty);
  
  // List rewards
  rpc ListRewards(ListRewardsRequest) returns (ListRewardsResponse);
  
  // Get available rewards for member
  rpc GetAvailableRewards(GetAvailableRewardsRequest) returns (GetAvailableRewardsResponse);
  
  // Redeem reward
  rpc RedeemReward(RedeemRewardRequest) returns (RedeemRewardResponse);
  
  // Get redeemed rewards
  rpc GetRedeemedRewards(GetRedeemedRewardsRequest) returns (GetRedeemedRewardsResponse);
  
  // Use reward
  rpc UseReward(UseRewardRequest) returns (UseRewardResponse);
  
  // Get reward catalog
  rpc GetRewardCatalog(GetRewardCatalogRequest) returns (GetRewardCatalogResponse);
  
  // Search rewards
  rpc SearchRewards(SearchRewardsRequest) returns (SearchRewardsResponse);
  
  // Get reward usage statistics
  rpc GetRewardUsageStatistics(GetRewardUsageStatisticsRequest) returns (GetRewardUsageStatisticsResponse);
}

// Request/Response messages
message CreateRewardRequest {
  LoyaltyReward reward = 1;
}

message CreateRewardResponse {
  LoyaltyReward reward = 1;
  string message = 2;
}

message GetRewardRequest {
  string reward_id = 1;
}

message GetRewardResponse {
  LoyaltyReward reward = 1;
}

message UpdateRewardRequest {
  LoyaltyReward reward = 1;
}

message UpdateRewardResponse {
  LoyaltyReward reward = 1;
  string message = 2;
}

message DeleteRewardRequest {
  string reward_id = 1;
}

message ListRewardsRequest {
  string reward_type = 1;
  string tier = 2;
  bool active_only = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListRewardsResponse {
  repeated LoyaltyReward rewards = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetAvailableRewardsRequest {
  string member_id = 1;
  string tier = 2;
  int32 points_available = 3;
}

message GetAvailableRewardsResponse {
  repeated LoyaltyReward rewards = 1;
}

message RedeemRewardRequest {
  string member_id = 1;
  string reward_id = 2;
}

message RedeemRewardResponse {
  LoyaltyReward reward = 1;
  string message = 2;
}

message GetRedeemedRewardsRequest {
  string member_id = 1;
  string status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetRedeemedRewardsResponse {
  repeated LoyaltyReward rewards = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UseRewardRequest {
  string reward_id = 1;
  string order_id = 2;
}

message UseRewardResponse {
  LoyaltyReward reward = 1;
  string message = 2;
}

message GetRewardCatalogRequest {
  string tier = 1;
  string category = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetRewardCatalogResponse {
  repeated LoyaltyReward rewards = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchRewardsRequest {
  string query = 1;
  string reward_type = 2;
  string tier = 3;
  int32 max_points = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message SearchRewardsResponse {
  repeated LoyaltyReward rewards = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetRewardUsageStatisticsRequest {
  string date_from = 1;
  string date_to = 2;
  string reward_type = 3;
}

message GetRewardUsageStatisticsResponse {
  repeated RewardUsageData usage_data = 1;
  int32 total_redemptions = 2;
  int32 total_uses = 3;
  double redemption_rate = 4;
  double usage_rate = 5;
}

// Data structures
message RewardUsageData {
  string reward_id = 1;
  string reward_name = 2;
  int32 redemptions = 3;
  int32 uses = 4;
  double redemption_rate = 5;
  double usage_rate = 6;
}
