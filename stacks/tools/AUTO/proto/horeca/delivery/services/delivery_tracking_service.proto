syntax = "proto3";

package horeca.delivery.services;

import "google/protobuf/empty.proto";
import "../messages/delivery_events.proto";

// Delivery Tracking Service - Live tracking and status updates
service DeliveryTrackingService {
  // Start tracking for an order
  rpc StartTracking(StartTrackingRequest) returns (StartTrackingResponse);
  
  // Update delivery location
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse);
  
  // Update delivery status
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  
  // Get current location
  rpc GetCurrentLocation(GetCurrentLocationRequest) returns (GetCurrentLocationResponse);
  
  // Get delivery route
  rpc GetDeliveryRoute(GetDeliveryRouteRequest) returns (GetDeliveryRouteResponse);
  
  // Report delivery delay
  rpc ReportDelay(ReportDelayRequest) returns (ReportDelayResponse);
  
  // Get delivery events
  rpc GetDeliveryEvents(GetDeliveryEventsRequest) returns (GetDeliveryEventsResponse);
  
  // Complete delivery
  rpc CompleteDelivery(CompleteDeliveryRequest) returns (CompleteDeliveryResponse);
  
  // Get estimated delivery time
  rpc GetEstimatedDeliveryTime(GetEstimatedDeliveryTimeRequest) returns (GetEstimatedDeliveryTimeResponse);
}

// Request/Response messages
message StartTrackingRequest {
  string order_id = 1;
  string driver_id = 2;
}

message StartTrackingResponse {
  string tracking_id = 1;
  string message = 2;
}

message UpdateLocationRequest {
  string order_id = 1;
  string driver_id = 2;
  double latitude = 3;
  double longitude = 4;
  string location_description = 5;
}

message UpdateLocationResponse {
  string message = 1;
}

message UpdateStatusRequest {
  string order_id = 1;
  string driver_id = 2;
  string status = 3;
  string notes = 4;
}

message UpdateStatusResponse {
  string message = 1;
}

message GetCurrentLocationRequest {
  string order_id = 1;
}

message GetCurrentLocationResponse {
  double latitude = 1;
  double longitude = 2;
  string location_description = 3;
  string last_updated = 4;
}

message GetDeliveryRouteRequest {
  string order_id = 1;
}

message GetDeliveryRouteResponse {
  DeliveryRoute route = 1;
}

message ReportDelayRequest {
  string order_id = 1;
  string driver_id = 2;
  string reason = 3;
  int32 estimated_delay_minutes = 4;
}

message ReportDelayResponse {
  DeliveryDelay delay = 1;
  string message = 2;
}

message GetDeliveryEventsRequest {
  string order_id = 1;
}

message GetDeliveryEventsResponse {
  repeated DeliveryEvent events = 1;
}

message CompleteDeliveryRequest {
  string order_id = 1;
  string driver_id = 2;
  string delivery_notes = 3;
  string customer_signature = 4;
}

message CompleteDeliveryResponse {
  string message = 1;
}

message GetEstimatedDeliveryTimeRequest {
  string order_id = 1;
}

message GetEstimatedDeliveryTimeResponse {
  string estimated_time = 1;
  int32 estimated_minutes = 2;
  string status = 3;
}
