syntax = "proto3";

package horeca.delivery.messages;

import "google/protobuf/timestamp.proto";
import "../enums/delivery_status.proto";

// Delivery tracking event
message DeliveryEvent {
  string event_id = 1;
  string order_id = 2;
  string driver_id = 3;
  string event_type = 4;
  string description = 5;
  DeliveryStatus status = 6;
  
  double latitude = 7;
  double longitude = 8;
  string location_description = 9;
  
  google.protobuf.Timestamp timestamp = 10;
  string notes = 11;
  map<string, string> metadata = 12;
}

// Delivery delay notification
message DeliveryDelay {
  string delay_id = 1;
  string order_id = 2;
  string driver_id = 3;
  string reason = 4;
  int32 estimated_delay_minutes = 5;
  google.protobuf.Timestamp reported_at = 6;
  google.protobuf.Timestamp estimated_resolution = 7;
  string customer_notified = 8;
}

// Delivery route information
message DeliveryRoute {
  string route_id = 1;
  string driver_id = 2;
  repeated string order_ids = 3;
  repeated RouteWaypoint waypoints = 4;
  int32 total_distance_km = 5;
  int32 estimated_duration_minutes = 6;
  google.protobuf.Timestamp route_start = 7;
  google.protobuf.Timestamp route_end = 8;
}

// Route waypoint
message RouteWaypoint {
  double latitude = 1;
  double longitude = 2;
  string address = 3;
  string order_id = 4;
  google.protobuf.Timestamp estimated_arrival = 5;
  google.protobuf.Timestamp actual_arrival = 6;
  bool completed = 7;
}
