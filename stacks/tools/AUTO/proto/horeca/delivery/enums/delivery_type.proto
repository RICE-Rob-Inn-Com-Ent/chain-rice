syntax = "proto3";

package horeca.delivery.enums;

// Types of delivery services
enum DeliveryType {
  DELIVERY_TYPE_UNSPECIFIED = 0;
  DELIVERY_TYPE_IN_HOUSE = 1;             // Restaurant's own delivery staff
  DELIVERY_TYPE_THIRD_PARTY = 2;          // External delivery service (UberEats, DoorDash)
  DELIVERY_TYPE_PICKUP = 3;               // Customer pickup
  DELIVERY_TYPE_CURBSIDE = 4;             // Curbside pickup
  DELIVERY_TYPE_DRIVE_THROUGH = 5;        // Drive-through service
  DELIVERY_TYPE_DINE_IN = 6;              // Dine-in service
}
