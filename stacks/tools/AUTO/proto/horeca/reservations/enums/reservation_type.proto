syntax = "proto3";

package horeca.reservations.enums;

// Types of reservations
enum ReservationType {
  RESERVATION_TYPE_UNSPECIFIED = 0;
  RESERVATION_TYPE_TABLE = 1;             // Restaurant table reservation
  RESERVATION_TYPE_ROOM = 2;              // Hotel room reservation
  RESERVATION_TYPE_EVENT = 3;             // Event space reservation
  RESERVATION_TYPE_PRIVATE_DINING = 4;    // Private dining room
  RESERVATION_TYPE_TERRACE = 5;           // Outdoor terrace reservation
  RESERVATION_TYPE_BANQUET = 6;           // Banquet hall reservation
  RESERVATION_TYPE_MEETING_ROOM = 7;      // Meeting room reservation
  RESERVATION_TYPE_CONFERENCE = 8;        // Conference room reservation
}
