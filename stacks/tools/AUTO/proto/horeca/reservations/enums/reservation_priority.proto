syntax = "proto3";

package horeca.reservations.enums;

// Priority levels for reservations
enum ReservationPriority {
  RESERVATION_PRIORITY_UNSPECIFIED = 0;
  RESERVATION_PRIORITY_STANDARD = 1;      // Standard priority
  RESERVATION_PRIORITY_VIP = 2;           // VIP priority
  RESERVATION_PRIORITY_CORPORATE = 3;     // Corporate client priority
  RESERVATION_PRIORITY_REGULAR = 4;       // Regular customer priority
  RESERVATION_PRIORITY_SPECIAL = 5;       // Special occasion priority
}
