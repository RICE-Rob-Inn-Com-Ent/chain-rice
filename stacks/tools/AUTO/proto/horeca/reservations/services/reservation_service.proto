syntax = "proto3";

package horeca.reservations.services;

import "google/protobuf/empty.proto";
import "../messages/reservation_models.proto";

// Reservation Service - CRUD operations for reservations
service ReservationService {
  // Create a new reservation
  rpc CreateReservation(CreateReservationRequest) returns (CreateReservationResponse);
  
  // Get reservation by ID
  rpc GetReservation(GetReservationRequest) returns (GetReservationResponse);
  
  // Update existing reservation
  rpc UpdateReservation(UpdateReservationRequest) returns (UpdateReservationResponse);
  
  // Delete reservation
  rpc DeleteReservation(DeleteReservationRequest) returns (google.protobuf.Empty);
  
  // List reservations with filtering
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
  
  // Update reservation status
  rpc UpdateReservationStatus(UpdateReservationStatusRequest) returns (UpdateReservationStatusResponse);
  
  // Confirm reservation
  rpc ConfirmReservation(ConfirmReservationRequest) returns (ConfirmReservationResponse);
  
  // Cancel reservation
  rpc CancelReservation(CancelReservationRequest) returns (CancelReservationResponse);
  
  // Get reservations by date
  rpc GetReservationsByDate(GetReservationsByDateRequest) returns (GetReservationsByDateResponse);
  
  // Get reservations by customer
  rpc GetReservationsByCustomer(GetReservationsByCustomerRequest) returns (GetReservationsByCustomerResponse);
  
  // Get reservations by table/room
  rpc GetReservationsByTable(GetReservationsByTableRequest) returns (GetReservationsByTableResponse);
  
  // Check availability
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  
  // Get reservation modifications
  rpc GetReservationModifications(GetReservationModificationsRequest) returns (GetReservationModificationsResponse);
}

// Request/Response messages
message CreateReservationRequest {
  Reservation reservation = 1;
}

message CreateReservationResponse {
  Reservation reservation = 1;
  string message = 2;
}

message GetReservationRequest {
  string reservation_id = 1;
}

message GetReservationResponse {
  Reservation reservation = 1;
}

message UpdateReservationRequest {
  Reservation reservation = 1;
}

message UpdateReservationResponse {
  Reservation reservation = 1;
  string message = 2;
}

message DeleteReservationRequest {
  string reservation_id = 1;
}

message ListReservationsRequest {
  string customer_id = 1;
  string status = 2;
  string type = 3;
  string date_from = 4;
  string date_to = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListReservationsResponse {
  repeated Reservation reservations = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateReservationStatusRequest {
  string reservation_id = 1;
  string new_status = 2;
  string notes = 3;
}

message UpdateReservationStatusResponse {
  Reservation reservation = 1;
  string message = 2;
}

message ConfirmReservationRequest {
  string reservation_id = 1;
  string confirmation_notes = 2;
}

message ConfirmReservationResponse {
  Reservation reservation = 1;
  string message = 2;
}

message CancelReservationRequest {
  string reservation_id = 1;
  string reason = 2;
}

message CancelReservationResponse {
  Reservation reservation = 1;
  string message = 2;
}

message GetReservationsByDateRequest {
  string date = 1;
  string time_from = 2;
  string time_to = 3;
}

message GetReservationsByDateResponse {
  repeated Reservation reservations = 1;
}

message GetReservationsByCustomerRequest {
  string customer_id = 1;
  string status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetReservationsByCustomerResponse {
  repeated Reservation reservations = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetReservationsByTableRequest {
  string table_id = 1;
  string room_id = 2;
  string date = 3;
}

message GetReservationsByTableResponse {
  repeated Reservation reservations = 1;
}

message CheckAvailabilityRequest {
  string date = 1;
  string time = 2;
  int32 party_size = 3;
  string type = 4;
  int32 duration_minutes = 5;
}

message CheckAvailabilityResponse {
  bool available = 1;
  repeated string available_tables = 2;
  repeated string available_rooms = 3;
  string next_available_time = 4;
}

message GetReservationModificationsRequest {
  string reservation_id = 1;
}

message GetReservationModificationsResponse {
  repeated ReservationModification modifications = 1;
}
