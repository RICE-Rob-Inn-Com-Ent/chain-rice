syntax = "proto3";

package horeca.reservations.messages;

import "google/protobuf/timestamp.proto";
import "../enums/reservation_status.proto";

// Reservation event log entry
message ReservationEventLog {
  string log_id = 1;
  string reservation_id = 2;
  string event_type = 3;
  string description = 4;
  
  ReservationStatus old_status = 5;
  ReservationStatus new_status = 6;
  
  string user_id = 7;
  string user_name = 8;
  string user_role = 9;
  
  google.protobuf.Timestamp timestamp = 10;
  string notes = 11;
  map<string, string> metadata = 12;
}

// Event types for reservation operations
message ReservationEventTypes {
  string RESERVATION_CREATED = "reservation_created";
  string RESERVATION_CONFIRMED = "reservation_confirmed";
  string RESERVATION_MODIFIED = "reservation_modified";
  string RESERVATION_CANCELED = "reservation_canceled";
  string RESERVATION_NO_SHOW = "reservation_no_show";
  string RESERVATION_COMPLETED = "reservation_completed";
  string RESERVATION_REMINDER_SENT = "reservation_reminder_sent";
  string RESERVATION_FOLLOW_UP = "reservation_follow_up";
  string GUEST_ARRIVED = "guest_arrived";
  string GUEST_SEATED = "guest_seated";
  string GUEST_DEPARTED = "guest_departed";
  string PAYMENT_RECEIVED = "payment_received";
  string DEPOSIT_RECEIVED = "deposit_received";
  string SPECIAL_REQUEST_ADDED = "special_request_added";
  string DIETARY_RESTRICTION_NOTED = "dietary_restriction_noted";
}
