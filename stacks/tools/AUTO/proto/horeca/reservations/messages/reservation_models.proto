syntax = "proto3";

package horeca.reservations.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";
import "../enums/reservation_status.proto";
import "../enums/reservation_type.proto";
import "../enums/reservation_priority.proto";

// Reservation information
message Reservation {
  string reservation_id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  string customer_phone = 5;
  
  ReservationStatus status = 6;
  ReservationType type = 7;
  ReservationPriority priority = 8;
  
  string table_id = 9;
  string table_number = 10;
  string room_id = 11;
  string room_number = 12;
  string event_space_id = 13;
  string event_space_name = 14;
  
  google.protobuf.Timestamp reservation_date = 15;
  google.protobuf.Timestamp reservation_time = 16;
  google.protobuf.Timestamp end_time = 17;
  
  int32 party_size = 18;
  int32 confirmed_guests = 19;
  
  google.protobuf.Money estimated_total = 20;
  google.protobuf.Money deposit_amount = 21;
  google.protobuf.Money balance_due = 22;
  
  string special_requests = 23;
  string dietary_restrictions = 24;
  string occasion = 25;
  
  string assigned_staff_id = 26;
  string assigned_staff_name = 27;
  
  repeated ReservationGuest guests = 28;
  repeated ReservationService services = 29;
  
  google.protobuf.Timestamp created_at = 30;
  google.protobuf.Timestamp updated_at = 31;
  google.protobuf.Timestamp confirmed_at = 32;
}

// Reservation guest information
message ReservationGuest {
  string guest_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string dietary_restrictions = 5;
  string special_requests = 6;
  bool is_primary_guest = 7;
  google.protobuf.Timestamp rsvp_date = 8;
}

// Reservation service information
message ReservationService {
  string service_id = 1;
  string service_name = 2;
  string service_type = 3;
  string description = 4;
  google.protobuf.Money cost = 5;
  bool is_included = 6;
  string provider = 7;
  string contact_info = 8;
}

// Reservation modification
message ReservationModification {
  string modification_id = 1;
  string reservation_id = 2;
  string modification_type = 3;
  string description = 4;
  
  google.protobuf.Timestamp old_date = 5;
  google.protobuf.Timestamp new_date = 6;
  google.protobuf.Timestamp old_time = 7;
  google.protobuf.Timestamp new_time = 8;
  
  int32 old_party_size = 9;
  int32 new_party_size = 10;
  
  google.protobuf.Money cost_change = 11;
  string user_id = 12;
  string user_name = 13;
  
  google.protobuf.Timestamp modified_at = 14;
  string notes = 15;
}
