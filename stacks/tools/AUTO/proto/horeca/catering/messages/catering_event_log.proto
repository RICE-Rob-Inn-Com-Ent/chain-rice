syntax = "proto3";

package horeca.catering.messages;

import "google/protobuf/timestamp.proto";
import "../enums/catering_order_status.proto";

// Event log entry for catering orders
message CateringEventLog {
  string log_id = 1;
  string order_id = 2;
  string event_type = 3;
  string description = 4;
  CateringOrderStatus old_status = 5;
  CateringOrderStatus new_status = 6;
  string user_id = 7;
  string user_name = 8;
  google.protobuf.Timestamp timestamp = 9;
  string notes = 10;
  map<string, string> metadata = 11;
}

// Event types for catering operations
message CateringEventTypes {
  string ORDER_CREATED = "order_created";
  string ORDER_CONFIRMED = "order_confirmed";
  string ORDER_MODIFIED = "order_modified";
  string PAYMENT_RECEIVED = "payment_received";
  string PREPARATION_STARTED = "preparation_started";
  string ORDER_READY = "order_ready";
  string DELIVERY_STARTED = "delivery_started";
  string ORDER_DELIVERED = "order_delivered";
  string SETUP_COMPLETED = "setup_completed";
  string EVENT_COMPLETED = "event_completed";
  string ORDER_CANCELED = "order_canceled";
  string REFUND_PROCESSED = "refund_processed";
}
