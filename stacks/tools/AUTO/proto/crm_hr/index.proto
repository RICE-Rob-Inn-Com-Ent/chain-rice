/*
CRM-HR Module Overview
======================

This module provides comprehensive CRM (Customer Relationship Management) and HR 
(Human Resources) functionality built with Protobuf v3 and gRPC.

## Module Structure

### 1. CRM Module
- **Enums**: Deal stages, pipeline statuses, priority levels
- **Messages**: Deals, pipelines, notes, activities
- **Services**: Complete CRUD operations and business logic for sales management

### 2. Customers Module
- **Enums**: Customer types, statuses, contact preferences
- **Messages**: Customers, contacts, interactions, segments
- **Services**: Customer lifecycle management, segmentation, analytics

### 3. HR Module
- **Enums**: Employee roles, job positions, payroll statuses
- **Messages**: Employees, timesheets, payroll, attendance
- **Services**: Employee management, time tracking, payroll processing

### 4. Loyalty Module
- **Enums**: Loyalty tiers, reward types, loyalty statuses
- **Messages**: Loyalty programs, rewards, activities, campaigns
- **Services**: Loyalty program management, reward redemption, analytics

### 5. Support Module
- **Enums**: Ticket statuses, priorities, support channels
- **Messages**: Support tickets, replies, SLAs, conversations
- **Services**: Ticket management, SLA compliance, support analytics

## Key Features

- **Comprehensive CRUD Operations**: Full create, read, update, delete functionality
- **Business Logic**: Advanced operations like deal progression, loyalty tier management
- **Analytics & Reporting**: Built-in analytics and reporting capabilities
- **SLA Management**: Service level agreement tracking and compliance
- **Multi-channel Support**: Support for various communication channels
- **Segmentation**: Customer and employee segmentation capabilities
- **Audit Trail**: Complete audit trail for all operations
- **Custom Fields**: Extensible with custom field support

## Usage

To use this module, import the specific services you need:

```protobuf
import "crm_hr/index.proto";

// Use CRM service
service MyService {
  rpc CreateDeal(crm_hr.crm.services.CreateDealRequest) returns (crm_hr.crm.messages.Deal);
}

// Use Customer service
service MyService {
  rpc GetCustomer(crm_hr.customers.services.GetCustomerRequest) returns (crm_hr.customers.messages.Customer);
}
```

## Version Information

- Protobuf Version: 3
- gRPC Version: Latest
- Go Package: github.com/rice-dev/crm-hr
- Last Updated: 2024

## Dependencies

- google.protobuf.timestamp
- google.protobuf.money
- google.protobuf.duration
- google.protobuf.empty
*/
