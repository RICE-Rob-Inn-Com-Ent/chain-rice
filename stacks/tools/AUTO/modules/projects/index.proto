syntax = "proto3";

package projects;

// Projects Module - Enterprise-grade gRPC microservices for project management
// This module provides comprehensive project management capabilities including:
// - Project lifecycle management
// - Resource allocation and tracking
// - Task management and assignment
// - Time tracking and reporting

// =============================================================================
// PROJECTS SUBMODULE
// =============================================================================

// Import project enums
import "projects/enums/project_status.proto";
import "projects/enums/project_priority.proto";

// Import project messages
import "projects/messages/project_request.proto";
import "projects/messages/project_response.proto";

// Import project services
import "projects/services/project_service.proto";

// Re-export project enums for global access
option go_package = "github.com/rice-dev/projects";

// =============================================================================
// RESOURCES SUBMODULE
// =============================================================================

// Import resource enums
import "resources/enums/resource_type.proto";
import "resources/enums/allocation_status.proto";

// Import resource messages
import "resources/messages/resource_request.proto";
import "resources/messages/resource_response.proto";

// Import resource services
import "resources/services/resource_service.proto";

// =============================================================================
// TASKS SUBMODULE
// =============================================================================

// Import task enums
import "tasks/enums/task_status.proto";
import "tasks/enums/task_priority.proto";

// Import task messages
import "tasks/messages/task_request.proto";
import "tasks/messages/task_response.proto";

// Import task services
import "tasks/services/task_service.proto";

// =============================================================================
// TIME TRACKING SUBMODULE
// =============================================================================

// Import time tracking enums
import "time-tracking/enums/time_entry_type.proto";

// Import time tracking messages
import "time-tracking/messages/time_entry_request.proto";
import "time-tracking/messages/time_entry_response.proto";

// Import time tracking services
import "time-tracking/services/time_tracking_service.proto";

// =============================================================================
// MODULE DOCUMENTATION
// =============================================================================

/*
Projects Module Architecture:

This module follows enterprise-grade microservices architecture patterns:

1. DOMAIN SEPARATION:
   - projects/: Core project management
   - resources/: Resource allocation and management
   - tasks/: Task lifecycle management
   - time-tracking/: Time logging and reporting

2. LAYERED STRUCTURE:
   - enums/: Domain-specific enumerations
   - messages/: Request/response data structures
   - services/: gRPC service definitions

3. DESIGN PRINCIPLES:
   - Single Responsibility: Each service handles one domain
   - Consistency: Uniform CRUD operations across all services
   - Extensibility: Metadata fields for future enhancements
   - Validation: Proper field validation and error handling
   - Documentation: Comprehensive inline documentation

4. API CONVENTIONS:
   - RESTful HTTP mappings via google.api.http annotations
   - Consistent naming: Create, Get, List, Update, Delete operations
   - Pagination: Standard page_size/page_token pattern
   - Filtering: Flexible query parameters for all list operations
   - Error Handling: google.rpc.Status for consistent error responses

5. DATA MODELING:
   - UUID-based identifiers for all entities
   - Timestamp fields for audit trails
   - Metadata maps for extensibility
   - Proper enum usage for type safety
   - Optional fields with sensible defaults

Usage Examples:

// Create a new project
CreateProjectRequest {
  name: "Mobile App Development"
  description: "Building a cross-platform mobile application"
  priority: PROJECT_PRIORITY_HIGH
  owner_id: "user-123"
}

// Allocate a resource to a project
UpdateResourceRequest {
  resource_id: "resource-456"
  allocation_status: ALLOCATION_STATUS_ALLOCATED
  project_id: "project-789"
}

// Create a task within a project
CreateTaskRequest {
  title: "Implement user authentication"
  description: "Add OAuth2 authentication flow"
  priority: TASK_PRIORITY_HIGH
  assignee_id: "user-123"
  project_id: "project-789"
  estimated_hours: 8.0
}

// Log time for a task
CreateTimeEntryRequest {
  user_id: "user-123"
  project_id: "project-789"
  task_id: "task-101"
  hours: 2.5
  entry_type: TIME_ENTRY_TYPE_REGULAR
  date: "2024-01-15T09:00:00Z"
  description: "Implemented OAuth2 login flow"
}
*/
