syntax = "proto3";

package projects.time_tracking.messages;

import "time-tracking/messages/time_entry_request.proto";
import "google/rpc/status.proto";

// CreateTimeEntryResponse contains the result of creating a new time entry
message CreateTimeEntryResponse {
  // The created time entry
  TimeEntry time_entry = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// GetTimeEntryResponse contains the result of retrieving a time entry
message GetTimeEntryResponse {
  // The requested time entry
  TimeEntry time_entry = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// ListTimeEntriesResponse contains the result of listing time entries
message ListTimeEntriesResponse {
  // List of time entries matching the request criteria
  repeated TimeEntry time_entries = 1;
  
  // Token to retrieve the next page of results
  string next_page_token = 2;
  
  // Total number of time entries matching the criteria
  int32 total_count = 3;
  
  // Total hours logged across all matching entries
  double total_hours = 4;
  
  // Operation status
  google.rpc.Status status = 5;
}

// UpdateTimeEntryResponse contains the result of updating a time entry
message UpdateTimeEntryResponse {
  // The updated time entry
  TimeEntry time_entry = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// DeleteTimeEntryResponse contains the result of deleting a time entry
message DeleteTimeEntryResponse {
  // Indicates whether the deletion was successful
  bool success = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}
