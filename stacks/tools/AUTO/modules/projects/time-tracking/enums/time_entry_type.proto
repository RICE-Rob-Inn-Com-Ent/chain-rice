syntax = "proto3";

package projects.time_tracking.enums;

// TimeEntryType represents the type of time entry being recorded
enum TimeEntryType {
  // Default value - should not be used
  TIME_ENTRY_TYPE_UNSPECIFIED = 0;
  
  // Regular work time
  TIME_ENTRY_TYPE_REGULAR = 1;
  
  // Overtime work
  TIME_ENTRY_TYPE_OVERTIME = 2;
  
  // Billable time
  TIME_ENTRY_TYPE_BILLABLE = 3;
  
  // Non-billable time
  TIME_ENTRY_TYPE_NON_BILLABLE = 4;
  
  // Administrative time
  TIME_ENTRY_TYPE_ADMINISTRATIVE = 5;
  
  // Training time
  TIME_ENTRY_TYPE_TRAINING = 6;
  
  // Meeting time
  TIME_ENTRY_TYPE_MEETING = 7;
  
  // Research time
  TIME_ENTRY_TYPE_RESEARCH = 8;
  
  // Break time
  TIME_ENTRY_TYPE_BREAK = 9;
}
