syntax = "proto3";

package projects.resources.messages;

import "resources/messages/resource_request.proto";
import "google/rpc/status.proto";

// CreateResourceResponse contains the result of creating a new resource
message CreateResourceResponse {
  // The created resource
  Resource resource = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// GetResourceResponse contains the result of retrieving a resource
message GetResourceResponse {
  // The requested resource
  Resource resource = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// ListResourcesResponse contains the result of listing resources
message ListResourcesResponse {
  // List of resources matching the request criteria
  repeated Resource resources = 1;
  
  // Token to retrieve the next page of results
  string next_page_token = 2;
  
  // Total number of resources matching the criteria
  int32 total_count = 3;
  
  // Operation status
  google.rpc.Status status = 4;
}

// UpdateResourceResponse contains the result of updating a resource
message UpdateResourceResponse {
  // The updated resource
  Resource resource = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}

// DeleteResourceResponse contains the result of deleting a resource
message DeleteResourceResponse {
  // Indicates whether the deletion was successful
  bool success = 1;
  
  // Operation status
  google.rpc.Status status = 2;
}
