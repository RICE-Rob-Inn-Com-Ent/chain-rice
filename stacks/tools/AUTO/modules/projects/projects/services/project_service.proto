syntax = "proto3";

package projects.services;

import "projects/messages/project_request.proto";
import "projects/messages/project_response.proto";
import "google/api/annotations.proto";

// ProjectService provides CRUD operations for project management
service ProjectService {
  // CreateProject creates a new project
  rpc CreateProject(projects.messages.CreateProjectRequest) returns (projects.messages.CreateProjectResponse) {
    option (google.api.http) = {
      post: "/api/v1/projects"
      body: "*"
    };
  }
  
  // GetProject retrieves a specific project by ID
  rpc GetProject(projects.messages.GetProjectRequest) returns (projects.messages.GetProjectResponse) {
    option (google.api.http) = {
      get: "/api/v1/projects/{project_id}"
    };
  }
  
  // ListProjects retrieves a paginated list of projects with optional filtering
  rpc ListProjects(projects.messages.ListProjectsRequest) returns (projects.messages.ListProjectsResponse) {
    option (google.api.http) = {
      get: "/api/v1/projects"
    };
  }
  
  // UpdateProject updates an existing project
  rpc UpdateProject(projects.messages.UpdateProjectRequest) returns (projects.messages.UpdateProjectResponse) {
    option (google.api.http) = {
      put: "/api/v1/projects/{project_id}"
      body: "*"
    };
  }
  
  // DeleteProject deletes a specific project
  rpc DeleteProject(projects.messages.DeleteProjectRequest) returns (projects.messages.DeleteProjectResponse) {
    option (google.api.http) = {
      delete: "/api/v1/projects/{project_id}"
    };
  }
}
