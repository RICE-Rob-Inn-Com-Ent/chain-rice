syntax = "proto3";

package retail.promotions.services;

import "promotions/messages/promotion_request.proto";
import "promotions/messages/promotion_response.proto";
import "google/api/annotations.proto";

// PromotionService provides CRUD operations for promotion management
service PromotionService {
  // CreatePromotion creates a new promotion
  rpc CreatePromotion(retail.promotions.messages.CreatePromotionRequest) returns (retail.promotions.messages.CreatePromotionResponse) {
    option (google.api.http) = {
      post: "/api/v1/promotions"
      body: "*"
    };
  }
  
  // GetPromotion retrieves a specific promotion by ID
  rpc GetPromotion(retail.promotions.messages.GetPromotionRequest) returns (retail.promotions.messages.GetPromotionResponse) {
    option (google.api.http) = {
      get: "/api/v1/promotions/{promotion_id}"
    };
  }
  
  // ListPromotions retrieves a paginated list of promotions with optional filtering
  rpc ListPromotions(retail.promotions.messages.ListPromotionsRequest) returns (retail.promotions.messages.ListPromotionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/promotions"
    };
  }
  
  // UpdatePromotion updates an existing promotion
  rpc UpdatePromotion(retail.promotions.messages.UpdatePromotionRequest) returns (retail.promotions.messages.UpdatePromotionResponse) {
    option (google.api.http) = {
      put: "/api/v1/promotions/{promotion_id}"
      body: "*"
    };
  }
  
  // DeletePromotion deletes a specific promotion
  rpc DeletePromotion(retail.promotions.messages.DeletePromotionRequest) returns (retail.promotions.messages.DeletePromotionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/promotions/{promotion_id}"
    };
  }
}
