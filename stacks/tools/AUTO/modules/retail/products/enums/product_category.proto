syntax = "proto3";

package retail.products.enums;

// ProductCategory represents the category classification of a product
enum ProductCategory {
  // Default value - should not be used
  PRODUCT_CATEGORY_UNSPECIFIED = 0;
  
  // Electronics and technology products
  PRODUCT_CATEGORY_ELECTRONICS = 1;
  
  // Clothing and fashion items
  PRODUCT_CATEGORY_CLOTHING = 2;
  
  // Food and beverages
  PRODUCT_CATEGORY_FOOD_BEVERAGE = 3;
  
  // Home and garden products
  PRODUCT_CATEGORY_HOME_GARDEN = 4;
  
  // Health and beauty products
  PRODUCT_CATEGORY_HEALTH_BEAUTY = 5;
  
  // Sports and outdoor equipment
  PRODUCT_CATEGORY_SPORTS_OUTDOOR = 6;
  
  // Books and media
  PRODUCT_CATEGORY_BOOKS_MEDIA = 7;
  
  // Toys and games
  PRODUCT_CATEGORY_TOYS_GAMES = 8;
  
  // Automotive products
  PRODUCT_CATEGORY_AUTOMOTIVE = 9;
  
  // Office supplies and stationery
  PRODUCT_CATEGORY_OFFICE_SUPPLIES = 10;
  
  // Jewelry and accessories
  PRODUCT_CATEGORY_JEWELRY_ACCESSORIES = 11;
  
  // Pet supplies
  PRODUCT_CATEGORY_PET_SUPPLIES = 12;
  
  // Baby and kids products
  PRODUCT_CATEGORY_BABY_KIDS = 13;
  
  // Industrial and business products
  PRODUCT_CATEGORY_INDUSTRIAL_BUSINESS = 14;
  
  // Miscellaneous products
  PRODUCT_CATEGORY_MISCELLANEOUS = 15;
}
