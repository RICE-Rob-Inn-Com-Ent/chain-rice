syntax = "proto3";

package retail.inventory.messages;

import "inventory/enums/stock_status.proto";
import "inventory/enums/inventory_action.proto";
import "google/protobuf/timestamp.proto";

// InventoryItem represents a single inventory item
message InventoryItem {
  // Unique identifier for the inventory item
  string id = 1;
  
  // ID of the product this inventory item represents
  string product_id = 2;
  
  // ID of the store where this inventory is located
  string store_id = 3;
  
  // Current quantity in stock
  int32 quantity = 4;
  
  // Current stock status
  retail.inventory.enums.StockStatus stock_status = 5;
  
  // Minimum quantity before reorder
  int32 reorder_threshold = 6;
  
  // Maximum quantity to maintain
  int32 max_quantity = 7;
  
  // Cost per unit of this inventory item
  double unit_cost = 8;
  
  // Selling price per unit
  double unit_price = 9;
  
  // Timestamp when inventory was last updated
  google.protobuf.Timestamp last_updated = 10;
  
  // Timestamp when inventory was created
  google.protobuf.Timestamp created_at = 11;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 12;
}

// InventoryMovement represents a change in inventory
message InventoryMovement {
  // Unique identifier for the movement
  string id = 1;
  
  // ID of the inventory item
  string inventory_id = 2;
  
  // Type of inventory action
  retail.inventory.enums.InventoryAction action = 3;
  
  // Quantity change (positive for additions, negative for reductions)
  int32 quantity_change = 4;
  
  // Quantity before the movement
  int32 quantity_before = 5;
  
  // Quantity after the movement
  int32 quantity_after = 6;
  
  // Reference to related order, transfer, or adjustment
  string reference_id = 7;
  
  // Description of the movement
  string description = 8;
  
  // User who performed the action
  string user_id = 9;
  
  // Timestamp when movement occurred
  google.protobuf.Timestamp movement_date = 10;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 11;
}

// CreateInventoryRequest contains the data needed to create a new inventory item
message CreateInventoryRequest {
  // ID of the product (required)
  string product_id = 1;
  
  // ID of the store (required)
  string store_id = 2;
  
  // Initial quantity (required)
  int32 quantity = 3;
  
  // Minimum quantity before reorder (optional)
  int32 reorder_threshold = 4;
  
  // Maximum quantity to maintain (optional)
  int32 max_quantity = 5;
  
  // Cost per unit (optional)
  double unit_cost = 6;
  
  // Selling price per unit (optional)
  double unit_price = 7;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 8;
}

// GetInventoryRequest contains the identifier to retrieve a specific inventory item
message GetInventoryRequest {
  // Unique identifier of the inventory item to retrieve
  string inventory_id = 1;
}

// ListInventoryRequest contains parameters for listing inventory items
message ListInventoryRequest {
  // Maximum number of inventory items to return (default: 50, max: 1000)
  int32 page_size = 1;
  
  // Token to retrieve the next page of results
  string page_token = 2;
  
  // Filter by product ID
  string product_id = 3;
  
  // Filter by store ID
  string store_id = 4;
  
  // Filter by stock status
  retail.inventory.enums.StockStatus stock_status = 5;
  
  // Filter by low stock items only
  bool low_stock_only = 6;
  
  // Filter by out of stock items only
  bool out_of_stock_only = 7;
  
  // Search term to filter inventory by product name
  string search_term = 8;
}

// UpdateInventoryRequest contains the data needed to update an existing inventory item
message UpdateInventoryRequest {
  // Unique identifier of the inventory item to update
  string inventory_id = 1;
  
  // Updated quantity (optional)
  int32 quantity = 2;
  
  // Updated stock status (optional)
  retail.inventory.enums.StockStatus stock_status = 3;
  
  // Updated reorder threshold (optional)
  int32 reorder_threshold = 4;
  
  // Updated max quantity (optional)
  int32 max_quantity = 5;
  
  // Updated unit cost (optional)
  double unit_cost = 6;
  
  // Updated unit price (optional)
  double unit_price = 7;
  
  // Updated metadata (optional)
  map<string, string> metadata = 8;
}

// AdjustInventoryRequest contains the data needed to adjust inventory quantities
message AdjustInventoryRequest {
  // Unique identifier of the inventory item to adjust
  string inventory_id = 1;
  
  // Type of adjustment action
  retail.inventory.enums.InventoryAction action = 2;
  
  // Quantity change (positive for additions, negative for reductions)
  int32 quantity_change = 3;
  
  // Reference ID for the adjustment
  string reference_id = 4;
  
  // Description of the adjustment
  string description = 5;
  
  // User performing the adjustment
  string user_id = 6;
}

// DeleteInventoryRequest contains the identifier to delete a specific inventory item
message DeleteInventoryRequest {
  // Unique identifier of the inventory item to delete
  string inventory_id = 1;
}
