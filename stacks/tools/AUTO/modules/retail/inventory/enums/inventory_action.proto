syntax = "proto3";

package retail.inventory.enums;

// InventoryAction represents the type of inventory movement or adjustment
enum InventoryAction {
  // Default value - should not be used
  INVENTORY_ACTION_UNSPECIFIED = 0;
  
  // Stock received from supplier
  INVENTORY_ACTION_RECEIVED = 1;
  
  // Stock sold to customer
  INVENTORY_ACTION_SOLD = 2;
  
  // Stock returned by customer
  INVENTORY_ACTION_RETURNED = 3;
  
  // Stock transferred between stores
  INVENTORY_ACTION_TRANSFERRED = 4;
  
  // Stock adjusted due to count discrepancy
  INVENTORY_ACTION_ADJUSTED = 5;
  
  // Stock damaged and removed
  INVENTORY_ACTION_DAMAGED = 6;
  
  // Stock expired and removed
  INVENTORY_ACTION_EXPIRED = 7;
  
  // Stock stolen/lost and removed
  INVENTORY_ACTION_LOST = 8;
  
  // Stock donated and removed
  INVENTORY_ACTION_DONATED = 9;
  
  // Stock reserved for order
  INVENTORY_ACTION_RESERVED = 10;
  
  // Stock unreserved from order
  INVENTORY_ACTION_UNRESERVED = 11;
}
