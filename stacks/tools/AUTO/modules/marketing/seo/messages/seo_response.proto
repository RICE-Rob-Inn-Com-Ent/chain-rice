syntax = "proto3";

package marketing.seo.messages;

import "google/protobuf/timestamp.proto";
import "marketing/seo/enums/seo_metric.proto";

// SEO report data transfer object
message Seo {
  // SEO report ID
  string id = 1;
  
  // SEO report name
  string name = 2;
  
  // Website URL
  string website_url = 3;
  
  // SEO metrics data
  repeated SeoMetricData metrics = 4;
  
  // Report date
  google.protobuf.Timestamp report_date = 5;
  
  // Report description
  string description = 6;
  
  // Campaign ID (if applicable)
  string campaign_id = 7;
  
  // Report tags
  repeated string tags = 8;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 9;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 10;
  
  // SEO summary
  SeoSummary summary = 11;
}

// SEO metric data
message SeoMetricData {
  // Metric type
  marketing.seo.enums.SeoMetric metric = 1;
  
  // Metric value
  double value = 2;
  
  // Metric unit
  string unit = 3;
  
  // Metric description
  string description = 4;
  
  // Previous value for comparison
  double previous_value = 5;
  
  // Change percentage
  double change_percentage = 6;
}

// SEO summary data
message SeoSummary {
  // Overall SEO score
  double overall_score = 1;
  
  // Total organic traffic
  int64 total_organic_traffic = 2;
  
  // Average keyword ranking
  double avg_keyword_ranking = 3;
  
  // Total backlinks
  int64 total_backlinks = 4;
  
  // Domain authority
  double domain_authority = 5;
  
  // Average page load speed (in seconds)
  double avg_page_load_speed = 6;
  
  // Mobile usability score
  double mobile_usability_score = 7;
  
  // Overall CTR
  double overall_ctr = 8;
  
  // Overall bounce rate
  double overall_bounce_rate = 9;
  
  // Conversion rate
  double conversion_rate = 10;
}

// Response message for creating SEO data
message CreateSeoResponse {
  // Created SEO report
  Seo seo = 1;
  
  // Success message
  string message = 2;
}

// Response message for getting SEO data
message GetSeoResponse {
  // SEO report data
  Seo seo = 1;
}

// Response message for listing SEO data
message ListSeoResponse {
  // List of SEO reports
  repeated Seo seo_reports = 1;
  
  // Total count of SEO reports
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Number of items per page
  int32 page_size = 4;
}

// Response message for updating SEO data
message UpdateSeoResponse {
  // Updated SEO report
  Seo seo = 1;
  
  // Success message
  string message = 2;
}

// Response message for deleting SEO data
message DeleteSeoResponse {
  // Success message
  string message = 1;
}
