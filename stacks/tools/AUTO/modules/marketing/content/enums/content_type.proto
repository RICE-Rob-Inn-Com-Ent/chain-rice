syntax = "proto3";

package marketing.content.enums;

// Enumeration for content types
enum ContentType {
  // Default type - not specified
  CONTENT_TYPE_UNSPECIFIED = 0;
  
  // Blog post content
  CONTENT_TYPE_BLOG_POST = 1;
  
  // Social media post
  CONTENT_TYPE_SOCIAL_MEDIA_POST = 2;
  
  // Email newsletter
  CONTENT_TYPE_EMAIL_NEWSLETTER = 3;
  
  // Video content
  CONTENT_TYPE_VIDEO = 4;
  
  // Image content
  CONTENT_TYPE_IMAGE = 5;
  
  // Infographic
  CONTENT_TYPE_INFOGraphic = 6;
  
  // Whitepaper
  CONTENT_TYPE_WHITEPAPER = 7;
  
  // Case study
  CONTENT_TYPE_CASE_STUDY = 8;
  
  // Webinar
  CONTENT_TYPE_WEBINAR = 9;
  
  // Podcast
  CONTENT_TYPE_PODCAST = 10;
  
  // Landing page
  CONTENT_TYPE_LANDING_PAGE = 11;
  
  // Product description
  CONTENT_TYPE_PRODUCT_DESCRIPTION = 12;
}
