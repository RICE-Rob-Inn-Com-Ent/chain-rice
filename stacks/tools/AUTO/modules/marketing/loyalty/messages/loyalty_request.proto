syntax = "proto3";

package marketing.loyalty.messages;

import "google/protobuf/timestamp.proto";
import "marketing/loyalty/enums/loyalty_level.proto";

// Request message for creating a new loyalty program
message CreateLoyaltyRequest {
  // Loyalty program name
  string name = 1;
  
  // Loyalty program description
  string description = 2;
  
  // Loyalty program type
  string type = 3;
  
  // Points per dollar spent
  double points_per_dollar = 4;
  
  // Minimum points to redeem
  int32 min_points_to_redeem = 5;
  
  // Points expiration period (in days)
  int32 points_expiration_days = 6;
  
  // Loyalty level requirements
  repeated LoyaltyLevelRequirement level_requirements = 7;
  
  // Program start date
  google.protobuf.Timestamp start_date = 8;
  
  // Program end date
  google.protobuf.Timestamp end_date = 9;
  
  // Program tags
  repeated string tags = 10;
}

// Loyalty level requirement
message LoyaltyLevelRequirement {
  // Loyalty level
  marketing.loyalty.enums.LoyaltyLevel level = 1;
  
  // Minimum points required
  int32 min_points = 2;
  
  // Minimum spend required
  double min_spend = 3;
  
  // Benefits for this level
  repeated string benefits = 4;
}

// Request message for getting a loyalty program by ID
message GetLoyaltyRequest {
  // Loyalty program ID
  string id = 1;
}

// Request message for listing loyalty programs
message ListLoyaltyRequest {
  // Page number for pagination
  int32 page = 1;
  
  // Number of items per page
  int32 page_size = 2;
  
  // Filter by type
  string type = 3;
  
  // Filter by tags
  repeated string tags = 4;
  
  // Filter by active status
  bool active_only = 5;
}

// Request message for updating a loyalty program
message UpdateLoyaltyRequest {
  // Loyalty program ID
  string id = 1;
  
  // Loyalty program name
  string name = 2;
  
  // Loyalty program description
  string description = 3;
  
  // Loyalty program type
  string type = 4;
  
  // Points per dollar spent
  double points_per_dollar = 5;
  
  // Minimum points to redeem
  int32 min_points_to_redeem = 6;
  
  // Points expiration period (in days)
  int32 points_expiration_days = 7;
  
  // Loyalty level requirements
  repeated LoyaltyLevelRequirement level_requirements = 8;
  
  // Program end date
  google.protobuf.Timestamp end_date = 9;
  
  // Program tags
  repeated string tags = 10;
}

// Request message for deleting a loyalty program
message DeleteLoyaltyRequest {
  // Loyalty program ID
  string id = 1;
}
