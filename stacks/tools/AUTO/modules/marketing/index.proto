// Marketing module provides comprehensive marketing functionality including:
// - Advertisement management (ads)
// - Analytics and reporting (analytics)
// - Campaign management (campaings)
// - Content management (content)
// - Email marketing (email)
// - Influencer marketing (influencer)
// - Lead management (leads)
// - Loyalty programs (loyalty)
// - SEO optimization (seo)
// - SMS marketing (sms)
// - Social media marketing (social)
//
// Each submodule follows a consistent structure:
// - enums/ - Contains enumeration definitions
// - messages/ - Contains request and response message definitions
// - services/ - Contains gRPC service definitions
//
// All services implement standard CRUD operations:
// - Create: Create new resources
// - Get: Retrieve resources by ID
// - List: List resources with pagination and filtering
// - Update: Update existing resources
// - Delete: Delete resources
//
// This module is designed for enterprise-grade marketing automation
// and provides comprehensive tools for managing all aspects of
// digital marketing campaigns and customer engagement.
