syntax = "proto3";

package blockchain.smart_contracts.enums;

option go_package = "github.com/chainrice/proto/blockchain/smart_contracts/enums";

// ContractStatus defines the status of smart contracts
enum ContractStatus {
  // CONTRACT_STATUS_UNSPECIFIED indicates an unspecified contract status
  CONTRACT_STATUS_UNSPECIFIED = 0;
  
  // CONTRACT_STATUS_ACTIVE indicates the contract is active and operational
  CONTRACT_STATUS_ACTIVE = 1;
  
  // CONTRACT_STATUS_INACTIVE indicates the contract is inactive
  CONTRACT_STATUS_INACTIVE = 2;
  
  // CONTRACT_STATUS_PENDING indicates the contract is pending deployment
  CONTRACT_STATUS_PENDING = 3;
  
  // CONTRACT_STATUS_DEPLOYED indicates the contract is deployed
  CONTRACT_STATUS_DEPLOYED = 4;
  
  // CONTRACT_STATUS_FAILED indicates the contract deployment failed
  CONTRACT_STATUS_FAILED = 5;
  
  // CONTRACT_STATUS_PAUSED indicates the contract is paused
  CONTRACT_STATUS_PAUSED = 6;
  
  // CONTRACT_STATUS_SUSPENDED indicates the contract is suspended
  CONTRACT_STATUS_SUSPENDED = 7;
  
  // CONTRACT_STATUS_DEPRECATED indicates the contract is deprecated
  CONTRACT_STATUS_DEPRECATED = 8;
  
  // CONTRACT_STATUS_UPGRADING indicates the contract is being upgraded
  CONTRACT_STATUS_UPGRADING = 9;
  
  // CONTRACT_STATUS_MAINTENANCE indicates the contract is under maintenance
  CONTRACT_STATUS_MAINTENANCE = 10;
  
  // CONTRACT_STATUS_ERROR indicates the contract is in error state
  CONTRACT_STATUS_ERROR = 11;
  
  // CONTRACT_STATUS_VERIFIED indicates the contract is verified
  CONTRACT_STATUS_VERIFIED = 12;
  
  // CONTRACT_STATUS_UNVERIFIED indicates the contract is unverified
  CONTRACT_STATUS_UNVERIFIED = 13;
  
  // CONTRACT_STATUS_AUDITED indicates the contract is audited
  CONTRACT_STATUS_AUDITED = 14;
  
  // CONTRACT_STATUS_UNAUDITED indicates the contract is unaudited
  CONTRACT_STATUS_UNAUDITED = 15;
  
  // CONTRACT_STATUS_TRUSTED indicates the contract is trusted
  CONTRACT_STATUS_TRUSTED = 16;
  
  // CONTRACT_STATUS_UNTRUSTED indicates the contract is untrusted
  CONTRACT_STATUS_UNTRUSTED = 17;
}
