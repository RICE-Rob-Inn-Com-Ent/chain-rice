syntax = "proto3";

package blockchain.smart_contracts.services;

import "blockchain/smart_contracts/messages/contract.proto";
import "blockchain/smart_contracts/messages/contract_event.proto";

option go_package = "github.com/chainrice/proto/blockchain/smart_contracts/services";

// SmartContractMsgService handles state-changing smart contract operations
service SmartContractMsgService {
  // DeployContract deploys a new smart contract
  rpc DeployContract(blockchain.smart_contracts.messages.MsgDeployContract) returns (blockchain.smart_contracts.messages.MsgDeployContractResponse);
  
  // UpdateContract updates an existing contract
  rpc UpdateContract(blockchain.smart_contracts.messages.MsgUpdateContract) returns (blockchain.smart_contracts.messages.MsgUpdateContractResponse);
  
  // VerifyContract verifies a contract
  rpc VerifyContract(blockchain.smart_contracts.messages.MsgVerifyContract) returns (blockchain.smart_contracts.messages.MsgVerifyContractResponse);
  
  // UpgradeContract upgrades a contract
  rpc UpgradeContract(blockchain.smart_contracts.messages.MsgUpgradeContract) returns (blockchain.smart_contracts.messages.MsgUpgradeContractResponse);
  
  // PauseContract pauses a contract
  rpc PauseContract(blockchain.smart_contracts.messages.MsgPauseContract) returns (blockchain.smart_contracts.messages.MsgPauseContractResponse);
  
  // ResumeContract resumes a paused contract
  rpc ResumeContract(blockchain.smart_contracts.messages.MsgResumeContract) returns (blockchain.smart_contracts.messages.MsgResumeContractResponse);
  
  // EmitContractEvent emits a contract event
  rpc EmitContractEvent(blockchain.smart_contracts.messages.MsgEmitContractEvent) returns (blockchain.smart_contracts.messages.MsgEmitContractEventResponse);
  
  // CallContract calls a smart contract function
  rpc CallContract(blockchain.smart_contracts.messages.MsgCallContract) returns (blockchain.smart_contracts.messages.MsgCallContractResponse);
  
  // IndexContractEvent indexes a contract event
  rpc IndexContractEvent(blockchain.smart_contracts.messages.MsgIndexContractEvent) returns (blockchain.smart_contracts.messages.MsgIndexContractEventResponse);
  
  // SubscribeToContractEvents subscribes to contract events
  rpc SubscribeToContractEvents(blockchain.smart_contracts.messages.MsgSubscribeToContractEvents) returns (blockchain.smart_contracts.messages.MsgSubscribeToContractEventsResponse);
  
  // UnsubscribeFromContractEvents unsubscribes from contract events
  rpc UnsubscribeFromContractEvents(blockchain.smart_contracts.messages.MsgUnsubscribeFromContractEvents) returns (blockchain.smart_contracts.messages.MsgUnsubscribeFromContractEventsResponse);
}

// SmartContractQueryService handles smart contract state queries
service SmartContractQueryService {
  // GetContract retrieves a specific contract
  rpc GetContract(GetContractRequest) returns (GetContractResponse);
  
  // ListContracts lists contracts with pagination and filters
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse);
  
  // GetContractEvent retrieves a specific contract event
  rpc GetContractEvent(GetContractEventRequest) returns (GetContractEventResponse);
  
  // ListContractEvents lists contract events with pagination and filters
  rpc ListContractEvents(ListContractEventsRequest) returns (ListContractEventsResponse);
  
  // GetContractCall retrieves a specific contract call
  rpc GetContractCall(GetContractCallRequest) returns (GetContractCallResponse);
  
  // ListContractCalls lists contract calls with pagination and filters
  rpc ListContractCalls(ListContractCallsRequest) returns (ListContractCallsResponse);
  
  // GetSmartContractParams retrieves smart contract module parameters
  rpc GetSmartContractParams(GetSmartContractParamsRequest) returns (GetSmartContractParamsResponse);
  
  // GetSmartContractStats retrieves smart contract statistics
  rpc GetSmartContractStats(GetSmartContractStatsRequest) returns (GetSmartContractStatsResponse);
  
  // GetContractByAddress retrieves contract by address
  rpc GetContractByAddress(GetContractByAddressRequest) returns (GetContractByAddressResponse);
  
  // GetContractEventsByContract retrieves events for a contract
  rpc GetContractEventsByContract(GetContractEventsByContractRequest) returns (GetContractEventsByContractResponse);
  
  // GetContractCallsByContract retrieves calls for a contract
  rpc GetContractCallsByContract(GetContractCallsByContractRequest) returns (GetContractCallsByContractResponse);
  
  // GetContractCode retrieves contract source code
  rpc GetContractCode(GetContractCodeRequest) returns (GetContractCodeResponse);
  
  // GetContractABI retrieves contract ABI
  rpc GetContractABI(GetContractABIRequest) returns (GetContractABIResponse);
  
  // SearchContracts searches for contracts
  rpc SearchContracts(SearchContractsRequest) returns (SearchContractsResponse);
}

// Query request and response messages

message GetContractRequest {
  string contract_id = 1; // Contract ID
}

message GetContractResponse {
  blockchain.smart_contracts.messages.SmartContract contract = 1;
}

message ListContractsRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string contract_type = 3;  // Filter by contract type
  string status = 4;         // Filter by status
  string creator = 5;        // Filter by creator address
  bool is_verified = 6;      // Filter by verification status
  bool is_audited = 7;       // Filter by audit status
}

message ListContractsResponse {
  repeated blockchain.smart_contracts.messages.SmartContract contracts = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetContractEventRequest {
  string event_id = 1; // Contract event ID
}

message GetContractEventResponse {
  blockchain.smart_contracts.messages.ContractEvent event = 1;
}

message ListContractEventsRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string contract_id = 3;    // Filter by contract ID
  string event_name = 4;     // Filter by event name
  string caller = 5;         // Filter by caller address
  int64 start_time = 6;      // Filter by start time
  int64 end_time = 7;        // Filter by end time
}

message ListContractEventsResponse {
  repeated blockchain.smart_contracts.messages.ContractEvent events = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetContractCallRequest {
  string call_id = 1; // Contract call ID
}

message GetContractCallResponse {
  blockchain.smart_contracts.messages.ContractCall call = 1;
}

message ListContractCallsRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string contract_id = 3;    // Filter by contract ID
  string function_name = 4;  // Filter by function name
  string caller = 5;         // Filter by caller address
  bool is_successful = 6;    // Filter by success status
  int64 start_time = 7;      // Filter by start time
  int64 end_time = 8;        // Filter by end time
}

message ListContractCallsResponse {
  repeated blockchain.smart_contracts.messages.ContractCall calls = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetSmartContractParamsRequest {
  // No parameters needed
}

message GetSmartContractParamsResponse {
  blockchain.smart_contracts.messages.ContractParams params = 1;
}

message GetSmartContractStatsRequest {
  string time_period = 1; // Optional time period filter
}

message GetSmartContractStatsResponse {
  int64 total_contracts = 1;        // Total number of contracts
  int64 active_contracts = 2;       // Number of active contracts
  int64 verified_contracts = 3;     // Number of verified contracts
  int64 audited_contracts = 4;      // Number of audited contracts
  int64 total_calls = 5;           // Total number of calls
  int64 successful_calls = 6;       // Number of successful calls
  int64 failed_calls = 7;          // Number of failed calls
  string total_gas_used = 8;        // Total gas used
  string total_fees_collected = 9;  // Total fees collected
  string most_used_contract = 10;   // Most used contract
}

message GetContractByAddressRequest {
  string address = 1; // Contract address
}

message GetContractByAddressResponse {
  blockchain.smart_contracts.messages.SmartContract contract = 1;
}

message GetContractEventsByContractRequest {
  string contract_id = 1;           // Contract ID
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
}

message GetContractEventsByContractResponse {
  repeated blockchain.smart_contracts.messages.ContractEvent events = 1;
  string next_pagination_key = 2;   // Key for next page
}

message GetContractCallsByContractRequest {
  string contract_id = 1;           // Contract ID
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
}

message GetContractCallsByContractResponse {
  repeated blockchain.smart_contracts.messages.ContractCall calls = 1;
  string next_pagination_key = 2;   // Key for next page
}

message GetContractCodeRequest {
  string contract_id = 1; // Contract ID
}

message GetContractCodeResponse {
  string source_code = 1;           // Contract source code
  string bytecode = 2;              // Contract bytecode
  string compiler_version = 3;      // Compiler version
  string language = 4;              // Programming language
}

message GetContractABIRequest {
  string contract_id = 1; // Contract ID
}

message GetContractABIResponse {
  string abi = 1;                   // Contract ABI (JSON)
}

message SearchContractsRequest {
  string query = 1;                 // Search query
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
  string contract_type = 4;         // Filter by contract type
  string status = 5;                // Filter by status
}

message SearchContractsResponse {
  repeated blockchain.smart_contracts.messages.SmartContract contracts = 1;
  string next_pagination_key = 2;   // Key for next page
}
