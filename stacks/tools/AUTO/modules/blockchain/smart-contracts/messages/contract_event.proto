syntax = "proto3";

package blockchain.smart_contracts.messages;

import "blockchain/smart_contracts/enums/contract_type.proto";

option go_package = "github.com/chainrice/proto/blockchain/smart_contracts/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// ContractEvent represents an event emitted by a smart contract
message ContractEvent {
  string id = 1;                    // Unique event identifier
  string contract_id = 2;           // Source contract ID
  string contract_address = 3;      // Contract address
  string transaction_hash = 4;      // Transaction hash
  int64 block_height = 5;           // Block height
  int64 log_index = 6;              // Log index
  int64 timestamp = 7;              // Event timestamp
  
  // Event details
  string event_name = 8;            // Event name
  string event_signature = 9;       // Event signature (hash)
  repeated string topics = 10;      // Event topics
  string data = 11;                 // Event data (hex)
  
  // Event context
  string caller = 12;               // Function caller address
  string gas_used = 13;             // Gas used for transaction
  string gas_price = 14;            // Gas price
  int64 transaction_index = 15;     // Transaction index in block
  
  // Event parameters
  map<string, string> parameters = 16; // Decoded event parameters
  string raw_data = 17;             // Raw event data
  string decoded_data = 18;         // Decoded event data (JSON)
  
  // Event classification
  blockchain.smart_contracts.enums.ContractType contract_type = 19; // Contract type
  string event_category = 20;       // Event category
  string event_type = 21;           // Event type
  
  // Event metadata
  map<string, string> metadata = 22; // Additional metadata
  repeated string tags = 23;        // Event tags
  bool is_indexed = 24;             // Whether event is indexed
  int64 indexed_at = 25;            // Indexing timestamp
}

// ContractCall represents a call to a smart contract
message ContractCall {
  string id = 1;                    // Unique call identifier
  string contract_id = 2;           // Target contract ID
  string contract_address = 3;      // Contract address
  string caller = 4;                // Caller address (sdk.Address)
  string transaction_hash = 5;      // Transaction hash
  int64 block_height = 6;           // Block height
  int64 timestamp = 7;              // Call timestamp
  
  // Call details
  string function_name = 8;         // Function name
  string function_signature = 9;    // Function signature
  repeated string parameters = 10;  // Function parameters
  string return_value = 11;         // Return value
  
  // Call context
  string gas_limit = 12;            // Gas limit
  string gas_used = 13;             // Gas used
  string gas_price = 14;            // Gas price
  repeated Coin value = 15;         // ETH value sent
  
  // Call result
  bool is_successful = 16;          // Whether call was successful
  string error_message = 17;        // Error message if failed
  string revert_reason = 18;        // Revert reason if reverted
  
  // Call metadata
  map<string, string> metadata = 19; // Additional metadata
  int64 call_duration = 20;         // Call duration in milliseconds
  string call_type = 21;            // Call type (view, pure, payable)
}

// MsgEmitContractEvent emits a contract event
message MsgEmitContractEvent {
  string creator = 1;               // Event emitter address (sdk.Address)
  string contract_id = 2;           // Contract ID
  string event_name = 3;            // Event name
  repeated string topics = 4;       // Event topics
  string data = 5;                  // Event data
  map<string, string> parameters = 6; // Event parameters
  map<string, string> metadata = 7; // Additional metadata
}

// MsgEmitContractEventResponse returns the event result
message MsgEmitContractEventResponse {
  bool success = 1;                 // Event emission success status
  string event_id = 2;              // Created event ID
}

// MsgCallContract calls a smart contract function
message MsgCallContract {
  string creator = 1;               // Caller address (sdk.Address)
  string contract_id = 2;           // Target contract ID
  string function_name = 3;         // Function name
  repeated string parameters = 4;   // Function parameters
  string gas_limit = 5;             // Gas limit
  repeated Coin value = 6;          // ETH value to send
  string call_type = 7;             // Call type
}

// MsgCallContractResponse returns the call result
message MsgCallContractResponse {
  bool success = 1;                 // Call success status
  string call_id = 2;               // Created call ID
  string return_value = 3;          // Function return value
  string transaction_hash = 4;      // Transaction hash
}

// MsgIndexContractEvent indexes a contract event
message MsgIndexContractEvent {
  string creator = 1;               // Indexer address (sdk.Address)
  string event_id = 2;              // Event ID to index
  string index_name = 3;            // Index name
  map<string, string> index_data = 4; // Index data
}

// MsgIndexContractEventResponse returns the indexing result
message MsgIndexContractEventResponse {
  bool success = 1;                 // Indexing success status
  string index_id = 2;              // Created index ID
}

// MsgSubscribeToContractEvents subscribes to contract events
message MsgSubscribeToContractEvents {
  string creator = 1;               // Subscriber address (sdk.Address)
  string contract_id = 2;           // Contract ID to subscribe to
  repeated string event_names = 3;  // Event names to subscribe to
  string callback_url = 4;          // Callback URL
  map<string, string> filters = 5;  // Event filters
}

// MsgSubscribeToContractEventsResponse returns the subscription result
message MsgSubscribeToContractEventsResponse {
  bool success = 1;                 // Subscription success status
  string subscription_id = 2;       // Created subscription ID
}

// MsgUnsubscribeFromContractEvents unsubscribes from contract events
message MsgUnsubscribeFromContractEvents {
  string creator = 1;               // Subscriber address (sdk.Address)
  string subscription_id = 2;       // Subscription ID to remove
}

// MsgUnsubscribeFromContractEventsResponse returns the unsubscription result
message MsgUnsubscribeFromContractEventsResponse {
  bool success = 1;                 // Unsubscription success status
}
