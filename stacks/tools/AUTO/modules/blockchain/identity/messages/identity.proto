syntax = "proto3";

package blockchain.identity.messages;

import "blockchain/identity/enums/identity_type.proto";
import "blockchain/identity/enums/identity_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/identity/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// Identity represents a blockchain identity
message Identity {
  string id = 1;                    // Unique identity identifier
  string address = 2;               // Identity address (sdk.Address)
  string name = 3;                  // Identity name
  string description = 4;           // Identity description
  string creator = 5;               // Identity creator address (sdk.Address)
  int64 timestamp = 6;              // Identity creation timestamp
  
  // Identity classification
  blockchain.identity.enums.IdentityType identity_type = 7; // Type of identity
  blockchain.identity.enums.IdentityStatus status = 8; // Current identity status
  
  // Identity information
  string display_name = 9;          // Display name
  string avatar_url = 10;           // Avatar URL
  string website = 11;              // Website URL
  string email = 12;                // Email address
  string phone = 13;                // Phone number
  
  // Verification information
  bool is_verified = 14;            // Whether identity is verified
  repeated string verifiers = 15;   // List of verifier addresses
  repeated string verification_methods = 16; // Verification methods used
  int64 verification_time = 17;     // Verification timestamp
  string verification_proof = 18;   // Verification proof
  
  // Reputation and trust
  string reputation_score = 19;     // Reputation score
  string trust_level = 20;          // Trust level
  repeated string endorsements = 21; // Endorsements from other identities
  int64 endorsement_count = 22;     // Number of endorsements
  
  // KYC/AML information
  bool kyc_completed = 23;          // Whether KYC is completed
  bool aml_verified = 24;           // Whether AML is verified
  string compliance_level = 25;     // Compliance level
  repeated string compliance_documents = 26; // Compliance document hashes
  
  // Permissions and roles
  repeated string permissions = 27; // Identity permissions
  repeated string roles = 28;       // Identity roles
  repeated string capabilities = 29; // Identity capabilities
  
  // Geographic and legal
  string country = 30;              // Country code
  string jurisdiction = 31;         // Legal jurisdiction
  string legal_name = 32;           // Legal name
  string registration_number = 33;  // Registration number
  
  // Metadata and attributes
  map<string, string> attributes = 34; // Additional attributes
  map<string, string> metadata = 35; // Additional metadata
  int64 last_updated = 36;          // Last update timestamp
  int64 expiry_time = 37;           // Identity expiry timestamp
}

// IdentityParams defines the parameters for the identity module
message IdentityParams {
  string authority = 1;             // Module authority address
  repeated string trusted_verifiers = 2; // Trusted verifier addresses
  string min_reputation_score = 3;  // Minimum reputation score
  int64 identity_expiry_time = 4;   // Identity expiry time
  bool require_kyc = 5;             // Whether KYC is required
  bool require_aml = 6;             // Whether AML is required
  string verification_fee = 7;      // Verification fee
  int64 max_identities_per_address = 8; // Maximum identities per address
}

// MsgCreateIdentity creates a new identity
message MsgCreateIdentity {
  string creator = 1;               // Creator address (sdk.Address)
  string name = 2;                  // Identity name
  string description = 3;           // Identity description
  blockchain.identity.enums.IdentityType identity_type = 4; // Identity type
  string display_name = 5;          // Display name
  string website = 6;               // Website URL
  string email = 7;                 // Email address
  string country = 8;               // Country code
  map<string, string> attributes = 9; // Additional attributes
}

// MsgCreateIdentityResponse returns the created identity
message MsgCreateIdentityResponse {
  string identity_id = 1;           // Created identity ID
}

// MsgUpdateIdentity updates an existing identity
message MsgUpdateIdentity {
  string creator = 1;               // Updater address (sdk.Address)
  string identity_id = 2;           // Identity ID to update
  string name = 3;                  // Updated name
  string description = 4;           // Updated description
  string display_name = 5;          // Updated display name
  string website = 6;               // Updated website
  string email = 7;                 // Updated email
  map<string, string> attributes = 8; // Updated attributes
}

// MsgUpdateIdentityResponse returns the update result
message MsgUpdateIdentityResponse {
  bool success = 1;                 // Update success status
}

// MsgVerifyIdentity verifies an identity
message MsgVerifyIdentity {
  string creator = 1;               // Verifier address (sdk.Address)
  string identity_id = 2;           // Identity ID to verify
  string verification_method = 3;   // Verification method
  string verification_proof = 4;    // Verification proof
  string verification_data = 5;     // Additional verification data
}

// MsgVerifyIdentityResponse returns the verification result
message MsgVerifyIdentityResponse {
  bool success = 1;                 // Verification success status
  blockchain.identity.enums.IdentityStatus new_status = 2; // New status
}

// MsgRevokeIdentity revokes an identity
message MsgRevokeIdentity {
  string creator = 1;               // Revoker address (sdk.Address)
  string identity_id = 2;           // Identity ID to revoke
  string reason = 3;                // Revocation reason
}

// MsgRevokeIdentityResponse returns the revocation result
message MsgRevokeIdentityResponse {
  bool success = 1;                 // Revocation success status
}

// MsgEndorseIdentity endorses an identity
message MsgEndorseIdentity {
  string creator = 1;               // Endorser address (sdk.Address)
  string identity_id = 2;           // Identity ID to endorse
  string endorsement_type = 3;      // Type of endorsement
  string endorsement_data = 4;      // Endorsement data
  int64 endorsement_weight = 5;     // Endorsement weight
}

// MsgEndorseIdentityResponse returns the endorsement result
message MsgEndorseIdentityResponse {
  bool success = 1;                 // Endorsement success status
  string endorsement_id = 2;        // Created endorsement ID
}
