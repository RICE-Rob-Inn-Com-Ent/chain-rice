syntax = "proto3";

package blockchain.identity.messages;

import "blockchain/identity/enums/identity_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/identity/messages";

// CredentialType defines the type of credential
enum CredentialType {
  // CREDENTIAL_TYPE_UNSPECIFIED indicates an unspecified credential type
  CREDENTIAL_TYPE_UNSPECIFIED = 0;
  
  // CREDENTIAL_TYPE_EMAIL represents an email credential
  CREDENTIAL_TYPE_EMAIL = 1;
  
  // CREDENTIAL_TYPE_PHONE represents a phone number credential
  CREDENTIAL_TYPE_PHONE = 2;
  
  // CREDENTIAL_TYPE_PASSPORT represents a passport credential
  CREDENTIAL_TYPE_PASSPORT = 3;
  
  // CREDENTIAL_TYPE_DRIVER_LICENSE represents a driver's license credential
  CREDENTIAL_TYPE_DRIVER_LICENSE = 4;
  
  // CREDENTIAL_TYPE_NATIONAL_ID represents a national ID credential
  CREDENTIAL_TYPE_NATIONAL_ID = 5;
  
  // CREDENTIAL_TYPE_BANK_ACCOUNT represents a bank account credential
  CREDENTIAL_TYPE_BANK_ACCOUNT = 6;
  
  // CREDENTIAL_TYPE_CREDIT_CARD represents a credit card credential
  CREDENTIAL_TYPE_CREDIT_CARD = 7;
  
  // CREDENTIAL_TYPE_EDUCATION represents an education credential
  CREDENTIAL_TYPE_EDUCATION = 8;
  
  // CREDENTIAL_TYPE_EMPLOYMENT represents an employment credential
  CREDENTIAL_TYPE_EMPLOYMENT = 9;
  
  // CREDENTIAL_TYPE_MEDICAL represents a medical credential
  CREDENTIAL_TYPE_MEDICAL = 10;
  
  // CREDENTIAL_TYPE_PROFESSIONAL represents a professional credential
  CREDENTIAL_TYPE_PROFESSIONAL = 11;
  
  // CREDENTIAL_TYPE_CERTIFICATE represents a certificate credential
  CREDENTIAL_TYPE_CERTIFICATE = 12;
  
  // CREDENTIAL_TYPE_BIOMETRIC represents a biometric credential
  CREDENTIAL_TYPE_BIOMETRIC = 13;
  
  // CREDENTIAL_TYPE_SOCIAL_MEDIA represents a social media credential
  CREDENTIAL_TYPE_SOCIAL_MEDIA = 14;
  
  // CREDENTIAL_TYPE_CUSTOM represents a custom credential
  CREDENTIAL_TYPE_CUSTOM = 15;
}

// Credential represents a verifiable credential
message Credential {
  string id = 1;                    // Unique credential identifier
  string identity_id = 2;           // Associated identity ID
  string issuer = 3;                // Credential issuer address (sdk.Address)
  string holder = 4;                // Credential holder address (sdk.Address)
  int64 timestamp = 5;              // Credential creation timestamp
  
  // Credential details
  CredentialType credential_type = 6; // Type of credential
  blockchain.identity.enums.IdentityStatus status = 7; // Credential status
  
  // Credential content
  string title = 8;                 // Credential title
  string description = 9;           // Credential description
  string credential_data = 10;      // Credential data (JSON)
  string credential_hash = 11;      // Credential content hash
  
  // Validity and expiration
  int64 issued_date = 12;           // Issued date timestamp
  int64 expiry_date = 13;           // Expiry date timestamp
  bool is_expired = 14;             // Whether credential is expired
  bool is_revoked = 15;             // Whether credential is revoked
  
  // Verification information
  string verification_proof = 16;   // Verification proof
  repeated string verification_methods = 17; // Verification methods
  string signature = 18;            // Issuer signature
  string public_key = 19;           // Issuer public key
  
  // Revocation information
  string revocation_reason = 20;    // Revocation reason
  int64 revocation_time = 21;       // Revocation timestamp
  string revoker = 22;              // Revoker address
  
  // Schema and version
  string schema_id = 23;            // Credential schema ID
  string schema_version = 24;       // Schema version
  string credential_version = 25;   // Credential version
  
  // Metadata and attributes
  map<string, string> attributes = 26; // Credential attributes
  map<string, string> metadata = 27; // Additional metadata
  int64 last_updated = 28;          // Last update timestamp
  
  // Usage tracking
  int64 usage_count = 29;           // Number of times used
  repeated string usage_history = 30; // Usage history
  bool is_shareable = 31;           // Whether credential is shareable
}

// CredentialProof represents proof of credential validity
message CredentialProof {
  string credential_id = 1;         // Credential ID
  string proof_type = 2;            // Type of proof
  string proof_value = 3;           // Proof value
  string verifier = 4;              // Verifier address
  int64 verification_time = 5;      // Verification timestamp
  bool is_valid = 6;                // Whether proof is valid
  string validation_result = 7;     // Validation result details
}

// MsgIssueCredential issues a new credential
message MsgIssueCredential {
  string creator = 1;               // Issuer address (sdk.Address)
  string identity_id = 2;           // Identity ID
  string holder = 3;                // Holder address
  CredentialType credential_type = 4; // Credential type
  string title = 5;                 // Credential title
  string description = 6;           // Credential description
  string credential_data = 7;       // Credential data
  int64 expiry_date = 8;            // Expiry date
  string schema_id = 9;             // Schema ID
  map<string, string> attributes = 10; // Credential attributes
}

// MsgIssueCredentialResponse returns the issued credential
message MsgIssueCredentialResponse {
  string credential_id = 1;         // Created credential ID
}

// MsgVerifyCredential verifies a credential
message MsgVerifyCredential {
  string creator = 1;               // Verifier address (sdk.Address)
  string credential_id = 2;         // Credential ID to verify
  string verification_method = 3;   // Verification method
  string verification_data = 4;     // Additional verification data
}

// MsgVerifyCredentialResponse returns the verification result
message MsgVerifyCredentialResponse {
  bool success = 1;                 // Verification success status
  bool is_valid = 2;                // Whether credential is valid
  string validation_result = 3;     // Validation result details
  CredentialProof proof = 4;        // Verification proof
}

// MsgRevokeCredential revokes a credential
message MsgRevokeCredential {
  string creator = 1;               // Revoker address (sdk.Address)
  string credential_id = 2;         // Credential ID to revoke
  string reason = 3;                // Revocation reason
}

// MsgRevokeCredentialResponse returns the revocation result
message MsgRevokeCredentialResponse {
  bool success = 1;                 // Revocation success status
}

// MsgUpdateCredential updates an existing credential
message MsgUpdateCredential {
  string creator = 1;               // Updater address (sdk.Address)
  string credential_id = 2;         // Credential ID to update
  string title = 3;                 // Updated title
  string description = 4;           // Updated description
  string credential_data = 5;       // Updated credential data
  map<string, string> attributes = 6; // Updated attributes
}

// MsgUpdateCredentialResponse returns the update result
message MsgUpdateCredentialResponse {
  bool success = 1;                 // Update success status
}

// MsgShareCredential shares a credential
message MsgShareCredential {
  string creator = 1;               // Credential holder address (sdk.Address)
  string credential_id = 2;         // Credential ID to share
  string recipient = 3;             // Recipient address
  int64 expiry_time = 4;            // Share expiry time
  string share_permissions = 5;     // Share permissions
}

// MsgShareCredentialResponse returns the sharing result
message MsgShareCredentialResponse {
  bool success = 1;                 // Sharing success status
  string share_id = 2;              // Created share ID
}
