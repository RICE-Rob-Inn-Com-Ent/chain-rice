syntax = "proto3";

package blockchain.identity.services;

import "blockchain/identity/messages/identity.proto";
import "blockchain/identity/messages/credential.proto";

option go_package = "github.com/chainrice/proto/blockchain/identity/services";

// IdentityMsgService handles state-changing identity operations
service IdentityMsgService {
  // CreateIdentity creates a new identity
  rpc CreateIdentity(blockchain.identity.messages.MsgCreateIdentity) returns (blockchain.identity.messages.MsgCreateIdentityResponse);
  
  // UpdateIdentity updates an existing identity
  rpc UpdateIdentity(blockchain.identity.messages.MsgUpdateIdentity) returns (blockchain.identity.messages.MsgUpdateIdentityResponse);
  
  // VerifyIdentity verifies an identity
  rpc VerifyIdentity(blockchain.identity.messages.MsgVerifyIdentity) returns (blockchain.identity.messages.MsgVerifyIdentityResponse);
  
  // RevokeIdentity revokes an identity
  rpc RevokeIdentity(blockchain.identity.messages.MsgRevokeIdentity) returns (blockchain.identity.messages.MsgRevokeIdentityResponse);
  
  // EndorseIdentity endorses an identity
  rpc EndorseIdentity(blockchain.identity.messages.MsgEndorseIdentity) returns (blockchain.identity.messages.MsgEndorseIdentityResponse);
  
  // IssueCredential issues a new credential
  rpc IssueCredential(blockchain.identity.messages.MsgIssueCredential) returns (blockchain.identity.messages.MsgIssueCredentialResponse);
  
  // VerifyCredential verifies a credential
  rpc VerifyCredential(blockchain.identity.messages.MsgVerifyCredential) returns (blockchain.identity.messages.MsgVerifyCredentialResponse);
  
  // RevokeCredential revokes a credential
  rpc RevokeCredential(blockchain.identity.messages.MsgRevokeCredential) returns (blockchain.identity.messages.MsgRevokeCredentialResponse);
  
  // UpdateCredential updates an existing credential
  rpc UpdateCredential(blockchain.identity.messages.MsgUpdateCredential) returns (blockchain.identity.messages.MsgUpdateCredentialResponse);
  
  // ShareCredential shares a credential
  rpc ShareCredential(blockchain.identity.messages.MsgShareCredential) returns (blockchain.identity.messages.MsgShareCredentialResponse);
}

// IdentityQueryService handles identity state queries
service IdentityQueryService {
  // GetIdentity retrieves a specific identity
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  
  // ListIdentities lists identities with pagination and filters
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  
  // GetCredential retrieves a specific credential
  rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse);
  
  // ListCredentials lists credentials with pagination and filters
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  
  // GetIdentityParams retrieves identity module parameters
  rpc GetIdentityParams(GetIdentityParamsRequest) returns (GetIdentityParamsResponse);
  
  // GetIdentityStats retrieves identity statistics
  rpc GetIdentityStats(GetIdentityStatsRequest) returns (GetIdentityStatsResponse);
  
  // GetIdentityByAddress retrieves identity by address
  rpc GetIdentityByAddress(GetIdentityByAddressRequest) returns (GetIdentityByAddressResponse);
  
  // GetCredentialsByIdentity retrieves credentials for an identity
  rpc GetCredentialsByIdentity(GetCredentialsByIdentityRequest) returns (GetCredentialsByIdentityResponse);
  
  // VerifyIdentityProof verifies identity proof
  rpc VerifyIdentityProof(VerifyIdentityProofRequest) returns (VerifyIdentityProofResponse);
  
  // GetVerificationHistory retrieves verification history
  rpc GetVerificationHistory(GetVerificationHistoryRequest) returns (GetVerificationHistoryResponse);
  
  // GetEndorsements retrieves endorsements for an identity
  rpc GetEndorsements(GetEndorsementsRequest) returns (GetEndorsementsResponse);
  
  // SearchIdentities searches for identities
  rpc SearchIdentities(SearchIdentitiesRequest) returns (SearchIdentitiesResponse);
}

// Query request and response messages

message GetIdentityRequest {
  string identity_id = 1; // Identity ID
}

message GetIdentityResponse {
  blockchain.identity.messages.Identity identity = 1;
}

message ListIdentitiesRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string identity_type = 3;  // Filter by identity type
  string status = 4;         // Filter by status
  string country = 5;        // Filter by country
  bool is_verified = 6;      // Filter by verification status
  string creator = 7;        // Filter by creator address
}

message ListIdentitiesResponse {
  repeated blockchain.identity.messages.Identity identities = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetCredentialRequest {
  string credential_id = 1; // Credential ID
}

message GetCredentialResponse {
  blockchain.identity.messages.Credential credential = 1;
}

message ListCredentialsRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string credential_type = 3; // Filter by credential type
  string status = 4;         // Filter by status
  string issuer = 5;         // Filter by issuer address
  string holder = 6;         // Filter by holder address
  string identity_id = 7;    // Filter by identity ID
}

message ListCredentialsResponse {
  repeated blockchain.identity.messages.Credential credentials = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetIdentityParamsRequest {
  // No parameters needed
}

message GetIdentityParamsResponse {
  blockchain.identity.messages.IdentityParams params = 1;
}

message GetIdentityStatsRequest {
  string time_period = 1; // Optional time period filter
}

message GetIdentityStatsResponse {
  int64 total_identities = 1;       // Total number of identities
  int64 active_identities = 2;      // Number of active identities
  int64 verified_identities = 3;    // Number of verified identities
  int64 total_credentials = 4;      // Total number of credentials
  int64 active_credentials = 5;     // Number of active credentials
  int64 revoked_credentials = 6;    // Number of revoked credentials
  string verification_rate = 7;     // Verification rate percentage
  string most_common_identity_type = 8; // Most common identity type
  string most_common_credential_type = 9; // Most common credential type
}

message GetIdentityByAddressRequest {
  string address = 1; // Address to query
}

message GetIdentityByAddressResponse {
  repeated blockchain.identity.messages.Identity identities = 1;
}

message GetCredentialsByIdentityRequest {
  string identity_id = 1;           // Identity ID
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
}

message GetCredentialsByIdentityResponse {
  repeated blockchain.identity.messages.Credential credentials = 1;
  string next_pagination_key = 2;   // Key for next page
}

message VerifyIdentityProofRequest {
  string identity_id = 1;           // Identity ID
  string proof_data = 2;            // Proof data to verify
  string verification_method = 3;   // Verification method
}

message VerifyIdentityProofResponse {
  bool is_valid = 1;                // Whether proof is valid
  string validation_result = 2;     // Validation result details
  string verification_timestamp = 3; // Verification timestamp
}

message GetVerificationHistoryRequest {
  string identity_id = 1;           // Identity ID
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
}

message GetVerificationHistoryResponse {
  repeated blockchain.identity.messages.CredentialProof verifications = 1;
  string next_pagination_key = 2;   // Key for next page
}

message GetEndorsementsRequest {
  string identity_id = 1;           // Identity ID
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
}

message GetEndorsementsResponse {
  repeated string endorsements = 1; // List of endorsement IDs
  string next_pagination_key = 2;   // Key for next page
}

message SearchIdentitiesRequest {
  string query = 1;                 // Search query
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
  string identity_type = 4;         // Filter by identity type
  string status = 5;                // Filter by status
}

message SearchIdentitiesResponse {
  repeated blockchain.identity.messages.Identity identities = 1;
  string next_pagination_key = 2;   // Key for next page
}
