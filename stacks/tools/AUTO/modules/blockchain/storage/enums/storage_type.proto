syntax = "proto3";

package blockchain.storage.enums;

option go_package = "github.com/chainrice/proto/blockchain/storage/enums";

// StorageType defines the different types of blockchain storage
enum StorageType {
  // STORAGE_TYPE_UNSPECIFIED indicates an unspecified storage type
  STORAGE_TYPE_UNSPECIFIED = 0;
  
  // STORAGE_TYPE_STATE represents blockchain state storage
  STORAGE_TYPE_STATE = 1;
  
  // STORAGE_TYPE_TRANSACTION represents transaction storage
  STORAGE_TYPE_TRANSACTION = 2;
  
  // STORAGE_TYPE_BLOCK represents block storage
  STORAGE_TYPE_BLOCK = 3;
  
  // STORAGE_TYPE_ACCOUNT represents account storage
  STORAGE_TYPE_ACCOUNT = 4;
  
  // STORAGE_TYPE_CONTRACT represents smart contract storage
  STORAGE_TYPE_CONTRACT = 5;
  
  // STORAGE_TYPE_IPFS represents IPFS storage
  STORAGE_TYPE_IPFS = 6;
  
  // STORAGE_TYPE_ARWEAVE represents Arweave storage
  STORAGE_TYPE_ARWEAVE = 7;
  
  // STORAGE_TYPE_FILE_COIN represents Filecoin storage
  STORAGE_TYPE_FILE_COIN = 8;
  
  // STORAGE_TYPE_SWARM represents Swarm storage
  STORAGE_TYPE_SWARM = 9;
  
  // STORAGE_TYPE_AMAZON_S3 represents Amazon S3 storage
  STORAGE_TYPE_AMAZON_S3 = 10;
  
  // STORAGE_TYPE_GOOGLE_CLOUD represents Google Cloud storage
  STORAGE_TYPE_GOOGLE_CLOUD = 11;
  
  // STORAGE_TYPE_AZURE represents Azure storage
  STORAGE_TYPE_AZURE = 12;
  
  // STORAGE_TYPE_DATABASE represents database storage
  STORAGE_TYPE_DATABASE = 13;
  
  // STORAGE_TYPE_CACHE represents cache storage
  STORAGE_TYPE_CACHE = 14;
  
  // STORAGE_TYPE_MEMORY represents in-memory storage
  STORAGE_TYPE_MEMORY = 15;
  
  // STORAGE_TYPE_DISK represents disk storage
  STORAGE_TYPE_DISK = 16;
  
  // STORAGE_TYPE_SSD represents SSD storage
  STORAGE_TYPE_SSD = 17;
  
  // STORAGE_TYPE_HDD represents HDD storage
  STORAGE_TYPE_HDD = 18;
  
  // STORAGE_TYPE_NETWORK represents network storage
  STORAGE_TYPE_NETWORK = 19;
  
  // STORAGE_TYPE_DISTRIBUTED represents distributed storage
  STORAGE_TYPE_DISTRIBUTED = 20;
  
  // STORAGE_TYPE_CUSTOM represents custom storage
  STORAGE_TYPE_CUSTOM = 21;
}
