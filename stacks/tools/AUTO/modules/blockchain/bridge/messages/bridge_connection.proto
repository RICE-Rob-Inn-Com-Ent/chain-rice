syntax = "proto3";

package blockchain.bridge.messages;

import "blockchain/bridge/enums/bridge_type.proto";
import "blockchain/bridge/enums/bridge_status.proto";
import "blockchain/bridge/enums/bridge_direction.proto";

option go_package = "github.com/chainrice/proto/blockchain/bridge/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// BridgeConnection represents a connection between two blockchains
message BridgeConnection {
  string id = 1;                    // Unique identifier for the bridge connection
  string name = 2;                  // Human-readable name for the bridge
  string description = 3;           // Description of the bridge connection
  string creator = 4;               // Address of the bridge creator (sdk.Address)
  int64 timestamp = 5;              // Creation timestamp
  
  // Source chain information
  string source_chain_id = 6;       // Source blockchain identifier
  string source_chain_name = 7;     // Source blockchain name
  string source_contract_address = 8; // Source contract address
  
  // Destination chain information
  string destination_chain_id = 9;  // Destination blockchain identifier
  string destination_chain_name = 10; // Destination blockchain name
  string destination_contract_address = 11; // Destination contract address
  
  // Bridge configuration
  blockchain.bridge.enums.BridgeType bridge_type = 12; // Type of bridge
  blockchain.bridge.enums.BridgeStatus status = 13;    // Current status
  blockchain.bridge.enums.BridgeDirection direction = 14; // Transfer direction
  
  // Bridge parameters
  string min_transfer_amount = 15;  // Minimum transfer amount
  string max_transfer_amount = 16;  // Maximum transfer amount
  string fee_percentage = 17;       // Fee percentage (as string)
  repeated Coin supported_tokens = 18; // Supported tokens for bridging
  
  // Security parameters
  int64 confirmation_blocks = 19;   // Required confirmation blocks
  string security_deposit = 20;     // Security deposit amount
  repeated string validators = 21;  // List of validator addresses
  
  // Metadata
  map<string, string> metadata = 22; // Additional metadata
  int64 last_updated = 23;          // Last update timestamp
}

// BridgeParams defines the parameters for the bridge module
message BridgeParams {
  string authority = 1;             // Module authority address
  repeated Coin default_fees = 2;   // Default bridge fees
  string max_fee_percentage = 3;    // Maximum allowed fee percentage
  int64 min_confirmation_blocks = 4; // Minimum confirmation blocks
  int64 max_confirmation_blocks = 5; // Maximum confirmation blocks
  string emergency_threshold = 6;   // Emergency pause threshold
  bool emergency_enabled = 7;       // Emergency pause enabled
}

// MsgCreateBridgeConnection creates a new bridge connection
message MsgCreateBridgeConnection {
  string creator = 1;               // Creator address (sdk.Address)
  string name = 2;                  // Bridge name
  string description = 3;           // Bridge description
  string source_chain_id = 4;       // Source chain ID
  string destination_chain_id = 5;  // Destination chain ID
  blockchain.bridge.enums.BridgeType bridge_type = 6; // Bridge type
  repeated Coin supported_tokens = 7; // Supported tokens
}

// MsgCreateBridgeConnectionResponse returns the created bridge connection
message MsgCreateBridgeConnectionResponse {
  string bridge_id = 1;             // Created bridge ID
}

// MsgUpdateBridgeConnection updates an existing bridge connection
message MsgUpdateBridgeConnection {
  string creator = 1;               // Creator address (sdk.Address)
  string bridge_id = 2;             // Bridge ID to update
  string name = 3;                  // Updated name
  string description = 4;           // Updated description
  blockchain.bridge.enums.BridgeStatus status = 5; // Updated status
  repeated Coin supported_tokens = 6; // Updated supported tokens
}

// MsgUpdateBridgeConnectionResponse returns the update result
message MsgUpdateBridgeConnectionResponse {
  bool success = 1;                 // Update success status
}

// MsgDeleteBridgeConnection deletes a bridge connection
message MsgDeleteBridgeConnection {
  string creator = 1;               // Creator address (sdk.Address)
  string bridge_id = 2;             // Bridge ID to delete
}

// MsgDeleteBridgeConnectionResponse returns the deletion result
message MsgDeleteBridgeConnectionResponse {
  bool success = 1;                 // Deletion success status
}
