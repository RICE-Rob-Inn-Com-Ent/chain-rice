syntax = "proto3";

package blockchain.bridge.messages;

import "blockchain/bridge/enums/bridge_direction.proto";

option go_package = "github.com/chainrice/proto/blockchain/bridge/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// BridgeTransferStatus defines the status of a bridge transfer
enum BridgeTransferStatus {
  // BRIDGE_TRANSFER_STATUS_UNSPECIFIED indicates an unspecified status
  BRIDGE_TRANSFER_STATUS_UNSPECIFIED = 0;
  
  // BRIDGE_TRANSFER_STATUS_PENDING indicates the transfer is pending
  BRIDGE_TRANSFER_STATUS_PENDING = 1;
  
  // BRIDGE_TRANSFER_STATUS_CONFIRMED indicates the transfer is confirmed
  BRIDGE_TRANSFER_STATUS_CONFIRMED = 2;
  
  // BRIDGE_TRANSFER_STATUS_PROCESSING indicates the transfer is being processed
  BRIDGE_TRANSFER_STATUS_PROCESSING = 3;
  
  // BRIDGE_TRANSFER_STATUS_COMPLETED indicates the transfer is completed
  BRIDGE_TRANSFER_STATUS_COMPLETED = 4;
  
  // BRIDGE_TRANSFER_STATUS_FAILED indicates the transfer failed
  BRIDGE_TRANSFER_STATUS_FAILED = 5;
  
  // BRIDGE_TRANSFER_STATUS_CANCELLED indicates the transfer was cancelled
  BRIDGE_TRANSFER_STATUS_CANCELLED = 6;
  
  // BRIDGE_TRANSFER_STATUS_REFUNDED indicates the transfer was refunded
  BRIDGE_TRANSFER_STATUS_REFUNDED = 7;
}

// BridgeTransfer represents a cross-chain token transfer
message BridgeTransfer {
  string id = 1;                    // Unique transfer identifier
  string bridge_id = 2;             // Associated bridge connection ID
  string sender = 3;                // Sender address (sdk.Address)
  string recipient = 4;             // Recipient address (sdk.Address)
  int64 timestamp = 5;              // Transfer timestamp
  
  // Transfer details
  repeated Coin amount = 6;         // Transfer amount
  blockchain.bridge.enums.BridgeDirection direction = 7; // Transfer direction
  
  // Chain information
  string source_chain_id = 8;       // Source chain identifier
  string destination_chain_id = 9;  // Destination chain identifier
  string source_tx_hash = 10;       // Source transaction hash
  string destination_tx_hash = 11;  // Destination transaction hash
  
  // Status and processing
  BridgeTransferStatus status = 12; // Current transfer status
  int64 confirmation_blocks = 13;   // Confirmation block count
  int64 block_height = 14;          // Block height when initiated
  
  // Fees and costs
  repeated Coin fees = 15;          // Bridge fees paid
  repeated Coin gas_costs = 16;     // Gas costs
  
  // Validation and security
  repeated string validators = 17;  // Validating addresses
  string merkle_proof = 18;         // Merkle proof for validation
  string signature = 19;            // Transfer signature
  
  // Metadata
  map<string, string> metadata = 20; // Additional metadata
  string memo = 21;                 // Transfer memo
  int64 expiry_time = 22;           // Transfer expiry timestamp
}

// MsgInitiateBridgeTransfer initiates a new bridge transfer
message MsgInitiateBridgeTransfer {
  string creator = 1;               // Creator address (sdk.Address)
  string bridge_id = 2;             // Bridge connection ID
  string recipient = 3;             // Recipient address
  repeated Coin amount = 4;         // Transfer amount
  blockchain.bridge.enums.BridgeDirection direction = 5; // Transfer direction
  string destination_chain_id = 6;  // Destination chain ID
  string memo = 7;                  // Transfer memo
  int64 expiry_time = 8;            // Expiry timestamp
}

// MsgInitiateBridgeTransferResponse returns the initiated transfer
message MsgInitiateBridgeTransferResponse {
  string transfer_id = 1;           // Created transfer ID
  string source_tx_hash = 2;        // Source transaction hash
}

// MsgConfirmBridgeTransfer confirms a bridge transfer
message MsgConfirmBridgeTransfer {
  string creator = 1;               // Confirmer address (sdk.Address)
  string transfer_id = 2;           // Transfer ID to confirm
  string merkle_proof = 3;          // Merkle proof
  string signature = 4;             // Confirmation signature
  repeated string validator_addresses = 5; // Validator addresses
}

// MsgConfirmBridgeTransferResponse returns the confirmation result
message MsgConfirmBridgeTransferResponse {
  bool success = 1;                 // Confirmation success status
  string destination_tx_hash = 2;   // Destination transaction hash
}

// MsgCompleteBridgeTransfer completes a bridge transfer
message MsgCompleteBridgeTransfer {
  string creator = 1;               // Completer address (sdk.Address)
  string transfer_id = 2;           // Transfer ID to complete
  string destination_tx_hash = 3;   // Destination transaction hash
  repeated string validator_addresses = 4; // Validator addresses
}

// MsgCompleteBridgeTransferResponse returns the completion result
message MsgCompleteBridgeTransferResponse {
  bool success = 1;                 // Completion success status
}

// MsgCancelBridgeTransfer cancels a bridge transfer
message MsgCancelBridgeTransfer {
  string creator = 1;               // Canceller address (sdk.Address)
  string transfer_id = 2;           // Transfer ID to cancel
  string reason = 3;                // Cancellation reason
}

// MsgCancelBridgeTransferResponse returns the cancellation result
message MsgCancelBridgeTransferResponse {
  bool success = 1;                 // Cancellation success status
}

// MsgRefundBridgeTransfer refunds a failed bridge transfer
message MsgRefundBridgeTransfer {
  string creator = 1;               // Refunder address (sdk.Address)
  string transfer_id = 2;           // Transfer ID to refund
  string reason = 3;                // Refund reason
}

// MsgRefundBridgeTransferResponse returns the refund result
message MsgRefundBridgeTransferResponse {
  bool success = 1;                 // Refund success status
}
