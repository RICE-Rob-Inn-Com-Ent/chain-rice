syntax = "proto3";

package blockchain.oracles.messages;

import "blockchain/oracles/enums/oracle_type.proto";
import "blockchain/oracles/enums/oracle_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/oracles/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// OracleData represents data from an oracle
message OracleData {
  string id = 1;                    // Unique data identifier
  string oracle_id = 2;             // Source oracle ID
  string request_id = 3;            // Request ID
  int64 timestamp = 4;              // Data timestamp
  
  // Data content
  string data = 5;                  // Oracle data (JSON)
  string data_hash = 6;             // Data hash
  blockchain.oracles.enums.OracleType data_type = 7; // Data type
  string symbol = 8;                // Asset symbol (for price data)
  
  // Data validation
  bool is_verified = 9;             // Whether data is verified
  repeated string verifiers = 10;   // Verifier addresses
  string verification_proof = 11;   // Verification proof
  blockchain.oracles.enums.OracleStatus verification_status = 12; // Verification status
  
  // Consensus information
  bool consensus_reached = 13;      // Whether consensus is reached
  string consensus_value = 14;      // Consensus value
  repeated string consensus_participants = 15; // Consensus participants
  string consensus_threshold = 16;  // Consensus threshold used
  
  // Data quality
  string confidence_score = 17;     // Data confidence score
  string accuracy_score = 18;       // Data accuracy score
  string reliability_score = 19;    // Data reliability score
  repeated string quality_metrics = 20; // Quality metrics
  
  // Source information
  string source_url = 21;           // Source URL
  string source_method = 22;        // Source method
  string source_timestamp = 23;     // Source timestamp
  string source_signature = 24;     // Source signature
  
  // Request context
  string requester = 25;            // Requesting address
  string request_purpose = 26;      // Request purpose
  repeated Coin request_fees = 27;  // Request fees paid
  string request_deadline = 28;     // Request deadline
  
  // Metadata
  map<string, string> metadata = 29; // Additional metadata
  int64 created_time = 30;          // Creation timestamp
  int64 expiry_time = 31;           // Data expiry timestamp
}

// OracleRequest represents a request for oracle data
message OracleRequest {
  string id = 1;                    // Unique request identifier
  string requester = 2;             // Requester address (sdk.Address)
  string oracle_id = 3;             // Target oracle ID
  int64 timestamp = 4;              // Request timestamp
  
  // Request details
  string request_type = 5;          // Type of request
  string symbol = 6;                // Asset symbol (for price requests)
  string parameters = 7;            // Request parameters (JSON)
  string callback_contract = 8;     // Callback contract address
  
  // Request configuration
  int64 timeout = 9;                // Request timeout
  int64 max_confirmations = 10;     // Maximum confirmations
  string consensus_threshold = 11;  // Consensus threshold
  bool require_consensus = 12;      // Whether consensus is required
  
  // Fees and rewards
  repeated Coin fees = 13;          // Request fees
  repeated Coin rewards = 14;       // Request rewards
  string gas_limit = 15;            // Gas limit for callback
  
  // Request status
  string status = 16;               // Request status
  string result = 17;               // Request result
  string error_message = 18;        // Error message if failed
  
  // Response information
  string response_data = 19;        // Response data
  int64 response_time = 20;         // Response timestamp
  repeated string responding_oracles = 21; // Responding oracle addresses
  
  // Metadata
  map<string, string> metadata = 22; // Additional metadata
  int64 deadline = 23;              // Request deadline
}

// MsgSubmitOracleData submits data to an oracle
message MsgSubmitOracleData {
  string creator = 1;               // Submitter address (sdk.Address)
  string oracle_id = 2;             // Target oracle ID
  string request_id = 3;            // Request ID
  string data = 4;                  // Oracle data
  string data_hash = 5;             // Data hash
  string symbol = 6;                // Asset symbol
  string source_url = 7;            // Source URL
  string verification_proof = 8;    // Verification proof
  map<string, string> metadata = 9; // Additional metadata
}

// MsgSubmitOracleDataResponse returns the submission result
message MsgSubmitOracleDataResponse {
  bool success = 1;                 // Submission success status
  string data_id = 2;               // Created data ID
}

// MsgCreateOracleRequest creates a new oracle request
message MsgCreateOracleRequest {
  string creator = 1;               // Requester address (sdk.Address)
  string oracle_id = 2;             // Target oracle ID
  string request_type = 3;          // Type of request
  string symbol = 4;                // Asset symbol
  string parameters = 5;            // Request parameters
  string callback_contract = 6;     // Callback contract
  int64 timeout = 7;                // Request timeout
  repeated Coin fees = 8;           // Request fees
}

// MsgCreateOracleRequestResponse returns the request result
message MsgCreateOracleRequestResponse {
  bool success = 1;                 // Request creation success status
  string request_id = 2;            // Created request ID
}

// MsgVerifyOracleData verifies oracle data
message MsgVerifyOracleData {
  string creator = 1;               // Verifier address (sdk.Address)
  string data_id = 2;               // Data ID to verify
  string verification_proof = 3;    // Verification proof
  bool is_valid = 4;                // Verification result
  string verification_data = 5;     // Additional verification data
}

// MsgVerifyOracleDataResponse returns the verification result
message MsgVerifyOracleDataResponse {
  bool success = 1;                 // Verification success status
  string verification_id = 2;       // Created verification ID
}

// MsgUpdateOracleData updates oracle data
message MsgUpdateOracleData {
  string creator = 1;               // Updater address (sdk.Address)
  string data_id = 2;               // Data ID to update
  string updated_data = 3;          // Updated data
  string reason = 4;                // Update reason
  string verification_proof = 5;    // Update verification proof
}

// MsgUpdateOracleDataResponse returns the update result
message MsgUpdateOracleDataResponse {
  bool success = 1;                 // Update success status
}
