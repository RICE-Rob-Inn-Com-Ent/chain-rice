syntax = "proto3";

package blockchain.wallets.messages;

import "blockchain/wallets/enums/wallet_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/wallets/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// WalletTransactionStatus defines the status of wallet transactions
enum WalletTransactionStatus {
  // WALLET_TRANSACTION_STATUS_UNSPECIFIED indicates an unspecified transaction status
  WALLET_TRANSACTION_STATUS_UNSPECIFIED = 0;
  
  // WALLET_TRANSACTION_STATUS_PENDING indicates the transaction is pending
  WALLET_TRANSACTION_STATUS_PENDING = 1;
  
  // WALLET_TRANSACTION_STATUS_CONFIRMED indicates the transaction is confirmed
  WALLET_TRANSACTION_STATUS_CONFIRMED = 2;
  
  // WALLET_TRANSACTION_STATUS_PROCESSING indicates the transaction is being processed
  WALLET_TRANSACTION_STATUS_PROCESSING = 3;
  
  // WALLET_TRANSACTION_STATUS_COMPLETED indicates the transaction is completed
  WALLET_TRANSACTION_STATUS_COMPLETED = 4;
  
  // WALLET_TRANSACTION_STATUS_FAILED indicates the transaction failed
  WALLET_TRANSACTION_STATUS_FAILED = 5;
  
  // WALLET_TRANSACTION_STATUS_CANCELLED indicates the transaction was cancelled
  WALLET_TRANSACTION_STATUS_CANCELLED = 6;
  
  // WALLET_TRANSACTION_STATUS_REVERTED indicates the transaction was reverted
  WALLET_TRANSACTION_STATUS_REVERTED = 7;
  
  // WALLET_TRANSACTION_STATUS_EXPIRED indicates the transaction expired
  WALLET_TRANSACTION_STATUS_EXPIRED = 8;
  
  // WALLET_TRANSACTION_STATUS_QUEUED indicates the transaction is queued
  WALLET_TRANSACTION_STATUS_QUEUED = 9;
  
  // WALLET_TRANSACTION_STATUS_BROADCAST indicates the transaction is broadcasted
  WALLET_TRANSACTION_STATUS_BROADCAST = 10;
  
  // WALLET_TRANSACTION_STATUS_MEMPOOL indicates the transaction is in mempool
  WALLET_TRANSACTION_STATUS_MEMPOOL = 11;
  
  // WALLET_TRANSACTION_STATUS_INCLUDED indicates the transaction is included in a block
  WALLET_TRANSACTION_STATUS_INCLUDED = 12;
  
  // WALLET_TRANSACTION_STATUS_FINALIZED indicates the transaction is finalized
  WALLET_TRANSACTION_STATUS_FINALIZED = 13;
  
  // WALLET_TRANSACTION_STATUS_ARCHIVED indicates the transaction is archived
  WALLET_TRANSACTION_STATUS_ARCHIVED = 14;
}

// WalletTransaction represents a wallet transaction
message WalletTransaction {
  string id = 1;                    // Unique transaction identifier
  string wallet_id = 2;             // Source wallet ID
  string from_address = 3;          // Sender address (sdk.Address)
  string to_address = 4;            // Recipient address (sdk.Address)
  int64 timestamp = 5;              // Transaction timestamp
  
  // Transaction details
  string transaction_type = 6;      // Transaction type (send, receive, swap, stake, etc.)
  WalletTransactionStatus status = 7; // Current transaction status
  repeated Coin amount = 8;         // Transaction amount
  repeated Coin fees = 9;           // Transaction fees
  
  // Blockchain information
  string transaction_hash = 10;     // Transaction hash
  int64 block_height = 11;          // Block height
  int32 transaction_index = 12;     // Transaction index in block
  string network_id = 13;           // Network identifier
  string chain_id = 14;             // Chain identifier
  
  // Gas information
  string gas_limit = 15;            // Gas limit
  string gas_used = 16;             // Gas used
  string gas_price = 17;            // Gas price
  string priority_fee = 18;         // Priority fee
  
  // Transaction context
  string memo = 19;                 // Transaction memo
  string reference = 20;            // Transaction reference
  string purpose = 21;              // Transaction purpose
  string category = 22;             // Transaction category
  
  // Transaction validation
  bool is_validated = 23;           // Whether transaction is validated
  string validation_proof = 24;     // Validation proof
  repeated string validators = 25;  // Validator addresses
  string signature = 26;            // Transaction signature
  
  // Transaction lifecycle
  int64 created_time = 27;          // Creation timestamp
  int64 broadcast_time = 28;        // Broadcast timestamp
  int64 confirmation_time = 29;     // Confirmation timestamp
  int64 finalization_time = 30;     // Finalization timestamp
  
  // Error information
  string error_message = 31;        // Error message if failed
  string error_code = 32;           // Error code
  string revert_reason = 33;        // Revert reason
  
  // Transaction metadata
  map<string, string> metadata = 34; // Additional metadata
  repeated string tags = 35;        // Transaction tags
  int64 version = 36;               // Transaction version
  
  // Wallet-specific information
  string wallet_version = 37;       // Wallet version used
  string wallet_type = 38;          // Wallet type
  string user_agent = 39;           // User agent
  string ip_address = 40;           // IP address
  string device_info = 41;          // Device information
}

// MsgSendTransaction sends a transaction from a wallet
message MsgSendTransaction {
  string creator = 1;               // Sender address (sdk.Address)
  string wallet_id = 2;             // Wallet ID to send from
  string to_address = 3;            // Recipient address
  repeated Coin amount = 4;         // Transaction amount
  string memo = 5;                  // Transaction memo
  string purpose = 6;               // Transaction purpose
  string gas_limit = 7;             // Gas limit
  string gas_price = 8;             // Gas price
  map<string, string> metadata = 9; // Additional metadata
}

// MsgSendTransactionResponse returns the transaction result
message MsgSendTransactionResponse {
  bool success = 1;                 // Transaction success status
  string transaction_id = 2;        // Created transaction ID
  string transaction_hash = 3;      // Transaction hash
}

// MsgReceiveTransaction receives a transaction to a wallet
message MsgReceiveTransaction {
  string creator = 1;               // Receiver address (sdk.Address)
  string wallet_id = 2;             // Wallet ID to receive to
  string from_address = 3;          // Sender address
  repeated Coin amount = 4;         // Transaction amount
  string transaction_hash = 5;      // Transaction hash
  string memo = 6;                  // Transaction memo
  map<string, string> metadata = 7; // Additional metadata
}

// MsgReceiveTransactionResponse returns the receive result
message MsgReceiveTransactionResponse {
  bool success = 1;                 // Receive success status
  string transaction_id = 2;        // Created transaction ID
}

// MsgSwapTokens swaps tokens in a wallet
message MsgSwapTokens {
  string creator = 1;               // Swapper address (sdk.Address)
  string wallet_id = 2;             // Wallet ID
  string from_token = 3;            // Source token
  string to_token = 4;              // Destination token
  string from_amount = 5;           // Source amount
  string min_received = 6;          // Minimum amount to receive
  string slippage_tolerance = 7;    // Slippage tolerance
  string deadline = 8;              // Transaction deadline
  map<string, string> metadata = 9; // Additional metadata
}

// MsgSwapTokensResponse returns the swap result
message MsgSwapTokensResponse {
  bool success = 1;                 // Swap success status
  string transaction_id = 2;        // Created transaction ID
  string received_amount = 3;       // Amount received
  string transaction_hash = 4;      // Transaction hash
}

// MsgStakeTokens stakes tokens from a wallet
message MsgStakeTokens {
  string creator = 1;               // Staker address (sdk.Address)
  string wallet_id = 2;             // Wallet ID
  string validator = 3;             // Validator address
  repeated Coin amount = 4;         // Staking amount
  string staking_period = 5;        // Staking period
  string reward_address = 6;        // Reward address
  map<string, string> metadata = 7; // Additional metadata
}

// MsgStakeTokensResponse returns the staking result
message MsgStakeTokensResponse {
  bool success = 1;                 // Staking success status
  string transaction_id = 2;        // Created transaction ID
  string staking_id = 3;            // Staking ID
  string transaction_hash = 4;      // Transaction hash
}

// MsgUnstakeTokens unstakes tokens from a wallet
message MsgUnstakeTokens {
  string creator = 1;               // Unstaker address (sdk.Address)
  string wallet_id = 2;             // Wallet ID
  string staking_id = 3;            // Staking ID to unstake
  repeated Coin amount = 4;         // Unstaking amount
  string reason = 5;                // Unstaking reason
  map<string, string> metadata = 6; // Additional metadata
}

// MsgUnstakeTokensResponse returns the unstaking result
message MsgUnstakeTokensResponse {
  bool success = 1;                 // Unstaking success status
  string transaction_id = 2;        // Created transaction ID
  string transaction_hash = 3;      // Transaction hash
}

// MsgDelegateTokens delegates tokens from a wallet
message MsgDelegateTokens {
  string creator = 1;               // Delegator address (sdk.Address)
  string wallet_id = 2;             // Wallet ID
  string delegatee = 3;             // Delegatee address
  repeated Coin amount = 4;         // Delegation amount
  string delegation_period = 5;     // Delegation period
  map<string, string> metadata = 6; // Additional metadata
}

// MsgDelegateTokensResponse returns the delegation result
message MsgDelegateTokensResponse {
  bool success = 1;                 // Delegation success status
  string transaction_id = 2;        // Created transaction ID
  string delegation_id = 3;         // Delegation ID
  string transaction_hash = 4;      // Transaction hash
}
