syntax = "proto3";

package blockchain.consensus.messages;

import "blockchain/consensus/enums/consensus_algorithm.proto";
import "blockchain/consensus/enums/consensus_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/consensus/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// Node represents a blockchain consensus node
message Node {
  string id = 1;                    // Unique node identifier
  string address = 2;               // Node address (sdk.Address)
  string moniker = 3;               // Human-readable node name
  string description = 4;           // Node description
  string creator = 5;               // Node creator address (sdk.Address)
  int64 timestamp = 6;              // Node creation timestamp
  
  // Node configuration
  blockchain.consensus.enums.ConsensusAlgorithm consensus_algorithm = 7; // Consensus algorithm
  blockchain.consensus.enums.ConsensusStatus status = 8; // Current node status
  
  // Network information
  string network_id = 9;            // Network identifier
  string version = 10;              // Node software version
  string peer_id = 11;              // P2P peer identifier
  
  // Staking information (for PoS networks)
  repeated Coin staked_amount = 12; // Staked tokens
  string validator_power = 13;      // Validator voting power
  bool is_validator = 14;           // Whether node is a validator
  bool is_active_validator = 15;    // Whether validator is active
  
  // Node capabilities
  bool can_propose = 16;            // Can propose blocks
  bool can_vote = 17;               // Can vote on proposals
  bool can_validate = 18;           // Can validate blocks
  repeated string supported_features = 19; // Supported features
  
  // Performance metrics
  int64 uptime = 20;                // Node uptime in seconds
  int64 last_activity = 21;         // Last activity timestamp
  string performance_score = 22;    // Performance score
  int64 blocks_proposed = 23;       // Number of blocks proposed
  int64 blocks_validated = 24;      // Number of blocks validated
  
  // Security and reputation
  int64 slashing_count = 25;        // Number of slashing events
  int64 jailing_count = 26;         // Number of jailing events
  string reputation_score = 27;     // Node reputation score
  
  // Connection information
  repeated string peer_addresses = 28; // Connected peer addresses
  string rpc_endpoint = 29;         // RPC endpoint URL
  string grpc_endpoint = 30;        // gRPC endpoint URL
  
  // Metadata
  map<string, string> metadata = 31; // Additional metadata
  string website = 32;              // Node website
  string contact_email = 33;        // Contact email
  int64 last_updated = 34;          // Last update timestamp
}

// ConsensusParams defines the parameters for the consensus module
message ConsensusParams {
  string authority = 1;             // Module authority address
  blockchain.consensus.enums.ConsensusAlgorithm default_algorithm = 2; // Default consensus algorithm
  int64 block_time = 3;             // Block time in milliseconds
  int64 max_validators = 4;         // Maximum number of validators
  string min_stake_amount = 5;      // Minimum stake amount
  string max_stake_amount = 6;      // Maximum stake amount
  int64 unbonding_time = 7;         // Unbonding time in seconds
  int64 slash_fraction = 8;         // Slash fraction (as percentage)
  bool auto_unjail = 9;             // Auto unjail enabled
  int64 heartbeat_timeout = 10;     // Heartbeat timeout in seconds
}

// MsgCreateNode creates a new consensus node
message MsgCreateNode {
  string creator = 1;               // Creator address (sdk.Address)
  string moniker = 2;               // Node moniker
  string description = 3;           // Node description
  blockchain.consensus.enums.ConsensusAlgorithm consensus_algorithm = 4; // Consensus algorithm
  repeated Coin staked_amount = 5;  // Initial stake amount
  string website = 6;               // Node website
  string contact_email = 7;         // Contact email
}

// MsgCreateNodeResponse returns the created node
message MsgCreateNodeResponse {
  string node_id = 1;               // Created node ID
}

// MsgUpdateNode updates an existing node
message MsgUpdateNode {
  string creator = 1;               // Creator address (sdk.Address)
  string node_id = 2;               // Node ID to update
  string moniker = 3;               // Updated moniker
  string description = 4;           // Updated description
  string website = 5;               // Updated website
  string contact_email = 6;         // Updated contact email
  map<string, string> metadata = 7; // Updated metadata
}

// MsgUpdateNodeResponse returns the update result
message MsgUpdateNodeResponse {
  bool success = 1;                 // Update success status
}

// MsgDeleteNode deletes a node
message MsgDeleteNode {
  string creator = 1;               // Creator address (sdk.Address)
  string node_id = 2;               // Node ID to delete
}

// MsgDeleteNodeResponse returns the deletion result
message MsgDeleteNodeResponse {
  bool success = 1;                 // Deletion success status
}

// MsgStakeTokens stakes tokens for a node
message MsgStakeTokens {
  string creator = 1;               // Creator address (sdk.Address)
  string node_id = 2;               // Node ID to stake for
  repeated Coin amount = 3;         // Amount to stake
}

// MsgStakeTokensResponse returns the staking result
message MsgStakeTokensResponse {
  bool success = 1;                 // Staking success status
  string stake_id = 2;              // Created stake ID
}

// MsgUnstakeTokens unstakes tokens from a node
message MsgUnstakeTokens {
  string creator = 1;               // Creator address (sdk.Address)
  string node_id = 2;               // Node ID to unstake from
  repeated Coin amount = 3;         // Amount to unstake
}

// MsgUnstakeTokensResponse returns the unstaking result
message MsgUnstakeTokensResponse {
  bool success = 1;                 // Unstaking success status
  int64 unbonding_time = 2;         // Unbonding completion time
}
