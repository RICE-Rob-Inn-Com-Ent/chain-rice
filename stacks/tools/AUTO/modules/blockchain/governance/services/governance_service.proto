syntax = "proto3";

package blockchain.governance.services;

import "blockchain/governance/messages/proposal.proto";
import "blockchain/governance/messages/vote.proto";

option go_package = "github.com/chainrice/proto/blockchain/governance/services";

// GovernanceMsgService handles state-changing governance operations
service GovernanceMsgService {
  // SubmitProposal submits a new governance proposal
  rpc SubmitProposal(blockchain.governance.messages.MsgSubmitProposal) returns (blockchain.governance.messages.MsgSubmitProposalResponse);
  
  // Vote votes on a governance proposal
  rpc Vote(blockchain.governance.messages.MsgVote) returns (blockchain.governance.messages.MsgVoteResponse);
  
  // Deposit deposits tokens for a proposal
  rpc Deposit(blockchain.governance.messages.MsgDeposit) returns (blockchain.governance.messages.MsgDepositResponse);
  
  // ExecuteProposal executes a passed proposal
  rpc ExecuteProposal(blockchain.governance.messages.MsgExecuteProposal) returns (blockchain.governance.messages.MsgExecuteProposalResponse);
  
  // CancelProposal cancels a proposal
  rpc CancelProposal(blockchain.governance.messages.MsgCancelProposal) returns (blockchain.governance.messages.MsgCancelProposalResponse);
  
  // UpdateProposal updates an existing proposal
  rpc UpdateProposal(blockchain.governance.messages.MsgUpdateProposal) returns (blockchain.governance.messages.MsgUpdateProposalResponse);
  
  // CastVote casts a vote on a proposal
  rpc CastVote(blockchain.governance.messages.MsgCastVote) returns (blockchain.governance.messages.MsgCastVoteResponse);
  
  // UpdateVote updates an existing vote
  rpc UpdateVote(blockchain.governance.messages.MsgUpdateVote) returns (blockchain.governance.messages.MsgUpdateVoteResponse);
  
  // RetractVote retracts a vote
  rpc RetractVote(blockchain.governance.messages.MsgRetractVote) returns (blockchain.governance.messages.MsgRetractVoteResponse);
  
  // CalculateTally calculates the tally for a proposal
  rpc CalculateTally(blockchain.governance.messages.MsgCalculateTally) returns (blockchain.governance.messages.MsgCalculateTallyResponse);
  
  // DelegateVotingPower delegates voting power to another address
  rpc DelegateVotingPower(blockchain.governance.messages.MsgDelegateVotingPower) returns (blockchain.governance.messages.MsgDelegateVotingPowerResponse);
  
  // UndelegateVotingPower undelegates voting power
  rpc UndelegateVotingPower(blockchain.governance.messages.MsgUndelegateVotingPower) returns (blockchain.governance.messages.MsgUndelegateVotingPowerResponse);
}

// GovernanceQueryService handles governance state queries
service GovernanceQueryService {
  // GetProposal retrieves a specific proposal
  rpc GetProposal(GetProposalRequest) returns (GetProposalResponse);
  
  // ListProposals lists proposals with pagination and filters
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  
  // GetVote retrieves a specific vote
  rpc GetVote(GetVoteRequest) returns (GetVoteResponse);
  
  // ListVotes lists votes with pagination and filters
  rpc ListVotes(ListVotesRequest) returns (ListVotesResponse);
  
  // GetTallyResult retrieves the tally result for a proposal
  rpc GetTallyResult(GetTallyResultRequest) returns (GetTallyResultResponse);
  
  // GetGovernanceParams retrieves governance module parameters
  rpc GetGovernanceParams(GetGovernanceParamsRequest) returns (GetGovernanceParamsResponse);
  
  // GetProposalStats retrieves proposal statistics
  rpc GetProposalStats(GetProposalStatsRequest) returns (GetProposalStatsResponse);
  
  // GetVotingPower retrieves voting power for an address
  rpc GetVotingPower(GetVotingPowerRequest) returns (GetVotingPowerResponse);
  
  // GetDelegatedVotingPower retrieves delegated voting power
  rpc GetDelegatedVotingPower(GetDelegatedVotingPowerRequest) returns (GetDelegatedVotingPowerResponse);
  
  // ListActiveProposals lists currently active proposals
  rpc ListActiveProposals(ListActiveProposalsRequest) returns (ListActiveProposalsResponse);
  
  // GetProposalVotes retrieves all votes for a proposal
  rpc GetProposalVotes(GetProposalVotesRequest) returns (GetProposalVotesResponse);
  
  // GetVoterHistory retrieves voting history for an address
  rpc GetVoterHistory(GetVoterHistoryRequest) returns (GetVoterHistoryResponse);
}

// Query request and response messages

message GetProposalRequest {
  string proposal_id = 1; // Proposal ID
}

message GetProposalResponse {
  blockchain.governance.messages.Proposal proposal = 1;
}

message ListProposalsRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string proposal_type = 3;  // Filter by proposal type
  string status = 4;         // Filter by proposal status
  string creator = 5;        // Filter by creator address
  int64 start_time = 6;      // Filter by start time
  int64 end_time = 7;        // Filter by end time
}

message ListProposalsResponse {
  repeated blockchain.governance.messages.Proposal proposals = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetVoteRequest {
  string vote_id = 1; // Vote ID
}

message GetVoteResponse {
  blockchain.governance.messages.Vote vote = 1;
}

message ListVotesRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
  string proposal_id = 3;    // Filter by proposal ID
  string voter = 4;          // Filter by voter address
  string vote_option = 5;    // Filter by vote option
}

message ListVotesResponse {
  repeated blockchain.governance.messages.Vote votes = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetTallyResultRequest {
  string proposal_id = 1; // Proposal ID
}

message GetTallyResultResponse {
  blockchain.governance.messages.TallyResult tally_result = 1;
}

message GetGovernanceParamsRequest {
  // No parameters needed
}

message GetGovernanceParamsResponse {
  blockchain.governance.messages.GovernanceParams params = 1;
}

message GetProposalStatsRequest {
  string time_period = 1; // Optional time period filter
}

message GetProposalStatsResponse {
  int64 total_proposals = 1;        // Total number of proposals
  int64 active_proposals = 2;       // Number of active proposals
  int64 passed_proposals = 3;       // Number of passed proposals
  int64 rejected_proposals = 4;     // Number of rejected proposals
  int64 executed_proposals = 5;     // Number of executed proposals
  string total_voting_power = 6;    // Total voting power
  string participation_rate = 7;    // Participation rate percentage
  int64 average_votes_per_proposal = 8; // Average votes per proposal
  string most_common_proposal_type = 9; // Most common proposal type
}

message GetVotingPowerRequest {
  string address = 1; // Address to query
}

message GetVotingPowerResponse {
  string address = 1;               // Address
  string voting_power = 2;          // Total voting power
  string delegated_power = 3;       // Delegated voting power
  string self_power = 4;            // Self voting power
  int64 last_updated = 5;           // Last update timestamp
}

message GetDelegatedVotingPowerRequest {
  string delegator = 1; // Delegator address
  string delegatee = 2; // Optional delegatee address
}

message GetDelegatedVotingPowerResponse {
  string delegator = 1;             // Delegator address
  string delegatee = 2;             // Delegatee address
  string delegated_power = 3;       // Delegated power amount
  int64 delegation_time = 4;        // Delegation timestamp
  int64 expiry_time = 5;            // Optional expiry time
  string delegation_id = 6;         // Delegation ID
}

message ListActiveProposalsRequest {
  string pagination_key = 1; // Pagination key for next page
  int32 limit = 2;           // Number of results per page
}

message ListActiveProposalsResponse {
  repeated blockchain.governance.messages.Proposal proposals = 1;
  string next_pagination_key = 2; // Key for next page
}

message GetProposalVotesRequest {
  string proposal_id = 1;           // Proposal ID
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
}

message GetProposalVotesResponse {
  repeated blockchain.governance.messages.Vote votes = 1;
  string next_pagination_key = 2;   // Key for next page
}

message GetVoterHistoryRequest {
  string voter = 1;                 // Voter address
  string pagination_key = 2;        // Pagination key for next page
  int32 limit = 3;                  // Number of results per page
  int64 start_time = 4;             // Filter by start time
  int64 end_time = 5;               // Filter by end time
}

message GetVoterHistoryResponse {
  repeated blockchain.governance.messages.Vote votes = 1;
  string next_pagination_key = 2;   // Key for next page
}
