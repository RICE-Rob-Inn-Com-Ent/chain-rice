syntax = "proto3";

package blockchain.tokens.messages;

import "blockchain/tokens/enums/token_type.proto";
import "blockchain/tokens/enums/token_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/tokens/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// Token represents a blockchain token
message Token {
  string id = 1;                    // Unique token identifier
  string address = 2;               // Token contract address
  string name = 3;                  // Token name
  string symbol = 4;                // Token symbol
  string description = 5;           // Token description
  string creator = 6;               // Token creator address (sdk.Address)
  int64 timestamp = 7;              // Token creation timestamp
  
  // Token classification
  blockchain.tokens.enums.TokenType token_type = 8; // Type of token
  blockchain.tokens.enums.TokenStatus status = 9; // Current token status
  
  // Token supply and economics
  string total_supply = 10;         // Total token supply
  string circulating_supply = 11;   // Circulating token supply
  string max_supply = 12;           // Maximum token supply
  string burned_supply = 13;        // Burned token supply
  int32 decimals = 14;              // Token decimals
  
  // Token metadata
  string logo_url = 15;             // Token logo URL
  string website = 16;              // Token website
  string whitepaper = 17;           // Whitepaper URL
  string github_repo = 18;          // GitHub repository
  string twitter_handle = 19;       // Twitter handle
  string telegram_group = 20;       // Telegram group
  
  // Token functionality
  bool is_mintable = 21;            // Whether token is mintable
  bool is_burnable = 22;            // Whether token is burnable
  bool is_pausable = 23;            // Whether token is pausable
  bool is_upgradeable = 24;         // Whether token is upgradeable
  bool is_transferable = 25;        // Whether token is transferable
  
  // Token permissions
  string owner = 26;                // Token owner address
  string admin = 27;                // Token admin address
  repeated string authorized_minters = 28; // Authorized minter addresses
  repeated string authorized_burners = 29; // Authorized burner addresses
  repeated string blacklisted_addresses = 30; // Blacklisted addresses
  
  // Token economics
  string initial_price = 31;        // Initial token price
  string current_price = 32;        // Current token price
  string market_cap = 33;           // Market capitalization
  string total_value_locked = 34;   // Total value locked
  string inflation_rate = 35;       // Inflation rate
  string deflation_rate = 36;       // Deflation rate
  
  // Token distribution
  map<string, string> distribution = 37; // Token distribution
  string vesting_schedule = 38;     // Vesting schedule (JSON)
  string lock_period = 39;          // Lock period
  string unlock_conditions = 40;    // Unlock conditions
  
  // Token governance
  bool has_governance = 41;         // Whether token has governance
  string governance_contract = 42;  // Governance contract address
  string voting_power = 43;         // Voting power per token
  string proposal_threshold = 44;   // Proposal threshold
  
  // Token security
  bool is_verified = 45;            // Whether token is verified
  bool is_audited = 46;             // Whether token is audited
  string audit_report = 47;         // Audit report URL
  string security_score = 48;       // Security score
  repeated string vulnerabilities = 49; // Known vulnerabilities
  
  // Token usage and metrics
  int64 total_transactions = 50;    // Total transactions
  int64 unique_holders = 51;        // Number of unique holders
  string daily_volume = 52;         // Daily trading volume
  string liquidity = 53;            // Token liquidity
  string price_change_24h = 54;     // 24h price change
  
  // Token metadata and attributes
  map<string, string> metadata = 55; // Additional metadata
  repeated string tags = 56;        // Token tags
  string category = 57;             // Token category
  int64 last_updated = 58;          // Last update timestamp
  int64 last_price_update = 59;     // Last price update timestamp
}

// TokenParams defines the parameters for the tokens module
message TokenParams {
  string authority = 1;             // Module authority address
  repeated Coin default_fees = 2;   // Default token fees
  string max_supply = 3;            // Maximum token supply
  string min_supply = 4;            // Minimum token supply
  int32 max_decimals = 5;           // Maximum decimals
  int32 min_decimals = 6;           // Minimum decimals
  bool require_verification = 7;    // Whether verification is required
  bool require_audit = 8;           // Whether audit is required
  string security_threshold = 9;    // Security score threshold
  int64 max_tokens_per_address = 10; // Maximum tokens per address
}

// MsgCreateToken creates a new token
message MsgCreateToken {
  string creator = 1;               // Creator address (sdk.Address)
  string name = 2;                  // Token name
  string symbol = 3;                // Token symbol
  string description = 4;           // Token description
  blockchain.tokens.enums.TokenType token_type = 5; // Token type
  string initial_supply = 6;        // Initial token supply
  string max_supply = 7;            // Maximum token supply
  int32 decimals = 8;               // Token decimals
  bool is_mintable = 9;             // Whether token is mintable
  bool is_burnable = 10;            // Whether token is burnable
  map<string, string> metadata = 11; // Additional metadata
}

// MsgCreateTokenResponse returns the created token
message MsgCreateTokenResponse {
  string token_id = 1;              // Created token ID
  string token_address = 2;         // Token contract address
  string deployment_tx_hash = 3;    // Deployment transaction hash
}

// MsgUpdateToken updates an existing token
message MsgUpdateToken {
  string creator = 1;               // Updater address (sdk.Address)
  string token_id = 2;              // Token ID to update
  string name = 3;                  // Updated name
  string description = 4;           // Updated description
  string logo_url = 5;              // Updated logo URL
  string website = 6;               // Updated website
  map<string, string> metadata = 7; // Updated metadata
}

// MsgUpdateTokenResponse returns the update result
message MsgUpdateTokenResponse {
  bool success = 1;                 // Update success status
}

// MsgMintToken mints new tokens
message MsgMintToken {
  string creator = 1;               // Minter address (sdk.Address)
  string token_id = 2;              // Token ID to mint
  string recipient = 3;             // Recipient address
  string amount = 4;                // Amount to mint
  string reason = 5;                // Minting reason
}

// MsgMintTokenResponse returns the minting result
message MsgMintTokenResponse {
  bool success = 1;                 // Minting success status
  string new_supply = 2;            // New total supply
}

// MsgBurnToken burns tokens
message MsgBurnToken {
  string creator = 1;               // Burner address (sdk.Address)
  string token_id = 2;              // Token ID to burn
  string amount = 3;                // Amount to burn
  string reason = 4;                // Burning reason
}

// MsgBurnTokenResponse returns the burning result
message MsgBurnTokenResponse {
  bool success = 1;                 // Burning success status
  string new_supply = 2;            // New total supply
}

// MsgPauseToken pauses a token
message MsgPauseToken {
  string creator = 1;               // Pauser address (sdk.Address)
  string token_id = 2;              // Token ID to pause
  string reason = 3;                // Pause reason
}

// MsgPauseTokenResponse returns the pause result
message MsgPauseTokenResponse {
  bool success = 1;                 // Pause success status
}

// MsgResumeToken resumes a paused token
message MsgResumeToken {
  string creator = 1;               // Resumer address (sdk.Address)
  string token_id = 2;              // Token ID to resume
  string reason = 3;                // Resume reason
}

// MsgResumeTokenResponse returns the resume result
message MsgResumeTokenResponse {
  bool success = 1;                 // Resume success status
}
