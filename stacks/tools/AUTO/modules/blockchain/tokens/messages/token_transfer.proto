syntax = "proto3";

package blockchain.tokens.messages;

import "blockchain/tokens/enums/token_status.proto";

option go_package = "github.com/chainrice/proto/blockchain/tokens/messages";

// Coin represents a token with denomination and amount
message Coin {
  string denom = 1;  // Token denomination
  string amount = 2; // Token amount as string
}

// TokenTransferStatus defines the status of token transfers
enum TokenTransferStatus {
  // TOKEN_TRANSFER_STATUS_UNSPECIFIED indicates an unspecified transfer status
  TOKEN_TRANSFER_STATUS_UNSPECIFIED = 0;
  
  // TOKEN_TRANSFER_STATUS_PENDING indicates the transfer is pending
  TOKEN_TRANSFER_STATUS_PENDING = 1;
  
  // TOKEN_TRANSFER_STATUS_CONFIRMED indicates the transfer is confirmed
  TOKEN_TRANSFER_STATUS_CONFIRMED = 2;
  
  // TOKEN_TRANSFER_STATUS_PROCESSING indicates the transfer is being processed
  TOKEN_TRANSFER_STATUS_PROCESSING = 3;
  
  // TOKEN_TRANSFER_STATUS_COMPLETED indicates the transfer is completed
  TOKEN_TRANSFER_STATUS_COMPLETED = 4;
  
  // TOKEN_TRANSFER_STATUS_FAILED indicates the transfer failed
  TOKEN_TRANSFER_STATUS_FAILED = 5;
  
  // TOKEN_TRANSFER_STATUS_CANCELLED indicates the transfer was cancelled
  TOKEN_TRANSFER_STATUS_CANCELLED = 6;
  
  // TOKEN_TRANSFER_STATUS_REVERTED indicates the transfer was reverted
  TOKEN_TRANSFER_STATUS_REVERTED = 7;
  
  // TOKEN_TRANSFER_STATUS_EXPIRED indicates the transfer expired
  TOKEN_TRANSFER_STATUS_EXPIRED = 8;
  
  // TOKEN_TRANSFER_STATUS_QUEUED indicates the transfer is queued
  TOKEN_TRANSFER_STATUS_QUEUED = 9;
  
  // TOKEN_TRANSFER_STATUS_BROADCAST indicates the transfer is broadcasted
  TOKEN_TRANSFER_STATUS_BROADCAST = 10;
  
  // TOKEN_TRANSFER_STATUS_MEMPOOL indicates the transfer is in mempool
  TOKEN_TRANSFER_STATUS_MEMPOOL = 11;
  
  // TOKEN_TRANSFER_STATUS_INCLUDED indicates the transfer is included in a block
  TOKEN_TRANSFER_STATUS_INCLUDED = 12;
  
  // TOKEN_TRANSFER_STATUS_FINALIZED indicates the transfer is finalized
  TOKEN_TRANSFER_STATUS_FINALIZED = 13;
  
  // TOKEN_TRANSFER_STATUS_ARCHIVED indicates the transfer is archived
  TOKEN_TRANSFER_STATUS_ARCHIVED = 14;
}

// TokenTransfer represents a token transfer
message TokenTransfer {
  string id = 1;                    // Unique transfer identifier
  string token_id = 2;              // Source token ID
  string from_address = 3;          // Sender address (sdk.Address)
  string to_address = 4;            // Recipient address (sdk.Address)
  int64 timestamp = 5;              // Transfer timestamp
  
  // Transfer details
  string amount = 6;                // Transfer amount
  TokenTransferStatus status = 7;   // Current transfer status
  
  // Transaction information
  string transaction_hash = 8;      // Transaction hash
  int64 block_height = 9;           // Block height
  int32 transaction_index = 10;     // Transaction index in block
  string gas_used = 11;             // Gas used
  string gas_price = 12;            // Gas price
  
  // Transfer context
  string transfer_type = 13;        // Transfer type (send, receive, mint, burn)
  string memo = 14;                 // Transfer memo
  string reference = 15;            // Transfer reference
  string purpose = 16;              // Transfer purpose
  
  // Fee information
  repeated Coin fees = 17;          // Transfer fees
  string fee_percentage = 18;       // Fee percentage
  string total_cost = 19;           // Total cost including fees
  
  // Transfer validation
  bool is_validated = 20;           // Whether transfer is validated
  string validation_proof = 21;     // Validation proof
  repeated string validators = 22;  // Validator addresses
  string signature = 23;            // Transfer signature
  
  // Transfer lifecycle
  int64 created_time = 24;          // Creation timestamp
  int64 broadcast_time = 25;        // Broadcast timestamp
  int64 confirmation_time = 26;     // Confirmation timestamp
  int64 finalization_time = 27;     // Finalization timestamp
  
  // Error information
  string error_message = 28;        // Error message if failed
  string error_code = 29;           // Error code
  string revert_reason = 30;        // Revert reason
  
  // Metadata
  map<string, string> metadata = 31; // Additional metadata
  repeated string tags = 32;        // Transfer tags
  int64 version = 33;               // Transfer version
}

// MsgTransferToken transfers tokens
message MsgTransferToken {
  string creator = 1;               // Sender address (sdk.Address)
  string token_id = 2;              // Token ID to transfer
  string recipient = 3;             // Recipient address
  string amount = 4;                // Transfer amount
  string memo = 5;                  // Transfer memo
  string purpose = 6;               // Transfer purpose
  map<string, string> metadata = 7; // Additional metadata
}

// MsgTransferTokenResponse returns the transfer result
message MsgTransferTokenResponse {
  bool success = 1;                 // Transfer success status
  string transfer_id = 2;           // Created transfer ID
  string transaction_hash = 3;      // Transaction hash
}

// MsgApproveToken approves token spending
message MsgApproveToken {
  string creator = 1;               // Approver address (sdk.Address)
  string token_id = 2;              // Token ID to approve
  string spender = 3;               // Spender address
  string amount = 4;                // Approved amount
  string expiration_time = 5;       // Expiration timestamp
}

// MsgApproveTokenResponse returns the approval result
message MsgApproveTokenResponse {
  bool success = 1;                 // Approval success status
  string approval_id = 2;           // Created approval ID
}

// MsgRevokeTokenApproval revokes token approval
message MsgRevokeTokenApproval {
  string creator = 1;               // Revoker address (sdk.Address)
  string token_id = 2;              // Token ID
  string spender = 3;               // Spender address
  string reason = 4;                // Revocation reason
}

// MsgRevokeTokenApprovalResponse returns the revocation result
message MsgRevokeTokenApprovalResponse {
  bool success = 1;                 // Revocation success status
}

// MsgBatchTransferToken performs batch token transfers
message MsgBatchTransferToken {
  string creator = 1;               // Sender address (sdk.Address)
  string token_id = 2;              // Token ID to transfer
  repeated string recipients = 3;   // Recipient addresses
  repeated string amounts = 4;      // Transfer amounts
  string memo = 5;                  // Transfer memo
  map<string, string> metadata = 6; // Additional metadata
}

// MsgBatchTransferTokenResponse returns the batch transfer result
message MsgBatchTransferTokenResponse {
  bool success = 1;                 // Batch transfer success status
  repeated string transfer_ids = 2; // Created transfer IDs
  string transaction_hash = 3;      // Transaction hash
}

// MsgLockToken locks tokens
message MsgLockToken {
  string creator = 1;               // Locker address (sdk.Address)
  string token_id = 2;              // Token ID to lock
  string amount = 3;                // Amount to lock
  int64 unlock_time = 4;            // Unlock timestamp
  string purpose = 5;               // Lock purpose
  string reason = 6;                // Lock reason
}

// MsgLockTokenResponse returns the lock result
message MsgLockTokenResponse {
  bool success = 1;                 // Lock success status
  string lock_id = 2;               // Created lock ID
}

// MsgUnlockToken unlocks tokens
message MsgUnlockToken {
  string creator = 1;               // Unlocker address (sdk.Address)
  string lock_id = 2;               // Lock ID to unlock
  string reason = 3;                // Unlock reason
}

// MsgUnlockTokenResponse returns the unlock result
message MsgUnlockTokenResponse {
  bool success = 1;                 // Unlock success status
  string transfer_id = 2;           // Created transfer ID
}
