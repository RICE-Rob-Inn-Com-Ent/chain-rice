syntax = "proto3";

package manufacturing.procurement.services;

import "manufacturing/procurement/messages/procurement_request.proto";
import "manufacturing/procurement/messages/procurement_response.proto";

// Procurement Service
// Provides comprehensive procurement management capabilities
// including request management, approval workflows, and purchase order processing
service ProcurementService {
  
  // Create a new procurement request
  // Creates a new procurement request for materials or services
  rpc CreateProcurementRequest(manufacturing.procurement.messages.CreateProcurementRequest)
      returns (manufacturing.procurement.messages.CreateProcurementRequestResponse);
  
  // Get a specific procurement request by ID
  // Retrieves detailed information about a procurement request
  rpc GetProcurementRequest(manufacturing.procurement.messages.GetProcurementRequest)
      returns (manufacturing.procurement.messages.GetProcurementRequestResponse);
  
  // List procurement requests with filtering and pagination
  // Retrieves a paginated list of procurement requests with optional filtering
  rpc ListProcurementRequests(manufacturing.procurement.messages.ListProcurementRequestsRequest)
      returns (manufacturing.procurement.messages.ListProcurementRequestsResponse);
  
  // Update an existing procurement request
  // Updates procurement request details including specifications and requirements
  rpc UpdateProcurementRequest(manufacturing.procurement.messages.UpdateProcurementRequest)
      returns (manufacturing.procurement.messages.UpdateProcurementRequestResponse);
  
  // Delete a procurement request
  // Removes a procurement request from the system
  rpc DeleteProcurementRequest(manufacturing.procurement.messages.DeleteProcurementRequest)
      returns (manufacturing.procurement.messages.DeleteProcurementRequestResponse);
  
  // Approve a procurement request
  // Approves a procurement request and makes it eligible for purchase order creation
  rpc ApproveProcurementRequest(manufacturing.procurement.messages.ApproveProcurementRequest)
      returns (manufacturing.procurement.messages.ApproveProcurementRequestResponse);
  
  // Reject a procurement request
  // Rejects a procurement request with specified reason
  rpc RejectProcurementRequest(manufacturing.procurement.messages.RejectProcurementRequest)
      returns (manufacturing.procurement.messages.RejectProcurementRequestResponse);
  
  // Create a purchase order
  // Creates a purchase order based on an approved procurement request
  rpc CreatePurchaseOrder(manufacturing.procurement.messages.CreatePurchaseOrderRequest)
      returns (manufacturing.procurement.messages.CreatePurchaseOrderResponse);
  
  // Get a specific purchase order by ID
  // Retrieves detailed information about a purchase order
  rpc GetPurchaseOrder(manufacturing.procurement.messages.GetPurchaseOrderRequest)
      returns (manufacturing.procurement.messages.GetPurchaseOrderResponse);
  
  // List purchase orders with filtering and pagination
  // Retrieves a paginated list of purchase orders with optional filtering
  rpc ListPurchaseOrders(manufacturing.procurement.messages.ListPurchaseOrdersRequest)
      returns (manufacturing.procurement.messages.ListPurchaseOrdersResponse);
  
  // Update an existing purchase order
  // Updates purchase order details including items and delivery information
  rpc UpdatePurchaseOrder(manufacturing.procurement.messages.UpdatePurchaseOrderRequest)
      returns (manufacturing.procurement.messages.UpdatePurchaseOrderResponse);
  
  // Cancel a purchase order
  // Cancels a purchase order with specified reason
  rpc CancelPurchaseOrder(manufacturing.procurement.messages.CancelPurchaseOrderRequest)
      returns (manufacturing.procurement.messages.CancelPurchaseOrderResponse);
}
