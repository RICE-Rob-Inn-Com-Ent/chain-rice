syntax = "proto3";

package manufacturing.quality.messages;

import "google/protobuf/timestamp.proto";
import "manufacturing/quality/enums/quality_level.proto";

// Request message for creating a quality inspection
message CreateQualityInspectionRequest {
  // Product or material identifier
  string item_id = 1;
  
  // Item name
  string item_name = 2;
  
  // Item description
  string description = 3;
  
  // Batch or lot number
  string batch_number = 4;
  
  // Quality control type
  manufacturing.quality.enums.QualityControlType control_type = 5;
  
  // Quality level required
  manufacturing.quality.enums.QualityLevel quality_level = 6;
  
  // Quality standards to follow
  repeated manufacturing.quality.enums.QualityStandard standards = 7;
  
  // Inspection points
  repeated InspectionPoint inspection_points = 8;
  
  // Inspector identifier
  string inspector_id = 9;
  
  // Scheduled inspection date
  google.protobuf.Timestamp scheduled_date = 10;
  
  // Priority level
  string priority = 11;
  
  // Additional notes
  string notes = 12;
  
  // Manufacturing order identifier
  string manufacturing_order_id = 13;
  
  // Supplier identifier
  string supplier_id = 14;
}

// Request message for retrieving a quality inspection
message GetQualityInspectionRequest {
  // Unique identifier of the quality inspection
  string inspection_id = 1;
}

// Request message for listing quality inspections
message ListQualityInspectionsRequest {
  // Page number for pagination
  int32 page = 1;
  
  // Number of items per page
  int32 page_size = 2;
  
  // Filter by status
  manufacturing.quality.enums.QualityInspectionStatus status = 3;
  
  // Filter by quality level
  manufacturing.quality.enums.QualityLevel quality_level = 4;
  
  // Filter by control type
  manufacturing.quality.enums.QualityControlType control_type = 5;
  
  // Filter by inspector
  string inspector_id = 6;
  
  // Filter by date range - start
  google.protobuf.Timestamp start_date = 7;
  
  // Filter by date range - end
  google.protobuf.Timestamp end_date = 8;
  
  // Search by item name or batch number
  string search_term = 9;
}

// Request message for updating a quality inspection
message UpdateQualityInspectionRequest {
  // Unique identifier of the quality inspection
  string inspection_id = 1;
  
  // Updated inspection points
  repeated InspectionPoint inspection_points = 2;
  
  // Updated notes
  string notes = 3;
  
  // Updated priority
  string priority = 4;
  
  // Updated scheduled date
  google.protobuf.Timestamp scheduled_date = 5;
}

// Request message for deleting a quality inspection
message DeleteQualityInspectionRequest {
  // Unique identifier of the quality inspection
  string inspection_id = 1;
}

// Request message for starting a quality inspection
message StartQualityInspectionRequest {
  // Unique identifier of the quality inspection
  string inspection_id = 1;
  
  // Inspector identifier
  string inspector_id = 2;
  
  // Additional notes
  string notes = 3;
}

// Request message for completing a quality inspection
message CompleteQualityInspectionRequest {
  // Unique identifier of the quality inspection
  string inspection_id = 1;
  
  // Inspector identifier
  string inspector_id = 2;
  
  // Inspection results
  repeated InspectionResult results = 3;
  
  // Overall pass/fail status
  bool passed = 4;
  
  // Overall quality score
  double quality_score = 5;
  
  // Defects found
  repeated Defect defects = 6;
  
  // Recommendations
  string recommendations = 7;
  
  // Additional notes
  string notes = 8;
}

// Request message for creating a quality action
message CreateQualityActionRequest {
  // Quality inspection identifier
  string inspection_id = 1;
  
  // Action type
  manufacturing.quality.enums.QualityActionType action_type = 2;
  
  // Action description
  string description = 3;
  
  // Priority level
  string priority = 4;
  
  // Assigned to
  string assigned_to = 5;
  
  // Due date
  google.protobuf.Timestamp due_date = 6;
  
  // Root cause analysis
  string root_cause_analysis = 7;
  
  // Corrective measures
  string corrective_measures = 8;
  
  // Preventive measures
  string preventive_measures = 9;
  
  // Additional notes
  string notes = 10;
}

// Request message for retrieving a quality action
message GetQualityActionRequest {
  // Unique identifier of the quality action
  string action_id = 1;
}

// Request message for listing quality actions
message ListQualityActionsRequest {
  // Page number for pagination
  int32 page = 1;
  
  // Number of items per page
  int32 page_size = 2;
  
  // Filter by action type
  manufacturing.quality.enums.QualityActionType action_type = 3;
  
  // Filter by status
  string status = 4;
  
  // Filter by assigned to
  string assigned_to = 5;
  
  // Filter by due date range - start
  google.protobuf.Timestamp start_date = 6;
  
  // Filter by due date range - end
  google.protobuf.Timestamp end_date = 7;
}

// Request message for updating a quality action
message UpdateQualityActionRequest {
  // Unique identifier of the quality action
  string action_id = 1;
  
  // Updated status
  string status = 2;
  
  // Updated description
  string description = 3;
  
  // Updated assigned to
  string assigned_to = 4;
  
  // Updated due date
  google.protobuf.Timestamp due_date = 5;
  
  // Updated root cause analysis
  string root_cause_analysis = 6;
  
  // Updated corrective measures
  string corrective_measures = 7;
  
  // Updated preventive measures
  string preventive_measures = 8;
  
  // Updated notes
  string notes = 9;
}

// Request message for completing a quality action
message CompleteQualityActionRequest {
  // Unique identifier of the quality action
  string action_id = 1;
  
  // Completion status
  string completion_status = 2;
  
  // Completion notes
  string completion_notes = 3;
  
  // Completed by
  string completed_by = 4;
  
  // Completion date
  google.protobuf.Timestamp completion_date = 5;
  
  // Effectiveness rating
  double effectiveness_rating = 6;
  
  // Follow-up required
  bool follow_up_required = 7;
  
  // Follow-up date
  google.protobuf.Timestamp follow_up_date = 8;
}

// Inspection point details
message InspectionPoint {
  // Inspection point identifier
  string point_id = 1;
  
  // Inspection point name
  string point_name = 2;
  
  // Inspection point description
  string description = 3;
  
  // Measurement type
  string measurement_type = 4;
  
  // Target value
  double target_value = 5;
  
  // Upper tolerance
  double upper_tolerance = 6;
  
  // Lower tolerance
  double lower_tolerance = 7;
  
  // Unit of measurement
  string unit = 8;
  
  // Inspection method
  string inspection_method = 9;
  
  // Sampling size
  int32 sampling_size = 10;
  
  // Criticality level
  string criticality_level = 11;
}

// Inspection result details
message InspectionResult {
  // Inspection point identifier
  string point_id = 1;
  
  // Measured value
  double measured_value = 2;
  
  // Pass/fail status
  bool passed = 3;
  
  // Deviation from target
  double deviation = 4;
  
  // Within tolerance
  bool within_tolerance = 5;
  
  // Measurement unit
  string unit = 6;
  
  // Measurement timestamp
  google.protobuf.Timestamp measurement_time = 7;
  
  // Inspector notes
  string notes = 8;
  
  // Photo or document references
  repeated string attachments = 9;
}

// Defect details
message Defect {
  // Defect identifier
  string defect_id = 1;
  
  // Defect type
  string defect_type = 2;
  
  // Defect description
  string description = 3;
  
  // Defect severity
  manufacturing.quality.enums.DefectSeverity severity = 4;
  
  // Defect location
  string location = 5;
  
  // Defect quantity
  int32 quantity = 6;
  
  // Defect cause
  string cause = 7;
  
  // Defect impact
  string impact = 8;
  
  // Photo or document references
  repeated string attachments = 9;
  
  // Discovery date
  google.protobuf.Timestamp discovery_date = 10;
  
  // Discovered by
  string discovered_by = 11;
}
