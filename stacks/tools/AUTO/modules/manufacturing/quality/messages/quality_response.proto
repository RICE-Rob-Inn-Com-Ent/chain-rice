syntax = "proto3";

package manufacturing.quality.messages;

import "google/protobuf/timestamp.proto";
import "manufacturing/quality/enums/quality_level.proto";

// Response message for creating a quality inspection
message CreateQualityInspectionResponse {
  // Success status
  bool success = 1;
  
  // Error message if creation failed
  string error_message = 2;
  
  // Created quality inspection details
  QualityInspection inspection = 3;
}

// Response message for retrieving a quality inspection
message GetQualityInspectionResponse {
  // Success status
  bool success = 1;
  
  // Error message if retrieval failed
  string error_message = 2;
  
  // Quality inspection details
  QualityInspection inspection = 3;
}

// Response message for listing quality inspections
message ListQualityInspectionsResponse {
  // Success status
  bool success = 1;
  
  // Error message if listing failed
  string error_message = 2;
  
  // List of quality inspections
  repeated QualityInspection inspections = 3;
  
  // Total count of inspections matching the filter
  int32 total_count = 4;
  
  // Current page number
  int32 current_page = 5;
  
  // Total number of pages
  int32 total_pages = 6;
}

// Response message for updating a quality inspection
message UpdateQualityInspectionResponse {
  // Success status
  bool success = 1;
  
  // Error message if update failed
  string error_message = 2;
  
  // Updated quality inspection details
  QualityInspection inspection = 3;
}

// Response message for deleting a quality inspection
message DeleteQualityInspectionResponse {
  // Success status
  bool success = 1;
  
  // Error message if deletion failed
  string error_message = 2;
}

// Response message for starting a quality inspection
message StartQualityInspectionResponse {
  // Success status
  bool success = 1;
  
  // Error message if start failed
  string error_message = 2;
  
  // Started quality inspection details
  QualityInspection inspection = 3;
}

// Response message for completing a quality inspection
message CompleteQualityInspectionResponse {
  // Success status
  bool success = 1;
  
  // Error message if completion failed
  string error_message = 2;
  
  // Completed quality inspection details
  QualityInspection inspection = 3;
}

// Response message for creating a quality action
message CreateQualityActionResponse {
  // Success status
  bool success = 1;
  
  // Error message if creation failed
  string error_message = 2;
  
  // Created quality action details
  QualityAction action = 3;
}

// Response message for retrieving a quality action
message GetQualityActionResponse {
  // Success status
  bool success = 1;
  
  // Error message if retrieval failed
  string error_message = 2;
  
  // Quality action details
  QualityAction action = 3;
}

// Response message for listing quality actions
message ListQualityActionsResponse {
  // Success status
  bool success = 1;
  
  // Error message if listing failed
  string error_message = 2;
  
  // List of quality actions
  repeated QualityAction actions = 3;
  
  // Total count of actions matching the filter
  int32 total_count = 4;
  
  // Current page number
  int32 current_page = 5;
  
  // Total number of pages
  int32 total_pages = 6;
}

// Response message for updating a quality action
message UpdateQualityActionResponse {
  // Success status
  bool success = 1;
  
  // Error message if update failed
  string error_message = 2;
  
  // Updated quality action details
  QualityAction action = 3;
}

// Response message for completing a quality action
message CompleteQualityActionResponse {
  // Success status
  bool success = 1;
  
  // Error message if completion failed
  string error_message = 2;
  
  // Completed quality action details
  QualityAction action = 3;
}

// Quality inspection data structure
message QualityInspection {
  // Unique identifier
  string inspection_id = 1;
  
  // Product or material identifier
  string item_id = 2;
  
  // Item name
  string item_name = 3;
  
  // Item description
  string description = 4;
  
  // Batch or lot number
  string batch_number = 5;
  
  // Quality control type
  manufacturing.quality.enums.QualityControlType control_type = 6;
  
  // Quality level required
  manufacturing.quality.enums.QualityLevel quality_level = 7;
  
  // Quality standards to follow
  repeated manufacturing.quality.enums.QualityStandard standards = 8;
  
  // Current status
  manufacturing.quality.enums.QualityInspectionStatus status = 9;
  
  // Inspection points
  repeated InspectionPoint inspection_points = 10;
  
  // Inspector identifier
  string inspector_id = 10;
  
  // Inspector name
  string inspector_name = 11;
  
  // Scheduled inspection date
  google.protobuf.Timestamp scheduled_date = 12;
  
  // Actual start date
  google.protobuf.Timestamp started_at = 13;
  
  // Actual completion date
  google.protobuf.Timestamp completed_at = 14;
  
  // Priority level
  string priority = 15;
  
  // Additional notes
  string notes = 16;
  
  // Manufacturing order identifier
  string manufacturing_order_id = 17;
  
  // Supplier identifier
  string supplier_id = 18;
  
  // Supplier name
  string supplier_name = 19;
  
  // Inspection results
  repeated InspectionResult results = 20;
  
  // Overall pass/fail status
  bool passed = 21;
  
  // Overall quality score
  double quality_score = 22;
  
  // Defects found
  repeated Defect defects = 23;
  
  // Recommendations
  string recommendations = 24;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 25;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 26;
  
  // Quality actions
  repeated string quality_action_ids = 27;
  
  // Inspection duration in minutes
  int32 duration_minutes = 28;
  
  // Number of inspection points
  int32 total_inspection_points = 29;
  
  // Number of passed inspection points
  int32 passed_inspection_points = 30;
  
  // Number of failed inspection points
  int32 failed_inspection_points = 31;
  
  // Defect rate percentage
  double defect_rate_percentage = 32;
  
  // Quality cost
  double quality_cost = 33;
  
  // Currency code
  string currency = 34;
}

// Quality action data structure
message QualityAction {
  // Unique identifier
  string action_id = 1;
  
  // Quality inspection identifier
  string inspection_id = 2;
  
  // Action type
  manufacturing.quality.enums.QualityActionType action_type = 3;
  
  // Action description
  string description = 4;
  
  // Current status
  string status = 5;
  
  // Priority level
  string priority = 6;
  
  // Assigned to
  string assigned_to = 7;
  
  // Assigned to name
  string assigned_to_name = 8;
  
  // Due date
  google.protobuf.Timestamp due_date = 9;
  
  // Root cause analysis
  string root_cause_analysis = 10;
  
  // Corrective measures
  string corrective_measures = 11;
  
  // Preventive measures
  string preventive_measures = 12;
  
  // Additional notes
  string notes = 13;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 14;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 15;
  
  // Completion status
  string completion_status = 16;
  
  // Completion notes
  string completion_notes = 17;
  
  // Completed by
  string completed_by = 18;
  
  // Completed by name
  string completed_by_name = 19;
  
  // Completion date
  google.protobuf.Timestamp completion_date = 20;
  
  // Effectiveness rating
  double effectiveness_rating = 21;
  
  // Follow-up required
  bool follow_up_required = 22;
  
  // Follow-up date
  google.protobuf.Timestamp follow_up_date = 23;
  
  // Estimated cost
  double estimated_cost = 24;
  
  // Actual cost
  double actual_cost = 25;
  
  // Currency code
  string currency = 26;
  
  // Related defects
  repeated string defect_ids = 27;
  
  // Related inspection points
  repeated string inspection_point_ids = 28;
}

// Inspection point details
message InspectionPoint {
  // Inspection point identifier
  string point_id = 1;
  
  // Inspection point name
  string point_name = 2;
  
  // Inspection point description
  string description = 3;
  
  // Measurement type
  string measurement_type = 4;
  
  // Target value
  double target_value = 5;
  
  // Upper tolerance
  double upper_tolerance = 6;
  
  // Lower tolerance
  double lower_tolerance = 7;
  
  // Unit of measurement
  string unit = 8;
  
  // Inspection method
  string inspection_method = 9;
  
  // Sampling size
  int32 sampling_size = 10;
  
  // Criticality level
  string criticality_level = 11;
  
  // Inspection result
  InspectionResult result = 12;
}

// Inspection result details
message InspectionResult {
  // Inspection point identifier
  string point_id = 1;
  
  // Measured value
  double measured_value = 2;
  
  // Pass/fail status
  bool passed = 3;
  
  // Deviation from target
  double deviation = 4;
  
  // Within tolerance
  bool within_tolerance = 5;
  
  // Measurement unit
  string unit = 6;
  
  // Measurement timestamp
  google.protobuf.Timestamp measurement_time = 7;
  
  // Inspector notes
  string notes = 8;
  
  // Photo or document references
  repeated string attachments = 9;
  
  // Inspector identifier
  string inspector_id = 10;
  
  // Inspector name
  string inspector_name = 11;
}

// Defect details
message Defect {
  // Defect identifier
  string defect_id = 1;
  
  // Defect type
  string defect_type = 2;
  
  // Defect description
  string description = 3;
  
  // Defect severity
  manufacturing.quality.enums.DefectSeverity severity = 4;
  
  // Defect location
  string location = 5;
  
  // Defect quantity
  int32 quantity = 6;
  
  // Defect cause
  string cause = 7;
  
  // Defect impact
  string impact = 8;
  
  // Photo or document references
  repeated string attachments = 9;
  
  // Discovery date
  google.protobuf.Timestamp discovery_date = 10;
  
  // Discovered by
  string discovered_by = 11;
  
  // Discovered by name
  string discovered_by_name = 12;
  
  // Defect cost impact
  double cost_impact = 13;
  
  // Currency code
  string currency = 14;
  
  // Related quality actions
  repeated string quality_action_ids = 15;
}
