syntax = "proto3";

package manufacturing.suppliers.enums;

// Supplier type enumeration
// Defines the different types of suppliers in the manufacturing ecosystem
enum SupplierType {
  // Default value - should not be used
  SUPPLIER_TYPE_UNSPECIFIED = 0;
  
  // Raw material supplier
  RAW_MATERIAL = 1;
  
  // Component supplier
  COMPONENT = 2;
  
  // Equipment supplier
  EQUIPMENT = 3;
  
  // Service provider
  SERVICE_PROVIDER = 4;
  
  // Logistics provider
  LOGISTICS = 5;
  
  // Maintenance service provider
  MAINTENANCE = 6;
  
  // Quality inspection service provider
  QUALITY_INSPECTION = 7;
  
  // Packaging supplier
  PACKAGING = 8;
  
  // Tooling supplier
  TOOLING = 9;
  
  // Software provider
  SOFTWARE = 10;
  
  // Consulting services
  CONSULTING = 11;
  
  // Energy provider
  ENERGY = 12;
  
  // Waste management
  WASTE_MANAGEMENT = 13;
}

// Supplier status enumeration
enum SupplierStatus {
  // Default value - should not be used
  SUPPLIER_STATUS_UNSPECIFIED = 0;
  
  // Supplier is active and available
  ACTIVE = 1;
  
  // Supplier is inactive
  INACTIVE = 2;
  
  // Supplier is pending approval
  PENDING_APPROVAL = 3;
  
  // Supplier is approved
  APPROVED = 4;
  
  // Supplier is rejected
  REJECTED = 5;
  
  // Supplier is suspended
  SUSPENDED = 6;
  
  // Supplier is blacklisted
  BLACKLISTED = 7;
  
  // Supplier is under review
  UNDER_REVIEW = 8;
  
  // Supplier is on probation
  ON_PROBATION = 9;
  
  // Supplier is discontinued
  DISCONTINUED = 10;
}

// Supplier certification status enumeration
enum SupplierCertificationStatus {
  // Default value - should not be used
  SUPPLIER_CERTIFICATION_STATUS_UNSPECIFIED = 0;
  
  // Certification is valid
  VALID = 1;
  
  // Certification is expired
  EXPIRED = 2;
  
  // Certification is pending
  PENDING = 3;
  
  // Certification is under review
  UNDER_REVIEW = 4;
  
  // Certification is rejected
  REJECTED = 5;
  
  // Certification is suspended
  SUSPENDED = 6;
  
  // Certification is not required
  NOT_REQUIRED = 7;
  
  // Certification is in progress
  IN_PROGRESS = 8;
}

// Supplier performance rating enumeration
enum SupplierPerformanceRating {
  // Default value - should not be used
  SUPPLIER_PERFORMANCE_RATING_UNSPECIFIED = 0;
  
  // Excellent performance
  EXCELLENT = 1;
  
  // Good performance
  GOOD = 2;
  
  // Satisfactory performance
  SATISFACTORY = 3;
  
  // Poor performance
  POOR = 4;
  
  // Unsatisfactory performance
  UNSATISFACTORY = 5;
  
  // Performance not rated
  NOT_RATED = 6;
}

// Supplier risk level enumeration
enum SupplierRiskLevel {
  // Default value - should not be used
  SUPPLIER_RISK_LEVEL_UNSPECIFIED = 0;
  
  // Low risk supplier
  LOW = 1;
  
  // Medium risk supplier
  MEDIUM = 2;
  
  // High risk supplier
  HIGH = 3;
  
  // Critical risk supplier
  CRITICAL = 4;
  
  // Risk level not assessed
  NOT_ASSESSED = 5;
}

// Payment terms enumeration
enum PaymentTerms {
  // Default value - should not be used
  PAYMENT_TERMS_UNSPECIFIED = 0;
  
  // Payment due immediately
  IMMEDIATE = 1;
  
  // Payment due in 7 days
  NET_7 = 2;
  
  // Payment due in 15 days
  NET_15 = 3;
  
  // Payment due in 30 days
  NET_30 = 4;
  
  // Payment due in 45 days
  NET_45 = 5;
  
  // Payment due in 60 days
  NET_60 = 6;
  
  // Payment due in 90 days
  NET_90 = 7;
  
  // Payment due on delivery
  DUE_ON_DELIVERY = 8;
  
  // Payment due on receipt
  DUE_ON_RECEIPT = 9;
  
  // Payment due end of month
  END_OF_MONTH = 10;
  
  // Payment due end of quarter
  END_OF_QUARTER = 11;
  
  // Payment due end of year
  END_OF_YEAR = 12;
}

// Supplier relationship type enumeration
enum SupplierRelationshipType {
  // Default value - should not be used
  SUPPLIER_RELATIONSHIP_TYPE_UNSPECIFIED = 0;
  
  // Strategic partnership
  STRATEGIC_PARTNERSHIP = 1;
  
  // Preferred supplier
  PREFERRED = 2;
  
  // Approved supplier
  APPROVED = 3;
  
  // Qualified supplier
  QUALIFIED = 4;
  
  // Potential supplier
  POTENTIAL = 5;
  
  // Single source supplier
  SINGLE_SOURCE = 6;
  
  // Backup supplier
  BACKUP = 7;
  
  // Emergency supplier
  EMERGENCY = 8;
  
  // Local supplier
  LOCAL = 9;
  
  // International supplier
  INTERNATIONAL = 10;
}
