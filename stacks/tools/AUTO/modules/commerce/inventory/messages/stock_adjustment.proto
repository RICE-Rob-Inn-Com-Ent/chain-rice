syntax = "proto3";

package commerce.inventory.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/inventory/messages";

// Stock adjustment message for inventory changes
message StockAdjustment {
  // Unique identifier for the adjustment
  string id = 1;
  
  // Stock item identifier being adjusted
  string stock_item_id = 2;
  
  // Warehouse identifier
  string warehouse_id = 3;
  
  // Adjustment type (add, remove, transfer, etc.)
  string adjustment_type = 4;
  
  // Quantity being adjusted (positive for additions, negative for removals)
  int32 quantity = 5;
  
  // Reason for the adjustment
  string reason = 6;
  
  // Reference to related document (PO, invoice, etc.)
  string reference_document = 7;
  
  // User who performed the adjustment
  string adjusted_by = 8;
  
  // Date and time of the adjustment
  google.protobuf.Timestamp adjusted_at = 9;
  
  // Previous quantity before adjustment
  int32 previous_quantity = 10;
  
  // New quantity after adjustment
  int32 new_quantity = 11;
  
  // Unit cost of the adjustment
  double unit_cost = 12;
  
  // Total cost of the adjustment
  double total_cost = 13;
  
  // Additional notes about the adjustment
  string notes = 14;
  
  // Status of the adjustment (pending, approved, rejected)
  string status = 15;
  
  // Date when the adjustment was created
  google.protobuf.Timestamp created_at = 16;
  
  // Date when the adjustment was last updated
  google.protobuf.Timestamp updated_at = 17;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 18;
}

// Request message for creating a stock adjustment
message CreateStockAdjustmentRequest {
  // Stock item identifier
  string stock_item_id = 1;
  
  // Warehouse identifier
  string warehouse_id = 2;
  
  // Adjustment type
  string adjustment_type = 3;
  
  // Quantity to adjust
  int32 quantity = 4;
  
  // Reason for adjustment
  string reason = 5;
  
  // Reference document
  string reference_document = 6;
  
  // Unit cost
  double unit_cost = 7;
  
  // Additional notes
  string notes = 8;
}

// Response message for stock adjustment creation
message CreateStockAdjustmentResponse {
  // Created stock adjustment
  StockAdjustment adjustment = 1;
  
  // Success indicator
  bool success = 2;
  
  // Error message if any
  string error_message = 3;
}
