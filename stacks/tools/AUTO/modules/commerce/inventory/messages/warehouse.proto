syntax = "proto3";

package commerce.inventory.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/inventory/messages";

// Warehouse message representing a physical storage location
message Warehouse {
  // Unique identifier for the warehouse
  string id = 1;
  
  // Name of the warehouse
  string name = 2;
  
  // Description of the warehouse
  string description = 3;
  
  // Warehouse code for quick reference
  string code = 4;
  
  // Physical address of the warehouse
  Address address = 5;
  
  // Contact information for the warehouse
  ContactInfo contact_info = 6;
  
  // Warehouse type (main, distribution, retail, etc.)
  string type = 7;
  
  // Current status (active, inactive, maintenance, etc.)
  string status = 8;
  
  // Storage capacity information
  Capacity capacity = 9;
  
  // Operating hours
  OperatingHours operating_hours = 10;
  
  // Date when the warehouse was created
  google.protobuf.Timestamp created_at = 11;
  
  // Date when the warehouse was last updated
  google.protobuf.Timestamp updated_at = 12;
  
  // Additional metadata as key-value pairs
  map<string, string> metadata = 13;
  
  // Notes or comments about the warehouse
  string notes = 14;
}

// Physical address information
message Address {
  // Street address line 1
  string street_address_1 = 1;
  
  // Street address line 2
  string street_address_2 = 2;
  
  // City
  string city = 3;
  
  // State or province
  string state_province = 4;
  
  // Postal or ZIP code
  string postal_code = 5;
  
  // Country
  string country = 6;
  
  // Latitude coordinate
  double latitude = 7;
  
  // Longitude coordinate
  double longitude = 8;
}

// Contact information for the warehouse
message ContactInfo {
  // Primary contact person
  string contact_person = 1;
  
  // Phone number
  string phone = 2;
  
  // Email address
  string email = 3;
  
  // Fax number
  string fax = 4;
  
  // Website URL
  string website = 5;
}

// Storage capacity information
message Capacity {
  // Total storage area in square meters
  double total_area_sqm = 1;
  
  // Available storage area in square meters
  double available_area_sqm = 2;
  
  // Maximum weight capacity in kilograms
  double max_weight_kg = 3;
  
  // Current weight usage in kilograms
  double current_weight_kg = 4;
  
  // Number of storage units (shelves, bins, etc.)
  int32 storage_units = 5;
  
  // Temperature range for temperature-controlled storage
  string temperature_range = 6;
}

// Operating hours for the warehouse
message OperatingHours {
  // Monday operating hours
  DayHours monday = 1;
  
  // Tuesday operating hours
  DayHours tuesday = 2;
  
  // Wednesday operating hours
  DayHours wednesday = 3;
  
  // Thursday operating hours
  DayHours thursday = 4;
  
  // Friday operating hours
  DayHours friday = 5;
  
  // Saturday operating hours
  DayHours saturday = 6;
  
  // Sunday operating hours
  DayHours sunday = 7;
}

// Hours for a specific day
message DayHours {
  // Whether the warehouse is open on this day
  bool is_open = 1;
  
  // Opening time (24-hour format HH:MM)
  string opening_time = 2;
  
  // Closing time (24-hour format HH:MM)
  string closing_time = 3;
  
  // Break start time (24-hour format HH:MM)
  string break_start = 4;
  
  // Break end time (24-hour format HH:MM)
  string break_end = 5;
}
