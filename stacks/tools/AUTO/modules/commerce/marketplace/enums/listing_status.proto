syntax = "proto3";

package commerce.marketplace.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/marketplace/enums";

// Listing status enumeration
enum ListingStatus {
  // Unknown or unspecified listing status
  LISTING_STATUS_UNSPECIFIED = 0;
  
  // Listing is being drafted
  LISTING_STATUS_DRAFT = 1;
  
  // Listing is pending approval
  LISTING_STATUS_PENDING = 2;
  
  // Listing is active and visible
  LISTING_STATUS_ACTIVE = 3;
  
  // Listing is paused by seller
  LISTING_STATUS_PAUSED = 4;
  
  // Listing is sold out
  LISTING_STATUS_SOLD_OUT = 5;
  
  // Listing has ended
  LISTING_STATUS_ENDED = 6;
  
  // Listing is suspended by marketplace
  LISTING_STATUS_SUSPENDED = 7;
  
  // Listing is rejected by marketplace
  LISTING_STATUS_REJECTED = 8;
  
  // Listing is expired
  LISTING_STATUS_EXPIRED = 9;
  
  // Listing is archived
  LISTING_STATUS_ARCHIVED = 10;
  
  // Listing is scheduled for future activation
  LISTING_STATUS_SCHEDULED = 11;
  
  // Listing is under review
  LISTING_STATUS_UNDER_REVIEW = 12;
}
