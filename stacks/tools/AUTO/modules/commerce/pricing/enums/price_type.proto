syntax = "proto3";

package commerce.pricing.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/pricing/enums";

// Price type enumeration
enum PriceType {
  // Unknown or unspecified price type
  PRICE_TYPE_UNSPECIFIED = 0;
  
  // Regular selling price
  PRICE_TYPE_REGULAR = 1;
  
  // Sale price (discounted)
  PRICE_TYPE_SALE = 2;
  
  // Wholesale price
  PRICE_TYPE_WHOLESALE = 3;
  
  // Retail price
  PRICE_TYPE_RETAIL = 4;
  
  // Cost price (for seller reference)
  PRICE_TYPE_COST = 5;
  
  // MSRP (Manufacturer's Suggested Retail Price)
  PRICE_TYPE_MSRP = 6;
  
  // MAP (Minimum Advertised Price)
  PRICE_TYPE_MAP = 7;
  
  // Promotional price
  PRICE_TYPE_PROMOTIONAL = 8;
  
  // Bulk price (for quantity discounts)
  PRICE_TYPE_BULK = 9;
  
  // Tiered price (based on quantity tiers)
  PRICE_TYPE_TIERED = 10;
  
  // Dynamic price (changes based on conditions)
  PRICE_TYPE_DYNAMIC = 11;
  
  // Auction starting price
  PRICE_TYPE_AUCTION_START = 12;
  
  // Auction reserve price
  PRICE_TYPE_AUCTION_RESERVE = 13;
  
  // Subscription price
  PRICE_TYPE_SUBSCRIPTION = 14;
  
  // Rental price
  PRICE_TYPE_RENTAL = 15;
  
  // Leasing price
  PRICE_TYPE_LEASE = 16;
}
