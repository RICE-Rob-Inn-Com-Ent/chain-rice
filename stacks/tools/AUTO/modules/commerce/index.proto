syntax = "proto3";

package commerce;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce";

// Commerce module index file - imports all key enums, messages, and services
// This file provides a single import point for all commerce-related protobuf definitions

// Import all enums
import "inventory/enums/inventory_status.proto";
import "inventory/enums/inventory_type.proto";
import "inventory/enums/inventory_priority.proto";

import "marketplace/enums/marketplace_type.proto";
import "marketplace/enums/listing_status.proto";
import "marketplace/enums/payment_method.proto";

import "orders/enums/order_status.proto";
import "orders/enums/order_type.proto";
import "orders/enums/payment_status.proto";

import "pricing/enums/price_type.proto";
import "pricing/enums/discount_type.proto";

import "products/enums/product_category.proto";
import "products/enums/product_status.proto";

// Import all messages
import "inventory/messages/stock_item.proto";
import "inventory/messages/warehouse.proto";
import "inventory/messages/stock_adjustment.proto";

import "marketplace/messages/listing.proto";
import "marketplace/messages/offer.proto";
import "marketplace/messages/review.proto";

import "orders/messages/order.proto";
import "orders/messages/order_item.proto";
import "orders/messages/payment.proto";

import "pricing/messages/price.proto";
import "pricing/messages/discount.proto";

import "products/messages/product.proto";
import "products/messages/product_attribute.proto";

// Import all services
import "inventory/services/inventory_service.proto";
import "marketplace/services/marketplace_service.proto";
import "orders/services/order_service.proto";
import "pricing/services/pricing_service.proto";
import "products/services/product_service.proto";

// Commerce module summary
message CommerceModuleSummary {
  // Module version
  string version = 1;
  
  // Module description
  string description = 2;
  
  // Available services
  repeated string available_services = 3;
  
  // Available enums
  repeated string available_enums = 4;
  
  // Available messages
  repeated string available_messages = 5;
  
  // Module capabilities
  repeated string capabilities = 6;
  
  // Last updated timestamp
  int64 last_updated = 7;
}

// Main service aggregator - provides access to all commerce services
service CommerceService {
  // Inventory operations
  rpc CreateInventoryItem(commerce.inventory.services.CreateInventoryItemRequest) returns (commerce.inventory.services.CreateInventoryItemResponse);
  rpc GetInventoryItem(commerce.inventory.services.GetInventoryItemRequest) returns (commerce.inventory.services.GetInventoryItemResponse);
  rpc UpdateInventoryItem(commerce.inventory.services.UpdateInventoryItemRequest) returns (commerce.inventory.services.UpdateInventoryItemResponse);
  rpc DeleteInventoryItem(commerce.inventory.services.DeleteInventoryItemRequest) returns (commerce.inventory.services.DeleteInventoryItemResponse);
  
  // Marketplace operations
  rpc CreateListing(commerce.marketplace.services.CreateListingRequest) returns (commerce.marketplace.services.CreateListingResponse);
  rpc GetListing(commerce.marketplace.services.GetListingRequest) returns (commerce.marketplace.services.GetListingResponse);
  rpc UpdateListing(commerce.marketplace.services.UpdateListingRequest) returns (commerce.marketplace.services.UpdateListingResponse);
  rpc DeleteListing(commerce.marketplace.services.DeleteListingRequest) returns (commerce.marketplace.services.DeleteListingResponse);
  
  // Order operations
  rpc CreateOrder(commerce.orders.services.CreateOrderRequest) returns (commerce.orders.services.CreateOrderResponse);
  rpc GetOrder(commerce.orders.services.GetOrderRequest) returns (commerce.orders.services.GetOrderResponse);
  rpc UpdateOrderStatus(commerce.orders.services.UpdateOrderStatusRequest) returns (commerce.orders.services.UpdateOrderStatusResponse);
  rpc CancelOrder(commerce.orders.services.CancelOrderRequest) returns (commerce.orders.services.CancelOrderResponse);
  
  // Pricing operations
  rpc CreatePrice(commerce.pricing.services.CreatePriceRequest) returns (commerce.pricing.services.CreatePriceResponse);
  rpc GetPrice(commerce.pricing.services.GetPriceRequest) returns (commerce.pricing.services.GetPriceResponse);
  rpc UpdatePrice(commerce.pricing.services.UpdatePriceRequest) returns (commerce.pricing.services.UpdatePriceResponse);
  rpc DeletePrice(commerce.pricing.services.DeletePriceRequest) returns (commerce.pricing.services.DeletePriceResponse);
  
  // Product operations
  rpc CreateProduct(commerce.products.services.CreateProductRequest) returns (commerce.products.services.CreateProductResponse);
  rpc GetProduct(commerce.products.services.GetProductRequest) returns (commerce.products.services.GetProductResponse);
  rpc UpdateProduct(commerce.products.services.UpdateProductRequest) returns (commerce.products.services.UpdateProductResponse);
  rpc DeleteProduct(commerce.products.services.DeleteProductRequest) returns (commerce.products.services.DeleteProductResponse);
}
