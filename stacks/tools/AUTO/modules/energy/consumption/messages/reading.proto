syntax = "proto3";

package energy.consumption.messages;

import "energy/consumption/enums/reading_status.proto";
import "energy/consumption/enums/consumption_unit.proto";

// Meter reading record for energy consumption
message Reading {
  // Unique identifier for the reading
  string id = 1;
  
  // Meter ID this reading belongs to
  string meter_id = 2;
  
  // Customer ID
  string customer_id = 3;
  
  // Reading value
  double value = 4;
  
  // Previous reading value
  double previous_value = 5;
  
  // Consumption difference (current - previous)
  double consumption_difference = 6;
  
  // Unit of measurement
  energy.consumption.enums.ConsumptionUnit unit = 7;
  
  // Reading date and time (unix milliseconds)
  int64 reading_timestamp = 8;
  
  // Reading status
  energy.consumption.enums.ReadingStatus status = 9;
  
  // Reading type
  ReadingType type = 10;
  
  // Method used to collect this reading
  ReadingMethod method = 11;
  
  // Person or system that collected the reading
  string collected_by = 12;
  
  // Reading source (manual, automatic, estimated, etc.)
  string source = 13;
  
  // Quality indicators
  ReadingQuality quality = 14;
  
  // Validation results
  ReadingValidation validation = 15;
  
  // Reading notes or comments
  string notes = 16;
  
  // Additional reading data
  map<string, string> additional_data = 17;
  
  // Billing period this reading applies to
  BillingPeriod billing_period = 18;
  
  // Weather conditions at time of reading
  WeatherConditions weather_conditions = 19;
  
  // Meter condition at time of reading
  MeterCondition meter_condition = 20;
  
  // Additional metadata
  map<string, string> metadata = 21;
  
  // Timestamp when this reading was created (unix milliseconds)
  int64 created_at = 22;
  
  // Timestamp when this reading was last updated (unix milliseconds)
  int64 updated_at = 23;
}

// Reading type enumeration
enum ReadingType {
  // Regular scheduled reading
  READING_TYPE_REGULAR = 0;
  
  // Initial reading (new meter installation)
  READING_TYPE_INITIAL = 1;
  
  // Final reading (meter removal)
  READING_TYPE_FINAL = 2;
  
  // Special reading (move-in, move-out)
  READING_TYPE_SPECIAL = 3;
  
  // Estimated reading
  READING_TYPE_ESTIMATED = 4;
  
  // Corrected reading
  READING_TYPE_CORRECTED = 5;
  
  // Test reading
  READING_TYPE_TEST = 6;
  
  // Verification reading
  READING_TYPE_VERIFICATION = 7;
  
  // Dispute reading
  READING_TYPE_DISPUTE = 8;
  
  // High usage reading
  READING_TYPE_HIGH_USAGE = 9;
  
  // Zero usage reading
  READING_TYPE_ZERO_USAGE = 10;
  
  // Negative usage reading
  READING_TYPE_NEGATIVE_USAGE = 11;
  
  // Maximum demand reading
  READING_TYPE_MAXIMUM_DEMAND = 12;
  
  // Peak demand reading
  READING_TYPE_PEAK_DEMAND = 13;
  
  // Off-peak demand reading
  READING_TYPE_OFF_PEAK_DEMAND = 14;
}

// Reading collection method
enum ReadingMethod {
  // Manual reading by meter reader
  READING_METHOD_MANUAL = 0;
  
  // Automatic reading via smart meter
  READING_METHOD_AUTOMATIC = 1;
  
  // Customer self-reading
  READING_METHOD_CUSTOMER_SELF_READING = 2;
  
  // Drive-by reading (RF)
  READING_METHOD_DRIVE_BY = 3;
  
  // Walk-by reading (RF)
  READING_METHOD_WALK_BY = 4;
  
  // Fixed network reading
  READING_METHOD_FIXED_NETWORK = 5;
  
  // Mobile network reading
  READING_METHOD_MOBILE_NETWORK = 6;
  
  // Internet reading
  READING_METHOD_INTERNET = 7;
  
  // Satellite reading
  READING_METHOD_SATELLITE = 8;
  
  // Telephone reading
  READING_METHOD_TELEPHONE = 9;
  
  // Estimated reading based on historical data
  READING_METHOD_ESTIMATED = 10;
  
  // Calculated reading
  READING_METHOD_CALCULATED = 11;
  
  // Interpolated reading
  READING_METHOD_INTERPOLATED = 12;
  
  // Extrapolated reading
  READING_METHOD_EXTRAPOLATED = 13;
}

// Reading quality indicators
message ReadingQuality {
  // Quality score (0-100)
  int32 quality_score = 1;
  
  // Data completeness percentage
  double completeness_percentage = 2;
  
  // Data accuracy assessment
  string accuracy_assessment = 3;
  
  // Quality flags
  repeated string quality_flags = 4;
  
  // Data anomalies detected
  repeated string anomalies = 5;
  
  // Confidence level in reading
  double confidence_level = 6;
}

// Reading validation results
message ReadingValidation {
  // Validation status
  ValidationStatus status = 1;
  
  // Validation rules applied
  repeated string validation_rules = 2;
  
  // Validation results
  repeated ValidationResult results = 3;
  
  // Overall validation score
  double validation_score = 4;
  
  // Validation timestamp
  int64 validation_timestamp = 5;
  
  // Validated by
  string validated_by = 6;
}

// Validation status enumeration
enum ValidationStatus {
  // Reading passed all validations
  VALIDATION_STATUS_PASSED = 0;
  
  // Reading failed validation
  VALIDATION_STATUS_FAILED = 1;
  
  // Reading passed with warnings
  VALIDATION_STATUS_WARNING = 2;
  
  // Reading is under review
  VALIDATION_STATUS_UNDER_REVIEW = 3;
  
  // Reading validation is pending
  VALIDATION_STATUS_PENDING = 4;
  
  // Reading validation failed
  VALIDATION_STATUS_VALIDATION_FAILED = 5;
}

// Individual validation result
message ValidationResult {
  // Validation rule name
  string rule_name = 1;
  
  // Validation result (pass/fail/warning)
  string result = 2;
  
  // Validation message
  string message = 3;
  
  // Validation value
  double value = 4;
  
  // Expected value or range
  string expected = 5;
  
  // Severity level
  string severity = 6;
}

// Billing period information
message BillingPeriod {
  // Billing period start date (unix milliseconds)
  int64 start_date = 1;
  
  // Billing period end date (unix milliseconds)
  int64 end_date = 2;
  
  // Billing period identifier
  string period_id = 3;
  
  // Billing cycle type
  string cycle_type = 4;
}

// Weather conditions at time of reading
message WeatherConditions {
  // Temperature in Celsius
  double temperature = 1;
  
  // Humidity percentage
  double humidity = 2;
  
  // Weather condition description
  string condition = 3;
  
  // Wind speed
  double wind_speed = 4;
  
  // Precipitation
  double precipitation = 5;
  
  // Barometric pressure
  double barometric_pressure = 6;
}

// Meter condition at time of reading
message MeterCondition {
  // Physical condition of meter
  string physical_condition = 1;
  
  // Operational status
  string operational_status = 2;
  
  // Communication status
  string communication_status = 3;
  
  // Battery level (for wireless meters)
  double battery_level = 4;
  
  // Signal strength (for wireless meters)
  double signal_strength = 5;
  
  // Temperature of meter
  double meter_temperature = 6;
  
  // Any error codes or warnings
  repeated string error_codes = 7;
}
