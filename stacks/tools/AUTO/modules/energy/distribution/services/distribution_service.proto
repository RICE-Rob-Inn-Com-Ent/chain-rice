syntax = "proto3";

package energy.distribution.services;

import "energy/distribution/messages/grid_node.proto";
import "energy/distribution/messages/outage.proto";
import "energy/distribution/messages/distribution_asset.proto";
import "energy/distribution/enums/grid_status.proto";
import "energy/distribution/enums/outage_severity.proto";

// Distribution service for managing grid operations, outages, and assets
service DistributionMsgService {
  // Create a new grid node
  rpc CreateGridNode(CreateGridNodeRequest) returns (CreateGridNodeResponse);
  
  // Update grid node information
  rpc UpdateGridNode(UpdateGridNodeRequest) returns (UpdateGridNodeResponse);
  
  // Remove grid node
  rpc RemoveGridNode(RemoveGridNodeRequest) returns (RemoveGridNodeResponse);
  
  // Update grid node status
  rpc UpdateGridNodeStatus(UpdateGridNodeStatusRequest) returns (UpdateGridNodeStatusResponse);
  
  // Configure grid node
  rpc ConfigureGridNode(ConfigureGridNodeRequest) returns (ConfigureGridNodeResponse);
  
  // Report an outage
  rpc ReportOutage(ReportOutageRequest) returns (ReportOutageResponse);
  
  // Update outage information
  rpc UpdateOutage(UpdateOutageRequest) returns (UpdateOutageResponse);
  
  // Escalate outage
  rpc EscalateOutage(EscalateOutageRequest) returns (EscalateOutageResponse);
  
  // Restore outage
  rpc RestoreOutage(RestoreOutageRequest) returns (RestoreOutageResponse);
  
  // Close outage
  rpc CloseOutage(CloseOutageRequest) returns (CloseOutageResponse);
  
  // Create distribution asset
  rpc CreateDistributionAsset(CreateDistributionAssetRequest) returns (CreateDistributionAssetResponse);
  
  // Update distribution asset
  rpc UpdateDistributionAsset(UpdateDistributionAssetRequest) returns (UpdateDistributionAssetResponse);
  
  // Remove distribution asset
  rpc RemoveDistributionAsset(RemoveDistributionAssetRequest) returns (RemoveDistributionAssetResponse);
  
  // Schedule maintenance for asset
  rpc ScheduleAssetMaintenance(ScheduleAssetMaintenanceRequest) returns (ScheduleAssetMaintenanceResponse);
  
  // Update asset status
  rpc UpdateAssetStatus(UpdateAssetStatusRequest) returns (UpdateAssetStatusResponse);
  
  // Perform load balancing
  rpc PerformLoadBalancing(PerformLoadBalancingRequest) returns (PerformLoadBalancingResponse);
  
  // Switch circuit
  rpc SwitchCircuit(SwitchCircuitRequest) returns (SwitchCircuitResponse);
  
  // Isolate section
  rpc IsolateSection(IsolateSectionRequest) returns (IsolateSectionResponse);
  
  // Restore section
  rpc RestoreSection(RestoreSectionRequest) returns (RestoreSectionResponse);
  
  // Update grid topology
  rpc UpdateGridTopology(UpdateGridTopologyRequest) returns (UpdateGridTopologyResponse);
}

// Query service for reading distribution data
service DistributionQueryService {
  // Get a specific grid node by ID
  rpc GetGridNode(GetGridNodeRequest) returns (GetGridNodeResponse);
  
  // List grid nodes with filters
  rpc ListGridNodes(ListGridNodesRequest) returns (ListGridNodesResponse);
  
  // Get grid topology
  rpc GetGridTopology(GetGridTopologyRequest) returns (GetGridTopologyResponse);
  
  // Get grid status
  rpc GetGridStatus(GetGridStatusRequest) returns (GetGridStatusResponse);
  
  // Get grid statistics
  rpc GetGridStatistics(GetGridStatisticsRequest) returns (GetGridStatisticsResponse);
  
  // Get a specific outage by ID
  rpc GetOutage(GetOutageRequest) returns (GetOutageResponse);
  
  // List outages with filters
  rpc ListOutages(ListOutagesRequest) returns (ListOutagesResponse);
  
  // Get active outages
  rpc GetActiveOutages(GetActiveOutagesRequest) returns (GetActiveOutagesResponse);
  
  // Get outage statistics
  rpc GetOutageStatistics(GetOutageStatisticsRequest) returns (GetOutageStatisticsResponse);
  
  // Get outage trends
  rpc GetOutageTrends(GetOutageTrendsRequest) returns (GetOutageTrendsResponse);
  
  // Get a specific distribution asset by ID
  rpc GetDistributionAsset(GetDistributionAssetRequest) returns (GetDistributionAssetResponse);
  
  // List distribution assets with filters
  rpc ListDistributionAssets(ListDistributionAssetsRequest) returns (ListDistributionAssetsResponse);
  
  // Get asset statistics
  rpc GetAssetStatistics(GetAssetStatisticsRequest) returns (GetAssetStatisticsResponse);
  
  // Get asset performance
  rpc GetAssetPerformance(GetAssetPerformanceRequest) returns (GetAssetPerformanceResponse);
  
  // Get maintenance schedule
  rpc GetMaintenanceSchedule(GetMaintenanceScheduleRequest) returns (GetMaintenanceScheduleResponse);
  
  // Get load flow analysis
  rpc GetLoadFlowAnalysis(GetLoadFlowAnalysisRequest) returns (GetLoadFlowAnalysisResponse);
  
  // Get power quality analysis
  rpc GetPowerQualityAnalysis(GetPowerQualityAnalysisRequest) returns (GetPowerQualityAnalysisResponse);
  
  // Get system reliability metrics
  rpc GetSystemReliabilityMetrics(GetSystemReliabilityMetricsRequest) returns (GetSystemReliabilityMetricsResponse);
  
  // Get customer impact analysis
  rpc GetCustomerImpactAnalysis(GetCustomerImpactAnalysisRequest) returns (GetCustomerImpactAnalysisResponse);
  
  // Get grid optimization recommendations
  rpc GetGridOptimizationRecommendations(GetGridOptimizationRecommendationsRequest) returns (GetGridOptimizationRecommendationsResponse);
}

// Request/Response messages for CreateGridNode
message CreateGridNodeRequest {
  GridNode grid_node = 1;
}

message CreateGridNodeResponse {
  GridNode grid_node = 1;
  bool success = 2;
  string message = 3;
}

