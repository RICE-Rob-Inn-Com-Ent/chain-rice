// Supporting message types
message GridNodeConfiguration {
  map<string, string> configuration = 1;
}

message LoadBalancingResult {
  bool success = 1;
  double load_reduction = 2;
  double efficiency_improvement = 3;
  repeated string actions_taken = 4;
}

message CircuitSwitchResult {
  bool success = 1;
  string switch_status = 2;
  double power_flow = 3;
  repeated string affected_nodes = 4;
}

message SectionIsolationResult {
  bool success = 1;
  string isolation_status = 2;
  repeated string isolated_assets = 3;
  repeated string affected_customers = 4;
}

message SectionRestorationResult {
  bool success = 1;
  string restoration_status = 2;
  repeated string restored_assets = 3;
  repeated string restored_customers = 4;
}

message GridTopology {
  string id = 1;
  string name = 2;
  repeated GridNode grid_nodes = 3;
  repeated GridConnection connections = 4;
  int64 last_updated = 5;
}

message GridConnection {
  string from_node_id = 1;
  string to_node_id = 2;
  string connection_type = 3;
  double impedance = 4;
  double capacity = 5;
}

message GridStatusDetails {
  string status_description = 1;
  repeated string status_factors = 2;
  double health_score = 3;
  repeated string warnings = 4;
  repeated string alerts = 5;
}

message GridStatistics {
  int32 total_nodes = 1;
  int32 active_nodes = 2;
  int32 inactive_nodes = 3;
  double total_capacity = 4;
  double available_capacity = 5;
  double utilization_percentage = 6;
  double reliability_percentage = 7;
}

message OutageStatistics {
  int32 total_outages = 1;
  int32 active_outages = 2;
  int32 resolved_outages = 3;
  double average_duration_minutes = 4;
  double total_customer_minutes_lost = 5;
  double saidi = 6;
  double saifi = 7;
}

message OutageTrendData {
  int64 date = 1;
  int32 outage_count = 2;
  double customer_minutes_lost = 3;
  double average_duration = 4;
}

message OutageTrendAnalysis {
  string trend_direction = 1;
  double trend_strength = 2;
  repeated string trend_factors = 3;
}

message AssetStatistics {
  int32 total_assets = 1;
  int32 active_assets = 2;
  int32 failed_assets = 3;
  int32 maintenance_assets = 4;
  double average_age = 5;
  double reliability_percentage = 6;
}

message AssetPerformance {
  double availability = 1;
  double reliability = 2;
  double efficiency = 3;
  double mtbf = 4;
  double mttr = 5;
  repeated PerformanceMetric metrics = 6;
}

message PerformanceMetric {
  string metric_name = 1;
  double value = 2;
  string unit = 3;
  int64 timestamp = 4;
}

message MaintenanceScheduleItem {
  string asset_id = 1;
  int64 scheduled_date = 2;
  string maintenance_type = 3;
  string maintenance_team = 4;
  string status = 5;
}

message LoadFlowParameters {
  double base_mva = 1;
  double voltage_tolerance = 2;
  double power_tolerance = 3;
  int32 max_iterations = 4;
}

message LoadFlowAnalysis {
  bool convergence = 1;
  int32 iterations = 2;
  repeated NodeVoltage node_voltages = 3;
  repeated BranchFlow branch_flows = 4;
  double total_losses = 5;
}

message NodeVoltage {
  string node_id = 1;
  double voltage_magnitude = 2;
  double voltage_angle = 3;
}

message BranchFlow {
  string from_node_id = 1;
  string to_node_id = 2;
  double active_power = 3;
  double reactive_power = 4;
}

message PowerQualityAnalysis {
  double thd_voltage = 1;
  double thd_current = 2;
  double voltage_unbalance = 3;
  double current_unbalance = 4;
  double frequency_deviation = 5;
  repeated PowerQualityEvent events = 6;
}

message PowerQualityEvent {
  string event_type = 1;
  int64 timestamp = 2;
  double duration = 3;
  double magnitude = 4;
}

message SystemReliabilityMetrics {
  double saidi = 1;
  double saifi = 2;
  double caidi = 3;
  double asai = 4;
  double eaid = 5;
  double eaif = 6;
}

message CustomerImpactAnalysis {
  int32 total_affected_customers = 1;
  int32 residential_customers = 2;
  int32 commercial_customers = 3;
  int32 industrial_customers = 4;
  double customer_minutes_lost = 5;
  repeated CustomerSegmentImpact segment_impacts = 6;
}

message CustomerSegmentImpact {
  string segment = 1;
  int32 affected_customers = 2;
  double average_duration = 3;
  double economic_impact = 4;
}

message OptimizationCriteria {
  string optimization_type = 1;
  map<string, double> weights = 2;
  repeated string constraints = 3;
}

message OptimizationRecommendation {
  string recommendation_type = 1;
  string description = 2;
  double potential_benefit = 3;
  double implementation_cost = 4;
  double payback_period = 5;
  string priority = 6;
}
