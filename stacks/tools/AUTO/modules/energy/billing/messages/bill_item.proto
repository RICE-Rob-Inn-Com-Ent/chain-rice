syntax = "proto3";

package energy.billing.messages;

import "energy/billing/enums/billing_cycle.proto";

// Individual item on an energy bill
message BillItem {
  // Unique identifier for the bill item
  string id = 1;
  
  // Name or description of the bill item
  string name = 2;
  
  // Description of what this bill item represents
  string description = 3;
  
  // Category of the bill item (e.g., "energy_consumption", "distribution_charges", "taxes")
  string category = 4;
  
  // Subcategory for more detailed classification
  string subcategory = 5;
  
  // Quantity consumed or amount charged
  double quantity = 6;
  
  // Unit of measurement (kWh, MWh, cubic_meters, etc.)
  string unit = 7;
  
  // Unit price for this item
  double unit_price = 8;
  
  // Total amount for this bill item (quantity * unit_price)
  double total_amount = 9;
  
  // Currency code (ISO 4217)
  string currency = 10;
  
  // Tax rate applied to this item (as percentage)
  double tax_rate = 11;
  
  // Tax amount for this item
  double tax_amount = 12;
  
  // Billing period start date (unix milliseconds)
  int64 period_start = 13;
  
  // Billing period end date (unix milliseconds)
  int64 period_end = 14;
  
  // Billing cycle for this item
  energy.billing.enums.BillingCycle billing_cycle = 15;
  
  // Meter reading start value (if applicable)
  double meter_reading_start = 16;
  
  // Meter reading end value (if applicable)
  double meter_reading_end = 17;
  
  // Rate schedule or tariff applied
  string rate_schedule = 18;
  
  // Additional metadata for this bill item
  map<string, string> metadata = 19;
  
  // Timestamp when this item was created (unix milliseconds)
  int64 created_at = 20;
  
  // Timestamp when this item was last updated (unix milliseconds)
  int64 updated_at = 21;
}
