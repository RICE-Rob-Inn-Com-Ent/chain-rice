syntax = "proto3";

package transport.schedules.v1;

option go_package = "github.com/rice-dev/transport/schedules/v1";

// ScheduleType enum defines the different types of transport schedules
enum ScheduleType {
  // Default value - should not be used
  SCHEDULE_TYPE_UNSPECIFIED = 0;
  
  // Regular scheduled service
  REGULAR = 1;
  
  // Extra service added for high demand
  EXTRA = 2;
  
  // Holiday or special event service
  SPECIAL = 3;
  
  // Replacement service for cancelled routes
  REPLACEMENT = 4;
  
  // Express service with limited stops
  EXPRESS = 5;
  
  // Local service with all stops
  LOCAL = 6;
  
  // Night service operating during late hours
  NIGHT = 7;
  
  // Weekend service with modified schedule
  WEEKEND = 8;
  
  // Peak hour service for rush periods
  PEAK_HOUR = 9;
  
  // Off-peak service for low demand periods
  OFF_PEAK = 10;
  
  // Charter service for private groups
  CHARTER = 11;
  
  // Test or trial service
  TRIAL = 12;
}
