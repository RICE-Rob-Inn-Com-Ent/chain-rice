syntax = "proto3";

package transport.schedules.v1;

option go_package = "github.com/rice-dev/transport/schedules/v1";

// ScheduleStatus enum defines the operational status of transport schedules
enum ScheduleStatus {
  // Default value - should not be used
  SCHEDULE_STATUS_UNSPECIFIED = 0;
  
  // Schedule is running on time
  ON_TIME = 1;
  
  // Schedule is delayed but still running
  DELAYED = 2;
  
  // Schedule has been cancelled
  CANCELLED = 3;
  
  // Schedule is completed successfully
  COMPLETED = 4;
  
  // Schedule is currently in progress
  IN_PROGRESS = 5;
  
  // Schedule is scheduled but not yet started
  SCHEDULED = 6;
  
  // Schedule is boarding passengers
  BOARDING = 7;
  
  // Schedule is departing
  DEPARTING = 8;
  
  // Schedule has arrived at destination
  ARRIVED = 9;
  
  // Schedule is experiencing technical issues
  TECHNICAL_ISSUE = 10;
  
  // Schedule is waiting for connection
  WAITING_FOR_CONNECTION = 11;
}
