syntax = "proto3";

package transport.schedules.v1;

import "google/protobuf/timestamp.proto";
import "schedules/enums/schedule_status.proto";
import "schedules/enums/schedule_type.proto";

option go_package = "github.com/rice-dev/transport/schedules/v1";

// Schedule represents a transport schedule in the system
message Schedule {
  // Unique schedule identifier
  string schedule_id = 1;
  
  // Route ID
  string route_id = 2;
  
  // Vehicle ID
  string vehicle_id = 3;
  
  // Schedule type
  ScheduleType type = 4;
  
  // Scheduled departure time
  google.protobuf.Timestamp departure_time = 5;
  
  // Scheduled arrival time
  google.protobuf.Timestamp arrival_time = 6;
  
  // Schedule date
  google.protobuf.Timestamp schedule_date = 7;
  
  // Driver ID
  string driver_id = 8;
  
  // Conductor ID
  string conductor_id = 9;
  
  // Maximum passenger capacity
  int32 max_capacity = 10;
  
  // Current passenger count
  int32 current_passenger_count = 11;
  
  // Available seats
  int32 available_seats = 12;
  
  // Schedule notes
  string notes = 13;
  
  // Recurrence pattern
  string recurrence_pattern = 14;
  
  // Validity start date
  google.protobuf.Timestamp valid_from = 15;
  
  // Validity end date
  google.protobuf.Timestamp valid_until = 16;
  
  // Current schedule status
  ScheduleStatus status = 17;
  
  // Additional metadata
  map<string, string> metadata = 18;
  
  // Schedule creation timestamp
  google.protobuf.Timestamp created_at = 19;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 20;
  
  // Actual departure time (if different from scheduled)
  google.protobuf.Timestamp actual_departure_time = 21;
  
  // Actual arrival time (if different from scheduled)
  google.protobuf.Timestamp actual_arrival_time = 22;
  
  // Delay duration in minutes
  int32 delay_minutes = 23;
  
  // Schedule completion timestamp
  google.protobuf.Timestamp completed_at = 24;
}

// CreateScheduleResponse represents the response after creating a new schedule
message CreateScheduleResponse {
  // Created schedule information
  Schedule schedule = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// GetScheduleResponse represents the response for retrieving a schedule
message GetScheduleResponse {
  // Requested schedule information
  Schedule schedule = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// ListSchedulesResponse represents the response for listing schedules
message ListSchedulesResponse {
  // List of schedules
  repeated Schedule schedules = 1;
  
  // Next page token for pagination
  string next_page_token = 2;
  
  // Total count of schedules matching the filter
  int32 total_count = 3;
  
  // Operation success status
  bool success = 4;
  
  // Response message
  string message = 5;
}

// UpdateScheduleResponse represents the response after updating a schedule
message UpdateScheduleResponse {
  // Updated schedule information
  Schedule schedule = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// DeleteScheduleResponse represents the response after deleting a schedule
message DeleteScheduleResponse {
  // Deleted schedule ID
  string schedule_id = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
  
  // Deletion timestamp
  google.protobuf.Timestamp deleted_at = 4;
  
  // Number of affected passengers
  int32 affected_passengers = 5;
}
