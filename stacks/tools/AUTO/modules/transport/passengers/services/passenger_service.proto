syntax = "proto3";

package transport.passengers.v1;

import "passengers/messages/passenger_request.proto";
import "passengers/messages/passenger_response.proto";

option go_package = "github.com/rice-dev/transport/passengers/v1";

// PassengerService provides CRUD operations for passenger management
// This service handles passenger registration, profile management,
// verification, and account lifecycle operations
service PassengerService {
  // Create registers a new passenger in the system
  // Validates passenger information and creates account
  rpc Create(CreatePassengerRequest) returns (CreatePassengerResponse);
  
  // Get retrieves detailed information about a specific passenger
  // Returns complete passenger profile including preferences
  rpc Get(GetPassengerRequest) returns (GetPassengerResponse);
  
  // List retrieves a paginated list of passengers with optional filtering
  // Supports filtering by type, status, registration date, and other criteria
  rpc List(ListPassengersRequest) returns (ListPassengersResponse);
  
  // Update modifies existing passenger information
  // Allows partial updates using field masks for efficient updates
  rpc Update(UpdatePassengerRequest) returns (UpdatePassengerResponse);
  
  // Delete removes a passenger account from the system
  // Validates that passenger has no active bookings before deletion
  rpc Delete(DeletePassengerRequest) returns (DeletePassengerResponse);
  
  // VerifyPassenger verifies passenger account using verification token
  // Activates account and enables full service access
  rpc VerifyPassenger(VerifyPassengerRequest) returns (VerifyPassengerResponse);
  
  // UpdateStatus changes passenger account status
  // Supports activation, deactivation, suspension, and banning
  rpc UpdateStatus(UpdatePassengerStatusRequest) returns (UpdatePassengerStatusResponse);
  
  // GetPassengerStats retrieves passenger statistics and analytics
  // Returns trip history, loyalty points, and usage patterns
  rpc GetPassengerStats(GetPassengerStatsRequest) returns (GetPassengerStatsResponse);
  
  // UpdatePreferences updates passenger preferences and settings
  // Manages accessibility needs, dietary requirements, and communication preferences
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

// VerifyPassengerRequest represents a request to verify passenger account
message VerifyPassengerRequest {
  // Passenger ID (required)
  string passenger_id = 1;
  
  // Verification token (required)
  string verification_token = 2;
  
  // Verification method (email, sms, phone)
  string verification_method = 3;
}

// VerifyPassengerResponse represents the response after verification
message VerifyPassengerResponse {
  // Passenger ID
  string passenger_id = 1;
  
  // Verification success status
  bool success = 2;
  
  // Response message
  string message = 3;
  
  // Verification timestamp
  google.protobuf.Timestamp verified_at = 4;
}

// UpdatePassengerStatusRequest represents a request to update passenger status
message UpdatePassengerStatusRequest {
  // Passenger ID (required)
  string passenger_id = 1;
  
  // New status (required)
  PassengerStatus status = 2;
  
  // Reason for status change
  string reason = 3;
  
  // Status change effective date
  google.protobuf.Timestamp effective_date = 4;
  
  // Status change duration (for temporary status changes)
  int32 duration_days = 5;
}

// UpdatePassengerStatusResponse represents the response after status update
message UpdatePassengerStatusResponse {
  // Passenger ID
  string passenger_id = 1;
  
  // Previous status
  PassengerStatus previous_status = 2;
  
  // New status
  PassengerStatus new_status = 3;
  
  // Update success status
  bool success = 4;
  
  // Response message
  string message = 5;
  
  // Status change timestamp
  google.protobuf.Timestamp updated_at = 6;
}

// GetPassengerStatsRequest represents a request for passenger statistics
message GetPassengerStatsRequest {
  // Passenger ID (required)
  string passenger_id = 1;
  
  // Statistics period start date
  google.protobuf.Timestamp start_date = 2;
  
  // Statistics period end date
  google.protobuf.Timestamp end_date = 3;
  
  // Include detailed trip history
  bool include_trip_history = 4;
  
  // Include loyalty information
  bool include_loyalty_info = 5;
}

// GetPassengerStatsResponse represents the response with passenger statistics
message GetPassengerStatsResponse {
  // Passenger ID
  string passenger_id = 1;
  
  // Total trips in period
  int32 total_trips = 2;
  
  // Total distance traveled (in kilometers)
  double total_distance = 3;
  
  // Total fare paid
  double total_fare_paid = 4;
  
  // Average trip duration (in minutes)
  double average_trip_duration = 5;
  
  // Most frequent routes
  repeated RouteFrequency frequent_routes = 6;
  
  // Loyalty points earned
  int32 loyalty_points_earned = 7;
  
  // Loyalty points redeemed
  int32 loyalty_points_redeemed = 8;
  
  // Current loyalty points balance
  int32 loyalty_points_balance = 9;
  
  // Trip history (if requested)
  repeated TripRecord trip_history = 10;
  
  // Operation success status
  bool success = 11;
  
  // Response message
  string message = 12;
}

// RouteFrequency represents route usage frequency
message RouteFrequency {
  // Route ID
  string route_id = 1;
  
  // Route name
  string route_name = 2;
  
  // Number of trips on this route
  int32 trip_count = 3;
  
  // Last trip date
  google.protobuf.Timestamp last_trip_date = 4;
}

// TripRecord represents a single trip record
message TripRecord {
  // Trip ID
  string trip_id = 1;
  
  // Route ID
  string route_id = 2;
  
  // Schedule ID
  string schedule_id = 3;
  
  // Trip start time
  google.protobuf.Timestamp start_time = 4;
  
  // Trip end time
  google.protobuf.Timestamp end_time = 5;
  
  // Trip duration (in minutes)
  int32 duration_minutes = 6;
  
  // Distance traveled (in kilometers)
  double distance_km = 7;
  
  // Fare paid
  double fare_paid = 8;
  
  // Trip status
  string status = 9;
}

// UpdatePreferencesRequest represents a request to update passenger preferences
message UpdatePreferencesRequest {
  // Passenger ID (required)
  string passenger_id = 1;
  
  // Accessibility needs
  repeated string accessibility_needs = 2;
  
  // Dietary requirements
  repeated string dietary_requirements = 3;
  
  // Communication preferences
  map<string, bool> communication_preferences = 4;
  
  // Additional preferences
  map<string, string> preferences = 5;
  
  // Preferred language
  string preferred_language = 6;
  
  // Notification preferences
  map<string, bool> notification_preferences = 7;
}

// UpdatePreferencesResponse represents the response after preferences update
message UpdatePreferencesResponse {
  // Passenger ID
  string passenger_id = 1;
  
  // Updated preferences
  map<string, string> preferences = 2;
  
  // Update success status
  bool success = 3;
  
  // Response message
  string message = 4;
  
  // Update timestamp
  google.protobuf.Timestamp updated_at = 5;
}
