syntax = "proto3";

package transport.passengers.v1;

option go_package = "github.com/rice-dev/transport/passengers/v1";

// PassengerStatus enum defines the current status of passenger accounts
enum PassengerStatus {
  // Default value - should not be used
  PASSENGER_STATUS_UNSPECIFIED = 0;
  
  // Passenger account is active and can use services
  ACTIVE = 1;
  
  // Passenger account is temporarily inactive
  INACTIVE = 2;
  
  // Passenger account has been permanently banned
  BANNED = 3;
  
  // Passenger account is suspended due to policy violations
  SUSPENDED = 4;
  
  // Passenger account is pending verification
  PENDING_VERIFICATION = 5;
  
  // Passenger account has been deactivated by user
  DEACTIVATED = 6;
  
  // Passenger account is under review
  UNDER_REVIEW = 7;
}
