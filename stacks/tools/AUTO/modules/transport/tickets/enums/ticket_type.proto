syntax = "proto3";

package transport.tickets.v1;

option go_package = "github.com/rice-dev/transport/tickets/v1";

// TicketType enum defines the different types of transport tickets
enum TicketType {
  // Default value - should not be used
  TICKET_TYPE_UNSPECIFIED = 0;
  
  // Single journey ticket
  SINGLE = 1;
  
  // Return journey ticket
  RETURN = 2;
  
  // Season pass for multiple journeys
  SEASON = 3;
  
  // Day pass for unlimited travel within a day
  DAY_PASS = 4;
  
  // Weekly pass for unlimited travel within a week
  WEEKLY_PASS = 5;
  
  // Monthly pass for unlimited travel within a month
  MONTHLY_PASS = 6;
  
  // Annual pass for unlimited travel within a year
  ANNUAL_PASS = 7;
  
  // Group ticket for multiple passengers
  GROUP = 8;
  
  // Student discounted ticket
  STUDENT = 9;
  
  // Senior citizen discounted ticket
  SENIOR = 10;
  
  // Child discounted ticket
  CHILD = 11;
  
  // VIP premium ticket
  VIP = 12;
  
  // Corporate ticket for business travel
  CORPORATE = 13;
  
  // Tourist ticket with additional services
  TOURIST = 14;
  
  // Emergency ticket for urgent travel
  EMERGENCY = 15;
}
