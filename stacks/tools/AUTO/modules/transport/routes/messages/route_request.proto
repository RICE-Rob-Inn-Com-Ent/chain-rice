syntax = "proto3";

package transport.routes.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "routes/enums/route_type.proto";
import "routes/enums/route_status.proto";

option go_package = "github.com/rice-dev/transport/routes/v1";

// Location represents a geographical location
message Location {
  // Location name
  string name = 1;
  
  // Address
  string address = 2;
  
  // Latitude coordinate
  double latitude = 3;
  
  // Longitude coordinate
  double longitude = 4;
  
  // Location type (station, stop, terminal, etc.)
  string type = 5;
  
  // Location code or identifier
  string code = 6;
  
  // Additional location details
  map<string, string> details = 7;
}

// RouteStop represents a stop along the route
message RouteStop {
  // Stop sequence number
  int32 sequence = 1;
  
  // Stop location
  Location location = 2;
  
  // Estimated arrival time
  google.protobuf.Timestamp arrival_time = 3;
  
  // Estimated departure time
  google.protobuf.Timestamp departure_time = 4;
  
  // Stop type (pickup, dropoff, both)
  string stop_type = 5;
  
  // Platform or gate number
  string platform = 6;
  
  // Stop-specific notes
  string notes = 7;
}

// CreateRouteRequest represents a request to create a new route
message CreateRouteRequest {
  // Route name (required)
  string name = 1;
  
  // Route type (required)
  RouteType type = 2;
  
  // Origin location (required)
  Location origin = 3;
  
  // Destination location (required)
  Location destination = 4;
  
  // Route distance in kilometers
  double distance_km = 5;
  
  // Estimated travel time in minutes
  int32 estimated_duration_minutes = 6;
  
  // Route stops along the way
  repeated RouteStop stops = 7;
  
  // Route description
  string description = 8;
  
  // Route color for display purposes
  string color = 9;
  
  // Route number or code
  string route_number = 10;
  
  // Operating days (monday, tuesday, etc.)
  repeated string operating_days = 11;
  
  // Operating hours start
  string operating_hours_start = 12;
  
  // Operating hours end
  string operating_hours_end = 13;
  
  // Fare information
  map<string, double> fare_matrix = 14;
  
  // Route status (defaults to PLANNED)
  RouteStatus status = 15;
  
  // Additional route metadata
  map<string, string> metadata = 16;
}

// GetRouteRequest represents a request to retrieve route information
message GetRouteRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Fields to include in response (optional)
  google.protobuf.FieldMask field_mask = 2;
  
  // Include stop details
  bool include_stops = 3;
  
  // Include fare information
  bool include_fares = 4;
}

// ListRoutesRequest represents a request to list routes with filtering
message ListRoutesRequest {
  // Page size for pagination
  int32 page_size = 1;
  
  // Page token for pagination
  string page_token = 2;
  
  // Filter by route type
  RouteType type = 3;
  
  // Filter by status
  RouteStatus status = 4;
  
  // Search by route name
  string name = 5;
  
  // Search by route number
  string route_number = 6;
  
  // Filter by origin location
  string origin_location = 7;
  
  // Filter by destination location
  string destination_location = 8;
  
  // Filter by operating days
  repeated string operating_days = 9;
  
  // Sort field (name, distance, duration, created_at)
  string sort_by = 10;
  
  // Sort order (asc, desc)
  string sort_order = 11;
}

// UpdateRouteRequest represents a request to update route information
message UpdateRouteRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Updated route information
  RouteUpdateData route = 2;
  
  // Fields to update (required)
  google.protobuf.FieldMask update_mask = 3;
}

// RouteUpdateData contains updatable route fields
message RouteUpdateData {
  // Route name
  string name = 1;
  
  // Route type
  RouteType type = 2;
  
  // Origin location
  Location origin = 3;
  
  // Destination location
  Location destination = 4;
  
  // Route distance
  double distance_km = 5;
  
  // Estimated duration
  int32 estimated_duration_minutes = 6;
  
  // Route stops
  repeated RouteStop stops = 7;
  
  // Route description
  string description = 8;
  
  // Route color
  string color = 9;
  
  // Route number
  string route_number = 10;
  
  // Operating days
  repeated string operating_days = 11;
  
  // Operating hours start
  string operating_hours_start = 12;
  
  // Operating hours end
  string operating_hours_end = 13;
  
  // Fare matrix
  map<string, double> fare_matrix = 14;
  
  // Route status
  RouteStatus status = 15;
  
  // Additional metadata
  map<string, string> metadata = 16;
}

// DeleteRouteRequest represents a request to delete a route
message DeleteRouteRequest {
  // Route ID (required)
  string route_id = 1;
  
  // Reason for deletion
  string reason = 2;
  
  // Force deletion even if route has active schedules
  bool force = 3;
  
  // Effective deletion date
  google.protobuf.Timestamp effective_date = 4;
}
