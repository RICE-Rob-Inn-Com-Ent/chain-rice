syntax = "proto3";

package transport.routes.v1;

import "google/protobuf/timestamp.proto";
import "routes/enums/route_type.proto";
import "routes/enums/route_status.proto";
import "routes/messages/route_request.proto";

option go_package = "github.com/rice-dev/transport/routes/v1";

// Route represents a transport route in the system
message Route {
  // Unique route identifier
  string route_id = 1;
  
  // Route name
  string name = 2;
  
  // Route type
  RouteType type = 3;
  
  // Origin location
  Location origin = 4;
  
  // Destination location
  Location destination = 5;
  
  // Route distance in kilometers
  double distance_km = 6;
  
  // Estimated travel time in minutes
  int32 estimated_duration_minutes = 7;
  
  // Route stops along the way
  repeated RouteStop stops = 8;
  
  // Route description
  string description = 9;
  
  // Route color for display purposes
  string color = 10;
  
  // Route number or code
  string route_number = 11;
  
  // Operating days
  repeated string operating_days = 12;
  
  // Operating hours start
  string operating_hours_start = 13;
  
  // Operating hours end
  string operating_hours_end = 14;
  
  // Fare information
  map<string, double> fare_matrix = 15;
  
  // Current route status
  RouteStatus status = 16;
  
  // Additional route metadata
  map<string, string> metadata = 17;
  
  // Route creation timestamp
  google.protobuf.Timestamp created_at = 18;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 19;
  
  // Route activation date
  google.protobuf.Timestamp activated_at = 20;
  
  // Number of active schedules
  int32 active_schedules_count = 21;
  
  // Average daily ridership
  int32 average_daily_ridership = 22;
  
  // Route popularity score
  double popularity_score = 23;
}

// CreateRouteResponse represents the response after creating a new route
message CreateRouteResponse {
  // Created route information
  Route route = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// GetRouteResponse represents the response for retrieving a route
message GetRouteResponse {
  // Requested route information
  Route route = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// ListRoutesResponse represents the response for listing routes
message ListRoutesResponse {
  // List of routes
  repeated Route routes = 1;
  
  // Next page token for pagination
  string next_page_token = 2;
  
  // Total count of routes matching the filter
  int32 total_count = 3;
  
  // Operation success status
  bool success = 4;
  
  // Response message
  string message = 5;
}

// UpdateRouteResponse represents the response after updating a route
message UpdateRouteResponse {
  // Updated route information
  Route route = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
}

// DeleteRouteResponse represents the response after deleting a route
message DeleteRouteResponse {
  // Deleted route ID
  string route_id = 1;
  
  // Operation success status
  bool success = 2;
  
  // Response message
  string message = 3;
  
  // Deletion timestamp
  google.protobuf.Timestamp deleted_at = 4;
}
