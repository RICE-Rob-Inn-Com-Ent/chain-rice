syntax = "proto3";

package transport.fleet_management.v1;

import "fleet-management/messages/fleet_request.proto";
import "fleet-management/messages/fleet_response.proto";

option go_package = "github.com/rice-dev/transport/fleet_management/v1";

// FleetService provides CRUD operations for fleet vehicle management
// This service handles all aspects of vehicle lifecycle management including
// registration, maintenance tracking, route assignment, and decommissioning
service FleetService {
  // Create adds a new vehicle to the fleet
  // Validates vehicle information and assigns a unique vehicle ID
  rpc Create(CreateFleetRequest) returns (CreateFleetResponse);
  
  // Get retrieves detailed information about a specific vehicle
  // Returns complete vehicle details including maintenance history
  rpc Get(GetFleetRequest) returns (GetFleetResponse);
  
  // List retrieves a paginated list of vehicles with optional filtering
  // Supports filtering by type, status, route assignment, and other criteria
  rpc List(ListFleetRequest) returns (ListFleetResponse);
  
  // Update modifies existing vehicle information
  // Allows partial updates using field masks for efficient updates
  rpc Update(UpdateFleetRequest) returns (UpdateFleetResponse);
  
  // Delete removes a vehicle from the fleet
  // Validates that vehicle is not in active use before deletion
  rpc Delete(DeleteFleetRequest) returns (DeleteFleetResponse);
  
  // AssignRoute assigns a vehicle to a specific route
  // Validates route compatibility and vehicle availability
  rpc AssignRoute(AssignRouteRequest) returns (AssignRouteResponse);
  
  // UnassignRoute removes route assignment from a vehicle
  // Ensures proper cleanup of route associations
  rpc UnassignRoute(UnassignRouteRequest) returns (UnassignRouteResponse);
  
  // UpdateMaintenance updates vehicle maintenance information
  // Records maintenance activities and schedules next maintenance
  rpc UpdateMaintenance(UpdateMaintenanceRequest) returns (UpdateMaintenanceResponse);
  
  // GetMaintenanceHistory retrieves maintenance history for a vehicle
  // Returns chronological list of all maintenance activities
  rpc GetMaintenanceHistory(GetMaintenanceHistoryRequest) returns (GetMaintenanceHistoryResponse);
}

// AssignRouteRequest represents a request to assign a vehicle to a route
message AssignRouteRequest {
  // Vehicle ID (required)
  string vehicle_id = 1;
  
  // Route ID to assign (required)
  string route_id = 2;
  
  // Assignment start date
  google.protobuf.Timestamp start_date = 3;
  
  // Assignment end date (optional)
  google.protobuf.Timestamp end_date = 4;
  
  // Assignment reason
  string reason = 5;
}

// AssignRouteResponse represents the response after route assignment
message AssignRouteResponse {
  // Vehicle ID
  string vehicle_id = 1;
  
  // Assigned route ID
  string route_id = 2;
  
  // Assignment success status
  bool success = 3;
  
  // Response message
  string message = 4;
  
  // Assignment timestamp
  google.protobuf.Timestamp assigned_at = 5;
}

// UnassignRouteRequest represents a request to remove route assignment
message UnassignRouteRequest {
  // Vehicle ID (required)
  string vehicle_id = 1;
  
  // Route ID to unassign (required)
  string route_id = 2;
  
  // Unassignment reason
  string reason = 3;
}

// UnassignRouteResponse represents the response after route unassignment
message UnassignRouteResponse {
  // Vehicle ID
  string vehicle_id = 1;
  
  // Unassigned route ID
  string route_id = 2;
  
  // Unassignment success status
  bool success = 3;
  
  // Response message
  string message = 4;
  
  // Unassignment timestamp
  google.protobuf.Timestamp unassigned_at = 5;
}

// UpdateMaintenanceRequest represents a request to update maintenance information
message UpdateMaintenanceRequest {
  // Vehicle ID (required)
  string vehicle_id = 1;
  
  // Maintenance type (routine, repair, inspection, etc.)
  string maintenance_type = 2;
  
  // Maintenance description
  string description = 3;
  
  // Maintenance cost
  double cost = 4;
  
  // Maintenance provider
  string provider = 5;
  
  // Maintenance date
  google.protobuf.Timestamp maintenance_date = 6;
  
  // Next maintenance due date
  google.protobuf.Timestamp next_maintenance_due = 7;
  
  // Maintenance notes
  string notes = 8;
}

// UpdateMaintenanceResponse represents the response after maintenance update
message UpdateMaintenanceResponse {
  // Vehicle ID
  string vehicle_id = 1;
  
  // Maintenance record ID
  string maintenance_id = 2;
  
  // Update success status
  bool success = 3;
  
  // Response message
  string message = 4;
  
  // Update timestamp
  google.protobuf.Timestamp updated_at = 5;
}

// GetMaintenanceHistoryRequest represents a request for maintenance history
message GetMaintenanceHistoryRequest {
  // Vehicle ID (required)
  string vehicle_id = 1;
  
  // Page size for pagination
  int32 page_size = 2;
  
  // Page token for pagination
  string page_token = 3;
  
  // Filter by maintenance type
  string maintenance_type = 4;
  
  // Filter by date range - start
  google.protobuf.Timestamp start_date = 5;
  
  // Filter by date range - end
  google.protobuf.Timestamp end_date = 6;
}

// GetMaintenanceHistoryResponse represents the response with maintenance history
message GetMaintenanceHistoryResponse {
  // List of maintenance records
  repeated MaintenanceRecord records = 1;
  
  // Next page token for pagination
  string next_page_token = 2;
  
  // Total count of maintenance records
  int32 total_count = 3;
  
  // Operation success status
  bool success = 4;
  
  // Response message
  string message = 5;
}

// MaintenanceRecord represents a single maintenance activity
message MaintenanceRecord {
  // Maintenance record ID
  string maintenance_id = 1;
  
  // Vehicle ID
  string vehicle_id = 2;
  
  // Maintenance type
  string maintenance_type = 3;
  
  // Maintenance description
  string description = 4;
  
  // Maintenance cost
  double cost = 5;
  
  // Maintenance provider
  string provider = 6;
  
  // Maintenance date
  google.protobuf.Timestamp maintenance_date = 7;
  
  // Next maintenance due date
  google.protobuf.Timestamp next_maintenance_due = 8;
  
  // Maintenance notes
  string notes = 9;
  
  // Record creation timestamp
  google.protobuf.Timestamp created_at = 10;
}
