syntax = "proto3";

package construction.materials.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "../messages/material.proto";
import "../messages/material_batch.proto";
import "../enums/material_type.proto";
import "../enums/material_status.proto";
import "../enums/quality_grade.proto";

service MaterialService {
  rpc CreateMaterial(CreateMaterialRequest) returns (CreateMaterialResponse);
  rpc GetMaterial(GetMaterialRequest) returns (GetMaterialResponse);
  rpc UpdateMaterial(UpdateMaterialRequest) returns (UpdateMaterialResponse);
  rpc DeleteMaterial(DeleteMaterialRequest) returns (google.protobuf.Empty);
  rpc ListMaterials(ListMaterialsRequest) returns (ListMaterialsResponse);
  rpc SearchMaterials(SearchMaterialsRequest) returns (SearchMaterialsResponse);
  rpc GetMaterialsByType(GetMaterialsByTypeRequest) returns (GetMaterialsByTypeResponse);
  rpc GetMaterialsByStatus(GetMaterialsByStatusRequest) returns (GetMaterialsByStatusResponse);
  rpc CreateMaterialBatch(CreateMaterialBatchRequest) returns (CreateMaterialBatchResponse);
  rpc GetMaterialBatch(GetMaterialBatchRequest) returns (GetMaterialBatchResponse);
  rpc ListMaterialBatches(ListMaterialBatchesRequest) returns (ListMaterialBatchesResponse);
  rpc GetMaterialAnalytics(GetMaterialAnalyticsRequest) returns (GetMaterialAnalyticsResponse);
}

message CreateMaterialRequest {
  construction.materials.messages.Material material = 1;
}

message CreateMaterialResponse {
  construction.materials.messages.Material material = 1;
  string message = 2;
}

message GetMaterialRequest {
  string material_id = 1;
}

message GetMaterialResponse {
  construction.materials.messages.Material material = 1;
}

message UpdateMaterialRequest {
  construction.materials.messages.Material material = 1;
  repeated string update_fields = 2;
}

message UpdateMaterialResponse {
  construction.materials.messages.Material material = 1;
  string message = 2;
}

message DeleteMaterialRequest {
  string material_id = 1;
  string reason = 2;
}

message ListMaterialsRequest {
  int32 page_size = 1;
  string page_token = 2;
  construction.materials.enums.MaterialType type = 3;
  construction.materials.enums.MaterialStatus status = 4;
  construction.materials.enums.QualityGrade quality_grade = 5;
  string sort_by = 6;
  bool sort_descending = 7;
}

message ListMaterialsResponse {
  repeated construction.materials.messages.Material materials = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchMaterialsRequest {
  string query = 1;
  repeated construction.materials.enums.MaterialType types = 2;
  repeated construction.materials.enums.MaterialStatus statuses = 3;
  repeated construction.materials.enums.QualityGrade quality_grades = 4;
  string manufacturer = 5;
  string supplier = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message SearchMaterialsResponse {
  repeated construction.materials.messages.Material materials = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetMaterialsByTypeRequest {
  construction.materials.enums.MaterialType type = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.materials.enums.MaterialStatus status = 4;
}

message GetMaterialsByTypeResponse {
  repeated construction.materials.messages.Material materials = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetMaterialsByStatusRequest {
  construction.materials.enums.MaterialStatus status = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.materials.enums.MaterialType type = 4;
}

message GetMaterialsByStatusResponse {
  repeated construction.materials.messages.Material materials = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CreateMaterialBatchRequest {
  construction.materials.messages.MaterialBatch batch = 1;
}

message CreateMaterialBatchResponse {
  construction.materials.messages.MaterialBatch batch = 1;
  string message = 2;
}

message GetMaterialBatchRequest {
  string batch_id = 1;
}

message GetMaterialBatchResponse {
  construction.materials.messages.MaterialBatch batch = 1;
}

message ListMaterialBatchesRequest {
  string material_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.materials.enums.MaterialStatus status = 4;
}

message ListMaterialBatchesResponse {
  repeated construction.materials.messages.MaterialBatch batches = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetMaterialAnalyticsRequest {
  string material_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string metrics = 4;
}

message GetMaterialAnalyticsResponse {
  map<string, double> analytics = 1;
  repeated PerformanceTrend performance_trends = 2;
}

message PerformanceTrend {
  string metric_name = 1;
  repeated DataPoint data_points = 2;
  string trend_direction = 3;
  double trend_percentage = 4;
}

message DataPoint {
  google.protobuf.Timestamp date = 1;
  double value = 2;
}
