syntax = "proto3";

package construction.materials.messages;

import "google/protobuf/timestamp.proto";
import "../enums/material_type.proto";
import "../enums/material_status.proto";
import "../enums/quality_grade.proto";

message MaterialBatch {
  string id = 1;
  string batch_number = 2;
  string material_id = 3;
  construction.materials.enums.MaterialType type = 4;
  construction.materials.enums.MaterialStatus status = 5;
  construction.materials.enums.QualityGrade quality_grade = 6;
  double quantity = 7;
  string unit = 8;
  google.protobuf.Timestamp production_date = 9;
  google.protobuf.Timestamp expiry_date = 10;
  string manufacturer = 11;
  string supplier = 12;
  string location = 13;
  string quality_control_notes = 14;
  repeated string test_results = 15;
  string batch_notes = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}
