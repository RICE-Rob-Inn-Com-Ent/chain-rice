syntax = "proto3";

package construction.contractors.enums;

// Enumeration of different types of contractors in the construction industry
enum ContractorType {
  // Default value for unset contractor type
  CONTRACTOR_TYPE_UNSPECIFIED = 0;
  
  // General contractors who manage entire construction projects
  GENERAL_CONTRACTOR = 1;
  
  // Specialized contractors for specific trades
  ELECTRICAL_CONTRACTOR = 2;
  PLUMBING_CONTRACTOR = 3;
  HVAC_CONTRACTOR = 4;
  ROOFING_CONTRACTOR = 5;
  PAINTING_CONTRACTOR = 6;
  FLOORING_CONTRACTOR = 7;
  CONCRETE_CONTRACTOR = 8;
  STEEL_CONTRACTOR = 9;
  MASONRY_CONTRACTOR = 10;
  
  // Heavy construction contractors
  EXCAVATION_CONTRACTOR = 11;
  DEMOLITION_CONTRACTOR = 12;
  ASPHALT_CONTRACTOR = 13;
  LANDSCAPING_CONTRACTOR = 14;
  
  // Specialized service contractors
  CLEANING_CONTRACTOR = 15;
  SECURITY_CONTRACTOR = 16;
  WASTE_MANAGEMENT_CONTRACTOR = 17;
  EQUIPMENT_RENTAL_CONTRACTOR = 18;
  
  // Consulting and design contractors
  ARCHITECTURAL_CONTRACTOR = 19;
  ENGINEERING_CONTRACTOR = 20;
  SURVEYING_CONTRACTOR = 21;
  INSPECTION_CONTRACTOR = 22;
  
  // Subcontractors working under general contractors
  SUBCONTRACTOR = 23;
  
  // Material suppliers and vendors
  MATERIAL_SUPPLIER = 24;
  EQUIPMENT_SUPPLIER = 25;
}
