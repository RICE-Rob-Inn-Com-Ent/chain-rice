syntax = "proto3";

package construction.contractors.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// Represents a contract between a client and contractor
message Contract {
  // Unique identifier for the contract
  string id = 1;
  
  // Contract number (human-readable)
  string contract_number = 2;
  
  // Contract title
  string title = 3;
  
  // Contract description
  string description = 4;
  
  // Client information
  ClientInfo client = 5;
  
  // Contractor information
  ContractorInfo contractor = 6;
  
  // Project information
  ProjectInfo project = 7;
  
  // Contract terms and conditions
  ContractTerms terms = 8;
  
  // Financial details
  FinancialDetails financial = 9;
  
  // Timeline and milestones
  repeated Milestone milestones = 10;
  
  // Scope of work
  repeated WorkItem scope_of_work = 11;
  
  // Change orders
  repeated ChangeOrder change_orders = 12;
  
  // Contract status
  ContractStatus status = 13;
  
  // Contract type
  ContractType type = 14;
  
  // Legal and compliance information
  LegalInfo legal_info = 15;
  
  // Insurance requirements
  repeated InsuranceRequirement insurance_requirements = 16;
  
  // Performance guarantees
  repeated PerformanceGuarantee performance_guarantees = 17;
  
  // Payment schedule
  repeated PaymentSchedule payment_schedule = 18;
  
  // Termination clauses
  TerminationClause termination = 19;
  
  // Dispute resolution
  DisputeResolution dispute_resolution = 20;
  
  // Attachments and documents
  repeated DocumentAttachment attachments = 21;
  
  // Signatures and approvals
  repeated Signature signatures = 22;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp updated_at = 24;
  google.protobuf.Timestamp effective_date = 25;
  google.protobuf.Timestamp expiration_date = 26;
  google.protobuf.Timestamp signed_date = 27;
  
  // Additional metadata
  map<string, google.protobuf.Any> metadata = 28;
}

// Client information
message ClientInfo {
  // Client ID
  string client_id = 1;
  
  // Client name
  string name = 2;
  
  // Client type (individual, corporation, government, etc.)
  string type = 3;
  
  // Contact information
  ContactInfo contact_info = 4;
  
  // Billing address
  Address billing_address = 5;
  
  // Project address
  Address project_address = 6;
  
  // Authorized representatives
  repeated AuthorizedRepresentative authorized_representatives = 7;
}

// Contractor information
message ContractorInfo {
  // Contractor ID
  string contractor_id = 1;
  
  // Contractor name
  string name = 2;
  
  // Contractor type
  string type = 3;
  
  // Contact information
  ContactInfo contact_info = 4;
  
  // Business address
  Address business_address = 5;
  
  // Authorized representatives
  repeated AuthorizedRepresentative authorized_representatives = 6;
  
  // License information
  repeated LicenseInfo licenses = 7;
}

// Project information
message ProjectInfo {
  // Project ID
  string project_id = 1;
  
  // Project name
  string name = 2;
  
  // Project description
  string description = 3;
  
  // Project location
  Address location = 4;
  
  // Project type
  string type = 5;
  
  // Project size (square footage, units, etc.)
  string size = 6;
  
  // Project complexity
  string complexity = 7;
  
  // Special requirements
  repeated string special_requirements = 8;
}

// Contract terms and conditions
message ContractTerms {
  // Contract duration in days
  int32 duration_days = 1;
  
  // Start date
  google.protobuf.Timestamp start_date = 2;
  
  // End date
  google.protobuf.Timestamp end_date = 3;
  
  // Working hours
  WorkingHours working_hours = 4;
  
  // Force majeure clause
  string force_majeure = 5;
  
  // Indemnification clause
  string indemnification = 6;
  
  // Warranty period in days
  int32 warranty_period_days = 7;
  
  // Liquidated damages
  double liquidated_damages = 8;
  
  // Retention amount
  double retention_amount = 9;
  
  // Retention period in days
  int32 retention_period_days = 10;
  
  // Change order procedures
  string change_order_procedures = 11;
  
  // Quality standards
  repeated string quality_standards = 12;
  
  // Safety requirements
  repeated string safety_requirements = 13;
}

// Working hours information
message WorkingHours {
  // Start time
  string start_time = 1;
  
  // End time
  string end_time = 2;
  
  // Working days (Monday-Sunday)
  repeated string working_days = 3;
  
  // Overtime policy
  string overtime_policy = 4;
  
  // Holiday schedule
  repeated string holidays = 5;
}

// Financial details
message FinancialDetails {
  // Total contract value
  double total_value = 1;
  
  // Currency
  string currency = 2;
  
  // Payment terms
  string payment_terms = 3;
  
  // Down payment amount
  double down_payment = 4;
  
  // Progress payment percentage
  double progress_payment_percentage = 5;
  
  // Final payment amount
  double final_payment = 6;
  
  // Tax information
  TaxInfo tax_info = 7;
  
  // Additional costs
  repeated AdditionalCost additional_costs = 8;
}

// Tax information
message TaxInfo {
  // Tax rate percentage
  double tax_rate = 1;
  
  // Tax amount
  double tax_amount = 2;
  
  // Tax exemption status
  bool tax_exempt = 3;
  
  // Tax exemption reason
  string exemption_reason = 4;
}

// Additional cost information
message AdditionalCost {
  // Cost description
  string description = 1;
  
  // Cost amount
  double amount = 2;
  
  // Cost type
  string type = 3;
  
  // Whether cost is included in total
  bool included_in_total = 4;
}

// Milestone information
message Milestone {
  // Milestone ID
  string id = 1;
  
  // Milestone name
  string name = 2;
  
  // Milestone description
  string description = 3;
  
  // Target completion date
  google.protobuf.Timestamp target_date = 4;
  
  // Actual completion date
  google.protobuf.Timestamp actual_date = 5;
  
  // Milestone value
  double value = 6;
  
  // Completion percentage
  double completion_percentage = 7;
  
  // Dependencies
  repeated string dependencies = 8;
  
  // Status
  string status = 9;
}

// Work item information
message WorkItem {
  // Work item ID
  string id = 1;
  
  // Work item name
  string name = 2;
  
  // Work item description
  string description = 3;
  
  // Quantity
  double quantity = 4;
  
  // Unit of measure
  string unit = 5;
  
  // Unit price
  double unit_price = 6;
  
  // Total price
  double total_price = 7;
  
  // Work item status
  string status = 8;
  
  // Completion percentage
  double completion_percentage = 9;
  
  // Dependencies
  repeated string dependencies = 10;
}

// Change order information
message ChangeOrder {
  // Change order ID
  string id = 1;
  
  // Change order number
  string number = 2;
  
  // Change order description
  string description = 3;
  
  // Reason for change
  string reason = 4;
  
  // Change amount
  double amount = 5;
  
  // Change type (addition, deletion, modification)
  string type = 6;
  
  // Requested by
  string requested_by = 7;
  
  // Requested date
  google.protobuf.Timestamp requested_date = 8;
  
  // Approved by
  string approved_by = 9;
  
  // Approved date
  google.protobuf.Timestamp approved_date = 10;
  
  // Status
  string status = 11;
  
  // Impact on schedule
  int32 schedule_impact_days = 12;
}

// Contract status enumeration
enum ContractStatus {
  CONTRACT_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  PENDING_APPROVAL = 2;
  APPROVED = 3;
  ACTIVE = 4;
  SUSPENDED = 5;
  COMPLETED = 6;
  TERMINATED = 7;
  CANCELLED = 8;
  EXPIRED = 9;
}

// Contract type enumeration
enum ContractType {
  CONTRACT_TYPE_UNSPECIFIED = 0;
  FIXED_PRICE = 1;
  COST_PLUS = 2;
  TIME_AND_MATERIALS = 3;
  UNIT_PRICE = 4;
  LUMP_SUM = 5;
  GUARANTEED_MAXIMUM_PRICE = 6;
  DESIGN_BUILD = 7;
  CONSTRUCTION_MANAGEMENT = 8;
}

// Legal information
message LegalInfo {
  // Governing law
  string governing_law = 1;
  
  // Jurisdiction
  string jurisdiction = 2;
  
  // Legal entity type
  string legal_entity_type = 3;
  
  // Registration number
  string registration_number = 4;
  
  // Compliance requirements
  repeated string compliance_requirements = 5;
  
  // Regulatory approvals
  repeated string regulatory_approvals = 6;
}

// Insurance requirement information
message InsuranceRequirement {
  // Insurance type
  string type = 1;
  
  // Minimum coverage amount
  double minimum_coverage = 2;
  
  // Required by date
  google.protobuf.Timestamp required_by = 3;
  
  // Certificate holder
  string certificate_holder = 4;
  
  // Additional insured
  bool additional_insured = 5;
  
  // Waiver of subrogation
  bool waiver_of_subrogation = 6;
}

// Performance guarantee information
message PerformanceGuarantee {
  // Guarantee type
  string type = 1;
  
  // Guarantee amount
  double amount = 2;
  
  // Guarantee period in days
  int32 period_days = 3;
  
  // Guarantee conditions
  string conditions = 4;
  
  // Guarantee provider
  string provider = 5;
}

// Payment schedule information
message PaymentSchedule {
  // Payment ID
  string id = 1;
  
  // Payment description
  string description = 2;
  
  // Payment amount
  double amount = 3;
  
  // Payment percentage
  double percentage = 4;
  
  // Due date
  google.protobuf.Timestamp due_date = 5;
  
  // Payment method
  string payment_method = 6;
  
  // Payment status
  string status = 7;
  
  // Paid date
  google.protobuf.Timestamp paid_date = 8;
  
  // Payment reference
  string payment_reference = 9;
}

// Termination clause information
message TerminationClause {
  // Termination for convenience
  string convenience_termination = 1;
  
  // Termination for cause
  string cause_termination = 2;
  
  // Notice period in days
  int32 notice_period_days = 3;
  
  // Termination penalties
  double termination_penalties = 4;
  
  // Work completion requirements
  string work_completion_requirements = 5;
}

// Dispute resolution information
message DisputeResolution {
  // Dispute resolution method
  string method = 1;
  
  // Arbitration rules
  string arbitration_rules = 2;
  
  // Mediation requirements
  string mediation_requirements = 3;
  
  // Legal venue
  string legal_venue = 4;
  
  // Attorney fees
  string attorney_fees = 5;
}

// Document attachment information
message DocumentAttachment {
  // Document ID
  string id = 1;
  
  // Document name
  string name = 2;
  
  // Document type
  string type = 3;
  
  // File path or URL
  string file_path = 4;
  
  // File size in bytes
  int64 file_size = 5;
  
  // Upload date
  google.protobuf.Timestamp upload_date = 6;
  
  // Uploaded by
  string uploaded_by = 7;
  
  // Document version
  string version = 8;
}

// Signature information
message Signature {
  // Signatory name
  string signatory_name = 1;
  
  // Signatory title
  string signatory_title = 2;
  
  // Signature date
  google.protobuf.Timestamp signature_date = 3;
  
  // Signature method (electronic, physical)
  string signature_method = 4;
  
  // Signature image or data
  string signature_data = 5;
  
  // IP address (for electronic signatures)
  string ip_address = 6;
}

// Authorized representative information
message AuthorizedRepresentative {
  // Representative name
  string name = 1;
  
  // Representative title
  string title = 2;
  
  // Contact information
  string contact_info = 3;
  
  // Authorization level
  string authorization_level = 4;
  
  // Effective date
  google.protobuf.Timestamp effective_date = 5;
  
  // Expiration date
  google.protobuf.Timestamp expiration_date = 6;
}

// License information
message LicenseInfo {
  // License type
  string type = 1;
  
  // License number
  string number = 2;
  
  // Issuing authority
  string issuing_authority = 3;
  
  // Issue date
  google.protobuf.Timestamp issue_date = 4;
  
  // Expiration date
  google.protobuf.Timestamp expiration_date = 5;
  
  // License status
  string status = 6;
}

// Contact information
message ContactInfo {
  // Primary contact person
  string primary_contact = 1;
  
  // Email address
  string email = 2;
  
  // Phone number
  string phone = 3;
  
  // Mobile phone number
  string mobile = 4;
  
  // Fax number
  string fax = 5;
  
  // Website URL
  string website = 6;
}

// Address information
message Address {
  // Street address
  string street = 1;
  
  // City
  string city = 2;
  
  // State or province
  string state_province = 3;
  
  // Postal code
  string postal_code = 4;
  
  // Country
  string country = 5;
  
  // Additional address details
  string additional_info = 6;
}
