syntax = "proto3";

package construction.contractors.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "../messages/contractor.proto";
import "../messages/contract.proto";
import "../enums/contractor_type.proto";
import "../enums/contractor_status.proto";
import "../enums/contractor_priority.proto";

// Service for managing contractors and contracts
service ContractorService {
  // Contractor Management RPCs
  
  // Create a new contractor
  rpc CreateContractor(CreateContractorRequest) returns (CreateContractorResponse);
  
  // Get contractor by ID
  rpc GetContractor(GetContractorRequest) returns (GetContractorResponse);
  
  // Update contractor information
  rpc UpdateContractor(UpdateContractorRequest) returns (UpdateContractorResponse);
  
  // Delete contractor
  rpc DeleteContractor(DeleteContractorRequest) returns (google.protobuf.Empty);
  
  // List contractors with filtering and pagination
  rpc ListContractors(ListContractorsRequest) returns (ListContractorsResponse);
  
  // Search contractors by criteria
  rpc SearchContractors(SearchContractorsRequest) returns (SearchContractorsResponse);
  
  // Get contractor performance metrics
  rpc GetContractorPerformance(GetContractorPerformanceRequest) returns (GetContractorPerformanceResponse);
  
  // Update contractor status
  rpc UpdateContractorStatus(UpdateContractorStatusRequest) returns (UpdateContractorStatusResponse);
  
  // Verify contractor credentials
  rpc VerifyContractorCredentials(VerifyContractorCredentialsRequest) returns (VerifyContractorCredentialsResponse);
  
  // Get contractor certifications
  rpc GetContractorCertifications(GetContractorCertificationsRequest) returns (GetContractorCertificationsResponse);
  
  // Add contractor certification
  rpc AddContractorCertification(AddContractorCertificationRequest) returns (AddContractorCertificationResponse);
  
  // Update contractor certification
  rpc UpdateContractorCertification(UpdateContractorCertificationRequest) returns (UpdateContractorCertificationResponse);
  
  // Remove contractor certification
  rpc RemoveContractorCertification(RemoveContractorCertificationRequest) returns (google.protobuf.Empty);
  
  // Get contractor insurance policies
  rpc GetContractorInsurance(GetContractorInsuranceRequest) returns (GetContractorInsuranceResponse);
  
  // Add contractor insurance policy
  rpc AddContractorInsurance(AddContractorInsuranceRequest) returns (AddContractorInsuranceResponse);
  
  // Update contractor insurance policy
  rpc UpdateContractorInsurance(UpdateContractorInsuranceRequest) returns (UpdateContractorInsuranceResponse);
  
  // Remove contractor insurance policy
  rpc RemoveContractorInsurance(RemoveContractorInsuranceRequest) returns (google.protobuf.Empty);
  
  // Contract Management RPCs
  
  // Create a new contract
  rpc CreateContract(CreateContractRequest) returns (CreateContractResponse);
  
  // Get contract by ID
  rpc GetContract(GetContractRequest) returns (GetContractResponse);
  
  // Update contract information
  rpc UpdateContract(UpdateContractRequest) returns (UpdateContractResponse);
  
  // Delete contract
  rpc DeleteContract(DeleteContractRequest) returns (google.protobuf.Empty);
  
  // List contracts with filtering and pagination
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse);
  
  // Search contracts by criteria
  rpc SearchContracts(SearchContractsRequest) returns (SearchContractsResponse);
  
  // Get contracts by contractor
  rpc GetContractsByContractor(GetContractsByContractorRequest) returns (GetContractsByContractorResponse);
  
  // Get contracts by client
  rpc GetContractsByClient(GetContractsByClientRequest) returns (GetContractsByClientResponse);
  
  // Get contracts by project
  rpc GetContractsByProject(GetContractsByProjectRequest) returns (GetContractsByProjectResponse);
  
  // Approve contract
  rpc ApproveContract(ApproveContractRequest) returns (ApproveContractResponse);
  
  // Reject contract
  rpc RejectContract(RejectContractRequest) returns (RejectContractResponse);
  
  // Terminate contract
  rpc TerminateContract(TerminateContractRequest) returns (TerminateContractResponse);
  
  // Add change order to contract
  rpc AddChangeOrder(AddChangeOrderRequest) returns (AddChangeOrderResponse);
  
  // Update change order
  rpc UpdateChangeOrder(UpdateChangeOrderRequest) returns (UpdateChangeOrderResponse);
  
  // Approve change order
  rpc ApproveChangeOrder(ApproveChangeOrderRequest) returns (ApproveChangeOrderResponse);
  
  // Reject change order
  rpc RejectChangeOrder(RejectChangeOrderRequest) returns (RejectChangeOrderResponse);
  
  // Get contract milestones
  rpc GetContractMilestones(GetContractMilestonesRequest) returns (GetContractMilestonesResponse);
  
  // Update milestone status
  rpc UpdateMilestoneStatus(UpdateMilestoneStatusRequest) returns (UpdateMilestoneStatusResponse);
  
  // Get contract payment schedule
  rpc GetContractPaymentSchedule(GetContractPaymentScheduleRequest) returns (GetContractPaymentScheduleResponse);
  
  // Record payment
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  
  // Get contract documents
  rpc GetContractDocuments(GetContractDocumentsRequest) returns (GetContractDocumentsResponse);
  
  // Upload contract document
  rpc UploadContractDocument(UploadContractDocumentRequest) returns (UploadContractDocumentResponse);
  
  // Download contract document
  rpc DownloadContractDocument(DownloadContractDocumentRequest) returns (DownloadContractDocumentResponse);
  
  // Delete contract document
  rpc DeleteContractDocument(DeleteContractDocumentRequest) returns (google.protobuf.Empty);
  
  // Sign contract
  rpc SignContract(SignContractRequest) returns (SignContractResponse);
  
  // Get contract signatures
  rpc GetContractSignatures(GetContractSignaturesRequest) returns (GetContractSignaturesResponse);
  
  // Business Intelligence RPCs
  
  // Get contractor analytics
  rpc GetContractorAnalytics(GetContractorAnalyticsRequest) returns (GetContractorAnalyticsResponse);
  
  // Get contract analytics
  rpc GetContractAnalytics(GetContractAnalyticsRequest) returns (GetContractAnalyticsResponse);
  
  // Get performance reports
  rpc GetPerformanceReports(GetPerformanceReportsRequest) returns (GetPerformanceReportsResponse);
  
  // Get financial reports
  rpc GetFinancialReports(GetFinancialReportsRequest) returns (GetFinancialReportsResponse);
  
  // Get compliance reports
  rpc GetComplianceReports(GetComplianceReportsRequest) returns (GetComplianceReportsResponse);
}

// Request/Response Messages for Contractor Management

message CreateContractorRequest {
  construction.contractors.messages.Contractor contractor = 1;
}

message CreateContractorResponse {
  construction.contractors.messages.Contractor contractor = 1;
  string message = 2;
}

message GetContractorRequest {
  string contractor_id = 1;
}

message GetContractorResponse {
  construction.contractors.messages.Contractor contractor = 1;
}

message UpdateContractorRequest {
  construction.contractors.messages.Contractor contractor = 1;
  repeated string update_fields = 2; // Fields to update
}

message UpdateContractorResponse {
  construction.contractors.messages.Contractor contractor = 1;
  string message = 2;
}

message DeleteContractorRequest {
  string contractor_id = 1;
  string reason = 2;
}

message ListContractorsRequest {
  int32 page_size = 1;
  string page_token = 2;
  construction.contractors.enums.ContractorType type = 3;
  construction.contractors.enums.ContractorStatus status = 4;
  construction.contractors.enums.ContractorPriority priority = 5;
  string search_query = 6;
  string sort_by = 7;
  bool sort_descending = 8;
}

message ListContractorsResponse {
  repeated construction.contractors.messages.Contractor contractors = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchContractorsRequest {
  string query = 1;
  repeated construction.contractors.enums.ContractorType types = 2;
  repeated construction.contractors.enums.ContractorStatus statuses = 3;
  repeated construction.contractors.enums.ContractorPriority priorities = 4;
  repeated string specializations = 5;
  string location = 6;
  double min_rating = 7;
  double max_rating = 8;
  int32 page_size = 9;
  string page_token = 10;
}

message SearchContractorsResponse {
  repeated construction.contractors.messages.Contractor contractors = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetContractorPerformanceRequest {
  string contractor_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message GetContractorPerformanceResponse {
  construction.contractors.messages.PerformanceMetrics performance = 1;
}

message UpdateContractorStatusRequest {
  string contractor_id = 1;
  construction.contractors.enums.ContractorStatus status = 2;
  string reason = 3;
}

message UpdateContractorStatusResponse {
  construction.contractors.messages.Contractor contractor = 1;
  string message = 2;
}

message VerifyContractorCredentialsRequest {
  string contractor_id = 1;
  repeated string credential_types = 2;
}

message VerifyContractorCredentialsResponse {
  bool is_verified = 1;
  repeated CredentialVerification verifications = 2;
  string message = 3;
}

message CredentialVerification {
  string credential_type = 1;
  bool is_valid = 2;
  google.protobuf.Timestamp verification_date = 3;
  string verification_notes = 4;
}

message GetContractorCertificationsRequest {
  string contractor_id = 1;
  bool active_only = 2;
}

message GetContractorCertificationsResponse {
  repeated construction.contractors.messages.Certification certifications = 1;
}

message AddContractorCertificationRequest {
  string contractor_id = 1;
  construction.contractors.messages.Certification certification = 2;
}

message AddContractorCertificationResponse {
  construction.contractors.messages.Certification certification = 1;
  string message = 2;
}

message UpdateContractorCertificationRequest {
  string contractor_id = 1;
  string certification_id = 2;
  construction.contractors.messages.Certification certification = 3;
}

message UpdateContractorCertificationResponse {
  construction.contractors.messages.Certification certification = 1;
  string message = 2;
}

message RemoveContractorCertificationRequest {
  string contractor_id = 1;
  string certification_id = 2;
  string reason = 3;
}

message GetContractorInsuranceRequest {
  string contractor_id = 1;
  bool active_only = 2;
}

message GetContractorInsuranceResponse {
  repeated construction.contractors.messages.Insurance insurance_policies = 1;
}

message AddContractorInsuranceRequest {
  string contractor_id = 1;
  construction.contractors.messages.Insurance insurance = 2;
}

message AddContractorInsuranceResponse {
  construction.contractors.messages.Insurance insurance = 1;
  string message = 2;
}

message UpdateContractorInsuranceRequest {
  string contractor_id = 1;
  string insurance_id = 2;
  construction.contractors.messages.Insurance insurance = 3;
}

message UpdateContractorInsuranceResponse {
  construction.contractors.messages.Insurance insurance = 1;
  string message = 2;
}

message RemoveContractorInsuranceRequest {
  string contractor_id = 1;
  string insurance_id = 2;
  string reason = 3;
}

// Request/Response Messages for Contract Management

message CreateContractRequest {
  construction.contractors.messages.Contract contract = 1;
}

message CreateContractResponse {
  construction.contractors.messages.Contract contract = 1;
  string message = 2;
}

message GetContractRequest {
  string contract_id = 1;
}

message GetContractResponse {
  construction.contractors.messages.Contract contract = 1;
}

message UpdateContractRequest {
  construction.contractors.messages.Contract contract = 1;
  repeated string update_fields = 2; // Fields to update
}

message UpdateContractResponse {
  construction.contractors.messages.Contract contract = 1;
  string message = 2;
}

message DeleteContractRequest {
  string contract_id = 1;
  string reason = 2;
}

message ListContractsRequest {
  int32 page_size = 1;
  string page_token = 2;
  construction.contractors.messages.ContractStatus status = 3;
  construction.contractors.messages.ContractType type = 4;
  string contractor_id = 5;
  string client_id = 6;
  string project_id = 7;
  google.protobuf.Timestamp start_date = 8;
  google.protobuf.Timestamp end_date = 9;
  string sort_by = 10;
  bool sort_descending = 11;
}

message ListContractsResponse {
  repeated construction.contractors.messages.Contract contracts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchContractsRequest {
  string query = 1;
  repeated construction.contractors.messages.ContractStatus statuses = 2;
  repeated construction.contractors.messages.ContractType types = 3;
  string contractor_id = 4;
  string client_id = 5;
  string project_id = 6;
  google.protobuf.Timestamp start_date = 7;
  google.protobuf.Timestamp end_date = 8;
  double min_value = 9;
  double max_value = 10;
  int32 page_size = 11;
  string page_token = 12;
}

message SearchContractsResponse {
  repeated construction.contractors.messages.Contract contracts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetContractsByContractorRequest {
  string contractor_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.contractors.messages.ContractStatus status = 4;
}

message GetContractsByContractorResponse {
  repeated construction.contractors.messages.Contract contracts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetContractsByClientRequest {
  string client_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.contractors.messages.ContractStatus status = 4;
}

message GetContractsByClientResponse {
  repeated construction.contractors.messages.Contract contracts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetContractsByProjectRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.contractors.messages.ContractStatus status = 4;
}

message GetContractsByProjectResponse {
  repeated construction.contractors.messages.Contract contracts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ApproveContractRequest {
  string contract_id = 1;
  string approved_by = 2;
  string approval_notes = 3;
}

message ApproveContractResponse {
  construction.contractors.messages.Contract contract = 1;
  string message = 2;
}

message RejectContractRequest {
  string contract_id = 1;
  string rejected_by = 2;
  string rejection_reason = 3;
}

message RejectContractResponse {
  construction.contractors.messages.Contract contract = 1;
  string message = 2;
}

message TerminateContractRequest {
  string contract_id = 1;
  string terminated_by = 2;
  string termination_reason = 3;
  google.protobuf.Timestamp termination_date = 4;
}

message TerminateContractResponse {
  construction.contractors.messages.Contract contract = 1;
  string message = 2;
}

message AddChangeOrderRequest {
  string contract_id = 1;
  construction.contractors.messages.ChangeOrder change_order = 2;
}

message AddChangeOrderResponse {
  construction.contractors.messages.ChangeOrder change_order = 1;
  string message = 2;
}

message UpdateChangeOrderRequest {
  string contract_id = 1;
  string change_order_id = 2;
  construction.contractors.messages.ChangeOrder change_order = 3;
}

message UpdateChangeOrderResponse {
  construction.contractors.messages.ChangeOrder change_order = 1;
  string message = 2;
}

message ApproveChangeOrderRequest {
  string contract_id = 1;
  string change_order_id = 2;
  string approved_by = 3;
  string approval_notes = 4;
}

message ApproveChangeOrderResponse {
  construction.contractors.messages.ChangeOrder change_order = 1;
  string message = 2;
}

message RejectChangeOrderRequest {
  string contract_id = 1;
  string change_order_id = 2;
  string rejected_by = 3;
  string rejection_reason = 4;
}

message RejectChangeOrderResponse {
  construction.contractors.messages.ChangeOrder change_order = 1;
  string message = 2;
}

message GetContractMilestonesRequest {
  string contract_id = 1;
  bool include_completed = 2;
}

message GetContractMilestonesResponse {
  repeated construction.contractors.messages.Milestone milestones = 1;
}

message UpdateMilestoneStatusRequest {
  string contract_id = 1;
  string milestone_id = 2;
  string status = 3;
  double completion_percentage = 4;
  google.protobuf.Timestamp actual_date = 5;
  string notes = 6;
}

message UpdateMilestoneStatusResponse {
  construction.contractors.messages.Milestone milestone = 1;
  string message = 2;
}

message GetContractPaymentScheduleRequest {
  string contract_id = 1;
  bool include_paid = 2;
}

message GetContractPaymentScheduleResponse {
  repeated construction.contractors.messages.PaymentSchedule payments = 1;
}

message RecordPaymentRequest {
  string contract_id = 1;
  string payment_id = 2;
  double amount = 3;
  google.protobuf.Timestamp payment_date = 4;
  string payment_method = 5;
  string payment_reference = 6;
  string notes = 7;
}

message RecordPaymentResponse {
  construction.contractors.messages.PaymentSchedule payment = 1;
  string message = 2;
}

message GetContractDocumentsRequest {
  string contract_id = 1;
  string document_type = 2;
}

message GetContractDocumentsResponse {
  repeated construction.contractors.messages.DocumentAttachment documents = 1;
}

message UploadContractDocumentRequest {
  string contract_id = 1;
  string document_name = 2;
  string document_type = 3;
  bytes document_data = 4;
  string uploaded_by = 5;
}

message UploadContractDocumentResponse {
  construction.contractors.messages.DocumentAttachment document = 1;
  string message = 2;
}

message DownloadContractDocumentRequest {
  string contract_id = 1;
  string document_id = 2;
}

message DownloadContractDocumentResponse {
  bytes document_data = 1;
  string file_name = 2;
  string content_type = 3;
}

message DeleteContractDocumentRequest {
  string contract_id = 1;
  string document_id = 2;
  string reason = 3;
}

message SignContractRequest {
  string contract_id = 1;
  string signatory_name = 2;
  string signatory_title = 3;
  string signature_method = 4;
  string signature_data = 5;
  string ip_address = 6;
}

message SignContractResponse {
  construction.contractors.messages.Signature signature = 1;
  string message = 2;
}

message GetContractSignaturesRequest {
  string contract_id = 1;
}

message GetContractSignaturesResponse {
  repeated construction.contractors.messages.Signature signatures = 1;
}

// Request/Response Messages for Business Intelligence

message GetContractorAnalyticsRequest {
  string contractor_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string metrics = 4;
}

message GetContractorAnalyticsResponse {
  map<string, double> analytics = 1;
  repeated PerformanceTrend performance_trends = 2;
}

message PerformanceTrend {
  string metric_name = 1;
  repeated DataPoint data_points = 2;
  string trend_direction = 3;
  double trend_percentage = 4;
}

message DataPoint {
  google.protobuf.Timestamp date = 1;
  double value = 2;
}

message GetContractAnalyticsRequest {
  string contract_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string metrics = 4;
}

message GetContractAnalyticsResponse {
  map<string, double> analytics = 1;
  repeated PerformanceTrend performance_trends = 2;
}

message GetPerformanceReportsRequest {
  string contractor_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string report_type = 4;
  string format = 5;
}

message GetPerformanceReportsResponse {
  bytes report_data = 1;
  string file_name = 2;
  string content_type = 3;
}

message GetFinancialReportsRequest {
  string contractor_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string report_type = 4;
  string format = 5;
}

message GetFinancialReportsResponse {
  bytes report_data = 1;
  string file_name = 2;
  string content_type = 3;
}

message GetComplianceReportsRequest {
  string contractor_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string report_type = 4;
  string format = 5;
}

message GetComplianceReportsResponse {
  bytes report_data = 1;
  string file_name = 2;
  string content_type = 3;
}
