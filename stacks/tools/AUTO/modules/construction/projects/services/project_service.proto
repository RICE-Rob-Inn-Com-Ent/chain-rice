syntax = "proto3";

package construction.projects.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "../messages/project.proto";
import "../messages/project_task.proto";
import "../enums/project_type.proto";
import "../enums/project_status.proto";
import "../enums/project_priority.proto";

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc SearchProjects(SearchProjectsRequest) returns (SearchProjectsResponse);
  rpc GetProjectsByType(GetProjectsByTypeRequest) returns (GetProjectsByTypeResponse);
  rpc GetProjectsByStatus(GetProjectsByStatusRequest) returns (GetProjectsByStatusResponse);
  rpc CreateProjectTask(CreateProjectTaskRequest) returns (CreateProjectTaskResponse);
  rpc GetProjectTask(GetProjectTaskRequest) returns (GetProjectTaskResponse);
  rpc UpdateProjectTask(UpdateProjectTaskRequest) returns (UpdateProjectTaskResponse);
  rpc DeleteProjectTask(DeleteProjectTaskRequest) returns (google.protobuf.Empty);
  rpc ListProjectTasks(ListProjectTasksRequest) returns (ListProjectTasksResponse);
  rpc GetProjectAnalytics(GetProjectAnalyticsRequest) returns (GetProjectAnalyticsResponse);
}

message CreateProjectRequest {
  construction.projects.messages.Project project = 1;
}

message CreateProjectResponse {
  construction.projects.messages.Project project = 1;
  string message = 2;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  construction.projects.messages.Project project = 1;
}

message UpdateProjectRequest {
  construction.projects.messages.Project project = 1;
  repeated string update_fields = 2;
}

message UpdateProjectResponse {
  construction.projects.messages.Project project = 1;
  string message = 2;
}

message DeleteProjectRequest {
  string project_id = 1;
  string reason = 2;
}

message ListProjectsRequest {
  int32 page_size = 1;
  string page_token = 2;
  construction.projects.enums.ProjectType type = 3;
  construction.projects.enums.ProjectStatus status = 4;
  construction.projects.enums.ProjectPriority priority = 5;
  string sort_by = 6;
  bool sort_descending = 7;
}

message ListProjectsResponse {
  repeated construction.projects.messages.Project projects = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchProjectsRequest {
  string query = 1;
  repeated construction.projects.enums.ProjectType types = 2;
  repeated construction.projects.enums.ProjectStatus statuses = 3;
  repeated construction.projects.enums.ProjectPriority priorities = 4;
  string client = 5;
  string project_manager = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message SearchProjectsResponse {
  repeated construction.projects.messages.Project projects = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetProjectsByTypeRequest {
  construction.projects.enums.ProjectType type = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.projects.enums.ProjectStatus status = 4;
}

message GetProjectsByTypeResponse {
  repeated construction.projects.messages.Project projects = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetProjectsByStatusRequest {
  construction.projects.enums.ProjectStatus status = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.projects.enums.ProjectType type = 4;
}

message GetProjectsByStatusResponse {
  repeated construction.projects.messages.Project projects = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CreateProjectTaskRequest {
  string project_id = 1;
  construction.projects.messages.ProjectTask task = 2;
}

message CreateProjectTaskResponse {
  construction.projects.messages.ProjectTask task = 1;
  string message = 2;
}

message GetProjectTaskRequest {
  string project_id = 1;
  string task_id = 2;
}

message GetProjectTaskResponse {
  construction.projects.messages.ProjectTask task = 1;
}

message UpdateProjectTaskRequest {
  string project_id = 1;
  string task_id = 2;
  construction.projects.messages.ProjectTask task = 3;
}

message UpdateProjectTaskResponse {
  construction.projects.messages.ProjectTask task = 1;
  string message = 2;
}

message DeleteProjectTaskRequest {
  string project_id = 1;
  string task_id = 2;
  string reason = 3;
}

message ListProjectTasksRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string status = 4;
  string priority = 5;
}

message ListProjectTasksResponse {
  repeated construction.projects.messages.ProjectTask tasks = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetProjectAnalyticsRequest {
  string project_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string metrics = 4;
}

message GetProjectAnalyticsResponse {
  map<string, double> analytics = 1;
  repeated PerformanceTrend performance_trends = 2;
}

message PerformanceTrend {
  string metric_name = 1;
  repeated DataPoint data_points = 2;
  string trend_direction = 3;
  double trend_percentage = 4;
}

message DataPoint {
  google.protobuf.Timestamp date = 1;
  double value = 2;
}
