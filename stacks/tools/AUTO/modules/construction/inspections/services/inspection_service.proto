// Request/Response Messages for Business Intelligence

message GetInspectionAnalyticsRequest {
  string project_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string metrics = 4;
  construction.inspections.enums.InspectionType type = 5;
}

message GetInspectionAnalyticsResponse {
  map<string, double> analytics = 1;
  repeated PerformanceTrend performance_trends = 2;
}

message PerformanceTrend {
  string metric_name = 1;
  repeated DataPoint data_points = 2;
  string trend_direction = 3;
  double trend_percentage = 4;
}

message DataPoint {
  google.protobuf.Timestamp date = 1;
  double value = 2;
}

message GetInspectionPerformanceMetricsRequest {
  string inspector_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string metrics = 4;
}

message GetInspectionPerformanceMetricsResponse {
  map<string, double> metrics = 1;
  repeated PerformanceTrend performance_trends = 2;
}

message GetComplianceReportsRequest {
  string project_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string report_type = 4;
  string format = 5;
}

message GetComplianceReportsResponse {
  bytes report_data = 1;
  string file_name = 2;
  string content_type = 3;
}

message GetQualityReportsRequest {
  string project_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string report_type = 4;
  string format = 5;
}

message GetQualityReportsResponse {
  bytes report_data = 1;
  string file_name = 2;
  string content_type = 3;
}

message GetSafetyReportsRequest {
  string project_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string report_type = 4;
  string format = 5;
}

message GetSafetyReportsResponse {
  bytes report_data = 1;
  string file_name = 2;
  string content_type = 3;
}

message GetInspectionTrendsRequest {
  string project_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  construction.inspections.enums.InspectionType type = 4;
  repeated string trend_metrics = 5;
}

message GetInspectionTrendsResponse {
  repeated TrendAnalysis trends = 1;
}

message TrendAnalysis {
  string metric_name = 1;
  repeated DataPoint data_points = 2;
  string trend_direction = 3;
  double trend_percentage = 4;
  string trend_description = 5;
}

message GetInspectorPerformanceRequest {
  string inspector_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated string performance_metrics = 4;
}

message GetInspectorPerformanceResponse {
  map<string, double> performance_metrics = 1;
  repeated PerformanceTrend performance_trends = 2;
  InspectorPerformanceSummary summary = 3;
}

message InspectorPerformanceSummary {
  string inspector_name = 1;
  int32 total_inspections = 2;
  int32 completed_inspections = 3;
  int32 on_time_inspections = 4;
  double average_rating = 5;
  int32 total_findings = 6;
  int32 critical_findings = 7;
  double compliance_rate = 8;
}

message GetProjectInspectionSummaryRequest {
  string project_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message GetProjectInspectionSummaryResponse {
  ProjectInspectionSummary summary = 1;
  repeated InspectionTypeSummary type_summaries = 2;
  repeated InspectionStatusSummary status_summaries = 3;
}

message ProjectInspectionSummary {
  string project_name = 1;
  int32 total_inspections = 2;
  int32 completed_inspections = 3;
  int32 pending_inspections = 4;
  int32 overdue_inspections = 5;
  double overall_compliance_rate = 6;
  double average_quality_score = 7;
  int32 total_findings = 8;
  int32 critical_findings = 9;
  int32 major_findings = 10;
  int32 minor_findings = 11;
}

message InspectionTypeSummary {
  construction.inspections.enums.InspectionType type = 1;
  int32 count = 2;
  int32 completed = 3;
  int32 pending = 4;
  int32 overdue = 5;
  double compliance_rate = 6;
  double average_quality_score = 7;
}

message InspectionStatusSummary {
  construction.inspections.enums.InspectionStatus status = 1;
  int32 count = 2;
  double percentage = 3;
}
