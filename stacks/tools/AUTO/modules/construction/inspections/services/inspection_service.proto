syntax = "proto3";

package construction.inspections.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "../messages/inspection.proto";
import "../messages/inspection_report.proto";
import "../enums/inspection_type.proto";
import "../enums/inspection_status.proto";
import "../enums/severity_level.proto";

// Service for managing inspections and inspection reports
service InspectionService {
  // Inspection Management RPCs
  
  // Create a new inspection
  rpc CreateInspection(CreateInspectionRequest) returns (CreateInspectionResponse);
  
  // Get inspection by ID
  rpc GetInspection(GetInspectionRequest) returns (GetInspectionResponse);
  
  // Update inspection information
  rpc UpdateInspection(UpdateInspectionRequest) returns (UpdateInspectionResponse);
  
  // Delete inspection
  rpc DeleteInspection(DeleteInspectionRequest) returns (google.protobuf.Empty);
  
  // List inspections with filtering and pagination
  rpc ListInspections(ListInspectionsRequest) returns (ListInspectionsResponse);
  
  // Search inspections by criteria
  rpc SearchInspections(SearchInspectionsRequest) returns (SearchInspectionsResponse);
  
  // Get inspections by project
  rpc GetInspectionsByProject(GetInspectionsByProjectRequest) returns (GetInspectionsByProjectResponse);
  
  // Get inspections by inspector
  rpc GetInspectionsByInspector(GetInspectionsByInspectorRequest) returns (GetInspectionsByInspectorResponse);
  
  // Get inspections by type
  rpc GetInspectionsByType(GetInspectionsByTypeRequest) returns (GetInspectionsByTypeResponse);
  
  // Get inspections by status
  rpc GetInspectionsByStatus(GetInspectionsByStatusRequest) returns (GetInspectionsByStatusResponse);
  
  // Schedule inspection
  rpc ScheduleInspection(ScheduleInspectionRequest) returns (ScheduleInspectionResponse);
  
  // Reschedule inspection
  rpc RescheduleInspection(RescheduleInspectionRequest) returns (RescheduleInspectionResponse);
  
  // Cancel inspection
  rpc CancelInspection(CancelInspectionRequest) returns (CancelInspectionResponse);
  
  // Start inspection
  rpc StartInspection(StartInspectionRequest) returns (StartInspectionResponse);
  
  // Complete inspection
  rpc CompleteInspection(CompleteInspectionRequest) returns (CompleteInspectionResponse);
  
  // Add inspection finding
  rpc AddInspectionFinding(AddInspectionFindingRequest) returns (AddInspectionFindingResponse);
  
  // Update inspection finding
  rpc UpdateInspectionFinding(UpdateInspectionFindingRequest) returns (UpdateInspectionFindingResponse);
  
  // Remove inspection finding
  rpc RemoveInspectionFinding(RemoveInspectionFindingRequest) returns (google.protobuf.Empty);
  
  // Get inspection findings
  rpc GetInspectionFindings(GetInspectionFindingsRequest) returns (GetInspectionFindingsResponse);
  
  // Add inspection attachment
  rpc AddInspectionAttachment(AddInspectionAttachmentRequest) returns (AddInspectionAttachmentResponse);
  
  // Remove inspection attachment
  rpc RemoveInspectionAttachment(RemoveInspectionAttachmentRequest) returns (google.protobuf.Empty);
  
  // Get inspection attachments
  rpc GetInspectionAttachments(GetInspectionAttachmentsRequest) returns (GetInspectionAttachmentsResponse);
  
  // Approve inspection
  rpc ApproveInspection(ApproveInspectionRequest) returns (ApproveInspectionResponse);
  
  // Reject inspection
  rpc RejectInspection(RejectInspectionRequest) returns (RejectInspectionResponse);
  
  // Inspection Report Management RPCs
  
  // Create inspection report
  rpc CreateInspectionReport(CreateInspectionReportRequest) returns (CreateInspectionReportResponse);
  
  // Get inspection report by ID
  rpc GetInspectionReport(GetInspectionReportRequest) returns (GetInspectionReportResponse);
  
  // Update inspection report
  rpc UpdateInspectionReport(UpdateInspectionReportRequest) returns (UpdateInspectionReportResponse);
  
  // Delete inspection report
  rpc DeleteInspectionReport(DeleteInspectionReportRequest) returns (google.protobuf.Empty);
  
  // List inspection reports with filtering and pagination
  rpc ListInspectionReports(ListInspectionReportsRequest) returns (ListInspectionReportsResponse);
  
  // Search inspection reports by criteria
  rpc SearchInspectionReports(SearchInspectionReportsRequest) returns (SearchInspectionReportsResponse);
  
  // Get inspection reports by project
  rpc GetInspectionReportsByProject(GetInspectionReportsByProjectRequest) returns (GetInspectionReportsByProjectResponse);
  
  // Get inspection reports by inspector
  rpc GetInspectionReportsByInspector(GetInspectionReportsByInspectorRequest) returns (GetInspectionReportsByInspectorResponse);
  
  // Generate inspection report
  rpc GenerateInspectionReport(GenerateInspectionReportRequest) returns (GenerateInspectionReportResponse);
  
  // Approve inspection report
  rpc ApproveInspectionReport(ApproveInspectionReportRequest) returns (ApproveInspectionReportResponse);
  
  // Reject inspection report
  rpc RejectInspectionReport(RejectInspectionReportRequest) returns (RejectInspectionReportResponse);
  
  // Distribute inspection report
  rpc DistributeInspectionReport(DistributeInspectionReportRequest) returns (DistributeInspectionReportResponse);
  
  // Get inspection report attachments
  rpc GetInspectionReportAttachments(GetInspectionReportAttachmentsRequest) returns (GetInspectionReportAttachmentsResponse);
  
  // Add inspection report attachment
  rpc AddInspectionReportAttachment(AddInspectionReportAttachmentRequest) returns (AddInspectionReportAttachmentResponse);
  
  // Remove inspection report attachment
  rpc RemoveInspectionReportAttachment(RemoveInspectionReportAttachmentRequest) returns (google.protobuf.Empty);
  
  // Business Intelligence RPCs
  
  // Get inspection analytics
  rpc GetInspectionAnalytics(GetInspectionAnalyticsRequest) returns (GetInspectionAnalyticsResponse);
  
  // Get inspection performance metrics
  rpc GetInspectionPerformanceMetrics(GetInspectionPerformanceMetricsRequest) returns (GetInspectionPerformanceMetricsResponse);
  
  // Get compliance reports
  rpc GetComplianceReports(GetComplianceReportsRequest) returns (GetComplianceReportsResponse);
  
  // Get quality reports
  rpc GetQualityReports(GetQualityReportsRequest) returns (GetQualityReportsResponse);
  
  // Get safety reports
  rpc GetSafetyReports(GetSafetyReportsRequest) returns (GetSafetyReportsResponse);
  
  // Get inspection trends
  rpc GetInspectionTrends(GetInspectionTrendsRequest) returns (GetInspectionTrendsResponse);
  
  // Get inspector performance
  rpc GetInspectorPerformance(GetInspectorPerformanceRequest) returns (GetInspectorPerformanceResponse);
  
  // Get project inspection summary
  rpc GetProjectInspectionSummary(GetProjectInspectionSummaryRequest) returns (GetProjectInspectionSummaryResponse);
}

// Request/Response Messages for Inspection Management

message CreateInspectionRequest {
  construction.inspections.messages.Inspection inspection = 1;
}

message CreateInspectionResponse {
  construction.inspections.messages.Inspection inspection = 1;
  string message = 2;
}

message GetInspectionRequest {
  string inspection_id = 1;
}

message GetInspectionResponse {
  construction.inspections.messages.Inspection inspection = 1;
}

message UpdateInspectionRequest {
  construction.inspections.messages.Inspection inspection = 1;
  repeated string update_fields = 2; // Fields to update
}

message UpdateInspectionResponse {
  construction.inspections.messages.Inspection inspection = 1;
  string message = 2;
}

message DeleteInspectionRequest {
  string inspection_id = 1;
  string reason = 2;
}

message ListInspectionsRequest {
  int32 page_size = 1;
  string page_token = 2;
  construction.inspections.enums.InspectionType type = 3;
  construction.inspections.enums.InspectionStatus status = 4;
  string project_id = 5;
  string inspector_id = 6;
  google.protobuf.Timestamp start_date = 7;
  google.protobuf.Timestamp end_date = 8;
  string sort_by = 9;
  bool sort_descending = 10;
}

message ListInspectionsResponse {
  repeated construction.inspections.messages.Inspection inspections = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchInspectionsRequest {
  string query = 1;
  repeated construction.inspections.enums.InspectionType types = 2;
  repeated construction.inspections.enums.InspectionStatus statuses = 3;
  string project_id = 4;
  string inspector_id = 5;
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  construction.inspections.enums.SeverityLevel min_severity = 8;
  int32 page_size = 9;
  string page_token = 10;
}

message SearchInspectionsResponse {
  repeated construction.inspections.messages.Inspection inspections = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetInspectionsByProjectRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.inspections.enums.InspectionType type = 4;
  construction.inspections.enums.InspectionStatus status = 5;
}

message GetInspectionsByProjectResponse {
  repeated construction.inspections.messages.Inspection inspections = 1;
