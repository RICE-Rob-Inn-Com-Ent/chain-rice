message AddInspectionFindingResponse {
  construction.inspections.messages.InspectionFinding finding = 1;
  string message = 2;
}

message UpdateInspectionFindingRequest {
  string inspection_id = 1;
  string finding_id = 2;
  construction.inspections.messages.InspectionFinding finding = 3;
}

message UpdateInspectionFindingResponse {
  construction.inspections.messages.InspectionFinding finding = 1;
  string message = 2;
}

message RemoveInspectionFindingRequest {
  string inspection_id = 1;
  string finding_id = 2;
  string reason = 3;
}

message GetInspectionFindingsRequest {
  string inspection_id = 1;
  construction.inspections.enums.SeverityLevel severity = 2;
  string category = 3;
}

message GetInspectionFindingsResponse {
  repeated construction.inspections.messages.InspectionFinding findings = 1;
}

message AddInspectionAttachmentRequest {
  string inspection_id = 1;
  construction.inspections.messages.DocumentAttachment attachment = 2;
}

message AddInspectionAttachmentResponse {
  construction.inspections.messages.DocumentAttachment attachment = 1;
  string message = 2;
}

message RemoveInspectionAttachmentRequest {
  string inspection_id = 1;
  string attachment_id = 2;
  string reason = 3;
}

message GetInspectionAttachmentsRequest {
  string inspection_id = 1;
  string attachment_type = 2;
}

message GetInspectionAttachmentsResponse {
  repeated construction.inspections.messages.DocumentAttachment attachments = 1;
}

message ApproveInspectionRequest {
  string inspection_id = 1;
  string approved_by = 2;
  string approval_notes = 3;
}

message ApproveInspectionResponse {
  construction.inspections.messages.Inspection inspection = 1;
  string message = 2;
}

message RejectInspectionRequest {
  string inspection_id = 1;
  string rejected_by = 2;
  string rejection_reason = 3;
}

message RejectInspectionResponse {
  construction.inspections.messages.Inspection inspection = 1;
  string message = 2;
}

