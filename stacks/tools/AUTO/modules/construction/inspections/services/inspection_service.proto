  construction.inspections.enums.InspectionType type = 4;
  construction.inspections.enums.InspectionStatus status = 5;
}

message GetInspectionsByInspectorResponse {
  repeated construction.inspections.messages.Inspection inspections = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetInspectionsByTypeRequest {
  construction.inspections.enums.InspectionType type = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.inspections.enums.InspectionStatus status = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
}

message GetInspectionsByTypeResponse {
  repeated construction.inspections.messages.Inspection inspections = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetInspectionsByStatusRequest {
  construction.inspections.enums.InspectionStatus status = 1;
  int32 page_size = 2;
  string page_token = 3;
  construction.inspections.enums.InspectionType type = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
}

message GetInspectionsByStatusResponse {
  repeated construction.inspections.messages.Inspection inspections = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ScheduleInspectionRequest {
  string inspection_id = 1;
  google.protobuf.Timestamp scheduled_date = 2;
  string inspector_id = 3;
  string location = 4;
