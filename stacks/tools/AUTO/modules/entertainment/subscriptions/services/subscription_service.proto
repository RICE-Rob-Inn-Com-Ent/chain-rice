syntax = "proto3";

package entertainment.subscriptions.services;

import "entertainment/subscriptions/enums/subscription_plan.proto";

// Сервіс управління підписками
service SubscriptionService {
  // Управління підписками
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  
  // Управління планами
  rpc GetSubscriptionPlans(GetSubscriptionPlansRequest) returns (GetSubscriptionPlansResponse);
  rpc CreateSubscriptionPlan(CreateSubscriptionPlanRequest) returns (CreateSubscriptionPlanResponse);
  rpc UpdateSubscriptionPlan(UpdateSubscriptionPlanRequest) returns (UpdateSubscriptionPlanResponse);
  rpc DeleteSubscriptionPlan(DeleteSubscriptionPlanRequest) returns (DeleteSubscriptionPlanResponse);
  
  // Платежі та виставлення рахунків
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  rpc GetBillingHistory(GetBillingHistoryRequest) returns (GetBillingHistoryResponse);
  rpc GetUpcomingBilling(GetUpcomingBillingRequest) returns (GetUpcomingBillingResponse);
  
  // Оновлення та оновлення
  rpc UpgradeSubscription(UpgradeSubscriptionRequest) returns (UpgradeSubscriptionResponse);
  rpc DowngradeSubscription(DowngradeSubscriptionRequest) returns (DowngradeSubscriptionResponse);
  rpc RenewSubscription(RenewSubscriptionRequest) returns (RenewSubscriptionResponse);
  
  // Промоції та знижки
  rpc ApplyPromoCode(ApplyPromoCodeRequest) returns (ApplyPromoCodeResponse);
  rpc GetAvailablePromos(GetAvailablePromosRequest) returns (GetAvailablePromosResponse);
  rpc CreatePromoCode(CreatePromoCodeRequest) returns (CreatePromoCodeResponse);
  
  // Аналітика підписок
  rpc GetSubscriptionAnalytics(GetSubscriptionAnalyticsRequest) returns (GetSubscriptionAnalyticsResponse);
  rpc GetSubscriptionMetrics(GetSubscriptionMetricsRequest) returns (GetSubscriptionMetricsResponse);
  rpc GetChurnAnalysis(GetChurnAnalysisRequest) returns (GetChurnAnalysisResponse);
}

// Запити та відповіді для підписок
message CreateSubscriptionRequest {
  string user_id = 1;
  entertainment.subscriptions.enums.SubscriptionPlan plan = 2;
  string payment_method_id = 3;
  string promo_code = 4;
  map<string, string> metadata = 5;
}

message CreateSubscriptionResponse {
  string subscription_id = 1;
  Subscription subscription = 2;
  string message = 3;
}

message GetSubscriptionRequest {
  string subscription_id = 1;
}

message GetSubscriptionResponse {
  Subscription subscription = 1;
}

message UpdateSubscriptionRequest {
  string subscription_id = 1;
  SubscriptionUpdate update = 2;
  string user_id = 3;
}

message UpdateSubscriptionResponse {
  Subscription subscription = 1;
  string message = 2;
}

message CancelSubscriptionRequest {
  string subscription_id = 1;
  string user_id = 2;
  string reason = 3;
  bool immediate = 4;
}

message CancelSubscriptionResponse {
  bool cancelled = 1;
  string message = 2;
}

message ListSubscriptionsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  repeated string filters = 4;
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  int32 total_count = 2;
}

// Запити для планів
message GetSubscriptionPlansRequest {
  repeated string filters = 1;
}

message GetSubscriptionPlansResponse {
  repeated SubscriptionPlan plans = 1;
}

message CreateSubscriptionPlanRequest {
  SubscriptionPlan plan = 1;
  string creator_id = 2;
}

message CreateSubscriptionPlanResponse {
  SubscriptionPlan plan = 1;
  string message = 2;
}

message UpdateSubscriptionPlanRequest {
  string plan_id = 1;
  SubscriptionPlan plan = 2;
  string updater_id = 3;
}

message UpdateSubscriptionPlanResponse {
  SubscriptionPlan plan = 1;
  string message = 2;
}

message DeleteSubscriptionPlanRequest {
  string plan_id = 1;
  string deleter_id = 2;
}

message DeleteSubscriptionPlanResponse {
  string message = 1;
}

// Запити для платежів
message ProcessPaymentRequest {
  string subscription_id = 1;
  PaymentInfo payment_info = 2;
  string user_id = 3;
}

message ProcessPaymentResponse {
  string transaction_id = 1;
  bool success = 2;
  string message = 3;
}

message GetBillingHistoryRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetBillingHistoryResponse {
  repeated BillingRecord records = 1;
  int32 total_count = 2;
}

message GetUpcomingBillingRequest {
  string user_id = 1;
}

message GetUpcomingBillingResponse {
  repeated UpcomingBilling upcoming = 1;
}

// Запити для оновлення
message UpgradeSubscriptionRequest {
  string subscription_id = 1;
  entertainment.subscriptions.enums.SubscriptionPlan new_plan = 2;
  string user_id = 3;
}

message UpgradeSubscriptionResponse {
  Subscription subscription = 1;
  string message = 2;
}

message DowngradeSubscriptionRequest {
  string subscription_id = 1;
  entertainment.subscriptions.enums.SubscriptionPlan new_plan = 2;
  string user_id = 3;
}

message DowngradeSubscriptionResponse {
  Subscription subscription = 1;
  string message = 2;
}

message RenewSubscriptionRequest {
  string subscription_id = 1;
  string user_id = 2;
}

message RenewSubscriptionResponse {
  Subscription subscription = 1;
  string message = 2;
}

// Запити для промоцій
message ApplyPromoCodeRequest {
  string subscription_id = 1;
  string promo_code = 2;
  string user_id = 3;
}

message ApplyPromoCodeResponse {
  bool applied = 1;
  double discount_amount = 2;
  string message = 3;
}

message GetAvailablePromosRequest {
  string user_id = 1;
  entertainment.subscriptions.enums.SubscriptionPlan plan = 2;
}

message GetAvailablePromosResponse {
  repeated PromoCode promos = 1;
}

message CreatePromoCodeRequest {
  PromoCode promo = 1;
  string creator_id = 2;
}

message CreatePromoCodeResponse {
  PromoCode promo = 1;
  string message = 2;
}

// Запити для аналітики
message GetSubscriptionAnalyticsRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetSubscriptionAnalyticsResponse {
  SubscriptionAnalytics analytics = 1;
}

message GetSubscriptionMetricsRequest {
  string metric_type = 1;
  string time_period = 2;
}

message GetSubscriptionMetricsResponse {
  SubscriptionMetrics metrics = 1;
}

message GetChurnAnalysisRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetChurnAnalysisResponse {
  ChurnAnalysis analysis = 1;
}

// Допоміжні повідомлення
message Subscription {
  string id = 1;
  string user_id = 2;
  entertainment.subscriptions.enums.SubscriptionPlan plan = 3;
  string status = 4;
  int64 start_date = 5;
  int64 end_date = 6;
  int64 next_billing_date = 7;
  double price = 8;
  string currency = 9;
  string payment_method_id = 10;
  bool auto_renew = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
  map<string, string> metadata = 14;
}

message SubscriptionPlan {
  string id = 1;
  string name = 2;
  string description = 3;
  entertainment.subscriptions.enums.SubscriptionPlan plan_type = 4;
  double price = 5;
  string currency = 6;
  string billing_cycle = 7;
  repeated string features = 8;
  repeated string limitations = 9;
  bool is_active = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

message SubscriptionUpdate {
  entertainment.subscriptions.enums.SubscriptionPlan plan = 1;
  bool auto_renew = 2;
  string payment_method_id = 3;
  map<string, string> metadata = 4;
}

message PaymentInfo {
  string payment_method_id = 1;
  string billing_address = 2;
  string email = 3;
  map<string, string> metadata = 4;
}

message BillingRecord {
  string id = 1;
  string subscription_id = 2;
  double amount = 3;
  string currency = 4;
  string status = 5;
  int64 billing_date = 6;
  int64 due_date = 7;
  string payment_method = 8;
  string transaction_id = 9;
}

message UpcomingBilling {
  string subscription_id = 1;
  double amount = 2;
  string currency = 3;
  int64 billing_date = 4;
  string plan_name = 5;
}

message PromoCode {
  string id = 1;
  string code = 2;
  string description = 3;
  string discount_type = 4;
  double discount_value = 5;
  string currency = 6;
  int64 valid_from = 7;
  int64 valid_until = 8;
  int32 usage_limit = 9;
  int32 used_count = 10;
  repeated entertainment.subscriptions.enums.SubscriptionPlan applicable_plans = 11;
  bool is_active = 12;
}

message SubscriptionAnalytics {
  int32 total_subscriptions = 1;
  int32 active_subscriptions = 2;
  int32 cancelled_subscriptions = 3;
  double monthly_recurring_revenue = 4;
  double churn_rate = 5;
  map<string, int32> subscriptions_by_plan = 6;
}

message SubscriptionMetrics {
  double conversion_rate = 1;
  double retention_rate = 2;
  double upgrade_rate = 3;
  double downgrade_rate = 4;
  double average_revenue_per_user = 5;
}

message ChurnAnalysis {
  double churn_rate = 1;
  repeated string churn_reasons = 2;
  map<string, double> churn_by_segment = 3;
  repeated string retention_strategies = 4;
}
