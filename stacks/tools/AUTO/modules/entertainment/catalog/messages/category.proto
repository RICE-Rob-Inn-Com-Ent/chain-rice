syntax = "proto3";

package entertainment.catalog.messages;

// Категорія для каталогу
message Category {
  string id = 1;
  string name = 2;
  string description = 3;
  string display_name = 4;
  
  // Тип категорії
  CategoryType type = 5;
  
  // Ієрархія категорії
  CategoryHierarchy hierarchy = 6;
  
  // Метадані категорії
  CategoryMetadata metadata = 7;
  
  // Статистика категорії
  CategoryStats stats = 8;
  
  // Налаштування категорії
  CategorySettings settings = 9;
  
  // Дати
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 last_modified = 12;
  
  // Додаткові поля
  map<string, string> custom_fields = 13;
  string external_id = 14;
}

// Тип категорії
enum CategoryType {
  CATEGORY_TYPE_UNSPECIFIED = 0;
  
  // Основні типи
  CONTENT_CATEGORY = 1;
  GENRE_CATEGORY = 2;
  TOPIC_CATEGORY = 3;
  THEME_CATEGORY = 4;
  MOOD_CATEGORY = 5;
  
  // Функціональні типи
  NAVIGATION_CATEGORY = 6;
  FILTER_CATEGORY = 7;
  FACET_CATEGORY = 8;
  SEARCH_CATEGORY = 9;
  
  // Користувацькі типи
  USER_CATEGORY = 10;
  COMMUNITY_CATEGORY = 11;
  CURATED_CATEGORY = 12;
  AUTO_GENERATED_CATEGORY = 13;
  
  // Спеціальні типи
  TRENDING_CATEGORY = 14;
  POPULAR_CATEGORY = 15;
  FEATURED_CATEGORY = 16;
  SEASONAL_CATEGORY = 17;
  
  // Технічні типи
  SYSTEM_CATEGORY = 18;
  INTERNAL_CATEGORY = 19;
  DEBUG_CATEGORY = 20;
  TEST_CATEGORY = 21;
}

// Ієрархія категорії
message CategoryHierarchy {
  string parent_id = 1;
  repeated string child_ids = 2;
  repeated string ancestor_ids = 3;
  repeated string descendant_ids = 4;
  int32 level = 5;
  string path = 6;
  string full_path = 7;
  bool is_root = 8;
  bool is_leaf = 9;
  int32 depth = 10;
  repeated string siblings = 11;
}

// Метадані категорії
message CategoryMetadata {
  string language = 1;
  string country = 2;
  repeated string synonyms = 3;
  repeated string related_categories = 4;
  string color = 5;
  string icon = 6;
  string image_url = 7;
  string banner_url = 8;
  string description_long = 9;
  repeated string keywords = 10;
  repeated string examples = 11;
  string usage_notes = 12;
  repeated string tags = 13;
}

// Статистика категорії
message CategoryStats {
  int32 content_count = 1;
  int32 subcategory_count = 2;
  int32 user_count = 3;
  int32 view_count = 4;
  int32 click_count = 5;
  double popularity_score = 6;
  double trending_score = 7;
  int64 last_accessed_at = 8;
  int64 first_created_at = 9;
  map<string, int32> content_by_type = 10;
  map<string, int32> content_by_status = 11;
  map<string, int32> users_by_segment = 12;
}

// Налаштування категорії
message CategorySettings {
  bool is_active = 1;
  bool is_public = 2;
  bool is_searchable = 3;
  bool is_filterable = 4;
  bool is_facetable = 5;
  bool is_editable = 6;
  bool is_deletable = 7;
  bool allow_subcategories = 8;
  bool allow_content = 9;
  bool auto_assign = 10;
  bool require_approval = 11;
  int32 max_subcategories = 12;
  int32 max_content = 13;
  repeated string allowed_content_types = 14;
  repeated string forbidden_content_types = 15;
}
