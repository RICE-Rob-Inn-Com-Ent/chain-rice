syntax = "proto3";

package entertainment.content.messages;

import "entertainment/content/enums/license_type.proto";

// Права та ліцензування контенту
message RightsAndLicensing {
  string id = 1;
  string content_id = 2;
  
  // Основна інформація про ліцензію
  entertainment.content.enums.LicenseType license_type = 3;
  string license_holder = 4;
  string licensor = 5;
  string licensee = 6;
  
  // Терміни ліцензії
  int64 start_date = 7;
  int64 end_date = 8;
  int64 renewal_date = 9;
  bool is_perpetual = 10;
  bool auto_renewal = 11;
  
  // Територіальні права
  repeated string territories = 12;
  repeated string excluded_territories = 13;
  bool worldwide_rights = 14;
  
  // Платформні права
  repeated PlatformRights platform_rights = 15;
  repeated DistributionRights distribution_rights = 16;
  
  // Фінансові умови
  FinancialTerms financial_terms = 17;
  
  // Обмеження та обов'язки
  repeated string restrictions = 18;
  repeated string obligations = 19;
  repeated string reporting_requirements = 20;
  
  // Статус та дії
  LicenseStatus status = 21;
  repeated LicenseAction actions = 22;
  
  // Документи
  repeated string contract_urls = 23;
  repeated string supporting_documents = 24;
  
  // Дати
  int64 created_at = 25;
  int64 updated_at = 26;
  int64 last_reviewed = 27;
  
  // Додаткові поля
  map<string, string> custom_fields = 28;
  string external_id = 29;
}

// Платформні права
message PlatformRights {
  string platform = 1;
  bool streaming_rights = 2;
  bool download_rights = 3;
  bool broadcast_rights = 4;
  bool theatrical_rights = 5;
  bool vod_rights = 6;
  bool svod_rights = 7;
  bool avod_rights = 8;
  bool tvod_rights = 9;
  repeated string quality_tiers = 10;
}

// Права розповсюдження
message DistributionRights {
  string distribution_type = 1;
  bool home_video = 2;
  bool digital_download = 3;
  bool streaming = 4;
  bool broadcast = 5;
  bool theatrical = 6;
  bool educational = 7;
  bool corporate = 8;
  bool airline = 9;
  bool hotel = 10;
  bool cruise_ship = 11;
}

// Фінансові умови
message FinancialTerms {
  string payment_model = 1;
  double upfront_payment = 2;
  double minimum_guarantee = 3;
  double revenue_share_percentage = 4;
  string currency = 5;
  repeated PaymentMilestone milestones = 6;
  repeated RoyaltyRate royalty_rates = 7;
  bool advance_payment = 8;
  double advance_amount = 9;
}

// Платіжні етапи
message PaymentMilestone {
  string milestone_name = 1;
  double amount = 2;
  int64 due_date = 3;
  string trigger_event = 4;
  bool completed = 5;
}

// Ставки роялті
message RoyaltyRate {
  string revenue_type = 1;
  double percentage = 2;
  double minimum_amount = 3;
  string calculation_method = 4;
}

// Статус ліцензії
enum LicenseStatus {
  LICENSE_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  PENDING_APPROVAL = 2;
  ACTIVE = 3;
  EXPIRED = 4;
  TERMINATED = 5;
  SUSPENDED = 6;
  UNDER_REVIEW = 7;
  RENEWED = 8;
  TRANSFERRED = 9;
}

// Дії з ліцензією
message LicenseAction {
  string action_type = 1;
  string description = 2;
  string performed_by = 3;
  int64 performed_at = 4;
  map<string, string> details = 5;
}
