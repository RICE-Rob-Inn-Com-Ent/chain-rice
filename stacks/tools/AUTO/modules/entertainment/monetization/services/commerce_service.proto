syntax = "proto3";

package entertainment.monetization.services;

import "entertainment/monetization/enums/price_model.proto";

// Сервіс комерції та монетизації
service CommerceService {
  // Управління продуктами
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  
  // Управління цінами
  rpc SetProductPrice(SetProductPriceRequest) returns (SetProductPriceResponse);
  rpc GetProductPrice(GetProductPriceRequest) returns (GetProductPriceResponse);
  rpc UpdatePricingRule(UpdatePricingRuleRequest) returns (UpdatePricingRuleResponse);
  rpc GetPricingRules(GetPricingRulesRequest) returns (GetPricingRulesResponse);
  
  // Управління транзакціями
  rpc ProcessTransaction(ProcessTransactionRequest) returns (ProcessTransactionResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc RefundTransaction(RefundTransactionRequest) returns (RefundTransactionResponse);
  
  // Управління кошиком
  rpc AddToCart(AddToCartRequest) returns (AddToCartResponse);
  rpc RemoveFromCart(RemoveFromCartRequest) returns (RemoveFromCartResponse);
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);
  
  // Управління замовленнями
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  
  // Управління роялті
  rpc CalculateRoyalty(CalculateRoyaltyRequest) returns (CalculateRoyaltyResponse);
  rpc RecordRoyalty(RecordRoyaltyRequest) returns (RecordRoyaltyResponse);
  rpc GetRoyaltyReport(GetRoyaltyReportRequest) returns (GetRoyaltyReportResponse);
  
  // Аналітика комерції
  rpc GetCommerceAnalytics(GetCommerceAnalyticsRequest) returns (GetCommerceAnalyticsResponse);
  rpc GetRevenueMetrics(GetRevenueMetricsRequest) returns (GetRevenueMetricsResponse);
  rpc GetSalesReport(GetSalesReportRequest) returns (GetSalesReportResponse);
}

// Запити та відповіді для продуктів
message CreateProductRequest {
  Product product = 1;
  string creator_id = 2;
}

message CreateProductResponse {
  Product product = 1;
  string message = 2;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message UpdateProductRequest {
  string product_id = 1;
  Product product = 2;
  string updater_id = 3;
}

message UpdateProductResponse {
  Product product = 1;
  string message = 2;
}

message DeleteProductRequest {
  string product_id = 1;
  string deleter_id = 2;
}

message DeleteProductResponse {
  string message = 1;
}

message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
  repeated string filters = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  int32 total_count = 2;
}

// Запити для цін
message SetProductPriceRequest {
  string product_id = 1;
  entertainment.monetization.enums.PriceModel price_model = 2;
  double price = 3;
  string currency = 4;
  string setter_id = 5;
}

message SetProductPriceResponse {
  ProductPrice price = 1;
  string message = 2;
}

message GetProductPriceRequest {
  string product_id = 1;
}

message GetProductPriceResponse {
  ProductPrice price = 1;
}

message UpdatePricingRuleRequest {
  string rule_id = 1;
  PricingRule rule = 2;
  string updater_id = 3;
}

message UpdatePricingRuleResponse {
  PricingRule rule = 1;
  string message = 2;
}

message GetPricingRulesRequest {
  string product_id = 1;
}

message GetPricingRulesResponse {
  repeated PricingRule rules = 1;
}

// Запити для транзакцій
message ProcessTransactionRequest {
  string user_id = 1;
  repeated TransactionItem items = 2;
  PaymentInfo payment_info = 3;
  string promo_code = 4;
}

message ProcessTransactionResponse {
  string transaction_id = 1;
  Transaction transaction = 2;
  string message = 3;
}

message GetTransactionRequest {
  string transaction_id = 1;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}

message ListTransactionsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int32 total_count = 2;
}

message RefundTransactionRequest {
  string transaction_id = 1;
  string reason = 2;
  string refunder_id = 3;
}

message RefundTransactionResponse {
  string refund_id = 1;
  bool success = 2;
  string message = 3;
}

// Запити для кошика
message AddToCartRequest {
  string user_id = 1;
  string product_id = 2;
  int32 quantity = 3;
}

message AddToCartResponse {
  CartItem item = 1;
  string message = 2;
}

message RemoveFromCartRequest {
  string user_id = 1;
  string product_id = 2;
}

message RemoveFromCartResponse {
  string message = 1;
}

message GetCartRequest {
  string user_id = 1;
}

message GetCartResponse {
  Cart cart = 1;
}

message ClearCartRequest {
  string user_id = 1;
}

message ClearCartResponse {
  string message = 1;
}

// Запити для замовлень
message CreateOrderRequest {
  string user_id = 1;
  repeated OrderItem items = 2;
  ShippingInfo shipping_info = 3;
  string promo_code = 4;
}

message CreateOrderResponse {
  string order_id = 1;
  Order order = 2;
  string message = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  string status = 2;
  string updater_id = 3;
}

message UpdateOrderStatusResponse {
  Order order = 1;
  string message = 2;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total_count = 2;
}

// Запити для роялті
message CalculateRoyaltyRequest {
  string content_id = 1;
  double revenue = 2;
  string royalty_type = 3;
}

message CalculateRoyaltyResponse {
  RoyaltyCalculation calculation = 1;
}

message RecordRoyaltyRequest {
  string content_id = 1;
  RoyaltyRecord record = 2;
  string recorder_id = 3;
}

message RecordRoyaltyResponse {
  RoyaltyRecord record = 1;
  string message = 2;
}

message GetRoyaltyReportRequest {
  string content_id = 1;
  string time_period = 2;
}

message GetRoyaltyReportResponse {
  RoyaltyReport report = 1;
}

// Запити для аналітики
message GetCommerceAnalyticsRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetCommerceAnalyticsResponse {
  CommerceAnalytics analytics = 1;
}

message GetRevenueMetricsRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetRevenueMetricsResponse {
  RevenueMetrics metrics = 1;
}

message GetSalesReportRequest {
  string time_period = 1;
  repeated string filters = 2;
}

message GetSalesReportResponse {
  SalesReport report = 1;
}

// Допоміжні повідомлення
message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  entertainment.monetization.enums.PriceModel price_model = 5;
  double price = 6;
  string currency = 7;
  bool is_active = 8;
  bool is_digital = 9;
  repeated string tags = 10;
  map<string, string> metadata = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

message ProductPrice {
  string product_id = 1;
  entertainment.monetization.enums.PriceModel price_model = 2;
  double price = 3;
  string currency = 4;
  int64 valid_from = 5;
  int64 valid_until = 6;
  bool is_active = 7;
}

message PricingRule {
  string id = 1;
  string product_id = 2;
  string rule_type = 3;
  map<string, string> conditions = 4;
  double discount_percentage = 5;
  double discount_amount = 6;
  bool is_active = 7;
  int64 valid_from = 8;
  int64 valid_until = 9;
}

message Transaction {
  string id = 1;
  string user_id = 2;
  repeated TransactionItem items = 3;
  double total_amount = 4;
  string currency = 5;
  string status = 6;
  string payment_method = 7;
  string promo_code = 8;
  double discount_amount = 9;
  int64 created_at = 10;
  int64 completed_at = 11;
}

message TransactionItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double total_price = 5;
}

message PaymentInfo {
  string payment_method_id = 1;
  string billing_address = 2;
  string email = 3;
  map<string, string> metadata = 4;
}

message CartItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double total_price = 5;
}

message Cart {
  string user_id = 1;
  repeated CartItem items = 2;
  double total_amount = 3;
  string currency = 4;
  int64 updated_at = 5;
}

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double total_price = 5;
}

message ShippingInfo {
  string address = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  string postal_code = 5;
  string phone = 6;
}

message Order {
  string id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  double total_amount = 4;
  string currency = 5;
  string status = 6;
  ShippingInfo shipping_info = 7;
  string promo_code = 8;
  double discount_amount = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message RoyaltyCalculation {
  string content_id = 1;
  double revenue = 2;
  double royalty_rate = 3;
  double royalty_amount = 4;
  string royalty_type = 5;
}

message RoyaltyRecord {
  string id = 1;
  string content_id = 2;
  double royalty_amount = 3;
  string royalty_type = 4;
  string currency = 5;
  int64 payment_date = 6;
  string status = 7;
}

message RoyaltyReport {
  string content_id = 1;
  double total_royalties = 2;
  int32 payment_count = 3;
  double average_royalty = 4;
  map<string, double> royalties_by_type = 5;
}

message CommerceAnalytics {
  int32 total_products = 1;
  int32 total_transactions = 2;
  double total_revenue = 3;
  double average_transaction_value = 4;
  map<string, int32> sales_by_category = 5;
}

message RevenueMetrics {
  double total_revenue = 1;
  double recurring_revenue = 2;
  double one_time_revenue = 3;
  double average_revenue_per_user = 4;
  double revenue_growth_rate = 5;
}

message SalesReport {
  int32 total_sales = 1;
  double total_revenue = 2;
  double average_sale_value = 3;
  map<string, int32> sales_by_product = 4;
  map<string, double> revenue_by_product = 5;
}
