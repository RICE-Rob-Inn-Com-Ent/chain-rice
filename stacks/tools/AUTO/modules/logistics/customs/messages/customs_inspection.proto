syntax = "proto3";

package logistics.customs.messages;

import "google/protobuf/timestamp.proto";

// Customs inspection information
message CustomsInspection {
  string inspection_id = 1;                    // Unique inspection identifier
  string declaration_id = 2;                   // Associated declaration ID
  string shipment_id = 3;                      // Associated shipment ID
  
  // Inspection details
  InspectionType inspection_type = 4;          // Type of inspection
  InspectionStatus status = 5;                  // Current inspection status
  string customs_officer_id = 6;               // Assigned customs officer
  string inspection_location = 7;              // Physical inspection location
  
  // Scheduling
  google.protobuf.Timestamp scheduled_time = 8; // Scheduled inspection time
  google.protobuf.Timestamp start_time = 9;   // Actual start time
  google.protobuf.Timestamp end_time = 10;      // Actual end time
  
  // Results
  InspectionResult result = 11;                // Inspection result
  string findings = 12;                        // Inspection findings
  repeated string violations = 13;             // Any violations found
  repeated string recommendations = 14;        // Officer recommendations
  
  // Additional information
  string notes = 15;                          // Additional notes
  repeated string photo_ids = 16;              // Associated photo IDs
  repeated string document_ids = 17;           // Generated document IDs
  map<string, string> metadata = 18;           // Additional metadata
}

// Types of customs inspections
enum InspectionType {
  INSPECTION_TYPE_UNSPECIFIED = 0;
  INSPECTION_TYPE_DOCUMENTARY = 1;             // Document review only
  INSPECTION_TYPE_PHYSICAL = 2;                // Physical goods inspection
  INSPECTION_TYPE_XRAY = 3;                    // X-ray scanning
  INSPECTION_TYPE_CANINE = 4;                  // Canine inspection
  INSPECTION_TYPE_COMPREHENSIVE = 5;           // Full comprehensive inspection
}

// Inspection status
enum InspectionStatus {
  INSPECTION_STATUS_UNSPECIFIED = 0;
  INSPECTION_STATUS_SCHEDULED = 1;             // Scheduled for inspection
  INSPECTION_STATUS_IN_PROGRESS = 2;           // Currently being inspected
  INSPECTION_STATUS_COMPLETED = 3;             // Inspection completed
  INSPECTION_STATUS_CANCELLED = 4;             // Inspection cancelled
  INSPECTION_STATUS_DELAYED = 5;               // Inspection delayed
}

// Inspection results
enum InspectionResult {
  INSPECTION_RESULT_UNSPECIFIED = 0;
  INSPECTION_RESULT_CLEAR = 1;                 // No issues found
  INSPECTION_RESULT_MINOR_ISSUES = 2;          // Minor issues found
  INSPECTION_RESULT_MAJOR_ISSUES = 3;          // Major issues found
  INSPECTION_RESULT_VIOLATIONS = 4;            // Violations detected
  INSPECTION_RESULT_INCONCLUSIVE = 5;          // Inconclusive results
}
