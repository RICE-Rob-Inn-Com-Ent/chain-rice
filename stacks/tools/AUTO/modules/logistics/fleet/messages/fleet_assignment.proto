syntax = "proto3";

package logistics.fleet.messages;

import "google/protobuf/timestamp.proto";
import "logistics/fleet/enums/fleet_assignment_priority.proto";

// Fleet assignment information
message FleetAssignment {
  string assignment_id = 1;                    // Unique assignment identifier
  string shipment_id = 2;                      // Associated shipment ID
  string vehicle_id = 3;                       // Assigned vehicle ID
  string driver_id = 4;                        // Assigned driver ID
  
  // Assignment details
  logistics.fleet.enums.FleetAssignmentPriority priority = 5;
  string assignment_type = 6;                  // Type of assignment (pickup, delivery, etc.)
  string pickup_location = 7;                   // Pickup address/location
  string delivery_location = 8;                // Delivery address/location
  
  // Scheduling
  google.protobuf.Timestamp scheduled_start = 9; // Scheduled start time
  google.protobuf.Timestamp scheduled_end = 10;  // Scheduled end time
  google.protobuf.Timestamp actual_start = 11;   // Actual start time
  google.protobuf.Timestamp actual_end = 12;     // Actual end time
  
  // Status tracking
  AssignmentStatus status = 13;                // Current assignment status
  string current_location = 14;               // Current GPS location
  double progress_percent = 15;                // Completion percentage
  
  // Cargo information
  double cargo_weight_kg = 16;                // Cargo weight in kg
  double cargo_volume_cubic_m = 17;           // Cargo volume in cubic meters
  int32 pallet_count = 18;                    // Number of pallets
  repeated string cargo_items = 19;            // Cargo item IDs
  
  // Route information
  string route_id = 20;                       // Assigned route ID
  double estimated_distance_km = 21;          // Estimated distance
  double actual_distance_km = 22;             // Actual distance traveled
  int32 estimated_duration_minutes = 23;      // Estimated duration
  int32 actual_duration_minutes = 24;         // Actual duration
  
  // Special requirements
  bool requires_special_equipment = 25;       // Special equipment needed
  bool requires_signature = 26;                // Signature required
  bool requires_photo_proof = 27;             // Photo proof required
  string special_instructions = 28;           // Special delivery instructions
  
  // Timestamps
  google.protobuf.Timestamp created_at = 29;  // Assignment creation time
  google.protobuf.Timestamp last_updated = 30; // Last status update
  
  // Additional information
  string dispatcher_id = 31;                  // Dispatcher who created assignment
  string notes = 32;                          // Additional notes
  map<string, string> metadata = 33;          // Additional metadata
}

// Assignment status enumeration
enum AssignmentStatus {
  ASSIGNMENT_STATUS_UNSPECIFIED = 0;
  ASSIGNMENT_STATUS_PENDING = 1;              // Pending assignment
  ASSIGNMENT_STATUS_ASSIGNED = 2;             // Assigned to driver/vehicle
  ASSIGNMENT_STATUS_ACCEPTED = 3;             // Accepted by driver
  ASSIGNMENT_STATUS_IN_PROGRESS = 4;          // Currently in progress
  ASSIGNMENT_STATUS_PICKUP_COMPLETE = 5;      // Pickup completed
  ASSIGNMENT_STATUS_IN_TRANSIT = 6;           // In transit to destination
  ASSIGNMENT_STATUS_DELIVERED = 7;            // Successfully delivered
  ASSIGNMENT_STATUS_FAILED = 8;               // Delivery failed
  ASSIGNMENT_STATUS_CANCELLED = 9;            // Assignment cancelled
  ASSIGNMENT_STATUS_DELAYED = 10;             // Assignment delayed
}
