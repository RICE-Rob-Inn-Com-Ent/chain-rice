syntax = "proto3";

package logistics.fleet.enums;

// Types of fleet vehicles
enum FleetVehicleType {
  FLEET_VEHICLE_TYPE_UNSPECIFIED = 0;
  FLEET_VEHICLE_TYPE_TRUCK = 1;                // Standard delivery truck
  FLEET_VEHICLE_TYPE_VAN = 2;                  // Delivery van
  FLEET_VEHICLE_TYPE_SEMI_TRAILER = 3;         // Semi-trailer truck
  FLEET_VEHICLE_TYPE_CONTAINER_TRUCK = 4;      // Container truck
  FLEET_VEHICLE_TYPE_FLATBED = 5;              // Flatbed truck
  FLEET_VEHICLE_TYPE_REFRIGERATED = 6;         // Refrigerated truck
  FLEET_VEHICLE_TYPE_TANKER = 7;               // Tanker truck
  FLEET_VEHICLE_TYPE_CARGO_VAN = 8;            // Cargo van
  FLEET_VEHICLE_TYPE_PICKUP = 9;               // Pickup truck
  FLEET_VEHICLE_TYPE_MOTORCYCLE = 10;          // Delivery motorcycle
  FLEET_VEHICLE_TYPE_BICYCLE = 11;             // Delivery bicycle
  FLEET_VEHICLE_TYPE_DRONE = 12;               // Delivery drone
  FLEET_VEHICLE_TYPE_AIRCRAFT = 13;            // Cargo aircraft
  FLEET_VEHICLE_TYPE_VESSEL = 14;              // Cargo vessel
}
