syntax = "proto3";

package logistics.tracking.enums;

// Tracking status enumeration
enum TrackingStatus {
  TRACKING_STATUS_UNSPECIFIED = 0;
  TRACKING_STATUS_PENDING = 1;                 // Pending pickup
  TRACKING_STATUS_PICKED_UP = 2;              // Picked up from sender
  TRACKING_STATUS_IN_TRANSIT = 3;             // In transit to destination
  TRACKING_STATUS_OUT_FOR_DELIVERY = 4;        // Out for delivery
  TRACKING_STATUS_DELIVERED = 5;               // Successfully delivered
  TRACKING_STATUS_DELIVERY_FAILED = 6;         // Delivery failed
  TRACKING_STATUS_EXCEPTION = 7;               // Exception occurred
  TRACKING_STATUS_DELAYED = 8;                 // Delivery delayed
  TRACKING_STATUS_ON_HOLD = 9;                 // Package on hold
  TRACKING_STATUS_RETURNED = 10;               // Returned to sender
  TRACKING_STATUS_DAMAGED = 11;                // Package damaged
  TRACKING_STATUS_LOST = 12;                   // Package lost
  TRACKING_STATUS_CUSTOMS_CLEARANCE = 13;      // In customs clearance
}
