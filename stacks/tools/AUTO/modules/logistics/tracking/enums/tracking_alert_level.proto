syntax = "proto3";

package logistics.tracking.enums;

// Alert levels for tracking events
enum TrackingAlertLevel {
  TRACKING_ALERT_LEVEL_UNSPECIFIED = 0;
  TRACKING_ALERT_LEVEL_INFO = 1;               // Informational alert
  TRACKING_ALERT_LEVEL_WARNING = 2;           // Warning alert
  TRACKING_ALERT_LEVEL_ERROR = 3;             // Error alert
  TRACKING_ALERT_LEVEL_CRITICAL = 4;          // Critical alert
  TRACKING_ALERT_LEVEL_EMERGENCY = 5;         // Emergency alert
}
