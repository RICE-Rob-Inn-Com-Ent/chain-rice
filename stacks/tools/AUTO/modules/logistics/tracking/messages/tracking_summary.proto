syntax = "proto3";

package logistics.tracking.messages;

import "google/protobuf/timestamp.proto";
import "logistics/tracking/enums/tracking_status.proto";

// Tracking summary information
message TrackingSummary {
  string tracking_number = 1;                 // Tracking number
  string shipment_id = 2;                     // Associated shipment ID
  
  // Current status
  logistics.tracking.enums.TrackingStatus current_status = 3;
  string status_description = 4;              // Human-readable status description
  
  // Location information
  string current_location = 5;                // Current location
  string origin_location = 6;                 // Origin location
  string destination_location = 7;            // Destination location
  
  // Timing information
  google.protobuf.Timestamp pickup_date = 8; // Pickup date
  google.protobuf.Timestamp estimated_delivery = 9; // Estimated delivery date
  google.protobuf.Timestamp actual_delivery = 10;   // Actual delivery date
  google.protobuf.Timestamp last_update = 11;       // Last status update
  
  // Progress information
  double progress_percent = 12;                // Progress percentage (0-100)
  int32 total_events = 13;                    // Total number of events
  int32 completed_checkpoints = 14;            // Completed checkpoints
  int32 total_checkpoints = 15;               // Total checkpoints
  
  // Delivery information
  string delivery_method = 16;                // Delivery method
  bool signature_required = 17;                // Signature required
  string recipient_name = 18;                 // Recipient name
  string delivery_notes = 19;                // Delivery notes
  
  // Carrier information
  string carrier_id = 20;                     // Carrier identifier
  string carrier_name = 21;                   // Carrier name
  string service_type = 22;                   // Service type
  
  // Additional information
  string exception_reason = 23;               // Exception reason if applicable
  string next_update_expected = 24;            // Next expected update
  bool is_delayed = 25;                       // Is delivery delayed
  string delay_reason = 26;                   // Delay reason
  map<string, string> metadata = 27;          // Additional metadata
}
