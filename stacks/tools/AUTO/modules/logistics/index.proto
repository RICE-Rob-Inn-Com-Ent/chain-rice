syntax = "proto3";

package logistics;

// Logistics module index file
// This file provides a central import point for all logistics-related proto definitions

// Customs module imports
import "logistics/customs/enums/customs_status.proto";
import "logistics/customs/enums/customs_document_type.proto";
import "logistics/customs/enums/customs_risk_level.proto";
import "logistics/customs/enums/customs_clearance_result.proto";
import "logistics/customs/messages/customs_declaration.proto";
import "logistics/customs/messages/customs_document.proto";
import "logistics/customs/messages/customs_inspection.proto";
import "logistics/customs/services/customs_service.proto";

// Fleet module imports
import "logistics/fleet/enums/fleet_vehicle_type.proto";
import "logistics/fleet/enums/fleet_vehicle_status.proto";
import "logistics/fleet/enums/fleet_driver_status.proto";
import "logistics/fleet/enums/fleet_assignment_priority.proto";
import "logistics/fleet/messages/fleet_vehicle.proto";
import "logistics/fleet/messages/fleet_driver.proto";
import "logistics/fleet/messages/fleet_assignment.proto";
import "logistics/fleet/services/fleet_service.proto";

// Shipping module imports
import "logistics/shipping/enums/shipping_method.proto";
import "logistics/shipping/enums/shipping_status.proto";
import "logistics/shipping/enums/shipping_priority.proto";
import "logistics/shipping/enums/shipping_incoterms.proto";
import "logistics/shipping/messages/shipment.proto";
import "logistics/shipping/messages/shipping_label.proto";
import "logistics/shipping/messages/shipping_manifest.proto";
import "logistics/shipping/services/shipping_service.proto";

// Tracking module imports
import "logistics/tracking/enums/tracking_event_type.proto";
import "logistics/tracking/enums/tracking_status.proto";
import "logistics/tracking/enums/tracking_alert_level.proto";
import "logistics/tracking/enums/tracking_notification_type.proto";
import "logistics/tracking/messages/tracking_event.proto";
import "logistics/tracking/messages/tracking_checkpoint.proto";
import "logistics/tracking/messages/tracking_summary.proto";
import "logistics/tracking/services/tracking_service.proto";

// Warehousing module imports
import "logistics/warehousing/enums/warehouse_type.proto";
import "logistics/warehousing/enums/warehouse_zone_type.proto";
import "logistics/warehousing/enums/warehouse_inventory_status.proto";
import "logistics/warehousing/enums/warehouse_order_priority.proto";
import "logistics/warehousing/messages/warehouse.proto";
import "logistics/warehousing/messages/warehouse_inventory.proto";
import "logistics/warehousing/messages/warehouse_order.proto";
import "logistics/warehousing/messages/warehouse_task.proto";
import "logistics/warehousing/services/warehousing_service.proto";

// Logistics module version information
message LogisticsModuleInfo {
  string version = 1;                          // Module version
  string description = 2;                      // Module description
  repeated string components = 3;             // Available components
  string last_updated = 4;                    // Last update timestamp
}

// Central logistics service that coordinates all logistics operations
service LogisticsService {
  // Module information
  rpc GetModuleInfo(google.protobuf.Empty) returns (LogisticsModuleInfo);
  
  // Cross-module operations
  rpc CreateEndToEndShipment(CreateEndToEndShipmentRequest) returns (CreateEndToEndShipmentResponse);
  rpc TrackEndToEndShipment(TrackEndToEndShipmentRequest) returns (TrackEndToEndShipmentResponse);
  rpc GetLogisticsDashboard(GetLogisticsDashboardRequest) returns (GetLogisticsDashboardResponse);
  
  // Integration operations
  rpc SyncWithExternalSystems(SyncWithExternalSystemsRequest) returns (SyncWithExternalSystemsResponse);
  rpc ValidateLogisticsData(ValidateLogisticsDataRequest) returns (ValidateLogisticsDataResponse);
}

// Request/Response messages for cross-module operations
message CreateEndToEndShipmentRequest {
  string customer_id = 1;
  string origin_address = 2;
  string destination_address = 3;
  repeated Package packages = 4;
  string shipping_method = 5;
  string priority = 6;
  bool requires_customs = 7;
  bool requires_warehousing = 8;
}

message CreateEndToEndShipmentResponse {
  string shipment_id = 1;
  string tracking_number = 2;
  string warehouse_id = 3;
  string customs_declaration_id = 4;
  string fleet_assignment_id = 5;
  string status = 6;
  string estimated_delivery = 7;
}

message TrackEndToEndShipmentRequest {
  string tracking_number = 1;
}

message TrackEndToEndShipmentResponse {
  string current_status = 1;
  string current_location = 2;
  string estimated_delivery = 3;
  repeated TrackingEvent events = 4;
  repeated TrackingCheckpoint checkpoints = 5;
  string warehouse_status = 6;
  string customs_status = 7;
  string fleet_status = 8;
}

message GetLogisticsDashboardRequest {
  string user_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetLogisticsDashboardResponse {
  DashboardMetrics metrics = 1;
  repeated DashboardAlert alerts = 2;
  repeated DashboardTrend trends = 3;
}

message DashboardMetrics {
  int32 total_shipments = 1;
  int32 active_shipments = 2;
  int32 completed_shipments = 3;
  int32 delayed_shipments = 4;
  double on_time_delivery_rate = 5;
  double average_delivery_time_hours = 6;
  int32 total_warehouses = 7;
  int32 active_vehicles = 8;
  int32 active_drivers = 9;
  int32 pending_customs_declarations = 10;
}

message DashboardAlert {
  string alert_id = 1;
  string alert_type = 2;
  string severity = 3;
  string message = 4;
  string timestamp = 5;
  string action_required = 6;
}

message DashboardTrend {
  string trend_type = 1;
  string period = 2;
  double value = 3;
  double change_percent = 4;
  string direction = 5; // up, down, stable
}

// Request/Response messages for integration operations
message SyncWithExternalSystemsRequest {
  string system_type = 1;
  string sync_type = 2; // full, incremental
  string date_from = 3;
  string date_to = 4;
}

message SyncWithExternalSystemsResponse {
  string sync_id = 1;
  string status = 2;
  int32 records_processed = 3;
  int32 records_updated = 4;
  int32 records_created = 5;
  repeated string errors = 6;
}

message ValidateLogisticsDataRequest {
  string data_type = 1;
  bytes data = 2;
  string validation_rules = 3;
}

message ValidateLogisticsDataResponse {
  bool is_valid = 1;
  repeated ValidationError errors = 2;
  repeated ValidationWarning warnings = 3;
}

message ValidationError {
  string field = 1;
  string error_code = 2;
  string message = 3;
  string severity = 4;
}

message ValidationWarning {
  string field = 1;
  string warning_code = 2;
  string message = 3;
}

// Common message types used across modules
message Package {
  string package_id = 1;
  string description = 2;
  double weight_kg = 3;
  double length_cm = 4;
  double width_cm = 5;
  double height_cm = 6;
  double volume_cubic_m = 7;
  string packaging_type = 8;
  double declared_value = 9;
  string currency_code = 10;
  bool fragile = 11;
  bool hazardous = 12;
  string hazard_class = 13;
  string un_number = 14;
  map<string, string> metadata = 15;
}

message TrackingEvent {
  string event_id = 1;
  string event_type = 2;
  string description = 3;
  string location = 4;
  string timestamp = 5;
  string status = 6;
  string carrier_id = 7;
  map<string, string> metadata = 8;
}

message TrackingCheckpoint {
  string checkpoint_id = 1;
  string checkpoint_name = 2;
  string location = 3;
  string scheduled_arrival = 4;
  string actual_arrival = 5;
  string scheduled_departure = 6;
  string actual_departure = 7;
  string status = 8;
  map<string, string> metadata = 9;
}
