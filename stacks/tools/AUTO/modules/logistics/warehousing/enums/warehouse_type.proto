syntax = "proto3";

package logistics.warehousing.enums;

// Types of warehouses
enum WarehouseType {
  WAREHOUSE_TYPE_UNSPECIFIED = 0;
  WAREHOUSE_TYPE_DISTRIBUTION = 1;            // Distribution warehouse
  WAREHOUSE_TYPE_FULFILLMENT = 2;             // Fulfillment center
  WAREHOUSE_TYPE_COLD_STORAGE = 3;            // Cold storage warehouse
  WAREHOUSE_TYPE_HAZARDOUS = 4;               // Hazardous materials warehouse
  WAREHOUSE_TYPE_BONDED = 5;                  // Bonded warehouse
  WAREHOUSE_TYPE_CROSS_DOCK = 6;              // Cross-dock facility
  WAREHOUSE_TYPE_CONSOLIDATION = 7;           // Consolidation warehouse
  WAREHOUSE_TYPE_DECONSOLIDATION = 8;         // Deconsolidation warehouse
  WAREHOUSE_TYPE_RETURNS = 9;                 // Returns processing center
  WAREHOUSE_TYPE_REVERSE_LOGISTICS = 10;      // Reverse logistics center
  WAREHOUSE_TYPE_AUTOMATED = 11;              // Automated warehouse
  WAREHOUSE_TYPE_MANUAL = 12;                 // Manual warehouse
  WAREHOUSE_TYPE_MIXED = 13;                  // Mixed operations warehouse
}
