syntax = "proto3";

package logistics.warehousing.messages;

import "google/protobuf/timestamp.proto";

// Warehouse task information
message WarehouseTask {
  string task_id = 1;                         // Unique task identifier
  string warehouse_id = 2;                    // Warehouse identifier
  string order_id = 3;                        // Associated order ID
  string task_number = 4;                     // Task reference number
  
  // Task details
  TaskType task_type = 5;                     // Type of task
  TaskStatus status = 6;                      // Task status
  TaskPriority priority = 7;                 // Task priority
  
  // Assignment information
  string assigned_to = 8;                     // Assigned worker ID
  string assigned_by = 9;                     // Assigner ID
  string supervisor_id = 10;                  // Supervisor ID
  
  // Location information
  string source_location = 11;                // Source location
  string destination_location = 12;           // Destination location
  string zone_id = 13;                        // Warehouse zone ID
  
  // Task items
  repeated TaskItem items = 14;              // Task items
  int32 total_items = 15;                    // Total number of items
  double total_weight_kg = 16;               // Total weight in kg
  double total_volume_cubic_m = 17;          // Total volume in cubic meters
  
  // Timing information
  google.protobuf.Timestamp created_at = 18; // Task creation time
  google.protobuf.Timestamp scheduled_start = 19; // Scheduled start time
  google.protobuf.Timestamp scheduled_end = 20;   // Scheduled end time
  google.protobuf.Timestamp actual_start = 21;    // Actual start time
  google.protobuf.Timestamp actual_end = 22;      // Actual end time
  int32 estimated_duration_minutes = 23;      // Estimated duration
  int32 actual_duration_minutes = 24;        // Actual duration
  
  // Equipment and tools
  repeated string required_equipment = 25;    // Required equipment
  repeated string used_equipment = 26;        // Equipment used
  string equipment_notes = 27;                 // Equipment notes
  
  // Quality and validation
  bool requires_quality_check = 28;          // Quality check required
  string quality_checker_id = 29;            // Quality checker ID
  google.protobuf.Timestamp quality_check_time = 30; // Quality check time
  bool quality_passed = 31;                  // Quality check result
  string quality_notes = 32;                 // Quality check notes
  
  // Special requirements
  bool requires_special_handling = 33;        // Special handling required
  bool requires_temperature_control = 34;     // Temperature control required
  string temperature_range = 35;               // Temperature range
  bool is_hazardous = 36;                    // Hazardous materials
  string special_instructions = 37;          // Special instructions
  
  // Completion information
  string completion_notes = 38;               // Completion notes
  repeated string issues_encountered = 39;   // Issues encountered
  string resolution_notes = 40;              // Resolution notes
  
  // Additional information
  string notes = 41;                         // Additional notes
  map<string, string> metadata = 42;         // Additional metadata
}

// Task item information
message TaskItem {
  string item_id = 1;                        // Item identifier
  string sku = 2;                            // Stock Keeping Unit
  string product_name = 3;                   // Product name
  string description = 4;                    // Product description
  int32 quantity_requested = 5;              // Quantity requested
  int32 quantity_processed = 6;              // Quantity processed
  string source_location = 7;                // Source location
  string destination_location = 8;            // Destination location
  string batch_number = 9;                   // Batch number
  string lot_number = 10;                    // Lot number
  google.protobuf.Timestamp expiry_date = 11; // Expiry date
  bool requires_special_handling = 12;        // Special handling required
  string special_instructions = 13;          // Item-specific instructions
}

// Task type enumeration
enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_RECEIVING = 1;                   // Receiving task
  TASK_TYPE_PUTAWAY = 2;                     // Put-away task
  TASK_TYPE_PICKING = 3;                     // Picking task
  TASK_TYPE_PACKING = 4;                     // Packing task
  TASK_TYPE_SHIPPING = 5;                    // Shipping task
  TASK_TYPE_INVENTORY_COUNT = 6;             // Inventory count task
  TASK_TYPE_CYCLE_COUNT = 7;                 // Cycle count task
  TASK_TYPE_REPLENISHMENT = 8;               // Replenishment task
  TASK_TYPE_TRANSFER = 9;                    // Transfer task
  TASK_TYPE_RETURN_PROCESSING = 10;          // Return processing task
  TASK_TYPE_MAINTENANCE = 11;                // Maintenance task
  TASK_TYPE_CLEANING = 12;                   // Cleaning task
  TASK_TYPE_QUALITY_CHECK = 13;             // Quality check task
}

// Task status enumeration
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;                   // Pending assignment
  TASK_STATUS_ASSIGNED = 2;                  // Assigned to worker
  TASK_STATUS_IN_PROGRESS = 3;               // Currently in progress
  TASK_STATUS_COMPLETED = 4;                 // Completed successfully
  TASK_STATUS_CANCELLED = 5;                 // Cancelled
  TASK_STATUS_ON_HOLD = 6;                   // On hold
  TASK_STATUS_EXCEPTION = 7;                 // Exception occurred
  TASK_STATUS_QUALITY_CHECK = 8;             // Under quality check
  TASK_STATUS_REJECTED = 9;                  // Rejected/needs rework
}

// Task priority enumeration
enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_LOW = 1;                     // Low priority
  TASK_PRIORITY_NORMAL = 2;                  // Normal priority
  TASK_PRIORITY_HIGH = 3;                    // High priority
  TASK_PRIORITY_URGENT = 4;                  // Urgent priority
  TASK_PRIORITY_CRITICAL = 5;                // Critical priority
}
