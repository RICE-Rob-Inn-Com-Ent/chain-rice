syntax = "proto3";

package logistics.shipping.messages;

import "google/protobuf/timestamp.proto";

// Shipping manifest information
message ShippingManifest {
  string manifest_id = 1;                     // Unique manifest identifier
  string carrier_id = 2;                      // Carrier identifier
  string route_id = 3;                        // Route identifier
  string vehicle_id = 4;                      // Vehicle identifier
  string driver_id = 5;                        // Driver identifier
  
  // Manifest details
  ManifestType manifest_type = 6;              // Type of manifest
  string manifest_number = 7;                 // Manifest reference number
  string origin_depot = 8;                     // Origin depot/location
  string destination_depot = 9;                // Destination depot/location
  
  // Shipment information
  repeated string shipment_ids = 10;          // List of shipment IDs
  int32 total_shipments = 11;                 // Total number of shipments
  double total_weight_kg = 12;                 // Total weight in kg
  double total_volume_cubic_m = 13;           // Total volume in cubic meters
  int32 total_packages = 14;                   // Total number of packages
  
  // Route and timing
  string route_description = 15;              // Route description
  double estimated_distance_km = 16;          // Estimated distance
  int32 estimated_duration_minutes = 17;      // Estimated duration
  google.protobuf.Timestamp scheduled_departure = 18; // Scheduled departure time
  google.protobuf.Timestamp scheduled_arrival = 19;  // Scheduled arrival time
  google.protobuf.Timestamp actual_departure = 20;    // Actual departure time
  google.protobuf.Timestamp actual_arrival = 21;      // Actual arrival time
  
  // Status and validation
  ManifestStatus status = 22;                 // Manifest status
  bool is_validated = 23;                     // Validation status
  string validation_notes = 24;               // Validation comments
  string validated_by = 25;                    // Validator ID
  
  // Timestamps
  google.protobuf.Timestamp created_at = 26;   // Manifest creation time
  google.protobuf.Timestamp last_updated = 27; // Last update time
  
  // Additional information
  string created_by = 28;                     // Creator ID
  string notes = 29;                          // Additional notes
  map<string, string> metadata = 30;          // Additional metadata
}

// Types of shipping manifests
enum ManifestType {
  MANIFEST_TYPE_UNSPECIFIED = 0;
  MANIFEST_TYPE_PICKUP = 1;                   // Pickup manifest
  MANIFEST_TYPE_DELIVERY = 2;                  // Delivery manifest
  MANIFEST_TYPE_TRANSFER = 3;                 // Transfer manifest
  MANIFEST_TYPE_RETURN = 4;                    // Return manifest
  MANIFEST_TYPE_INTERNATIONAL = 5;            // International manifest
  MANIFEST_TYPE_HAZARDOUS = 6;                // Hazardous materials manifest
  MANIFEST_TYPE_TEMPERATURE_CONTROLLED = 7;   // Temperature controlled manifest
}

// Manifest status enumeration
enum ManifestStatus {
  MANIFEST_STATUS_UNSPECIFIED = 0;
  MANIFEST_STATUS_DRAFT = 1;                  // Draft manifest
  MANIFEST_STATUS_PENDING = 2;                // Pending validation
  MANIFEST_STATUS_VALIDATED = 3;              // Validated and ready
  MANIFEST_STATUS_IN_PROGRESS = 4;            // Currently in progress
  MANIFEST_STATUS_COMPLETED = 5;              // Completed successfully
  MANIFEST_STATUS_CANCELLED = 6;              // Cancelled
  MANIFEST_STATUS_EXCEPTION = 7;               // Exception occurred
}
