syntax = "proto3";

package logistics.shipping.messages;

import "google/protobuf/timestamp.proto";
import "logistics/shipping/enums/shipping_method.proto";
import "logistics/shipping/enums/shipping_status.proto";
import "logistics/shipping/enums/shipping_priority.proto";
import "logistics/shipping/enums/shipping_incoterms.proto";

// Shipment information
message Shipment {
  string shipment_id = 1;                     // Unique shipment identifier
  string tracking_number = 2;                 // Public tracking number
  string order_id = 3;                        // Associated order ID
  
  // Shipping details
  logistics.shipping.enums.ShippingMethod shipping_method = 4;
  logistics.shipping.enums.ShippingStatus status = 5;
  logistics.shipping.enums.ShippingPriority priority = 6;
  logistics.shipping.enums.ShippingIncoterms incoterms = 7;
  
  // Origin and destination
  Address origin = 8;                          // Origin address
  Address destination = 9;                     // Destination address
  
  // Package information
  repeated Package packages = 10;             // Package details
  double total_weight_kg = 11;                // Total weight in kg
  double total_volume_cubic_m = 12;           // Total volume in cubic meters
  int32 total_pieces = 13;                    // Total number of pieces
  
  // Service information
  string service_type = 14;                   // Service type (standard, express, etc.)
  bool signature_required = 15;                // Signature required for delivery
  bool insurance_required = 16;               // Insurance coverage required
  double declared_value = 17;                 // Declared value for insurance
  string currency_code = 18;                  // Currency code (ISO 4217)
  
  // Special handling
  bool fragile = 19;                          // Fragile items
  bool hazardous = 20;                         // Hazardous materials
  bool temperature_controlled = 21;            // Temperature controlled
  string temperature_range = 22;               // Temperature range (e.g., "2-8°C")
  
  // Timestamps
  google.protobuf.Timestamp created_at = 23;  // Shipment creation time
  google.protobuf.Timestamp pickup_date = 24; // Scheduled pickup date
  google.protobuf.Timestamp delivery_date = 25; // Scheduled delivery date
  google.protobuf.Timestamp actual_pickup = 26; // Actual pickup time
  google.protobuf.Timestamp actual_delivery = 27; // Actual delivery time
  
  // Cost information
  double shipping_cost = 28;                  // Shipping cost
  double insurance_cost = 29;                 // Insurance cost
  double total_cost = 30;                     // Total cost
  
  // Additional information
  string carrier_id = 31;                     // Shipping carrier ID
  string carrier_service = 32;                 // Carrier service name
  string notes = 33;                          // Additional notes
  map<string, string> metadata = 34;          // Additional metadata
}

// Address information
message Address {
  string name = 1;                            // Contact name
  string company = 2;                          // Company name
  string address_line_1 = 3;                   // Address line 1
  string address_line_2 = 4;                   // Address line 2
  string city = 5;                            // City
  string state_province = 6;                   // State/Province
  string postal_code = 7;                     // Postal/ZIP code
  string country_code = 8;                     // Country code (ISO 3166-1)
  string phone = 9;                           // Phone number
  string email = 10;                          // Email address
  double latitude = 11;                       // GPS latitude
  double longitude = 12;                      // GPS longitude
}

// Package information
message Package {
  string package_id = 1;                      // Package identifier
  string description = 2;                      // Package description
  double weight_kg = 3;                       // Weight in kg
  double length_cm = 4;                       // Length in cm
  double width_cm = 5;                        // Width in cm
  double height_cm = 6;                       // Height in cm
  double volume_cubic_m = 7;                  // Volume in cubic meters
  string packaging_type = 8;                   // Type of packaging
  double declared_value = 9;                 // Declared value
  string currency_code = 10;                  // Currency code
  bool fragile = 11;                          // Fragile indicator
  bool hazardous = 12;                        // Hazardous materials indicator
  string hazard_class = 13;                    // Hazard class if applicable
  string un_number = 14;                      // UN number for hazardous goods
  map<string, string> metadata = 15;          // Additional package metadata
}
