syntax = "proto3";

package logistics.shipping.enums;

// International Commercial Terms (Incoterms)
enum ShippingIncoterms {
  SHIPPING_INCOTERMS_UNSPECIFIED = 0;
  SHIPPING_INCOTERMS_EXW = 1;                  // Ex Works
  SHIPPING_INCOTERMS_FCA = 2;                  // Free Carrier
  SHIPPING_INCOTERMS_CPT = 3;                  // Carriage Paid To
  SHIPPING_INCOTERMS_CIP = 4;                  // Carriage and Insurance Paid To
  SHIPPING_INCOTERMS_DAP = 5;                  // Delivered at Place
  SHIPPING_INCOTERMS_DPU = 6;                  // Delivered at Place Unloaded
  SHIPPING_INCOTERMS_DDP = 7;                  // Delivered Duty Paid
  SHIPPING_INCOTERMS_FAS = 8;                  // Free Alongside Ship
  SHIPPING_INCOTERMS_FOB = 9;                  // Free on Board
  SHIPPING_INCOTERMS_CFR = 10;                 // Cost and Freight
  SHIPPING_INCOTERMS_CIF = 11;                 // Cost, Insurance and Freight
}
