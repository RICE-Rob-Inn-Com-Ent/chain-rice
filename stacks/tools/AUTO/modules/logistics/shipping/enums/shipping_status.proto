syntax = "proto3";

package logistics.shipping.enums;

// Shipping status enumeration
enum ShippingStatus {
  SHIPPING_STATUS_UNSPECIFIED = 0;
  SHIPPING_STATUS_PENDING = 1;                 // Pending shipment creation
  SHIPPING_STATUS_CREATED = 2;                 // Shipment created
  SHIPPING_STATUS_PICKED_UP = 3;               // Picked up from sender
  SHIPPING_STATUS_IN_TRANSIT = 4;              // In transit to destination
  SHIPPING_STATUS_OUT_FOR_DELIVERY = 5;        // Out for delivery
  SHIPPING_STATUS_DELIVERED = 6;               // Successfully delivered
  SHIPPING_STATUS_DELIVERY_FAILED = 7;         // Delivery failed
  SHIPPING_STATUS_RETURNED = 8;                 // Returned to sender
  SHIPPING_STATUS_EXCEPTION = 9;                // Exception occurred
  SHIPPING_STATUS_DELAYED = 10;                // Delivery delayed
  SHIPPING_STATUS_CANCELLED = 11;              // Shipment cancelled
  SHIPPING_STATUS_ON_HOLD = 12;                // Shipment on hold
  SHIPPING_STATUS_CUSTOMS_CLEARANCE = 13;      // In customs clearance
  SHIPPING_STATUS_DAMAGED = 14;                // Package damaged
  SHIPPING_STATUS_LOST = 15;                   // Package lost
}
