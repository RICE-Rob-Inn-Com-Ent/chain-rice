syntax = "proto3";

package government.citizens.services;

import "google/protobuf/empty.proto";
import "../messages/citizen_models.proto";
import "../messages/citizen_events.proto";

// Сервіс управління громадянами
service CitizenService {
  // Створити нового громадянина
  rpc CreateCitizen(CreateCitizenRequest) returns (CitizenResponse);
  
  // Отримати громадянина за ID
  rpc GetCitizen(GetCitizenRequest) returns (CitizenResponse);
  
  // Оновити інформацію про громадянина
  rpc UpdateCitizen(UpdateCitizenRequest) returns (CitizenResponse);
  
  // Видалити громадянина
  rpc DeleteCitizen(DeleteCitizenRequest) returns (CitizenResponse);
  
  // Пошук громадян
  rpc SearchCitizens(SearchCitizensRequest) returns (CitizenSearchResult);
  
  // Отримати список всіх громадян (з пагінацією)
  rpc ListCitizens(ListCitizensRequest) returns (CitizenSearchResult);
  
  // Змінити статус громадянина
  rpc ChangeCitizenStatus(ChangeCitizenStatusRequest) returns (CitizenResponse);
  
  // Оновити адресу громадянина
  rpc UpdateCitizenAddress(UpdateCitizenAddressRequest) returns (CitizenResponse);
  
  // Оновити контактну інформацію
  rpc UpdateCitizenContact(UpdateCitizenContactRequest) returns (CitizenResponse);
  
  // Отримати статистику громадян
  rpc GetCitizenStatistics(google.protobuf.Empty) returns (CitizenStatistics);
  
  // Перевірити існування громадянина
  rpc CitizenExists(CitizenExistsRequest) returns (CitizenExistsResponse);
}

// Запити та відповіді
message CreateCitizenRequest {
  string first_name = 1;
  string last_name = 2;
  string middle_name = 3;
  string date_of_birth = 4;
  string gender = 5;
  string nationality = 6;
  string citizen_type = 7;
  Address address = 8;
  ContactInfo contact_info = 9;
  string created_by = 10;
}

message GetCitizenRequest {
  string citizen_id = 1;
}

message UpdateCitizenRequest {
  string citizen_id = 1;
  string first_name = 2;
  string last_name = 3;
  string middle_name = 4;
  string gender = 5;
  string nationality = 6;
  string updated_by = 7;
}

message DeleteCitizenRequest {
  string citizen_id = 1;
  string reason = 2;
  string deleted_by = 3;
}

message SearchCitizensRequest {
  CitizenFilter filter = 1;
  int32 page_number = 2;
  int32 page_size = 3;
  string sort_by = 4;
  bool sort_descending = 5;
}

message ListCitizensRequest {
  int32 page_number = 1;
  int32 page_size = 2;
  string sort_by = 3;
  bool sort_descending = 4;
}

message ChangeCitizenStatusRequest {
  string citizen_id = 1;
  string new_status = 2;
  string reason = 3;
  string changed_by = 4;
}

message UpdateCitizenAddressRequest {
  string citizen_id = 1;
  Address new_address = 2;
  string reason = 3;
  string updated_by = 4;
}

message UpdateCitizenContactRequest {
  string citizen_id = 1;
  ContactInfo new_contact_info = 2;
  string updated_by = 3;
}

message CitizenExistsRequest {
  string first_name = 1;
  string last_name = 2;
  string date_of_birth = 3;
}

message CitizenExistsResponse {
  bool exists = 1;
  string citizen_id = 2;
  string message = 3;
}

message CitizenResponse {
  bool success = 1;
  string message = 2;
  Citizen citizen = 3;
  CitizenEvent event = 4;
}

message CitizenStatistics {
  int32 total_citizens = 1;
  int32 active_citizens = 2;
  int32 inactive_citizens = 3;
  int32 deceased_citizens = 4;
  int32 residents = 5;
  int32 non_residents = 6;
  int32 diplomats = 7;
  repeated AgeGroupStatistics age_groups = 8;
  repeated NationalityStatistics nationalities = 9;
}

message AgeGroupStatistics {
  string age_group = 1;
  int32 count = 2;
  double percentage = 3;
}

message NationalityStatistics {
  string nationality = 1;
  int32 count = 2;
  double percentage = 3;
}
