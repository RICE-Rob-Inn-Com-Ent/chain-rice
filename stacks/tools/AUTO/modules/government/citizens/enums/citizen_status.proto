syntax = "proto3";

package government.citizens.enums;

// Статуси громадян
enum CitizenStatus {
  CITIZEN_STATUS_UNSPECIFIED = 0;
  CITIZEN_STATUS_ACTIVE = 1;      // Активний громадянин
  CITIZEN_STATUS_INACTIVE = 2;    // Неактивний громадянин
  CITIZEN_STATUS_DECEASED = 3;    // Померлий громадянин
  CITIZEN_STATUS_SUSPENDED = 4;   // Призупинений статус
  CITIZEN_STATUS_PENDING = 5;     // Очікує активації
}
