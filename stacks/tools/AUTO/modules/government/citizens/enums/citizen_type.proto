syntax = "proto3";

package government.citizens.enums;

// Типи громадян
enum CitizenType {
  CITIZEN_TYPE_UNSPECIFIED = 0;
  CITIZEN_TYPE_RESIDENT = 1;      // Постійний мешканець
  CITIZEN_TYPE_NON_RESIDENT = 2;  // Непостійний мешканець
  CITIZEN_TYPE_DIPLOMAT = 3;      // Дипломат
  CITIZEN_TYPE_REFUGEE = 4;       // Біженець
  CITIZEN_TYPE_ASYLUM_SEEKER = 5; // Шукач притулку
  CITIZEN_TYPE_TOURIST = 6;       // Турист
  CITIZEN_TYPE_STUDENT = 7;       // Студент
  CITIZEN_TYPE_WORKER = 8;        // Працівник
}
