syntax = "proto3";

package government.permits.enums;

// Статуси дозволів
enum PermitStatus {
  PERMIT_STATUS_UNSPECIFIED = 0;
  PERMIT_STATUS_PENDING = 1;        // Очікує розгляду
  PERMIT_STATUS_UNDER_REVIEW = 2;   // На розгляді
  PERMIT_STATUS_APPROVED = 3;       // Затверджено
  PERMIT_STATUS_REJECTED = 4;       // Відхилено
  PERMIT_STATUS_EXPIRED = 5;        // Закінчився термін дії
  PERMIT_STATUS_SUSPENDED = 6;      // Призупинений
  PERMIT_STATUS_REVOKED = 7;        // Анульований
  PERMIT_STATUS_RENEWED = 8;        // Продовжений
  PERMIT_STATUS_AMENDED = 9;        // Внесено зміни
  PERMIT_STATUS_CANCELLED = 10;     // Скасований заявником
  PERMIT_STATUS_ACTIVE = 11;        // Активний
}
