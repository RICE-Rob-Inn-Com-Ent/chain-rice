syntax = "proto3";

package government.permits.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "../enums/permit_status.proto";

// Подія дозволу
message PermitEvent {
  string event_id = 1;                      // Унікальний ідентифікатор події
  string permit_id = 2;                     // ID дозволу
  EventType event_type = 3;                 // Тип події
  google.protobuf.Timestamp timestamp = 4;  // Час події
  string description = 5;                   // Опис події
  google.protobuf.Any event_data = 6;       // Додаткові дані події
  string user_id = 7;                       // ID користувача, що виконав дію
  string source_system = 8;                 // Система-джерело події
}

// Типи подій дозволів
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_APPLICATION_SUBMITTED = 1;     // Подано заявку
  EVENT_TYPE_APPLICATION_REVIEWED = 2;      // Розглянуто заявку
  EVENT_TYPE_APPLICATION_APPROVED = 3;      // Заявку затверджено
  EVENT_TYPE_APPLICATION_REJECTED = 4;      // Заявку відхилено
  EVENT_TYPE_PERMIT_ISSUED = 5;             // Дозвіл видано
  EVENT_TYPE_PERMIT_RENEWED = 6;            // Дозвіл продовжено
  EVENT_TYPE_PERMIT_SUSPENDED = 7;          // Дозвіл призупинено
  EVENT_TYPE_PERMIT_REVOKED = 8;            // Дозвіл анульовано
  EVENT_TYPE_PERMIT_EXPIRED = 9;            // Дозвіл закінчився
  EVENT_TYPE_DOCUMENT_UPDATED = 10;         // Оновлено документ
  EVENT_TYPE_STATUS_CHANGED = 11;           // Змінено статус
  EVENT_TYPE_PRIORITY_CHANGED = 12;         // Змінено пріоритет
  EVENT_TYPE_NOTIFICATION_SENT = 13;        // Відправлено повідомлення
  EVENT_TYPE_REMINDER_SENT = 14;            // Відправлено нагадування
  EVENT_TYPE_AMENDMENT_REQUESTED = 15;      // Запрошено зміни
  EVENT_TYPE_AMENDMENT_APPROVED = 16;       // Зміни затверджено
  EVENT_TYPE_AUDIT_LOG = 17;                // Аудит
}

// Подія подачі заявки
message ApplicationSubmittedEvent {
  string permit_id = 1;
  string permit_type = 2;
  string applicant_id = 3;
  string application_number = 4;
  string description = 5;
  string location = 6;
}

// Подія розгляду заявки
message ApplicationReviewedEvent {
  string permit_id = 1;
  string reviewer_id = 2;
  string review_comments = 3;
  bool requires_additional_info = 4;
  repeated string missing_documents = 5;
}

// Подія затвердження заявки
message ApplicationApprovedEvent {
  string permit_id = 1;
  string approver_id = 2;
  string approval_comments = 3;
  string permit_number = 4;
  string validity_period = 5;
}

// Подія відхилення заявки
message ApplicationRejectedEvent {
  string permit_id = 1;
  string reviewer_id = 2;
  string rejection_reason = 3;
  string rejection_comments = 4;
  repeated string required_actions = 5;
}

// Подія видачі дозволу
message PermitIssuedEvent {
  string permit_id = 1;
  string permit_number = 2;
  string issued_by = 3;
  string issue_date = 4;
  string expiry_date = 5;
  string permit_conditions = 6;
}

// Подія продовження дозволу
message PermitRenewedEvent {
  string permit_id = 1;
  string old_expiry_date = 2;
  string new_expiry_date = 3;
  string renewed_by = 4;
  string renewal_reason = 5;
}

// Подія призупинення дозволу
message PermitSuspendedEvent {
  string permit_id = 1;
  string suspended_by = 2;
  string suspension_reason = 3;
  string suspension_period = 4;
  repeated string conditions = 5;
}

// Подія анулювання дозволу
message PermitRevokedEvent {
  string permit_id = 1;
  string revoked_by = 2;
  string revocation_reason = 3;
  string revocation_date = 4;
  repeated string violations = 5;
}

// Подія закінчення дії дозволу
message PermitExpiredEvent {
  string permit_id = 1;
  string expiry_date = 2;
  bool auto_renewal_attempted = 3;
  string renewal_status = 4;
}

// Подія зміни статусу
message StatusChangedEvent {
  string permit_id = 1;
  PermitStatus old_status = 2;
  PermitStatus new_status = 3;
  string changed_by = 4;
  string reason = 5;
}

// Подія зміни пріоритету
message PriorityChangedEvent {
  string permit_id = 1;
  string old_priority = 2;
  string new_priority = 3;
  string changed_by = 4;
  string reason = 5;
}

// Подія повідомлення
message NotificationEvent {
  string permit_id = 1;
  string notification_type = 2;
  string recipient = 3;
  string subject = 4;
  string message = 5;
  string delivery_status = 6;
}

// Запит на створення події
message CreatePermitEventRequest {
  string permit_id = 1;
  EventType event_type = 2;
  string description = 3;
  google.protobuf.Any event_data = 4;
  string user_id = 5;
  string source_system = 6;
}

// Результат створення події
message PermitEventResponse {
  bool success = 1;
  string message = 2;
  PermitEvent event = 3;
}

// Запит на отримання подій
message GetPermitEventsRequest {
  string permit_id = 1;
  EventType event_type = 2;
  google.protobuf.Timestamp from_date = 3;
  google.protobuf.Timestamp to_date = 4;
  int32 page_number = 5;
  int32 page_size = 6;
}

// Результат пошуку подій
message PermitEventsResponse {
  repeated PermitEvent events = 1;
  int32 total_count = 2;
  int32 page_number = 3;
  int32 page_size = 4;
}
