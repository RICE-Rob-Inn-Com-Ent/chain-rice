syntax = "proto3";

package government.reporting.enums;

// Статуси звітів
enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  REPORT_STATUS_DRAFT = 1;          // Чернетка
  REPORT_STATUS_IN_PROGRESS = 2;    // В процесі створення
  REPORT_STATUS_SUBMITTED = 3;      // Подано
  REPORT_STATUS_APPROVED = 4;       // Затверджено
  REPORT_STATUS_REJECTED = 5;       // Відхилено
  REPORT_STATUS_PUBLISHED = 6;      // Опубліковано
  REPORT_STATUS_ARCHIVED = 7;       // Архівовано
  REPORT_STATUS_SCHEDULED = 8;      // Заплановано
  REPORT_STATUS_GENERATING = 9;     // Генерується
  REPORT_STATUS_FAILED = 10;        // Помилка генерації
}
