syntax = "proto3";

package government.reporting.services;

import "google/protobuf/empty.proto";
import "../messages/report_models.proto";

// Сервіс управління звітами
service ReportService {
  // Створити новий звіт
  rpc CreateReport(CreateReportRequest) returns (ReportResponse);
  
  // Отримати звіт за ID
  rpc GetReport(GetReportRequest) returns (ReportResponse);
  
  // Оновити звіт
  rpc UpdateReport(UpdateReportRequest) returns (ReportResponse);
  
  // Видалити звіт
  rpc DeleteReport(DeleteReportRequest) returns (ReportResponse);
  
  // Пошук звітів
  rpc SearchReports(SearchReportsRequest) returns (ReportSearchResult);
  
  // Отримати список всіх звітів
  rpc ListReports(ListReportsRequest) returns (ReportSearchResult);
  
  // Отримати статистику звітів
  rpc GetReportStatistics(google.protobuf.Empty) returns (ReportStatistics);
  
  // Генерувати звіт
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);
  
  // Експорт звіту
  rpc ExportReport(ExportReportRequest) returns (ExportReportResponse);
}

// Запити та відповіді
message CreateReportRequest {
  string report_name = 1;
  string report_type = 2;
  string category = 3;
  string description = 4;
  string created_by = 5;
  string from_date = 6;
  string to_date = 7;
  repeated string data_sources = 8;
}

message GetReportRequest {
  string report_id = 1;
}

message UpdateReportRequest {
  string report_id = 1;
  string report_name = 2;
  string description = 3;
  string notes = 4;
  string updated_by = 5;
}

message DeleteReportRequest {
  string report_id = 1;
  string reason = 2;
  string deleted_by = 3;
}

message SearchReportsRequest {
  ReportFilter filter = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message ListReportsRequest {
  int32 page_number = 1;
  int32 page_size = 2;
}

message GenerateReportRequest {
  string report_id = 1;
  string format = 2;
  string generated_by = 3;
}

message ExportReportRequest {
  string report_id = 1;
  string format = 2;
  string exported_by = 3;
}

message ReportResponse {
  bool success = 1;
  string message = 2;
  Report report = 3;
}

message GenerateReportResponse {
  bool success = 1;
  string message = 2;
  string report_url = 3;
  string generated_at = 4;
}

message ExportReportResponse {
  bool success = 1;
  string message = 2;
  string download_url = 3;
  string exported_at = 4;
}
