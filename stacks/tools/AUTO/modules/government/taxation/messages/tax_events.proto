syntax = "proto3";

package government.taxation.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// Подія податку
message TaxEvent {
  string event_id = 1;                      // Унікальний ідентифікатор події
  string tax_record_id = 2;                 // ID податкового запису
  EventType event_type = 3;                 // Тип події
  google.protobuf.Timestamp timestamp = 4;  // Час події
  string description = 5;                   // Опис події
  google.protobuf.Any event_data = 6;       // Додаткові дані події
  string user_id = 7;                       // ID користувача
  string source_system = 8;                 // Система-джерело
}

// Типи подій податків
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_TAX_ASSESSED = 1;              // Податок нараховано
  EVENT_TYPE_TAX_PAID = 2;                  // Податок сплачено
  EVENT_TYPE_TAX_OVERDUE = 3;               // Податок прострочено
  EVENT_TYPE_PAYMENT_RECEIVED = 4;          // Платіж отримано
  EVENT_TYPE_PAYMENT_FAILED = 5;            // Платіж не вдався
  EVENT_TYPE_TAX_REFUNDED = 6;              // Податок повернуто
  EVENT_TYPE_TAX_WAIVED = 7;                // Податок спрощено
  EVENT_TYPE_PENALTY_APPLIED = 8;           // Застосовано штраф
  EVENT_TYPE_INTEREST_APPLIED = 9;          // Застосовано відсотки
  EVENT_TYPE_STATUS_CHANGED = 10;           // Змінено статус
  EVENT_TYPE_AUDIT_TRIGGERED = 11;          // Запущено аудит
}

// Подія нарахування податку
message TaxAssessedEvent {
  string tax_record_id = 1;
  string taxpayer_id = 2;
  string tax_type = 3;
  double amount = 4;
  string currency = 5;
  string due_date = 6;
  string assessed_by = 7;
}

// Подія сплати податку
message TaxPaidEvent {
  string tax_record_id = 1;
  string payment_id = 2;
  double amount = 3;
  string payment_date = 4;
  string payment_method = 5;
}

// Подія прострочення
message TaxOverdueEvent {
  string tax_record_id = 1;
  string taxpayer_id = 2;
  string due_date = 3;
  double overdue_amount = 4;
  int32 days_overdue = 5;
}

// Запит на створення події
message CreateTaxEventRequest {
  string tax_record_id = 1;
  EventType event_type = 2;
  string description = 3;
  google.protobuf.Any event_data = 4;
  string user_id = 5;
  string source_system = 6;
}

// Результат створення події
message TaxEventResponse {
  bool success = 1;
  string message = 2;
  TaxEvent event = 3;
}
