syntax = "proto3";

package government.taxation.messages;

import "google/protobuf/timestamp.proto";

// Платіж
message Payment {
  string payment_id = 1;                    // Унікальний ідентифікатор платежу
  string tax_record_id = 2;                 // ID податкового запису
  string taxpayer_id = 3;                   // ID платника
  double amount = 4;                        // Сума платежу
  string currency = 5;                      // Валюта
  string payment_method = 6;                // Спосіб оплати
  google.protobuf.Timestamp payment_date = 7; // Дата платежу
  string reference_number = 8;              // Референсний номер
  string bank_reference = 9;                // Банківський референс
  string status = 10;                       // Статус платежу
  string processed_by = 11;                 // Ким оброблено
  google.protobuf.Timestamp processed_at = 12; // Час обробки
  string notes = 13;                        // Примітки
  repeated string attachments = 14;         // Додатки
  string payment_gateway = 15;              // Платіжний шлюз
  string transaction_id = 16;               // ID транзакції
}

// Метод платежу
message PaymentMethod {
  string method_id = 1;
  string name = 2;
  string type = 3;                          // bank_transfer, card, cash, etc.
  bool is_active = 4;
  string description = 5;
  repeated string supported_currencies = 6;
  double processing_fee = 7;
  string processing_time = 8;
}

// Статус платежу
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;               // Очікує обробки
  PAYMENT_STATUS_PROCESSING = 2;            // Обробляється
  PAYMENT_STATUS_COMPLETED = 3;             // Завершено
  PAYMENT_STATUS_FAILED = 4;                // Не вдався
  PAYMENT_STATUS_CANCELLED = 5;             // Скасовано
  PAYMENT_STATUS_REFUNDED = 6;              // Повернуто
  PAYMENT_STATUS_DISPUTED = 7;              // Оскаржено
}

// Фільтр для пошуку платежів
message PaymentFilter {
  string taxpayer_id = 1;
  string tax_record_id = 2;
  string payment_method = 3;
  PaymentStatus status = 4;
  google.protobuf.Timestamp payment_date_from = 5;
  google.protobuf.Timestamp payment_date_to = 6;
  double amount_min = 7;
  double amount_max = 8;
  string reference_number = 9;
}

// Результат пошуку платежів
message PaymentSearchResult {
  repeated Payment payments = 1;
  int32 total_count = 2;
  int32 page_number = 3;
  int32 page_size = 4;
  double total_amount = 5;
}

// Статистика платежів
message PaymentStatistics {
  int32 total_payments = 1;
  double total_amount = 2;
  int32 successful_payments = 3;
  int32 failed_payments = 4;
  double success_rate = 5;
  repeated PaymentMethodStatistics by_method = 6;
  repeated PaymentStatusStatistics by_status = 7;
}

message PaymentMethodStatistics {
  string payment_method = 1;
  int32 count = 2;
  double amount = 3;
  double percentage = 4;
}

message PaymentStatusStatistics {
  PaymentStatus status = 1;
  int32 count = 2;
  double amount = 3;
  double percentage = 4;
}
