syntax = "proto3";

package government.taxation.services;

import "google/protobuf/empty.proto";
import "../messages/tax_record_models.proto";

// Сервіс управління податками
service TaxService {
  // Створити податковий запис
  rpc CreateTaxRecord(CreateTaxRecordRequest) returns (TaxRecordResponse);
  
  // Отримати податковий запис
  rpc GetTaxRecord(GetTaxRecordRequest) returns (TaxRecordResponse);
  
  // Оновити податковий запис
  rpc UpdateTaxRecord(UpdateTaxRecordRequest) returns (TaxRecordResponse);
  
  // Видалити податковий запис
  rpc DeleteTaxRecord(DeleteTaxRecordRequest) returns (TaxRecordResponse);
  
  // Пошук податкових записів
  rpc SearchTaxRecords(SearchTaxRecordsRequest) returns (TaxRecordSearchResult);
  
  // Отримати статистику податків
  rpc GetTaxStatistics(google.protobuf.Empty) returns (TaxStatistics);
  
  // Отримати записи платника
  rpc GetTaxpayerRecords(GetTaxpayerRecordsRequest) returns (TaxRecordSearchResult);
  
  // Оновити статус податку
  rpc UpdateTaxStatus(UpdateTaxStatusRequest) returns (TaxRecordResponse);
}

// Запити та відповіді
message CreateTaxRecordRequest {
  string taxpayer_id = 1;
  string tax_type = 2;
  double amount = 3;
  string currency = 4;
  string due_date = 5;
  string assessment_period = 6;
  string description = 7;
  string assessed_by = 8;
}

message GetTaxRecordRequest {
  string tax_record_id = 1;
}

message UpdateTaxRecordRequest {
  string tax_record_id = 1;
  double amount = 2;
  string description = 3;
  string notes = 4;
  string updated_by = 5;
}

message DeleteTaxRecordRequest {
  string tax_record_id = 1;
  string reason = 2;
  string deleted_by = 3;
}

message SearchTaxRecordsRequest {
  TaxRecordFilter filter = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message GetTaxpayerRecordsRequest {
  string taxpayer_id = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message UpdateTaxStatusRequest {
  string tax_record_id = 1;
  string new_status = 2;
  string reason = 3;
  string updated_by = 4;
}

message TaxRecordResponse {
  bool success = 1;
  string message = 2;
  TaxRecord tax_record = 3;
}
