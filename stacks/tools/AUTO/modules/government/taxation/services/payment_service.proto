syntax = "proto3";

package government.taxation.services;

import "google/protobuf/empty.proto";
import "../messages/tax_payment_models.proto";

// Сервіс управління платежами
service PaymentService {
  // Створити платіж
  rpc CreatePayment(CreatePaymentRequest) returns (PaymentResponse);
  
  // Отримати платіж
  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse);
  
  // Оновити статус платежу
  rpc UpdatePaymentStatus(UpdatePaymentStatusRequest) returns (PaymentResponse);
  
  // Пошук платежів
  rpc SearchPayments(SearchPaymentsRequest) returns (PaymentSearchResult);
  
  // Отримати статистику платежів
  rpc GetPaymentStatistics(google.protobuf.Empty) returns (PaymentStatistics);
  
  // Обробити платіж
  rpc ProcessPayment(ProcessPaymentRequest) returns (PaymentResponse);
  
  // Скасувати платіж
  rpc CancelPayment(CancelPaymentRequest) returns (PaymentResponse);
}

// Запити та відповіді
message CreatePaymentRequest {
  string tax_record_id = 1;
  string taxpayer_id = 2;
  double amount = 3;
  string currency = 4;
  string payment_method = 5;
  string reference_number = 6;
  string notes = 7;
  string created_by = 8;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message UpdatePaymentStatusRequest {
  string payment_id = 1;
  PaymentStatus new_status = 2;
  string reason = 3;
  string updated_by = 4;
}

message SearchPaymentsRequest {
  PaymentFilter filter = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message ProcessPaymentRequest {
  string payment_id = 1;
  string processed_by = 2;
  string transaction_id = 3;
}

message CancelPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  string cancelled_by = 3;
}

message PaymentResponse {
  bool success = 1;
  string message = 2;
  Payment payment = 3;
}
