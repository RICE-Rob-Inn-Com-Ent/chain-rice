syntax = "proto3";

package settings.themes.enums;

// Theme mode enumeration defines the visual appearance mode of the application
enum ThemeMode {
  // Default/unspecified mode
  THEME_MODE_UNSPECIFIED = 0;
  
  // Light theme with bright backgrounds and dark text
  THEME_MODE_LIGHT = 1;
  
  // Dark theme with dark backgrounds and light text
  THEME_MODE_DARK = 2;
  
  // Auto mode that follows system preference
  THEME_MODE_AUTO = 3;
  
  // High contrast mode for accessibility
  THEME_MODE_HIGH_CONTRAST = 4;
  
  // Sepia mode with warm, brownish tones
  THEME_MODE_SEPIA = 5;
  
  // Blue light filter mode to reduce eye strain
  THEME_MODE_BLUE_LIGHT = 6;
  
  // Monochrome mode with grayscale colors
  THEME_MODE_MONOCHROME = 7;
  
  // Colorblind-friendly mode with adjusted colors
  THEME_MODE_COLORBLIND_FRIENDLY = 8;
  
  // Reduced motion mode for accessibility
  THEME_MODE_REDUCED_MOTION = 9;
  
  // Focus mode with minimal distractions
  THEME_MODE_FOCUS = 10;
  
  // Reading mode optimized for text consumption
  THEME_MODE_READING = 11;
  
  // Gaming mode with enhanced visual effects
  THEME_MODE_GAMING = 12;
  
  // Professional mode with business-appropriate styling
  THEME_MODE_PROFESSIONAL = 13;
  
  // Creative mode with vibrant, artistic colors
  THEME_MODE_CREATIVE = 14;
  
  // Night mode with low brightness and warm colors
  THEME_MODE_NIGHT = 15;
  
  // Day mode with high brightness and cool colors
  THEME_MODE_DAY = 16;
}
