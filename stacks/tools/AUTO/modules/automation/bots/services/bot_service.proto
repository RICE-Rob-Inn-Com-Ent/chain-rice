message ListBotsRequest {
  // Page size
  int32 page_size = 1;
  
  // Page token
  string page_token = 2;
  
  // Filter by bot type
  automation.bots.enums.BotType bot_type = 3;
  
  // Filter by status
  automation.bots.enums.BotStatus status = 4;
  
  // Filter by priority
  automation.bots.enums.BotPriority priority = 5;
  
  // Filter by owner
  string owner = 6;
  
  // Filter by environment
  string environment = 7;
  
  // Filter by tags
  repeated string tags = 8;
  
