syntax = "proto3";

package automation.bots.services;

import "automation/bots/messages/bot.proto";
import "automation/bots/messages/bot_task.proto";
import "automation/bots/messages/bot_log.proto";
import "automation/bots/enums/bot_type.proto";
import "automation/bots/enums/bot_status.proto";
import "automation/bots/enums/bot_priority.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// Bot Service
// Provides comprehensive bot management, task execution, and monitoring services
service BotService {
  // Bot Management RPCs
  rpc CreateBot(CreateBotRequest) returns (CreateBotResponse);
  rpc GetBot(GetBotRequest) returns (GetBotResponse);
  rpc UpdateBot(UpdateBotRequest) returns (UpdateBotResponse);
  rpc DeleteBot(DeleteBotRequest) returns (google.protobuf.Empty);
  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  rpc SearchBots(SearchBotsRequest) returns (SearchBotsResponse);
  
  // Bot Control RPCs
  rpc StartBot(StartBotRequest) returns (StartBotResponse);
  rpc StopBot(StopBotRequest) returns (StopBotResponse);
  rpc PauseBot(PauseBotRequest) returns (PauseBotResponse);
  rpc ResumeBot(ResumeBotRequest) returns (ResumeBotResponse);
  rpc RestartBot(RestartBotRequest) returns (RestartBotResponse);
  
  // Bot Status RPCs
  rpc GetBotStatus(GetBotStatusRequest) returns (GetBotStatusResponse);
  rpc GetBotHealth(GetBotHealthRequest) returns (GetBotHealthResponse);
  rpc GetBotMetrics(GetBotMetricsRequest) returns (GetBotMetricsResponse);
  rpc GetBotLogs(GetBotLogsRequest) returns (GetBotLogsResponse);
  
  // Task Management RPCs
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc SearchTasks(SearchTasksRequest) returns (SearchTasksResponse);
  
  // Task Execution RPCs
  rpc ExecuteTask(ExecuteTaskRequest) returns (ExecuteTaskResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
  rpc GetTaskProgress(GetTaskProgressRequest) returns (GetTaskProgressResponse);
  rpc GetTaskLogs(GetTaskLogsRequest) returns (GetTaskLogsResponse);
  
  // Task Scheduling RPCs
  rpc ScheduleTask(ScheduleTaskRequest) returns (ScheduleTaskResponse);
  rpc UnscheduleTask(UnscheduleTaskRequest) returns (UnscheduleTaskResponse);
  rpc GetTaskSchedule(GetTaskScheduleRequest) returns (GetTaskScheduleResponse);
  rpc ListTaskSchedules(ListTaskSchedulesRequest) returns (ListTaskSchedulesResponse);
  
  // Log Management RPCs
  rpc CreateLog(CreateLogRequest) returns (CreateLogResponse);
  rpc GetLog(GetLogRequest) returns (GetLogResponse);
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);
  rpc SearchLogs(SearchLogsRequest) returns (SearchLogsResponse);
  rpc ExportLogs(ExportLogsRequest) returns (ExportLogsResponse);
  rpc GetLogStatistics(GetLogStatisticsRequest) returns (GetLogStatisticsResponse);
  
  // Monitoring RPCs
  rpc GetServiceStatus(google.protobuf.Empty) returns (ServiceStatusResponse);
  rpc GetServiceMetrics(google.protobuf.Empty) returns (ServiceMetricsResponse);
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);
}

// Bot Management Request/Response Messages

message CreateBotRequest {
  // Bot name
  string name = 1;
  
  // Bot description
  string description = 2;
  
  // Bot type
  automation.bots.enums.BotType bot_type = 3;
  
  // Bot priority
  automation.bots.enums.BotPriority priority = 4;
  
  // Bot configuration
  automation.bots.messages.BotConfiguration config = 5;
  
  // Bot capabilities
  automation.bots.messages.BotCapabilities capabilities = 6;
  
  // Bot resources
  automation.bots.messages.BotResources resources = 7;
  
  // Bot schedule
  automation.bots.messages.BotSchedule schedule = 8;
  
  // Bot metadata
  map<string, string> metadata = 9;
  
  // Bot tags
  repeated string tags = 10;
  
  // Bot owner
  string owner = 11;
  
  // Bot environment
  string environment = 12;
}

message CreateBotResponse {
  // Created bot
  automation.bots.messages.Bot bot = 1;
  
  // Response status
  string status = 2;
  
  // Response message
  string message = 3;
}

message GetBotRequest {
  // Bot ID
  string bot_id = 1;
  
  // Include configuration
  bool include_config = 2;
  
  // Include capabilities
  bool include_capabilities = 3;
  
  // Include resources
  bool include_resources = 4;
  
  // Include monitoring
  bool include_monitoring = 5;
}

message GetBotResponse {
  // Bot
  automation.bots.messages.Bot bot = 1;
  
  // Response status
  string status = 2;
  
  // Response message
  string message = 3;
}

message UpdateBotRequest {
