  automation.bots.messages.BotConfiguration config = 4;
  
  // Bot capabilities
  automation.bots.messages.BotCapabilities capabilities = 5;
  
  // Bot resources
  automation.bots.messages.BotResources resources = 6;
  
  // Bot schedule
  automation.bots.messages.BotSchedule schedule = 7;
  
  // Bot metadata
  map<string, string> metadata = 8;
  
  // Bot tags
  repeated string tags = 9;
  
  // Update mask
  repeated string update_mask = 10;
}

message UpdateBotResponse {
  // Updated bot
