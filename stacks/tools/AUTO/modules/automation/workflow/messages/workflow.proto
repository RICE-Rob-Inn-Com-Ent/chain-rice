syntax = "proto3";

package automation.workflow.messages;

import "automation/workflow/enums/workflow_type.proto";
import "automation/workflow/enums/workflow_status.proto";
import "automation/workflow/enums/workflow_step_type.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Workflow message
// Represents a workflow in the automation system
message Workflow {
  // Unique identifier for the workflow
  string id = 1;
  
  // Human-readable name of the workflow
  string name = 2;
  
  // Description of the workflow's purpose and functionality
  string description = 3;
  
  // Version of the workflow
  string version = 4;
  
  // Type of workflow
  automation.workflow.enums.WorkflowType workflow_type = 5;
  
  // Current status of the workflow
  automation.workflow.enums.WorkflowStatus status = 6;
  
  // Workflow configuration
  WorkflowConfiguration config = 7;
  
  // Workflow definition
  WorkflowDefinition definition = 8;
  
  // Workflow steps
  repeated WorkflowStep steps = 9;
  
  // Workflow variables
  map<string, WorkflowVariable> variables = 10;
  
  // Workflow triggers
  repeated WorkflowTrigger triggers = 11;
  
  // Workflow permissions
  WorkflowPermissions permissions = 12;
  
  // Workflow monitoring
  WorkflowMonitoring monitoring = 13;
  
  // Workflow metadata
  map<string, string> metadata = 14;
  
  // Workflow tags
  repeated string tags = 15;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 16;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 17;
  
  // Last execution timestamp
  google.protobuf.Timestamp last_executed_at = 18;
  
  // Workflow owner/creator
  string owner = 19;
  
  // Workflow dependencies
  repeated string dependencies = 20;
  
  // Workflow environment
  string environment = 21;
  
  // Workflow region
  string region = 22;
  
  // Workflow namespace
  string namespace = 23;
}

// Workflow configuration
message WorkflowConfiguration {
  // Configuration type
  string config_type = 1;
  
  // Configuration parameters
  google.protobuf.Struct parameters = 2;
  
  // Environment variables
  map<string, string> environment_variables = 3;
  
  // Configuration files
  repeated ConfigFile config_files = 4;
  
  // Configuration validation
  ConfigValidation validation = 5;
  
  // Configuration version
  string version = 6;
  
  // Configuration checksum
  string checksum = 7;
  
  // Execution settings
  ExecutionSettings execution_settings = 8;
  
  // Resource settings
  ResourceSettings resource_settings = 9;
  
  // Security settings
  SecuritySettings security_settings = 10;
}

// Configuration file
message ConfigFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File content
  string content = 3;
  
  // File type
  string type = 4;
  
  // File encoding
  string encoding = 5;
  
  // File permissions
  string permissions = 6;
}

// Configuration validation
message ConfigValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Validation rule
message ValidationRule {
  // Rule name
  string name = 1;
  
  // Rule type
  string type = 2;
  
  // Rule expression
  string expression = 3;
  
  // Rule parameters
  google.protobuf.Struct parameters = 4;
  
  // Rule severity
  string severity = 5;
}

// Execution settings
message ExecutionSettings {
  // Execution timeout
  int64 timeout_seconds = 1;
  
  // Maximum retries
  int32 max_retries = 2;
  
  // Retry delay
  int64 retry_delay_seconds = 3;
  
  // Execution mode
  string execution_mode = 4;
  
  // Parallel execution
  bool parallel_execution = 5;
  
  // Max parallel steps
  int32 max_parallel_steps = 6;
  
  // Execution priority
  string execution_priority = 7;
  
  // Execution constraints
  ExecutionConstraints constraints = 8;
}

// Execution constraints
message ExecutionConstraints {
  // Maximum execution time
  int64 max_execution_time_seconds = 1;
  
  // Maximum memory usage
  int64 max_memory_usage_bytes = 2;
  
  // Maximum CPU usage
  int32 max_cpu_usage_percentage = 3;
  
  // Maximum network usage
  int64 max_network_usage_bytes = 4;
  
  // Maximum disk usage
  int64 max_disk_usage_bytes = 5;
}

// Resource settings
message ResourceSettings {
  // Resource requirements
  ResourceRequirements requirements = 1;
  
  // Resource allocation
  ResourceAllocation allocation = 2;
  
  // Resource limits
  ResourceLimits limits = 3;
  
  // Resource monitoring
  ResourceMonitoring monitoring = 4;
}

// Resource requirements
message ResourceRequirements {
  // CPU requirements
  string cpu = 1;
  
  // Memory requirements
  string memory = 2;
  
  // Storage requirements
  string storage = 3;
  
  // Network requirements
  string network = 4;
  
  // GPU requirements
  string gpu = 5;
  
  // Additional requirements
  map<string, string> additional = 6;
}

// Resource allocation
message ResourceAllocation {
  // Allocated CPU
  string allocated_cpu = 1;
  
  // Allocated memory
  string allocated_memory = 2;
  
  // Allocated storage
  string allocated_storage = 3;
  
  // Allocated network
  string allocated_network = 4;
  
  // Allocated GPU
  string allocated_gpu = 5;
  
  // Allocation timestamp
  google.protobuf.Timestamp allocated_at = 6;
  
  // Allocation duration
  int64 allocation_duration_seconds = 7;
}

// Resource limits
message ResourceLimits {
  // CPU limit
  string cpu_limit = 1;
  
  // Memory limit
  string memory_limit = 2;
  
  // Storage limit
  string storage_limit = 3;
  
  // Network limit
  string network_limit = 4;
  
  // GPU limit
  string gpu_limit = 5;
  
  // Rate limits
  map<string, int64> rate_limits = 6;
}

// Resource monitoring
message ResourceMonitoring {
  // Monitoring enabled
  bool enabled = 1;
  
  // Monitoring interval
  int32 interval_seconds = 2;
  
  // Monitoring metrics
  repeated string metrics = 3;
  
  // Monitoring alerts
  repeated ResourceAlert alerts = 4;
  
  // Monitoring dashboard
  string dashboard_url = 5;
}

// Resource alert
message ResourceAlert {
  // Alert name
  string name = 1;
  
  // Alert condition
  string condition = 2;
  
  // Alert threshold
  double threshold = 3;
  
  // Alert severity
  string severity = 4;
  
  // Alert enabled
  bool enabled = 5;
}

// Security settings
message SecuritySettings {
  // Security enabled
  bool enabled = 1;
  
  // Security level
  string level = 2;
  
  // Authentication
  Authentication authentication = 3;
  
  // Authorization
  Authorization authorization = 4;
  
  // Encryption
  Encryption encryption = 5;
  
  // Audit logging
  AuditLogging audit_logging = 6;
  
  // Access control
  AccessControl access_control = 7;
  
  // Compliance
  Compliance compliance = 8;
}

// Authentication
message Authentication {
  // Authentication enabled
  bool enabled = 1;
  
  // Authentication method
  string method = 2;
  
  // Authentication parameters
  google.protobuf.Struct parameters = 3;
  
  // Authentication credentials
  map<string, string> credentials = 4;
  
  // Authentication timeout
  int32 timeout_seconds = 5;
}

// Authorization
message Authorization {
  // Authorization enabled
  bool enabled = 1;
  
  // Authorization method
  string method = 2;
  
  // Authorization roles
  repeated string roles = 3;
  
  // Authorization permissions
  repeated string permissions = 4;
  
  // Authorization policies
  repeated string policies = 5;
}

// Encryption
message Encryption {
  // Encryption enabled
  bool enabled = 1;
  
  // Encryption algorithm
  string algorithm = 2;
  
  // Encryption key
  string key = 3;
  
  // Encryption parameters
  google.protobuf.Struct parameters = 4;
  
  // Encryption at rest
  bool at_rest = 5;
  
  // Encryption in transit
  bool in_transit = 6;
}

// Audit logging
message AuditLogging {
  // Audit logging enabled
  bool enabled = 1;
  
  // Audit log level
  string level = 2;
  
  // Audit log destination
  string destination = 3;
  
  // Audit log format
  string format = 4;
  
  // Audit log retention
  int32 retention_days = 5;
}

// Access control
message AccessControl {
  // Access control enabled
  bool enabled = 1;
  
  // Access control method
  string method = 2;
  
  // Access control rules
  repeated AccessRule rules = 3;
  
  // Access control policies
  repeated string policies = 4;
}

// Access rule
message AccessRule {
  // Rule name
  string name = 1;
  
  // Rule type
  string type = 2;
  
  // Rule condition
  string condition = 3;
  
  // Rule action
  string action = 4;
  
  // Rule priority
  int32 priority = 5;
}

// Compliance
message Compliance {
  // Compliance enabled
  bool enabled = 1;
  
  // Compliance standards
  repeated string standards = 2;
  
  // Compliance requirements
  repeated string requirements = 3;
  
  // Compliance policies
  repeated string policies = 4;
  
  // Compliance monitoring
  bool monitoring = 5;
}

// Workflow definition
message WorkflowDefinition {
  // Definition type
  string definition_type = 1;
  
  // Definition content
  string content = 2;
  
  // Definition format
  string format = 3;
  
  // Definition schema
  string schema = 4;
  
  // Definition version
  string version = 5;
  
  // Definition metadata
  map<string, string> metadata = 6;
}

// Workflow step
message WorkflowStep {
  // Step ID
  string id = 1;
  
  // Step name
  string name = 2;
  
  // Step description
  string description = 3;
  
  // Step type
  automation.workflow.enums.WorkflowStepType step_type = 4;
  
  // Step order
  int32 order = 5;
  
  // Step configuration
  StepConfiguration config = 6;
  
  // Step input
  StepInput input = 7;
  
  // Step output
  StepOutput output = 8;
  
  // Step conditions
  repeated StepCondition conditions = 9;
  
  // Step dependencies
  repeated string dependencies = 10;
  
  // Step timeout
  int64 timeout_seconds = 11;
  
  // Step retry
  StepRetry retry = 12;
  
  // Step error handling
  StepErrorHandling error_handling = 13;
  
  // Step metadata
  map<string, string> metadata = 14;
}

// Step configuration
message StepConfiguration {
  // Configuration type
  string config_type = 1;
  
  // Configuration parameters
  google.protobuf.Struct parameters = 2;
  
  // Configuration validation
  bool validation_enabled = 3;
  
  // Configuration version
  string version = 4;
}

// Step input
message StepInput {
  // Input type
  string input_type = 1;
  
  // Input data
  google.protobuf.Struct data = 2;
  
  // Input files
  repeated InputFile files = 3;
  
  // Input parameters
  map<string, string> parameters = 4;
  
  // Input validation
  InputValidation validation = 5;
}

// Input file
message InputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
}

// Input validation
message InputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Step output
message StepOutput {
  // Output type
  string output_type = 1;
  
  // Output data
  google.protobuf.Struct data = 2;
  
  // Output files
  repeated OutputFile files = 3;
  
  // Output parameters
  map<string, string> parameters = 4;
  
  // Output validation
  OutputValidation validation = 5;
}

// Output file
message OutputFile {
  // File name
  string name = 1;
  
  // File path
  string path = 2;
  
  // File URL
  string url = 3;
  
  // File content
  bytes content = 4;
  
  // File type
  string type = 5;
  
  // File size
  int64 size = 6;
  
  // File checksum
  string checksum = 7;
  
  // File metadata
  map<string, string> metadata = 8;
}

// Output validation
message OutputValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Step condition
message StepCondition {
  // Condition name
  string name = 1;
  
  // Condition type
  string type = 2;
  
  // Condition expression
  string expression = 3;
  
  // Condition parameters
  google.protobuf.Struct parameters = 4;
  
  // Condition enabled
  bool enabled = 5;
}

// Step retry
message StepRetry {
  // Retry enabled
  bool enabled = 1;
  
  // Maximum retry attempts
  int32 max_attempts = 2;
  
  // Retry delay in seconds
  int64 delay_seconds = 3;
  
  // Retry backoff strategy
  string backoff_strategy = 4;
  
  // Retry conditions
  repeated string conditions = 5;
  
  // Retry parameters
  google.protobuf.Struct parameters = 6;
}

// Step error handling
message StepErrorHandling {
  // Error handling enabled
  bool enabled = 1;
  
  // Error handling strategy
  string strategy = 2;
  
  // Error handling actions
  repeated ErrorAction actions = 3;
  
  // Error handling parameters
  google.protobuf.Struct parameters = 4;
}

// Error action
message ErrorAction {
  // Action name
  string name = 1;
  
  // Action type
  string type = 2;
  
  // Action parameters
  google.protobuf.Struct parameters = 3;
  
  // Action order
  int32 order = 4;
}

// Workflow variable
message WorkflowVariable {
  // Variable name
  string name = 1;
  
  // Variable type
  string type = 2;
  
  // Variable value
  string value = 3;
  
  // Variable description
  string description = 4;
  
  // Variable scope
  string scope = 5;
  
  // Variable required
  bool required = 6;
  
  // Variable default value
  string default_value = 7;
  
  // Variable validation
  VariableValidation validation = 8;
  
  // Variable metadata
  map<string, string> metadata = 9;
}

// Variable validation
message VariableValidation {
  // Validation enabled
  bool enabled = 1;
  
  // Validation rules
  repeated ValidationRule rules = 2;
  
  // Validation schema
  string schema = 3;
  
  // Validation strict mode
  bool strict_mode = 4;
}

// Workflow trigger
message WorkflowTrigger {
  // Trigger ID
  string id = 1;
  
  // Trigger name
  string name = 2;
  
  // Trigger type
  string type = 3;
  
  // Trigger configuration
  google.protobuf.Struct config = 4;
  
  // Trigger enabled
  bool enabled = 5;
  
  // Trigger priority
  int32 priority = 6;
  
  // Trigger conditions
  repeated TriggerCondition conditions = 7;
  
  // Trigger actions
  repeated TriggerAction actions = 8;
  
  // Trigger metadata
  map<string, string> metadata = 9;
}

// Trigger condition
message TriggerCondition {
  // Condition name
  string name = 1;
  
  // Condition type
  string type = 2;
  
  // Condition expression
  string expression = 3;
  
  // Condition parameters
  google.protobuf.Struct parameters = 4;
  
  // Condition enabled
  bool enabled = 5;
}

// Trigger action
message TriggerAction {
  // Action name
  string name = 1;
  
  // Action type
  string type = 2;
  
  // Action parameters
  google.protobuf.Struct parameters = 3;
  
  // Action order
  int32 order = 4;
}

// Workflow permissions
message WorkflowPermissions {
  // Permissions enabled
  bool enabled = 1;
  
  // Permission level
  string level = 2;
  
  // Permission roles
  repeated string roles = 3;
  
  // Permission users
  repeated string users = 4;
  
  // Permission groups
  repeated string groups = 5;
  
  // Permission policies
  repeated string policies = 6;
  
  // Permission metadata
  map<string, string> metadata = 7;
}

// Workflow monitoring
message WorkflowMonitoring {
  // Monitoring enabled
  bool enabled = 1;
  
  // Monitoring level
  string level = 2;
  
  // Monitoring metrics
  repeated string metrics = 3;
  
  // Monitoring alerts
  repeated MonitoringAlert alerts = 4;
  
  // Monitoring dashboard
  string dashboard_url = 5;
  
  // Monitoring logs
  MonitoringLogs logs = 6;
  
  // Monitoring health checks
  repeated HealthCheck health_checks = 7;
}

// Monitoring alert
message MonitoringAlert {
  // Alert name
  string name = 1;
  
  // Alert type
  string type = 2;
  
  // Alert condition
  string condition = 3;
  
  // Alert threshold
  double threshold = 4;
  
  // Alert severity
  string severity = 5;
  
  // Alert enabled
  bool enabled = 6;
  
  // Alert notification channels
  repeated string notification_channels = 7;
  
  // Alert cooldown
  int64 cooldown_seconds = 8;
}

// Monitoring logs
message MonitoringLogs {
  // Log level
  string level = 1;
  
  // Log retention days
  int32 retention_days = 2;
  
  // Log format
  string format = 3;
  
  // Log destination
  string destination = 4;
  
  // Log rotation
  LogRotation rotation = 5;
}

// Log rotation
message LogRotation {
  // Rotation enabled
  bool enabled = 1;
  
  // Rotation size
  int64 size_mb = 2;
  
  // Rotation frequency
  string frequency = 3;
  
  // Rotation count
  int32 count = 4;
}

// Health check
message HealthCheck {
  // Health check name
  string name = 1;
  
  // Health check type
  string type = 2;
  
  // Health check endpoint
  string endpoint = 3;
  
  // Health check interval
  int32 interval_seconds = 4;
  
  // Health check timeout
  int32 timeout_seconds = 5;
  
  // Health check enabled
  bool enabled = 6;
  
  // Health check parameters
  google.protobuf.Struct parameters = 7;
}
