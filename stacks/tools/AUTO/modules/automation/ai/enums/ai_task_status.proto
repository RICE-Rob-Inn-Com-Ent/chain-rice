syntax = "proto3";

package automation.ai.enums;

// AI Task Status enumeration
// Defines the different states of AI tasks in the automation system
enum AITaskStatus {
  // Unspecified task status
  AI_TASK_STATUS_UNSPECIFIED = 0;
  
  // Initial States
  AI_TASK_STATUS_PENDING = 1;            // Task is queued and waiting to be processed
  AI_TASK_STATUS_SCHEDULED = 2;          // Task is scheduled for future execution
  AI_TASK_STATUS_QUEUED = 3;             // Task is in the processing queue
  
  // Processing States
  AI_TASK_STATUS_RUNNING = 4;            // Task is currently being executed
  AI_TASK_STATUS_PREPROCESSING = 5;      // Task is in data preprocessing phase
  AI_TASK_STATUS_TRAINING = 6;           // Task is training a model
  AI_TASK_STATUS_VALIDATING = 7;         // Task is validating model performance
  AI_TASK_STATUS_PREDICTING = 8;         // Task is making predictions
  AI_TASK_STATUS_POSTPROCESSING = 9;     // Task is in post-processing phase
  
  // Completion States
  AI_TASK_STATUS_COMPLETED = 10;         // Task completed successfully
  AI_TASK_STATUS_SUCCEEDED = 11;         // Task succeeded with expected results
  AI_TASK_STATUS_PARTIALLY_COMPLETED = 12; // Task completed with partial results
  
  // Error States
  AI_TASK_STATUS_FAILED = 13;            // Task failed due to an error
  AI_TASK_STATUS_ERROR = 14;             // Task encountered an error
  AI_TASK_STATUS_TIMEOUT = 15;           // Task timed out during execution
  AI_TASK_STATUS_CANCELLED = 16;         // Task was cancelled by user or system
  AI_TASK_STATUS_ABORTED = 17;           // Task was aborted due to system issues
  
  // Retry States
  AI_TASK_STATUS_RETRYING = 18;          // Task is being retried after failure
  AI_TASK_STATUS_RETRY_FAILED = 19;      // Task failed after retry attempts
  
  // Paused States
  AI_TASK_STATUS_PAUSED = 20;            // Task is paused and can be resumed
  AI_TASK_STATUS_SUSPENDED = 21;         // Task is suspended by system
  
  // Resource States
  AI_TASK_STATUS_WAITING_FOR_RESOURCES = 22; // Task is waiting for required resources
  AI_TASK_STATUS_RESOURCE_LIMITED = 23;  // Task is limited by available resources
  
  // Validation States
  AI_TASK_STATUS_VALIDATION_FAILED = 24; // Task failed validation checks
  AI_TASK_STATUS_QUALITY_CHECK_FAILED = 25; // Task failed quality assurance checks
  
  // Deployment States
  AI_TASK_STATUS_DEPLOYING = 26;         // Task is being deployed
  AI_TASK_STATUS_DEPLOYED = 27;          // Task has been successfully deployed
  AI_TASK_STATUS_DEPLOYMENT_FAILED = 28; // Task deployment failed
}
