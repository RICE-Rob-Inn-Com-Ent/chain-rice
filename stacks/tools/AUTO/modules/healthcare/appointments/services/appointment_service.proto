syntax = "proto3";

package healthcare.appointments.services;

import "google/protobuf/empty.proto";
import "../messages/appointment_models.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/appointments/services";

// Appointment service for CRUD operations
service AppointmentService {
  // Create a new appointment
  rpc CreateAppointment(AppointmentRequest) returns (AppointmentResponse);
  
  // Get appointment by ID
  rpc GetAppointment(GetAppointmentRequest) returns (AppointmentResponse);
  
  // Update an existing appointment
  rpc UpdateAppointment(UpdateAppointmentRequest) returns (AppointmentResponse);
  
  // Delete an appointment
  rpc DeleteAppointment(DeleteAppointmentRequest) returns (google.protobuf.Empty);
  
  // List appointments with filtering
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
  
  // Get appointments by patient
  rpc GetAppointmentsByPatient(GetAppointmentsByPatientRequest) returns (ListAppointmentsResponse);
  
  // Get appointments by doctor
  rpc GetAppointmentsByDoctor(GetAppointmentsByDoctorRequest) returns (ListAppointmentsResponse);
  
  // Get appointments by clinic
  rpc GetAppointmentsByClinic(GetAppointmentsByClinicRequest) returns (ListAppointmentsResponse);
}

// Get appointment request
message GetAppointmentRequest {
  string appointment_id = 1;
}

// Update appointment request
message UpdateAppointmentRequest {
  string appointment_id = 1;
  AppointmentRequest appointment = 2;
}

// Delete appointment request
message DeleteAppointmentRequest {
  string appointment_id = 1;
  string reason = 2;
}

// Get appointments by patient request
message GetAppointmentsByPatientRequest {
  string patient_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get appointments by doctor request
message GetAppointmentsByDoctorRequest {
  string doctor_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get appointments by clinic request
message GetAppointmentsByClinicRequest {
  string clinic_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
