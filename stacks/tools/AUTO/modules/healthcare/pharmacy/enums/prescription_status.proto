syntax = "proto3";

package healthcare.pharmacy.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/pharmacy/enums";

// Prescription status enumeration
enum PrescriptionStatus {
  PRESCRIPTION_STATUS_UNSPECIFIED = 0;
  PRESCRIPTION_STATUS_PENDING = 1;
  PRESCRIPTION_STATUS_APPROVED = 2;
  PRESCRIPTION_STATUS_DISPENSED = 3;
  PRESCRIPTION_STATUS_CANCELED = 4;
  PRESCRIPTION_STATUS_EXPIRED = 5;
  PRESCRIPTION_STATUS_ON_HOLD = 6;
  PRESCRIPTION_STATUS_REJECTED = 7;
  PRESCRIPTION_STATUS_PARTIALLY_FILLED = 8;
  PRESCRIPTION_STATUS_REFILL_REQUESTED = 9;
  PRESCRIPTION_STATUS_REFILL_APPROVED = 10;
  PRESCRIPTION_STATUS_REFILL_DENIED = 11;
}

// Prescription priority enumeration
enum PrescriptionPriority {
  PRESCRIPTION_PRIORITY_UNSPECIFIED = 0;
  PRESCRIPTION_PRIORITY_ROUTINE = 1;
  PRESCRIPTION_PRIORITY_URGENT = 2;
  PRESCRIPTION_PRIORITY_STAT = 3;
  PRESCRIPTION_PRIORITY_EMERGENCY = 4;
}

// Prescription type enumeration
enum PrescriptionType {
  PRESCRIPTION_TYPE_UNSPECIFIED = 0;
  PRESCRIPTION_TYPE_NEW = 1;
  PRESCRIPTION_TYPE_REFILL = 2;
  PRESCRIPTION_TYPE_PARTIAL_FILL = 3;
  PRESCRIPTION_TYPE_EMERGENCY = 4;
  PRESCRIPTION_TYPE_CONTROLLED_SUBSTANCE = 5;
  PRESCRIPTION_TYPE_COMPOUNDED = 6;
  PRESCRIPTION_TYPE_SAMPLE = 7;
}
