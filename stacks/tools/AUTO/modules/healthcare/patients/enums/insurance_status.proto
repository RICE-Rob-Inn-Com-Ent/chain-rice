syntax = "proto3";

package healthcare.patients.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/patients/enums";

// Insurance status enumeration
enum InsuranceStatus {
  INSURANCE_STATUS_UNSPECIFIED = 0;
  INSURANCE_STATUS_INSURED = 1;
  INSURANCE_STATUS_UNINSURED = 2;
  INSURANCE_STATUS_PENDING = 3;
  INSURANCE_STATUS_EXPIRED = 4;
  INSURANCE_STATUS_SUSPENDED = 5;
  INSURANCE_STATUS_DENIED = 6;
  INSURANCE_STATUS_PARTIAL_COVERAGE = 7;
  INSURANCE_STATUS_SELF_PAY = 8;
}

// Insurance type enumeration
enum InsuranceType {
  INSURANCE_TYPE_UNSPECIFIED = 0;
  INSURANCE_TYPE_PRIVATE = 1;
  INSURANCE_TYPE_PUBLIC = 2;
  INSURANCE_TYPE_EMPLOYER = 3;
  INSURANCE_TYPE_MEDICARE = 4;
  INSURANCE_TYPE_MEDICAID = 5;
  INSURANCE_TYPE_MILITARY = 6;
  INSURANCE_TYPE_WORKERS_COMPENSATION = 7;
  INSURANCE_TYPE_AUTO_INSURANCE = 8;
  INSURANCE_TYPE_DISABILITY = 9;
}
