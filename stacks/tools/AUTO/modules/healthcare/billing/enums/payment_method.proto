syntax = "proto3";

package healthcare.billing.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/billing/enums";

// Payment method enumeration
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CASH = 1;
  PAYMENT_METHOD_CARD = 2;
  PAYMENT_METHOD_INSURANCE = 3;
  PAYMENT_METHOD_ONLINE = 4;
  PAYMENT_METHOD_CHECK = 5;
  PAYMENT_METHOD_BANK_TRANSFER = 6;
  PAYMENT_METHOD_MOBILE_PAYMENT = 7;
  PAYMENT_METHOD_CRYPTOCURRENCY = 8;
  PAYMENT_METHOD_PAYMENT_PLAN = 9;
  PAYMENT_METHOD_CREDIT = 10;
}
