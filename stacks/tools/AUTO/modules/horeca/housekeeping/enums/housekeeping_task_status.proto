syntax = "proto3";

package horeca.housekeeping.enums;

// Status of housekeeping tasks
enum HousekeepingTaskStatus {
  HOUSEKEEPING_TASK_STATUS_UNSPECIFIED = 0;
  HOUSEKEEPING_TASK_STATUS_PENDING = 1;   // Task assigned but not started
  HOUSEKEEPING_TASK_STATUS_IN_PROGRESS = 2; // Task currently being worked on
  HOUSEKEEPING_TASK_STATUS_COMPLETED = 3;  // Task completed successfully
  HOUSEKEEPING_TASK_STATUS_FAILED = 4;     // Task failed or incomplete
  HOUSEKEEPING_TASK_STATUS_CANCELED = 5;   // Task canceled
  HOUSEKEEPING_TASK_STATUS_OVERDUE = 6;    // Task past due time
  HOUSEKEEPING_TASK_STATUS_QUALITY_CHECK = 7; // Task pending quality check
}
