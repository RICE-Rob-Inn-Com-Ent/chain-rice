syntax = "proto3";

package horeca.housekeeping.messages;

import "google/protobuf/timestamp.proto";
import "../enums/housekeeping_task_status.proto";

// Housekeeping event log entry
message HousekeepingEventLog {
  string log_id = 1;
  string task_id = 2;
  string room_number = 3;
  string event_type = 4;
  string description = 5;
  
  HousekeepingTaskStatus old_status = 6;
  HousekeepingTaskStatus new_status = 7;
  
  string staff_id = 8;
  string staff_name = 9;
  
  google.protobuf.Timestamp timestamp = 10;
  string notes = 11;
  map<string, string> metadata = 12;
}

// Event types for housekeeping operations
message HousekeepingEventTypes {
  string TASK_CREATED = "task_created";
  string TASK_ASSIGNED = "task_assigned";
  string TASK_STARTED = "task_started";
  string TASK_COMPLETED = "task_completed";
  string TASK_FAILED = "task_failed";
  string TASK_CANCELED = "task_canceled";
  string ROOM_INSPECTED = "room_inspected";
  string ROOM_APPROVED = "room_approved";
  string ROOM_REJECTED = "room_rejected";
  string STAFF_SHIFT_STARTED = "staff_shift_started";
  string STAFF_SHIFT_ENDED = "staff_shift_ended";
  string QUALITY_CHECK = "quality_check";
  string MAINTENANCE_REQUEST = "maintenance_request";
}
