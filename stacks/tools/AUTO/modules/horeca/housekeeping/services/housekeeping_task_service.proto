syntax = "proto3";

package horeca.housekeeping.services;

import "google/protobuf/empty.proto";
import "../messages/housekeeping_task_models.proto";

// Housekeeping Task Service - Manage housekeeping tasks
service HousekeepingTaskService {
  // Create a new task
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  
  // Get task by ID
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  
  // Update existing task
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  
  // Delete task
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
  
  // List tasks with filtering
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  
  // Assign task to staff
  rpc AssignTask(AssignTaskRequest) returns (AssignTaskResponse);
  
  // Start task
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  
  // Complete task
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  
  // Get tasks by room
  rpc GetTasksByRoom(GetTasksByRoomRequest) returns (GetTasksByRoomResponse);
  
  // Get tasks by staff
  rpc GetTasksByStaff(GetTasksByStaffRequest) returns (GetTasksByStaffResponse);
  
  // Get tasks by status
  rpc GetTasksByStatus(GetTasksByStatusRequest) returns (GetTasksByStatusResponse);
  
  // Create room inspection
  rpc CreateRoomInspection(CreateRoomInspectionRequest) returns (CreateRoomInspectionResponse);
  
  // Get room inspection
  rpc GetRoomInspection(GetRoomInspectionRequest) returns (GetRoomInspectionResponse);
}

// Request/Response messages
message CreateTaskRequest {
  HousekeepingTask task = 1;
}

message CreateTaskResponse {
  HousekeepingTask task = 1;
  string message = 2;
}

message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  HousekeepingTask task = 1;
}

message UpdateTaskRequest {
  HousekeepingTask task = 1;
}

message UpdateTaskResponse {
  HousekeepingTask task = 1;
  string message = 2;
}

message DeleteTaskRequest {
  string task_id = 1;
}

message ListTasksRequest {
  string room_number = 1;
  string staff_id = 2;
  string status = 3;
  string priority = 4;
  string date_from = 5;
  string date_to = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message ListTasksResponse {
  repeated HousekeepingTask tasks = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message AssignTaskRequest {
  string task_id = 1;
  string staff_id = 2;
}

message AssignTaskResponse {
  HousekeepingTask task = 1;
  string message = 2;
}

message StartTaskRequest {
  string task_id = 1;
  string staff_id = 2;
}

message StartTaskResponse {
  HousekeepingTask task = 1;
  string message = 2;
}

message CompleteTaskRequest {
  string task_id = 1;
  string staff_id = 2;
  string completion_notes = 3;
}

message CompleteTaskResponse {
  HousekeepingTask task = 1;
  string message = 2;
}

message GetTasksByRoomRequest {
  string room_number = 1;
  string status = 2;
}

message GetTasksByRoomResponse {
  repeated HousekeepingTask tasks = 1;
}

message GetTasksByStaffRequest {
  string staff_id = 1;
  string status = 2;
  string date = 3;
}

message GetTasksByStaffResponse {
  repeated HousekeepingTask tasks = 1;
}

message GetTasksByStatusRequest {
  string status = 1;
  string date = 2;
}

message GetTasksByStatusResponse {
  repeated HousekeepingTask tasks = 1;
}

message CreateRoomInspectionRequest {
  RoomInspection inspection = 1;
}

message CreateRoomInspectionResponse {
  RoomInspection inspection = 1;
  string message = 2;
}

message GetRoomInspectionRequest {
  string inspection_id = 1;
}

message GetRoomInspectionResponse {
  RoomInspection inspection = 1;
}
