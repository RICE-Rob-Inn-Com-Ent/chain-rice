syntax = "proto3";

package horeca.housekeeping.services;

import "google/protobuf/empty.proto";
import "../messages/housekeeping_staff_models.proto";

// Housekeeping Staff Service - Staff scheduling and management
service HousekeepingStaffService {
  // Create staff member
  rpc CreateStaff(CreateStaffRequest) returns (CreateStaffResponse);
  
  // Get staff by ID
  rpc GetStaff(GetStaffRequest) returns (GetStaffResponse);
  
  // Update staff information
  rpc UpdateStaff(UpdateStaffRequest) returns (UpdateStaffResponse);
  
  // Delete staff member
  rpc DeleteStaff(DeleteStaffRequest) returns (google.protobuf.Empty);
  
  // List all staff
  rpc ListStaff(ListStaffRequest) returns (ListStaffResponse);
  
  // Create staff shift
  rpc CreateShift(CreateShiftRequest) returns (CreateShiftResponse);
  
  // Update shift
  rpc UpdateShift(UpdateShiftRequest) returns (UpdateShiftResponse);
  
  // Get staff shifts
  rpc GetStaffShifts(GetStaffShiftsRequest) returns (GetStaffShiftsResponse);
  
  // Get available staff
  rpc GetAvailableStaff(GetAvailableStaffRequest) returns (GetAvailableStaffResponse);
  
  // Update staff performance
  rpc UpdateStaffPerformance(UpdateStaffPerformanceRequest) returns (UpdateStaffPerformanceResponse);
  
  // Get staff performance
  rpc GetStaffPerformance(GetStaffPerformanceRequest) returns (GetStaffPerformanceResponse);
  
  // Get staff schedule
  rpc GetStaffSchedule(GetStaffScheduleRequest) returns (GetStaffScheduleResponse);
}

// Request/Response messages
message CreateStaffRequest {
  HousekeepingStaff staff = 1;
}

message CreateStaffResponse {
  HousekeepingStaff staff = 1;
  string message = 2;
}

message GetStaffRequest {
  string staff_id = 1;
}

message GetStaffResponse {
  HousekeepingStaff staff = 1;
}

message UpdateStaffRequest {
  HousekeepingStaff staff = 1;
}

message UpdateStaffResponse {
  HousekeepingStaff staff = 1;
  string message = 2;
}

message DeleteStaffRequest {
  string staff_id = 1;
}

message ListStaffRequest {
  string status = 1;
  string role = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListStaffResponse {
  repeated HousekeepingStaff staff = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CreateShiftRequest {
  StaffShift shift = 1;
}

message CreateShiftResponse {
  StaffShift shift = 1;
  string message = 2;
}

message UpdateShiftRequest {
  StaffShift shift = 1;
}

message UpdateShiftResponse {
  StaffShift shift = 1;
  string message = 2;
}

message GetStaffShiftsRequest {
  string staff_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetStaffShiftsResponse {
  repeated StaffShift shifts = 1;
}

message GetAvailableStaffRequest {
  string date = 1;
  string time = 2;
  string role = 3;
}

message GetAvailableStaffResponse {
  repeated HousekeepingStaff staff = 1;
}

message UpdateStaffPerformanceRequest {
  string staff_id = 1;
  StaffPerformance performance = 2;
}

message UpdateStaffPerformanceResponse {
  StaffPerformance performance = 1;
  string message = 2;
}

message GetStaffPerformanceRequest {
  string staff_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetStaffPerformanceResponse {
  StaffPerformance performance = 1;
}

message GetStaffScheduleRequest {
  string staff_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetStaffScheduleResponse {
  repeated StaffShift shifts = 1;
}
