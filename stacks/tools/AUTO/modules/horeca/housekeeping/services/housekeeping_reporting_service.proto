syntax = "proto3";

package horeca.housekeeping.services;

import "google/protobuf/timestamp.proto";

// Housekeeping Reporting Service - Analytics and KPIs
service HousekeepingReportingService {
  // Get task completion report
  rpc GetTaskCompletionReport(GetTaskCompletionReportRequest) returns (GetTaskCompletionReportResponse);
  
  // Get staff performance report
  rpc GetStaffPerformanceReport(GetStaffPerformanceReportRequest) returns (GetStaffPerformanceReportResponse);
  
  // Get room status report
  rpc GetRoomStatusReport(GetRoomStatusReportRequest) returns (GetRoomStatusReportResponse);
  
  // Get quality metrics
  rpc GetQualityMetrics(GetQualityMetricsRequest) returns (GetQualityMetricsResponse);
  
  // Get efficiency metrics
  rpc GetEfficiencyMetrics(GetEfficiencyMetricsRequest) returns (GetEfficiencyMetricsResponse);
  
  // Get cost analysis
  rpc GetCostAnalysis(GetCostAnalysisRequest) returns (GetCostAnalysisResponse);
  
  // Get trend analysis
  rpc GetTrendAnalysis(GetTrendAnalysisRequest) returns (GetTrendAnalysisResponse);
  
  // Get inspection report
  rpc GetInspectionReport(GetInspectionReportRequest) returns (GetInspectionReportResponse);
}

// Request/Response messages
message GetTaskCompletionReportRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string staff_id = 3;
  string room_type = 4;
}

message GetTaskCompletionReportResponse {
  repeated TaskCompletionData completion_data = 1;
  int32 total_tasks = 2;
  int32 completed_tasks = 3;
  double completion_rate = 4;
  double average_completion_time = 5;
}

message GetStaffPerformanceReportRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string staff_id = 3;
}

message GetStaffPerformanceReportResponse {
  repeated StaffPerformanceData performance_data = 1;
  double average_rating = 2;
  double average_completion_time = 3;
  int32 total_tasks_completed = 4;
  double quality_score = 5;
}

message GetRoomStatusReportRequest {
  google.protobuf.Timestamp date = 1;
  string room_type = 2;
}

message GetRoomStatusReportResponse {
  repeated RoomStatusData status_data = 1;
  int32 total_rooms = 2;
  int32 clean_rooms = 3;
  int32 dirty_rooms = 4;
  int32 occupied_rooms = 5;
  double cleanliness_rate = 6;
}

message GetQualityMetricsRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetQualityMetricsResponse {
  repeated QualityMetricsData quality_data = 1;
  double average_quality_score = 2;
  double inspection_pass_rate = 3;
  int32 quality_issues = 4;
  double customer_satisfaction = 5;
}

message GetEfficiencyMetricsRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetEfficiencyMetricsResponse {
  repeated EfficiencyMetricsData efficiency_data = 1;
  double average_task_time = 2;
  double productivity_score = 3;
  double resource_utilization = 4;
  double cost_per_room = 5;
}

message GetCostAnalysisRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetCostAnalysisResponse {
  repeated CostAnalysisData cost_data = 1;
  double total_labor_cost = 2;
  double total_supply_cost = 3;
  double total_equipment_cost = 4;
  double cost_per_room = 5;
  double cost_per_task = 6;
}

message GetTrendAnalysisRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string metric = 3; // completion_rate, quality_score, efficiency, cost
}

message GetTrendAnalysisResponse {
  repeated TrendData trend_data = 1;
  double trend_direction = 2;
  double trend_strength = 3;
  string trend_description = 4;
}

message GetInspectionReportRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string inspector_id = 3;
}

message GetInspectionReportResponse {
  repeated InspectionData inspection_data = 1;
  int32 total_inspections = 2;
  int32 passed_inspections = 3;
  int32 failed_inspections = 4;
  double pass_rate = 5;
  double average_quality_score = 6;
}

// Data structures
message TaskCompletionData {
  google.protobuf.Timestamp date = 1;
  string staff_id = 2;
  string staff_name = 3;
  int32 tasks_assigned = 4;
  int32 tasks_completed = 5;
  double completion_rate = 6;
  double average_completion_time = 7;
}

message StaffPerformanceData {
  string staff_id = 1;
  string staff_name = 2;
  double average_rating = 3;
  int32 total_tasks = 4;
  double average_completion_time = 5;
  double quality_score = 6;
  int32 customer_complaints = 7;
  int32 customer_compliments = 8;
}

message RoomStatusData {
  string room_number = 1;
  string room_type = 2;
  string status = 3;
  string last_cleaned = 4;
  string assigned_staff = 5;
  double quality_score = 6;
}

message QualityMetricsData {
  google.protobuf.Timestamp date = 1;
  double quality_score = 2;
  int32 inspections_passed = 3;
  int32 inspections_failed = 4;
  double pass_rate = 5;
  int32 quality_issues = 6;
}

message EfficiencyMetricsData {
  google.protobuf.Timestamp date = 1;
  double average_task_time = 2;
  double productivity_score = 3;
  double resource_utilization = 4;
  int32 tasks_completed = 5;
  double cost_per_task = 6;
}

message CostAnalysisData {
  google.protobuf.Timestamp date = 1;
  double labor_cost = 2;
  double supply_cost = 3;
  double equipment_cost = 4;
  double total_cost = 5;
  int32 rooms_cleaned = 6;
  double cost_per_room = 7;
}

message TrendData {
  google.protobuf.Timestamp date = 1;
  double value = 2;
}

message InspectionData {
  string inspection_id = 1;
  string room_number = 2;
  string inspector_id = 3;
  string inspector_name = 4;
  google.protobuf.Timestamp inspection_date = 5;
  string status = 6;
  double quality_score = 7;
  int32 issues_found = 8;
}
