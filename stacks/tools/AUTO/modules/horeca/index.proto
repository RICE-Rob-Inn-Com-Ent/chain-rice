// HORECA Module Overview
// This module provides comprehensive business logic for hospitality operations including:
//
// 1. CATERING - Event catering management
//    - Order management and tracking
//    - Menu planning and pricing
//    - Service coordination and analytics
//
// 2. DELIVERY - Food delivery operations
//    - Order processing and tracking
//    - Driver management and logistics
//    - Route optimization and analytics
//
// 3. EVENTS - Event management and hosting
//    - Event planning and coordination
//    - Booking and payment processing
//    - Feedback and reporting
//
// 4. HOUSEKEEPING - Hotel room maintenance
//    - Task management and scheduling
//    - Staff coordination and performance
//    - Quality control and reporting
//
// 5. KITCHEN - Kitchen operations
//    - Order processing and preparation
//    - Inventory management and control
//    - Recipe management and costing
//
// 6. LOYALTY - Customer loyalty programs
//    - Member management and tiers
//    - Rewards catalog and redemption
//    - Analytics and engagement metrics
//
// 7. MENU - Menu management
//    - Item catalog and pricing
//    - Category hierarchy and organization
//    - Dynamic pricing and promotions
//
// 8. POS - Point of sale operations
//    - Transaction processing and payments
//    - Shift management and cash control
//    - Sales analytics and reporting
//
// 9. RESERVATIONS - Reservation management
//    - Booking and scheduling
//    - Guest preferences and history
//    - Occupancy analytics and reporting
//
// Each submodule includes:
// - Enums: Status types, priorities, and classifications
// - Messages: Data models and structures
// - Services: gRPC service definitions with CRUD operations
//
// This comprehensive system enables complete hospitality business management
// with real-time tracking, analytics, and operational efficiency.
