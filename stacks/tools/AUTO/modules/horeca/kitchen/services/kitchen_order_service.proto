syntax = "proto3";

package horeca.kitchen.services;

import "google/protobuf/empty.proto";
import "../messages/kitchen_order_models.proto";

// Kitchen Order Service - Manage kitchen orders
service KitchenOrderService {
  // Create a new kitchen order
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  
  // Get order by ID
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  
  // Update existing order
  rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);
  
  // Delete order
  rpc DeleteOrder(DeleteOrderRequest) returns (google.protobuf.Empty);
  
  // List orders with filtering
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  
  // Update order status
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  
  // Assign order to station
  rpc AssignToStation(AssignToStationRequest) returns (AssignToStationResponse);
  
  // Start order preparation
  rpc StartPreparation(StartPreparationRequest) returns (StartPreparationResponse);
  
  // Complete order preparation
  rpc CompletePreparation(CompletePreparationRequest) returns (CompletePreparationResponse);
  
  // Get orders by station
  rpc GetOrdersByStation(GetOrdersByStationRequest) returns (GetOrdersByStationResponse);
  
  // Get orders by status
  rpc GetOrdersByStatus(GetOrdersByStatusRequest) returns (GetOrdersByStatusResponse);
  
  // Get orders by priority
  rpc GetOrdersByPriority(GetOrdersByPriorityRequest) returns (GetOrdersByPriorityResponse);
}

// Request/Response messages
message CreateOrderRequest {
  KitchenOrder order = 1;
}

message CreateOrderResponse {
  KitchenOrder order = 1;
  string message = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  KitchenOrder order = 1;
}

message UpdateOrderRequest {
  KitchenOrder order = 1;
}

message UpdateOrderResponse {
  KitchenOrder order = 1;
  string message = 2;
}

message DeleteOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  string status = 1;
  string station = 2;
  string chef_id = 3;
  string date_from = 4;
  string date_to = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListOrdersResponse {
  repeated KitchenOrder orders = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  string new_status = 2;
  string notes = 3;
}

message UpdateOrderStatusResponse {
  KitchenOrder order = 1;
  string message = 2;
}

message AssignToStationRequest {
  string order_id = 1;
  string station_id = 2;
  string chef_id = 3;
}

message AssignToStationResponse {
  KitchenOrder order = 1;
  string message = 2;
}

message StartPreparationRequest {
  string order_id = 1;
  string chef_id = 2;
}

message StartPreparationResponse {
  KitchenOrder order = 1;
  string message = 2;
}

message CompletePreparationRequest {
  string order_id = 1;
  string chef_id = 2;
  string completion_notes = 3;
}

message CompletePreparationResponse {
  KitchenOrder order = 1;
  string message = 2;
}

message GetOrdersByStationRequest {
  string station_id = 1;
  string status = 2;
}

message GetOrdersByStationResponse {
  repeated KitchenOrder orders = 1;
}

message GetOrdersByStatusRequest {
  string status = 1;
  string date = 2;
}

message GetOrdersByStatusResponse {
  repeated KitchenOrder orders = 1;
}

message GetOrdersByPriorityRequest {
  string priority = 1;
  string date = 2;
}

message GetOrdersByPriorityResponse {
  repeated KitchenOrder orders = 1;
}
