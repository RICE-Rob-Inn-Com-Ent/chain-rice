syntax = "proto3";

package horeca.catering.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";
import "../enums/catering_order_status.proto";
import "../enums/catering_service_type.proto";
import "../enums/catering_priority.proto";

// Catering order information
message CateringOrder {
  string order_id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  string customer_phone = 5;
  
  CateringServiceType service_type = 6;
  CateringOrderStatus status = 7;
  CateringPriority priority = 8;
  
  google.protobuf.Timestamp event_date = 9;
  google.protobuf.Timestamp event_time = 10;
  string venue_address = 11;
  string venue_name = 12;
  
  int32 guest_count = 13;
  string special_instructions = 14;
  
  google.protobuf.Money total_amount = 15;
  google.protobuf.Money deposit_amount = 16;
  google.protobuf.Money balance_amount = 17;
  
  repeated CateringMenuItem menu_items = 18;
  repeated CateringEquipment equipment = 19;
  
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  google.protobuf.Timestamp confirmed_at = 22;
}

// Individual menu item in catering order
message CateringMenuItem {
  string item_id = 1;
  string item_name = 2;
  string description = 3;
  int32 quantity = 4;
  google.protobuf.Money unit_price = 5;
  google.protobuf.Money total_price = 6;
  repeated string allergens = 7;
  string dietary_restrictions = 8;
}

// Equipment needed for catering event
message CateringEquipment {
  string equipment_id = 1;
  string equipment_name = 2;
  string description = 3;
  int32 quantity = 4;
  google.protobuf.Money rental_cost = 5;
  bool is_included = 6;
}
