syntax = "proto3";

package horeca.catering.enums;

// Priority levels for catering orders
enum CateringPriority {
  CATERING_PRIORITY_UNSPECIFIED = 0;
  CATERING_PRIORITY_NORMAL = 1;           // Standard priority
  CATERING_PRIORITY_HIGH = 2;             // High priority - expedited processing
  CATERING_PRIORITY_VIP = 3;              // VIP priority - premium service
  CATERING_PRIORITY_URGENT = 4;           // Urgent - same day or emergency
  CATERING_PRIORITY_CORPORATE = 5;        // Corporate client priority
}
