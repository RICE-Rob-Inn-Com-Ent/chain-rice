syntax = "proto3";

package horeca.events.enums;

// Types of events hosted
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_WEDDING = 1;                 // Wedding ceremonies and receptions
  EVENT_TYPE_CONFERENCE = 2;              // Business conferences and meetings
  EVENT_TYPE_PARTY = 3;                   // Private parties and celebrations
  EVENT_TYPE_CONCERT = 4;                 // Musical performances
  EVENT_TYPE_CORPORATE = 5;               // Corporate events and galas
  EVENT_TYPE_BIRTHDAY = 6;                // Birthday celebrations
  EVENT_TYPE_ANNIVERSARY = 7;             // Anniversary celebrations
  EVENT_TYPE_HOLIDAY = 8;                 // Holiday parties and events
  EVENT_TYPE_FUNDRAISER = 9;              // Charity and fundraising events
  EVENT_TYPE_TEAM_BUILDING = 10;          // Corporate team building events
  EVENT_TYPE_GRADUATION = 11;             // Graduation ceremonies
  EVENT_TYPE_BABY_SHOWER = 12;            // Baby shower celebrations
  EVENT_TYPE_RETIREMENT = 13;             // Retirement parties
  EVENT_TYPE_REUNION = 14;                // Family or class reunions
}
