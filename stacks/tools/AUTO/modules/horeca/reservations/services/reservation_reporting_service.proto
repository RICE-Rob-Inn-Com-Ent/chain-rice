syntax = "proto3";

package horeca.reservations.services;

import "google/protobuf/timestamp.proto";

// Reservation Reporting Service - Occupancy and booking stats
service ReservationReportingService {
  // Get occupancy report
  rpc GetOccupancyReport(GetOccupancyReportRequest) returns (GetOccupancyReportResponse);
  
  // Get booking statistics
  rpc GetBookingStatistics(GetBookingStatisticsRequest) returns (GetBookingStatisticsResponse);
  
  // Get revenue report
  rpc GetRevenueReport(GetRevenueReportRequest) returns (GetRevenueReportResponse);
  
  // Get customer analytics
  rpc GetCustomerAnalytics(GetCustomerAnalyticsRequest) returns (GetCustomerAnalyticsResponse);
  
  // Get table/room utilization
  rpc GetTableUtilization(GetTableUtilizationRequest) returns (GetTableUtilizationResponse);
  
  // Get cancellation analysis
  rpc GetCancellationAnalysis(GetCancellationAnalysisRequest) returns (GetCancellationAnalysisResponse);
  
  // Get no-show analysis
  rpc GetNoShowAnalysis(GetNoShowAnalysisRequest) returns (GetNoShowAnalysisResponse);
  
  // Get peak hours analysis
  rpc GetPeakHoursAnalysis(GetPeakHoursAnalysisRequest) returns (GetPeakHoursAnalysisResponse);
  
  // Get seasonal trends
  rpc GetSeasonalTrends(GetSeasonalTrendsRequest) returns (GetSeasonalTrendsResponse);
  
  // Get reservation performance metrics
  rpc GetReservationPerformanceMetrics(GetReservationPerformanceMetricsRequest) returns (GetReservationPerformanceMetricsResponse);
}

// Request/Response messages
message GetOccupancyReportRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string type = 3; // table, room, event_space
  string group_by = 4; // day, week, month
}

message GetOccupancyReportResponse {
  repeated OccupancyData occupancy_data = 1;
  double average_occupancy = 2;
  double peak_occupancy = 3;
  double low_occupancy = 4;
  int32 total_capacity = 5;
}

message GetBookingStatisticsRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string type = 3;
}

message GetBookingStatisticsResponse {
  repeated BookingStatisticsData booking_data = 1;
  int32 total_bookings = 2;
  int32 confirmed_bookings = 3;
  int32 canceled_bookings = 4;
  int32 no_show_bookings = 5;
  double confirmation_rate = 6;
  double cancellation_rate = 7;
  double no_show_rate = 8;
}

message GetRevenueReportRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string type = 3;
  string group_by = 4; // day, week, month, type
}

message GetRevenueReportResponse {
  repeated RevenueReportData revenue_data = 1;
  double total_revenue = 2;
  double average_revenue_per_booking = 3;
  double revenue_growth = 4;
}

message GetCustomerAnalyticsRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetCustomerAnalyticsResponse {
  repeated CustomerAnalyticsData customer_data = 1;
  int32 total_customers = 2;
  int32 new_customers = 3;
  int32 returning_customers = 4;
  double customer_retention_rate = 5;
  double average_bookings_per_customer = 6;
}

message GetTableUtilizationRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
  string table_id = 3;
}

message GetTableUtilizationResponse {
  repeated TableUtilizationData utilization_data = 1;
  double average_utilization = 2;
  double peak_utilization = 3;
  string most_popular_table = 4;
  string least_popular_table = 5;
}

message GetCancellationAnalysisRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetCancellationAnalysisResponse {
  repeated CancellationAnalysisData cancellation_data = 1;
  double cancellation_rate = 2;
  string most_common_cancellation_reason = 3;
  double average_cancellation_time_before_booking = 4;
}

message GetNoShowAnalysisRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetNoShowAnalysisResponse {
  repeated NoShowAnalysisData no_show_data = 1;
  double no_show_rate = 2;
  string most_common_no_show_time = 3;
  double average_no_show_frequency = 4;
}

message GetPeakHoursAnalysisRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetPeakHoursAnalysisResponse {
  repeated PeakHoursData peak_hours_data = 1;
  string peak_hour = 2;
  string low_hour = 3;
  double peak_occupancy = 4;
  double low_occupancy = 5;
}

message GetSeasonalTrendsRequest {
  int32 year = 1;
  string metric = 2; // bookings, revenue, occupancy
}

message GetSeasonalTrendsResponse {
  repeated SeasonalTrendsData seasonal_data = 1;
  string peak_season = 2;
  string low_season = 3;
  double seasonal_variation = 4;
}

message GetReservationPerformanceMetricsRequest {
  google.protobuf.Timestamp date_from = 1;
  google.protobuf.Timestamp date_to = 2;
}

message GetReservationPerformanceMetricsResponse {
  ReservationPerformanceMetrics metrics = 1;
}

// Data structures
message OccupancyData {
  google.protobuf.Timestamp date = 1;
  string type = 2;
  double occupancy_percentage = 3;
  int32 bookings = 4;
  int32 capacity = 5;
}

message BookingStatisticsData {
  google.protobuf.Timestamp date = 1;
  string type = 2;
  int32 total_bookings = 3;
  int32 confirmed_bookings = 4;
  int32 canceled_bookings = 5;
  int32 no_show_bookings = 6;
  double confirmation_rate = 7;
}

message RevenueReportData {
  google.protobuf.Timestamp date = 1;
  string type = 2;
  double revenue = 3;
  int32 bookings = 4;
  double average_revenue_per_booking = 5;
}

message CustomerAnalyticsData {
  google.protobuf.Timestamp date = 1;
  int32 total_customers = 2;
  int32 new_customers = 3;
  int32 returning_customers = 4;
  double customer_retention_rate = 5;
}

message TableUtilizationData {
  string table_id = 1;
  string table_name = 2;
  double utilization_percentage = 3;
  int32 bookings = 4;
  double revenue = 5;
}

message CancellationAnalysisData {
  google.protobuf.Timestamp date = 1;
  string reason = 2;
  int32 cancellations = 3;
  double percentage = 4;
  double average_time_before_booking = 5;
}

message NoShowAnalysisData {
  google.protobuf.Timestamp date = 1;
  string time_slot = 2;
  int32 no_shows = 3;
  double percentage = 4;
  double average_frequency = 5;
}

message PeakHoursData {
  int32 hour = 1;
  double occupancy_percentage = 2;
  int32 bookings = 3;
  double revenue = 4;
}

message SeasonalTrendsData {
  string season = 1;
  double value = 2;
  int32 bookings = 3;
  double revenue = 4;
}

message ReservationPerformanceMetrics {
  double overall_occupancy_rate = 1;
  double confirmation_rate = 2;
  double cancellation_rate = 3;
  double no_show_rate = 4;
  double customer_satisfaction = 5;
  double revenue_per_booking = 6;
  double table_turnover_rate = 7;
}
