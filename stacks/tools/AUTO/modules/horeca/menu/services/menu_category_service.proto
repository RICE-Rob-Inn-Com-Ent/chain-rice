syntax = "proto3";

package horeca.menu.services;

import "google/protobuf/empty.proto";
import "../messages/menu_category_models.proto";

// Menu Category Service - Categories and hierarchy management
service MenuCategoryService {
  // Create a new category
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  
  // Get category by ID
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
  
  // Update existing category
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  
  // Delete category
  rpc DeleteCategory(DeleteCategoryRequest) returns (google.protobuf.Empty);
  
  // List all categories
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  
  // Get category hierarchy
  rpc GetCategoryHierarchy(GetCategoryHierarchyRequest) returns (GetCategoryHierarchyResponse);
  
  // Get subcategories
  rpc GetSubcategories(GetSubcategoriesRequest) returns (GetSubcategoriesResponse);
  
  // Update category hierarchy
  rpc UpdateCategoryHierarchy(UpdateCategoryHierarchyRequest) returns (UpdateCategoryHierarchyResponse);
  
  // Get category statistics
  rpc GetCategoryStatistics(GetCategoryStatisticsRequest) returns (GetCategoryStatisticsResponse);
  
  // Search categories
  rpc SearchCategories(SearchCategoriesRequest) returns (SearchCategoriesResponse);
  
  // Reorder categories
  rpc ReorderCategories(ReorderCategoriesRequest) returns (ReorderCategoriesResponse);
}

// Request/Response messages
message CreateCategoryRequest {
  MenuCategory category = 1;
}

message CreateCategoryResponse {
  MenuCategory category = 1;
  string message = 2;
}

message GetCategoryRequest {
  string category_id = 1;
}

message GetCategoryResponse {
  MenuCategory category = 1;
}

message UpdateCategoryRequest {
  MenuCategory category = 1;
}

message UpdateCategoryResponse {
  MenuCategory category = 1;
  string message = 2;
}

message DeleteCategoryRequest {
  string category_id = 1;
}

message ListCategoriesRequest {
  string parent_category_id = 1;
  bool active_only = 2;
  bool featured_only = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListCategoriesResponse {
  repeated MenuCategory categories = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetCategoryHierarchyRequest {
  string root_category_id = 1;
}

message GetCategoryHierarchyResponse {
  MenuCategoryHierarchy hierarchy = 1;
}

message GetSubcategoriesRequest {
  string parent_category_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetSubcategoriesResponse {
  repeated MenuCategory subcategories = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateCategoryHierarchyRequest {
  MenuCategoryHierarchy hierarchy = 1;
}

message UpdateCategoryHierarchyResponse {
  MenuCategoryHierarchy hierarchy = 1;
  string message = 2;
}

message GetCategoryStatisticsRequest {
  string category_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message GetCategoryStatisticsResponse {
  MenuCategoryStatistics statistics = 1;
}

message SearchCategoriesRequest {
  string query = 1;
  string type = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message SearchCategoriesResponse {
  repeated MenuCategory categories = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ReorderCategoriesRequest {
  repeated string category_ids = 1;
}

message ReorderCategoriesResponse {
  string message = 1;
}
