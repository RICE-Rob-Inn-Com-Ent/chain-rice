syntax = "proto3";

package horeca.menu.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";
import "../enums/menu_category.proto";
import "../enums/menu_item_status.proto";
import "../enums/allergen_type.proto";

// Menu item information
message MenuItem {
  string item_id = 1;
  string item_name = 2;
  string description = 3;
  string short_description = 4;
  
  MenuCategory category = 5;
  MenuItemStatus status = 6;
  
  google.protobuf.Money price = 7;
  google.protobuf.Money cost = 8;
  double profit_margin = 9;
  
  int32 prep_time_minutes = 10;
  int32 cook_time_minutes = 11;
  int32 total_time_minutes = 12;
  
  repeated AllergenType allergens = 13;
  repeated string dietary_tags = 14;
  repeated string ingredients = 15;
  
  string recipe_id = 16;
  string image_url = 17;
  repeated string image_gallery = 18;
  
  bool is_popular = 19;
  bool is_featured = 20;
  bool is_seasonal = 21;
  
  int32 popularity_score = 22;
  double average_rating = 23;
  int32 review_count = 24;
  
  MenuItemNutrition nutrition = 25;
  MenuItemAvailability availability = 26;
  
  google.protobuf.Timestamp created_at = 27;
  google.protobuf.Timestamp updated_at = 28;
}

// Menu item nutrition information
message MenuItemNutrition {
  int32 calories = 1;
  double protein_grams = 2;
  double carbohydrates_grams = 3;
  double fat_grams = 4;
  double fiber_grams = 5;
  double sugar_grams = 6;
  double sodium_mg = 7;
  double cholesterol_mg = 8;
  string nutrition_notes = 9;
}

// Menu item availability
message MenuItemAvailability {
  bool is_available = 1;
  repeated string available_days = 2;
  repeated string available_times = 3;
  int32 daily_limit = 4;
  int32 remaining_today = 5;
  google.protobuf.Timestamp last_restocked = 6;
}

// Menu item variant
message MenuItemVariant {
  string variant_id = 1;
  string item_id = 2;
  string variant_name = 3;
  string description = 4;
  
  google.protobuf.Money price_adjustment = 5;
  repeated string additional_ingredients = 6;
  repeated string removed_ingredients = 7;
  
  bool is_default = 8;
  int32 display_order = 9;
}

// Menu item review
message MenuItemReview {
  string review_id = 1;
  string item_id = 2;
  string customer_id = 3;
  string customer_name = 4;
  
  int32 rating = 5;
  string comment = 6;
  repeated string tags = 7;
  
  google.protobuf.Timestamp review_date = 8;
  bool is_verified_purchase = 9;
  bool is_featured = 10;
}
