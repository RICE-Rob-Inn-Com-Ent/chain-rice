syntax = "proto3";

package horeca.menu.enums;

// Menu item categories
enum MenuCategory {
  MENU_CATEGORY_UNSPECIFIED = 0;
  MENU_CATEGORY_FOOD = 1;                 // Main food items
  MENU_CATEGORY_DRINKS = 2;               // Beverages
  MENU_CATEGORY_DESSERTS = 3;             // Desserts and sweets
  MENU_CATEGORY_SPECIALS = 4;             // Special menu items
  MENU_CATEGORY_APPETIZERS = 5;           // Appetizers and starters
  MENU_CATEGORY_SOUPS = 6;                // Soups
  MENU_CATEGORY_SALADS = 7;               // Salads
  MENU_CATEGORY_MAIN_COURSES = 8;         // Main courses
  MENU_CATEGORY_SIDES = 9;                // Side dishes
  MENU_CATEGORY_BREAKFAST = 10;           // Breakfast items
  MENU_CATEGORY_LUNCH = 11;               // Lunch items
  MENU_CATEGORY_DINNER = 12;              // Dinner items
  MENU_CATEGORY_KIDS = 13;                // Kids menu
  MENU_CATEGORY_VEGETARIAN = 14;          // Vegetarian options
  MENU_CATEGORY_VEGAN = 15;               // Vegan options
}
