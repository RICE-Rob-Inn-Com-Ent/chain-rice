syntax = "proto3";

package horeca.menu.enums;

// Status of menu items
enum MenuItemStatus {
  MENU_ITEM_STATUS_UNSPECIFIED = 0;
  MENU_ITEM_STATUS_AVAILABLE = 1;         // Item available for order
  MENU_ITEM_STATUS_OUT_OF_STOCK = 2;      // Item temporarily unavailable
  MENU_ITEM_STATUS_SEASONAL = 3;          // Item available seasonally
  MENU_ITEM_STATUS_DISCONTINUED = 4;      // Item permanently removed
  MENU_ITEM_STATUS_LIMITED = 5;           // Limited availability
  MENU_ITEM_STATUS_PREPARING = 6;         // Item being prepared
  MENU_ITEM_STATUS_SOLD_OUT = 7;          // Item sold out for today
}
