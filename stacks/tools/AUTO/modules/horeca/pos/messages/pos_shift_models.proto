syntax = "proto3";

package horeca.pos.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";

// POS shift information
message PosShift {
  string shift_id = 1;
  string cashier_id = 2;
  string cashier_name = 3;
  string terminal_id = 4;
  
  ShiftStatus status = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  
  google.protobuf.Money starting_cash = 8;
  google.protobuf.Money ending_cash = 9;
  google.protobuf.Money expected_cash = 10;
  google.protobuf.Money cash_difference = 11;
  
  int32 total_transactions = 12;
  google.protobuf.Money total_sales = 13;
  google.protobuf.Money total_refunds = 14;
  google.protobuf.Money total_tips = 15;
  
  repeated PosPaymentMethodSummary payment_summary = 16;
  
  string notes = 17;
  string supervisor_id = 18;
  string supervisor_name = 19;
  
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

// Shift status
enum ShiftStatus {
  SHIFT_STATUS_UNSPECIFIED = 0;
  SHIFT_STATUS_OPEN = 1;
  SHIFT_STATUS_CLOSED = 2;
  SHIFT_STATUS_SUSPENDED = 3;
  SHIFT_STATUS_EMERGENCY_CLOSE = 4;
}

// Payment method summary
message PosPaymentMethodSummary {
  string payment_method = 1;
  int32 transaction_count = 2;
  google.protobuf.Money total_amount = 3;
  google.protobuf.Money refund_amount = 4;
}

// Cash reconciliation
message CashReconciliation {
  string reconciliation_id = 1;
  string shift_id = 2;
  string cashier_id = 3;
  
  ReconciliationStatus status = 4;
  google.protobuf.Timestamp reconciliation_time = 5;
  
  google.protobuf.Money expected_cash = 6;
  google.protobuf.Money actual_cash = 7;
  google.protobuf.Money difference = 8;
  
  repeated CashDenomination denominations = 9;
  
  string supervisor_id = 10;
  string supervisor_name = 11;
  string notes = 12;
  
  google.protobuf.Timestamp created_at = 13;
}

// Reconciliation status
enum ReconciliationStatus {
  RECONCILIATION_STATUS_UNSPECIFIED = 0;
  RECONCILIATION_STATUS_PENDING = 1;
  RECONCILIATION_STATUS_APPROVED = 2;
  RECONCILIATION_STATUS_DISCREPANCY = 3;
  RECONCILIATION_STATUS_RESOLVED = 4;
}

// Cash denomination
message CashDenomination {
  string denomination = 1;
  int32 count = 2;
  google.protobuf.Money total_value = 3;
}
