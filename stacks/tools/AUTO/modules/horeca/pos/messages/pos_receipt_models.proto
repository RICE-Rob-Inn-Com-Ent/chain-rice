syntax = "proto3";

package horeca.pos.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";

// POS receipt information
message PosReceipt {
  string receipt_id = 1;
  string transaction_id = 2;
  string receipt_number = 3;
  
  ReceiptType type = 4;
  ReceiptStatus status = 5;
  
  string business_name = 6;
  string business_address = 7;
  string business_phone = 8;
  string business_email = 9;
  
  string customer_name = 10;
  string customer_email = 11;
  string customer_phone = 12;
  
  google.protobuf.Timestamp transaction_time = 13;
  string cashier_name = 14;
  string terminal_id = 15;
  
  repeated ReceiptItem items = 16;
  
  google.protobuf.Money subtotal = 17;
  google.protobuf.Money tax_amount = 18;
  google.protobuf.Money tip_amount = 19;
  google.protobuf.Money discount_amount = 20;
  google.protobuf.Money total_amount = 21;
  
  repeated ReceiptPayment payments = 22;
  
  string receipt_footer = 23;
  string receipt_header = 24;
  
  string qr_code = 25;
  string barcode = 26;
  
  google.protobuf.Timestamp created_at = 27;
}

// Receipt type
enum ReceiptType {
  RECEIPT_TYPE_UNSPECIFIED = 0;
  RECEIPT_TYPE_SALE = 1;
  RECEIPT_TYPE_REFUND = 2;
  RECEIPT_TYPE_VOID = 3;
  RECEIPT_TYPE_RETURN = 4;
  RECEIPT_TYPE_DUPLICATE = 5;
}

// Receipt status
enum ReceiptStatus {
  RECEIPT_STATUS_UNSPECIFIED = 0;
  RECEIPT_STATUS_GENERATED = 1;
  RECEIPT_STATUS_PRINTED = 2;
  RECEIPT_STATUS_EMAILED = 3;
  RECEIPT_STATUS_SMS_SENT = 4;
  RECEIPT_STATUS_FAILED = 5;
}

// Receipt item
message ReceiptItem {
  string item_id = 1;
  string item_name = 2;
  string description = 3;
  
  int32 quantity = 4;
  google.protobuf.Money unit_price = 5;
  google.protobuf.Money total_price = 6;
  
  double tax_rate = 7;
  google.protobuf.Money tax_amount = 8;
  
  repeated string modifiers = 9;
  string special_instructions = 10;
}

// Receipt payment
message ReceiptPayment {
  string payment_method = 1;
  google.protobuf.Money amount = 2;
  string reference_number = 3;
  string authorization_code = 4;
}

// Receipt template
message ReceiptTemplate {
  string template_id = 1;
  string template_name = 2;
  string description = 3;
  
  TemplateType type = 4;
  bool is_default = 5;
  
  string header_template = 6;
  string footer_template = 7;
  string item_template = 8;
  string payment_template = 9;
  
  repeated string custom_fields = 10;
  
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// Template type
enum TemplateType {
  TEMPLATE_TYPE_UNSPECIFIED = 0;
  TEMPLATE_TYPE_THERMAL = 1;
  TEMPLATE_TYPE_LASER = 2;
  TEMPLATE_TYPE_EMAIL = 3;
  TEMPLATE_TYPE_SMS = 4;
  TEMPLATE_TYPE_DIGITAL = 5;
}
