syntax = "proto3";

package horeca.delivery.enums;

// Priority levels for delivery orders
enum DeliveryPriority {
  DELIVERY_PRIORITY_UNSPECIFIED = 0;
  DELIVERY_PRIORITY_STANDARD = 1;         // Standard delivery time
  DELIVERY_PRIORITY_EXPRESS = 2;          // Faster delivery for premium fee
  DELIVERY_PRIORITY_SAME_DAY = 3;         // Same day delivery
  DELIVERY_PRIORITY_RUSH = 4;             // Rush order - highest priority
  DELIVERY_PRIORITY_SCHEDULED = 5;        // Scheduled delivery for specific time
}
