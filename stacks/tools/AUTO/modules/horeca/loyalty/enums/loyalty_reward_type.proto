syntax = "proto3";

package horeca.loyalty.enums;

// Types of loyalty rewards
enum LoyaltyRewardType {
  LOYALTY_REWARD_TYPE_UNSPECIFIED = 0;
  LOYALTY_REWARD_TYPE_DISCOUNT = 1;       // Percentage or fixed amount discount
  LOYALTY_REWARD_TYPE_FREE_ITEM = 2;      // Free menu item
  LOYALTY_REWARD_TYPE_CASHBACK = 3;       // Cash back reward
  LOYALTY_REWARD_TYPE_POINTS = 4;         // Points reward
  LOYALTY_REWARD_TYPE_UPGRADE = 5;        // Service upgrade
  LOYALTY_REWARD_TYPE_EXPERIENCE = 6;     // Special experience or event
  LOYALTY_REWARD_TYPE_EARLY_ACCESS = 7;   // Early access to new items
  LOYALTY_REWARD_TYPE_BIRTHDAY = 8;       // Birthday special reward
  LOYALTY_REWARD_TYPE_ANNIVERSARY = 9;    // Anniversary reward
}
