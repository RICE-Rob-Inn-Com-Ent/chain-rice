syntax = "proto3";

package horeca.loyalty.messages;

import "google/protobuf/timestamp.proto";
import "../enums/loyalty_tier.proto";
import "../enums/loyalty_status.proto";

// Loyalty program member
message LoyaltyMember {
  string member_id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  string customer_phone = 5;
  
  LoyaltyTier tier = 6;
  LoyaltyStatus status = 7;
  
  int32 current_points = 8;
  int32 lifetime_points = 9;
  int32 points_redeemed = 10;
  
  google.protobuf.Timestamp join_date = 11;
  google.protobuf.Timestamp last_activity = 12;
  google.protobuf.Timestamp tier_upgrade_date = 13;
  
  repeated LoyaltyTransaction transactions = 14;
  repeated LoyaltyReward redeemed_rewards = 15;
  
  MemberPreferences preferences = 16;
  MemberStatistics statistics = 17;
  
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

// Loyalty transaction
message LoyaltyTransaction {
  string transaction_id = 1;
  string member_id = 2;
  string order_id = 3;
  
  TransactionType type = 4;
  int32 points_amount = 5;
  string description = 6;
  
  google.protobuf.Timestamp transaction_date = 7;
  google.protobuf.Timestamp expires_at = 8;
  
  string reference_id = 9; // Order ID, reward ID, etc.
  string notes = 10;
}

// Transaction type
enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_EARNED = 1;
  TRANSACTION_TYPE_REDEEMED = 2;
  TRANSACTION_TYPE_EXPIRED = 3;
  TRANSACTION_TYPE_ADJUSTMENT = 4;
  TRANSACTION_TYPE_BONUS = 5;
}

// Redeemed reward
message LoyaltyReward {
  string reward_id = 1;
  string member_id = 2;
  string reward_name = 3;
  string description = 4;
  int32 points_cost = 5;
  
  RewardStatus status = 6;
  google.protobuf.Timestamp redeemed_date = 7;
  google.protobuf.Timestamp used_date = 8;
  google.protobuf.Timestamp expires_date = 9;
  
  string order_id = 10;
  string notes = 11;
}

// Reward status
enum RewardStatus {
  REWARD_STATUS_UNSPECIFIED = 0;
  REWARD_STATUS_AVAILABLE = 1;
  REWARD_STATUS_REDEEMED = 2;
  REWARD_STATUS_USED = 3;
  REWARD_STATUS_EXPIRED = 4;
  REWARD_STATUS_CANCELED = 5;
}

// Member preferences
message MemberPreferences {
  repeated string favorite_categories = 1;
  repeated string dietary_restrictions = 2;
  string preferred_communication = 3;
  bool email_notifications = 4;
  bool sms_notifications = 5;
  bool birthday_rewards = 6;
  string language_preference = 7;
}

// Member statistics
message MemberStatistics {
  int32 total_visits = 1;
  int32 total_spent = 2;
  double average_order_value = 3;
  int32 favorite_items_count = 4;
  int32 reviews_submitted = 5;
  double average_rating_given = 6;
  google.protobuf.Timestamp last_visit = 7;
}
