syntax = "proto3";

// Message definitions for a Class entity in the Education domain.
package education.classes.messages;

import "google/protobuf/timestamp.proto";
import "AUTO/modules/education/classes/enums/class_type.proto";
import "AUTO/modules/education/classes/enums/class_status.proto";
import "AUTO/modules/education/classes/enums/class_schedule.proto";

option go_package = "github.com/rice-dev/education/classes/messages;classesmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.classes.messages";

// A class represents a scheduled instructional unit within a course.
message Class {
  // Unique identifier for the class.
  string id = 1;

  // Human-readable class name.
  string name = 2;

  // Reference to parent course ID.
  string course_id = 3;

  // Type of the class (lecture, lab, seminar, etc.).
  education.classes.enums.ClassType type = 4;

  // Current lifecycle status of the class.
  education.classes.enums.ClassStatus status = 5;

  // Primary instructor/teacher ID.
  string teacher_id = 6;

  // Optional section code (e.g., A, B) or number.
  string section = 7;

  // Optional location identifier (room or virtual link).
  string location = 8;

  // Schedule definition for this class.
  Schedule schedule = 9;

  // Arbitrary key-value metadata for integrations.
  map<string, string> metadata = 10;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 11;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 12;

  // Soft deletion timestamp if applicable.
  google.protobuf.Timestamp deleted_at = 13;

  // Nested schedule message to express recurrence and timing.
  message Schedule {
    // Recurrence pattern for the class.
    education.classes.enums.RecurrencePattern recurrence = 1;

    // Days of week when the class occurs.
    repeated education.classes.enums.DayOfWeek days = 2;

    // Start time in RFC3339 partial time (HH:MM:SS) format.
    string start_time = 3;

    // End time in RFC3339 partial time (HH:MM:SS) format.
    string end_time = 4;

    // Start date for the schedule.
    google.protobuf.Timestamp start_date = 5;

    // End date for the schedule.
    google.protobuf.Timestamp end_date = 6;
  }
}


