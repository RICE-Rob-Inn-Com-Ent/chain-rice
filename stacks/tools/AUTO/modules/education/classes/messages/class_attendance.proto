syntax = "proto3";

// Message definitions for class attendance tracking.
package education.classes.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/education/classes/messages;classesmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.classes.messages";

// Attendance record for a student in a specific class session.
message ClassAttendance {
  // Unique identifier for the attendance record.
  string id = 1;

  // Reference to the class ID.
  string class_id = 2;

  // Reference to the session ID.
  string session_id = 3;

  // Reference to the student ID.
  string student_id = 4;

  // Attendance status.
  AttendanceStatus status = 5;

  // Optional reason or note for absence/late.
  string note = 6;

  // Arbitrary metadata for extensions.
  map<string, string> metadata = 7;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 8;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 9;

  // Possible attendance statuses.
  enum AttendanceStatus {
    ATTENDANCE_STATUS_UNSPECIFIED = 0; // Unknown
    ATTENDANCE_STATUS_PRESENT = 1;     // Present
    ATTENDANCE_STATUS_ABSENT = 2;      // Absent
    ATTENDANCE_STATUS_LATE = 3;        // Late
    ATTENDANCE_STATUS_EXCUSED = 4;     // Excused absence
    ATTENDANCE_STATUS_REMOTE = 5;      // Attended remotely
  }
}


