syntax = "proto3";

// Scheduling-related enums for classes.
package education.classes.enums;

option go_package = "github.com/rice-dev/education/classes/enums;classesenums";
option java_multiple_files = true;
option java_package = "com.rice.education.classes.enums";

// Day of the week for scheduling.
enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_MONDAY = 1;
  DAY_OF_WEEK_TUESDAY = 2;
  DAY_OF_WEEK_WEDNESDAY = 3;
  DAY_OF_WEEK_THURSDAY = 4;
  DAY_OF_WEEK_FRIDAY = 5;
  DAY_OF_WEEK_SATURDAY = 6;
  DAY_OF_WEEK_SUNDAY = 7;
}

// Recurrence pattern for sessions.
enum RecurrencePattern {
  RECURRENCE_PATTERN_UNSPECIFIED = 0;
  RECURRENCE_PATTERN_ONCE = 1;      // Occurs once only
  RECURRENCE_PATTERN_DAILY = 2;     // Repeats every day
  RECURRENCE_PATTERN_WEEKLY = 3;    // Repeats weekly
  RECURRENCE_PATTERN_BIWEEKLY = 4;  // Repeats every two weeks
  RECURRENCE_PATTERN_MONTHLY = 5;   // Repeats monthly
  RECURRENCE_PATTERN_CUSTOM = 6;    // Custom rule
}


