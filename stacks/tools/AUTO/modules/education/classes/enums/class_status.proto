syntax = "proto3";

// Class Status lifecycle for the Education domain.
package education.classes.enums;

option go_package = "github.com/rice-dev/education/classes/enums;classesenums";
option java_multiple_files = true;
option java_package = "com.rice.education.classes.enums";

// Lifecycle status for a class offering.
enum ClassStatus {
  // Unspecified or unknown status.
  CLASS_STATUS_UNSPECIFIED = 0;

  // Class is created and in planning phase.
  CLASS_STATUS_PLANNED = 1;

  // Class has a schedule defined and will occur in the future.
  CLASS_STATUS_SCHEDULED = 2;

  // Class is currently in progress.
  CLASS_STATUS_ONGOING = 3;

  // Class has concluded successfully.
  CLASS_STATUS_COMPLETED = 4;

  // Class occurrence has been canceled.
  CLASS_STATUS_CANCELLED = 5;

  // Class has been postponed to a later date/time.
  CLASS_STATUS_POSTPONED = 6;

  // Class is archived and no longer active.
  CLASS_STATUS_ARCHIVED = 7;
}


