syntax = "proto3";

// Message definitions for student transcripts.
package education.grading.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/education/grading/messages;gradingmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.grading.messages";

// A transcript summarizes a student's academic record and GPA.
message Transcript {
  // Student ID this transcript belongs to.
  string student_id = 1;

  // Records per term or course.
  repeated TranscriptRecord records = 2;

  // Current cumulative GPA.
  double cumulative_gpa = 3;

  // Generation timestamp.
  google.protobuf.Timestamp generated_at = 4;

  // Per-course or per-term record.
  message TranscriptRecord {
    // Course ID for this record.
    string course_id = 1;

    // Course title snapshot.
    string course_title = 2;

    // Credits earned for the course.
    double credits = 3;

    // Letter grade assigned.
    string letter = 4;

    // GPA points contribution.
    double gpa_points = 5;

    // Term identifier (e.g., 2025-Fall).
    string term = 6;
  }
}


