syntax = "proto3";

// Exam type classifications.
package education.exams.enums;

option go_package = "github.com/rice-dev/education/exams/enums;examsenums";
option java_multiple_files = true;
option java_package = "com.rice.education.exams.enums";

// Types of exams/assessments.
enum ExamType {
  EXAM_TYPE_UNSPECIFIED = 0; // Unknown
  EXAM_TYPE_QUIZ = 1;        // Short assessment
  EXAM_TYPE_MIDTERM = 2;     // Midterm exam
  EXAM_TYPE_FINAL = 3;       // Final exam
  EXAM_TYPE_PROJECT = 4;     // Project-based assessment
  EXAM_TYPE_PRACTICAL = 5;   // Practical/lab assessment
  EXAM_TYPE_ORAL = 6;        // Oral exam
  EXAM_TYPE_TAKE_HOME = 7;   // Take-home exam
}


