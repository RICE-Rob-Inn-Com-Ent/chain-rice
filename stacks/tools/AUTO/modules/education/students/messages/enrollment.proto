syntax = "proto3";

// Message definitions for Enrollment.
package education.students.messages;

import "google/protobuf/timestamp.proto";
import "AUTO/modules/education/students/enums/enrollment_type.proto";

option go_package = "github.com/rice-dev/education/students/messages;studentsmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.students.messages";

// Enrollment connects a student with a course and term.
message Enrollment {
  // Unique identifier for the enrollment.
  string id = 1;

  // Student ID.
  string student_id = 2;

  // Course ID.
  string course_id = 3;

  // Term identifier (e.g., 2025-Fall).
  string term = 4;

  // Enrollment type (full-time, part-time, etc.).
  education.students.enums.EnrollmentType type = 5;

  // Whether enrollment is active.
  bool active = 6;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 7;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 8;
}


