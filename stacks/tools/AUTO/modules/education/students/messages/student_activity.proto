syntax = "proto3";

// Message definitions for Student activities.
package education.students.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/education/students/messages;studentsmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.students.messages";

// A log entry of a student's activity related to coursework.
message StudentActivity {
  // Unique identifier for the activity record.
  string id = 1;

  // Student ID.
  string student_id = 2;

  // Course ID.
  string course_id = 3;

  // Activity type label (e.g., "assignment_submission", "forum_post").
  string type = 4;

  // Descriptive details of the activity.
  string description = 5;

  // Activity timestamp.
  google.protobuf.Timestamp occurred_at = 6;
}


