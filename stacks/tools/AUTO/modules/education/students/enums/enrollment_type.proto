syntax = "proto3";

// Enrollment type classifications.
package education.students.enums;

option go_package = "github.com/rice-dev/education/students/enums;studentsenums";
option java_multiple_files = true;
option java_package = "com.rice.education.students.enums";

// Type of a student's enrollment.
enum EnrollmentType {
  ENROLLMENT_TYPE_UNSPECIFIED = 0; // Unknown
  ENROLLMENT_TYPE_FULL_TIME = 1;   // Full-time
  ENROLLMENT_TYPE_PART_TIME = 2;   // Part-time
  ENROLLMENT_TYPE_EXCHANGE = 3;    // Exchange program
  ENROLLMENT_TYPE_AUDIT = 4;       // Auditing only
  ENROLLMENT_TYPE_NON_DEGREE = 5;  // Non-degree seeking
}


