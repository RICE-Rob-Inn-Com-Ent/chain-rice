syntax = "proto3";

// Message definitions for Course syllabus.
package education.courses.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/education/courses/messages;coursesmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.courses.messages";

// Syllabus describes objectives, outcomes, and schedule overview of a course.
message Syllabus {
  // Course learning objectives.
  repeated string objectives = 1;

  // Expected learning outcomes.
  repeated string outcomes = 2;

  // Required materials or textbooks.
  repeated string required_materials = 3;

  // Grading breakdown description (e.g., Exams 40%, Projects 60%).
  string grading_breakdown = 4;

  // Policy notes (attendance, integrity, late submissions).
  string policies = 5;

  // Version timestamp for the syllabus.
  google.protobuf.Timestamp version_at = 6;
}


