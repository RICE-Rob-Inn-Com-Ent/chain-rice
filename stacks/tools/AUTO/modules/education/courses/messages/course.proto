syntax = "proto3";

// Message definitions for Course entity.
package education.courses.messages;

import "google/protobuf/timestamp.proto";
import "AUTO/modules/education/courses/enums/course_level.proto";
import "AUTO/modules/education/courses/enums/course_category.proto";
import "AUTO/modules/education/courses/enums/course_status.proto";
import "AUTO/modules/education/courses/messages/syllabus.proto";
import "AUTO/modules/education/courses/messages/module.proto";

option go_package = "github.com/rice-dev/education/courses/messages;coursesmessages";
option java_multiple_files = true;
option java_package = "com.rice.education.courses.messages";

// A course groups classes, modules, and syllabus under a single offering.
message Course {
  // Unique identifier for the course.
  string id = 1;

  // Human-readable course name.
  string name = 2;

  // Short, unique course code (e.g., CS101).
  string code = 3;

  // Brief description of the course.
  string description = 4;

  // Category taxonomy label.
  education.courses.enums.CourseCategory category = 5;

  // Difficulty or level tier.
  education.courses.enums.CourseLevel level = 6;

  // Lifecycle status of the course.
  education.courses.enums.CourseStatus status = 7;

  // Syllabus definition for this course.
  Syllabus syllabus = 8;

  // Modules belonging to the course.
  repeated Module modules = 9;

  // IDs of prerequisite courses.
  repeated string prerequisite_course_ids = 10;

  // Owner teacher ID (coordinator).
  string owner_teacher_id = 11;

  // Arbitrary metadata for integrations.
  map<string, string> metadata = 12;

  // Creation timestamp.
  google.protobuf.Timestamp created_at = 13;

  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 14;

  // Optional archive timestamp.
  google.protobuf.Timestamp archived_at = 15;
}


