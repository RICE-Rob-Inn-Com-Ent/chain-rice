syntax = "proto3";

package gaming.play_to_earn.services;

import "gaming/play-to-earn/messages/earning_models.proto";

option go_package = "github.com/rice-dev/gaming/play-to-earn/services";

// Сервіс управління заробітком
service EarningService {
  // Створити заробіток
  rpc CreateEarning(CreateEarningRequest) returns (CreateEarningResponse);
  
  // Отримати заробіток
  rpc GetEarning(GetEarningRequest) returns (GetEarningResponse);
  
  // Оновити заробіток
  rpc UpdateEarning(UpdateEarningRequest) returns (UpdateEarningResponse);
  
  // Видалити заробіток
  rpc DeleteEarning(DeleteEarningRequest) returns (DeleteEarningResponse);
  
  // Отримати список заробітків
  rpc ListEarnings(ListEarningsRequest) returns (ListEarningsResponse);
  
  // Отримати статистику заробітку
  rpc GetEarningStats(GetEarningStatsRequest) returns (GetEarningStatsResponse);
  
  // Розрахувати заробіток
  rpc CalculateEarning(CalculateEarningRequest) returns (CalculateEarningResponse);
  
  // Валідувати заробіток
  rpc ValidateEarning(ValidateEarningRequest) returns (ValidateEarningResponse);
}

