syntax = "proto3";

package gaming.matchmaking.messages;

import "gaming/matchmaking/enums/queue_types.proto";
import "gaming/matchmaking/enums/matching_algorithms.proto";

option go_package = "github.com/rice-dev/gaming/matchmaking/messages";

// Модель черги
message Queue {
  string id = 1;
  string name = 2;
  string description = 3;
  gaming.matchmaking.enums.QueueType type = 4;
  gaming.matchmaking.enums.MatchingAlgorithm algorithm = 5;
  int32 min_players = 6;
  int32 max_players = 7;
  int32 current_players = 8;
  int32 max_queue_size = 9;
  int32 current_queue_size = 10;
  int64 average_wait_time = 11;
  int64 max_wait_time = 12;
  bool is_active = 13;
  bool is_public = 14;
  string game_mode = 15;
  string map = 16;
  string region = 17;
  string server = 18;
  int32 skill_level_min = 19;
  int32 skill_level_max = 20;
  int32 rating_min = 21;
  int32 rating_max = 22;
  int32 level_min = 23;
  int32 level_max = 24;
  string language = 25;
  string platform = 26;
  string timezone = 27;
  int64 created_at = 28;
  int64 updated_at = 29;
  int64 expires_at = 30;
  map<string, string> metadata = 31;
}

