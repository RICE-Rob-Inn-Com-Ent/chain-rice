syntax = "proto3";

package gaming.game_economy.services;

import "gaming/game_economy/messages/wallet_models.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/gaming/game_economy/services";

// Сервіс управління гаманцями
service WalletService {
  // Створити новий гаманець
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  
  // Отримати гаманець за ID
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
  
  // Оновити гаманець
  rpc UpdateWallet(UpdateWalletRequest) returns (UpdateWalletResponse);
  
  // Видалити гаманець
  rpc DeleteWallet(DeleteWalletRequest) returns (google.protobuf.Empty);
  
  // Отримати список гаманців
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse);
  
  // Отримати баланс гаманця
  rpc GetWalletBalance(GetWalletBalanceRequest) returns (GetWalletBalanceResponse);
  
  // Оновити баланс гаманця
  rpc UpdateWalletBalance(UpdateWalletBalanceRequest) returns (UpdateWalletBalanceResponse);
  
  // Отримати налаштування гаманця
  rpc GetWalletSettings(GetWalletSettingsRequest) returns (GetWalletSettingsResponse);
  
  // Оновити налаштування гаманця
  rpc UpdateWalletSettings(UpdateWalletSettingsRequest) returns (UpdateWalletSettingsResponse);
  
  // Отримати безпеку гаманця
  rpc GetWalletSecurity(GetWalletSecurityRequest) returns (GetWalletSecurityResponse);
  
  // Оновити безпеку гаманця
  rpc UpdateWalletSecurity(UpdateWalletSecurityRequest) returns (UpdateWalletSecurityResponse);
  
  // Отримати метадані гаманця
  rpc GetWalletMetadata(GetWalletMetadataRequest) returns (GetWalletMetadataResponse);
  
  // Оновити метадані гаманця
  rpc UpdateWalletMetadata(UpdateWalletMetadataRequest) returns (UpdateWalletMetadataResponse);
  
  // Пошук гаманців
  rpc SearchWallets(SearchWalletsRequest) returns (SearchWalletsResponse);
  
  // Отримати рекомендації гаманців
  rpc GetWalletRecommendations(GetWalletRecommendationsRequest) returns (GetWalletRecommendationsResponse);
  
  // Отримати історію гаманця
  rpc GetWalletHistory(GetWalletHistoryRequest) returns (GetWalletHistoryResponse);
}

// Запит створення гаманця
message CreateWalletRequest {
  // Дані гаманця
  gaming.game_economy.messages.Wallet wallet = 1;
  
  // Додаткові параметри
  map<string, string> parameters = 2;
}

// Відповідь створення гаманця
message CreateWalletResponse {
  // Створений гаманець
  gaming.game_economy.messages.Wallet wallet = 1;
  
  // Статус операції
  string status = 2;
  
  // Повідомлення
  string message = 3;
}

// Запит отримання гаманця
message GetWalletRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
}

// Відповідь отримання гаманця
message GetWalletResponse {
  // Гаманець
  gaming.game_economy.messages.Wallet wallet = 1;
}

// Запит оновлення гаманця
message UpdateWalletRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Дані для оновлення
  gaming.game_economy.messages.Wallet wallet = 2;
  
  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення гаманця
message UpdateWalletResponse {
  // Оновлений гаманець
  gaming.game_economy.messages.Wallet wallet = 1;
  
  // Статус операції
  string status = 2;
  
  // Повідомлення
  string message = 3;
}

// Запит видалення гаманця
message DeleteWalletRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Причина видалення
  string reason = 2;
}

// Запит списку гаманців
message ListWalletsRequest {
  // Фільтри
  WalletFilters filters = 1;
  
  // Пагінація
  Pagination pagination = 2;
  
  // Сортування
  Sorting sorting = 3;
}

// Відповідь списку гаманців
message ListWalletsResponse {
  // Список гаманців
  repeated gaming.game_economy.messages.Wallet wallets = 1;
  
  // Загальна кількість
  int64 total_count = 2;
  
  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Запит балансу гаманця
message GetWalletBalanceRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Фільтри
  BalanceFilters filters = 2;
}

// Відповідь балансу гаманця
message GetWalletBalanceResponse {
  // Баланси гаманця
  repeated gaming.game_economy.messages.CurrencyBalance balances = 1;
  
  // Загальна кількість балансів
  int64 total_count = 2;
}

// Запит оновлення балансу гаманця
message UpdateWalletBalanceRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Дані балансу для оновлення
  gaming.game_economy.messages.CurrencyBalance balance = 2;
  
  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення балансу гаманця
message UpdateWalletBalanceResponse {
  // Оновлений баланс гаманця
  gaming.game_economy.messages.CurrencyBalance balance = 1;
  
  // Статус операції
  string status = 2;
  
  // Повідомлення
  string message = 3;
}

// Запит налаштувань гаманця
message GetWalletSettingsRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
}

// Відповідь налаштувань гаманця
message GetWalletSettingsResponse {
  // Налаштування гаманця
  gaming.game_economy.messages.WalletSettings settings = 1;
}

// Запит оновлення налаштувань гаманця
message UpdateWalletSettingsRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Дані налаштувань для оновлення
  gaming.game_economy.messages.WalletSettings settings = 2;
  
  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення налаштувань гаманця
message UpdateWalletSettingsResponse {
  // Оновлені налаштування гаманця
  gaming.game_economy.messages.WalletSettings settings = 1;
  
  // Статус операції
  string status = 2;
  
  // Повідомлення
  string message = 3;
}

// Запит безпеки гаманця
message GetWalletSecurityRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
}

// Відповідь безпеки гаманця
message GetWalletSecurityResponse {
  // Безпека гаманця
  gaming.game_economy.messages.WalletSecurity security = 1;
}

// Запит оновлення безпеки гаманця
message UpdateWalletSecurityRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Дані безпеки для оновлення
  gaming.game_economy.messages.WalletSecurity security = 2;
  
  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення безпеки гаманця
message UpdateWalletSecurityResponse {
  // Оновлена безпека гаманця
  gaming.game_economy.messages.WalletSecurity security = 1;
  
  // Статус операції
  string status = 2;
  
  // Повідомлення
  string message = 3;
}

// Запит метаданих гаманця
message GetWalletMetadataRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
}

// Відповідь метаданих гаманця
message GetWalletMetadataResponse {
  // Метадані гаманця
  gaming.game_economy.messages.WalletMetadata metadata = 1;
}

// Запит оновлення метаданих гаманця
message UpdateWalletMetadataRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Дані метаданих для оновлення
  gaming.game_economy.messages.WalletMetadata metadata = 2;
  
  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення метаданих гаманця
message UpdateWalletMetadataResponse {
  // Оновлені метадані гаманця
  gaming.game_economy.messages.WalletMetadata metadata = 1;
  
  // Статус операції
  string status = 2;
  
  // Повідомлення
  string message = 3;
}

// Запит пошуку гаманців
message SearchWalletsRequest {
  // Пошуковий запит
  string query = 1;
  
  // Фільтри
  WalletFilters filters = 2;
  
  // Пагінація
  Pagination pagination = 3;
  
  // Сортування
  Sorting sorting = 4;
}

// Відповідь пошуку гаманців
message SearchWalletsResponse {
  // Список знайдених гаманців
  repeated gaming.game_economy.messages.Wallet wallets = 1;
  
  // Загальна кількість результатів
  int64 total_count = 2;
  
  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
  
  // Час пошуку (в мілісекундах)
  int64 search_time_ms = 4;
}

// Запит рекомендацій гаманців
message GetWalletRecommendationsRequest {
  // Ідентифікатор користувача
  string user_id = 1;
  
  // Кількість рекомендацій
  int32 limit = 2;
  
  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь рекомендацій гаманців
message GetWalletRecommendationsResponse {
  // Список рекомендованих гаманців
  repeated gaming.game_economy.messages.Wallet recommended_wallets = 1;
  
  // Загальна кількість рекомендацій
  int64 total_count = 2;
  
  // Додаткові дані рекомендацій
  map<string, string> recommendation_data = 3;
}

// Запит історії гаманця
message GetWalletHistoryRequest {
  // Ідентифікатор гаманця
  string wallet_id = 1;
  
  // Фільтри
  WalletHistoryFilters filters = 2;
  
  // Пагінація
  Pagination pagination = 3;
}

// Відповідь історії гаманця
message GetWalletHistoryResponse {
  // Список записів історії
  repeated gaming.game_economy.messages.Transaction history_transactions = 1;
  
  // Загальна кількість записів
  int64 total_count = 2;
  
  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Фільтри гаманців
message WalletFilters {
  // Тип гаманця
  repeated gaming.game_economy.enums.WalletType wallet_types = 1;
  
  // Статус гаманця
  repeated gaming.game_economy.enums.WalletStatus statuses = 2;
  
  // Власник гаманця
  string owner_id = 3;
  
  // Теги гаманця
  repeated string tags = 4;
  
  // Мова гаманця
  string language = 5;
  
  // Мінімальний рейтинг
  double min_rating = 6;
  
  // Максимальний рейтинг
  double max_rating = 7;
  
  // Час створення (від)
  google.protobuf.Timestamp created_from = 8;
  
  // Час створення (до)
  google.protobuf.Timestamp created_to = 9;
  
  // Час останнього оновлення (від)
  google.protobuf.Timestamp updated_from = 10;
  
  // Час останнього оновлення (до)
  google.protobuf.Timestamp updated_to = 11;
  
  // Час останнього використання (від)
  google.protobuf.Timestamp last_used_from = 12;
  
  // Час останнього використання (до)
  google.protobuf.Timestamp last_used_to = 13;
}

// Фільтри балансів
message BalanceFilters {
  // Тип валюти
  repeated gaming.game_economy.enums.CurrencyType currency_types = 1;
  
  // Мінімальна сума
  string min_amount = 2;
  
  // Максимальна сума
  string max_amount = 3;
  
  // Час оновлення (від)
  google.protobuf.Timestamp updated_from = 4;
  
  // Час оновлення (до)
  google.protobuf.Timestamp updated_to = 5;
}

// Фільтри історії гаманців
message WalletHistoryFilters {
  // Тип транзакції
  repeated gaming.game_economy.enums.TransactionType transaction_types = 1;
  
  // Статус транзакції
  repeated gaming.game_economy.enums.TransactionStatus transaction_statuses = 2;
  
  // Тип валюти
  repeated gaming.game_economy.enums.CurrencyType currency_types = 3;
  
  // Час транзакції (від)
  google.protobuf.Timestamp transaction_from = 4;
  
  // Час транзакції (до)
  google.protobuf.Timestamp transaction_to = 5;
  
  // Мінімальна сума
  string min_amount = 6;
  
  // Максимальна сума
  string max_amount = 7;
}

// Пагінація
message Pagination {
  // Номер сторінки
  int32 page = 1;
  
  // Розмір сторінки
  int32 page_size = 2;
}

// Інформація про пагінацію
message PaginationInfo {
  // Поточна сторінка
  int32 current_page = 1;
  
  // Розмір сторінки
  int32 page_size = 2;
  
  // Загальна кількість сторінок
  int32 total_pages = 3;
  
  // Загальна кількість елементів
  int64 total_elements = 4;
  
  // Чи є наступна сторінка
  bool has_next = 5;
  
  // Чи є попередня сторінка
  bool has_previous = 6;
}

// Сортування
message Sorting {
  // Поле для сортування
  string field = 1;
  
  // Напрямок сортування
  SortDirection direction = 2;
}

// Напрямок сортування
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}
