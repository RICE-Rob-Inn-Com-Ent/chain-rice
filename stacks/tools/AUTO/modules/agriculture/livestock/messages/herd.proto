syntax = "proto3";

package agriculture.livestock.messages;

import "agriculture/livestock/messages/animal.proto";
import "google/protobuf/timestamp.proto";

// Herd message represents a group of livestock animals
message Herd {
  // Unique identifier for the herd
  string id = 1;
  
  // Basic information
  string name = 2;
  string description = 3;
  string herd_type = 4;          // Breeding, production, mixed, etc.
  
  // Animal composition
  repeated string animal_ids = 5; // List of animal IDs in this herd
  int32 total_count = 6;         // Total number of animals
  int32 male_count = 7;          // Number of male animals
  int32 female_count = 8;        // Number of female animals
  int32 young_count = 9;         // Number of young animals
  int32 adult_count = 10;        // Number of adult animals
  
  // Animal type breakdown
  map<string, int32> animal_types = 11; // Count by animal type
  map<string, int32> breeds = 12;       // Count by breed
  
  // Location information
  string primary_pasture = 13;   // Main pasture where herd grazes
  string secondary_pasture = 14; // Secondary pasture
  string facility_id = 15;       // Associated facility
  double total_area = 16;        // Total area in hectares
  string area_unit = 17;         // Unit for area measurement
  
  // Management information
  string manager = 18;           // Person responsible for herd
  string veterinarian = 19;      // Assigned veterinarian
  string feeding_program = 20;   // Feeding program being used
  string health_protocol = 21;   // Health management protocol
  
  // Health status summary
  int32 healthy_count = 22;      // Number of healthy animals
  int32 sick_count = 23;         // Number of sick animals
  int32 injured_count = 24;      // Number of injured animals
  int32 pregnant_count = 25;     // Number of pregnant animals
  double average_health_score = 26; // Average health score of herd
  
  // Production metrics
  double total_milk_production = 27; // Total daily milk production
  double total_egg_production = 28;  // Total daily egg production
  double total_wool_production = 29; // Total annual wool production
  double average_weight = 30;        // Average weight of animals
  
  // Breeding information
  int32 breeding_males = 31;     // Number of breeding males
  int32 breeding_females = 32;   // Number of breeding females
  int32 expected_births = 33;    // Expected births in current season
  google.protobuf.Timestamp breeding_season_start = 34;
  google.protobuf.Timestamp breeding_season_end = 35;
  
  // Feeding information
  string primary_feed = 36;      // Primary feed type
  string secondary_feed = 37;    // Secondary feed type
  double daily_feed_requirement = 38; // Total daily feed requirement
  double daily_water_requirement = 39; // Total daily water requirement
  double feed_cost_per_day = 40; // Daily feed cost
  
  // Financial information
  double total_value = 41;       // Total estimated value of herd
  double total_costs = 42;       // Total costs incurred
  double total_revenue = 43;     // Total revenue generated
  double profit_loss = 44;       // Profit or loss from herd
  
  // Performance metrics
  double growth_rate = 45;       // Average daily weight gain
  double feed_efficiency = 46;   // Average feed conversion ratio
  double mortality_rate = 47;    // Mortality rate percentage
  double birth_rate = 48;        // Birth rate percentage
  
  // Environmental conditions
  double average_temperature = 49; // Average temperature in pasture
  double average_humidity = 50;    // Average humidity percentage
  string weather_conditions = 51;  // General weather description
  string shelter_quality = 52;     // Quality of shelter provided
  
  // Status and flags
  bool is_active = 53;           // Whether herd is currently active
  bool is_quarantined = 54;      // Whether entire herd is quarantined
  bool requires_attention = 55;  // Whether herd needs immediate attention
  bool is_for_sale = 56;         // Whether herd is available for sale
  
  // Notes and observations
  string notes = 57;             // General notes about the herd
  repeated string observations = 58; // Regular observations
  repeated string issues = 59;   // Current issues or concerns
  
  // Metadata
  google.protobuf.Timestamp created_at = 60;
  google.protobuf.Timestamp updated_at = 61;
  string created_by = 62;        // User who created this record
  string updated_by = 63;        // User who last updated this record
}
