syntax = "proto3";

package agriculture.livestock.enums;

// AnimalType enum defines different categories of livestock animals
enum AnimalType {
  // Cattle
  ANIMAL_TYPE_UNSPECIFIED = 0;
  ANIMAL_TYPE_DAIRY_CATTLE = 1;    // Dairy cows for milk production
  ANIMAL_TYPE_BEEF_CATTLE = 2;     // Beef cattle for meat production
  ANIMAL_TYPE_DUAL_PURPOSE_CATTLE = 3; // Cattle for both milk and meat
  
  // Pigs
  ANIMAL_TYPE_PIG = 4;             // Domestic pigs for meat production
  ANIMAL_TYPE_BOAR = 5;            // Male breeding pigs
  ANIMAL_TYPE_SOW = 6;             // Female breeding pigs
  ANIMAL_TYPE_PIGLET = 7;          // Young pigs
  
  // Sheep
  ANIMAL_TYPE_SHEEP = 8;           // Domestic sheep for wool and meat
  ANIMAL_TYPE_RAM = 9;             // Male breeding sheep
  ANIMAL_TYPE_EWE = 10;            // Female breeding sheep
  ANIMAL_TYPE_LAMB = 11;           // Young sheep
  
  // Goats
  ANIMAL_TYPE_GOAT = 12;           // Domestic goats for milk and meat
  ANIMAL_TYPE_BUCK = 13;           // Male breeding goats
  ANIMAL_TYPE_DOE = 14;            // Female breeding goats
  ANIMAL_TYPE_KID = 15;            // Young goats
  
  // Poultry
  ANIMAL_TYPE_CHICKEN = 16;        // Domestic chickens for eggs and meat
  ANIMAL_TYPE_ROOSTER = 17;        // Male chickens
  ANIMAL_TYPE_HEN = 18;            // Female chickens for egg production
  ANIMAL_TYPE_CHICK = 19;          // Young chickens
  ANIMAL_TYPE_TURKEY = 20;         // Turkeys for meat production
  ANIMAL_TYPE_DUCK = 21;           // Ducks for eggs and meat
  ANIMAL_TYPE_GOOSE = 22;          // Geese for meat and feathers
  ANIMAL_TYPE_QUAIL = 23;          // Quail for eggs and meat
  
  // Horses
  ANIMAL_TYPE_HORSE = 24;          // Horses for work and recreation
  ANIMAL_TYPE_STALLION = 25;       // Male breeding horses
  ANIMAL_TYPE_MARE = 26;           // Female breeding horses
  ANIMAL_TYPE_FOAL = 27;           // Young horses
  ANIMAL_TYPE_PONY = 28;           // Small horses
  
  // Other livestock
  ANIMAL_TYPE_RABBIT = 29;         // Rabbits for meat and fur
  ANIMAL_TYPE_LLAMA = 30;          // Llamas for fiber and pack animals
  ANIMAL_TYPE_ALPACA = 31;         // Alpacas for fiber production
  ANIMAL_TYPE_EMU = 32;            // Emus for meat and oil
  ANIMAL_TYPE_OSTRICH = 33;        // Ostriches for meat and feathers
  
  // Aquaculture
  ANIMAL_TYPE_FISH = 34;           // Farmed fish
  ANIMAL_TYPE_SALMON = 35;         // Farmed salmon
  ANIMAL_TYPE_TILAPIA = 36;        // Farmed tilapia
  ANIMAL_TYPE_CATFISH = 37;        // Farmed catfish
  ANIMAL_TYPE_SHRIMP = 38;         // Farmed shrimp
  ANIMAL_TYPE_CRAB = 39;           // Farmed crabs
  ANIMAL_TYPE_LOBSTER = 40;        // Farmed lobsters
  ANIMAL_TYPE_MUSSEL = 41;         // Farmed mussels
  ANIMAL_TYPE_OYSTER = 42;         // Farmed oysters
  
  // Bees
  ANIMAL_TYPE_BEE = 43;            // Honey bees for honey and pollination
  ANIMAL_TYPE_QUEEN_BEE = 44;      // Queen bees for reproduction
  ANIMAL_TYPE_WORKER_BEE = 45;     // Worker bees for hive maintenance
  ANIMAL_TYPE_DRONE_BEE = 46;      // Drone bees for mating
}
