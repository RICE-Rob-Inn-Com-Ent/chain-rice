syntax = "proto3";

package agriculture;

option go_package = "github.com/rice-dev/agriculture";

// Agriculture module index - comprehensive Protobuf definitions for agriculture operations
// This module provides complete gRPC services for agriculture management including
// crops, livestock, equipment, weather, and farm management.

// Import all enums from submodules
import "agriculture/crops/enums/crop_type.proto";
import "agriculture/crops/enums/crop_status.proto";
import "agriculture/crops/enums/growth_stage.proto";
import "agriculture/livestock/enums/animal_type.proto";
import "agriculture/livestock/enums/animal_status.proto";
import "agriculture/livestock/enums/health_status.proto";
import "agriculture/equipment/enums/equipment_type.proto";
import "agriculture/equipment/enums/equipment_status.proto";
import "agriculture/equipment/enums/maintenance_type.proto";
import "agriculture/weather/enums/weather_condition.proto";
import "agriculture/weather/enums/weather_severity.proto";
import "agriculture/weather/enums/forecast_type.proto";
import "agriculture/farm/enums/farm_type.proto";
import "agriculture/farm/enums/farm_status.proto";
import "agriculture/farm/enums/soil_type.proto";

// Import all messages from submodules
import "agriculture/crops/messages/crop.proto";
import "agriculture/crops/messages/crop_cycle.proto";
import "agriculture/crops/messages/harvest.proto";
import "agriculture/livestock/messages/animal.proto";
import "agriculture/livestock/messages/breeding.proto";
import "agriculture/livestock/messages/health_record.proto";
import "agriculture/equipment/messages/equipment.proto";
import "agriculture/equipment/messages/maintenance.proto";
import "agriculture/equipment/messages/usage_log.proto";
import "agriculture/weather/messages/weather_data.proto";
import "agriculture/weather/messages/forecast.proto";
import "agriculture/weather/messages/weather_alert.proto";
import "agriculture/farm/messages/farm.proto";
import "agriculture/farm/messages/field.proto";
import "agriculture/farm/messages/farm_operation.proto";

// Import all services from submodules
import "agriculture/crops/services/crop_service.proto";
import "agriculture/crops/services/harvest_service.proto";
import "agriculture/livestock/services/livestock_service.proto";
import "agriculture/livestock/services/breeding_service.proto";
import "agriculture/equipment/services/equipment_service.proto";
import "agriculture/equipment/services/maintenance_service.proto";
import "agriculture/weather/services/weather_service.proto";
import "agriculture/weather/services/forecast_service.proto";
import "agriculture/farm/services/farm_service.proto";
import "agriculture/farm/services/field_service.proto";

// Agriculture module summary
message AgricultureModuleSummary {
  // Module version
  string version = 1;
  
  // Module description
  string description = 2;
  
  // Available services
  repeated string available_services = 3;
  
  // Available enums
  repeated string available_enums = 4;
  
  // Available messages
  repeated string available_messages = 5;
  
  // Module capabilities
  repeated string capabilities = 6;
  
  // Last updated timestamp
  int64 last_updated = 7;
}

// Main service aggregator - provides access to all agriculture services
service AgricultureService {
  // Crop operations
  rpc CreateCrop(agriculture.crops.services.CreateCropRequest) returns (agriculture.crops.services.CreateCropResponse);
  rpc GetCrop(agriculture.crops.services.GetCropRequest) returns (agriculture.crops.services.GetCropResponse);
  rpc UpdateCrop(agriculture.crops.services.UpdateCropRequest) returns (agriculture.crops.services.UpdateCropResponse);
  rpc DeleteCrop(agriculture.crops.services.DeleteCropRequest) returns (agriculture.crops.services.DeleteCropResponse);
  
  // Livestock operations
  rpc CreateAnimal(agriculture.livestock.services.CreateAnimalRequest) returns (agriculture.livestock.services.CreateAnimalResponse);
  rpc GetAnimal(agriculture.livestock.services.GetAnimalRequest) returns (agriculture.livestock.services.GetAnimalResponse);
  rpc UpdateAnimal(agriculture.livestock.services.UpdateAnimalRequest) returns (agriculture.livestock.services.UpdateAnimalResponse);
  rpc DeleteAnimal(agriculture.livestock.services.DeleteAnimalRequest) returns (agriculture.livestock.services.DeleteAnimalResponse);
  
  // Equipment operations
  rpc CreateEquipment(agriculture.equipment.services.CreateEquipmentRequest) returns (agriculture.equipment.services.CreateEquipmentResponse);
  rpc GetEquipment(agriculture.equipment.services.GetEquipmentRequest) returns (agriculture.equipment.services.GetEquipmentResponse);
  rpc UpdateEquipment(agriculture.equipment.services.UpdateEquipmentRequest) returns (agriculture.equipment.services.UpdateEquipmentResponse);
  rpc ScheduleMaintenance(agriculture.equipment.services.ScheduleMaintenanceRequest) returns (agriculture.equipment.services.ScheduleMaintenanceResponse);
  
  // Weather operations
  rpc GetWeatherData(agriculture.weather.services.GetWeatherDataRequest) returns (agriculture.weather.services.GetWeatherDataResponse);
  rpc GetForecast(agriculture.weather.services.GetForecastRequest) returns (agriculture.weather.services.GetForecastResponse);
  rpc GetWeatherAlerts(agriculture.weather.services.GetWeatherAlertsRequest) returns (agriculture.weather.services.GetWeatherAlertsResponse);
  
  // Farm operations
  rpc CreateFarm(agriculture.farm.services.CreateFarmRequest) returns (agriculture.farm.services.CreateFarmResponse);
  rpc GetFarm(agriculture.farm.services.GetFarmRequest) returns (agriculture.farm.services.GetFarmResponse);
  rpc UpdateFarm(agriculture.farm.services.UpdateFarmRequest) returns (agriculture.farm.services.UpdateFarmResponse);
  rpc CreateField(agriculture.farm.services.CreateFieldRequest) returns (agriculture.farm.services.CreateFieldResponse);
}
