syntax = "proto3";

package agriculture.logistics.enums;

// TransportType enum defines different modes of transportation for agricultural logistics
enum TransportType {
  // Road transportation
  TRANSPORT_TYPE_UNSPECIFIED = 0;
  TRANSPORT_TYPE_TRUCK = 1;            // General trucks
  TRANSPORT_TYPE_SEMI_TRAILER = 2;     // Semi-trailer trucks
  TRANSPORT_TYPE_FLATBED = 3;          // Flatbed trucks
  TRANSPORT_TYPE_REFRIGERATED = 4;     // Refrigerated trucks
  TRANSPORT_TYPE_TANKER = 5;           // Tanker trucks
  TRANSPORT_TYPE_DUMP_TRUCK = 6;       // Dump trucks
  TRANSPORT_TYPE_PICKUP = 7;           // Pickup trucks
  TRANSPORT_TYPE_VAN = 8;              // Delivery vans
  TRANSPORT_TYPE_UTILITY_VEHICLE = 9;  // Utility vehicles
  
  // Rail transportation
  TRANSPORT_TYPE_FREIGHT_TRAIN = 10;   // Freight trains
  TRANSPORT_TYPE_GRAIN_CAR = 11;       // Grain cars
  TRANSPORT_TYPE_TANK_CAR = 12;        // Tank cars
  TRANSPORT_TYPE_FLATCAR = 13;         // Flatcars
  TRANSPORT_TYPE_CONTAINER_TRAIN = 14; // Container trains
  TRANSPORT_TYPE_LOCOMOTIVE = 15;      // Locomotives
  
  // Water transportation
  TRANSPORT_TYPE_CARGO_SHIP = 16;      // Cargo ships
  TRANSPORT_TYPE_BULK_CARRIER = 17;    // Bulk carriers
  TRANSPORT_TYPE_CONTAINER_SHIP = 18;  // Container ships
  TRANSPORT_TYPE_TANKER_SHIP = 19;     // Tanker ships
  TRANSPORT_TYPE_BARGE = 20;           // Barges
  TRANSPORT_TYPE_FERRY = 21;           // Ferries
  TRANSPORT_TYPE_BOAT = 22;            // Small boats
  
  // Air transportation
  TRANSPORT_TYPE_CARGO_PLANE = 23;     // Cargo planes
  TRANSPORT_TYPE_FREIGHT_AIRCRAFT = 24; // Freight aircraft
  TRANSPORT_TYPE_HELICOPTER = 25;      // Helicopters
  TRANSPORT_TYPE_DRONE = 26;           // Drones
  TRANSPORT_TYPE_CARGO_HELICOPTER = 27; // Cargo helicopters
  
  // Pipeline transportation
  TRANSPORT_TYPE_PIPELINE = 28;        // Pipelines
  TRANSPORT_TYPE_GRAIN_PIPE = 29;      // Grain pipelines
  TRANSPORT_TYPE_LIQUID_PIPE = 30;     // Liquid pipelines
  TRANSPORT_TYPE_GAS_PIPE = 31;        // Gas pipelines
  
  // Conveyor systems
  TRANSPORT_TYPE_CONVEYOR = 32;        // Conveyor belts
  TRANSPORT_TYPE_BUCKET_ELEVATOR = 33; // Bucket elevators
  TRANSPORT_TYPE_SCREW_CONVEYOR = 34;  // Screw conveyors
  TRANSPORT_TYPE_CHAIN_CONVEYOR = 35;  // Chain conveyors
  TRANSPORT_TYPE_BELT_CONVEYOR = 36;   // Belt conveyors
  
  // Specialized agricultural transport
  TRANSPORT_TYPE_COMBINE_HARVESTER = 37; // Combine harvesters
  TRANSPORT_TYPE_FORAGE_HARVESTER = 38;  // Forage harvesters
  TRANSPORT_TYPE_COTTON_PICKER = 39;     // Cotton pickers
  TRANSPORT_TYPE_POTATO_HARVESTER = 40;  // Potato harvesters
  TRANSPORT_TYPE_HAY_BALER = 41;         // Hay balers
  TRANSPORT_TYPE_MOWER = 42;             // Mowers
  
  // Livestock transport
  TRANSPORT_TYPE_LIVESTOCK_TRAILER = 43; // Livestock trailers
  TRANSPORT_TYPE_CATTLE_TRUCK = 44;      // Cattle trucks
  TRANSPORT_TYPE_PIG_TRANSPORTER = 45;   // Pig transporters
  TRANSPORT_TYPE_POULTRY_TRANSPORTER = 46; // Poultry transporters
  TRANSPORT_TYPE_HORSE_TRAILER = 47;     // Horse trailers
  
  // Specialized equipment
  TRANSPORT_TYPE_CRANE = 48;            // Cranes
  TRANSPORT_TYPE_FORKLIFT = 49;         // Forklifts
  TRANSPORT_TYPE_LOADER = 50;           // Loaders
  TRANSPORT_TYPE_EXCAVATOR = 51;        // Excavators
  TRANSPORT_TYPE_BULLDOZER = 52;        // Bulldozers
  
  // Manual transport
  TRANSPORT_TYPE_HAND_CART = 53;        // Hand carts
  TRANSPORT_TYPE_WHEELBARROW = 54;      // Wheelbarrows
  TRANSPORT_TYPE_HAND_TRUCK = 55;       // Hand trucks
  TRANSPORT_TYPE_DOLLY = 56;            // Dollies
  
  // Alternative transport
  TRANSPORT_TYPE_BIKE = 57;             // Bicycles
  TRANSPORT_TYPE_MOTORCYCLE = 58;       // Motorcycles
  TRANSPORT_TYPE_ATV = 59;              // All-terrain vehicles
  TRANSPORT_TYPE_UTV = 60;              // Utility terrain vehicles
  TRANSPORT_TYPE_GOLF_CART = 61;        // Golf carts
  
  // Intermodal transport
  TRANSPORT_TYPE_INTERMODAL = 62;       // Intermodal containers
  TRANSPORT_TYPE_CONTAINER = 63;        // Shipping containers
  TRANSPORT_TYPE_PALLET = 64;           // Pallets
  TRANSPORT_TYPE_SKID = 65;             // Skids
  
  // Emergency transport
  TRANSPORT_TYPE_AMBULANCE = 66;        // Ambulances
  TRANSPORT_TYPE_FIRE_TRUCK = 67;       // Fire trucks
  TRANSPORT_TYPE_EMERGENCY_VEHICLE = 68; // Emergency vehicles
  TRANSPORT_TYPE_RESCUE_VEHICLE = 69;   // Rescue vehicles
}
