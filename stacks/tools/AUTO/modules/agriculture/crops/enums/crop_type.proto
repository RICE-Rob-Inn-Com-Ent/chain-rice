syntax = "proto3";

package agriculture.crops.enums;

// CropType enum defines different categories of agricultural crops
enum CropType {
  // Grains and cereals
  CROP_TYPE_UNSPECIFIED = 0;
  CROP_TYPE_WHEAT = 1;           // Common wheat for bread and flour
  CROP_TYPE_RICE = 2;            // Rice for staple food
  CROP_TYPE_CORN = 3;            // Maize for food and feed
  CROP_TYPE_BARLEY = 4;          // Barley for brewing and feed
  CROP_TYPE_OATS = 5;            // Oats for breakfast cereals
  CROP_TYPE_SORGHUM = 6;         // Sorghum for grain and forage
  CROP_TYPE_MILLET = 7;          // Millet for grain
  
  // Legumes and pulses
  CROP_TYPE_SOYBEAN = 8;         // Soybeans for protein and oil
  CROP_TYPE_BEANS = 9;           // Common beans for protein
  CROP_TYPE_LENTILS = 10;        // Lentils for protein
  CROP_TYPE_CHICKPEAS = 11;      // Chickpeas for protein
  CROP_TYPE_PEAS = 12;           // Peas for protein and feed
  
  // Root vegetables
  CROP_TYPE_POTATO = 13;         // Potatoes for starch
  CROP_TYPE_SWEET_POTATO = 14;   // Sweet potatoes for nutrition
  CROP_TYPE_CARROT = 15;         // Carrots for nutrition
  CROP_TYPE_ONION = 16;          // Onions for flavoring
  CROP_TYPE_GARLIC = 17;         // Garlic for flavoring
  
  // Fruits
  CROP_TYPE_TOMATO = 18;         // Tomatoes for consumption
  CROP_TYPE_APPLE = 19;          // Apples for fresh consumption
  CROP_TYPE_CITRUS = 20;         // Citrus fruits (oranges, lemons)
  CROP_TYPE_BERRY = 21;          // Berries (strawberries, blueberries)
  CROP_TYPE_GRAPE = 22;          // Grapes for wine and fresh consumption
  
  // Oil crops
  CROP_TYPE_SUNFLOWER = 23;      // Sunflower for oil
  CROP_TYPE_CANOLA = 24;         // Canola/rapeseed for oil
  CROP_TYPE_OLIVE = 25;          // Olives for oil
  CROP_TYPE_PALM = 26;           // Palm oil
  
  // Fiber crops
  CROP_TYPE_COTTON = 27;         // Cotton for textiles
  CROP_TYPE_FLAX = 28;           // Flax for linen
  CROP_TYPE_HEMP = 29;           // Hemp for fiber and CBD
  
  // Forage crops
  CROP_TYPE_ALFALFA = 30;        // Alfalfa for livestock feed
  CROP_TYPE_CLOVER = 31;         // Clover for nitrogen fixation
  CROP_TYPE_GRASS = 32;          // Grass for grazing and hay
  
  // Spices and herbs
  CROP_TYPE_PEPPER = 33;         // Black pepper
  CROP_TYPE_CINNAMON = 34;       // Cinnamon bark
  CROP_TYPE_BASIL = 35;          // Basil herb
  CROP_TYPE_OREGANO = 36;        // Oregano herb
  
  // Other
  CROP_TYPE_SUGAR_CANE = 37;     // Sugar cane for sugar
  CROP_TYPE_SUGAR_BEET = 38;     // Sugar beet for sugar
  CROP_TYPE_TOBACCO = 39;        // Tobacco for smoking
  CROP_TYPE_COFFEE = 40;         // Coffee beans
  CROP_TYPE_TEA = 41;            // Tea leaves
  CROP_TYPE_CACAO = 42;          // Cacao for chocolate
}
