syntax = "proto3";

package agriculture.crops.services;

import "agriculture/crops/messages/crop.proto";
import "agriculture/crops/messages/harvest.proto";
import "google/protobuf/empty.proto";

// CropService provides CRUD operations and business logic for crop management
service CropService {
  // CreateCrop creates a new crop record
  rpc CreateCrop(CreateCropRequest) returns (CreateCropResponse);
  
  // GetCrop retrieves a specific crop by ID
  rpc GetCrop(GetCropRequest) returns (GetCropResponse);
  
  // ListCrops retrieves a list of crops with optional filtering
  rpc ListCrops(ListCropsRequest) returns (ListCropsResponse);
  
  // UpdateCrop updates an existing crop record
  rpc UpdateCrop(UpdateCropRequest) returns (UpdateCropResponse);
  
  // DeleteCrop deletes a crop record
  rpc DeleteCrop(DeleteCropRequest) returns (google.protobuf.Empty);
  
  // GetCropGrowthStage retrieves the current growth stage of a crop
  rpc GetCropGrowthStage(GetCropGrowthStageRequest) returns (GetCropGrowthStageResponse);
  
  // UpdateCropGrowthStage updates the growth stage of a crop
  rpc UpdateCropGrowthStage(UpdateCropGrowthStageRequest) returns (UpdateCropGrowthStageResponse);
  
  // GetCropHealth retrieves health information for a crop
  rpc GetCropHealth(GetCropHealthRequest) returns (GetCropHealthResponse);
  
  // UpdateCropHealth updates health information for a crop
  rpc UpdateCropHealth(UpdateCropHealthRequest) returns (UpdateCropHealthResponse);
  
  // GetCropYieldPrediction predicts yield for a crop
  rpc GetCropYieldPrediction(GetCropYieldPredictionRequest) returns (GetCropYieldPredictionResponse);
  
  // GetCropsByField retrieves all crops in a specific field
  rpc GetCropsByField(GetCropsByFieldRequest) returns (GetCropsByFieldResponse);
  
  // GetCropsByType retrieves all crops of a specific type
  rpc GetCropsByType(GetCropsByTypeRequest) returns (GetCropsByTypeResponse);
  
  // GetCropsRequiringAttention retrieves crops that need immediate attention
  rpc GetCropsRequiringAttention(GetCropsRequiringAttentionRequest) returns (GetCropsRequiringAttentionResponse);
}

// Request and Response messages for CreateCrop
message CreateCropRequest {
  agriculture.crops.messages.Crop crop = 1;
}

message CreateCropResponse {
  agriculture.crops.messages.Crop crop = 1;
  bool success = 2;
  string message = 3;
}

// Request and Response messages for GetCrop
message GetCropRequest {
  string crop_id = 1;
}

message GetCropResponse {
  agriculture.crops.messages.Crop crop = 1;
  bool found = 2;
  string message = 3;
}

// Request and Response messages for ListCrops
message ListCropsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string field_id = 3;           // Filter by field
  string crop_type = 4;          // Filter by crop type
  string growth_stage = 5;       // Filter by growth stage
  bool is_active = 6;            // Filter by active status
  bool requires_attention = 7;   // Filter by attention requirement
  string search_query = 8;       // Search in crop names and varieties
}

message ListCropsResponse {
  repeated agriculture.crops.messages.Crop crops = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Request and Response messages for UpdateCrop
message UpdateCropRequest {
  agriculture.crops.messages.Crop crop = 1;
  repeated string update_mask = 2; // Fields to update
}

message UpdateCropResponse {
  agriculture.crops.messages.Crop crop = 1;
  bool success = 2;
  string message = 3;
}

// Request and Response messages for DeleteCrop
message DeleteCropRequest {
  string crop_id = 1;
}

// Request and Response messages for GetCropGrowthStage
message GetCropGrowthStageRequest {
  string crop_id = 1;
}

message GetCropGrowthStageResponse {
  string crop_id = 1;
  string current_stage = 2;
  string stage_description = 3;
  int32 days_in_stage = 4;
  int32 estimated_days_to_next_stage = 5;
}

// Request and Response messages for UpdateCropGrowthStage
message UpdateCropGrowthStageRequest {
  string crop_id = 1;
  string new_stage = 2;
  string notes = 3;
}

message UpdateCropGrowthStageResponse {
  bool success = 2;
  string message = 3;
}

// Request and Response messages for GetCropHealth
message GetCropHealthRequest {
  string crop_id = 1;
}

message GetCropHealthResponse {
  string crop_id = 1;
  double health_score = 2;
  repeated string diseases = 3;
  repeated string pests = 4;
  repeated string environmental_stress = 5;
  string recommendations = 6;
}

// Request and Response messages for UpdateCropHealth
message UpdateCropHealthRequest {
  string crop_id = 1;
  double health_score = 2;
  repeated string diseases = 3;
  repeated string pests = 4;
  string notes = 5;
}

message UpdateCropHealthResponse {
  bool success = 2;
  string message = 3;
}

// Request and Response messages for GetCropYieldPrediction
message GetCropYieldPredictionRequest {
  string crop_id = 1;
  bool include_weather_data = 2;
  bool include_historical_data = 3;
}

message GetCropYieldPredictionResponse {
  string crop_id = 1;
  double predicted_yield = 2;
  string yield_unit = 3;
  double confidence_score = 4;   // Confidence in prediction (0-100)
  repeated string factors = 5;   // Factors considered in prediction
  string prediction_date = 6;
}

// Request and Response messages for GetCropsByField
message GetCropsByFieldRequest {
  string field_id = 1;
  bool include_harvested = 2;    // Include harvested crops
}

message GetCropsByFieldResponse {
  string field_id = 1;
  repeated agriculture.crops.messages.Crop crops = 2;
  int32 total_count = 3;
}

// Request and Response messages for GetCropsByType
message GetCropsByTypeRequest {
  string crop_type = 1;
  string field_id = 2;           // Optional field filter
}

message GetCropsByTypeResponse {
  string crop_type = 1;
  repeated agriculture.crops.messages.Crop crops = 2;
  int32 total_count = 3;
}

// Request and Response messages for GetCropsRequiringAttention
message GetCropsRequiringAttentionRequest {
  string priority = 2;           // high, medium, low
  string field_id = 3;           // Optional field filter
}

message GetCropsRequiringAttentionResponse {
  repeated agriculture.crops.messages.Crop crops = 1;
  int32 total_count = 2;
  repeated string attention_reasons = 3; // Reasons why crops need attention
}
