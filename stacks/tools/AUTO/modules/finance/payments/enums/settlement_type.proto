syntax = "proto3";

package finance.payments.enums;

// Settlement types for payment processing
enum SettlementType {
  // Default value
  SETTLEMENT_TYPE_UNSPECIFIED = 0;
  
  // Immediate settlement
  SETTLEMENT_TYPE_IMMEDIATE = 1;
  
  // Next day settlement
  SETTLEMENT_TYPE_NEXT_DAY = 2;
  
  // Two day settlement
  SETTLEMENT_TYPE_TWO_DAY = 3;
  
  // Three day settlement
  SETTLEMENT_TYPE_THREE_DAY = 4;
  
  // Weekly settlement
  SETTLEMENT_TYPE_WEEKLY = 5;
  
  // Bi-weekly settlement
  SETTLEMENT_TYPE_BI_WEEKLY = 6;
  
  // Monthly settlement
  SETTLEMENT_TYPE_MONTHLY = 7;
  
  // Quarterly settlement
  SETTLEMENT_TYPE_QUARTERLY = 8;
  
  // Annual settlement
  SETTLEMENT_TYPE_ANNUAL = 9;
  
  // Custom settlement
  SETTLEMENT_TYPE_CUSTOM = 10;
  
  // Net settlement
  SETTLEMENT_TYPE_NET = 11;
  
  // Gross settlement
  SETTLEMENT_TYPE_GROSS = 12;
  
  // Batch settlement
  SETTLEMENT_TYPE_BATCH = 13;
  
  // Real-time settlement
  SETTLEMENT_TYPE_REAL_TIME = 14;
  
  // End of day settlement
  SETTLEMENT_TYPE_END_OF_DAY = 15;
  
  // End of week settlement
  SETTLEMENT_TYPE_END_OF_WEEK = 16;
  
  // End of month settlement
  SETTLEMENT_TYPE_END_OF_MONTH = 17;
}
