syntax = "proto3";

package finance.subscriptions.services;

import "finance/subscriptions/messages/subscription.proto";
import "finance/subscriptions/messages/plan.proto";
import "finance/subscriptions/messages/usage_record.proto";

// Subscriptions service for subscription management
service SubscriptionsService {
  // Subscription management
  rpc CreateSubscription(finance.subscriptions.messages.CreateSubscriptionRequest) returns (finance.subscriptions.messages.CreateSubscriptionResponse);
  rpc GetSubscription(finance.subscriptions.messages.GetSubscriptionRequest) returns (finance.subscriptions.messages.GetSubscriptionResponse);
  rpc UpdateSubscription(finance.subscriptions.messages.UpdateSubscriptionRequest) returns (finance.subscriptions.messages.UpdateSubscriptionResponse);
  rpc ListSubscriptions(finance.subscriptions.messages.ListSubscriptionsRequest) returns (finance.subscriptions.messages.ListSubscriptionsResponse);
  rpc CancelSubscription(finance.subscriptions.messages.CancelSubscriptionRequest) returns (finance.subscriptions.messages.CancelSubscriptionResponse);
  
  // Subscription lifecycle
  rpc ActivateSubscription(finance.subscriptions.messages.ActivateSubscriptionRequest) returns (finance.subscriptions.messages.ActivateSubscriptionResponse);
  rpc SuspendSubscription(finance.subscriptions.messages.SuspendSubscriptionRequest) returns (finance.subscriptions.messages.SuspendSubscriptionResponse);
  rpc ResumeSubscription(finance.subscriptions.messages.ResumeSubscriptionRequest) returns (finance.subscriptions.messages.ResumeSubscriptionResponse);
  rpc RenewSubscription(finance.subscriptions.messages.RenewSubscriptionRequest) returns (finance.subscriptions.messages.RenewSubscriptionResponse);
  rpc UpgradeSubscription(finance.subscriptions.messages.UpgradeSubscriptionRequest) returns (finance.subscriptions.messages.UpgradeSubscriptionResponse);
  rpc DowngradeSubscription(finance.subscriptions.messages.DowngradeSubscriptionRequest) returns (finance.subscriptions.messages.DowngradeSubscriptionResponse);
  
  // Plan management
  rpc CreatePlan(finance.subscriptions.messages.CreatePlanRequest) returns (finance.subscriptions.messages.CreatePlanResponse);
  rpc GetPlan(finance.subscriptions.messages.GetPlanRequest) returns (finance.subscriptions.messages.GetPlanResponse);
  rpc UpdatePlan(finance.subscriptions.messages.UpdatePlanRequest) returns (finance.subscriptions.messages.UpdatePlanResponse);
  rpc ListPlans(finance.subscriptions.messages.ListPlansRequest) returns (finance.subscriptions.messages.ListPlansResponse);
  rpc DeletePlan(finance.subscriptions.messages.DeletePlanRequest) returns (finance.subscriptions.messages.DeletePlanResponse);
  
  // Usage tracking
  rpc RecordUsage(finance.subscriptions.messages.CreateUsageRecordRequest) returns (finance.subscriptions.messages.CreateUsageRecordResponse);
  rpc GetUsageRecord(finance.subscriptions.messages.GetUsageRecordRequest) returns (finance.subscriptions.messages.GetUsageRecordResponse);
  rpc UpdateUsageRecord(finance.subscriptions.messages.UpdateUsageRecordRequest) returns (finance.subscriptions.messages.UpdateUsageRecordResponse);
  rpc ListUsageRecords(finance.subscriptions.messages.ListUsageRecordsRequest) returns (finance.subscriptions.messages.ListUsageRecordsResponse);
  rpc GetUsageSummary(finance.subscriptions.messages.GetUsageSummaryRequest) returns (finance.subscriptions.messages.GetUsageSummaryResponse);
  
  // Billing management
  rpc GenerateInvoice(finance.subscriptions.messages.GenerateInvoiceRequest) returns (finance.subscriptions.messages.GenerateInvoiceResponse);
  rpc ProcessBilling(finance.subscriptions.messages.ProcessBillingRequest) returns (finance.subscriptions.messages.ProcessBillingResponse);
  rpc GetBillingHistory(finance.subscriptions.messages.GetBillingHistoryRequest) returns (finance.subscriptions.messages.GetBillingHistoryResponse);
  
  // Subscription reporting
  rpc GetSubscriptionSummary(finance.subscriptions.messages.GetSubscriptionSummaryRequest) returns (finance.subscriptions.messages.GetSubscriptionSummaryResponse);
  rpc GetSubscriptionAnalytics(finance.subscriptions.messages.GetSubscriptionAnalyticsRequest) returns (finance.subscriptions.messages.GetSubscriptionAnalyticsResponse);
  rpc GenerateSubscriptionReport(finance.subscriptions.messages.GenerateSubscriptionReportRequest) returns (finance.subscriptions.messages.GenerateSubscriptionReportResponse);
}

// Additional request/response messages for subscriptions service

// Get subscription request
message GetSubscriptionRequest {
  string subscription_id = 1;
}

// Get subscription response
message GetSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Cancel subscription request
message CancelSubscriptionRequest {
  string subscription_id = 1;
  string cancellation_reason = 2;
  string notes = 3;
  bool immediate = 4;
}

// Cancel subscription response
message CancelSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Activate subscription request
message ActivateSubscriptionRequest {
  string subscription_id = 1;
  string activation_notes = 2;
}

// Activate subscription response
message ActivateSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Suspend subscription request
message SuspendSubscriptionRequest {
  string subscription_id = 1;
  string suspension_reason = 2;
  string notes = 3;
}

// Suspend subscription response
message SuspendSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Resume subscription request
message ResumeSubscriptionRequest {
  string subscription_id = 1;
  string resumption_notes = 2;
}

// Resume subscription response
message ResumeSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Renew subscription request
message RenewSubscriptionRequest {
  string subscription_id = 1;
  int64 renewal_date = 2;
  string renewal_notes = 3;
}

// Renew subscription response
message RenewSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Upgrade subscription request
message UpgradeSubscriptionRequest {
  string subscription_id = 1;
  finance.subscriptions.enums.SubscriptionPlan new_plan = 2;
  string upgrade_notes = 3;
  bool prorate = 4;
}

// Upgrade subscription response
message UpgradeSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Downgrade subscription request
message DowngradeSubscriptionRequest {
  string subscription_id = 1;
  finance.subscriptions.enums.SubscriptionPlan new_plan = 2;
  string downgrade_notes = 3;
  bool prorate = 4;
}

// Downgrade subscription response
message DowngradeSubscriptionResponse {
  finance.subscriptions.messages.Subscription subscription = 1;
  bool success = 2;
  string error_message = 3;
}

// Get plan request
message GetPlanRequest {
  string plan_id = 1;
}

// Get plan response
message GetPlanResponse {
  finance.subscriptions.messages.Plan plan = 1;
  bool success = 2;
  string error_message = 3;
}

// Delete plan request
message DeletePlanRequest {
  string plan_id = 1;
}

// Delete plan response
message DeletePlanResponse {
  bool success = 1;
  string error_message = 2;
}

// Get usage record request
message GetUsageRecordRequest {
  string usage_record_id = 1;
}

// Get usage record response
message GetUsageRecordResponse {
  finance.subscriptions.messages.UsageRecord usage_record = 1;
  bool success = 2;
  string error_message = 3;
}

// Generate invoice request
message GenerateInvoiceRequest {
  string subscription_id = 1;
  int64 billing_period_start = 2;
  int64 billing_period_end = 3;
  string invoice_type = 4;
  string notes = 5;
}

// Generate invoice response
message GenerateInvoiceResponse {
  string invoice_id = 1;
  bool success = 2;
  string error_message = 3;
}

// Process billing request
message ProcessBillingRequest {
  string subscription_id = 1;
  int64 billing_date = 2;
  string billing_notes = 3;
}

// Process billing response
message ProcessBillingResponse {
  string billing_id = 1;
  bool success = 2;
  string error_message = 3;
}

// Billing history
message BillingHistory {
  string subscription_id = 1;
  repeated BillingHistoryItem items = 2;
  int64 total_count = 3;
}

// Billing history item
message BillingHistoryItem {
  string billing_id = 1;
  int64 billing_date = 2;
  double amount = 3;
  string currency = 4;
  string status = 5;
  string invoice_id = 6;
  string payment_id = 7;
  string notes = 8;
}

// Get billing history request
message GetBillingHistoryRequest {
  string subscription_id = 1;
  int64 start_date = 2;
  int64 end_date = 3;
  int32 page = 4;
  int32 page_size = 5;
}

// Get billing history response
message GetBillingHistoryResponse {
  BillingHistory billing_history = 1;
  bool success = 2;
  string error_message = 3;
}

// Subscription summary
message SubscriptionSummary {
  string summary_id = 1;
  int64 summary_date = 2;
  int32 total_subscriptions = 3;
  int32 active_subscriptions = 4;
  int32 trial_subscriptions = 5;
  int32 cancelled_subscriptions = 6;
  int32 suspended_subscriptions = 7;
  double total_revenue = 8;
  string currency = 9;
  double monthly_recurring_revenue = 10;
  double annual_recurring_revenue = 11;
  double churn_rate = 12;
  double growth_rate = 13;
  map<string, int32> subscriptions_by_plan = 14;
  map<string, double> revenue_by_plan = 15;
}

// Get subscription summary request
message GetSubscriptionSummaryRequest {
  int64 start_date = 1;
  int64 end_date = 2;
  string currency = 3;
  string plan_type = 4;
}

// Get subscription summary response
message GetSubscriptionSummaryResponse {
  SubscriptionSummary summary = 1;
  bool success = 2;
  string error_message = 3;
}

// Subscription analytics
message SubscriptionAnalytics {
  string analytics_id = 1;
  int64 analytics_date = 2;
  double average_revenue_per_user = 3;
  double customer_lifetime_value = 4;
  double monthly_churn_rate = 5;
  double annual_churn_rate = 6;
  double net_revenue_retention = 7;
  double gross_revenue_retention = 8;
  map<string, double> trends = 9;
  repeated SubscriptionAnalyticsItem top_plans = 10;
  repeated SubscriptionAnalyticsItem top_customers = 11;
}

// Subscription analytics item
message SubscriptionAnalyticsItem {
  string item_id = 1;
  string item_name = 2;
  double amount = 3;
  int32 count = 4;
  double percentage = 5;
}

// Get subscription analytics request
message GetSubscriptionAnalyticsRequest {
  int64 start_date = 1;
  int64 end_date = 2;
  string currency = 3;
  string analytics_type = 4;
}

// Get subscription analytics response
message GetSubscriptionAnalyticsResponse {
  SubscriptionAnalytics analytics = 1;
  bool success = 2;
  string error_message = 3;
}

// Subscription report
message SubscriptionReport {
  string report_id = 1;
  string report_type = 2;
  int64 report_date = 3;
  string report_format = 4;
  string report_url = 5;
  map<string, string> report_parameters = 6;
  string report_status = 7;
  int64 created_at = 8;
  string created_by = 9;
}

// Generate subscription report request
message GenerateSubscriptionReportRequest {
  string report_type = 1;
  int64 start_date = 2;
  int64 end_date = 3;
  string report_format = 4;
  string customer_id = 5;
  string plan_type = 6;
  string currency = 7;
  map<string, string> parameters = 8;
}

// Generate subscription report response
message GenerateSubscriptionReportResponse {
  SubscriptionReport report = 1;
  bool success = 2;
  string error_message = 3;
}
