syntax = "proto3";

package finance.accounting.enums;

// Account types for financial accounting
enum AccountType {
  // Default value
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  
  // Asset accounts
  ACCOUNT_TYPE_ASSET = 1;
  ACCOUNT_TYPE_CURRENT_ASSET = 2;
  ACCOUNT_TYPE_FIXED_ASSET = 3;
  ACCOUNT_TYPE_INTANGIBLE_ASSET = 4;
  ACCOUNT_TYPE_CASH = 5;
  ACCOUNT_TYPE_ACCOUNTS_RECEIVABLE = 6;
  ACCOUNT_TYPE_INVENTORY = 7;
  ACCOUNT_TYPE_PREPAID_EXPENSE = 8;
  
  // Liability accounts
  ACCOUNT_TYPE_LIABILITY = 9;
  ACCOUNT_TYPE_CURRENT_LIABILITY = 10;
  ACCOUNT_TYPE_LONG_TERM_LIABILITY = 11;
  ACCOUNT_TYPE_ACCOUNTS_PAYABLE = 12;
  ACCOUNT_TYPE_ACCRUED_EXPENSE = 13;
  ACCOUNT_TYPE_TAXES_PAYABLE = 14;
  ACCOUNT_TYPE_LOANS_PAYABLE = 15;
  
  // Equity accounts
  ACCOUNT_TYPE_EQUITY = 16;
  ACCOUNT_TYPE_OWNERS_EQUITY = 17;
  ACCOUNT_TYPE_RETAINED_EARNINGS = 18;
  ACCOUNT_TYPE_COMMON_STOCK = 19;
  ACCOUNT_TYPE_PREFERRED_STOCK = 20;
  ACCOUNT_TYPE_ADDITIONAL_PAID_IN_CAPITAL = 21;
  
  // Revenue accounts
  ACCOUNT_TYPE_REVENUE = 22;
  ACCOUNT_TYPE_SALES_REVENUE = 23;
  ACCOUNT_TYPE_SERVICE_REVENUE = 24;
  ACCOUNT_TYPE_INTEREST_REVENUE = 25;
  ACCOUNT_TYPE_OTHER_REVENUE = 26;
  
  // Expense accounts
  ACCOUNT_TYPE_EXPENSE = 27;
  ACCOUNT_TYPE_COST_OF_GOODS_SOLD = 28;
  ACCOUNT_TYPE_OPERATING_EXPENSE = 29;
  ACCOUNT_TYPE_ADMINISTRATIVE_EXPENSE = 30;
  ACCOUNT_TYPE_SELLING_EXPENSE = 31;
  ACCOUNT_TYPE_RESEARCH_DEVELOPMENT = 32;
  ACCOUNT_TYPE_DEPRECIATION_EXPENSE = 33;
  ACCOUNT_TYPE_INTEREST_EXPENSE = 34;
  ACCOUNT_TYPE_TAX_EXPENSE = 35;
  
  // Contra accounts
  ACCOUNT_TYPE_CONTRA_ASSET = 36;
  ACCOUNT_TYPE_CONTRA_REVENUE = 37;
  ACCOUNT_TYPE_CONTRA_EQUITY = 38;
  
  // Temporary accounts
  ACCOUNT_TYPE_TEMPORARY = 39;
  ACCOUNT_TYPE_CLOSING = 40;
}
