syntax = "proto3";

package finance.invoicing.messages;

// Invoice item representation
message InvoiceItem {
  // Unique item identifier
  string item_id = 1;
  
  // Item name/description
  string name = 2;
  
  // Item description
  string description = 3;
  
  // Item SKU/code
  string sku = 4;
  
  // Item category
  string category = 5;
  
  // Quantity
  double quantity = 6;
  
  // Unit price
  double unit_price = 7;
  
  // Line total (quantity * unit_price)
  double line_total = 8;
  
  // Discount amount
  double discount_amount = 9;
  
  // Discount percentage
  double discount_percentage = 10;
  
  // Tax amount
  double tax_amount = 11;
  
  // Tax rate
  double tax_rate = 12;
  
  // Tax type
  string tax_type = 13;
  
  // Unit of measure
  string unit_of_measure = 14;
  
  // Item type (product, service, etc.)
  string item_type = 15;
  
  // Currency code
  string currency = 16;
  
  // Item tags
  repeated string tags = 17;
  
  // Custom fields
  map<string, string> custom_fields = 18;
  
  // Creation timestamp
  int64 created_at = 19;
  
  // Last update timestamp
  int64 updated_at = 20;
}

// Invoice item creation request
message CreateInvoiceItemRequest {
  // Invoice ID
  string invoice_id = 1;
  
  // Item name/description
  string name = 2;
  
  // Item description
  string description = 3;
  
  // Item SKU/code
  string sku = 4;
  
  // Item category
  string category = 5;
  
  // Quantity
  double quantity = 6;
  
  // Unit price
  double unit_price = 7;
  
  // Discount amount
  double discount_amount = 8;
  
  // Discount percentage
  double discount_percentage = 9;
  
  // Tax rate
  double tax_rate = 10;
  
  // Tax type
  string tax_type = 11;
  
  // Unit of measure
  string unit_of_measure = 12;
  
  // Item type
  string item_type = 13;
  
  // Currency code
  string currency = 14;
  
  // Item tags
  repeated string tags = 15;
  
  // Custom fields
  map<string, string> custom_fields = 16;
}

// Invoice item creation response
message CreateInvoiceItemResponse {
  // Created invoice item
  InvoiceItem item = 1;
  
  // Success status
  bool success = 2;
  
  // Error message if any
  string error_message = 3;
}

// Invoice item update request
message UpdateInvoiceItemRequest {
  // Item ID
  string item_id = 1;
  
  // Updated quantity
  double quantity = 2;
  
  // Updated unit price
  double unit_price = 3;
  
  // Updated discount amount
  double discount_amount = 4;
  
  // Updated discount percentage
  double discount_percentage = 5;
  
  // Updated tax rate
  double tax_rate = 6;
  
  // Updated description
  string description = 7;
  
  // Updated tags
  repeated string tags = 8;
  
  // Updated custom fields
  map<string, string> custom_fields = 9;
}

// Invoice item update response
message UpdateInvoiceItemResponse {
  // Updated invoice item
  InvoiceItem item = 1;
  
  // Success status
  bool success = 2;
  
  // Error message if any
  string error_message = 3;
}

// Invoice item list request
message ListInvoiceItemsRequest {
  // Invoice ID
  string invoice_id = 1;
  
  // Filter by category
  string category = 2;
  
  // Filter by item type
  string item_type = 3;
  
  // Search term
  string search_term = 4;
  
  // Page number
  int32 page = 5;
  
  // Page size
  int32 page_size = 6;
}

// Invoice item list response
message ListInvoiceItemsResponse {
  // List of invoice items
  repeated InvoiceItem items = 1;
  
  // Total count
  int64 total_count = 2;
  
  // Page number
  int32 page = 3;
  
  // Page size
  int32 page_size = 4;
  
  // Success status
  bool success = 5;
  
  // Error message if any
  string error_message = 6;
}
