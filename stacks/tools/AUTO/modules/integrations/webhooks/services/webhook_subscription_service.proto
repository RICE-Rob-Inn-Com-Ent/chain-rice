  google.protobuf.Timestamp last_health_check = 3;
  google.protobuf.Timestamp last_successful_delivery = 4;
  google.protobuf.Timestamp last_failed_delivery = 5;
  int32 consecutive_failures = 6;
  int32 total_deliveries = 7;
  int32 successful_deliveries = 8;
  int32 failed_deliveries = 9;
  double success_rate = 10;
  string status_message = 11;
  repeated string active_alerts = 12;
}

// Health Check Subscription Request
message HealthCheckSubscriptionRequest {
