// Supporting message types
message WebhookEndpointTestResult {
  string endpoint_id = 1;
  string endpoint_name = 2;
  bool test_passed = 3;
  int32 response_time_ms = 4;
  int32 status_code = 5;
  string response_message = 6;
  repeated string errors = 7;
  google.protobuf.Timestamp tested_at = 8;
}

message WebhookSecurityValidationResult {
  string validation_type = 1;
  string validation_name = 2;
  bool validation_passed = 3;
  string validation_message = 4;
  repeated string validation_errors = 5;
  google.protobuf.Timestamp validated_at = 6;
}

message WebhookRetryTestResult {
  int32 attempt_number = 1;
  bool retry_scheduled = 2;
  int32 retry_delay_seconds = 3;
  google.protobuf.Timestamp retry_at = 4;
  string retry_reason = 5;
}

message WebhookHealthCheckResult {
  string check_type = 1;
  string check_name = 2;
  bool check_passed = 3;
  string check_message = 4;
  int32 response_time_ms = 5;
  google.protobuf.Timestamp checked_at = 6;
}

message WebhookSubscriptionMetrics {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int32 total_events = 3;
  int32 delivered_events = 4;
  int32 failed_events = 5;
  double delivery_success_rate = 6;
  int64 average_delivery_time_ms = 7;
  int32 active_endpoints = 8;
  int32 failed_endpoints = 9;
  repeated WebhookEndpointMetrics endpoint_metrics = 10;
}

message WebhookEndpointMetrics {
  string endpoint_id = 1;
  string endpoint_name = 2;
  int32 total_deliveries = 3;
  int32 successful_deliveries = 4;
  int32 failed_deliveries = 5;
  double success_rate = 6;
  int64 average_response_time_ms = 7;
  int32 uptime_percentage = 8;
}

message WebhookValidationResult {
  string validation_type = 1;
  string validation_name = 2;
  bool validation_passed = 3;
  string validation_message = 4;
  repeated string validation_errors = 5;
  repeated string validation_warnings = 6;
  google.protobuf.Timestamp validated_at = 7;
}

message WebhookTestResult {
  string test_type = 1;
  string test_name = 2;
  bool test_passed = 3;
  string test_message = 4;
  int32 response_time_ms = 5;
  string response_data = 6;
  repeated string test_errors = 7;
  google.protobuf.Timestamp tested_at = 8;
}

message WebhookAlertRule {
  string rule_id = 1;
  string rule_name = 2;
  string rule_type = 3; // DELIVERY_FAILURE, HIGH_ERROR_RATE, SLOW_DELIVERY, ENDPOINT_DOWN
  string condition = 4;
  double threshold = 5;
  string comparison_operator = 6; // GREATER_THAN, LESS_THAN, EQUALS
  int32 evaluation_period_seconds = 7;
  int32 alert_cooldown_seconds = 8;
  repeated string notification_channels = 9;
  bool is_active = 10;
}
