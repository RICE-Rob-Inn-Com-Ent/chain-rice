syntax = "proto3";

package integrations.webhooks.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "integrations/webhooks/messages/webhook_subscription_models.proto";
import "integrations/webhooks/messages/webhook_event_models.proto";

option go_package = "github.com/rice-dev/integrations/webhooks/services";

// Webhook Subscription Service for managing webhook subscriptions
service WebhookSubscriptionService {
  // Subscription Management
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  
  // Subscription Configuration
  rpc ConfigureSubscription(ConfigureSubscriptionRequest) returns (ConfigureSubscriptionResponse);
  rpc GetSubscriptionConfiguration(GetSubscriptionConfigurationRequest) returns (GetSubscriptionConfigurationResponse);
  rpc UpdateSubscriptionConfiguration(UpdateSubscriptionConfigurationRequest) returns (UpdateSubscriptionConfigurationResponse);
  
  // Subscription Endpoints
  rpc AddEndpoint(AddEndpointRequest) returns (AddEndpointResponse);
  rpc UpdateEndpoint(UpdateEndpointRequest) returns (UpdateEndpointResponse);
  rpc RemoveEndpoint(RemoveEndpointRequest) returns (RemoveEndpointResponse);
  rpc ListEndpoints(ListEndpointsRequest) returns (ListEndpointsResponse);
  rpc TestEndpoint(TestEndpointRequest) returns (TestEndpointResponse);
  
  // Subscription Security
  rpc SetupSecurity(SetupSecurityRequest) returns (SetupSecurityResponse);
  rpc UpdateSecurity(UpdateSecurityRequest) returns (UpdateSecurityResponse);
  rpc RotateSecrets(RotateSecretsRequest) returns (RotateSecretsResponse);
  rpc ValidateSecurity(ValidateSecurityRequest) returns (ValidateSecurityResponse);
  
  // Subscription Filtering
  rpc ConfigureEventFilter(ConfigureEventFilterRequest) returns (ConfigureEventFilterResponse);
  rpc GetEventFilter(GetEventFilterRequest) returns (GetEventFilterResponse);
  rpc UpdateEventFilter(UpdateEventFilterRequest) returns (UpdateEventFilterResponse);
  rpc TestEventFilter(TestEventFilterRequest) returns (TestEventFilterResponse);
  
  // Subscription Retry Configuration
  rpc ConfigureRetryPolicy(ConfigureRetryPolicyRequest) returns (ConfigureRetryPolicyResponse);
  rpc GetRetryPolicy(GetRetryPolicyRequest) returns (GetRetryPolicyResponse);
  rpc UpdateRetryPolicy(UpdateRetryPolicyRequest) returns (UpdateRetryPolicyResponse);
  rpc TestRetryPolicy(TestRetryPolicyRequest) returns (TestRetryPolicyResponse);
  
  // Subscription Status and Health
  rpc GetSubscriptionStatus(GetSubscriptionStatusRequest) returns (GetSubscriptionStatusResponse);
  rpc HealthCheckSubscription(HealthCheckSubscriptionRequest) returns (HealthCheckSubscriptionResponse);
  rpc GetSubscriptionMetrics(GetSubscriptionMetricsRequest) returns (GetSubscriptionMetricsResponse);
  
  // Subscription Validation
  rpc ValidateSubscription(ValidateSubscriptionRequest) returns (ValidateSubscriptionResponse);
  rpc TestSubscription(TestSubscriptionRequest) returns (TestSubscriptionResponse);
  rpc GetValidationResults(GetValidationResultsRequest) returns (GetValidationResultsResponse);
  
  // Subscription Templates
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc ApplyTemplate(ApplyTemplateRequest) returns (ApplyTemplateResponse);
  
  // Subscription Lifecycle
  rpc ActivateSubscription(ActivateSubscriptionRequest) returns (ActivateSubscriptionResponse);
  rpc DeactivateSubscription(DeactivateSubscriptionRequest) returns (DeactivateSubscriptionResponse);
  rpc SuspendSubscription(SuspendSubscriptionRequest) returns (SuspendSubscriptionResponse);
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (ResumeSubscriptionResponse);
  
  // Subscription Monitoring
  rpc EnableMonitoring(EnableMonitoringRequest) returns (EnableMonitoringResponse);
  rpc DisableMonitoring(DisableMonitoringRequest) returns (DisableMonitoringResponse);
  rpc ConfigureAlerts(ConfigureAlertsRequest) returns (ConfigureAlertsResponse);
  rpc GetAlertConfiguration(GetAlertConfigurationRequest) returns (GetAlertConfigurationResponse);
}

// Create Subscription Request
message CreateSubscriptionRequest {
  integrations.webhooks.messages.WebhookSubscriptionBasicInfo basic_info = 1;
  integrations.webhooks.messages.WebhookSubscriptionConfiguration configuration = 2;
  integrations.webhooks.messages.WebhookEndpoint endpoint = 3;
  integrations.webhooks.messages.WebhookSecurity security = 4;
  integrations.webhooks.messages.WebhookEventFilter event_filter = 5;
  integrations.webhooks.messages.WebhookRetryConfiguration retry_config = 6;
  bool auto_configure = 7;
  string template_id = 8;
}

// Create Subscription Response
message CreateSubscriptionResponse {
  string subscription_id = 1;
  integrations.webhooks.messages.WebhookSubscription subscription = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated string configuration_steps = 4;
  repeated string next_steps = 5;
}

// Get Subscription Request
message GetSubscriptionRequest {
  string subscription_id = 1;
  bool include_sensitive_data = 2;
  bool include_metrics = 3;
}

// Get Subscription Response
message GetSubscriptionResponse {
  integrations.webhooks.messages.WebhookSubscription subscription = 1;
}

// Update Subscription Request
message UpdateSubscriptionRequest {
  string subscription_id = 1;
  integrations.webhooks.messages.WebhookSubscriptionBasicInfo basic_info = 2;
  integrations.webhooks.messages.WebhookSubscriptionConfiguration configuration = 3;
  integrations.webhooks.messages.WebhookEndpoint endpoint = 4;
  integrations.webhooks.messages.WebhookSecurity security = 5;
  integrations.webhooks.messages.WebhookEventFilter event_filter = 6;
  integrations.webhooks.messages.WebhookRetryConfiguration retry_config = 7;
  bool update_configuration = 8;
}

// Update Subscription Response
message UpdateSubscriptionResponse {
  string subscription_id = 1;
  integrations.webhooks.messages.WebhookSubscription subscription = 2;
  google.protobuf.Timestamp updated_at = 3;
  repeated string changes = 4;
}

