  integrations.webhooks.messages.WebhookSubscriptionConfiguration configuration = 2;
  bool validate_configuration = 3;
}

// Configure Subscription Response
message ConfigureSubscriptionResponse {
  string subscription_id = 1;
  bool configured = 2;
  repeated string configuration_errors = 3;
  repeated string configuration_warnings = 4;
  google.protobuf.Timestamp configured_at = 5;
}

// Get Subscription Configuration Request
message GetSubscriptionConfigurationRequest {
  string subscription_id = 1;
  bool include_sensitive_data = 2;
}

// Get Subscription Configuration Response
message GetSubscriptionConfigurationResponse {
  integrations.webhooks.messages.WebhookSubscriptionConfiguration configuration = 1;
}

// Update Subscription Configuration Request
message UpdateSubscriptionConfigurationRequest {
  string subscription_id = 1;
  integrations.webhooks.messages.WebhookSubscriptionConfiguration configuration = 2;
  bool validate_configuration = 3;
}

// Update Subscription Configuration Response
message UpdateSubscriptionConfigurationResponse {
  string subscription_id = 1;
  bool updated = 2;
  repeated string configuration_errors = 3;
  repeated string configuration_warnings = 4;
  google.protobuf.Timestamp updated_at = 5;
}

