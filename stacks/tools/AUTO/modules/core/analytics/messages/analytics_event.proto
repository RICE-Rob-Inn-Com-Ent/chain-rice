syntax = "proto3";

package core.analytics.messages;

import "core/common/messages/timestamp.proto"; // core.common.messages.Timestamp
import "core/common/messages/location.proto";   // core.common.messages.Location

// AnalyticsEvent represents a single analytics instrumentation event.
message AnalyticsEvent {
  // Unique event identifier.
  string id = 1;

  // Event name, e.g., "user_signup", "purchase_completed".
  string name = 2;

  // Source system or application identifier.
  string source = 3;

  // The user id if the event is associated with a known user.
  string user_id = 4;

  // Anonymous session id for unauthenticated users.
  string session_id = 5;

  // The timestamp when the event occurred.
  core.common.messages.Timestamp occurred_at = 6;

  // Geographic and device context of the event.
  Context context = 7;

  // Key-value properties describing the event payload.
  map<string, string> properties = 8;

  // Monetary value if the event represents a transaction.
  double value = 9;

  // Currency code ISO-4217 if value is set.
  string currency = 10;

  // Nested types
  message Context {
    string ip = 1;                    // IP address at the time of event.
    string user_agent = 2;            // Raw user agent string.
    core.common.messages.Location location = 3; // Parsed location.
    string device_id = 4;             // Device identifier if available.
    string platform = 5;              // e.g., "ios", "android", "web".
    string app_version = 6;           // Client app version.
  }
}


