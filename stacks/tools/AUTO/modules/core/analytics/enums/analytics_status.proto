syntax = "proto3";

package core.analytics.enums;

// AnalyticsStatus represents the lifecycle state of analytics jobs/reports.
enum AnalyticsStatus {
  // Default unspecified status.
  ANALYTICS_STATUS_UNSPECIFIED = 0;

  // Report/job created but not yet executed.
  ANALYTICS_STATUS_DRAFT = 1;

  // Scheduled for execution at a future time.
  ANALYTICS_STATUS_SCHEDULED = 2;

  // Currently executing.
  ANALYTICS_STATUS_RUNNING = 3;

  // Successfully completed.
  ANALYTICS_STATUS_COMPLETED = 4;

  // Execution failed.
  ANALYTICS_STATUS_FAILED = 5;

  // Execution intentionally cancelled.
  ANALYTICS_STATUS_CANCELLED = 6;

  // Temporarily paused and can be resumed.
  ANALYTICS_STATUS_PAUSED = 7;
}


