syntax = "proto3";

package core.analytics.enums;

// MetricType defines supported analytics metrics.
enum MetricType {
  // Unspecified metric type.
  METRIC_TYPE_UNSPECIFIED = 0;

  // Count of events/users/sessions.
  METRIC_TYPE_COUNT = 1;

  // Unique users.
  METRIC_TYPE_UNIQUES = 2;

  // Average value across events.
  METRIC_TYPE_AVERAGE = 3;

  // Sum of numeric values.
  METRIC_TYPE_SUM = 4;

  // Minimum value.
  METRIC_TYPE_MIN = 5;

  // Maximum value.
  METRIC_TYPE_MAX = 6;

  // Median value.
  METRIC_TYPE_MEDIAN = 7;

  // Percentile (e.g., p90, p95).
  METRIC_TYPE_PERCENTILE = 8;

  // Conversion rate percentage.
  METRIC_TYPE_CONVERSION_RATE = 9;

  // Retention percentage.
  METRIC_TYPE_RETENTION_RATE = 10;

  // Revenue in Money.
  METRIC_TYPE_REVENUE = 11;

  // Duration (e.g., session time) in milliseconds.
  METRIC_TYPE_DURATION_MS = 12;
}


