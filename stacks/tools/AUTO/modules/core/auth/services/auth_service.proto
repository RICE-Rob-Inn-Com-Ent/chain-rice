syntax = "proto3";

package core.auth.services;

import "core/auth/messages/user.proto";
import "core/auth/messages/auth_request.proto";
import "core/auth/messages/auth_response.proto";

// AuthService provides user management and authentication flows.
service AuthService {
  // Authenticate a user using a specific flow.
  rpc Authenticate(core.auth.messages.AuthRequest) returns (core.auth.messages.AuthResponse);

  // CRUD for users
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Verify an access token and return the user summary.
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
}

// Requests and responses

message CreateUserRequest {
  core.auth.messages.User user = 1; // User definition.
  string password = 2;              // Initial password (if applicable).
}

message CreateUserResponse {
  core.auth.messages.User user = 1; // Created user with id.
}

message GetUserRequest {
  string id = 1; // User id.
}

message GetUserResponse {
  core.auth.messages.User user = 1; // User.
}

message UpdateUserRequest {
  core.auth.messages.User user = 1; // Full or partial user; server may merge.
}

message UpdateUserResponse {
  core.auth.messages.User user = 1; // Updated user.
}

message DeleteUserRequest {
  string id = 1; // User id to delete.
}

message DeleteUserResponse {
  bool success = 1; // Whether deletion was successful.
}

message ListUsersRequest {
  int32 page_size = 1;   // Page size.
  string page_token = 2; // Page token.
  string query = 3;      // Search over display_name/email.
}

message ListUsersResponse {
  repeated core.auth.messages.User users = 1; // Page of users.
  string next_page_token = 2; // Token for next page, if any.
}

message VerifyTokenRequest {
  string access_token = 1; // Access token to verify.
}

message VerifyTokenResponse {
  bool valid = 1;                      // True if token is valid.
  core.auth.messages.AuthResponse.UserSummary user = 2; // User summary when valid.
}


