syntax = "proto3";

package core.auth.messages;

import "core/auth/enums/user_role.proto";
import "core/common/messages/timestamp.proto";
import "core/common/messages/location.proto";

// User represents an account within the system.
message User {
  // Unique user id.
  string id = 1;

  // Primary email address.
  string email = 2;

  // Display name for UI.
  string display_name = 3;

  // Assigned roles for authorization.
  repeated core.auth.enums.UserRole roles = 4;

  // Whether the user is active.
  bool active = 5;

  // Account creation timestamp.
  core.common.messages.Timestamp created_at = 6;

  // Last update timestamp.
  core.common.messages.Timestamp updated_at = 7;

  // Last login timestamp, if any.
  core.common.messages.Timestamp last_login_at = 8;

  // Profile struct with optional public details.
  Profile profile = 9;

  // Arbitrary metadata key/value pairs.
  map<string, string> metadata = 10;

  // Nested types
  message Profile {
    string first_name = 1; // Given name.
    string last_name = 2;  // Family name.
    string avatar_url = 3; // URL to profile picture.
    core.common.messages.Location location = 4; // Declared location.
    string timezone = 5;   // IANA timezone id.
    string preferred_language = 6; // BCP-47 language tag.
  }
}


