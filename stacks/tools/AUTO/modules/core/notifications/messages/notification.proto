syntax = "proto3";

package core.notifications.messages;

import "core/notifications/enums/notification_type.proto";
import "core/notifications/enums/notification_status.proto";
import "core/notifications/enums/priority_level.proto";
import "core/common/messages/timestamp.proto";

// Notification represents a message to be delivered via a channel.
message Notification {
  string id = 1; // Notification id.
  string tenant_id = 2; // Tenant/organization id.
  string template_id = 3; // Template identifier.
  string subject = 4; // Subject/title when applicable.
  string body = 5; // Body content or rendered template output.
  core.notifications.enums.NotificationType type = 6; // Delivery type.
  core.notifications.enums.PriorityLevel priority = 7; // Priority level.
  core.notifications.enums.NotificationStatus status = 8; // Lifecycle state.
  repeated string recipients = 9; // Recipient identifiers (emails, phones, tokens).
  map<string, string> data = 10; // Template data variables.
  core.common.messages.Timestamp created_at = 11; // Creation time.
  core.common.messages.Timestamp updated_at = 12; // Last update time.
  core.common.messages.Timestamp sent_at = 13; // When sent to provider.
  core.common.messages.Timestamp delivered_at = 14; // When delivery confirmed.
}


