syntax = "proto3";

package crm_hr.crm.messages;

import "google/protobuf/timestamp.proto";
import "crm_hr/crm/enums/crm_priority.proto";

option go_package = "github.com/rice-dev/crm-hr/crm/messages";

// CrmNote represents a note or comment in the CRM system
message CrmNote {
  // Unique identifier for the note
  string id = 1;
  
  // Content of the note
  string content = 2;
  
  // Type of note (e.g., "general", "call", "email", "meeting", "task")
  string note_type = 3;
  
  // Priority level of the note
  crm_hr.crm.enums.CrmPriority priority = 4;
  
  // Whether the note is private (only visible to creator)
  bool is_private = 5;
  
  // Whether the note is pinned (shown prominently)
  bool is_pinned = 6;
  
  // Author of the note
  string author_id = 7;
  
  // Associated entity (deal, customer, etc.)
  string entity_id = 8;
  
  // Type of associated entity (e.g., "deal", "customer", "pipeline")
  string entity_type = 9;
  
  // Tags for categorization
  repeated string tags = 10;
  
  // Attachments associated with the note
  repeated NoteAttachment attachments = 11;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp deleted_at = 14;
  
  // Version for optimistic concurrency control
  int32 version = 15;
}

// NoteAttachment represents a file attachment to a note
message NoteAttachment {
  // Unique identifier for the attachment
  string id = 1;
  
  // Associated note ID
  string note_id = 1;
  
  // Original filename
  string filename = 2;
  
  // MIME type of the file
  string mime_type = 3;
  
  // File size in bytes
  int64 size_bytes = 4;
  
  // URL or path to the file
  string file_url = 5;
  
  // Whether the file is publicly accessible
  bool is_public = 6;
  
  // Upload timestamp
  google.protobuf.Timestamp uploaded_at = 7;
  
  // User who uploaded the file
  string uploaded_by = 8;
}

// NoteTemplate represents a reusable template for creating notes
message NoteTemplate {
  // Unique identifier for the template
  string id = 1;
  
  // Name of the template
  string name = 2;
  
  // Description of the template
  string description = 3;
  
  // Template content with placeholders
  string content_template = 4;
  
  // Type of note this template is for
  string note_type = 5;
  
  // Whether the template is active
  bool is_active = 6;
  
  // Creator of the template
  string created_by = 7;
  
  // Team or department this template belongs to
  string team_id = 8;
  
  // Tags for categorization
  repeated string tags = 9;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}
