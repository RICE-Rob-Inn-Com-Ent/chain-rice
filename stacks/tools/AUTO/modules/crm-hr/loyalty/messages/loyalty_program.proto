syntax = "proto3";

package crm_hr.loyalty.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";
import "crm_hr/loyalty/enums/loyalty_tier.proto";
import "crm_hr/loyalty/enums/loyalty_status.proto";

option go_package = "github.com/rice-dev/crm-hr/loyalty/messages";

// LoyaltyProgram represents a loyalty program in the system
message LoyaltyProgram {
  // Unique identifier for the loyalty program
  string id = 1;
  
  // Program information
  string name = 2;
  string description = 3;
  string program_type = 4; // points, tiered, cashback, hybrid
  crm_hr.loyalty.enums.LoyaltyStatus status = 5;
  
  // Program configuration
  string currency = 6;
  string point_name = 7; // e.g., "miles", "stars", "points"
  double point_value = 8; // value of 1 point in currency
  int32 points_per_dollar = 9; // points earned per dollar spent
  double minimum_redemption = 10; // minimum points required for redemption
  
  // Program tiers
  repeated LoyaltyTier tiers = 11;
  string default_tier = 12;
  
  // Program rules
  LoyaltyRules rules = 13;
  LoyaltyBenefits benefits = 14;
  
  // Program lifecycle
  google.protobuf.Timestamp start_date = 15;
  google.protobuf.Timestamp end_date = 16;
  bool is_active = 17;
  bool is_public = 18;
  
  // Program metadata
  string created_by = 19;
  string team_id = 20;
  repeated string tags = 21;
  map<string, string> custom_fields = 22;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp updated_at = 24;
  
  // Version for optimistic concurrency control
  int32 version = 25;
}

// LoyaltyTier represents a tier within a loyalty program
message LoyaltyTier {
  // Unique identifier for the tier
  string id = 1;
  
  // Associated program ID
  string program_id = 2;
  
  // Tier information
  crm_hr.loyalty.enums.LoyaltyTier tier_level = 3;
  string name = 4;
  string description = 5;
  int32 order = 6; // tier order (0 = lowest)
  
  // Tier requirements
  int32 minimum_points = 7;
  google.protobuf.Money minimum_spend = 8;
  int32 minimum_visits = 9;
  google.protobuf.Timestamp minimum_membership_duration = 10;
  
  // Tier benefits
  double point_multiplier = 11; // multiplier for earning points
  double discount_percentage = 12;
  google.protobuf.Money bonus_points = 13;
  repeated string exclusive_benefits = 14;
  
  // Tier lifecycle
  bool is_active = 15;
  google.protobuf.Timestamp effective_start_date = 16;
  google.protobuf.Timestamp effective_end_date = 17;
  
  // Additional information
  string color = 18; // hex color for UI
  string icon_url = 19;
  string badge_url = 20;
  map<string, string> custom_fields = 21;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
}

// LoyaltyRules represents the rules for a loyalty program
message LoyaltyRules {
  // Associated program ID
  string program_id = 1;
  
  // Earning rules
  bool allow_point_earning = 2;
  double maximum_points_per_transaction = 3;
  double maximum_points_per_day = 4;
  double maximum_points_per_month = 5;
  repeated string eligible_categories = 6;
  repeated string excluded_categories = 7;
  
  // Redemption rules
  bool allow_point_redemption = 8;
  double minimum_redemption_amount = 9;
  double maximum_redemption_amount = 10;
  double redemption_fee = 11;
  repeated string redemption_categories = 12;
  
  // Expiration rules
  bool points_expire = 13;
  int32 points_expiration_days = 14;
  google.protobuf.Timestamp points_expiration_date = 15;
  
  // Transfer rules
  bool allow_point_transfer = 16;
  bool allow_point_gift = 17;
  double transfer_fee = 18;
  double gift_fee = 19;
  
  // Tier rules
  bool allow_tier_downgrade = 20;
  int32 tier_downgrade_grace_period_days = 21;
  bool allow_tier_upgrade = 22;
  bool allow_tier_skip = 23;
  
  // Additional rules
  bool require_verification = 24;
  bool allow_multiple_accounts = 25;
  bool allow_family_sharing = 26;
  int32 maximum_family_members = 27;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 28;
  google.protobuf.Timestamp updated_at = 29;
}

// LoyaltyBenefits represents the benefits for a loyalty program
message LoyaltyBenefits {
  // Associated program ID
  string program_id = 1;
  
  // Point benefits
  double welcome_bonus_points = 2;
  double birthday_bonus_points = 3;
  double anniversary_bonus_points = 4;
  double referral_bonus_points = 5;
  double social_media_bonus_points = 6;
  
  // Discount benefits
  double welcome_discount_percentage = 7;
  double birthday_discount_percentage = 8;
  double anniversary_discount_percentage = 9;
  double tier_discount_percentage = 10;
  
  // Service benefits
  bool free_shipping = 11;
  bool priority_support = 12;
  bool early_access = 13;
  bool exclusive_products = 14;
  bool personal_concierge = 15;
  
  // Experience benefits
  bool exclusive_events = 16;
  bool vip_treatment = 17;
  bool extended_warranty = 18;
  bool free_installation = 19;
  bool priority_booking = 20;
  
  // Digital benefits
  bool digital_coupons = 21;
  bool digital_gift_cards = 22;
  bool digital_content = 23;
  bool software_licenses = 24;
  
  // Travel benefits
  bool airline_miles = 25;
  bool hotel_points = 26;
  bool car_rental_credit = 27;
  bool travel_insurance = 28;
  
  // Lifestyle benefits
  bool dining_credit = 29;
  bool entertainment_tickets = 30;
  bool fitness_membership = 31;
  bool beauty_services = 32;
  
  // Charitable benefits
  bool donation_match = 33;
  bool charity_points = 34;
  bool volunteer_hours = 35;
  bool social_impact = 36;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 37;
  google.protobuf.Timestamp updated_at = 38;
}

// LoyaltyProgramMetrics represents metrics for a loyalty program
message LoyaltyProgramMetrics {
  // Associated program ID
  string program_id = 1;
  
  // Member metrics
  int32 total_members = 2;
  int32 active_members = 3;
  int32 new_members_this_month = 4;
  int32 churned_members_this_month = 5;
  double member_retention_rate = 6;
  
  // Point metrics
  double total_points_earned = 7;
  double total_points_redeemed = 8;
  double total_points_expired = 9;
  double average_points_per_member = 10;
  double points_redemption_rate = 11;
  
  // Financial metrics
  google.protobuf.Money total_program_cost = 12;
  google.protobuf.Money total_program_revenue = 13;
  google.protobuf.Money average_revenue_per_member = 14;
  double program_roi = 15;
  
  // Engagement metrics
  double average_engagement_score = 16;
  double average_visit_frequency = 17;
  double average_transaction_value = 18;
  double average_lifetime_value = 19;
  
  // Tier distribution
  map<string, int32> members_by_tier = 20;
  map<string, double> revenue_by_tier = 21;
  map<string, double> points_by_tier = 22;
  
  // Calculated at timestamp
  google.protobuf.Timestamp calculated_at = 23;
}
