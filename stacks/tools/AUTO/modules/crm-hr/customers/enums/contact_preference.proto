syntax = "proto3";

package crm_hr.customers.enums;

option go_package = "github.com/rice-dev/crm-hr/customers/enums";

// ContactPreference represents how a customer prefers to be contacted
enum ContactPreference {
  // Unspecified preference - should not be used in production
  CONTACT_PREFERENCE_UNSPECIFIED = 0;
  
  // Communication methods
  EMAIL = 1;
  PHONE = 2;
  SMS = 3;
  MAIL = 4;
  
  // Digital channels
  IN_APP = 5;
  PUSH_NOTIFICATION = 6;
  WEB_PUSH = 7;
  
  // Social media
  LINKEDIN = 8;
  TWITTER = 9;
  FACEBOOK = 10;
  INSTAGRAM = 11;
  
  // Business hours preferences
  BUSINESS_HOURS_ONLY = 12;
  ANYTIME = 13;
  WEEKDAYS_ONLY = 14;
  WEEKENDS_OK = 15;
  
  // Frequency preferences
  DAILY = 16;
  WEEKLY = 17;
  MONTHLY = 18;
  QUARTERLY = 19;
  AS_NEEDED = 20;
  NEVER = 21;
}
