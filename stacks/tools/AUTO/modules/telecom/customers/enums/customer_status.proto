syntax = "proto3";

package telecom.customers.enums;

// CustomerStatus represents the current state of a customer account
enum CustomerStatus {
  // Unspecified status - should not be used in production
  CUSTOMER_STATUS_UNSPECIFIED = 0;
  
  // Customer account is active and operational
  ACTIVE = 1;
  
  // Customer account is suspended temporarily
  SUSPENDED = 2;
  
  // Customer account has been cancelled
  CANCELLED = 3;
  
  // Customer account is pending activation
  PENDING = 4;
  
  // Customer account is under review
  UNDER_REVIEW = 5;
  
  // Customer account is blocked due to fraud or policy violation
  BLOCKED = 6;
  
  // Customer account is in grace period
  GRACE_PERIOD = 7;
  
  // Customer account is dormant (no activity for extended period)
  DORMANT = 8;
  
  // Customer account is archived
  ARCHIVED = 9;
}
