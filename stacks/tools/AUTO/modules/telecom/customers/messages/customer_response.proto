syntax = "proto3";

package telecom.customers.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/string_value.proto";
import "google/protobuf/double_value.proto";
import "telecom/customers/enums/customer_status.proto";
import "telecom/customers/enums/customer_type.proto";

// Customer represents a customer entity
message Customer {
  // Unique identifier for the customer
  string customer_id = 1;
  
  // Customer's full name
  string name = 2;
  
  // Customer's email address
  string email = 3;
  
  // Customer's phone number
  string phone = 4;
  
  // Customer type classification
  telecom.customers.enums.CustomerType type = 5;
  
  // Current customer status
  telecom.customers.enums.CustomerStatus status = 6;
  
  // Customer's date of birth (for individual customers)
  google.protobuf.Timestamp date_of_birth = 7;
  
  // Customer's address information
  Address address = 8;
  
  // Customer's billing preferences
  BillingPreferences billing_preferences = 9;
  
  // Customer's communication preferences
  CommunicationPreferences communication_preferences = 10;
  
  // Notes about the customer
  google.protobuf.StringValue notes = 11;
  
  // Company information (for business customers)
  CompanyInfo company_info = 12;
  
  // Customer's preferred language
  google.protobuf.StringValue preferred_language = 13;
  
  // Customer's timezone
  google.protobuf.StringValue timezone = 14;
  
  // Date when the customer account was created
  google.protobuf.Timestamp created_at = 15;
  
  // Date when the customer account was last updated
  google.protobuf.Timestamp updated_at = 16;
  
  // Date when the customer account was last accessed
  google.protobuf.Timestamp last_accessed_at = 17;
}

// CreateCustomerResponse represents the response after creating a customer
message CreateCustomerResponse {
  // The created customer
  Customer customer = 1;
  
  // Success message
  string message = 2;
}

// UpdateCustomerResponse represents the response after updating a customer
message UpdateCustomerResponse {
  // The updated customer
  Customer customer = 1;
  
  // Success message
  string message = 2;
}

// GetCustomerResponse represents the response after retrieving a customer
message GetCustomerResponse {
  // The retrieved customer
  Customer customer = 1;
}

// ListCustomersResponse represents the response after listing customers
message ListCustomersResponse {
  // List of customers matching the criteria
  repeated Customer customers = 1;
  
  // Total count of customers matching the criteria
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Page size used
  int32 page_size = 4;
  
  // Total number of pages available
  int32 total_pages = 5;
}

// DeleteCustomerResponse represents the response after deleting a customer
message DeleteCustomerResponse {
  // Success message
  string message = 1;
  
  // Deletion timestamp
  google.protobuf.Timestamp deleted_at = 2;
}

// Address represents a customer's address information
message Address {
  // Street address line 1
  string street_address_1 = 1;
  
  // Street address line 2 (optional)
  google.protobuf.StringValue street_address_2 = 2;
  
  // City
  string city = 3;
  
  // State or province
  string state_province = 4;
  
  // Postal or ZIP code
  string postal_code = 5;
  
  // Country code (ISO 3166-1 alpha-2)
  string country_code = 6;
  
  // Address type (home, business, billing, shipping)
  google.protobuf.StringValue address_type = 7;
}

// BillingPreferences represents customer's billing preferences
message BillingPreferences {
  // Preferred billing cycle (monthly, quarterly, annually)
  string billing_cycle = 1;
  
  // Preferred payment method
  string payment_method = 2;
  
  // Auto-pay enabled
  bool auto_pay_enabled = 3;
  
  // Billing email (if different from primary email)
  google.protobuf.StringValue billing_email = 4;
  
  // Paperless billing preference
  bool paperless_billing = 5;
  
  // Invoice delivery method (email, mail, portal)
  string delivery_method = 6;
}

// CommunicationPreferences represents customer's communication preferences
message CommunicationPreferences {
  // Marketing emails enabled
  bool marketing_emails = 1;
  
  // SMS notifications enabled
  bool sms_notifications = 2;
  
  // Service updates enabled
  bool service_updates = 3;
  
  // Promotional offers enabled
  bool promotional_offers = 4;
  
  // Preferred communication channel
  string preferred_channel = 5;
  
  // Do not call list
  bool do_not_call = 6;
}

// CompanyInfo represents company information for business customers
message CompanyInfo {
  // Company name
  string company_name = 1;
  
  // Company registration number
  google.protobuf.StringValue registration_number = 2;
  
  // Tax ID or VAT number
  google.protobuf.StringValue tax_id = 3;
  
  // Industry or sector
  google.protobuf.StringValue industry = 4;
  
  // Company size (number of employees)
  google.protobuf.DoubleValue company_size = 5;
  
  // Website URL
  google.protobuf.StringValue website = 6;
  
  // Company description
  google.protobuf.StringValue description = 7;
}

// CustomerSummary represents a summary view of customer information
message CustomerSummary {
  // Customer ID
  string customer_id = 1;
  
  // Customer name
  string name = 2;
  
  // Customer email
  string email = 3;
  
  // Customer type
  telecom.customers.enums.CustomerType type = 4;
  
  // Customer status
  telecom.customers.enums.CustomerStatus status = 5;
  
  // Number of active subscriptions
  int32 active_subscriptions = 6;
  
  // Total monthly revenue
  int64 monthly_revenue = 7;
  
  // Last activity date
  google.protobuf.Timestamp last_activity = 8;
  
  // Customer since date
  google.protobuf.Timestamp customer_since = 9;
}
