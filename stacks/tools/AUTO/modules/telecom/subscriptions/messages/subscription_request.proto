syntax = "proto3";

package telecom.subscriptions.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/string_value.proto";
import "google/protobuf/double_value.proto";
import "telecom/subscriptions/enums/subscription_plan.proto";
import "telecom/subscriptions/enums/subscription_status.proto";

// CreateSubscriptionRequest represents a request to create a new subscription
message CreateSubscriptionRequest {
  // Customer ID for whom the subscription is being created
  string customer_id = 1;
  
  // Subscription plan type
  telecom.subscriptions.enums.SubscriptionPlan plan = 2;
  
  // Initial status of the subscription
  telecom.subscriptions.enums.SubscriptionStatus status = 3;
  
  // Start date for the subscription
  google.protobuf.Timestamp start_date = 4;
  
  // End date for the subscription (optional for indefinite subscriptions)
  google.protobuf.Timestamp end_date = 5;
  
  // Billing cycle (monthly, quarterly, annually)
  string billing_cycle = 6;
  
  // Subscription price (in the smallest currency unit)
  int64 price = 7;
  
  // Currency code (ISO 4217 format)
  string currency = 8;
  
  // Auto-renewal enabled
  bool auto_renewal = 9;
  
  // Subscription features and limits
  SubscriptionFeatures features = 10;
  
  // Optional notes about the subscription
  google.protobuf.StringValue notes = 11;
  
  // Promotional code used (if any)
  google.protobuf.StringValue promotional_code = 12;
  
  // Trial period in days (if applicable)
  google.protobuf.DoubleValue trial_period_days = 13;
}

// UpdateSubscriptionRequest represents a request to update an existing subscription
message UpdateSubscriptionRequest {
  // Subscription ID to update
  string subscription_id = 1;
  
  // Optional new plan
  telecom.subscriptions.enums.SubscriptionPlan plan = 2;
  
  // Optional new status
  telecom.subscriptions.enums.SubscriptionStatus status = 3;
  
  // Optional new end date
  google.protobuf.Timestamp end_date = 4;
  
  // Optional new billing cycle
  google.protobuf.StringValue billing_cycle = 5;
  
  // Optional new price
  google.protobuf.DoubleValue price = 6;
  
  // Optional auto-renewal setting
  google.protobuf.StringValue auto_renewal = 7;
  
  // Optional new features
  SubscriptionFeatures features = 8;
  
  // Optional new notes
  google.protobuf.StringValue notes = 9;
}

// GetSubscriptionRequest represents a request to retrieve a specific subscription
message GetSubscriptionRequest {
  // Subscription ID to retrieve
  string subscription_id = 1;
}

// ListSubscriptionsRequest represents a request to list subscriptions with filtering
message ListSubscriptionsRequest {
  // Customer ID to filter by (optional)
  google.protobuf.StringValue customer_id = 1;
  
  // Plan to filter by (optional)
  telecom.subscriptions.enums.SubscriptionPlan plan = 2;
  
  // Status to filter by (optional)
  telecom.subscriptions.enums.SubscriptionStatus status = 3;
  
  // Date range for subscription start (optional)
  google.protobuf.Timestamp start_date_after = 4;
  google.protobuf.Timestamp start_date_before = 5;
  
  // Page number for pagination (starts from 1)
  int32 page = 6;
  
  // Page size for pagination (max 100)
  int32 page_size = 7;
}

// DeleteSubscriptionRequest represents a request to delete a subscription
message DeleteSubscriptionRequest {
  // Subscription ID to delete
  string subscription_id = 1;
  
  // Reason for deletion
  google.protobuf.StringValue reason = 2;
  
  // Effective date for deletion
  google.protobuf.Timestamp effective_date = 3;
}

// CancelSubscriptionRequest represents a request to cancel a subscription
message CancelSubscriptionRequest {
  // Subscription ID to cancel
  string subscription_id = 1;
  
  // Cancellation reason
  google.protobuf.StringValue reason = 2;
  
  // Whether to cancel immediately or at end of billing period
  bool cancel_immediately = 3;
  
  // Effective date for cancellation
  google.protobuf.Timestamp effective_date = 4;
}

// RenewSubscriptionRequest represents a request to renew a subscription
message RenewSubscriptionRequest {
  // Subscription ID to renew
  string subscription_id = 1;
  
  // New end date for renewal
  google.protobuf.Timestamp new_end_date = 2;
  
  // Optional new plan for renewal
  telecom.subscriptions.enums.SubscriptionPlan new_plan = 3;
  
  // Whether to extend current plan or upgrade/downgrade
  bool extend_current_plan = 4;
}

// SuspendSubscriptionRequest represents a request to suspend a subscription
message SuspendSubscriptionRequest {
  // Subscription ID to suspend
  string subscription_id = 1;
  
  // Suspension reason
  google.protobuf.StringValue reason = 2;
  
  // Suspension duration in days (optional, indefinite if not specified)
  google.protobuf.DoubleValue duration_days = 3;
  
  // Effective date for suspension
  google.protobuf.Timestamp effective_date = 4;
}

// ResumeSubscriptionRequest represents a request to resume a suspended subscription
message ResumeSubscriptionRequest {
  // Subscription ID to resume
  string subscription_id = 1;
  
  // Effective date for resumption
  google.protobuf.Timestamp effective_date = 2;
  
  // Optional notes about resumption
  google.protobuf.StringValue notes = 3;
}

// SubscriptionFeatures represents the features and limits of a subscription
message SubscriptionFeatures {
  // Data allowance in GB (for data plans)
  google.protobuf.DoubleValue data_allowance_gb = 1;
  
  // Voice minutes allowance (for voice plans)
  google.protobuf.DoubleValue voice_minutes = 2;
  
  // SMS allowance (for SMS plans)
  google.protobuf.DoubleValue sms_allowance = 3;
  
  // Number of devices allowed
  google.protobuf.DoubleValue device_limit = 4;
  
  // Whether international roaming is included
  bool international_roaming = 5;
  
  // Whether hotspot/tethering is allowed
  bool hotspot_allowed = 6;
  
  // Whether premium features are included
  bool premium_features = 7;
  
  // Maximum number of users (for family/business plans)
  google.protobuf.DoubleValue user_limit = 8;
  
  // Additional feature flags
  repeated string additional_features = 9;
}
