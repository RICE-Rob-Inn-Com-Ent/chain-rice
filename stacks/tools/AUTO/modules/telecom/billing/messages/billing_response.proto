syntax = "proto3";

package telecom.billing.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";
import "telecom/billing/enums/invoice_status.proto";
import "telecom/billing/enums/payment_method.proto";

// Invoice represents a billing invoice entity
message Invoice {
  // Unique identifier for the invoice
  string invoice_id = 1;
  
  // Customer ID for whom the invoice was created
  string customer_id = 2;
  
  // Total amount of the invoice (in the smallest currency unit)
  int64 amount = 3;
  
  // Currency code (ISO 4217 format)
  string currency = 4;
  
  // Current status of the invoice
  telecom.billing.enums.InvoiceStatus status = 5;
  
  // Description of the invoice
  string description = 6;
  
  // Date when the invoice was created
  google.protobuf.Timestamp created_at = 7;
  
  // Due date for the invoice
  google.protobuf.Timestamp due_date = 8;
  
  // Date when the invoice was paid (if applicable)
  google.protobuf.Timestamp paid_at = 9;
  
  // Payment method used for payment (if applicable)
  telecom.billing.enums.PaymentMethod payment_method = 10;
  
  // Payment reference or transaction ID (if applicable)
  google.protobuf.StringValue payment_reference = 11;
  
  // Optional notes for the invoice
  google.protobuf.StringValue notes = 12;
  
  // Optional tax amount (in the smallest currency unit)
  google.protobuf.DoubleValue tax_amount = 13;
  
  // Line items for detailed billing
  repeated InvoiceLineItem line_items = 14;
  
  // Date when the invoice was last updated
  google.protobuf.Timestamp updated_at = 15;
}

// CreateInvoiceResponse represents the response after creating an invoice
message CreateInvoiceResponse {
  // The created invoice
  Invoice invoice = 1;
  
  // Success message
  string message = 2;
}

// UpdateInvoiceResponse represents the response after updating an invoice
message UpdateInvoiceResponse {
  // The updated invoice
  Invoice invoice = 1;
  
  // Success message
  string message = 2;
}

// GetInvoiceResponse represents the response after retrieving an invoice
message GetInvoiceResponse {
  // The retrieved invoice
  Invoice invoice = 1;
}

// ListInvoicesResponse represents the response after listing invoices
message ListInvoicesResponse {
  // List of invoices matching the criteria
  repeated Invoice invoices = 1;
  
  // Total count of invoices matching the criteria
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Page size used
  int32 page_size = 4;
  
  // Total number of pages available
  int32 total_pages = 5;
}

// DeleteInvoiceResponse represents the response after deleting an invoice
message DeleteInvoiceResponse {
  // Success message
  string message = 1;
}

// ProcessPaymentResponse represents the response after processing a payment
message ProcessPaymentResponse {
  // The updated invoice after payment processing
  Invoice invoice = 1;
  
  // Payment confirmation ID
  string payment_confirmation_id = 2;
  
  // Success message
  string message = 3;
  
  // Payment processing timestamp
  google.protobuf.Timestamp processed_at = 4;
}

// InvoiceLineItem represents a detailed line item within an invoice
message InvoiceLineItem {
  // Description of the line item
  string description = 1;
  
  // Quantity of the item
  double quantity = 2;
  
  // Unit price (in the smallest currency unit)
  int64 unit_price = 3;
  
  // Total amount for this line item (quantity * unit_price)
  int64 total_amount = 4;
  
  // Optional tax rate for this line item (as percentage)
  google.protobuf.DoubleValue tax_rate = 5;
}
