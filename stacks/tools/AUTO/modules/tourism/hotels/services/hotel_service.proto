syntax = "proto3";

package tourism.hotels.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";
import "tourism/hotels/messages/hotel_request.proto";
import "tourism/hotels/messages/hotel_response.proto";
import "tourism/hotels/enums/room_type.proto";
import "tourism/hotels/enums/hotel_rating.proto";

// HotelService provides comprehensive hotel management functionality
service HotelService {
  // Create a new hotel
  rpc CreateHotel(CreateHotelRequest) returns (CreateHotelResponse);
  
  // Retrieve a specific hotel by ID
  rpc GetHotel(GetHotelRequest) returns (GetHotelResponse);
  
  // List hotels with optional filtering and pagination
  rpc ListHotels(ListHotelsRequest) returns (ListHotelsResponse);
  
  // Update an existing hotel
  rpc UpdateHotel(UpdateHotelRequest) returns (UpdateHotelResponse);
  
  // Delete a hotel
  rpc DeleteHotel(DeleteHotelRequest) returns (DeleteHotelResponse);
  
  // Search for hotels based on criteria
  rpc SearchHotels(SearchHotelsRequest) returns (SearchHotelsResponse);
  
  // Get hotel analytics
  rpc GetHotelAnalytics(GetHotelAnalyticsRequest) returns (GetHotelAnalyticsResponse);
  
  // Get hotel recommendations
  rpc GetHotelRecommendations(GetHotelRecommendationsRequest) returns (GetHotelRecommendationsResponse);
  
  // Compare hotel prices
  rpc CompareHotelPrices(CompareHotelPricesRequest) returns (CompareHotelPricesResponse);
  
  // Get hotel availability
  rpc GetHotelAvailability(GetHotelAvailabilityRequest) returns (GetHotelAvailabilityResponse);
  
  // Get hotel reviews
  rpc GetHotelReviews(GetHotelReviewsRequest) returns (GetHotelReviewsResponse);
  
  // Add hotel review
  rpc AddHotelReview(AddHotelReviewRequest) returns (AddHotelReviewResponse);
  
  // Get hotel amenities
  rpc GetHotelAmenities(GetHotelAmenitiesRequest) returns (GetHotelAmenitiesResponse);
  
  // Get nearby hotels
  rpc GetNearbyHotels(GetNearbyHotelsRequest) returns (GetNearbyHotelsResponse);
}

// GetHotelAnalyticsRequest represents a request to get hotel analytics
message GetHotelAnalyticsRequest {
  // Hotel ID to get analytics for (optional)
  google.protobuf.StringValue hotel_id = 1;
  
  // Date range for analytics
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  
  // Analytics type (occupancy, revenue, reviews, bookings)
  string analytics_type = 4;
  
  // Location filter (optional)
  google.protobuf.StringValue location = 5;
  
  // Hotel chain filter (optional)
  google.protobuf.StringValue hotel_chain = 6;
}

// GetHotelAnalyticsResponse represents hotel analytics response
message GetHotelAnalyticsResponse {
  // Analytics period
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  
  // Analytics type
  string analytics_type = 3;
  
  // Key metrics
  HotelMetrics metrics = 4;
  
  // Time series data
  repeated HotelAnalyticsDataPoint data_points = 5;
  
  // Room type performance
  repeated RoomTypePerformance room_type_performance = 6;
  
  // Competitor analysis
  repeated CompetitorAnalysis competitor_analysis = 7;
  
  // Market trends
  repeated MarketTrend market_trends = 8;
}

// HotelMetrics represents key hotel metrics
message HotelMetrics {
  // Average occupancy rate
  google.protobuf.DoubleValue average_occupancy_rate = 1;
  
  // Total revenue
  int64 total_revenue = 2;
  
  // Average daily rate (ADR)
  google.protobuf.DoubleValue average_daily_rate = 3;
  
  // Revenue per available room (RevPAR)
  google.protobuf.DoubleValue revenue_per_available_room = 4;
  
  // Customer satisfaction score
  google.protobuf.DoubleValue customer_satisfaction_score = 5;
  
  // Total bookings
  int32 total_bookings = 6;
  
  // Cancellation rate
  google.protobuf.DoubleValue cancellation_rate = 7;
  
  // Currency
  string currency = 8;
}

// HotelAnalyticsDataPoint represents a single analytics data point
message HotelAnalyticsDataPoint {
  // Timestamp for this data point
  google.protobuf.Timestamp timestamp = 1;
  
  // Occupancy rate
  google.protobuf.DoubleValue occupancy_rate = 2;
  
  // Revenue
  int64 revenue = 3;
  
  // Average daily rate
  google.protobuf.DoubleValue average_daily_rate = 4;
  
  // Number of bookings
  int32 bookings = 5;
  
  // Customer satisfaction
  google.protobuf.DoubleValue customer_satisfaction = 6;
}

// RoomTypePerformance represents performance metrics for a room type
message RoomTypePerformance {
  // Room type
  tourism.hotels.enums.RoomType room_type = 1;
  
  // Occupancy rate
  google.protobuf.DoubleValue occupancy_rate = 2;
  
  // Average price
  int64 average_price = 3;
  
  // Revenue generated
  int64 revenue = 4;
  
  // Number of bookings
  int32 bookings = 5;
  
  // Popularity ranking
  int32 popularity_ranking = 6;
}

// CompetitorAnalysis represents competitor analysis data
message CompetitorAnalysis {
  // Competitor hotel name
  string competitor_name = 1;
  
  // Competitor rating
  google.protobuf.DoubleValue competitor_rating = 2;
  
  // Competitor price
  int64 competitor_price = 3;
  
  // Market share
  google.protobuf.DoubleValue market_share = 4;
  
  // Competitive advantage
  google.protobuf.StringValue competitive_advantage = 5;
}

// MarketTrend represents market trend information
message MarketTrend {
  // Trend type (price, occupancy, demand)
  string trend_type = 1;
  
  // Trend direction (increasing, decreasing, stable)
  string trend_direction = 2;
  
  // Trend percentage
  google.protobuf.DoubleValue trend_percentage = 3;
  
  // Trend period
  string trend_period = 4;
  
  // Market factors
  repeated string market_factors = 5;
}

// GetHotelRecommendationsRequest represents a request to get hotel recommendations
message GetHotelRecommendationsRequest {
  // User preferences
  UserHotelPreferences preferences = 1;
  
  // Travel dates
  google.protobuf.Timestamp check_in_date = 2;
  google.protobuf.Timestamp check_out_date = 3;
  
  // Budget constraints
  google.protobuf.DoubleValue max_budget_per_night = 4;
  
  // Location preferences
  google.protobuf.StringValue preferred_location = 5;
  
  // Number of recommendations to return
  int32 max_recommendations = 6;
}

// UserHotelPreferences represents user hotel preferences
message UserHotelPreferences {
  // Preferred hotel ratings
  repeated tourism.hotels.enums.HotelRating preferred_ratings = 1;
  
  // Preferred room types
  repeated tourism.hotels.enums.RoomType preferred_room_types = 2;
  
  // Preferred amenities
  repeated string preferred_amenities = 3;
  
  // Preferred hotel chains
  repeated string preferred_chains = 4;
  
  // Avoid hotel chains
  repeated string avoid_chains = 5;
  
  // Travel purpose (business, leisure, family)
  google.protobuf.StringValue travel_purpose = 6;
  
  // Price sensitivity (low, medium, high)
  google.protobuf.StringValue price_sensitivity = 7;
  
  // Location preferences (city_center, airport, beach)
  repeated string location_preferences = 8;
}

// GetHotelRecommendationsResponse represents hotel recommendations response
message GetHotelRecommendationsResponse {
  // List of recommended hotels
  repeated HotelRecommendation recommendations = 1;
  
  // Recommendation reasoning
  repeated string reasoning = 2;
  
  // Alternative options
  repeated HotelRecommendation alternatives = 3;
  
  // Recommendation confidence score
  google.protobuf.DoubleValue confidence_score = 4;
  
  // Price predictions
  repeated PricePrediction price_predictions = 5;
}

// HotelRecommendation represents a hotel recommendation
message HotelRecommendation {
  // Hotel summary
  HotelSummary hotel = 1;
  
  // Recommendation score (0-100)
  google.protobuf.DoubleValue recommendation_score = 2;
  
  // Reasons for recommendation
  repeated string reasons = 3;
  
  // Best available rate
  int64 best_available_rate = 4;
  
  // Currency
  string currency = 5;
  
  // Booking urgency
  google.protobuf.StringValue booking_urgency = 6;
  
  // Special offers
  repeated string special_offers = 7;
  
  // Distance from preferred location
  google.protobuf.DoubleValue distance_km = 8;
}

// PricePrediction represents price prediction information
message PricePrediction {
  // Hotel ID
  string hotel_id = 1;
  
  // Predicted price
  int64 predicted_price = 2;
  
  // Prediction confidence
  google.protobuf.DoubleValue confidence = 3;
  
  // Prediction date
  google.protobuf.Timestamp prediction_date = 4;
  
  // Factors affecting price
  repeated string price_factors = 5;
}

// CompareHotelPricesRequest represents a request to compare hotel prices
message CompareHotelPricesRequest {
  // Hotel IDs to compare
  repeated string hotel_ids = 1;
  
  // Check-in date
  google.protobuf.Timestamp check_in_date = 2;
  
  // Check-out date
  google.protobuf.Timestamp check_out_date = 3;
  
  // Room type to compare
  tourism.hotels.enums.RoomType room_type = 4;
  
  // Number of guests
  int32 number_of_guests = 5;
}

// CompareHotelPricesResponse represents hotel price comparison response
message CompareHotelPricesResponse {
  // Price comparisons
  repeated HotelPriceComparison price_comparisons = 1;
  
  // Best value hotel
  HotelPriceComparison best_value = 2;
  
  // Price trends
  repeated PriceTrend price_trends = 3;
  
  // Comparison summary
  string comparison_summary = 4;
}

// HotelPriceComparison represents price comparison for a hotel
message HotelPriceComparison {
  // Hotel summary
  HotelSummary hotel = 1;
  
  // Price per night
  int64 price_per_night = 2;
  
  // Total price for stay
  int64 total_price = 3;
  
  // Currency
  string currency = 4;
  
  // Value score (0-100)
  google.protobuf.DoubleValue value_score = 5;
  
  // Included amenities
  repeated string included_amenities = 6;
  
  // Booking conditions
  google.protobuf.StringValue booking_conditions = 7;
  
  // Price change from previous day
  google.protobuf.DoubleValue price_change_percentage = 8;
}

// PriceTrend represents price trend information
message PriceTrend {
  // Date
  google.protobuf.Timestamp date = 1;
  
  // Average price
  int64 average_price = 2;
  
  // Lowest price
  int64 lowest_price = 3;
  
  // Highest price
  int64 highest_price = 4;
  
  // Currency
  string currency = 5;
  
  // Trend direction
  google.protobuf.StringValue trend_direction = 6;
}

// GetHotelAvailabilityRequest represents a request to get hotel availability
message GetHotelAvailabilityRequest {
  // Hotel ID
  string hotel_id = 1;
  
  // Check-in date
  google.protobuf.Timestamp check_in_date = 2;
  
  // Check-out date
  google.protobuf.Timestamp check_out_date = 3;
  
  // Number of rooms
  int32 number_of_rooms = 4;
  
  // Number of guests
  int32 number_of_guests = 5;
  
  // Preferred room types
  repeated tourism.hotels.enums.RoomType preferred_room_types = 6;
}

// GetHotelAvailabilityResponse represents hotel availability response
message GetHotelAvailabilityResponse {
  // Hotel ID
  string hotel_id = 1;
  
  // Availability status
  string availability_status = 2;
  
  // Available room types
  repeated AvailableRoomType available_room_types = 3;
  
  // Total rooms available
  int32 total_rooms_available = 4;
  
  // Availability calendar
  google.protobuf.StringValue availability_calendar = 5;
  
  // Booking restrictions
  google.protobuf.StringValue booking_restrictions = 6;
  
  // Minimum stay requirements
  google.protobuf.DoubleValue minimum_stay_nights = 7;
}

// GetHotelReviewsRequest represents a request to get hotel reviews
message GetHotelReviewsRequest {
  // Hotel ID
  string hotel_id = 1;
  
  // Review filter options
  ReviewFilter filter = 2;
  
  // Page number for pagination
  int32 page = 3;
  
  // Page size for pagination
  int32 page_size = 4;
}

// ReviewFilter represents review filtering options
message ReviewFilter {
  // Minimum rating
  google.protobuf.DoubleValue min_rating = 1;
  
  // Maximum rating
  google.protobuf.DoubleValue max_rating = 2;
  
  // Review sources
  repeated string sources = 3;
  
  // Traveler types
  repeated string traveler_types = 4;
  
  // Date range
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  
  // Languages
  repeated string languages = 7;
}

// GetHotelReviewsResponse represents hotel reviews response
message GetHotelReviewsResponse {
  // Hotel ID
  string hotel_id = 1;
  
  // Reviews
  repeated HotelReview reviews = 2;
  
  // Total count
  int32 total_count = 3;
  
  // Pagination info
  int32 page = 4;
  int32 page_size = 5;
  int32 total_pages = 6;
  
  // Review summary
  HotelReviews review_summary = 7;
  
  // Review statistics
  ReviewStatistics review_statistics = 8;
}

// ReviewStatistics represents review statistics
message ReviewStatistics {
  // Average rating
  google.protobuf.DoubleValue average_rating = 1;
  
  // Rating distribution
  repeated RatingDistribution rating_distribution = 2;
  
  // Review count by source
  repeated ReviewSourceCount review_sources = 3;
  
  // Most mentioned amenities
  repeated string top_mentioned_amenities = 4;
  
  // Common complaints
  repeated string common_complaints = 5;
  
  // Common praises
  repeated string common_praises = 6;
}

// RatingDistribution represents rating distribution
message RatingDistribution {
  // Rating value
  google.protobuf.DoubleValue rating = 1;
  
  // Count of reviews with this rating
  int32 count = 2;
  
  // Percentage of total reviews
  google.protobuf.DoubleValue percentage = 3;
}

// ReviewSourceCount represents review count by source
message ReviewSourceCount {
  // Review source
  string source = 1;
  
  // Number of reviews
  int32 count = 2;
  
  // Average rating from this source
  google.protobuf.DoubleValue average_rating = 3;
}

// AddHotelReviewRequest represents a request to add a hotel review
message AddHotelReviewRequest {
  // Hotel ID
  string hotel_id = 1;
  
  // Customer ID
  string customer_id = 1;
  
  // Review rating
  google.protobuf.DoubleValue rating = 3;
  
  // Review title
  google.protobuf.StringValue title = 4;
  
  // Review text
  string review_text = 5;
  
  // Traveler type
  google.protobuf.StringValue traveler_type = 6;
  
  // Stay date
  google.protobuf.Timestamp stay_date = 7;
  
  // Room type stayed in
  tourism.hotels.enums.RoomType room_type = 8;
  
  // Would recommend
  google.protobuf.StringValue would_recommend = 9;
  
  // Additional ratings
  repeated CategoryRating category_ratings = 10;
}

// CategoryRating represents rating for a specific category
message CategoryRating {
  // Category name
  string category = 1;
  
  // Rating value
  google.protobuf.DoubleValue rating = 2;
}

// AddHotelReviewResponse represents the response after adding a review
message AddHotelReviewResponse {
  // Review ID
  string review_id = 1;
  
  // Success message
  string message = 2;
  
  // Review created timestamp
  google.protobuf.Timestamp created_at = 3;
  
  // Updated hotel rating
  google.protobuf.DoubleValue updated_hotel_rating = 4;
}

// GetHotelAmenitiesRequest represents a request to get hotel amenities
message GetHotelAmenitiesRequest {
  // Hotel ID
  string hotel_id = 1;
  
  // Amenity categories to include
  repeated string categories = 2;
}

// GetHotelAmenitiesResponse represents hotel amenities response
message GetHotelAmenitiesResponse {
  // Hotel ID
  string hotel_id = 1;
  
  // Amenities by category
  repeated AmenityCategory amenity_categories = 2;
  
  // All amenities list
  repeated string all_amenities = 3;
  
  // Amenity descriptions
  google.protobuf.StringValue amenity_descriptions = 4;
}

// AmenityCategory represents amenities grouped by category
message AmenityCategory {
  // Category name
  string category = 1;
  
  // Amenities in this category
  repeated string amenities = 2;
  
  // Category description
  google.protobuf.StringValue description = 3;
}

// GetNearbyHotelsRequest represents a request to get nearby hotels
message GetNearbyHotelsRequest {
  // Reference location (hotel ID, address, or coordinates)
  string reference_location = 1;
  
  // Search radius in kilometers
  google.protobuf.DoubleValue radius_km = 2;
  
  // Maximum number of hotels to return
  int32 max_hotels = 3;
  
  // Hotel rating filter
  tourism.hotels.enums.HotelRating min_rating = 4;
  
  // Price range filter
  google.protobuf.DoubleValue max_price_per_night = 5;
  
  // Required amenities
  repeated string required_amenities = 6;
}

// GetNearbyHotelsResponse represents nearby hotels response
message GetNearbyHotelsResponse {
  // Reference location
  string reference_location = 1;
  
  // Search radius used
  google.protobuf.DoubleValue radius_km = 2;
  
  // Nearby hotels
  repeated NearbyHotel nearby_hotels = 3;
  
  // Total count
  int32 total_count = 4;
  
  // Map data
  google.protobuf.StringValue map_data = 5;
}

// NearbyHotel represents a nearby hotel with distance information
message NearbyHotel {
  // Hotel summary
  HotelSummary hotel = 1;
  
  // Distance from reference location
  google.protobuf.DoubleValue distance_km = 2;
  
  // Walking time (estimated)
  google.protobuf.DoubleValue walking_time_minutes = 3;
  
  // Driving time (estimated)
  google.protobuf.DoubleValue driving_time_minutes = 4;
  
  // Public transport options
  repeated string public_transport_options = 5;
  
  // Direction from reference location
  google.protobuf.StringValue direction = 6;
}
