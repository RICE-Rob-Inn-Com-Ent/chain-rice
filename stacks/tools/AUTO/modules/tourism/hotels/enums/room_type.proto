syntax = "proto3";

package tourism.hotels.enums;

// RoomType represents the different types of hotel rooms available
enum RoomType {
  // Unspecified room type - should not be used in production
  ROOM_TYPE_UNSPECIFIED = 0;
  
  // Single room with one bed
  SINGLE = 1;
  
  // Double room with one double bed
  DOUBLE = 2;
  
  // Twin room with two single beds
  TWIN = 3;
  
  // Suite with separate living area
  SUITE = 4;
  
  // Family room for families
  FAMILY = 5;
  
  // Deluxe room with premium amenities
  DELUXE = 6;
  
  // Presidential suite - highest luxury
  PRESIDENTIAL = 7;
  
  // Junior suite - smaller suite
  JUNIOR_SUITE = 8;
  
  // Executive room for business travelers
  EXECUTIVE = 9;
  
  // Connecting rooms
  CONNECTING = 10;
  
  // Accessible room for disabled guests
  ACCESSIBLE = 11;
  
  // Ocean view room
  OCEAN_VIEW = 12;
  
  // Mountain view room
  MOUNTAIN_VIEW = 13;
  
  // Garden view room
  GARDEN_VIEW = 14;
  
  // City view room
  CITY_VIEW = 15;
  
  // Penthouse suite
  PENTHOUSE = 16;
  
  // Villa or standalone accommodation
  VILLA = 17;
}
