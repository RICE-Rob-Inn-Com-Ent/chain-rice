syntax = "proto3";

package tourism.tours.enums;

// TourType represents the different types of tours available
enum TourType {
  // Unspecified tour type - should not be used in production
  TOUR_TYPE_UNSPECIFIED = 0;
  
  // Adventure tours with outdoor activities
  ADVENTURE = 1;
  
  // Cultural tours focusing on local heritage
  CULTURAL = 2;
  
  // Leisure tours for relaxation
  LEISURE = 3;
  
  // Historical tours of significant sites
  HISTORICAL = 4;
  
  // Nature and wildlife tours
  NATURE = 5;
  
  // Food and culinary tours
  CULINARY = 6;
  
  // Wine and beverage tours
  WINE_TOUR = 7;
  
  // City sightseeing tours
  CITY_SIGHTSEEING = 8;
  
  // Religious and spiritual tours
  RELIGIOUS = 9;
  
  // Educational and academic tours
  EDUCATIONAL = 10;
  
  // Photography tours
  PHOTOGRAPHY = 11;
  
  // Wildlife and safari tours
  WILDLIFE = 12;
  
  // Beach and coastal tours
  BEACH = 13;
  
  // Mountain and hiking tours
  MOUNTAIN = 14;
  
  // Water sports tours
  WATER_SPORTS = 15;
  
  // Art and museum tours
  ART_MUSEUM = 16;
  
  // Shopping tours
  SHOPPING = 17;
  
  // Nightlife tours
  NIGHTLIFE = 18;
  
  // Multi-day package tours
  PACKAGE_TOUR = 19;
  
  // Private and customized tours
  PRIVATE = 20;
  
  // Group tours
  GROUP = 21;
  
  // Family-friendly tours
  FAMILY = 22;
  
  // Senior-friendly tours
  SENIOR = 23;
}
