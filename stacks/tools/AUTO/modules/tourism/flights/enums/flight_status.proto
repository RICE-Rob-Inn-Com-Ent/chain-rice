syntax = "proto3";

package tourism.flights.enums;

// FlightStatus represents the current operational status of a flight
enum FlightStatus {
  // Unspecified status - should not be used in production
  FLIGHT_STATUS_UNSPECIFIED = 0;
  
  // Flight is scheduled and on time
  SCHEDULED = 1;
  
  // Flight is delayed
  DELAYED = 2;
  
  // Flight has been cancelled
  CANCELLED = 3;
  
  // Flight has landed
  LANDED = 4;
  
  // Flight is currently in progress
  IN_FLIGHT = 5;
  
  // Flight has departed from origin
  DEPARTED = 6;
  
  // Flight is boarding
  BOARDING = 7;
  
  // Flight is on final approach
  FINAL_APPROACH = 8;
  
  // Flight has arrived at gate
  ARRIVED = 9;
  
  // Flight is diverted to another airport
  DIVERTED = 10;
  
  // Flight is returning to origin
  RETURNING = 11;
  
  // Flight status is unknown
  UNKNOWN = 12;
  
  // Flight is on ground
  ON_GROUND = 13;
  
  // Flight is taxiing
  TAXIING = 14;
  
  // Flight is ready for departure
  READY_FOR_DEPARTURE = 15;
}
