syntax = "proto3";

package tourism.bookings.enums;

// BookingStatus represents the current state of a booking
enum BookingStatus {
  // Unspecified status - should not be used in production
  BOOKING_STATUS_UNSPECIFIED = 0;
  
  // Booking is pending confirmation
  PENDING = 1;
  
  // Booking has been confirmed
  CONFIRMED = 2;
  
  // Booking has been cancelled
  CANCELLED = 3;
  
  // Booking has been completed
  COMPLETED = 4;
  
  // Booking is under review
  UNDER_REVIEW = 5;
  
  // Booking is on hold
  ON_HOLD = 6;
  
  // Booking has been modified
  MODIFIED = 7;
  
  // Booking is no-show
  NO_SHOW = 8;
  
  // Booking has been refunded
  REFUNDED = 9;
  
  // Booking is in dispute
  DISPUTED = 10;
  
  // Booking is expired
  EXPIRED = 11;
  
  // Booking is being processed
  PROCESSING = 12;
  
  // Booking has been archived
  ARCHIVED = 13;
}
