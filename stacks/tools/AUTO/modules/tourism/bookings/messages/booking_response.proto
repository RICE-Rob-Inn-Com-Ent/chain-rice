syntax = "proto3";

package tourism.bookings.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";
import "tourism/bookings/enums/booking_status.proto";
import "tourism/bookings/enums/payment_status.proto";

// Booking represents a booking entity
message Booking {
  // Unique identifier for the booking
  string booking_id = 1;
  
  // Customer ID who made the booking
  string customer_id = 2;
  
  // Type of service being booked
  string service_type = 3;
  
  // ID of the specific service being booked
  string service_id = 4;
  
  // Current booking status
  tourism.bookings.enums.BookingStatus status = 5;
  
  // Current payment status
  tourism.bookings.enums.PaymentStatus payment_status = 6;
  
  // Total amount for the booking (in smallest currency unit)
  int64 total_amount = 7;
  
  // Currency code (ISO 4217 format)
  string currency = 8;
  
  // Number of travelers/guests
  int32 number_of_travelers = 9;
  
  // Booking start date
  google.protobuf.Timestamp start_date = 10;
  
  // Booking end date
  google.protobuf.Timestamp end_date = 11;
  
  // Special requests or notes
  google.protobuf.StringValue special_requests = 12;
  
  // Contact information
  ContactInfo contact_info = 13;
  
  // Traveler details
  repeated TravelerInfo travelers = 14;
  
  // Payment information
  PaymentInfo payment_info = 15;
  
  // Booking source
  google.protobuf.StringValue booking_source = 16;
  
  // Promotional code used
  google.protobuf.StringValue promotional_code = 17;
  
  // Date when the booking was created
  google.protobuf.Timestamp created_at = 18;
  
  // Date when the booking was last updated
  google.protobuf.Timestamp updated_at = 19;
  
  // Date when the booking was confirmed
  google.protobuf.Timestamp confirmed_at = 20;
  
  // Date when the booking was cancelled (if applicable)
  google.protobuf.Timestamp cancelled_at = 21;
  
  // Cancellation reason (if applicable)
  google.protobuf.StringValue cancellation_reason = 22;
  
  // Booking reference number
  string booking_reference = 23;
}

// CreateBookingResponse represents the response after creating a booking
message CreateBookingResponse {
  // The created booking
  Booking booking = 1;
  
  // Success message
  string message = 2;
  
  // Booking confirmation number
  string confirmation_number = 3;
}

// UpdateBookingResponse represents the response after updating a booking
message UpdateBookingResponse {
  // The updated booking
  Booking booking = 1;
  
  // Success message
  string message = 2;
}

// GetBookingResponse represents the response after retrieving a booking
message GetBookingResponse {
  // The retrieved booking
  Booking booking = 1;
}

// ListBookingsResponse represents the response after listing bookings
message ListBookingsResponse {
  // List of bookings matching the criteria
  repeated Booking bookings = 1;
  
  // Total count of bookings matching the criteria
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Page size used
  int32 page_size = 4;
  
  // Total number of pages available
  int32 total_pages = 5;
}

// DeleteBookingResponse represents the response after deleting a booking
message DeleteBookingResponse {
  // Success message
  string message = 1;
  
  // Deletion timestamp
  google.protobuf.Timestamp deleted_at = 2;
}

// CancelBookingResponse represents the response after cancelling a booking
message CancelBookingResponse {
  // The cancelled booking
  Booking booking = 1;
  
  // Success message
  string message = 2;
  
  // Cancellation effective date
  google.protobuf.Timestamp effective_date = 3;
  
  // Refund information (if applicable)
  google.protobuf.StringValue refund_info = 4;
}

// ConfirmBookingResponse represents the response after confirming a booking
message ConfirmBookingResponse {
  // The confirmed booking
  Booking booking = 1;
  
  // Success message
  string message = 2;
  
  // Confirmation timestamp
  google.protobuf.Timestamp confirmed_at = 3;
  
  // Confirmation method used
  google.protobuf.StringValue confirmation_method = 4;
}

// ContactInfo represents contact information for a booking
message ContactInfo {
  // Full name
  string full_name = 1;
  
  // Email address
  string email = 2;
  
  // Phone number
  string phone = 3;
  
  // Address information
  Address address = 4;
  
  // Preferred contact method
  google.protobuf.StringValue preferred_contact_method = 5;
  
  // Emergency contact information
  google.protobuf.StringValue emergency_contact = 6;
}

// TravelerInfo represents information about a traveler
message TravelerInfo {
  // Traveler type (adult, child, infant)
  string traveler_type = 1;
  
  // First name
  string first_name = 2;
  
  // Last name
  string last_name = 3;
  
  // Date of birth
  google.protobuf.Timestamp date_of_birth = 4;
  
  // Gender
  google.protobuf.StringValue gender = 5;
  
  // Nationality
  google.protobuf.StringValue nationality = 6;
  
  // Passport information
  google.protobuf.StringValue passport_number = 7;
  
  // Dietary restrictions
  google.protobuf.StringValue dietary_restrictions = 8;
  
  // Medical conditions
  google.protobuf.StringValue medical_conditions = 9;
}

// PaymentInfo represents payment information for a booking
message PaymentInfo {
  // Payment method (credit_card, bank_transfer, cash, etc.)
  string payment_method = 1;
  
  // Payment status
  tourism.bookings.enums.PaymentStatus payment_status = 2;
  
  // Payment reference or transaction ID
  google.protobuf.StringValue payment_reference = 3;
  
  // Payment date
  google.protobuf.Timestamp payment_date = 4;
  
  // Payment amount
  google.protobuf.DoubleValue payment_amount = 5;
  
  // Currency
  google.protobuf.StringValue currency = 6;
  
  // Billing address
  Address billing_address = 7;
}

// Address represents an address structure
message Address {
  // Street address
  string street_address = 1;
  
  // City
  string city = 2;
  
  // State or province
  google.protobuf.StringValue state_province = 3;
  
  // Postal code
  google.protobuf.StringValue postal_code = 4;
  
  // Country code (ISO 3166-1 alpha-2)
  string country_code = 5;
}

// BookingSummary represents a summary view of booking information
message BookingSummary {
  // Booking ID
  string booking_id = 1;
  
  // Booking reference
  string booking_reference = 2;
  
  // Customer ID
  string customer_id = 3;
  
  // Service type
  string service_type = 4;
  
  // Service name
  google.protobuf.StringValue service_name = 5;
  
  // Booking status
  tourism.bookings.enums.BookingStatus status = 6;
  
  // Payment status
  tourism.bookings.enums.PaymentStatus payment_status = 7;
  
  // Total amount
  int64 total_amount = 8;
  
  // Currency
  string currency = 9;
  
  // Start date
  google.protobuf.Timestamp start_date = 10;
  
  // End date
  google.protobuf.Timestamp end_date = 11;
  
  // Number of travelers
  int32 number_of_travelers = 12;
  
  // Created date
  google.protobuf.Timestamp created_at = 13;
}
