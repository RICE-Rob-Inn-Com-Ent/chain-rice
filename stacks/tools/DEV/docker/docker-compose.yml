version: '3.8'

services:
  # ChainRice Go Services
  chainrice-go:
    build:
      context: .
      dockerfile: containers/Dockerfile.GO.main
    ports:
      - "8080:8080"  # Accounting API
      - "8081:8081"  # Tax API
      - "26657:26657" # Blockchain RPC
      - "26656:26656" # Blockchain P2P
    environment:
      - CHAINRICE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - chainrice-network
    restart: unless-stopped

  # .NET Bridge
  chainrice-dotnet-bridge:
    build:
      context: .
      dockerfile: containers/Dockerfile.NET.bridge
    ports:
      - "8082:8082"
    environment:
      - CHAINRICE_GO_URL=http://chainrice-go:8080
      - CHAINRICE_TAX_URL=http://chainrice-go:8081
      - CHAINRICE_BLOCKCHAIN_URL=http://chainrice-go:26657
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  # BEAM Bridge
  chainrice-beam-bridge:
    build:
      context: .
      dockerfile: containers/Dockerfile.BEAM.bridge
    ports:
      - "8083:8083"
    environment:
      - CHAINRICE_GO_URL=http://chainrice-go:8080
      - CHAINRICE_TAX_URL=http://chainrice-go:8081
      - CHAINRICE_BLOCKCHAIN_URL=http://chainrice-go:26657
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  # Python Bridge
  chainrice-python-bridge:
    build:
      context: .
      dockerfile: containers/Dockerfile.CPython.bridge
    ports:
      - "8084:8084"
    environment:
      - CHAINRICE_GO_URL=http://chainrice-go:8080
      - CHAINRICE_TAX_URL=http://chainrice-go:8081
      - CHAINRICE_BLOCKCHAIN_URL=http://chainrice-go:26657
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  # JVM Bridge
  chainrice-jvm-bridge:
    build:
      context: .
      dockerfile: containers/Dockerfile.JVM.bridge
    ports:
      - "8085:8085"
    environment:
      - CHAINRICE_GO_URL=http://chainrice-go:8080
      - CHAINRICE_TAX_URL=http://chainrice-go:8081
      - CHAINRICE_BLOCKCHAIN_URL=http://chainrice-go:26657
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  # PHP Bridge
  chainrice-php-bridge:
    build:
      context: .
      dockerfile: containers/Dockerfile.PHP.bridge
    ports:
      - "8086:8086"
    environment:
      - CHAINRICE_GO_URL=http://chainrice-go:8080
      - CHAINRICE_TAX_URL=http://chainrice-go:8081
      - CHAINRICE_BLOCKCHAIN_URL=http://chainrice-go:26657
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  # Frontend Applications
  chainrice-flutter-app:
    build:
      context: .
      dockerfile: containers/Dockerfile.FLUTTER.app
    ports:
      - "3000:3000"
    environment:
      - CHAINRICE_API_URL=http://chainrice-go:8080
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  chainrice-nextjs-app:
    build:
      context: .
      dockerfile: containers/Dockerfile.NEXTJS.app
    ports:
      - "3001:3000"
    environment:
      - CHAINRICE_API_URL=http://chainrice-go:8080
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  chainrice-nuxtjs-app:
    build:
      context: .
      dockerfile: containers/Dockerfile.NUXTJS.app
    ports:
      - "3002:3000"
    environment:
      - CHAINRICE_API_URL=http://chainrice-go:8080
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  chainrice-angular-app:
    build:
      context: .
      dockerfile: containers/Dockerfile.ANGULAR.app
    ports:
      - "3003:4200"
    environment:
      - CHAINRICE_API_URL=http://chainrice-go:8080
    depends_on:
      - chainrice-go
    networks:
      - chainrice-network
    restart: unless-stopped

  # Tools Services
  chainrice-auto:
    build:
      context: .
      dockerfile: containers/Dockerfile.AUTO.tool
    ports:
      - "8087:8087"
    volumes:
      - ./stacks/tools/AUTO:/app
      - ./stacks/tools/AUTO/proto:/app/proto
    networks:
      - chainrice-network
    restart: unless-stopped

  chainrice-contracts:
    build:
      context: .
      dockerfile: containers/Dockerfile.CONTRACTS.tool
    ports:
      - "8088:8088"
    volumes:
      - ./stacks/tools/CONTRACTS:/app
    networks:
      - chainrice-network
    restart: unless-stopped

  chainrice-data:
    build:
      context: .
      dockerfile: containers/Dockerfile.DATA.tool
    ports:
      - "8089:8089"
    volumes:
      - ./stacks/tools/DATA:/app
    networks:
      - chainrice-network
    restart: unless-stopped

  chainrice-dev:
    build:
      context: .
      dockerfile: containers/Dockerfile.DEV.tool
    ports:
      - "8090:8090"
    volumes:
      - ./stacks/tools/DEV:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - chainrice-network
    restart: unless-stopped

  chainrice-misc:
    build:
      context: .
      dockerfile: containers/Dockerfile.MISC.tool
    ports:
      - "8091:8091"
    volumes:
      - ./stacks/tools/MISC:/app
    networks:
      - chainrice-network
    restart: unless-stopped

  # Database Services
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=chainrice
      - POSTGRES_USER=chainrice
      - POSTGRES_PASSWORD=chainrice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chainrice-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chainrice-network
    restart: unless-stopped

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - chainrice-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - chainrice-network
    restart: unless-stopped

  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - chainrice-go
      - chainrice-dotnet-bridge
      - chainrice-beam-bridge
      - chainrice-python-bridge
      - chainrice-jvm-bridge
      - chainrice-php-bridge
    networks:
      - chainrice-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  chainrice-network:
    driver: bridge
