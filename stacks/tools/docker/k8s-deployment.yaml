apiVersion: apps/v1
kind: Deployment
metadata:
  name: examples-docker-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examples-docker-hello
  template:
    metadata:
      labels:
        app: examples-docker-hello
    spec:
      containers:
        - name: app
          image: examples-docker-hello:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              value: "examples-docker-hello-k8s"
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: examples-docker-hello
spec:
  type: NodePort
  selector:
    app: examples-docker-hello
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080


