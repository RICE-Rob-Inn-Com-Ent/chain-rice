syntax = "proto3";

package chainrice.chainrice.enums;

option go_package = "github.com/chainrice/chainrice/x/chainrice/types";

// OrderStatus represents order status
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1; // Pending
  ORDER_STATUS_CONFIRMED = 2; // Confirmed
  ORDER_STATUS_PREPARING = 3; // Preparing
  ORDER_STATUS_READY = 4; // Ready
  ORDER_STATUS_DELIVERED = 5; // Delivered
  ORDER_STATUS_CANCELLED = 6; // Cancelled
}

// ReservationStatus represents reservation status
enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_PENDING = 1; // Pending
  RESERVATION_STATUS_CONFIRMED = 2; // Confirmed
  RESERVATION_STATUS_CANCELLED = 3; // Cancelled
  RESERVATION_STATUS_COMPLETED = 4; // Completed
  RESERVATION_STATUS_NO_SHOW = 5; // No show
}

// MenuCategory represents menu item category
enum MenuCategory {
  MENU_CATEGORY_UNSPECIFIED = 0;
  MENU_CATEGORY_FOOD = 1; // Food
  MENU_CATEGORY_DRINKS = 2; // Drinks
  MENU_CATEGORY_DESSERTS = 3; // Desserts
  MENU_CATEGORY_APPETIZERS = 4; // Appetizers
  MENU_CATEGORY_MAIN_COURSES = 5; // Main courses
  MENU_CATEGORY_BEVERAGES = 6; // Beverages
}
