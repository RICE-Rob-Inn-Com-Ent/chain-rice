syntax = "proto3";

package chainrice.chainrice.invoice;

import "enums/tax.proto";

option go_package = "github.com/chainrice/chainrice/x/chainrice/types";

// Tax represents invoice tax information
message Tax {
  // Basic amounts
  double net_amount = 1; // net amount
  double gross_amount = 2; // gross amount
  double total_tax_amount = 3; // total tax amount
  
  // Tax details
  repeated TaxDetail tax_details = 4;
  
  // Currency
  string currency = 5;
  
  // Additional information
  bool is_tax_inclusive = 6; // whether prices include tax
  string tax_exemption_reason = 7; // tax exemption reason
}

// TaxDetail represents details of a specific tax
message TaxDetail {
  // Tax type
  .chainrice.chainrice.enums.TaxType tax_type = 1;
  
  // Rate and amounts
  double rate = 2; // rate in percentage (e.g. 8.0 for 8%)
  double net_amount = 3; // tax base
  double tax_amount = 4; // tax amount
  
  // Additional information
  string description = 5;
  string tax_code = 6; // tax code
}

// Use enums from enums/tax.proto
