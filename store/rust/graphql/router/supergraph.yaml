# Supergraph Composition Config for RICE AI Platform
# Used by Rover CLI to compose the supergraph schema

federation_version: 2

subgraphs:
  auth:
    routing_url: http://localhost:4001/graphql
    schema:
      file: ../subgraphs/auth/schema.graphql

  models:
    routing_url: http://localhost:4002/graphql
    schema:
      file: ../subgraphs/models/schema.graphql

  training:
    routing_url: http://localhost:4003/graphql
    schema:
      file: ../subgraphs/training/schema.graphql

  gpu:
    routing_url: http://localhost:4004/graphql
    schema:
      file: ../subgraphs/gpu/schema.graphql

  subscription:
    routing_url: http://localhost:4005/graphql
    schema:
      file: ../subgraphs/subscription/schema.graphql
