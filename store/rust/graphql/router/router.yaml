# Apollo Router Configuration for RICE AI Platform

listen: 0.0.0.0:4000

supergraph:
  path: ./supergraph-schema.graphql

cors:
  origins:
    - http://localhost:3000
    - http://localhost:3001
  allow_credentials: true

headers:
  all:
    request:
      - propagate:
          named: authorization
      - propagate:
          named: x-user-id
      - propagate:
          named: x-request-id

authentication:
  router:
    jwt:
      jwks:
        - url: http://localhost:4001/auth/.well-known/jwks.json
      header_name: Authorization
      header_value_prefix: "Bearer "

authorization:
  require_authentication: false
  preview_directives:
    enabled: true

plugins:
  experimental.traffic_shaping:
    all:
      timeout: 30s
    subgraphs:
      auth:
        timeout: 10s
      models:
        timeout: 20s
      training:
        timeout: 60s
      gpu:
        timeout: 15s
      subscription:
        timeout: 10s

  experimental.ratelimit:
    enabled: true
    strategy:
      rolling_window:
        window: 60s
        max_requests: 1000

telemetry:
  instrumentation:
    spans:
      mode: spec_compliant
    events:
      router:
        request: info
        response: info
      supergraph:
        request: info
        response: info
      subgraph:
        request: info
        response: info

  metrics:
    common:
      service_name: rice-graphql-router

apq:
  enabled: true

homepage:
  enabled: true

health_check:
  enabled: true
  listen: 0.0.0.0:8088
  path: /health

sandbox:
  enabled: true

include_subgraph_errors:
  all: true
