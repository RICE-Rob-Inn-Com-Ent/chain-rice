global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "rice-dev"
    environment: "development"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Add your application metrics endpoints here
  - job_name: "traefik"
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:9100"]

