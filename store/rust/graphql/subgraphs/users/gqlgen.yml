# GraphQL schema
schema:
  - schema.graphql

# Where should the generated code go?
exec:
  filename: generated/generated.go
  package: generated

# Resolver configuration
resolver:
  layout: follow-schema
  dir: resolver
  package: resolver
  filename_template: "{name}.resolvers.go"

# Models configuration
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  User:
    model:
      - graphql/users/models.User

# Federation support
federation:
  filename: generated/federation.go
  package: generated
  version: 2
