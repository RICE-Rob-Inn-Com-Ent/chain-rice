extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])

type User @key(fields: "id") {
  id: ID! @external
  trainedModels: [TrainedModel!]!
  projects: [Project!]!
  genes: [Gene!]!
}

type TrainedModel @key(fields: "id") {
  id: ID!
  name: String!
  description: String!
  type: ModelType!
  metadata: ModelMetadata!
  genes: [Gene!]!
  vramRequirements: VRAMRequirements!
  ownerId: ID!
  owner: User!
  visibility: ModelVisibility!
  downloads: Int!
  rating: Float!
  createdAt: String!
  updatedAt: String!
  storagePath: String!
  projectId: ID
  project: Project
}

type ModelMetadata {
  baseModel: String!
  version: String!
  parametersCount: Int!
  sizeBytes: Int!
  tags: [String!]!
  config: JSON
}

type VRAMRequirements {
  minimumVramMb: Int!
  recommendedVramMb: Int!
  optimalVramMb: Int!
}

type Gene @key(fields: "id") {
  id: ID!
  name: String!
  description: String!
  parameters: JSON!
  vramImpactMb: Int!
  createdAt: String!
  createdBy: ID!
  creator: User!
}

type Project @key(fields: "id") {
  id: ID!
  name: String!
  description: String!
  ownerId: ID!
  owner: User!
  models: [ProjectModel!]!
  genes: [Gene!]!
  metadata: JSON
  createdAt: String!
  updatedAt: String!
}

type ProjectModel {
  modelId: ID!
  model: TrainedModel!
  role: String!
  config: JSON
  addedAt: String!
}

enum ModelType {
  LLM
  IMAGE_GEN
  CODE_GEN
  EMBEDDING
  VISION
  AUDIO
  MULTIMODAL
  CUSTOM
}

enum ModelVisibility {
  PRIVATE
  SHARED
  PUBLIC
}

scalar JSON

type Query {
  trainedModel(id: ID!): TrainedModel
  trainedModels(limit: Int, offset: Int, userId: ID, projectId: ID): [TrainedModel!]!
  marketplaceModels(limit: Int, offset: Int, query: String): [TrainedModel!]!
  gene(id: ID!): Gene
  genes(limit: Int, offset: Int, userId: ID): [Gene!]!
  project(id: ID!): Project
  projects(limit: Int, offset: Int, userId: ID): [Project!]!
}

type Mutation {
  createTrainedModel(input: CreateTrainedModelInput!): TrainedModel!
  updateTrainedModel(id: ID!, input: UpdateTrainedModelInput!): TrainedModel!
  deleteTrainedModel(id: ID!): Boolean!
  publishModel(id: ID!, description: String!, tags: [String!]!): Boolean!
  downloadModel(id: ID!): String!
  rateModel(id: ID!, rating: Float!, review: String): Boolean!
  
  createGene(input: CreateGeneInput!): Gene!
  updateGene(id: ID!, input: UpdateGeneInput!): Gene!
  deleteGene(id: ID!): Boolean!
  
  createProject(input: CreateProjectInput!): Project!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
  deleteProject(id: ID!): Boolean!
}

input CreateTrainedModelInput {
  name: String!
  description: String!
  type: ModelType!
  baseModel: String!
  genes: [ID!]!
  visibility: ModelVisibility!
  projectId: ID
}

input UpdateTrainedModelInput {
  name: String
  description: String
  visibility: ModelVisibility
}

input CreateGeneInput {
  name: String!
  description: String!
  parameters: JSON!
  vramImpactMb: Int!
}

input UpdateGeneInput {
  name: String
  description: String
  parameters: JSON
  vramImpactMb: Int
}

input CreateProjectInput {
  name: String!
  description: String!
}

input UpdateProjectInput {
  name: String
  description: String
}

