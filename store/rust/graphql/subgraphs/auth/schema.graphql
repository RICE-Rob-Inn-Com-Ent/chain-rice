extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])

type User @key(fields: "id") {
  id: ID!
  email: String!
  displayName: String!
  firstName: String
  lastName: String
  avatarUrl: String
  roles: [UserRole!]!
  active: Boolean!
  accountState: AccountState!
  createdAt: String!
  updatedAt: String!
  profile: UserProfile
}

type UserProfile {
  timezone: String
  preferredLanguage: String
  location: Location
}

type Location {
  country: String
  region: String
  city: String
  postalCode: String
  latitude: Float
  longitude: Float
}

enum UserRole {
  USER
  ADMIN
  DEVELOPER
  MODERATOR
}

enum AccountState {
  ACTIVE
  SUSPENDED
  BLOCKED
  PENDING
}

type AuthResponse {
  success: Boolean!
  message: String
  sessionToken: String
  refreshToken: String
  user: User
  mfaRequired: [MFAType!]
}

enum MFAType {
  TOTP
  SMS
  EMAIL
  BACKUP_CODE
}

type Query {
  me: User
  user(id: ID!): User
  users(limit: Int, offset: Int, query: String): [User!]!
}

type Mutation {
  signIn(email: String!, password: String!): AuthResponse!
  signUp(email: String!, password: String!, displayName: String!): AuthResponse!
  signOut: Boolean!
  updateUser(id: ID!, input: UpdateUserInput!): User
  changePassword(oldPassword: String!, newPassword: String!): Boolean!
  forgotPassword(email: String!): Boolean!
  resetPassword(token: String!, newPassword: String!): Boolean!
}

input UpdateUserInput {
  displayName: String
  firstName: String
  lastName: String
  avatarUrl: String
  timezone: String
  preferredLanguage: String
}

