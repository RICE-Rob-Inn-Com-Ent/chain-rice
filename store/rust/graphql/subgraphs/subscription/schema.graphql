extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])

type User @key(fields: "id") {
  id: ID! @external
  subscription: Subscription
}

type Subscription @key(fields: "id") {
  id: ID!
  userId: ID!
  user: User!
  tier: SubscriptionTier!
  usage: Usage!
  limits: ResourceLimits!
  startedAt: String!
  expiresAt: String
  isActive: Boolean!
  paymentId: String
}

type Usage {
  modelsCount: Int!
  activeTrainingJobs: Int!
  storageUsedGb: Int!
  gpuHoursUsed: Int!
  lastReset: String!
}

type ResourceLimits {
  maxModels: Int!
  maxTrainingJobs: Int!
  storageGb: Int!
  maxGpuHours: Int!
  cloudTraining: Boolean!
  marketplaceAccess: Boolean!
  apiAccess: Boolean!
  maxProjects: Int!
}

type SubscriptionPlan {
  tier: SubscriptionTier!
  name: String!
  description: String!
  priceMonthly: Float
  priceYearly: Float
  limits: ResourceLimits!
  gpuSharingRequired: Boolean!
}

enum SubscriptionTier {
  FREE
  SIMPLE
  PLUS
  PREMIUM
  ENTERPRISE
}

type Query {
  mySubscription: Subscription
  subscriptionPlans: [SubscriptionPlan!]!
  subscriptionPlan(tier: SubscriptionTier!): SubscriptionPlan
}

type Mutation {
  createSubscription(tier: SubscriptionTier!, paymentId: String): Subscription!
  upgradeSubscription(tier: SubscriptionTier!, paymentId: String!): Subscription!
  cancelSubscription: Boolean!
}

