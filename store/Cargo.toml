# =============================================================================
# Workspace root (STACK/contract) – members: this package + .project/*/contract
# Former .clippy.toml merged here: lint levels in [workspace.lints.clippy] and
# [lints.rust]. Clippy config (e.g. cognitive-complexity-threshold) used defaults.
# =============================================================================
[workspace]
members = ["."]
exclude = [
    "**/target",
    "**/src",
    "**/tests",
    "**/examples",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ChainRice Team <info@chainrice.com>"]
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
single_char_lifetime_names = "allow"

[workspace.dependencies]
cosmwasm-std = "3.0.2"
cosmwasm-storage = "1.5.2"
cosmwasm-schema = "3.0.2"
cw2 = "3.0.0"
cw-storage-plus = "3.0.1"
cw-utils = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.1.0"
thiserror = "2.0"
uint = "0.10"
ark-bn254 = "0.5"
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-groth16 = "0.5"

# =============================================================================
# Package: contract (this directory)
# =============================================================================
[package]
edition = "2021"
name = "contract"
description = "Multi-chain bridge contracts and connectors"

[lib]
name = "contract"
path = "rust/app/app.rs"
crate-type = ["cdylib", "rlib"]

[lints.rust]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
single_char_lifetime_names = "allow"

[dependencies]
cosmwasm-std = { workspace = true, features = ["staking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
ark-bn254 = { workspace = true }
ark-ec = { workspace = true, default-features = false }
ark-ff = { workspace = true, default-features = false }
ark-groth16 = { workspace = true }

[features]
default = ["arkworks"]
arkworks = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
