name: rice-haskell
version: 1.0.0.0
description: Rice Framework - Haskell Layer: Logic Verification & .rice Parser
author: Rice Framework Team
maintainer: rice@example.com
license: MIT
copyright: 2024 Rice Framework Team

extra-source-files:
  - README.md

library:
  source-dirs: src
  dependencies:
    - base >= 4.14 && < 5.0
    - megaparsec >= 9.0
    - aeson >= 2.0
    - text >= 2.0
    - bytestring >= 0.11

executables:
  rice-parser:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -Wall
      - -Werror
      - -O2
    dependencies:
      - rice-haskell

tests:
  rice-haskell-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - rice-haskell
      - hspec >= 2.10
