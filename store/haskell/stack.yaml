# Stack configuration for Rice Framework - Haskell Layer
# Logic Verification & .rice Parser

resolver: lts-21.0

packages:
  - .

extra-deps:
  - megaparsec-9.6.0
  - aeson-2.2.1

ghc-options:
  "$locals": -Wall -Werror -O2
  "$everything": -Wall

flags: {}

extra-package-dbs: []

nix:
  enable: false

docker:
  enable: false

system-ghc: true

install-ghc: true
