# AI Analytics Platform - Python Package Configuration
[tool.poetry]
name = "ai-analytics-platform"
version = "1.0.0"
description = "AI, financial analytics, AI API integrations, text, image and audio processing"
authors = ["Code-Rice <infocoderice@gmail.com>"]
license = "MIT"

# Main package dependencies
[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# --- AI and Machine Learning ---
torch = "^2.4.0"                 # PyTorch deep learning framework
transformers = "^4.44.0"         # Hugging Face transformers library
diffusers = "^0.30.0"            # Diffusion models for image generation
accelerate = "^0.33.0"           # Training acceleration library
openai = "^1.45.0"               # OpenAI API client
langchain = "^0.3.4"             # LangChain framework for LLM applications
llama-index = "^0.11.23"         # LlamaIndex for RAG applications
sentence-transformers = "^3.2.0" # Sentence embeddings and similarity

# --- RAG and Knowledge Bases ---
faiss-cpu = "^1.9.0"            # Facebook AI Similarity Search (CPU version)
chromadb = "^0.5.0"             # Vector database for embeddings
ollama = "^0.4.4"               # Ollama Python SDK for local LLMs
langchain-community = "^0.3.12" # LangChain community integrations
langgraph = "^0.2.58"           # LangGraph for agent workflows
rich = "^13.9.4"                # Rich text and beautiful formatting

# --- Audio, Image, Video Processing ---
pillow = "^10.4.0"        # Python Imaging Library
opencv-python = "^4.10.0" # Computer vision library
soundfile = "^0.12.1"     # Audio file I/O
pydub = "^0.25.1"         # Audio manipulation
tiktoken = "^0.7.0"       # Tokenization for LLMs

# --- Finance and Analytics ---
pandas = "^2.2.2"       # Data manipulation and analysis
numpy = "^1.26.4"       # Numerical computing
scipy = "^1.14.1"       # Scientific computing
matplotlib = "^3.9.2"   # Plotting library
plotly = "^5.24.1"      # Interactive plotting
seaborn = "^0.13.2"     # Statistical data visualization
statsmodels = "^0.14.3" # Statistical modeling
scikit-learn = "^1.5.2" # Machine learning library

# --- Integrations and APIs ---
requests = "^2.32.3" # HTTP library
httpx = "^0.27.2"    # Modern HTTP client
fastapi = "^0.115.0" # Web framework for APIs
uvicorn = "^0.30.6"  # ASGI server

# --- Other Tools ---
python-dotenv = "^1.0.1" # Environment variable management
loguru = "^0.7.2"        # Logging library
tqdm = "^4.66.5"         # Progress bars
jinja2 = "^3.1.4"        # Template engine

# Development dependencies
[tool.poetry.group.dev.dependencies]
black = "^24.10.0"    # Code formatter
ruff = "^0.6.9"       # Fast Python linter
pytest = "^8.3.3"     # Testing framework
ipykernel = "^6.29.5" # Jupyter kernel
notebook = "^7.2.2"   # Jupyter notebook

# Build system configuration
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================================================
# BLACK FORMATTER CONFIGURATION
# ============================================================================
[tool.black]
line-length = 120
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | bazel-*
)/
'''

# ============================================================================
# RUFF LINTER & FORMATTER CONFIGURATION
# ============================================================================
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "bazel-*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "B905", # zip() without an explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Unused imports in __init__.py
"test_*.py" = ["S101"]   # Use of assert
"*_test.py" = ["S101"]   # Use of assert

[tool.ruff.lint.isort]
known-first-party = ["core", "integration"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ============================================================================
# PYTEST CONFIGURATION
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["core", "integration"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=core",
    "--cov=integration",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

# ============================================================================
# MYPY TYPE CHECKING
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================
[tool.coverage.run]
source = ["core", "integration"]
omit = ["*/test_*.py", "*/*_test.py", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
