syntax = "proto3";

package chainrice.chainrice.enums;

option go_package = "github.com/chainrice/chainrice/x/chainrice/types";

// TaxType represents tax type
enum TaxType {
  TAX_TYPE_UNSPECIFIED = 0;
  TAX_TYPE_VAT = 1; // VAT
  TAX_TYPE_INCOME_TAX = 2; // Income tax
  TAX_TYPE_SALES_TAX = 3; // Sales tax
  TAX_TYPE_OTHER = 4; // Other
}

// VATRate represents standard VAT rates in Poland
enum VATRate {
  VAT_RATE_UNSPECIFIED = 0;
  VAT_RATE_0 = 1; // 0% - exempt
  VAT_RATE_5 = 2; // 5% - reduced
  VAT_RATE_8 = 3; // 8% - reduced
  VAT_RATE_23 = 4; // 23% - standard
  VAT_RATE_EXEMPT = 5; // exempt
  VAT_RATE_NOT_APPLICABLE = 6; // not applicable
}
