syntax = "proto3";

package chainrice.chainrice.services;

import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "messages/cafe/menu.proto";

option go_package = "chain-rice/x/chainrice/types";

// CafeService defines the gRPC service for cafe operations
service CafeService {
  // Menu operations
  rpc CreateMenuItem(CreateMenuItemRequest) returns (CreateMenuItemResponse) {
    option (google.api.http).post = "/chain-rice/cafe/v1/menu";
  }

  rpc GetMenuItem(GetMenuItemRequest) returns (GetMenuItemResponse) {
    option (google.api.http).get = "/chain-rice/cafe/v1/menu/{id}";
  }

  rpc ListMenuItems(ListMenuItemsRequest) returns (ListMenuItemsResponse) {
    option (google.api.http).get = "/chain-rice/cafe/v1/menu";
  }

  // Reservation operations
  rpc CreateReservation(CreateReservationRequest) returns (CreateReservationResponse) {
    option (google.api.http).post = "/chain-rice/cafe/v1/reservations";
  }

  rpc GetReservation(GetReservationRequest) returns (GetReservationResponse) {
    option (google.api.http).get = "/chain-rice/cafe/v1/reservations/{id}";
  }

  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse) {
    option (google.api.http).get = "/chain-rice/cafe/v1/reservations";
  }

  // Order operations
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http).post = "/chain-rice/cafe/v1/orders";
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http).get = "/chain-rice/cafe/v1/orders/{id}";
  }

  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http).get = "/chain-rice/cafe/v1/orders";
  }
}

// Menu request/response messages
message CreateMenuItemRequest {
  MenuItem menu_item = 1;
}

message CreateMenuItemResponse {
  string id = 1;
}

message GetMenuItemRequest {
  string id = 1;
}

message GetMenuItemResponse {
  MenuItem menu_item = 1;
}

message ListMenuItemsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  string category = 2; // optional filter by category
  bool available_only = 3; // optional filter for available items only
}

message ListMenuItemsResponse {
  repeated MenuItem menu_items = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// Reservation request/response messages
message CreateReservationRequest {
  Reservation reservation = 1;
}

message CreateReservationResponse {
  string id = 1;
}

message GetReservationRequest {
  string id = 1;
}

message GetReservationResponse {
  Reservation reservation = 1;
}

message ListReservationsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  string status = 2; // optional filter by status
}

message ListReservationsResponse {
  repeated Reservation reservations = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// Order request/response messages
message CreateOrderRequest {
  Order order = 1;
}

message CreateOrderResponse {
  string id = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  string status = 2; // optional filter by status
  string reservation_id = 3; // optional filter by reservation
}

message ListOrdersResponse {
  repeated Order orders = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
