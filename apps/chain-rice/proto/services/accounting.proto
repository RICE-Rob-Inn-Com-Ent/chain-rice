syntax = "proto3";

package chainrice.chainrice.services;

import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "messages/accounting/invoice.proto";

option go_package = "chain-rice/x/chainrice/types";

// AccountingService defines the gRPC service for accounting operations
service AccountingService {
  // CreateInvoice creates a new invoice
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse) {
    option (google.api.http).post = "/chain-rice/accounting/v1/invoices";
  }

  // GetInvoice retrieves an invoice by ID
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) {
    option (google.api.http).get = "/chain-rice/accounting/v1/invoices/{id}";
  }

  // ListInvoices lists all invoices with pagination
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option (google.api.http).get = "/chain-rice/accounting/v1/invoices";
  }

  // UpdateInvoice updates an existing invoice
  rpc UpdateInvoice(UpdateInvoiceRequest) returns (UpdateInvoiceResponse) {
    option (google.api.http).put = "/chain-rice/accounting/v1/invoices/{id}";
  }

  // DeleteInvoice deletes an invoice
  rpc DeleteInvoice(DeleteInvoiceRequest) returns (DeleteInvoiceResponse) {
    option (google.api.http).delete = "/chain-rice/accounting/v1/invoices/{id}";
  }

  // GetDashboardStats retrieves dashboard statistics
  rpc GetDashboardStats(GetDashboardStatsRequest) returns (GetDashboardStatsResponse) {
    option (google.api.http).get = "/chain-rice/accounting/v1/dashboard/stats";
  }
}

// Request/Response messages
message CreateInvoiceRequest {
  Invoice invoice = 1;
}

message CreateInvoiceResponse {
  string id = 1;
}

message GetInvoiceRequest {
  string id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message ListInvoicesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  string status = 2; // optional filter by status
  string category = 3; // optional filter by category
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message UpdateInvoiceRequest {
  string id = 1;
  Invoice invoice = 2;
}

message UpdateInvoiceResponse {
  Invoice invoice = 1;
}

message DeleteInvoiceRequest {
  string id = 1;
}

message DeleteInvoiceResponse {}

message GetDashboardStatsRequest {}

message GetDashboardStatsResponse {
  DashboardStats stats = 1;
}
