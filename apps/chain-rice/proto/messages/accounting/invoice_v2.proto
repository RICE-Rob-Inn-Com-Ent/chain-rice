syntax = "proto3";

package chainrice.chainrice.accounting;

import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";
import "enums/payment.proto";
import "enums/tax.proto";

option go_package = "github.com/chainrice/chainrice/x/chainrice/types";

// InvoiceIdentifier represents different types of invoice identifiers
message InvoiceIdentifier {
  oneof identifier {
    string uuid = 1;           // Internal UUID (primary key)
    string business_number = 2; // Human-readable business number (e.g., "INV-2024-001")
    string external_id = 3;    // External system ID
    string transaction_hash = 4; // Blockchain transaction hash
  }
}

// Invoice represents a business invoice
message Invoice {
  // Primary identifier (choose one based on context)
  InvoiceIdentifier id = 1;
  
  // Business information
  string vendor_name = 2;
  string vendor_tax_id = 3;
  string vendor_address = 4;
  
  // Dates
  google.protobuf.Timestamp issue_date = 5 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp due_date = 6 [(gogoproto.stdtime) = true];
  
  // Financial information
  double total_amount = 7;
  double tax_amount = 8;
  double net_amount = 9;
  string currency = 10;
  
  // Business details
  string description = 11;
  string category = 12;
  string status = 13; // pending, paid, overdue, cancelled
  
  // Items and metadata
  repeated InvoiceItem items = 14;
  string receipt_image_path = 15;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 16 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp updated_at = 17 [(gogoproto.stdtime) = true];
}

// Alternative: Simple approach with clear naming
message SimpleInvoice {
  // Use UUID as primary key, business number as display identifier
  string uuid = 1;                    // Internal UUID (database primary key)
  string business_number = 2;         // Human-readable number (e.g., "INV-2024-001")
  
  // Rest of the fields...
  string vendor_name = 3;
  string vendor_tax_id = 4;
  string vendor_address = 5;
  google.protobuf.Timestamp issue_date = 6 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp due_date = 7 [(gogoproto.stdtime) = true];
  double total_amount = 8;
  double tax_amount = 9;
  double net_amount = 10;
  string currency = 11;
  string description = 12;
  string category = 13;
  string status = 14;
  repeated InvoiceItem items = 15;
  string receipt_image_path = 16;
  google.protobuf.Timestamp created_at = 17 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp updated_at = 18 [(gogoproto.stdtime) = true];
}

// InvoiceItem represents a single invoice item
message InvoiceItem {
  string id = 1;                    // Item UUID
  string product_code = 2;          // Product/SKU code
  string name = 3;
  string description = 4;
  double quantity = 5;
  double unit_price = 6;
  double total_price = 7;
  double tax_rate = 8;
  double tax_amount = 9;
  string category = 10;
}
