syntax = "proto3";

package chainrice.chainrice.blockchain;

import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/chainrice/chainrice/x/chainrice/types";

// Validator represents a blockchain validator
message Validator {
  // Validator name/identifier
  string name = 1;
  
  // Bonded stake amount
  string bonded = 2;
  
  // Stake amount in numeric format
  uint64 stake_amount = 3;
  
  // Token balance
  uint64 token_balance = 4;
  
  // Validator status
  ValidatorStatus status = 5;
  
  // Commission rate (percentage)
  double commission_rate = 6;
  
  // Uptime percentage
  double uptime = 7;
  
  // Voting power percentage
  double voting_power = 8;
  
  // Last activity timestamp
  google.protobuf.Timestamp last_activity = 9 [(gogoproto.stdtime) = true];
  
  // Bitcoin balance
  double bitcoin_balance = 10;
  
  // Bitcoin address
  string bitcoin_address = 11;
  
  // Created timestamp
  google.protobuf.Timestamp created_at = 12 [(gogoproto.stdtime) = true];
  
  // Updated timestamp
  google.protobuf.Timestamp updated_at = 13 [(gogoproto.stdtime) = true];
}

// ValidatorStatus represents the status of a validator
enum ValidatorStatus {
  VALIDATOR_STATUS_UNSPECIFIED = 0;
  VALIDATOR_STATUS_ACTIVE = 1;
  VALIDATOR_STATUS_INACTIVE = 2;
  VALIDATOR_STATUS_JAILED = 3;
  VALIDATOR_STATUS_TOMBSTONED = 4;
}

// ValidatorStats represents network-wide validator statistics
message ValidatorStats {
  // Total number of validators
  uint32 total_validators = 1;
  
  // Total stake across all validators
  uint64 total_stake = 2;
  
  // Total tokens in circulation
  uint64 total_tokens = 3;
  
  // Number of active validators
  uint32 active_validators = 4;
  
  // Network uptime percentage
  double network_uptime = 5;
  
  // Total Bitcoin holdings
  double total_bitcoin_balance = 6;
  
  // Bitcoin USD value
  double bitcoin_usd_value = 7;
  
  // 24h Bitcoin price change
  double bitcoin_price_change_24h = 8;
}

// BitcoinBalance represents Bitcoin balance information
message BitcoinBalance {
  // Bitcoin address
  string address = 1;
  
  // Balance in BTC
  double balance_btc = 2;
  
  // Balance in satoshis
  int64 balance_satoshis = 3;
  
  // USD value
  double usd_value = 4;
  
  // Last updated timestamp
  google.protobuf.Timestamp last_updated = 5 [(gogoproto.stdtime) = true];
  
  // Number of confirmations
  uint32 confirmations = 6;
  
  // Transaction count
  uint32 transaction_count = 7;
}

// ValidatorQueryRequest represents a request to query validator data
message ValidatorQueryRequest {
  // Optional validator name filter
  string validator_name = 1;
  
  // Optional status filter
  ValidatorStatus status = 2;
  
  // Pagination parameters
  uint32 page = 3;
  uint32 page_size = 4;
  
  // Include Bitcoin balance data
  bool include_bitcoin_balance = 5;
}

// ValidatorQueryResponse represents the response to a validator query
message ValidatorQueryResponse {
  // List of validators
  repeated Validator validators = 1;
  
  // Network statistics
  ValidatorStats stats = 2;
  
  // Total count for pagination
  uint32 total_count = 3;
  
  // Current page
  uint32 current_page = 4;
  
  // Total pages
  uint32 total_pages = 5;
}
