syntax = "proto3";

package chainrice.chainrice.messages;

import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/chainrice/chainrice/x/chainrice/types";

message Cat {
  string id = 1;
  string name = 2;
  int32 age = 3;
  string breed = 4;
  string color = 5;
  string gender = 6; // male, female
  double weight = 7;
  string health_status = 8; // healthy, sick, vaccinated
  string personality = 9;
  string description = 10;
  repeated string image_urls = 11;
  bool is_adoptable = 12;
  bool is_active = 13;
  google.protobuf.Timestamp arrival_date = 14 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp created_at = 15 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp updated_at = 16 [(gogoproto.stdtime) = true];
}