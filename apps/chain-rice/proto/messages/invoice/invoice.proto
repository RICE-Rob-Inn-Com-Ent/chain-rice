syntax = "proto3";

package chainrice.chainrice.invoice;

import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";
import "messages/invoice/parties.proto";
import "messages/invoice/items.proto";
import "messages/invoice/payment.proto";
import "messages/invoice/tax.proto";
import "enums/payment.proto";

option go_package = "github.com/chainrice/chainrice/x/chainrice/types";

// Invoice represents the main invoice
message Invoice {
  // Basic invoice information
  string invoice_number = 1;
  string invoice_type = 2; // "sale", "purchase", "credit_note", etc.
  string description = 3;
  string category = 4;
  string status = 5; // "pending", "paid", "overdue", "cancelled"
  
  // Dates
  string issue_date = 6;
  string due_date = 7;
  
  // Transaction parties
  Party seller = 8;
  Party buyer = 9;
  
  // Invoice items
  repeated InvoiceItem items = 10;
  
  // Payment information
  Payment payment = 11;
  
  // Tax information
  Tax tax = 12;
  
  // Additional information
  string receipt_image_path = 13;
  string notes = 14;
  
  // Metadata
  google.protobuf.Timestamp created_at = 15 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp updated_at = 16 [(gogoproto.stdtime) = true];
}
