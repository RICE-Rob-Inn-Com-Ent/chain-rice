# ==============================================================================
# RICE-MONO PRE-COMMIT - MINIMAL & FAST
# ==============================================================================
# Philosophy: VSCode extensions handle linting in real-time
# Pre-commit: Only quick auto-fixes + critical checks (~2-5 seconds)
# CI/CD: Heavy linting and validation
# ==============================================================================

# ==============================================================================
# GLOBAL EXCLUDES
# ==============================================================================
exclude: |
  (?x)^(
    # Build artifacts & caches
    .*\.frontend/flutter/.dart_tool/.*|
    .*\.frontend/android/.gradle/.*|
    .*node_modules/.*|
    .*dist/.*|
    .*build/.*|
    .*target/.*|
    .*bazel-.*/.*|
    .*vendor/.*|
    .*deps/.*|
    .*__pycache__/.*|
    .*\.pytest_cache/.*|
    .*\.ruff_cache/.*|
    .*\.mypy_cache/.*|
    .*\.next/.*|
    .*out/.*|

    # Third-party & generated
    .*\.schema/token/third_party/.*|
    .*_pb\..*|
    .*_pb2\.py$|
    .*_pb2_grpc\.py$|
    .*\.pb\.go$|
    .*\.pb\.gw\.go$|
    .*\.generated\..*|

    # Lock files
    .*\.lock$|
    .*package-lock\.json$|
    .*yarn\.lock$|
    .*pnpm-lock\.yaml$|
    .*poetry\.lock$|
    .*Cargo\.lock$|
    .*go\.sum$|
    .*go\.work\.sum$|
    .*pubspec\.lock$|
    .*Podfile\.lock$|

    # Minified & binary
    .*\.min\.(js|css)$|
    .*\.bundle\.(js|css)$|
    .*\.chunk\.(js|css)$|
    .*\.phar$|
    .*\.wasm$|

    # IDE
    .*\.vscode/.*|
    .*\.idea/.*
  )$

# ==============================================================================
# REPOSITORIES & HOOKS
# ==============================================================================
repos:
  # =============================================================================
  # 1. FILE CLEANUP (Fast - always run)
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "✂️  Trim whitespace"

      - id: end-of-file-fixer
        name: "📄 Fix EOF"

      - id: mixed-line-ending
        name: "🔧 Fix line endings"
        args: [--fix=lf]

      - id: check-merge-conflict
        name: "⚠️  Check merge conflicts"

      - id: check-added-large-files
        name: "🚫 Check large files"
        args: [--maxkb=2000]

  # =============================================================================
  # 2. SYNTAX VALIDATION (Fast - critical errors only)
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: "✅ YAML syntax"
        files: \.(yaml|yml)$
        exclude: .*\.dev/k8s/templates/.*

      - id: check-json
        name: "✅ JSON syntax"
        files: \.(json|jsonc)$
        exclude: .*tsconfig.*\.json$

      - id: check-toml
        name: "✅ TOML syntax"

  # =============================================================================
  # 3. PYTHON AUTO-FORMAT (Fast - only formatting, NO linting)
  # =============================================================================
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: "🐍 Format Python"
        language_version: python3
        files: ^\.bot/.*\.py$
        args: [--line-length=120, --target-version=py312]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: "🐍 Sort imports"
        files: ^\.bot/.*\.py$
        args: [--profile=black, --line-length=120]

  # =============================================================================
  # 4. GO AUTO-FORMAT (Fast - only formatting, NO linting)
  # =============================================================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: "🔵 Format Go"
        files: ^\.backend/.*\.go$

      - id: go-imports
        name: "🔵 Organize imports"
        files: ^\.backend/.*\.go$

  # =============================================================================
  # 5. RUST AUTO-FORMAT (Fast - only formatting, NO linting)
  # =============================================================================
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: "🦀 Format Rust"
        files: ^\.backend/contract/rust/.*\.rs$
        args: [--manifest-path=.backend/contract/rust/Cargo.toml, --]

  # =============================================================================
  # 6. JS/TS AUTO-FORMAT (Fast - only Prettier, NO ESLint)
  # =============================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: "✨ Format JS/TS"
        files: ^\.frontend/web/.*\.(js|jsx|ts|tsx|json|css|scss)$
        args: [--write, --print-width=120, --single-quote, --tab-width=2]

  # =============================================================================
  # 7. SHELL AUTO-FORMAT (Fast - only formatting)
  # =============================================================================
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        name: "🐚 Format shell"
        files: \.(sh|bash)$
        args: [-w, -i, "2", -ci]

  # =============================================================================
  # 8. BAZEL FORMAT (Fast)
  # =============================================================================
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 7.3.1
    hooks:
      - id: buildifier
        name: "🏗️  Format Bazel"
        files: (BUILD\.bazel|WORKSPACE|MODULE\.bazel|\.bzl)$
        args: [-mode=fix]

  # =============================================================================
  # 9. SECURITY (Fast - must have)
  # =============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "🔒 Detect secrets"
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            .*README\.md$|
            .*test.*|
            .*mock.*|
            \.devcontainer/.*|
            \.doc/.*|
            \.github/.*
          )$

  # =============================================================================
  # 10. COMMIT MESSAGE (Fast - must have)
  # =============================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        name: "💬 Commit format"
        stages: [commit-msg]

  # =============================================================================
  # 11. GIT SAFETY (Fast - must have)
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        name: "🛡️  Protect main"
        args: [--branch=main, --branch=master, --branch=production]

# ==============================================================================
# CI CONFIGURATION (pre-commit.ci)
# ==============================================================================
ci:
  autofix_commit_msg: "[pre-commit.ci] auto fixes"
  autofix_prs: true
  autoupdate_schedule: monthly
  skip: []
  submodules: false
