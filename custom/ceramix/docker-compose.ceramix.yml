# Project-specific services for ceramix - AUTO-GENERATED
# This file is generated by generate-docker-compose.sh
# Do not edit manually - run ../generate-docker-compose.sh to regenerate
# Use with: docker compose -f ../../docker-compose.yml -f ../../.devcontainer/docker-compose.dev.yml -f docker-compose.ceramix.yml up
# Standardized routing: panel.{projekt}.ltd (e.g., panel.ceramix.ltd)

services:

  # Web service for ceramix
  ceramix-web:
    env_file:
      - .project/ceramix/.env.project
    build:
      context: /home/mrDinkelman/rice-mono
      dockerfile: .project/ceramix/web/Dockerfile
    image: ceramix-web:latest
    container_name: ceramix-web
    profiles: ["ceramix"]
    environment:
      - NODE_ENV=development
      - PORT=3002
      - NEXT_PUBLIC_APP_ID=ceramix-web
      # Force webpack polling for hot reload in Docker
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      # Project domain configuration (standardized)
      - PROJECT_NAME=ceramix
      - PROJECT_DOMAIN=ceramix.ltd
      - PROJECT_PANEL_DOMAIN=panel.ceramix.ltd
      - NEXT_PUBLIC_BASE_URL=http://ceramix.ltd
      - NEXT_PUBLIC_PANEL_URL=http://panel.ceramix.ltd
      # Database connections (from .env.project + global .env)
      - POSTGRES_HOST=${POSTGRES_HOST:-devcontainer-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_URL=${POSTGRES_URL}
      - DATABASE_URL=${DATABASE_URL}
      - MONGODB_HOST=${MONGODB_HOST:-devcontainer-mongodb}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_DB=${MONGODB_DB}
      - MONGODB_URL=${MONGODB_URL}
      - REDIS_HOST=${REDIS_HOST:-devcontainer-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB}
      - REDIS_URL=${REDIS_URL}
      # Infrastructure services (from global .env)
      - VAULT_ADDR=${VAULT_ADDR:-http://devcontainer-vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-root-token-dev}
      - CONSUL_ADDR=${CONSUL_ADDR:-http://devcontainer-consul:8500}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-devcontainer-elasticsearch}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - TRAEFIK_DASHBOARD_URL=http://host.docker.internal:8080
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://devcontainer-prometheus:9090}
      - GRAFANA_URL=${GRAFANA_URL:-http://devcontainer-grafana:3000}
      - JAEGER_QUERY_URL=${JAEGER_QUERY_URL:-http://devcontainer-jaeger:16686}
      - JAEGER_COLLECTOR_URL=${JAEGER_COLLECTOR_URL:-http://devcontainer-jaeger:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://devcontainer-jaeger:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://devcontainer-prometheus:4318/v1/metrics}
      - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      # AI & Data Stack (from global .env)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-devcontainer-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      # Storage URLs (standardized)
      - STORAGE_BASE_URL=${STORAGE_BASE_URL:-http://devcontainer-minio:9000}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-http://storage.ceramix.ltd}
      - WEAVIATE_URL=${WEAVIATE_URL:-http://devcontainer-weaviate:8080}
      - KAFKA_BROKER=${KAFKA_BROKER:-devcontainer-kafka:29092}
      - KAFKA_ZOOKEEPER=${KAFKA_ZOOKEEPER:-devcontainer-zookeeper:2181}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://admin:admin@devcontainer-rabbitmq:5672}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://devcontainer-mlflow:5000}
      - IPFS_API_URL=${IPFS_API_URL:-http://devcontainer-ipfs:5001}
      - IPFS_GATEWAY_URL=${IPFS_GATEWAY_URL:-http://devcontainer-ipfs:8080}
      # New AI & Logging Services (from global .env)
      - LOKI_URL=${LOKI_URL:-http://devcontainer-loki:3100}
      - OLLAMA_URL=${OLLAMA_URL:-http://devcontainer-ollama:11434}
      - LANGGRAPH_STUDIO_URL=${LANGGRAPH_STUDIO_URL:-http://devcontainer-langgraph-studio:8123}
      # CerAI Bot API URL
      - NEXT_PUBLIC_CERAI_API_URL=${NEXT_PUBLIC_CERAI_API_URL:-http://ceramix-bot:8000}
      # Contract bridges (shared service)
      - CONTRACT_BRIDGES_URL=${CONTRACT_BRIDGES_URL:-http://contract-bridges:8080}
    ports:
      - "3002:3002"
    volumes:
      # Mount source code for hot reload - changes are immediately visible
      - /home/mrDinkelman/rice-mono/.project/ceramix/web:/app/.project/ceramix/web
      # Mount STACK/node package.json and workspace config for workspace support
      - /home/mrDinkelman/rice-mono/.devcontainer/node/package.json:/app/package.json:ro
      - /home/mrDinkelman/rice-mono/.devcontainer/node/pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
    networks:
      - crice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Standardized routing: panel.{projekt}.ltd (e.g., panel.ceramix.ltd, panel.code-rice.ltd)
      - "traefik.http.routers.ceramix-web.rule=Host(`ceramix.ltd`) || Host(`panel.ceramix.ltd`)"
      - "traefik.http.routers.ceramix-web.entrypoints=web"
      - "traefik.http.routers.ceramix-web.service=ceramix-web"
      - "traefik.http.services.ceramix-web.loadbalancer.server.port=3002"
      # HTTPS router (standardized)
      - "traefik.http.routers.ceramix-web-https.rule=Host(`ceramix.ltd`) || Host(`panel.ceramix.ltd`)"
      - "traefik.http.routers.ceramix-web-https.entrypoints=websecure"
      - "traefik.http.routers.ceramix-web-https.service=ceramix-web"
      - "traefik.http.routers.ceramix-web-https.tls=true"
      - "traefik.http.routers.ceramix-web-https.tls.options=default"
      # Proxy CerAI API through web service
      - "traefik.http.middlewares.cerai-proxy.redirectregex.regex=^https?://panel.ceramix.ltd/api/cerai/(.*)"
      - "traefik.http.middlewares.cerai-proxy.redirectregex.replacement=http://ceramix-bot:8000/api/$${1}"
      - "traefik.http.middlewares.cerai-proxy.redirectregex.permanent=false"
      # Project metadata
      - "com.rice.project=ceramix"
      - "com.rice.project.name=${PROJECT_NAME:-ceramix}"
      - "com.rice.project.domain=ceramix.ltd"
      - "com.rice.project.panel.domain=panel.ceramix.ltd"
      - "com.rice.port=3002"
    depends_on:
      - ceramix-database

  # Bot service for ceramix (CerAI - FastAPI with LangGraph, OCR, RAG)
  ceramix-bot:
    env_file:
      - .project/ceramix/.env.project
    build:
      context: /home/mrDinkelman/rice-mono
      dockerfile: .project/ceramix/bot/Dockerfile
    image: ceramix-bot:latest
    container_name: ceramix-bot
    profiles: ["ceramix"]
    command: uvicorn core.cerai_server:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/core
    environment:
      - PROJECT_NAME=ceramix
      # Database connections
      - DATABASE_URL=${DATABASE_URL:-postgresql://ceramix_user:ceramix_pass@devcontainer-postgres:5432/ceramix}
      - POSTGRES_HOST=${POSTGRES_HOST:-devcontainer-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-ceramix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ceramix_pass}
      - POSTGRES_DB=${POSTGRES_DB:-ceramix}
      # Redis connection
      - REDIS_URL=${REDIS_URL:-redis://devcontainer-redis:6379/0}
      - REDIS_HOST=${REDIS_HOST:-devcontainer-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # MongoDB connection
      - MONGODB_URL=${MONGODB_URL:-mongodb://devcontainer-mongodb:27017/ceramix}
      - MONGODB_HOST=${MONGODB_HOST:-devcontainer-mongodb}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_DB=${MONGODB_DB:-ceramix}
      # AI Services
      - OLLAMA_URL=${OLLAMA_URL:-http://devcontainer-ollama:11434}
      - LANGGRAPH_STUDIO_URL=${LANGGRAPH_STUDIO_URL:-http://devcontainer-langgraph-studio:8123}
      # API Key for CerAI
      - CERAI_API_KEY=${CERAI_API_KEY:-cerai-dev-key}
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - /home/mrDinkelman/rice-mono/.project/ceramix/bot:/app
    networks:
      - crice
    restart: unless-stopped
    # depends_on:
    #   - ceramix-database
    labels:
      - "com.rice.project=ceramix"
      - "com.rice.service=bot"
      - "traefik.enable=true"
      - "traefik.http.routers.cerai-api.rule=Host(`cerai.ceramix.ltd`) || Host(`api-cerai.ceramix.ltd`) || (Host(`panel.ceramix.ltd`) && PathPrefix(`/api/cerai`))"
      - "traefik.http.routers.cerai-api.entrypoints=web"
      - "traefik.http.routers.cerai-api.service=cerai-api"
      - "traefik.http.routers.cerai-api.middlewares=cerai-stripprefix"
      - "traefik.http.middlewares.cerai-stripprefix.stripprefix.prefixes=/api/cerai"
      - "traefik.http.services.cerai-api.loadbalancer.server.port=8000"

  # Contract service for ceramix
  ceramix-contract:
    env_file:
      - .project/ceramix/.env.project
    build:
      context: /home/mrDinkelman/rice-mono/.project/ceramix/contract
      dockerfile: Dockerfile
    image: ceramix-contract:latest
    container_name: ceramix-contract
    profiles: ["ceramix"]
    networks:
      - crice
    restart: unless-stopped
    labels:
      - "com.rice.project=ceramix"
      - "com.rice.service=contract"
    # Note: contract-bridges is in devcontainer stack, accessible via network

  # Database service for ceramix (Go service managing data flow)
  ceramix-database:
    env_file:
      - .project/ceramix/.env.project
    build:
      context: /home/mrDinkelman/rice-mono
      dockerfile: .project/ceramix/database/Dockerfile
    image: ceramix-database:latest
    container_name: ceramix-database
    profiles: ["ceramix"]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-devcontainer-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=ceramix
      - MONGODB_HOST=${MONGODB_HOST:-devcontainer-mongodb}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_DB=ceramix
      - REDIS_HOST=${REDIS_HOST:-devcontainer-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PORT=8080
    volumes:
      # Mount source code for hot reload
      - /home/mrDinkelman/rice-mono/.project/ceramix/database:/app
    networks:
      - crice
    # Note: postgres, mongodb, redis are in devcontainer stack, accessible via network
    restart: unless-stopped
    labels:
      - "com.rice.project=ceramix"
      - "com.rice.service=database"

  # Flutter Desktop App for ceramix
  ceramix-desktop:
    env_file:
      - .project/ceramix/.env.project
    build:
      context: /home/mrDinkelman/rice-mono/.project/ceramix/desktop
      dockerfile: Dockerfile
    image: ceramix-desktop:latest
    container_name: ceramix-desktop
    profiles: ["ceramix"]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.X11-unix/X0
    volumes:
      - /home/mrDinkelman/rice-mono/.project/ceramix/desktop:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - flutter-pub-cache:/root/.pub-cache
    networks:
      - crice
    stdin_open: true
    tty: true
    restart: unless-stopped
    labels:
      - "com.rice.framework=Flutter"
      - "com.rice.project=ceramix"
    depends_on:
      - ceramix-web

  # Flutter Mobile App for ceramix
  ceramix-mobile:
    env_file:
      - .project/ceramix/.env.project
    build:
      context: /home/mrDinkelman/rice-mono/.project/ceramix/mobile
      dockerfile: Dockerfile
    image: ceramix-mobile:latest
    container_name: ceramix-mobile
    profiles: ["ceramix"]
    volumes:
      - /home/mrDinkelman/rice-mono/.project/ceramix/mobile:/app
      - flutter-pub-cache:/root/.pub-cache
    networks:
      - crice
    stdin_open: true
    tty: true
    restart: unless-stopped
    labels:
      - "com.rice.framework=Flutter"
      - "com.rice.project=ceramix"
    depends_on:
      - ceramix-web

volumes:
  flutter-pub-cache:
    driver: local

networks:
  crice:
    external: true
    name: crice
