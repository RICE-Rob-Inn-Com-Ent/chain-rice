      # AI & Data Stack (from global .env)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-devcontainer-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      # Storage URLs (standardized)
      - STORAGE_BASE_URL=${STORAGE_BASE_URL:-http://devcontainer-minio:9000}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-http://storage.code-rice.ltd}
