# Project-specific services for meowtopia - AUTO-GENERATED
# This file is generated by generate-docker-compose.sh
# Do not edit manually - run ../generate-docker-compose.sh to regenerate
# Use with: docker compose -f ../../docker-compose.yml -f ../../.devcontainer/docker-compose.dev.yml -f docker-compose.meowtopia.yml up
# Standardized routing: panel.{projekt}.ltd (e.g., panel.ceramix.ltd)

services:

  # Web service for meowtopia
  meowtopia-web:
    # Ładujemy projektowe sekrety (InPost, Orlen Paczka itd.) z dedykowanego pliku
    # Używamy absolutnej ścieżki, żeby uniknąć problemów z położeniem pliku względem compose.
    env_file:
      - /home/mrDinkelman/rice-mono/.project/meowtopia/.env.project
    build:
      context: /home/mrDinkelman/rice-mono
      dockerfile: .project/meowtopia/web/Dockerfile
    image: meowtopia-web:latest
    container_name: meowtopia-web
    profiles: ["meowtopia"]
    environment:
      - NODE_ENV=development
      - PORT=3004
      - NEXT_PUBLIC_APP_ID=meowtopia-web
      # Project domain configuration (standardized)
      - PROJECT_NAME=meowtopia
      - PROJECT_DOMAIN=meowtopia.ltd
      - PROJECT_PANEL_DOMAIN=panel.meowtopia.ltd
      - NEXT_PUBLIC_BASE_URL=http://meowtopia.ltd
      - NEXT_PUBLIC_PANEL_URL=http://panel.meowtopia.ltd
      - NEXTAUTH_URL=http://meowtopia.ltd
      # Database connections (from .env.project + global .env)
      - POSTGRES_HOST=${POSTGRES_HOST:-devcontainer-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-meowtopia}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://postgres:postgres@devcontainer-postgres:5432/meowtopia?schema=public}
      - DATABASE_URL=postgresql://postgres:postgres@devcontainer-postgres:5432/meowtopia?schema=public
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/.project/meowtopia/web/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      - MONGODB_HOST=${MONGODB_HOST:-devcontainer-mongodb}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_DB=${MONGODB_DB:-meowtopia}
      - MONGODB_URL=${MONGODB_URL:-mongodb://devcontainer-mongodb:27017/meowtopia}
      - REDIS_HOST=${REDIS_HOST:-devcontainer-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_URL=${REDIS_URL:-redis://devcontainer-redis:6379/0}
      - KAFKA_BROKER=${KAFKA_BROKER:-devcontainer-kafka:29092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-meowtopia-web}
      # Infrastructure services (from global .env)
      - VAULT_ADDR=${VAULT_ADDR:-http://devcontainer-vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-root-token-dev}
      - CONSUL_ADDR=${CONSUL_ADDR:-http://devcontainer-consul:8500}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-devcontainer-elasticsearch}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - TRAEFIK_DASHBOARD_URL=http://host.docker.internal:8080
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://devcontainer-prometheus:9090}
      - GRAFANA_URL=${GRAFANA_URL:-http://devcontainer-grafana:3000}
      - JAEGER_QUERY_URL=${JAEGER_QUERY_URL:-http://devcontainer-jaeger:16686}
      - JAEGER_COLLECTOR_URL=${JAEGER_COLLECTOR_URL:-http://devcontainer-jaeger:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://devcontainer-jaeger:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://devcontainer-prometheus:4318/v1/metrics}
      - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      # AI & Data Stack (from global .env)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-devcontainer-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      # Storage URLs (standardized)
      - STORAGE_BASE_URL=${STORAGE_BASE_URL:-http://devcontainer-minio:9000}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-http://storage.meowtopia.ltd}
      - WEAVIATE_URL=${WEAVIATE_URL:-http://devcontainer-weaviate:8080}
      - KAFKA_BROKER=${KAFKA_BROKER:-devcontainer-kafka:29092}
      - KAFKA_ZOOKEEPER=${KAFKA_ZOOKEEPER:-devcontainer-zookeeper:2181}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://admin:admin@devcontainer-rabbitmq:5672}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://devcontainer-mlflow:5000}
      - IPFS_API_URL=${IPFS_API_URL:-http://devcontainer-ipfs:5001}
      - IPFS_GATEWAY_URL=${IPFS_GATEWAY_URL:-http://devcontainer-ipfs:8080}
      # New AI & Logging Services (from global .env)
      - LOKI_URL=${LOKI_URL:-http://devcontainer-loki:3100}
      - OLLAMA_URL=${OLLAMA_URL:-http://devcontainer-ollama:11434}
      - LANGGRAPH_STUDIO_URL=${LANGGRAPH_STUDIO_URL:-http://devcontainer-langgraph-studio:8123}
      # Contract bridges (shared service)
      - CONTRACT_BRIDGES_URL=${CONTRACT_BRIDGES_URL:-http://contract-bridges:8080}
    ports:
      - "3004:3004"
    volumes:
      # Mount source code for hot reload - changes are immediately visible
      - /home/mrDinkelman/rice-mono/.project/meowtopia/web:/app/.project/meowtopia/web
      # Mount STACK/node package.json and workspace config for workspace support
      - /home/mrDinkelman/rice-mono/.devcontainer/node/package.json:/app/package.json:ro
      - /home/mrDinkelman/rice-mono/.devcontainer/node/pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
    networks:
      - crice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Standardized routing: panel.{projekt}.ltd (e.g., panel.ceramix.ltd, panel.code-rice.ltd)
      - "traefik.http.routers.meowtopia-web.rule=Host(`meowtopia.ltd`) || Host(`panel.meowtopia.ltd`)"
      - "traefik.http.routers.meowtopia-web.entrypoints=web"
      - "traefik.http.routers.meowtopia-web.service=meowtopia-web"
      - "traefik.http.services.meowtopia-web.loadbalancer.server.port=3004"
      - "traefik.http.services.meowtopia-web.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.meowtopia-web.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.meowtopia-web.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.services.meowtopia-web.loadbalancer.passHostHeader=true"
      # HTTPS router (standardized)
      - "traefik.http.routers.meowtopia-web-https.rule=Host(`meowtopia.ltd`) || Host(`panel.meowtopia.ltd`)"
      - "traefik.http.routers.meowtopia-web-https.entrypoints=websecure"
      - "traefik.http.routers.meowtopia-web-https.service=meowtopia-web"
      - "traefik.http.routers.meowtopia-web-https.tls=true"
      - "traefik.http.routers.meowtopia-web-https.tls.options=default"
      # Project metadata
      - "com.rice.project=meowtopia"
      - "com.rice.project.name=${PROJECT_NAME:-meowtopia}"
      - "com.rice.project.domain=meowtopia.ltd"
      - "com.rice.project.panel.domain=panel.meowtopia.ltd"
      - "com.rice.port=3004"
    depends_on:
      - meowtopia-database

  # Bot service for meowtopia (using shared Ollama infrastructure)
  meowtopia-bot:
    env_file:
      - .project/meowtopia/.env.project
    build:
      context: /home/mrDinkelman/rice-mono
      dockerfile: .project/meowtopia/bot/Dockerfile
    image: meowtopia-bot:latest
    container_name: meowtopia-bot
    profiles: ["meowtopia"]
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://devcontainer-ollama:11434}
      - PROJECT_NAME=meowtopia
    ports:
      - "8002:8000"
    volumes:
      # Mount source code for hot reload
      - /home/mrDinkelman/rice-mono/.project/meowtopia/bot:/app
    networks:
      - crice
    # Note: ollama is in devcontainer stack, accessible via network
    restart: unless-stopped
    labels:
      - "com.rice.project=meowtopia"
      - "com.rice.service=bot"

  # Contract service for meowtopia
  meowtopia-contract:
    env_file:
      - .project/meowtopia/.env.project
    build:
      context: /home/mrDinkelman/rice-mono/.project/meowtopia/contract
      dockerfile: Dockerfile
    image: meowtopia-contract:latest
    container_name: meowtopia-contract
    profiles: ["meowtopia"]
    networks:
      - crice
    restart: unless-stopped
    labels:
      - "com.rice.project=meowtopia"
      - "com.rice.service=contract"
    # Note: contract-bridges is in devcontainer stack, accessible via network

  # Database service for meowtopia (Go service managing data flow)
  # Uses devcontainer-postgres as root database with 3 access keys:
  # 1. postgres/postgres (root superuser)
  # 2. meowtopia_user/meowtopia_password (dedicated user)
  # 3. postgres/postgres (admin access via postgres user)
  meowtopia-database:
    # env_file:
    #   - .project/meowtopia/.env.project
    build:
      context: /home/mrDinkelman/rice-mono
      dockerfile: .project/meowtopia/database/Dockerfile
    image: meowtopia-database:latest
    container_name: meowtopia-database
    profiles: ["meowtopia"]
    environment:
      # Root database connection (devcontainer-postgres)
      - POSTGRES_HOST=${POSTGRES_HOST:-devcontainer-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-meowtopia}
      # Key 1: Root superuser (postgres/postgres)
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_ROOT_USER=postgres
      - POSTGRES_ROOT_PASSWORD=postgres
      # Key 2: Dedicated user (meowtopia_user/meowtopia_password)
      - POSTGRES_APP_USER=meowtopia_user
      - POSTGRES_APP_PASSWORD=meowtopia_password
      # Key 3: Admin access (postgres/postgres - same as root but for admin operations)
      - POSTGRES_ADMIN_USER=postgres
      - POSTGRES_ADMIN_PASSWORD=postgres
      # MongoDB connection (devcontainer-mongodb)
      - MONGODB_HOST=${MONGODB_HOST:-devcontainer-mongodb}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_DB=${MONGODB_DB:-meowtopia}
      - MONGODB_USERNAME=${MONGODB_USERNAME:-admin}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-admin}
      # Redis connection (devcontainer-redis)
      - REDIS_HOST=${REDIS_HOST:-devcontainer-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - PORT=8080
    volumes:
      # Mount source code for hot reload
      - /home/mrDinkelman/rice-mono/.project/meowtopia/database:/app
    networks:
      - crice
    # Note: postgres, mongodb, redis are external services from devcontainer stack
    # They are accessible via the 'crice' network
    # Dependencies are handled by network connectivity, not docker-compose depends_on
    # Note: Uses devcontainer-postgres as root database with shared postgres-data volume
    # All databases (postgres, ceramix, code-rice, meowtopia) are in the same PostgreSQL instance
    restart: unless-stopped
    labels:
      - "com.rice.project=meowtopia"
      - "com.rice.service=database"
      - "com.rice.database.root=devcontainer-postgres"
      - "com.rice.database.keys=3"

  # Flutter Desktop App for meowtopia
  meowtopia-desktop:
    env_file:
      - .project/meowtopia/.env.project
    build:
      context: /home/mrDinkelman/rice-mono/.project/meowtopia/desktop
      dockerfile: Dockerfile
    image: meowtopia-desktop:latest
    container_name: meowtopia-desktop
    profiles: ["meowtopia"]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.X11-unix/X0
    volumes:
      - /home/mrDinkelman/rice-mono/.project/meowtopia/desktop:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - flutter-pub-cache:/root/.pub-cache
    networks:
      - crice
    stdin_open: true
    tty: true
    restart: unless-stopped
    labels:
      - "com.rice.framework=Flutter"
      - "com.rice.project=meowtopia"
    depends_on:
      - meowtopia-web

  # Flutter Mobile App for meowtopia
  meowtopia-mobile:
    env_file:
      - .project/meowtopia/.env.project
    build:
      context: /home/mrDinkelman/rice-mono/.project/meowtopia/mobile
      dockerfile: Dockerfile
    image: meowtopia-mobile:latest
    container_name: meowtopia-mobile
    profiles: ["meowtopia"]
    volumes:
      - /home/mrDinkelman/rice-mono/.project/meowtopia/mobile:/app
      - flutter-pub-cache:/root/.pub-cache
    networks:
      - crice
    stdin_open: true
    tty: true
    restart: unless-stopped
    labels:
      - "com.rice.framework=Flutter"
      - "com.rice.project=meowtopia"
    depends_on:
      - meowtopia-web

volumes:
  flutter-pub-cache:
    driver: local

networks:
  crice:
    external: true
    name: crice
