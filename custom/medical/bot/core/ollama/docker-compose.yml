version: "3.9"

services:
  # Thoth - NLP & LLM (Port 8001)
  thoth:
    build:
      context: ./thoth
      dockerfile: Dockerfile
    container_name: rice-thoth
    ports:
      - "8001:8000"
      - "11434:11434"
    environment:
      - GOD_NAME=Thoth
      - GOD_ID=thoth
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - thoth-models:/root/.ollama
      - thoth-lora:/lora-adapters
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rice-ai

  # Ra - Image Generation (Port 8002)
  ra:
    build:
      context: ./ra
      dockerfile: Dockerfile
    container_name: rice-ra
    ports:
      - "8002:8000"
    environment:
      - GOD_NAME=Ra
      - GOD_ID=ra
      - PYTHONUNBUFFERED=1
    volumes:
      - ra-models:/models
      - ra-output:/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rice-ai

  # Isis - Audio Processing (Port 8003)
