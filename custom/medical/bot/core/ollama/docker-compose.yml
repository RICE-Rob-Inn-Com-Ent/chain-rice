      context: ./isis
      dockerfile: Dockerfile
    container_name: rice-isis
    ports:
      - "8003:8000"
    environment:
      - GOD_NAME=Isis
      - GOD_ID=isis
      - PYTHONUNBUFFERED=1
    volumes:
      - isis-models:/models
      - isis-output:/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rice-ai

  # Bastet - Computer Vision (Port 8004)
  bastet:
    build:
      context: ./bastet
      dockerfile: Dockerfile
    container_name: rice-bastet
    ports:
      - "8004:8000"
    environment:
      - GOD_NAME=Bastet
      - GOD_ID=bastet
      - PYTHONUNBUFFERED=1
    volumes:
      - bastet-models:/models
      - bastet-output:/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rice-ai

  # Maat - Content Moderation (Port 8005)
  maat:
    build:
      context: ./maat
      dockerfile: Dockerfile
    container_name: rice-maat
    ports:
      - "8005:8000"
    environment:
      - GOD_NAME=Maat
      - GOD_ID=maat
      - PYTHONUNBUFFERED=1
    volumes:
      - maat-models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rice-ai

  # Khnum - 3D Modeling (Port 8006)
  khnum:
    build:
      context: ./khnum
