volumes:
  thoth-models:
  thoth-lora:
  ra-models:
  ra-output:
  isis-models:
  isis-output:
  bastet-models:
  bastet-output:
  maat-models:
  khnum-models:
  khnum-output:

networks:
  rice-ai:
    driver: bridge
