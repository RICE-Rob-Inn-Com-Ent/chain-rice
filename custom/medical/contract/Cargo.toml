[package]
edition = "2021"
name = "cxt-token"
description = "CXT Token for Ceramix project on ChainRice blockchain"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cxt-token"
path = "src/main.rs"

[lints]
workspace = true
# Inherit workspace linting rules

[dependencies]
# CosmWasm (from workspace)
cosmwasm-std = { workspace = true }
cosmwasm-storage = { workspace = true }
cosmwasm-schema = { workspace = true }
cw2 = { workspace = true }
cw-storage-plus = { workspace = true }
cw-utils = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
uint = { workspace = true }

