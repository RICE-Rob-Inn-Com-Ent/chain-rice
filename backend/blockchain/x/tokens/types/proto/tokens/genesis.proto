syntax = "proto3";
package rice.tokens.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/rice-dev/backend/blockchain/x/tokens/types";

// GenesisState defines the tokens module's genesis state.
message GenesisState {
  repeated Token token_list = 1 [(gogoproto.nullable) = false];
  uint64 token_count = 2;
  Params params = 3 [(gogoproto.nullable) = false];
}
