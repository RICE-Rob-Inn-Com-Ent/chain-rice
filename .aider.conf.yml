# .aider.conf.yml
# Generated by: cue export infra/configs/aider.cue -t ai=<cursor|claude|copilot|windsurf>
# Do not edit manually — edit infra/configs/aider.cue instead

##
## Git
##
auto-commits: false # KING decides what commits
dirty-commits: false # never commit on dirty tree
commit-prompt: convco # conventional commits via convco
attribute-author: false # no aider watermark in git log
attribute-committer: false
subtree-only: false # full monorepo accessible

##
## Context — repo map
##
read:
  - .cursor/rules/KING.mdc # absolute law
  - .cursor/rules/MASON.mdc
  - .cursor/rules/SMITH.mdc
  - .cursor/rules/CLERK.mdc
  - .cursor/rules/BARD.mdc
  - .cursor/rules/SAGE.mdc
  - .cursor/rules/CHIEF.mdc
map-tokens: 4096 # larger map = better context across monorepo
map-refresh: files # refresh only on file change, not every msg
map-multiplier-no-files: 2 # no files provided — expand repo map
tags: true # use ctags if available

##
## Model behavior
##
architect: true # architect mode on by default
max-chat-history-tokens: 8192 # how much chat history to keep in context
reasoning-effort: high # KING thinks deeply (Qwen3 thinking mode)

##
## Output / format
##
pretty: true # colored output
stream: true # stream response as it arrives
dark-mode: true
show-diffs: true # always show diff before writing
verbose: false # no noise — important info only

##
## Safety — do not give Aider free reign
##
dry-run: false # flip to true for testing
yes-always: false # always ask before writing
auto-test: false # do not run tests automatically
auto-lint: false # do not run linter automatically

##
## Cache — token savings
##
cache-prompts: true # cache system prompt between turns
cache-keepalive-pings: 5 # keep cache alive (every 5 min)

##
## Editor
##
editor: nvim # or vim / nano — your choice
apply-shell-commands: false # Aider does not run shell commands on its own

##
## Watch mode — optional, rice rule running in background
##
watch-files: false # flip to true for auto-reaction on file changes


