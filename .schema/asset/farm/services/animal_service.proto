syntax = "proto3";

package com.agriculture.animals.services;

import "agriculture/animals/messages/animal_unit.proto";
import "agriculture/animals/messages/animal_herd.proto";
import "google/protobuf/empty.proto";

service AnimalService {
  rpc CreateAnimalUnit(CreateAnimalUnitRequest) returns (CreateAnimalUnitResponse);
  rpc GetAnimalUnit(GetAnimalUnitRequest) returns (GetAnimalUnitResponse);
  rpc ListAnimalUnits(ListAnimalUnitsRequest) returns (ListAnimalUnitsResponse);
  rpc UpdateAnimalUnit(UpdateAnimalUnitRequest) returns (UpdateAnimalUnitResponse);
  rpc DeleteAnimalUnit(DeleteAnimalUnitRequest) returns (google.protobuf.Empty);
  rpc CreateAnimalHerd(CreateAnimalHerdRequest) returns (CreateAnimalHerdResponse);
  rpc GetAnimalHerd(GetAnimalHerdRequest) returns (GetAnimalHerdResponse);
  rpc ListAnimalHerds(ListAnimalHerdsRequest) returns (ListAnimalHerdsResponse);
  rpc UpdateAnimalHerd(UpdateAnimalHerdRequest) returns (UpdateAnimalHerdResponse);
  rpc DeleteAnimalHerd(DeleteAnimalHerdRequest) returns (google.protobuf.Empty);
}
