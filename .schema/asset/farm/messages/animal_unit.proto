syntax = "proto3";

package com.agriculture.animals.messages;

import "agriculture/livestock/enums/animal_age.proto";
import "agriculture/livestock/enums/animal_health.proto";
import "agriculture/livestock/enums/animal_product.proto";
import "agriculture/livestock/enums/animal_reproductivity.proto";
import "agriculture/livestock/enums/animal_sex.proto";
import "agriculture/livestock/enums/animal_type.proto";
import "google/protobuf/timestamp.proto";

message AnimalUnit {
  string id = 1;
  string name = 2;
  string tag_number = 3;
  string breed = 4;
  com.agriculture.animals.enums.AnimalType type = 5;
  com.agriculture.animals.enums.AnimalSex sex = 6;
  string color = 7;
  string markings = 8;
  google.protobuf.Timestamp birth_date = 9;
  double weight = 10;
  string dam_id = 11;
  string sire_id = 12;
  com.agriculture.animals.enums.HealthStatus health_status = 13;
  repeated string vaccinations = 14;
  repeated string medications = 15;
  google.protobuf.Timestamp last_health_check = 16;
  com.agriculture.animals.enums.AnimalReproductivity reproductivity = 17;
  google.protobuf.Timestamp breeding_date = 18;
  google.protobuf.Timestamp expected_delivery = 19;
  int32 pregnancies = 20;
  int32 offspring_count = 21;
  com.agriculture.animals.enums.AnimalProduct product = 22;
  double latitude = 23;
  double longitude = 24;
  com.agriculture.animals.enums.AnimalFood food = 25;
  double daily_food_amount = 26;
  map<string, double> feeding_schedule = 27;
  double water_consumption = 28;
  double growth_rate = 29;
  bool is_active = 30;
  bool is_for_sale = 31;
  string notes = 32;
  google.protobuf.Timestamp created_at = 33;
  google.protobuf.Timestamp updated_at = 34;
  string created_by = 35;
  string updated_by = 36;
}

message CreateAnimalUnitRequest {
  AnimalUnit animal_unit = 1;
}

message CreateAnimalUnitResponse {
  AnimalUnit animal_unit = 1;
  bool success = 2;
  string message = 3;
}

message GetAnimalUnitRequest {
  string id = 1;
}

message GetAnimalUnitResponse {
  AnimalUnit animal_unit = 1;
  bool found = 2;
  string message = 3;
}

message ListAnimalUnitsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string herd_id = 3;
  string animal_type = 4;
  string health_status = 5;
  string sex = 6;
  bool is_breeding_stock = 7;
  bool is_pregnant = 8;
  string search_query = 9;
}

message ListAnimalUnitResponse {
  repeated AnimalUnit animal_units = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateAnimalUnitRequest {
  AnimalUnit animal_unit = 1;
  repeated string update_mask = 2;
}

message UpdateAnimalUnitResponse {
  AnimalUnit animal_unit = 1;
  bool success = 2;
  string message = 3;
}

message DeleteAnimalUnitRequest {
  string id = 1;
}
