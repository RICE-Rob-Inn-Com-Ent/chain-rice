syntax = "proto3";

package com.agriculture.crops.messages;

import "agriculture/crops/enums/crop_type.proto";
import "agriculture/crops/enums/growth_stage.proto";
import "google/protobuf/timestamp.proto";

message CropUnit {
  string id = 1;
  string name = 2;
  com.agriculture.crops.enums.CropType type = 3;
  com.agriculture.crops.enums.GrowthStage current_stage = 4;
  string variety = 5;
  google.protobuf.Timestamp planted_date = 6;
  google.protobuf.Timestamp expected_harvest_date = 7;
  google.protobuf.Timestamp actual_harvest_date = 8;
  string field_id = 9;
  double latitude = 10;
  double longitude = 11;
  double planting_density = 12;
  string planting_method = 13;
  double seed_rate = 14;
  double height = 15;
  double canopy_cover = 16;
  int32 leaf_count = 17;
  double stem_diameter = 18;
  double health_score = 19;
  repeated string diseases = 20;
  repeated string pests = 21;
  string notes = 22;
  double soil_ph = 23;
  double soil_moisture = 24;
  double temperature = 25;
  double humidity = 26;
  double predicted_yield = 27;
  double actual_yield = 28;
  string yield_unit = 29;
  double cost_per_unit = 30;
  double expected_revenue = 31;
  double actual_revenue = 32;
  google.protobuf.Timestamp created_at = 33;
  google.protobuf.Timestamp updated_at = 34;
  string created_by = 35;
  string updated_by = 36;
  bool is_active = 37;
  bool is_harvested = 38;
  bool requires_attention = 39;
}

message CreateCropUnitRequest {
  com.agriculture.crops.messages.CropUnit crop_unit = 1;
}

message CreateCropUnitResponse {
  com.agriculture.crops.messages.CropUnit crop_unit = 1;
  bool success = 2;
  string message = 3;
}

message GetCropUnitRequest {
  string crop_unit_id = 1;
}

message GetCropUnitResponse {
  com.agriculture.crops.messages.CropUnit crop_unit = 1;
  bool found = 2;
  string message = 3;
}

message ListCropUnitsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListCropUnitsResponse {
  repeated com.agriculture.crops.messages.CropUnit crop_units = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateCropUnitRequest {
  com.agriculture.crops.messages.CropUnit crop_unit = 1;
  repeated string update_mask = 2;
}

message UpdateCropUnitResponse {
  com.agriculture.crops.messages.CropUnit crop_unit = 1;
  bool success = 2;
  string message = 3;
}

message DeleteCropUnitRequest {
  string crop_unit_id = 1;
}
