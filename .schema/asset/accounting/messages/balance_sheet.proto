syntax = "proto3";

package finance.accounting.messages;

import "finance/accounting/enums/account_type.proto";

// Balance sheet item
message BalanceSheetItem {
  // Account ID
  string account_id = 1;

  // Account name
  string account_name = 2;

  // Account code
  string account_code = 3;

  // Account type
  finance.accounting.enums.AccountType account_type = 4;

  // Current period balance
  double current_balance = 5;

  // Previous period balance
  double previous_balance = 6;

  // Change amount
  double change_amount = 7;

  // Change percentage
  double change_percentage = 8;

  // Currency code
  string currency = 9;

  // Sub-items (for hierarchical accounts)
  repeated BalanceSheetItem sub_items = 10;
}

// Balance sheet section
message BalanceSheetSection {
  // Section name
  string section_name = 1;

  // Section total
  double section_total = 2;

  // Previous period total
  double previous_total = 3;

  // Change amount
  double change_amount = 4;

  // Change percentage
  double change_percentage = 5;

  // Currency code
  string currency = 6;

  // Section items
  repeated BalanceSheetItem items = 7;
}

// Complete balance sheet
message BalanceSheet {
  // Balance sheet ID
  string balance_sheet_id = 1;

  // Report date
  int64 report_date = 2;

  // Previous period date
  int64 previous_period_date = 3;

  // Currency code
  string currency = 4;

  // Assets section
  BalanceSheetSection assets = 5;

  // Liabilities section
  BalanceSheetSection liabilities = 6;

  // Equity section
  BalanceSheetSection equity = 7;

  // Total assets
  double total_assets = 8;

  // Total liabilities
  double total_liabilities = 9;

  // Total equity
  double total_equity = 10;

  // Previous period total assets
  double previous_total_assets = 11;

  // Previous period total liabilities
  double previous_total_liabilities = 12;

  // Previous period total equity
  double previous_total_equity = 13;

  // Assets change
  double assets_change = 14;

  // Liabilities change
  double liabilities_change = 15;

  // Equity change
  double equity_change = 16;

  // Assets change percentage
  double assets_change_percentage = 17;

  // Liabilities change percentage
  double liabilities_change_percentage = 18;

  // Equity change percentage
  double equity_change_percentage = 19;

  // Report metadata
  map<string, string> metadata = 20;

  // Creation timestamp
  int64 created_at = 21;

  // Generated by user ID
  string generated_by = 22;
}

// Balance sheet generation request
message GenerateBalanceSheetRequest {
  // Report date
  int64 report_date = 1;

  // Previous period date
  int64 previous_period_date = 2;

  // Currency code
  string currency = 3;

  // Include sub-accounts
  bool include_sub_accounts = 4;

  // Include zero balance accounts
  bool include_zero_balance = 5;

  // Account type filters
  repeated finance.accounting.enums.AccountType account_types = 6;

  // Additional filters
  map<string, string> filters = 7;
}

// Balance sheet generation response
message GenerateBalanceSheetResponse {
  // Generated balance sheet
  BalanceSheet balance_sheet = 1;

  // Success status
  bool success = 2;

  // Error message if any
  string error_message = 3;
}

// Balance sheet comparison
message BalanceSheetComparison {
  // Current balance sheet
  BalanceSheet current = 1;

  // Previous balance sheet
  BalanceSheet previous = 2;

  // Variance analysis
  BalanceSheetVariance variance = 3;

  // Trend analysis
  BalanceSheetTrend trend = 4;
}

// Balance sheet variance analysis
message BalanceSheetVariance {
  // Assets variance
  double assets_variance = 1;

  // Liabilities variance
  double liabilities_variance = 2;

  // Equity variance
  double equity_variance = 3;

  // Assets variance percentage
  double assets_variance_percentage = 4;

  // Liabilities variance percentage
  double liabilities_variance_percentage = 5;

  // Equity variance percentage
  double equity_variance_percentage = 6;

  // Significant variances
  repeated BalanceSheetItemVariance significant_variances = 7;
}

// Balance sheet item variance
message BalanceSheetItemVariance {
  // Account ID
  string account_id = 1;

  // Account name
  string account_name = 2;

  // Current balance
  double current_balance = 3;

  // Previous balance
  double previous_balance = 4;

  // Variance amount
  double variance_amount = 5;

  // Variance percentage
  double variance_percentage = 6;

  // Variance threshold exceeded
  bool threshold_exceeded = 7;
}

// Balance sheet trend analysis
message BalanceSheetTrend {
  // Trend period (e.g., "monthly", "quarterly", "yearly")
  string trend_period = 1;

  // Number of periods analyzed
  int32 periods_analyzed = 2;

  // Assets trend direction
  string assets_trend = 3;

  // Liabilities trend direction
  string liabilities_trend = 4;

  // Equity trend direction
  string equity_trend = 5;

  // Trend confidence score
  double confidence_score = 6;

  // Trend summary
  string trend_summary = 7;
}
