syntax = "proto3";

package finance.tax.services;

import "finance/tax/messages/tax_record.proto";
import "finance/tax/messages/tax_declaration.proto";

// Tax service for tax management
service TaxService {
  // Tax calculation
  rpc CalculateTax(finance.tax.messages.CalculateTaxRequest) returns (finance.tax.messages.CalculateTaxResponse);
  rpc CalculateTaxForInvoice(finance.tax.messages.CalculateTaxForInvoiceRequest) returns (finance.tax.messages.CalculateTaxForInvoiceResponse);
  rpc CalculateTaxForPayment(finance.tax.messages.CalculateTaxForPaymentRequest) returns (finance.tax.messages.CalculateTaxForPaymentResponse);

  // Tax record management
  rpc CreateTaxRecord(finance.tax.messages.CreateTaxRecordRequest) returns (finance.tax.messages.CreateTaxRecordResponse);
  rpc GetTaxRecord(finance.tax.messages.GetTaxRecordRequest) returns (finance.tax.messages.GetTaxRecordResponse);
  rpc UpdateTaxRecord(finance.tax.messages.UpdateTaxRecordRequest) returns (finance.tax.messages.UpdateTaxRecordResponse);
  rpc ListTaxRecords(finance.tax.messages.ListTaxRecordsRequest) returns (finance.tax.messages.ListTaxRecordsResponse);
  rpc DeleteTaxRecord(finance.tax.messages.DeleteTaxRecordRequest) returns (finance.tax.messages.DeleteTaxRecordResponse);

  // Tax declaration management
  rpc CreateTaxDeclaration(finance.tax.messages.CreateTaxDeclarationRequest) returns (finance.tax.messages.CreateTaxDeclarationResponse);
  rpc GetTaxDeclaration(finance.tax.messages.GetTaxDeclarationRequest) returns (finance.tax.messages.GetTaxDeclarationResponse);
  rpc UpdateTaxDeclaration(finance.tax.messages.UpdateTaxDeclarationRequest) returns (finance.tax.messages.UpdateTaxDeclarationResponse);
  rpc ListTaxDeclarations(finance.tax.messages.ListTaxDeclarationsRequest) returns (finance.tax.messages.ListTaxDeclarationsResponse);
  rpc FileTaxDeclaration(finance.tax.messages.FileTaxDeclarationRequest) returns (finance.tax.messages.FileTaxDeclarationResponse);
  rpc ApproveTaxDeclaration(finance.tax.messages.ApproveTaxDeclarationRequest) returns (finance.tax.messages.ApproveTaxDeclarationResponse);

  // Tax reporting
  rpc GetTaxSummary(finance.tax.messages.GetTaxSummaryRequest) returns (finance.tax.messages.GetTaxSummaryResponse);
  rpc GetTaxAnalytics(finance.tax.messages.GetTaxAnalyticsRequest) returns (finance.tax.messages.GetTaxAnalyticsResponse);
  rpc GenerateTaxReport(finance.tax.messages.GenerateTaxReportRequest) returns (finance.tax.messages.GenerateTaxReportResponse);

  // Tax compliance
  rpc ValidateTaxCompliance(finance.tax.messages.ValidateTaxComplianceRequest) returns (finance.tax.messages.ValidateTaxComplianceResponse);
  rpc GetTaxComplianceStatus(finance.tax.messages.GetTaxComplianceStatusRequest) returns (finance.tax.messages.GetTaxComplianceStatusResponse);
  rpc UpdateTaxComplianceStatus(finance.tax.messages.UpdateTaxComplianceStatusRequest) returns (finance.tax.messages.UpdateTaxComplianceStatusResponse);
}

// Additional request/response messages for tax service

// Calculate tax for invoice request
message CalculateTaxForInvoiceRequest {
  string invoice_id = 1;
  double invoice_amount = 2;
  string currency = 3;
  string customer_id = 4;
  string vendor_id = 5;
  int64 transaction_date = 6;
  map<string, string> parameters = 7;
}

// Calculate tax for invoice response
message CalculateTaxForInvoiceResponse {
  double tax_amount = 1;
  double tax_rate = 2;
  string tax_type = 3;
  string tax_region = 4;
  string tax_jurisdiction = 5;
  bool success = 6;
  string error_message = 7;
}

// Calculate tax for payment request
message CalculateTaxForPaymentRequest {
  string payment_id = 1;
  double payment_amount = 2;
  string currency = 3;
  string customer_id = 4;
  string vendor_id = 5;
  int64 transaction_date = 6;
  map<string, string> parameters = 7;
}

// Calculate tax for payment response
message CalculateTaxForPaymentResponse {
  double tax_amount = 1;
  double tax_rate = 2;
  string tax_type = 3;
  string tax_region = 4;
  string tax_jurisdiction = 5;
  bool success = 6;
  string error_message = 7;
}

// Get tax record request
message GetTaxRecordRequest {
  string tax_record_id = 1;
}

// Get tax record response
message GetTaxRecordResponse {
  finance.tax.messages.TaxRecord tax_record = 1;
  bool success = 2;
  string error_message = 3;
}

// Delete tax record request
message DeleteTaxRecordRequest {
  string tax_record_id = 1;
}

// Delete tax record response
message DeleteTaxRecordResponse {
  bool success = 1;
  string error_message = 2;
}

// Get tax declaration request
message GetTaxDeclarationRequest {
  string tax_declaration_id = 1;
}

// Get tax declaration response
message GetTaxDeclarationResponse {
  finance.tax.messages.TaxDeclaration tax_declaration = 1;
  bool success = 2;
  string error_message = 3;
}

// Tax summary
message TaxSummary {
  string summary_id = 1;
  int64 summary_date = 2;
  int32 total_tax_records = 3;
  double total_tax_amount = 4;
  string currency = 5;
  int32 total_tax_declarations = 6;
  int32 filed_declarations = 7;
  int32 pending_declarations = 8;
  double total_tax_paid = 9;
  double total_tax_due = 10;
  map<string, int32> records_by_type = 11;
  map<string, double> amounts_by_type = 12;
  map<string, int32> records_by_region = 13;
  map<string, double> amounts_by_region = 14;
}

// Get tax summary request
message GetTaxSummaryRequest {
  int64 start_date = 1;
  int64 end_date = 2;
  string currency = 3;
  string tax_type = 4;
  string tax_region = 5;
}

// Get tax summary response
message GetTaxSummaryResponse {
  TaxSummary summary = 1;
  bool success = 2;
  string error_message = 3;
}

// Tax analytics
message TaxAnalytics {
  string analytics_id = 1;
  int64 analytics_date = 2;
  double average_tax_rate = 3;
  double median_tax_rate = 4;
  double tax_compliance_rate = 5;
  double tax_filing_rate = 6;
  map<string, double> trends = 7;
  repeated TaxAnalyticsItem top_tax_types = 8;
  repeated TaxAnalyticsItem top_tax_regions = 9;
}

// Tax analytics item
message TaxAnalyticsItem {
  string item_id = 1;
  string item_name = 2;
  double amount = 3;
  int32 count = 4;
  double percentage = 5;
}

// Get tax analytics request
message GetTaxAnalyticsRequest {
  int64 start_date = 1;
  int64 end_date = 2;
  string currency = 3;
  string analytics_type = 4;
}

// Get tax analytics response
message GetTaxAnalyticsResponse {
  TaxAnalytics analytics = 1;
  bool success = 2;
  string error_message = 3;
}

// Tax report
message TaxReport {
  string report_id = 1;
  string report_type = 2;
  int64 report_date = 3;
  string report_format = 4;
  string report_url = 5;
  map<string, string> report_parameters = 6;
  string report_status = 7;
  int64 created_at = 8;
  string created_by = 9;
}

// Generate tax report request
message GenerateTaxReportRequest {
  string report_type = 1;
  int64 start_date = 2;
  int64 end_date = 3;
  string report_format = 4;
  string tax_type = 5;
  string tax_region = 6;
  string currency = 7;
  map<string, string> parameters = 8;
}

// Generate tax report response
message GenerateTaxReportResponse {
  TaxReport report = 1;
  bool success = 2;
  string error_message = 3;
}

// Tax compliance
message TaxCompliance {
  string compliance_id = 1;
  string entity_id = 2;
  string entity_type = 3;
  string tax_region = 4;
  string tax_jurisdiction = 5;
  string compliance_status = 6;
  double compliance_score = 7;
  repeated TaxComplianceItem compliance_items = 8;
  int64 last_updated = 9;
  string updated_by = 10;
}

// Tax compliance item
message TaxComplianceItem {
  string item_id = 1;
  string item_type = 2;
  string item_name = 3;
  string status = 4;
  string description = 5;
  int64 due_date = 6;
  int64 completed_date = 7;
}

// Validate tax compliance request
message ValidateTaxComplianceRequest {
  string entity_id = 1;
  string entity_type = 2;
  string tax_region = 3;
  string tax_jurisdiction = 4;
  int64 validation_date = 5;
}

// Validate tax compliance response
message ValidateTaxComplianceResponse {
  TaxCompliance compliance = 1;
  bool success = 2;
  string error_message = 3;
  repeated string compliance_issues = 4;
}

// Get tax compliance status request
message GetTaxComplianceStatusRequest {
  string entity_id = 1;
  string entity_type = 2;
  string tax_region = 3;
  string tax_jurisdiction = 4;
}

// Get tax compliance status response
message GetTaxComplianceStatusResponse {
  TaxCompliance compliance = 1;
  bool success = 2;
  string error_message = 3;
}

// Update tax compliance status request
message UpdateTaxComplianceStatusRequest {
  string compliance_id = 1;
  string compliance_status = 2;
  double compliance_score = 3;
  repeated TaxComplianceItem compliance_items = 4;
  string notes = 5;
}

// Update tax compliance status response
message UpdateTaxComplianceStatusResponse {
  TaxCompliance compliance = 1;
  bool success = 2;
  string error_message = 3;
}
