syntax = "proto3";

package healthcare.patients.services;

import "google/protobuf/empty.proto";
import "../messages/patient_models.proto";
import "../enums/insurance_status.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/patients/services";

// Insurance service for insurance management
service InsuranceService {
  // Add insurance to patient
  rpc AddInsurance(AddInsuranceRequest) returns (InsuranceResponse);

  // Update patient insurance
  rpc UpdateInsurance(UpdateInsuranceRequest) returns (InsuranceResponse);

  // Remove insurance from patient
  rpc RemoveInsurance(RemoveInsuranceRequest) returns (google.protobuf.Empty);

  // Get patient insurance
  rpc GetPatientInsurance(GetPatientInsuranceRequest) returns (ListPatientInsuranceResponse);

  // Get primary insurance
  rpc GetPrimaryInsurance(GetPrimaryInsuranceRequest) returns (InsuranceResponse);

  // Set primary insurance
  rpc SetPrimaryInsurance(SetPrimaryInsuranceRequest) returns (InsuranceResponse);

  // Verify insurance eligibility
  rpc VerifyInsuranceEligibility(VerifyInsuranceEligibilityRequest) returns (VerifyInsuranceEligibilityResponse);

  // Get insurance claims
  rpc GetInsuranceClaims(GetInsuranceClaimsRequest) returns (GetInsuranceClaimsResponse);

  // Submit insurance claim
  rpc SubmitInsuranceClaim(SubmitInsuranceClaimRequest) returns (SubmitInsuranceClaimResponse);

  // Get insurance coverage
  rpc GetInsuranceCoverage(GetInsuranceCoverageRequest) returns (GetInsuranceCoverageResponse);
}

// Insurance response
message InsuranceResponse {
  bool success = 1;
  string message = 2;
  Insurance insurance = 3;
}

// Add insurance request
message AddInsuranceRequest {
  string patient_id = 1;
  Insurance insurance = 2;
}

// Update insurance request
message UpdateInsuranceRequest {
  string patient_id = 1;
  string insurance_id = 2;
  Insurance insurance = 3;
}

// Remove insurance request
message RemoveInsuranceRequest {
  string patient_id = 1;
  string insurance_id = 2;
  string reason = 3;
}

// Get patient insurance request
message GetPatientInsuranceRequest {
  string patient_id = 1;
  healthcare.patients.enums.InsuranceStatus status = 2;
  healthcare.patients.enums.InsuranceType insurance_type = 3;
}

// List patient insurance response
message ListPatientInsuranceResponse {
  repeated Insurance insurance_list = 1;
  int32 total_count = 2;
}

// Get primary insurance request
message GetPrimaryInsuranceRequest {
  string patient_id = 1;
}

// Set primary insurance request
message SetPrimaryInsuranceRequest {
  string patient_id = 1;
  string insurance_id = 2;
}

// Verify insurance eligibility request
message VerifyInsuranceEligibilityRequest {
  string patient_id = 1;
  string insurance_id = 2;
  google.protobuf.Timestamp service_date = 3;
}

// Verify insurance eligibility response
message VerifyInsuranceEligibilityResponse {
  bool success = 1;
  string message = 2;
  bool eligible = 3;
  string eligibility_status = 4;
  string coverage_details = 5;
  string copay_amount = 6;
  string deductible_amount = 7;
  string coverage_percentage = 8;
  google.protobuf.Timestamp verification_date = 9;
  string verification_id = 10;
}

// Insurance claim
message InsuranceClaim {
  string claim_id = 1;
  string patient_id = 2;
  string insurance_id = 3;
  string appointment_id = 4;
  string service_code = 5;
  string diagnosis_code = 6;
  double billed_amount = 7;
  double allowed_amount = 8;
  double paid_amount = 9;
  double patient_responsibility = 10;
  string claim_status = 11;
  google.protobuf.Timestamp service_date = 12;
  google.protobuf.Timestamp submitted_date = 13;
  google.protobuf.Timestamp processed_date = 14;
  string claim_number = 15;
  string denial_reason = 16;
  string notes = 17;
}

// Get insurance claims request
message GetInsuranceClaimsRequest {
  string patient_id = 1;
  string insurance_id = 2;
  string claim_status = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  int32 page_size = 6;
  string page_token = 7;
}

// Get insurance claims response
message GetInsuranceClaimsResponse {
  repeated InsuranceClaim claims = 1;
  string next_page_token = 2;
  int32 total_count = 3;
  double total_billed = 4;
  double total_paid = 5;
  double total_outstanding = 6;
}

// Submit insurance claim request
message SubmitInsuranceClaimRequest {
  string patient_id = 1;
  string insurance_id = 2;
  string appointment_id = 3;
  string service_code = 4;
  string diagnosis_code = 5;
  double billed_amount = 6;
  google.protobuf.Timestamp service_date = 7;
  string notes = 8;
}

// Submit insurance claim response
message SubmitInsuranceClaimResponse {
  bool success = 1;
  string message = 2;
  InsuranceClaim claim = 3;
}

// Get insurance coverage request
message GetInsuranceCoverageRequest {
  string patient_id = 1;
  string insurance_id = 2;
  string service_code = 3;
  google.protobuf.Timestamp service_date = 4;
}

// Get insurance coverage response
message GetInsuranceCoverageResponse {
  bool success = 1;
  string message = 2;
  string coverage_status = 3;
  string copay_amount = 4;
  string deductible_amount = 5;
  string coverage_percentage = 6;
  string out_of_pocket_maximum = 7;
  string remaining_deductible = 8;
  string remaining_out_of_pocket = 9;
  bool prior_authorization_required = 10;
  string coverage_notes = 11;
}
