syntax = "proto3";

package healthcare.billing.services;

import "google/protobuf/empty.proto";
import "../messages/invoice_models.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/billing/services";

// Billing service for CRUD operations on invoices
service BillingService {
  // Create a new invoice
  rpc CreateInvoice(InvoiceRequest) returns (InvoiceResponse);

  // Get invoice by ID
  rpc GetInvoice(GetInvoiceRequest) returns (InvoiceResponse);

  // Update an existing invoice
  rpc UpdateInvoice(UpdateInvoiceRequest) returns (InvoiceResponse);

  // Delete an invoice
  rpc DeleteInvoice(DeleteInvoiceRequest) returns (google.protobuf.Empty);

  // List invoices with filtering
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // Get invoices by patient
  rpc GetInvoicesByPatient(GetInvoicesByPatientRequest) returns (ListInvoicesResponse);

  // Get invoices by doctor
  rpc GetInvoicesByDoctor(GetInvoicesByDoctorRequest) returns (ListInvoicesResponse);

  // Get invoices by clinic
  rpc GetInvoicesByClinic(GetInvoicesByClinicRequest) returns (ListInvoicesResponse);

  // Add item to invoice
  rpc AddInvoiceItem(AddInvoiceItemRequest) returns (InvoiceResponse);

  // Remove item from invoice
  rpc RemoveInvoiceItem(RemoveInvoiceItemRequest) returns (InvoiceResponse);

  // Update invoice item
  rpc UpdateInvoiceItem(UpdateInvoiceItemRequest) returns (InvoiceResponse);
}

// Get invoice request
message GetInvoiceRequest {
  string invoice_id = 1;
}

// Update invoice request
message UpdateInvoiceRequest {
  string invoice_id = 1;
  InvoiceRequest invoice = 2;
}

// Delete invoice request
message DeleteInvoiceRequest {
  string invoice_id = 1;
  string reason = 2;
}

// Get invoices by patient request
message GetInvoicesByPatientRequest {
  string patient_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get invoices by doctor request
message GetInvoicesByDoctorRequest {
  string doctor_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get invoices by clinic request
message GetInvoicesByClinicRequest {
  string clinic_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Add invoice item request
message AddInvoiceItemRequest {
  string invoice_id = 1;
  InvoiceItem item = 2;
}

// Remove invoice item request
message RemoveInvoiceItemRequest {
  string invoice_id = 1;
  string item_id = 2;
}

// Update invoice item request
message UpdateInvoiceItemRequest {
  string invoice_id = 1;
  string item_id = 2;
  InvoiceItem item = 3;
}
