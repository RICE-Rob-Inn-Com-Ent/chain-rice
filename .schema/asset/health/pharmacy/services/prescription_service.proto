syntax = "proto3";

package healthcare.pharmacy.services;

import "google/protobuf/empty.proto";
import "../messages/prescription_models.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/pharmacy/services";

// Prescription service for managing prescriptions
service PrescriptionService {
  // Create a new prescription
  rpc CreatePrescription(PrescriptionRequest) returns (PrescriptionResponse);

  // Get prescription by ID
  rpc GetPrescription(GetPrescriptionRequest) returns (PrescriptionResponse);

  // Update an existing prescription
  rpc UpdatePrescription(UpdatePrescriptionRequest) returns (PrescriptionResponse);

  // Cancel a prescription
  rpc CancelPrescription(CancelPrescriptionRequest) returns (google.protobuf.Empty);

  // List prescriptions with filtering
  rpc ListPrescriptions(ListPrescriptionsRequest) returns (ListPrescriptionsResponse);

  // Search prescriptions
  rpc SearchPrescriptions(PrescriptionSearchRequest) returns (ListPrescriptionsResponse);

  // Get prescriptions by patient
  rpc GetPrescriptionsByPatient(GetPrescriptionsByPatientRequest) returns (ListPrescriptionsResponse);

  // Get prescriptions by doctor
  rpc GetPrescriptionsByDoctor(GetPrescriptionsByDoctorRequest) returns (ListPrescriptionsResponse);

  // Get prescriptions by pharmacy
  rpc GetPrescriptionsByPharmacy(GetPrescriptionsByPharmacyRequest) returns (ListPrescriptionsResponse);

  // Approve prescription
  rpc ApprovePrescription(PrescriptionApprovalRequest) returns (PrescriptionResponse);

  // Dispense prescription
  rpc DispensePrescription(PrescriptionDispensingRequest) returns (PrescriptionResponse);

  // Request prescription refill
  rpc RequestPrescriptionRefill(PrescriptionRefillRequest) returns (PrescriptionRefillResponse);

  // Get prescription refills
  rpc GetPrescriptionRefills(GetPrescriptionRefillsRequest) returns (ListPrescriptionsResponse);

  // Check prescription interactions
  rpc CheckPrescriptionInteractions(CheckPrescriptionInteractionsRequest) returns (PrescriptionInteractionCheck);

  // Get prescription summary
  rpc GetPrescriptionSummary(GetPrescriptionSummaryRequest) returns (PrescriptionSummary);

  // Get prescriptions needing refill
  rpc GetPrescriptionsNeedingRefill(GetPrescriptionsNeedingRefillRequest) returns (ListPrescriptionsResponse);

  // Get controlled substance prescriptions
  rpc GetControlledSubstancePrescriptions(GetControlledSubstancePrescriptionsRequest) returns (ListPrescriptionsResponse);
}

// Get prescription request
message GetPrescriptionRequest {
  string prescription_id = 1;
}

// Update prescription request
message UpdatePrescriptionRequest {
  string prescription_id = 1;
  PrescriptionRequest prescription = 2;
}

// Cancel prescription request
message CancelPrescriptionRequest {
  string prescription_id = 1;
  string reason = 2;
  string cancelled_by = 3;
}

// Get prescriptions by patient request
message GetPrescriptionsByPatientRequest {
  string patient_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get prescriptions by doctor request
message GetPrescriptionsByDoctorRequest {
  string doctor_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get prescriptions by pharmacy request
message GetPrescriptionsByPharmacyRequest {
  string pharmacy_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get prescription refills request
message GetPrescriptionRefillsRequest {
  string prescription_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Check prescription interactions request
message CheckPrescriptionInteractionsRequest {
  string prescription_id = 1;
  string patient_id = 2;
  repeated string medication_names = 3;
}

// Get prescription summary request
message GetPrescriptionSummaryRequest {
  string prescription_id = 1;
}

// Get prescriptions needing refill request
message GetPrescriptionsNeedingRefillRequest {
  string patient_id = 1;
  string pharmacy_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

// Get controlled substance prescriptions request
message GetControlledSubstancePrescriptionsRequest {
  string patient_id = 1;
  string doctor_id = 2;
  string pharmacy_id = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  int32 page_size = 6;
  string page_token = 7;
}
