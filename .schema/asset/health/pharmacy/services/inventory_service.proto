syntax = "proto3";

package healthcare.pharmacy.services;

import "google/protobuf/timestamp.proto";
import "../messages/drug_models.proto";
import "../messages/pharmacy_events.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/pharmacy/services";

// Inventory service for stock management and alerts
service InventoryService {
  // Get inventory status
  rpc GetInventoryStatus(GetInventoryStatusRequest) returns (GetInventoryStatusResponse);

  // Update inventory levels
  rpc UpdateInventoryLevels(UpdateInventoryLevelsRequest) returns (UpdateInventoryLevelsResponse);

  // Record stock movement
  rpc RecordStockMovement(RecordStockMovementRequest) returns (RecordStockMovementResponse);

  // Get stock movements
  rpc GetStockMovements(GetStockMovementsRequest) returns (GetStockMovementsResponse);

  // Get inventory alerts
  rpc GetInventoryAlerts(GetInventoryAlertsRequest) returns (GetInventoryAlertsResponse);

  // Acknowledge inventory alert
  rpc AcknowledgeInventoryAlert(AcknowledgeInventoryAlertRequest) returns (google.protobuf.Empty);

  // Generate reorder report
  rpc GenerateReorderReport(GenerateReorderReportRequest) returns (GenerateReorderReportResponse);

  // Process stock receipt
  rpc ProcessStockReceipt(ProcessStockReceiptRequest) returns (ProcessStockReceiptResponse);

  // Process stock adjustment
  rpc ProcessStockAdjustment(ProcessStockAdjustmentRequest) returns (ProcessStockAdjustmentResponse);

  // Get inventory valuation
  rpc GetInventoryValuation(GetInventoryValuationRequest) returns (GetInventoryValuationResponse);

  // Get inventory turnover report
  rpc GetInventoryTurnoverReport(GetInventoryTurnoverReportRequest) returns (GetInventoryTurnoverReportResponse);

  // Get expired inventory report
  rpc GetExpiredInventoryReport(GetExpiredInventoryReportRequest) returns (GetExpiredInventoryReportResponse);

  // Get inventory audit trail
  rpc GetInventoryAuditTrail(GetInventoryAuditTrailRequest) returns (PharmacyAuditTrail);
}

// Get inventory status request
message GetInventoryStatusRequest {
  string drug_id = 1;
  string pharmacy_id = 2;
  bool include_alerts = 3;
}

// Get inventory status response
message GetInventoryStatusResponse {
  Drug drug = 1;
  int32 current_stock = 2;
  int32 available_stock = 3;
  int32 reserved_stock = 4;
  int32 minimum_stock_level = 5;
  int32 maximum_stock_level = 6;
  int32 reorder_point = 7;
  int32 reorder_quantity = 8;
  healthcare.pharmacy.enums.StockStatus stock_status = 9;
  bool needs_reorder = 10;
  bool is_low_stock = 11;
  bool is_out_of_stock = 12;
  google.protobuf.Timestamp last_restocked = 13;
  google.protobuf.Timestamp next_expected_delivery = 14;
  repeated PharmacyAlert alerts = 15;
}

// Update inventory levels request
message UpdateInventoryLevelsRequest {
  string drug_id = 1;
  string pharmacy_id = 2;
  int32 new_stock_level = 3;
  int32 new_minimum_level = 4;
  int32 new_maximum_level = 5;
  int32 new_reorder_point = 6;
  int32 new_reorder_quantity = 7;
  string updated_by = 8;
  string reason = 9;
}

// Update inventory levels response
message UpdateInventoryLevelsResponse {
  bool success = 1;
  string message = 2;
  Drug drug = 3;
  int32 previous_stock_level = 4;
  int32 new_stock_level = 5;
}

// Record stock movement request
message RecordStockMovementRequest {
  string drug_id = 1;
  string pharmacy_id = 2;
  StockMovementType movement_type = 3;
  int32 quantity = 4;
  string quantity_unit = 5;
  double unit_cost = 6;
  string reference_number = 7;
  string reason = 8;
  string notes = 9;
  string moved_by = 10;
  string supplier_id = 11;
  string lot_number = 12;
  google.protobuf.Timestamp expiration_date = 13;
}

// Record stock movement response
message RecordStockMovementResponse {
  bool success = 1;
  string message = 2;
  StockMovementEvent stock_movement = 3;
  Drug updated_drug = 4;
}

// Get stock movements request
message GetStockMovementsRequest {
  string drug_id = 1;
  string pharmacy_id = 2;
  StockMovementType movement_type = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  int32 page_size = 6;
  string page_token = 7;
}

// Get stock movements response
message GetStockMovementsResponse {
  repeated StockMovementEvent stock_movements = 1;
  string next_page_token = 2;
  int32 total_count = 3;
  double total_value = 4;
}

// Get inventory alerts request
message GetInventoryAlertsRequest {
  string pharmacy_id = 1;
  string alert_level = 2; // info, warning, critical, emergency
  bool acknowledged_only = 3;
  int32 page_size = 4;
  string page_token = 5;
}

// Get inventory alerts response
message GetInventoryAlertsResponse {
  repeated PharmacyAlert alerts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
  int32 unacknowledged_count = 4;
}

// Acknowledge inventory alert request
message AcknowledgeInventoryAlertRequest {
  string alert_id = 1;
  string acknowledged_by = 2;
  string resolution_notes = 3;
}

// Generate reorder report request
message GenerateReorderReportRequest {
  string pharmacy_id = 1;
  bool include_low_stock = 2;
  bool include_out_of_stock = 3;
  bool include_expiring_soon = 4;
  int32 days_ahead = 5; // For expiring soon filter
}

// Generate reorder report response
message GenerateReorderReportResponse {
  string pharmacy_id = 1;
  google.protobuf.Timestamp generated_at = 2;
  repeated DrugReorderItem reorder_items = 3;
  int32 total_items = 4;
  double total_estimated_cost = 5;
  repeated PharmacyAlert alerts = 6;
}

// Drug reorder item
message DrugReorderItem {
  string drug_id = 1;
  string drug_name = 2;
  string ndc_number = 3;
  int32 current_stock = 4;
  int32 minimum_stock_level = 5;
  int32 reorder_quantity = 6;
  double unit_cost = 7;
  double total_cost = 8;
  string supplier_id = 9;
  string supplier_name = 10;
  string reorder_reason = 11;
  google.protobuf.Timestamp last_restocked = 12;
  google.protobuf.Timestamp expected_delivery = 13;
}

// Process stock receipt request
message ProcessStockReceiptRequest {
  string drug_id = 1;
  string pharmacy_id = 2;
  int32 received_quantity = 3;
  string quantity_unit = 4;
  double unit_cost = 5;
  string supplier_id = 6;
  string purchase_order_number = 7;
  string lot_number = 8;
  google.protobuf.Timestamp expiration_date = 9;
  google.protobuf.Timestamp received_date = 10;
  string received_by = 11;
  string notes = 12;
}

// Process stock receipt response
message ProcessStockReceiptResponse {
  bool success = 1;
  string message = 2;
  StockMovementEvent stock_movement = 3;
  Drug updated_drug = 4;
}

// Process stock adjustment request
message ProcessStockAdjustmentRequest {
  string drug_id = 1;
  string pharmacy_id = 2;
  int32 adjustment_quantity = 3; // Positive for increase, negative for decrease
  string quantity_unit = 4;
  StockMovementType adjustment_type = 5;
  string reason = 6;
  string adjusted_by = 7;
  google.protobuf.Timestamp adjustment_date = 8;
  string notes = 9;
}

// Process stock adjustment response
message ProcessStockAdjustmentResponse {
  bool success = 1;
  string message = 2;
  StockMovementEvent stock_movement = 3;
  Drug updated_drug = 4;
}

// Get inventory valuation request
message GetInventoryValuationRequest {
  string pharmacy_id = 1;
  google.protobuf.Timestamp as_of_date = 2;
  string valuation_method = 3; // FIFO, LIFO, Average Cost
}

// Get inventory valuation response
message GetInventoryValuationResponse {
  string pharmacy_id = 1;
  google.protobuf.Timestamp as_of_date = 2;
  string valuation_method = 3;
  double total_inventory_value = 4;
  int32 total_items = 5;
  repeated DrugValuationItem valuation_items = 6;
  double average_item_value = 7;
}

// Drug valuation item
message DrugValuationItem {
  string drug_id = 1;
  string drug_name = 2;
  int32 quantity = 3;
  double unit_cost = 4;
  double total_value = 5;
  google.protobuf.Timestamp last_cost_update = 6;
}

// Get inventory turnover report request
message GetInventoryTurnoverReportRequest {
  string pharmacy_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string group_by = 4; // drug, classification, manufacturer
}

// Get inventory turnover report response
message GetInventoryTurnoverReportResponse {
  string pharmacy_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  repeated InventoryTurnoverItem turnover_items = 4;
  double average_turnover_rate = 5;
  int32 total_items_analyzed = 6;
}

// Inventory turnover item
message InventoryTurnoverItem {
  string item_id = 1; // drug_id, classification, or manufacturer_id
  string item_name = 2;
  int32 beginning_inventory = 3;
  int32 ending_inventory = 4;
  int32 total_dispensed = 5;
  double turnover_rate = 6;
  int32 days_in_inventory = 7;
}

// Get expired inventory report request
message GetExpiredInventoryReportRequest {
  string pharmacy_id = 1;
  google.protobuf.Timestamp as_of_date = 2;
  bool include_expired = 3;
  bool include_expiring_soon = 4;
  int32 days_ahead = 5; // For expiring soon filter
}

// Get expired inventory report response
message GetExpiredInventoryReportResponse {
  string pharmacy_id = 1;
  google.protobuf.Timestamp as_of_date = 2;
  repeated ExpiredInventoryItem expired_items = 3;
  int32 total_expired_items = 4;
  double total_expired_value = 5;
  int32 total_expiring_soon_items = 6;
  double total_expiring_soon_value = 7;
}

// Expired inventory item
message ExpiredInventoryItem {
  string drug_id = 1;
  string drug_name = 2;
  string ndc_number = 3;
  int32 expired_quantity = 4;
  double unit_cost = 5;
  double total_value = 6;
  google.protobuf.Timestamp expiration_date = 7;
  int32 days_expired = 8;
  string lot_number = 9;
  string disposal_method = 10;
}

// Get inventory audit trail request
message GetInventoryAuditTrailRequest {
  string drug_id = 1;
  string pharmacy_id = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
}
