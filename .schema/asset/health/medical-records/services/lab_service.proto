syntax = "proto3";

package healthcare.medical_records.services;

import "google/protobuf/empty.proto";
import "../messages/lab_results.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/medical-records/services";

// Lab service for lab requests and results
service LabService {
  // Request a lab test
  rpc RequestLabTest(LabTestRequest) returns (LabTestResponse);

  // Get lab test by ID
  rpc GetLabTest(GetLabTestRequest) returns (LabTestResponse);

  // Update lab test
  rpc UpdateLabTest(UpdateLabTestRequest) returns (LabTestResponse);

  // Cancel lab test
  rpc CancelLabTest(CancelLabTestRequest) returns (google.protobuf.Empty);

  // List lab tests with filtering
  rpc ListLabTests(ListLabTestsRequest) returns (ListLabTestsResponse);

  // Get lab tests by patient
  rpc GetLabTestsByPatient(GetLabTestsByPatientRequest) returns (ListLabTestsResponse);

  // Get lab tests by doctor
  rpc GetLabTestsByDoctor(GetLabTestsByDoctorRequest) returns (ListLabTestsResponse);

  // Get lab tests by lab
  rpc GetLabTestsByLab(GetLabTestsByLabRequest) returns (ListLabTestsResponse);

  // Submit lab result
  rpc SubmitLabResult(SubmitLabResultRequest) returns (LabTestResponse);

  // Get lab result by ID
  rpc GetLabResult(GetLabResultRequest) returns (LabResult);

  // List lab results
  rpc ListLabResults(ListLabResultsRequest) returns (ListLabResultsResponse);

  // Get lab test summary
  rpc GetLabTestSummary(GetLabTestSummaryRequest) returns (LabTestSummary);

  // Get lab result alerts
  rpc GetLabResultAlerts(GetLabResultAlertsRequest) returns (GetLabResultAlertsResponse);

  // Acknowledge lab result alert
  rpc AcknowledgeLabResultAlert(AcknowledgeLabResultAlertRequest) returns (google.protobuf.Empty);
}

// Get lab test request
message GetLabTestRequest {
  string test_id = 1;
}

// Update lab test request
message UpdateLabTestRequest {
  string test_id = 1;
  LabTestRequest lab_test = 2;
}

// Cancel lab test request
message CancelLabTestRequest {
  string test_id = 1;
  string reason = 2;
  string cancelled_by = 3;
}

// Get lab tests by patient request
message GetLabTestsByPatientRequest {
  string patient_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get lab tests by doctor request
message GetLabTestsByDoctorRequest {
  string doctor_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get lab tests by lab request
message GetLabTestsByLabRequest {
  string lab_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Submit lab result request
message SubmitLabResultRequest {
  string test_id = 1;
  LabResult result = 2;
  string submitted_by = 3;
}

// Get lab result request
message GetLabResultRequest {
  string result_id = 1;
}

// List lab results request
message ListLabResultsRequest {
  string test_id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string lab_id = 4;
  LabResultStatus status = 5;
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  int32 page_size = 8;
  string page_token = 9;
}

// List lab results response
message ListLabResultsResponse {
  repeated LabResult lab_results = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Get lab test summary request
message GetLabTestSummaryRequest {
  string patient_id = 1;
}

// Get lab result alerts request
message GetLabResultAlertsRequest {
  string patient_id = 1;
  string doctor_id = 2;
  bool acknowledged_only = 3;
  int32 page_size = 4;
  string page_token = 5;
}

// Get lab result alerts response
message GetLabResultAlertsResponse {
  repeated LabResultAlert alerts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Acknowledge lab result alert request
message AcknowledgeLabResultAlertRequest {
  string alert_id = 1;
  string acknowledged_by = 2;
}
