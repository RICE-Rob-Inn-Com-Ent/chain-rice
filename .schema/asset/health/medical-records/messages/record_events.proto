syntax = "proto3";

package healthcare.medical_records.messages;

import "google/protobuf/timestamp.proto";
import "../enums/record_type.proto";
import "../enums/record_status.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/medical-records/messages";

// Medical record event types
enum RecordEventType {
  RECORD_EVENT_TYPE_UNSPECIFIED = 0;
  RECORD_EVENT_TYPE_CREATED = 1;
  RECORD_EVENT_TYPE_UPDATED = 2;
  RECORD_EVENT_TYPE_ARCHIVED = 3;
  RECORD_EVENT_TYPE_DELETED = 4;
  RECORD_EVENT_TYPE_VIEWED = 5;
  RECORD_EVENT_TYPE_SHARED = 6;
  RECORD_EVENT_TYPE_PRINTED = 7;
  RECORD_EVENT_TYPE_EXPORTED = 8;
  RECORD_EVENT_TYPE_STATUS_CHANGED = 9;
  RECORD_EVENT_TYPE_DIAGNOSIS_ADDED = 10;
  RECORD_EVENT_TYPE_TREATMENT_ADDED = 11;
  RECORD_EVENT_TYPE_LAB_RESULT_ADDED = 12;
  RECORD_EVENT_TYPE_ATTACHMENT_ADDED = 13;
}

// Medical record event
message RecordEvent {
  string event_id = 1;
  string record_id = 2;
  string patient_id = 3;
  string doctor_id = 4;
  string clinic_id = 5;
  RecordEventType event_type = 6;
  google.protobuf.Timestamp event_time = 7;
  healthcare.medical_records.enums.RecordType record_type = 8;
  healthcare.medical_records.enums.RecordStatus previous_status = 9;
  healthcare.medical_records.enums.RecordStatus new_status = 10;
  string event_data = 11; // JSON string for additional event-specific data
  string triggered_by = 12;
  string description = 13;
  string ip_address = 14;
  string user_agent = 15;
}

// Record event request
message RecordEventRequest {
  string record_id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string clinic_id = 4;
  RecordEventType event_type = 5;
  healthcare.medical_records.enums.RecordStatus previous_status = 6;
  healthcare.medical_records.enums.RecordStatus new_status = 7;
  string event_data = 8;
  string triggered_by = 9;
  string description = 10;
  string ip_address = 11;
  string user_agent = 12;
}

// Record event response
message RecordEventResponse {
  bool success = 1;
  string message = 2;
  RecordEvent event = 3;
}

// List record events request
message ListRecordEventsRequest {
  string record_id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string clinic_id = 4;
  RecordEventType event_type = 5;
  google.protobuf.Timestamp start_date = 6;
  google.protobuf.Timestamp end_date = 7;
  int32 page_size = 8;
  string page_token = 9;
}

// List record events response
message ListRecordEventsResponse {
  repeated RecordEvent events = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Record event summary
message RecordEventSummary {
  RecordEventType event_type = 1;
  int32 count = 2;
  google.protobuf.Timestamp last_occurrence = 3;
  repeated string recent_users = 4;
}

// Record access log
message RecordAccessLog {
  string access_id = 1;
  string record_id = 2;
  string patient_id = 3;
  string accessed_by = 4;
  string access_type = 5; // view, edit, print, export, share
  google.protobuf.Timestamp access_time = 6;
  string ip_address = 7;
  string user_agent = 8;
  string reason = 9;
  bool authorized = 10;
}

// Record audit trail
message RecordAuditTrail {
  string record_id = 1;
  string patient_id = 2;
  repeated RecordEvent events = 3;
  repeated RecordAccessLog access_logs = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_accessed = 6;
  string last_accessed_by = 7;
  int32 total_accesses = 8;
}
