syntax = "proto3";

package crm_hr.support.messages;

import "google/protobuf/timestamp.proto";
import "crm_hr/support/enums/support_channel.proto";

option go_package = "github.com/rice-dev/crm-hr/support/messages";

// SupportReply represents a reply to a support ticket
message SupportReply {
  // Unique identifier for the reply
  string id = 1;

  // Associated ticket ID
  string ticket_id = 2;

  // Reply information
  string content = 3;
  string content_type = 4; // text, html, markdown, etc.
  string reply_type = 5; // response, note, internal_note, system_note, etc.
  string direction = 6; // inbound, outbound, internal

  // Author information
  string author_id = 7;
  string author_name = 8;
  string author_email = 9;
  string author_type = 10; // customer, agent, system, bot, etc.
  string author_role = 11; // customer, support_agent, manager, admin, etc.

  // Reply metadata
  crm_hr.support.enums.SupportChannel channel = 12;
  string source = 13; // email, web, chat, phone, api, etc.
  string status = 14; // sent, delivered, read, replied, etc.
  bool is_public = 15;
  bool is_internal = 16;
  bool is_automated = 17;

  // Reply timing
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp sent_at = 19;
  google.protobuf.Timestamp delivered_at = 20;
  google.protobuf.Timestamp read_at = 21;
  google.protobuf.Timestamp replied_at = 22;

  // Related entities
  string parent_reply_id = 23;
  repeated string child_reply_ids = 24;
  string related_ticket_id = 25;
  string related_conversation_id = 26;

  // Reply content
  string subject = 27;
  string summary = 28;
  repeated string attachments = 29;
  repeated string mentions = 30;
  repeated string tags = 31;

  // Reply actions
  bool requires_response = 32;
  bool is_escalation = 33;
  bool is_resolution = 34;
  bool is_solution = 35;
  bool is_feedback = 36;

  // Additional information
  string notes = 37;
  string internal_notes = 38;
  map<string, string> custom_fields = 39;

  // Timestamps
  google.protobuf.Timestamp updated_at = 40;

  // Version for optimistic concurrency control
  int32 version = 41;
}

// SupportConversation represents a conversation thread for a ticket
message SupportConversation {
  // Unique identifier for the conversation
  string id = 1;

  // Associated ticket ID
  string ticket_id = 2;

  // Conversation information
  string title = 3;
  string description = 4;
  string status = 5; // active, closed, archived, etc.
  string type = 6; // email, chat, phone, etc.

  // Conversation participants
  repeated string participant_ids = 7;
  repeated string participant_names = 8;
  repeated string participant_emails = 9;
  repeated string participant_roles = 10;

  // Conversation metadata
  crm_hr.support.enums.SupportChannel channel = 11;
  string source = 12;
  string priority = 13;
  string category = 14;

  // Conversation lifecycle
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp last_activity_at = 16;
  google.protobuf.Timestamp closed_at = 17;
  google.protobuf.Timestamp archived_at = 18;

  // Conversation content
  repeated SupportReply replies = 19;
  int32 total_replies = 20;
  int32 unread_replies = 21;
  string last_reply_content = 22;
  string last_reply_author = 23;
  google.protobuf.Timestamp last_reply_at = 24;

  // Additional information
  repeated string tags = 25;
  map<string, string> custom_fields = 26;

  // Timestamps
  google.protobuf.Timestamp created_at = 27;
  google.protobuf.Timestamp updated_at = 28;
}

// SupportReplyTemplate represents a reusable template for replies
message SupportReplyTemplate {
  // Unique identifier for the template
  string id = 1;

  // Template information
  string name = 2;
  string description = 3;
  string category = 4;
  string subcategory = 5;
  string type = 6; // response, resolution, escalation, etc.

  // Template content
  string subject_template = 7;
  string content_template = 8;
  string content_type = 9; // text, html, markdown, etc.

  // Template settings
  crm_hr.support.enums.SupportChannel channel = 10;
  string reply_type = 11;
  string direction = 12; // inbound, outbound, internal
  bool is_public = 13;
  bool is_internal = 14;
  bool is_automated = 15;

  // Template metadata
  bool is_active = 16;
  bool is_public = 17;
  string created_by = 18;
  string team_id = 19;
  repeated string tags = 20;
  map<string, string> custom_fields = 21;

  // Usage statistics
  int32 usage_count = 22;
  google.protobuf.Timestamp last_used_at = 23;

  // Timestamps
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp updated_at = 25;
}

// SupportReplyAnalytics represents analytics data for replies
message SupportReplyAnalytics {
  // Associated reply ID
  string reply_id = 1;

  // Response metrics
  int32 response_time_minutes = 2;
  int32 read_time_minutes = 3;
  int32 reply_time_minutes = 4;
  double response_rate = 5;
  double read_rate = 6;
  double reply_rate = 7;

  // Engagement metrics
  int32 view_count = 8;
  int32 click_count = 9;
  int32 download_count = 10;
  double engagement_rate = 11;

  // Quality metrics
  double satisfaction_score = 12;
  double helpfulness_score = 13;
  double resolution_rate = 14;
  double escalation_rate = 15;

  // Calculated at timestamp
  google.protobuf.Timestamp calculated_at = 16;
}

// SupportReplySearch represents search criteria for replies
message SupportReplySearch {
  // Basic search criteria
  string query = 1;
  string content = 2;
  string subject = 3;
  string author_name = 4;
  string author_email = 5;

  // Filter criteria
  string ticket_id = 6;
  string reply_type = 7;
  string direction = 8;
  crm_hr.support.enums.SupportChannel channel = 9;
  string author_type = 10;
  string author_role = 11;
  string status = 12;

  // Date criteria
  google.protobuf.Timestamp created_after = 13;
  google.protobuf.Timestamp created_before = 14;
  google.protobuf.Timestamp sent_after = 15;
  google.protobuf.Timestamp sent_before = 16;
  google.protobuf.Timestamp read_after = 17;
  google.protobuf.Timestamp read_before = 18;

  // Additional criteria
  bool is_public = 19;
  bool is_internal = 20;
  bool is_automated = 21;
  bool requires_response = 22;
  bool is_escalation = 23;
  bool is_resolution = 24;
  bool is_solution = 25;
  bool is_feedback = 26;

  // Search options
  int32 page_size = 27;
  string page_token = 28;
  string order_by = 29;
  string sort_direction = 30; // asc, desc
}
