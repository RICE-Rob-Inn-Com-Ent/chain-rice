syntax = "proto3";

package crm_hr.crm.messages;

import "google/protobuf/timestamp.proto";
import "crm_hr/crm/enums/pipeline_status.proto";
import "crm_hr/crm/enums/deal_stage.proto";

option go_package = "github.com/rice-dev/crm-hr/crm/messages";

// Pipeline represents a sales pipeline with defined stages
message Pipeline {
  // Unique identifier for the pipeline
  string id = 1;

  // Name of the pipeline
  string name = 2;

  // Description of the pipeline
  string description = 3;

  // Current status of the pipeline
  crm_hr.crm.enums.PipelineStatus status = 4;

  // Whether this is the default pipeline for new deals
  bool is_default = 5;

  // Pipeline stages in order
  repeated PipelineStage stages = 6;

  // Target revenue for this pipeline
  double target_revenue = 7;

  // Target number of deals for this pipeline
  int32 target_deals = 8;

  // Owner/creator of the pipeline
  string owner_id = 9;

  // Team or department this pipeline belongs to
  string team_id = 10;

  // Timestamps
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp deleted_at = 13;

  // Version for optimistic concurrency control
  int32 version = 14;
}

// PipelineStage represents a stage within a pipeline
message PipelineStage {
  // Unique identifier for the stage
  string id = 1;

  // Associated pipeline ID
  string pipeline_id = 2;

  // Name of the stage
  string name = 3;

  // Description of the stage
  string description = 4;

  // Order of this stage in the pipeline (0-based)
  int32 order = 5;

  // Deal stage enum value
  crm_hr.crm.enums.DealStage deal_stage = 6;

  // Default probability for deals in this stage
  int32 default_probability = 7;

  // Whether deals can be moved backward from this stage
  bool allow_backward_movement = 8;

  // Whether this is a closing stage (won or lost)
  bool is_closing_stage = 9;

  // Color code for UI display
  string color = 10;

  // Timestamps
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// PipelineMetrics represents performance metrics for a pipeline
message PipelineMetrics {
  // Associated pipeline ID
  string pipeline_id = 1;

  // Total number of deals in the pipeline
  int32 total_deals = 2;

  // Number of deals by stage
  map<string, int32> deals_by_stage = 3;

  // Total expected value of all deals
  double total_expected_value = 4;

  // Expected value by stage
  map<string, double> expected_value_by_stage = 5;

  // Average deal size
  double average_deal_size = 6;

  // Conversion rate from lead to closed won
  double conversion_rate = 7;

  // Average time to close (in days)
  double average_time_to_close = 8;

  // Number of deals closed this month
  int32 deals_closed_this_month = 9;

  // Revenue closed this month
  double revenue_closed_this_month = 10;

  // Pipeline velocity (deals moving through stages per week)
  double pipeline_velocity = 11;

  // Last calculated timestamp
  google.protobuf.Timestamp calculated_at = 12;
}
