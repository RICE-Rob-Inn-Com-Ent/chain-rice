syntax = "proto3";

package crm_hr.customers.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/money.proto";
import "crm_hr/customers/messages/customer.proto";
import "crm_hr/customers/messages/contact.proto";
import "crm_hr/customers/messages/interaction.proto";
import "crm_hr/customers/enums/customer_type.proto";
import "crm_hr/customers/enums/customer_status.proto";
import "crm_hr/customers/enums/contact_preference.proto";

option go_package = "github.com/rice-dev/crm-hr/customers/services";

// CustomerService provides comprehensive customer management functionality
service CustomerService {
  // Customer Management
  rpc CreateCustomer(CreateCustomerRequest) returns (Customer);
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  rpc UpdateCustomer(UpdateCustomerRequest) returns (Customer);
  rpc DeleteCustomer(DeleteCustomerRequest) returns (google.protobuf.Empty);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);

  // Customer Business Operations
  rpc UpdateCustomerStatus(UpdateCustomerStatusRequest) returns (Customer);
  rpc AssignCustomer(AssignCustomerRequest) returns (Customer);
  rpc MergeCustomers(MergeCustomersRequest) returns (Customer);
  rpc GetCustomerLifetimeValue(GetCustomerLifetimeValueRequest) returns (CustomerLifetimeValue);
  rpc GetCustomerAnalytics(GetCustomerAnalyticsRequest) returns (CustomerAnalyticsResponse);

  // Contact Management
  rpc CreateContact(CreateContactRequest) returns (Contact);
  rpc GetContact(GetContactRequest) returns (Contact);
  rpc UpdateContact(UpdateContactRequest) returns (Contact);
  rpc DeleteContact(DeleteContactRequest) returns (google.protobuf.Empty);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);

  // Contact Business Operations
  rpc SetPrimaryContact(SetPrimaryContactRequest) returns (Contact);
  rpc GetContactByEmail(GetContactByEmailRequest) returns (Contact);
  rpc GetContactByPhone(GetContactByPhoneRequest) returns (Contact);

  // Interaction Management
  rpc CreateInteraction(CreateInteractionRequest) returns (Interaction);
  rpc GetInteraction(GetInteractionRequest) returns (Interaction);
  rpc UpdateInteraction(UpdateInteractionRequest) returns (Interaction);
  rpc DeleteInteraction(DeleteInteractionRequest) returns (google.protobuf.Empty);
  rpc ListInteractions(ListInteractionsRequest) returns (ListInteractionsResponse);

  // Interaction Business Operations
  rpc GetInteractionSummary(GetInteractionSummaryRequest) returns (InteractionSummary);
  rpc GetCustomerInteractions(GetCustomerInteractionsRequest) returns (GetCustomerInteractionsResponse);
  rpc LogInteraction(LogInteractionRequest) returns (Interaction);

  // Contact List Management
  rpc CreateContactList(CreateContactListRequest) returns (ContactList);
  rpc GetContactList(GetContactListRequest) returns (ContactList);
  rpc UpdateContactList(UpdateContactListRequest) returns (ContactList);
  rpc DeleteContactList(DeleteContactListRequest) returns (google.protobuf.Empty);
  rpc ListContactLists(ListContactListsRequest) returns (ListContactListsResponse);

  // Contact List Business Operations
  rpc AddContactToList(AddContactToListRequest) returns (ContactListMember);
  rpc RemoveContactFromList(RemoveContactFromListRequest) returns (google.protobuf.Empty);
  rpc GetContactListMembers(GetContactListMembersRequest) returns (GetContactListMembersResponse);

  // Segmentation and Analytics
  rpc CreateCustomerSegment(CreateCustomerSegmentRequest) returns (CustomerSegment);
  rpc GetCustomerSegment(GetCustomerSegmentRequest) returns (CustomerSegment);
  rpc UpdateCustomerSegment(UpdateCustomerSegmentRequest) returns (CustomerSegment);
  rpc DeleteCustomerSegment(DeleteCustomerSegmentRequest) returns (google.protobuf.Empty);
  rpc ListCustomerSegments(ListCustomerSegmentsRequest) returns (ListCustomerSegmentsResponse);

  // Advanced Analytics
  rpc GetCustomerSegmentation(GetCustomerSegmentationRequest) returns (CustomerSegmentationResponse);
  rpc GetCustomerRetentionAnalysis(GetCustomerRetentionAnalysisRequest) returns (CustomerRetentionAnalysisResponse);
  rpc GetCustomerChurnPrediction(GetCustomerChurnPredictionRequest) returns (CustomerChurnPredictionResponse);
}

// Customer Management Requests/Responses
message CreateCustomerRequest {
  crm_hr.customers.enums.CustomerType type = 1;
  string first_name = 2;
  string last_name = 3;
  string company_name = 4;
  string industry = 5;
  string source = 6;
  string assigned_representative = 7;
  repeated string tags = 8;
  map<string, string> custom_fields = 9;
}

message GetCustomerRequest {
  string id = 1;
}

message UpdateCustomerRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string company_name = 4;
  string industry = 5;
  repeated string tags = 6;
  map<string, string> custom_fields = 7;
}

message DeleteCustomerRequest {
  string id = 1;
}

message ListCustomersRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string order_by = 4;
  crm_hr.customers.enums.CustomerType type = 5;
  crm_hr.customers.enums.CustomerStatus status = 6;
  string assigned_representative = 7;
  string segment = 8;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Customer Business Operations
message UpdateCustomerStatusRequest {
  string customer_id = 1;
  crm_hr.customers.enums.CustomerStatus status = 2;
  string reason = 3;
}

message AssignCustomerRequest {
  string customer_id = 1;
  string assigned_representative = 2;
  string assigned_team = 3;
  string reason = 4;
}

message MergeCustomersRequest {
  string primary_customer_id = 1;
  string secondary_customer_id = 2;
  string merge_reason = 3;
}

message GetCustomerLifetimeValueRequest {
  string customer_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message GetCustomerAnalyticsRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string segment = 3;
  string assigned_representative = 4;
  string team_id = 5;
}

message CustomerAnalyticsResponse {
  int32 total_customers = 1;
  int32 new_customers = 2;
  int32 active_customers = 3;
  int32 churned_customers = 4;
  double average_lifetime_value = 5;
  double total_revenue = 6;
  double retention_rate = 7;
  double churn_rate = 8;
  map<string, int32> customers_by_type = 9;
  map<string, int32> customers_by_status = 10;
  map<string, int32> customers_by_segment = 11;
}

// Contact Management
message CreateContactRequest {
  string customer_id = 1;
  string contact_type = 2;
  string first_name = 3;
  string last_name = 4;
  string title = 5;
  string department = 6;
  repeated string email_addresses = 7;
  repeated string phone_numbers = 8;
  repeated crm_hr.customers.enums.ContactPreference preferences = 9;
  string notes = 10;
}

message GetContactRequest {
  string id = 1;
}

message UpdateContactRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string title = 4;
  string department = 5;
  repeated string email_addresses = 6;
  repeated string phone_numbers = 7;
  repeated crm_hr.customers.enums.ContactPreference preferences = 8;
  string notes = 9;
}

message DeleteContactRequest {
  string id = 1;
}

message ListContactsRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string filter = 4;
  string contact_type = 5;
}

message ListContactsResponse {
  repeated Contact contacts = 1;
  string next_page_token = 2;
}

// Contact Business Operations
message SetPrimaryContactRequest {
  string contact_id = 1;
  string customer_id = 2;
}

message GetContactByEmailRequest {
  string email = 1;
}

message GetContactByPhoneRequest {
  string phone_number = 1;
}

// Interaction Management
message CreateInteractionRequest {
  string customer_id = 1;
  string contact_id = 2;
  string interaction_type = 3;
  string channel = 4;
  string direction = 5;
  string subject = 6;
  string description = 7;
  string initiated_by = 8;
  repeated string participants = 9;
  string assigned_to = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp ended_at = 12;
  string status = 13;
  string priority = 14;
  repeated string tags = 15;
  map<string, string> custom_fields = 16;
}

message GetInteractionRequest {
  string id = 1;
}

message UpdateInteractionRequest {
  string id = 1;
  string subject = 2;
  string description = 3;
  string outcome = 4;
  string status = 5;
  string priority = 6;
  repeated string tags = 7;
  map<string, string> custom_fields = 8;
}

message DeleteInteractionRequest {
  string id = 1;
}

message ListInteractionsRequest {
  string customer_id = 1;
  string contact_id = 2;
  int32 page_size = 3;
  string page_token = 4;
  string filter = 5;
  string interaction_type = 6;
  string channel = 7;
  google.protobuf.Timestamp start_date = 8;
  google.protobuf.Timestamp end_date = 9;
}

message ListInteractionsResponse {
  repeated Interaction interactions = 1;
  string next_page_token = 2;
}

// Interaction Business Operations
message GetInteractionSummaryRequest {
  string customer_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

message GetCustomerInteractionsRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  string interaction_type = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
}

message GetCustomerInteractionsResponse {
  repeated Interaction interactions = 1;
  string next_page_token = 2;
  InteractionSummary summary = 3;
}

message LogInteractionRequest {
  string customer_id = 1;
  string contact_id = 2;
  string interaction_type = 3;
  string channel = 4;
  string direction = 5;
  string subject = 6;
  string description = 7;
  string initiated_by = 8;
  string outcome = 9;
  int32 satisfaction_rating = 10;
  string satisfaction_feedback = 11;
}

// Contact List Management
message CreateContactListRequest {
  string name = 1;
  string description = 2;
  string list_type = 3;
  string criteria = 4;
  bool is_dynamic = 5;
  string team_id = 6;
}

message GetContactListRequest {
  string id = 1;
}

message UpdateContactListRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string criteria = 4;
  bool is_active = 5;
}

message DeleteContactListRequest {
  string id = 1;
}

message ListContactListsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  string list_type = 4;
  string team_id = 5;
}

message ListContactListsResponse {
  repeated ContactList contact_lists = 1;
  string next_page_token = 2;
}

// Contact List Business Operations
message AddContactToListRequest {
  string contact_list_id = 1;
  string contact_id = 2;
  string added_by = 3;
  string added_method = 4;
}

message RemoveContactFromListRequest {
  string contact_list_id = 1;
  string contact_id = 2;
  string removed_by = 3;
  string removal_reason = 4;
}

message GetContactListMembersRequest {
  string contact_list_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetContactListMembersResponse {
  repeated ContactListMember members = 1;
  string next_page_token = 2;
}

// Segmentation and Analytics
message CreateCustomerSegmentRequest {
  string name = 1;
  string description = 2;
  string criteria = 3;
  string created_by = 4;
}

message GetCustomerSegmentRequest {
  string id = 1;
}

message UpdateCustomerSegmentRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string criteria = 4;
}

message DeleteCustomerSegmentRequest {
  string id = 1;
}

message ListCustomerSegmentsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
  bool is_active = 4;
}

message ListCustomerSegmentsResponse {
  repeated CustomerSegment segments = 1;
  string next_page_token = 2;
}

// Advanced Analytics
message GetCustomerSegmentationRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string segmentation_type = 3; // rfm, behavioral, demographic, etc.
}

message CustomerSegmentationResponse {
  map<string, int32> segment_counts = 1;
  map<string, double> segment_values = 2;
  repeated CustomerSegment segments = 3;
  google.protobuf.Timestamp calculated_at = 4;
}

message GetCustomerRetentionAnalysisRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string cohort_type = 3; // monthly, quarterly, yearly
}

message CustomerRetentionAnalysisResponse {
  map<string, double> retention_rates = 1;
  map<string, int32> cohort_sizes = 2;
  double overall_retention_rate = 3;
  double average_retention_rate = 4;
  google.protobuf.Timestamp calculated_at = 5;
}

message GetCustomerChurnPredictionRequest {
  string customer_id = 1;
  google.protobuf.Timestamp prediction_date = 2;
  string model_version = 3;
}

message CustomerChurnPredictionResponse {
  string customer_id = 1;
  double churn_probability = 2;
  double confidence_score = 3;
  repeated string risk_factors = 4;
  repeated string recommendations = 5;
  google.protobuf.Timestamp predicted_at = 6;
  string model_version = 7;
}
