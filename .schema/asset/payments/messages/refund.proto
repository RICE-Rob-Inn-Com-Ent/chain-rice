syntax = "proto3";

package finance.payments.messages;

import "finance/payments/enums/payment_status.proto";

// Refund representation
message Refund {
  // Unique refund identifier
  string refund_id = 1;

  // Original payment ID
  string payment_id = 2;

  // Refund amount
  double amount = 3;

  // Currency code
  string currency = 4;

  // Refund status
  finance.payments.enums.PaymentStatus status = 5;

  // Refund reason
  string reason = 6;

  // Refund date
  int64 refund_date = 7;

  // Processed date
  int64 processed_date = 8;

  // Transaction ID
  string transaction_id = 9;

  // External transaction ID
  string external_transaction_id = 10;

  // Payment gateway
  string payment_gateway = 11;

  // Refund method
  string refund_method = 12;

  // Refund type
  string refund_type = 13;

  // Customer information
  RefundCustomer customer = 14;

  // Refund fees
  RefundFee fees = 15;

  // Refund notes
  string notes = 16;

  // Refund tags
  repeated string tags = 17;

  // Custom fields
  map<string, string> custom_fields = 18;

  // Creation timestamp
  int64 created_at = 19;

  // Last update timestamp
  int64 updated_at = 20;

  // Created by user ID
  string created_by = 21;

  // Updated by user ID
  string updated_by = 22;

  // Approved by user ID
  string approved_by = 23;

  // Approval timestamp
  int64 approved_at = 24;

  // Failed timestamp
  int64 failed_at = 25;

  // Failure reason
  string failure_reason = 26;
}

// Refund customer information
message RefundCustomer {
  // Customer ID
  string customer_id = 1;

  // Customer name
  string name = 2;

  // Customer email
  string email = 3;

  // Customer phone
  string phone = 4;

  // Refund address
  Address refund_address = 5;
}

// Address information
message Address {
  // Street address
  string street = 1;

  // City
  string city = 2;

  // State/Province
  string state = 3;

  // Postal code
  string postal_code = 4;

  // Country
  string country = 5;

  // Country code
  string country_code = 6;
}

// Refund fee information
message RefundFee {
  // Processing fee
  double processing_fee = 1;

  // Gateway fee
  double gateway_fee = 2;

  // Transaction fee
  double transaction_fee = 3;

  // Total fees
  double total_fees = 4;

  // Fee currency
  string fee_currency = 5;

  // Fee refunded
  bool fee_refunded = 6;
}

// Refund creation request
message CreateRefundRequest {
  // Original payment ID
  string payment_id = 1;

  // Refund amount
  double amount = 2;

  // Currency code
  string currency = 3;

  // Refund reason
  string reason = 4;

  // Refund date
  int64 refund_date = 5;

  // Refund method
  string refund_method = 6;

  // Refund type
  string refund_type = 7;

  // Customer information
  RefundCustomer customer = 8;

  // Refund notes
  string notes = 9;

  // Refund tags
  repeated string tags = 10;

  // Custom fields
  map<string, string> custom_fields = 11;
}

// Refund creation response
message CreateRefundResponse {
  // Created refund
  Refund refund = 1;

  // Success status
  bool success = 2;

  // Error message if any
  string error_message = 3;
}

// Refund update request
message UpdateRefundRequest {
  // Refund ID
  string refund_id = 1;

  // Updated refund status
  finance.payments.enums.PaymentStatus status = 2;

  // Updated notes
  string notes = 3;

  // Updated tags
  repeated string tags = 4;

  // Updated custom fields
  map<string, string> custom_fields = 5;
}

// Refund update response
message UpdateRefundResponse {
  // Updated refund
  Refund refund = 1;

  // Success status
  bool success = 2;

  // Error message if any
  string error_message = 3;
}

// Refund list request
message ListRefundsRequest {
  // Filter by payment ID
  string payment_id = 1;

  // Filter by refund status
  finance.payments.enums.PaymentStatus status = 2;

  // Filter by customer ID
  string customer_id = 3;

  // Filter by date range
  int64 start_date = 4;
  int64 end_date = 5;

  // Filter by currency
  string currency = 6;

  // Filter by refund method
  string refund_method = 7;

  // Search term
  string search_term = 8;

  // Page number
  int32 page = 9;

  // Page size
  int32 page_size = 10;
}

// Refund list response
message ListRefundsResponse {
  // List of refunds
  repeated Refund refunds = 1;

  // Total count
  int64 total_count = 2;

  // Page number
  int32 page = 3;

  // Page size
  int32 page_size = 4;

  // Success status
  bool success = 5;

  // Error message if any
  string error_message = 6;
}
