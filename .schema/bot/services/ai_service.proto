  repeated automation.ai.messages.PredictionRequest requests = 1;

  // Batch configuration
  google.protobuf.Struct batch_config = 2;
}

message BatchPredictResponse {
  // Prediction responses
  repeated automation.ai.messages.PredictionResponse responses = 1;

  // Batch metadata
  google.protobuf.Struct batch_metadata = 2;

  // Response status
  string status = 3;

  // Response message
  string message = 4;
}

message GetPredictionRequest {
  // Prediction ID
  string prediction_id = 1;

  // Include metadata
  bool include_metadata = 2;

  // Include performance
  bool include_performance = 3;
}

message GetPredictionResponse {
  // Prediction response
  automation.ai.messages.PredictionResponse response = 1;

  // Response status
  string status = 2;

  // Response message
  string message = 3;
}

message ListPredictionsRequest {
  // Page size
  int32 page_size = 1;

  // Page token
  string page_token = 2;

  // Filter by model ID
  string model_id = 3;

  // Filter by user
  string user = 4;

  // Filter by status
  string status = 5;

  // Filter by date range
  google.protobuf.Struct date_range = 6;

  // Sort field
  string sort_field = 7;

  // Sort order
  string sort_order = 8;
}

message ListPredictionsResponse {
  // Predictions
  repeated automation.ai.messages.PredictionResponse predictions = 1;

  // Next page token
  string next_page_token = 2;

  // Total count
