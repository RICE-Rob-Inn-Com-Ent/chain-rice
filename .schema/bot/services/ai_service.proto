syntax = "proto3";

package automation.ai.services;

import "automation/ai/messages/model.proto";
import "automation/ai/messages/dataset.proto";
import "automation/ai/messages/training_job.proto";
import "automation/ai/messages/prediction_request.proto";
import "automation/ai/messages/prediction_response.proto";
import "automation/ai/enums/ai_model_type.proto";
import "automation/ai/enums/ai_task_status.proto";
import "automation/ai/enums/ai_priority.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// AI Service
// Provides comprehensive AI model management, training, and prediction services
service AIService {
  // Model Management RPCs
  rpc CreateModel(CreateModelRequest) returns (CreateModelResponse);
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
  rpc UpdateModel(UpdateModelRequest) returns (UpdateModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (google.protobuf.Empty);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc SearchModels(SearchModelsRequest) returns (SearchModelsResponse);

  // Model Training RPCs
  rpc TrainModel(TrainModelRequest) returns (TrainModelResponse);
  rpc GetTrainingJob(GetTrainingJobRequest) returns (GetTrainingJobResponse);
  rpc ListTrainingJobs(ListTrainingJobsRequest) returns (ListTrainingJobsResponse);
  rpc CancelTrainingJob(CancelTrainingJobRequest) returns (google.protobuf.Empty);
  rpc GetTrainingProgress(GetTrainingProgressRequest) returns (GetTrainingProgressResponse);

  // Model Prediction RPCs
  rpc Predict(PredictRequest) returns (PredictResponse);
  rpc BatchPredict(BatchPredictRequest) returns (BatchPredictResponse);
  rpc StreamPredict(stream PredictRequest) returns (stream PredictResponse);
  rpc GetPrediction(GetPredictionRequest) returns (GetPredictionResponse);
  rpc ListPredictions(ListPredictionsRequest) returns (ListPredictionsResponse);

  // Dataset Management RPCs
  rpc CreateDataset(CreateDatasetRequest) returns (CreateDatasetResponse);
  rpc GetDataset(GetDatasetRequest) returns (GetDatasetResponse);
  rpc UpdateDataset(UpdateDatasetRequest) returns (UpdateDatasetResponse);
  rpc DeleteDataset(DeleteDatasetRequest) returns (google.protobuf.Empty);
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);
  rpc SearchDatasets(SearchDatasetsRequest) returns (SearchDatasetsResponse);

  // Model Evaluation RPCs
  rpc EvaluateModel(EvaluateModelRequest) returns (EvaluateModelResponse);
  rpc GetModelMetrics(GetModelMetricsRequest) returns (GetModelMetricsResponse);
  rpc CompareModels(CompareModelsRequest) returns (CompareModelsResponse);

  // Model Deployment RPCs
  rpc DeployModel(DeployModelRequest) returns (DeployModelResponse);
  rpc UndeployModel(UndeployModelRequest) returns (google.protobuf.Empty);
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc UpdateDeployment(UpdateDeploymentRequest) returns (UpdateDeploymentResponse);

  // Model Versioning RPCs
  rpc CreateModelVersion(CreateModelVersionRequest) returns (CreateModelVersionResponse);
  rpc GetModelVersion(GetModelVersionRequest) returns (GetModelVersionResponse);
  rpc ListModelVersions(ListModelVersionsRequest) returns (ListModelVersionsResponse);
  rpc DeleteModelVersion(DeleteModelVersionRequest) returns (google.protobuf.Empty);

  // Health and Status RPCs
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);
  rpc GetServiceStatus(google.protobuf.Empty) returns (ServiceStatusResponse);
  rpc GetServiceMetrics(google.protobuf.Empty) returns (ServiceMetricsResponse);
}

// Model Management Request/Response Messages

message CreateModelRequest {
  // Model name
  string name = 1;

  // Model description
  string description = 2;

  // Model type
  automation.ai.enums.AIModelType model_type = 3;

  // Model priority
  automation.ai.enums.AIPriority priority = 4;

  // Model configuration
  google.protobuf.Struct config = 5;

  // Model metadata
  map<string, string> metadata = 6;

  // Model tags
  repeated string tags = 7;

  // Model owner
  string owner = 8;
}

message CreateModelResponse {
  // Created model
  automation.ai.messages.Model model = 1;

  // Response status
  string status = 2;

  // Response message
  string message = 3;
}

message GetModelRequest {
  // Model ID
  string model_id = 1;

  // Include metadata
  bool include_metadata = 2;

  // Include metrics
  bool include_metrics = 3;
}

message GetModelResponse {
  // Model
  automation.ai.messages.Model model = 1;

  // Response status
  string status = 2;

  // Response message
  string message = 3;
}

message UpdateModelRequest {
  // Model ID
  string model_id = 1;

  // Model name
  string name = 2;

  // Model description
  string description = 3;

  // Model configuration
  google.protobuf.Struct config = 4;

  // Model metadata
  map<string, string> metadata = 5;

  // Model tags
  repeated string tags = 6;

  // Update mask
  repeated string update_mask = 7;
}

message UpdateModelResponse {
  // Updated model
  automation.ai.messages.Model model = 1;

  // Response status
  string status = 2;

  // Response message
  string message = 3;
}

message DeleteModelRequest {
  // Model ID
  string model_id = 1;

  // Force delete
  bool force = 2;

  // Delete dependencies
  bool delete_dependencies = 3;
}

message ListModelsRequest {
  // Page size
  int32 page_size = 1;

  // Page token
  string page_token = 2;

  // Filter by model type
  automation.ai.enums.AIModelType model_type = 3;

  // Filter by priority
  automation.ai.enums.AIPriority priority = 4;

  // Filter by owner
  string owner = 5;

  // Filter by tags
  repeated string tags = 6;

  // Search query
  string search_query = 7;

  // Sort field
  string sort_field = 8;

  // Sort order
  string sort_order = 9;
}

message ListModelsResponse {
  // Models
  repeated automation.ai.messages.Model models = 1;

  // Next page token
  string next_page_token = 2;

  // Total count
  int64 total_count = 3;
}

message SearchModelsRequest {
  // Search query
  string query = 1;

  // Search filters
  google.protobuf.Struct filters = 2;

  // Page size
  int32 page_size = 3;

  // Page token
  string page_token = 4;

  // Search fields
  repeated string search_fields = 5;
}

message SearchModelsResponse {
  // Search results
  repeated automation.ai.messages.Model models = 1;

  // Search metadata
  google.protobuf.Struct search_metadata = 2;

  // Next page token
  string next_page_token = 3;

  // Total count
  int64 total_count = 4;
}

// Model Training Request/Response Messages

