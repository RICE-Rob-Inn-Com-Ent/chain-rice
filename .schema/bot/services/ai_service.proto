  // Training priority
  automation.ai.enums.AIPriority priority = 5;

  // Training tags
  repeated string tags = 6;

  // Training metadata
  map<string, string> metadata = 7;
}

message TrainModelResponse {
  // Training job
  automation.ai.messages.TrainingJob training_job = 1;

  // Response status
  string status = 2;

  // Response message
  string message = 3;
}

message GetTrainingJobRequest {
  // Training job ID
  string training_job_id = 1;

  // Include logs
  bool include_logs = 2;

  // Include metrics
  bool include_metrics = 3;
}

message GetTrainingJobResponse {
  // Training job
  automation.ai.messages.TrainingJob training_job = 1;

  // Response status
  string status = 2;

  // Response message
  string message = 3;
}

message ListTrainingJobsRequest {
  // Page size
  int32 page_size = 1;

  // Page token
  string page_token = 2;

  // Filter by model ID
  string model_id = 3;

  // Filter by status
  automation.ai.enums.AITaskStatus status = 4;

  // Filter by priority
  automation.ai.enums.AIPriority priority = 5;

  // Filter by owner
  string owner = 6;

  // Filter by tags
  repeated string tags = 7;

  // Sort field
  string sort_field = 8;

  // Sort order
  string sort_order = 9;
}

message ListTrainingJobsResponse {
  // Training jobs
  repeated automation.ai.messages.TrainingJob training_jobs = 1;

  // Next page token
  string next_page_token = 2;

  // Total count
  int64 total_count = 3;
}

message CancelTrainingJobRequest {
  // Training job ID
  string training_job_id = 1;

  // Cancel reason
  string reason = 2;
}

message GetTrainingProgressRequest {
  // Training job ID
  string training_job_id = 1;

  // Include detailed progress
  bool include_detailed = 2;
}

message GetTrainingProgressResponse {
  // Training progress
  automation.ai.messages.TrainingProgress progress = 1;

  // Response status
  string status = 2;

  // Response message
  string message = 3;
}

