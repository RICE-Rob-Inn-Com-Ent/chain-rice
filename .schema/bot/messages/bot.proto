syntax = "proto3";

package automation.bots.messages;

import "automation/bots/enums/bot_type.proto";
import "automation/bots/enums/bot_status.proto";
import "automation/bots/enums/bot_priority.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Bot message
// Represents an automation bot in the system
message Bot {
  // Unique identifier for the bot
  string id = 1;

  // Human-readable name of the bot
  string name = 2;

  // Description of the bot's purpose and functionality
  string description = 3;

  // Version of the bot
  string version = 4;

  // Type of bot
  automation.bots.enums.BotType bot_type = 5;

  // Current status of the bot
  automation.bots.enums.BotStatus status = 6;

  // Priority level for bot execution
  automation.bots.enums.BotPriority priority = 7;

  // Bot configuration
  BotConfiguration config = 8;

  // Bot capabilities
  BotCapabilities capabilities = 9;

  // Bot resources
  BotResources resources = 10;

  // Bot schedule
  BotSchedule schedule = 11;

  // Bot monitoring
  BotMonitoring monitoring = 12;

  // Bot security
  BotSecurity security = 13;

  // Bot metadata
  map<string, string> metadata = 14;

  // Bot tags
  repeated string tags = 15;

  // Creation timestamp
  google.protobuf.Timestamp created_at = 16;

  // Last update timestamp
  google.protobuf.Timestamp updated_at = 17;

  // Last execution timestamp
  google.protobuf.Timestamp last_executed_at = 18;

  // Bot owner/creator
  string owner = 19;

  // Bot dependencies
  repeated string dependencies = 20;

  // Bot environment
  string environment = 21;

  // Bot region
  string region = 22;

  // Bot namespace
  string namespace = 23;
}

// Bot configuration
message BotConfiguration {
  // Configuration type
  string config_type = 1;

  // Configuration parameters
  google.protobuf.Struct parameters = 2;

  // Environment variables
  map<string, string> environment_variables = 3;

  // Configuration files
  repeated ConfigFile config_files = 4;

  // Configuration validation
  ConfigValidation validation = 5;

  // Configuration version
  string version = 6;

  // Configuration checksum
  string checksum = 7;
}

// Configuration file
message ConfigFile {
  // File name
  string name = 1;

  // File path
  string path = 2;

  // File content
  string content = 3;

  // File type
  string type = 4;

  // File encoding
  string encoding = 5;

  // File permissions
  string permissions = 6;
}

// Configuration validation
message ConfigValidation {
  // Validation enabled
  bool enabled = 1;

  // Validation rules
  repeated ValidationRule rules = 2;

  // Validation schema
  string schema = 3;

  // Validation strict mode
  bool strict_mode = 4;
}

// Validation rule
message ValidationRule {
  // Rule name
  string name = 1;

  // Rule type
  string type = 2;

  // Rule expression
  string expression = 3;

  // Rule parameters
  google.protobuf.Struct parameters = 4;

  // Rule severity
  string severity = 5;
}

// Bot capabilities
message BotCapabilities {
  // Supported operations
  repeated string operations = 1;

  // Supported data formats
  repeated string data_formats = 2;

  // Supported protocols
  repeated string protocols = 3;

  // Supported platforms
  repeated string platforms = 4;

  // Supported languages
  repeated string languages = 5;

  // Supported databases
  repeated string databases = 6;

  // Supported APIs
  repeated string apis = 7;

  // Supported file types
  repeated string file_types = 8;

  // Supported network protocols
  repeated string network_protocols = 9;

  // Supported authentication methods
  repeated string authentication_methods = 10;

  // Performance capabilities
  PerformanceCapabilities performance = 11;

  // Security capabilities
  SecurityCapabilities security = 12;

  // Integration capabilities
  IntegrationCapabilities integration = 13;
}

// Performance capabilities
message PerformanceCapabilities {
  // Maximum concurrent operations
  int32 max_concurrent_operations = 1;

  // Maximum data processing rate
  int64 max_data_processing_rate = 2;

  // Maximum memory usage
  int64 max_memory_usage = 3;

  // Maximum CPU usage
  int32 max_cpu_usage = 4;

  // Maximum network bandwidth
  int64 max_network_bandwidth = 5;

  // Maximum storage usage
  int64 max_storage_usage = 6;

  // Response time requirements
  int64 response_time_ms = 7;

  // Throughput requirements
  int64 throughput_ops_per_second = 8;
}

// Security capabilities
message SecurityCapabilities {
  // Supported encryption algorithms
  repeated string encryption_algorithms = 1;

  // Supported hashing algorithms
  repeated string hashing_algorithms = 2;

  // Supported authentication protocols
  repeated string authentication_protocols = 3;

  // Supported authorization methods
  repeated string authorization_methods = 4;

  // Supported audit logging
  bool audit_logging = 5;

  // Supported data masking
  bool data_masking = 6;

  // Supported access control
  bool access_control = 7;

  // Supported compliance standards
  repeated string compliance_standards = 8;
}

// Integration capabilities
message IntegrationCapabilities {
  // Supported integration types
  repeated string integration_types = 1;

  // Supported messaging systems
  repeated string messaging_systems = 2;

  // Supported databases
  repeated string databases = 3;

  // Supported cloud platforms
  repeated string cloud_platforms = 4;

  // Supported APIs
  repeated string apis = 5;

  // Supported webhooks
  bool webhooks = 6;

  // Supported event streaming
  bool event_streaming = 7;

  // Supported batch processing
  bool batch_processing = 8;
}

// Bot resources
message BotResources {
  // Resource requirements
  ResourceRequirements requirements = 1;

  // Resource allocation
  ResourceAllocation allocation = 2;

  // Resource usage
  ResourceUsage usage = 3;

  // Resource limits
  ResourceLimits limits = 4;

  // Resource monitoring
  ResourceMonitoring monitoring = 5;
}

// Resource requirements
message ResourceRequirements {
  // CPU requirements
  string cpu = 1;

  // Memory requirements
  string memory = 2;

  // Storage requirements
  string storage = 3;

  // Network requirements
  string network = 4;

  // GPU requirements
  string gpu = 5;

  // Additional requirements
  map<string, string> additional = 6;
}

// Resource allocation
message ResourceAllocation {
  // Allocated CPU
  string allocated_cpu = 1;

  // Allocated memory
  string allocated_memory = 2;

  // Allocated storage
  string allocated_storage = 3;

  // Allocated network
  string allocated_network = 4;

  // Allocated GPU
  string allocated_gpu = 5;

  // Allocation timestamp
  google.protobuf.Timestamp allocated_at = 6;

  // Allocation duration
  int64 allocation_duration_seconds = 7;
}

// Resource usage
message ResourceUsage {
  // Used CPU
  string used_cpu = 1;

  // Used memory
  string used_memory = 2;

  // Used storage
  string used_storage = 3;

  // Used network
  string used_network = 4;

  // Used GPU
  string used_gpu = 5;

  // Usage timestamp
  google.protobuf.Timestamp usage_timestamp = 6;

  // Usage percentage
  map<string, double> usage_percentage = 7;
}

// Resource limits
message ResourceLimits {
  // CPU limit
  string cpu_limit = 1;

  // Memory limit
  string memory_limit = 2;

  // Storage limit
  string storage_limit = 3;

  // Network limit
  string network_limit = 4;

  // GPU limit
  string gpu_limit = 5;

  // Rate limits
  map<string, int64> rate_limits = 6;
}

// Resource monitoring
message ResourceMonitoring {
  // Monitoring enabled
  bool enabled = 1;

  // Monitoring interval
  int32 interval_seconds = 2;

  // Monitoring metrics
  repeated string metrics = 3;

  // Monitoring alerts
  repeated ResourceAlert alerts = 4;

  // Monitoring dashboard
  string dashboard_url = 5;
}

// Resource alert
message ResourceAlert {
  // Alert name
  string name = 1;

  // Alert condition
  string condition = 2;

  // Alert threshold
  double threshold = 3;

  // Alert severity
  string severity = 4;

  // Alert enabled
  bool enabled = 5;
}

// Bot schedule
message BotSchedule {
  // Schedule type
  string schedule_type = 1;

  // Schedule expression
  string schedule_expression = 2;

  // Schedule timezone
  string timezone = 3;

  // Schedule start time
  google.protobuf.Timestamp start_time = 4;

  // Schedule end time
  google.protobuf.Timestamp end_time = 5;

  // Schedule enabled
  bool enabled = 6;

  // Schedule parameters
  google.protobuf.Struct parameters = 7;

  // Schedule recurrence
  ScheduleRecurrence recurrence = 8;

  // Schedule constraints
  ScheduleConstraints constraints = 9;
}

// Schedule recurrence
message ScheduleRecurrence {
  // Recurrence type
  string type = 1;

  // Recurrence interval
  int32 interval = 2;

  // Recurrence days
  repeated string days = 3;

  // Recurrence hours
  repeated int32 hours = 4;

  // Recurrence minutes
  repeated int32 minutes = 5;

  // Recurrence months
  repeated string months = 6;

  // Recurrence years
  repeated int32 years = 7;
}

// Schedule constraints
message ScheduleConstraints {
  // Maximum execution time
  int64 max_execution_time_seconds = 1;

  // Maximum retries
  int32 max_retries = 2;

  // Retry delay
  int64 retry_delay_seconds = 3;

  // Execution timeout
  int64 execution_timeout_seconds = 4;

  // Resource constraints
  ResourceConstraints resource_constraints = 5;
}

// Resource constraints
message ResourceConstraints {
  // Maximum CPU usage
  double max_cpu_usage = 1;

  // Maximum memory usage
  double max_memory_usage = 2;

  // Maximum network usage
  double max_network_usage = 3;

  // Maximum storage usage
  double max_storage_usage = 4;
}

// Bot monitoring
message BotMonitoring {
  // Monitoring enabled
  bool enabled = 1;

  // Monitoring level
  string level = 2;

  // Monitoring metrics
  repeated string metrics = 3;

  // Monitoring alerts
  repeated MonitoringAlert alerts = 4;

  // Monitoring dashboard
  string dashboard_url = 5;

  // Monitoring logs
  MonitoringLogs logs = 6;

  // Monitoring health checks
  repeated HealthCheck health_checks = 7;
}

// Monitoring alert
message MonitoringAlert {
  // Alert name
  string name = 1;

  // Alert type
  string type = 2;

  // Alert condition
  string condition = 3;

  // Alert threshold
  double threshold = 4;

  // Alert severity
  string severity = 5;

  // Alert enabled
  bool enabled = 6;

  // Alert notification channels
  repeated string notification_channels = 7;

  // Alert cooldown
  int64 cooldown_seconds = 8;
}

// Monitoring logs
message MonitoringLogs {
  // Log level
  string level = 1;

  // Log retention days
  int32 retention_days = 2;

  // Log format
  string format = 3;

  // Log destination
  string destination = 4;

  // Log rotation
  LogRotation rotation = 5;
}

// Log rotation
message LogRotation {
  // Rotation enabled
  bool enabled = 1;

  // Rotation size
  int64 size_mb = 2;

  // Rotation frequency
  string frequency = 3;

  // Rotation count
  int32 count = 4;
}

// Health check
message HealthCheck {
  // Health check name
  string name = 1;

  // Health check type
  string type = 2;

  // Health check endpoint
  string endpoint = 3;

  // Health check interval
  int32 interval_seconds = 4;

  // Health check timeout
  int32 timeout_seconds = 5;

  // Health check enabled
  bool enabled = 6;

  // Health check parameters
  google.protobuf.Struct parameters = 7;
}

// Bot security
message BotSecurity {
  // Security enabled
  bool enabled = 1;

  // Security level
  string level = 2;

  // Authentication
  Authentication authentication = 3;

  // Authorization
  Authorization authorization = 4;

  // Encryption
  Encryption encryption = 5;

  // Audit logging
  AuditLogging audit_logging = 6;

  // Access control
  AccessControl access_control = 7;

  // Compliance
  Compliance compliance = 8;
}

// Authentication
message Authentication {
  // Authentication enabled
  bool enabled = 1;

  // Authentication method
  string method = 2;

  // Authentication parameters
  google.protobuf.Struct parameters = 3;

  // Authentication credentials
  map<string, string> credentials = 4;

  // Authentication timeout
  int32 timeout_seconds = 5;
}

// Authorization
message Authorization {
  // Authorization enabled
  bool enabled = 1;

  // Authorization method
  string method = 2;

  // Authorization roles
  repeated string roles = 3;

  // Authorization permissions
  repeated string permissions = 4;

  // Authorization policies
  repeated string policies = 5;
}

// Encryption
message Encryption {
  // Encryption enabled
  bool enabled = 1;

  // Encryption algorithm
  string algorithm = 2;

  // Encryption key
  string key = 3;

  // Encryption parameters
  google.protobuf.Struct parameters = 4;

  // Encryption at rest
  bool at_rest = 5;

  // Encryption in transit
  bool in_transit = 6;
}

// Audit logging
message AuditLogging {
  // Audit logging enabled
  bool enabled = 1;

  // Audit log level
  string level = 2;

  // Audit log destination
  string destination = 3;

  // Audit log format
  string format = 4;

  // Audit log retention
  int32 retention_days = 5;
}

// Access control
message AccessControl {
  // Access control enabled
  bool enabled = 1;

  // Access control method
  string method = 2;

  // Access control rules
  repeated AccessRule rules = 3;

  // Access control policies
  repeated string policies = 4;
}

// Access rule
message AccessRule {
  // Rule name
  string name = 1;

  // Rule type
  string type = 2;

  // Rule condition
  string condition = 3;

  // Rule action
  string action = 4;

  // Rule priority
  int32 priority = 5;
}

// Compliance
message Compliance {
  // Compliance enabled
  bool enabled = 1;

  // Compliance standards
  repeated string standards = 2;

  // Compliance requirements
  repeated string requirements = 3;

  // Compliance policies
  repeated string policies = 4;

  // Compliance monitoring
  bool monitoring = 5;
}
