syntax = "proto3";

package settings;

// Settings module index - imports and re-exports all submodules for unified access
// This file provides a single entry point for all settings-related functionality

// =============================================================================
// LOCALIZATION MODULE
// =============================================================================

// Re-export localization enums
import "settings/localization/enums/language.proto";
import "settings/localization/enums/region.proto";

// Re-export localization messages
import "settings/localization/messages/localization_request.proto";
import "settings/localization/messages/localization_response.proto";

// Re-export localization services
import "settings/localization/services/localization_service.proto";

// =============================================================================
// SETTINGS MODULE
// =============================================================================

// Re-export settings enums
import "settings/settings/enums/setting_scope.proto";
import "settings/settings/enums/setting_type.proto";

// Re-export settings messages
import "settings/settings/messages/setting_request.proto";
import "settings/settings/messages/setting_response.proto";

// Re-export settings services
import "settings/settings/services/setting_service.proto";

// =============================================================================
// THEMES MODULE
// =============================================================================

// Re-export themes enums
import "settings/themes/enums/theme_mode.proto";
import "settings/themes/enums/theme_color.proto";

// Re-export themes messages
import "settings/themes/messages/theme_request.proto";
import "settings/themes/messages/theme_response.proto";

// Re-export themes services
import "settings/themes/services/theme_service.proto";

// =============================================================================
// PREFERENCES MODULE
// =============================================================================

// Re-export preferences enums
import "settings/preferences/enums/preference_type.proto";

// Re-export preferences messages
import "settings/preferences/messages/preference_request.proto";
import "settings/preferences/messages/preference_response.proto";

// Re-export preferences services
import "settings/preferences/services/preference_service.proto";

// =============================================================================
// FEATURE FLAGS MODULE
// =============================================================================

// Re-export feature-flags enums
import "settings/feature_flags/enums/flag_status.proto";

// Re-export feature-flags messages
import "settings/feature_flags/messages/flag_request.proto";
import "settings/feature_flags/messages/flag_response.proto";

// Re-export feature-flags services
import "settings/feature_flags/services/flag_service.proto";

// =============================================================================
// UNIFIED SETTINGS SERVICE
// =============================================================================

// Optional: Unified service that aggregates all settings operations
// This provides a single service interface for clients that need to work
// with multiple types of settings in a single request

// Example unified request message for multi-module operations
message UnifiedSettingsRequest {
  // Localization operations
  repeated settings.localization.messages.CreateLocalizationRequest localization_requests = 1;
  repeated settings.localization.messages.GetLocalizationRequest localization_gets = 2;

  // Settings operations
  repeated settings.settings.messages.CreateSettingRequest setting_requests = 3;
  repeated settings.settings.messages.GetSettingRequest setting_gets = 4;

  // Theme operations
  repeated settings.themes.messages.CreateThemeRequest theme_requests = 5;
  repeated settings.themes.messages.GetThemeRequest theme_gets = 6;

  // Preference operations
  repeated settings.preferences.messages.CreatePreferenceRequest preference_requests = 7;
  repeated settings.preferences.messages.GetPreferenceRequest preference_gets = 8;

  // Feature flag operations
  repeated settings.feature_flags.messages.CreateFlagRequest flag_requests = 9;
  repeated settings.feature_flags.messages.GetFlagRequest flag_gets = 10;

  // Operation context
  string user_id = 11;
  string session_id = 12;
  map<string, string> context = 13;
}

// Example unified response message for multi-module operations
message UnifiedSettingsResponse {
  // Localization responses
  repeated settings.localization.messages.CreateLocalizationResponse localization_responses = 1;
  repeated settings.localization.messages.GetLocalizationResponse localization_gets = 2;

  // Settings responses
  repeated settings.settings.messages.CreateSettingResponse setting_responses = 3;
  repeated settings.settings.messages.GetSettingResponse setting_gets = 4;

  // Theme responses
  repeated settings.themes.messages.CreateThemeResponse theme_responses = 5;
  repeated settings.themes.messages.GetThemeResponse theme_gets = 6;

  // Preference responses
  repeated settings.preferences.messages.CreatePreferenceResponse preference_responses = 7;
  repeated settings.preferences.messages.GetPreferenceResponse preference_gets = 8;

  // Feature flag responses
  repeated settings.feature_flags.messages.CreateFlagResponse flag_responses = 9;
  repeated settings.feature_flags.messages.GetFlagResponse flag_gets = 10;

  // Overall operation status
  bool success = 11;
  string message = 12;
  repeated string errors = 13;

  // Operation metadata
  string operation_id = 14;
  int64 execution_time_ms = 15;
}

// =============================================================================
// MODULE DOCUMENTATION
// =============================================================================

/*
SETTINGS MODULE OVERVIEW

This settings module provides comprehensive functionality for managing application
settings, user preferences, themes, localization, and feature flags in a
microservices architecture.

MODULE STRUCTURE:

1. LOCALIZATION MODULE
   - Manages internationalization (i18n) and localization (l10n)
   - Supports multiple languages and regions
   - Handles translation keys and values
   - Provides validation and completeness checking

2. SETTINGS MODULE
   - Manages application-wide settings with different scopes
   - Supports various data types and validation rules
   - Provides inheritance and override capabilities
   - Includes audit logging and versioning

3. THEMES MODULE
   - Manages visual themes and styling
   - Supports custom colors, fonts, and visual properties
   - Provides theme validation and accessibility checking
   - Includes theme usage analytics

4. PREFERENCES MODULE
   - Manages user-specific preferences
   - Supports inheritance from organization/team settings
   - Provides validation and schema management
   - Includes preference analytics and insights

5. FEATURE FLAGS MODULE
   - Manages feature toggles and gradual rollouts
   - Supports A/B testing and experimentation
   - Provides real-time evaluation and analytics
   - Includes audit logging and compliance features

USAGE PATTERNS:

1. Single Module Usage:
   - Import specific module files directly
   - Use individual service clients
   - Best for focused functionality

2. Unified Usage:
   - Import this index.proto file
   - Use unified service for cross-module operations
   - Best for complex applications with multiple settings types

3. Microservice Integration:
   - Each module can be deployed as separate microservice
   - Use gRPC for inter-service communication
   - Maintain loose coupling between modules

DEPLOYMENT OPTIONS:

1. Monolithic: All modules in single service
2. Modular: Each module as separate service
3. Hybrid: Group related modules together

CONSIDERATIONS:

- All services support pagination, filtering, and search
- Comprehensive validation and error handling
- Audit logging for compliance and debugging
- Performance optimization with caching strategies
- Security with encryption for sensitive data
- Scalability with horizontal scaling support
*/
