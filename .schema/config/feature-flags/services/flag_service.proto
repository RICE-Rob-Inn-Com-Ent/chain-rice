syntax = "proto3";

package settings.feature_flags.services;

import "google/protobuf/empty.proto";
import "settings/feature_flags/messages/flag_request.proto";
import "settings/feature_flags/messages/flag_response.proto";

// FlagService provides CRUD operations for managing feature flags
// with support for evaluation, rollout management, and analytics.
service FlagService {
  // Create a new feature flag with configuration and rollout settings
  rpc Create(CreateFlagRequest) returns (CreateFlagResponse);

  // Retrieve a specific feature flag by its unique identifier
  rpc Get(GetFlagRequest) returns (GetFlagResponse);

  // Retrieve a feature flag by its name
  rpc GetByName(GetFlagByNameRequest) returns (GetFlagByNameResponse);

  // List feature flags with optional filtering and pagination
  rpc List(ListFlagsRequest) returns (ListFlagsResponse);

  // Update an existing feature flag with new configuration
  rpc Update(UpdateFlagRequest) returns (UpdateFlagResponse);

  // Delete a feature flag by its unique identifier
  rpc Delete(DeleteFlagRequest) returns (DeleteFlagResponse);

  // Bulk create, update, or upsert multiple feature flags
  rpc Bulk(BulkFlagsRequest) returns (BulkFlagsResponse);

  // Search feature flags by name, description, tags, or owner
  rpc Search(SearchFlagsRequest) returns (SearchFlagsResponse);

  // Evaluate a feature flag for a specific user/context
  rpc Evaluate(EvaluateFlagRequest) returns (EvaluateFlagResponse);

  // Bulk evaluate multiple feature flags for a user/context
  rpc BulkEvaluate(BulkEvaluateFlagsRequest) returns (BulkEvaluateFlagsResponse);

  // Set a specific flag value for a user/context
  rpc SetValue(SetFlagValueRequest) returns (SetFlagValueResponse);

  // Get feature flags statistics and analytics
  rpc GetStats(google.protobuf.Empty) returns (FeatureFlagsStats);

  // Get flag audit log for tracking changes
  rpc GetAuditLog(GetFlagAuditLogRequest) returns (GetFlagAuditLogResponse);

  // Export feature flags configuration
  rpc Export(ExportFlagsRequest) returns (ExportFlagsResponse);

  // Import feature flags configuration
  rpc Import(ImportFlagsRequest) returns (ImportFlagsResponse);

  // Toggle flag status (enable/disable)
  rpc Toggle(ToggleFlagRequest) returns (ToggleFlagResponse);

  // Update rollout percentage for gradual rollout
  rpc UpdateRollout(UpdateRolloutRequest) returns (UpdateRolloutResponse);

  // Get flag usage analytics
  rpc GetUsageAnalytics(GetUsageAnalyticsRequest) returns (GetUsageAnalyticsResponse);
}

// Request message for getting flag audit log
message GetFlagAuditLogRequest {
  // Optional flag ID filter
  string flag_id = 1;

  // Optional flag name filter
  string flag_name = 2;

  // Optional user ID filter
  string user_id = 3;

  // Optional action filter: "create", "update", "delete", "evaluate", "set_value"
  string action = 4;

  // Start date for filtering (inclusive)
  string start_date = 5;

  // End date for filtering (exclusive)
  string end_date = 6;

  // Page size for pagination (default: 50, max: 1000)
  int32 page_size = 7;

  // Page token for pagination
  string page_token = 8;
}

// Response message for flag audit log
message GetFlagAuditLogResponse {
  // List of audit log entries
  repeated FlagAuditLog entries = 1;

  // Next page token for pagination
  string next_page_token = 2;

  // Total count of audit log entries
  int32 total_count = 3;

  // Whether there are more pages available
  bool has_more = 4;
}

// Request message for exporting feature flags
message ExportFlagsRequest {
  // Export format: "json", "csv", "yaml", "xml"
  string format = 1;

  // Optional status filter for export
  repeated string statuses = 2;

  // Optional category filter for export
  repeated string categories = 3;

  // Whether to include usage statistics in export
  bool include_usage_stats = 4;

  // Whether to include metadata in export
  bool include_metadata = 5;

  // Whether to include archived flags
  bool include_archived = 6;
}

// Response message for exporting feature flags
message ExportFlagsResponse {
  // Export data in the requested format
  bytes export_data = 1;

  // Content type of the export data
  string content_type = 2;

  // Filename suggestion for the export
  string filename = 3;

  // Number of flags exported
  int32 exported_count = 4;

  // Export completion timestamp
  string exported_at = 5;
}

// Request message for importing feature flags
message ImportFlagsRequest {
  // Import data in various formats
  bytes import_data = 1;

  // Content type of the import data
  string content_type = 2;

  // Import mode: "create_only", "update_only", "upsert", "replace"
  string import_mode = 3;

  // Whether to validate flags before import
  bool validate_before_import = 4;

  // Whether to skip duplicate flags
  bool skip_duplicates = 5;

  // Whether to preserve usage statistics during import
  bool preserve_usage_stats = 6;
}

// Response message for importing feature flags
message ImportFlagsResponse {
  // Number of flags imported successfully
  int32 imported_count = 1;

  // Number of flags skipped (duplicates or validation failures)
  int32 skipped_count = 2;

  // Number of flags that failed import
  int32 failed_count = 3;

  // List of error messages for failed imports
  repeated string errors = 4;

  // Import completion timestamp
  string imported_at = 5;

  // Summary of import operation
  string summary = 6;
}

// Request message for toggling flag status
message ToggleFlagRequest {
  // The unique identifier of the feature flag to toggle
  string flag_id = 1;

  // New status to set (enabled/disabled)
  bool enabled = 2;

  // Optional reason for the toggle
  string reason = 3;

  // Whether to update rollout percentage to 100% (if enabling)
  bool set_full_rollout = 4;
}

// Response message for toggling flag status
message ToggleFlagResponse {
  // The updated feature flag
  FeatureFlag flag = 1;

  // Operation status message
  string message = 2;

  // Previous status
  bool previous_status = 3;
}

// Request message for updating rollout percentage
message UpdateRolloutRequest {
  // The unique identifier of the feature flag to update
  string flag_id = 1;

  // New rollout percentage (0-100)
  double rollout_percentage = 2;

  // Optional reason for the rollout change
  string reason = 3;

  // Whether to enable the flag if rollout percentage > 0
  bool auto_enable = 4;
}

// Response message for updating rollout percentage
message UpdateRolloutResponse {
  // The updated feature flag
  FeatureFlag flag = 1;

  // Operation status message
  string message = 2;

  // Previous rollout percentage
  double previous_rollout_percentage = 3;
}

// Request message for getting usage analytics
message GetUsageAnalyticsRequest {
  // Optional flag ID filter
  string flag_id = 1;

  // Optional flag name filter
  string flag_name = 2;

  // Start date for analytics (inclusive)
  string start_date = 3;

  // End date for analytics (exclusive)
  string end_date = 4;

  // Analytics granularity: "hour", "day", "week", "month"
  string granularity = 5;

  // Whether to include user breakdown
  bool include_user_breakdown = 6;

  // Whether to include geographic breakdown
  bool include_geographic_breakdown = 7;

  // Whether to include device breakdown
  bool include_device_breakdown = 8;
}

// Response message for usage analytics
message GetUsageAnalyticsResponse {
  // Analytics data points over time
  repeated AnalyticsDataPoint data_points = 1;

  // User breakdown statistics
  map<string, int64> user_breakdown = 2;

  // Geographic breakdown statistics
  map<string, int64> geographic_breakdown = 3;

  // Device breakdown statistics
  map<string, int64> device_breakdown = 4;

  // Total evaluations in the period
  int64 total_evaluations = 5;

  // Unique users in the period
  int64 unique_users = 6;

  // Average evaluations per user
  double avg_evaluations_per_user = 7;

  // Analytics generation timestamp
  string generated_at = 8;
}

// Analytics data point
message AnalyticsDataPoint {
  // Timestamp for this data point
  string timestamp = 1;

  // Number of evaluations at this time
  int64 evaluations = 2;

  // Number of positive evaluations at this time
  int64 positive_evaluations = 3;

  // Number of negative evaluations at this time
  int64 negative_evaluations = 4;

  // Success rate at this time
  double success_rate = 5;

  // Unique users at this time
  int64 unique_users = 6;
}
