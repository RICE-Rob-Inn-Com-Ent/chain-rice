syntax = "proto3";

package settings.feature_flags.messages;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "settings/feature-flags/enums/flag_status.proto";

// Request message for creating a new feature flag
message CreateFlagRequest {
  // The feature flag name identifier
  string name = 1;

  // The feature flag display name
  string display_name = 2;

  // The current status of the feature flag
  settings.feature_flags.enums.FlagStatus status = 3;

  // The rollout percentage (0-100) for gradual rollout
  double rollout_percentage = 4;

  // Optional description of what this feature flag controls
  string description = 5;

  // Optional tags for categorization and search
  repeated string tags = 6;

  // Optional category for organizing feature flags
  string category = 7;

  // Optional metadata about the feature flag
  map<string, string> metadata = 8;

  // Optional default value when flag is not explicitly set
  google.protobuf.Value default_value = 9;

  // Optional JSON schema for flag value validation
  google.protobuf.Struct value_schema = 10;

  // Whether this flag affects critical functionality
  bool is_critical = 11;

  // Whether this flag requires immediate deployment
  bool requires_immediate_deployment = 12;

  // Optional owner/team responsible for this flag
  string owner = 13;

  // Optional contact information for flag issues
  string contact = 14;

  // Optional documentation URL
  string documentation_url = 15;

  // Optional JIRA ticket or issue reference
  string issue_reference = 16;

  // Whether this flag is user-facing
  bool is_user_facing = 17;

  // Whether this flag affects performance
  bool affects_performance = 18;

  // Whether this flag affects security
  bool affects_security = 19;

  // Whether this flag affects compliance
  bool affects_compliance = 20;
}

// Request message for retrieving a specific feature flag
message GetFlagRequest {
  // The unique identifier of the feature flag
  string id = 1;

  // Optional: include metadata in response
  bool include_metadata = 2;

  // Optional: include value schema in response
  bool include_value_schema = 3;

  // Optional: include usage statistics in response
  bool include_usage_stats = 4;
}

// Request message for retrieving a feature flag by name
message GetFlagByNameRequest {
  // The feature flag name to retrieve
  string name = 1;

  // Optional: include metadata in response
  bool include_metadata = 2;
}

// Request message for listing feature flags with filtering
message ListFlagsRequest {
  // Optional filter by flag name pattern
  string name_filter = 1;

  // Optional filter by status
  settings.feature_flags.enums.FlagStatus status_filter = 2;

  // Optional filter by category
  string category_filter = 3;

  // Optional filter by tags
  repeated string tag_filters = 4;

  // Optional filter by owner
  string owner_filter = 5;

  // Optional filter by critical flags only
  bool critical_only = 6;

  // Optional filter by user-facing flags only
  bool user_facing_only = 7;

  // Optional filter by flags requiring immediate deployment
  bool immediate_deployment_only = 8;

  // Page size for pagination (default: 50, max: 1000)
  int32 page_size = 9;

  // Page token for pagination
  string page_token = 10;

  // Sort order: "name", "display_name", "status", "rollout_percentage", "created_at", "updated_at"
  string order_by = 11;

  // Sort direction: "asc" or "desc" (default: "asc")
  string sort_direction = 12;
}

// Request message for updating an existing feature flag
message UpdateFlagRequest {
  // The unique identifier of the feature flag to update
  string id = 1;

  // Updated display name
  string display_name = 2;

  // Updated status
  settings.feature_flags.enums.FlagStatus status = 3;

  // Updated rollout percentage
  double rollout_percentage = 4;

  // Updated description
  string description = 5;

  // Updated tags
  repeated string tags = 6;

  // Updated category
  string category = 7;

  // Updated metadata
  map<string, string> metadata = 8;

  // Updated default value
  google.protobuf.Value default_value = 9;

  // Updated value schema
  google.protobuf.Struct value_schema = 10;

  // Updated critical flag status
  bool is_critical = 11;

  // Updated immediate deployment requirement
  bool requires_immediate_deployment = 12;

  // Updated owner
  string owner = 13;

  // Updated contact
  string contact = 14;

  // Updated documentation URL
  string documentation_url = 15;

  // Updated issue reference
  string issue_reference = 16;

  // Field mask to specify which fields to update
  google.protobuf.FieldMask update_mask = 17;
}

// Request message for deleting a feature flag
message DeleteFlagRequest {
  // The unique identifier of the feature flag to delete
  string id = 1;

  // Optional: force deletion even if flag is referenced elsewhere
  bool force = 2;

  // Optional: reason for deletion
  string deletion_reason = 3;
}

// Request message for bulk operations on feature flags
message BulkFlagsRequest {
  // List of feature flags to create/update
  repeated CreateFlagRequest flags = 1;

  // Operation type: "create", "update", or "upsert"
  string operation = 2;
}

// Request message for searching feature flags by content
message SearchFlagsRequest {
  // Search query string
  string query = 1;

  // Optional status filter for search
  settings.feature_flags.enums.FlagStatus status_filter = 2;

  // Optional category filter for search
  string category_filter = 3;

  // Search in: "name", "display_name", "description", "tags", "owner", or "all"
  string search_in = 4;

  // Page size for pagination (default: 50, max: 1000)
  int32 page_size = 5;

  // Page token for pagination
  string page_token = 6;
}

// Request message for evaluating a feature flag for a user/context
message EvaluateFlagRequest {
  // The feature flag name to evaluate
  string flag_name = 1;

  // User ID for evaluation context
  string user_id = 2;

  // Optional session ID
  string session_id = 3;

  // Optional device ID
  string device_id = 4;

  // Optional IP address
  string ip_address = 5;

  // Optional user agent
  string user_agent = 6;

  // Optional custom attributes for evaluation
  map<string, string> attributes = 7;

  // Optional evaluation context
  google.protobuf.Struct context = 8;
}

// Request message for bulk flag evaluation
message BulkEvaluateFlagsRequest {
  // List of flag names to evaluate
  repeated string flag_names = 1;

  // User ID for evaluation context
  string user_id = 2;

  // Optional session ID
  string session_id = 3;

  // Optional device ID
  string device_id = 4;

  // Optional IP address
  string ip_address = 5;

  // Optional user agent
  string user_agent = 6;

  // Optional custom attributes for evaluation
  map<string, string> attributes = 7;

  // Optional evaluation context
  google.protobuf.Struct context = 8;
}

// Request message for setting flag value for a specific user/context
message SetFlagValueRequest {
  // The feature flag name
  string flag_name = 1;

  // User ID to set the value for
  string user_id = 2;

  // The flag value to set
  google.protobuf.Value value = 3;

  // Optional session ID
  string session_id = 4;

  // Optional reason for setting the value
  string reason = 5;

  // Optional expiration time for the value
  string expires_at = 6;
}
