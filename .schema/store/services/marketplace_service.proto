syntax = "proto3";

package commerce.marketplace.services;

import "google/protobuf/empty.proto";
import "../messages/listing.proto";
import "../messages/offer.proto";
import "../messages/review.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/marketplace/services";

// Marketplace service for managing listings, offers, and reviews
service MarketplaceService {
  // Listing Management
  rpc CreateListing(CreateListingRequest) returns (CreateListingResponse);
  rpc GetListing(GetListingRequest) returns (GetListingResponse);
  rpc UpdateListing(UpdateListingRequest) returns (UpdateListingResponse);
  rpc DeleteListing(DeleteListingRequest) returns (google.protobuf.Empty);
  rpc ListListings(ListListingsRequest) returns (ListListingsResponse);
  rpc SearchListings(SearchListingsRequest) returns (SearchListingsResponse);

  // Offer Management
  rpc CreateOffer(CreateOfferRequest) returns (CreateOfferResponse);
  rpc GetOffer(GetOfferRequest) returns (GetOfferResponse);
  rpc UpdateOffer(UpdateOfferRequest) returns (UpdateOfferResponse);
  rpc DeleteOffer(DeleteOfferRequest) returns (google.protobuf.Empty);
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
  rpc RespondToOffer(RespondToOfferRequest) returns (RespondToOfferResponse);

  // Review Management
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse);
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse);
  rpc UpdateReview(UpdateReviewRequest) returns (UpdateReviewResponse);
  rpc DeleteReview(DeleteReviewRequest) returns (google.protobuf.Empty);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc VoteReview(VoteReviewRequest) returns (VoteReviewResponse);

  // Analytics and Reporting
  rpc GetListingAnalytics(GetListingAnalyticsRequest) returns (GetListingAnalyticsResponse);
  rpc GetSellerAnalytics(GetSellerAnalyticsRequest) returns (GetSellerAnalyticsResponse);
}

// Listing Request/Response Messages
message CreateListingRequest {
  commerce.marketplace.messages.Listing listing = 1;
}

message CreateListingResponse {
  commerce.marketplace.messages.Listing listing = 1;
  bool success = 2;
  string error_message = 3;
}

message GetListingRequest {
  string id = 1;
}

message GetListingResponse {
  commerce.marketplace.messages.Listing listing = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdateListingRequest {
  string id = 1;
  commerce.marketplace.messages.Listing listing = 2;
}

message UpdateListingResponse {
  commerce.marketplace.messages.Listing listing = 1;
  bool success = 2;
  string error_message = 3;
}

message DeleteListingRequest {
  string id = 1;
}

message ListListingsRequest {
  string seller_id = 1;
  string category = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListListingsResponse {
  repeated commerce.marketplace.messages.Listing listings = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchListingsRequest {
  string query = 1;
  string category = 2;
  double min_price = 3;
  double max_price = 4;
  string location = 5;
  string sort_by = 6;
  string sort_order = 7;
  int32 page_size = 8;
  string page_token = 9;
}

message SearchListingsResponse {
  repeated commerce.marketplace.messages.Listing listings = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Offer Request/Response Messages
message CreateOfferRequest {
  commerce.marketplace.messages.CreateOfferRequest offer = 1;
}

message CreateOfferResponse {
  commerce.marketplace.messages.Offer offer = 1;
  bool success = 2;
  string error_message = 3;
}

message GetOfferRequest {
  string id = 1;
}

message GetOfferResponse {
  commerce.marketplace.messages.Offer offer = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdateOfferRequest {
  string id = 1;
  commerce.marketplace.messages.Offer offer = 2;
}

message UpdateOfferResponse {
  commerce.marketplace.messages.Offer offer = 1;
  bool success = 2;
  string error_message = 3;
}

message DeleteOfferRequest {
  string id = 1;
}

message ListOffersRequest {
  string listing_id = 1;
  string buyer_id = 2;
  string seller_id = 3;
  string status = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListOffersResponse {
  repeated commerce.marketplace.messages.Offer offers = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message RespondToOfferRequest {
  commerce.marketplace.messages.RespondToOfferRequest response = 1;
}

message RespondToOfferResponse {
  commerce.marketplace.messages.Offer offer = 1;
  bool success = 2;
  string error_message = 3;
}

// Review Request/Response Messages
message CreateReviewRequest {
  commerce.marketplace.messages.CreateReviewRequest review = 1;
}

message CreateReviewResponse {
  commerce.marketplace.messages.Review review = 1;
  bool success = 2;
  string error_message = 3;
}

message GetReviewRequest {
  string id = 1;
}

message GetReviewResponse {
  commerce.marketplace.messages.Review review = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdateReviewRequest {
  string id = 1;
  commerce.marketplace.messages.Review review = 2;
}

message UpdateReviewResponse {
  commerce.marketplace.messages.Review review = 1;
  bool success = 2;
  string error_message = 3;
}

message DeleteReviewRequest {
  string id = 1;
}

message ListReviewsRequest {
  string product_id = 1;
  string seller_id = 2;
  string reviewer_id = 3;
  string status = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListReviewsResponse {
  repeated commerce.marketplace.messages.Review reviews = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message VoteReviewRequest {
  commerce.marketplace.messages.VoteReviewRequest vote = 1;
}

message VoteReviewResponse {
  commerce.marketplace.messages.Review review = 1;
  bool success = 2;
  string error_message = 3;
}

// Analytics Request/Response Messages
message GetListingAnalyticsRequest {
  string listing_id = 1;
  string period = 2; // daily, weekly, monthly, yearly
}

message GetListingAnalyticsResponse {
  ListingAnalytics analytics = 1;
  bool success = 2;
  string error_message = 3;
}

message GetSellerAnalyticsRequest {
  string seller_id = 1;
  string period = 2; // daily, weekly, monthly, yearly
}

message GetSellerAnalyticsResponse {
  SellerAnalytics analytics = 1;
  bool success = 2;
  string error_message = 3;
}

message ListingAnalytics {
  string listing_id = 1;
  int32 total_views = 2;
  int32 total_likes = 3;
  int32 total_shares = 4;
  int32 total_offers = 5;
  int32 total_sales = 6;
  double conversion_rate = 7;
  double average_rating = 8;
  int32 total_reviews = 9;
  string period = 10;
}

message SellerAnalytics {
  string seller_id = 1;
  int32 total_listings = 2;
  int32 active_listings = 3;
  int32 total_sales = 4;
  double total_revenue = 5;
  double average_rating = 6;
  int32 total_reviews = 7;
  int32 total_offers = 8;
  double offer_acceptance_rate = 9;
  string period = 10;
}
