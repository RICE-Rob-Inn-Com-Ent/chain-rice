syntax = "proto3";

package commerce.pricing.services;

import "google/protobuf/empty.proto";
import "../messages/price.proto";
import "../messages/discount.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/pricing/services";

// Pricing service for managing prices and discounts
service PricingService {
  // Price Management
  rpc CreatePrice(CreatePriceRequest) returns (CreatePriceResponse);
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);
  rpc UpdatePrice(UpdatePriceRequest) returns (UpdatePriceResponse);
  rpc DeletePrice(DeletePriceRequest) returns (google.protobuf.Empty);
  rpc ListPrices(ListPricesRequest) returns (ListPricesResponse);

  // Discount Management
  rpc CreateDiscount(CreateDiscountRequest) returns (CreateDiscountResponse);
  rpc GetDiscount(GetDiscountRequest) returns (GetDiscountResponse);
  rpc UpdateDiscount(UpdateDiscountRequest) returns (UpdateDiscountResponse);
  rpc DeleteDiscount(DeleteDiscountRequest) returns (google.protobuf.Empty);
  rpc ListDiscounts(ListDiscountsRequest) returns (ListDiscountsResponse);

  // Pricing Operations
  rpc CalculatePrice(CalculatePriceRequest) returns (CalculatePriceResponse);
  rpc ApplyDiscount(ApplyDiscountRequest) returns (ApplyDiscountResponse);
  rpc ValidateDiscount(ValidateDiscountRequest) returns (ValidateDiscountResponse);
  rpc GetProductPrice(GetProductPriceRequest) returns (GetProductPriceResponse);
  rpc GetBulkPrices(GetBulkPricesRequest) returns (GetBulkPricesResponse);

  // Discount Operations
  rpc CheckDiscountEligibility(CheckDiscountEligibilityRequest) returns (CheckDiscountEligibilityResponse);
  rpc GetDiscountUsage(GetDiscountUsageRequest) returns (GetDiscountUsageResponse);
  rpc UpdateDiscountUsage(UpdateDiscountUsageRequest) returns (UpdateDiscountUsageResponse);
}

// Price Request/Response Messages
message CreatePriceRequest {
  commerce.pricing.messages.CreatePriceRequest price = 1;
}

message CreatePriceResponse {
  commerce.pricing.messages.Price price = 1;
  bool success = 2;
  string error_message = 3;
}

message GetPriceRequest {
  string id = 1;
}

message GetPriceResponse {
  commerce.pricing.messages.Price price = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdatePriceRequest {
  string id = 1;
  commerce.pricing.messages.UpdatePriceRequest price = 2;
}

message UpdatePriceResponse {
  commerce.pricing.messages.Price price = 1;
  bool success = 2;
  string error_message = 3;
}

message DeletePriceRequest {
  string id = 1;
}

message ListPricesRequest {
  string product_id = 1;
  string product_variant_id = 2;
  string price_type = 3;
  string region = 4;
  string customer_segment = 5;
  string channel = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message ListPricesResponse {
  repeated commerce.pricing.messages.Price prices = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Discount Request/Response Messages
message CreateDiscountRequest {
  commerce.pricing.messages.CreateDiscountRequest discount = 1;
}

message CreateDiscountResponse {
  commerce.pricing.messages.Discount discount = 1;
  bool success = 2;
  string error_message = 3;
}

message GetDiscountRequest {
  string id = 1;
}

message GetDiscountResponse {
  commerce.pricing.messages.Discount discount = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdateDiscountRequest {
  string id = 1;
  commerce.pricing.messages.Discount discount = 2;
}

message UpdateDiscountResponse {
  commerce.pricing.messages.Discount discount = 1;
  bool success = 2;
  string error_message = 3;
}

message DeleteDiscountRequest {
  string id = 1;
}

message ListDiscountsRequest {
  string discount_code = 1;
  string discount_type = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListDiscountsResponse {
  repeated commerce.pricing.messages.Discount discounts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Pricing Operations Request/Response Messages
message CalculatePriceRequest {
  string product_id = 1;
  string product_variant_id = 2;
  int32 quantity = 3;
  string customer_id = 4;
  string region = 5;
  string channel = 6;
  string currency = 7;
  repeated string applied_discounts = 8;
}

message CalculatePriceResponse {
  PriceCalculation calculation = 1;
  bool success = 2;
  string error_message = 3;
}

message ApplyDiscountRequest {
  commerce.pricing.messages.ApplyDiscountRequest discount_request = 1;
}

message ApplyDiscountResponse {
  commerce.pricing.messages.Discount discount = 1;
  double discount_amount = 2;
  bool success = 3;
  string error_message = 4;
}

message ValidateDiscountRequest {
  string discount_code = 1;
  string customer_id = 2;
  string order_id = 3;
  repeated commerce.pricing.messages.OrderItem order_items = 4;
  double order_total = 5;
  string currency = 6;
}

message ValidateDiscountResponse {
  bool is_valid = 1;
  string error_message = 2;
  commerce.pricing.messages.Discount discount = 3;
}

message GetProductPriceRequest {
  string product_id = 1;
  string product_variant_id = 2;
  int32 quantity = 3;
  string customer_id = 4;
  string region = 5;
  string channel = 6;
  string currency = 7;
}

message GetProductPriceResponse {
  commerce.pricing.messages.Price price = 1;
  double calculated_price = 2;
  bool success = 3;
  string error_message = 4;
}

message GetBulkPricesRequest {
  repeated ProductPriceRequest product_requests = 1;
  string customer_id = 2;
  string region = 3;
  string channel = 4;
  string currency = 5;
}

message GetBulkPricesResponse {
  repeated ProductPriceResponse product_prices = 1;
  bool success = 2;
  string error_message = 3;
}

message ProductPriceRequest {
  string product_id = 1;
  string product_variant_id = 2;
  int32 quantity = 3;
}

message ProductPriceResponse {
  string product_id = 1;
  string product_variant_id = 2;
  int32 quantity = 3;
  commerce.pricing.messages.Price price = 4;
  double calculated_price = 5;
}

// Discount Operations Request/Response Messages
message CheckDiscountEligibilityRequest {
  string discount_code = 1;
  string customer_id = 2;
  string order_id = 3;
  repeated commerce.pricing.messages.OrderItem order_items = 4;
  double order_total = 5;
  string currency = 6;
}

message CheckDiscountEligibilityResponse {
  bool is_eligible = 1;
  string error_message = 2;
  commerce.pricing.messages.Discount discount = 3;
}

message GetDiscountUsageRequest {
  string discount_id = 1;
  string customer_id = 2;
}

message GetDiscountUsageResponse {
  DiscountUsage usage = 1;
  bool success = 2;
  string error_message = 3;
}

message UpdateDiscountUsageRequest {
  string discount_id = 1;
  string customer_id = 2;
  string order_id = 3;
  int32 usage_count = 4;
}

message UpdateDiscountUsageResponse {
  bool success = 1;
  string error_message = 2;
}

// Price calculation result
message PriceCalculation {
  string product_id = 1;
  string product_variant_id = 2;
  int32 quantity = 3;
  double base_price = 4;
  double unit_price = 5;
  double total_price = 6;
  string currency = 7;
  repeated AppliedDiscount applied_discounts = 8;
  double final_price = 9;
  double total_discount = 10;
}

// Applied discount information
message AppliedDiscount {
  string discount_id = 1;
  string discount_code = 2;
  double discount_amount = 3;
  string discount_type = 4;
}

// Discount usage information
message DiscountUsage {
  string discount_id = 1;
  string customer_id = 2;
  int32 usage_count = 3;
  int32 usage_limit = 4;
  int32 remaining_uses = 5;
  repeated string used_order_ids = 6;
}
