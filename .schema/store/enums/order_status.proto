syntax = "proto3";

package commerce.orders.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/orders/enums";

// Order status enumeration
enum OrderStatus {
  // Unknown or unspecified order status
  ORDER_STATUS_UNSPECIFIED = 0;

  // Order is being created/drafted
  ORDER_STATUS_DRAFT = 1;

  // Order is pending payment
  ORDER_STATUS_PENDING_PAYMENT = 2;

  // Order payment is processing
  ORDER_STATUS_PAYMENT_PROCESSING = 3;

  // Order payment is confirmed
  ORDER_STATUS_PAYMENT_CONFIRMED = 4;

  // Order is being prepared
  ORDER_STATUS_PREPARING = 5;

  // Order is ready for shipment
  ORDER_STATUS_READY_TO_SHIP = 6;

  // Order has been shipped
  ORDER_STATUS_SHIPPED = 7;

  // Order is in transit
  ORDER_STATUS_IN_TRANSIT = 8;

  // Order is out for delivery
  ORDER_STATUS_OUT_FOR_DELIVERY = 9;

  // Order has been delivered
  ORDER_STATUS_DELIVERED = 10;

  // Order is completed
  ORDER_STATUS_COMPLETED = 11;

  // Order has been cancelled
  ORDER_STATUS_CANCELLED = 12;

  // Order is on hold
  ORDER_STATUS_ON_HOLD = 13;

  // Order is being refunded
  ORDER_STATUS_REFUNDING = 14;

  // Order has been refunded
  ORDER_STATUS_REFUNDED = 15;

  // Order is being returned
  ORDER_STATUS_RETURNING = 16;

  // Order has been returned
  ORDER_STATUS_RETURNED = 17;

  // Order failed to process
  ORDER_STATUS_FAILED = 18;

  // Order is expired
  ORDER_STATUS_EXPIRED = 19;
}
