syntax = "proto3";

package commerce.pricing.messages;

import "google/protobuf/timestamp.proto";
import "../enums/discount_type.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/pricing/messages";

// Discount message representing a discount rule or coupon
message Discount {
  // Unique identifier for the discount
  string id = 1;

  // Discount code
  string discount_code = 2;

  // Discount name
  string name = 3;

  // Discount description
  string description = 4;

  // Discount type
  commerce.pricing.enums.DiscountType discount_type = 5;

  // Discount value (amount or percentage)
  double discount_value = 6;

  // Currency code (ISO 4217) for fixed amount discounts
  string currency = 7;

  // Minimum order amount required
  double minimum_order_amount = 8;

  // Maximum discount amount
  double maximum_discount_amount = 9;

  // Minimum quantity required
  int32 minimum_quantity = 10;

  // Maximum quantity allowed
  int32 maximum_quantity = 11;

  // Applicable products
  repeated string product_ids = 12;

  // Applicable categories
  repeated string category_ids = 13;

  // Applicable customer segments
  repeated string customer_segments = 14;

  // Usage limit per customer
  int32 usage_limit_per_customer = 15;

  // Total usage limit
  int32 total_usage_limit = 16;

  // Current usage count
  int32 current_usage_count = 17;

  // Usage count per customer
  map<string, int32> usage_count_per_customer = 18;

  // Effective start date
  google.protobuf.Timestamp effective_from = 19;

  // Effective end date
  google.protobuf.Timestamp effective_to = 20;

  // Date when discount was created
  google.protobuf.Timestamp created_at = 21;

  // Date when discount was last updated
  google.protobuf.Timestamp updated_at = 22;

  // Whether this discount is active
  bool is_active = 23;

  // Whether this discount is stackable with other discounts
  bool is_stackable = 24;

  // Whether this discount is combinable with other discounts
  bool is_combinable = 25;

  // Discount conditions
  repeated DiscountCondition conditions = 26;

  // Additional metadata
  map<string, string> metadata = 27;
}

// Discount condition for complex discount rules
message DiscountCondition {
  // Condition identifier
  string condition_id = 1;

  // Condition type (product, category, customer, order, etc.)
  string condition_type = 2;

  // Condition operator (equals, greater_than, less_than, in, not_in, etc.)
  string operator = 3;

  // Condition value
  string value = 4;

  // Condition description
  string description = 5;

  // Whether this condition is required
  bool is_required = 6;
}

// Request message for creating a discount
message CreateDiscountRequest {
  // Discount code
  string discount_code = 1;

  // Discount name
  string name = 2;

  // Discount description
  string description = 3;

  // Discount type
  commerce.pricing.enums.DiscountType discount_type = 4;

  // Discount value
  double discount_value = 5;

  // Currency code
  string currency = 6;

  // Minimum order amount
  double minimum_order_amount = 7;

  // Maximum discount amount
  double maximum_discount_amount = 8;

  // Minimum quantity
  int32 minimum_quantity = 9;

  // Maximum quantity
  int32 maximum_quantity = 10;

  // Applicable products
  repeated string product_ids = 11;

  // Applicable categories
  repeated string category_ids = 12;

  // Applicable customer segments
  repeated string customer_segments = 13;

  // Usage limit per customer
  int32 usage_limit_per_customer = 14;

  // Total usage limit
  int32 total_usage_limit = 15;

  // Effective start date
  google.protobuf.Timestamp effective_from = 16;

  // Effective end date
  google.protobuf.Timestamp effective_to = 17;

  // Whether this discount is stackable
  bool is_stackable = 18;

  // Whether this discount is combinable
  bool is_combinable = 19;

  // Discount conditions
  repeated DiscountCondition conditions = 20;
}

// Response message for discount creation
message CreateDiscountResponse {
  // Created discount
  Discount discount = 1;

  // Success indicator
  bool success = 2;

  // Error message if any
  string error_message = 3;
}

// Request message for applying a discount
message ApplyDiscountRequest {
  // Discount code
  string discount_code = 1;

  // Order identifier
  string order_id = 2;

  // Customer identifier
  string customer_id = 3;

  // Order items
  repeated OrderItem order_items = 4;

  // Order total
  double order_total = 5;

  // Currency code
  string currency = 6;
}

// Response message for discount application
message ApplyDiscountResponse {
  // Applied discount
  Discount discount = 1;

  // Discount amount applied
  double discount_amount = 2;

  // Success indicator
  bool success = 3;

  // Error message if any
  string error_message = 4;
}

// Order item for discount calculation
message OrderItem {
  // Product identifier
  string product_id = 1;

  // Product variant identifier
  string product_variant_id = 2;

  // Category identifier
  string category_id = 3;

  // Quantity
  int32 quantity = 4;

  // Unit price
  double unit_price = 5;

  // Total price
  double total_price = 6;
}
