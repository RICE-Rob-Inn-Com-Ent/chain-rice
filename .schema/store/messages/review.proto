syntax = "proto3";

package commerce.marketplace.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/marketplace/messages";

// Review message representing a product or seller review
message Review {
  // Unique identifier for the review
  string id = 1;

  // Order identifier (if review is for an order)
  string order_id = 2;

  // Listing identifier (if review is for a product)
  string listing_id = 3;

  // Product identifier
  string product_id = 4;

  // Seller identifier
  string seller_id = 5;

  // Reviewer identifier (buyer)
  string reviewer_id = 6;

  // Overall rating (1-5 stars)
  int32 overall_rating = 7;

  // Detailed ratings
  RatingBreakdown rating_breakdown = 8;

  // Review title
  string title = 9;

  // Review content
  string content = 10;

  // Review status
  string status = 11;

  // Review type (product, seller, service, etc.)
  string review_type = 12;

  // Whether review is verified purchase
  bool verified_purchase = 13;

  // Whether review is anonymous
  bool anonymous = 14;

  // Review images
  repeated string image_urls = 15;

  // Date when review was created
  google.protobuf.Timestamp created_at = 16;

  // Date when review was last updated
  google.protobuf.Timestamp updated_at = 17;

  // Date when review was published
  google.protobuf.Timestamp published_at = 18;

  // Helpful votes count
  int32 helpful_votes = 19;

  // Total votes count
  int32 total_votes = 20;

  // Seller response to the review
  ReviewResponse seller_response = 21;

  // Additional metadata
  map<string, string> metadata = 22;

  // Review tags
  repeated string tags = 23;
}

// Detailed rating breakdown
message RatingBreakdown {
  // Product quality rating
  int32 product_quality = 1;

  // Value for money rating
  int32 value_for_money = 2;

  // Shipping speed rating
  int32 shipping_speed = 3;

  // Packaging rating
  int32 packaging = 4;

  // Customer service rating
  int32 customer_service = 5;

  // Communication rating
  int32 communication = 6;

  // Accuracy of description rating
  int32 description_accuracy = 7;

  // Ease of use rating
  int32 ease_of_use = 8;
}

// Seller response to a review
message ReviewResponse {
  // Response content
  string content = 1;

  // Response author identifier
  string author_id = 2;

  // Date when response was created
  google.protobuf.Timestamp created_at = 3;

  // Date when response was last updated
  google.protobuf.Timestamp updated_at = 4;
}

// Request message for creating a review
message CreateReviewRequest {
  // Order identifier
  string order_id = 1;

  // Listing identifier
  string listing_id = 2;

  // Product identifier
  string product_id = 3;

  // Seller identifier
  string seller_id = 4;

  // Reviewer identifier
  string reviewer_id = 5;

  // Overall rating
  int32 overall_rating = 6;

  // Rating breakdown
  RatingBreakdown rating_breakdown = 7;

  // Review title
  string title = 8;

  // Review content
  string content = 9;

  // Review type
  string review_type = 10;

  // Review images
  repeated string image_urls = 11;

  // Review tags
  repeated string tags = 12;
}

// Response message for review creation
message CreateReviewResponse {
  // Created review
  Review review = 1;

  // Success indicator
  bool success = 2;

  // Error message if any
  string error_message = 3;
}

// Request message for voting on a review
message VoteReviewRequest {
  // Review identifier
  string review_id = 1;

  // Voter identifier
  string voter_id = 2;

  // Vote type (helpful, not_helpful)
  string vote_type = 3;
}

// Response message for review voting
message VoteReviewResponse {
  // Success indicator
  bool success = 1;

  // Error message if any
  string error_message = 2;

  // Updated vote counts
  int32 helpful_votes = 3;
  int32 total_votes = 4;
}
