syntax = "proto3";

package commerce.pricing.messages;

import "google/protobuf/timestamp.proto";
import "../enums/price_type.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/commerce/pricing/messages";

// Price message representing a product price
message Price {
  // Unique identifier for the price
  string id = 1;

  // Product identifier
  string product_id = 2;

  // Product variant identifier (if applicable)
  string product_variant_id = 3;

  // Price type
  commerce.pricing.enums.PriceType price_type = 4;

  // Price amount
  double amount = 5;

  // Currency code (ISO 4217)
  string currency = 6;

  // Price per unit
  double price_per_unit = 7;

  // Unit of measurement
  string unit = 8;

  // Minimum quantity for this price
  int32 minimum_quantity = 9;

  // Maximum quantity for this price
  int32 maximum_quantity = 10;

  // Price tier information
  PriceTier tier = 11;

  // Geographic region for this price
  string region = 12;

  // Customer segment for this price
  string customer_segment = 13;

  // Channel for this price (online, retail, wholesale, etc.)
  string channel = 14;

  // Effective start date
  google.protobuf.Timestamp effective_from = 15;

  // Effective end date
  google.protobuf.Timestamp effective_to = 16;

  // Date when price was created
  google.protobuf.Timestamp created_at = 17;

  // Date when price was last updated
  google.protobuf.Timestamp updated_at = 18;

  // Whether this price is active
  bool is_active = 19;

  // Price notes
  string notes = 20;

  // Additional metadata
  map<string, string> metadata = 21;
}

// Price tier information for quantity-based pricing
message PriceTier {
  // Tier identifier
  string tier_id = 1;

  // Tier name
  string tier_name = 2;

  // Minimum quantity for this tier
  int32 min_quantity = 3;

  // Maximum quantity for this tier
  int32 max_quantity = 4;

  // Price for this tier
  double tier_price = 5;

  // Price per unit for this tier
  double tier_price_per_unit = 6;

  // Tier description
  string description = 7;
}

// Request message for creating a price
message CreatePriceRequest {
  // Product identifier
  string product_id = 1;

  // Product variant identifier (if applicable)
  string product_variant_id = 2;

  // Price type
  commerce.pricing.enums.PriceType price_type = 3;

  // Price amount
  double amount = 4;

  // Currency code
  string currency = 5;

  // Price per unit
  double price_per_unit = 6;

  // Unit of measurement
  string unit = 7;

  // Minimum quantity
  int32 minimum_quantity = 8;

  // Maximum quantity
  int32 maximum_quantity = 9;

  // Price tier information
  PriceTier tier = 10;

  // Geographic region
  string region = 11;

  // Customer segment
  string customer_segment = 12;

  // Channel
  string channel = 13;

  // Effective start date
  google.protobuf.Timestamp effective_from = 14;

  // Effective end date
  google.protobuf.Timestamp effective_to = 15;

  // Price notes
  string notes = 16;
}

// Response message for price creation
message CreatePriceResponse {
  // Created price
  Price price = 1;

  // Success indicator
  bool success = 2;

  // Error message if any
  string error_message = 3;
}

// Request message for updating a price
message UpdatePriceRequest {
  // Price identifier
  string id = 1;

  // Updated price information
  Price price = 2;
}

// Response message for price update
message UpdatePriceResponse {
  // Updated price
  Price price = 1;

  // Success indicator
  bool success = 2;

  // Error message if any
  string error_message = 3;
}
