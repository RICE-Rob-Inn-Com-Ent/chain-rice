syntax = "proto3";

package marketing.seo.messages;

import "google/protobuf/timestamp.proto";
import "marketing/seo/enums/seo_metric.proto";

// Request message for creating SEO data
message CreateSeoRequest {
  // SEO report name
  string name = 1;

  // Website URL
  string website_url = 2;

  // SEO metrics data
  repeated SeoMetricData metrics = 3;

  // Report date
  google.protobuf.Timestamp report_date = 4;

  // Report description
  string description = 5;

  // Campaign ID (if applicable)
  string campaign_id = 6;

  // Report tags
  repeated string tags = 7;
}

// SEO metric data
message SeoMetricData {
  // Metric type
  marketing.seo.enums.SeoMetric metric = 1;

  // Metric value
  double value = 2;

  // Metric unit
  string unit = 3;

  // Metric description
  string description = 4;

  // Previous value for comparison
  double previous_value = 5;

  // Change percentage
  double change_percentage = 6;
}

// Request message for getting SEO data by ID
message GetSeoRequest {
  // SEO report ID
  string id = 1;
}

// Request message for listing SEO data
message ListSeoRequest {
  // Page number for pagination
  int32 page = 1;

  // Number of items per page
  int32 page_size = 2;

  // Filter by website URL
  string website_url = 3;

  // Filter by campaign ID
  string campaign_id = 4;

  // Filter by tags
  repeated string tags = 5;

  // Filter by date range - start
  google.protobuf.Timestamp start_date = 6;

  // Filter by date range - end
  google.protobuf.Timestamp end_date = 7;
}

// Request message for updating SEO data
message UpdateSeoRequest {
  // SEO report ID
  string id = 1;

  // SEO report name
  string name = 2;

  // Website URL
  string website_url = 3;

  // SEO metrics data
  repeated SeoMetricData metrics = 4;

  // Report date
  google.protobuf.Timestamp report_date = 5;

  // Report description
  string description = 6;

  // Report tags
  repeated string tags = 7;
}

// Request message for deleting SEO data
message DeleteSeoRequest {
  // SEO report ID
  string id = 1;
}
