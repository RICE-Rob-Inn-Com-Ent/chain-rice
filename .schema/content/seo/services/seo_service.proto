syntax = "proto3";

package marketing.seo.services;

import "marketing/seo/messages/seo_request.proto";
import "marketing/seo/messages/seo_response.proto";

// SEO service for managing search engine optimization data
service SeoService {
  // Create new SEO data
  rpc CreateSeo(marketing.seo.messages.CreateSeoRequest) returns (marketing.seo.messages.CreateSeoResponse);

  // Get SEO data by ID
  rpc GetSeo(marketing.seo.messages.GetSeoRequest) returns (marketing.seo.messages.GetSeoResponse);

  // List SEO data with pagination and filtering
  rpc ListSeo(marketing.seo.messages.ListSeoRequest) returns (marketing.seo.messages.ListSeoResponse);

  // Update existing SEO data
  rpc UpdateSeo(marketing.seo.messages.UpdateSeoRequest) returns (marketing.seo.messages.UpdateSeoResponse);

  // Delete SEO data
  rpc DeleteSeo(marketing.seo.messages.DeleteSeoRequest) returns (marketing.seo.messages.DeleteSeoResponse);
}
