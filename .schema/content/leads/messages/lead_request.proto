syntax = "proto3";

package marketing.leads.messages;

import "google/protobuf/timestamp.proto";
import "marketing/leads/enums/lead_status.proto";

// Request message for creating a new lead
message CreateLeadRequest {
  // Lead first name
  string first_name = 1;

  // Lead last name
  string last_name = 2;

  // Lead email
  string email = 3;

  // Lead phone
  string phone = 4;

  // Lead company
  string company = 5;

  // Lead job title
  string job_title = 6;

  // Lead source
  string source = 7;

  // Lead status
  marketing.leads.enums.LeadStatus status = 8;

  // Lead score
  int32 score = 9;

  // Lead notes
  string notes = 10;

  // Campaign ID (if applicable)
  string campaign_id = 11;

  // Lead tags
  repeated string tags = 12;

  // Lead location
  string location = 13;
}

// Request message for getting a lead by ID
message GetLeadRequest {
  // Lead ID
  string id = 1;
}

// Request message for listing leads
message ListLeadRequest {
  // Page number for pagination
  int32 page = 1;

  // Number of items per page
  int32 page_size = 2;

  // Filter by status
  marketing.leads.enums.LeadStatus status = 3;

  // Filter by source
  string source = 4;

  // Filter by campaign ID
  string campaign_id = 5;

  // Filter by tags
  repeated string tags = 6;

  // Filter by company
  string company = 7;

  // Filter by minimum score
  int32 min_score = 8;

  // Filter by maximum score
  int32 max_score = 9;
}

// Request message for updating a lead
message UpdateLeadRequest {
  // Lead ID
  string id = 1;

  // Lead first name
  string first_name = 2;

  // Lead last name
  string last_name = 3;

  // Lead email
  string email = 4;

  // Lead phone
  string phone = 5;

  // Lead company
  string company = 6;

  // Lead job title
  string job_title = 7;

  // Lead source
  string source = 8;

  // Lead status
  marketing.leads.enums.LeadStatus status = 9;

  // Lead score
  int32 score = 10;

  // Lead notes
  string notes = 11;

  // Lead tags
  repeated string tags = 12;

  // Lead location
  string location = 13;
}

// Request message for deleting a lead
message DeleteLeadRequest {
  // Lead ID
  string id = 1;
}
