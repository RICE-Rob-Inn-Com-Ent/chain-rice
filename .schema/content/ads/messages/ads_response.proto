syntax = "proto3";

package marketing.ads.messages;

import "google/protobuf/timestamp.proto";
import "marketing/ads/enums/ads_status.proto";

// Advertisement data transfer object
message Ads {
  // Advertisement ID
  string id = 1;

  // Advertisement name
  string name = 2;

  // Advertisement description
  string description = 3;

  // Target audience
  string target_audience = 4;

  // Budget allocated for the advertisement
  double budget = 5;

  // Campaign ID this advertisement belongs to
  string campaign_id = 6;

  // Advertisement content
  string content = 7;

  // Advertisement status
  marketing.ads.enums.AdsStatus status = 8;

  // Start date for the advertisement
  google.protobuf.Timestamp start_date = 9;

  // End date for the advertisement
  google.protobuf.Timestamp end_date = 10;

  // Creation timestamp
  google.protobuf.Timestamp created_at = 11;

  // Last update timestamp
  google.protobuf.Timestamp updated_at = 12;

  // Advertisement metrics
  AdsMetrics metrics = 13;
}

// Advertisement metrics
message AdsMetrics {
  // Number of impressions
  int64 impressions = 1;

  // Number of clicks
  int64 clicks = 2;

  // Click-through rate
  double ctr = 3;

  // Cost per click
  double cpc = 4;

  // Cost per impression
  double cpm = 5;

  // Total spend
  double total_spend = 6;
}

// Response message for creating an advertisement
message CreateAdsResponse {
  // Created advertisement
  Ads ads = 1;

  // Success message
  string message = 2;
}

// Response message for getting an advertisement
message GetAdsResponse {
  // Advertisement data
  Ads ads = 1;
}

// Response message for listing advertisements
message ListAdsResponse {
  // List of advertisements
  repeated Ads ads = 1;

  // Total count of advertisements
  int32 total_count = 2;

  // Current page number
  int32 page = 3;

  // Number of items per page
  int32 page_size = 4;
}

// Response message for updating an advertisement
message UpdateAdsResponse {
  // Updated advertisement
  Ads ads = 1;

  // Success message
  string message = 2;
}

// Response message for deleting an advertisement
message DeleteAdsResponse {
  // Success message
  string message = 1;
}
