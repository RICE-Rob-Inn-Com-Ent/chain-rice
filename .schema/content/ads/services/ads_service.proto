syntax = "proto3";

package marketing.ads.services;

import "marketing/ads/messages/ads_request.proto";
import "marketing/ads/messages/ads_response.proto";

// Advertisement service for managing advertisements
service AdsService {
  // Create a new advertisement
  rpc CreateAds(marketing.ads.messages.CreateAdsRequest) returns (marketing.ads.messages.CreateAdsResponse);

  // Get an advertisement by ID
  rpc GetAds(marketing.ads.messages.GetAdsRequest) returns (marketing.ads.messages.GetAdsResponse);

  // List advertisements with pagination and filtering
  rpc ListAds(marketing.ads.messages.ListAdsRequest) returns (marketing.ads.messages.ListAdsResponse);

  // Update an existing advertisement
  rpc UpdateAds(marketing.ads.messages.UpdateAdsRequest) returns (marketing.ads.messages.UpdateAdsResponse);

  // Delete an advertisement
  rpc DeleteAds(marketing.ads.messages.DeleteAdsRequest) returns (marketing.ads.messages.DeleteAdsResponse);
}
