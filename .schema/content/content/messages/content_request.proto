syntax = "proto3";

package marketing.content.messages;

import "google/protobuf/timestamp.proto";
import "marketing/content/enums/content_type.proto";

// Request message for creating new content
message CreateContentRequest {
  // Content title
  string title = 1;

  // Content description
  string description = 2;

  // Content type
  marketing.content.enums.ContentType type = 3;

  // Content body/text
  string body = 4;

  // Content tags
  repeated string tags = 5;

  // Author ID
  string author_id = 6;

  // Campaign ID (if applicable)
  string campaign_id = 7;

  // SEO metadata
  string seo_title = 8;
  string seo_description = 9;
  repeated string seo_keywords = 10;

  // Publication date
  google.protobuf.Timestamp publish_date = 11;
}

// Request message for getting content by ID
message GetContentRequest {
  // Content ID
  string id = 1;
}

// Request message for listing content
message ListContentRequest {
  // Page number for pagination
  int32 page = 1;

  // Number of items per page
  int32 page_size = 2;

  // Filter by content type
  marketing.content.enums.ContentType type = 3;

  // Filter by author ID
  string author_id = 4;

  // Filter by campaign ID
  string campaign_id = 5;

  // Filter by tags
  repeated string tags = 6;

  // Filter by publication date range - start
  google.protobuf.Timestamp start_date = 7;

  // Filter by publication date range - end
  google.protobuf.Timestamp end_date = 8;
}

// Request message for updating content
message UpdateContentRequest {
  // Content ID
  string id = 1;

  // Content title
  string title = 2;

  // Content description
  string description = 3;

  // Content type
  marketing.content.enums.ContentType type = 4;

  // Content body/text
  string body = 5;

  // Content tags
  repeated string tags = 6;

  // SEO metadata
  string seo_title = 7;
  string seo_description = 8;
  repeated string seo_keywords = 9;

  // Publication date
  google.protobuf.Timestamp publish_date = 10;
}

// Request message for deleting content
message DeleteContentRequest {
  // Content ID
  string id = 1;
}
