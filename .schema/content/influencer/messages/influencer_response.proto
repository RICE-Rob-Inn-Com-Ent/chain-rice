syntax = "proto3";

package marketing.influencer.messages;

import "google/protobuf/timestamp.proto";
import "marketing/influencer/enums/influencer_type.proto";

// Influencer data transfer object
message Influencer {
  // Influencer ID
  string id = 1;

  // Influencer name
  string name = 2;

  // Influencer email
  string email = 3;

  // Influencer phone
  string phone = 4;

  // Influencer type
  marketing.influencer.enums.InfluencerType type = 5;

  // Social media handles
  repeated string social_handles = 6;

  // Follower count
  int64 follower_count = 7;

  // Engagement rate
  double engagement_rate = 8;

  // Influencer bio
  string bio = 9;

  // Influencer location
  string location = 10;

  // Influencer niche/category
  string niche = 11;

  // Influencer tags
  repeated string tags = 12;

  // Influencer rate per post
  double rate_per_post = 13;

  // Creation timestamp
  google.protobuf.Timestamp created_at = 14;

  // Last update timestamp
  google.protobuf.Timestamp updated_at = 15;

  // Influencer performance metrics
  InfluencerMetrics metrics = 16;
}

// Influencer performance metrics
message InfluencerMetrics {
  // Total posts created
  int32 total_posts = 1;

  // Average likes per post
  double avg_likes = 2;

  // Average comments per post
  double avg_comments = 3;

  // Average shares per post
  double avg_shares = 4;

  // Total reach
  int64 total_reach = 5;

  // Total impressions
  int64 total_impressions = 6;

  // Conversion rate
  double conversion_rate = 7;

  // Cost per engagement
  double cpe = 8;

  // Return on investment
  double roi = 9;
}

// Response message for creating an influencer
message CreateInfluencerResponse {
  // Created influencer
  Influencer influencer = 1;

  // Success message
  string message = 2;
}

// Response message for getting an influencer
message GetInfluencerResponse {
  // Influencer data
  Influencer influencer = 1;
}

// Response message for listing influencers
message ListInfluencerResponse {
  // List of influencers
  repeated Influencer influencers = 1;

  // Total count of influencers
  int32 total_count = 2;

  // Current page number
  int32 page = 3;

  // Number of items per page
  int32 page_size = 4;
}

// Response message for updating an influencer
message UpdateInfluencerResponse {
  // Updated influencer
  Influencer influencer = 1;

  // Success message
  string message = 2;
}

// Response message for deleting an influencer
message DeleteInfluencerResponse {
  // Success message
  string message = 1;
}
