syntax = "proto3";

package marketing.campaings.services;

import "marketing/campaings/messages/campaign_request.proto";
import "marketing/campaings/messages/campaign_response.proto";

// Campaign service for managing marketing campaigns
service CampaignService {
  // Create a new campaign
  rpc CreateCampaign(marketing.campaings.messages.CreateCampaignRequest) returns (marketing.campaings.messages.CreateCampaignResponse);

  // Get a campaign by ID
  rpc GetCampaign(marketing.campaings.messages.GetCampaignRequest) returns (marketing.campaings.messages.GetCampaignResponse);

  // List campaigns with pagination and filtering
  rpc ListCampaign(marketing.campaings.messages.ListCampaignRequest) returns (marketing.campaings.messages.ListCampaignResponse);

  // Update an existing campaign
  rpc UpdateCampaign(marketing.campaings.messages.UpdateCampaignRequest) returns (marketing.campaings.messages.UpdateCampaignResponse);

  // Delete a campaign
  rpc DeleteCampaign(marketing.campaings.messages.DeleteCampaignRequest) returns (marketing.campaings.messages.DeleteCampaignResponse);
}
