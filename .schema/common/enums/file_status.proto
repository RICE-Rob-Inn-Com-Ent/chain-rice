syntax = "proto3";

package core.files.enums;

// FileStatus describes lifecycle state of a stored file.
enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0; // Unspecified
  FILE_STATUS_UPLOADING = 1;   // Upload in progress
  FILE_STATUS_AVAILABLE = 2;   // Available for download/use
  FILE_STATUS_ARCHIVED = 3;    // Archived to cheaper storage
  FILE_STATUS_DELETED = 4;     // Marked deleted (soft-delete)
  FILE_STATUS_FAILED = 5;      // Upload or processing failed
}
