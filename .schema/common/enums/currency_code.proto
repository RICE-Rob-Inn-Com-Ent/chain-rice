syntax = "proto3";

package core.common.enums;

// CurrencyCode includes a representative subset of ISO-4217 codes.
enum CurrencyCode {
  CURRENCY_CODE_UNSPECIFIED = 0; // Unspecified
  CURRENCY_CODE_USD = 1; // US Dollar
  CURRENCY_CODE_EUR = 2; // Euro
  CURRENCY_CODE_GBP = 3; // British Pound
  CURRENCY_CODE_JPY = 4; // Japanese Yen
  CURRENCY_CODE_CNY = 5; // Chinese Yuan
  CURRENCY_CODE_KRW = 6; // South Korean Won
  CURRENCY_CODE_INR = 7; // Indian Rupee
  CURRENCY_CODE_AUD = 8; // Australian Dollar
  CURRENCY_CODE_CAD = 9; // Canadian Dollar
  CURRENCY_CODE_BRL = 10; // Brazilian Real
  CURRENCY_CODE_MXN = 11; // Mexican Peso
  CURRENCY_CODE_PLN = 12; // Polish Złoty
  CURRENCY_CODE_SEK = 13; // Swedish Krona
  CURRENCY_CODE_NOK = 14; // Norwegian Krone
  CURRENCY_CODE_DKK = 15; // Danish Krone
  CURRENCY_CODE_ZAR = 16; // South African Rand
}
