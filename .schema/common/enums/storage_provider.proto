syntax = "proto3";

package core.files.enums;

// StorageProvider enumerates backing storage implementations.
enum StorageProvider {
  STORAGE_PROVIDER_UNSPECIFIED = 0; // Unspecified
  STORAGE_PROVIDER_S3 = 1;          // Amazon S3 or compatible
  STORAGE_PROVIDER_GCS = 2;         // Google Cloud Storage
  STORAGE_PROVIDER_AZURE_BLOB = 3;  // Azure Blob Storage
  STORAGE_PROVIDER_LOCAL = 4;       // Local filesystem
}
