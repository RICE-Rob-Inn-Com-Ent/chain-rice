syntax = "proto3";

package core.notifications.enums;

// NotificationType enumerates categories of notifications.
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0; // Unspecified
  NOTIFICATION_TYPE_EMAIL = 1;       // Email notifications
  NOTIFICATION_TYPE_SMS = 2;         // SMS/text messages
  NOTIFICATION_TYPE_PUSH = 3;        // Mobile/web push
  NOTIFICATION_TYPE_IN_APP = 4;      // In-app inbox
  NOTIFICATION_TYPE_WEBHOOK = 5;     // Webhook callbacks
}
