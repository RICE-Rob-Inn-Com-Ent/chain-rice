syntax = "proto3";

package core.notifications.enums;

// NotificationStatus represents lifecycle of a notification message.
enum NotificationStatus {
  NOTIFICATION_STATUS_UNSPECIFIED = 0; // Unspecified
  NOTIFICATION_STATUS_QUEUED = 1;      // Queued for delivery
  NOTIFICATION_STATUS_SENDING = 2;     // Delivery in progress
  NOTIFICATION_STATUS_SENT = 3;        // Delivered to provider
  NOTIFICATION_STATUS_DELIVERED = 4;   // Confirmed delivered to recipient
  NOTIFICATION_STATUS_FAILED = 5;      // Failed delivery
  NOTIFICATION_STATUS_CANCELLED = 6;   // Cancelled by user/system
}
