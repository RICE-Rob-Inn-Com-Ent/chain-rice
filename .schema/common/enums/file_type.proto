syntax = "proto3";

package core.files.enums;

// FileType enumerates supported logical file categories.
enum FileType {
  FILE_TYPE_UNSPECIFIED = 0; // Unspecified
  FILE_TYPE_IMAGE = 1;       // Images (png, jpg, gif, svg)
  FILE_TYPE_VIDEO = 2;       // Videos (mp4, webm, mov)
  FILE_TYPE_AUDIO = 3;       // Audio (mp3, wav, aac)
  FILE_TYPE_DOCUMENT = 4;    // Documents (pdf, docx, xlsx)
  FILE_TYPE_ARCHIVE = 5;     // Archives (zip, tar, gz)
  FILE_TYPE_BINARY = 6;      // Binary blobs
  FILE_TYPE_TEXT = 7;        // Plain text or structured text
}
