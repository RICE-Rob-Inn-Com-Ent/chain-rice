syntax = "proto3";

package core.files.messages;

import "core/files/enums/file_type.proto";
import "core/files/enums/file_status.proto";
import "core/files/enums/storage_provider.proto";
import "core/common/messages/timestamp.proto";

// FileMetadata stores descriptive and lifecycle data about a stored file.
message FileMetadata {
  string id = 1;                     // Unique file id.
  string filename = 2;               // Original filename.
  string content_type = 3;           // MIME type.
  int64 size_bytes = 4;              // File size in bytes.
  core.files.enums.FileType type = 5;       // Logical file category.
  core.files.enums.FileStatus status = 6;   // Lifecycle status.
  core.files.enums.StorageProvider provider = 7; // Storage backend.
  string bucket = 8;                 // Bucket/container name.
  string object_key = 9;             // Object key/path in storage.
  string checksum = 10;              // Integrity checksum (e.g., sha256).
  core.common.messages.Timestamp created_at = 11; // Upload time.
  core.common.messages.Timestamp updated_at = 12; // Last update time.
  map<string, string> metadata = 13; // Arbitrary tags/metadata.
}
