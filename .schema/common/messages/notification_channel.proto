syntax = "proto3";

package core.notifications.messages;

import "core/notifications/enums/notification_type.proto";

// NotificationChannel describes a delivery channel configuration.
message NotificationChannel {
  string id = 1; // Channel id.
  string name = 2; // Human readable name.
  core.notifications.enums.NotificationType type = 3; // Channel type.
  map<string, string> config = 4; // Provider-specific configuration.
  bool enabled = 5; // Whether the channel is enabled.
}
