syntax = "proto3";

package integrations.edi.messages;

import "google/protobuf/timestamp.proto";
import "integrations/edi/enums/edi_partner_type.proto";

option go_package = "github.com/rice-dev/integrations/edi/messages";

// EDI Partner represents a trading partner in the EDI system
message EdiPartner {
  // Unique partner identifier
  string partner_id = 1;

  // Partner basic information
  EdiPartnerBasicInfo basic_info = 2;

  // Partner type and classification
  integrations.edi.enums.EdiPartnerType partner_type = 3;

  // EDI configuration
  EdiPartnerConfiguration edi_config = 4;

  // Authentication and security
  EdiPartnerSecurity security = 5;

  // Communication settings
  EdiPartnerCommunication communication = 6;

  // Business rules and validation
  EdiPartnerBusinessRules business_rules = 7;

  // Status and health
  EdiPartnerStatus status = 8;

  // Timestamps
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_activity_at = 11;
}

// Basic partner information
message EdiPartnerBasicInfo {
  string partner_name = 1;
  string company_name = 2;
  string legal_name = 3;
  string partner_code = 4;
  string trading_partner_id = 5;
  string gln = 6; // Global Location Number
  string duns = 7; // Data Universal Numbering System
  string tax_id = 8;
  string vat_number = 9;

  // Contact information
  EdiContactInfo primary_contact = 10;
  EdiContactInfo technical_contact = 11;
  EdiContactInfo billing_contact = 12;

  // Address information
  EdiAddressInfo business_address = 13;
  EdiAddressInfo shipping_address = 14;
  EdiAddressInfo billing_address = 15;

  // Additional identifiers
  map<string, string> custom_identifiers = 16;
}

// Contact information
message EdiContactInfo {
  string name = 1;
  string title = 2;
  string email = 3;
  string phone = 4;
  string mobile = 5;
  string fax = 6;
  string department = 7;
  string notes = 8;
}

// Address information
message EdiAddressInfo {
  string street_address = 1;
  string city = 2;
  string state_province = 3;
  string postal_code = 4;
  string country = 5;
  string country_code = 6; // ISO country code
  string region = 7;
  string timezone = 8;
  double latitude = 9;
  double longitude = 10;
}

// EDI configuration for the partner
message EdiPartnerConfiguration {
  // EDI standards and versions
  repeated string supported_standards = 1; // X12, EDIFACT, etc.
  map<string, string> standard_versions = 2; // X12: 4010, EDIFACT: D.96A, etc.

  // Document types supported
  repeated string supported_document_types = 3;
  repeated string supported_transaction_sets = 4;

  // Communication protocols
  repeated string supported_protocols = 5; // AS2, SFTP, HTTP, etc.
  string preferred_protocol = 6;

  // Data formats
  repeated string supported_formats = 7; // EDI, XML, JSON, etc.
  string preferred_format = 8;

  // Processing settings
  EdiProcessingSettings processing = 9;

  // Mapping configuration
  EdiMappingConfiguration mapping = 10;

  // Validation rules
  EdiValidationConfiguration validation = 11;
}

// Processing settings
message EdiProcessingSettings {
  bool auto_process = 1;
  bool auto_acknowledge = 2;
  int32 max_retries = 3;
  int32 retry_delay_seconds = 4;
  int32 timeout_seconds = 5;
  bool enable_compression = 6;
  bool enable_encryption = 7;
  string processing_priority = 8; // HIGH, NORMAL, LOW
  repeated string processing_schedules = 9; // Cron expressions
}

// Mapping configuration
message EdiMappingConfiguration {
  string mapping_template = 1;
  map<string, string> field_mappings = 2;
  map<string, string> value_mappings = 3;
  repeated string required_fields = 4;
  repeated string optional_fields = 5;
  map<string, string> default_values = 6;
  repeated string transformation_rules = 7;
}

// Validation configuration
message EdiValidationConfiguration {
  bool strict_validation = 1;
  bool validate_syntax = 2;
  bool validate_semantics = 3;
  bool validate_business_rules = 4;
  repeated string validation_rules = 5;
  map<string, string> custom_validations = 6;
  bool allow_partial_validation = 7;
}

// Security configuration
message EdiPartnerSecurity {
  // Authentication methods
  repeated string auth_methods = 1; // API_KEY, CERTIFICATE, OAUTH2, etc.
  string primary_auth_method = 2;

  // Certificates
  EdiCertificateInfo certificate = 3;

  // API keys
  repeated EdiApiKey api_keys = 4;

  // OAuth configuration
  EdiOAuthConfig oauth = 5;

  // Encryption settings
  EdiEncryptionConfig encryption = 6;

  // Access control
  EdiAccessControl access_control = 7;
}

// Certificate information
message EdiCertificateInfo {
  string certificate_id = 1;
  string certificate_name = 2;
  string certificate_type = 3; // SSL, S/MIME, etc.
  string public_key = 4;
  string thumbprint = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  string issuer = 8;
  string subject = 9;
  bool is_active = 10;
}

// API key information
message EdiApiKey {
  string key_id = 1;
  string key_name = 2;
  string key_value = 3; // Usually hashed/encrypted
  string key_type = 4; // HMAC, JWT, etc.
  repeated string permissions = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool is_active = 8;
  google.protobuf.Timestamp last_used_at = 9;
}

// OAuth configuration
message EdiOAuthConfig {
  string client_id = 1;
  string client_secret = 2; // Usually hashed/encrypted
  string token_endpoint = 3;
  string authorization_endpoint = 4;
  repeated string scopes = 5;
  string grant_type = 6;
  int32 token_expiry_seconds = 7;
  bool auto_refresh = 8;
}

// Encryption configuration
message EdiEncryptionConfig {
  bool require_encryption = 1;
  repeated string supported_algorithms = 2;
  string preferred_algorithm = 3;
  int32 key_size = 4;
  string key_exchange_method = 5;
  bool require_digital_signature = 6;
}

// Access control
message EdiAccessControl {
  repeated string allowed_ips = 1;
  repeated string blocked_ips = 2;
  repeated string allowed_user_agents = 3;
  repeated string blocked_user_agents = 4;
  int32 max_requests_per_minute = 5;
  int32 max_requests_per_hour = 6;
  repeated string allowed_operations = 7;
  repeated string blocked_operations = 8;
}

// Communication settings
message EdiPartnerCommunication {
  // Endpoints
  repeated EdiEndpoint endpoints = 1;
  string primary_endpoint = 2;

  // Connection settings
  EdiConnectionSettings connection = 3;

  // Message settings
  EdiMessageSettings message = 4;

  // Monitoring settings
  EdiMonitoringSettings monitoring = 5;
}

// Endpoint information
message EdiEndpoint {
  string endpoint_id = 1;
  string endpoint_name = 2;
  string url = 3;
  string protocol = 4; // HTTP, HTTPS, SFTP, AS2, etc.
  int32 port = 5;
  string path = 6;
  map<string, string> headers = 7;
  map<string, string> parameters = 8;
  bool is_active = 9;
  int32 priority = 10;
  string description = 11;
}

// Connection settings
message EdiConnectionSettings {
  int32 connection_timeout_seconds = 1;
  int32 read_timeout_seconds = 2;
  int32 write_timeout_seconds = 3;
  int32 max_connections = 4;
  int32 keep_alive_seconds = 5;
  bool enable_compression = 6;
  bool enable_ssl = 7;
  string ssl_version = 8;
  bool verify_ssl_certificate = 9;
}

// Message settings
message EdiMessageSettings {
  int32 max_message_size_bytes = 1;
  int32 max_messages_per_batch = 2;
  int32 batch_timeout_seconds = 3;
  bool enable_message_queuing = 4;
  int32 queue_size = 5;
  string message_format = 6;
  string encoding = 7;
  bool enable_acknowledgments = 8;
  int32 acknowledgment_timeout_seconds = 9;
}

// Monitoring settings
message EdiMonitoringSettings {
  bool enable_health_checks = 1;
  int32 health_check_interval_seconds = 2;
  int32 health_check_timeout_seconds = 3;
  bool enable_performance_monitoring = 4;
  bool enable_error_monitoring = 5;
  repeated string alert_emails = 6;
  repeated string alert_webhooks = 7;
}

// Business rules
message EdiPartnerBusinessRules {
  repeated EdiBusinessRule rules = 1;
  map<string, string> custom_attributes = 2;
  repeated string required_validations = 3;
  repeated string optional_validations = 4;
  map<string, string> business_constraints = 5;
}

// Business rule
message EdiBusinessRule {
  string rule_id = 1;
  string rule_name = 2;
  string rule_type = 3; // VALIDATION, TRANSFORMATION, ROUTING, etc.
  string rule_expression = 4;
  string rule_description = 5;
  bool is_active = 6;
  int32 priority = 7;
  map<string, string> rule_parameters = 8;
}

// Partner status
message EdiPartnerStatus {
  string status = 1; // ACTIVE, INACTIVE, SUSPENDED, PENDING, etc.
  string health_status = 2; // HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN
  google.protobuf.Timestamp last_health_check = 3;
  google.protobuf.Timestamp last_successful_transaction = 4;
  google.protobuf.Timestamp last_failed_transaction = 5;
  int32 consecutive_failures = 6;
  int32 total_transactions = 7;
  int32 successful_transactions = 8;
  int32 failed_transactions = 9;
  double success_rate = 10;
  string status_message = 11;
  repeated string active_alerts = 12;
}

// Partner search/filter criteria
message EdiPartnerFilter {
  repeated string partner_ids = 1;
  repeated integrations.edi.enums.EdiPartnerType partner_types = 2;
  repeated string partner_codes = 3;
  repeated string trading_partner_ids = 4;
  repeated string statuses = 5;
  repeated string health_statuses = 6;
  repeated string supported_standards = 7;
  repeated string supported_protocols = 8;
  repeated string supported_document_types = 9;
  google.protobuf.Timestamp created_from = 10;
  google.protobuf.Timestamp created_to = 11;
  google.protobuf.Timestamp last_activity_from = 12;
  google.protobuf.Timestamp last_activity_to = 13;
  string search_text = 14;
  int32 limit = 15;
  int32 offset = 16;
  string sort_by = 17;
  string sort_order = 18; // ASC, DESC
}

// Partner list response
message EdiPartnerList {
  repeated EdiPartner partners = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
  bool has_next_page = 5;
  bool has_previous_page = 6;
}
