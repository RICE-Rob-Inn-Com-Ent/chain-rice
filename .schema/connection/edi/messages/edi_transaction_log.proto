syntax = "proto3";

package integrations.edi.messages;

import "google/protobuf/timestamp.proto";
import "integrations/edi/enums/edi_status.proto";

option go_package = "github.com/rice-dev/integrations/edi/messages";

// EDI Transaction Log entry for tracking document processing history
message EdiTransactionLog {
  // Unique log entry identifier
  string log_id = 1;

  // Associated document identifier
  string document_id = 2;

  // Transaction details
  EdiTransactionDetails transaction = 3;

  // Status change information
  EdiStatusChange status_change = 4;

  // Error information if applicable
  EdiTransactionError error = 5;

  // Performance metrics
  EdiPerformanceMetrics performance = 6;

  // Timestamps
  google.protobuf.Timestamp timestamp = 7;
  google.protobuf.Timestamp created_at = 8;
}

// Transaction details
message EdiTransactionDetails {
  string transaction_id = 1;
  string transaction_type = 2; // PROCESS, VALIDATE, TRANSFORM, DELIVER, etc.
  string operation = 3; // Specific operation performed
  string processor_id = 4; // ID of the processing component
  string session_id = 5; // Processing session identifier
  string correlation_id = 6; // For tracking related operations
  map<string, string> transaction_context = 7;
}

// Status change information
message EdiStatusChange {
  integrations.edi.enums.EdiStatus from_status = 1;
  integrations.edi.enums.EdiStatus to_status = 2;
  string change_reason = 3;
  string change_description = 4;
  string changed_by = 5; // System component or user
  map<string, string> change_context = 6;
}

// Transaction error information
message EdiTransactionError {
  string error_code = 1;
  string error_message = 2;
  string error_type = 3; // SYSTEM, VALIDATION, BUSINESS, etc.
  string error_category = 4; // PROCESSING, NETWORK, AUTHENTICATION, etc.
  string error_severity = 5; // CRITICAL, HIGH, MEDIUM, LOW
  string stack_trace = 6;
  map<string, string> error_context = 7;
  bool is_retryable = 8;
  int32 retry_count = 9;
  int32 max_retries = 10;
  google.protobuf.Timestamp next_retry_at = 11;
}

// Performance metrics for the transaction
message EdiPerformanceMetrics {
  int64 processing_time_ms = 1;
  int64 validation_time_ms = 2;
  int64 transformation_time_ms = 3;
  int64 delivery_time_ms = 4;
  int64 total_time_ms = 5;
  int64 memory_usage_bytes = 6;
  int64 cpu_usage_percent = 7;
  int32 queue_wait_time_ms = 8;
  int32 retry_delay_ms = 9;
  map<string, int64> custom_metrics = 10;
}

// Transaction log search/filter criteria
message EdiTransactionLogFilter {
  repeated string log_ids = 1;
  repeated string document_ids = 2;
  repeated string transaction_types = 3;
  repeated string operations = 4;
  repeated string processor_ids = 5;
  repeated string session_ids = 6;
  repeated string correlation_ids = 7;
  repeated integrations.edi.enums.EdiStatus from_statuses = 8;
  repeated integrations.edi.enums.EdiStatus to_statuses = 9;
  repeated string error_codes = 10;
  repeated string error_types = 11;
  repeated string error_severities = 12;
  google.protobuf.Timestamp timestamp_from = 13;
  google.protobuf.Timestamp timestamp_to = 14;
  int64 min_processing_time_ms = 15;
  int64 max_processing_time_ms = 16;
  bool has_errors = 17;
  bool is_retryable = 18;
  int32 limit = 19;
  int32 offset = 20;
  string sort_by = 21;
  string sort_order = 22; // ASC, DESC
}

// Transaction log list response
message EdiTransactionLogList {
  repeated EdiTransactionLog logs = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
  bool has_next_page = 5;
  bool has_previous_page = 6;
}

// Transaction statistics
message EdiTransactionStatistics {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int32 total_transactions = 3;
  int32 successful_transactions = 4;
  int32 failed_transactions = 5;
  int32 retry_transactions = 6;
  double success_rate = 7;
  double failure_rate = 8;
  int64 average_processing_time_ms = 9;
  int64 min_processing_time_ms = 10;
  int64 max_processing_time_ms = 11;
  int64 total_processing_time_ms = 12;
  map<string, int32> transaction_type_counts = 13;
  map<string, int32> error_code_counts = 14;
  map<string, int32> status_counts = 15;
  repeated EdiTransactionError top_errors = 16;
}

// Real-time transaction metrics
message EdiTransactionMetrics {
  google.protobuf.Timestamp timestamp = 1;
  int32 transactions_per_minute = 2;
  int32 active_transactions = 3;
  int32 queued_transactions = 4;
  int32 failed_transactions_last_hour = 5;
  double current_success_rate = 6;
  int64 average_processing_time_ms = 7;
  int32 retry_queue_size = 8;
  map<string, int32> processor_load = 9;
}
