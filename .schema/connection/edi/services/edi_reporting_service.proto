}

// Save Report Template Request
message SaveReportTemplateRequest {
  EdiReportTemplate template = 1;
  bool is_public = 2;
}

// Save Report Template Response
message SaveReportTemplateResponse {
  string template_id = 1;
  bool saved = 2;
  google.protobuf.Timestamp saved_at = 3;
}

// Export Report Request
message ExportReportRequest {
  string report_id = 1;
  string format = 2; // PDF, CSV, EXCEL, JSON
  map<string, string> export_options = 3;
}

// Export Report Response
message ExportReportResponse {
  string export_id = 1;
  string download_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  string status = 4;
}

// Schedule Report Request
message ScheduleReportRequest {
  string report_template_id = 1;
  string schedule_cron = 2;
  repeated string recipients = 3;
  string format = 4;
  map<string, string> parameters = 5;
}

// Schedule Report Response
message ScheduleReportResponse {
  string schedule_id = 1;
  bool scheduled = 2;
  google.protobuf.Timestamp next_run_at = 3;
}

// Get Scheduled Reports Request
message GetScheduledReportsRequest {
  repeated string schedule_ids = 1;
