syntax = "proto3";

package integrations.edi.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "integrations/edi/messages/edi_document_models.proto";
import "integrations/edi/messages/edi_transaction_log.proto";
import "integrations/edi/messages/edi_partner_models.proto";

option go_package = "github.com/rice-dev/integrations/edi/services";

// EDI Reporting Service for analytics, KPIs, and SLA monitoring
service EdiReportingService {
  // Document Reports
  rpc GetDocumentReport(GetDocumentReportRequest) returns (GetDocumentReportResponse);
  rpc GetDocumentVolumeReport(GetDocumentVolumeReportRequest) returns (GetDocumentVolumeReportResponse);
  rpc GetDocumentStatusReport(GetDocumentStatusReportRequest) returns (GetDocumentStatusReportResponse);
  rpc GetDocumentErrorReport(GetDocumentErrorReportRequest) returns (GetDocumentErrorReportResponse);

  // Partner Reports
  rpc GetPartnerReport(GetPartnerReportRequest) returns (GetPartnerReportResponse);
  rpc GetPartnerPerformanceReport(GetPartnerPerformanceReportRequest) returns (GetPartnerPerformanceReportResponse);
  rpc GetPartnerSlaReport(GetPartnerSlaReportRequest) returns (GetPartnerSlaReportResponse);
  rpc GetPartnerVolumeReport(GetPartnerVolumeReportRequest) returns (GetPartnerVolumeReportResponse);

  // Processing Reports
  rpc GetProcessingReport(GetProcessingReportRequest) returns (GetProcessingReportResponse);
  rpc GetProcessingPerformanceReport(GetProcessingPerformanceReportRequest) returns (GetProcessingPerformanceReportResponse);
  rpc GetProcessingErrorReport(GetProcessingErrorReportRequest) returns (GetProcessingErrorReportResponse);
  rpc GetProcessingQueueReport(GetProcessingQueueReportRequest) returns (GetProcessingQueueReportResponse);

  // System Reports
  rpc GetSystemHealthReport(GetSystemHealthReportRequest) returns (GetSystemHealthReportResponse);
  rpc GetSystemPerformanceReport(GetSystemPerformanceReportRequest) returns (GetSystemPerformanceReportResponse);
  rpc GetSystemCapacityReport(GetSystemCapacityReportRequest) returns (GetSystemCapacityReportResponse);

  // SLA and Compliance Reports
  rpc GetSlaComplianceReport(GetSlaComplianceReportRequest) returns (GetSlaComplianceReportResponse);
  rpc GetComplianceReport(GetComplianceReportRequest) returns (GetComplianceReportResponse);
  rpc GetAuditReport(GetAuditReportRequest) returns (GetAuditReportResponse);

  // Real-time Dashboards
  rpc GetRealTimeDashboard(GetRealTimeDashboardRequest) returns (GetRealTimeDashboardResponse);
  rpc GetPartnerDashboard(GetPartnerDashboardRequest) returns (GetPartnerDashboardResponse);
  rpc GetProcessingDashboard(GetProcessingDashboardRequest) returns (GetProcessingDashboardResponse);

  // Custom Reports
  rpc GenerateCustomReport(GenerateCustomReportRequest) returns (GenerateCustomReportResponse);
  rpc GetReportTemplates(GetReportTemplatesRequest) returns (GetReportTemplatesResponse);
  rpc SaveReportTemplate(SaveReportTemplateRequest) returns (SaveReportTemplateResponse);

  // Export and Scheduling
  rpc ExportReport(ExportReportRequest) returns (ExportReportResponse);
  rpc ScheduleReport(ScheduleReportRequest) returns (ScheduleReportResponse);
  rpc GetScheduledReports(GetScheduledReportsRequest) returns (GetScheduledReportsResponse);
}

// Get Document Report Request
message GetDocumentReportRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  repeated string partner_ids = 3;
  repeated integrations.edi.enums.EdiDocumentType document_types = 4;
  repeated integrations.edi.enums.EdiStatus statuses = 5;
  string granularity = 6; // HOUR, DAY, WEEK, MONTH
  string format = 7; // JSON, CSV, PDF, EXCEL
}

// Get Document Report Response
message GetDocumentReportResponse {
  EdiDocumentReport report = 1;
  google.protobuf.Timestamp generated_at = 2;
  string report_id = 3;
}

// Get Document Volume Report Request
message GetDocumentVolumeReportRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  repeated string partner_ids = 3;
  repeated integrations.edi.enums.EdiDocumentType document_types = 4;
  string granularity = 5;
  bool include_trends = 6;
}

// Get Document Volume Report Response
message GetDocumentVolumeReportResponse {
  EdiDocumentVolumeReport report = 1;
  google.protobuf.Timestamp generated_at = 2;
}

// Get Document Status Report Request
message GetDocumentStatusReportRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  repeated string partner_ids = 3;
  repeated integrations.edi.enums.EdiDocumentType document_types = 4;
