}

// Document Report
message EdiDocumentReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int32 total_documents = 3;
  int32 successful_documents = 4;
  int32 failed_documents = 5;
  double success_rate = 6;
  map<string, int32> document_type_counts = 7;
  map<string, int32> status_counts = 8;
  map<string, int32> partner_counts = 9;
  repeated EdiDocumentTrend trends = 10;
}

// Document Volume Report
message EdiDocumentVolumeReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiVolumeDataPoint volume_data = 3;
  EdiVolumeStatistics statistics = 4;
  repeated EdiVolumeForecast forecasts = 5;
}

// Document Status Report
message EdiDocumentStatusReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  map<string, int32> status_distribution = 3;
  repeated EdiStatusTrend status_trends = 4;
  repeated EdiStatusBreakdown status_breakdowns = 5;
}

// Document Error Report
message EdiDocumentErrorReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int32 total_errors = 3;
  repeated EdiErrorSummary error_summaries = 4;
  repeated EdiErrorTrend error_trends = 5;
  repeated EdiErrorBreakdown error_breakdowns = 6;
}

// Partner Report
message EdiPartnerReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int32 total_partners = 3;
  int32 active_partners = 4;
  int32 inactive_partners = 5;
  repeated EdiPartnerSummary partner_summaries = 6;
  map<string, int32> partner_type_counts = 7;
}

// Partner Performance Report
message EdiPartnerPerformanceReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiPartnerPerformance partner_performances = 3;
  EdiPartnerBenchmarks benchmarks = 4;
  repeated EdiPartnerRanking partner_rankings = 5;
}

// Partner SLA Report
message EdiPartnerSlaReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiPartnerSla partner_slas = 3;
  double overall_sla_compliance = 4;
  repeated EdiSlaViolation sla_violations = 5;
}

// Partner Volume Report
message EdiPartnerVolumeReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiPartnerVolume partner_volumes = 3;
  EdiVolumeStatistics total_volume = 4;
  repeated EdiVolumeForecast volume_forecasts = 5;
}

// Processing Report
message EdiProcessingReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int32 total_processed = 3;
  int32 successful_processed = 4;
  int32 failed_processed = 5;
  double success_rate = 6;
  repeated EdiProcessorSummary processor_summaries = 7;
}

// Processing Performance Report
message EdiProcessingPerformanceReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiProcessorPerformance processor_performances = 3;
  EdiProcessingBenchmarks benchmarks = 4;
  repeated EdiResourceUsage resource_usage = 5;
}

// Processing Error Report
message EdiProcessingErrorReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int32 total_errors = 3;
  repeated EdiProcessorErrorSummary processor_errors = 4;
  repeated EdiErrorTrend error_trends = 5;
}

// Processing Queue Report
message EdiProcessingQueueReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiQueueStatus queue_statuses = 3;
  EdiQueueStatistics queue_statistics = 4;
  repeated EdiQueueTrend queue_trends = 5;
}

// System Health Report
message EdiSystemHealthReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  string overall_health = 3;
  repeated EdiComponentHealth component_healths = 4;
  repeated EdiHealthAlert health_alerts = 5;
  EdiSystemUptime uptime = 6;
}

// System Performance Report
message EdiSystemPerformanceReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  EdiSystemMetrics system_metrics = 3;
  repeated EdiComponentPerformance component_performances = 4;
  EdiPerformanceBenchmarks benchmarks = 5;
}

// System Capacity Report
message EdiSystemCapacityReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  EdiCapacityMetrics capacity_metrics = 3;
  repeated EdiCapacityForecast capacity_forecasts = 4;
  repeated EdiCapacityAlert capacity_alerts = 5;
}

// SLA Compliance Report
message EdiSlaComplianceReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  double overall_compliance = 3;
  repeated EdiSlaCompliance sla_compliances = 4;
  repeated EdiSlaViolation sla_violations = 5;
}

// Compliance Report
message EdiComplianceReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiComplianceStandard compliance_standards = 3;
  repeated EdiComplianceViolation compliance_violations = 4;
  EdiComplianceScore compliance_score = 5;
}

// Audit Report
message EdiAuditReport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated EdiAuditEntry audit_entries = 3;
  EdiAuditStatistics audit_statistics = 4;
  repeated EdiAuditTrend audit_trends = 5;
}

// Real-time Dashboard
message EdiRealTimeDashboard {
  google.protobuf.Timestamp generated_at = 1;
  repeated EdiDashboardWidget widgets = 2;
  repeated EdiAlert alerts = 3;
  EdiSystemStatus system_status = 4;
}

// Partner Dashboard
message EdiPartnerDashboard {
  string partner_id = 1;
  google.protobuf.Timestamp generated_at = 2;
  repeated EdiDashboardWidget widgets = 3;
  EdiPartnerStatus partner_status = 4;
  repeated EdiPartnerAlert partner_alerts = 5;
}

// Processing Dashboard
message EdiProcessingDashboard {
  google.protobuf.Timestamp generated_at = 1;
  repeated EdiDashboardWidget widgets = 2;
  repeated EdiProcessorStatus processor_statuses = 3;
  EdiQueueStatus queue_status = 4;
}

// Report Template
message EdiReportTemplate {
  string template_id = 1;
  string template_name = 2;
  string template_description = 3;
  string template_type = 4;
  string template_config = 5;
  bool is_public = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Scheduled Report
message EdiScheduledReport {
  string schedule_id = 1;
  string report_template_id = 2;
  string schedule_cron = 3;
  repeated string recipients = 4;
  string format = 5;
  bool is_active = 6;
  google.protobuf.Timestamp next_run_at = 7;
  google.protobuf.Timestamp last_run_at = 8;
  string last_run_status = 9;
  google.protobuf.Timestamp created_at = 10;
}

// Supporting message types for reports
message EdiDocumentTrend {
  string trend_type = 1;
  google.protobuf.Timestamp timestamp = 2;
  double value = 3;
  string label = 4;
}

message EdiVolumeDataPoint {
  google.protobuf.Timestamp timestamp = 1;
  int32 volume = 2;
  string label = 3;
}

message EdiVolumeStatistics {
  int32 total_volume = 1;
  int32 average_volume = 2;
  int32 min_volume = 3;
  int32 max_volume = 4;
  double growth_rate = 5;
}

message EdiVolumeForecast {
  google.protobuf.Timestamp forecast_date = 1;
  int32 predicted_volume = 2;
  double confidence = 3;
  string method = 4;
}

message EdiStatusTrend {
  string status = 1;
  google.protobuf.Timestamp timestamp = 2;
  int32 count = 3;
}

message EdiStatusBreakdown {
  string status = 1;
  int32 count = 2;
  double percentage = 3;
  string trend = 4;
}

message EdiErrorSummary {
  string error_code = 1;
  string error_message = 2;
  int32 count = 3;
  double percentage = 4;
  string trend = 5;
}

message EdiErrorTrend {
  string error_code = 1;
  google.protobuf.Timestamp timestamp = 2;
  int32 count = 3;
}

message EdiErrorBreakdown {
  string error_category = 1;
  int32 count = 2;
  double percentage = 3;
  repeated string error_codes = 4;
}

message EdiPartnerSummary {
  string partner_id = 1;
  string partner_name = 2;
  int32 total_documents = 3;
  int32 successful_documents = 4;
  int32 failed_documents = 5;
  double success_rate = 6;
  string status = 7;
}

message EdiPartnerPerformance {
  string partner_id = 1;
  string partner_name = 2;
  double success_rate = 3;
  int64 average_response_time_ms = 4;
  int32 total_transactions = 5;
  double uptime_percentage = 6;
  int32 ranking = 7;
}

message EdiPartnerBenchmarks {
  double average_success_rate = 1;
  int64 average_response_time_ms = 2;
  double average_uptime_percentage = 3;
  int32 total_partners = 4;
}

message EdiPartnerRanking {
  string partner_id = 1;
  string partner_name = 2;
  int32 ranking = 3;
  double score = 4;
  string category = 5;
}

message EdiPartnerSla {
  string partner_id = 1;
  string partner_name = 2;
  string sla_type = 3;
  double sla_target = 4;
  double sla_actual = 5;
  bool sla_met = 6;
  int32 violations = 7;
}

message EdiSlaViolation {
  string partner_id = 1;
  string partner_name = 2;
  string sla_type = 3;
  google.protobuf.Timestamp violation_time = 4;
  string violation_reason = 5;
  double sla_target = 6;
  double sla_actual = 7;
}

message EdiPartnerVolume {
  string partner_id = 1;
  string partner_name = 2;
  int32 total_volume = 3;
  int32 successful_volume = 4;
  int32 failed_volume = 5;
  double growth_rate = 6;
}

message EdiProcessorSummary {
  string processor_id = 1;
  string processor_name = 2;
  int32 total_processed = 3;
  int32 successful_processed = 4;
  int32 failed_processed = 5;
  double success_rate = 6;
  string status = 7;
}

message EdiProcessorPerformance {
  string processor_id = 1;
  string processor_name = 2;
  double success_rate = 3;
  int64 average_processing_time_ms = 4;
  int32 throughput_per_hour = 5;
  double cpu_usage_percent = 6;
  int64 memory_usage_bytes = 7;
}

message EdiProcessingBenchmarks {
  double average_success_rate = 1;
  int64 average_processing_time_ms = 2;
  int32 average_throughput_per_hour = 3;
  double average_cpu_usage_percent = 4;
}

message EdiResourceUsage {
  string resource_type = 1;
  double usage_percent = 2;
  int64 usage_value = 3;
  int64 capacity_value = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message EdiProcessorErrorSummary {
  string processor_id = 1;
  string processor_name = 2;
  int32 total_errors = 3;
  repeated EdiErrorSummary error_summaries = 4;
  double error_rate = 5;
}

message EdiQueueStatus {
  string queue_name = 1;
  int32 queue_size = 2;
  int32 processing_rate = 3;
  int64 average_wait_time_ms = 4;
  string status = 5;
}

message EdiQueueStatistics {
  int32 total_queues = 1;
  int32 total_queue_size = 2;
  int32 average_queue_size = 3;
  int64 average_wait_time_ms = 4;
}

message EdiQueueTrend {
  string queue_name = 1;
  google.protobuf.Timestamp timestamp = 2;
  int32 queue_size = 3;
}

message EdiComponentHealth {
  string component_name = 1;
  string health_status = 2;
  double uptime_percentage = 3;
  int32 error_count = 4;
  google.protobuf.Timestamp last_check = 5;
}

message EdiHealthAlert {
  string alert_id = 1;
  string component_name = 2;
  string alert_type = 3;
  string alert_message = 4;
  string severity = 5;
  google.protobuf.Timestamp triggered_at = 6;
  bool acknowledged = 7;
}

message EdiSystemUptime {
  double uptime_percentage = 1;
  google.protobuf.Timestamp last_downtime = 2;
  int32 total_downtime_minutes = 3;
  int32 downtime_incidents = 4;
}

message EdiSystemMetrics {
  double cpu_usage_percent = 1;
  double memory_usage_percent = 2;
