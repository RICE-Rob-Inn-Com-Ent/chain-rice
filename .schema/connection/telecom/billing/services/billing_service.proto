syntax = "proto3";

package telecom.billing.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";
import "telecom/billing/messages/billing_request.proto";
import "telecom/billing/messages/billing_response.proto";
import "telecom/billing/enums/payment_method.proto";

// BillingService provides comprehensive billing and invoice management functionality
service BillingService {
  // Create a new invoice for a customer
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);

  // Retrieve a specific invoice by ID
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);

  // List invoices with optional filtering and pagination
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // Update an existing invoice
  rpc UpdateInvoice(UpdateInvoiceRequest) returns (UpdateInvoiceResponse);

  // Delete an invoice (soft delete - marks as cancelled)
  rpc DeleteInvoice(DeleteInvoiceRequest) returns (DeleteInvoiceResponse);

  // Process payment for an invoice
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);

  // Get billing summary for a customer
  rpc GetBillingSummary(GetBillingSummaryRequest) returns (GetBillingSummaryResponse);

  // Generate invoice PDF
  rpc GenerateInvoicePDF(GenerateInvoicePDFRequest) returns (GenerateInvoicePDFResponse);

  // Send invoice via email
  rpc SendInvoice(SendInvoiceRequest) returns (SendInvoiceResponse);

  // Get payment history for a customer
  rpc GetPaymentHistory(GetPaymentHistoryRequest) returns (GetPaymentHistoryResponse);
}

// GetBillingSummaryRequest represents a request to get billing summary for a customer
message GetBillingSummaryRequest {
  // Customer ID to get summary for
  string customer_id = 1;

  // Optional date range for the summary
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

// GetBillingSummaryResponse represents the billing summary response
message GetBillingSummaryResponse {
  // Customer ID
  string customer_id = 1;

  // Total amount owed
  int64 total_owed = 2;

  // Total amount paid
  int64 total_paid = 3;

  // Number of pending invoices
  int32 pending_invoices = 4;

  // Number of overdue invoices
  int32 overdue_invoices = 5;

  // Currency code
  string currency = 6;

  // Last payment date
  google.protobuf.Timestamp last_payment_date = 7;
}

// GenerateInvoicePDFRequest represents a request to generate PDF for an invoice
message GenerateInvoicePDFRequest {
  // Invoice ID to generate PDF for
  string invoice_id = 1;

  // Optional template ID for custom formatting
  google.protobuf.StringValue template_id = 2;
}

// GenerateInvoicePDFResponse represents the PDF generation response
message GenerateInvoicePDFResponse {
  // Base64 encoded PDF content
  string pdf_content = 1;

  // File name for the PDF
  string file_name = 2;

  // File size in bytes
  int64 file_size = 3;
}

// SendInvoiceRequest represents a request to send an invoice via email
message SendInvoiceRequest {
  // Invoice ID to send
  string invoice_id = 1;

  // Email address to send to
  string email_address = 2;

  // Optional custom message
  google.protobuf.StringValue custom_message = 3;

  // Whether to include PDF attachment
  bool include_pdf = 4;
}

// SendInvoiceResponse represents the send invoice response
message SendInvoiceResponse {
  // Success message
  string message = 1;

  // Email delivery status
  string delivery_status = 2;

  // Timestamp when email was sent
  google.protobuf.Timestamp sent_at = 3;
}

// GetPaymentHistoryRequest represents a request to get payment history
message GetPaymentHistoryRequest {
  // Customer ID to get history for
  string customer_id = 1;

  // Optional date range
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;

  // Page number for pagination
  int32 page = 4;

  // Page size for pagination
  int32 page_size = 5;
}

// GetPaymentHistoryResponse represents the payment history response
message GetPaymentHistoryResponse {
  // List of payments
  repeated PaymentRecord payments = 1;

  // Total count
  int32 total_count = 2;

  // Pagination info
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}

// PaymentRecord represents a payment transaction record
message PaymentRecord {
  // Payment ID
  string payment_id = 1;

  // Invoice ID
  string invoice_id = 2;

  // Customer ID
  string customer_id = 3;

  // Payment amount
  int64 amount = 4;

  // Currency
  string currency = 5;

  // Payment method
  telecom.billing.enums.PaymentMethod payment_method = 6;

  // Payment reference
  string payment_reference = 7;

  // Payment timestamp
  google.protobuf.Timestamp payment_date = 8;

  // Payment status
  string status = 9;
}
