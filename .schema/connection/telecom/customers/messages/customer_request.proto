syntax = "proto3";

package telecom.customers.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/string_value.proto";
import "google/protobuf/double_value.proto";
import "telecom/customers/enums/customer_status.proto";
import "telecom/customers/enums/customer_type.proto";

// CreateCustomerRequest represents a request to create a new customer
message CreateCustomerRequest {
  // Customer's full name
  string name = 1;

  // Customer's email address (must be unique)
  string email = 2;

  // Customer's phone number
  string phone = 3;

  // Customer type classification
  telecom.customers.enums.CustomerType type = 4;

  // Customer status (defaults to PENDING)
  telecom.customers.enums.CustomerStatus status = 5;

  // Customer's date of birth (for individual customers)
  google.protobuf.Timestamp date_of_birth = 6;

  // Customer's address information
  Address address = 7;

  // Customer's billing preferences
  BillingPreferences billing_preferences = 8;

  // Customer's communication preferences
  CommunicationPreferences communication_preferences = 9;

  // Optional notes about the customer
  google.protobuf.StringValue notes = 10;

  // For business customers - company information
  CompanyInfo company_info = 11;

  // Customer's preferred language
  google.protobuf.StringValue preferred_language = 12;

  // Customer's timezone
  google.protobuf.StringValue timezone = 13;
}

// UpdateCustomerRequest represents a request to update an existing customer
message UpdateCustomerRequest {
  // Customer ID to update
  string customer_id = 1;

  // Optional new name
  google.protobuf.StringValue name = 2;

  // Optional new email
  google.protobuf.StringValue email = 3;

  // Optional new phone
  google.protobuf.StringValue phone = 4;

  // Optional new customer type
  telecom.customers.enums.CustomerType type = 5;

  // Optional new status
  telecom.customers.enums.CustomerStatus status = 6;

  // Optional new address
  Address address = 7;

  // Optional new billing preferences
  BillingPreferences billing_preferences = 8;

  // Optional new communication preferences
  CommunicationPreferences communication_preferences = 9;

  // Optional new notes
  google.protobuf.StringValue notes = 10;

  // Optional new company information
  CompanyInfo company_info = 11;

  // Optional new preferred language
  google.protobuf.StringValue preferred_language = 12;

  // Optional new timezone
  google.protobuf.StringValue timezone = 13;
}

// GetCustomerRequest represents a request to retrieve a specific customer
message GetCustomerRequest {
  // Customer ID to retrieve
  string customer_id = 1;
}

// ListCustomersRequest represents a request to list customers with filtering
message ListCustomersRequest {
  // Customer type to filter by (optional)
  telecom.customers.enums.CustomerType type = 1;

  // Customer status to filter by (optional)
  telecom.customers.enums.CustomerStatus status = 2;

  // Search term for name or email (optional)
  google.protobuf.StringValue search_term = 3;

  // Date range for customer creation (optional)
  google.protobuf.Timestamp created_after = 4;
  google.protobuf.Timestamp created_before = 5;

  // Page number for pagination (starts from 1)
  int32 page = 6;

  // Page size for pagination (max 100)
  int32 page_size = 7;
}

// DeleteCustomerRequest represents a request to delete a customer
message DeleteCustomerRequest {
  // Customer ID to delete
  string customer_id = 1;

  // Reason for deletion
  google.protobuf.StringValue reason = 2;
}

// Address represents a customer's address information
message Address {
  // Street address line 1
  string street_address_1 = 1;

  // Street address line 2 (optional)
  google.protobuf.StringValue street_address_2 = 2;

  // City
  string city = 3;

  // State or province
  string state_province = 4;

  // Postal or ZIP code
  string postal_code = 5;

  // Country code (ISO 3166-1 alpha-2)
  string country_code = 6;

  // Address type (home, business, billing, shipping)
  google.protobuf.StringValue address_type = 7;
}

// BillingPreferences represents customer's billing preferences
message BillingPreferences {
  // Preferred billing cycle (monthly, quarterly, annually)
  string billing_cycle = 1;

  // Preferred payment method
  string payment_method = 2;

  // Auto-pay enabled
  bool auto_pay_enabled = 3;

  // Billing email (if different from primary email)
  google.protobuf.StringValue billing_email = 4;

  // Paperless billing preference
  bool paperless_billing = 5;

  // Invoice delivery method (email, mail, portal)
  string delivery_method = 6;
}

// CommunicationPreferences represents customer's communication preferences
message CommunicationPreferences {
  // Marketing emails enabled
  bool marketing_emails = 1;

  // SMS notifications enabled
  bool sms_notifications = 2;

  // Service updates enabled
  bool service_updates = 3;

  // Promotional offers enabled
  bool promotional_offers = 4;

  // Preferred communication channel
  string preferred_channel = 5;

  // Do not call list
  bool do_not_call = 6;
}

// CompanyInfo represents company information for business customers
message CompanyInfo {
  // Company name
  string company_name = 1;

  // Company registration number
  google.protobuf.StringValue registration_number = 2;

  // Tax ID or VAT number
  google.protobuf.StringValue tax_id = 3;

  // Industry or sector
  google.protobuf.StringValue industry = 4;

  // Company size (number of employees)
  google.protobuf.DoubleValue company_size = 5;

  // Website URL
  google.protobuf.StringValue website = 6;

  // Company description
  google.protobuf.StringValue description = 7;
}
