syntax = "proto3";

package telecom.customers.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/double_value.proto";
import "google/protobuf/string_value.proto";
import "telecom/customers/messages/customer_request.proto";
import "telecom/customers/messages/customer_response.proto";
import "telecom/customers/enums/customer_type.proto";
import "telecom/customers/enums/customer_status.proto";

// CustomerService provides comprehensive customer management functionality
service CustomerService {
  // Create a new customer account
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);

  // Retrieve a specific customer by ID
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);

  // List customers with optional filtering and pagination
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);

  // Update an existing customer
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);

  // Delete a customer account (soft delete - marks as cancelled)
  rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse);

  // Search customers by various criteria
  rpc SearchCustomers(SearchCustomersRequest) returns (SearchCustomersResponse);

  // Get customer summary information
  rpc GetCustomerSummary(GetCustomerSummaryRequest) returns (GetCustomerSummaryResponse);

  // Validate customer email uniqueness
  rpc ValidateEmail(ValidateEmailRequest) returns (ValidateEmailResponse);

  // Get customer activity history
  rpc GetCustomerActivity(GetCustomerActivityRequest) returns (GetCustomerActivityResponse);

  // Update customer status
  rpc UpdateCustomerStatus(UpdateCustomerStatusRequest) returns (UpdateCustomerStatusResponse);

  // Merge duplicate customer records
  rpc MergeCustomers(MergeCustomersRequest) returns (MergeCustomersResponse);

  // Export customer data
  rpc ExportCustomers(ExportCustomersRequest) returns (ExportCustomersResponse);
}

// SearchCustomersRequest represents a request to search customers
message SearchCustomersRequest {
  // Search query string
  string query = 1;

  // Search fields to include (name, email, phone, company_name)
  repeated string search_fields = 2;

  // Customer type filter
  telecom.customers.enums.CustomerType type = 3;

  // Customer status filter
  telecom.customers.enums.CustomerStatus status = 4;

  // Page number for pagination
  int32 page = 5;

  // Page size for pagination
  int32 page_size = 6;
}

// SearchCustomersResponse represents the search results
message SearchCustomersResponse {
  // List of matching customers
  repeated CustomerSummary customers = 1;

  // Total count of matches
  int32 total_count = 2;

  // Pagination info
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;

  // Search execution time in milliseconds
  int32 execution_time_ms = 6;
}

// GetCustomerSummaryRequest represents a request to get customer summary
message GetCustomerSummaryRequest {
  // Customer ID to get summary for
  string customer_id = 1;
}

// GetCustomerSummaryResponse represents the customer summary response
message GetCustomerSummaryResponse {
  // Customer summary information
  CustomerSummary summary = 1;
}

// ValidateEmailRequest represents a request to validate email uniqueness
message ValidateEmailRequest {
  // Email address to validate
  string email = 1;

  // Optional customer ID to exclude from validation (for updates)
  google.protobuf.StringValue exclude_customer_id = 2;
}

// ValidateEmailResponse represents the email validation response
message ValidateEmailResponse {
  // Whether the email is valid and unique
  bool is_valid = 1;

  // Whether the email is available (not taken)
  bool is_available = 2;

  // Validation message
  string message = 3;
}

// GetCustomerActivityRequest represents a request to get customer activity
message GetCustomerActivityRequest {
  // Customer ID to get activity for
  string customer_id = 1;

  // Date range for activity (optional)
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;

  // Activity types to include (optional)
  repeated string activity_types = 4;

  // Page number for pagination
  int32 page = 5;

  // Page size for pagination
  int32 page_size = 6;
}

// GetCustomerActivityResponse represents the customer activity response
message GetCustomerActivityResponse {
  // List of customer activities
  repeated CustomerActivity activities = 1;

  // Total count
  int32 total_count = 2;

  // Pagination info
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}

// UpdateCustomerStatusRequest represents a request to update customer status
message UpdateCustomerStatusRequest {
  // Customer ID to update
  string customer_id = 1;

  // New status
  telecom.customers.enums.CustomerStatus status = 2;

  // Reason for status change
  google.protobuf.StringValue reason = 3;

  // Effective date for status change
  google.protobuf.Timestamp effective_date = 4;
}

// UpdateCustomerStatusResponse represents the status update response
message UpdateCustomerStatusResponse {
  // Updated customer
  Customer customer = 1;

  // Success message
  string message = 2;
}

// MergeCustomersRequest represents a request to merge customer records
message MergeCustomersRequest {
  // Primary customer ID (the one to keep)
  string primary_customer_id = 1;

  // Secondary customer ID (the one to merge into primary)
  string secondary_customer_id = 2;

  // Merge strategy (keep_primary, keep_secondary, merge_data)
  string merge_strategy = 3;

  // Fields to merge from secondary customer
  repeated string merge_fields = 4;
}

// MergeCustomersResponse represents the merge response
message MergeCustomersResponse {
  // Merged customer record
  Customer merged_customer = 1;

  // Success message
  string message = 2;

  // Number of records affected by merge
  int32 records_affected = 3;
}

// ExportCustomersRequest represents a request to export customer data
message ExportCustomersRequest {
  // Customer IDs to export (empty means all)
  repeated string customer_ids = 1;

  // Export format (csv, json, xml)
  string format = 2;

  // Fields to include in export
  repeated string fields = 3;

  // Date range for customer creation
  google.protobuf.Timestamp created_after = 4;
  google.protobuf.Timestamp created_before = 5;

  // Customer type filter
  telecom.customers.enums.CustomerType type = 6;

  // Customer status filter
  telecom.customers.enums.CustomerStatus status = 7;
}

// ExportCustomersResponse represents the export response
message ExportCustomersResponse {
  // Export file URL or content
  string export_content = 1;

  // File name
  string file_name = 2;

  // File size in bytes
  int64 file_size = 3;

  // MIME type
  string mime_type = 4;

  // Number of records exported
  int32 record_count = 5;
}

// CustomerActivity represents a customer activity record
message CustomerActivity {
  // Activity ID
  string activity_id = 1;

  // Customer ID
  string customer_id = 1;

  // Activity type
  string activity_type = 3;

  // Activity description
  string description = 4;

  // Activity timestamp
  google.protobuf.Timestamp timestamp = 5;

  // Additional activity data
  google.protobuf.StringValue metadata = 6;

  // User or system that performed the activity
  string performed_by = 7;
}
