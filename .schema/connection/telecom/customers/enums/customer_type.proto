syntax = "proto3";

package telecom.customers.enums;

// CustomerType represents the classification of a customer account
enum CustomerType {
  // Unspecified type - should not be used in production
  CUSTOMER_TYPE_UNSPECIFIED = 0;

  // Individual consumer customer
  INDIVIDUAL = 1;

  // Business customer (small to medium enterprise)
  BUSINESS = 2;

  // Enterprise customer (large corporation)
  ENTERPRISE = 3;

  // Government customer
  GOVERNMENT = 4;

  // Non-profit organization customer
  NON_PROFIT = 5;

  // Educational institution customer
  EDUCATIONAL = 6;

  // Reseller or partner customer
  RESELLER = 7;

  // Wholesale customer
  WHOLESALE = 8;

  // Trial or demo customer
  TRIAL = 9;
}
