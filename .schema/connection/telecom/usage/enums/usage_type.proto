syntax = "proto3";

package telecom.usage.enums;

// UsageType represents the different types of telecom usage
enum UsageType {
  // Unspecified usage type - should not be used in production
  USAGE_TYPE_UNSPECIFIED = 0;

  // Voice call usage (minutes)
  VOICE = 1;

  // Data usage (bytes/GB)
  DATA = 2;

  // SMS text message usage (count)
  SMS = 3;

  // MMS multimedia message usage (count)
  MMS = 4;

  // Video call usage (minutes)
  VIDEO_CALL = 5;

  // Hotspot/tethering data usage
  HOTSPOT = 6;

  // International roaming usage
  ROAMING = 7;

  // Premium content usage
  PREMIUM_CONTENT = 8;

  // Voicemail usage
  VOICEMAIL = 9;

  // Call forwarding usage
  CALL_FORWARDING = 10;

  // Conference call usage
  CONFERENCE_CALL = 11;

  // Mobile hotspot usage
  MOBILE_HOTSPOT = 12;

  // 5G data usage
  DATA_5G = 13;

  // 4G LTE data usage
  DATA_4G = 14;

  // 3G data usage
  DATA_3G = 15;

  // WiFi calling usage
  WIFI_CALLING = 16;
}
