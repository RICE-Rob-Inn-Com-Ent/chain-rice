syntax = "proto3";

package integrations.external_apis.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "integrations/external_apis/enums/api_provider_type.proto";
import "integrations/external_apis/enums/api_auth_method.proto";
import "integrations/external_apis/enums/api_status.proto";

option go_package = "github.com/rice-dev/integrations/external_apis/messages";

// API Provider represents an external API service provider
message ApiProvider {
  // Unique provider identifier
  string provider_id = 1;

  // Provider basic information
  ApiProviderBasicInfo basic_info = 2;

  // Provider type and classification
  integrations.external_apis.enums.ApiProviderType provider_type = 3;

  // API configuration
  ApiProviderConfiguration configuration = 4;

  // Authentication configuration
  ApiProviderAuthentication authentication = 5;

  // Endpoint configuration
  ApiProviderEndpoints endpoints = 6;

  // Rate limiting and quotas
  ApiProviderRateLimits rate_limits = 7;

  // Security configuration
  ApiProviderSecurity security = 8;

  // Monitoring and health
  ApiProviderMonitoring monitoring = 9;

  // Status and health
  integrations.external_apis.enums.ApiStatus status = 10;

  // Timestamps
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp last_activity_at = 13;
}

// Provider basic information
message ApiProviderBasicInfo {
  string provider_name = 1;
  string company_name = 2;
  string description = 3;
  string website_url = 4;
  string documentation_url = 5;
  string support_url = 6;
  string logo_url = 7;

  // Contact information
  ApiContactInfo contact = 8;

  // Version information
  string api_version = 9;
  string sdk_version = 10;
  repeated string supported_versions = 11;

  // Categorization
  repeated string categories = 12;
  repeated string tags = 13;
  string tier = 14; // FREE, BASIC, PREMIUM, ENTERPRISE

  // Additional metadata
  map<string, string> custom_fields = 15;
}

// Contact information
message ApiContactInfo {
  string support_email = 1;
  string sales_email = 2;
  string technical_email = 3;
  string phone = 4;
  string address = 5;
  string timezone = 6;
  repeated string social_links = 7;
}

// API Provider configuration
message ApiProviderConfiguration {
  // Base configuration
  string base_url = 1;
  string api_prefix = 2;
  string default_content_type = 3;
  string default_accept = 4;
  string user_agent = 5;

  // Protocol settings
  string protocol = 6; // HTTP, HTTPS, GRPC, WEBSOCKET
  int32 timeout_seconds = 7;
  int32 connection_timeout_seconds = 8;
  int32 read_timeout_seconds = 9;
  int32 write_timeout_seconds = 10;

  // Request/Response settings
  bool enable_compression = 11;
  bool enable_retries = 12;
  int32 max_retries = 13;
  int32 retry_delay_seconds = 14;
  bool follow_redirects = 15;
  int32 max_redirects = 16;

  // Data format settings
  string request_format = 17; // JSON, XML, FORM, MULTIPART
  string response_format = 18;
  string encoding = 19; // UTF-8, ASCII, etc.

  // Custom configuration
  map<string, string> custom_config = 20;
  repeated string required_headers = 21;
  repeated string optional_headers = 22;
}

// API Provider authentication
message ApiProviderAuthentication {
  // Primary authentication method
  integrations.external_apis.enums.ApiAuthMethod primary_method = 1;

  // Supported authentication methods
  repeated integrations.external_apis.enums.ApiAuthMethod supported_methods = 2;

  // OAuth 2.0 configuration
  ApiOAuth2Config oauth2 = 3;

  // OAuth 1.0 configuration
  ApiOAuth1Config oauth1 = 4;

  // API Key configuration
  ApiKeyConfig api_key = 5;

  // JWT configuration
  ApiJwtConfig jwt = 6;

  // Basic authentication
  ApiBasicAuthConfig basic_auth = 7;

  // Certificate configuration
  ApiCertificateConfig certificate = 8;

  // Custom authentication
  ApiCustomAuthConfig custom_auth = 9;

  // Token management
  ApiTokenManagement token_management = 10;
}

// OAuth 2.0 configuration
message ApiOAuth2Config {
  string authorization_url = 1;
  string token_url = 2;
  string refresh_url = 3;
  string revoke_url = 4;
  string client_id = 5;
  string client_secret = 6; // Usually encrypted
  repeated string scopes = 7;
  string grant_type = 8;
  string redirect_uri = 9;
  int32 token_expiry_seconds = 10;
  int32 refresh_expiry_seconds = 11;
  bool auto_refresh = 12;
  string state_parameter = 13;
  repeated string additional_parameters = 14;
}

// OAuth 1.0 configuration
message ApiOAuth1Config {
  string request_token_url = 1;
  string authorization_url = 2;
  string access_token_url = 3;
  string consumer_key = 4;
  string consumer_secret = 5; // Usually encrypted
  string token = 6;
  string token_secret = 7; // Usually encrypted
  string signature_method = 8; // HMAC-SHA1, RSA-SHA1, PLAINTEXT
  string realm = 9;
  string callback_url = 10;
}

// API Key configuration
message ApiKeyConfig {
  string key_name = 1;
  string key_value = 2; // Usually encrypted
  string key_location = 3; // HEADER, QUERY, BODY
  string key_format = 4; // BEARER, API_KEY, CUSTOM
  string custom_header_name = 5;
  string custom_query_name = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool auto_rotate = 8;
  int32 rotation_days = 9;
}

// JWT configuration
message ApiJwtConfig {
  string secret_key = 1; // Usually encrypted
  string algorithm = 2; // HS256, RS256, etc.
  string issuer = 3;
  string audience = 4;
  int32 expiry_seconds = 5;
  string key_id = 6;
  string public_key = 7;
  string private_key = 8; // Usually encrypted
  map<string, string> custom_claims = 9;
}

// Basic authentication configuration
message ApiBasicAuthConfig {
  string username = 1;
  string password = 2; // Usually encrypted
  string realm = 3;
  bool preemptive = 4;
}

// Certificate configuration
message ApiCertificateConfig {
  string certificate_path = 1;
  string private_key_path = 2;
  string ca_certificate_path = 3;
  string certificate_password = 4; // Usually encrypted
  bool verify_ssl = 5;
  bool verify_hostname = 6;
  repeated string allowed_ciphers = 7;
  string ssl_version = 8;
}

// Custom authentication configuration
message ApiCustomAuthConfig {
  string auth_type = 1;
  map<string, string> parameters = 2;
  string custom_header_name = 3;
  string custom_header_value = 4;
  string custom_query_name = 5;
  string custom_query_value = 6;
  string custom_body_field = 7;
  string custom_body_value = 8;
}

// Token management
message ApiTokenManagement {
  bool auto_refresh = 1;
  int32 refresh_threshold_seconds = 2;
  string refresh_strategy = 3; // PROACTIVE, REACTIVE
  bool store_tokens = 4;
  string token_storage_key = 5;
  int32 max_token_age_seconds = 6;
  bool revoke_on_logout = 7;
}

// API Provider endpoints
message ApiProviderEndpoints {
  // Primary endpoints
  string base_url = 1;
  string health_check_url = 2;
  string status_url = 3;
  string version_url = 4;

  // API endpoints
  repeated ApiEndpoint endpoints = 5;

  // Webhook endpoints
  repeated ApiWebhookEndpoint webhook_endpoints = 6;

  // Discovery endpoints
  repeated ApiDiscoveryEndpoint discovery_endpoints = 7;

  // Custom endpoints
  map<string, string> custom_endpoints = 8;
}

// API Endpoint
message ApiEndpoint {
  string endpoint_id = 1;
  string name = 2;
  string description = 3;
  string url = 4;
  string method = 5; // GET, POST, PUT, DELETE, PATCH
  string version = 6;
  bool is_deprecated = 7;
  google.protobuf.Timestamp deprecation_date = 8;
  string replacement_endpoint = 9;

  // Request configuration
  ApiEndpointRequest request = 10;

  // Response configuration
  ApiEndpointResponse response = 11;

  // Rate limiting
  ApiEndpointRateLimit rate_limit = 12;

  // Authentication
  repeated integrations.external_apis.enums.ApiAuthMethod auth_methods = 13;

  // Parameters
  repeated ApiParameter parameters = 14;

  // Headers
  repeated ApiHeader headers = 15;

  // Examples
  repeated ApiExample examples = 16;
}

// API Webhook Endpoint
message ApiWebhookEndpoint {
  string endpoint_id = 1;
  string name = 2;
  string description = 3;
  string url = 4;
  string method = 5;
  repeated string events = 6;
  string secret = 7; // Usually encrypted
  bool is_active = 8;
  int32 timeout_seconds = 9;
  int32 retry_count = 10;
  string retry_strategy = 11;
}

// API Discovery Endpoint
message ApiDiscoveryEndpoint {
  string endpoint_id = 1;
  string name = 2;
  string description = 3;
  string url = 4;
  string format = 5; // OPENAPI, SWAGGER, WADL, etc.
  string version = 6;
  bool is_primary = 7;
}

// API Endpoint Request
message ApiEndpointRequest {
  string content_type = 1;
  repeated ApiParameter body_parameters = 2;
  repeated ApiParameter query_parameters = 3;
  repeated ApiParameter path_parameters = 4;
  repeated ApiHeader headers = 5;
  string example_body = 6;
  repeated string required_fields = 7;
  repeated string optional_fields = 8;
}

// API Endpoint Response
message ApiEndpointResponse {
  repeated int32 status_codes = 1;
  string content_type = 2;
  repeated ApiResponseSchema schemas = 3;
  repeated ApiErrorResponse error_responses = 4;
  string example_response = 5;
}

// API Parameter
message ApiParameter {
  string name = 1;
  string type = 2; // STRING, INTEGER, BOOLEAN, ARRAY, OBJECT
  string description = 3;
  bool required = 4;
  string default_value = 5;
  repeated string allowed_values = 6;
  string validation_pattern = 7;
  int32 min_length = 8;
  int32 max_length = 9;
  double min_value = 10;
  double max_value = 11;
  string example = 12;
}

// API Header
message ApiHeader {
  string name = 1;
  string value = 2;
  bool required = 3;
  string description = 4;
  string example = 5;
}

// API Example
message ApiExample {
  string name = 1;
  string description = 2;
  string request_example = 3;
  string response_example = 4;
  map<string, string> parameters = 5;
}

// API Response Schema
message ApiResponseSchema {
  int32 status_code = 1;
  string content_type = 2;
  string schema = 3; // JSON Schema or similar
  string description = 4;
  repeated string required_fields = 5;
}

// API Error Response
message ApiErrorResponse {
  int32 status_code = 1;
  string error_code = 2;
  string error_message = 3;
  string description = 4;
  repeated string possible_causes = 5;
  repeated string solutions = 6;
}

// API Endpoint Rate Limit
message ApiEndpointRateLimit {
  int32 requests_per_minute = 1;
  int32 requests_per_hour = 2;
  int32 requests_per_day = 3;
  int32 burst_limit = 4;
  string rate_limit_header = 5;
  string reset_header = 6;
  string remaining_header = 7;
}

// API Provider rate limits
message ApiProviderRateLimits {
  // Global rate limits
  int32 global_requests_per_minute = 1;
  int32 global_requests_per_hour = 2;
  int32 global_requests_per_day = 3;
  int32 global_requests_per_month = 4;

  // Burst limits
  int32 burst_limit = 5;
  int32 burst_window_seconds = 6;

  // Quota limits
  int32 quota_limit = 7;
  string quota_period = 8; // HOUR, DAY, MONTH
  int32 quota_remaining = 9;
  google.protobuf.Timestamp quota_reset_at = 10;

  // Rate limit headers
  string limit_header = 11;
  string remaining_header = 12;
  string reset_header = 13;
  string retry_after_header = 14;

  // Rate limit strategies
  string rate_limit_strategy = 15; // FIXED_WINDOW, SLIDING_WINDOW, TOKEN_BUCKET
  bool respect_retry_after = 16;
  int32 max_retry_delay_seconds = 17;
}

// API Provider security
message ApiProviderSecurity {
  // SSL/TLS configuration
  bool require_ssl = 1;
  string ssl_version = 2;
  bool verify_ssl_certificate = 3;
  bool verify_hostname = 4;
  repeated string allowed_ciphers = 5;

  // IP restrictions
  repeated string allowed_ips = 6;
  repeated string blocked_ips = 7;

  // User agent restrictions
  repeated string allowed_user_agents = 8;
  repeated string blocked_user_agents = 9;

  // Request signing
  bool require_request_signing = 10;
  string signing_algorithm = 11;
  string signing_key = 12; // Usually encrypted

  // Encryption
  bool require_encryption = 13;
  string encryption_algorithm = 14;
  string encryption_key = 15; // Usually encrypted

  // Security headers
  map<string, string> security_headers = 16;

  // CORS configuration
  ApiCorsConfig cors = 17;

  // Content Security Policy
  string content_security_policy = 18;
}

// CORS configuration
message ApiCorsConfig {
  repeated string allowed_origins = 1;
  repeated string allowed_methods = 2;
  repeated string allowed_headers = 3;
  repeated string exposed_headers = 4;
  bool allow_credentials = 5;
  int32 max_age_seconds = 6;
}

// API Provider monitoring
message ApiProviderMonitoring {
  // Health check configuration
  bool enable_health_checks = 1;
  int32 health_check_interval_seconds = 2;
  int32 health_check_timeout_seconds = 3;
  string health_check_endpoint = 4;
  repeated string health_check_headers = 5;

  // Performance monitoring
  bool enable_performance_monitoring = 6;
  int32 performance_sample_rate = 7; // Percentage
  repeated string performance_metrics = 8;

  // Error monitoring
  bool enable_error_monitoring = 9;
  repeated string error_alert_emails = 10;
  repeated string error_alert_webhooks = 11;

  // Logging configuration
  bool enable_request_logging = 12;
  bool enable_response_logging = 13;
  bool enable_error_logging = 14;
  string log_level = 15; // DEBUG, INFO, WARN, ERROR
  int32 log_retention_days = 16;

  // Alerting configuration
  repeated ApiAlertRule alert_rules = 17;

  // Metrics collection
  repeated string collected_metrics = 18;
  int32 metrics_retention_days = 19;
}

// API Alert Rule
message ApiAlertRule {
  string rule_id = 1;
  string rule_name = 2;
  string rule_type = 3; // ERROR_RATE, RESPONSE_TIME, AVAILABILITY
  string condition = 4;
  double threshold = 5;
  string comparison_operator = 6; // GREATER_THAN, LESS_THAN, EQUALS
  int32 evaluation_period_seconds = 7;
  int32 alert_cooldown_seconds = 8;
  repeated string notification_channels = 9;
  bool is_active = 10;
}

// API Provider search/filter criteria
message ApiProviderFilter {
  repeated string provider_ids = 1;
  repeated integrations.external_apis.enums.ApiProviderType provider_types = 2;
  repeated integrations.external_apis.enums.ApiStatus statuses = 3;
  repeated string categories = 4;
  repeated string tags = 5;
  repeated string tiers = 6;
  google.protobuf.Timestamp created_from = 7;
  google.protobuf.Timestamp created_to = 8;
  google.protobuf.Timestamp last_activity_from = 9;
  google.protobuf.Timestamp last_activity_to = 10;
  string search_text = 11;
  bool has_health_checks = 12;
  bool has_monitoring = 13;
  int32 limit = 14;
  int32 offset = 15;
  string sort_by = 16;
  string sort_order = 17; // ASC, DESC
}

// API Provider list response
message ApiProviderList {
  repeated ApiProvider providers = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
  bool has_next_page = 5;
  bool has_previous_page = 6;
}
