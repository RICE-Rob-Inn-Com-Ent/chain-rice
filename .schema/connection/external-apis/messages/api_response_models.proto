syntax = "proto3";

package integrations.external_apis.messages;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/rice-dev/integrations/external_apis/messages";

// API Response represents a response from an external API
message ApiResponse {
  // Unique response identifier
  string response_id = 1;

  // Associated request identifier
  string request_id = 1;

  // Provider information
  string provider_id = 3;
  string endpoint_id = 4;

  // Response status
  ApiResponseStatus status = 5;

  // Response data
  ApiResponseData data = 6;

  // Response headers
  repeated ApiResponseHeader headers = 7;

  // Response metadata
  ApiResponseMetadata metadata = 8;

  // Performance metrics
  ApiResponsePerformance performance = 9;

  // Error information
  ApiResponseError error = 10;

  // Timestamps
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp received_at = 12;
  google.protobuf.Timestamp processed_at = 13;
}

// API Response Status
message ApiResponseStatus {
  // HTTP status
  int32 status_code = 1;
  string status_text = 2;
  string status_category = 3; // SUCCESS, CLIENT_ERROR, SERVER_ERROR, REDIRECT, INFORMATIONAL

  // Response status
  string response_status = 4; // SUCCESS, FAILED, TIMEOUT, CANCELLED, RETRY
  string processing_status = 5; // PENDING, PROCESSING, COMPLETED, FAILED

  // Business status
  string business_status = 6; // SUCCESS, WARNING, ERROR, PARTIAL_SUCCESS
  string result_code = 7;
  string result_message = 8;

  // Error status
  bool has_error = 9;
  bool has_warning = 10;
  bool is_retryable = 11;
  bool is_final = 12;
}

// API Response Data
message ApiResponseData {
  // Content type
  string content_type = 1;
  string charset = 2;
  string encoding = 3;

  // Content
  string content = 4;
  bytes binary_content = 5;
  google.protobuf.Any structured_content = 6;

  // Content information
  int64 content_length = 7;
  string content_disposition = 8;
  string content_encoding = 9;
  string content_language = 10;
  string content_range = 11;

  // Parsed content
  ApiParsedContent parsed_content = 12;

  // Content validation
  bool is_valid = 13;
  repeated string validation_errors = 14;
  repeated string validation_warnings = 15;
}

// API Parsed Content
message ApiParsedContent {
  // JSON content
  string json_content = 1;
  map<string, google.protobuf.Any> json_object = 2;
  repeated google.protobuf.Any json_array = 3;

  // XML content
  string xml_content = 4;
  string xml_root_element = 5;
  map<string, string> xml_attributes = 6;

  // Form data
  repeated ApiFormField form_fields = 7;

  // Multipart content
  repeated ApiMultipartField multipart_fields = 8;

  // Custom parsed content
  map<string, google.protobuf.Any> custom_parsed = 9;
}

// API Response Header
message ApiResponseHeader {
  string name = 1;
  string value = 2;
  string description = 3;
  bool is_sensitive = 4;
  repeated string values = 5; // For multiple values
}

// API Response Metadata
message ApiResponseMetadata {
  // Response tracking
  string trace_id = 1;
  string span_id = 2;
  string correlation_id = 3;
  string session_id = 4;

  // Response source
  string provider_name = 5;
  string endpoint_name = 6;
  string api_version = 7;
  string response_version = 8;

  // Response context
  string request_method = 9;
  string request_url = 10;
  string user_agent = 11;
  string client_ip = 12;

  // Response lifecycle
  string response_stage = 13; // RECEIVED, PARSING, VALIDATING, PROCESSING, COMPLETED
  string processing_status = 14; // PENDING, IN_PROGRESS, SUCCESS, FAILED, CANCELLED

  // Response classification
  string data_classification = 15; // PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED
  string response_type = 16; // DATA, ERROR, REDIRECT, AUTHENTICATION, etc.
  string business_context = 17;

  // Compliance and audit
  bool requires_audit = 18;
  string audit_category = 19;
  repeated string compliance_tags = 20;
  string retention_policy = 21;

  // Custom metadata
  map<string, string> custom_metadata = 22;
  map<string, google.protobuf.Any> custom_objects = 23;
}

// API Response Performance
message ApiResponsePerformance {
  // Timing metrics
  int64 total_duration_ms = 1;
  int64 connection_time_ms = 2;
  int64 dns_lookup_time_ms = 3;
  int64 tls_handshake_time_ms = 4;
  int64 request_time_ms = 5;
  int64 response_time_ms = 6;
  int64 processing_time_ms = 7;

  // Network metrics
  int64 bytes_sent = 8;
  int64 bytes_received = 9;
  int64 request_size_bytes = 10;
  int64 response_size_bytes = 11;
  double compression_ratio = 12;

  // Performance indicators
  bool is_slow_response = 13;
  bool is_timeout = 14;
  bool is_retry = 15;
  int32 retry_count = 16;
  double response_rate = 17; // requests per second

  // Resource usage
  double cpu_usage_percent = 18;
  int64 memory_usage_bytes = 19;
  int64 disk_usage_bytes = 20;
  int32 network_connections = 21;

  // Custom performance metrics
  map<string, int64> custom_metrics = 22;
}

// API Response Error
message ApiResponseError {
  // Error classification
  string error_type = 1; // NETWORK, HTTP, AUTHENTICATION, AUTHORIZATION, VALIDATION, BUSINESS, SYSTEM
  string error_category = 2; // CLIENT_ERROR, SERVER_ERROR, TIMEOUT, RATE_LIMIT, QUOTA_EXCEEDED
  string error_code = 3;
  string error_message = 4;
  string error_description = 5;

  // Error details
  string error_source = 6; // PROVIDER, GATEWAY, CLIENT, NETWORK
  string error_context = 7;
  string error_stack_trace = 8;
  map<string, string> error_context_data = 9;

  // Error handling
  bool is_retryable = 10;
  bool is_recoverable = 11;
  int32 retry_count = 12;
  int32 max_retries = 13;
  google.protobuf.Timestamp next_retry_at = 14;
  string retry_strategy = 15;

  // Error resolution
  repeated string possible_causes = 16;
  repeated string suggested_solutions = 17;
  string resolution_status = 18; // UNRESOLVED, IN_PROGRESS, RESOLVED, ESCALATED
  string resolution_notes = 19;

  // Error impact
  string impact_level = 20; // LOW, MEDIUM, HIGH, CRITICAL
  bool affects_other_requests = 21;
  repeated string affected_components = 22;

  // Error tracking
  string error_id = 23;
  string parent_error_id = 24;
  repeated string related_error_ids = 25;
  google.protobuf.Timestamp first_occurred_at = 26;
  google.protobuf.Timestamp last_occurred_at = 27;
  int32 occurrence_count = 28;
}

// API Response Summary
message ApiResponseSummary {
  // Basic information
  string response_id = 1;
  string request_id = 2;
  string provider_id = 3;
  string endpoint_id = 4;

  // Status summary
  int32 status_code = 5;
  string status_text = 6;
  bool is_success = 7;
  bool has_error = 8;
  bool has_warning = 9;

  // Performance summary
  int64 duration_ms = 10;
  int64 response_size_bytes = 11;
  bool is_slow_response = 12;
  bool is_timeout = 13;

  // Error summary
  string error_type = 14;
  string error_message = 15;
  bool is_retryable = 16;
  int32 retry_count = 17;

  // Timestamps
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp received_at = 19;
  google.protobuf.Timestamp processed_at = 20;
}

// API Response Statistics
message ApiResponseStatistics {
  // Time period
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;

  // Count statistics
  int32 total_responses = 3;
  int32 successful_responses = 4;
  int32 failed_responses = 5;
  int32 timeout_responses = 6;
  int32 retry_responses = 7;

  // Rate statistics
  double success_rate = 8;
  double failure_rate = 9;
  double timeout_rate = 10;
  double retry_rate = 11;

  // Performance statistics
  int64 average_duration_ms = 12;
  int64 min_duration_ms = 13;
  int64 max_duration_ms = 14;
  int64 p50_duration_ms = 15;
  int64 p90_duration_ms = 16;
  int64 p95_duration_ms = 17;
  int64 p99_duration_ms = 18;

  // Size statistics
  int64 average_response_size_bytes = 19;
  int64 min_response_size_bytes = 20;
  int64 max_response_size_bytes = 21;

  // Error statistics
  map<string, int32> error_type_counts = 22;
  map<string, int32> status_code_counts = 23;
  repeated string top_errors = 24;

  // Provider statistics
  map<string, int32> provider_counts = 25;
  map<string, int32> endpoint_counts = 26;

  // Time-based statistics
  repeated ApiResponseTimeSeries time_series = 27;
}

// API Response Time Series
message ApiResponseTimeSeries {
  google.protobuf.Timestamp timestamp = 1;
  int32 response_count = 2;
  int32 success_count = 3;
  int32 error_count = 4;
  int64 average_duration_ms = 5;
  double success_rate = 6;
  string granularity = 7; // MINUTE, HOUR, DAY
}

// API Response Filter
message ApiResponseFilter {
  repeated string response_ids = 1;
  repeated string request_ids = 2;
  repeated string provider_ids = 3;
  repeated string endpoint_ids = 4;
  repeated int32 status_codes = 5;
  repeated string status_categories = 6;
  repeated string response_statuses = 7;
  repeated string business_statuses = 8;
  repeated string error_types = 9;
  repeated string error_categories = 10;
  repeated string error_codes = 11;
  bool has_error = 12;
  bool has_warning = 13;
  bool is_retryable = 14;
  bool is_success = 15;
  bool is_timeout = 16;
  bool is_retry = 17;
  google.protobuf.Timestamp created_from = 18;
  google.protobuf.Timestamp created_to = 19;
  google.protobuf.Timestamp received_from = 20;
  google.protobuf.Timestamp received_to = 21;
  int64 min_duration_ms = 22;
  int64 max_duration_ms = 23;
  int64 min_response_size_bytes = 24;
  int64 max_response_size_bytes = 25;
  string search_text = 26;
  int32 limit = 27;
  int32 offset = 28;
  string sort_by = 29;
  string sort_order = 30; // ASC, DESC
}

// API Response List
message ApiResponseList {
  repeated ApiResponse responses = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
  bool has_next_page = 5;
  bool has_previous_page = 6;
}

// API Response Template
message ApiResponseTemplate {
  string template_id = 1;
  string template_name = 2;
  string template_description = 3;
  string provider_id = 4;
  string endpoint_id = 5;

  // Template configuration
  int32 expected_status_code = 6;
  string expected_content_type = 7;
  string response_schema = 8;
  repeated ApiResponseHeader expected_headers = 9;
  repeated string required_fields = 10;
  repeated string optional_fields = 11;

  // Template metadata
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string version = 15;
  bool is_active = 16;
  repeated string tags = 17;
  map<string, string> custom_fields = 18;
}

// API Response Validation
message ApiResponseValidation {
  string validation_id = 1;
  string response_id = 2;
  string validation_type = 3; // SCHEMA, BUSINESS_RULES, COMPLIANCE, CUSTOM

  // Validation configuration
  string schema = 4;
  repeated string validation_rules = 5;
  map<string, string> custom_validations = 6;

  // Validation results
  bool is_valid = 7;
  repeated ApiValidationError validation_errors = 8;
  repeated ApiValidationWarning validation_warnings = 9;
  double validation_score = 10;

  // Validation metadata
  google.protobuf.Timestamp validated_at = 11;
  string validated_by = 12;
  int64 validation_duration_ms = 13;
  map<string, string> validation_context = 14;
}

// API Validation Error
message ApiValidationError {
  string error_code = 1;
  string error_message = 2;
  string field_path = 3;
  string expected_value = 4;
  string actual_value = 5;
  string error_type = 6; // SCHEMA, REQUIRED, FORMAT, RANGE, CUSTOM
  string severity = 7; // LOW, MEDIUM, HIGH, CRITICAL
  map<string, string> error_context = 8;
}

// API Validation Warning
message ApiValidationWarning {
  string warning_code = 1;
  string warning_message = 2;
  string field_path = 3;
  string warning_type = 4;
  string severity = 5; // LOW, MEDIUM, HIGH
  map<string, string> warning_context = 6;
}
