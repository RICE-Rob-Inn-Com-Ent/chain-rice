syntax = "proto3";

package integrations.external_apis.enums;

option go_package = "github.com/rice-dev/integrations/external_apis/enums";

// API Status for tracking the operational state of external APIs
enum ApiStatus {
  API_STATUS_UNSPECIFIED = 0;

  // Active States
  API_STATUS_ACTIVE = 1;                    // API is active and operational
  API_STATUS_AVAILABLE = 2;                 // API is available for use
  API_STATUS_ONLINE = 3;                    // API is online and responding
  API_STATUS_OPERATIONAL = 4;               // API is fully operational

  // Inactive States
  API_STATUS_INACTIVE = 10;                 // API is inactive but configured
  API_STATUS_OFFLINE = 11;                  // API is offline
  API_STATUS_UNAVAILABLE = 12;              // API is temporarily unavailable
  API_STATUS_MAINTENANCE = 13;              // API is under maintenance
  API_STATUS_SUSPENDED = 14;                // API access is suspended

  // Error States
  API_STATUS_ERROR = 20;                    // API has encountered an error
  API_STATUS_FAILED = 21;                   // API has failed
  API_STATUS_TIMEOUT = 22;                  // API is timing out
  API_STATUS_RATE_LIMITED = 23;             // API is rate limited
  API_STATUS_QUOTA_EXCEEDED = 24;           // API quota exceeded
  API_STATUS_AUTHENTICATION_ERROR = 25;     // Authentication failed
  API_STATUS_AUTHORIZATION_ERROR = 26;      // Authorization failed
  API_STATUS_VALIDATION_ERROR = 27;         // Request validation failed
  API_STATUS_SERVER_ERROR = 28;             // Server error (5xx)
  API_STATUS_CLIENT_ERROR = 29;             // Client error (4xx)

  // Configuration States
  API_STATUS_CONFIGURED = 30;               // API is configured but not active
  API_STATUS_PENDING = 31;                  // API configuration is pending
  API_STATUS_SETUP = 32;                    // API is being set up
  API_STATUS_INITIALIZING = 33;             // API is initializing
  API_STATUS_CONNECTING = 34;               // API is connecting
  API_STATUS_AUTHENTICATING = 35;           // API is authenticating
  API_STATUS_TESTING = 36;                  // API is being tested
  API_STATUS_VALIDATING = 37;               // API configuration is being validated

  // Deprecated States
  API_STATUS_DEPRECATED = 40;               // API is deprecated
  API_STATUS_LEGACY = 41;                   // API is legacy
  API_STATUS_SUNSET = 42;                   // API is being sunset
  API_STATUS_DISCONTINUED = 43;             // API is discontinued
  API_STATUS_END_OF_LIFE = 44;              // API has reached end of life

  // Health States
  API_STATUS_HEALTHY = 50;                  // API is healthy
  API_STATUS_DEGRADED = 51;                 // API performance is degraded
  API_STATUS_UNHEALTHY = 52;                // API is unhealthy
  API_STATUS_CRITICAL = 53;                 // API is in critical state
  API_STATUS_WARNING = 54;                  // API has warnings
  API_STATUS_RECOVERING = 55;               // API is recovering from issues

  // Capacity States
  API_STATUS_OVERLOADED = 60;               // API is overloaded
  API_STATUS_UNDER_LOAD = 61;               // API is under normal load
  API_STATUS_SCALING = 62;                  // API is scaling up/down
  API_STATUS_CAPACITY_EXCEEDED = 63;        // API capacity exceeded

  // Security States
  API_STATUS_SECURE = 70;                   // API is secure
  API_STATUS_INSECURE = 71;                 // API has security issues
  API_STATUS_BLOCKED = 72;                  // API access is blocked
  API_STATUS_RESTRICTED = 73;               // API access is restricted
  API_STATUS_QUARANTINED = 74;              // API is quarantined

  // Version States
  API_STATUS_CURRENT = 80;                  // API is current version
  API_STATUS_OUTDATED = 81;                 // API version is outdated
  API_STATUS_UPGRADING = 82;                // API is being upgraded
  API_STATUS_DOWNGRADING = 83;              // API is being downgraded
  API_STATUS_VERSION_MISMATCH = 84;         // API version mismatch

  // Integration States
  API_STATUS_INTEGRATED = 90;               // API is integrated
  API_STATUS_INTEGRATING = 91;              // API integration in progress
  API_STATUS_INTEGRATION_FAILED = 92;       // API integration failed
  API_STATUS_DISCONNECTED = 93;             // API is disconnected
  API_STATUS_RECONNECTING = 94;             // API is reconnecting

  // Monitoring States
  API_STATUS_MONITORED = 100;               // API is being monitored
  API_STATUS_UNMONITORED = 101;             // API is not monitored
  API_STATUS_ALERTING = 102;                // API is alerting
  API_STATUS_SILENT = 103;                  // API alerts are silenced

  // Custom States
  API_STATUS_CUSTOM = 200;                  // Custom status
  API_STATUS_UNKNOWN = 201;                 // Status is unknown
  API_STATUS_UNDEFINED = 202;               // Status is undefined
}
