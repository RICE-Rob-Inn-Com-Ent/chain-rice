syntax = "proto3";

package integrations.webhooks.enums;

option go_package = "github.com/rice-dev/integrations/webhooks/enums";

// Webhook Status for tracking webhook subscription and delivery states
enum WebhookStatus {
  WEBHOOK_STATUS_UNSPECIFIED = 0;

  // Subscription States
  WEBHOOK_STATUS_ACTIVE = 1;                // Webhook is active and ready to receive events
  WEBHOOK_STATUS_INACTIVE = 2;              // Webhook is inactive but configured
  WEBHOOK_STATUS_PENDING = 3;               // Webhook subscription is pending activation
  WEBHOOK_STATUS_VERIFICATION_PENDING = 4;  // Webhook is pending verification
  WEBHOOK_STATUS_VERIFIED = 5;              // Webhook has been verified
  WEBHOOK_STATUS_SUSPENDED = 6;             // Webhook is suspended
  WEBHOOK_STATUS_DISABLED = 7;              // Webhook is disabled
  WEBHOOK_STATUS_DELETED = 8;               // Webhook has been deleted

  // Delivery States
  WEBHOOK_STATUS_DELIVERING = 10;           // Webhook is currently being delivered
  WEBHOOK_STATUS_DELIVERED = 11;            // Webhook was successfully delivered
  WEBHOOK_STATUS_FAILED = 12;               // Webhook delivery failed
  WEBHOOK_STATUS_RETRYING = 13;             // Webhook is being retried
  WEBHOOK_STATUS_EXPIRED = 14;              // Webhook delivery expired
  WEBHOOK_STATUS_CANCELLED = 15;            // Webhook delivery was cancelled
  WEBHOOK_STATUS_TIMEOUT = 16;              // Webhook delivery timed out

  // Error States
  WEBHOOK_STATUS_AUTHENTICATION_ERROR = 20; // Authentication failed
  WEBHOOK_STATUS_AUTHORIZATION_ERROR = 21;  // Authorization failed
  WEBHOOK_STATUS_VALIDATION_ERROR = 22;     // Request validation failed
  WEBHOOK_STATUS_FORMAT_ERROR = 23;         // Request format error
  WEBHOOK_STATUS_NETWORK_ERROR = 24;        // Network connectivity error
  WEBHOOK_STATUS_SERVER_ERROR = 25;         // Server error (5xx)
  WEBHOOK_STATUS_CLIENT_ERROR = 26;         // Client error (4xx)
  WEBHOOK_STATUS_RATE_LIMITED = 27;         // Rate limited
  WEBHOOK_STATUS_QUOTA_EXCEEDED = 28;       // Quota exceeded

  // Processing States
  WEBHOOK_STATUS_QUEUED = 30;               // Webhook is queued for processing
  WEBHOOK_STATUS_PROCESSING = 31;           // Webhook is being processed
  WEBHOOK_STATUS_PROCESSED = 32;            // Webhook has been processed
  WEBHOOK_STATUS_PROCESSING_FAILED = 33;    // Webhook processing failed
  WEBHOOK_STATUS_VALIDATING = 34;           // Webhook is being validated
  WEBHOOK_STATUS_VALIDATED = 35;            // Webhook has been validated
  WEBHOOK_STATUS_VALIDATION_FAILED = 36;    // Webhook validation failed

  // Retry States
  WEBHOOK_STATUS_RETRY_SCHEDULED = 40;      // Retry has been scheduled
  WEBHOOK_STATUS_RETRY_IN_PROGRESS = 41;    // Retry is in progress
  WEBHOOK_STATUS_RETRY_EXHAUSTED = 42;      // All retry attempts exhausted
  WEBHOOK_STATUS_RETRY_CANCELLED = 43;      // Retry was cancelled
  WEBHOOK_STATUS_RETRY_PAUSED = 44;         // Retry is paused

  // Health States
  WEBHOOK_STATUS_HEALTHY = 50;              // Webhook is healthy
  WEBHOOK_STATUS_DEGRADED = 51;             // Webhook performance is degraded
  WEBHOOK_STATUS_UNHEALTHY = 52;            // Webhook is unhealthy
  WEBHOOK_STATUS_CRITICAL = 53;             // Webhook is in critical state
  WEBHOOK_STATUS_WARNING = 54;              // Webhook has warnings
  WEBHOOK_STATUS_RECOVERING = 55;           // Webhook is recovering from issues

  // Maintenance States
  WEBHOOK_STATUS_MAINTENANCE = 60;          // Webhook is under maintenance
  WEBHOOK_STATUS_UPDATING = 61;             // Webhook is being updated
  WEBHOOK_STATUS_MIGRATING = 62;            // Webhook is being migrated
  WEBHOOK_STATUS_ROLLING_BACK = 63;         // Webhook is being rolled back
  WEBHOOK_STATUS_DEPRECATED = 64;           // Webhook is deprecated
  WEBHOOK_STATUS_END_OF_LIFE = 65;          // Webhook has reached end of life

  // Security States
  WEBHOOK_STATUS_SECURE = 70;               // Webhook is secure
  WEBHOOK_STATUS_INSECURE = 71;             // Webhook has security issues
  WEBHOOK_STATUS_BLOCKED = 72;              // Webhook access is blocked
  WEBHOOK_STATUS_RESTRICTED = 73;           // Webhook access is restricted
  WEBHOOK_STATUS_QUARANTINED = 74;          // Webhook is quarantined
  WEBHOOK_STATUS_SUSPICIOUS = 75;           // Webhook activity is suspicious

  // Configuration States
  WEBHOOK_STATUS_CONFIGURED = 80;           // Webhook is configured
  WEBHOOK_STATUS_CONFIGURING = 81;          // Webhook is being configured
  WEBHOOK_STATUS_CONFIGURATION_ERROR = 82;  // Webhook configuration error
  WEBHOOK_STATUS_CONFIGURATION_PENDING = 83; // Webhook configuration pending
  WEBHOOK_STATUS_CONFIGURATION_VALIDATED = 84; // Webhook configuration validated
  WEBHOOK_STATUS_CONFIGURATION_INVALID = 85; // Webhook configuration invalid

  // Monitoring States
  WEBHOOK_STATUS_MONITORED = 90;            // Webhook is being monitored
  WEBHOOK_STATUS_UNMONITORED = 91;          // Webhook is not monitored
  WEBHOOK_STATUS_ALERTING = 92;             // Webhook is alerting
  WEBHOOK_STATUS_SILENT = 93;               // Webhook alerts are silenced
  WEBHOOK_STATUS_DEBUGGING = 94;            // Webhook is in debug mode
  WEBHOOK_STATUS_TRACING = 95;              // Webhook tracing is enabled

  // Custom States
  WEBHOOK_STATUS_CUSTOM = 200;              // Custom status
  WEBHOOK_STATUS_UNKNOWN = 201;             // Status is unknown
  WEBHOOK_STATUS_UNDEFINED = 202;           // Status is undefined
}
