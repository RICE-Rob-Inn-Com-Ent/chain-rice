syntax = "proto3";

package com.auth.enums;

// AuthStatus enumerates outcomes of authentication attempts and session state.
enum AuthStatus {
  UNSPECIFIED = 0;  // Unspecified status
  AUTHENTICATED = 1;  // Successfully authenticated
  INVALID_CREDENTIALS = 2;  // Wrong username/password
  LOCKED = 3; // Account locked or disabled
  MFA_REQUIRED = 4; // Multi-factor authentication required
  EXPIRED = 5;  // Session or token expired
  FORBIDDEN = 6;  // Permission denied
}
