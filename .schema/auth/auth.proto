syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "github.com/rice-dev/stacks/backend/GOmain/modules/auth/proto";

// Auth service definition
service AuthService {
  // User authentication
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // User management
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // Permission management
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GrantPermission(GrantPermissionRequest) returns (GrantPermissionResponse);
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse);

  // Session management
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
}

// User message
message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string password_hash = 4;
  repeated string roles = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp last_login = 9;
}

// Session message
message Session {
  string id = 1;
  string user_id = 2;
  string access_token = 3;
  string refresh_token = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
  string ip_address = 7;
  string user_agent = 8;
}

// Permission message
message Permission {
  string id = 1;
  string name = 2;
  string resource = 3;
  string action = 4;
  string description = 5;
}

// Role message
message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
}

// Login request/response
message LoginRequest {
  string username = 1;
  string password = 2;
  string ip_address = 3;
  string user_agent = 4;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  Session session = 3;
  User user = 4;
}

// Logout request/response
message LogoutRequest {
  string session_id = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

// Refresh token request/response
message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  bool success = 1;
  string message = 2;
  Session session = 3;
}

// Create user request/response
message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  repeated string roles = 4;
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
}

// Get user request/response
message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
}

// Update user request/response
message UpdateUserRequest {
  string id = 1;
  string username = 2;
  string email = 3;
  repeated string roles = 4;
  bool is_active = 5;
}

message UpdateUserResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
}

// Delete user request/response
message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

// Check permission request/response
message CheckPermissionRequest {
  string user_id = 1;
  string resource = 2;
  string action = 3;
}

message CheckPermissionResponse {
  bool success = 1;
  string message = 2;
  bool has_permission = 3;
}

// Grant permission request/response
message GrantPermissionRequest {
  string user_id = 1;
  string permission_id = 2;
}

message GrantPermissionResponse {
  bool success = 1;
  string message = 2;
}

// Revoke permission request/response
message RevokePermissionRequest {
  string user_id = 1;
  string permission_id = 2;
}

message RevokePermissionResponse {
  bool success = 1;
  string message = 2;
}

// Get session request/response
message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  bool success = 1;
  string message = 2;
  Session session = 3;
}

// Validate session request/response
message ValidateSessionRequest {
  string access_token = 1;
}

message ValidateSessionResponse {
  bool success = 1;
  string message = 2;
  bool is_valid = 3;
  User user = 4;
  Session session = 5;
}
