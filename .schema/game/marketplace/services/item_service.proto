syntax = "proto3";

package gaming.marketplace.services;

import "gaming/marketplace/messages/item_models.proto";

option go_package = "github.com/rice-dev/gaming/marketplace/services";

// Сервіс управління предметами
service ItemService {
  // Створити предмет
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);

  // Отримати предмет
  rpc GetItem(GetItemRequest) returns (GetItemResponse);

  // Оновити предмет
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);

  // Видалити предмет
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);

  // Отримати список предметів
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);

  // Пошук предметів
  rpc SearchItems(SearchItemsRequest) returns (SearchItemsResponse);

  // Отримати статистику предмета
  rpc GetItemStats(GetItemStatsRequest) returns (GetItemStatsResponse);

  // Отримати атрибути предмета
  rpc GetItemAttributes(GetItemAttributesRequest) returns (GetItemAttributesResponse);

  // Оновити атрибути предмета
  rpc UpdateItemAttributes(UpdateItemAttributesRequest) returns (UpdateItemAttributesResponse);

  // Отримати категорії предметів
  rpc GetItemCategories(GetItemCategoriesRequest) returns (GetItemCategoriesResponse);

  // Отримати підкатегорії предметів
  rpc GetItemSubcategories(GetItemSubcategoriesRequest) returns (GetItemSubcategoriesResponse);
}

