syntax = "proto3";

package gaming.marketplace.services;

import "gaming/marketplace/messages/listing_models.proto";

option go_package = "github.com/rice-dev/gaming/marketplace/services";

// Сервіс управління оголошеннями
service ListingService {
  // Створити оголошення
  rpc CreateListing(CreateListingRequest) returns (CreateListingResponse);

  // Отримати оголошення
  rpc GetListing(GetListingRequest) returns (GetListingResponse);

  // Оновити оголошення
  rpc UpdateListing(UpdateListingRequest) returns (UpdateListingResponse);

  // Видалити оголошення
  rpc DeleteListing(DeleteListingRequest) returns (DeleteListingResponse);

  // Отримати список оголошень
  rpc ListListings(ListListingsRequest) returns (ListListingsResponse);

  // Пошук оголошень
  rpc SearchListings(SearchListingsRequest) returns (SearchListingsResponse);

  // Отримати оголошення продавця
  rpc GetSellerListings(GetSellerListingsRequest) returns (GetSellerListingsResponse);

  // Отримати оголошення за категорією
  rpc GetCategoryListings(GetCategoryListingsRequest) returns (GetCategoryListingsResponse);

  // Отримати популярні оголошення
  rpc GetPopularListings(GetPopularListingsRequest) returns (GetPopularListingsResponse);

  // Отримати рекомендовані оголошення
  rpc GetRecommendedListings(GetRecommendedListingsRequest) returns (GetRecommendedListingsResponse);
}

