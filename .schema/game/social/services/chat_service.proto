}

// Запит видалення учасника
message RemoveMemberRequest {
  string chat_id = 1;
  string member_id = 2;
}

// Відповідь видалення учасника
message RemoveMemberResponse {
  bool success = 1;
  string message = 2;
}

// Запит учасників чату
message GetMembersRequest {
  string chat_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

// Відповідь учасників чату
message GetMembersResponse {
  bool success = 1;
  string message = 2;
  repeated string member_ids = 3;
  repeated string member_names = 4;
  int32 total_count = 5;
