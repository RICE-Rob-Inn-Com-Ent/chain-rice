syntax = "proto3";

package gaming.social.services;

import "gaming/social/messages/chat_models.proto";

option go_package = "github.com/rice-dev/gaming/social/services";

// Сервіс управління чатами
service ChatService {
  // Створити чат
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);

  // Отримати чат
  rpc GetChat(GetChatRequest) returns (GetChatResponse);

  // Оновити чат
  rpc UpdateChat(UpdateChatRequest) returns (UpdateChatResponse);

  // Видалити чат
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);

  // Отримати список чатів
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);

  // Додати учасника до чату
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);

  // Видалити учасника з чату
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // Отримати учасників чату
  rpc GetMembers(GetMembersRequest) returns (GetMembersResponse);

  // Надіслати повідомлення
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // Отримати повідомлення
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);

  // Отримати список повідомлень
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // Оновити повідомлення
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse);

  // Видалити повідомлення
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
}

// Запит створення чату
message CreateChatRequest {
  string name = 1;
  string description = 2;
  gaming.social.enums.ChatType type = 3;
  string creator_id = 4;
  repeated string member_ids = 5;
  repeated string admin_ids = 6;
  repeated string moderator_ids = 7;
  repeated string owner_ids = 8;
  int32 max_members = 9;
  int32 max_admins = 10;
  int32 max_moderators = 11;
  int32 max_owners = 12;
  bool is_public = 13;
  bool is_private = 14;
  bool is_protected = 15;
  bool is_encrypted = 16;
  bool is_verified = 17;
  bool is_official = 18;
  int64 expires_at = 19;
  map<string, string> metadata = 20;
}

// Відповідь створення чату
message CreateChatResponse {
  bool success = 1;
  string chat_id = 2;
  string message = 3;
  gaming.social.messages.Chat chat = 4;
}

// Запит отримання чату
message GetChatRequest {
  string chat_id = 1;
}

// Відповідь отримання чату
message GetChatResponse {
  bool success = 1;
  string message = 2;
  gaming.social.messages.Chat chat = 3;
}

// Запит оновлення чату
message UpdateChatRequest {
  string chat_id = 1;
  string name = 2;
  string description = 3;
  gaming.social.enums.ChatType type = 4;
  repeated string member_ids = 5;
  repeated string admin_ids = 6;
  repeated string moderator_ids = 7;
  repeated string owner_ids = 8;
  int32 max_members = 9;
  int32 max_admins = 10;
  int32 max_moderators = 11;
  int32 max_owners = 12;
  bool is_public = 13;
  bool is_private = 14;
  bool is_protected = 15;
  bool is_encrypted = 16;
  bool is_verified = 17;
  bool is_official = 18;
  int64 expires_at = 19;
  map<string, string> metadata = 20;
}

// Відповідь оновлення чату
message UpdateChatResponse {
  bool success = 1;
  string message = 2;
  gaming.social.messages.Chat chat = 3;
}

// Запит видалення чату
message DeleteChatRequest {
  string chat_id = 1;
}

// Відповідь видалення чату
message DeleteChatResponse {
  bool success = 1;
  string message = 2;
}

// Запит списку чатів
message ListChatsRequest {
  string creator_id = 1;
  gaming.social.enums.ChatType type = 2;
  bool is_public = 3;
  bool is_private = 4;
  bool is_protected = 5;
  bool is_encrypted = 6;
  bool is_verified = 7;
  bool is_official = 8;
  int32 max_members_min = 9;
  int32 max_members_max = 10;
  int32 current_members_min = 11;
  int32 current_members_max = 12;
  int32 limit = 13;
  int32 offset = 14;
  string sort_by = 15;
  bool ascending = 16;
  map<string, string> metadata_filters = 17;
}

// Відповідь списку чатів
message ListChatsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.social.messages.Chat chats = 3;
  int32 total_count = 4;
  int32 limit = 5;
  int32 offset = 6;
}

