syntax = "proto3";

package gaming.social.services;

import "gaming/social/messages/chat_models.proto";

option go_package = "github.com/rice-dev/gaming/social/services";

// Сервіс управління друзями
service FriendService {
  // Додати друга
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);

  // Прийняти запит дружби
  rpc AcceptFriend(AcceptFriendRequest) returns (AcceptFriendResponse);

  // Відхилити запит дружби
  rpc RejectFriend(RejectFriendRequest) returns (RejectFriendResponse);

  // Видалити друга
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);

  // Заблокувати користувача
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);

  // Розблокувати користувача
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);

  // Отримати список друзів
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);

  // Отримати список запитів дружби
  rpc ListFriendRequests(ListFriendRequestsRequest) returns (ListFriendRequestsResponse);

  // Отримати список заблокованих користувачів
  rpc ListBlockedUsers(ListBlockedUsersRequest) returns (ListBlockedUsersResponse);

  // Отримати статистику друзів
  rpc GetFriendStats(GetFriendStatsRequest) returns (GetFriendStatsResponse);
}

// Запит додавання друга
message AddFriendRequest {
  string user_id = 1;
  string friend_id = 2;
  string message = 3;
  map<string, string> metadata = 4;
}

// Відповідь додавання друга
message AddFriendResponse {
  bool success = 1;
  string message = 2;
  gaming.social.messages.Friend friend = 3;
}

// Запит прийняття друга
message AcceptFriendRequest {
  string user_id = 1;
  string friend_id = 2;
  map<string, string> metadata = 3;
}

// Відповідь прийняття друга
message AcceptFriendResponse {
  bool success = 1;
  string message = 2;
  gaming.social.messages.Friend friend = 3;
}

// Запит відхилення друга
message RejectFriendRequest {
  string user_id = 1;
  string friend_id = 2;
  string reason = 3;
  map<string, string> metadata = 4;
}

// Відповідь відхилення друга
message RejectFriendResponse {
  bool success = 1;
  string message = 2;
}

// Запит видалення друга
message RemoveFriendRequest {
  string user_id = 1;
  string friend_id = 2;
  string reason = 3;
  map<string, string> metadata = 4;
}

// Відповідь видалення друга
message RemoveFriendResponse {
  bool success = 1;
  string message = 2;
}

// Запит блокування користувача
message BlockUserRequest {
  string user_id = 1;
  string blocked_user_id = 2;
  string reason = 3;
  map<string, string> metadata = 4;
}

// Відповідь блокування користувача
message BlockUserResponse {
  bool success = 1;
  string message = 2;
}

// Запит розблокування користувача
message UnblockUserRequest {
  string user_id = 1;
  string unblocked_user_id = 2;
  map<string, string> metadata = 3;
}

// Відповідь розблокування користувача
message UnblockUserResponse {
  bool success = 1;
  string message = 2;
}

// Запит списку друзів
message ListFriendsRequest {
  string user_id = 1;
  gaming.social.enums.FriendStatus status = 2;
  int32 limit = 3;
  int32 offset = 4;
  string sort_by = 5;
  bool ascending = 6;
  map<string, string> metadata_filters = 7;
}

// Відповідь списку друзів
message ListFriendsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.social.messages.Friend friends = 3;
  int32 total_count = 4;
  int32 limit = 5;
  int32 offset = 6;
}

// Запит списку запитів дружби
message ListFriendRequestsRequest {
  string user_id = 1;
  gaming.social.enums.FriendStatus status = 2;
  int32 limit = 3;
  int32 offset = 4;
  string sort_by = 5;
  bool ascending = 6;
  map<string, string> metadata_filters = 7;
}

// Відповідь списку запитів дружби
message ListFriendRequestsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.social.messages.Friend requests = 3;
  int32 total_count = 4;
  int32 limit = 5;
  int32 offset = 6;
}

// Запит списку заблокованих користувачів
message ListBlockedUsersRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string sort_by = 4;
  bool ascending = 5;
  map<string, string> metadata_filters = 6;
}

// Відповідь списку заблокованих користувачів
message ListBlockedUsersResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.social.messages.Friend blocked_users = 3;
  int32 total_count = 4;
  int32 limit = 5;
  int32 offset = 6;
}

// Запит статистики друзів
