syntax = "proto3";

package gaming.leaderboards.services;

import "gaming/achievements/messages/achievement_models.proto";
import "gaming/achievements/messages/reward_models.proto";

option go_package = "github.com/rice-dev/gaming/leaderboards/services";

// Сервіс інтеграції з досягненнями
service AchievementIntegration {
  // Отримати досягнення за рейтинг
  rpc GetRankingAchievements(GetRankingAchievementsRequest) returns (GetRankingAchievementsResponse);

  // Отримати досягнення за очки
  rpc GetScoreAchievements(GetScoreAchievementsRequest) returns (GetScoreAchievementsResponse);

  // Отримати досягнення за лідерборд
  rpc GetLeaderboardAchievements(GetLeaderboardAchievementsRequest) returns (GetLeaderboardAchievementsResponse);

  // Отримати нагороди за рейтинг
  rpc GetRankingRewards(GetRankingRewardsRequest) returns (GetRankingRewardsResponse);

  // Отримати нагороди за очки
  rpc GetScoreRewards(GetScoreRewardsRequest) returns (GetScoreRewardsResponse);

  // Отримати нагороди за лідерборд
  rpc GetLeaderboardRewards(GetLeaderboardRewardsRequest) returns (GetLeaderboardRewardsResponse);

  // Перевірити досягнення рейтингу
  rpc CheckRankingAchievement(CheckRankingAchievementRequest) returns (CheckRankingAchievementResponse);

  // Перевірити досягнення очок
  rpc CheckScoreAchievement(CheckScoreAchievementRequest) returns (CheckScoreAchievementResponse);

  // Перевірити досягнення лідерборду
  rpc CheckLeaderboardAchievement(CheckLeaderboardAchievementRequest) returns (CheckLeaderboardAchievementResponse);

  // Отримати прогрес досягнення
  rpc GetAchievementProgress(GetAchievementProgressRequest) returns (GetAchievementProgressResponse);
}

// Запит досягнень за рейтинг
message GetRankingAchievementsRequest {
  string player_id = 1;
  string leaderboard_id = 2;
  int32 rank = 3;
}

// Відповідь досягнень за рейтинг
message GetRankingAchievementsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.achievements.messages.Achievement achievements = 3;
}

// Запит досягнень за очки
message GetScoreAchievementsRequest {
  string player_id = 1;
  string leaderboard_id = 2;
  gaming.leaderboards.enums.ScoreType type = 3;
  int64 score = 4;
}

// Відповідь досягнень за очки
message GetScoreAchievementsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.achievements.messages.Achievement achievements = 3;
}

// Запит досягнень за лідерборд
message GetLeaderboardAchievementsRequest {
  string player_id = 1;
  string leaderboard_id = 2;
}

// Відповідь досягнень за лідерборд
message GetLeaderboardAchievementsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.achievements.messages.Achievement achievements = 3;
}

// Запит нагород за рейтинг
message GetRankingRewardsRequest {
  string player_id = 1;
  string leaderboard_id = 2;
  int32 rank = 3;
}

// Відповідь нагород за рейтинг
message GetRankingRewardsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.achievements.messages.Reward rewards = 3;
}

// Запит нагород за очки
message GetScoreRewardsRequest {
  string player_id = 1;
  string leaderboard_id = 2;
  gaming.leaderboards.enums.ScoreType type = 3;
  int64 score = 4;
}

// Відповідь нагород за очки
message GetScoreRewardsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.achievements.messages.Reward rewards = 3;
}

// Запит нагород за лідерборд
message GetLeaderboardRewardsRequest {
  string player_id = 1;
  string leaderboard_id = 2;
}

// Відповідь нагород за лідерборд
message GetLeaderboardRewardsResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.achievements.messages.Reward rewards = 3;
}

// Запит перевірки досягнення рейтингу
message CheckRankingAchievementRequest {
  string player_id = 1;
  string leaderboard_id = 2;
  int32 rank = 3;
  string achievement_id = 4;
}

// Відповідь перевірки досягнення рейтингу
message CheckRankingAchievementResponse {
  bool success = 1;
  string message = 2;
  bool achieved = 3;
  gaming.achievements.messages.Achievement achievement = 4;
}

// Запит перевірки досягнення очок
message CheckScoreAchievementRequest {
  string player_id = 1;
  string leaderboard_id = 2;
  gaming.leaderboards.enums.ScoreType type = 3;
  int64 score = 4;
  string achievement_id = 5;
}

// Відповідь перевірки досягнення очок
message CheckScoreAchievementResponse {
  bool success = 1;
  string message = 2;
  bool achieved = 3;
  gaming.achievements.messages.Achievement achievement = 4;
}

// Запит перевірки досягнення лідерборду
message CheckLeaderboardAchievementRequest {
  string player_id = 1;
  string leaderboard_id = 2;
  string achievement_id = 3;
}

// Відповідь перевірки досягнення лідерборду
message CheckLeaderboardAchievementResponse {
  bool success = 1;
  string message = 2;
  bool achieved = 3;
  gaming.achievements.messages.Achievement achievement = 4;
}

// Запит прогресу досягнення
message GetAchievementProgressRequest {
  string player_id = 1;
  string achievement_id = 2;
}

// Відповідь прогресу досягнення
message GetAchievementProgressResponse {
  bool success = 1;
  string message = 2;
  int32 progress = 3;
  int32 max_progress = 4;
  float percentage = 5;
  bool completed = 6;
}
