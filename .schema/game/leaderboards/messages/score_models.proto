syntax = "proto3";

package gaming.leaderboards.messages;

import "gaming/leaderboards/enums/score_types.proto";

option go_package = "github.com/rice-dev/gaming/leaderboards/messages";

// Модель очок
message Score {
  string id = 1;
  string player_id = 2;
  string leaderboard_id = 3;
  gaming.leaderboards.enums.ScoreType type = 4;
  int64 value = 5;
  int64 previous_value = 6;
  int64 change = 7;
  int64 timestamp = 8;
  int64 previous_timestamp = 9;
  map<string, string> metadata = 10;
}

// Модель історії очок
message ScoreHistory {
  string score_id = 1;
  string player_id = 2;
  string leaderboard_id = 3;
  gaming.leaderboards.enums.ScoreType type = 4;
  int64 value = 5;
  int64 timestamp = 6;
  int64 change = 7;
  map<string, string> metadata = 8;
}

// Модель статистики очок
message ScoreStats {
  string player_id = 1;
  string leaderboard_id = 2;
  gaming.leaderboards.enums.ScoreType type = 3;
  int64 current_score = 4;
  int64 best_score = 5;
  int64 worst_score = 6;
  int64 total_score = 7;
  int64 average_score = 8;
  int64 median_score = 9;
  int64 standard_deviation = 10;
  int64 variance = 11;
  int64 percentile_25 = 12;
  int64 percentile_75 = 13;
  int64 percentile_90 = 14;
  int64 percentile_95 = 15;
  int64 percentile_99 = 16;
  int64 total_entries = 17;
  int64 total_time = 18;
  int64 average_time = 19;
  int64 median_time = 20;
  int64 min_time = 21;
  int64 max_time = 22;
  int64 updated_at = 23;
}

// Модель прогнозу очок
message ScorePrediction {
  string player_id = 1;
  string leaderboard_id = 2;
  gaming.leaderboards.enums.ScoreType type = 3;
  int64 predicted_score = 4;
  float confidence = 5;
  int64 prediction_date = 6;
  int64 target_date = 7;
  map<string, string> factors = 8;
  map<string, string> metadata = 9;
}

// Модель порівняння очок
message ScoreComparison {
  string player_id = 1;
  string leaderboard_id = 2;
  gaming.leaderboards.enums.ScoreType type = 3;
  int64 current_score = 4;
  int64 target_score = 5;
  int64 score_difference = 6;
  int64 time_to_target = 7;
  float probability = 8;
  map<string, string> recommendations = 9;
  map<string, string> metadata = 10;
}

