syntax = "proto3";

package gaming.game_economy.messages;

import "gaming/game_economy/enums/currency_types.proto";
import "gaming/game_economy/enums/wallet_types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/gaming/game_economy/messages";

// Модель гаманця
message Wallet {
  // Унікальний ідентифікатор гаманця
  string wallet_id = 1;

  // Ідентифікатор власника гаманця
  string owner_id = 2;

  // Назва гаманця
  string name = 3;

  // Опис гаманця
  string description = 4;

  // Тип гаманця
  gaming.game_economy.enums.WalletType type = 5;

  // Статус гаманця
  WalletStatus status = 6;

  // Баланси валют
  repeated CurrencyBalance balances = 7;

  // Налаштування гаманця
  WalletSettings settings = 8;

  // Безпека гаманця
  WalletSecurity security = 9;

  // Метадані гаманця
  WalletMetadata metadata = 10;

  // Час створення
  google.protobuf.Timestamp created_at = 11;

  // Час останнього оновлення
  google.protobuf.Timestamp updated_at = 12;

  // Час останнього використання
  google.protobuf.Timestamp last_used_at = 13;
}

// Статус гаманця
enum WalletStatus {
  WALLET_STATUS_UNSPECIFIED = 0;

  // Активний
  WALLET_STATUS_ACTIVE = 1;

  // Неактивний
  WALLET_STATUS_INACTIVE = 2;

  // Заблокований
  WALLET_STATUS_BLOCKED = 3;

  // Заморожений
  WALLET_STATUS_FROZEN = 4;

  // Призупинений
  WALLET_STATUS_SUSPENDED = 5;

  // Видалений
  WALLET_STATUS_DELETED = 6;

  // Очікування активації
  WALLET_STATUS_PENDING_ACTIVATION = 7;

  // Очікування верифікації
  WALLET_STATUS_PENDING_VERIFICATION = 8;

  // Верифікований
  WALLET_STATUS_VERIFIED = 9;

  // Неверифікований
  WALLET_STATUS_UNVERIFIED = 10;
}

// Баланс валюти
message CurrencyBalance {
  // Тип валюти
  gaming.game_economy.enums.CurrencyType currency_type = 1;

  // Кількість валюти
  string amount = 2;

  // Заблокована кількість
  string locked_amount = 3;

  // Доступна кількість
  string available_amount = 4;

  // Загальна кількість
  string total_amount = 5;

  // Курс обміну
  string exchange_rate = 6;

  // Еквівалент в основній валюті
  string equivalent_amount = 7;

  // Час останнього оновлення
  google.protobuf.Timestamp updated_at = 8;
}

