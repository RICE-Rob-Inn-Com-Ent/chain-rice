// Метадані гаманця
message WalletMetadata {
  // Версія гаманця
  string version = 1;

  // Автор гаманця
  string author = 2;

  // Теги гаманця
  repeated string tags = 3;

  // Мова гаманця
  string language = 4;

  // Рейтинг гаманця
  double rating = 5;

  // Кількість переглядів
  int64 views = 6;

  // Кількість завантажень
  int64 downloads = 7;

  // Розмір файлу гаманця
  int64 file_size = 8;

  // Формат файлу гаманця
  string file_format = 9;

  // Додаткові метадані
  map<string, string> additional_data = 10;
}
