syntax = "proto3";

package gaming.matchmaking.services;

import "gaming/matchmaking/messages/queue_models.proto";

option go_package = "github.com/rice-dev/gaming/matchmaking/services";

// Сервіс управління чергами
service QueueService {
  // Створити чергу
  rpc CreateQueue(CreateQueueRequest) returns (CreateQueueResponse);

  // Отримати чергу
  rpc GetQueue(GetQueueRequest) returns (GetQueueResponse);

  // Оновити чергу
  rpc UpdateQueue(UpdateQueueRequest) returns (UpdateQueueResponse);

  // Видалити чергу
  rpc DeleteQueue(DeleteQueueRequest) returns (DeleteQueueResponse);

  // Отримати список черг
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse);

  // Додати гравця до черги
  rpc AddPlayerToQueue(AddPlayerToQueueRequest) returns (AddPlayerToQueueResponse);

  // Видалити гравця з черги
  rpc RemovePlayerFromQueue(RemovePlayerFromQueueRequest) returns (RemovePlayerFromQueueResponse);

  // Отримати гравців у черзі
  rpc GetQueuePlayers(GetQueuePlayersRequest) returns (GetQueuePlayersResponse);

  // Отримати статистику черги
  rpc GetQueueStats(GetQueueStatsRequest) returns (GetQueueStatsResponse);

  // Очистити чергу
  rpc ClearQueue(ClearQueueRequest) returns (ClearQueueResponse);
}

// Запит створення черги
message CreateQueueRequest {
  string name = 1;
  string description = 2;
  gaming.matchmaking.enums.QueueType type = 3;
  gaming.matchmaking.enums.MatchingAlgorithm algorithm = 4;
  int32 min_players = 5;
  int32 max_players = 6;
  int32 max_queue_size = 7;
  int64 max_wait_time = 8;
  bool is_active = 9;
  bool is_public = 10;
  string game_mode = 11;
  string map = 12;
  string region = 13;
  string server = 14;
  int32 skill_level_min = 15;
  int32 skill_level_max = 16;
  int32 rating_min = 17;
  int32 rating_max = 18;
  int32 level_min = 19;
  int32 level_max = 20;
  string language = 21;
  string platform = 22;
  string timezone = 23;
  int64 expires_at = 24;
  map<string, string> metadata = 25;
}

// Відповідь створення черги
message CreateQueueResponse {
  bool success = 1;
  string queue_id = 2;
  string message = 3;
  gaming.matchmaking.messages.Queue queue = 4;
}

// Запит отримання черги
message GetQueueRequest {
  string queue_id = 1;
}

// Відповідь отримання черги
message GetQueueResponse {
  bool success = 1;
  string message = 2;
  gaming.matchmaking.messages.Queue queue = 3;
}

// Запит оновлення черги
message UpdateQueueRequest {
  string queue_id = 1;
  string name = 2;
  string description = 3;
  gaming.matchmaking.enums.QueueType type = 4;
  gaming.matchmaking.enums.MatchingAlgorithm algorithm = 5;
  int32 min_players = 6;
  int32 max_players = 7;
  int32 max_queue_size = 8;
  int64 max_wait_time = 9;
  bool is_active = 10;
  bool is_public = 11;
  string game_mode = 12;
  string map = 13;
  string region = 14;
  string server = 15;
  int32 skill_level_min = 16;
  int32 skill_level_max = 17;
  int32 rating_min = 18;
  int32 rating_max = 19;
  int32 level_min = 20;
  int32 level_max = 21;
  string language = 22;
  string platform = 23;
  string timezone = 24;
  int64 expires_at = 25;
  map<string, string> metadata = 26;
}

// Відповідь оновлення черги
message UpdateQueueResponse {
  bool success = 1;
  string message = 2;
  gaming.matchmaking.messages.Queue queue = 3;
}

// Запит видалення черги
message DeleteQueueRequest {
  string queue_id = 1;
}

// Відповідь видалення черги
message DeleteQueueResponse {
  bool success = 1;
  string message = 2;
}

// Запит списку черг
message ListQueuesRequest {
  string game_mode = 1;
  string map = 2;
  string region = 3;
  string server = 4;
  string language = 5;
  string platform = 6;
  string timezone = 7;
  gaming.matchmaking.enums.QueueType type = 8;
  gaming.matchmaking.enums.MatchingAlgorithm algorithm = 9;
  bool is_active = 10;
  bool is_public = 11;
  int32 skill_level_min = 12;
  int32 skill_level_max = 13;
  int32 rating_min = 14;
  int32 rating_max = 15;
  int32 level_min = 16;
  int32 level_max = 17;
  int32 limit = 18;
  int32 offset = 19;
  string sort_by = 20;
  bool ascending = 21;
  map<string, string> metadata_filters = 22;
}

// Відповідь списку черг
message ListQueuesResponse {
  bool success = 1;
  string message = 2;
  repeated gaming.matchmaking.messages.Queue queues = 3;
  int32 total_count = 4;
  int32 limit = 5;
  int32 offset = 6;
}

