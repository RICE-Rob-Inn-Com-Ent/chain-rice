syntax = "proto3";

package gaming.metaverse.services;

import "gaming/metaverse/messages/world_models.proto";

option go_package = "github.com/rice-dev/gaming/metaverse/services";

// Сервіс управління активами
service AssetService {
  // Створити актив
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);

  // Отримати актив
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);

  // Оновити актив
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);

  // Видалити актив
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);

  // Отримати список активів
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);

  // Завантажити актив
  rpc UploadAsset(UploadAssetRequest) returns (UploadAssetResponse);

  // Скачати актив
  rpc DownloadAsset(DownloadAssetRequest) returns (DownloadAssetResponse);

  // Отримати метадані активу
  rpc GetAssetMetadata(GetAssetMetadataRequest) returns (GetAssetMetadataResponse);

  // Оновити метадані активу
  rpc UpdateAssetMetadata(UpdateAssetMetadataRequest) returns (UpdateAssetMetadataResponse);
}

