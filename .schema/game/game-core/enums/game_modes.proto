// Режими гри
enum GameMode {
  GAME_MODE_UNSPECIFIED = 0;

  // Player vs Environment (PvE)
  GAME_MODE_PVE = 1;

  // Player vs Player (PvP)
  GAME_MODE_PVP = 2;

  // Cooperative (Co-op)
  GAME_MODE_COOP = 3;

  // Single Player
  GAME_MODE_SINGLE_PLAYER = 4;

  // Multiplayer
  GAME_MODE_MULTIPLAYER = 5;

  // Battle Royale
  GAME_MODE_BATTLE_ROYALE = 6;

  // Team Deathmatch
  GAME_MODE_TEAM_DEATHMATCH = 7;

  // Capture the Flag
  GAME_MODE_CAPTURE_THE_FLAG = 8;

  // King of the Hill
  GAME_MODE_KING_OF_THE_HILL = 9;

  // Domination
  GAME_MODE_DOMINATION = 10;

  // Search and Destroy
  GAME_MODE_SEARCH_AND_DESTROY = 11;

  // Survival
  GAME_MODE_SURVIVAL = 12;

  // Horde Mode
  GAME_MODE_HORDE = 13;

  // Raid
  GAME_MODE_RAID = 14;

  // Dungeon
  GAME_MODE_DUNGEON = 15;

  // Arena
  GAME_MODE_ARENA = 16;

  // Campaign
  GAME_MODE_CAMPAIGN = 17;

  // Story Mode
  GAME_MODE_STORY = 18;

  // Sandbox
  GAME_MODE_SANDBOX = 19;

  // Creative Mode
  GAME_MODE_CREATIVE = 20;

  // Custom
  GAME_MODE_CUSTOM = 21;
}

