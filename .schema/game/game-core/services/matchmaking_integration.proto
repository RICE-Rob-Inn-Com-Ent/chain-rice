syntax = "proto3";

package gaming.game_core.services;

import "gaming/game_core/messages/game_session_models.proto";
import "gaming/game_core/messages/player_models.proto";
import "gaming/game_core/enums/game_modes.proto";
import "gaming/game_core/enums/player_roles.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/gaming/game_core/services";

// Сервіс інтеграції з матчмейкінгом
service MatchmakingIntegrationService {
  // Додати гравця до черги матчмейкінгу
  rpc AddPlayerToQueue(AddPlayerToQueueRequest) returns (AddPlayerToQueueResponse);

  // Видалити гравця з черги матчмейкінгу
  rpc RemovePlayerFromQueue(RemovePlayerFromQueueRequest) returns (RemovePlayerFromQueueResponse);

  // Отримати статус гравця в черзі
  rpc GetPlayerQueueStatus(GetPlayerQueueStatusRequest) returns (GetPlayerQueueStatusResponse);

  // Отримати позицію гравця в черзі
  rpc GetPlayerQueuePosition(GetPlayerQueuePositionRequest) returns (GetPlayerQueuePositionResponse);

  // Отримати очікуваний час очікування
  rpc GetEstimatedWaitTime(GetEstimatedWaitTimeRequest) returns (GetEstimatedWaitTimeResponse);

  // Знайти матч для гравця
  rpc FindMatch(FindMatchRequest) returns (FindMatchResponse);

  // Створити матч
  rpc CreateMatch(CreateMatchRequest) returns (CreateMatchResponse);

  // Отримати матч за ID
  rpc GetMatch(GetMatchRequest) returns (GetMatchResponse);

  // Оновити матч
  rpc UpdateMatch(UpdateMatchRequest) returns (UpdateMatchResponse);

  // Видалити матч
  rpc DeleteMatch(DeleteMatchRequest) returns (google.protobuf.Empty);

  // Отримати список матчів
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesResponse);

  // Отримати активні матчі
  rpc GetActiveMatches(GetActiveMatchesRequest) returns (GetActiveMatchesResponse);

  // Отримати статистику матчмейкінгу
  rpc GetMatchmakingStats(GetMatchmakingStatsRequest) returns (GetMatchmakingStatsResponse);

  // Отримати рекомендації матчів
  rpc GetMatchRecommendations(GetMatchRecommendationsRequest) returns (GetMatchRecommendationsResponse);

  // Оцінити матч
  rpc RateMatch(RateMatchRequest) returns (RateMatchResponse);

  // Отримати історію матчів
  rpc GetMatchHistory(GetMatchHistoryRequest) returns (GetMatchHistoryResponse);
}

// Запит додавання гравця до черги
message AddPlayerToQueueRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Режим гри
  gaming.game_core.enums.GameMode game_mode = 2;

  // Роль гравця
  gaming.game_core.enums.PlayerRole role = 3;

  // Команда гравця
  gaming.game_core.enums.TeamType team = 4;

  // Рівень складності
  gaming.game_core.enums.DifficultyLevel difficulty = 5;

  // Налаштування матчмейкінгу
  MatchmakingSettings settings = 6;

  // Додаткові параметри
  map<string, string> parameters = 7;
}

// Відповідь додавання гравця до черги
message AddPlayerToQueueResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;

  // Ідентифікатор черги
  string queue_id = 3;

  // Час додавання до черги
  google.protobuf.Timestamp queue_time = 4;

  // Очікуваний час очікування (в секундах)
  int64 estimated_wait_time = 5;
}

// Запит видалення гравця з черги
message RemovePlayerFromQueueRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор черги
  string queue_id = 2;

  // Причина видалення
  string reason = 3;
}

// Відповідь видалення гравця з черги
message RemovePlayerFromQueueResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;

  // Час видалення з черги
  google.protobuf.Timestamp removal_time = 3;
}

// Запит статусу гравця в черзі
message GetPlayerQueueStatusRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор черги
  string queue_id = 2;
}

// Відповідь статусу гравця в черзі
message GetPlayerQueueStatusResponse {
  // Статус гравця в черзі
  QueueStatus status = 1;

  // Позиція в черзі
  int64 position = 2;

  // Загальна кількість гравців в черзі
  int64 total_players = 3;

  // Очікуваний час очікування (в секундах)
  int64 estimated_wait_time = 4;

  // Час в черзі (в секундах)
  int64 time_in_queue = 5;

  // Додаткові дані статусу
  map<string, string> status_data = 6;
}

// Запит позиції гравця в черзі
message GetPlayerQueuePositionRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор черги
  string queue_id = 2;
}

// Відповідь позиції гравця в черзі
message GetPlayerQueuePositionResponse {
  // Позиція в черзі
  int64 position = 1;

  // Загальна кількість гравців в черзі
  int64 total_players = 2;

  // Відсоток прогресу
  double progress_percentage = 3;

  // Очікуваний час до початку матчу (в секундах)
  int64 estimated_time_to_match = 4;
}

// Запит очікуваного часу очікування
message GetEstimatedWaitTimeRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Режим гри
  gaming.game_core.enums.GameMode game_mode = 2;

  // Роль гравця
  gaming.game_core.enums.PlayerRole role = 3;

  // Рівень складності
  gaming.game_core.enums.DifficultyLevel difficulty = 4;
}

// Відповідь очікуваного часу очікування
message GetEstimatedWaitTimeResponse {
  // Очікуваний час очікування (в секундах)
  int64 estimated_wait_time = 1;

  // Мінімальний час очікування (в секундах)
  int64 min_wait_time = 2;

  // Максимальний час очікування (в секундах)
  int64 max_wait_time = 3;

  // Середній час очікування (в секундах)
  int64 average_wait_time = 4;

  // Додаткові дані часу очікування
  map<string, string> wait_time_data = 5;
}

// Запит пошуку матчу
message FindMatchRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Режим гри
  gaming.game_core.enums.GameMode game_mode = 2;

  // Роль гравця
  gaming.game_core.enums.PlayerRole role = 3;

  // Рівень складності
  gaming.game_core.enums.DifficultyLevel difficulty = 4;

  // Налаштування матчмейкінгу
  MatchmakingSettings settings = 5;

  // Додаткові параметри
  map<string, string> parameters = 6;
}

// Відповідь пошуку матчу
message FindMatchResponse {
  // Знайдений матч
  Match match = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;

  // Час пошуку матчу (в мілісекундах)
  int64 search_time_ms = 4;
}

// Запит створення матчу
message CreateMatchRequest {
  // Дані матчу
  Match match = 1;

  // Автор матчу
  string author_id = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь створення матчу
message CreateMatchResponse {
  // Створений матч
  Match match = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит отримання матчу
message GetMatchRequest {
  // Ідентифікатор матчу
  string match_id = 1;

  // Ідентифікатор гравця (опціонально)
  string player_id = 2;
}

// Відповідь отримання матчу
message GetMatchResponse {
  // Матч
  Match match = 1;

  // Додаткові дані гравця (якщо вказано player_id)
  map<string, string> player_data = 2;
}

// Запит оновлення матчу
message UpdateMatchRequest {
  // Ідентифікатор матчу
  string match_id = 1;

  // Дані для оновлення
  Match match = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення матчу
message UpdateMatchResponse {
  // Оновлений матч
  Match match = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит видалення матчу
message DeleteMatchRequest {
  // Ідентифікатор матчу
  string match_id = 1;

  // Причина видалення
  string reason = 2;
}

// Запит списку матчів
message ListMatchesRequest {
  // Фільтри
  MatchFilters filters = 1;

  // Пагінація
  Pagination pagination = 2;

  // Сортування
  Sorting sorting = 3;
}

// Відповідь списку матчів
message ListMatchesResponse {
  // Список матчів
  repeated Match matches = 1;

  // Загальна кількість
  int64 total_count = 2;

  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Запит активних матчів
message GetActiveMatchesRequest {
  // Ідентифікатор гравця (опціонально)
  string player_id = 1;

  // Фільтри
  MatchFilters filters = 2;
}

// Відповідь активних матчів
message GetActiveMatchesResponse {
  // Список активних матчів
  repeated Match active_matches = 1;

  // Загальна кількість активних матчів
  int64 total_count = 2;
}

// Запит статистики матчмейкінгу
message GetMatchmakingStatsRequest {
  // Ідентифікатор гравця (опціонально)
  string player_id = 1;

  // Фільтри
  MatchmakingStatsFilters filters = 2;
}

// Відповідь статистики матчмейкінгу
message GetMatchmakingStatsResponse {
  // Статистика матчмейкінгу
  MatchmakingStats stats = 1;

  // Додаткові метрики
  map<string, double> additional_metrics = 2;
}

// Запит рекомендацій матчів
message GetMatchRecommendationsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Кількість рекомендацій
  int32 limit = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь рекомендацій матчів
message GetMatchRecommendationsResponse {
  // Список рекомендованих матчів
  repeated Match recommended_matches = 1;

  // Загальна кількість рекомендацій
  int64 total_count = 2;

  // Додаткові дані рекомендацій
  map<string, string> recommendation_data = 3;
}

// Запит оцінки матчу
message RateMatchRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор матчу
  string match_id = 2;

  // Оцінка (1-5)
  int32 rating = 3;

  // Коментар (опціонально)
  string comment = 4;
}

// Відповідь оцінки матчу
message RateMatchResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;

  // Нова середня оцінка матчу
  double new_average_rating = 3;
}

// Запит історії матчів
message GetMatchHistoryRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Фільтри
  MatchHistoryFilters filters = 2;

  // Пагінація
  Pagination pagination = 3;
}

// Відповідь історії матчів
message GetMatchHistoryResponse {
  // Список записів історії
  repeated Match history_matches = 1;

  // Загальна кількість записів
  int64 total_count = 2;

  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Модель матчу
message Match {
  // Ідентифікатор матчу
  string match_id = 1;

  // Назва матчу
  string name = 2;

  // Опис матчу
  string description = 3;

  // Режим гри
  gaming.game_core.enums.GameMode game_mode = 4;

  // Рівень складності
  gaming.game_core.enums.DifficultyLevel difficulty = 5;

  // Статус матчу
  string status = 6;

  // Гравці в матчі
  repeated MatchPlayer players = 7;

  // Команди
  repeated MatchTeam teams = 8;

  // Налаштування матчу
  MatchSettings settings = 9;

  // Статистика матчу
  MatchStats stats = 10;

  // Метадані матчу
  MatchMetadata metadata = 11;

  // Час створення
  google.protobuf.Timestamp created_at = 12;

  // Час початку
  google.protobuf.Timestamp started_at = 13;

  // Час закінчення
  google.protobuf.Timestamp ended_at = 14;

  // Час оновлення
  google.protobuf.Timestamp updated_at = 15;
}

// Гравець в матчі
message MatchPlayer {
  // Ідентифікатор гравця
  string player_id = 1;

  // Роль гравця
  gaming.game_core.enums.PlayerRole role = 2;

  // Команда гравця
  gaming.game_core.enums.TeamType team = 3;

  // Статус гравця в матчі
  string status = 4;

  // Очки гравця
  int64 score = 5;

  // Статистика гравця
  PlayerMatchStats stats = 6;

  // Час приєднання
  google.protobuf.Timestamp joined_at = 7;

  // Час виходу
  google.protobuf.Timestamp left_at = 8;

  // Додаткові дані гравця
  map<string, string> player_data = 9;
}

// Статистика гравця в матчі
message PlayerMatchStats {
  // Кількість вбивств
  int64 kills = 1;

  // Кількість смертей
  int64 deaths = 2;

  // Кількість асистів
  int64 assists = 3;

  // Співвідношення K/D
  double kill_death_ratio = 4;

  // Завданий урон
  int64 damage_dealt = 5;

  // Отриманий урон
  int64 damage_taken = 6;

  // Лікування
  int64 healing_done = 7;

  // Додаткові статистики
  map<string, int64> additional_stats = 8;
}

// Команда в матчі
message MatchTeam {
  // Ідентифікатор команди
  string team_id = 1;

  // Назва команди
  string name = 2;

  // Тип команди
  gaming.game_core.enums.TeamType type = 3;

  // Гравці в команді
  repeated string player_ids = 4;

  // Капітан команди
  string captain_id = 5;

  // Очки команди
  int64 score = 6;

  // Статистика команди
  TeamMatchStats stats = 7;

  // Додаткові дані команди
  map<string, string> team_data = 8;
}

// Статистика команди в матчі
message TeamMatchStats {
  // Кількість вбивств
  int64 kills = 1;

  // Кількість смертей
  int64 deaths = 2;

  // Кількість асистів
  int64 assists = 3;

  // Співвідношення K/D
  double kill_death_ratio = 4;

  // Завданий урон
  int64 damage_dealt = 5;

  // Отриманий урон
  int64 damage_taken = 6;

  // Лікування
  int64 healing_done = 7;

  // Додаткові статистики
  map<string, int64> additional_stats = 8;
}

// Налаштування матчу
message MatchSettings {
  // Максимальна кількість гравців
  int32 max_players = 1;

  // Мінімальна кількість гравців
  int32 min_players = 2;

  // Час очікування (в секундах)
  int64 wait_time_seconds = 3;

  // Час матчу (в секундах)
  int64 match_time_seconds = 4;

  // Чи можна приєднуватися під час матчу
  bool allow_join_during_match = 5;

  // Чи можна покидати під час матчу
  bool allow_leave_during_match = 6;

  // Чи можна паузити матч
  bool allow_pause = 7;

  // Чи можна перезапускати матч
  bool allow_restart = 8;

  // Додаткові налаштування
  map<string, string> additional_settings = 9;
}

// Статистика матчу
message MatchStats {
  // Загальна кількість гравців
  int64 total_players = 1;

  // Кількість активних гравців
  int64 active_players = 2;

  // Кількість завершених гравців
  int64 completed_players = 3;

  // Кількість відключених гравців
  int64 disconnected_players = 4;

  // Середній час матчу
  double average_match_time = 5;

  // Загальний час матчу
  int64 total_match_time = 6;

  // Кількість перемог
  int64 wins = 7;

  // Кількість поразок
  int64 losses = 8;

  // Відсоток перемог
  double win_rate = 9;

  // Додаткові статистики
  map<string, int64> additional_stats = 10;
}

// Метадані матчу
message MatchMetadata {
  // Версія матчу
  string version = 1;

  // Автор матчу
  string author = 2;

  // Теги матчу
  repeated string tags = 3;

  // Мова матчу
  string language = 4;

  // Рейтинг матчу
  double rating = 5;

  // Кількість переглядів
  int64 views = 6;

  // Кількість завантажень
  int64 downloads = 7;

  // Розмір файлу матчу
  int64 file_size = 8;

  // Формат файлу матчу
  string file_format = 9;

  // Додаткові метадані
  map<string, string> additional_data = 10;
}

// Налаштування матчмейкінгу
message MatchmakingSettings {
  // Максимальний час пошуку (в секундах)
  int64 max_search_time = 1;

  // Мінімальний рівень гравця
  int32 min_player_level = 2;

  // Максимальний рівень гравця
  int32 max_player_level = 3;

  // Дозволити різні рівні складності
  bool allow_different_difficulties = 4;

  // Дозволити різні ролі
  bool allow_different_roles = 5;

  // Дозволити різні команди
  bool allow_different_teams = 6;

  // Додаткові налаштування
  map<string, string> additional_settings = 7;
}

// Статус черги
enum QueueStatus {
  QUEUE_STATUS_UNSPECIFIED = 0;
  QUEUE_STATUS_WAITING = 1;
  QUEUE_STATUS_SEARCHING = 2;
  QUEUE_STATUS_MATCH_FOUND = 3;
  QUEUE_STATUS_MATCH_CREATED = 4;
  QUEUE_STATUS_ERROR = 5;
  QUEUE_STATUS_TIMEOUT = 6;
}

// Статистика матчмейкінгу
message MatchmakingStats {
  // Загальна кількість матчів
  int64 total_matches = 1;

  // Кількість успішних матчів
  int64 successful_matches = 2;

  // Кількість невдалих матчів
  int64 failed_matches = 3;

  // Відсоток успішності
  double success_rate = 4;

  // Середній час пошуку матчу
  double average_search_time = 5;

  // Середній час очікування
  double average_wait_time = 6;

  // Кількість гравців в черзі
  int64 players_in_queue = 7;

  // Кількість активних матчів
  int64 active_matches = 8;

  // Додаткові статистики
  map<string, int64> additional_stats = 9;
}

// Фільтри матчів
message MatchFilters {
  // Режим гри
  repeated gaming.game_core.enums.GameMode game_modes = 1;

  // Рівень складності
  repeated gaming.game_core.enums.DifficultyLevel difficulties = 2;

  // Статус матчу
  repeated string statuses = 3;

  // Автор матчу
  string author = 4;

  // Теги матчу
  repeated string tags = 5;

  // Мова матчу
  string language = 6;

  // Мінімальний рейтинг
  double min_rating = 7;

  // Максимальний рейтинг
  double max_rating = 8;

  // Час створення (від)
  google.protobuf.Timestamp created_from = 9;

  // Час створення (до)
  google.protobuf.Timestamp created_to = 10;

  // Час початку (від)
  google.protobuf.Timestamp started_from = 11;

  // Час початку (до)
  google.protobuf.Timestamp started_to = 12;

  // Час закінчення (від)
  google.protobuf.Timestamp ended_from = 13;

  // Час закінчення (до)
  google.protobuf.Timestamp ended_to = 14;
}

// Фільтри статистики матчмейкінгу
message MatchmakingStatsFilters {
  // Період часу (від)
  google.protobuf.Timestamp period_from = 1;

  // Період часу (до)
  google.protobuf.Timestamp period_to = 2;

  // Режим гри
  repeated gaming.game_core.enums.GameMode game_modes = 3;

  // Рівень складності
  repeated gaming.game_core.enums.DifficultyLevel difficulties = 4;

  // Автор матчу
  string author = 5;
}

// Фільтри історії матчів
message MatchHistoryFilters {
  // Режим гри
  repeated gaming.game_core.enums.GameMode game_modes = 1;

  // Рівень складності
  repeated gaming.game_core.enums.DifficultyLevel difficulties = 2;

  // Статус матчу
  repeated string statuses = 3;

  // Час створення (від)
  google.protobuf.Timestamp created_from = 4;

  // Час створення (до)
  google.protobuf.Timestamp created_to = 5;

  // Час початку (від)
  google.protobuf.Timestamp started_from = 6;

  // Час початку (до)
  google.protobuf.Timestamp started_to = 7;

  // Час закінчення (від)
  google.protobuf.Timestamp ended_from = 8;

  // Час закінчення (до)
  google.protobuf.Timestamp ended_to = 9;
}

// Пагінація
message Pagination {
  // Номер сторінки
  int32 page = 1;

  // Розмір сторінки
  int32 page_size = 2;
}

// Інформація про пагінацію
message PaginationInfo {
  // Поточна сторінка
  int32 current_page = 1;

  // Розмір сторінки
  int32 page_size = 2;

  // Загальна кількість сторінок
  int32 total_pages = 3;

  // Загальна кількість елементів
  int64 total_elements = 4;

  // Чи є наступна сторінка
  bool has_next = 5;

  // Чи є попередня сторінка
  bool has_previous = 6;
}

// Сортування
message Sorting {
  // Поле для сортування
  string field = 1;

  // Напрямок сортування
  SortDirection direction = 2;
}

// Напрямок сортування
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}
