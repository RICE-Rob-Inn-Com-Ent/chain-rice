syntax = "proto3";

package gaming.game_core.services;

import "gaming/game_core/messages/player_models.proto";
import "gaming/game_core/messages/game_events.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/gaming/game_core/services";

// Сервіс управління гравцями
service PlayerService {
  // Створити нового гравця
  rpc CreatePlayer(CreatePlayerRequest) returns (CreatePlayerResponse);

  // Отримати гравця за ID
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse);

  // Оновити гравця
  rpc UpdatePlayer(UpdatePlayerRequest) returns (UpdatePlayerResponse);

  // Видалити гравця
  rpc DeletePlayer(DeletePlayerRequest) returns (google.protobuf.Empty);

  // Отримати список гравців
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);

  // Отримати профіль гравця
  rpc GetPlayerProfile(GetPlayerProfileRequest) returns (GetPlayerProfileResponse);

  // Оновити профіль гравця
  rpc UpdatePlayerProfile(UpdatePlayerProfileRequest) returns (UpdatePlayerProfileResponse);

  // Отримати статистику гравця
  rpc GetPlayerStatistics(GetPlayerStatisticsRequest) returns (GetPlayerStatisticsResponse);

  // Оновити статистику гравця
  rpc UpdatePlayerStatistics(UpdatePlayerStatisticsRequest) returns (UpdatePlayerStatisticsResponse);

  // Отримати налаштування гравця
  rpc GetPlayerSettings(GetPlayerSettingsRequest) returns (GetPlayerSettingsResponse);

  // Оновити налаштування гравця
  rpc UpdatePlayerSettings(UpdatePlayerSettingsRequest) returns (UpdatePlayerSettingsResponse);

  // Отримати інвентар гравця
  rpc GetPlayerInventory(GetPlayerInventoryRequest) returns (GetPlayerInventoryResponse);

  // Додати предмет до інвентаря
  rpc AddItemToInventory(AddItemToInventoryRequest) returns (AddItemToInventoryResponse);

  // Видалити предмет з інвентаря
  rpc RemoveItemFromInventory(RemoveItemFromInventoryRequest) returns (RemoveItemFromInventoryResponse);

  // Отримати навички гравця
  rpc GetPlayerSkills(GetPlayerSkillsRequest) returns (GetPlayerSkillsResponse);

  // Додати навичку гравцю
  rpc AddPlayerSkill(AddPlayerSkillRequest) returns (AddPlayerSkillResponse);

  // Оновити навичку гравця
  rpc UpdatePlayerSkill(UpdatePlayerSkillRequest) returns (UpdatePlayerSkillResponse);

  // Отримати досягнення гравця
  rpc GetPlayerAchievements(GetPlayerAchievementsRequest) returns (GetPlayerAchievementsResponse);

  // Додати досягнення гравцю
  rpc AddPlayerAchievement(AddPlayerAchievementRequest) returns (AddPlayerAchievementResponse);

  // Оновити досягнення гравця
  rpc UpdatePlayerAchievement(UpdatePlayerAchievementRequest) returns (UpdatePlayerAchievementResponse);

  // Пошук гравців
  rpc SearchPlayers(SearchPlayersRequest) returns (SearchPlayersResponse);

  // Отримати рекомендації гравців
  rpc GetPlayerRecommendations(GetPlayerRecommendationsRequest) returns (GetPlayerRecommendationsResponse);

  // Отримати друзів гравця
  rpc GetPlayerFriends(GetPlayerFriendsRequest) returns (GetPlayerFriendsResponse);

  // Додати друга
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);

  // Видалити друга
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);

  // Отримати блокованих гравців
  rpc GetBlockedPlayers(GetBlockedPlayersRequest) returns (GetBlockedPlayersResponse);

  // Заблокувати гравця
  rpc BlockPlayer(BlockPlayerRequest) returns (BlockPlayerResponse);

  // Розблокувати гравця
  rpc UnblockPlayer(UnblockPlayerRequest) returns (UnblockPlayerResponse);

  // Отримати історію гравця
  rpc GetPlayerHistory(GetPlayerHistoryRequest) returns (GetPlayerHistoryResponse);
}

// Запит створення гравця
message CreatePlayerRequest {
  // Дані гравця
  gaming.game_core.messages.Player player = 1;

  // Додаткові параметри
  map<string, string> parameters = 2;
}

// Відповідь створення гравця
message CreatePlayerResponse {
  // Створений гравець
  gaming.game_core.messages.Player player = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит отримання гравця
message GetPlayerRequest {
  // Ідентифікатор гравця
  string player_id = 1;
}

// Відповідь отримання гравця
message GetPlayerResponse {
  // Гравець
  gaming.game_core.messages.Player player = 1;
}

// Запит оновлення гравця
message UpdatePlayerRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Дані для оновлення
  gaming.game_core.messages.Player player = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення гравця
message UpdatePlayerResponse {
  // Оновлений гравець
  gaming.game_core.messages.Player player = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит видалення гравця
message DeletePlayerRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Причина видалення
  string reason = 2;
}

// Запит списку гравців
message ListPlayersRequest {
  // Фільтри
  PlayerFilters filters = 1;

  // Пагінація
  Pagination pagination = 2;

  // Сортування
  Sorting sorting = 3;
}

// Відповідь списку гравців
message ListPlayersResponse {
  // Список гравців
  repeated gaming.game_core.messages.Player players = 1;

  // Загальна кількість
  int64 total_count = 2;

  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Запит профілю гравця
message GetPlayerProfileRequest {
  // Ідентифікатор гравця
  string player_id = 1;
}

// Відповідь профілю гравця
message GetPlayerProfileResponse {
  // Профіль гравця
  gaming.game_core.messages.PlayerProfile profile = 1;
}

// Запит оновлення профілю гравця
message UpdatePlayerProfileRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Дані профілю для оновлення
  gaming.game_core.messages.PlayerProfile profile = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення профілю гравця
message UpdatePlayerProfileResponse {
  // Оновлений профіль гравця
  gaming.game_core.messages.PlayerProfile profile = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит статистики гравця
message GetPlayerStatisticsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Фільтри
  PlayerStatsFilters filters = 2;
}

// Відповідь статистики гравця
message GetPlayerStatisticsResponse {
  // Статистика гравця
  gaming.game_core.messages.PlayerStatistics statistics = 1;

  // Додаткові метрики
  map<string, double> additional_metrics = 2;
}

// Запит оновлення статистики гравця
message UpdatePlayerStatisticsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Дані статистики для оновлення
  gaming.game_core.messages.PlayerStatistics statistics = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення статистики гравця
message UpdatePlayerStatisticsResponse {
  // Оновлена статистика гравця
  gaming.game_core.messages.PlayerStatistics statistics = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит налаштувань гравця
message GetPlayerSettingsRequest {
  // Ідентифікатор гравця
  string player_id = 1;
}

// Відповідь налаштувань гравця
message GetPlayerSettingsResponse {
  // Налаштування гравця
  gaming.game_core.messages.PlayerSettings settings = 1;
}

// Запит оновлення налаштувань гравця
message UpdatePlayerSettingsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Дані налаштувань для оновлення
  gaming.game_core.messages.PlayerSettings settings = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь оновлення налаштувань гравця
message UpdatePlayerSettingsResponse {
  // Оновлені налаштування гравця
  gaming.game_core.messages.PlayerSettings settings = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит інвентаря гравця
message GetPlayerInventoryRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Фільтри
  InventoryFilters filters = 2;
}

// Відповідь інвентаря гравця
message GetPlayerInventoryResponse {
  // Інвентар гравця
  gaming.game_core.messages.PlayerInventory inventory = 1;
}

// Запит додавання предмета до інвентаря
message AddItemToInventoryRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Дані предмета
  gaming.game_core.messages.InventoryItem item = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь додавання предмета до інвентаря
message AddItemToInventoryResponse {
  // Доданий предмет
  gaming.game_core.messages.InventoryItem item = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит видалення предмета з інвентаря
message RemoveItemFromInventoryRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор предмета
  string item_id = 2;

  // Кількість для видалення
  int32 quantity = 3;

  // Причина видалення
  string reason = 4;
}

// Відповідь видалення предмета з інвентаря
message RemoveItemFromInventoryResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;
}

// Запит навичок гравця
message GetPlayerSkillsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Фільтри
  SkillFilters filters = 2;
}

// Відповідь навичок гравця
message GetPlayerSkillsResponse {
  // Список навичок гравця
  repeated gaming.game_core.messages.PlayerSkill skills = 1;

  // Загальна кількість навичок
  int64 total_count = 2;
}

// Запит додавання навички гравцю
message AddPlayerSkillRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Дані навички
  gaming.game_core.messages.PlayerSkill skill = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь додавання навички гравцю
message AddPlayerSkillResponse {
  // Додана навичка
  gaming.game_core.messages.PlayerSkill skill = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит оновлення навички гравця
message UpdatePlayerSkillRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор навички
  string skill_id = 2;

  // Дані навички для оновлення
  gaming.game_core.messages.PlayerSkill skill = 3;

  // Додаткові параметри
  map<string, string> parameters = 4;
}

// Відповідь оновлення навички гравця
message UpdatePlayerSkillResponse {
  // Оновлена навичка
  gaming.game_core.messages.PlayerSkill skill = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит досягнень гравця
message GetPlayerAchievementsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Фільтри
  AchievementFilters filters = 2;
}

// Відповідь досягнень гравця
message GetPlayerAchievementsResponse {
  // Список досягнень гравця
  repeated gaming.game_core.messages.PlayerAchievement achievements = 1;

  // Загальна кількість досягнень
  int64 total_count = 2;
}

// Запит додавання досягнення гравцю
message AddPlayerAchievementRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Дані досягнення
  gaming.game_core.messages.PlayerAchievement achievement = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь додавання досягнення гравцю
message AddPlayerAchievementResponse {
  // Додане досягнення
  gaming.game_core.messages.PlayerAchievement achievement = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит оновлення досягнення гравця
message UpdatePlayerAchievementRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор досягнення
  string achievement_id = 2;

  // Дані досягнення для оновлення
  gaming.game_core.messages.PlayerAchievement achievement = 3;

  // Додаткові параметри
  map<string, string> parameters = 4;
}

// Відповідь оновлення досягнення гравця
message UpdatePlayerAchievementResponse {
  // Оновлене досягнення
  gaming.game_core.messages.PlayerAchievement achievement = 1;

  // Статус операції
  string status = 2;

  // Повідомлення
  string message = 3;
}

// Запит пошуку гравців
message SearchPlayersRequest {
  // Пошуковий запит
  string query = 1;

  // Фільтри
  PlayerFilters filters = 2;

  // Пагінація
  Pagination pagination = 3;

  // Сортування
  Sorting sorting = 4;
}

// Відповідь пошуку гравців
message SearchPlayersResponse {
  // Список знайдених гравців
  repeated gaming.game_core.messages.Player players = 1;

  // Загальна кількість результатів
  int64 total_count = 2;

  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;

  // Час пошуку (в мілісекундах)
  int64 search_time_ms = 4;
}

// Запит рекомендацій гравців
message GetPlayerRecommendationsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Кількість рекомендацій
  int32 limit = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь рекомендацій гравців
message GetPlayerRecommendationsResponse {
  // Список рекомендованих гравців
  repeated gaming.game_core.messages.Player recommended_players = 1;

  // Загальна кількість рекомендацій
  int64 total_count = 2;

  // Додаткові дані рекомендацій
  map<string, string> recommendation_data = 3;
}

// Запит друзів гравця
message GetPlayerFriendsRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Фільтри
  FriendFilters filters = 2;

  // Пагінація
  Pagination pagination = 3;
}

// Відповідь друзів гравця
message GetPlayerFriendsResponse {
  // Список друзів
  repeated string friend_ids = 1;

  // Загальна кількість друзів
  int64 total_count = 2;

  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Запит додавання друга
message AddFriendRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор друга
  string friend_id = 2;

  // Додаткові параметри
  map<string, string> parameters = 3;
}

// Відповідь додавання друга
message AddFriendResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;
}

// Запит видалення друга
message RemoveFriendRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор друга
  string friend_id = 2;

  // Причина видалення
  string reason = 3;
}

// Відповідь видалення друга
message RemoveFriendResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;
}

// Запит блокованих гравців
message GetBlockedPlayersRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Пагінація
  Pagination pagination = 2;
}

// Відповідь блокованих гравців
message GetBlockedPlayersResponse {
  // Список блокованих гравців
  repeated string blocked_player_ids = 1;

  // Загальна кількість блокованих гравців
  int64 total_count = 2;

  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Запит блокування гравця
message BlockPlayerRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор гравця для блокування
  string blocked_player_id = 2;

  // Причина блокування
  string reason = 3;
}

// Відповідь блокування гравця
message BlockPlayerResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;
}

// Запит розблокування гравця
message UnblockPlayerRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Ідентифікатор гравця для розблокування
  string unblocked_player_id = 2;

  // Причина розблокування
  string reason = 3;
}

// Відповідь розблокування гравця
message UnblockPlayerResponse {
  // Статус операції
  string status = 1;

  // Повідомлення
  string message = 2;
}

// Запит історії гравця
message GetPlayerHistoryRequest {
  // Ідентифікатор гравця
  string player_id = 1;

  // Фільтри
  PlayerHistoryFilters filters = 2;

  // Пагінація
  Pagination pagination = 3;
}

// Відповідь історії гравця
message GetPlayerHistoryResponse {
  // Список записів історії
  repeated gaming.game_core.messages.GameEvent history_events = 1;

  // Загальна кількість записів
  int64 total_count = 2;

  // Інформація про пагінацію
  PaginationInfo pagination_info = 3;
}

// Фільтри гравців
message PlayerFilters {
  // Роль гравця
  repeated gaming.game_core.enums.PlayerRole roles = 1;

  // Рівень доступу
  repeated gaming.game_core.enums.AccessLevel access_levels = 2;

  // Країна гравця
  string country = 3;

  // Місто гравця
  string city = 4;

  // Мова гравця
  string language = 5;

  // Мінімальний рівень
  int32 min_level = 6;

  // Максимальний рівень
  int32 max_level = 7;

  // Мінімальний рейтинг
  double min_rating = 8;

  // Максимальний рейтинг
  double max_rating = 9;

  // Час створення (від)
  google.protobuf.Timestamp created_from = 10;

  // Час створення (до)
  google.protobuf.Timestamp created_to = 11;

  // Час останнього входу (від)
  google.protobuf.Timestamp last_login_from = 12;

  // Час останнього входу (до)
  google.protobuf.Timestamp last_login_to = 13;
}

// Фільтри статистики гравців
message PlayerStatsFilters {
  // Період часу (від)
  google.protobuf.Timestamp period_from = 1;

  // Період часу (до)
  google.protobuf.Timestamp period_to = 2;

  // Режим гри
  repeated gaming.game_core.enums.GameMode game_modes = 3;

  // Тип сесії
  repeated gaming.game_core.enums.SessionType session_types = 4;

  // Роль гравця
  repeated gaming.game_core.enums.PlayerRole roles = 5;
}

// Фільтри інвентаря
message InventoryFilters {
  // Тип предмета
  repeated string item_types = 1;

  // Якість предмета
  repeated string qualities = 2;

  // Рідкість предмета
  repeated string rarities = 3;

  // Рівень предмета
  int32 min_level = 4;

  // Рівень предмета
  int32 max_level = 5;
}

// Фільтри навичок
message SkillFilters {
  // Тип навички
  repeated string skill_types = 1;

  // Мінімальний рівень навички
  int32 min_level = 2;

  // Максимальний рівень навички
  int32 max_level = 3;
}

// Фільтри досягнень
message AchievementFilters {
  // Тип досягнення
  repeated string achievement_types = 1;

  // Чи завершено досягнення
  bool completed = 2;

  // Час завершення (від)
  google.protobuf.Timestamp completed_from = 3;

  // Час завершення (до)
  google.protobuf.Timestamp completed_to = 4;
}

// Фільтри друзів
message FriendFilters {
  // Статус дружби
  repeated string friendship_statuses = 1;

  // Час додавання (від)
  google.protobuf.Timestamp added_from = 2;

  // Час додавання (до)
  google.protobuf.Timestamp added_to = 3;
}

// Фільтри історії гравців
message PlayerHistoryFilters {
  // Тип події
  repeated gaming.game_core.messages.GameEventType event_types = 1;

  // Час події (від)
  google.protobuf.Timestamp event_from = 2;

  // Час події (до)
  google.protobuf.Timestamp event_to = 3;

  // Ідентифікатор сесії
  string session_id = 4;
}

// Пагінація
message Pagination {
  // Номер сторінки
  int32 page = 1;

  // Розмір сторінки
  int32 page_size = 2;
}

// Інформація про пагінацію
message PaginationInfo {
  // Поточна сторінка
  int32 current_page = 1;

  // Розмір сторінки
  int32 page_size = 2;

  // Загальна кількість сторінок
  int32 total_pages = 3;

  // Загальна кількість елементів
  int64 total_elements = 4;

  // Чи є наступна сторінка
  bool has_next = 5;

  // Чи є попередня сторінка
  bool has_previous = 6;
}

// Сортування
message Sorting {
  // Поле для сортування
  string field = 1;

  // Напрямок сортування
  SortDirection direction = 2;
}

// Напрямок сортування
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}
