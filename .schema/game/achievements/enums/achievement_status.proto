syntax = "proto3";

package gaming.achievements.enums;

option go_package = "github.com/rice-dev/gaming/achievements/enums";

// Статуси досягнень
enum AchievementStatus {
  ACHIEVEMENT_STATUS_UNSPECIFIED = 0;

  // Заблоковане (недоступне)
  ACHIEVEMENT_STATUS_LOCKED = 1;

  // Доступне для виконання
  ACHIEVEMENT_STATUS_AVAILABLE = 2;

  // В процесі виконання
  ACHIEVEMENT_STATUS_IN_PROGRESS = 3;

  // Виконане
  ACHIEVEMENT_STATUS_COMPLETED = 4;

  // Нагорода отримана
  ACHIEVEMENT_STATUS_CLAIMED = 5;

  // Просрочене
  ACHIEVEMENT_STATUS_EXPIRED = 6;

  // Скасоване
  ACHIEVEMENT_STATUS_CANCELLED = 7;

  // Приховане
  ACHIEVEMENT_STATUS_HIDDEN = 8;
}

// Статуси прогресу досягнення
enum ProgressStatus {
  PROGRESS_STATUS_UNSPECIFIED = 0;

  // Не розпочато
  PROGRESS_STATUS_NOT_STARTED = 1;

  // В процесі
  PROGRESS_STATUS_IN_PROGRESS = 2;

  // Завершено
  PROGRESS_STATUS_COMPLETED = 3;

  // Перевиконано
  PROGRESS_STATUS_OVERACHIEVED = 4;

  // Скинуто
  PROGRESS_STATUS_RESET = 5;
}

// Типи блокування досягнень
enum LockType {
  LOCK_TYPE_UNSPECIFIED = 0;

  // Блокування за рівнем
  LOCK_TYPE_LEVEL = 1;

  // Блокування за часом
  LOCK_TYPE_TIME = 2;

  // Блокування за іншими досягненнями
  LOCK_TYPE_PREREQUISITE = 3;

  // Блокування за регіоном
  LOCK_TYPE_REGION = 4;

  // Блокування за платформою
  LOCK_TYPE_PLATFORM = 5;

  // Блокування за підпискою
  LOCK_TYPE_SUBSCRIPTION = 6;

  // Блокування за віком
  LOCK_TYPE_AGE = 7;

  // Блокування за верифікацією
  LOCK_TYPE_VERIFICATION = 8;
}
