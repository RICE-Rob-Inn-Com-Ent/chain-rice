syntax = "proto3";

package gaming.achievements.messages;

import "gaming/achievements/enums/achievement_types.proto";
import "gaming/achievements/enums/achievement_status.proto";
import "gaming/achievements/enums/reward_types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rice-dev/gaming/achievements/messages";

// Основна модель досягнення
message Achievement {
  // Унікальний ідентифікатор досягнення
  string id = 1;

  // Назва досягнення
  string name = 2;

  // Опис досягнення
  string description = 3;

  // Детальний опис
  string detailed_description = 4;

  // Тип досягнення
  gaming.achievements.enums.AchievementType type = 5;

  // Категорія досягнення
  gaming.achievements.enums.AchievementCategory category = 6;

  // Рівень складності
  gaming.achievements.enums.AchievementDifficulty difficulty = 7;

  // Статус досягнення
  gaming.achievements.enums.AchievementStatus status = 8;

  // Прогрес виконання
  AchievementProgress progress = 9;

  // Нагороди за досягнення
  repeated AchievementReward rewards = 10;

  // Умови виконання
  AchievementConditions conditions = 11;

  // Метадані
  AchievementMetadata metadata = 12;

  // Час створення
  google.protobuf.Timestamp created_at = 13;

  // Час оновлення
  google.protobuf.Timestamp updated_at = 14;

  // Час закінчення терміну дії
  google.protobuf.Timestamp expires_at = 15;
}

// Прогрес досягнення
message AchievementProgress {
  // Поточний прогрес
  int64 current_value = 1;

  // Максимальне значення
  int64 max_value = 2;

  // Відсоток виконання
  double percentage = 3;

  // Статус прогресу
  gaming.achievements.enums.ProgressStatus status = 4;

  // Час останнього оновлення прогресу
  google.protobuf.Timestamp last_updated = 5;

  // Додаткові дані прогресу
  map<string, string> progress_data = 6;
}

// Нагорода за досягнення
message AchievementReward {
  // Унікальний ідентифікатор нагороди
  string id = 1;

  // Тип нагороди
  gaming.achievements.enums.RewardType type = 2;

  // Рідкість нагороди
  gaming.achievements.enums.RewardRarity rarity = 3;

  // Кількість
  int64 amount = 4;

  // Ідентифікатор предмета/ресурсу
  string item_id = 5;

  // Метадані нагороди
  map<string, string> metadata = 6;

  // Статус нагороди
  gaming.achievements.enums.RewardStatus status = 7;

  // Час видачі
  google.protobuf.Timestamp distributed_at = 8;
}

// Умови виконання досягнення
message AchievementConditions {
  // Мінімальний рівень гравця
  int32 min_level = 1;

  // Максимальний рівень гравця
  int32 max_level = 2;

  // Необхідні попередні досягнення
  repeated string prerequisite_achievements = 3;

  // Необхідні предмети
  repeated string required_items = 4;

  // Необхідні навички
  repeated string required_skills = 5;

  // Обмеження за часом
  TimeConstraints time_constraints = 6;

  // Обмеження за локацією
  LocationConstraints location_constraints = 7;

  // Додаткові умови
  map<string, string> custom_conditions = 8;
}

// Обмеження за часом
message TimeConstraints {
  // Час початку доступності
  google.protobuf.Timestamp start_time = 1;

  // Час закінчення доступності
  google.protobuf.Timestamp end_time = 2;

  // Максимальний час виконання (в секундах)
  int64 max_duration_seconds = 3;

  // Часові зони
  repeated string timezones = 4;
}

// Обмеження за локацією
message LocationConstraints {
  // Дозволені регіони
  repeated string allowed_regions = 1;

  // Заборонені регіони
  repeated string blocked_regions = 2;

  // Дозволені платформи
  repeated string allowed_platforms = 3;

  // Координати для AR/VR
  repeated LocationCoordinate coordinates = 4;
}

// Координати локації
message LocationCoordinate {
  // Широта
  double latitude = 1;

  // Довгота
  double longitude = 2;

  // Висота
  double altitude = 3;

  // Радіус дії
  double radius_meters = 4;
}

// Метадані досягнення
message AchievementMetadata {
  // Іконка досягнення
  string icon_url = 1;

  // Зображення досягнення
  string image_url = 2;

  // Відео досягнення
  string video_url = 3;

  // Теги
  repeated string tags = 4;

  // Мова
  string language = 5;

  // Версія
  string version = 6;

  // Автор
  string author = 7;

  // Додаткові метадані
  map<string, string> additional_data = 8;
}

// Досягнення гравця
message PlayerAchievement {
  // Ідентифікатор гравця
  string player_id = 1;

  // Досягнення
  Achievement achievement = 2;

  // Час початку виконання
  google.protobuf.Timestamp started_at = 3;

  // Час завершення
  google.protobuf.Timestamp completed_at = 4;

  // Час отримання нагороди
  google.protobuf.Timestamp claimed_at = 5;

  // Додаткові дані гравця
  map<string, string> player_data = 6;
}

// Статистика досягнень
message AchievementStats {
  // Загальна кількість досягнень
  int64 total_achievements = 1;

  // Кількість завершених досягнень
  int64 completed_achievements = 2;

  // Кількість отриманих нагород
  int64 claimed_rewards = 3;

  // Відсоток завершення
  double completion_percentage = 4;

  // Середній час виконання (в секундах)
  int64 average_completion_time = 5;

  // Найшвидше виконання (в секундах)
  int64 fastest_completion_time = 6;

  // Статистика по категоріях
  map<string, int64> category_stats = 7;

  // Статистика по типах
  map<string, int64> type_stats = 8;
}
