# .vale.ini
# Generated by: cue export infra/configs/vale.cue
# Do not edit manually — edit infra/configs/vale.cue instead
#
# Setup:
#   vale sync   — downloads all configured styles
#   vale infra/docs/   — lint all docs
#   vale README.md     — lint single file

# ── global ────────────────────────────────────────────────
StylesPath   = infra/docs/.vale/styles
MinAlertLevel = suggestion

# ── formats — what vale scans ─────────────────────────────
[formats]
mdx = md

# ── markup — how vale parses each format ──────────────────
[*.{md,mdx}]
BasedOnStyles  = Vale, Google, Microsoft, write-good, proselint
TokenIgnores   = (?s)```.*?```       # ignore code blocks
BlockIgnores   = (?s)\|.*?\|         # ignore tables

[*.{yaml,yml}]
BasedOnStyles  = Vale
BlockIgnores   = (?s)#.*?$           # ignore inline comments

[*.rst]
BasedOnStyles  = Vale, Google

# ── Vale built-in rules ───────────────────────────────────
[Vale]
Vocab = rice                         # custom vocab — see below

Vale.Avoid        = YES
Vale.Repetition   = YES
Vale.Spelling     = YES
Vale.Terms        = YES

# ── Google developer docs style ───────────────────────────
[Google]
Google.Acronyms          = suggestion
Google.Colons            = warning
Google.DateFormat        = suggestion
Google.Exclamation       = warning
Google.FirstPerson       = suggestion
Google.Headings          = warning
Google.Latin             = warning
Google.LyHyphens         = warning
Google.OptionalPlurals   = warning
Google.Passive           = suggestion
Google.Parens            = warning
Google.Periods           = warning
Google.Quotes            = warning
Google.Ranges            = warning
Google.Semicolons        = warning
Google.Slang             = error
Google.Spacing           = error
Google.SpellCheck        = YES
Google.Units             = suggestion
Google.Will              = suggestion
Google.WordList          = error

# ── Microsoft writing style ───────────────────────────────
[Microsoft]
Microsoft.AMPM            = suggestion
Microsoft.Accessibility   = warning
Microsoft.Acronyms        = suggestion
Microsoft.AUTO            = suggestion
Microsoft.Avoid           = error
Microsoft.Contractions    = suggestion
Microsoft.DateFormat      = suggestion
Microsoft.Dashes          = suggestion
Microsoft.Ellipses        = suggestion
Microsoft.Foreign         = suggestion
Microsoft.GeneralURL      = suggestion
Microsoft.HeadingPunctuation = warning
Microsoft.Headings        = warning
Microsoft.Hyphens         = suggestion
Microsoft.OxfordComma     = suggestion
Microsoft.Passive         = suggestion
Microsoft.Percentages     = suggestion
Microsoft.Periods         = warning
Microsoft.Quotes          = suggestion
Microsoft.RangeFormat     = suggestion
Microsoft.Ranges          = suggestion
Microsoft.Semicolons      = suggestion
Microsoft.Spacing         = error
Microsoft.Terms           = error
Microsoft.Units           = suggestion
Microsoft.Wordiness       = warning

# ── write-good — clarity ──────────────────────────────────
[write-good]
write-good.Cliches        = warning
write-good.E-Prime        = NO         # too strict for tech docs
write-good.Illusions      = error
write-good.Passive        = suggestion
write-good.So             = suggestion
write-good.Sudden         = suggestion
write-good.ThereIs        = suggestion
write-good.TooWordy       = warning
write-good.Weasel         = warning

# ── proselint — prose quality ─────────────────────────────
[proselint]
proselint.Annotations     = warning
proselint.But             = NO
proselint.Cliches         = warning
proselint.Corporate       = warning
proselint.DateCase        = warning
proselint.Hedging         = suggestion
proselint.Hyperbole       = warning
proselint.Jargon          = warning
proselint.LGBTTerms       = error
proselint.Malapropisms    = error
proselint.Needless        = warning
proselint.Oxymorons       = warning
proselint.Racism          = error
proselint.Skunked         = warning
proselint.Spelling        = YES
proselint.Typography      = warning
proselint.Uncomparables   = warning
```

