syntax = "proto3";

package integrations.webhooks.enums;

option go_package = "github.com/rice-dev/integrations/webhooks/enums";

// Webhook Retry Policy for handling failed webhook deliveries
enum WebhookRetryPolicy {
  WEBHOOK_RETRY_POLICY_UNSPECIFIED = 0;
  
  // No Retry
  WEBHOOK_RETRY_POLICY_NONE = 1;            // No retry attempts
  WEBHOOK_RETRY_POLICY_NO_RETRY = 2;        // Explicitly no retry
  
  // Fixed Retry Policies
  WEBHOOK_RETRY_POLICY_FIXED = 10;          // Fixed delay between retries
  WEBHOOK_RETRY_POLICY_FIXED_1_SECOND = 11; // Fixed 1 second delay
  WEBHOOK_RETRY_POLICY_FIXED_5_SECONDS = 12; // Fixed 5 second delay
  WEBHOOK_RETRY_POLICY_FIXED_10_SECONDS = 13; // Fixed 10 second delay
  WEBHOOK_RETRY_POLICY_FIXED_30_SECONDS = 14; // Fixed 30 second delay
  WEBHOOK_RETRY_POLICY_FIXED_1_MINUTE = 15;  // Fixed 1 minute delay
  WEBHOOK_RETRY_POLICY_FIXED_5_MINUTES = 16; // Fixed 5 minute delay
  WEBHOOK_RETRY_POLICY_FIXED_10_MINUTES = 17; // Fixed 10 minute delay
  WEBHOOK_RETRY_POLICY_FIXED_30_MINUTES = 18; // Fixed 30 minute delay
  WEBHOOK_RETRY_POLICY_FIXED_1_HOUR = 19;    // Fixed 1 hour delay
  
  // Linear Retry Policies
  WEBHOOK_RETRY_POLICY_LINEAR = 20;         // Linear increase in delay
  WEBHOOK_RETRY_POLICY_LINEAR_1_SECOND = 21; // Linear starting at 1 second
  WEBHOOK_RETRY_POLICY_LINEAR_5_SECONDS = 22; // Linear starting at 5 seconds
  WEBHOOK_RETRY_POLICY_LINEAR_10_SECONDS = 23; // Linear starting at 10 seconds
  WEBHOOK_RETRY_POLICY_LINEAR_30_SECONDS = 24; // Linear starting at 30 seconds
  WEBHOOK_RETRY_POLICY_LINEAR_1_MINUTE = 25;  // Linear starting at 1 minute
  WEBHOOK_RETRY_POLICY_LINEAR_5_MINUTES = 26; // Linear starting at 5 minutes
  
  // Exponential Backoff Policies
  WEBHOOK_RETRY_POLICY_EXPONENTIAL = 30;    // Exponential backoff
  WEBHOOK_RETRY_POLICY_EXPONENTIAL_1_SECOND = 31; // Exponential starting at 1 second
  WEBHOOK_RETRY_POLICY_EXPONENTIAL_5_SECONDS = 32; // Exponential starting at 5 seconds
  WEBHOOK_RETRY_POLICY_EXPONENTIAL_10_SECONDS = 33; // Exponential starting at 10 seconds
  WEBHOOK_RETRY_POLICY_EXPONENTIAL_30_SECONDS = 34; // Exponential starting at 30 seconds
  WEBHOOK_RETRY_POLICY_EXPONENTIAL_1_MINUTE = 35;  // Exponential starting at 1 minute
  WEBHOOK_RETRY_POLICY_EXPONENTIAL_5_MINUTES = 36; // Exponential starting at 5 minutes
  
  // Jittered Retry Policies
  WEBHOOK_RETRY_POLICY_JITTER = 40;         // Jittered retry with randomization
  WEBHOOK_RETRY_POLICY_JITTER_FIXED = 41;   // Jittered fixed delay
  WEBHOOK_RETRY_POLICY_JITTER_LINEAR = 42;  // Jittered linear delay
  WEBHOOK_RETRY_POLICY_JITTER_EXPONENTIAL = 43; // Jittered exponential delay
  WEBHOOK_RETRY_POLICY_FULL_JITTER = 44;    // Full jitter randomization
  WEBHOOK_RETRY_POLICY_EQUAL_JITTER = 45;   // Equal jitter randomization
  WEBHOOK_RETRY_POLICY_DECORRELATED_JITTER = 46; // Decorrelated jitter
  
  // Adaptive Retry Policies
  WEBHOOK_RETRY_POLICY_ADAPTIVE = 50;       // Adaptive retry based on success rate
  WEBHOOK_RETRY_POLICY_ADAPTIVE_EXPONENTIAL = 51; // Adaptive exponential backoff
  WEBHOOK_RETRY_POLICY_ADAPTIVE_LINEAR = 52; // Adaptive linear backoff
  WEBHOOK_RETRY_POLICY_ADAPTIVE_JITTER = 53; // Adaptive jittered backoff
  
  // Circuit Breaker Retry Policies
  WEBHOOK_RETRY_POLICY_CIRCUIT_BREAKER = 60; // Circuit breaker pattern
  WEBHOOK_RETRY_POLICY_CIRCUIT_BREAKER_OPEN = 61; // Circuit breaker open state
  WEBHOOK_RETRY_POLICY_CIRCUIT_BREAKER_HALF_OPEN = 62; // Circuit breaker half-open state
  WEBHOOK_RETRY_POLICY_CIRCUIT_BREAKER_CLOSED = 63; // Circuit breaker closed state
  
  // Time-based Retry Policies
  WEBHOOK_RETRY_POLICY_IMMEDIATE = 70;      // Immediate retry
  WEBHOOK_RETRY_POLICY_DELAYED = 71;        // Delayed retry
  WEBHOOK_RETRY_POLICY_SCHEDULED = 72;      // Scheduled retry at specific time
  WEBHOOK_RETRY_POLICY_CUSTOM_SCHEDULE = 73; // Custom retry schedule
  
  // Conditional Retry Policies
  WEBHOOK_RETRY_POLICY_CONDITIONAL = 80;    // Conditional retry based on error type
  WEBHOOK_RETRY_POLICY_ERROR_SPECIFIC = 81; // Error-specific retry policy
  WEBHOOK_RETRY_POLICY_STATUS_CODE_SPECIFIC = 82; // Status code specific retry
  WEBHOOK_RETRY_POLICY_RETRYABLE_ERRORS = 83; // Only retry on retryable errors
  WEBHOOK_RETRY_POLICY_NON_RETRYABLE_ERRORS = 84; // Don't retry on non-retryable errors
  
  // Rate Limited Retry Policies
  WEBHOOK_RETRY_POLICY_RATE_LIMITED = 90;   // Retry with rate limiting
  WEBHOOK_RETRY_POLICY_RATE_LIMITED_EXPONENTIAL = 91; // Rate limited exponential
  WEBHOOK_RETRY_POLICY_RATE_LIMITED_LINEAR = 92; // Rate limited linear
  WEBHOOK_RETRY_POLICY_RATE_LIMITED_JITTER = 93; // Rate limited jitter
  
  // Custom Retry Policies
  WEBHOOK_RETRY_POLICY_CUSTOM = 100;        // Custom retry policy
  WEBHOOK_RETRY_POLICY_USER_DEFINED = 101;  // User-defined retry policy
  WEBHOOK_RETRY_POLICY_APPLICATION_SPECIFIC = 102; // Application-specific retry
  WEBHOOK_RETRY_POLICY_BUSINESS_SPECIFIC = 103; // Business-specific retry
  
  // Legacy Retry Policies
  WEBHOOK_RETRY_POLICY_LEGACY = 110;        // Legacy retry policy
  WEBHOOK_RETRY_POLICY_DEPRECATED = 111;    // Deprecated retry policy
  WEBHOOK_RETRY_POLICY_MIGRATION = 112;     // Migration retry policy
}
