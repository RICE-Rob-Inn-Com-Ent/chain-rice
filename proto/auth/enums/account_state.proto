syntax = "proto3";

package com.auth.enums;

// AccountState represents the current status of a user account.
enum AccountState {
  UNSPECIFIED = 0;  // Not specified
  ACTIVE = 1;   // Active account
  LOCKED = 2;   // Locked due to failed attempts
  SUSPENDED = 3;    // Temporarily suspended
  PENDING_VERIFICATION = 4; // Awaiting email/identity verification
  BANNED = 5;   // Permanently banned
}