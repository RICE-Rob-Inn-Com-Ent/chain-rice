syntax = "proto3";

package finance.payments.enums;

// Status of payment processing
enum PaymentStatus {
  // Default value
  PAYMENT_STATUS_UNSPECIFIED = 0;
  
  // Pending - payment is being processed
  PAYMENT_STATUS_PENDING = 1;
  
  // Processing - payment is being processed
  PAYMENT_STATUS_PROCESSING = 2;
  
  // Authorized - payment is authorized but not captured
  PAYMENT_STATUS_AUTHORIZED = 3;
  
  // Captured - payment has been captured
  PAYMENT_STATUS_CAPTURED = 4;
  
  // Settled - payment has been settled
  PAYMENT_STATUS_SETTLED = 5;
  
  // Completed - payment is completed
  PAYMENT_STATUS_COMPLETED = 6;
  
  // Failed - payment failed
  PAYMENT_STATUS_FAILED = 7;
  
  // Declined - payment was declined
  PAYMENT_STATUS_DECLINED = 8;
  
  // Cancelled - payment was cancelled
  PAYMENT_STATUS_CANCELLED = 9;
  
  // Refunded - payment has been refunded
  PAYMENT_STATUS_REFUNDED = 10;
  
  // Partially refunded - payment has been partially refunded
  PAYMENT_STATUS_PARTIALLY_REFUNDED = 11;
  
  // Chargeback - payment has been charged back
  PAYMENT_STATUS_CHARGEBACK = 12;
  
  // Disputed - payment is under dispute
  PAYMENT_STATUS_DISPUTED = 13;
  
  // Expired - payment authorization expired
  PAYMENT_STATUS_EXPIRED = 14;
  
  // Voided - payment has been voided
  PAYMENT_STATUS_VOIDED = 15;
  
  // Reversed - payment has been reversed
  PAYMENT_STATUS_REVERSED = 16;
  
  // Held - payment is being held
  PAYMENT_STATUS_HELD = 17;
  
  // Released - payment hold has been released
  PAYMENT_STATUS_RELEASED = 18;
}
