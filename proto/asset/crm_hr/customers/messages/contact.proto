syntax = "proto3";

package crm_hr.customers.messages;

import "google/protobuf/timestamp.proto";
import "crm_hr/customers/enums/contact_preference.proto";

option go_package = "github.com/rice-dev/crm-hr/customers/messages";

// Contact represents a contact person associated with a customer
message Contact {
  // Unique identifier for the contact
  string id = 1;
  
  // Associated customer ID
  string customer_id = 2;
  
  // Contact type (primary, billing, technical, decision maker, etc.)
  string contact_type = 3;
  
  // Personal information
  string first_name = 4;
  string last_name = 5;
  string middle_name = 6;
  string title = 7;
  string department = 8;
  string job_function = 9;
  
  // Contact details
  repeated EmailAddress email_addresses = 10;
  repeated PhoneNumber phone_numbers = 11;
  repeated SocialMedia social_media = 12;
  
  // Business information
  string company_name = 13;
  string company_size = 14;
  string industry = 15;
  string seniority_level = 16;
  string influence_level = 17;
  
  // Contact preferences
  repeated crm_hr.customers.enums.ContactPreference preferences = 18;
  string preferred_contact_method = 19;
  string preferred_contact_time = 20;
  string timezone = 21;
  string language = 22;
  
  // Relationship information
  string relationship_strength = 23; // strong, medium, weak
  string relationship_status = 24; // active, inactive, former
  string decision_making_role = 25; // influencer, decision maker, user, gatekeeper
  string budget_authority = 26; // high, medium, low, none
  
  // Additional information
  string notes = 27;
  string bio = 28;
  repeated string interests = 29;
  repeated string pain_points = 30;
  
  // Status flags
  bool is_primary = 31;
  bool is_active = 32;
  bool is_verified = 33;
  bool do_not_contact = 34;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 35;
  google.protobuf.Timestamp updated_at = 36;
  google.protobuf.Timestamp last_contacted_at = 37;
  google.protobuf.Timestamp last_responded_at = 38;
}

// EmailAddress represents an email address for a contact
message EmailAddress {
  // Unique identifier for the email address
  string id = 1;
  
  // Associated contact ID
  string contact_id = 1;
  
  // Email details
  string email = 2;
  string email_type = 3; // primary, work, personal, other
  bool is_primary = 4;
  bool is_verified = 5;
  bool is_active = 6;
  
  // Verification information
  google.protobuf.Timestamp verified_at = 7;
  string verification_method = 8;
  string verification_status = 9;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// PhoneNumber represents a phone number for a contact
message PhoneNumber {
  // Unique identifier for the phone number
  string id = 1;
  
  // Associated contact ID
  string contact_id = 2;
  
  // Phone details
  string number = 3;
  string country_code = 4;
  string phone_type = 5; // mobile, work, home, fax, other
  bool is_primary = 6;
  bool is_verified = 7;
  bool is_active = 8;
  
  // Verification information
  google.protobuf.Timestamp verified_at = 9;
  string verification_method = 10;
  string verification_status = 11;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// SocialMedia represents a social media profile for a contact
message SocialMedia {
  // Unique identifier for the social media profile
  string id = 1;
  
  // Associated contact ID
  string contact_id = 2;
  
  // Social media details
  string platform = 3; // linkedin, twitter, facebook, instagram, etc.
  string username = 4;
  string profile_url = 5;
  bool is_primary = 6;
  bool is_verified = 7;
  bool is_active = 8;
  
  // Profile information
  string display_name = 9;
  string bio = 10;
  int32 followers_count = 11;
  int32 following_count = 12;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  google.protobuf.Timestamp last_activity_at = 15;
}

// ContactList represents a collection of contacts for marketing or communication
message ContactList {
  // Unique identifier for the contact list
  string id = 1;
  
  // List information
  string name = 2;
  string description = 3;
  string list_type = 4; // marketing, newsletter, segment, manual, etc.
  
  // List criteria (for dynamic lists)
  string criteria = 5; // JSON string with filtering rules
  bool is_dynamic = 6;
  
  // List metadata
  int32 contact_count = 7;
  bool is_active = 8;
  string created_by = 9;
  string team_id = 10;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp last_used_at = 13;
}

// ContactListMember represents a contact's membership in a contact list
message ContactListMember {
  // Unique identifier for the membership
  string id = 1;
  
  // Associated IDs
  string contact_list_id = 2;
  string contact_id = 3;
  
  // Membership information
  google.protobuf.Timestamp added_at = 4;
  string added_by = 5;
  string added_method = 6; // manual, import, signup, etc.
  
  // Status
  bool is_active = 7;
  google.protobuf.Timestamp removed_at = 8;
  string removed_by = 9;
  string removal_reason = 10;
}
