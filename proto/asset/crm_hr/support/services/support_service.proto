syntax = "proto3";

package crm_hr.support.services;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "crm_hr/support/messages/support_ticket.proto";
import "crm_hr/support/messages/support_reply.proto";
import "crm_hr/support/messages/support_sla.proto";
import "crm_hr/support/enums/ticket_status.proto";
import "crm_hr/support/enums/ticket_priority.proto";
import "crm_hr/support/enums/support_channel.proto";

option go_package = "github.com/rice-dev/crm-hr/support/services";

// SupportService provides comprehensive support ticket management functionality
service SupportService {
  // Support Ticket Management
  rpc CreateSupportTicket(CreateSupportTicketRequest) returns (SupportTicket);
  rpc GetSupportTicket(GetSupportTicketRequest) returns (SupportTicket);
  rpc UpdateSupportTicket(UpdateSupportTicketRequest) returns (SupportTicket);
  rpc DeleteSupportTicket(DeleteSupportTicketRequest) returns (google.protobuf.Empty);
  rpc ListSupportTickets(ListSupportTicketsRequest) returns (ListSupportTicketsResponse);
  
  // Support Ticket Business Operations
  rpc AssignTicket(AssignTicketRequest) returns (SupportTicket);
  rpc EscalateTicket(EscalateTicketRequest) returns (SupportTicket);
  rpc ResolveTicket(ResolveTicketRequest) returns (SupportTicket);
  rpc CloseTicket(CloseTicketRequest) returns (SupportTicket);
  rpc ReopenTicket(ReopenTicketRequest) returns (SupportTicket);
  rpc SearchTickets(SearchTicketsRequest) returns (SearchTicketsResponse);
  rpc GetTicketMetrics(GetTicketMetricsRequest) returns (SupportTicketMetrics);
  
  // Support Reply Management
  rpc CreateSupportReply(CreateSupportReplyRequest) returns (SupportReply);
  rpc GetSupportReply(GetSupportReplyRequest) returns (SupportReply);
  rpc UpdateSupportReply(UpdateSupportReplyRequest) returns (SupportReply);
  rpc DeleteSupportReply(DeleteSupportReplyRequest) returns (google.protobuf.Empty);
  rpc ListSupportReplies(ListSupportRepliesRequest) returns (ListSupportRepliesResponse);
  
  // Support Reply Business Operations
  rpc SendReply(SendReplyRequest) returns (SupportReply);
  rpc MarkReplyAsRead(MarkReplyAsReadRequest) returns (SupportReply);
  rpc SearchReplies(SearchRepliesRequest) returns (SearchRepliesResponse);
  rpc GetReplyAnalytics(GetReplyAnalyticsRequest) returns (SupportReplyAnalytics);
  
  // Support Conversation Management
  rpc CreateSupportConversation(CreateSupportConversationRequest) returns (SupportConversation);
  rpc GetSupportConversation(GetSupportConversationRequest) returns (SupportConversation);
  rpc UpdateSupportConversation(UpdateSupportConversationRequest) returns (SupportConversation);
  rpc DeleteSupportConversation(DeleteSupportConversationRequest) returns (google.protobuf.Empty);
  rpc ListSupportConversations(ListSupportConversationsRequest) returns (ListSupportConversationsResponse);
  
  // Support SLA Management
  rpc CreateSupportSLA(CreateSupportSLARequest) returns (SupportSLA);
  rpc GetSupportSLA(GetSupportSLARequest) returns (SupportSLA);
  rpc UpdateSupportSLA(UpdateSupportSLARequest) returns (SupportSLA);
  rpc DeleteSupportSLA(DeleteSupportSLARequest) returns (google.protobuf.Empty);
  rpc ListSupportSLAs(ListSupportSLAsRequest) returns (ListSupportSLAsResponse);
  
  // Support SLA Business Operations
  rpc CheckSLACompliance(CheckSLAComplianceRequest) returns (SLAComplianceResponse);
  rpc GetSLAMetrics(GetSLAMetricsRequest) returns (SupportSLAMetrics);
  rpc GetSLAViolations(GetSLAViolationsRequest) returns (GetSLAViolationsResponse);
  rpc GenerateSLAReport(GenerateSLAReportRequest) returns (SupportSLAReport);
  
  // Support Template Management
  rpc CreateTicketTemplate(CreateTicketTemplateRequest) returns (SupportTicketTemplate);
  rpc GetTicketTemplate(GetTicketTemplateRequest) returns (SupportTicketTemplate);
  rpc UpdateTicketTemplate(UpdateTicketTemplateRequest) returns (SupportTicketTemplate);
  rpc DeleteTicketTemplate(DeleteTicketTemplateRequest) returns (google.protobuf.Empty);
  rpc ListTicketTemplates(ListTicketTemplatesRequest) returns (ListTicketTemplatesResponse);
  
  rpc CreateReplyTemplate(CreateReplyTemplateRequest) returns (SupportReplyTemplate);
  rpc GetReplyTemplate(GetReplyTemplateRequest) returns (SupportReplyTemplate);
  rpc UpdateReplyTemplate(UpdateReplyTemplateRequest) returns (SupportReplyTemplate);
  rpc DeleteReplyTemplate(DeleteReplyTemplateRequest) returns (google.protobuf.Empty);
  rpc ListReplyTemplates(ListReplyTemplatesRequest) returns (ListReplyTemplatesResponse);
  
  // Analytics and Reporting
  rpc GetSupportAnalytics(GetSupportAnalyticsRequest) returns (SupportAnalyticsResponse);
  rpc GetSupportReport(GetSupportReportRequest) returns (SupportReportResponse);
  rpc GetSupportDashboard(GetSupportDashboardRequest) returns (SupportDashboardResponse);
  rpc GetSupportKPIs(GetSupportKPIsRequest) returns (SupportKPIsResponse);
}

