syntax = "proto3";

package healthcare.billing.services;

import "google/protobuf/empty.proto";
import "../messages/payment_models.proto";

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/billing/services";

// Payment service for processing payments
service PaymentService {
  // Process a payment
  rpc ProcessPayment(ProcessPaymentRequest) returns (PaymentResponse);
  
  // Get payment by ID
  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse);
  
  // List payments with filtering
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  
  // Get payments by invoice
  rpc GetPaymentsByInvoice(GetPaymentsByInvoiceRequest) returns (ListPaymentsResponse);
  
  // Get payments by patient
  rpc GetPaymentsByPatient(GetPaymentsByPatientRequest) returns (ListPaymentsResponse);
  
  // Process refund
  rpc ProcessRefund(RefundRequest) returns (RefundResponse);
  
  // Get payment summary for patient
  rpc GetPaymentSummary(GetPaymentSummaryRequest) returns (PaymentSummary);
  
  // Verify payment
  rpc VerifyPayment(VerifyPaymentRequest) returns (VerifyPaymentResponse);
  
  // Cancel payment
  rpc CancelPayment(CancelPaymentRequest) returns (google.protobuf.Empty);
}

// Get payment request
message GetPaymentRequest {
  string payment_id = 1;
}

// Get payments by invoice request
message GetPaymentsByInvoiceRequest {
  string invoice_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get payments by patient request
message GetPaymentsByPatientRequest {
  string patient_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// Get payment summary request
message GetPaymentSummaryRequest {
  string patient_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
}

// Verify payment request
message VerifyPaymentRequest {
  string payment_id = 1;
  string transaction_reference = 2;
}

// Verify payment response
message VerifyPaymentResponse {
  bool success = 1;
  string message = 2;
  bool verified = 3;
  string verification_status = 4;
  string error_message = 5;
}

// Cancel payment request
message CancelPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  string cancelled_by = 3;
}
