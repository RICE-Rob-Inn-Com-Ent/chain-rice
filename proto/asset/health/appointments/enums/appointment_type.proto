// Appointment type enumeration
enum AppointmentType {
  APPOINTMENT_TYPE_UNSPECIFIED = 0;
  APPOINTMENT_TYPE_CONSULTATION = 1;
  APPOINTMENT_TYPE_SURGERY = 2;
