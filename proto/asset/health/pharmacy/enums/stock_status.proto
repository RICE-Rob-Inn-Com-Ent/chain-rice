syntax = "proto3";

package healthcare.pharmacy.enums;

option go_package = "github.com/rice-dev/stacks/tools/AUTO/modules/healthcare/pharmacy/enums";

// Stock status enumeration
enum StockStatus {
  STOCK_STATUS_UNSPECIFIED = 0;
  STOCK_STATUS_IN_STOCK = 1;
  STOCK_STATUS_LOW_STOCK = 2;
  STOCK_STATUS_OUT_OF_STOCK = 3;
  STOCK_STATUS_ON_ORDER = 4;
  STOCK_STATUS_DISCONTINUED = 5;
  STOCK_STATUS_RECALLED = 6;
  STOCK_STATUS_EXPIRED = 7;
  STOCK_STATUS_DAMAGED = 8;
  STOCK_STATUS_QUARANTINED = 9;
  STOCK_STATUS_PENDING_RECEIPT = 10;
}

// Inventory alert level
enum InventoryAlertLevel {
  INVENTORY_ALERT_LEVEL_UNSPECIFIED = 0;
  INVENTORY_ALERT_LEVEL_INFO = 1;
  INVENTORY_ALERT_LEVEL_WARNING = 2;
  INVENTORY_ALERT_LEVEL_CRITICAL = 3;
  INVENTORY_ALERT_LEVEL_EMERGENCY = 4;
}

// Stock movement type
enum StockMovementType {
  STOCK_MOVEMENT_TYPE_UNSPECIFIED = 0;
  STOCK_MOVEMENT_TYPE_RECEIVED = 1;
  STOCK_MOVEMENT_TYPE_DISPENSED = 2;
  STOCK_MOVEMENT_TYPE_RETURNED = 3;
  STOCK_MOVEMENT_TYPE_ADJUSTED = 4;
  STOCK_MOVEMENT_TYPE_EXPIRED = 5;
  STOCK_MOVEMENT_TYPE_DAMAGED = 6;
  STOCK_MOVEMENT_TYPE_TRANSFERRED = 7;
  STOCK_MOVEMENT_TYPE_DESTROYED = 8;
  STOCK_MOVEMENT_TYPE_STOLEN = 9;
}
