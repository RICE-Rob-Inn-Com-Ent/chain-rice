option go_package = "github.com/rice-dev/gaming/game_core/messages";

// Базовий клас події гри
message GameEvent {
  // Унікальний ідентифікатор події
  string event_id = 1;
  
  // Тип події
  GameEventType type = 2;
  
  // Ідентифікатор гравця
  string player_id = 3;
  
  // Ідентифікатор сесії
  string session_id = 4;
  
  // Час події
  google.protobuf.Timestamp timestamp = 5;
  
  // Додаткові дані події
  map<string, string> event_data = 6;
  
  // Версія події
  string version = 7;
}

