syntax = "proto3";

package gaming.metaverse.services;

import "gaming/metaverse/messages/world_models.proto";

option go_package = "github.com/rice-dev/gaming/metaverse/services";

// Сервіс управління світами
service WorldService {
  // Створити світ
  rpc CreateWorld(CreateWorldRequest) returns (CreateWorldResponse);
  
  // Отримати світ
  rpc GetWorld(GetWorldRequest) returns (GetWorldResponse);
  
  // Оновити світ
  rpc UpdateWorld(UpdateWorldRequest) returns (UpdateWorldResponse);
  
  // Видалити світ
  rpc DeleteWorld(DeleteWorldRequest) returns (DeleteWorldResponse);
  
  // Отримати список світів
  rpc ListWorlds(ListWorldsRequest) returns (ListWorldsResponse);
  
  // Отримати статистику світу
  rpc GetWorldStats(GetWorldStatsRequest) returns (GetWorldStatsResponse);
  
  // Очистити світ
  rpc ClearWorld(ClearWorldRequest) returns (ClearWorldResponse);
  
  // Скинути світ
  rpc ResetWorld(ResetWorldRequest) returns (ResetWorldResponse);
  
  // Зберегти світ
  rpc SaveWorld(SaveWorldRequest) returns (SaveWorldResponse);
  
  // Завантажити світ
  rpc LoadWorld(LoadWorldRequest) returns (LoadWorldResponse);
}

// Запит створення світу
message CreateWorldRequest {
  string name = 1;
  string description = 2;
  gaming.metaverse.enums.WorldType type = 3;
  string creator_id = 4;
  string game_mode = 5;
  string map = 6;
  string server = 7;
  string region = 8;
  int32 max_players = 9;
  int32 max_objects = 10;
  int32 max_buildings = 11;
  int32 max_vehicles = 12;
  int32 max_characters = 13;
  int32 max_items = 14;
  int32 max_resources = 15;
  int32 max_energy = 16;
  int32 max_health = 17;
  int32 max_mana = 18;
  int32 max_stamina = 19;
  int32 max_experience = 20;
  int32 max_level = 21;
  int32 max_skill_points = 22;
  int32 max_ability_points = 23;
  int32 max_talent_points = 24;
  int32 max_perk_points = 25;
  int32 max_trait_points = 26;
  int32 max_stat_points = 27;
  int32 max_attribute_points = 28;
  int32 max_characteristic_points = 29;
  int32 max_property_points = 30;
  int32 max_feature_points = 31;
  int32 max_aspect_points = 32;
  int32 max_element_points = 33;
  int32 max_component_points = 34;
  int32 max_module_points = 35;
  int32 max_system_points = 36;
  int32 max_process_points = 37;
  int32 max_procedure_points = 38;
  int32 max_protocol_points = 39;
  int32 max_standard_points = 40;
  int32 max_rule_points = 41;
  int32 max_regulation_points = 42;
  int32 max_law_points = 43;
  int32 max_act_points = 44;
  int32 max_statute_points = 45;
  int32 max_ordinance_points = 46;
  int32 max_decree_points = 47;
  int32 max_edict_points = 48;
  int32 max_mandate_points = 49;
  int32 max_order_points = 50;
  int32 max_command_points = 51;
  int32 max_instruction_points = 52;
  int32 max_direction_points = 53;
  int64 expires_at = 54;
  map<string, string> metadata = 55;
}

// Відповідь створення світу
message CreateWorldResponse {
  bool success = 1;
  string world_id = 2;
  string message = 3;
  gaming.metaverse.messages.World world = 4;
}

// Запит отримання світу
message GetWorldRequest {
  string world_id = 1;
}

// Відповідь отримання світу
message GetWorldResponse {
  bool success = 1;
  string message = 2;
