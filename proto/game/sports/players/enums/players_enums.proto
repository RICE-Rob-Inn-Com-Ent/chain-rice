syntax = "proto3";

package sports.players.v1;

option go_package = "github.com/rice-dev/sports/players/v1";

// PlayerPosition represents the position a player plays in their sport
enum PlayerPosition {
  PLAYER_POSITION_UNSPECIFIED = 0;
  // Football/Soccer positions
  PLAYER_POSITION_GOALKEEPER = 1;    // Goalkeeper
  PLAYER_POSITION_DEFENDER = 2;      // Defender
  PLAYER_POSITION_MIDFIELDER = 3;    // Midfielder
  PLAYER_POSITION_FORWARD = 4;       // Forward
  PLAYER_POSITION_WINGER = 5;        // Winger
  PLAYER_POSITION_STRIKER = 6;       // Striker
  PLAYER_POSITION_CENTER_BACK = 7;   // Center back
  PLAYER_POSITION_FULL_BACK = 8;     // Full back
  PLAYER_POSITION_DEFENSIVE_MIDFIELDER = 9; // Defensive midfielder
  PLAYER_POSITION_ATTACKING_MIDFIELDER = 10; // Attacking midfielder
  
  // Basketball positions
  PLAYER_POSITION_POINT_GUARD = 11;  // Point guard
  PLAYER_POSITION_SHOOTING_GUARD = 12; // Shooting guard
  PLAYER_POSITION_SMALL_FORWARD = 13; // Small forward
  PLAYER_POSITION_POWER_FORWARD = 14; // Power forward
  PLAYER_POSITION_CENTER = 15;       // Center
  
  // Baseball positions
  PLAYER_POSITION_PITCHER = 16;      // Pitcher
  PLAYER_POSITION_CATCHER = 17;      // Catcher
  PLAYER_POSITION_FIRST_BASE = 18;   // First base
  PLAYER_POSITION_SECOND_BASE = 19;  // Second base
  PLAYER_POSITION_THIRD_BASE = 20;   // Third base
  PLAYER_POSITION_SHORTSTOP = 21;    // Shortstop
  PLAYER_POSITION_LEFT_FIELD = 22;   // Left field
  PLAYER_POSITION_CENTER_FIELD = 23; // Center field
  PLAYER_POSITION_RIGHT_FIELD = 24;  // Right field
  
  // American Football positions
  PLAYER_POSITION_QUARTERBACK = 25;  // Quarterback
  PLAYER_POSITION_RUNNING_BACK = 26; // Running back
  PLAYER_POSITION_WIDE_RECEIVER = 27; // Wide receiver
  PLAYER_POSITION_TIGHT_END = 28;    // Tight end
  PLAYER_POSITION_OFFENSIVE_LINEMAN = 29; // Offensive lineman
  PLAYER_POSITION_DEFENSIVE_LINEMAN = 30; // Defensive lineman
  PLAYER_POSITION_LINEBACKER = 31;   // Linebacker
  PLAYER_POSITION_CORNERBACK = 32;   // Cornerback
  PLAYER_POSITION_SAFETY = 33;       // Safety
  PLAYER_POSITION_KICKER = 34;       // Kicker
  PLAYER_POSITION_PUNTER = 35;       // Punter
  
  // Hockey positions
  PLAYER_POSITION_GOALIE = 36;       // Goalie
  PLAYER_POSITION_DEFENSEMAN = 37;   // Defenseman
  PLAYER_POSITION_LEFT_WING = 38;    // Left wing
  PLAYER_POSITION_RIGHT_WING = 39;   // Right wing
  
  // Tennis positions
  PLAYER_POSITION_SINGLES = 40;      // Singles player
  PLAYER_POSITION_DOUBLES = 41;      // Doubles player
  PLAYER_POSITION_MIXED_DOUBLES = 42; // Mixed doubles player
  
  // Other positions
  PLAYER_POSITION_UTILITY = 43;      // Utility player (can play multiple positions)
  PLAYER_POSITION_SUBSTITUTE = 44;   // Substitute player
}

// PlayerStatus represents the current status of a player
enum PlayerStatus {
  PLAYER_STATUS_UNSPECIFIED = 0;
  PLAYER_STATUS_ACTIVE = 1;          // Player is active and available
  PLAYER_STATUS_INJURED = 2;         // Player is injured
  PLAYER_STATUS_SUSPENDED = 3;       // Player is suspended
  PLAYER_STATUS_RETIRED = 4;         // Player has retired
  PLAYER_STATUS_TRANSFERRED = 5;     // Player has been transferred
  PLAYER_STATUS_FREE_AGENT = 6;      // Player is a free agent
  PLAYER_STATUS_LOANED = 7;          // Player is on loan to another team
  PLAYER_STATUS_DRAFTED = 8;         // Player has been drafted
  PLAYER_STATUS_WAIVED = 9;          // Player has been waived
  PLAYER_STATUS_INACTIVE = 10;       // Player is inactive
}

// PlayerHandedness represents the dominant hand/foot of a player
enum PlayerHandedness {
  PLAYER_HANDEDNESS_UNSPECIFIED = 0;
  PLAYER_HANDEDNESS_RIGHT = 1;       // Right-handed/footed
  PLAYER_HANDEDNESS_LEFT = 2;        // Left-handed/footed
  PLAYER_HANDEDNESS_AMBIDEXTROUS = 3; // Ambidextrous
}

// PlayerNationality represents nationality/eligibility
enum PlayerNationality {
  PLAYER_NATIONALITY_UNSPECIFIED = 0;
  PLAYER_NATIONALITY_DOMESTIC = 1;   // Domestic player
  PLAYER_NATIONALITY_INTERNATIONAL = 2; // International player
  PLAYER_NATIONALITY_DUAL_CITIZEN = 3; // Dual citizenship
}

// ContractType represents the type of contract a player has
enum ContractType {
  CONTRACT_TYPE_UNSPECIFIED = 0;
  CONTRACT_TYPE_PROFESSIONAL = 1;    // Professional contract
  CONTRACT_TYPE_AMATEUR = 2;         // Amateur contract
  CONTRACT_TYPE_YOUTH = 3;           // Youth contract
  CONTRACT_TYPE_ACADEMY = 4;         // Academy contract
  CONTRACT_TYPE_LOAN = 5;            // Loan contract
  CONTRACT_TYPE_SHORT_TERM = 6;      // Short-term contract
  CONTRACT_TYPE_DEVELOPMENT = 7;     // Development contract
}

// InjuryType represents common types of sports injuries
enum InjuryType {
  INJURY_TYPE_UNSPECIFIED = 0;
  INJURY_TYPE_MUSCLE_STRAIN = 1;     // Muscle strain
  INJURY_TYPE_LIGAMENT_TEAR = 2;     // Ligament tear (ACL, MCL, etc.)
  INJURY_TYPE_FRACTURE = 3;          // Bone fracture
  INJURY_TYPE_DISLOCATION = 4;       // Joint dislocation
  INJURY_TYPE_CONCUSSION = 5;        // Concussion
  INJURY_TYPE_SPRAIN = 6;            // Joint sprain
  INJURY_TYPE_TENDONITIS = 7;        // Tendonitis
  INJURY_TYPE_BURSITIS = 8;          // Bursitis
  INJURY_TYPE_SHIN_SPLINTS = 9;      // Shin splints
  INJURY_TYPE_OTHER = 99;            // Other injury types
}

// InjurySeverity represents the severity of an injury
enum InjurySeverity {
  INJURY_SEVERITY_UNSPECIFIED = 0;
  INJURY_SEVERITY_MINOR = 1;         // Minor injury (1-2 weeks)
  INJURY_SEVERITY_MODERATE = 2;      // Moderate injury (2-8 weeks)
  INJURY_SEVERITY_MAJOR = 3;         // Major injury (8+ weeks)
  INJURY_SEVERITY_SEASON_ENDING = 4; // Season-ending injury
  INJURY_SEVERITY_CAREER_THREATENING = 5; // Career-threatening injury
}
