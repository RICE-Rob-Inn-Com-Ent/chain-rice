option go_package = "github.com/rice-dev/gaming/game_economy/services";

// Сервіс інтеграції з маркетплейсом
service MarketplaceIntegrationService {
  // Створити лістинг
  rpc CreateListing(CreateListingRequest) returns (CreateListingResponse);
  
  // Отримати лістинг
  rpc GetListing(GetListingRequest) returns (GetListingResponse);
  
  // Оновити лістинг
  rpc UpdateListing(UpdateListingRequest) returns (UpdateListingResponse);
  
  // Видалити лістинг
  rpc DeleteListing(DeleteListingRequest) returns (google.protobuf.Empty);
  
  // Отримати список лістингів
  rpc ListListings(ListListingsRequest) returns (ListListingsResponse);
  
  // Створити замовлення
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  
  // Отримати замовлення
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  
  // Оновити замовлення
  rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);
  
  // Видалити замовлення
  rpc DeleteOrder(DeleteOrderRequest) returns (google.protobuf.Empty);
  
  // Отримати список замовлень
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  
  // Підтвердити замовлення
  rpc ConfirmOrder(ConfirmOrderRequest) returns (ConfirmOrderResponse);
  
  // Скасувати замовлення
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  
  // Завершити замовлення
  rpc CompleteOrder(CompleteOrderRequest) returns (CompleteOrderResponse);
  
  // Отримати статистику маркетплейсу
  rpc GetMarketplaceStats(GetMarketplaceStatsRequest) returns (GetMarketplaceStatsResponse);
  
  // Отримати рекомендації маркетплейсу
  rpc GetMarketplaceRecommendations(GetMarketplaceRecommendationsRequest) returns (GetMarketplaceRecommendationsResponse);
  
  // Пошук на маркетплейсі
  rpc SearchMarketplace(SearchMarketplaceRequest) returns (SearchMarketplaceResponse);
  
  // Отримати історію маркетплейсу
  rpc GetMarketplaceHistory(GetMarketplaceHistoryRequest) returns (GetMarketplaceHistoryResponse);
}

