syntax = "proto3";

package gaming.leaderboards.messages;

import "gaming/leaderboards/enums/leaderboard_types.proto";
import "gaming/leaderboards/enums/ranking_types.proto";
import "gaming/leaderboards/enums/score_types.proto";

option go_package = "github.com/rice-dev/gaming/leaderboards/messages";

// Модель лідерборду
message Leaderboard {
  string id = 1;
  string name = 2;
  string description = 3;
  gaming.leaderboards.enums.LeaderboardType type = 4;
  gaming.leaderboards.enums.RankingType ranking_type = 5;
  gaming.leaderboards.enums.ScoreType score_type = 6;
  int64 max_entries = 7;
  int64 min_score = 8;
  int64 max_score = 9;
  bool is_active = 10;
  bool is_public = 11;
  string game_id = 12;
  string category_id = 13;
  string season_id = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
  int64 expires_at = 17;
  map<string, string> metadata = 18;
}

// Модель запису лідерборду
message LeaderboardEntry {
  string id = 1;
  string leaderboard_id = 2;
  string player_id = 3;
  string player_name = 4;
  int64 score = 5;
  int32 rank = 6;
  int64 timestamp = 7;
  map<string, string> metadata = 8;
}

// Модель статистики лідерборду
message LeaderboardStats {
  string leaderboard_id = 1;
  int64 total_entries = 2;
  int64 total_players = 3;
  int64 average_score = 4;
  int64 median_score = 5;
  int64 min_score = 6;
  int64 max_score = 7;
  int64 standard_deviation = 8;
  int64 variance = 9;
  int64 percentile_25 = 10;
  int64 percentile_75 = 11;
  int64 percentile_90 = 12;
  int64 percentile_95 = 13;
  int64 percentile_99 = 14;
  int64 updated_at = 15;
}

// Модель сезону лідерборду
message LeaderboardSeason {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 start_date = 4;
  int64 end_date = 5;
  bool is_active = 6;
  string game_id = 7;
  map<string, string> rewards = 8;
  map<string, string> metadata = 9;
}

// Модель категорії лідерборду
message LeaderboardCategory {
  string id = 1;
  string name = 2;
  string description = 3;
  string parent_id = 4;
  int32 sort_order = 5;
  bool is_active = 6;
  string game_id = 7;
  map<string, string> metadata = 8;
}

// Модель налаштувань лідерборду
message LeaderboardSettings {
  string leaderboard_id = 1;
  bool auto_reset = 2;
  int64 reset_interval = 3;
  bool allow_duplicates = 4;
  bool require_verification = 5;
  int64 verification_timeout = 6;
  bool enable_notifications = 7;
  bool enable_rewards = 8;
  map<string, string> notification_settings = 9;
  map<string, string> reward_settings = 10;
}

// Модель фільтрів лідерборду
message LeaderboardFilters {
  string game_id = 1;
  string category_id = 2;
  string season_id = 3;
  gaming.leaderboards.enums.LeaderboardType type = 4;
  gaming.leaderboards.enums.RankingType ranking_type = 5;
  gaming.leaderboards.enums.ScoreType score_type = 6;
  bool is_active = 7;
  bool is_public = 8;
  int64 min_score = 9;
  int64 max_score = 10;
  int64 min_entries = 11;
  int64 max_entries = 12;
  int64 created_after = 13;
  int64 created_before = 14;
  int64 updated_after = 15;
  int64 updated_before = 16;
  int64 expires_after = 17;
  int64 expires_before = 18;
  map<string, string> metadata_filters = 19;
}

// Модель сортування лідерборду
message LeaderboardSorting {
  string field = 1;
  bool ascending = 2;
  int32 priority = 3;
}

// Модель пагінації лідерборду
message LeaderboardPagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total_pages = 3;
  int64 total_entries = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

// Модель пошуку лідерборду
message LeaderboardSearch {
  string query = 1;
  repeated string fields = 2;
  bool case_sensitive = 3;
  bool exact_match = 4;
  bool fuzzy_match = 5;
  int32 max_results = 6;
  int32 min_score = 7;
  int32 max_score = 8;
  map<string, string> filters = 9;
}
