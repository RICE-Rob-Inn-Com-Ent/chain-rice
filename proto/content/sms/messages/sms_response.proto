syntax = "proto3";

package marketing.sms.messages;

import "google/protobuf/timestamp.proto";
import "marketing/sms/enums/sms_status.proto";

// SMS data transfer object
message Sms {
  // SMS ID
  string id = 1;
  
  // SMS message content
  string message = 2;
  
  // Recipient phone numbers
  repeated string recipients = 3;
  
  // Sender phone number
  string sender_number = 4;
  
  // SMS template ID (if using template)
  string template_id = 5;
  
  // Campaign ID (if applicable)
  string campaign_id = 6;
  
  // SMS status
  marketing.sms.enums.SmsStatus status = 7;
  
  // Scheduled send time
  google.protobuf.Timestamp scheduled_time = 8;
  
  // Actual send time
  google.protobuf.Timestamp sent_time = 9;
  
  // SMS priority
  int32 priority = 10;
  
  // SMS tags
  repeated string tags = 11;
  
  // Include opt-out link
  bool include_opt_out = 12;
  
  // Creation timestamp
  google.protobuf.Timestamp created_at = 13;
  
  // Last update timestamp
  google.protobuf.Timestamp updated_at = 14;
  
  // SMS metrics
  SmsMetrics metrics = 15;
}

// SMS performance metrics
message SmsMetrics {
  // Number of recipients
  int32 recipient_count = 1;
  
  // Number of SMS delivered
  int32 delivered_count = 2;
  
  // Number of SMS read
  int32 read_count = 3;
  
  // Number of clicks
  int32 clicked_count = 4;
  
  // Number of opt-outs
  int32 opt_out_count = 5;
  
  // Number of blocked
  int32 blocked_count = 6;
  
  // Delivery rate
  double delivery_rate = 7;
  
  // Read rate
  double read_rate = 8;
  
  // Click rate
  double click_rate = 9;
  
  // Opt-out rate
  double opt_out_rate = 10;
  
  // Cost per SMS
  double cost_per_sms = 11;
  
  // Total cost
  double total_cost = 12;
}

// Response message for creating an SMS
message CreateSmsResponse {
  // Created SMS
  Sms sms = 1;
  
  // Success message
  string message = 2;
}

// Response message for getting an SMS
message GetSmsResponse {
  // SMS data
  Sms sms = 1;
}

// Response message for listing SMS messages
message ListSmsResponse {
  // List of SMS messages
  repeated Sms sms_messages = 1;
  
  // Total count of SMS messages
  int32 total_count = 2;
  
  // Current page number
  int32 page = 3;
  
  // Number of items per page
  int32 page_size = 4;
}

// Response message for updating an SMS
message UpdateSmsResponse {
  // Updated SMS
  Sms sms = 1;
  
  // Success message
  string message = 2;
}

// Response message for deleting an SMS
message DeleteSmsResponse {
  // Success message
  string message = 1;
}
