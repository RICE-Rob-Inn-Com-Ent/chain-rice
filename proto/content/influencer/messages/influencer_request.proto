syntax = "proto3";

package marketing.influencer.messages;

import "google/protobuf/timestamp.proto";
import "marketing/influencer/enums/influencer_type.proto";

// Request message for creating a new influencer
message CreateInfluencerRequest {
  // Influencer name
  string name = 1;
  
  // Influencer email
  string email = 2;
  
  // Influencer phone
  string phone = 3;
  
  // Influencer type
  marketing.influencer.enums.InfluencerType type = 4;
  
  // Social media handles
  repeated string social_handles = 5;
  
  // Follower count
  int64 follower_count = 6;
  
  // Engagement rate
  double engagement_rate = 7;
  
  // Influencer bio
  string bio = 8;
  
  // Influencer location
  string location = 9;
  
  // Influencer niche/category
  string niche = 10;
  
  // Influencer tags
  repeated string tags = 11;
  
  // Influencer rate per post
  double rate_per_post = 12;
}

// Request message for getting an influencer by ID
message GetInfluencerRequest {
  // Influencer ID
  string id = 1;
}

// Request message for listing influencers
message ListInfluencerRequest {
  // Page number for pagination
  int32 page = 1;
  
  // Number of items per page
  int32 page_size = 2;
  
  // Filter by influencer type
  marketing.influencer.enums.InfluencerType type = 3;
  
  // Filter by niche
  string niche = 4;
  
  // Filter by location
  string location = 5;
  
  // Filter by tags
  repeated string tags = 6;
  
  // Filter by minimum follower count
  int64 min_followers = 7;
  
  // Filter by maximum follower count
  int64 max_followers = 8;
}

// Request message for updating an influencer
message UpdateInfluencerRequest {
  // Influencer ID
  string id = 1;
  
  // Influencer name
  string name = 2;
  
  // Influencer email
  string email = 3;
  
  // Influencer phone
  string phone = 4;
  
  // Influencer type
  marketing.influencer.enums.InfluencerType type = 5;
  
  // Social media handles
  repeated string social_handles = 6;
  
  // Follower count
  int64 follower_count = 7;
  
  // Engagement rate
  double engagement_rate = 8;
  
  // Influencer bio
  string bio = 9;
  
  // Influencer location
  string location = 10;
  
  // Influencer niche/category
  string niche = 11;
  
  // Influencer tags
  repeated string tags = 12;
  
  // Influencer rate per post
  double rate_per_post = 13;
}

// Request message for deleting an influencer
message DeleteInfluencerRequest {
  // Influencer ID
  string id = 1;
}
